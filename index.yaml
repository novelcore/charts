  gitops-promoter:
  - annotations:
      artifacthub.io/category: integration-delivery
      artifacthub.io/changes: |
        - kind: fixed
          description: Enhanced CRD lifecycle management with graceful handling of existing CRDs
        - kind: added
          description: Added helm.sh/hook-delete-policy before-hook-creation for conflict-free reinstalls
        - kind: added
          description: Configurable CRD retention policy (keep/delete) based on environment
        - kind: changed
          description: Improved CRD template processing with dynamic resource policies
        - kind: added
          description: Environment-aware CRD management (production vs development)
        - kind: added
          description: Integrated Custom Resource Definitions (CRDs) installation
        - kind: added
          description: CRDs are now installed as pre-install/pre-upgrade hooks
        - kind: added
          description: Initial Helm chart for GitOps Promoter v0.10.2
      artifacthub.io/images: |
        - name: gitops-promoter
          image: quay.io/argoprojlabs/gitops-promoter:v0.10.2
        - name: kube-rbac-proxy
          image: quay.io/brancz/kube-rbac-proxy:v0.17.0
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: GitOps Promoter Documentation
          url: https://github.com/argoproj-labs/gitops-promoter/blob/main/README.md
        - name: Release Notes
          url: https://github.com/argoproj-labs/gitops-promoter/releases/tag/v0.10.2
