  kubecore-e2e-canary:
  - apiVersion: v2
    appVersion: 0.1.0
    created: "2026-11-13T09:59:46.73019718Z"
    description: E2E-only fault-injection canary for KubeCore pools. One tiny Deployment
      whose readiness probe fails until a rendered instant (readyAfter), so a Helm
      upgrade with `wait` can be made to time out on purpose and the platform's rollbackLimit
      self-heal observed. Installed only by the kubecore-operator behind --enable-e2e-faults
      on a labelled e2e pool; never on a tenant pool.
