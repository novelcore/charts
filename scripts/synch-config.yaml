# External Helm Chart Sync Configuration
# This file defines which external charts to sync to our repository

repositories:
- name: bitnami
  url: https://charts.bitnami.com/bitnami
- name: ingress-nginx
  url: https://kubernetes.github.io/ingress-nginx
- name: jetstack
  url: https://charts.jetstack.io
- name: prometheus-community
  url: https://prometheus-community.github.io/helm-charts
- name: grafana
  url: https://grafana.github.io/helm-charts
- name: crossplane-stable
  url: https://charts.crossplane.io/stable
- name: argo
  url: https://argoproj.github.io/argo-helm
- name: ariga
  url: oci://ghcr.io/ariga/charts
- name: elastic
  url: https://helm.elastic.co
- name: percona
  url: https://percona.github.io/percona-helm-charts
- name: kedacore
  url: https://kedacore.github.io/charts
- name: zilliztech
  url: https://zilliztech.github.io/milvus-operator/
- name: community-charts
  url: https://community-charts.github.io/helm-charts
- name: strimzi
  url: https://strimzi.io/charts/
- name: victoria-metrics
  url: https://victoriametrics.github.io/helm-charts

# Charts to sync from external repositories
# Leave version empty to always get the latest version
charts:
# Crossplane
- name: crossplane
  repository: crossplane-stable
  version: "1.20.0" # Specific version as requested

# Bitnami charts
# - name: postgresql
#   repository: bitnami
#   version: "" # Latest

# - name: redis
#   repository: bitnami
#   version: ""

- name: nginx
  repository: bitnami
  version: ""

# # Ingress controller
# - name: ingress-nginx
#   repository: ingress-nginx
#   version: ""

# Cert-manager for TLS
- name: cert-manager
  repository: jetstack
  version: "v1.17.1"

# Argo Events
- name: argo-events
  repository: argo
  version: "2.4.15"

# Argo Rollouts
- name: argo-rollouts
  repository: argo
  version: "2.40.3"

# Atlas Operator
- name: atlas-operator
  repository: ariga
  version: "0.7.7"

# ECK Operator
- name: eck-operator
  repository: elastic
  version: "3.0.0"

# Everest
- name: everest
  repository: percona
  version: "1.6.0"

# Grafana Operator
- name: grafana-operator
  repository: grafana
  version: "5.17.1"

# KEDA
- name: keda
  repository: kedacore
  version: "2.17.0"

# Milvus Operator
- name: milvus-operator
  repository: zilliztech
  version: "1.2.5"

# MinIO Operator
- name: minio-operator
  repository: bitnami
  version: "0.1.5"

# MLflow
- name: mlflow
  repository: community-charts
  version: "1.1.0"

# VictoriaMetrics Agent
- name: victoria-metrics-agent
  repository: victoria-metrics
  version: "0.18.2"

# VictoriaMetrics Cluster
- name: victoria-metrics-cluster
  repository: victoria-metrics
  version: "0.20.1"

# Prometheus Node Exporter
- name: prometheus-node-exporter
  repository: prometheus-community
  version: "4.45.2"

# PostgreSQL Operator
- name: pg-operator
  repository: percona
  version: "2.6.0"

# Strimzi Kafka Operator
- name: strimzi-kafka-operator
  repository: strimzi
  version: "0.46.0"

# # Monitoring stack
# - name: kube-prometheus-stack
#   repository: prometheus-community
#   version: ""

# - name: grafana
#   repository: grafana
#   version: ""

# Sync schedule and options
sync:
  # Preserve local modifications
  preserveLocal: true
  # Create PR instead of direct commit
  createPR: true
  # Auto-merge PR if all checks pass
  autoMerge: false
