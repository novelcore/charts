{{- $Values := (.helm).Values | default .Values }}
{{- $runbookUrl := ($Values.defaultRules).runbookUrl | default "https://runbooks.prometheus-operator.dev/runbooks" }}
{{- $clusterLabel := ($Values.defaultRules).clusterLabel | default ($Values.global).clusterLabel | default "cluster" }}
{{- $additionalGroupByLabels := append ($Values.defaultRules).additionalGroupByLabels $clusterLabel }}
{{- $groupLabels := join "," (uniq $additionalGroupByLabels) }}
{{- $clusterName := ($Values.defaultRules).clusterName | default "" }}
{{- $environment := ($Values.defaultRules).environment | default "" }}
{{- $namespace := ($Values.defaultRules).namespace | default "" }}
name: alertmanager.rules
rules:
- alert: AlertmanagerFailedReload
  expr: max_over_time(alertmanager_config_last_reload_successful{job="alertmanager-main",container="alertmanager",namespace="monitoring"}[5m]) == 0
  for: 10m
  labels:
    severity: critical
  annotations:
    description: Configuration has failed to load for {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.pod{{`}}`}}.
    runbook_url: '{{`{{`}} $runbookUrl {{`}}`}}/alertmanager/alertmanagerfailedreload'
    summary: Reloading an Alertmanager configuration has failed.
  condition: true
- alert: AlertmanagerMembersInconsistent
  expr: '{{`{{`}} printf "max_over_time(alertmanager_cluster_members{job=\"alertmanager-main\",container=\"alertmanager\",namespace=\"monitoring\"}[5m]) < on(namespace,service) group_left() count(max_over_time(alertmanager_cluster_members{job=\"alertmanager-main\",container=\"alertmanager\",namespace=\"monitoring\"}[5m])) by(namespace,service,%s)" $groupLabels {{`}}`}}'
  for: 15m
  labels:
    severity: critical
  annotations:
    description: Alertmanager {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.pod{{`}}`}} has only found {{`{{`}} $value {{`}}`}} members of the {{`{{`}}$labels.job{{`}}`}} cluster.
    runbook_url: '{{`{{`}} $runbookUrl {{`}}`}}/alertmanager/alertmanagermembersinconsistent'
    summary: A member of an Alertmanager cluster has not found all other cluster members.
  condition: true
- alert: AlertmanagerFailedToSendAlerts
  expr: (rate(alertmanager_notifications_failed_total{job="alertmanager-main",container="alertmanager",namespace="monitoring"}[15m]) / ignoring(reason) group_left() rate(alertmanager_notifications_total{job="alertmanager-main",container="alertmanager",namespace="monitoring"}[15m])) > 0.01
  for: 5m
  labels:
    severity: warning
  annotations:
    description: Alertmanager {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.pod{{`}}`}} failed to send {{`{{`}} $value | humanizePercentage {{`}}`}} of notifications to {{`{{`}} $labels.integration {{`}}`}}.
    runbook_url: '{{`{{`}} $runbookUrl {{`}}`}}/alertmanager/alertmanagerfailedtosendalerts'
    summary: An Alertmanager instance failed to send notifications.
  condition: true
- alert: AlertmanagerClusterFailedToSendAlerts
  expr: '{{`{{`}} printf "min(rate(alertmanager_notifications_failed_total{job=\"alertmanager-main\",container=\"alertmanager\",namespace=\"monitoring\",integration=~\".*\"}[15m]) / ignoring(reason) group_left() rate(alertmanager_notifications_total{job=\"alertmanager-main\",container=\"alertmanager\",namespace=\"monitoring\",integration=~\".*\"}[15m])) by(namespace,service,integration,%s) > 0.01" $groupLabels {{`}}`}}'
  for: 5m
  labels:
    severity: critical
  annotations:
    description: The minimum notification failure rate to {{`{{`}} $labels.integration {{`}}`}} sent from any instance in the {{`{{`}}$labels.job{{`}}`}} cluster is {{`{{`}} $value | humanizePercentage {{`}}`}}.
    runbook_url: '{{`{{`}} $runbookUrl {{`}}`}}/alertmanager/alertmanagerclusterfailedtosendalerts'
    summary: All Alertmanager instances in a cluster failed to send notifications to a critical integration.
  condition: true
- alert: AlertmanagerClusterFailedToSendAlerts
  expr: '{{`{{`}} printf "min(rate(alertmanager_notifications_failed_total{job=\"alertmanager-main\",container=\"alertmanager\",namespace=\"monitoring\",integration!~\".*\"}[15m]) / ignoring(reason) group_left() rate(alertmanager_notifications_total{job=\"alertmanager-main\",container=\"alertmanager\",namespace=\"monitoring\",integration!~\".*\"}[15m])) by(namespace,service,integration,%s) > 0.01" $groupLabels {{`}}`}}'
  for: 5m
  labels:
    severity: warning
  annotations:
    description: The minimum notification failure rate to {{`{{`}} $labels.integration {{`}}`}} sent from any instance in the {{`{{`}}$labels.job{{`}}`}} cluster is {{`{{`}} $value | humanizePercentage {{`}}`}}.
    runbook_url: '{{`{{`}} $runbookUrl {{`}}`}}/alertmanager/alertmanagerclusterfailedtosendalerts'
    summary: All Alertmanager instances in a cluster failed to send notifications to a non-critical integration.
  condition: true
- alert: AlertmanagerConfigInconsistent
  expr: '{{`{{`}} printf "count(count_values(\"config_hash\", alertmanager_config_hash{job=\"alertmanager-main\",container=\"alertmanager\",namespace=\"monitoring\"}) by(namespace,service,%s)) by(namespace,service,%s) != 1" $groupLabels $groupLabels {{`}}`}}'
  for: 20m
  labels:
    severity: critical
  annotations:
    description: Alertmanager instances within the {{`{{`}}$labels.job{{`}}`}} cluster have different configurations.
    runbook_url: '{{`{{`}} $runbookUrl {{`}}`}}/alertmanager/alertmanagerconfiginconsistent'
    summary: Alertmanager instances within the same cluster have different configurations.
  condition: true
- alert: AlertmanagerClusterDown
  expr: '{{`{{`}} printf "(count(avg_over_time(up{job=\"alertmanager-main\",container=\"alertmanager\",namespace=\"monitoring\"}[5m]) < 0.5) by(namespace,service,%s) / count(up{job=\"alertmanager-main\",container=\"alertmanager\",namespace=\"monitoring\"}) by(namespace,service,%s)) >= 0.5" $groupLabels $groupLabels {{`}}`}}'
  for: 5m
  labels:
    severity: critical
  annotations:
    description: '{{`{{`}} $value | humanizePercentage {{`}}`}} of Alertmanager instances within the {{`{{`}}$labels.job{{`}}`}} cluster have been up for less than half of the last 5m.'
    runbook_url: '{{`{{`}} $runbookUrl {{`}}`}}/alertmanager/alertmanagerclusterdown'
    summary: Half or more of the Alertmanager instances within the same cluster are down.
  condition: true
- alert: AlertmanagerClusterCrashlooping
  expr: '{{`{{`}} printf "(count(changes(process_start_time_seconds{job=\"alertmanager-main\",container=\"alertmanager\",namespace=\"monitoring\"}[10m]) > 4) by(namespace,service,%s) / count(up{job=\"alertmanager-main\",container=\"alertmanager\",namespace=\"monitoring\"}) by(namespace,service,%s)) >= 0.5" $groupLabels $groupLabels {{`}}`}}'
  for: 5m
  labels:
    severity: critical
  annotations:
    description: '{{`{{`}} $value | humanizePercentage {{`}}`}} of Alertmanager instances within the {{`{{`}}$labels.job{{`}}`}} cluster have restarted at least 5 times in the last 10m.'
    runbook_url: '{{`{{`}} $runbookUrl {{`}}`}}/alertmanager/alertmanagerclustercrashlooping'
    summary: Half or more of the Alertmanager instances within the same cluster are crashlooping.
  condition: true
condition: true
