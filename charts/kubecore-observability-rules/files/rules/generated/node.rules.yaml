{{- $Values := (.helm).Values | default .Values }}
{{- $runbookUrl := ($Values.defaultRules).runbookUrl | default "https://runbooks.prometheus-operator.dev/runbooks" }}
{{- $clusterLabel := ($Values.defaultRules).clusterLabel | default ($Values.global).clusterLabel | default "cluster" }}
{{- $additionalGroupByLabels := append ($Values.defaultRules).additionalGroupByLabels $clusterLabel }}
{{- $groupLabels := join "," (uniq $additionalGroupByLabels) }}
{{- $clusterName := ($Values.defaultRules).clusterName | default "" }}
{{- $environment := ($Values.defaultRules).environment | default "" }}
{{- $namespace := ($Values.defaultRules).namespace | default "" }}
name: node.rules
rules:
- expr: '{{`{{`}} printf "topk(1, max(label_replace(kube_pod_info{job=\"kube-state-metrics\",node!=\"\"}, \"pod\", \"$1\", \"pod\", \"(.*)\")) by(%s,node,namespace,pod)) by(%s,namespace,pod)" $groupLabels $groupLabels {{`}}`}}'
  condition: true
  record: 'node_namespace_pod:kube_pod_info:'
- expr: '{{`{{`}} printf "count(node_cpu_seconds_total{mode=\"idle\",job=\"node-exporter\"} * on(cluster,namespace,pod) group_left(node) topk(1, node_namespace_pod:kube_pod_info:) by(%s,namespace,pod)) by(%s,node)" $groupLabels $groupLabels {{`}}`}}'
  condition: true
  record: node:node_num_cpu:sum
- expr: '{{`{{`}} printf "sum(node_memory_MemAvailable_bytes{job=\"node-exporter\"} or (((node_memory_Buffers_bytes{job=\"node-exporter\"} + node_memory_Cached_bytes{job=\"node-exporter\"}) + node_memory_MemFree_bytes{job=\"node-exporter\"}) + node_memory_Slab_bytes{job=\"node-exporter\"})) by(%s)" $groupLabels {{`}}`}}'
  condition: true
  record: :node_memory_MemAvailable_bytes:sum
- expr: '{{`{{`}} printf "avg(sum(rate(node_cpu_seconds_total{mode!=\"idle\",mode!=\"iowait\",mode!=\"steal\",job=\"node-exporter\"}[5m])) without(mode)) by(%s,node)" $groupLabels {{`}}`}}'
  condition: true
  record: node:node_cpu_utilization:ratio_rate5m
- expr: '{{`{{`}} printf "avg(node:node_cpu_utilization:ratio_rate5m) by(%s)" $groupLabels {{`}}`}}'
  condition: true
  record: cluster:node_cpu:ratio_rate5m
condition: true
