# Default values for kubecore-observability-rules
# This chart generates VMRule and GrafanaDashboard CRDs from external sources

# Global configuration
global:
  clusterLabel: "cluster"  # Default cluster label name

# VMRule configuration
defaultRules:
  # Master switch to enable/disable all rules
  create: true
  
  # Cluster and environment configuration
  clusterLabel: "cluster"  # Overrides global.clusterLabel if set
  clusterName: ""  # Injected from composition
  environment: ""  # Injected from composition
  namespace: ""  # Optional namespace filter
  
  # Labels used for grouping results of queries
  additionalGroupByLabels: []
  
  # Common properties for VMRule groups
  group:
    spec:
      # Optional HTTP URL parameters added to each rule request
      params: {}
      interval: "1m"
  
  # Common properties for all VMRules
  rule:
    spec:
      # Additional labels for all VMRules
      labels: {}
      # Additional annotations for all VMRules
      annotations: {}
  
  # Common properties for VMRules alerts
  alerting:
    spec:
      # Additional labels for VMRule alerts
      labels: {}
      # Additional annotations for VMRule alerts
      annotations: {}
  
  # Common properties for VMRules recording rules
  recording:
    spec:
      # Additional labels for VMRule recording rules
      labels: {}
      # Additional annotations for VMRule recording rules
      annotations: {}
  
  # Per-rule properties (exact rule name matching)
  rules: {}
    # Example:
    # NodeDown:
    #   create: true
    #   spec:
    #     for: 15m
    #     labels:
    #       severity: critical
  
  # Per-group configuration
  groups:
    kubernetes-nodes:
      create: true
      # Common properties for all rules in this group
      rules: {}
      # spec:
      #   interval: 1m
      #   params:
      #     cluster: ["{{ .Values.defaultRules.clusterName }}"]
    kubernetes-pods:
      create: true
      rules: {}
    kubernetes-storage:
      create: true
      rules: {}
    kubernetes-certificates:
      create: true
      rules: {}
  
  # Runbook URL prefix for default rules
  runbookUrl: https://runbooks.prometheus-operator.dev/runbooks
  
  # Labels for default rules
  labels: {}
  # Annotations for default rules
  annotations: {}

# GrafanaDashboard configuration
defaultDashboards:
  # Master switch to enable/disable all dashboards
  enabled: true
  
  # Default timezone for dashboards
  defaultTimezone: "utc"
  
  # Default datasource type
  defaultDatasource: "prometheus"
  
  # Cluster label configuration
  clusterLabel: "cluster"  # Overrides global.clusterLabel if set
  clusterName: ""  # Injected from composition
  
  # Multi-cluster support
  multicluster: false
  
  # Grafana instance selector
  instanceSelector:
    matchLabels:
      app: grafana
  
  # Folder reference (optional)
  folderRef: ""
  
  # Labels for dashboard resources
  labels: {}
  # Annotations for dashboard resources
  annotations: {}
  
  # Per-dashboard configuration
  dashboards:
    kaos-k8pilot-usage:
      enabled: true
      folderRef: ""
    victoriametrics-single-node:
      enabled: true
      folderRef: ""
    victoriametrics-cluster:
      enabled: true
      folderRef: ""
    victoriametrics-vmagent:
      enabled: true
      folderRef: ""
    victoriametrics-vmalert:
      enabled: true
      folderRef: ""
    victoriametrics-operator:
      enabled: true
      folderRef: ""
    kubernetes-cluster:
      enabled: true
      folderRef: ""
    kubernetes-nodes:
      enabled: true
      folderRef: ""
    kubernetes-pods:
      enabled: true
      folderRef: ""
    node-exporter:
      enabled: true
      folderRef: ""

