# GitOps Promoter Helm Chart Values
# This file contains all configurable parameters for the GitOps Promoter deployment

# Name overrides
nameOverride: ""
fullnameOverride: ""

# Global settings
global:
  # Image pull secrets for private registries
  imagePullSecrets: []
  # Example:
  # - name: regcred

  # Namespace configuration
namespace:
  # Create namespace if it doesn't exist
  create: true
  # Namespace name (if not specified, defaults to release namespace)
  name: ""
  # Additional labels for the namespace
  labels: {}
  # Additional annotations for the namespace
  annotations: {}

# Controller manager configuration
controllerManager:
  # Image configuration
  image:
    repository: quay.io/argoprojlabs/gitops-promoter
    tag: "v0.14.0"
    pullPolicy: IfNotPresent

  # Replica count
  replicaCount: 1

  # Command line arguments
  args:
    healthProbeBindAddress: ":8081"
    metricsBindAddress: "127.0.0.1:8080"
    leaderElect: true

  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  # Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  # Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  # Security context for the container
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532

  # Environment variables
  env: []
  # Example:
  # - name: LOG_LEVEL
  #   value: "info"

  # Volume mounts
  # Default includes /tmp mount for git operations (required due to readOnlyRootFilesystem)
  volumeMounts:
  - name: tmp
    mountPath: /tmp
  # Additional volume mounts can be added:
  # - name: config
  #   mountPath: /etc/promoter
  #   readOnly: true

  # Kube RBAC Proxy configuration (sidecar container)
kubeRbacProxy:
  # Image configuration
  image:
    repository: quay.io/brancz/kube-rbac-proxy
    tag: "v0.17.0"
    pullPolicy: IfNotPresent

  # Command line arguments
  args:
    secureListenAddress: "0.0.0.0:8443"
    upstream: "http://127.0.0.1:8080/"
    logtostderr: true
    v: "0"

  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 5m
      memory: 64Mi

  # Security context for the container
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532

# Pod configuration
pod:
  # Security context for the pod
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 65532

  # Termination grace period
  terminationGracePeriodSeconds: 10

  # Pod annotations
  annotations: {}

  # Pod labels
  labels: {}

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity configuration
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: manager
          topologyKey: kubernetes.io/hostname
      - weight: 5
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: deployment
          topologyKey: kubernetes.io/hostname

  # Volumes
  # Default includes emptyDir for /tmp (required for git clone operations with readOnlyRootFilesystem)
  volumes:
  - name: tmp
    emptyDir: {}
  # Additional volumes can be added:
  # - name: config
  #   configMap:
  #     name: promoter-config

  # Service Account configuration
serviceAccount:
  # Create service account
  create: true
  # Service account name (if not specified, defaults to fullname)
  name: ""
  # Additional labels
  labels: {}
  # Additional annotations
  annotations: {}

# RBAC configuration
rbac:
  # Create RBAC resources
  create: true
  # Additional rules for the ClusterRole
  additionalRules: []

# Services configuration
services:
  # Metrics service configuration
  metrics:
    # Enable metrics service
    enabled: true
    # Service name
    name: controller-manager-metrics-service
    # Service type
    type: ClusterIP
    # Service port
    port: 8443
    # Target port
    targetPort: https
    # Additional labels
    labels: {}
    # Additional annotations
    annotations: {}

  # Webhook receiver service configuration
  webhookReceiver:
    # Enable webhook receiver service
    enabled: true
    # Service name
    name: webhook-receiver
    # Service type
    type: ClusterIP
    # Service port
    port: 3333
    # Target port
    targetPort: 3333
    # Additional labels
    labels: {}
    # Additional annotations
    annotations: {}

# Controller Configuration (GitOps Promoter specific settings)
controllerConfiguration:
  # Enable controller configuration
  enabled: true
  # Configuration name (uses upstream default: promoter-controller-configuration)
  # IMPORTANT: The GitOps Promoter controller expects this specific name.
  # Only change this if you know what you're doing.
  name: promoter-controller-configuration

  # Requeue durations
  argocdCommitStatusRequeueDuration: "120s"
  changeTransferPolicyRequeueDuration: "5m"
  promotionStrategyRequeueDuration: "5m"
  pullRequestRequeueDuration: "5m"

  # Pull Request template configuration
  pullRequest:
    template:
      title: "Promote {{ trunc 7 .ChangeTransferPolicy.Status.Proposed.Dry.Sha }} to `{{ .ChangeTransferPolicy.Spec.ActiveBranch }}`"
      description: |
        ## 🚀 Promotion Summary
        This PR promotes changes from **{{ .ChangeTransferPolicy.Spec.ProposedBranch }}** to **{{ .ChangeTransferPolicy.Spec.ActiveBranch }}**.

        ## 📊 Branch Details
        | | Active | Proposed |
        |---|---|---|
        | **Branch** | `{{ .ChangeTransferPolicy.Spec.ActiveBranch }}` | `{{ .ChangeTransferPolicy.Spec.ProposedBranch }}` |
        | **Dry SHA** | `{{ trunc 7 .ChangeTransferPolicy.Status.Active.Dry.Sha }}` | `{{ trunc 7 .ChangeTransferPolicy.Status.Proposed.Dry.Sha }}` |
        | **Hydrated SHA** | `{{ trunc 7 .ChangeTransferPolicy.Status.Active.Hydrated.Sha }}` | `{{ trunc 7 .ChangeTransferPolicy.Status.Proposed.Hydrated.Sha }}` |
        | **Commit Time** | {{ .ChangeTransferPolicy.Status.Active.Dry.CommitTime }} | {{ .ChangeTransferPolicy.Status.Proposed.Dry.CommitTime }} |

        ## 💡 Change Links
        * [View Active Branch](https://github.com/[[OWNER]]/[[REPO]]/tree/{{ .ChangeTransferPolicy.Spec.ActiveBranch }})
        * [View Proposed Branch](https://github.com/[[OWNER]]/[[REPO]]/tree/{{ .ChangeTransferPolicy.Spec.ProposedBranch }})
        * [View Active Commit](https://github.com/[[OWNER]]/[[REPO]]/commit/{{ .ChangeTransferPolicy.Status.Active.Dry.Sha }})
        * [View Proposed Commit](https://github.com/[[OWNER]]/[[REPO]]/commit/{{ .ChangeTransferPolicy.Status.Proposed.Dry.Sha }})
        * [Compare Changes](https://github.com/[[OWNER]]/[[REPO]]/compare/{{ .ChangeTransferPolicy.Status.Active.Dry.Sha }}...{{ .ChangeTransferPolicy.Status.Proposed.Dry.Sha }})

        ## 🔍 Current Status Checks

        ### ❗Active commit statuses
        {{ range .ChangeTransferPolicy.Status.Active.CommitStatuses }}
        * {{ .Key }}: **{{ .Phase }}**
        {{- end }}

        ### 👀 Proposed commit statuses
        {{ range .ChangeTransferPolicy.Status.Proposed.CommitStatuses }}
        * {{ .Key }}: **{{ .Phase }}**
        {{- end }}

        ## ✅ Acceptance Criteria
        This promotion can be merged when all of the following checks pass:
        {{ range .ChangeTransferPolicy.Spec.ActiveCommitStatuses }}
        - [ ] {{ .Key }} status is successful on active branch
        {{- end }}
        {{ range .ChangeTransferPolicy.Spec.ProposedCommitStatuses }}
        - [ ] {{ .Key }} status is successful on proposed branch
        {{- end }}
        - [ ] Code review approval from at least one team member

        ## 👥 Reviewers
        @[[OWNER]]/[[REPO]]-ops

        ## Additional Information
        * **Auto-Merge**: {{ .ChangeTransferPolicy.Spec.AutoMerge }}
        * **Full Active Dry SHA**: `{{ .ChangeTransferPolicy.Status.Active.Dry.Sha }}`
        * **Full Proposed Dry SHA**: `{{ .ChangeTransferPolicy.Status.Proposed.Dry.Sha }}`

# Custom Resource Definitions
crds:
  # Install CRDs
  install: true
  # Keep CRDs on uninstall (true for production, false for development)
  # When false, CRDs will be deleted on helm uninstall to prevent conflicts on reinstall
  keep: true

# Monitoring configuration
monitoring:
  # Enable ServiceMonitor for Prometheus
  serviceMonitor:
    enabled: false
    # Additional labels for ServiceMonitor
    labels: {}
    # Additional annotations for ServiceMonitor
    annotations: {}
    # Scrape interval
    interval: 30s
    # Scrape timeout
    scrapeTimeout: 10s
    # Metrics path
    path: /metrics

  # Enable PodMonitor for Prometheus
  podMonitor:
    enabled: false
    # Additional labels for PodMonitor
    labels: {}
    # Additional annotations for PodMonitor
    annotations: {}

# Ingress configuration for webhook receiver
ingress:
  # Enable ingress
  enabled: false
  # Ingress class name
  ingressClassName: "traefik-system"
  # Hostname for the webhook receiver
  hostname: "promoter-webhook.example.com"
  # Path configuration
  path: "/"
  pathType: "Prefix"
  # TLS configuration
  tls:
    # Enable TLS
    enabled: true
    # Secret name for TLS certificate
    secretName: "" # If empty, defaults to hostname
  # Additional annotations
  annotations:
    # Example annotations for different ingress controllers:
    # For cert-manager
    cert-manager.io/cluster-issuer: "sys-prod-issuer"
    # For nginx-ingress:
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # For traefik:
    # traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    # Additional labels
  labels: {}

# Network Policy
networkPolicy:
  # Enable network policy
  enabled: false
  # Ingress rules
  ingress: []
  # Egress rules
  egress: []

# Pod Disruption Budget
podDisruptionBudget:
  # Enable PDB
  enabled: false
  # Minimum available pods
  minAvailable: 1
  # Maximum unavailable pods
  # maxUnavailable: 1

  # Horizontal Pod Autoscaler
hpa:
  # Enable HPA
  enabled: false
  # Minimum replicas
  minReplicas: 1
  # Maximum replicas
  maxReplicas: 3
  # Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # Target memory utilization percentage
  # targetMemoryUtilizationPercentage: 80

  # Additional labels to apply to all resources
commonLabels: {}

# Additional annotations to apply to all resources
commonAnnotations: {}
