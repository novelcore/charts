apiVersion: v2
name: gitops-promoter
description: A Helm chart for GitOps Promoter - A tool for promoting changes between environments in GitOps workflows
type: application

# Chart version - follows semantic versioning
version: 0.8.0

# Application version - matches the GitOps Promoter version
appVersion: "0.20.3"

# Maintainers
maintainers:
- name: Novelcore Platform Team
  email: platform@novelcore.io

# Keywords for chart discovery
keywords:
- gitops
- promotion
- argocd
- continuous-deployment
- environment-promotion

# Home page
home: https://github.com/argoproj-labs/gitops-promoter

# Source code
sources:
- https://github.com/argoproj-labs/gitops-promoter

# Annotations for additional metadata
annotations:
  # Category for Artifact Hub
  artifacthub.io/category: integration-delivery

  # Links for Artifact Hub
  artifacthub.io/links: |
    - name: GitOps Promoter Documentation
      url: https://github.com/argoproj-labs/gitops-promoter/blob/main/README.md
    - name: Release Notes
      url: https://github.com/argoproj-labs/gitops-promoter/releases/tag/v0.20.3

  # Changes for this chart version
  artifacthub.io/changes: |
    - kind: changed
      description: "Updated GitOps Promoter to v0.20.3"
  # - kind: changed
  #   description: CRDs now installed from crds/ directory for proper Helm lifecycle management
  # - kind: removed
  #   description: Removed CRD template in favor of standard Helm CRD installation pattern
  # - kind: added
  #   description: Initial Helm chart for GitOps Promoter v0.10.2

  # License
  artifacthub.io/license: Apache-2.0

  # Images used by this chart
  artifacthub.io/images: |
    - name: gitops-promoter
      image: quay.io/argoprojlabs/gitops-promoter:v0.20.3
    - name: kube-rbac-proxy
      image: quay.io/brancz/kube-rbac-proxy:v0.17.0
    - name: git-fetch-daemon
      image: alpine/git:2.47.0

# Kubernetes version compatibility
kubeVersion: ">=1.20.0-0"
