{{- if false }}
{{- $crdContent := .Files.Get "crds/promoter-crds.yaml" }}
{{- if $crdContent }}
{{- $resourcePolicy := "keep" }}
{{- if not .Values.crds.keep }}
{{- $resourcePolicy = "delete" }}
{{- end }}
{{- /* Remove hooks completely and just set resource policy */ -}}
{{- $processedContent := $crdContent | replace "helm.sh/resource-policy: keep" (printf "helm.sh/resource-policy: %s" $resourcePolicy) }}
{{- /* Remove all hook annotations to avoid conflicts */ -}}
{{- $processedContent = $processedContent | replace "    helm.sh/hook: pre-install,pre-upgrade\n" "" }}
{{- $processedContent = $processedContent | replace "    helm.sh/hook-weight: \"-5\"\n" "" }}
{{ $processedContent }}
{{- else }}
# CRDs will be installed from the upstream install.yaml
# This template serves as a placeholder for when CRDs are extracted
# to a separate file for better management
{{- end }}
{{- end }}