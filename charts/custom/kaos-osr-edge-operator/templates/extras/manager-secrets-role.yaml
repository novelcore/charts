{{- /*
Namespace-scoped Role granting Secret get/list/watch in the operator's
install namespace. Pairs with the plugin-generated
templates/rbac/manager-role-binding.yaml RoleBinding (which references a
Role named "<release>-<chart>-manager-role" in the release namespace).

The plugin's templates/rbac/manager-role.yaml conditionally renders that
name as a ClusterRole or a Role based on rbac.namespaced. With
rbac.namespaced=false (default) — required because our operator needs
cluster-wide CRD/CR observation — the Role does NOT exist. Without this
extras file, the manager-role-binding RoleBinding dangles.

The Role's name is computed via the same chart helpers the plugin uses,
so the binding's roleRef resolves to this Role.
*/ -}}
{{- if not .Values.rbac.namespaced }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "kaos-osr-edge-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "kaos-osr-edge-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
  namespace: {{ .Release.Namespace }}
rules:
  # CON-03: read-only access to the operator's own osr-cloud-credentials
  # Secret for OAuth credential rotation (F-07 / Q-02). This Role is
  # namespace-scoped, so the grant reaches only Secrets in the release
  # namespace.
  #
  # This comment used to assert that "cluster-wide secret access is
  # intentionally absent from the manager ClusterRole." That was false when
  # written and stayed false through review. templates/rbac/manager-role.yaml
  # carried `apiGroups: ['*'], resources: ['*'], verbs: [get,list,watch]`, and
  # a wildcard apiGroup matches the CORE group — so the manager ClusterRole did
  # grant cluster-wide Secret read, `kubectl auth can-i --as=<operator-sa> get
  # secrets -A` answered "yes", and PRD-1 CON-03 was violated in shipped code.
  # The CON-03 render assertion appeared to confirm the claim because it
  # matched only the literal spelling `apiGroups: [""] + resources:
  # ["secrets"]`, which the wildcard rule does not use.
  #
  # The wildcard is gone (PRD-3 D-06: the CR read surface is now an aggregated
  # ClusterRole of per-API-group members, templates/rbac/crd-reader-*.yaml).
  # The claim is now true, and it is enforced rather than asserted: by the
  # CON-03 assertions in test/helm/render.sh, by the read API's fail-closed
  # startup SelfSubjectAccessReview, and — the only evidence that does not
  # depend on trusting this repository — by the `kubectl auth can-i` procedure
  # in docs/security/osr-rbac-audit.md. Verify; do not take this comment's word
  # for it. That is precisely the mistake being corrected here.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
{{- end }}
