{{- /*
PRD-3 T-11 — admission-time guard on the kaos-crd-reader aggregation members.

WHAT THIS DOES AND, MORE IMPORTANTLY, WHAT IT DOES NOT

Kyverno is an ADMISSION controller. It can refuse the creation or update of a
ClusterRole whose rules would permit a Secret read. It can NEVER block a Secret
read: authorization is decided by the API server's RBAC authorizer, which
Kyverno does not sit in front of. Any claim that this policy "prevents the OSR
components from reading Secrets" is false. What prevents that is the permission
set itself (crd-reader-members.yaml, manager-role.yaml), verifiable with
`kubectl auth can-i`.

The threat this actually addresses is T-11, and it is specific. Aggregation
means the granted set of the base ClusterRole is the union of every ClusterRole
carrying kaos.io/aggregate-to-crd-reader=true, assembled by
kube-controller-manager. Anyone who can create a ClusterRole — and who already
holds Secret read, since Kubernetes escalation prevention stops them granting
what they do not have — could add a member naming secrets. The base object
would then grant Secret read to both OSR ServiceAccounts while its own manifest,
and any Helm diff of it, stayed completely unchanged. This policy makes that
member fail admission.

The policy selects on BOTH kaos.io/osr-read-surface and
kaos.io/aggregate-to-crd-reader, because they catch different things and either
alone leaves a hole.

The marker alone misses the escalation this policy exists to stop: an attacker
creates a ClusterRole carrying only the AGGREGATION label, kube-controller-manager
merges it into <release>-crd-reader, both OSR ServiceAccounts gain the rules, and
nothing carrying our audit marker was ever touched.

The aggregation label alone misses readapi-builtin-read, which is bound directly
to the read API ServiceAccount rather than aggregated, and so carries only the
marker.

LIMITS, STATED PLAINLY

  - background: false. This evaluates admission requests only. A violating
    member that predates the policy is not retroactively removed or reported;
    the `kubectl auth can-i` check in docs/security/osr-rbac-audit.md is what
    catches that case, and it is the check that matters.
  - The policy is scoped to ClusterRoles carrying one of the two labels. A
    ClusterRole granting Secrets that carries NEITHER is none of this policy's
    business — it reaches no OSR ServiceAccount. Note this is a complete pair,
    not a convenience: the aggregation label is the only way to widen what the
    OSR identities hold without editing an object this chart owns, and it is
    covered.
  - Disabling kyverno.enable removes this layer only. The enumerated permission
    set, the dotted-DNS validation on readGroups/extraReadGroups, and the
    read API's fail-closed startup SelfSubjectAccessReview all remain.

Gated on kyverno.enable because ClusterPolicy is a CRD: rendering it on a
cluster without Kyverno installed makes `helm install` fail. KAOS child pools
install Kyverno (it is in .Values.readGroups), so the composition sets this
true; the chart default is false so a bare `helm install` succeeds anywhere.
*/ -}}
{{- if and .Values.kyverno.enable (not .Values.rbac.namespaced) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "kaos-osr-edge-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "kaos-osr-edge-operator.resourceName" (dict "suffix" "crd-reader-no-secrets" "context" $) }}
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: deny-credential-access-in-aggregation-members
      # TWO selectors, and both are load-bearing. `match.any` is an OR, so a
      # ClusterRole carrying EITHER label is evaluated.
      #
      #   readSurfaceLabel        — the audit marker. Every ClusterRole this
      #                             chart ships as part of the read surface
      #                             carries it, including the directly-bound
      #                             built-in role that is not aggregated.
      #
      #   crdReaderAggregationLabel — the MECHANISM. kube-controller-manager
      #                             merges anything carrying this into
      #                             <release>-crd-reader, which both OSR
      #                             ServiceAccounts hold. An attacker does not
      #                             need our audit marker to escalate; they need
      #                             this one. A member created outside the chart
      #                             with only the aggregation label would be
      #                             merged in and, with a single selector on the
      #                             marker, would never be matched by this
      #                             policy — reopening T-11 exactly.
      #
      # The chart's own render assertions cannot close that gap: they describe
      # objects this chart produces, and the threat is an object created by
      # something else. Only the policy's selector reaches it, which is why
      # render.sh asserts the SELECTOR SET here rather than the labels on
      # rendered members.
      match:
        any:
          - resources:
              kinds:
                - ClusterRole
              selector:
                matchLabels:
                  {{ include "kaos-osr-edge-operator.readSurfaceLabel" . }}: "true"
          - resources:
              kinds:
                - ClusterRole
              selector:
                matchLabels:
                  {{ include "kaos-osr-edge-operator.crdReaderAggregationLabel" . }}: "true"
      validate:
        message: >-
          This ClusterRole carries {{ include "kaos-osr-edge-operator.readSurfaceLabel" . }}=true
          or {{ include "kaos-osr-edge-operator.crdReaderAggregationLabel" . }}=true,
          so its rules either are, or will be merged by kube-controller-manager
          into, what the OSR components can read on this cluster. Read-surface ClusterRoles may only grant get/list/watch, and
          may never name secrets, serviceaccounts/token,
          certificatesigningrequests, or the pods/exec, pods/attach and
          pods/portforward subresources. A wildcard apiGroup ("*") is refused
          outright because it matches the core group where Secrets live; the
          core group itself ("") is allowed only with resources named
          individually, never with a resource wildcard.
          See docs/security/osr-rbac-audit.md.
        deny:
          conditions:
            any:
              # A wildcard apiGroup matches EVERY group including core, so it
              # always grants Secrets. Refused outright.
              - key: "{{ `{{ request.object.rules[].apiGroups[] | [?@ == '*'] | length(@) }}` }}"
                operator: GreaterThan
                value: 0
              # A resource wildcard is safe under a named non-core group
              # (cert-manager.io/* reaches cert-manager.io and nothing else) but
              # grants Secrets under the core group. Deny any rule that pairs an
              # empty apiGroup with a resource wildcard. Rules naming core
              # resources individually pass, which is how the built-in read
              # surface is expressed.
              - key: "{{ `{{ request.object.rules[?contains(apiGroups || [], '') && contains(resources || [], '*')] | length(@) }}` }}"
                operator: GreaterThan
                value: 0
              # secrets and any secrets/<subresource>.
              - key: "{{ `{{ request.object.rules[].resources[] | [?starts_with(@, 'secrets')] | length(@) }}` }}"
                operator: GreaterThan
                value: 0
              # The rest of internal/discovery.RBACDenylist. These are
              # credential-equivalent: a minted ServiceAccount token or a
              # signed client certificate is a Secret read by another name,
              # and pods/exec is a shell inside a workload that holds one.
              - key: "{{ `{{ request.object.rules[].resources[] | [?contains(['serviceaccounts/token', 'certificatesigningrequests', 'pods/exec', 'pods/attach', 'pods/portforward'], @)] | length(@) }}` }}"
                operator: GreaterThan
                value: 0
              # Any verb outside the read set. A member granting create/update
              # would be merged in with no diff on the base object.
              - key: "{{ `{{ request.object.rules[].verbs[] | [?@ != 'get' && @ != 'list' && @ != 'watch'] | length(@) }}` }}"
                operator: GreaterThan
                value: 0
{{- end }}
