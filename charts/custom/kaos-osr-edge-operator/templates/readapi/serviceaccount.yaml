{{- if .Values.readApi.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "kaos-osr-edge-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: read-api
  # A ServiceAccount separate from the manager's (PRD-3 CON-08): the read API
  # is a distinct workload with a distinct, dynamically generated permission
  # set. Sharing the manager's identity would give one ServiceAccount the
  # union of both permission sets and make its own audit inseparable from
  # the operator's.
  name: {{ include "kaos-osr-edge-operator.resourceName" (dict "suffix" "readapi" "context" $) }}
  namespace: {{ .Release.Namespace }}
{{- end }}
