## KubeCore CI Workflows configuration

# Registry configuration
registry:
  # internalUrl/externalUrl are the FALLBACK registry for submitters that do
  # not pass image_repo. Since PRD-994, the operator resolves the registry per
  # project and passes a fully-qualified image_repo plus registry_type on each
  # submission; these values are used only when it does not.
  # In-cluster Zot registry URL (for build push)
  internalUrl: "zot-registry.zot-registry.svc.cluster.local:5000"
  # External registry hostname (for kustomize image references in GitOps manifests)
  externalUrl: ""

# Argo Workflows UI base URL (e.g. "https://argo-workflows.system.<clusterDomain>").
# When set, ml-ci-build's GitHub commit statuses and its Deployment rollup carry
# a target_url/log_url linking directly to the workflow run in the Argo UI —
# a red check on GitHub is one click from the failing step's logs. Empty keeps
# plain statuses (no link). Populated by the clusteroperators composition.
argo:
  uiBaseUrl: ""

# GitHub configuration
github:
  # GitHub organization
  org: ""
  # Name of the K8s secret containing the GitHub installation token
  # This secret is provisioned by ESO GithubAccessToken generator
  tokenSecretName: ""

# GitOps configuration
gitops:
  # Suffix for the project ops repository (e.g., "my-project" + "-ops" = "my-project-ops")
  # EMPTY, not "-ops". This has exactly one consumer — ci-rc-build's gitops-notify — and it
  # disagreed with the dev path: workflowtemplate.yaml (ci-build) uses "${ORG}/${PROJECT}"
  # with no suffix. No "<project>-ops" repository exists in the org (checked 2026-09-12:
  # 0 of 4), so every RC stage promotion POSTed a dispatch to a repository that is not
  # there. The knob is kept for an installation that genuinely separates its ops repo.
  projectRepoSuffix: ""

# Kaniko configuration (build-push runs kaniko, not BuildKit).
# Use the :debug variant — it bundles /busybox/sh which Argo Workflows
# needs for argoexec to wrap the build command. The non-debug image is
# FROM scratch + the kaniko binary only and has no shell.
kaniko:
  image: "gcr.io/kaniko-project/executor:v1.23.2-debug"
  # Resources for the build-push (kaniko) container. Previously unset, so
  # kaniko ran with no guaranteed CPU and was throttled on a busy node,
  # making ML image builds slow.
  #
  # Sized to fit the platform's DEFAULT per-project CI node (PRD-962 F-09):
  # kubecore-operator cicompute.DefaultSize = "small" = e2-standard-4
  # (3920m CPU / ~12.9Gi allocatable, ~0.4 CPU / ~0.6Gi of that taken by GKE
  # daemonsets), maxNodes 1. The previous 4 CPU / 12Gi request was sized for
  # the retired shared n2-standard-8 kubecorecpu pool and can NEVER fit an
  # e2-standard-4: the autoscaler scaled the project's single CI node up,
  # nothing scheduled, and it scaled it back down — every project without an
  # explicit `ci: size:` was unable to build (kubecore-operator#1126 e2e,
  # prgate-gate, 2026-08-26; the 2026-08-20 "small" decision assumed the
  # chart set no request). Bigger declared sizes (medium/large) simply leave
  # headroom. memory limit == request so kaniko can't be OOMKilled
  # mid-snapshot of a multi-GB ML image; the pool is min=0 → one build per
  # node, so the cpu limit is the whole node.
  #
  # Right-sized from 14 days of Cloud Monitoring history for the dev/e2e pools
  # (308 ML build-push pods, kaos-dev-511509): per-pod CPU p95 1.99 / peak
  # 2.16 cores, working-set p95 10.1 GiB / max 10.6 GiB. CPU request 2 (was 3)
  # and NO cpu limit (platform decision 2026-11-03: size requests, never cap
  # CPU). Memory request stays 11Gi: p95+20% would be 12.1Gi, which can never
  # schedule on an e2-standard-4 (12.2 GiB left after GKE daemonsets). The
  # 12Gi limit is the most the smallest CI node can give while other CI pods
  # (render, reconciler) share it; max x1.5 (16Gi) exceeds the node.
  resources:
    requests:
      cpu: "2"
      memory: "11Gi"
    limits:
      memory: "12Gi"
  # Requests for ci-build / ci-rc-build build-push (service apps). These had
  # none (BestEffort). Kept well below the ML request above: a service image
  # is small, and the build shares the project's CI node with the other steps
  # of the run. No limit, so a large build is never OOMKilled by this value.
  serviceResources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      # Measured (98 service build-push pods, 14 days, e2e apps only): CPU p95
      # 0.23 / peak 0.32 cores, working set p95 1.24 GiB / max 1.34 GiB. The
      # limit is 2x the largest observed because the sample is small e2e apps.
      memory: 3Gi

# ci-secrets-prep init container of ci-build / ci-rc-build build-push (kaos
# PRD 695): lays out the user's CI secrets under /kaniko/secrets and writes
# kaniko's docker config. Needs a POSIX sh and yq v4; the kaniko debug image has
# no JSON tool, which is why this is a separate container. Same image and tag
# ml-ci-build's patch-images step already pulls.
ciSecretsPrep:
  image: "mikefarah/yq:4.44.3"

# Images and requests for every step except kaniko's build-push (see kaniko:
# above). Each tool is baked into a pinned image; nothing is
# installed when the pod starts (tests/tooling-images guards this). These steps used to run google/cloud-sdk:alpine
# with no requests and run `gcloud components install kubectl` (plus
# `apk add jq`) first. On a pool's CPU-saturated e2-standard-2 system node that
# BestEffort install took 9-18 minutes before ~5s of logic, which held up a new
# ML app's first build by 17.5 minutes (dev hub e2e, 2026-10-11).
# kaos-lake (PRD novelcore/kaos#1283 D-05): the audience of the service-account token the
# trusted render step presents to kaos-lake's dataset catalog. It must equal the stack's
# kaos.workload_identity.audience.
kaosLake:
  workloadAudience: kaos-lake

tooling:
  # kubectl + jq + curl, busybox sh. Runs the two check-drift steps. The same
  # image family as the projectmlstack composition's kubectl/jq steps. kubectl
  # 1.36 is within one minor of the dev/prod hubs (GKE 1.35) and of the pools
  # (GKE 1.36 on 2026-10-11).
  kubectlImage: "alpine/k8s:1.36.4"
  # gcloud + python3, busybox sh. Runs the healer, the janitor and the
  # compute probe. Pinned: the floating :alpine tag changes weekly.
  gcloudImage: "google/cloud-sdk:585.0.0-alpine"
  # The gcloud alpine image has no kubectl. An init container copies the
  # static kubectl binary from this image into an emptyDir instead.
  kubectlBinaryImage: "alpine/kubectl:1.36.4"
  # The script steps that need more than git or curl: git + curl + jq + yq v4 +
  # kustomize + kubectl + python3 with PyYAML, busybox sh. The same image as
  # kubectlImage (one pull per node). Runs ml-ci-build's detect-steps,
  # hera-enhance-commit, engine-record, patch-images, status and report,
  # ml-ci-pr-render's hera-enhance-gate, the status and gitops-notify steps of
  # ci-build and ci-rc-build and the pending reaper.
  # Those used to `apk add` / `apt-get install` / `pip install` their tools, or
  # download yq and kustomize, when the pod started. python3 here is 3.14; the
  # engine's enhancer (unpacked from the engine wheel) needs only the standard
  # library and PyYAML.
  toolboxImage: "alpine/k8s:1.36.4"
  # git only, busybox sh: the clone, version and tag steps.
  gitImage: "alpine/git:2.52.0"
  # curl only, busybox sh: status/release/issue steps that need no jq.
  curlImage: "alpine/curl:8.21.0"
  # busybox only: ml-ci-build's docker-config init container.
  alpineImage: "alpine:3.20.10"
  # Requests keep these pods out of the BestEffort class, so the scheduler
  # spreads them by CPU instead of piling them onto one saturated node.
  # CPU is never limited (requests only). Measured over 14 days of Cloud
  # Monitoring history (dev/e2e pools): the small git/curl/jq/kubectl steps
  # (clone, version, tag, status, report, gitops-notify, detect-*, patch-images)
  # peak at 62 MiB working set and 9m CPU.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  # The non-ML reconciler's check-drift lists/reads its app's workflows: working set p95 135-161 MiB, max 222 MiB, CPU peak 58m
  # on quiet pools. NO memory limit, on purpose: `kubectl get workflows -o json`
  # grows with the namespace (a busy e2e `{project}-ci` holds ~100 Workflows,
  # ~39 MB of JSON), and an OOMKill drops the event: a forced re-render after a
  # connection change never ran (0.12.128's 384Mi limit, e2e-suite-rtwn5
  # pipeline_connection, 2026-11-04). Keep the request; never add a limit here.
  clusterResources:
    requests:
      cpu: 50m
      memory: 208Mi
  # ml-ci-reconcile's check-drift alone. Its lists are narrow (unfinished workflows by selector,
  # finished attempts by label, the newest-run read in pages of 10), so it no longer grows with
  # the namespace: peak 40 MiB listing 150 finished workflows of ~370 KB each, 75 MiB with an
  # 0.9 MB WorkflowTemplate read on top (before: 800 MiB, 375-590 MiB live). The request is what
  # the scheduler counts on the small system nodes; ci.checkDrift.slots bounds how many run.
  # NO memory limit, on purpose: an OOMKill drops a forced re-render (see clusterResources).
  checkDriftResources:
    requests:
      cpu: 50m
      memory: 96Mi
  # pending-reaper: lists the cluster's UNFINISHED workflows only (selector), then each running
  # one's pods. Peak 16 MiB with 2 running workflows among 150 finished ones (900 MiB when it
  # listed every workflow). No memory limit, as for clusterResources.
  reaperResources:
    requests:
      cpu: 50m
      memory: 64Mi
  # gcloud is Python and needs more memory than kubectl (autoscaler healer:
  # p95 130 MiB, max 199 MiB, CPU peak 57m).
  gcloudResources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      memory: 320Mi
  # hera-render: the engine render plus the app dependencies the engine lacks. 246 pods: working set
  # p95 143 MiB, max 164 MiB; CPU p95 0.09, peak 0.135 cores.
  heraRenderResources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 256Mi
  # hera-enhance-commit / hera-enhance-gate: kubecore.enhance over one
  # WorkflowTemplate. Working set max 45 MiB, CPU peak 9m.
  enhanceResources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Build paths for the service-app (non-ML) CWTs.
#
# NO BuildKit anywhere in this chart. Every build-push — ml-ci-build,
# ci-build and ci-rc-build — runs kaniko (see the `kaniko:` block above).
# Rootless BuildKit cannot build on this platform: rootlesskit needs a mount
# namespace the pods are not permitted to create, so it fails with
# "failed to share mount point: /: permission denied" before reaching the
# registry. ml-ci-build was reverted to kaniko for this reason ("revert ML
# build-push to kaniko (0.11.4) — daemonless is broken on this platform");
# the service templates were only moved across later, after a live push test
# proved they had never been able to produce an artifact.
#
# The `buildkit:` key name is kept because these two path values are part of
# the chart's published values contract; renaming it is a breaking change for
# any caller that sets them. The name is a misnomer — they are just paths.
# The former `buildkit.image` key is gone: nothing consumes it.
buildkit:
  # Default Dockerfile path relative to repo root (service-app CWTs).
  dockerfilePath: "./Dockerfile"
  # Default build context relative to repo root (service-app CWTs).
  buildContext: "."

  # Resources for each ML build-push pod. Sized so several step builds run
  # concurrently on one e2-standard-4 kubecorecpu node (~3.5 vCPU / 12Gi usable):
  # 1.5 vCPU / 4Gi request fits 2 builds/node with headroom; the 8Gi limit
  # covers a torch/CUDA layer unpack. No daemon competing for the box now.
  buildResources:
    requests:
      cpu: "1500m"
      memory: "4Gi"
    limits:
      memory: "8Gi"

# Workflow configuration
workflow:
  # Namespace where WorkflowTemplate is created
  namespace: "argo-workflows"

  # TTL for completed workflows. These runs are what every GitHub commit
  # status / Deployment / report comment links to (argo.uiBaseUrl/workflows/
  # {ns}/{name}) and gke-dev has no workflow archive, so a run must outlive
  # the review it belongs to: 1 day after success, 3 days after failure
  # (the failed run — pods kept by podGC OnWorkflowSuccess — is the thing a
  # developer opens from the report). Was 1 h, which broke every link an hour
  # after the run (kubecore-operator#1126). Success was 3 days until 0.13.1:
  # the pool's Argo controller holds every retained run in memory and an
  # ml-ci-build run keeps two copies of its template (~570 KB), so 3 days of
  # builds on a busy pool (~260 runs) OOM-killed it (kubecore-operator#1826).
  # Failure was 14 days until 0.13.2: each retained ml-ci-build run costs the
  # pool's Argo controller about 570 KB of memory; a failed run's report link
  # now works for 3 days.
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 259200
    # utility / reconciler runs (probes, janitor, healer, reaper, ci-reconcile,
    # ml-ci-reconcile) — nothing links to them and they run every few
    # minutes; keep the short TTL.
    secondsAfterCompletion: 3600

  # Pod garbage collection
  podGC:
    strategy: OnWorkflowSuccess

# F-26 (PRD kaos#1533): ServiceAccount the reconcile templates (ci-reconcile,
# ml-ci-reconcile, kaos-lib-bump-pr) run as. The template owns it so a Workflow
# need not set serviceAccountName (Strict templateReferencing refuses that).
# Callers that still pass their own serviceAccountName keep working.
reconciler:
  serviceAccountName: operate-workflow-sa

# F-26: ServiceAccount ml-autoscaler-healer runs as (one per pool, in the
# argo-workflows namespace, WI-bound for the GCP probe).
autoscalerHealer:
  serviceAccountName: ml-compute-probe-sa

# Service account for workflow execution
serviceAccount:
  create: true
  name: "ci-build-sa"
  annotations: {}

# GCP Workload Identity for the CI workflow SA (live-compute / ephemeral
# nodegroups). When set, the chart's workflow ServiceAccount is annotated with
# iam.gke.io/gcp-service-account so gcloud steps authenticate as the eso-sa via
# GKE Workload Identity. The eso-sa email is
# "{org}-gcp-eso-sa@{projectId}.iam.gserviceaccount.com".
#
# NOTE: the gcloud lifecycle steps in the RENDERED ML pipeline WFT run as the
# argo-workflows/operate-workflow-sa KSA (created by the k8smlapp composition and
# WI-bound to eso-sa by the gcp/system composition). That SA — not this chart's
# ci-build-sa — is the identity that actually needs the iam.gke.io annotation, so
# the operator must annotate operate-workflow-sa. This value is provided for
# completeness (and any gcloud that runs as ci-build-sa); the operator sets it
# via its ciWorkflows values map.
gcp:
  esoServiceAccountEmail: ""

# RBAC for workflow pods
rbac:
  create: true

# Build (kaniko) pods: the build container runs the tenant's Dockerfile, so it
# gets no Kubernetes ServiceAccount token. A podSpecPatch turns automount off
# for the pod and mounts a short-lived projected token of the same SA into
# Argo's init/wait containers only (the executor needs it for
# WorkflowTaskResults). See _helpers.tpl buildPodSpecPatch (kaos PRD 738 F-20).
# false restores the kubelet's default mount in every container.
buildPods:
  isolateServiceAccountToken: true

# The render pod runs the developer's pipeline.py (unprivileged, read-only root filesystem, no
# Kubernetes token). Its network policy keeps it off the cluster's internal addresses and the
# metadata endpoint: DNS, the Kubernetes API (the Argo executor in the pod reports the result there)
# and https to public addresses (the package index) only. A standard NetworkPolicy cannot name the
# index's hosts; an address-level rule is the narrowest it can say. Off by default because the
# control plane's address is the cluster's: set kubeApiCIDRs (the `kubernetes` endpoint of the
# cluster the render runs on, /32) with it, or the executor cannot report and the render fails.
renderPods:
  networkPolicy:
    enabled: false
    kubeApiCIDRs: []

# Workspace volume (shared across all workflow steps via PVC)
workspace:
  size: "5Gi"
  # storageClassName: ""  # Leave empty to use cluster default storage class

# Scheduling (typically set by composition from workflowDefaults, but can override per-template)
nodeSelector: {}
tolerations: []

# CI configuration
ci:
  # Set by the KubePool clusteroperators composition from the
  # operator-resolved CI class (PRD-962 F-09). Seeds the default of the
  # `node_class` workflow parameter on every CI ClusterWorkflowTemplate, so
  # a submission that omits the parameter lands exactly where it lands
  # today. Empty until the operator starts passing this value — the
  # templates fall back to .Values.nodeSelector's
  # "platform.kubecore.io/nodegroup-type" entry, preserving today's
  # single-pool behavior.
  defaultNodeClass: ""
  # Max concurrently running/pending nodes of one ml-ci-build workflow
  # (Argo spec.parallelism). Keeps the build-push matrix from piling Pending
  # pods on the (default 1-node) CI pool past the pending-reaper's 45m
  # threshold — see clusterworkflowtemplate-ml.yaml. Raise together with the
  # project's `ci: maxNodes:`.
  mlBuildParallelism: 2
  # Per-project cap on concurrent ML image builds (kaniko build-push pods), as an
  # Argo semaphore. The semaphore's ConfigMap lives in each project's -ci
  # namespace, written by the githubproject composition from the project's CI pool
  # size: max(1, maxNodes - 1), so one pool node always stays free for render pods.
  # Off by default: a namespace without the ConfigMap would fail every build at
  # build-push. The clusteroperators composition turns it on for pools whose
  # projects get the ConfigMap.
  # kaos-lib rebuild policy (on-demand + background trickle), see ml-ci-reconcile:
  # an app whose pipeline ran within hotSeconds is rebuilt at once; one that ran
  # within idleSeconds is rebuilt in the background, one per project at a time; an
  # idle or never-run app is rebuilt only when used (a push).
  kaosLibRebuild:
    hotSeconds: 86400
    idleSeconds: 2592000
  buildSlots:
    enabled: false
    configMapName: ci-build-slots
    key: slots
  # Cap on check-drift pods running at once, per CLUSTER (an Argo semaphore across all
  # projects' CI namespaces: the pods share the one system node pool). A fan-out of
  # reconcile runs queues in Argo instead of starving that pool. The chart renders the
  # ConfigMap next to the workflow controller's templates. What bounds the number is
  # slots x tooling.checkDriftResources.requests.memory on the system pool (6 x 96Mi =
  # 576Mi at the default; the pod peaks under 100 MiB). A slot is held for one attempt
  # only: a run that retries "not yet" (up to ~45 min for an app whose repository is slow to
  # appear) holds none between attempts.
  checkDrift:
    slots: 6
    configMapName: ci-check-drift-slots
    key: slots
  # Upper bound (seconds) of one ml-ci-reconcile run, including its wait for the
  # app's build lock (check-drift takes the same mutex as ml-ci-build). A build
  # that never releases the lock fails the waiting run at this deadline.
  reconcileDeadlineSeconds: 10800

# pending-reaper (#897): bounds unschedulable-step hangs and terminate-desync.
pendingReaper:
  pendingMaxSeconds: 2700   # 45m — a step Pending this long is capacity-stuck, not queued
  terminateGraceSeconds: 1200  # 20m — shutdown recorded but unhonored = controller desync

# kaos-lib delivery (PRD novelcore/kaos#1147): where kaos-lib-bump-pr reads the
# release notes of a ==X.Y.Z version (a git archive spec names its own source).
kaosLib:
  changelogUrl: https://raw.githubusercontent.com/kaos-io/kaos-lib/main/CHANGELOG.md
  # The kaos-lib guide (the published docs of kaos-lib, written for app engineers). The chart links one of
  # its pages: support-window.html, from a new .kaos/compat.yaml written by a bump pull request.
  guideUrl: https://storage.googleapis.com/kaos-dev-511509-kaos-lib/docs

# Pipeline lint (PRD novelcore/kaos#1682 F-02): ml-ci-pr-render runs the kaos-lib linter on every
# PR of a Hera ML app and posts the `pipeline-lint` status plus one PR comment. The linter is
# pinned like the other tools: ONE exact kaos-lib wheel from the platform's public package index,
# verified by sha256 and unzipped, never pip-installed (a wheel of the kaos-lib-rc or kaos-lib
# index; the file name carries the version). Bump both values together with a kaos-lib release;
# rulesetVersion must be the rule set of that release (the run refuses a different one, so a
# gate and `kaosctl lint` of the same release always agree).
pipelineLint:
  kaosLibWheelUrl: "https://europe-west1-python.pkg.dev/kaos-dev-511509/kaos-lib-rc/kaos-lib/kaos_lib-0.5.0rc11-py3-none-any.whl"
  kaosLibWheelSha256: "8a4c54d704baadc00ab7ac827075c32c104c207f0458c55cbf852f4a6eab6c48"
  rulesetVersion: "2.5.0"

# Rendered WorkflowTemplate size guard (ml-ci-build hera-enhance-commit and ml-ci-pr-render
# hera-enhance-gate): a render above this many KiB fails with a clear message. The etcd
# object limit is ~1.5 MiB; the size is also recorded as `wft-bytes` in {app}-pipeline-images.
wftSize:
  limitKiB: 900
