## KubeCore CI Workflows configuration

# Registry configuration
registry:
  # internalUrl/externalUrl are the FALLBACK registry for submitters that do
  # not pass image_repo. Since PRD-994, the operator resolves the registry per
  # project and passes a fully-qualified image_repo plus registry_type on each
  # submission; these values are used only when it does not.
  # In-cluster Zot registry URL (for build push)
  internalUrl: "zot-registry.zot-registry.svc.cluster.local:5000"
  # External registry hostname (for kustomize image references in GitOps manifests)
  externalUrl: ""

# Argo Workflows UI base URL (e.g. "https://argo-workflows.system.<clusterDomain>").
# When set, ml-ci-build's GitHub commit statuses and its Deployment rollup carry
# a target_url/log_url linking directly to the workflow run in the Argo UI —
# a red check on GitHub is one click from the failing step's logs. Empty keeps
# plain statuses (no link). Populated by the clusteroperators composition.
argo:
  uiBaseUrl: ""

# GitHub configuration
github:
  # GitHub organization
  org: ""
  # Name of the K8s secret containing the GitHub installation token
  # This secret is provisioned by ESO GithubAccessToken generator
  tokenSecretName: ""

# GitOps configuration
gitops:
  # Suffix for the project ops repository (e.g., "my-project" + "-ops" = "my-project-ops")
  projectRepoSuffix: "-ops"

# Kaniko configuration (build-push runs kaniko, not BuildKit).
# Use the :debug variant — it bundles /busybox/sh which Argo Workflows
# needs for argoexec to wrap the build command. The non-debug image is
# FROM scratch + the kaniko binary only and has no shell.
kaniko:
  image: "gcr.io/kaniko-project/executor:v1.23.2-debug"
  # Resources for the build-push (kaniko) container. Previously unset, so
  # kaniko ran with no guaranteed CPU and was throttled on a busy node,
  # making ML image builds slow.
  #
  # Sized to fit the platform's DEFAULT per-project CI node (PRD-962 F-09):
  # kubecore-operator cicompute.DefaultSize = "small" = e2-standard-4
  # (3920m CPU / ~12.9Gi allocatable, ~0.4 CPU / ~0.6Gi of that taken by GKE
  # daemonsets), maxNodes 1. The previous 4 CPU / 12Gi request was sized for
  # the retired shared n2-standard-8 kubecorecpu pool and can NEVER fit an
  # e2-standard-4: the autoscaler scaled the project's single CI node up,
  # nothing scheduled, and it scaled it back down — every project without an
  # explicit `ci: size:` was unable to build (kubecore-operator#1126 e2e,
  # prgate-gate, 2026-08-26; the 2026-08-20 "small" decision assumed the
  # chart set no request). Bigger declared sizes (medium/large) simply leave
  # headroom. memory limit == request so kaniko can't be OOMKilled
  # mid-snapshot of a multi-GB ML image; the pool is min=0 → one build per
  # node, so the cpu limit is the whole node.
  resources:
    requests:
      cpu: "3"
      memory: "11Gi"
    limits:
      cpu: "4"
      memory: "11Gi"

# Build paths for the service-app (non-ML) CWTs.
#
# NO BuildKit anywhere in this chart. Every build-push — ml-ci-build,
# ci-build and ci-rc-build — runs kaniko (see the `kaniko:` block above).
# Rootless BuildKit cannot build on this platform: rootlesskit needs a mount
# namespace the pods are not permitted to create, so it fails with
# "failed to share mount point: /: permission denied" before reaching the
# registry. ml-ci-build was reverted to kaniko for this reason ("revert ML
# build-push to kaniko (0.11.4) — daemonless is broken on this platform");
# the service templates were only moved across later, after a live push test
# proved they had never been able to produce an artifact.
#
# The `buildkit:` key name is kept because these two path values are part of
# the chart's published values contract; renaming it is a breaking change for
# any caller that sets them. The name is a misnomer — they are just paths.
# The former `buildkit.image` key is gone: nothing consumes it.
buildkit:
  # Default Dockerfile path relative to repo root (service-app CWTs).
  dockerfilePath: "./Dockerfile"
  # Default build context relative to repo root (service-app CWTs).
  buildContext: "."

  # Resources for each ML build-push pod. Sized so several step builds run
  # concurrently on one e2-standard-4 kubecorecpu node (~3.5 vCPU / 12Gi usable):
  # 1.5 vCPU / 4Gi request fits 2 builds/node with headroom; the 8Gi limit
  # covers a torch/CUDA layer unpack. No daemon competing for the box now.
  buildResources:
    requests:
      cpu: "1500m"
      memory: "4Gi"
    limits:
      cpu: "3"
      memory: "8Gi"

# Workflow configuration
workflow:
  # Namespace where WorkflowTemplate is created
  namespace: "argo-workflows"

  # TTL for completed workflows. These runs are what every GitHub commit
  # status / Deployment / report comment links to (argo.uiBaseUrl/workflows/
  # {ns}/{name}) and gke-dev has no workflow archive, so a run must outlive
  # the review it belongs to: 3 days after success, 14 days after failure
  # (the failed run — pods kept by podGC OnWorkflowSuccess — is the thing a
  # developer opens from the report). Was 1 h, which broke every link an hour
  # after the run (kubecore-operator#1126).
  ttlStrategy:
    secondsAfterSuccess: 259200
    secondsAfterFailure: 1209600
    # utility / reconciler runs (probes, janitor, healer, reaper, ci-reconcile,
    # ml-ci-reconcile) — nothing links to them and they run every few
    # minutes; keep the short TTL.
    secondsAfterCompletion: 3600

  # Pod garbage collection
  podGC:
    strategy: OnWorkflowSuccess

# Service account for workflow execution
serviceAccount:
  create: true
  name: "ci-build-sa"
  annotations: {}

# GCP Workload Identity for the CI workflow SA (live-compute / ephemeral
# nodegroups). When set, the chart's workflow ServiceAccount is annotated with
# iam.gke.io/gcp-service-account so gcloud steps authenticate as the eso-sa via
# GKE Workload Identity. The eso-sa email is
# "{org}-gcp-eso-sa@{projectId}.iam.gserviceaccount.com".
#
# NOTE: the gcloud lifecycle steps in the RENDERED ML pipeline WFT run as the
# argo-workflows/operate-workflow-sa KSA (created by the k8smlapp composition and
# WI-bound to eso-sa by the gcp/system composition). That SA — not this chart's
# ci-build-sa — is the identity that actually needs the iam.gke.io annotation, so
# the operator must annotate operate-workflow-sa. This value is provided for
# completeness (and any gcloud that runs as ci-build-sa); the operator sets it
# via its ciWorkflows values map.
gcp:
  esoServiceAccountEmail: ""

# RBAC for workflow pods
rbac:
  create: true

# Workspace volume (shared across all workflow steps via PVC)
workspace:
  size: "5Gi"
  # storageClassName: ""  # Leave empty to use cluster default storage class

# Scheduling (typically set by composition from workflowDefaults, but can override per-template)
nodeSelector: {}
tolerations: []

# CI configuration
ci:
  # Set by the KubePool clusteroperators composition from the
  # operator-resolved CI class (PRD-962 F-09). Seeds the default of the
  # `node_class` workflow parameter on every CI ClusterWorkflowTemplate, so
  # a submission that omits the parameter lands exactly where it lands
  # today. Empty until the operator starts passing this value — the
  # templates fall back to .Values.nodeSelector's
  # "platform.kubecore.io/nodegroup-type" entry, preserving today's
  # single-pool behavior.
  defaultNodeClass: ""
  # Max concurrently running/pending nodes of one ml-ci-build workflow
  # (Argo spec.parallelism). Keeps the build-push matrix from piling Pending
  # pods on the (default 1-node) CI pool past the pending-reaper's 45m
  # threshold — see clusterworkflowtemplate-ml.yaml. Raise together with the
  # project's `ci: maxNodes:`.
  mlBuildParallelism: 2

# pending-reaper (#897): bounds unschedulable-step hangs and terminate-desync.
pendingReaper:
  pendingMaxSeconds: 2700   # 45m — a step Pending this long is capacity-stuck, not queued
  terminateGraceSeconds: 1200  # 20m — shutdown recorded but unhonored = controller desync

# Platform enhancer (kubecore-operator#1161): ml-ci-build and ml-ci-pr-render run
# kubecore.enhance from THIS pinned copy (the template repo's kubecore/), overlaid
# on the app's vendored kubecore/ (kept for local dev only). Bump `ref` to roll
# an enhancer fix out to every app on its next render.
platformEnhancer:
  repo: novelcore/hera-mlops-template
  ref: ebbdd2c019964201a2c77f59f5a0592c2002e831
