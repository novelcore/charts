# The pending-reaper's WorkflowTemplate (see cronworkflow-pending-reaper.yaml).
# Namespaced on purpose, not a ClusterWorkflowTemplate: a tenant namespace
# cannot reference it, so the reaper's ServiceAccount (cluster-wide workflow
# patch/delete) is not reachable from a tenant Workflow (F-26, OQ-3).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pending-reaper
  namespace: {{ include "kubecore-ci-workflows.namespace" . }}
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "kubecore-ci-workflows.fullname" . }}-pending-reaper
  entrypoint: reap
  activeDeadlineSeconds: 240
  ttlStrategy:
    secondsAfterCompletion: 600
  templates:
    - name: reap
      container:
        image: {{ .Values.tooling.kubectlImage | default "alpine/k8s:1.36.4" }}
        {{- include "kubecore-ci-workflows.resources" .Values.tooling.clusterResources | nindent 8 }}
        command: [sh, -c]
        args:
          - |
            set -e
            NOW=$(date +%s)
            PENDING_MAX={{ .Values.pendingReaper.pendingMaxSeconds | default 2700 }}
            TERM_GRACE={{ .Values.pendingReaper.terminateGraceSeconds | default 1200 }}
            kubectl get wf -A -o json | jq -c '.items[] | select(.status.phase=="Running") | {ns: .metadata.namespace, name: .metadata.name, shutdown: (.spec.shutdown // ""), seen: (.metadata.annotations["reaper.kubecore.io/shutdown-seen"] // "")}' | while read -r wf; do
              NS=$(echo "$wf" | jq -r .ns); NAME=$(echo "$wf" | jq -r .name)
              SHUTDOWN=$(echo "$wf" | jq -r .shutdown); SEEN=$(echo "$wf" | jq -r .seen)
              if [ -n "$SHUTDOWN" ]; then
                # terminate/stop recorded but wf still Running: grace-clock it
                if [ -z "$SEEN" ]; then
                  kubectl -n "$NS" annotate wf "$NAME" "reaper.kubecore.io/shutdown-seen=$NOW" --overwrite >/dev/null
                  echo "grace-start: $NS/$NAME (shutdown=$SHUTDOWN)"
                elif [ $((NOW - SEEN)) -gt "$TERM_GRACE" ]; then
                  echo "REAP-DESYNC: $NS/$NAME shutdown=$SHUTDOWN unhonored for $((NOW - SEEN))s -> delete"
                  kubectl -n "$NS" delete wf "$NAME" --wait=false
                fi
                continue
              fi
              # any pod of this wf Pending past the threshold?
              # Each pod's own activeDeadlineSeconds (the enhancer's per-step
              # pending allowance: CPU 30 min, GPU 90 min — scale-from-zero +
              # autoscaler retries) is the limit while it Pends; Argo only
              # enforces it once the pod runs (#897), so the reaper does. Pods
              # without one fall back to PENDING_MAX. Before 0.12.76 a flat
              # PENDING_MAX undercut every GPU step at 45 min.
              WORST=$(kubectl -n "$NS" get pods -l "workflows.argoproj.io/workflow=$NAME" -o json 2>/dev/null | jq -r --argjson now "$NOW" --argjson max "$PENDING_MAX" '[.items[] | select(.status.phase=="Pending") | {name: .metadata.name, age: ($now - (.metadata.creationTimestamp | fromdateiso8601)), limit: (.spec.activeDeadlineSeconds // $max)} | select(.age > .limit)] | sort_by(-(.age - .limit)) | .[0] // empty | "\(.name) \(.age) \(.limit)"')
              if [ -n "$WORST" ]; then
                POD=${WORST%% *}; REST=${WORST#* }; AGE=${REST%% *}; LIMIT=${REST#* }
                WHY=$(kubectl -n "$NS" get events --field-selector "involvedObject.name=$POD" -o json 2>/dev/null | jq -r '[.items[] | select(.reason | test("FailedScheduling|NotTriggerScaleUp|FailedScaleUp|TriggeredScaleUp"))] | sort_by(.lastTimestamp) | last // empty | "\(.reason): \(.message)"' | cut -c1-300)
                echo "REAP-PENDING: $NS/$NAME pod $POD Pending ${AGE}s > ${LIMIT}s -> Stop (exit handlers run, GitHub/MLflow reporting fires); ${WHY:-no scheduling event}"
                kubectl -n "$NS" annotate wf "$NAME" "reaper.kubecore.io/reason=step pod $POD Pending ${AGE}s > its ${LIMIT}s allowance — ${WHY:-unschedulable (capacity/quota/stockout)}" --overwrite >/dev/null
                kubectl -n "$NS" patch wf "$NAME" --type merge -p '{"spec":{"shutdown":"Stop"}}'
              fi
            done
            echo "reaper pass complete"
