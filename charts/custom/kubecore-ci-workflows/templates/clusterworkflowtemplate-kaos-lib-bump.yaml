{{/*
kaos-lib-bump-pr — the platform's bump job (PRD novelcore/kaos#1147, contract
kubecore-operator study/kubecore/package-delivery-design.md).

An app whose desired kaos-lib version is outside its .kaos/compat.yaml range is
not rebuilt (state needs-migration; the operator raises the KubeApp condition
KaosLibBumpRequested, target status.ml.kaosLib.desired). This template opens
the ONE pull request that moves it, in the app repo, with the same per-org CI
GitHub App token every other GitHub-writing CI step here uses
(github.tokenSecretName):

  branch  kaos-lib/bump-<version>, off `branch` (the branch the CI builds)
  change  .kaos/compat.yaml -> kaos-lib: ">=X.Y,<next series>" (comments kept)
  body    what merging / closing does + the version's CHANGELOG.md section, read
          from the package source the spec names (a git archive: that repository
          at that commit; a GitHub release asset or tag archive: that release's notes; ==X.Y.Z:
          kaosLib.changelogUrl)

Idempotent: a pull request ever opened for the branch (open, closed or merged)
means no second one, so a client who closes it is not asked again for that
version. Opening (or finding) the pull request for a version closes every other
open kaos-lib/bump-* pull request of the repo as superseded and deletes its
branch. A git version (git-<sha>) has no range to bump and opens nothing.

Logic and tests: files/kaos-lib.py `bump`, tests/kaos-lib (a fake GitHub).

PARAMETER CONTRACT (the k8smlapp composition renders one Workflow per app per
version referencing this template, when the operator passes kaosLib.bumpTo
{spec, version} into the XR, i.e. while KaosLibBumpRequested=True; pinned apps
get none):
  app           the app name (as ci-sync's app_name)                  required
  version       the target version, X.Y.Z (bumpTo.version)            required
  spec          the target requirement, as built (bumpTo.spec), e.g.
                kaos-lib[zitadel] @ https://github.com/kaos-io/kaos-lib/releases/<download>/vX.Y.Z/<wheel>
                                                                       required
  project_name  the project (as ci-sync's project_name); the app repo
                is {github.org}/{project_name}-{app}                  required
  branch        the branch the CI builds and the PR targets (ci-sync's
                branch, the app's dev branch)                         default dev
  repo_url      https://github.com/<owner>/<repo>[.git] to override
                the derived repo                                      default ""
Run it in the project's CI namespace with the pool's CI token (github-token
volume; ci-sync's serviceAccountName/volumes work as they are). Idempotent per
version: re-submitting it, or a second Workflow for the same version, opens
nothing new. A Workflow name per version (e.g. {app}-kaos-lib-bump-{version})
keeps one run per version; a new version's run closes the older bump PR.
By hand:
  argo submit -n <project>-ci --from clusterworkflowtemplate/kaos-lib-bump-pr \
    -p app=<app> -p project_name=<project> -p version=0.3.0 -p spec='<requirement>'
*/}}
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: kaos-lib-bump-pr
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  # F-26 (Strict templateReferencing refuses a Workflow's own serviceAccountName
  # and volumes): the template owns both. The token Secret name is fixed from
  # values, never a parameter (a submitter must not pick which Secret mounts). Existing callers that still pass their
  # own serviceAccountName/volumes keep working: the Workflow's fields win.
  serviceAccountName: {{ .Values.reconciler.serviceAccountName | default "operate-workflow-sa" }}
  entrypoint: bump
  # The system pool, as ml-ci-reconcile: the job needs only the GitHub API.
  nodeSelector:
    platform.kubecore.io/system: "true"
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.workflow.ttlStrategy.secondsAfterCompletion }}
  podGC:
    strategy: {{ .Values.workflow.podGC.strategy }}
  arguments:
    parameters:
    - name: app
    - name: project_name
    # Empty: {github.org}/{project}-{app}, the way the githubapp composition names it.
    - name: repo_url
      value: ""
    - name: branch
      value: dev
    # The target: kaosLib.bumpTo (status.ml.kaosLib.desired and its version).
    - name: version
    - name: spec
  volumes:
  - name: github-token
    secret:
      secretName: {{ .Values.github.tokenSecretName }}
  templates:
  - name: bump
{{ include "kubecore-ci-workflows.preemptionRetry" . | indent 4 }}
    container:
      image: {{ .Values.tooling.toolboxImage | default "alpine/k8s:1.36.4" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      # Data, not script: the parameters reach the script as env vars.
      env:
      - name: APP
        value: "{{`{{workflow.parameters.app}}`}}"
      - name: PROJECT
        value: "{{`{{workflow.parameters.project_name}}`}}"
      - name: REPO_URL
        value: "{{`{{workflow.parameters.repo_url}}`}}"
      - name: BASE
        value: "{{`{{workflow.parameters.branch}}`}}"
      - name: VERSION
        value: "{{`{{workflow.parameters.version}}`}}"
      - name: SPEC
        value: "{{`{{workflow.parameters.spec}}`}}"
      args:
      - |
        set -eu
        case "${REPO_URL}" in
          https://github.com/*) SLUG=$(printf '%s' "${REPO_URL}" | sed -E 's|https://github.com/||; s|\.git$||') ;;
          *) SLUG="{{ .Values.github.org }}/${PROJECT}-${APP}" ;;
        esac
{{ include "kubecore-ci-workflows.kaosLibScript" . | indent 8 }}
        python3 -I /tmp/kaos-lib.py bump --slug "${SLUG}" --base "${BASE}" --version "${VERSION}" \
          --spec "${SPEC}" --changelog-url "{{ .Values.kaosLib.changelogUrl }}" \
          --guide-url "{{ .Values.kaosLib.guideUrl }}"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true
