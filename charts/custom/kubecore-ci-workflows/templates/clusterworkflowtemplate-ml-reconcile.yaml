{{/*
ml-ci-reconcile — the level-triggered CI backstop (#459), and (force=true) the
event-driven trigger the k8smlapp composition fires at creation and on every
platform-context change.

The k8smlapp composition creates a per-app CronWorkflow ({app}-ci-reconciler,
hourly since kubecore-operator#1439, concurrencyPolicy: Forbid) that invokes THIS
template. Until it
existed, every one of those CronWorkflows referenced a missing
ClusterWorkflowTemplate and therefore NEVER FIRED (lastScheduledTime unset on
every app, verified live 2026-07-16) — so the backstop the composition documents
("a dropped push webhook now costs <= 3 min; no build is ever permanently lost")
did not exist at all.

What it does — pure level-triggering, no edge required:

  1. Read the app repo's current HEAD SHA on the dev branch (GitHub API).
  2. Read last-built-sha from the {app}-pipeline-images ConfigMap (the value
     ml-ci-build's patch-images step records after a successful build).
  3. If they differ, submit ml-ci-build for that SHA. If they match, exit — a
     no-op poll costs one API call.

That makes the CI self-healing for the two failure modes that otherwise need a
human: a dropped/failed webhook delivery, and a build that never ran because the
event was lost. It is deliberately NOT a re-render trigger for platform-context
changes — those flow operator -> XR -> composition -> ConfigMap, and the WFT
picks them up on the next build this reconciler submits.

Dataset changes (PRD novelcore/kaos#1283 D-05) are the second input of a render
besides the commit that the poll can see: the pipeline's dataset pickers (the form
field of every name a step declares in inputs=) are filled from kaos-lake's catalog
at render time only. The render records a digest of the choices it offered
(dataset-sha, in {app}-pipeline-images); DATASET DRIFT compares it with the catalog
now and re-renders when they differ. The engine is
the third (PRD-HPC-1461 D-80): ENGINE DRIFT compares the engine the gitops context
pins with the one the last render and the compose image were built on
(engine-version, engine-compose) and re-renders when it moved. kaos-lake
creates a `ml-ci-dataset-release` Workflow when a version is released, which
submits this template for each ML app with dataset_event=true: the same check,
run at once instead of at the next poll, and retried while a build is in flight.
The fourth is the app's own kaos-lib pin (PRD novelcore/kaos#1911): the forced run fired by a context change
rebuilds the stale images at once when the context marks the spec as spec.ml.kaosLib (kaosLib.pinned) and
gitops' pipeline-images does not record it (KAOS-LIB PIN). A platform-wide move has no mark and stays with
the poll's KAOS-LIB DRIFT, paced by the app's use.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ml-ci-reconcile
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  # F-26 (Strict templateReferencing refuses a Workflow's own serviceAccountName
  # and volumes): the template owns both. The token Secret name is fixed from
  # values, never a parameter (a submitter must not pick which Secret mounts). Existing callers that still pass their
  # own serviceAccountName/volumes keep working: the Workflow's fields win.
  serviceAccountName: {{ .Values.reconciler.serviceAccountName | default "operate-workflow-sa" }}
  entrypoint: ml-ci-reconcile
  # Workflow-level nodeSelector follows the same per-submission CI pool
  # as ml-ci-build's build-push override (PRD-962 F-09 stage 2, ML).
  # node_class's Helm-render-time default is unchanged, so a submission
  # that omits it still resolves to today's fixed kubecorecpu selector.
  # The CI pool is tainted, so without a nodeSelector the reconciler's
  # pods have nowhere to land.
  #
  # kubecore-operator#1067: nodegroup-type alone is not project-scoping —
  # the synthesised CI environment is named the literal string "ci" on
  # EVERY project, so every project's CI pool carries the identical
  # nodegroup-type=ci label and any of them satisfies this selector. Adding
  # platform.kubecore.io/project (a label the node already carries, unique
  # per project) closes that. project_name is a required workflow parameter
  # on ml-ci-reconcile (no fallback), so this key is never emitted empty.
  # System pool, NOT the project's CI pool (kubecore-operator#1126, 2026-08-27):
  # this poll ran every 3 minutes on the scale-to-zero CI pool it was meant to
  # watch, so that pool could never scale to zero — 20 scale-downs / 21 node
  # registrations on gke-dev's CI nodes in one event window, each churn also
  # discarding the node-local kaniko cache. The check needs only kubectl +
  # the GitHub API; it lands where the pending-reaper and autoscaler-healer
  # already run (kubecoresys, via the chart's inherited tolerations). The
  # build it submits still targets the CI pool through node_class.
  nodeSelector:
    platform.kubecore.io/system: "true"
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.workflow.ttlStrategy.secondsAfterCompletion }}
  podGC:
    strategy: {{ .Values.workflow.podGC.strategy }}
  # Upper bound for the whole run, INCLUDING the wait for the app's build lock
  # (check-drift's synchronization below). A build that never releases the lock
  # fails this run with Argo's "exceeded its deadline" instead of leaving it
  # Pending forever; the hourly CronWorkflow re-detects any drift this run was
  # for. Sized above one slow first build (~40m) plus the queue ahead of it.
  activeDeadlineSeconds: {{ int (.Values.ci.reconcileDeadlineSeconds | default 10800) }}

  arguments:
    parameters:
    - name: app_name
    - name: project_name
    - name: repo_url
      value: ""
    - name: branch
      value: dev
    - name: ci_namespace
    # ml_namespace: where {app}-pipeline-images (and last-built-sha) actually
    # lives. Empty => derive ml-{project}, the composition's default, so a
    # CronWorkflow rendered before this param existed still works.
    - name: ml_namespace
      value: ""
    - name: image_repository
      value: ""
    - name: registry_url
      value: ""
    - name: build_registry_url
      value: ""
    - name: gitops_repository
    - name: gitops_branch
      value: main
    - name: workflow_template_path
    # Per-submission CI node pool (PRD-962 F-09), threaded into the
    # ml-ci-build Workflow this template submits below via
    # workflowTemplateRef — ml-ci-reconcile has no build pod of its own.
    # force: submit a re-rendering build even when nothing drifted. Set by the
    # k8smlapp composition's {app}-ci-sync-{hash} Workflow, which it renders at
    # app creation and again whenever the app's platform context changes — the
    # event-driven trigger; the CronWorkflow (force=false) is only the backstop.
    # In force mode "not yet" (repo or pipeline-images not there, a build in
    # flight) is retried (exit 3, see check-drift's retryStrategy) instead of
    # skipped: skipping would drop the event, and there is no next poll.
    - name: force
      value: "false"
    # context_sha (force mode): sha256 of the pipeline-context.yaml the
    # composition just wrote to gitops. The build renders from the gitops copy,
    # so force waits until that copy matches; a build started before the
    # composition's commit lands would render the old context and nothing would
    # re-trigger it. Empty = do not wait.
    - name: context_sha
      value: ""
    # dataset_event: set by ml-ci-dataset-release (kaos-lake saw a dataset change).
    # The poll's checks, plus: a build already in flight is waited out (exit 3,
    # retried) instead of skipping, because the in-flight render may predate the
    # change, and a pipeline that records no dataset-sha yet counts as drifted.
    - name: dataset_event
      value: "false"
    - name: node_class
      value: {{ .Values.ci.defaultNodeClass | default (dig "platform.kubecore.io/nodegroup-type" "kubecorecpu" .Values.nodeSelector) | quote }}

  volumes:
  - name: github-token
    secret:
      secretName: {{ .Values.github.tokenSecretName }}

  templates:
  - name: ml-ci-reconcile
    steps:
    # 1. Wait (unlocked) for the INPUTS that are not builds: the app repo,
    # {app}-pipeline-images (ArgoCD) and the gitops context a trigger is for.
    # Holding the build lock through those minutes would delay the app's first
    # build for nothing, so this step takes no lock. Only the triggers that must
    # not be dropped wait here; the hourly poll just decides in step 2.
    - - name: await-inputs
        template: check-drift
        when: "{{`{{workflow.parameters.force}}`}} == true || {{`{{workflow.parameters.dataset_event}}`}} == true"
        arguments:
          parameters:
          - name: mode
            value: await
    # 2. Decide and submit under the app's build lock.
    - - name: decide
        template: decide-and-submit

  - name: decide-and-submit
    # WAITING FOR A BUILD IS NOT A FAILURE. The app's builds hold the Argo mutex
    # "{app}-build" (ml-ci-build's synchronization); this template takes the SAME
    # mutex for the duration of check-drift AND submit-build, so Argo keeps it
    # Pending ("Waiting for lock", no pod, no retry node, nothing red) while a
    # build runs and starts it the moment the build ends, in queue order. The
    # check then decides ONCE against the build's result (last-built-sha /
    # context-sha), and the build it submits already exists (queued behind this
    # lock) when the lock is released seconds later: a second sync that was
    # waiting sees it and submits nothing. No deadlock: submit-build only
    # creates the Workflow, it never waits for it. The wait survives controller
    # restarts (the queue lives in the Workflow status) and is bounded by the
    # run's activeDeadlineSeconds. It used to be an exit-3 retry loop: dozens of
    # red check-drift(n) nodes per first build.
    synchronization:
      mutexes:
      - name: "{{`{{workflow.parameters.app_name}}`}}-build"
    steps:
    - - name: check-drift
        template: check-drift
        arguments:
          parameters:
          - name: mode
            value: decide
    - - name: submit-build
        template: submit-build
        # Only when HEAD differs from the last SHA we actually built.
        when: "{{`{{steps.check-drift.outputs.parameters.needs_build}}`}} == true"
        arguments:
          parameters:
          - name: commit_sha
            value: "{{`{{steps.check-drift.outputs.parameters.head_sha}}`}}"
          - name: kaos_lib_ref
            value: "{{`{{steps.check-drift.outputs.parameters.kaos_lib_ref}}`}}"
          - name: render_only
            value: "{{`{{steps.check-drift.outputs.parameters.render_only}}`}}"

  - name: check-drift
    # At most `ci.checkDrift.slots` check-drift pods run at once in the whole cluster (an Argo
    # semaphore, counted across every project's CI namespace: they all land on the one system
    # pool). A fan-out (ml-ci-dataset-rerender per app, the hourly polls, a library update)
    # QUEUES here, in Argo, with no pod: nothing for the pending-reaper to kill, nothing for the
    # autoscaler to count, nothing starving the node. The slot is held across this template's
    # retries (Argo takes it on the retry node), so an exit-3 "not yet" wait keeps its slot and
    # a killed pod (137) retries without queueing again; the wait is bounded by the run's
    # activeDeadlineSeconds. The ConfigMap is rendered by this chart, so the cap needs no other
    # component. decide-and-submit holds the app's build mutex while this waits for a slot;
    # slot holders never wait for a mutex, so the two cannot deadlock.
    synchronization:
      semaphores:
      - namespace: {{ include "kubecore-ci-workflows.namespace" . }}
        configMapKeyRef:
          name: {{ .Values.ci.checkDrift.configMapName | quote }}
          key: {{ .Values.ci.checkDrift.key | quote }}
    inputs:
      parameters:
      # await: only wait (exit 3) for inputs that are not builds, see
      # ml-ci-reconcile; the outputs are unused. decide: the authoritative
      # check, run under the build lock by decide-and-submit.
      - name: mode
        value: decide
    # Exit 3 is now only force/dataset mode's "not yet" for inputs that are NOT
    # builds (repo, pipeline-images or gitops context still arriving); a killed
    # pod (137) is retried in every mode; every other outcome exits 0 or fails
    # for real. Those inputs arrive within minutes: retry every minute for up to
    # ~45 minutes. No maxDuration (Argo counts it from the first attempt; see
    # tests/retry-window).
    retryStrategy:
      limit: 45
      retryPolicy: OnFailure
      # 3 = "not yet"; 137 = the pod was killed (OOM or a lost node) before it
      # decided anything, which must never drop a forced event.
      expression: "asInt(lastRetry.exitCode) == 3 || asInt(lastRetry.exitCode) == 137"
      backoff:
        duration: "60s"
        factor: 1
    outputs:
      parameters:
      - name: needs_build
        valueFrom:
          path: /tmp/needs_build
          default: "false"
      - name: head_sha
        valueFrom:
          path: /tmp/head_sha
          default: ""
      # KAOS-LIB DRIFT's attempt guard: sha256[:12] of the spec a build is
      # submitted for ("" = not a kaos-lib re-build).
      - name: kaos_lib_ref
        valueFrom:
          path: /tmp/kaos_lib_ref
          default: ""
      # DATASET-ONLY RE-RENDER: "true" when the only reason to build is the dataset
      # choices and everything else is in sync, so submit-build starts the short
      # ml-ci-dataset-render run of ml-ci-build instead of the full one.
      - name: render_only
        valueFrom:
          path: /tmp/render_only
          default: "false"
    container:
      # kubectl + jq + curl baked in (tooling.kubectlImage, pinned). alpine/git
      # has NO kubectl: the baseline read silently produced "" on every poll, so
      # needs_build was ALWAYS true and this backstop became a build storm
      # (live 2026-07-16, 39 builds). Nothing is installed at start-up: the
      # google/cloud-sdk:alpine image this step used before spent 9-18 minutes
      # on `gcloud components install kubectl` on a busy system node, which
      # delayed a new app's first build by 17.5 minutes (2026-10-11).
      image: {{ .Values.tooling.kubectlImage | default "alpine/k8s:1.36.4" }}
      {{- with .Values.tooling.checkDriftResources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      command: [sh, -c]
      args:
      - |
        set -eu
        command -v kubectl >/dev/null 2>&1 || { echo "FATAL: kubectl missing from this image" >&2; exit 1; }

        # IN-FLIGHT GUARD (kubecore-operator#872): never stack a new build on an
        # unfinished one. When builds cannot complete (live 2026-08-09: regional
        # SSD quota exhausted -> workspace PVCs Pending forever), every tick used
        # to submit ANOTHER build: 43 stacked workflows whose 42 pending/bound
        # 40Gi workspaces themselves held the quota exhausted - a self-sustaining
        # storm. A build already Running/Pending means drift is being handled;
        # skip LOUDLY (never silently - the self-disabling class this template
        # documents). A read failure also skips: unknown state must never mean
        # "submit more work".
        # Outputs exist on EVERY exit path, including a "not yet" exit 3:
        # without them Argo logs "cannot save parameter" for each retried attempt.
        printf 'false' > /tmp/needs_build
        printf '' > /tmp/head_sha
        printf 'false' > /tmp/render_only
        FORCE="{{`{{workflow.parameters.force}}`}}"
        DATASET_EVENT="{{`{{workflow.parameters.dataset_event}}`}}"
        # RETRY: the runs that must not drop their event when the state is "not
        # yet" — force, and (for a build in flight only) a dataset event.
        RETRY=false
        [ "$FORCE" = "true" ] || [ "$DATASET_EVENT" = "true" ] && RETRY=true
        # not_yet MSG: retry later (exit 3) in a RETRY run; otherwise skip this
        # poll as before.
        not_yet() {
          if [ "$RETRY" = "true" ]; then
            echo "reconcile: force: $1 — retrying"
            exit 3
          fi
          echo "reconcile: $1 — skipping this poll"
          printf 'false' > /tmp/needs_build
          printf '' > /tmp/head_sha
          exit 0
        }
        # Only the UNFINISHED workflows are listed (server-side selector on the label Argo
        # keeps on every workflow; a workflow the controller has not labelled yet has none and
        # still matches `!=true`). The namespace's finished runs (~140 in a busy e2e `-ci`,
        # ~400 KB each) used to be downloaded and parsed on every poll: 375-590 MiB of kubectl
        # and jq, enough to starve a small system node when ~20 of these ran at once
        # (dev e2e, PRD kaos#1911). Nothing below reads a finished workflow from this list;
        # kl_last_try, which needs the finished attempts, asks for just those.
        if ! INFLIGHT=$(kubectl get workflows -n "{{`{{workflow.namespace}}`}}" -l 'workflows.argoproj.io/completed!=true' -o json 2>&1); then
          [ "$FORCE" = "true" ] && not_yet "cannot list workflows (${INFLIGHT})"
          echo "reconcile: WARN cannot list workflows - in-flight state unknown, skipping this poll: ${INFLIGHT}"
          printf 'false' > /tmp/needs_build
          printf '' > /tmp/head_sha
          exit 0
        fi
        # Scoped to THIS app (as ci-reconcile is): every app of a project shares
        # {project}-ci, so a namespace-wide count let one app's stuck build starve
        # every other app's reconcile (e2e-suite-ml-jq4vp, 2026-10-07: yolo never
        # built behind mlci's). app_name is on webhook and reconciled builds alike.
        APP="{{`{{workflow.parameters.app_name}}`}}"
        # Builds of this app that are not finished. A build is QUEUED on the app's
        # mutex when its workflow is Pending, or (ml-ci-build takes the lock on
        # its ml-ci-run-locked node, after a probe) Running with a node Pending
        # on "Waiting for ... lock": it has started nothing. Any other Running
        # build holds the lock or is a render-only run that takes none.
        COUNTS=$(echo "$INFLIGHT" | jq -r --arg app "$APP" '
          [.items[] | select((.metadata.name|startswith("ml-ci-build"))
                             and ([.spec.arguments.parameters[]? | select(.name=="app_name") | .value] | index($app)))
                    | if (.status.phase == "Pending" or .status.phase == null
                          or ([.status.nodes[]? | select(.phase == "Pending" and ((.message // "") | test("Waiting for .*lock")))] | length) > 0)
                      then "Queued" else .status.phase end] as $p
          | "\([$p[] | select(. == "Running" or . == "Queued")] | length) \([$p[] | select(. == "Running")] | length)"')
        ACTIVE=${COUNTS% *}
        RUNNING=${COUNTS#* }
        MODE="{{`{{inputs.parameters.mode}}`}}"
        if [ "$MODE" = "await" ]; then
          : # waits for inputs only; a build in flight is decide mode's lock to wait on
        elif [ "$RETRY" = "true" ]; then
          # decide mode holds the build mutex, so a Running build here is a run
          # that takes no lock (a probe, or a render-only run that may render the
          # context this trigger is for) or a lock handed over between the list
          # and now: wait it out. Builds merely QUEUED behind us are not a reason
          # to wait; they run after this step.
          [ "${RUNNING:-0}" != "0" ] && not_yet "build running outside the build lock (${RUNNING} running ml-ci-build workflow(s) for ${APP})"
        elif [ "${ACTIVE:-0}" != "0" ]; then
          echo "reconcile: build already in flight (${ACTIVE} active ml-ci-build workflow(s) for ${APP}) - skipping submit this poll"
          printf 'false' > /tmp/needs_build
          printf '' > /tmp/head_sha
          exit 0
        fi
        # Fail LOUDLY if a tool is still missing rather than silently treating an
        # unreadable baseline as drift — that is what turned a missing binary
        # into a build storm instead of a red workflow (live 2026-07-16).
        for t in kubectl curl jq; do
          command -v "$t" >/dev/null || { echo "FATAL: $t missing from this image"; exit 1; }
        done
        TOKEN=$(cat /etc/github-token/token)
        APP="{{`{{workflow.parameters.app_name}}`}}"
        PROJECT="{{`{{workflow.parameters.project_name}}`}}"
        BRANCH="{{`{{workflow.parameters.branch}}`}}"
        NS="{{`{{workflow.parameters.ci_namespace}}`}}"

        # The app's source repo is named the way the githubapp composition names
        # it: {project}-{app}, in this cluster's GitHub org. repo_url is empty on
        # the CronWorkflow (the webhook path fills it from the event payload), so
        # derive owner/repo here. The owner was hardcoded to novelcore, so in any
        # other org every poll read a repo that does not exist and skipped: the
        # reconciler silently never ran (kubecore-operator#1347, kaos-io).
        ORG="{{ .Values.github.org }}"
        case "{{`{{workflow.parameters.repo_url}}`}}" in
          https://*)
            SLUG=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed -E 's|https://github.com/||; s|\.git$||') ;;
          *)
            SLUG="${ORG}/${PROJECT}-${APP}" ;;
        esac
        echo "reconcile: polling ${SLUG}@${BRANCH}"

        HEAD_SHA=$(curl -sf -H "Authorization: Bearer ${TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${SLUG}/commits/${BRANCH}" | jq -r '.sha // empty')
        if [ -z "$HEAD_SHA" ]; then
          # A transient API failure must NOT look like drift and storm builds.
          # force: at app creation the repo may not exist yet.
          [ "$FORCE" = "true" ] && not_yet "could not read HEAD for ${SLUG}@${BRANCH}"
          echo "reconcile: could not read HEAD for ${SLUG}@${BRANCH} — skipping this poll"
          printf 'false' > /tmp/needs_build
          printf '' > /tmp/head_sha
          exit 0
        fi

        # SAME COMMIT IN FLIGHT (PRD novelcore/kaos#1911, chart 0.17.3): on every path but the forced
        # one (it has its own QUEUED check below, which also weighs a kaos-lib pin), a build of this
        # app for THIS commit that is not finished (Pending, Running, or waiting on the build lock)
        # is the build this run would submit: it reads the context, engine, catalog and kaos-lib as
        # they are when it starts. Submitting another one only queues a duplicate on the app's
        # `{app}-build` mutex (live: ten ml-ci-build-reconciled-* for one commit in 55 minutes, each
        # re-posting kubecore-ml-ci=pending while the push build waited). A build of another commit
        # does not count. A drift newer than a build that is already RUNNING is not lost: the hourly
        # poll (and a dataset event, which waits that build out above) decides again once it ends.
        if [ "$FORCE" != "true" ]; then
          SAME=$(echo "$INFLIGHT" | jq -r --arg app "$APP" --arg sha "$HEAD_SHA" '
            [.items[] | select((.metadata.name|startswith("ml-ci-build"))
                               and (.status.phase != "Succeeded" and .status.phase != "Failed" and .status.phase != "Error")
                               and ([.spec.arguments.parameters[]? | select(.name=="app_name") | .value] | index($app))
                               and ([.spec.arguments.parameters[]? | select(.name=="commit_sha") | .value] | index($sha)))
                      | .metadata.name] | first // empty')
          if [ -n "$SAME" ]; then
            printf 'false' > /tmp/needs_build
            echo "reconcile: a build of ${HEAD_SHA:0:7} is already queued or running (${SAME}) - submitting nothing"
            exit 0
          fi
        fi

        # The images ConfigMap lives in the ML namespace (ml-{project}), NOT the
        # CI namespace. Reading the wrong one finds no baseline every time and
        # resubmits a build every 3 minutes — a storm, not a backstop.
        ML_NS="{{`{{workflow.parameters.ml_namespace}}`}}"
        [ -n "$ML_NS" ] || ML_NS="ml-${PROJECT}"
        # Distinguish "no baseline recorded yet" (a real first-run) from "the
        # read failed" (RBAC/API blip). Treating a FAILED read as no-baseline is
        # what storms: it looks like drift on every poll.
        if ! CM=$(kubectl get configmap "${APP}-pipeline-images" -n "${ML_NS}" -o json 2>&1); then
          # PRD-1124 D-07 (kubecore-operator#1124 AC-09): a clean NotFound is
          # NOT "unknown state" — it is the NAMESPACE-DRIFT shape. The operator
          # (re)targeted the app at another ML namespace (dedicated app env,
          # renamed env) and the WFT followed the context, but the ConfigMap
          # seeded by the composition stayed in the OLD namespace. Every submit
          # in ML_NS then dies on the missing ConfigMap while this poll skipped
          # forever (live gke-dev/prd1124yolo 2026-08-27). Confirm against the
          # gitops manifest before acting: only when it declares a DIFFERENT
          # namespace is a reconcile build (patch-images + render-hera) the
          # cure. Any other read failure, or an unreadable gitops file, still
          # skips — unknown must never mean "submit work".
          case "${CM}" in
            *NotFound*)
              GORG="{{ .Values.github.org }}"
              GREPO="{{`{{workflow.parameters.gitops_repository}}`}}"
              GBRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
              IMAGES_REL="$(dirname "{{`{{workflow.parameters.workflow_template_path}}`}}")/pipeline-images.yaml"
              GITOPS_NS=$(curl -sf -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/${GORG}/${GREPO}/contents/${IMAGES_REL}?ref=${GBRANCH}" \
                | sed -n 's/^  namespace: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' | head -1)
              if [ -z "${GITOPS_NS}" ]; then
                echo "reconcile: WARN ${ML_NS}/${APP}-pipeline-images absent and gitops ${IMAGES_REL} unreadable — skipping this poll"
              elif [ "${GITOPS_NS}" != "${ML_NS}" ]; then
                printf 'true' > /tmp/needs_build
                printf '%s' "$HEAD_SHA" > /tmp/head_sha
                echo "reconcile: NAMESPACE DRIFT — gitops pins ${APP}-pipeline-images to '${GITOPS_NS}' but the app now runs in '${ML_NS}'; submitting ml-ci-build to relocate it"
                exit 0
              else
                # force: a new app's pipeline-images is still syncing.
                [ "$FORCE" = "true" ] && not_yet "${ML_NS}/${APP}-pipeline-images absent, gitops already targets '${ML_NS}' (ArgoCD sync pending)"
                echo "reconcile: ${ML_NS}/${APP}-pipeline-images absent but gitops already targets '${ML_NS}' — waiting for ArgoCD; skipping this poll"
              fi
              ;;
            *)
              echo "reconcile: cannot read ${ML_NS}/${APP}-pipeline-images — skipping this poll: ${CM}"
              ;;
          esac
          printf 'false' > /tmp/needs_build
          printf '' > /tmp/head_sha
          exit 0
        fi
        LAST=$(echo "$CM" | jq -r '.data["last-built-sha"] // empty')
        echo "reconcile: ${ML_NS}/${APP}-pipeline-images head=${HEAD_SHA} last-built=${LAST:-<none>}"
        printf '%s' "$HEAD_SHA" > /tmp/head_sha

        # The gitops pipeline-context.yaml the build renders from, and the
        # engine it pins: the two inputs of a render besides the commit. gitops_ctx_sha prints the sha256 of the file's raw bytes (what
        # the render records as context-sha), or nothing when it is unreadable
        # or empty.
        GORG="{{ .Values.github.org }}"; GREPO="{{`{{workflow.parameters.gitops_repository}}`}}"; GBRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        CTX_REL="$(dirname "{{`{{workflow.parameters.workflow_template_path}}`}}")/pipeline-context.yaml"
        gitops_ctx_sha() {
          _cs=$(curl -sf -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GORG}/${GREPO}/contents/${CTX_REL}?ref=${GBRANCH}" | sha256sum | cut -c1-64)
          [ "$_cs" = "$(printf '' | sha256sum | cut -c1-64)" ] || printf '%s' "$_cs"
        }
        CTX_LAST=$(echo "$CM" | jq -r '.data["context-sha"] // empty')
        # ENGINE (PRD-HPC-1461 D-80): the engine the gitops context pins (ENG_WANT), and what the gitops
        # pipeline-images records of the last engine run: the engine the render ran with (ENG_HAVE), the
        # engine the compose image was built on (ENG_COMPOSE), the context the render consumed
        # (ENG_CTX) and the last failed attempt, <engine version>@<epoch> (ENG_ATTEMPT). Gitops is read,
        # not the live ConfigMap: that trails gitops by an ArgoCD sync, and a render already pushed must
        # not be submitted again. ENG_KNOWN stays empty when gitops is unreadable: unknown never
        # submits work.
{{ include "kubecore-ci-workflows.engineScript" . | indent 8 }}
        IMAGES_REL="$(dirname "{{`{{workflow.parameters.workflow_template_path}}`}}")/pipeline-images.yaml"
        ENG_WANT=""; ENG_KNOWN=""; ENG_HAVE=""; ENG_COMPOSE=""; ENG_CTX=""; ENG_ATTEMPT=""
        if curl -sf -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github.raw" \
             "https://api.github.com/repos/${GORG}/${GREPO}/contents/${CTX_REL}?ref=${GBRANCH}" > /tmp/engine-context.yaml; then
          ENG_WANT=$(python3 -I /tmp/engine.py version --context /tmp/engine-context.yaml 2>/dev/null || true)
        fi
        if curl -sf -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github.raw" \
             "https://api.github.com/repos/${GORG}/${GREPO}/contents/${IMAGES_REL}?ref=${GBRANCH}" > /tmp/gitops-images.yaml; then
          ENG_KNOWN=yes
          ENG_HAVE=$(yq e '.data."engine-version" // ""' /tmp/gitops-images.yaml)
          ENG_COMPOSE=$(yq e '.data."engine-compose" // ""' /tmp/gitops-images.yaml)
          ENG_CTX=$(yq e '.data."context-sha" // ""' /tmp/gitops-images.yaml)
          ENG_ATTEMPT=$(yq e '.data."engine-attempt" // ""' /tmp/gitops-images.yaml)
        fi
        # OLD APP GUARD (PRD novelcore/kaos#1911 AC-01, T-05): the last build of this app was refused
        # because the app was made before the current pipelines, and it recorded engine-attempt as
        # <engine version>@<epoch>@<commit>@<kaos-lib>. While HEAD is that commit and the gitops context
        # still pins that engine and delivers that kaos-lib, another build reads exactly what the refused
        # one read and is refused again: nothing is submitted, by the poll or by a forced run. The app's
        # next push, a new engine or another kaos-lib is tried at once. The refused build reported what
        # to change on the commit; this run only says why it submits nothing.
        old_app_guard() {
          [ -n "$ENG_ATTEMPT" ] && [ -s /tmp/engine-context.yaml ] || return 0
          if python3 -I /tmp/engine.py refused --context /tmp/engine-context.yaml --commit "$HEAD_SHA" --attempt "$ENG_ATTEMPT"; then
            printf 'false' > /tmp/needs_build
            echo "reconcile: OLD APP — commit ${HEAD_SHA} was refused by engine ${ENG_WANT}: the app was made before the current pipelines. {{ include "kubecore-ci-workflows.oldAppNotice" . }} Its build reported it on the commit. Nothing is submitted until the app is pushed to, or the engine or the kaos-lib the platform delivers changes"
            exit 0
          fi
        }

        # KAOS-LIB (PRD novelcore/kaos#1147; PRD novelcore/kaos#1911 for the forced run below): the spec
        # the gitops context delivers (KL_WANT), whether it is the app's OWN pin (KL_PINNED: the
        # operator writes kaosLib.pinned: true only for a spec.ml.kaosLib pin), and the attempt guard
        # (one attempt per spec per hour): kl_last_try REF prints the newest finished
        # ml-ci-reconcile build for that spec that ended within the hour, "" when none.
{{ include "kubecore-ci-workflows.kaosLibScript" . | indent 8 }}
        KL_WANT=""; KL_PINNED=""; KL_CTX_READ=no
        if curl -sf -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github.raw" \
             "https://api.github.com/repos/${GORG}/${GREPO}/contents/${CTX_REL}?ref=${GBRANCH}" > /tmp/kl-context.yaml; then
          KL_CTX_READ=yes
          KL_WANT=$(python3 -I /tmp/kaos-lib.py context --context /tmp/kl-context.yaml 2>/dev/null || true)
          KL_PINNED=$(python3 -I /tmp/kaos-lib.py pinned --context /tmp/kl-context.yaml 2>/dev/null || true)
        fi
        KL_HAVE=$(echo "$CM" | jq -r '.data["kaos-lib-package"] // empty')
        kl_last_try() {
          # the finished attempts of this spec for this app only, selected server-side
          kubectl get workflows -n "{{`{{workflow.namespace}}`}}" \
              -l "platform.kubecore.io/app=${APP},platform.kubecore.io/submitted-by=ml-ci-reconcile,platform.kubecore.io/kaos-lib=${1}" \
              -o json 2>/dev/null | jq -r --arg app "$APP" --arg ref "$1" '
            [.items[]
             | select((.metadata.labels // {})["platform.kubecore.io/app"] == $app
                      and (.metadata.labels // {})["platform.kubecore.io/submitted-by"] == "ml-ci-reconcile"
                      and (.metadata.labels // {})["platform.kubecore.io/kaos-lib"] == $ref
                      and (.status.phase == "Succeeded" or .status.phase == "Failed" or .status.phase == "Error"))
             | {name: .metadata.name, phase: .status.phase,
                age: (now - ((.status.finishedAt // .metadata.creationTimestamp // "")
                             | try fromdateiso8601 catch now))}
             | select(.age < 3600)]
            | sort_by(.age) | first
            | if . == null then "" else "\(.name) (\(.phase), \(.age | floor)s ago)" end' 2>&1 || echo "unreadable"
        }

        if [ "$FORCE" = "true" ]; then
          WANT_CTX="{{`{{workflow.parameters.context_sha}}`}}"
          HAVE_CTX=""
          if [ -n "$WANT_CTX" ]; then
            HAVE_CTX=$(gitops_ctx_sha)
            [ "$HAVE_CTX" = "$WANT_CTX" ] || not_yet "gitops ${CTX_REL} is not the context this trigger is for yet (${HAVE_CTX:0:12} != ${WANT_CTX:0:12})"
          fi
          old_app_guard
          # KAOS-LIB PIN (PRD novelcore/kaos#1911): the context this trigger is for delivers the app's
          # OWN pin (spec.ml.kaosLib; the operator marks it kaosLib.pinned) and the images do not have
          # it. The client changed this app on purpose, so its images are rebuilt now, not at the next
          # hourly poll and not only if the app was used lately. A platform-wide move (no pin mark)
          # is NOT decided here: it stays with the hourly poll's pacing (KAOS-LIB DRIFT below), or
          # every app would rebuild at once. What the images have is read from gitops (the build
          # records kaos-lib-package there when it ends; the live ConfigMap trails by an ArgoCD
          # sync, which would submit the rebuild twice); unreadable or unrecorded gitops is unknown
          # and never submits work, "none" (no Dockerfile declares the ARG) has nothing to rebuild.
          PIN_REF=""
          if [ "$KL_PINNED" = "true" ] && [ -n "$KL_WANT" ] && [ -n "$ENG_KNOWN" ]; then
            PIN_HAVE=$(yq e '.data."kaos-lib-package" // ""' /tmp/gitops-images.yaml)
            if [ "$PIN_HAVE" = "none" ]; then
              echo "reconcile: kaos-lib pin ${KL_WANT} delivered, but no step Dockerfile declares ARG KAOS_LIB_PACKAGE — nothing the platform can rebuild"
            elif [ "$PIN_HAVE" = "$KL_WANT" ]; then
              echo "reconcile: kaos-lib pin in sync (${KL_WANT})"
            else
              PIN_TRY=$(kl_last_try "$(printf '%s' "$KL_WANT" | sha256sum | cut -c1-12)")
              if [ -n "$PIN_TRY" ]; then
                echo "reconcile: KAOS-LIB PIN (${PIN_HAVE:-<unrecorded>} -> ${KL_WANT}) — not rebuilding now: an attempt at this spec ended within the hour: ${PIN_TRY}"
              else
                PIN_REF=$(printf '%s' "$KL_WANT" | sha256sum | cut -c1-12)
              fi
            fi
          fi
          # QUEUED: a build of HEAD is already waiting on the app's build lock
          # (a webhook build created after this run began waiting, or another
          # trigger's build). It starts after this step and renders the context
          # and datasets as they are THEN, so submitting a second one would only
          # queue a duplicate (two syncs fired at once must yield one build).
          # While a pin rebuild is due, only a queued build that rebuilds the pin counts: a push
          # build (it rebuilds a stale step as part of the build) or a reconcile build for this spec.
          QUEUED=$(echo "$INFLIGHT" | jq -r --arg app "$APP" --arg sha "$HEAD_SHA" --arg ref "$PIN_REF" '
            [.items[] | select((.metadata.name|startswith("ml-ci-build"))
                               and (.status.phase == "Pending" or .status.phase == null
                                    or ([.status.nodes[]? | select(.phase == "Pending" and ((.message // "") | test("Waiting for .*lock")))] | length) > 0)
                               and ([.spec.arguments.parameters[]? | select(.name=="app_name") | .value] | index($app))
                               and ([.spec.arguments.parameters[]? | select(.name=="commit_sha") | .value] | index($sha))
                               and ($ref == ""
                                    or ([.spec.arguments.parameters[]? | select(.name=="event_type") | .value] | index("reconcile") | not)
                                    or ((.metadata.labels // {})["platform.kubecore.io/kaos-lib"] == $ref)))
                      | .metadata.name] | first // empty')
          if [ -n "$QUEUED" ]; then
            printf 'false' > /tmp/needs_build
            echo "reconcile: FORCED but ${QUEUED} already queues a build of HEAD ${HEAD_SHA}; it renders from the current context when it starts — nothing to submit"
            exit 0
          fi
          if [ -n "$PIN_REF" ]; then
            printf '%s' "$PIN_REF" > /tmp/kaos_lib_ref
            printf 'true' > /tmp/needs_build
            echo "reconcile: KAOS-LIB PIN — the images have kaos-lib ${PIN_HAVE:-<unrecorded>} but the app pins ${KL_WANT}; submitting ml-ci-build to rebuild and re-render now"
            exit 0
          fi
          # ALREADY SATISFIED: the force exists because the webhook build of
          # HEAD may predate the context or engine this trigger is for. When
          # the last build IS HEAD and its render recorded the context-sha now
          # in gitops (and the trigger's, when it names one) and the engine the
          # context pins, that render used exactly the inputs a forced build would:
          # it would rebuild the same SHA and render the same WFT. Live, kaos
          # e2e a3c48d99 (2026-10-19): every ML app's first commit was built
          # twice — the creation ci-sync waited out the webhook build (exit 3)
          # and then submitted an identical rebuild (mlci be439bd2, hera
          # 47887e3d twice, yolo 626086d3, e2e-pcon fdc53f6b: 5 wasted builds),
          # each opening a second GitHub Deployment for an already-reported SHA
          # that sat in_progress for ~3 min. Anything unknown (no last-built-sha,
          # no context-sha or engine-version recorded, gitops unreadable) is NOT
          # satisfied and forces as before: unknown must never suppress the
          # first render of a new app.
          if [ -n "$LAST" ] && [ "$LAST" = "$HEAD_SHA" ]; then
            [ -n "$HAVE_CTX" ] || HAVE_CTX=$(gitops_ctx_sha)
            if [ -n "$CTX_LAST" ] && [ -n "$HAVE_CTX" ] && [ "$CTX_LAST" = "$HAVE_CTX" ] \
               && { [ -z "$WANT_CTX" ] || [ "$CTX_LAST" = "$WANT_CTX" ]; } \
               && [ -n "$ENG_WANT" ] && [ "$ENG_HAVE" = "$ENG_WANT" ] && [ "$ENG_COMPOSE" = "$ENG_WANT" ]; then
              printf 'false' > /tmp/needs_build
              echo "reconcile: FORCED but already satisfied — HEAD ${HEAD_SHA} built and rendered from the current context (${CTX_LAST:0:12}) by engine ${ENG_WANT}; nothing to do"
              exit 0
            fi
            echo "reconcile: HEAD ${HEAD_SHA} is built, but its render is not proven current (context-sha ${CTX_LAST:-<none>} vs gitops ${HAVE_CTX:-<unreadable>}, engine-version ${ENG_HAVE:-<none>} vs context ${ENG_WANT:-<none>})"
          fi
          printf 'true' > /tmp/needs_build
          echo "reconcile: FORCED — app created or its platform context changed; submitting ml-ci-build to (re)render"
          exit 0
        fi

        old_app_guard
        if [ "$LAST" != "$HEAD_SHA" ]; then
          printf 'true' > /tmp/needs_build
          echo "reconcile: COMMIT DRIFT — a push was never built (dropped webhook?); submitting ml-ci-build"
          exit 0
        fi

        # ENGINE ATTEMPT GUARD (PRD-HPC-1461 D-80): a build that failed in the engine (render, enhance or
        # the compose image) recorded engine-attempt = <engine version>@<epoch> in the pipeline-images. A
        # broken engine release fails every render, and a new engine moves the context too (so CONTEXT
        # DRIFT below would fire on every poll): for the SAME engine version, at most one drift re-render
        # per hour. A successful render clears the record; a newer engine release has another version.
        # (The record of an app that was refused for the step contract has two more fields and is held
        # by the OLD APP GUARD above for as long as nothing changes, not for an hour.)
        ATT_VERSION=$(printf '%s' "$ENG_ATTEMPT" | cut -d@ -f1)
        ATT_EPOCH=$(printf '%s' "$ENG_ATTEMPT" | cut -s -d@ -f2)
        case "$ATT_EPOCH" in
          ""|*[!0-9]*) ;;
          *)
            ENG_AGE=$(( $(date +%s) - ATT_EPOCH ))
            if [ -n "$ENG_WANT" ] && [ "$ATT_VERSION" = "$ENG_WANT" ] && [ "$ENG_AGE" -ge 0 ] && [ "$ENG_AGE" -lt 3600 ]; then
              printf 'false' > /tmp/needs_build
              echo "reconcile: ENGINE ATTEMPT GUARD — the build for engine ${ENG_WANT} failed ${ENG_AGE}s ago; not re-rendering before an hour has passed"
              exit 0
            fi
            ;;
        esac

        # CONTEXT DRIFT (kubecore-operator#1158): the platform rewrote the gitops
        # pipeline-context.yaml (compute classes, ml-environment selector, …)
        # but nothing pushed, so the live WFT still carries the old context.
        # Compare the sha256 the last render recorded (context-sha, same raw
        # bytes) with the file now in gitops; a reconcile-submitted build always
        # renders (detect-steps), and with HEAD already built it rebuilds no
        # image. A ConfigMap without context-sha (rendered before 0.12.78) is
        # unknown, and unknown never means "submit work".
        if [ -n "$CTX_LAST" ]; then
          CTX_NOW=$(gitops_ctx_sha)
          if [ -z "$CTX_NOW" ]; then
            echo "reconcile: gitops ${CTX_REL} unreadable — context drift unknown this poll"
          elif [ "$CTX_NOW" != "$CTX_LAST" ] && [ "$CTX_NOW" = "$ENG_CTX" ]; then
            # The render of this context is already pushed to gitops and not synced to the pool yet.
            echo "reconcile: gitops ${CTX_REL} changed (${CTX_LAST:0:12} -> ${CTX_NOW:0:12}) but gitops already carries a render for it — waiting for ArgoCD"
          elif [ "$CTX_NOW" != "$CTX_LAST" ]; then
            printf 'true' > /tmp/needs_build
            echo "reconcile: CONTEXT DRIFT — gitops ${CTX_REL} changed since the last render (${CTX_LAST:0:12} -> ${CTX_NOW:0:12}); submitting ml-ci-build to re-render"
            exit 0
          fi
        fi

        # ENGINE DRIFT (PRD-HPC-1461 D-80): the engine is platform code the operator pins in the gitops
        # context, and moving the pin is how a fix reaches every app — with no push. The render and the
        # compose-and-validate image each record the engine they ran on (engine-version, engine-compose in
        # the gitops pipeline-images); either one differing from the context's engine.version is a build
        # to submit. It re-renders and rebuilds the compose image only: detect-steps rebuilds no other
        # image. Unknown (an unreadable context or pipeline-images, a context with no engine) is never
        # drift. The one-attempt-per-hour guard for a failing engine is above.
        if [ -n "$ENG_WANT" ] && [ -n "$ENG_KNOWN" ] && { [ "$ENG_HAVE" != "$ENG_WANT" ] || [ "$ENG_COMPOSE" != "$ENG_WANT" ]; }; then
          printf 'true' > /tmp/needs_build
          echo "reconcile: ENGINE DRIFT — the render ran on engine ${ENG_HAVE:-<unrecorded>} and the compose image on ${ENG_COMPOSE:-<unrecorded>} but the platform pins ${ENG_WANT}; submitting ml-ci-build to re-render"
          exit 0
        fi

        # KAOS-LIB DRIFT (PRD novelcore/kaos#1147): the kaos-lib version the
        # step images install is chosen by the platform, not the app repo. The
        # operator writes it into the gitops pipeline-context (kaosLib.spec),
        # with no push, and holds an app whose desired version is outside its
        # compat range at the spec it was built with, so a spec here that the
        # images do not have (kaos-lib-package, recorded by patch-images) is a
        # rebuild to do: the build submitted here rebuilds every step that
        # declares ARG KAOS_LIB_PACKAGE (detect-steps) and re-renders. Nothing
        # delivered, or an app whose Dockerfiles declare no ARG ("none"), is
        # not drift. The same one-attempt-per-hour idea as the engine guard, per
        # spec: a spec that cannot install fails once an hour, not every poll.
        # (KL_WANT, KL_HAVE and kl_last_try are read above, before the forced-run branch.)
        [ "$KL_CTX_READ" = yes ] || echo "reconcile: gitops ${CTX_REL} unreadable — kaos-lib drift unknown this poll"
        if [ -z "$KL_WANT" ]; then
          :
        elif [ "$KL_HAVE" = "none" ]; then
          echo "reconcile: kaos-lib ${KL_WANT} delivered, but no step Dockerfile declares ARG KAOS_LIB_PACKAGE — nothing the platform can rebuild"
        elif [ "$KL_HAVE" = "$KL_WANT" ]; then
          echo "reconcile: kaos-lib in sync (${KL_WANT})"
        else
          KL_REF=$(printf '%s' "$KL_WANT" | sha256sum | cut -c1-12)
          LAST_TRY=$(kl_last_try "$KL_REF")
          if [ -n "$LAST_TRY" ]; then
            echo "reconcile: KAOS-LIB DRIFT (${KL_HAVE:-<unrecorded>} -> ${KL_WANT}) — not rebuilding this poll: an attempt at this spec ended within the hour: ${LAST_TRY}"
          else
            # ON-DEMAND REBUILD + BACKGROUND TRICKLE. A kaos-lib pin move makes every
            # app STALE; it must not rebuild the fleet at once (HPC lab 2026-11-10:
            # 8 kaniko builds queued 40+ min). A stale app keeps running on the
            # images it has (kaos-lib is compatible within a minor: the operator
            # holds an app whose desired version leaves its compat range) and is
            # rebuilt when it is USED: a push rebuilds it as part of the build
            # (detect-steps), and a pipeline run seen here within hotSeconds queues
            # the rebuild at once ("run on the old image, rebuild after"). A
            # recently used app (idleSeconds) is rebuilt in the background, ONE at a
            # time per project, and an idle or never-run app only when used. Every
            # rebuild is paced by the project's build semaphore. Unknown use (the
            # runs cannot be listed) is never a reason to rebuild.
            # A run counts as use in either shape: the label the Argo server puts on a
            # run submitted from the template (cheap, server-side selector), or a
            # Workflow object whose spec.workflowTemplateRef.name is the app's template
            # (the platform console and gateway create runs that way, with no label).
            # The labelled list is read first; the namespace's full list (it can hold
            # thousands of finished runs) is read, in pages, only when that did not already show a
            # hot run, because a newer unlabelled run cannot change a hot answer.
            HOT={{ int (.Values.ci.kaosLibRebuild.hotSeconds | default 86400) }}
            IDLE={{ int (.Values.ci.kaosLibRebuild.idleSeconds | default 2592000) }}
            RUN_AGE_JQ='try ([.items[] | select(($ref == "") or (.spec.workflowTemplateRef.name == $ref)) | .metadata.creationTimestamp | fromdateiso8601] | max | if . == null then "never" else (now - .) | floor end) catch "unknown"'
            USE_LABELLED=$(kubectl get workflows -n "${ML_NS}" -l "workflows.argoproj.io/workflow-template=${APP}-pipeline" -o json 2>/dev/null \
                      | jq -r --arg ref "" "$RUN_AGE_JQ" 2>/dev/null) || USE_LABELLED=unknown
            [ -n "$USE_LABELLED" ] || USE_LABELLED=unknown
            USE_REF=unknown
            USE_REF_NEEDED=1
            case "$USE_LABELLED" in
              ''|*[!0-9]*) ;;
              *) if [ "$USE_LABELLED" -lt "$HOT" ]; then USE_REF_NEEDED=0; fi ;;
            esac
            if [ "$USE_REF_NEEDED" = 1 ]; then
              # Read in pages of 10 and reduced page by page: the memory is one page (~4 MB of
              # JSON), not the namespace's thousand finished runs (a whole-list read was
              # 800 MiB on 150 runs). Same answer as before: the age of the newest match, or
              # never, or unknown when any page cannot be read.
              newest_ref_run() {
                TOK=""; BEST=""
                while :; do
                  PAGE=$(kubectl get --raw "/apis/argoproj.io/v1alpha1/namespaces/${ML_NS}/workflows?limit=10${TOK:+&continue=${TOK}}" 2>/dev/null) || { echo unknown; return 0; }
                  TS=$(printf '%s' "$PAGE" | jq -r --arg ref "${APP}-pipeline" '[.items[]? | select(.spec.workflowTemplateRef.name == $ref) | .metadata.creationTimestamp | fromdateiso8601] | max // empty' 2>/dev/null) || { echo unknown; return 0; }
                  if [ -n "$TS" ] && { [ -z "$BEST" ] || [ "$TS" -gt "$BEST" ]; }; then BEST=$TS; fi
                  TOK=$(printf '%s' "$PAGE" | jq -r '.metadata.continue // empty' 2>/dev/null) || { echo unknown; return 0; }
                  [ -n "$TOK" ] || break
                done
                if [ -z "$BEST" ]; then echo never; else echo $(( $(date +%s) - BEST )); fi
              }
              USE_REF=$(newest_ref_run)
              [ -n "$USE_REF" ] || USE_REF=unknown
            fi
            # the newest run of either shape: a number beats never beats unknown
            USE_RUN=$(printf '%s\n%s\n' "$USE_LABELLED" "$USE_REF" | awk '
              /^[0-9]+$/ { if (!n || $1 + 0 < min + 0) min = $1; n = 1; next }
              $1 == "never" { never = 1 }
              END { if (n) print min; else if (never) print "never"; else print "unknown" }')
            case "$USE_RUN" in
              unknown|never)
                echo "reconcile: KAOS-LIB STALE (${KL_HAVE:-<unrecorded>} -> ${KL_WANT}) — app use: ${USE_RUN}: not rebuilt in the background; it rebuilds when it is next used"
                ;;
              *)
                if [ "$USE_RUN" -ge "$IDLE" ]; then
                  echo "reconcile: KAOS-LIB STALE (${KL_HAVE:-<unrecorded>} -> ${KL_WANT}) — idle ${USE_RUN}s (>= ${IDLE}s): not rebuilt in the background; it rebuilds when it is next used"
                else
                  BUSY=0
                  if [ "$USE_RUN" -ge "$HOT" ]; then
                    # warm: the trickle takes one background rebuild at a time per project
                    BUSY=$(echo "$INFLIGHT" | jq -r '[.items[]
                      | select(((.metadata.labels // {})["platform.kubecore.io/kaos-lib"] // "") != ""
                               and (.status.phase == "Running" or .status.phase == "Pending" or .status.phase == null))] | length')
                  fi
                  if [ "${BUSY:-0}" != "0" ]; then
                    echo "reconcile: KAOS-LIB STALE (${KL_HAVE:-<unrecorded>} -> ${KL_WANT}) — last run ${USE_RUN}s ago: ${BUSY} background kaos-lib rebuild(s) already in flight in this project; next poll"
                  else
                    printf '%s' "$KL_REF" > /tmp/kaos_lib_ref
                    printf 'true' > /tmp/needs_build
                    echo "reconcile: KAOS-LIB DRIFT — the images have kaos-lib ${KL_HAVE:-<unrecorded>} but the platform delivers ${KL_WANT}; the app ran ${USE_RUN}s ago (hot < ${HOT}s); submitting ml-ci-build to rebuild and re-render"
                    exit 0
                  fi
                fi
                ;;
            esac
          fi
        fi

        # The commit is built — but the WFT has a SECOND input the commit says
        # nothing about: pipeline-context (compute classes, endpoints), written
        # by Crossplane from the operator into the ML namespace. When the
        # operator corrects a class budget, the context changes with NO commit,
        # so a commit-only check says "up to date" and the live WFT keeps
        # rendering the old value forever (live 2026-07-16: two apps kept an
        # UNSCHEDULABLE 27Gi for hours after the operator had self-healed their
        # context to 26Gi — only the app I pushed to by hand was correct).
        #
        # Compare the context's default cpu class + its whole-node budget against
        # what the live WFT actually renders (the memory the compose step, which runs
        # on the default cpu class, takes by default: a step gets the machine of its
        # class and the form has no per-step memory field). A mismatch means the WFT predates
        # the current platform data -> rebuild to re-render it. This is
        # self-limiting: once re-rendered the two agree and it goes quiet.
        CTX=$(kubectl get configmap "${APP}-pipeline-context" -n "${ML_NS}" \
          -o jsonpath='{.data.context\.yaml}' 2>/dev/null || true)
        if [ -n "$CTX" ]; then
          WANT=$(echo "$CTX" | sed -n '/^computeClasses:/,/^[a-z]/p' | sed -n '/^  cpu:/,/^  [a-z]/p' \
                 | grep -E '^      memoryGiB:' | head -1 | tr -dc '0-9')
          GOT=$(kubectl get workflowtemplate "${APP}-pipeline" -n "${ML_NS}" -o json 2>/dev/null \
                | jq -r '[.spec.templates[] | select(.name == "compose-and-validate") | .inputs.parameters[]? | select(.name == "mem") | .default] | first // empty' \
                | tr -dc '0-9')
          # Say WHY we could not compare. Silently skipping is how this check
          # disabled itself: the SA could not read the WFT, GOT was empty, the
          # comparison never ran, and two apps kept an unschedulable 27Gi while
          # every poll reported a confident "up to date" (live 2026-07-16).
          if [ -z "$WANT" ]; then
            echo "reconcile: WARN cannot parse the context's cpu budget — context-drift check SKIPPED"
          elif [ -z "$GOT" ]; then
            echo "reconcile: WARN cannot read ${ML_NS}/${APP}-pipeline (RBAC? absent?) — context-drift check SKIPPED"
          elif [ "$WANT" != "$GOT" ]; then
            printf 'true' > /tmp/needs_build
            echo "reconcile: CONTEXT DRIFT — platform says ${WANT}Gi but the live WFT renders ${GOT}Gi; re-rendering"
            exit 0
          else
            echo "reconcile: context in sync (${WANT}Gi)"
          fi

          # PRD-858: the context's mlEnvironment (env-targeted scheduling) is a
          # THIRD input with the same no-commit failure mode — the operator
          # (re)targets an app at an ml environment, the context changes with
          # no push, and a commit-only check leaves the live WFT pinning steps
          # at the OLD environment (or none) forever. Compare the context's env
          # name against the env pin the live WFT actually renders.
          WANT_ENV=$(echo "$CTX" | sed -n '/^mlEnvironment:/,/^[a-z]/p' | sed -n 's/^  name: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' | head -1)
          # A failed WFT read must NOT look like "unpinned" (= drift) — that is
          # the self-triggering-storm shape. Read once, skip loudly on failure;
          # an empty pin from a SUCCESSFUL read is a real "not env-targeted".
          if ! WFT_JSON=$(kubectl get workflowtemplate "${APP}-pipeline" -n "${ML_NS}" -o json 2>&1); then
            echo "reconcile: WARN cannot read ${ML_NS}/${APP}-pipeline — mlEnvironment drift check SKIPPED: ${WFT_JSON}"
          else
            GOT_ENV=$(echo "$WFT_JSON" \
                | jq -r '[.spec.templates[]?.nodeSelector["platform.kubecore.io/environment"] // empty] | map(select(. != "")) | first // empty')
            if [ "$WANT_ENV" != "$GOT_ENV" ]; then
              printf 'true' > /tmp/needs_build
              echo "reconcile: CONTEXT DRIFT — mlEnvironment is '${WANT_ENV:-<none>}' but the live WFT pins '${GOT_ENV:-<none>}'; re-rendering"
              exit 0
            else
              echo "reconcile: mlEnvironment in sync ('${WANT_ENV:-<none>}')"
            fi
          fi
        else
          echo "reconcile: WARN no ${ML_NS}/${APP}-pipeline-context — context-drift check SKIPPED"
        fi

        # DATASET DRIFT (PRD novelcore/kaos#1283 D-05): the dataset pickers are
        # filled from kaos-lake's catalog at render time, so a version released (or a
        # dataset deleted) after the last render is missing from (or still in) the
        # live WFT with no commit and no context change. Compare the digest the
        # last render recorded (dataset-sha) with the catalog now. Unknown never
        # means "submit work": in the hourly poll an unreadable catalog, a context
        # without a lakeFS endpoint, or a pipeline rendered before the record
        # existed is no drift. In a dataset event an unreadable catalog is "not yet"
        # (retried), because the event must not be dropped. "none" = no step of the pipeline declares an input.
{{ include "kubecore-ci-workflows.datasetChoicesScript" . | indent 8 }}
        DS_LAST=$(echo "$CM" | jq -r '.data["dataset-sha"] // empty')
        DS_ENDPOINT=$(echo "${CTX:-}" | sed -n '/^lakefs:/,/^[a-z]/p' | sed -n 's/^  endpoint: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' | head -1)
        if [ "$DS_LAST" = "none" ]; then
          echo "reconcile: no step of the pipeline declares an input — dataset drift does not apply"
        elif [ -z "$DS_LAST" ] && [ "$DATASET_EVENT" != "true" ]; then
          echo "reconcile: no dataset-sha recorded yet (rendered before it existed) — dataset drift unknown this poll"
        elif [ -z "$DS_ENDPOINT" ]; then
          echo "reconcile: WARN no lakeFS endpoint in ${ML_NS}/${APP}-pipeline-context — dataset drift unknown this poll"
        elif ! DS_NOW=$(python3 -I /tmp/dataset-choices.py digest "$DS_ENDPOINT" /var/run/secrets/kaos-lake/token 2>/tmp/dataset-err); then
          # The helper already tried the catalog three times. A dataset event exists because the data
          # store announced a change and has no next poll to catch it up: "not yet" (exit 3, retried
          # every minute) so a catalog that is busy now is read a minute later, never an event dropped.
          # The hourly poll keeps "unknown is no drift".
          [ "$DATASET_EVENT" = "true" ] && not_yet "dataset catalog not read ($(head -c 300 /tmp/dataset-err))"
          echo "reconcile: WARN dataset catalog not read ($(head -c 300 /tmp/dataset-err)) — dataset drift unknown this poll"
        elif [ "$DS_NOW" = "$DS_LAST" ]; then
          echo "reconcile: datasets in sync (${DS_NOW:0:12})"
        else
          # A render that already offers the catalog's datasets may be pushed to
          # gitops and not synced to the pool yet: the live record is behind, the
          # work is done. Only a gitops copy that is behind too is drift.
          DS_IMAGES_REL="$(dirname "{{`{{workflow.parameters.workflow_template_path}}`}}")/pipeline-images.yaml"
          DS_GITOPS=$(curl -sf -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GORG}/${GREPO}/contents/${DS_IMAGES_REL}?ref=${GBRANCH}" \
            | sed -n 's/^  dataset-sha: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' | head -1 || true)
          if [ "$DS_GITOPS" = "$DS_NOW" ]; then
            echo "reconcile: datasets changed (${DS_LAST:-<unrecorded>} -> ${DS_NOW:0:12}) but gitops already carries a render for them — waiting for ArgoCD"
          else
            printf 'true' > /tmp/needs_build
            DS_SHOWN="${DS_LAST:-<unrecorded>}"
            # SHORT PATH: this block is reached only when nothing else drifted (the commit is built, the
            # context and the engine are the ones last rendered, no kaos-lib rebuild is due), so what is
            # left to do is the dataset choices of the form. When the images the committed render
            # references are all built, that is a render-only run: ml-ci-build would take its unlocked
            # render-run for it anyway (no step to build), without the probe, the version, the
            # kaos-lib status and the image record. Anything unknown below sends the run to the full
            # ml-ci-build, as before.
            DS_WFT_REL="{{`{{workflow.parameters.workflow_template_path}}`}}"
            short_path_why() {
              [ "$KL_CTX_READ" = yes ] || { echo "gitops ${CTX_REL} unreadable"; return 0; }
              [ -n "$ENG_KNOWN" ] || { echo "gitops ${IMAGES_REL} unreadable"; return 0; }
              if [ -n "$KL_WANT" ] && [ "$KL_HAVE" != "none" ] && [ "$KL_HAVE" != "$KL_WANT" ]; then
                echo "kaos-lib ${KL_HAVE:-<unrecorded>} -> ${KL_WANT} is not in sync"; return 0
              fi
              curl -sf -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/${GORG}/${GREPO}/contents/${DS_WFT_REL}?ref=${GBRANCH}" > /tmp/gitops-wft.yaml \
                && [ -s /tmp/gitops-wft.yaml ] || { echo "no committed render at ${DS_WFT_REL}"; return 0; }
              DS_KEYS=$(yq e '.. | select(tag == "!!map" and has("configMapKeyRef")) | .configMapKeyRef | select(.name == "'"${APP}"'-pipeline-images") | .key' /tmp/gitops-wft.yaml 2>/dev/null | sort -u) \
                || { echo "the committed render cannot be read"; return 0; }
              [ -n "$DS_KEYS" ] || { echo "the committed render references no image"; return 0; }
              for _k in $DS_KEYS compose-and-validate; do
                case "$(yq e ".data.\"${_k}\" // \"\"" /tmp/gitops-images.yaml)" in
                  ""|*-latest) echo "image ${_k} is not built"; return 0 ;;
                esac
              done
              return 0
            }
            SHORT_WHY=$(short_path_why)
            if [ -z "$SHORT_WHY" ]; then
              printf 'true' > /tmp/render_only
              echo "reconcile: DATASET DRIFT — the live WFT was rendered with datasets ${DS_SHOWN:0:12} but the catalog is now ${DS_NOW:0:12}; nothing else drifted: submitting the render-only ml-ci-dataset-render run"
            else
              echo "reconcile: DATASET DRIFT — the live WFT was rendered with datasets ${DS_SHOWN:0:12} but the catalog is now ${DS_NOW:0:12}; submitting ml-ci-build to re-render (full path: ${SHORT_WHY})"
            fi
            exit 0
          fi
        fi

        printf 'false' > /tmp/needs_build
        echo "reconcile: up to date — commit built and the WFT matches the platform context"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true
      - name: kaos-lake-token
        mountPath: /var/run/secrets/kaos-lake
        readOnly: true
    # This pod's own service-account token for kaos-lake's dataset catalog
    # (DATASET DRIFT): audience-bound, short-lived, read-only use — the same
    # projection as ml-ci-build's hera-enhance-commit.
    volumes:
    - name: kaos-lake-token
      projected:
        sources:
        - serviceAccountToken:
            audience: {{ .Values.kaosLake.workloadAudience | quote }}
            expirationSeconds: 600
            path: token

  - name: submit-build
    inputs:
      parameters:
      - name: commit_sha
      - name: kaos_lib_ref
        value: ""
      - name: render_only
        value: "false"
    resource:
      action: create
      manifest: |
        apiVersion: argoproj.io/v1alpha1
        kind: Workflow
        metadata:
          generateName: ml-ci-build-reconciled-
          namespace: {{`{{workflow.parameters.ci_namespace}}`}}
          labels:
            platform.kubecore.io/app: {{`{{workflow.parameters.app_name}}`}}
            platform.kubecore.io/submitted-by: ml-ci-reconcile
            # The kaos-lib spec (sha256[:12]) this build is for: KAOS-LIB DRIFT's attempt guard.
            platform.kubecore.io/kaos-lib: "{{`{{inputs.parameters.kaos_lib_ref}}`}}"
        spec:
          # entrypoint is on Strict templateReferencing's allowlist. The dataset-only re-render is the
          # same ClusterWorkflowTemplate (same service account, volumes, exit handler) entered at its
          # short render-only template.
          entrypoint: "{{`{{=inputs.parameters.render_only == 'true' ? 'ml-ci-dataset-render' : 'ml-ci-build'}}`}}"
          workflowTemplateRef:
            name: ml-ci-build
            clusterScope: true
          arguments:
            parameters:
            - name: repo_url
              value: "https://github.com/{{ .Values.github.org }}/{{`{{workflow.parameters.project_name}}`}}-{{`{{workflow.parameters.app_name}}`}}.git"
            - name: commit_sha
              value: "{{`{{inputs.parameters.commit_sha}}`}}"
            - name: branch
              value: "refs/heads/{{`{{workflow.parameters.branch}}`}}"
            - name: target_branch
              value: "{{`{{workflow.parameters.branch}}`}}"
            - name: branch_type
              value: "feature"
            - name: app_name
              value: "{{`{{workflow.parameters.app_name}}`}}"
            - name: project_name
              value: "{{`{{workflow.parameters.project_name}}`}}"
            - name: pr_merged
              value: "true"
            - name: event_type
              value: "reconcile"
            - name: image_repository
              value: "{{`{{workflow.parameters.image_repository}}`}}"
            - name: registry_url
              value: "{{`{{workflow.parameters.registry_url}}`}}"
            - name: build_registry_url
              value: "{{`{{workflow.parameters.build_registry_url}}`}}"
            - name: gitops_repository
              value: "{{`{{workflow.parameters.gitops_repository}}`}}"
            - name: gitops_branch
              value: "{{`{{workflow.parameters.gitops_branch}}`}}"
            - name: workflow_template_path
              value: "{{`{{workflow.parameters.workflow_template_path}}`}}"
            - name: node_class
              value: "{{`{{workflow.parameters.node_class}}`}}"
            # true only for the KAOS-LIB DRIFT build (kaos_lib_ref set): every other
            # reconcile-submitted build leaves stale kaos-lib images alone.
            - name: kaos_lib_rebuild
              value: "{{`{{=inputs.parameters.kaos_lib_ref != '' ? 'true' : 'false'}}`}}"
            # true only for the dataset-only re-render: its commit step re-checks, just before it
            # pushes, that no newer commit and no unrecorded build exists (hera-enhance-commit).
            - name: dataset_render
              value: "{{`{{=inputs.parameters.render_only == 'true' ? 'true' : 'false'}}`}}"
