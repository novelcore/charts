{{/*
ml-ci-reconcile — the level-triggered CI backstop (#459).

The k8smlapp composition creates a per-app CronWorkflow ({app}-ci-reconciler,
every 3 min, concurrencyPolicy: Forbid) that invokes THIS template. Until it
existed, every one of those CronWorkflows referenced a missing
ClusterWorkflowTemplate and therefore NEVER FIRED (lastScheduledTime unset on
every app, verified live 2026-07-16) — so the backstop the composition documents
("a dropped push webhook now costs <= 3 min; no build is ever permanently lost")
did not exist at all.

What it does — pure level-triggering, no edge required:

  1. Read the app repo's current HEAD SHA on the dev branch (GitHub API).
  2. Read last-built-sha from the {app}-pipeline-images ConfigMap (the value
     ml-ci-build's patch-images step records after a successful build).
  3. If they differ, submit ml-ci-build for that SHA. If they match, exit — a
     no-op poll costs one API call.

That makes the CI self-healing for the two failure modes that otherwise need a
human: a dropped/failed webhook delivery, and a build that never ran because the
event was lost. It is deliberately NOT a re-render trigger for platform-context
changes — those flow operator -> XR -> composition -> ConfigMap, and the WFT
picks them up on the next build this reconciler submits.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ml-ci-reconcile
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "kubecore-ci-workflows.serviceAccountName" . }}
  entrypoint: ml-ci-reconcile
  # Workflow-level nodeSelector follows the same per-submission CI pool
  # as ml-ci-build's build-push override (PRD-962 F-09 stage 2, ML).
  # node_class's Helm-render-time default is unchanged, so a submission
  # that omits it still resolves to today's fixed kubecorecpu selector.
  # The CI pool is tainted, so without a nodeSelector the reconciler's
  # pods have nowhere to land.
  #
  # kubecore-operator#1067: nodegroup-type alone is not project-scoping —
  # the synthesised CI environment is named the literal string "ci" on
  # EVERY project, so every project's CI pool carries the identical
  # nodegroup-type=ci label and any of them satisfies this selector. Adding
  # platform.kubecore.io/project (a label the node already carries, unique
  # per project) closes that. project_name is a required workflow parameter
  # on ml-ci-reconcile (no fallback), so this key is never emitted empty.
  # System pool, NOT the project's CI pool (kubecore-operator#1126, 2026-08-27):
  # this poll ran every 3 minutes on the scale-to-zero CI pool it was meant to
  # watch, so that pool could never scale to zero — 20 scale-downs / 21 node
  # registrations on gke-dev's CI nodes in one event window, each churn also
  # discarding the node-local kaniko cache. The check needs only kubectl +
  # the GitHub API; it lands where the pending-reaper and autoscaler-healer
  # already run (kubecoresys, via the chart's inherited tolerations). The
  # build it submits still targets the CI pool through node_class.
  nodeSelector:
    platform.kubecore.io/system: "true"
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.workflow.ttlStrategy.secondsAfterCompletion }}
  podGC:
    strategy: {{ .Values.workflow.podGC.strategy }}

  arguments:
    parameters:
    - name: app_name
    - name: project_name
    - name: repo_url
      value: ""
    - name: branch
      value: dev
    - name: ci_namespace
    # ml_namespace: where {app}-pipeline-images (and last-built-sha) actually
    # lives. Empty => derive ml-{project}, the composition's default, so a
    # CronWorkflow rendered before this param existed still works.
    - name: ml_namespace
      value: ""
    - name: image_repository
      value: ""
    - name: registry_url
      value: ""
    - name: build_registry_url
      value: ""
    - name: gitops_repository
    - name: gitops_branch
      value: main
    - name: workflow_template_path
    # Per-submission CI node pool (PRD-962 F-09), threaded into the
    # ml-ci-build Workflow this template submits below via
    # workflowTemplateRef — ml-ci-reconcile has no build pod of its own.
    - name: node_class
      value: {{ .Values.ci.defaultNodeClass | default (dig "platform.kubecore.io/nodegroup-type" "kubecorecpu" .Values.nodeSelector) | quote }}

  volumes:
  - name: github-token
    secret:
      secretName: {{ .Values.github.tokenSecretName }}

  templates:
  - name: ml-ci-reconcile
    steps:
    - - name: check-drift
        template: check-drift
    - - name: submit-build
        template: submit-build
        # Only when HEAD differs from the last SHA we actually built.
        when: "{{`{{steps.check-drift.outputs.parameters.needs_build}}`}} == true"
        arguments:
          parameters:
          - name: commit_sha
            value: "{{`{{steps.check-drift.outputs.parameters.head_sha}}`}}"

  - name: check-drift
    outputs:
      parameters:
      - name: needs_build
        valueFrom:
          path: /tmp/needs_build
      - name: head_sha
        valueFrom:
          path: /tmp/head_sha
    container:
      # google/cloud-sdk:alpine — the chart's existing image for steps that need
      # kubectl (see clusterworkflowtemplate-autoscaler-healer). alpine/git has
      # NO kubectl: the baseline read silently produced "" on every poll, so
      # needs_build was ALWAYS true and this backstop became a build storm
      # (live 2026-07-16, 39 builds). curl + jq are already in this image.
      image: google/cloud-sdk:alpine
      command: [sh, -c]
      args:
      - |
        set -eu
        # kubectl is NOT in the alpine cloud-sdk image; install it (idempotent).
        # Same pattern the autoscaler-healer uses on this same image — the one
        # kubectl-on-cloud-sdk recipe already proven to work in this cluster.
        if ! command -v kubectl >/dev/null 2>&1; then
          gcloud components install kubectl --quiet >/dev/null 2>&1 \
            || apk add --no-cache kubectl >/dev/null 2>&1 \
            || { echo "FATAL: could not install kubectl" >&2; exit 1; }
        fi
        command -v jq >/dev/null 2>&1 || apk add --no-cache jq >/dev/null 2>&1 || true

        # IN-FLIGHT GUARD (kubecore-operator#872): never stack a new build on an
        # unfinished one. When builds cannot complete (live 2026-08-09: regional
        # SSD quota exhausted -> workspace PVCs Pending forever), every tick used
        # to submit ANOTHER build: 43 stacked workflows whose 42 pending/bound
        # 40Gi workspaces themselves held the quota exhausted - a self-sustaining
        # storm. A build already Running/Pending means drift is being handled;
        # skip LOUDLY (never silently - the self-disabling class this template
        # documents). A read failure also skips: unknown state must never mean
        # "submit more work".
        if ! INFLIGHT=$(kubectl get workflows -n "{{`{{workflow.namespace}}`}}"               -o json 2>&1); then
          echo "reconcile: WARN cannot list workflows - in-flight state unknown, skipping this poll: ${INFLIGHT}"
          printf 'false' > /tmp/needs_build
          printf '' > /tmp/head_sha
          exit 0
        fi
        ACTIVE=$(echo "$INFLIGHT" | jq -r '[.items[] | select((.metadata.name|startswith("ml-ci-build")) and (.status.phase=="Running" or .status.phase=="Pending" or .status.phase==null))] | length')
        if [ "${ACTIVE:-0}" != "0" ]; then
          echo "reconcile: build already in flight (${ACTIVE} active ml-ci-build workflow(s)) - skipping submit this poll"
          printf 'false' > /tmp/needs_build
          printf '' > /tmp/head_sha
          exit 0
        fi
        # Fail LOUDLY if a tool is still missing rather than silently treating an
        # unreadable baseline as drift — that is what turned a missing binary
        # into a build storm instead of a red workflow (live 2026-07-16).
        for t in kubectl curl jq; do
          command -v "$t" >/dev/null || { echo "FATAL: $t missing from this image"; exit 1; }
        done
        TOKEN=$(cat /etc/github-token/token)
        APP="{{`{{workflow.parameters.app_name}}`}}"
        PROJECT="{{`{{workflow.parameters.project_name}}`}}"
        BRANCH="{{`{{workflow.parameters.branch}}`}}"
        NS="{{`{{workflow.parameters.ci_namespace}}`}}"

        # The app's source repo is named the way the githubapp composition names
        # it: {project}-{app}. repo_url is empty on the CronWorkflow (the webhook
        # path fills it from the event payload), so derive owner/repo here.
        ORG=$(echo "{{`{{workflow.parameters.gitops_repository}}`}}" | cut -d/ -f1)
        case "{{`{{workflow.parameters.repo_url}}`}}" in
          https://*)
            SLUG=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed -E 's|https://github.com/||; s|\.git$||') ;;
          *)
            SLUG="novelcore/${PROJECT}-${APP}" ;;
        esac
        echo "reconcile: polling ${SLUG}@${BRANCH}"

        HEAD_SHA=$(curl -sf -H "Authorization: Bearer ${TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${SLUG}/commits/${BRANCH}" | jq -r '.sha // empty')
        if [ -z "$HEAD_SHA" ]; then
          # A transient API failure must NOT look like drift and storm builds.
          echo "reconcile: could not read HEAD for ${SLUG}@${BRANCH} — skipping this poll"
          printf 'false' > /tmp/needs_build
          printf '' > /tmp/head_sha
          exit 0
        fi

        # The images ConfigMap lives in the ML namespace (ml-{project}), NOT the
        # CI namespace. Reading the wrong one finds no baseline every time and
        # resubmits a build every 3 minutes — a storm, not a backstop.
        ML_NS="{{`{{workflow.parameters.ml_namespace}}`}}"
        [ -n "$ML_NS" ] || ML_NS="ml-${PROJECT}"
        # Distinguish "no baseline recorded yet" (a real first-run) from "the
        # read failed" (RBAC/API blip). Treating a FAILED read as no-baseline is
        # what storms: it looks like drift on every poll.
        if ! CM=$(kubectl get configmap "${APP}-pipeline-images" -n "${ML_NS}" -o json 2>&1); then
          # PRD-1124 D-07 (kubecore-operator#1124 AC-09): a clean NotFound is
          # NOT "unknown state" — it is the NAMESPACE-DRIFT shape. The operator
          # (re)targeted the app at another ML namespace (dedicated app env,
          # renamed env) and the WFT followed the context, but the ConfigMap
          # seeded by the composition stayed in the OLD namespace. Every submit
          # in ML_NS then dies on the missing ConfigMap while this poll skipped
          # forever (live gke-dev/prd1124yolo 2026-08-27). Confirm against the
          # gitops manifest before acting: only when it declares a DIFFERENT
          # namespace is a reconcile build (patch-images + render-hera) the
          # cure. Any other read failure, or an unreadable gitops file, still
          # skips — unknown must never mean "submit work".
          case "${CM}" in
            *NotFound*)
              GORG="{{ .Values.github.org }}"
              GREPO="{{`{{workflow.parameters.gitops_repository}}`}}"
              GBRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
              IMAGES_REL="$(dirname "{{`{{workflow.parameters.workflow_template_path}}`}}")/pipeline-images.yaml"
              GITOPS_NS=$(curl -sf -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/${GORG}/${GREPO}/contents/${IMAGES_REL}?ref=${GBRANCH}" \
                | sed -n 's/^  namespace: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' | head -1)
              if [ -z "${GITOPS_NS}" ]; then
                echo "reconcile: WARN ${ML_NS}/${APP}-pipeline-images absent and gitops ${IMAGES_REL} unreadable — skipping this poll"
              elif [ "${GITOPS_NS}" != "${ML_NS}" ]; then
                printf 'true' > /tmp/needs_build
                printf '%s' "$HEAD_SHA" > /tmp/head_sha
                echo "reconcile: NAMESPACE DRIFT — gitops pins ${APP}-pipeline-images to '${GITOPS_NS}' but the app now runs in '${ML_NS}'; submitting ml-ci-build to relocate it"
                exit 0
              else
                echo "reconcile: ${ML_NS}/${APP}-pipeline-images absent but gitops already targets '${ML_NS}' — waiting for ArgoCD; skipping this poll"
              fi
              ;;
            *)
              echo "reconcile: cannot read ${ML_NS}/${APP}-pipeline-images — skipping this poll: ${CM}"
              ;;
          esac
          printf 'false' > /tmp/needs_build
          printf '' > /tmp/head_sha
          exit 0
        fi
        LAST=$(echo "$CM" | jq -r '.data["last-built-sha"] // empty')
        echo "reconcile: ${ML_NS}/${APP}-pipeline-images head=${HEAD_SHA} last-built=${LAST:-<none>}"
        printf '%s' "$HEAD_SHA" > /tmp/head_sha

        if [ "$LAST" != "$HEAD_SHA" ]; then
          printf 'true' > /tmp/needs_build
          echo "reconcile: COMMIT DRIFT — a push was never built (dropped webhook?); submitting ml-ci-build"
          exit 0
        fi

        # CONTEXT DRIFT (kubecore-operator#1158): the platform rewrote the gitops
        # pipeline-context.yaml (compute classes, ml-environment selector, …)
        # but nothing pushed, so the live WFT still carries the old context.
        # Compare the sha256 the last render recorded (context-sha, same raw
        # bytes) with the file now in gitops; a reconcile-submitted build always
        # renders (detect-steps), and with HEAD already built it rebuilds no
        # image. A ConfigMap without context-sha (rendered before 0.12.78) is
        # unknown, and unknown never means "submit work".
        CTX_LAST=$(echo "$CM" | jq -r '.data["context-sha"] // empty')
        if [ -n "$CTX_LAST" ]; then
          GORG="{{ .Values.github.org }}"; GREPO="{{`{{workflow.parameters.gitops_repository}}`}}"; GBRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
          CTX_REL="$(dirname "{{`{{workflow.parameters.workflow_template_path}}`}}")/pipeline-context.yaml"
          CTX_NOW=$(curl -sf -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GORG}/${GREPO}/contents/${CTX_REL}?ref=${GBRANCH}" | sha256sum | cut -c1-64)
          if [ -z "$CTX_NOW" ] || [ "$CTX_NOW" = "$(printf '' | sha256sum | cut -c1-64)" ]; then
            echo "reconcile: gitops ${CTX_REL} unreadable — context drift unknown this poll"
          elif [ "$CTX_NOW" != "$CTX_LAST" ]; then
            printf 'true' > /tmp/needs_build
            echo "reconcile: CONTEXT DRIFT — gitops ${CTX_REL} changed since the last render (${CTX_LAST:0:12} -> ${CTX_NOW:0:12}); submitting ml-ci-build to re-render"
            exit 0
          fi
        fi

        # The commit is built — but the WFT has a SECOND input the commit says
        # nothing about: pipeline-context (compute classes, endpoints), written
        # by Crossplane from the operator into the ML namespace. When the
        # operator corrects a class budget, the context changes with NO commit,
        # so a commit-only check says "up to date" and the live WFT keeps
        # rendering the old value forever (live 2026-07-16: two apps kept an
        # UNSCHEDULABLE 27Gi for hours after the operator had self-healed their
        # context to 26Gi — only the app I pushed to by hand was correct).
        #
        # Compare the context's default cpu class + its whole-node budget against
        # what the live WFT actually renders. A mismatch means the WFT predates
        # the current platform data -> rebuild to re-render it. This is
        # self-limiting: once re-rendered the two agree and it goes quiet.
        CTX=$(kubectl get configmap "${APP}-pipeline-context" -n "${ML_NS}" \
          -o jsonpath='{.data.context\.yaml}' 2>/dev/null || true)
        if [ -n "$CTX" ]; then
          WANT=$(echo "$CTX" | sed -n '/^computeClasses:/,/^[a-z]/p' | sed -n '/^  cpu:/,/^  [a-z]/p' \
                 | grep -E '^      memoryGiB:' | head -1 | tr -dc '0-9')
          GOT=$(kubectl get workflowtemplate "${APP}-pipeline" -n "${ML_NS}" -o json 2>/dev/null \
                | jq -r '[.spec.arguments.parameters[] | select(.name|endswith("-mem")) | .value] | first // empty' \
                | tr -dc '0-9')
          # Say WHY we could not compare. Silently skipping is how this check
          # disabled itself: the SA could not read the WFT, GOT was empty, the
          # comparison never ran, and two apps kept an unschedulable 27Gi while
          # every poll reported a confident "up to date" (live 2026-07-16).
          if [ -z "$WANT" ]; then
            echo "reconcile: WARN cannot parse the context's cpu budget — context-drift check SKIPPED"
          elif [ -z "$GOT" ]; then
            echo "reconcile: WARN cannot read ${ML_NS}/${APP}-pipeline (RBAC? absent?) — context-drift check SKIPPED"
          elif [ "$WANT" != "$GOT" ]; then
            printf 'true' > /tmp/needs_build
            echo "reconcile: CONTEXT DRIFT — platform says ${WANT}Gi but the live WFT renders ${GOT}Gi; re-rendering"
            exit 0
          else
            echo "reconcile: context in sync (${WANT}Gi)"
          fi

          # PRD-858: the context's mlEnvironment (env-targeted scheduling) is a
          # THIRD input with the same no-commit failure mode — the operator
          # (re)targets an app at an ml environment, the context changes with
          # no push, and a commit-only check leaves the live WFT pinning steps
          # at the OLD environment (or none) forever. Compare the context's env
          # name against the env pin the live WFT actually renders.
          WANT_ENV=$(echo "$CTX" | sed -n '/^mlEnvironment:/,/^[a-z]/p' | sed -n 's/^  name: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' | head -1)
          # A failed WFT read must NOT look like "unpinned" (= drift) — that is
          # the self-triggering-storm shape. Read once, skip loudly on failure;
          # an empty pin from a SUCCESSFUL read is a real "not env-targeted".
          if ! WFT_JSON=$(kubectl get workflowtemplate "${APP}-pipeline" -n "${ML_NS}" -o json 2>&1); then
            echo "reconcile: WARN cannot read ${ML_NS}/${APP}-pipeline — mlEnvironment drift check SKIPPED: ${WFT_JSON}"
          else
            GOT_ENV=$(echo "$WFT_JSON" \
                | jq -r '[.spec.templates[]?.nodeSelector["platform.kubecore.io/environment"] // empty] | map(select(. != "")) | first // empty')
            if [ "$WANT_ENV" != "$GOT_ENV" ]; then
              printf 'true' > /tmp/needs_build
              echo "reconcile: CONTEXT DRIFT — mlEnvironment is '${WANT_ENV:-<none>}' but the live WFT pins '${GOT_ENV:-<none>}'; re-rendering"
              exit 0
            else
              echo "reconcile: mlEnvironment in sync ('${WANT_ENV:-<none>}')"
            fi
          fi
        else
          echo "reconcile: WARN no ${ML_NS}/${APP}-pipeline-context — context-drift check SKIPPED"
        fi

        printf 'false' > /tmp/needs_build
        echo "reconcile: up to date — commit built and the WFT matches the platform context"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: submit-build
    inputs:
      parameters:
      - name: commit_sha
    resource:
      action: create
      manifest: |
        apiVersion: argoproj.io/v1alpha1
        kind: Workflow
        metadata:
          generateName: ml-ci-build-reconciled-
          namespace: {{`{{workflow.parameters.ci_namespace}}`}}
          labels:
            platform.kubecore.io/app: {{`{{workflow.parameters.app_name}}`}}
            platform.kubecore.io/submitted-by: ml-ci-reconcile
        spec:
          workflowTemplateRef:
            name: ml-ci-build
            clusterScope: true
          arguments:
            parameters:
            - name: repo_url
              value: "https://github.com/novelcore/{{`{{workflow.parameters.project_name}}`}}-{{`{{workflow.parameters.app_name}}`}}.git"
            - name: commit_sha
              value: "{{`{{inputs.parameters.commit_sha}}`}}"
            - name: branch
              value: "refs/heads/{{`{{workflow.parameters.branch}}`}}"
            - name: target_branch
              value: "{{`{{workflow.parameters.branch}}`}}"
            - name: branch_type
              value: "feature"
            - name: app_name
              value: "{{`{{workflow.parameters.app_name}}`}}"
            - name: project_name
              value: "{{`{{workflow.parameters.project_name}}`}}"
            - name: pr_merged
              value: "true"
            - name: event_type
              value: "reconcile"
            - name: image_repository
              value: "{{`{{workflow.parameters.image_repository}}`}}"
            - name: registry_url
              value: "{{`{{workflow.parameters.registry_url}}`}}"
            - name: build_registry_url
              value: "{{`{{workflow.parameters.build_registry_url}}`}}"
            - name: gitops_repository
              value: "{{`{{workflow.parameters.gitops_repository}}`}}"
            - name: gitops_branch
              value: "{{`{{workflow.parameters.gitops_branch}}`}}"
            - name: workflow_template_path
              value: "{{`{{workflow.parameters.workflow_template_path}}`}}"
            - name: node_class
              value: "{{`{{workflow.parameters.node_class}}`}}"
