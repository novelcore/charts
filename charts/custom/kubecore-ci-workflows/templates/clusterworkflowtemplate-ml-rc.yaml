{{/*
ml-ci-rc-build — KubeCore ML pipeline RC ClusterWorkflowTemplate.

Triggered by the per-KubeApp Sensor's rc-trigger (push to refs/heads/rc/*).
Same matrix-build flow as ml-ci-build but:
  - branch_type defaults to "rc" (no PATCH bump),
  - patch-wft is unconditional (we always promote on RC),
  - no source-repo dev tag (RC tags are managed by the human PR flow).

This first revision is intentionally minimal — it reuses the templates
defined in ml-ci-build by referencing them via templateRef, so any future
change to the ml step pipeline lands in both flows. When RC promotion
needs more (kustomize-image bumps, GitHub release creation, issue
filing à la ci-rc-build), enrich here.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ml-ci-rc-build
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "kubecore-ci-workflows.serviceAccountName" . }}
  entrypoint: ml-ci-rc-build
  onExit: exit-handler
  ttlStrategy:
    secondsAfterSuccess: {{ int .Values.workflow.ttlStrategy.secondsAfterSuccess }}
    secondsAfterFailure: {{ int .Values.workflow.ttlStrategy.secondsAfterFailure }}
  # One build per app at a time (kubecore-operator#1126): the project's CI
  # pool is small (default 1 node) and consecutive pushes otherwise spawn
  # concurrent builds of the same app that starve each other's build-push
  # pods. Argo queues the later run until the earlier one completes.
  synchronization:
    mutexes:
    - name: "{{`{{workflow.parameters.app_name}}`}}-build"
  podGC:
    strategy: {{ .Values.workflow.podGC.strategy }}
  # Workflow-level nodeSelector follows the same per-submission CI pool
  # as build-push's override below (PRD-962 F-09 stage 2, ML). node_class's
  # Helm-render-time default is unchanged, so a submission that omits it
  # still resolves to today's fixed kubecorecpu selector — a
  # behavior-preserving parameterization, not a scheduling change, until
  # callers start passing node_class.
  #
  # kubecore-operator#1067: nodegroup-type alone is not project-scoping —
  # the synthesised CI environment is named the literal string "ci" on
  # EVERY project, so every project's CI pool carries the identical
  # nodegroup-type=ci label and any of them satisfies this selector. Adding
  # platform.kubecore.io/project (a label the node already carries, unique
  # per project) closes that. project_name is a required workflow parameter
  # on ml-ci-rc-build (no fallback), so this key is never emitted empty.
  nodeSelector:
    platform.kubecore.io/nodegroup-type: "{{`{{workflow.parameters.node_class}}`}}"
    platform.kubecore.io/project: "{{`{{workflow.parameters.project_name}}`}}"
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.workspace.size | default "5Gi" }}
      {{- with .Values.workspace.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
  volumes:
  - name: github-token
    secret:
      secretName: {{ .Values.github.tokenSecretName }}
  - name: registry-auth
    secret:
      secretName: ci-registry-auth
  arguments:
    parameters:
    - name: repo_url
    - name: commit_sha
    - name: branch
    - name: app_name
    - name: project_name
    - name: image_repository
      value: ""
    - name: registry_url
      value: ""
    # REQUIRED by the borrowed ml-ci-build templates, not by anything defined
    # here: `build-push` and `patch-images` are pulled in by templateRef, and a
    # templateRef borrows the body without its parameter declarations, so their
    # {{`{{workflow.parameters.build_registry_url}}`}} resolves against THIS
    # workflow. Undeclared, it made every ml-ci-rc-build submission invalid --
    # the same defect that broke ci-rc-build, and latent only because k8smlapp
    # declares no rc/* Sensor binding, so nothing submits this template today.
    # Empty is the same default ml-ci-build uses and falls back to registry_url.
    - name: build_registry_url
      value: ""
    - name: gitops_repository
    - name: gitops_branch
      value: "main"
    - name: workflow_template_path
    # Inherit the ml-ci-build defaults so its templates resolve uniformly.
    - name: target_branch
      value: "main"
    - name: branch_type
      value: "rc"
    - name: pr_merged
      value: "true"
    - name: event_type
      value: "rc"
    # Per-submission CI node pool (PRD-962 F-09). The build-push step below
    # is a templateRef into ml-ci-build's own build-push template, whose
    # nodeSelector reads {{`{{workflow.parameters.node_class}}`}} — Argo
    # resolves that against THIS running workflow's parameters, so declaring
    # the parameter here (with the same operator-resolved default) is what
    # makes it apply to ml-ci-rc-build's builds.
    - name: node_class
      value: {{ .Values.ci.defaultNodeClass | default (dig "platform.kubecore.io/nodegroup-type" "kubecorecpu" .Values.nodeSelector) | quote }}

  templates:
  - name: ml-ci-rc-build
    steps:
    # Report pending (with the Argo run URL) BEFORE any work: a stalled RC
    # build is a visible stuck-pending check + in_progress ml-rc Deployment,
    # never silence (#1126 — full GitHub reporting on every pipeline).
    - - name: status-pending
        templateRef:
          name: ml-ci-build
          template: status
          clusterScope: true
        arguments:
          parameters:
          - name: state
            value: "pending"
          - name: description
            value: "ML RC build running in Argo Workflows"
          - name: context
            value: "kubecore-ml-ci/rc"
          - name: environment
            value: "argo-workflows-rc"
    - - name: clone
        templateRef:
          name: ml-ci-build
          template: clone
          clusterScope: true
    - - name: detect-steps
        templateRef:
          name: ml-ci-build
          template: detect-steps
          clusterScope: true
    - - name: version
        templateRef:
          name: ml-ci-build
          template: version
          clusterScope: true
    - - name: build-push
        templateRef:
          name: ml-ci-build
          template: build-push
          clusterScope: true
        when: "{{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true"
        arguments:
          parameters:
          - name: step_name
            value: "{{`{{item.name}}`}}"
          - name: step_path
            value: "{{`{{item.path}}`}}"
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
        withParam: "{{`{{steps.detect-steps.outputs.parameters.changed_steps}}`}}"
    - - name: render-wft
        templateRef:
          name: ml-ci-build
          template: render-wft
          clusterScope: true
        when: "{{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true"
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: changed_steps
            value: "{{`{{steps.detect-steps.outputs.parameters.changed_steps}}`}}"
    - - name: patch-images
        templateRef:
          name: ml-ci-build
          template: patch-images
          clusterScope: true
        when: "{{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true"
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: changed_steps
            value: "{{`{{steps.detect-steps.outputs.parameters.changed_steps}}`}}"
    - - name: status
        templateRef:
          name: ml-ci-build
          template: status
          clusterScope: true
        arguments:
          parameters:
          - name: state
            value: "success"
          - name: description
            value: "ML RC build succeeded"
          - name: context
            value: "kubecore-ml-ci/rc"
          - name: environment
            value: "argo-workflows-rc"

  - name: exit-handler
    steps:
    - - name: post-failure-status
        templateRef:
          name: ml-ci-build
          template: status
          clusterScope: true
        arguments:
          parameters:
          - name: state
            value: "failure"
          - name: description
            value: "ML RC build failed — open the Argo run for the error"
          - name: context
            value: "kubecore-ml-ci/rc"
          - name: environment
            value: "argo-workflows-rc"
        when: "{{`{{workflow.status}}`}} != Succeeded"
    - - name: run-report
        templateRef:
          name: ml-ci-build
          template: report
          clusterScope: true
        arguments:
          parameters:
          - name: pipeline
            value: "ML RC build"
          - name: context
            value: "kubecore-ml-ci/rc"
          - name: environment
            value: "argo-workflows-rc"
