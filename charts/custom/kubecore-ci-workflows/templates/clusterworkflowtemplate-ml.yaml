{{/*
ml-ci-build — KubeCore ML pipeline CI ClusterWorkflowTemplate.

Triggered by the per-KubeApp Sensor created by the k8smlapp composition
(compositions/apis/kubeapp/k8smlapp/composition.yaml, generate-ci-resources
step) on push/PR to a kubeline-* source repo.

Flow:
  clone → detect-steps → version → build-push (matrix) → patch-wft → status

Each ML "step" is a sub-directory in the source repo carrying a Dockerfile;
kubeline.yaml at the repo root declares the step DAG. Only the directories
whose contents changed since HEAD~1 get rebuilt — kubeline.yaml is the
single source of truth for step name → path → compute mapping. After a
successful matrix build, this template clones the gitops repo and `yq`-
patches the corresponding step's container.image in
workflows/{appName}/{branch}/workflow-template.yaml so ArgoCD picks up the
new image on its next sync.

Inputs come from the Sensor (Argo Events). See the Sensor template in the
k8smlapp composition for the full parameter list.

Required secrets in the workflow namespace:
  - {{ .Values.github.tokenSecretName }}  (GitHub App installation token)
  - ci-registry-auth                       (Zot username/password)
*/}}
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ml-ci-build
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "kubecore-ci-workflows.serviceAccountName" . }}
  entrypoint: ml-ci-build
  onExit: exit-handler
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.workflow.ttlStrategy.secondsAfterCompletion }}
  podGC:
    strategy: {{ .Values.workflow.podGC.strategy }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.workspace.size | default "5Gi" }}
      {{- with .Values.workspace.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
  volumes:
  - name: github-token
    secret:
      secretName: {{ .Values.github.tokenSecretName }}
  - name: registry-auth
    secret:
      secretName: ci-registry-auth
  arguments:
    parameters:
    - name: repo_url
    - name: commit_sha
    - name: branch
    - name: target_branch
      value: "dev"
    - name: branch_type
      value: "feature"
    - name: app_name
    - name: project_name
    - name: pr_merged
      value: "false"
    - name: event_type
      value: "push"
    - name: image_repository
      value: ""
    - name: registry_url
      # Registry URL written into the WorkflowTemplate's container.image
      # by patch-wft. Must be a hostname the workload-cluster kubelet can
      # resolve from its host network — typically the NodePort URL
      # (e.g. localhost:30500 if Zot is on a NodePort and we want
      # node-local routing), NOT the in-cluster service DNS.
      value: ""
    - name: build_registry_url
      # Registry URL kaniko pushes layers to (--destination + auth).
      # Must be a hostname the build-push pod can reach from inside
      # the cluster network — typically the in-cluster service DNS
      # (zot.zot-registry.svc.cluster.local:5000). Falls back to
      # registry_url if empty (pre-0.9.7 compatibility).
      value: ""
    - name: gitops_repository
    - name: gitops_branch
      value: "main"
    - name: workflow_template_path

  templates:
  - name: ml-ci-build
    steps:
    - - name: clone
        template: clone
    - - name: detect-steps
        template: detect-steps
    - - name: version
        template: version
    - - name: build-push
        template: build-push
        when: "{{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true"
        arguments:
          parameters:
          - name: step_name
            value: "{{`{{item.name}}`}}"
          - name: step_path
            value: "{{`{{item.path}}`}}"
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
        withParam: "{{`{{steps.detect-steps.outputs.parameters.changed_steps}}`}}"
    - - name: render-wft
        template: render-wft
        when: "{{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true && {{`{{workflow.parameters.pr_merged}}`}} == true && {{`{{workflow.parameters.branch_type}}`}} != chore"
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: changed_steps
            value: "{{`{{steps.detect-steps.outputs.parameters.changed_steps}}`}}"
    - - name: patch-images
        template: patch-images
        when: "{{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true && {{`{{workflow.parameters.pr_merged}}`}} == true && {{`{{workflow.parameters.branch_type}}`}} != chore"
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: changed_steps
            value: "{{`{{steps.detect-steps.outputs.parameters.changed_steps}}`}}"
    - - name: tag
        template: tag
        when: "{{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true && {{`{{workflow.parameters.branch_type}}`}} != chore && {{`{{workflow.parameters.branch_type}}`}} != rc"
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
    - - name: status
        template: status
        arguments:
          parameters:
          - name: state
            value: "success"
          - name: description
            value: "ML build succeeded"

  - name: clone
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')
        # Need at least 2 commits for change detection (HEAD~1 vs HEAD)
        git clone --depth=50 --branch "${BRANCH}" "${REPO_URL}" /workspace/repo
        cd /workspace/repo
        # Explicitly fetch the target commit before checkout. A shallow clone of
        # the branch tip does NOT necessarily contain a specific commit_sha if a
        # newer commit landed on the branch between the webhook firing and this
        # clone running (two quick pushes → the earlier build's commit is no
        # longer in the shallow window → "fatal: unable to read tree <sha>" →
        # exit 128). Fetching the SHA directly makes the checkout deterministic.
        git fetch --depth=50 origin "{{`{{workflow.parameters.commit_sha}}`}}" || true
        git checkout "{{`{{workflow.parameters.commit_sha}}`}}"
        echo "Cloned at $(git rev-parse HEAD)"
        if [ ! -f kubeline.yaml ]; then
          echo "ERROR: kubeline.yaml not found at repo root — required for ML CI"
          exit 1
        fi
        echo "kubeline.yaml found, contents:"
        cat kubeline.yaml
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: detect-steps
    outputs:
      parameters:
      - name: changed_steps
        valueFrom:
          path: /tmp/changed_steps.json
      - name: has_changes
        valueFrom:
          path: /tmp/has_changes
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        # detect-steps needs both git and yq; alpine/git ships with git but no yq.
        # Drop the yq binary in /usr/local/bin (~10MB, no-cache, idempotent).
        if ! command -v yq >/dev/null 2>&1; then
          apk add --no-cache curl >/dev/null
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
        fi
        cd /workspace/repo

        # Diff range — HEAD~1..HEAD when we have a parent, else "all steps"
        if git rev-parse HEAD~1 >/dev/null 2>&1; then
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        else
          CHANGED_FILES=$(git ls-files)
        fi
        echo "Changed files vs HEAD~1:"
        echo "$CHANGED_FILES"

        # #457: a step must be (re)built if EITHER its source changed OR it has
        # no published image yet. detect-steps used to key only on the git diff,
        # so a step whose directory was untouched (typical first push: README /
        # kubeline tweak) was never built — its pipeline-images ConfigMap key
        # stayed at the Crossplane-seeded ":{step}-latest" placeholder, which is
        # never produced by build-push (it always tags {step}-{branch}-v…-{sha}).
        # The first training run then hit ImagePullBackOff on those steps with no
        # signal pointing at CI ("resubmit until every step gets touched").
        #
        # Registry-aware first build: clone the gitops repo, read the
        # pipeline-images.yaml the WFT resolves images from, and treat any step
        # whose key is ABSENT or still ends in "-latest" (placeholder = never
        # built) as changed. Reading the gitops ConfigMap is a reliable proxy for
        # "image exists in the registry" — patch-images writes the versioned tag
        # there only after a successful build+push.
        UNBUILT_STEPS=""
        GITOPS_REPO="{{`{{workflow.parameters.gitops_repository}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        if [ -f /etc/github-token/token ] && [ -n "$GITOPS_REPO" ]; then
          GH_TOKEN=$(cat /etc/github-token/token)
          GITOPS_URL="https://x-access-token:${GH_TOKEN}@github.com/{{ .Values.github.org }}/${GITOPS_REPO}.git"
          if git clone --depth=1 --branch "${GITOPS_BRANCH}" "${GITOPS_URL}" /tmp/gitops 2>/dev/null; then
            # basePath is operator-configured (default "kubeapps") and not passed
            # here, so discover the file (same pattern as render-wft/patch-images).
            IMAGES_PATH=$(find /tmp/gitops -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-images.yaml" | head -1)
            if [ -n "$IMAGES_PATH" ] && [ -f "$IMAGES_PATH" ]; then
              echo "pipeline-images discovered at ${IMAGES_PATH}"
            else
              echo "pipeline-images.yaml not found — treating all steps as unbuilt (first build)"
              IMAGES_PATH=""
              UNBUILT_STEPS="__ALL__"
            fi
          else
            echo "WARN: could not clone gitops repo; skipping registry-aware check"
          fi
        fi

        # Walk each step in kubeline.yaml; emit if its path/* changed OR it has no
        # published image yet (#457).
        STEP_COUNT=$(yq e '.steps | length' kubeline.yaml)
        CHANGED_JSON="[]"
        i=0
        while [ "$i" -lt "$STEP_COUNT" ]; do
          STEP_NAME=$(yq e ".steps[$i].name" kubeline.yaml)
          STEP_PATH=$(yq e ".steps[$i].path" kubeline.yaml)

          REASON=""
          if echo "$CHANGED_FILES" | grep -qE "^${STEP_PATH}/"; then
            REASON="source changed"
          elif [ "$UNBUILT_STEPS" = "__ALL__" ]; then
            REASON="no pipeline-images (first build)"
          elif [ -n "${IMAGES_PATH:-}" ]; then
            # ConfigMap key value for this step; absent → null. A value still
            # ending in "-latest" is the seeded placeholder = never built.
            CUR_IMAGE=$(yq e ".data.\"${STEP_NAME}\" // \"\"" "$IMAGES_PATH")
            case "$CUR_IMAGE" in
              ""|*-latest) REASON="image unbuilt (${CUR_IMAGE:-missing})" ;;
            esac
          fi

          if [ -n "$REASON" ]; then
            CHANGED_JSON=$(echo "$CHANGED_JSON" | yq e -o=json '. + [{"name":"'"$STEP_NAME"'","path":"'"$STEP_PATH"'"}]' -)
            echo "step changed: $STEP_NAME ($STEP_PATH) — ${REASON}"
          fi
          i=$((i + 1))
        done

        # Compact JSON for withParam
        echo "$CHANGED_JSON" | yq e -o=json -I=0 - > /tmp/changed_steps.json
        if [ "$(echo "$CHANGED_JSON" | yq e 'length' -)" -eq 0 ]; then
          printf "false" > /tmp/has_changes
        else
          printf "true" > /tmp/has_changes
        fi
        echo "has_changes=$(cat /tmp/has_changes)"
        echo "changed_steps=$(cat /tmp/changed_steps.json)"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      # #457: detect-steps now clones the gitops repo to read pipeline-images.yaml
      # for the registry-aware first-build check; it needs the GitHub App token.
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: version
    outputs:
      parameters:
      - name: new_version
        valueFrom:
          path: /tmp/new_version
      - name: image_tag
        valueFrom:
          path: /tmp/image_tag
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        cd /workspace/repo
        git fetch --tags --force

        BRANCH_TYPE="{{`{{workflow.parameters.branch_type}}`}}"

        DEV_TAGS=$(git tag -l "dev-v*" | sort -V)
        if [ -z "$DEV_TAGS" ]; then
          REGULAR_TAGS=$(git tag -l "v*" | grep -v "dev-" | sort -V)
          if [ -n "$REGULAR_TAGS" ]; then
            LATEST_TAG=$(echo "$REGULAR_TAGS" | tail -n 1)
          else
            LATEST_TAG="v0.0.0"
          fi
        else
          LATEST_DEV_TAG=$(echo "$DEV_TAGS" | tail -n 1)
          LATEST_TAG="v$(echo "$LATEST_DEV_TAG" | sed -E 's/dev-v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
        fi

        VERSION=${LATEST_TAG#v}
        MAJOR=$(echo $VERSION | cut -d. -f1)
        MINOR=$(echo $VERSION | cut -d. -f2)
        PATCH=$(echo $VERSION | cut -d. -f3)
        [ -z "$MAJOR" ] && MAJOR=0
        [ -z "$MINOR" ] && MINOR=0
        [ -z "$PATCH" ] && PATCH=0

        case "$BRANCH_TYPE" in
          feature)     NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
          breaking)    NEW_VERSION="$((MAJOR + 1)).0.0" ;;
          bug|bugfix|maintenance) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          chore|rc)    NEW_VERSION="$MAJOR.$MINOR.$PATCH" ;;
          *)           NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
        esac

        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        SHORT_SHA=$(echo "{{`{{workflow.parameters.commit_sha}}`}}" | head -c 7)
        IMAGE_TAG="dev-v${NEW_VERSION}-${TIMESTAMP}-${SHORT_SHA}"

        echo -n "$NEW_VERSION" > /tmp/new_version
        echo -n "$IMAGE_TAG" > /tmp/image_tag
        echo "Version: $NEW_VERSION, Tag: $IMAGE_TAG"
      volumeMounts:
      - name: workspace
        mountPath: /workspace

  # build-push runs in parallel via withParam over the matrix of changed
  # steps. Each pod self-clones into an emptyDir (no shared workspace PVC)
  # so the matrix isn't bottlenecked by ReadWriteOnce multi-attach. The
  # init container sets up the repo at the right SHA; the main container
  # is kaniko, which builds and pushes without a daemon, no rootlesskit,
  # no userns gymnastics — works identically on COS, Ubuntu, EKS, kind.
  # Switched from rootless BuildKit because BuildKit's overlayfs snapshot
  # copy-up performs poorly on GKE Container-Optimized OS for multi-GB
  # images (e.g. PyTorch + ultralytics), getting stuck in "exporting
  # layers" indefinitely. Kaniko's flat tar-based layer model handles
  # large images consistently.
  - name: build-push
    inputs:
      parameters:
      - name: step_name
      - name: step_path
      - name: image_tag
      - name: new_version
    # Retry once on transient failures. The dominant historical failure
    # mode was GCE preemption mid-snapshot on the kubecorecpu pool (now
    # on-demand, see profiles.go). Keeping a single retry handles other
    # transient cases — registry 500s, network blips, kubelet evictions.
    # retryPolicy=OnError (not OnFailure) so we don't retry on legitimate
    # build failures like a Dockerfile syntax error.
    retryStrategy:
      limit: "1"
      retryPolicy: OnError
    volumes:
    - name: build-workspace
      emptyDir: {}
    - name: kaniko-config
      emptyDir: {}
    initContainers:
    - name: clone
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')
        git clone --depth=1 --branch "${BRANCH}" "${REPO_URL}" /workspace/repo
        cd /workspace/repo
        # depth=1 fetches ONLY the branch tip; if a newer commit landed since the
        # webhook fired (two quick pushes), the target commit_sha is absent and
        # the checkout fails "unable to read tree <sha>" → exit 128. Fetch the
        # SHA explicitly so each per-step build-push checks out its own commit
        # deterministically regardless of later pushes to the branch.
        git fetch --depth=1 origin "{{`{{workflow.parameters.commit_sha}}`}}" || true
        git checkout "{{`{{workflow.parameters.commit_sha}}`}}"
        echo "Cloned at $(git rev-parse HEAD) for step {{`{{inputs.parameters.step_name}}`}}"
      volumeMounts:
      - name: build-workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true
    - name: docker-config
      image: alpine:3.20
      command: [sh, -c]
      args:
      - |
        set -e
        # Use build_registry_url (in-cluster service DNS) for kaniko's
        # docker auth entry — that's the URL kaniko pushes to. Falls
        # back to registry_url for pre-0.9.7 callers that only pass one.
        REGISTRY="{{`{{workflow.parameters.build_registry_url}}`}}"
        if [ -z "$REGISTRY" ]; then REGISTRY="{{`{{workflow.parameters.registry_url}}`}}"; fi
        REG_USER=$(cat /etc/registry-auth/username)
        REG_PASS=$(cat /etc/registry-auth/password)
        AUTH=$(printf '%s:%s' "${REG_USER}" "${REG_PASS}" | base64 -w0)
        # Kaniko reads /kaniko/.docker/config.json. Write the auth entry
        # for the in-cluster Zot URL kaniko pushes to.
        mkdir -p /kaniko/.docker
        cat > /kaniko/.docker/config.json <<EOF
        {"auths":{"${REGISTRY}":{"auth":"${AUTH}"}}}
        EOF
        echo "Wrote kaniko docker config for ${REGISTRY}"
      volumeMounts:
      - name: build-workspace
        mountPath: /workspace
      - name: registry-auth
        mountPath: /etc/registry-auth
        readOnly: true
      - name: kaniko-config
        mountPath: /kaniko/.docker
    container:
      image: {{ .Values.kaniko.image | default "gcr.io/kaniko-project/executor:v1.23.2-debug" }}
      command: ["/busybox/sh", "-c"]
      args:
      - |
        set -e

        # Build-side registry: where kaniko pushes layers + cache. Must be
        # reachable from inside the pod network (in-cluster service DNS).
        # Falls back to registry_url for pre-0.9.7 callers, then to the
        # chart's internalUrl value.
        REGISTRY="{{`{{workflow.parameters.build_registry_url}}`}}"
        if [ -z "$REGISTRY" ]; then REGISTRY="{{`{{workflow.parameters.registry_url}}`}}"; fi
        if [ -z "$REGISTRY" ]; then REGISTRY="{{ .Values.registry.internalUrl }}"; fi
        IMAGE_REPO="{{`{{workflow.parameters.image_repository}}`}}"
        if [ -z "$IMAGE_REPO" ]; then
          IMAGE_REPO="{{`{{workflow.parameters.project_name}}`}}/{{`{{workflow.parameters.app_name}}`}}"
        fi

        STEP_NAME="{{`{{inputs.parameters.step_name}}`}}"
        STEP_PATH="{{`{{inputs.parameters.step_path}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"

        VERSIONED_IMAGE="${REGISTRY}/${IMAGE_REPO}:${STEP_NAME}-${IMAGE_TAG}"
        LATEST_IMAGE="${REGISTRY}/${IMAGE_REPO}:${STEP_NAME}-latest"

        # Each ML step has Dockerfile at <step_path>/Dockerfile and uses
        # <step_path> as build context — kubeline.yaml's contract.
        #
        # Kaniko strategy for fat ML images (#332):
        # --cache=true + --cache-repo: layer-level remote cache in Zot.
        #   First build of model-training (PyTorch + CUDA, ~23 GiB) takes
        #   the full snapshot wall (~50 min on pd-standard). Every
        #   subsequent build hits cache for the heavy RUN layers and only
        #   snapshots the small COPY app/ layer → seconds, not minutes.
        # --cache-copy-layers + --cache-run-layers: cache both layer kinds.
        # --snapshot-mode=time: mtime-based change detection. Cheaper than
        #   redo (full re-hash) on the small per-commit delta layer.
        # --single-snapshot was the previous trap — it forced one
        #   monolithic post-build snapshot of the *entire* final
        #   filesystem, defeating layer-level caching entirely. Removed.
        # --cleanup: drop intermediate layer files after push (kept).
        # --use-new-run + --compressed-caching=false: lower-memory
        #   snapshot algorithm; better for disk-bound nodes (kept).
        # --insecure / --skip-tls-verify: Zot serves HTTP in-cluster.
        #
        # The cache repo is a TOP-LEVEL sibling repo ({app}-buildcache), NOT a
        # nested path under the app repo. A nested path with the old
        # ({app}/__kaniko-cache__) name silently failed to persist in Zot —
        # kaniko logged "Pushing layer ... to cache now" but the layer never
        # landed (manifest 404, repo absent from the catalog), so every build
        # came up cold and re-ran the full ~3GB CUDA install. A flat top-level
        # repo name (no nested path, no leading/trailing __) is accepted by
        # Zot exactly like the app image repo, so the cache actually persists
        # and subsequent builds cache-hit the heavy RUN layers. The "-buildcache"
        # suffix keeps it per-app (no cross-tenant cache poisoning) and clear of
        # the app image tags.
        CACHE_REPO="${REGISTRY}/${IMAGE_REPO}-buildcache"
        /kaniko/executor \
          --context="/workspace/repo/${STEP_PATH}" \
          --dockerfile="/workspace/repo/${STEP_PATH}/Dockerfile" \
          --destination="${VERSIONED_IMAGE}" \
          --destination="${LATEST_IMAGE}" \
          --build-arg="REGISTRY_URL=${REGISTRY}" \
          --build-arg="VERSION=${IMAGE_TAG}" \
          --insecure \
          --skip-tls-verify \
          --cache=true \
          --cache-repo="${CACHE_REPO}" \
          --cache-copy-layers \
          --cache-run-layers \
          --snapshot-mode=time \
          --cleanup \
          --use-new-run \
          --compressed-caching=false

        echo "Pushed ${STEP_NAME}: ${VERSIONED_IMAGE} + ${LATEST_IMAGE}"
      volumeMounts:
      - name: build-workspace
        mountPath: /workspace
      - name: kaniko-config
        mountPath: /kaniko/.docker
      - name: registry-auth
        mountPath: /etc/registry-auth
        readOnly: true

  - name: render-wft
    inputs:
      parameters:
      - name: image_tag
      - name: changed_steps
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    container:
      image: python:3.12-alpine
      command: [sh, -c]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      args:
      - |
        set -e
        apk add --no-cache git >/dev/null
        pip install pyyaml --quiet

        TOKEN=$(cat /etc/github-token/token)
        ORG="{{ .Values.github.org }}"
        GITOPS_REPO="{{`{{workflow.parameters.gitops_repository}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        PROJECT_NAME="{{`{{workflow.parameters.project_name}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')

        REPO_URL="https://x-access-token:${TOKEN}@github.com/${ORG}/${GITOPS_REPO}.git"
        git clone --depth=1 --branch "${GITOPS_BRANCH}" "${REPO_URL}" /tmp/gitops
        git config --global user.name "KubeCore CI"
        git config --global user.email "ci@kubecore.io"

        # pipeline-context.yaml is written by the k8smlapp Crossplane composition
        # at {basePath}/{appName}/{gitopsBranch}/pipeline-context.yaml. basePath
        # is operator-configured (gitOpsConfig.basePath, default "kubeapps" —
        # NOT "workflows"; live layout verified on gke-dev/yolo 2026-06-13) and
        # is not passed to this workflow, so DISCOVER the directory by locating
        # the context file in the clone. The WFT render output lands next to it
        # so the ArgoCD app watching that path picks it up. The APP_BRANCH
        # (dev/feature/etc) is used only for the kaniko build context and image
        # tag; it does not drive gitops file paths.
        CONTEXT_PATH=$(find /tmp/gitops -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-context.yaml" | head -1)
        KUBELINE_PATH="/workspace/repo/kubeline.yaml"

        if [ -z "$CONTEXT_PATH" ] || [ ! -f "$CONTEXT_PATH" ]; then
          echo "ERROR: pipeline-context.yaml not found anywhere under */${APP_NAME}/${GITOPS_BRANCH}/ in the gitops repo."
          echo "The k8smlapp composition writes it; without it the WFT cannot be rendered. Failing loudly (a skipped render previously masked a path mismatch)."
          exit 1
        fi
        GITOPS_WORKFLOWS_PATH=$(dirname "${CONTEXT_PATH#/tmp/gitops/}")
        WFT_OUT="/tmp/gitops/${GITOPS_WORKFLOWS_PATH}/workflow-template.yaml"
        echo "gitops pipeline dir discovered: ${GITOPS_WORKFLOWS_PATH}"

        cat > /tmp/render_wft.py << 'PYEOF'
        import sys, yaml, os

        # Argo brace delimiters as variables so Helm does not parse them.
        OB = chr(123) + chr(123)
        CB = chr(125) + chr(125)

        kubeline_path = os.environ['KUBELINE_PATH']
        context_path = os.environ['CONTEXT_PATH']
        wft_out = os.environ['WFT_OUT']
        app_name = os.environ['APP_NAME']
        project_name = os.environ['PROJECT_NAME']
        branch = os.environ.get('BRANCH', 'main')

        with open(kubeline_path) as f:
            kubeline = yaml.safe_load(f)

        version = kubeline.get('version')
        if version != 2:
            print(f"WARNING: kubeline.yaml version={version!r} (expected 2). Skipping WFT render (v1 fallback).", file=sys.stderr)
            sys.exit(0)

        with open(context_path) as f:
            raw_cm = yaml.safe_load(f)
        ctx = yaml.safe_load(raw_cm['data']['context.yaml'])

        ml_ns = ctx['namespace']
        pipeline_name = ctx['pipelineName']
        registry_url = ctx.get('registryUrl', '')
        image_repo = ctx.get('imageRepo', f"{project_name}/{app_name}")
        lakefs = ctx.get('lakefs', {})
        mlflow = ctx.get('mlflow', {})
        compute = ctx.get('computeClasses', {})
        cpu_cls = compute.get('cpu', {})
        gpu_cls = compute.get('gpu', {})
        # all = full catalog of every cpu/gpu class the pool declares; a developer can
        # pick any of the right tier. Falls back to just the default cpu+gpu pair on
        # older contexts that don't carry `all`.
        all_classes = compute.get('all') or [c for c in (cpu_cls, gpu_cls) if c.get('name')]
        cpu_classes = [c for c in all_classes if c.get('tier') == 'cpu']
        gpu_classes = [c for c in all_classes if c.get('tier') == 'gpu']

        def _class_line(c):
            # one human line per class: "name — machineType (accel) — description"
            bits = [c.get('name', '?')]
            mt = c.get('machineType', '')
            ga = c.get('guestAccelerator') or {}
            accel = (' + %dx %s' % (ga.get('count', 1), ga.get('type', 'gpu'))) if ga else ''
            if mt:
                bits.append('%s%s' % (mt, accel))
            d = c.get('description', '')
            if d and d != mt:
                bits.append(d)
            return ' — '.join(bits)

        def _allowed_desc(tier_classes, tier):
            # field help text: lists every allowed class of this tier so the developer
            # knows the valid values (Argo renders this as the ? tooltip).
            if not tier_classes:
                return '%s compute class for this pool.' % tier.upper()
            names = ', '.join(c.get('name', '?') for c in tier_classes)
            lines = '; '.join(_class_line(c) for c in tier_classes)
            return ('%s compute class (node pool) this step runs on. Allowed on this pool: %s. [%s]'
                    % (tier.upper(), names, lines))
        hpc = ctx.get('hpc', {})
        checkpoints = ctx.get('checkpoints', {})
        sa = ctx.get('serviceAccountName', 'argo-workflow')

        # ── Headroom-aware step sizing ──────────────────────────────────────
        # A step must NOT request the node's full capacity: the node also runs
        # kube/system-reserved + the eviction threshold, the Argo `wait` sidecar
        # that rides every workflow pod, and — on GPU nodes — the nvidia
        # device-plugin + driver-installer daemonsets. Requesting the whole
        # machine => the pod Pends forever. So we derive per-step requests from
        # the chosen class's machineType capacity MINUS a reserve. cpu/mem of the
        # common GCP + AWS ML machine types (vCPU, GiB). Unknown types fall back
        # to a safe small request (the step still schedules; admin can size up).
        MACHINE_CAP = {
            # GCP
            'e2-standard-2': (2, 8),   'e2-standard-4': (4, 16),  'e2-standard-8': (8, 32),
            'n2-standard-4': (4, 16),  'n2-standard-8': (8, 32),  'n2-standard-16': (16, 64),
            'n1-standard-4': (4, 15),  'n1-standard-8': (8, 30),  'n1-standard-16': (16, 60),
            'g2-standard-4': (4, 16),  'g2-standard-8': (8, 32),  'g2-standard-16': (16, 64),
            'a2-highgpu-1g': (12, 85),
            # AWS
            'm6i.large': (2, 8),   'm6i.xlarge': (4, 16),  'm6i.2xlarge': (8, 32),
            'g4dn.xlarge': (4, 16), 'g4dn.2xlarge': (8, 32), 'g5.xlarge': (4, 16), 'g5.2xlarge': (8, 32),
        }
        ARGO_SIDECAR_CPU_M = 100           # the `wait` sidecar on every workflow pod
        ARGO_SIDECAR_MEM_GI = 0.2          # wait sidecar + small per-pod overhead
        SAFETY_MARGIN_GI = 1.0             # headroom below allocatable so the pod always fits

        def _gke_mem_reserved_gib(cap_gib):
            # GKE's memory eviction-reservation curve (the kube-reserved memory that
            # makes node ALLOCATABLE < capacity). Requesting capacity*(1-flat%) is
            # WRONG — a flat 15% under-reserves on small nodes and the pod goes
            # Unschedulable (n2-standard-4 16Gi → ~12.96Gi allocatable, NOT 13.6).
            # Curve: 25% of first 4Gi + 20% of next 4Gi + 10% of next 8Gi +
            # 6% of next 112Gi + 2% beyond, plus 100Mi hard-eviction.
            r = 0.0
            tiers = [(4, 0.25), (4, 0.20), (8, 0.10), (112, 0.06)]
            rem = cap_gib
            for size, frac in tiers:
                take = min(rem, size)
                r += take * frac
                rem -= take
                if rem <= 0:
                    break
            if rem > 0:
                r += rem * 0.02
            return r + 0.1  # +100Mi eviction threshold

        def _sized_requests(cls, is_gpu):
            # Returns (requests, limits) sized to fit UNDER the class node's GKE
            # allocatable (capacity - GKE-reserved - argo sidecar - safety margin),
            # so a scale-to-0 nodepool actually schedules the pod (and the autoscaler
            # provisions a node) instead of "Insufficient memory / didn't match".
            mt = (cls or {}).get('machineType', '')
            cap = MACHINE_CAP.get(mt)
            if not cap:
                req_cpu, req_mem = (2, 6) if is_gpu else (1, 3)
                lim_cpu, lim_mem = (4, 10) if is_gpu else (2, 5)
            else:
                cap_cpu, cap_mem = cap
                alloc_mem = cap_mem - _gke_mem_reserved_gib(cap_mem)
                # CPU: GKE reserves only ~70-90m; leave 0.5 vCPU + the argo sidecar.
                req_cpu = max(1, int(cap_cpu - 0.5 - ARGO_SIDECAR_CPU_M / 1000.0))
                req_mem = max(2, int(alloc_mem - ARGO_SIDECAR_MEM_GI - SAFETY_MARGIN_GI))
                # limit can use the full allocatable (burst into the sidecar/margin),
                # but never above allocatable or the pod gets OOM-evicted at admission.
                lim_cpu = max(req_cpu, int(cap_cpu - 0.5))
                lim_mem = max(req_mem, int(alloc_mem - SAFETY_MARGIN_GI))
            requests = {'cpu': str(req_cpu), 'memory': f'{req_mem}Gi', 'ephemeral-storage': '10Gi' if is_gpu else '2Gi'}
            limits = {'cpu': str(lim_cpu), 'memory': f'{lim_mem}Gi', 'ephemeral-storage': '30Gi' if is_gpu else '4Gi'}
            if is_gpu:
                requests['nvidia.com/gpu'] = '1'
                limits['nvidia.com/gpu'] = '1'
            return requests, limits

        steps = kubeline.get('steps', [])
        pipeline_params = kubeline.get('pipeline', {}).get('parameters', [])

        args_params = []

        # ── Read-only form doc (PIPELINE-INFO) ──────────────────────────────────────
        # A first parameter whose value is a human summary of the LIVE pool config +
        # how the form works. Argo shows it at the top of the submit form; the
        # developer reads it before filling anything. Its description tells them it is
        # informational only. (Argo has no native section headers, so a doc param is
        # the idiomatic way to surface live config + instructions on the form.)
        _cpu_lines = '\n'.join('  • ' + _class_line(c) for c in cpu_classes) or '  • (none)'
        _gpu_lines = '\n'.join('  • ' + _class_line(c) for c in gpu_classes) or '  • (none)'
        pipeline_info = (
            'HOW TO RUN: defaults below are headroom-sized and runnable as-is — just press Submit.\n'
            'PER-STEP COMPUTE: set {step}-cpu / {step}-mem / {step}-gpu for each step. '
            '{step}-gpu > 0 routes that step to a GPU node pool; 0 keeps it on CPU.\n'
            'COMPUTE CLASSES on this pool (cpu-class / gpu-class pick the node pool):\n'
            'CPU:\n' + _cpu_lines + '\n'
            'GPU:\n' + _gpu_lines + '\n'
            '(This field is informational — leave it unchanged.)'
        )
        args_params.append({'name': 'pipeline-info', 'value': pipeline_info,
                            'description': 'Read-only: live pool compute classes + how to fill this form. Leave unchanged.'})

        for p in pipeline_params:
            args_params.append({'name': p['name'], 'value': p.get('default', ''), 'description': p.get('description', '')})

        cpu_class_name = cpu_cls.get('name', f"{pipeline_name}-cpu")
        gpu_class_name = gpu_cls.get('name', f"{pipeline_name}-gpu")
        # cpu-class / gpu-class: editable, defaulted to the pool's default class, with a
        # description listing EVERY allowed class of that tier so the developer chooses
        # rather than blind-types. enum makes Argo render a dropdown when >1 class
        # exists (Argo ignores a 1-item enum gracefully); only set enum when there is a
        # real choice so we never lock the field to a single value on single-class pools.
        cpu_enum = [c['name'] for c in cpu_classes if c.get('name')]
        gpu_enum = [c['name'] for c in gpu_classes if c.get('name')]
        cpu_class_param = {'name': 'cpu-class', 'value': cpu_class_name, 'description': _allowed_desc(cpu_classes, 'cpu')}
        gpu_class_param = {'name': 'gpu-class', 'value': gpu_class_name, 'description': _allowed_desc(gpu_classes, 'gpu')}
        if len(cpu_enum) > 1:
            cpu_class_param['enum'] = cpu_enum
        if len(gpu_enum) > 1:
            gpu_class_param['enum'] = gpu_enum
        args_params.append(cpu_class_param)
        args_params.append(gpu_class_param)

        for step in steps:
            args_params.append({
                'name': f"image-{step['name']}",
                'valueFrom': {'configMapKeyRef': {'name': f"{app_name}-pipeline-images", 'key': step['name']}}
            })

        # ── Per-step submit-form requests ───────────────────────────────────
        # The engineer sets each step's compute on the Argo Submit form: how much
        # cpu, how much memory, and how many GPUs. The GPU count is the router —
        # >0 sends the step to the pool's gpu class (with the accelerator + GPU
        # toleration), 0 keeps it on the cpu class. Defaults are headroom-sized
        # for the relevant class so an untouched form still schedules. A kubeline
        # `resources.requests` block, if present, seeds the default (so a pipeline
        # can ship sensible per-step starting values); otherwise the class
        # headroom default is used.
        def _form_defaults(step):
            res = step.get('resources') or {}
            reqs = res.get('requests') or {}
            # gpu default: explicit request wins, else 1 if the step opts in via the
            # legacy compute:gpu flag, else 0 (cpu step).
            gpu_def = reqs.get('nvidia.com/gpu')
            if gpu_def is None:
                gpu_def = '1' if step.get('compute', 'cpu') == 'gpu' else '0'
            gpu_def = str(gpu_def)
            is_gpu_default = gpu_def not in ('', '0')
            sized_req, _ = _sized_requests(gpu_cls if is_gpu_default else cpu_cls, is_gpu_default)
            cpu_def = str(reqs.get('cpu', sized_req['cpu']))
            mem_def = str(reqs.get('memory', sized_req['memory']))
            return cpu_def, mem_def, gpu_def

        for step in steps:
            sn = step['name']
            cpu_def, mem_def, gpu_def = _form_defaults(step)
            args_params.append({'name': f"{sn}-cpu", 'value': cpu_def,
                                'description': f"CPU request for the {sn} step (e.g. 2, 500m)"})
            args_params.append({'name': f"{sn}-mem", 'value': mem_def,
                                'description': f"Memory request for the {sn} step (e.g. 8Gi)"})
            args_params.append({'name': f"{sn}-gpu", 'value': gpu_def,
                                'description': f"GPU count for the {sn} step. >0 routes it to the GPU class; 0 = CPU only"})

        args_params += [
            {'name': 'registered-model-name', 'value': f"{app_name}-model"},
            {'name': 'promote-to', 'value': ''},
            {'name': 'kubepool-name', 'value': project_name},
            {'name': 'mlflow-endpoint', 'value': mlflow.get('trackingUri', '')},
            # Zitadel domain for the pipeline's MLflow bearer-JWT auth provider.
            # k8smlapp writes mlflow.oidcDomain into pipeline-context from the MLflow
            # OIDC discovery URL host; empty when MLflow OIDC is disabled (steps then
            # fall back to no auth header — fine for an unauthenticated MLflow).
            {'name': 'zitadel-domain', 'value': mlflow.get('oidcDomain', '')},
            # Zitadel project ID of the MLflow OIDC app. The auth provider requests
            # urn:zitadel:iam:org:project:id:{id}:aud so the minted token is audienced
            # to the MLflow app (and carries project roles) — without it the token is
            # audienced to the machine user's own client with no groups → the plugin
            # rejects it "Invalid token payload"/401 (yolo-final2, 2026-06-26).
            {'name': 'zitadel-mlflow-project-id', 'value': mlflow.get('oidcProjectId', '')},
            {'name': 'lakefs-endpoint', 'value': lakefs.get('endpoint', '')},
            {'name': 'lakefs-repo', 'value': lakefs.get('repository', app_name)},
            {'name': 'lakefs-branch', 'value': branch},
        ]

        # ── DAG: two variants per step, selected at submit time ─────────────
        # Each step is emitted as TWO tasks — {step}-cpu and {step}-gpu — gated by
        # a `when:` on the form's {step}-gpu param. Exactly one runs; the other is
        # Skipped. A downstream step depends on BOTH variants of each of its
        # dependencies with the Succeeded||Skipped gate, so it runs iff the variant
        # that actually executed Succeeded (a real failure leaves that clause false
        # → the dependent is Omitted), while the skipped sibling never blocks it.
        # Argo can't conditionally drop the nvidia.com/gpu resource key from a single
        # template, so two concrete templates are the robust Argo-native form.
        def _gate(dep):
            # "dep ran-or-skipped, for both variants" — true exactly when whichever
            # variant ran reached Succeeded (the skipped one is always Skipped).
            return f"({dep}-cpu.Succeeded || {dep}-cpu.Skipped) && ({dep}-gpu.Succeeded || {dep}-gpu.Skipped)"

        templates = []
        dag_tasks = []
        for step in steps:
            sn = step['name']
            deps = step.get('dependencies', []) or []
            depends_expr = " && ".join(_gate(d) for d in deps) if deps else ""
            inp_params = step.get('inputs', {}).get('parameters', []) if step.get('inputs') else []
            for variant in ('cpu', 'gpu'):
                when = (OB + f"=asInt(workflow.parameters['{sn}-gpu']) " +
                        ("> 0" if variant == 'gpu' else "== 0") + CB)
                task = {'name': f"{sn}-{variant}", 'template': f"{sn}-{variant}", 'when': when}
                if depends_expr:
                    task['depends'] = depends_expr
                if inp_params:
                    # An input wired `from: <dep>` resolves from whichever variant of
                    # that dep ran. The two variants are mutually exclusive via the same
                    # `when:` on the dep's own gpu param, so SELECT the source by that
                    # same param — NOT by probing both tasks' outputs. A skipped Argo
                    # task has NO `.outputs` object at all (not an empty string), so a
                    # tasks[dep-cpu].outputs... reference on the skipped sibling makes
                    # the WHOLE Argo expression fail to resolve and Argo emits the raw
                    # unevaluated template literal — which then breaks the consumer
                    # (observed: model-registration json.loads "line 1 column 2" when
                    # the gpu training variant ran and the cpu sibling was skipped).
                    # Gating the ternary on the dep's gpu param dereferences ONLY the
                    # variant that actually executed.
                    task_args = []
                    for ip in inp_params:
                        frm = ip.get('from')
                        if not frm:
                            continue
                        expr = (OB + f"=asInt(workflow.parameters['{frm}-gpu']) > 0 ? "
                                f"tasks['{frm}-gpu'].outputs.parameters['{ip['name']}'] : "
                                f"tasks['{frm}-cpu'].outputs.parameters['{ip['name']}']" + CB)
                        task_args.append({'name': ip['name'], 'value': expr})
                    if task_args:
                        task['arguments'] = {'parameters': task_args}
                dag_tasks.append(task)
        templates.append({'name': f"{app_name}-pipeline", 'dag': {'tasks': dag_tasks}})

        def build_step_template(step, is_gpu):
            sn = step['name']
            # Placement: the cpu variant targets the cpu-class param, the gpu variant the
            # gpu-class param. The nodeSelector references the EDITABLE workflow param
            # (cpu-class / gpu-class) — defaulted to the pool's default class, but the
            # developer can override it on the submit form to any allowed class of that
            # tier (the field's ? help + enum list the allowed set). So a class edit on
            # the form actually moves the step; routing cpu-vs-gpu is still driven by the
            # step's {step}-gpu count (>0 → gpu variant runs, else cpu variant).
            class_param = 'gpu-class' if is_gpu else 'cpu-class'
            cls = gpu_cls if is_gpu else cpu_cls
            tol_key = cls.get('tolerationKey', 'platform.kubecore.io/ml-workload')
            tol_val = cls.get('tolerationValue', '')
            tol = {'key': tol_key, 'operator': 'Exists' if not tol_val else 'Equal', 'effect': 'NoSchedule'}
            if tol_val:
                tol['value'] = tol_val
            step_tolerations = [tol]
            if is_gpu:
                # GKE auto-taints accelerator nodes with nvidia.com/gpu; without
                # this toleration a gpu-tier step Pends forever on its own pool.
                step_tolerations.append({'key': 'nvidia.com/gpu', 'operator': 'Exists', 'effect': 'NoSchedule'})

            # container.resources MUST carry CONCRETE quantities — an Argo param template in
            # a k8s resource field fails quantity validation and breaks the Argo API's
            # ListWorkflowTemplates (the UI then shows NO templates at all). So the
            # static defaults below (headroom-sized for the class) are the parsed value;
            # the per-run submit-form override is applied via podSpecPatch (below), the
            # only Argo mechanism that parameterizes non-string fields like resources.
            sized_req, sized_lim = _sized_requests(cls, is_gpu)

            container = {
                'image': OB + 'workflow.parameters.image-' + sn + CB,
                'resources': {'requests': sized_req, 'limits': sized_lim},
            }
            if step.get('command'):
                container['command'] = step['command']
            if step.get('args'):
                container['args'] = step['args']

            env_list = [
                {'name': 'MLFLOW_TRACKING_URI', 'value': OB + 'workflow.parameters.mlflow-endpoint' + CB},
                {'name': 'LAKEFS_ENDPOINT', 'value': OB + 'workflow.parameters.lakefs-endpoint' + CB},
                {'name': 'LAKEFS_ACCESS_KEY', 'valueFrom': {'secretKeyRef': {'name': lakefs.get('adminSecret', f"{project_name}-lakefs-admin"), 'key': 'accessKeyId'}}},
                {'name': 'LAKEFS_SECRET_KEY', 'valueFrom': {'secretKeyRef': {'name': lakefs.get('adminSecret', f"{project_name}-lakefs-admin"), 'key': 'secretAccessKey'}}},
                # MLflow auth = OIDC bearer JWT (no basic-auth). The {project}-mlflow-svc
                # secret holds a Zitadel machine key (ZITADEL_MACHINE_KEY), mounted as a
                # file below. The step image's `zitadel` RequestAuthProvider
                # (MLFLOW_TRACKING_AUTH=zitadel) reads ZITADEL_MACHINE_KEY_FILE, mints a
                # short-lived RS256 JWT via the JWT-profile grant, and refreshes per
                # request — so a long training run never 401s mid-run. Replaces the old
                # basic-auth MLFLOW_TRACKING_USERNAME/PASSWORD path (seeded svc-user in
                # the plugin DB), which drifted and 401'd.
                {'name': 'MLFLOW_TRACKING_AUTH', 'value': 'zitadel'},
                {'name': 'ZITADEL_MACHINE_KEY_FILE', 'value': '/etc/mlflow-svc/ZITADEL_MACHINE_KEY'},
                # ZITADEL_DOMAIN drives both the token endpoint
                # (https://{domain}/oauth/v2/token) and the JWT-profile assertion
                # audience (issuer). zitadel-domain is the render-wft workflow param
                # the k8smlapp composition derives from the MLflow OIDC discovery URL.
                {'name': 'ZITADEL_DOMAIN', 'value': OB + 'workflow.parameters.zitadel-domain' + CB},
                # ZITADEL_MLFLOW_PROJECT_ID → the auth provider adds the project-aud
                # scope so the token is accepted by the MLflow OIDC app (fixes 401
                # "Invalid token payload"). Empty when MLflow OIDC is disabled.
                {'name': 'ZITADEL_MLFLOW_PROJECT_ID', 'value': OB + 'workflow.parameters.zitadel-mlflow-project-id' + CB},
            ]
            # Inject platform-derived checkpoint location when present in context.yaml.
            # checkpoints.bucket = lakeFS repository name; checkpoints.prefix = branch/path
            # within that repo (lakeFS S3 gateway addressing: bucket=repo, prefix=branch/...).
            # Only injected when the composition wrote the checkpoints block; absent on
            # legacy deployments that pre-date Edit 1 — kubeline shims tolerate absence.
            ckpt_bucket = checkpoints.get('bucket', '')
            ckpt_prefix = checkpoints.get('prefix', '')
            if ckpt_bucket:
                env_list.append({'name': 'CHECKPOINT_BUCKET', 'value': ckpt_bucket})
            if ckpt_prefix:
                env_list.append({'name': 'CHECKPOINT_PREFIX', 'value': ckpt_prefix})
            for e in (step.get('env') or []):
                env_list.append(e)
            container['env'] = env_list

            # Mount the {project}-mlflow-svc Zitadel machine key as a file so the
            # step's `zitadel` MLflow auth provider can read ZITADEL_MACHINE_KEY_FILE.
            # optional=True: the secret exists only when MLflow OIDC is enabled; steps
            # that don't talk to MLflow simply never read it.
            mlflow_svc_secret = mlflow.get('svcSecret', f"{project_name}-mlflow-svc")
            container['volumeMounts'] = [
                {'name': 'mlflow-svc', 'mountPath': '/etc/mlflow-svc', 'readOnly': True},
            ]

            tmpl = {
                'name': f"{sn}-{'gpu' if is_gpu else 'cpu'}",
                'metadata': {
                    'labels': {
                        'platform.kubecore.io/project': project_name,
                        'platform.kubecore.io/pipeline': pipeline_name,
                        'platform.kubecore.io/step': sn,
                        'platform.kubecore.io/compute-type': 'gpu' if is_gpu else 'cpu',
                        'platform.kubecore.io/compute-class': OB + 'workflow.parameters.' + class_param + CB,
                    }
                },
                'nodeSelector': {'platform.kubecore.io/nodegroup-type': OB + 'workflow.parameters.' + class_param + CB},
                'tolerations': step_tolerations,
                'serviceAccountName': sa,
                # retryStrategy: a step that hangs or dies (e.g. a transient S3/dataloader
                # stall during validation, a flaky node) is retried instead of wedging the
                # whole run forever. OnError retries on infra/non-zero-without-clean-exit;
                # combined with activeDeadlineSeconds below a hung pod is killed + retried
                # rather than blocking indefinitely (model-training has no built-in timeout).
                'retryStrategy': {
                    'limit': '2',
                    'retryPolicy': 'OnError',
                    'backoff': {'duration': '30s', 'factor': '2', 'maxDuration': '5m'},
                },
                # activeDeadlineSeconds is a generous ceiling that only catches a genuine
                # multi-hour wedge (a hung S3/dataloader stall, a stuck node) — NOT normal
                # training. GPU training can legitimately run long, so 3h; cpu steps are
                # quick (30m). A wedged pod is killed at the deadline and retryStrategy
                # then re-runs it, instead of the run hanging forever.
                'activeDeadlineSeconds': 10800 if is_gpu else 1800,
                'container': container,
                'volumes': [
                    {'name': 'mlflow-svc', 'secret': {'secretName': mlflow_svc_secret, 'optional': True}},
                ],
            }

            # podSpecPatch overrides the main container's resources from the submit-form
            # params. This is the ONLY Argo-supported way to parameterize resource
            # quantities — Argo substitutes the param refs THEN strategic-merge-patches
            # the pod, so the quantities are concrete by the time k8s validates them.
            # The container is named "main" in the rendered pod. limits == requests for
            # cpu/mem (guaranteed QoS); the gpu variant also sets nvidia.com/gpu.
            cpu_p = OB + f"workflow.parameters.{sn}-cpu" + CB
            mem_p = OB + f"workflow.parameters.{sn}-mem" + CB
            gpu_line = []
            if is_gpu:
                gpu_p = OB + f"workflow.parameters.{sn}-gpu" + CB
                gpu_line = [f"      nvidia.com/gpu: \"{gpu_p}\""]
            patch_lines = (
                ["containers:", "- name: main", "  resources:", "    requests:",
                 f"      cpu: \"{cpu_p}\"", f"      memory: \"{mem_p}\""] + gpu_line +
                ["    limits:",
                 f"      cpu: \"{cpu_p}\"", f"      memory: \"{mem_p}\""] + gpu_line
            )
            tmpl['podSpecPatch'] = "\n".join(patch_lines) + "\n"

            inp = step.get('inputs', {}).get('parameters', []) if step.get('inputs') else []
            if inp:
                tmpl['inputs'] = {'parameters': [{'name': p['name']} for p in inp]}
            out = step.get('outputs', {}).get('parameters', []) if step.get('outputs') else []
            if out:
                tmpl['outputs'] = {'parameters': [{'name': p['name'], 'valueFrom': {'path': p['path']}} for p in out]}

            return tmpl

        # Emit both variants for every step. The cpu variant pins the cpu class with
        # no accelerator; the gpu variant pins the gpu class and requests {step}-gpu
        # accelerators. The DAG's `when:` picks exactly one per run from the form.
        for step in steps:
            templates.append(build_step_template(step, is_gpu=False))
            templates.append(build_step_template(step, is_gpu=True))

        if hpc.get('enabled'):
            provider = hpc.get('provider', 'none')
            templates.append({
                'name': 'hpc-burst',
                'container': {
                    'image': 'busybox:1.36',
                    'command': ['sh', '-c'],
                    'args': [f'echo "HPC burst placeholder, provider={provider} not yet wired"']
                }
            })

        wft = {
            'apiVersion': 'argoproj.io/v1alpha1',
            'kind': 'WorkflowTemplate',
            'metadata': {
                'name': f"{app_name}-pipeline",
                'namespace': ml_ns,
                'annotations': {
                    'platform.kubecore.io/cost-tracking': 'enabled',
                    'platform.kubecore.io/pipeline': pipeline_name,
                    'platform.kubecore.io/gpu-nodepool': f"{pipeline_name}-gpu",
                    'platform.kubecore.io/cpu-nodepool': f"{pipeline_name}-cpu",
                    'platform.kubecore.io/generated-by': 'ml-ci-build/render-wft',
                },
                'labels': {
                    'platform.kubecore.io/project': project_name,
                    'platform.kubecore.io/app': app_name,
                    'platform.kubecore.io/managed-by': 'kubecore-ci',
                }
            },
            'spec': {
                'serviceAccountName': sa,
                'entrypoint': f"{app_name}-pipeline",
                'arguments': {'parameters': args_params},
                'templates': templates,
            }
        }

        os.makedirs(os.path.dirname(wft_out), exist_ok=True)
        with open(wft_out, 'w') as f:
            yaml.dump(wft, f, default_flow_style=False, allow_unicode=True, sort_keys=False)
        print(f"render-wft: wrote {wft_out}")
        PYEOF

        KUBELINE_PATH="$KUBELINE_PATH" CONTEXT_PATH="$CONTEXT_PATH" WFT_OUT="$WFT_OUT" \
          APP_NAME="$APP_NAME" PROJECT_NAME="$PROJECT_NAME" BRANCH="$BRANCH" \
          python3 /tmp/render_wft.py

        cd /tmp/gitops
        # Stage the DISCOVERED path (kubeapps/{app}/{gitops-branch}/...), not a
        # hardcoded workflows/{app}/{push-branch}/ — the old pathspec pointed at
        # a file that never existed (wrong basePath AND wrong branch segment),
        # so git add exited 128 after a perfectly good render. Live log,
        # gke-dev/yolo 2026-06-13: "discovered: kubeapps/yolo-training/main" →
        # "fatal: pathspec 'workflows/yolo-training/dev/...'".
        git add "${GITOPS_WORKFLOWS_PATH}/workflow-template.yaml"
        if git diff --cached --quiet; then
          echo "No WFT changes to commit"
        else
          git commit -m "ml-ci(${APP_NAME}): render WFT from kubeline.yaml v2 at ${IMAGE_TAG}"
          git pull --rebase origin "${GITOPS_BRANCH}"
          git push
          echo "Pushed rendered WFT to ${ORG}/${GITOPS_REPO}@${GITOPS_BRANCH}"
        fi
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: patch-images
    inputs:
      parameters:
      - name: image_tag
      - name: changed_steps
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    container:
      image: mikefarah/yq:4.44.3
      command: [sh, -c]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        ORG="{{ .Values.github.org }}"
        GITOPS_REPO="{{`{{workflow.parameters.gitops_repository}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')

        REGISTRY="{{`{{workflow.parameters.registry_url}}`}}"
        if [ -z "$REGISTRY" ]; then REGISTRY="{{ .Values.registry.externalUrl }}"; fi
        if [ -z "$REGISTRY" ]; then REGISTRY="{{ .Values.registry.internalUrl }}"; fi
        IMAGE_REPO="{{`{{workflow.parameters.image_repository}}`}}"
        if [ -z "$IMAGE_REPO" ]; then
          IMAGE_REPO="{{`{{workflow.parameters.project_name}}`}}/${APP_NAME}"
        fi

        apk add --no-cache git >/dev/null

        REPO_URL="https://x-access-token:${TOKEN}@github.com/${ORG}/${GITOPS_REPO}.git"
        git clone --depth=1 --branch "${GITOPS_BRANCH}" "${REPO_URL}" /tmp/gitops
        cd /tmp/gitops

        # pipeline-images.yaml is written by Crossplane at
        # {basePath}/{appName}/{gitopsBranch}/ — basePath is operator-configured
        # (default "kubeapps") and not passed here, so discover it by locating
        # the file (same discovery as render-wft; live layout verified
        # gke-dev/yolo 2026-06-13).
        IMAGES_PATH=$(find . -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-images.yaml" | head -1)

        if [ -z "${IMAGES_PATH}" ] || [ ! -f "${IMAGES_PATH}" ]; then
          echo "ERROR: pipeline-images.yaml not found anywhere under */${APP_NAME}/${GITOPS_BRANCH}/ — the WFT resolves image parameters from this ConfigMap; failing loudly."
          exit 1
        fi
        echo "pipeline-images discovered at ${IMAGES_PATH}"

        # changed_steps comes in as a JSON array `[{"name":"...","path":"..."},...]`
        # Update each step's image key in the pipeline-images ConfigMap.
        echo '{{`{{inputs.parameters.changed_steps}}`}}' > /tmp/changed.json
        STEPS_LEN=$(yq -p=json -o=yaml 'length' /tmp/changed.json)
        i=0
        while [ "$i" -lt "$STEPS_LEN" ]; do
          STEP_NAME=$(yq -p=json -o=yaml ".[$i].name" /tmp/changed.json | tr -d '"')
          NEW_IMAGE="${REGISTRY}/${IMAGE_REPO}:${STEP_NAME}-${IMAGE_TAG}"
          echo "Updating pipeline-images key '${STEP_NAME}' → ${NEW_IMAGE}"
          yq e -i ".data.\"${STEP_NAME}\" = \"${NEW_IMAGE}\"" "${IMAGES_PATH}"
          i=$((i + 1))
        done

        git config user.name "KubeCore CI"
        git config user.email "ci@kubecore.io"
        git add "${IMAGES_PATH}"
        if git diff --cached --quiet; then
          echo "No changes to commit (image tags already match)"
          exit 0
        fi
        git commit -m "ml-ci(${APP_NAME}): bump step images to ${IMAGE_TAG} in pipeline-images ConfigMap"
        git pull --rebase origin "${GITOPS_BRANCH}"
        git push
        echo "Pushed image-tag update to ${ORG}/${GITOPS_REPO}@${GITOPS_BRANCH}"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: tag
    inputs:
      parameters:
      - name: image_tag
      - name: new_version
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        cd /workspace/repo
        TOKEN=$(cat /etc/github-token/token)
        NEW_VERSION="{{`{{inputs.parameters.new_version}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        TIMESTAMP=$(echo "$IMAGE_TAG" | sed -E 's/dev-v[0-9]+\.[0-9]+\.[0-9]+-([0-9]+-[0-9]+)-.*/\1/')
        DEV_TAG="dev-v${NEW_VERSION}-${TIMESTAMP}"

        git config user.name "KubeCore CI"
        git config user.email "ci@kubecore.io"

        REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        git remote set-url origin "${REPO_URL}"

        git tag -a "${DEV_TAG}" -m "ML dev release v${NEW_VERSION}"
        git push origin "${DEV_TAG}"
        echo "Tagged: ${DEV_TAG}"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: status
    inputs:
      parameters:
      - name: state
      - name: description
    container:
      image: alpine/curl
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO="{{`{{workflow.parameters.repo_url}}`}}"
        OWNER_REPO=$(echo "$REPO" | sed 's|https://github.com/||' | sed 's|.git$||')
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        STATE="{{`{{inputs.parameters.state}}`}}"
        DESC="{{`{{inputs.parameters.description}}`}}"

        curl -s -X POST \
          -H "Authorization: token ${TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${OWNER_REPO}/statuses/${SHA}" \
          -d "{\"state\":\"${STATE}\",\"description\":\"${DESC}\",\"context\":\"kubecore-ml-ci\"}"

        echo "Posted status: ${STATE}"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: exit-handler
    steps:
    - - name: post-failure-status
        template: status
        arguments:
          parameters:
          - name: state
            value: "failure"
          - name: description
            value: "ML build failed"
        when: "{{`{{workflow.status}}`}} == Failed"
