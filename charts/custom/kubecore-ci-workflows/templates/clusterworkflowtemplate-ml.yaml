{{/*
ml-ci-build — KubeCore ML pipeline CI ClusterWorkflowTemplate.

Triggered by the per-KubeApp Sensor created by the k8smlapp composition
(compositions/apis/kubeapp/k8smlapp/composition.yaml, generate-ci-resources
step) on push/PR to a kubeline-* source repo.

Flow:
  clone → detect-steps → version → build-push (matrix) → patch-wft → status

Each ML "step" is a sub-directory in the source repo carrying a Dockerfile;
kubeline.yaml at the repo root declares the step DAG. Only the directories
whose contents changed since HEAD~1 get rebuilt — kubeline.yaml is the
single source of truth for step name → path → compute mapping. After a
successful matrix build, this template clones the gitops repo and `yq`-
patches the corresponding step's container.image in
workflows/{appName}/{branch}/workflow-template.yaml so ArgoCD picks up the
new image on its next sync.

Inputs come from the Sensor (Argo Events). See the Sensor template in the
k8smlapp composition for the full parameter list.

Required secrets in the workflow namespace:
  - {{ .Values.github.tokenSecretName }}  (GitHub App installation token)
  - ci-registry-auth                       (Zot username/password)
*/}}
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ml-ci-build
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "kubecore-ci-workflows.serviceAccountName" . }}
  entrypoint: ml-ci-build
  onExit: exit-handler
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.workflow.ttlStrategy.secondsAfterCompletion }}
  podGC:
    strategy: {{ .Values.workflow.podGC.strategy }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.workspace.size | default "5Gi" }}
      {{- with .Values.workspace.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
  volumes:
  - name: github-token
    secret:
      secretName: {{ .Values.github.tokenSecretName }}
  - name: registry-auth
    secret:
      secretName: ci-registry-auth
  arguments:
    parameters:
    - name: repo_url
    - name: commit_sha
    - name: branch
    - name: target_branch
      value: "dev"
    - name: branch_type
      value: "feature"
    - name: app_name
    - name: project_name
    - name: pr_merged
      value: "false"
    - name: event_type
      value: "push"
    - name: image_repository
      value: ""
    - name: registry_url
      # Registry URL written into the WorkflowTemplate's container.image
      # by patch-wft. Must be a hostname the workload-cluster kubelet can
      # resolve from its host network — typically the NodePort URL
      # (e.g. localhost:30500 if Zot is on a NodePort and we want
      # node-local routing), NOT the in-cluster service DNS.
      value: ""
    - name: build_registry_url
      # Registry URL kaniko pushes layers to (--destination + auth).
      # Must be a hostname the build-push pod can reach from inside
      # the cluster network — typically the in-cluster service DNS
      # (zot.zot-registry.svc.cluster.local:5000). Falls back to
      # registry_url if empty (pre-0.9.7 compatibility).
      value: ""
    - name: gitops_repository
    - name: gitops_branch
      value: "main"
    - name: workflow_template_path

  templates:
  - name: ml-ci-build
    steps:
    - - name: clone
        template: clone
    - - name: detect-steps
        template: detect-steps
    - - name: version
        template: version
    - - name: build-push
        template: build-push
        when: "{{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true"
        arguments:
          parameters:
          - name: step_name
            value: "{{`{{item.name}}`}}"
          - name: step_path
            value: "{{`{{item.path}}`}}"
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
        withParam: "{{`{{steps.detect-steps.outputs.parameters.changed_steps}}`}}"
    - - name: render-wft
        template: render-wft
        # Fire when a step image changed OR kubeline.yaml changed (wft_changed):
        # kubeline.yaml IS the WFT source, so a kubeline-only change (e.g. a
        # PARAMS_YAML tweak) must re-render even with has_changes=false. render-wft
        # rebuilds the WHOLE WFT from kubeline.yaml, so an empty changed_steps is fine.
        when: "({{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true || {{`{{steps.detect-steps.outputs.parameters.wft_changed}}`}} == true) && {{`{{workflow.parameters.pr_merged}}`}} == true && {{`{{workflow.parameters.branch_type}}`}} != chore"
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: changed_steps
            value: "{{`{{steps.detect-steps.outputs.parameters.changed_steps}}`}}"
    - - name: patch-images
        template: patch-images
        when: "{{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true && {{`{{workflow.parameters.pr_merged}}`}} == true && {{`{{workflow.parameters.branch_type}}`}} != chore"
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: changed_steps
            value: "{{`{{steps.detect-steps.outputs.parameters.changed_steps}}`}}"
    - - name: tag
        template: tag
        when: "{{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true && {{`{{workflow.parameters.branch_type}}`}} != chore && {{`{{workflow.parameters.branch_type}}`}} != rc"
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
    - - name: status
        template: status
        arguments:
          parameters:
          - name: state
            value: "success"
          - name: description
            value: "ML build succeeded"

  - name: clone
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')
        # Need at least 2 commits for change detection (HEAD~1 vs HEAD)
        git clone --depth=50 --branch "${BRANCH}" "${REPO_URL}" /workspace/repo
        cd /workspace/repo
        # Explicitly fetch the target commit before checkout. A shallow clone of
        # the branch tip does NOT necessarily contain a specific commit_sha if a
        # newer commit landed on the branch between the webhook firing and this
        # clone running (two quick pushes → the earlier build's commit is no
        # longer in the shallow window → "fatal: unable to read tree <sha>" →
        # exit 128). Fetching the SHA directly makes the checkout deterministic.
        git fetch --depth=50 origin "{{`{{workflow.parameters.commit_sha}}`}}" || true
        git checkout "{{`{{workflow.parameters.commit_sha}}`}}"
        echo "Cloned at $(git rev-parse HEAD)"
        if [ ! -f kubeline.yaml ]; then
          echo "ERROR: kubeline.yaml not found at repo root — required for ML CI"
          exit 1
        fi
        echo "kubeline.yaml found, contents:"
        cat kubeline.yaml
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: detect-steps
    outputs:
      parameters:
      - name: changed_steps
        valueFrom:
          path: /tmp/changed_steps.json
      - name: has_changes
        valueFrom:
          path: /tmp/has_changes
      - name: wft_changed
        valueFrom:
          path: /tmp/wft_changed
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        # detect-steps needs both git and yq; alpine/git ships with git but no yq.
        # Drop the yq binary in /usr/local/bin (~10MB, no-cache, idempotent).
        if ! command -v yq >/dev/null 2>&1; then
          apk add --no-cache curl >/dev/null
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
        fi
        cd /workspace/repo

        # Diff range — HEAD~1..HEAD when we have a parent, else "all steps"
        if git rev-parse HEAD~1 >/dev/null 2>&1; then
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        else
          CHANGED_FILES=$(git ls-files)
        fi
        echo "Changed files vs HEAD~1:"
        echo "$CHANGED_FILES"

        # kubeline.yaml IS the source of the rendered WorkflowTemplate (step
        # commands, env/PARAMS_YAML, params, DAG). A change to it that touches no
        # step *directory* (e.g. a PARAMS_YAML tweak like threading lakefs_repo)
        # leaves has_changes=false, so without this flag render-wft/patch-images
        # would be SKIPPED and the live WFT would never pick up the kubeline change
        # — a silent, confusing drift. Emit wft_changed=true whenever kubeline.yaml
        # is in the diff (or this is a full build with no parent), and gate
        # render-wft/patch-images on (has_changes OR wft_changed).
        if [ -z "$(git rev-parse HEAD~1 2>/dev/null)" ] || echo "$CHANGED_FILES" | grep -qE "^kubeline\.ya?ml$"; then
          printf "true" > /tmp/wft_changed
        else
          printf "false" > /tmp/wft_changed
        fi
        echo "wft_changed=$(cat /tmp/wft_changed)"

        # #457: a step must be (re)built if EITHER its source changed OR it has
        # no published image yet. detect-steps used to key only on the git diff,
        # so a step whose directory was untouched (typical first push: README /
        # kubeline tweak) was never built — its pipeline-images ConfigMap key
        # stayed at the Crossplane-seeded ":{step}-latest" placeholder, which is
        # never produced by build-push (it always tags {step}-{branch}-v…-{sha}).
        # The first training run then hit ImagePullBackOff on those steps with no
        # signal pointing at CI ("resubmit until every step gets touched").
        #
        # Registry-aware first build: clone the gitops repo, read the
        # pipeline-images.yaml the WFT resolves images from, and treat any step
        # whose key is ABSENT or still ends in "-latest" (placeholder = never
        # built) as changed. Reading the gitops ConfigMap is a reliable proxy for
        # "image exists in the registry" — patch-images writes the versioned tag
        # there only after a successful build+push.
        UNBUILT_STEPS=""
        GITOPS_REPO="{{`{{workflow.parameters.gitops_repository}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        if [ -f /etc/github-token/token ] && [ -n "$GITOPS_REPO" ]; then
          GH_TOKEN=$(cat /etc/github-token/token)
          GITOPS_URL="https://x-access-token:${GH_TOKEN}@github.com/{{ .Values.github.org }}/${GITOPS_REPO}.git"
          if git clone --depth=1 --branch "${GITOPS_BRANCH}" "${GITOPS_URL}" /tmp/gitops 2>/dev/null; then
            # basePath is operator-configured (default "kubeapps") and not passed
            # here, so discover the file (same pattern as render-wft/patch-images).
            IMAGES_PATH=$(find /tmp/gitops -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-images.yaml" | head -1)
            if [ -n "$IMAGES_PATH" ] && [ -f "$IMAGES_PATH" ]; then
              echo "pipeline-images discovered at ${IMAGES_PATH}"
            else
              echo "pipeline-images.yaml not found — treating all steps as unbuilt (first build)"
              IMAGES_PATH=""
              UNBUILT_STEPS="__ALL__"
            fi
          else
            echo "WARN: could not clone gitops repo; skipping registry-aware check"
          fi
        fi

        # Walk each step in kubeline.yaml; emit if its path/* changed OR it has no
        # published image yet (#457).
        STEP_COUNT=$(yq e '.steps | length' kubeline.yaml)
        CHANGED_JSON="[]"
        i=0
        while [ "$i" -lt "$STEP_COUNT" ]; do
          STEP_NAME=$(yq e ".steps[$i].name" kubeline.yaml)
          STEP_PATH=$(yq e ".steps[$i].path" kubeline.yaml)

          REASON=""
          if echo "$CHANGED_FILES" | grep -qE "^${STEP_PATH}/"; then
            REASON="source changed"
          elif [ "$UNBUILT_STEPS" = "__ALL__" ]; then
            REASON="no pipeline-images (first build)"
          elif [ -n "${IMAGES_PATH:-}" ]; then
            # ConfigMap key value for this step; absent → null. A value still
            # ending in "-latest" is the seeded placeholder = never built.
            CUR_IMAGE=$(yq e ".data.\"${STEP_NAME}\" // \"\"" "$IMAGES_PATH")
            case "$CUR_IMAGE" in
              ""|*-latest) REASON="image unbuilt (${CUR_IMAGE:-missing})" ;;
            esac
          fi

          if [ -n "$REASON" ]; then
            CHANGED_JSON=$(echo "$CHANGED_JSON" | yq e -o=json '. + [{"name":"'"$STEP_NAME"'","path":"'"$STEP_PATH"'"}]' -)
            echo "step changed: $STEP_NAME ($STEP_PATH) — ${REASON}"
          fi
          i=$((i + 1))
        done

        # Compact JSON for withParam
        echo "$CHANGED_JSON" | yq e -o=json -I=0 - > /tmp/changed_steps.json
        if [ "$(echo "$CHANGED_JSON" | yq e 'length' -)" -eq 0 ]; then
          printf "false" > /tmp/has_changes
        else
          printf "true" > /tmp/has_changes
        fi
        echo "has_changes=$(cat /tmp/has_changes)"
        echo "changed_steps=$(cat /tmp/changed_steps.json)"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      # #457: detect-steps now clones the gitops repo to read pipeline-images.yaml
      # for the registry-aware first-build check; it needs the GitHub App token.
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: version
    outputs:
      parameters:
      - name: new_version
        valueFrom:
          path: /tmp/new_version
      - name: image_tag
        valueFrom:
          path: /tmp/image_tag
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        cd /workspace/repo
        git fetch --tags --force

        BRANCH_TYPE="{{`{{workflow.parameters.branch_type}}`}}"

        DEV_TAGS=$(git tag -l "dev-v*" | sort -V)
        if [ -z "$DEV_TAGS" ]; then
          REGULAR_TAGS=$(git tag -l "v*" | grep -v "dev-" | sort -V)
          if [ -n "$REGULAR_TAGS" ]; then
            LATEST_TAG=$(echo "$REGULAR_TAGS" | tail -n 1)
          else
            LATEST_TAG="v0.0.0"
          fi
        else
          LATEST_DEV_TAG=$(echo "$DEV_TAGS" | tail -n 1)
          LATEST_TAG="v$(echo "$LATEST_DEV_TAG" | sed -E 's/dev-v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
        fi

        VERSION=${LATEST_TAG#v}
        MAJOR=$(echo $VERSION | cut -d. -f1)
        MINOR=$(echo $VERSION | cut -d. -f2)
        PATCH=$(echo $VERSION | cut -d. -f3)
        [ -z "$MAJOR" ] && MAJOR=0
        [ -z "$MINOR" ] && MINOR=0
        [ -z "$PATCH" ] && PATCH=0

        case "$BRANCH_TYPE" in
          feature)     NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
          breaking)    NEW_VERSION="$((MAJOR + 1)).0.0" ;;
          bug|bugfix|maintenance) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          chore|rc)    NEW_VERSION="$MAJOR.$MINOR.$PATCH" ;;
          *)           NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
        esac

        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        SHORT_SHA=$(echo "{{`{{workflow.parameters.commit_sha}}`}}" | head -c 7)
        IMAGE_TAG="dev-v${NEW_VERSION}-${TIMESTAMP}-${SHORT_SHA}"

        echo -n "$NEW_VERSION" > /tmp/new_version
        echo -n "$IMAGE_TAG" > /tmp/image_tag
        echo "Version: $NEW_VERSION, Tag: $IMAGE_TAG"
      volumeMounts:
      - name: workspace
        mountPath: /workspace

  # build-push runs in parallel via withParam over the matrix of changed
  # steps. Each pod self-clones into an emptyDir (no shared workspace PVC)
  # so the matrix isn't bottlenecked by ReadWriteOnce multi-attach. The
  # init container sets up the repo at the right SHA; the main container
  # is kaniko, which builds and pushes without a daemon, no rootlesskit,
  # no userns gymnastics — works identically on COS, Ubuntu, EKS, kind.
  # Switched from rootless BuildKit because BuildKit's overlayfs snapshot
  # copy-up performs poorly on GKE Container-Optimized OS for multi-GB
  # images (e.g. PyTorch + ultralytics), getting stuck in "exporting
  # layers" indefinitely. Kaniko's flat tar-based layer model handles
  # large images consistently.
  - name: build-push
    inputs:
      parameters:
      - name: step_name
      - name: step_path
      - name: image_tag
      - name: new_version
    # Retry once on transient failures. The dominant historical failure
    # mode was GCE preemption mid-snapshot on the kubecorecpu pool (now
    # on-demand, see profiles.go). Keeping a single retry handles other
    # transient cases — registry 500s, network blips, kubelet evictions.
    # retryPolicy=OnError (not OnFailure) so we don't retry on legitimate
    # build failures like a Dockerfile syntax error.
    retryStrategy:
      limit: "1"
      retryPolicy: OnError
    volumes:
    - name: build-workspace
      emptyDir: {}
    - name: kaniko-config
      emptyDir: {}
    initContainers:
    - name: clone
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')
        git clone --depth=1 --branch "${BRANCH}" "${REPO_URL}" /workspace/repo
        cd /workspace/repo
        # depth=1 fetches ONLY the branch tip; if a newer commit landed since the
        # webhook fired (two quick pushes), the target commit_sha is absent and
        # the checkout fails "unable to read tree <sha>" → exit 128. Fetch the
        # SHA explicitly so each per-step build-push checks out its own commit
        # deterministically regardless of later pushes to the branch.
        git fetch --depth=1 origin "{{`{{workflow.parameters.commit_sha}}`}}" || true
        git checkout "{{`{{workflow.parameters.commit_sha}}`}}"
        echo "Cloned at $(git rev-parse HEAD) for step {{`{{inputs.parameters.step_name}}`}}"
      volumeMounts:
      - name: build-workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true
    - name: docker-config
      image: alpine:3.20
      command: [sh, -c]
      args:
      - |
        set -e
        # Use build_registry_url (in-cluster service DNS) for kaniko's
        # docker auth entry — that's the URL kaniko pushes to. Falls
        # back to registry_url for pre-0.9.7 callers that only pass one.
        REGISTRY="{{`{{workflow.parameters.build_registry_url}}`}}"
        if [ -z "$REGISTRY" ]; then REGISTRY="{{`{{workflow.parameters.registry_url}}`}}"; fi
        REG_USER=$(cat /etc/registry-auth/username)
        REG_PASS=$(cat /etc/registry-auth/password)
        AUTH=$(printf '%s:%s' "${REG_USER}" "${REG_PASS}" | base64 -w0)
        # Kaniko reads /kaniko/.docker/config.json. Write the auth entry
        # for the in-cluster Zot URL kaniko pushes to.
        mkdir -p /kaniko/.docker
        cat > /kaniko/.docker/config.json <<EOF
        {"auths":{"${REGISTRY}":{"auth":"${AUTH}"}}}
        EOF
        echo "Wrote kaniko docker config for ${REGISTRY}"
      volumeMounts:
      - name: build-workspace
        mountPath: /workspace
      - name: registry-auth
        mountPath: /etc/registry-auth
        readOnly: true
      - name: kaniko-config
        mountPath: /kaniko/.docker
    container:
      image: {{ .Values.kaniko.image | default "gcr.io/kaniko-project/executor:v1.23.2-debug" }}
      command: ["/busybox/sh", "-c"]
      args:
      - |
        set -e

        # Build-side registry: where kaniko pushes layers + cache. Must be
        # reachable from inside the pod network (in-cluster service DNS).
        # Falls back to registry_url for pre-0.9.7 callers, then to the
        # chart's internalUrl value.
        REGISTRY="{{`{{workflow.parameters.build_registry_url}}`}}"
        if [ -z "$REGISTRY" ]; then REGISTRY="{{`{{workflow.parameters.registry_url}}`}}"; fi
        if [ -z "$REGISTRY" ]; then REGISTRY="{{ .Values.registry.internalUrl }}"; fi
        IMAGE_REPO="{{`{{workflow.parameters.image_repository}}`}}"
        if [ -z "$IMAGE_REPO" ]; then
          IMAGE_REPO="{{`{{workflow.parameters.project_name}}`}}/{{`{{workflow.parameters.app_name}}`}}"
        fi

        STEP_NAME="{{`{{inputs.parameters.step_name}}`}}"
        STEP_PATH="{{`{{inputs.parameters.step_path}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"

        VERSIONED_IMAGE="${REGISTRY}/${IMAGE_REPO}:${STEP_NAME}-${IMAGE_TAG}"
        LATEST_IMAGE="${REGISTRY}/${IMAGE_REPO}:${STEP_NAME}-latest"

        # Each ML step has Dockerfile at <step_path>/Dockerfile and uses
        # <step_path> as build context — kubeline.yaml's contract.
        #
        # Kaniko strategy for fat ML images (#332):
        # --cache=true + --cache-repo: layer-level remote cache in Zot.
        #   First build of model-training (PyTorch + CUDA, ~23 GiB) takes
        #   the full snapshot wall (~50 min on pd-standard). Every
        #   subsequent build hits cache for the heavy RUN layers and only
        #   snapshots the small COPY app/ layer → seconds, not minutes.
        # --cache-copy-layers + --cache-run-layers: cache both layer kinds.
        # --snapshot-mode=time: mtime-based change detection. Cheaper than
        #   redo (full re-hash) on the small per-commit delta layer.
        # --single-snapshot was the previous trap — it forced one
        #   monolithic post-build snapshot of the *entire* final
        #   filesystem, defeating layer-level caching entirely. Removed.
        # --cleanup: drop intermediate layer files after push (kept).
        # --use-new-run + --compressed-caching=false: lower-memory
        #   snapshot algorithm; better for disk-bound nodes (kept).
        # --insecure / --skip-tls-verify: Zot serves HTTP in-cluster.
        #
        # The cache repo is a TOP-LEVEL sibling repo ({app}-buildcache), NOT a
        # nested path under the app repo. A nested path with the old
        # ({app}/__kaniko-cache__) name silently failed to persist in Zot —
        # kaniko logged "Pushing layer ... to cache now" but the layer never
        # landed (manifest 404, repo absent from the catalog), so every build
        # came up cold and re-ran the full ~3GB CUDA install. A flat top-level
        # repo name (no nested path, no leading/trailing __) is accepted by
        # Zot exactly like the app image repo, so the cache actually persists
        # and subsequent builds cache-hit the heavy RUN layers. The "-buildcache"
        # suffix keeps it per-app (no cross-tenant cache poisoning) and clear of
        # the app image tags.
        CACHE_REPO="${REGISTRY}/${IMAGE_REPO}-buildcache"
        /kaniko/executor \
          --context="/workspace/repo/${STEP_PATH}" \
          --dockerfile="/workspace/repo/${STEP_PATH}/Dockerfile" \
          --destination="${VERSIONED_IMAGE}" \
          --destination="${LATEST_IMAGE}" \
          --build-arg="REGISTRY_URL=${REGISTRY}" \
          --build-arg="VERSION=${IMAGE_TAG}" \
          --insecure \
          --skip-tls-verify \
          --cache=true \
          --cache-repo="${CACHE_REPO}" \
          --cache-copy-layers \
          --cache-run-layers \
          --snapshot-mode=time \
          --cleanup \
          --use-new-run \
          --compressed-caching=false

        echo "Pushed ${STEP_NAME}: ${VERSIONED_IMAGE} + ${LATEST_IMAGE}"
      {{- with .Values.kaniko.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumeMounts:
      - name: build-workspace
        mountPath: /workspace
      - name: kaniko-config
        mountPath: /kaniko/.docker
      - name: registry-auth
        mountPath: /etc/registry-auth
        readOnly: true

  - name: render-wft
    inputs:
      parameters:
      - name: image_tag
      - name: changed_steps
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    container:
      image: python:3.12-alpine
      command: [sh, -c]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      args:
      - |
        set -e
        apk add --no-cache git >/dev/null
        pip install pyyaml --quiet

        TOKEN=$(cat /etc/github-token/token)
        ORG="{{ .Values.github.org }}"
        GITOPS_REPO="{{`{{workflow.parameters.gitops_repository}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        PROJECT_NAME="{{`{{workflow.parameters.project_name}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')

        REPO_URL="https://x-access-token:${TOKEN}@github.com/${ORG}/${GITOPS_REPO}.git"
        git clone --depth=1 --branch "${GITOPS_BRANCH}" "${REPO_URL}" /tmp/gitops
        git config --global user.name "KubeCore CI"
        git config --global user.email "ci@kubecore.io"

        # pipeline-context.yaml is written by the k8smlapp Crossplane composition
        # at {basePath}/{appName}/{gitopsBranch}/pipeline-context.yaml. basePath
        # is operator-configured (gitOpsConfig.basePath, default "kubeapps" —
        # NOT "workflows"; live layout verified on gke-dev/yolo 2026-06-13) and
        # is not passed to this workflow, so DISCOVER the directory by locating
        # the context file in the clone. The WFT render output lands next to it
        # so the ArgoCD app watching that path picks it up. The APP_BRANCH
        # (dev/feature/etc) is used only for the kaniko build context and image
        # tag; it does not drive gitops file paths.
        CONTEXT_PATH=$(find /tmp/gitops -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-context.yaml" | head -1)

        # Clone the APP repo FRESH at the exact commit_sha and read kubeline.yaml
        # from there — do NOT trust /workspace/repo. The shared workspace PVC that
        # the clone step checks out is not guaranteed clean by the time render-wft
        # runs: a retained/racing checkout can leave a STALE kubeline.yaml, and the
        # render then silently emits a WFT built from the old pipeline definition
        # (live yolo/e2e 2026-07-02: the lakefs_repo PARAMS_YAML fix was on dev HEAD
        # and in the built commit, yet the render dropped it because /workspace/repo
        # held a pre-fix kubeline). A self-contained clone at commit_sha makes the
        # render deterministic: the WFT always reflects the commit that was built.
        APP_REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        APP_COMMIT="{{`{{workflow.parameters.commit_sha}}`}}"
        rm -rf /tmp/apprepo
        git clone --depth=50 --branch "${BRANCH}" "${APP_REPO_URL}" /tmp/apprepo
        git -C /tmp/apprepo fetch --depth=1 origin "${APP_COMMIT}" || true
        git -C /tmp/apprepo checkout "${APP_COMMIT}"
        KUBELINE_PATH="/tmp/apprepo/kubeline.yaml"
        echo "render-wft: reading kubeline from fresh clone at ${APP_COMMIT}"
        # Source-commit committer epoch for the monotonic anti-churn guard below;
        # computed once here (from the fresh clone) and passed into render_wft.py so
        # it can stamp the WFT annotation directly.
        SRC_COMMIT_TIME=$(git -C /tmp/apprepo show -s --format=%ct "${APP_COMMIT}" 2>/dev/null || echo 0)
        echo "render-wft: source-commit epoch ${SRC_COMMIT_TIME}"

        if [ -z "$CONTEXT_PATH" ] || [ ! -f "$CONTEXT_PATH" ]; then
          echo "ERROR: pipeline-context.yaml not found anywhere under */${APP_NAME}/${GITOPS_BRANCH}/ in the gitops repo."
          echo "The k8smlapp composition writes it; without it the WFT cannot be rendered. Failing loudly (a skipped render previously masked a path mismatch)."
          exit 1
        fi
        GITOPS_WORKFLOWS_PATH=$(dirname "${CONTEXT_PATH#/tmp/gitops/}")
        WFT_OUT="/tmp/gitops/${GITOPS_WORKFLOWS_PATH}/workflow-template.yaml"
        echo "gitops pipeline dir discovered: ${GITOPS_WORKFLOWS_PATH}"

        cat > /tmp/render_wft.py << 'PYEOF'
        import sys, yaml, os, json, ssl, urllib.request

        # Argo brace delimiters as variables so Helm does not parse them.
        OB = chr(123) + chr(123)
        CB = chr(125) + chr(125)

        kubeline_path = os.environ['KUBELINE_PATH']
        context_path = os.environ['CONTEXT_PATH']
        wft_out = os.environ['WFT_OUT']
        app_name = os.environ['APP_NAME']
        project_name = os.environ['PROJECT_NAME']
        branch = os.environ.get('BRANCH', 'main')

        with open(kubeline_path) as f:
            kubeline = yaml.safe_load(f)

        version = kubeline.get('version')
        if version != 2:
            print(f"WARNING: kubeline.yaml version={version!r} (expected 2). Skipping WFT render (v1 fallback).", file=sys.stderr)
            sys.exit(0)

        with open(context_path) as f:
            raw_cm = yaml.safe_load(f)
        ctx = yaml.safe_load(raw_cm['data']['context.yaml'])

        ml_ns = ctx['namespace']
        pipeline_name = ctx['pipelineName']
        registry_url = ctx.get('registryUrl', '')
        image_repo = ctx.get('imageRepo', f"{project_name}/{app_name}")
        lakefs = ctx.get('lakefs', {})
        mlflow = ctx.get('mlflow', {})

        # ── Live-compute detection (GCP ephemeral-nodegroup model) ──────────────
        # The operator writes poolContext ONLY when the pool opted into the live
        # model (features.mlConfig.ephemeralPipelineNodegroups). Its presence — a
        # non-empty projectId — is the single gate that switches render-wft from the
        # legacy cluster-shared numeric-request model to the per-step live-catalog +
        # ephemeral per-pipeline NodePool model. Absent/empty ⇒ the legacy path below
        # runs byte-for-byte as before, so every existing pool is 100% unchanged.
        pool_context = ctx.get('poolContext') or {}
        compute_catalog_ref = ctx.get('computeCatalog') or {}
        live_compute = bool((pool_context.get('projectId') or '').strip())

        compute = ctx.get('computeClasses', {})
        cpu_cls = compute.get('cpu', {})
        gpu_cls = compute.get('gpu', {})
        # all = full catalog of every cpu/gpu class the pool declares; a developer can
        # pick any of the right tier. Falls back to just the default cpu+gpu pair on
        # older contexts that don't carry `all`.
        all_classes = compute.get('all') or [c for c in (cpu_cls, gpu_cls) if c.get('name')]
        cpu_classes = [c for c in all_classes if c.get('tier') == 'cpu']
        gpu_classes = [c for c in all_classes if c.get('tier') == 'gpu']

        def _class_line(c):
            # one human line per class: "name — machineType (accel) — description"
            bits = [c.get('name', '?')]
            mt = c.get('machineType', '')
            ga = c.get('guestAccelerator') or {}
            accel = (' + %dx %s' % (ga.get('count', 1), ga.get('type', 'gpu'))) if ga else ''
            if mt:
                bits.append('%s%s' % (mt, accel))
            d = c.get('description', '')
            if d and d != mt:
                bits.append(d)
            return ' — '.join(bits)

        def _allowed_desc(tier_classes, tier):
            # field help text: lists every allowed class of this tier so the developer
            # knows the valid values (Argo renders this as the ? tooltip).
            if not tier_classes:
                return '%s compute class for this pool.' % tier.upper()
            names = ', '.join(c.get('name', '?') for c in tier_classes)
            lines = '; '.join(_class_line(c) for c in tier_classes)
            return ('%s compute class (node pool) this step runs on. Allowed on this pool: %s. [%s]'
                    % (tier.upper(), names, lines))
        hpc = ctx.get('hpc', {})
        checkpoints = ctx.get('checkpoints', {})
        sa = ctx.get('serviceAccountName', 'argo-workflow')

        # ════════════════════════════════════════════════════════════════════
        # LIVE-COMPUTE PATH (GCP ephemeral per-pipeline NodePools).
        #
        # Active only when poolContext.projectId is set. Reads the pool-scoped LIVE
        # machine catalog (written by the compute-catalog probe CronWorkflow), emits
        # a per-step compute-CLASS dropdown + a per-step disk-gb param, sizes each
        # step to its chosen class's WHOLE node (requests==limits, sole-tenant), and
        # provisions/destroys a dedicated GKE NodePool per (step, run) around the DAG.
        # Everything below this block (the legacy cluster-shared numeric-request
        # model) is UNTOUCHED and runs for every non-live pool.
        # ════════════════════════════════════════════════════════════════════
        def _read_live_catalog(cm_name, cm_ns):
            # Read the compute-catalog ConfigMap straight from the in-cluster API
            # using the render-wft pod's ServiceAccount token (operate-workflow-sa;
            # RBAC grants get on configmaps in argo-workflows — see rbac.yaml). No
            # kubectl binary in python:3.12-alpine, so hit the REST API directly.
            sa_dir = '/var/run/secrets/kubernetes.io/serviceaccount'
            with open(sa_dir + '/token') as f:
                token = f.read().strip()
            host = os.environ.get('KUBERNETES_SERVICE_HOST', 'kubernetes.default.svc')
            port = os.environ.get('KUBERNETES_SERVICE_PORT', '443')
            url = 'https://%s:%s/api/v1/namespaces/%s/configmaps/%s' % (host, port, cm_ns, cm_name)
            sslctx = ssl.create_default_context(cafile=sa_dir + '/ca.crt')
            req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token})
            with urllib.request.urlopen(req, context=sslctx, timeout=30) as resp:
                cm = json.loads(resp.read().decode('utf-8'))
            data = (cm.get('data') or {}).get('catalog.yaml')
            if not data:
                raise RuntimeError("ConfigMap %s/%s has no data['catalog.yaml']" % (cm_ns, cm_name))
            return yaml.safe_load(data)

        # Module-scope whole-node sizer usable by BOTH the live (ephemeral) and the
        # static-class (scale-to-zero) paths. requests==limits == the class's
        # platform-computed allocatable minus a margin (sole-tenant ⇒ Guaranteed
        # QoS, the whole machine to the step). GPU classes add nvidia.com/gpu.
        #
        # Headroom is PROPORTIONAL to the node so it scales with machine size
        # instead of being a fixed number tuned for one box. Two proportional
        # reserves, both charged against the pod's own memory limit:
        #   • /dev/shm  (dataloader worker shared memory) — see _shm_gib below,
        #   • memory margin — the shm + the Argo `wait` sidecar + torch's transient
        #     training peak (activations, worker buffers) above steady state.
        # A fixed 0.5Gi margin OOMKilled model-training at the 24Gi limit on a 30Gi
        # n1-standard-8 (exit 137, live 2026-07-07). The margin is now a % of the
        # node (floored so tiny nodes still get real headroom) and is set larger
        # than the shm % so the shm always fits inside it. Tune the constants below
        # (in one place) if heavier runs still pressure memory.
        WN_CPU_MARGIN = 0.5
        WN_MEM_MARGIN_FRAC = 0.14   # reserve ~14% of node memory (covers shm+sidecar+peak)
        WN_MEM_MARGIN_FLOOR_GI = 2.0

        def _wn_mem_margin_gib(mem_alloc):
            return max(WN_MEM_MARGIN_FLOOR_GI, mem_alloc * WN_MEM_MARGIN_FRAC)

        # /dev/shm sizeLimit for a whole-node step: ~10% of the class allocatable,
        # floored 1Gi (below which torch DataLoader workers wedge) and capped 4Gi
        # (beyond which it's wasteful and eats the margin). Always < the memory
        # margin % above, so the shm fits under the reserve. T4 25Gi → 2Gi;
        # a2 340Gi → 4Gi (cap); a small 8Gi node → 1Gi (floor).
        SHM_FRAC = 0.10
        SHM_FLOOR_GI = 1
        SHM_CAP_GI = 4

        def _quant_gate_predicate(sn):
            # The quantization-enable predicate for a quant step, as an Argo
            # expression fragment (no braces). model-quantization runs for any
            # quantization (ptq OR qat) → != 'none'. qat-finetune runs ONLY for
            # qat → == 'qat'; without this it fired as a no-op during PTQ, pulling
            # its ~14GB CUDA image (~14 min) and adding a phantom QAT node to the
            # DAG. quantization-mode=none keeps both quant steps skipped.
            if sn == 'qat-finetune':
                return "workflow.parameters['quantization-mode'] == 'qat'"
            return "workflow.parameters['quantization-mode'] != 'none'"

        def _shm_gib(c):
            mem_alloc = float((c.get('allocatable') or {}).get('memoryGiB', 8))
            return int(min(SHM_CAP_GI, max(SHM_FLOOR_GI, round(mem_alloc * SHM_FRAC))))

        def _rewrite_params_yaml(env_entry, has_catalog):
            # Rewrites the copied-from-kubeline PARAMS_YAML env var (a multi-line YAML
            # string) so the submit form carries no internal plumbing:
            #   (a) dataset-path-override: the ref->commit resolution is an Argo
            #       expression, which is NOT evaluated inside an env value (only in
            #       task-arg/when/withParam). So point it at a STEP INPUT that the DAG
            #       task supplies as an evaluated expression. (only when a catalog exists)
            #   (b) lakefs-repo / lakefs-endpoint: BAKE the literal render-time values
            #       (render-wft already knows them from pipeline-context) instead of
            #       referencing workflow parameters — removes those editable plumbing
            #       boxes from the form.
            # Returns a copy; no-op on non-PARAMS_YAML entries. (Argo braces built from
            # OB/CB at runtime, never literal.)
            if not isinstance(env_entry, dict):
                return env_entry
            val = env_entry.get('value')
            if not isinstance(val, str):
                return env_entry
            new = val
            # (b) bake the lakeFS repo + endpoint literals
            new = new.replace(OB + 'workflow.parameters.lakefs-repo' + CB,
                              lakefs.get('repository', app_name))
            new = new.replace(OB + 'workflow.parameters.lakefs-endpoint' + CB,
                              lakefs.get('endpoint', ''))
            # (a) point dataset-path-override at the step input (evaluated by the DAG)
            if has_catalog:
                new = new.replace(OB + 'workflow.parameters.dataset-path-override' + CB,
                                  OB + 'inputs.parameters.dataset-path-override' + CB)
            if new == val:
                return env_entry
            out = dict(env_entry)
            out['value'] = new
            return out

        def _whole_node_resources(c):
            alloc = c.get('allocatable') or {}
            cpu_alloc = float(alloc.get('cpu', 1))
            mem_alloc = float(alloc.get('memoryGiB', 2))
            cpu = max(1, int(cpu_alloc - WN_CPU_MARGIN))
            mem = max(1, int(round(mem_alloc - _wn_mem_margin_gib(mem_alloc))))
            reqs = {'cpu': str(cpu), 'memory': '%dGi' % mem}
            if c.get('tier') == 'gpu':
                gcount = str(((c.get('gpu') or c.get('guestAccelerator') or {}).get('count', 1)))
                reqs['nvidia.com/gpu'] = gcount
            return dict(reqs), dict(reqs)

        if live_compute:
            cm_name = compute_catalog_ref.get('configMap') or 'kubecore-ml-compute-catalog'
            cm_ns = compute_catalog_ref.get('namespace') or 'argo-workflows'
            try:
                catalog = _read_live_catalog(cm_name, cm_ns)
            except Exception as e:
                # FAIL LOUDLY — a live pool with no catalog means the probe has not
                # run yet (or lost RBAC). Do NOT silently fall back to the legacy
                # model: that would emit the wrong submit-form + no ephemeral nodes.
                print("ERROR: live-compute pool but could not read compute-catalog "
                      "ConfigMap %s/%s: %s" % (cm_ns, cm_name, e), file=sys.stderr)
                print("The ml-compute-catalog-probe CronWorkflow must publish the live "
                      "machine catalog before a pipeline can render. Failing.", file=sys.stderr)
                sys.exit(1)

            catalog_classes = catalog.get('classes') or []
            if not catalog_classes:
                print("ERROR: compute-catalog %s/%s has an empty classes[] — probe "
                      "produced no machine catalog. Failing." % (cm_ns, cm_name), file=sys.stderr)
                sys.exit(1)

            by_name = {c['name']: c for c in catalog_classes if c.get('name')}
            live_cpu = [c for c in catalog_classes if c.get('tier') == 'cpu']
            live_gpu = [c for c in catalog_classes if c.get('tier') == 'gpu']
            avail_cpu = [c for c in live_cpu if c.get('available') and not c.get('stockout')]
            avail_gpu = [c for c in live_gpu if c.get('available') and not c.get('stockout')]

            STOCKOUT_SUFFIX = ' (STOCKOUT)'

            # The gcloud lifecycle steps (create/destroy-nodegroups) MUST run as the
            # WI-bound KSA operate-workflow-sa — the gcp/system composition binds exactly
            # argo-workflows/operate-workflow-sa → {org}-gcp-eso-sa (roles/container.developer).
            # The pipeline SA (ctx.serviceAccountName, default argo-workflow) has no GCP WI,
            # so it can't run gcloud. Node scheduling for the gcloud pods themselves uses the
            # CI cpu class (they're short-lived, run on the system/CI pool, not an ML node).
            GCLOUD_SA = 'operate-workflow-sa'
            CI_POOL = ctx.get('ciCpuClass', 'kubecorecpu')
            # The CI build pool (kubecorecpu) carries the taint
            # platform.kubecore.io/ml-workload=cpu:NoSchedule (gke.go builds it so).
            # The management pods that run there (validate-classes, create/destroy-
            # nodegroups) MUST tolerate it, or the autoscaler refuses to scale the
            # pool up for them ("Pod didn't trigger scale-up: untolerated taint") and
            # they Pend forever. Exists-match tolerates any ml-workload value.
            CI_POOL_TOLERATIONS = [
                {'key': 'platform.kubecore.io/ml-workload', 'operator': 'Exists',
                 'effect': 'NoSchedule'},
            ]

            def _enum_value(c):
                # The enum value the developer picks. Stocked-out classes stay IN the
                # list (so the form shows the full pool catalog) but their value is
                # suffixed so the guard step can reject a stocked-out selection.
                v = c['name']
                return v + STOCKOUT_SUFFIX if c.get('stockout') else v

            def _enum_values(tier_classes):
                # available first, stocked-out last — the first available of the tier
                # is the field default.
                ok = [_enum_value(c) for c in tier_classes if c.get('available') and not c.get('stockout')]
                bad = [_enum_value(c) for c in tier_classes if not (c.get('available') and not c.get('stockout'))]
                return ok + bad

            def _strip_stockout(v):
                return v[:-len(STOCKOUT_SUFFIX)] if v.endswith(STOCKOUT_SUFFIX) else v

            def _catalog_line(c):
                # human line for the field help, prefers the probe-supplied label.
                lbl = c.get('label')
                if lbl:
                    return lbl
                bits = [c.get('name', '?'), c.get('machineType', '')]
                return ' — '.join(b for b in bits if b)

            def _default_class_name(step):
                # GPU-ish steps (model-training, or a step that opts into gpu via the
                # legacy compute:gpu flag / an explicit nvidia.com/gpu request) default
                # to the first AVAILABLE gpu class; everything else to the first
                # available cpu class. If a tier has no available class, fall back to
                # the first class of that tier (still selectable, guard will stop a
                # stocked-out submit) so the form always has a concrete default.
                res = (step.get('resources') or {}).get('requests') or {}
                wants_gpu = str(res.get('nvidia.com/gpu', '')) not in ('', '0') or step.get('compute', 'cpu') == 'gpu'
                pool = (avail_gpu or live_gpu) if wants_gpu else (avail_cpu or live_cpu)
                if not pool:
                    # no class of the wanted tier at all — fall back to any class.
                    pool = avail_cpu or avail_gpu or live_cpu or live_gpu
                return _enum_value(pool[0]) if pool else ''

            # margin subtracted from a class's node allocatable so the sole-tenant step
            # pod still fits alongside the per-node daemonsets (kube-proxy, csi, argo
            # `wait` sidecar, nvidia device-plugin on gpu). The probe already reports
            # allocatable = capacity − GKE reservation; this is the extra daemonset
            # headroom. Keep it small + safe (mirror the legacy SAFETY_MARGIN concept).
            LIVE_CPU_MARGIN = 0.5      # vCPU left for node daemonsets
            LIVE_MEM_MARGIN_GI = 0.5   # GiB left for node daemonsets

            def _whole_node_resources(c):
                # requests==limits == the class node's allocatable minus a small fixed
                # daemonset margin. Sole-tenant on its own ephemeral node ⇒ requests
                # ==limits is safe (Guaranteed QoS, whole machine to the step). GPU
                # classes add nvidia.com/gpu = the class's gpu.count.
                alloc = c.get('allocatable') or {}
                cpu_alloc = float(alloc.get('cpu', 1))
                mem_alloc = float(alloc.get('memoryGiB', 2))
                cpu = max(1, int(cpu_alloc - LIVE_CPU_MARGIN))
                mem = max(1, int(round(mem_alloc - LIVE_MEM_MARGIN_GI)))
                reqs = {'cpu': str(cpu), 'memory': '%dGi' % mem}
                if c.get('tier') == 'gpu':
                    gcount = str(((c.get('gpu') or {}).get('count', 1)))
                    reqs['nvidia.com/gpu'] = gcount
                return dict(reqs), dict(reqs)

            steps = kubeline.get('steps', [])
            pipeline_params = kubeline.get('pipeline', {}).get('parameters', [])

            # ephemeral NodePool name for a (step, run): {prefix}{uid8}.
            # uid8 is a RUN-time truncation of the Argo workflow.uid (concurrent runs
            # of one app get isolated pools). GKE NodePool names are <=40 chars, so the
            # literal "pl-{app}-{step}-" prefix is hashed down when it would overflow.
            # SINGLE source of the prefix — create-nodegroups (the node label) and the
            # DAG task's pool-name input (the pod's nodeSelector) MUST agree byte-for-
            # byte, so both derive it from this one helper.
            import hashlib as _hashlib
            def _pool_prefix(step_name):
                p = 'pl-%s-%s-' % (app_name, step_name)
                if len(p) + 8 > 40:
                    h = _hashlib.sha1(('%s-%s' % (app_name, step_name)).encode()).hexdigest()[:12]
                    p = 'pl-%s-' % h
                return p

            enum_cpu = _enum_values(live_cpu)
            enum_gpu = _enum_values(live_gpu)

            args_params = []

            # ── Read-only form doc (PIPELINE-INFO), live variant ────────────────
            _cpu_lines = '\n'.join('  • ' + _catalog_line(c) for c in live_cpu) or '  • (none)'
            _gpu_lines = '\n'.join('  • ' + _catalog_line(c) for c in live_gpu) or '  • (none)'
            pipeline_info = (
                'HOW TO RUN: defaults below are runnable as-is — just press Submit.\n'
                'PER-STEP COMPUTE: pick a {step}-class for each step. Each step runs on '
                'its OWN dedicated ephemeral GKE node (the WHOLE machine, sole-tenant) '
                'created just for this run and destroyed when it ends.\n'
                'PER-STEP DISK: {step}-disk-gb sizes that node\'s pd-ssd boot/data disk '
                '(default 100 GiB — raise it for large datasets/checkpoints).\n'
                'Classes suffixed "(STOCKOUT)" are temporarily unavailable in-region; '
                'picking one FAILS the run at the guard step.\n'
                'LIVE CATALOG (region %s):\n'
                'CPU:\n' % (catalog.get('region', pool_context.get('region', '?'))) + _cpu_lines + '\n'
                'GPU:\n' + _gpu_lines + '\n'
                '(This field is informational — leave it unchanged.)'
            )
            args_params.append({'name': 'pipeline-info', 'value': pipeline_info,
                                'description': 'Read-only: live pool machine catalog + how to fill this form. Leave unchanged.'})

            for p in pipeline_params:
                args_params.append({'name': p['name'], 'value': p.get('default', ''), 'description': p.get('description', '')})

            for step in steps:
                args_params.append({
                    'name': f"image-{step['name']}",
                    'valueFrom': {'configMapKeyRef': {'name': f"{app_name}-pipeline-images", 'key': step['name']}}
                })

            # ── Per-step class dropdown + disk-gb ───────────────────────────────
            for step in steps:
                sn = step['name']
                default_cls = _default_class_name(step)
                is_gpu_default = _strip_stockout(default_cls) in {c['name'] for c in live_gpu}
                enum = enum_gpu if is_gpu_default else enum_cpu
                # include EVERY class of the tier (available + stocked-out) so the
                # developer sees the full catalog; guard rejects a stocked-out pick.
                cls_param = {
                    'name': f"{sn}-class",
                    'value': default_cls,
                    'description': ('Compute class (dedicated ephemeral node) for the %s step. '
                                    'Allowed: %s. Classes marked (STOCKOUT) are unavailable now.'
                                    % (sn, ', '.join(_catalog_line(by_name[_strip_stockout(v)])
                                                     if _strip_stockout(v) in by_name else v for v in enum))),
                }
                if len(enum) > 1:
                    cls_param['enum'] = enum
                args_params.append(cls_param)
                args_params.append({
                    'name': f"{sn}-disk-gb",
                    'value': '100',
                    'description': ('pd-ssd disk size (GiB) for the %s step\'s ephemeral node. '
                                    'Sized for the dataset + checkpoints this step reads/writes; '
                                    'default 100.' % sn),
                })

            # Platform endpoints/IDs (mlflow/lakefs endpoints, zitadel domain+project
            # id, kubepool-name, lakefs-repo/-branch) are baked into the step env, NOT
            # exposed as form params — same as the static path. node-service-account
            # stays a param: the create-nodegroups gcloud step reads it from
            # workflow.parameters.
            args_params += [
                {'name': 'registered-model-name', 'value': f"{app_name}-model"},
                {'name': 'promote-to', 'value': ''},
                # node-service-account: the shared {org}-node SA the ephemeral nodes run
                # as (workload-identity + registry pull) — matches the cluster's own
                # pools. The operator populates poolContext.nodeServiceAccount; empty
                # ⇒ create-nodegroups omits --service-account and gcloud falls back to
                # the cluster default node SA.
                {'name': 'node-service-account', 'value': pool_context.get('nodeServiceAccount', '')},
            ]

            # gcp coordinates surfaced as params so the create/destroy gcloud steps read
            # them from workflow.parameters (keeps the templates free of render-time
            # literals that would need re-escaping). location/locationType come straight
            # from poolContext: the operator resolves the cluster's ACTUAL GKE location
            # (zonal {region}-c for dev, regional {region} for prod) and the matching
            # gcloud flag name — do NOT reconstruct from region/zone (zone is empty on
            # default dev pools).
            args_params += [
                {'name': 'gcp-project', 'value': pool_context.get('projectId', '')},
                {'name': 'gcp-cluster', 'value': pool_context.get('clusterName', '')},
                {'name': 'gcp-location', 'value': pool_context.get('location', '')},
                {'name': 'gcp-location-type', 'value': pool_context.get('locationType', 'region')},
            ]

            QUANTIZATION_STEPS = {'qat-finetune', 'model-quantization'}

            templates = []
            dag_tasks = []

            # ── create-nodegroups: FIRST task, provisions one ephemeral NodePool per
            # step sized to that step's chosen class ─────────────────────────────
            # Runs gcloud as operate-workflow-sa (WI-bound to {org}-gcp-eso-sa which
            # carries roles/container.developer). Idempotent (tolerates already-exists).
            # These templates reference many workflow params (gcp-* coords + per-step
            # {step}-class / {step}-disk-gb). Argo cannot statically resolve a
            # bracket-quoted hyphenated workflow.parameters['x-class'] embedded in a
            # template body ("failed to resolve" at spec validation), so every value
            # is threaded in as a TEMPLATE INPUT parameter and the DAG task passes the
            # workflow.parameters[...] values as arguments (resolvable at the task layer).
            nodegroup_inputs = [
                {'name': 'gcp-project'}, {'name': 'gcp-cluster'},
                {'name': 'gcp-location'}, {'name': 'gcp-location-type'},
                {'name': 'node-service-account'}, {'name': 'quantization-mode'},
            ]
            for step in steps:
                nodegroup_inputs.append({'name': step['name'] + '-class'})
                nodegroup_inputs.append({'name': step['name'] + '-disk-gb'})
            nodegroup_args = [
                {'name': 'gcp-project', 'value': OB + "workflow.parameters.gcp-project" + CB},
                {'name': 'gcp-cluster', 'value': OB + "workflow.parameters.gcp-cluster" + CB},
                {'name': 'gcp-location', 'value': OB + "workflow.parameters.gcp-location" + CB},
                {'name': 'gcp-location-type', 'value': OB + "workflow.parameters.gcp-location-type" + CB},
                {'name': 'node-service-account', 'value': OB + "workflow.parameters.node-service-account" + CB},
                {'name': 'quantization-mode', 'value': OB + "workflow.parameters.quantization-mode" + CB},
            ]
            for step in steps:
                nodegroup_args.append({'name': step['name'] + '-class',
                                       'value': OB + "workflow.parameters." + step['name'] + "-class" + CB})
                nodegroup_args.append({'name': step['name'] + '-disk-gb',
                                       'value': OB + "workflow.parameters." + step['name'] + "-disk-gb" + CB})
            create_lines = [
                'set -eu',
                'PROJECT="' + OB + "inputs.parameters.gcp-project" + CB + '"',
                'CLUSTER="' + OB + "inputs.parameters.gcp-cluster" + CB + '"',
                'LOCATION="' + OB + "inputs.parameters.gcp-location" + CB + '"',
                'LOCATION_TYPE="' + OB + "inputs.parameters.gcp-location-type" + CB + '"',
                'NODE_SA="' + OB + "inputs.parameters.node-service-account" + CB + '"',
                'UID8=$(echo "' + OB + 'workflow.uid' + CB + '" | tr -d - | cut -c1-8)',
                # gcloud auth via the pod's GKE workload identity (the WI-annotated KSA);
                # google-cloud-sdk picks it up from the metadata server automatically.
                # --{locationType}={location} = --zone=us-central1-c (zonal dev) or
                # --region=europe-west1 (regional prod), straight from poolContext.
                'LOC="--${LOCATION_TYPE}=${LOCATION}"',
            ]
            destroy_lines = list(create_lines)  # same header (coords + UID8 + LOC)

            for step in steps:
                sn = step['name']
                prefix = _pool_prefix(sn)
                cls_param_ref = OB + "inputs.parameters." + sn + "-class" + CB
                disk_param_ref = OB + "inputs.parameters." + sn + "-disk-gb" + CB
                is_quant_step = sn in QUANTIZATION_STEPS
                # A quantization-class step is Skipped on the default (quantization-mode
                # =none) run, so don't provision (or pay for) its node pool — only create
                # it when quantization is actually requested. Non-quant steps always run.
                if is_quant_step:
                    qmode = OB + "inputs.parameters.quantization-mode" + CB
                    create_lines.append('if [ "%s" != "none" ]; then' % qmode)
                create_lines += [
                    'POOL="%s${UID8}"' % prefix,
                    'CLS=$(echo "%s" | sed "s/ (STOCKOUT)//")' % cls_param_ref,
                    'DISK="%s"' % disk_param_ref,
                    'echo "create nodepool $POOL for step %s (class $CLS, disk ${DISK}Gi)"' % sn,
                ]
                # emit a shell case that maps the chosen class name → gcloud flags, so
                # the machineType/accelerator/labels/taints are concrete at run time
                # from the live catalog snapshot baked into the render.
                create_lines.append('case "$CLS" in')
                for c in catalog_classes:
                    cn = c['name']
                    mt = c.get('machineType', '')
                    tier = c.get('tier', 'cpu')
                    flags = ['--machine-type=%s' % mt, '--disk-type=pd-ssd', '--disk-size=${DISK}',
                             '--num-nodes=1', '--enable-private-nodes']
                    labels = 'platform.kubecore.io/nodegroup-type=${POOL},platform.kubecore.io/ml-workload=%s' % tier
                    taints = 'platform.kubecore.io/ml-workload=%s:NoSchedule' % tier
                    if tier == 'gpu':
                        g = c.get('gpu') or {}
                        flags.append('--accelerator=type=%s,count=%d,gpu-driver-version=LATEST'
                                     % (g.get('type', 'nvidia-tesla-t4'), int(g.get('count', 1))))
                        taints += ',nvidia.com/gpu=present:NoSchedule'
                    flags.append('--node-labels=%s' % labels)
                    flags.append('--node-taints=%s' % taints)
                    create_lines.append('  %s)' % cn)
                    create_lines.append('    if [ -n "$NODE_SA" ]; then SA_FLAG="--service-account=$NODE_SA"; else SA_FLAG=""; fi')
                    # Capture output + exit code so a REAL failure (403 IAM, quota,
                    # stockout) fails the step loudly — only an "already exists" pool
                    # (idempotent re-run / concurrent create) is tolerated. The old
                    # `| grep -v ... || true` swallowed every error → false "Succeeded".
                    create_lines.append('    if ! OUT=$(gcloud container node-pools create "$POOL" '
                                        '--cluster="$CLUSTER" $LOC --project="$PROJECT" '
                                        + ' '.join(flags) + ' $SA_FLAG 2>&1); then')
                    create_lines.append('      if echo "$OUT" | grep -q "already exists"; then')
                    create_lines.append('        echo "node pool $POOL already exists — continuing"')
                    create_lines.append('      else')
                    create_lines.append('        echo "ERROR creating node pool $POOL:"; echo "$OUT"; exit 1')
                    create_lines.append('      fi')
                    create_lines.append('    fi ;;')
                create_lines.append('  *) echo "ERROR: class $CLS not in live catalog"; exit 1 ;;')
                create_lines.append('esac')
                if is_quant_step:
                    create_lines.append('fi')
                # destroy is idempotent (tolerates a pool that was never created because
                # the step was skipped), so it runs unconditionally for every step.
                destroy_lines += [
                    'POOL="%s${UID8}"' % prefix,
                    'echo "destroy nodepool $POOL"',
                    'gcloud container node-pools delete "$POOL" --cluster="$CLUSTER" '
                    '$LOC --project="$PROJECT" --quiet 2>&1 | grep -v "was not found" || true',
                ]

            templates.append({
                'name': 'create-nodegroups',
                'metadata': {'labels': {'platform.kubecore.io/pipeline': pipeline_name,
                                        'platform.kubecore.io/nodepool-lifecycle': 'create'}},
                'serviceAccountName': GCLOUD_SA,
                'nodeSelector': {'platform.kubecore.io/nodegroup-type': CI_POOL},
                'tolerations': CI_POOL_TOLERATIONS,
                'inputs': {'parameters': nodegroup_inputs},
                'container': {
                    'image': 'google/cloud-sdk:alpine',
                    'command': ['sh', '-c'],
                    'args': ['\n'.join(create_lines) + '\n'],
                },
            })
            # destroy-nodegroups is invoked as an onExit handler with NO explicit
            # arguments, so its inputs carry DEFAULT values that reference
            # workflow.parameters[...] — the onExit scope CAN resolve those (it runs at
            # workflow level). Only the coords the destroy header needs get defaults.
            destroy_inputs = [
                {'name': 'gcp-project', 'value': OB + "workflow.parameters.gcp-project" + CB},
                {'name': 'gcp-cluster', 'value': OB + "workflow.parameters.gcp-cluster" + CB},
                {'name': 'gcp-location', 'value': OB + "workflow.parameters.gcp-location" + CB},
                {'name': 'gcp-location-type', 'value': OB + "workflow.parameters.gcp-location-type" + CB},
                {'name': 'node-service-account', 'value': OB + "workflow.parameters.node-service-account" + CB},
                {'name': 'quantization-mode', 'value': OB + "workflow.parameters.quantization-mode" + CB},
            ]
            for step in steps:
                destroy_inputs.append({'name': step['name'] + '-class',
                                       'value': OB + "workflow.parameters." + step['name'] + "-class" + CB})
                destroy_inputs.append({'name': step['name'] + '-disk-gb',
                                       'value': OB + "workflow.parameters." + step['name'] + "-disk-gb" + CB})
            templates.append({
                'name': 'destroy-nodegroups',
                'metadata': {'labels': {'platform.kubecore.io/pipeline': pipeline_name,
                                        'platform.kubecore.io/nodepool-lifecycle': 'destroy'}},
                'serviceAccountName': GCLOUD_SA,
                'nodeSelector': {'platform.kubecore.io/nodegroup-type': CI_POOL},
                'tolerations': CI_POOL_TOLERATIONS,
                'inputs': {'parameters': destroy_inputs},
                'container': {
                    'image': 'google/cloud-sdk:alpine',
                    'command': ['sh', '-c'],
                    'args': ['\n'.join(destroy_lines) + '\n'],
                },
            })

            # ── stockout guard: FAIL if any chosen {step}-class is stocked out ──
            # The chosen class values are passed in as TEMPLATE INPUT parameters
            # (not referenced as workflow.parameters[...] inside the container args).
            # Argo cannot statically resolve a bracket-quoted hyphenated
            # workflow.parameters['x-class'] reference embedded in a template body
            # ("failed to resolve" at spec validation), but inputs.parameters
            # resolve reliably because they are declared on the template.
            guard_inputs = []
            guard_lines = ['set -eu', 'BAD=0']
            for step in steps:
                sn = step['name']
                guard_inputs.append({'name': sn + '-class'})
                ref = OB + "inputs.parameters." + sn + "-class" + CB
                guard_lines.append('CLS="%s"' % ref)
                guard_lines.append('case "$CLS" in')
                guard_lines.append('  *"(STOCKOUT)") echo "step %s picked a stocked-out class: $CLS"; BAD=1 ;;' % sn)
                guard_lines.append('esac')
            guard_lines.append('if [ "$BAD" != 0 ]; then echo "One or more steps selected a '
                               'stocked-out compute class. Pick an available class and resubmit."; exit 1; fi')
            guard_lines.append('echo "compute-class stockout guard passed"')
            templates.append({
                'name': 'validate-classes',
                'serviceAccountName': sa,
                'nodeSelector': {'platform.kubecore.io/nodegroup-type': CI_POOL},
                'tolerations': CI_POOL_TOLERATIONS,
                'inputs': {'parameters': guard_inputs},
                'container': {
                    'image': 'busybox:1.36',
                    'command': ['sh', '-c'],
                    'args': ['\n'.join(guard_lines) + '\n'],
                },
            })

            # ── DAG: guard → create-nodegroups → steps → (onExit) destroy ───────
            # Pass each chosen class into validate-classes as an argument — the DAG
            # task layer CAN resolve workflow.parameters[...] (it is not a template body).
            guard_args = [{'name': s['name'] + '-class',
                           'value': OB + "workflow.parameters." + s['name'] + "-class" + CB}
                          for s in steps]
            dag_tasks.append({'name': 'validate-classes', 'template': 'validate-classes',
                              'arguments': {'parameters': guard_args}})
            dag_tasks.append({'name': 'create-nodegroups', 'template': 'create-nodegroups',
                              'depends': 'validate-classes',
                              'arguments': {'parameters': nodegroup_args}})

            def _gate_live(dep):
                # "dep ran-or-was-skipped" — a quant-step dependency (qat-finetune,
                # model-quantization) is Skipped on the default quantization-mode=none
                # run via its `when`; a plain .Succeeded gate would then Omit every
                # downstream (e.g. model-registration depends on qat-finetune). Mirror
                # the legacy Succeeded||Skipped gate so a skipped optional dep never
                # blocks, while a REAL failure (Failed/Error, not Skipped) still does.
                return f"({dep}.Succeeded || {dep}.Skipped)"

            for step in steps:
                sn = step['name']
                deps = step.get('dependencies', []) or []
                # every step depends on create-nodegroups (its pool must exist) plus its
                # kubeline deps. A quant step additionally gates on quantization-mode.
                dep_clauses = ['create-nodegroups.Succeeded'] + [_gate_live(d) for d in deps]
                depends_expr = ' && '.join(dep_clauses)
                inp_params = step.get('inputs', {}).get('parameters', []) if step.get('inputs') else []
                is_quant_step = sn in QUANTIZATION_STEPS
                task = {'name': sn, 'template': sn, 'depends': depends_expr}
                task_params = []
                # pool-name input: the concrete ephemeral pool for this run+step, built
                # at run time to EXACTLY match the NodePool create-nodegroups made
                # (same _pool_prefix + uid8). create-nodegroups computes uid8 as
                # `echo <workflow.uid> | tr -d - | cut -c1-8`; mirror that transform
                # with an Argo expression (sprig replace '-'->'' then trunc 8) so the
                # pod's nodeSelector value is byte-identical to the node label.
                prefix = _pool_prefix(sn)
                # sprig funcs are exposed under the sprig.* namespace in Argo expression
                # templates; replace(old,new,src) then trunc(len,src). Quotes are double
                # inside the =expr (single-quote OB/CB literals are the Python string).
                pool_val = (OB + '=' + '"' + prefix + '" + sprig.trunc(8, sprig.replace("-", "", workflow.uid))' + CB)
                task_params.append({'name': 'pool-name', 'value': pool_val})
                # class-name input: the chosen class for the pod's compute-class label
                # (resolved at the task layer, then passed into the step template).
                task_params.append({'name': 'class-name',
                                    'value': OB + "workflow.parameters." + sn + "-class" + CB})
                if is_quant_step:
                    # when: is an Argo EXPRESSION — needs the =expr form (leading '=');
                    # bracket subscript is valid inside an expression, unlike simple
                    # tags which require dot notation. Per-step gate: qat-finetune
                    # only on == 'qat'; model-quantization on any != 'none'.
                    task['when'] = OB + "=" + _quant_gate_predicate(sn) + CB
                for ip in inp_params:
                    frm = ip.get('from')
                    if not frm:
                        continue
                    # task-output ref in a simple-tag value uses dot notation (bracket
                    # subscript only works inside an =expr). Argo supports dot for
                    # dependency task outputs.
                    expr = OB + f"tasks.{frm}.outputs.parameters.{ip['name']}" + CB
                    task_params.append({'name': ip['name'], 'value': expr})
                task['arguments'] = {'parameters': task_params}
                dag_tasks.append(task)

            templates.append({'name': f"{app_name}-pipeline", 'dag': {'tasks': dag_tasks}})

            def build_live_step_template(step):
                sn = step['name']
                is_quant_step = sn in QUANTIZATION_STEPS
                default_cls_name = _strip_stockout(_default_class_name(step))
                default_cls = by_name.get(default_cls_name, {})
                is_gpu_default = default_cls.get('tier') == 'gpu'
                # concrete resources sized to the DEFAULT class (Argo needs concrete
                # quantities in container.resources); the per-run whole-node override
                # for the ACTUAL chosen class is applied via podSpecPatch below.
                sized_req, sized_lim = _whole_node_resources(default_cls) if default_cls else (
                    {'cpu': '1', 'memory': '2Gi'}, {'cpu': '1', 'memory': '2Gi'})

                container = {
                    'image': OB + 'workflow.parameters.image-' + sn + CB,
                    'resources': {'requests': sized_req, 'limits': sized_lim},
                }
                if step.get('command'):
                    container['command'] = step['command']
                if step.get('args'):
                    container['args'] = step['args']

                env_list = [
                    # Platform endpoints/IDs baked as literal render-time values (not
                    # workflow parameters) — same as the static path — so they never
                    # appear as editable plumbing boxes in the submit form.
                    {'name': 'MLFLOW_TRACKING_URI', 'value': mlflow.get('trackingUri', '')},
                    {'name': 'LAKEFS_ENDPOINT', 'value': lakefs.get('endpoint', '')},
                    {'name': 'LAKEFS_ACCESS_KEY', 'valueFrom': {'secretKeyRef': {'name': lakefs.get('adminSecret', f"{project_name}-lakefs-admin"), 'key': 'accessKeyId'}}},
                    {'name': 'LAKEFS_SECRET_KEY', 'valueFrom': {'secretKeyRef': {'name': lakefs.get('adminSecret', f"{project_name}-lakefs-admin"), 'key': 'secretAccessKey'}}},
                    {'name': 'MLFLOW_TRACKING_AUTH', 'value': 'zitadel'},
                    {'name': 'ZITADEL_MACHINE_KEY_FILE', 'value': '/etc/mlflow-svc/ZITADEL_MACHINE_KEY'},
                    {'name': 'ZITADEL_DOMAIN', 'value': mlflow.get('oidcDomain', '')},
                    {'name': 'ZITADEL_MLFLOW_PROJECT_ID', 'value': str(mlflow.get('oidcProjectId', ''))},
                ]
                ckpt_bucket = checkpoints.get('bucket', '')
                ckpt_prefix = checkpoints.get('prefix', '')
                if ckpt_bucket:
                    env_list.append({'name': 'CHECKPOINT_BUCKET', 'value': ckpt_bucket})
                if ckpt_prefix:
                    env_list.append({'name': 'CHECKPOINT_PREFIX', 'value': ckpt_prefix})
                for e in (step.get('env') or []):
                    env_list.append(_rewrite_params_yaml(e, bool(dataset_pathoverride_expr)))
                container['env'] = env_list

                mlflow_svc_secret = mlflow.get('svcSecret', f"{project_name}-mlflow-svc")
                container['volumeMounts'] = [
                    {'name': 'mlflow-svc', 'mountPath': '/etc/mlflow-svc', 'readOnly': True},
                    {'name': 'dshm', 'mountPath': '/dev/shm'},
                ]

                # tolerations: the ephemeral node is tainted with the step's tier
                # (platform.kubecore.io/ml-workload) + nvidia.com/gpu for gpu. Tolerate
                # BOTH tiers so whichever class the developer picks schedules; the
                # nodeSelector (pool-name) still pins the pod to its own node.
                step_tolerations = [
                    {'key': 'platform.kubecore.io/ml-workload', 'operator': 'Exists', 'effect': 'NoSchedule'},
                    {'key': 'nvidia.com/gpu', 'operator': 'Exists', 'effect': 'NoSchedule'},
                ]

                tmpl = {
                    'name': sn,
                    # class-name is threaded in as an input (the invoking task passes
                    # workflow.parameters['{sn}-class']) — a bracket-quoted hyphenated
                    # workflow.parameters ref in a pod-template label body does not
                    # statically resolve, same as validate-classes/create-nodegroups.
                    'inputs': {'parameters': [{'name': 'pool-name'}, {'name': 'class-name'}]},
                    'metadata': {
                        'labels': {
                            'platform.kubecore.io/project': project_name,
                            'platform.kubecore.io/pipeline': pipeline_name,
                            'platform.kubecore.io/step': sn,
                            'platform.kubecore.io/compute-type': 'gpu' if is_gpu_default else 'cpu',
                            'platform.kubecore.io/compute-class': OB + 'inputs.parameters.class-name' + CB,
                        }
                    },
                    'nodeSelector': {'platform.kubecore.io/nodegroup-type': OB + 'inputs.parameters.pool-name' + CB},
                    'tolerations': step_tolerations,
                    'serviceAccountName': sa,
                    'retryStrategy': {
                        'limit': '2',
                        'retryPolicy': 'OnError',
                        'backoff': {'duration': '30s', 'factor': '2', 'maxDuration': '5m'},
                    },
                    'activeDeadlineSeconds': 10800 if (is_gpu_default or is_quant_step) else 1800,
                    'container': container,
                    'volumes': [
                        {'name': 'mlflow-svc', 'secret': {'secretName': mlflow_svc_secret, 'optional': True}},
                        {'name': 'dshm', 'emptyDir': {'medium': 'Memory', 'sizeLimit': '1Gi'}},
                    ],
                }

                # podSpecPatch: override the main container to the WHOLE-NODE resources
                # of the ACTUAL chosen class. container.resources (above) carries the
                # DEFAULT class's concrete quantities (Argo needs concrete values there);
                # this patch swaps them for the chosen class at run time. Each class's
                # whole-node resources are known at RENDER time, so bake a per-class
                # ternary chain keyed on the {step}-class param value (pools carry a
                # handful of classes, so the chain is short). This is the same
                # podSpecPatch mechanism the legacy path uses to parameterize resources.
                cpu_expr_parts = []
                mem_expr_parts = []
                gpu_expr_parts = []
                for c in catalog_classes:
                    r, _ = _whole_node_resources(c)
                    cond = "workflow.parameters['" + sn + "-class'] == '" + c['name'] + "'"
                    cpu_expr_parts.append((cond, r['cpu']))
                    mem_expr_parts.append((cond, r['memory']))
                    gpu_expr_parts.append((cond, r.get('nvidia.com/gpu', '0')))
                def _ternary(parts, fallback):
                    expr = "'" + fallback + "'"
                    for cond, val in reversed(parts):
                        expr = "(%s ? '%s' : %s)" % (cond, val, expr)
                    return expr
                cpu_e = OB + '=' + _ternary(cpu_expr_parts, sized_req['cpu']) + CB
                mem_e = OB + '=' + _ternary(mem_expr_parts, sized_req['memory']) + CB
                gpu_e = OB + '=' + _ternary(gpu_expr_parts, '0') + CB
                patch_lines = [
                    'containers:', '- name: main', '  resources:', '    requests:',
                    '      cpu: "%s"' % cpu_e, '      memory: "%s"' % mem_e,
                    '      nvidia.com/gpu: "%s"' % gpu_e,
                    '    limits:',
                    '      cpu: "%s"' % cpu_e, '      memory: "%s"' % mem_e,
                    '      nvidia.com/gpu: "%s"' % gpu_e,
                ]
                tmpl['podSpecPatch'] = '\n'.join(patch_lines) + '\n'

                inp = step.get('inputs', {}).get('parameters', []) if step.get('inputs') else []
                extra_in = [{'name': p['name']} for p in inp]
                if extra_in:
                    tmpl['inputs']['parameters'] += extra_in
                out = step.get('outputs', {}).get('parameters', []) if step.get('outputs') else []
                if out:
                    tmpl['outputs'] = {'parameters': [{'name': p['name'], 'valueFrom': {'path': p['path']}} for p in out]}
                return tmpl

            for step in steps:
                templates.append(build_live_step_template(step))

            if hpc.get('enabled'):
                provider = hpc.get('provider', 'none')
                templates.append({
                    'name': 'hpc-burst',
                    'container': {
                        'image': 'busybox:1.36',
                        'command': ['sh', '-c'],
                        'args': [f'echo "HPC burst placeholder, provider={provider} not yet wired"']
                    }
                })

            wft = {
                'apiVersion': 'argoproj.io/v1alpha1',
                'kind': 'WorkflowTemplate',
                'metadata': {
                    'name': f"{app_name}-pipeline",
                    'namespace': ml_ns,
                    'annotations': {
                        'platform.kubecore.io/cost-tracking': 'enabled',
                        'platform.kubecore.io/pipeline': pipeline_name,
                        'platform.kubecore.io/compute-model': 'live-ephemeral-nodegroups',
                        'platform.kubecore.io/generated-by': 'ml-ci-build/render-wft',
                        'platform.kubecore.io/rendered-from-commit-time': str(os.environ.get('SRC_COMMIT_TIME', '0')),
                    },
                    'labels': {
                        'platform.kubecore.io/project': project_name,
                        'platform.kubecore.io/app': app_name,
                        'platform.kubecore.io/managed-by': 'kubecore-ci',
                    }
                },
                'spec': {
                    'serviceAccountName': sa,
                    'entrypoint': f"{app_name}-pipeline",
                    # onExit destroys every ephemeral NodePool for this run regardless of
                    # success/failure — the primary teardown (janitor CronWorkflow is the
                    # backstop for a crashed controller).
                    'onExit': 'destroy-nodegroups',
                    'arguments': {'parameters': args_params},
                    'templates': templates,
                }
            }

            os.makedirs(os.path.dirname(wft_out), exist_ok=True)
            with open(wft_out, 'w') as f:
                yaml.dump(wft, f, default_flow_style=False, allow_unicode=True, sort_keys=False)
            print(f"render-wft: wrote LIVE-compute WFT {wft_out}")
            sys.exit(0)

        # ── Headroom-aware step sizing ──────────────────────────────────────
        # A step must NOT request the node's full capacity: the node also runs
        # kube/system-reserved + the eviction threshold, the Argo `wait` sidecar
        # that rides every workflow pod, and — on GPU nodes — the nvidia
        # device-plugin + driver-installer daemonsets. Requesting the whole
        # machine => the pod Pends forever. So we derive per-step requests from
        # the chosen class's machineType capacity MINUS a reserve. cpu/mem of the
        # common GCP + AWS ML machine types (vCPU, GiB). Unknown types fall back
        # to a safe small request (the step still schedules; admin can size up).
        MACHINE_CAP = {
            # GCP
            'e2-standard-2': (2, 8),   'e2-standard-4': (4, 16),  'e2-standard-8': (8, 32),
            'n2-standard-4': (4, 16),  'n2-standard-8': (8, 32),  'n2-standard-16': (16, 64),
            'n1-standard-4': (4, 15),  'n1-standard-8': (8, 30),  'n1-standard-16': (16, 60),
            'g2-standard-4': (4, 16),  'g2-standard-8': (8, 32),  'g2-standard-16': (16, 64),
            'a2-highgpu-1g': (12, 85),
            # AWS
            'm6i.large': (2, 8),   'm6i.xlarge': (4, 16),  'm6i.2xlarge': (8, 32),
            'g4dn.xlarge': (4, 16), 'g4dn.2xlarge': (8, 32), 'g5.xlarge': (4, 16), 'g5.2xlarge': (8, 32),
        }
        ARGO_SIDECAR_CPU_M = 100           # the `wait` sidecar on every workflow pod
        ARGO_SIDECAR_MEM_GI = 0.2          # wait sidecar + small per-pod overhead
        SAFETY_MARGIN_GI = 1.0             # headroom below allocatable so the pod always fits

        def _gke_mem_reserved_gib(cap_gib):
            # GKE's memory eviction-reservation curve (the kube-reserved memory that
            # makes node ALLOCATABLE < capacity). Requesting capacity*(1-flat%) is
            # WRONG — a flat 15% under-reserves on small nodes and the pod goes
            # Unschedulable (n2-standard-4 16Gi → ~12.96Gi allocatable, NOT 13.6).
            # Curve: 25% of first 4Gi + 20% of next 4Gi + 10% of next 8Gi +
            # 6% of next 112Gi + 2% beyond, plus 100Mi hard-eviction.
            r = 0.0
            tiers = [(4, 0.25), (4, 0.20), (8, 0.10), (112, 0.06)]
            rem = cap_gib
            for size, frac in tiers:
                take = min(rem, size)
                r += take * frac
                rem -= take
                if rem <= 0:
                    break
            if rem > 0:
                r += rem * 0.02
            return r + 0.1  # +100Mi eviction threshold

        def _sized_requests(cls, is_gpu):
            # Returns (requests, limits) sized to fit UNDER the class node's GKE
            # allocatable (capacity - GKE-reserved - argo sidecar - safety margin),
            # so a scale-to-0 nodepool actually schedules the pod (and the autoscaler
            # provisions a node) instead of "Insufficient memory / didn't match".
            mt = (cls or {}).get('machineType', '')
            cap = MACHINE_CAP.get(mt)
            if not cap:
                req_cpu, req_mem = (2, 6) if is_gpu else (1, 3)
                lim_cpu, lim_mem = (4, 10) if is_gpu else (2, 5)
            else:
                cap_cpu, cap_mem = cap
                alloc_mem = cap_mem - _gke_mem_reserved_gib(cap_mem)
                # CPU: GKE reserves only ~70-90m; leave 0.5 vCPU + the argo sidecar.
                req_cpu = max(1, int(cap_cpu - 0.5 - ARGO_SIDECAR_CPU_M / 1000.0))
                req_mem = max(2, int(alloc_mem - ARGO_SIDECAR_MEM_GI - SAFETY_MARGIN_GI))
                # limit can use the full allocatable (burst into the sidecar/margin),
                # but never above allocatable or the pod gets OOM-evicted at admission.
                lim_cpu = max(req_cpu, int(cap_cpu - 0.5))
                lim_mem = max(req_mem, int(alloc_mem - SAFETY_MARGIN_GI))
            requests = {'cpu': str(req_cpu), 'memory': f'{req_mem}Gi', 'ephemeral-storage': '10Gi' if is_gpu else '2Gi'}
            limits = {'cpu': str(lim_cpu), 'memory': f'{lim_mem}Gi', 'ephemeral-storage': '30Gi' if is_gpu else '4Gi'}
            if is_gpu:
                requests['nvidia.com/gpu'] = '1'
                limits['nvidia.com/gpu'] = '1'
            return requests, limits

        steps = kubeline.get('steps', [])
        pipeline_params = kubeline.get('pipeline', {}).get('parameters', [])

        args_params = []

        # ── Read-only form doc (PIPELINE-INFO) ──────────────────────────────────────
        # A first parameter whose value is a human summary of the LIVE pool config +
        # how the form works. Argo shows it at the top of the submit form; the
        # developer reads it before filling anything. Its description tells them it is
        # informational only. (Argo has no native section headers, so a doc param is
        # the idiomatic way to surface live config + instructions on the form.)
        _cpu_lines = '\n'.join('  • ' + _class_line(c) for c in cpu_classes) or '  • (none)'
        _gpu_lines = '\n'.join('  • ' + _class_line(c) for c in gpu_classes) or '  • (none)'
        pipeline_info = (
            'HOW TO RUN: defaults below are headroom-sized and runnable as-is — just press Submit.\n'
            'PER-STEP COMPUTE: set {step}-cpu / {step}-mem / {step}-gpu for each step. '
            '{step}-gpu > 0 routes that step to a GPU node pool; 0 keeps it on CPU.\n'
            'COMPUTE CLASSES on this pool (cpu-class / gpu-class pick the node pool):\n'
            'CPU:\n' + _cpu_lines + '\n'
            'GPU:\n' + _gpu_lines + '\n'
            '(This field is informational — leave it unchanged.)'
        )
        args_params.append({'name': 'pipeline-info', 'value': pipeline_info,
                            'description': 'Read-only: live pool compute classes + how to fill this form. Leave unchanged.'})

        # ── dataset-ref DROPDOWN (from the lakeFS dataset catalog) ──────────
        # A dataset = a lakeFS ref (tag/branch) whose ROOT holds a data.yaml. The
        # ml-dataset-catalog-probe CronWorkflow discovers these and publishes the
        # kubecore-ml-dataset-catalog ConfigMap; render-wft reads it (via the pod
        # SA — NO lakeFS creds needed here) and offers the refs as a dropdown. The
        # picked ref's immutable commit is threaded to the dataset steps as
        # path_override=s3://{repo}/{sha}/ so a run trains on a frozen snapshot.
        # Falls back silently to no-dropdown (free-text dataset-path-override still
        # works) if the catalog ConfigMap is absent — datasets uploaded after the
        # last probe are reachable via the override escape hatch.
        dataset_catalog = None
        try:
            _dcat = _read_live_catalog('kubecore-ml-dataset-catalog', 'argo-workflows')
            dataset_catalog = _dcat.get('datasets') or []
        except Exception:
            dataset_catalog = []
        dataset_enum = [d['ref'] for d in dataset_catalog if d.get('ref') and d.get('available')]
        # ref → immutable-commit path_override, for the DAG to pin the snapshot.
        dataset_override_by_ref = {d['ref']: d.get('pathOverride', '') for d in dataset_catalog}
        dataset_label_lines = '\n'.join('  • ' + (d.get('label') or d.get('ref', '?')) for d in dataset_catalog) or '  • (none discovered — use dataset-path-override)'

        _emitted_names = set()
        for p in pipeline_params:
            np = {'name': p['name'], 'value': p.get('default', ''), 'description': p.get('description', '')}
            # preserve a kubeline-declared enum so a static dropdown survives render.
            if p.get('enum'):
                np['enum'] = list(p['enum'])
            # turn dataset-ref into a live dropdown from the catalog (overrides any
            # kubeline default/enum); the developer picks a real, existing dataset.
            if p['name'] == 'dataset-ref' and dataset_enum:
                np['enum'] = dataset_enum
                if np.get('value') not in dataset_enum:
                    np['value'] = dataset_enum[0]
                np['description'] = ('Dataset to train on — a lakeFS ref discovered by the dataset-catalog probe. '
                                     'Each is an immutable, self-describing dataset (data.yaml at its root).\n'
                                     + dataset_label_lines)
            args_params.append(np)
            _emitted_names.add(p['name'])

        # Resolve the picked dataset-ref -> its frozen-commit path. This must NOT be
        # a form-param default: the Argo submit form shows a param's value as literal
        # text, so an Argo expression there renders as raw syntax in the field (ugly
        # + wrong — and it clobbers dataset-path-override, the manual escape hatch).
        # Instead we build the ternary here and INJECT it into the dataset steps'
        # PARAMS_YAML path_override line (a template body, where Argo actually
        # evaluates the expression at run time). The escape hatch wins when the user
        # sets it: override-nonempty ? override : ref-to-commit. dataset-path-override
        # stays an empty free-text field. dataset_pathoverride_expr (empty if no
        # catalog) is consumed in the step env-copy loop below.
        dataset_pathoverride_expr = ''
        if dataset_enum:
            _ref_ternary = "''"
            for r in reversed(dataset_enum):
                ov = dataset_override_by_ref.get(r, '')
                _ref_ternary = ("workflow.parameters['dataset-ref'] == '" + r + "' ? '" + ov + "' : " + _ref_ternary)
            # user override (dataset-path-override) wins; else the ref→commit path.
            dataset_pathoverride_expr = (OB + "=workflow.parameters['dataset-path-override'] != '' ? "
                                         "workflow.parameters['dataset-path-override'] : " + _ref_ternary + CB)

        cpu_class_name = cpu_cls.get('name', f"{pipeline_name}-cpu")
        gpu_class_name = gpu_cls.get('name', f"{pipeline_name}-gpu")
        # cpu-class / gpu-class: defaulted to the pool's default class, with a
        # description listing EVERY allowed class of that tier. We ALWAYS attach the
        # enum (even for a single class) so the Argo submit form renders a DROPDOWN of
        # the valid pool classes instead of a free-text box — a 1-item enum renders as
        # a one-choice dropdown, which is the right UX (the user sees the valid value
        # and can't typo it into a nonexistent pool → Unschedulable). This keeps
        # gpu-class consistent with cpu-class even on single-GPU-class pools.
        cpu_enum = [c['name'] for c in cpu_classes if c.get('name')]
        gpu_enum = [c['name'] for c in gpu_classes if c.get('name')]
        cpu_class_param = {'name': 'cpu-class', 'value': cpu_class_name, 'description': _allowed_desc(cpu_classes, 'cpu')}
        gpu_class_param = {'name': 'gpu-class', 'value': gpu_class_name, 'description': _allowed_desc(gpu_classes, 'gpu')}
        if cpu_enum:
            cpu_class_param['enum'] = cpu_enum
        if gpu_enum:
            gpu_class_param['enum'] = gpu_enum
        args_params.append(cpu_class_param)
        args_params.append(gpu_class_param)

        # NOTE: the per-step container images are NOT declared as workflow
        # arguments.parameters — Argo renders every arguments.parameter as an
        # editable field in the submit form, and 6 empty "image-<step>" boxes are
        # confusing internal plumbing a user must never touch. Instead each step
        # TEMPLATE declares an `image` input with valueFrom.configMapKeyRef into the
        # {app}-pipeline-images ConfigMap (see build_step_template). Template inputs
        # are NOT shown in the submit form, and Argo still resolves the image from
        # the ConfigMap at run time — so patch-images keeps updating images WITHOUT
        # a WFT re-render, exactly as before.

        # ── Per-step compute-class DROPDOWN (whole-node, scale-to-zero) ──────
        # The engineer picks ONE compute class per step from a dropdown of the pool's
        # classes (each shows specs). The chosen class fully determines the step:
        #   * which static scale-to-zero pool it runs on (nodeSelector = class name)
        #   * whether it's a GPU step (class tier) -> adds nvidia.com/gpu + GPU toleration
        #   * the step's resources -- WHOLE NODE (requests==limits == class.allocatable,
        #     computed by the platform, sole-tenant Guaranteed QoS). The developer sets
        #     NO cpu/mem/gpu numbers -- the platform sizes the whole machine.
        # No ephemeral pools, no gcloud, no extra IAM: the GKE autoscaler brings the
        # class's pool up 0->1 when the step's pod lands, and scales back to 0 after.
        def _default_class_for(step):
            want_gpu = step.get('compute', 'cpu') == 'gpu'
            r = (step.get('resources') or {}).get('requests') or {}
            if r.get('nvidia.com/gpu') not in (None, '', '0', 0):
                want_gpu = True
            if want_gpu and gpu_cls.get('name'):
                return gpu_cls['name']
            return cpu_cls.get('name') or (cpu_classes[0]['name'] if cpu_classes else '')

        _class_enum = [c['name'] for c in all_classes if c.get('name')]
        _class_help = 'Pool compute classes (WHOLE node each, scale-to-zero):\n' + \
            '\n'.join('  - ' + _class_line(c) for c in all_classes)

        for step in steps:
            sn = step['name']
            p = {'name': f"{sn}-class", 'value': _default_class_for(step),
                 'description': (f"Compute class for the {sn} step -- runs on the WHOLE node "
                                 f"(platform-sized, sole-tenant), on a scale-to-zero pool.\n"
                                 + _class_help)}
            if _class_enum:
                p['enum'] = _class_enum
            args_params.append(p)

        # Only genuine user-facing choices are workflow parameters (form fields):
        #   registered-model-name — the MLflow model name (sensible default, editable)
        #   promote-to — optional target stage the user may pick
        # The platform endpoints/IDs (mlflow/lakefs endpoints, zitadel domain+project
        # id, kubepool-name, lakefs-repo/-branch) are NOT parameters: they were 6+
        # editable internal-plumbing boxes in the submit form. Their values are baked
        # directly into the step env (literal render-time values from pipeline-context)
        # by the env build above and by _rewrite_params_yaml — same runtime values,
        # no form clutter. lakefs-branch specifically was DEAD: PARAMS_YAML already
        # derives the branch from the picked dataset-ref, so the lakefs-branch box
        # only showed a stale, contradictory value (dev while dataset-ref=main).
        args_params += [
            {'name': 'registered-model-name', 'value': f"{app_name}-model"},
            {'name': 'promote-to', 'value': ''},
        ]

        # ── DAG: two variants per step, selected at submit time ─────────────
        # Each step is emitted as TWO tasks — {step}-cpu and {step}-gpu — gated by
        # a `when:` on the form's {step}-gpu param. Exactly one runs; the other is
        # Skipped. A downstream step depends on BOTH variants of each of its
        # dependencies with the Succeeded||Skipped gate, so it runs iff the variant
        # that actually executed Succeeded (a real failure leaves that clause false
        # → the dependent is Omitted), while the skipped sibling never blocks it.
        # Argo can't conditionally drop the nvidia.com/gpu resource key from a single
        # template, so two concrete templates are the robust Argo-native form.
        def _gate(dep):
            # "dep ran-or-skipped, for both variants" — true exactly when whichever
            # variant ran reached Succeeded (the skipped one is always Skipped).
            return f"({dep}-cpu.Succeeded || {dep}-cpu.Skipped) && ({dep}-gpu.Succeeded || {dep}-gpu.Skipped)"

        # Steps that belong to the quantization sub-pipeline: they only make sense
        # when the run actually asks for quantization (quantization-mode != none).
        # Without this gate they run on EVERY pipeline — including the default
        # quantization-mode=none — and a quantization-only failure (e.g. the QAT
        # image's torchao stack) fails the whole run even though the user never
        # requested quantization (live yolo/e2e 2026-07-02: qat-finetune ImportError
        # on convert_pt2e blocked an otherwise-green train→register run on defaults).
        # Detected by name so a pipeline without these steps is unaffected.
        QUANTIZATION_STEPS = {'qat-finetune', 'model-quantization'}

        # The GPU-class name set drives the cpu-vs-gpu variant selection: a step runs
        # its gpu variant when its {step}-class is one of the pool's gpu-tier classes,
        # else the cpu variant. Built as an Argo expr membership test over the chosen
        # class param. Exactly one variant runs; the other is Skipped.
        _gpu_names = [c['name'] for c in gpu_classes if c.get('name')]

        def _is_gpu_expr(sn):
            if not _gpu_names:
                return "false"
            return " || ".join(
                "workflow.parameters['" + sn + "-class'] == '" + n + "'" for n in _gpu_names)

        templates = []
        dag_tasks = []
        for step in steps:
            sn = step['name']
            deps = step.get('dependencies', []) or []
            depends_expr = " && ".join(_gate(d) for d in deps) if deps else ""
            inp_params = step.get('inputs', {}).get('parameters', []) if step.get('inputs') else []
            is_quant_step = sn in QUANTIZATION_STEPS
            gpu_expr = _is_gpu_expr(sn)
            for variant in ('cpu', 'gpu'):
                # gpu variant runs when the chosen class is a gpu class; cpu otherwise.
                sel = gpu_expr if variant == 'gpu' else "!(" + gpu_expr + ")"
                when = OB + "=" + sel + CB
                if is_quant_step:
                    # AND the compute-router gate with the per-step quantization-enable
                    # gate: the variant runs only when it's the selected compute AND the
                    # step's quant predicate holds (qat-finetune → == 'qat',
                    # model-quantization → != 'none').
                    when = OB + "=(" + sel + ") && " + _quant_gate_predicate(sn) + CB
                task = {'name': f"{sn}-{variant}", 'template': f"{sn}-{variant}", 'when': when}
                if depends_expr:
                    task['depends'] = depends_expr
                task_args = []
                # Supply the resolved dataset-path-override to EVERY step (config-
                # validation has no deps but still needs it). Task-argument values ARE
                # evaluated by Argo, so the an Argo =expression ref->commit ternary resolves here
                # and reaches the step via inputs.parameters.dataset-path-override.
                if dataset_pathoverride_expr:
                    task_args.append({'name': 'dataset-path-override', 'value': dataset_pathoverride_expr})
                if inp_params:
                    # An input wired `from: <dep>` resolves from whichever variant of that
                    # dep ran. Select the source by the dep's OWN class-is-gpu test (the
                    # two variants are mutually exclusive on it) — NOT by probing both
                    # tasks' outputs (a Skipped task has no .outputs object, so referencing
                    # the skipped sibling makes the whole Argo expr fail to resolve).
                    for ip in inp_params:
                        frm = ip.get('from')
                        if not frm:
                            continue
                        frm_gpu = _is_gpu_expr(frm)
                        expr = (OB + "=(" + frm_gpu + ") ? "
                                f"tasks['{frm}-gpu'].outputs.parameters['{ip['name']}'] : "
                                f"tasks['{frm}-cpu'].outputs.parameters['{ip['name']}']" + CB)
                        task_args.append({'name': ip['name'], 'value': expr})
                if task_args:
                    task['arguments'] = {'parameters': task_args}
                dag_tasks.append(task)
        templates.append({'name': f"{app_name}-pipeline", 'dag': {'tasks': dag_tasks}})

        def build_step_template(step, is_gpu):
            sn = step['name']
            # Quantization-class steps get a longer activeDeadlineSeconds (see below).
            # QUANTIZATION_STEPS is module-scope; recompute locally since this helper
            # is a separate function from the DAG-task loop.
            is_quant_step = sn in QUANTIZATION_STEPS
            # Placement: the cpu variant targets the cpu-class param, the gpu variant the
            # gpu-class param. The nodeSelector references the EDITABLE workflow param
            # (cpu-class / gpu-class) — defaulted to the pool's default class, but the
            # developer can override it on the submit form to any allowed class of that
            # tier (the field's ? help + enum list the allowed set). So a class edit on
            # the form actually moves the step; routing cpu-vs-gpu is still driven by the
            # step's {step}-gpu count (>0 → gpu variant runs, else cpu variant).
            class_param = 'gpu-class' if is_gpu else 'cpu-class'
            cls = gpu_cls if is_gpu else cpu_cls
            tol_key = cls.get('tolerationKey', 'platform.kubecore.io/ml-workload')
            tol_val = cls.get('tolerationValue', '')
            tol = {'key': tol_key, 'operator': 'Exists' if not tol_val else 'Equal', 'effect': 'NoSchedule'}
            if tol_val:
                tol['value'] = tol_val
            step_tolerations = [tol]
            if is_gpu:
                # GKE auto-taints accelerator nodes with nvidia.com/gpu; without
                # this toleration a gpu-tier step Pends forever on its own pool.
                step_tolerations.append({'key': 'nvidia.com/gpu', 'operator': 'Exists', 'effect': 'NoSchedule'})

            # container.resources MUST carry CONCRETE quantities — an Argo param template in
            # a k8s resource field fails quantity validation and breaks the Argo API's
            # ListWorkflowTemplates (the UI then shows NO templates at all). So the
            # static defaults below (headroom-sized for the class) are the parsed value;
            # the per-run submit-form override is applied via podSpecPatch (below), the
            # only Argo mechanism that parameterizes non-string fields like resources.
            sized_req, sized_lim = _sized_requests(cls, is_gpu)

            container = {
                # image from the step template's own `image` input (declared below
                # with valueFrom.configMapKeyRef), NOT a workflow parameter — keeps
                # the 6 image-<step> boxes out of the submit form.
                'image': OB + 'inputs.parameters.image' + CB,
                'resources': {'requests': sized_req, 'limits': sized_lim},
            }
            if step.get('command'):
                container['command'] = step['command']
            if step.get('args'):
                container['args'] = step['args']

            # Platform endpoints/IDs are BAKED as literal render-time values here,
            # NOT referenced as workflow parameters — render-wft already knows them
            # (from pipeline-context), and exposing them as workflow.parameters put 6
            # editable internal-plumbing boxes (mlflow/lakefs endpoints, zitadel ids)
            # in the submit form that a user must never touch. Baking removes them
            # from the form entirely while keeping the exact same runtime values.
            env_list = [
                {'name': 'MLFLOW_TRACKING_URI', 'value': mlflow.get('trackingUri', '')},
                {'name': 'LAKEFS_ENDPOINT', 'value': lakefs.get('endpoint', '')},
                {'name': 'LAKEFS_ACCESS_KEY', 'valueFrom': {'secretKeyRef': {'name': lakefs.get('adminSecret', f"{project_name}-lakefs-admin"), 'key': 'accessKeyId'}}},
                {'name': 'LAKEFS_SECRET_KEY', 'valueFrom': {'secretKeyRef': {'name': lakefs.get('adminSecret', f"{project_name}-lakefs-admin"), 'key': 'secretAccessKey'}}},
                # MLflow auth = OIDC bearer JWT (no basic-auth). The {project}-mlflow-svc
                # secret holds a Zitadel machine key (ZITADEL_MACHINE_KEY), mounted as a
                # file below. The step image's `zitadel` RequestAuthProvider
                # (MLFLOW_TRACKING_AUTH=zitadel) reads ZITADEL_MACHINE_KEY_FILE, mints a
                # short-lived RS256 JWT via the JWT-profile grant, and refreshes per
                # request — so a long training run never 401s mid-run. Replaces the old
                # basic-auth MLFLOW_TRACKING_USERNAME/PASSWORD path (seeded svc-user in
                # the plugin DB), which drifted and 401'd.
                {'name': 'MLFLOW_TRACKING_AUTH', 'value': 'zitadel'},
                {'name': 'ZITADEL_MACHINE_KEY_FILE', 'value': '/etc/mlflow-svc/ZITADEL_MACHINE_KEY'},
                # ZITADEL_DOMAIN drives both the token endpoint and the JWT-profile
                # assertion audience; baked from pipeline-context's mlflow.oidcDomain.
                {'name': 'ZITADEL_DOMAIN', 'value': mlflow.get('oidcDomain', '')},
                # ZITADEL_MLFLOW_PROJECT_ID adds the project-aud scope so the minted
                # token is accepted by the MLflow OIDC app (fixes 401 "Invalid token
                # payload"). Empty when MLflow OIDC is disabled. Baked from context.
                {'name': 'ZITADEL_MLFLOW_PROJECT_ID', 'value': str(mlflow.get('oidcProjectId', ''))},
            ]
            # Inject platform-derived checkpoint location when present in context.yaml.
            # checkpoints.bucket = lakeFS repository name; checkpoints.prefix = branch/path
            # within that repo (lakeFS S3 gateway addressing: bucket=repo, prefix=branch/...).
            # Only injected when the composition wrote the checkpoints block; absent on
            # legacy deployments that pre-date Edit 1 — kubeline shims tolerate absence.
            ckpt_bucket = checkpoints.get('bucket', '')
            ckpt_prefix = checkpoints.get('prefix', '')
            if ckpt_bucket:
                env_list.append({'name': 'CHECKPOINT_BUCKET', 'value': ckpt_bucket})
            if ckpt_prefix:
                env_list.append({'name': 'CHECKPOINT_PREFIX', 'value': ckpt_prefix})
            for e in (step.get('env') or []):
                env_list.append(_rewrite_params_yaml(e, bool(dataset_pathoverride_expr)))
            container['env'] = env_list

            # Mount the {project}-mlflow-svc Zitadel machine key as a file so the
            # step's `zitadel` MLflow auth provider can read ZITADEL_MACHINE_KEY_FILE.
            # optional=True: the secret exists only when MLflow OIDC is enabled; steps
            # that don't talk to MLflow simply never read it.
            mlflow_svc_secret = mlflow.get('svcSecret', f"{project_name}-mlflow-svc")
            container['volumeMounts'] = [
                {'name': 'mlflow-svc', 'mountPath': '/etc/mlflow-svc', 'readOnly': True},
                # /dev/shm — the k8s default is 64Mi, far too small for a torch
                # DataLoader with workers>0: worker processes pass tensors to the
                # main process through POSIX shared memory, and 64Mi exhausts
                # instantly → "unable to allocate shared memory(shm) ... Resource
                # temporarily unavailable (11)" spam and, worse, a WEDGED trainer
                # (GPU 0%, no epochs; live yolo/e2e 2026-07-02: hung after MLflow
                # experiment-create). A memory-backed emptyDir gives a real
                # /dev/shm; sizeLimit caps it so it can't eat the whole node.
                {'name': 'dshm', 'mountPath': '/dev/shm'},
            ]

            tmpl = {
                'name': f"{sn}-{'gpu' if is_gpu else 'cpu'}",
                # `image` input resolved from the {app}-pipeline-images ConfigMap at
                # run time (patch-images updates the CM, no WFT re-render needed).
                # Template inputs are NOT rendered in the submit form, so this keeps
                # the image plumbing out of the user's view.
                'inputs': {'parameters': (
                    [{'name': 'image',
                      'valueFrom': {'configMapKeyRef': {'name': f"{app_name}-pipeline-images", 'key': sn}}}]
                    # dataset-path-override input: the DAG task supplies its value as an
                    # evaluated an Argo =expression ref->commit expression (only present with a
                    # catalog). PARAMS_YAML reads inputs.parameters.dataset-path-override
                    # (simple substitution), so the frozen-commit path resolves correctly —
                    # unlike an env-embedded an Argo =expression which Argo would pass through raw.
                    + ([{'name': 'dataset-path-override', 'default': ''}] if dataset_pathoverride_expr else [])
                )},
                'metadata': {
                    'labels': {
                        'platform.kubecore.io/project': project_name,
                        'platform.kubecore.io/pipeline': pipeline_name,
                        'platform.kubecore.io/step': sn,
                        'platform.kubecore.io/compute-type': 'gpu' if is_gpu else 'cpu',
                        # compute-class label + nodeSelector both come from the per-step
                        # {step}-class DROPDOWN — the developer picks the class, the pod
                        # lands on that static scale-to-zero pool (nodegroup-type == class
                        # name), and the autoscaler brings a node up 0->1 for it.
                        'platform.kubecore.io/compute-class': OB + "workflow.parameters." + sn + "-class" + CB,
                    }
                },
                'nodeSelector': {'platform.kubecore.io/nodegroup-type': OB + "workflow.parameters." + sn + "-class" + CB},
                'tolerations': step_tolerations,
                'serviceAccountName': sa,
                # retryStrategy: a step that hangs or dies (e.g. a transient S3/dataloader
                # stall during validation, a flaky node) is retried instead of wedging the
                # whole run forever. OnError retries on infra/non-zero-without-clean-exit;
                # combined with activeDeadlineSeconds below a hung pod is killed + retried
                # rather than blocking indefinitely (model-training has no built-in timeout).
                'retryStrategy': {
                    'limit': '2',
                    'retryPolicy': 'OnError',
                    'backoff': {'duration': '30s', 'factor': '2', 'maxDuration': '5m'},
                },
                # activeDeadlineSeconds is a generous ceiling that only catches a genuine
                # multi-hour wedge (a hung S3/dataloader stall, a stuck node) — NOT normal
                # training. GPU training can legitimately run long, so 3h; cpu steps are
                # quick (30m). A wedged pod is killed at the deadline and retryStrategy
                # then re-runs it, instead of the run hanging forever.
                # EXCEPTION: quantization-class steps (qat-finetune, model-quantization)
                # run a legitimately long CPU export — PTQ INT8 = ONNX export +
                # TF SavedModel + onnx2tf conversion + calibration — that blows past the
                # 30m cpu ceiling (live gke-dev 2026-07-02: model-quantization killed at
                # exactly 1800s mid-TFLite-conversion, "Max duration limit exceeded").
                # Give them the 3h ceiling regardless of cpu/gpu.
                'activeDeadlineSeconds': 10800 if (is_gpu or is_quant_step) else 1800,
                'container': container,
                'volumes': [
                    {'name': 'mlflow-svc', 'secret': {'secretName': mlflow_svc_secret, 'optional': True}},
                    # Memory-backed /dev/shm for torch DataLoader workers. Worker
                    # procs pass tensors to the trainer through POSIX shared memory;
                    # the k8s default 64Mi exhausts instantly (wedged trainer). This
                    # emptyDir (medium:Memory) counts against the pod's memory LIMIT,
                    # so it must be big enough for many workers on a heavy batch, yet
                    # bounded so it can't starve the workload. On the whole-node
                    # model the step owns the whole machine, so scale shm WITH the
                    # node: ~10% of the class allocatable, floored 1Gi, capped 4Gi.
                    # (T4 25Gi → 2Gi; a2 340Gi → 4Gi cap.) The whole-node memory
                    # margin (WN_MEM_MARGIN_GI=3.5) already reserves room for this
                    # shm + the sidecar + torch peak below allocatable.
                    {'name': 'dshm', 'emptyDir': {'medium': 'Memory', 'sizeLimit': '%dGi' % _shm_gib(cls)}},
                ],
            }

            # podSpecPatch sets the main container to the WHOLE-NODE resources of the
            # class the developer picked in {step}-class — requests==limits==the class's
            # platform-computed allocatable (sole-tenant Guaranteed QoS). The developer
            # sets NO cpu/mem numbers; the platform sizes the whole machine. Because the
            # class is a runtime param, an Argo ternary selects the right allocatable by
            # matching {step}-class against each of this tier's class names. podSpecPatch
            # is the only Argo mechanism that parameterizes non-string resource fields:
            # Argo substitutes the expr THEN strategic-merge-patches the pod, so k8s sees
            # concrete quantities. The container is named "main" in the rendered pod.
            tier_classes = gpu_classes if is_gpu else cpu_classes
            fallback = _whole_node_resources(cls)[0] if cls.get('allocatable') else {'cpu': '1', 'memory': '2Gi'}

            def _wn_ternary(field):
                expr = "'" + str(fallback.get(field, '1')) + "'"
                for c in reversed(tier_classes):
                    if not c.get('allocatable'):
                        continue
                    r, _ = _whole_node_resources(c)
                    cond = "workflow.parameters['" + sn + "-class'] == '" + c['name'] + "'"
                    expr = cond + " ? '" + str(r[field]) + "' : " + expr
                return OB + "=" + expr + CB

            cpu_e = _wn_ternary('cpu')
            mem_e = _wn_ternary('memory')
            gpu_line = []
            if is_gpu:
                gexpr = "'1'"
                for c in reversed(gpu_classes):
                    gc = str(((c.get('gpu') or c.get('guestAccelerator') or {}).get('count', 1)))
                    cond = "workflow.parameters['" + sn + "-class'] == '" + c['name'] + "'"
                    gexpr = cond + " ? '" + gc + "' : " + gexpr
                gpu_e = OB + "=" + gexpr + CB
                gpu_line = [f"      nvidia.com/gpu: \"{gpu_e}\""]
            patch_lines = (
                ["containers:", "- name: main", "  resources:", "    requests:",
                 f"      cpu: \"{cpu_e}\"", f"      memory: \"{mem_e}\""] + gpu_line +
                ["    limits:",
                 f"      cpu: \"{cpu_e}\"", f"      memory: \"{mem_e}\""] + gpu_line
            )
            tmpl['podSpecPatch'] = "\n".join(patch_lines) + "\n"

            inp = step.get('inputs', {}).get('parameters', []) if step.get('inputs') else []
            if inp:
                # APPEND the step's data inputs to the existing inputs (which already
                # carry the `image` valueFrom input) — do NOT overwrite, or the image
                # input is lost and the container image fails to resolve.
                tmpl['inputs']['parameters'].extend({'name': p['name']} for p in inp)
            out = step.get('outputs', {}).get('parameters', []) if step.get('outputs') else []
            if out:
                tmpl['outputs'] = {'parameters': [{'name': p['name'], 'valueFrom': {'path': p['path']}} for p in out]}

            return tmpl

        # Emit both variants for every step. The cpu variant pins the cpu class with
        # no accelerator; the gpu variant pins the gpu class and requests {step}-gpu
        # accelerators. The DAG's `when:` picks exactly one per run from the form.
        for step in steps:
            templates.append(build_step_template(step, is_gpu=False))
            templates.append(build_step_template(step, is_gpu=True))

        if hpc.get('enabled'):
            provider = hpc.get('provider', 'none')
            templates.append({
                'name': 'hpc-burst',
                'container': {
                    'image': 'busybox:1.36',
                    'command': ['sh', '-c'],
                    'args': [f'echo "HPC burst placeholder, provider={provider} not yet wired"']
                }
            })

        wft = {
            'apiVersion': 'argoproj.io/v1alpha1',
            'kind': 'WorkflowTemplate',
            'metadata': {
                'name': f"{app_name}-pipeline",
                'namespace': ml_ns,
                'annotations': {
                    'platform.kubecore.io/cost-tracking': 'enabled',
                    'platform.kubecore.io/pipeline': pipeline_name,
                    'platform.kubecore.io/gpu-nodepool': f"{pipeline_name}-gpu",
                    'platform.kubecore.io/cpu-nodepool': f"{pipeline_name}-cpu",
                    'platform.kubecore.io/generated-by': 'ml-ci-build/render-wft',
                    # Source-commit epoch for the monotonic anti-churn guard (see the
                    # render-wft push block). Stamped here in the render itself so the
                    # annotation is always present and correctly indented (the prior
                    # sed-injection approach left it empty when yaml.dump reformatted).
                    'platform.kubecore.io/rendered-from-commit-time': str(os.environ.get('SRC_COMMIT_TIME', '0')),
                },
                'labels': {
                    'platform.kubecore.io/project': project_name,
                    'platform.kubecore.io/app': app_name,
                    'platform.kubecore.io/managed-by': 'kubecore-ci',
                }
            },
            'spec': {
                'serviceAccountName': sa,
                'entrypoint': f"{app_name}-pipeline",
                'arguments': {'parameters': args_params},
                'templates': templates,
            }
        }

        os.makedirs(os.path.dirname(wft_out), exist_ok=True)
        with open(wft_out, 'w') as f:
            yaml.dump(wft, f, default_flow_style=False, allow_unicode=True, sort_keys=False)
        print(f"render-wft: wrote {wft_out}")
        PYEOF

        KUBELINE_PATH="$KUBELINE_PATH" CONTEXT_PATH="$CONTEXT_PATH" WFT_OUT="$WFT_OUT" \
          APP_NAME="$APP_NAME" PROJECT_NAME="$PROJECT_NAME" BRANCH="$BRANCH" \
          SRC_COMMIT_TIME="$SRC_COMMIT_TIME" \
          python3 /tmp/render_wft.py

        # ── Write .kubecore/dataset-config.yaml into the APP repo ─────────────
        # The kubecore-dataset CLI (in each app repo) auto-discovers its lakeFS
        # URL/repo/namespace/probe from this file, so NOTHING is hardcoded per app
        # — every kubeapp gets its OWN correct values. Sourced from the same
        # pipeline-context the WFT is rendered from. Idempotent: only commits when
        # the content changes. Skipped silently if the app repo has no external URL
        # yet (baseDns absent) so a partially-configured pool never fails the render.
        DATASET_CFG=$(CONTEXT_PATH="$CONTEXT_PATH" APP_NAME="$APP_NAME" PROJECT_NAME="$PROJECT_NAME" python3 - <<'CFGEOF'
        import os, yaml
        ctx = yaml.safe_load(open(os.environ['CONTEXT_PATH'])) or {}
        lakefs = ctx.get('lakefs', {}) or {}
        url = lakefs.get('externalUrl', '') or ''
        if not url:
            print('')  # no external URL yet — skip
        else:
            cfg = {
                'lakefsUrl': url,
                'repo': lakefs.get('repository', os.environ['PROJECT_NAME']),
                'namespace': ctx.get('namespace', 'ml-%s' % os.environ['PROJECT_NAME']),
                'probeCron': lakefs.get('datasetProbeCron', '%s-dataset-catalog-probe' % os.environ['APP_NAME']),
            }
            print('# Per-app dataset config — read by the kubecore-dataset CLI (nothing hardcoded).')
            print('# Rendered by render-wft from this app pipeline-context. Do not edit by hand.')
            print(yaml.safe_dump(cfg, default_flow_style=False, sort_keys=True).rstrip())
        CFGEOF
        )
        if [ -n "$DATASET_CFG" ] && [ -d /tmp/apprepo ]; then
          mkdir -p /tmp/apprepo/.kubecore
          printf '%s\n' "$DATASET_CFG" > /tmp/apprepo/.kubecore/dataset-config.yaml
          ( cd /tmp/apprepo
            git config user.email "ci@kubecore.io" 2>/dev/null || true
            git config user.name "kubecore-ci" 2>/dev/null || true
            git checkout -B "${BRANCH}" 2>/dev/null || git checkout "${BRANCH}" 2>/dev/null || true
            git add .kubecore/dataset-config.yaml
            if git diff --cached --quiet; then
              echo "render-wft: .kubecore/dataset-config.yaml already current in app repo"
            else
              git commit -m "chore(dataset): sync .kubecore/dataset-config.yaml (lakeFS URL/repo)" >/dev/null 2>&1 || true
              git pull --rebase origin "${BRANCH}" >/dev/null 2>&1 || true
              if git push origin "HEAD:${BRANCH}" 2>/dev/null; then
                echo "render-wft: pushed .kubecore/dataset-config.yaml to the app repo"
              else
                echo "render-wft: could not push dataset-config to app repo (non-fatal)"
              fi
            fi
          )
        else
          echo "render-wft: skipping dataset-config write (no external lakeFS URL in pipeline-context yet)"
        fi

        cd /tmp/gitops

        # ── Monotonic render guard (anti-churn) ──────────────────────────────
        # Two ml-ci-build runs can race to render the WFT (e.g. a merge and a
        # re-trigger). Without ordering, whichever pushes LAST wins — even if it
        # rendered an OLDER commit — silently reverting a newer render's content
        # (live gke-dev/yolo 2026-07-02: a stale render clobbered the dev-HEAD
        # render that carried the lakefs_repo fix). Guard: the render stamps the WFT
        # with the SOURCE commit's committer epoch (SRC_COMMIT_TIME, in the WFT
        # annotations); refuse to overwrite a WFT rendered from a NEWER commit.
        WFT_FILE="${GITOPS_WORKFLOWS_PATH}/workflow-template.yaml"
        if [ -f "$WFT_FILE" ]; then
          EXISTING_TIME=$(grep -oE 'rendered-from-commit-time: "?[0-9]+"?' "$WFT_FILE" | grep -oE '[0-9]+' | head -1)
          EXISTING_TIME=${EXISTING_TIME:-0}
          if [ "$SRC_COMMIT_TIME" -lt "$EXISTING_TIME" ]; then
            echo "SKIP render push: this render's source commit (${SRC_COMMIT_TIME}) is OLDER than the WFT already in gitops (${EXISTING_TIME}). Refusing to clobber a newer render."
            exit 0
          fi
        fi

        # Stage the DISCOVERED path (kubeapps/{app}/{gitops-branch}/...), not a
        # hardcoded workflows/{app}/{push-branch}/ — the old pathspec pointed at
        # a file that never existed (wrong basePath AND wrong branch segment),
        # so git add exited 128 after a perfectly good render. Live log,
        # gke-dev/yolo 2026-06-13: "discovered: kubeapps/yolo-training/main" →
        # "fatal: pathspec 'workflows/yolo-training/dev/...'".
        git add "${WFT_FILE}"
        if git diff --cached --quiet; then
          echo "No WFT changes to commit"
        else
          git commit -m "ml-ci(${APP_NAME}): render WFT from kubeline.yaml v2 at ${IMAGE_TAG} (src-commit-time ${SRC_COMMIT_TIME})"
          # Re-check after rebase in case a NEWER render landed while we worked.
          git pull --rebase origin "${GITOPS_BRANCH}"
          NOW_TIME=$(grep -oE 'rendered-from-commit-time: .?[0-9]+' "$WFT_FILE" | grep -oE '[0-9]+' | head -1)
          if [ "${NOW_TIME:-0}" -gt "$SRC_COMMIT_TIME" ]; then
            echo "SKIP push after rebase: a newer render (${NOW_TIME}) landed concurrently."
            exit 0
          fi
          git push
          echo "Pushed rendered WFT to ${ORG}/${GITOPS_REPO}@${GITOPS_BRANCH}"
        fi
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: patch-images
    inputs:
      parameters:
      - name: image_tag
      - name: changed_steps
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    container:
      image: mikefarah/yq:4.44.3
      command: [sh, -c]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        ORG="{{ .Values.github.org }}"
        GITOPS_REPO="{{`{{workflow.parameters.gitops_repository}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')

        REGISTRY="{{`{{workflow.parameters.registry_url}}`}}"
        if [ -z "$REGISTRY" ]; then REGISTRY="{{ .Values.registry.externalUrl }}"; fi
        if [ -z "$REGISTRY" ]; then REGISTRY="{{ .Values.registry.internalUrl }}"; fi
        IMAGE_REPO="{{`{{workflow.parameters.image_repository}}`}}"
        if [ -z "$IMAGE_REPO" ]; then
          IMAGE_REPO="{{`{{workflow.parameters.project_name}}`}}/${APP_NAME}"
        fi

        apk add --no-cache git >/dev/null

        REPO_URL="https://x-access-token:${TOKEN}@github.com/${ORG}/${GITOPS_REPO}.git"
        git clone --depth=1 --branch "${GITOPS_BRANCH}" "${REPO_URL}" /tmp/gitops
        cd /tmp/gitops

        # pipeline-images.yaml is written by Crossplane at
        # {basePath}/{appName}/{gitopsBranch}/ — basePath is operator-configured
        # (default "kubeapps") and not passed here, so discover it by locating
        # the file (same discovery as render-wft; live layout verified
        # gke-dev/yolo 2026-06-13).
        IMAGES_PATH=$(find . -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-images.yaml" | head -1)

        if [ -z "${IMAGES_PATH}" ] || [ ! -f "${IMAGES_PATH}" ]; then
          echo "ERROR: pipeline-images.yaml not found anywhere under */${APP_NAME}/${GITOPS_BRANCH}/ — the WFT resolves image parameters from this ConfigMap; failing loudly."
          exit 1
        fi
        echo "pipeline-images discovered at ${IMAGES_PATH}"

        # changed_steps comes in as a JSON array `[{"name":"...","path":"..."},...]`
        # Update each step's image key in the pipeline-images ConfigMap.
        echo '{{`{{inputs.parameters.changed_steps}}`}}' > /tmp/changed.json
        STEPS_LEN=$(yq -p=json -o=yaml 'length' /tmp/changed.json)
        i=0
        while [ "$i" -lt "$STEPS_LEN" ]; do
          STEP_NAME=$(yq -p=json -o=yaml ".[$i].name" /tmp/changed.json | tr -d '"')
          NEW_IMAGE="${REGISTRY}/${IMAGE_REPO}:${STEP_NAME}-${IMAGE_TAG}"
          echo "Updating pipeline-images key '${STEP_NAME}' → ${NEW_IMAGE}"
          yq e -i ".data.\"${STEP_NAME}\" = \"${NEW_IMAGE}\"" "${IMAGES_PATH}"
          i=$((i + 1))
        done

        git config user.name "KubeCore CI"
        git config user.email "ci@kubecore.io"
        git add "${IMAGES_PATH}"
        if git diff --cached --quiet; then
          echo "No changes to commit (image tags already match)"
          exit 0
        fi
        git commit -m "ml-ci(${APP_NAME}): bump step images to ${IMAGE_TAG} in pipeline-images ConfigMap"
        git pull --rebase origin "${GITOPS_BRANCH}"
        git push
        echo "Pushed image-tag update to ${ORG}/${GITOPS_REPO}@${GITOPS_BRANCH}"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: tag
    inputs:
      parameters:
      - name: image_tag
      - name: new_version
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        cd /workspace/repo
        TOKEN=$(cat /etc/github-token/token)
        NEW_VERSION="{{`{{inputs.parameters.new_version}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        TIMESTAMP=$(echo "$IMAGE_TAG" | sed -E 's/dev-v[0-9]+\.[0-9]+\.[0-9]+-([0-9]+-[0-9]+)-.*/\1/')
        DEV_TAG="dev-v${NEW_VERSION}-${TIMESTAMP}"

        git config user.name "KubeCore CI"
        git config user.email "ci@kubecore.io"

        REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        git remote set-url origin "${REPO_URL}"

        git tag -a "${DEV_TAG}" -m "ML dev release v${NEW_VERSION}"
        git push origin "${DEV_TAG}"
        echo "Tagged: ${DEV_TAG}"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: status
    inputs:
      parameters:
      - name: state
      - name: description
    container:
      image: alpine/curl
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO="{{`{{workflow.parameters.repo_url}}`}}"
        OWNER_REPO=$(echo "$REPO" | sed 's|https://github.com/||' | sed 's|.git$||')
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        STATE="{{`{{inputs.parameters.state}}`}}"
        DESC="{{`{{inputs.parameters.description}}`}}"

        curl -s -X POST \
          -H "Authorization: token ${TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${OWNER_REPO}/statuses/${SHA}" \
          -d "{\"state\":\"${STATE}\",\"description\":\"${DESC}\",\"context\":\"kubecore-ml-ci\"}"

        echo "Posted status: ${STATE}"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: exit-handler
    steps:
    - - name: post-failure-status
        template: status
        arguments:
          parameters:
          - name: state
            value: "failure"
          - name: description
            value: "ML build failed"
        when: "{{`{{workflow.status}}`}} == Failed"
