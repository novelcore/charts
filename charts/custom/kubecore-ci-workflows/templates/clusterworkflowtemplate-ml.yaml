{{/*
ml-ci-build — KubeCore ML pipeline CI ClusterWorkflowTemplate.

Triggered by the per-KubeApp Sensor created by the k8smlapp composition
(compositions/apis/kubeapp/k8smlapp/composition.yaml, generate-ci-resources
step) on push/PR to an ML app repo (pipeline.py + config/ + steps/<name>/).

Flow:
  clone → detect-steps → version → render-hera → build-push (matrix) → patch-images → tag → status

An app made before the current pipelines (PRD novelcore/kaos#1911 AC-01) fails before anything is
recorded: at detect-steps when its kaos-lib is older than 0.5, at the render when its pipeline.py is. No
image is built, nothing is committed, and the exit handler reports what to change.

The platform pipeline engine (PRD-HPC-1461 D-80) is the ONLY render path: the
app's pipeline.py is rendered by the engine image the gitops pipeline-context
pins (engine.image), enhanced with the engine wheel (engine.wheel, verified by
engine.wheelSha256), and committed to the gitops repo. The app carries no
kubecore/ and no compose-and-validate step: the compose-and-validate image is
built from the chart's own Dockerfile (files/compose.Dockerfile) with the app's
config/ folder as its context. Each other ML "step" is a sub-directory
steps/<dir>/ carrying a Dockerfile. Only the steps whose contents changed
since the last built commit get rebuilt. After a successful matrix build, this
template clones the gitops repo and `yq`-patches the corresponding step's
image key in pipeline-images.yaml so ArgoCD picks up the new image on its next
sync.

Inputs come from the Sensor (Argo Events). See the Sensor template in the
k8smlapp composition for the full parameter list.

Required secrets in the workflow namespace:
  - {{ .Values.github.tokenSecretName }}  (GitHub App installation token)
  - ci-registry-auth                       (Zot username/password)
*/}}
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ml-ci-build
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "kubecore-ci-workflows.serviceAccountName" . }}
  entrypoint: ml-ci-build
  onExit: exit-handler
  ttlStrategy:
    secondsAfterSuccess: {{ int .Values.workflow.ttlStrategy.secondsAfterSuccess }}
    secondsAfterFailure: {{ int .Values.workflow.ttlStrategy.secondsAfterFailure }}
  # One BUILD per app at a time (kubecore-operator#1126) is a template-level
  # mutex on ml-ci-run-locked below, NOT a workflow-level one: a run whose
  # detect-steps finds nothing to build (render-only) must not queue behind
  # the app's image builds (live, HPC lab 2026-11-10: a pipeline change waited
  # ~1h behind a fleet rebuild). The pool-wide cap on concurrent kaniko pods
  # is the semaphore on build-push.
  # Bound the build-push fan-out (kubecore-operator#1124, 2026-08-27): the
  # matrix creates one pod per changed step at once — 17 for a yolo-pipelines
  # app — while the kaniko request is sized "one build per node" and the
  # default per-project CI pool is ONE node. Sixteen pods sat Pending for
  # hours, the pending-reaper (#897) read that as capacity-stuck at 45m and
  # Stopped the build — every build, forever; the app never got its images
  # (live: prd1124yolo, poulaki/yolotrain). With parallelism Argo holds the
  # remaining matrix items as workflow nodes instead of Pending pods, so a
  # pod only waits for the build ahead of it (~10m), never for the queue.
  parallelism: {{ int (.Values.ci.mlBuildParallelism | default 2) }}
  podGC:
    strategy: {{ .Values.workflow.podGC.strategy }}
  # Release the 40Gi workspace PVC the moment the build COMPLETES, not when
  # the (TTL-retained) workflow object is eventually deleted — retained
  # workflows were each pinning a pd-balanced volume against the regional
  # SSD_TOTAL_GB quota (kubecore-operator#872: 4×40Gi idle at quota ceiling).
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  # Workflow-level nodeSelector follows the same per-submission CI pool
  # as build-push's override below (PRD-962 F-09 stage 2, ML). node_class's
  # Helm-render-time default is unchanged, so a submission that omits it
  # still resolves to today's fixed kubecorecpu selector — a
  # behavior-preserving parameterization, not a scheduling change, until
  # callers start passing node_class.
  #
  # kubecore-operator#1067: nodegroup-type alone is not project-scoping —
  # the synthesised CI environment is named the literal string "ci" on
  # EVERY project, so every project's CI pool carries the identical
  # nodegroup-type=ci label and any of them satisfies this selector. Adding
  # platform.kubecore.io/project (a label the node already carries, unique
  # per project) closes that. project_name is a required workflow parameter
  # on ml-ci-build (no fallback), so this key is never emitted empty.
  nodeSelector:
    platform.kubecore.io/nodegroup-type: "{{`{{workflow.parameters.node_class}}`}}"
    platform.kubecore.io/project: "{{`{{workflow.parameters.project_name}}`}}"
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.workspace.size | default "5Gi" }}
      {{- with .Values.workspace.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
  volumes:
  - name: github-token
    secret:
      secretName: {{ .Values.github.tokenSecretName }}
  - name: registry-auth
    secret:
      secretName: ci-registry-auth
      # Zot-only, as for ci-build (#1057): a GAR project pushes keylessly through
      # Workload Identity (#1088) and a pool without Zot never renders this Secret.
      # Without `optional` the kubelet refuses to start the pod and every ML build on
      # a Zot-less pool hangs in PodInitializing (e2e-suite-ml-jq4vp, 2026-10-07).
      optional: true
  arguments:
    parameters:
    - name: repo_url
    - name: commit_sha
    - name: branch
    - name: target_branch
      value: "dev"
    - name: branch_type
      value: "feature"
    - name: app_name
    - name: project_name
    - name: pr_merged
      value: "false"
    - name: event_type
      value: "push"
    - name: image_repository
      value: ""
    - name: registry_url
      # Registry URL written into the WorkflowTemplate's container.image
      # by patch-wft. Must be a hostname the workload-cluster kubelet can
      # resolve from its host network — typically the NodePort URL
      # (e.g. localhost:30500 if Zot is on a NodePort and we want
      # node-local routing), NOT the in-cluster service DNS.
      value: ""
    - name: build_registry_url
      # Registry URL kaniko pushes layers to (--destination + auth).
      # Must be a hostname the build-push pod can reach from inside
      # the cluster network — typically the in-cluster service DNS
      # (zot.zot-registry.svc.cluster.local:5000). Falls back to
      # registry_url if empty (pre-0.9.7 compatibility).
      value: ""
    - name: gitops_repository
    - name: gitops_branch
      value: "main"
    - name: workflow_template_path
    # Per-submission CI node pool (PRD-962 F-09) for the static build-push
    # template below. Optional: a submitter that omits it gets the
    # operator-resolved default, which itself falls back to today's single
    # workflow-level nodeSelector so behavior is unchanged until callers
    # start passing this parameter. Distinct from the PER-STEP ML compute
    # class ("{step}-class", e.g. cpu-standard/gpu-a100) that the enhancer
    # resolves separately per pipeline step — this parameter only targets
    # the CI build pods, never an ML workload step itself.
    # kaos-lib rebuild on a reconcile-submitted build: "true" only from the
    # reconciler's KAOS-LIB DRIFT submission. A push always rebuilds stale
    # kaos-lib images (the app is being used); any other reconcile build
    # (re-render, dataset, context) leaves them stale. See detect-steps.
    - name: kaos_lib_rebuild
      value: "false"
    - name: node_class
      value: {{ .Values.ci.defaultNodeClass | default (dig "platform.kubecore.io/nodegroup-type" "kubecorecpu" .Values.nodeSelector) | quote }}
    # pull request number when the run came from a PR ("" otherwise): the
    # run report is then a PR comment instead of a commit comment.
    - name: pr_number
      value: ""

  templates:
  # ml-ci-build — the entrypoint. PROBE, then run the SAME pipeline either under
  # the app's build mutex (the probe found steps to build) or without one (it
  # found none: render-only). The probe is advisory: it decides only which lock
  # the run takes. The run (ml-ci-run) clones and detects again under that lock,
  # so what it builds and records is exactly what today's single run did: the
  # previous build's last-built-sha and tags are committed before it looks.
  - name: ml-ci-build
    steps:
    # Report "pending" (with the Argo UI run URL) BEFORE any work: a merge that
    # is building shows a yellow kubecore-ml-ci check on GitHub immediately,
    # and a cluster-side stall is a visible stuck-pending check instead of
    # silence (#459-class outages become observable from GitHub alone).
    - - name: status-pending
        # Reporting only: a GitHub write that fails after its retries is a red
        # node here, never a failed (or stopped) build.
        continueOn:
          failed: true
        template: status
        arguments:
          parameters:
          - name: state
            value: "pending"
          - name: description
            value: "Building in Argo Workflows"
      - name: probe-clone
        template: clone
    - - name: probe-detect
        template: detect-steps
    - - name: build-run
        template: ml-ci-run-locked
        when: "{{`{{steps.probe-detect.outputs.parameters.has_changes}}`}} == true"
      - name: render-run
        template: ml-ci-run
        when: "{{`{{steps.probe-detect.outputs.parameters.has_changes}}`}} != true"
        arguments:
          parameters:
          - name: locked
            value: "false"

  # ml-ci-run-locked — ml-ci-run under the app's build mutex. Argo queues a
  # second build of the same app here (Pending node "Waiting for ... lock",
  # no pod) until the first one ends. The mutex covers detect-steps ..
  # patch-images, as the workflow-level mutex did.
  - name: ml-ci-run-locked
    synchronization:
      mutexes:
      - name: "{{`{{workflow.parameters.app_name}}`}}-build"
    steps:
    - - name: run
        template: ml-ci-run
        arguments:
          parameters:
          - name: locked
            value: "true"

  # ml-ci-run — clone -> detect-steps -> version -> render -> build-push ->
  # patch-images -> tag -> status. locked=false (the render-only path) never
  # builds or tags: if its own detect-steps finds steps to build after all
  # (the platform context moved since the probe), it records nothing and the
  # next reconcile builds them under the lock.
  - name: ml-ci-run
    inputs:
      parameters:
      - name: locked
        value: "true"
    steps:
    - - name: clone
        template: clone
    - - name: detect-steps
        template: detect-steps
    - - name: version
        template: version
      # kaos-lib/support commit status (PRD novelcore/kaos#1147): reporting
      # only, never a red build.
      - name: kaos-lib-support
        template: kaos-lib-support
        continueOn:
          failed: true
    # The render runs BEFORE the image builds, in a group of its own (PRD
    # novelcore/kaos#1911 AC-01, T-05). An app whose pipeline.py is still on the
    # step contract of kaos-lib 0.4 fails the render with what to change; with
    # the builds in the same group (0.13 and before) every step image of that app
    # was built and pushed first, for a pipeline that could not be rendered. Now
    # a failed render builds nothing. The render does not depend on the build
    # output, and a new app still gets its config and its form before its
    # images: the render takes about a minute, the builds start after it.
    - - name: render-hera
        template: render-hera
        # Renders pipeline.py with the platform engine -> enhances -> gates -> commits.
        # Fires when the WFT source changed (pipeline.py + config/).
        # PRD-1124 D-07 (kubecore-operator#1124 AC-09): ALSO fire on a reconcile-
        # submitted build. The reconciler submits one when the platform context
        # moved (mlEnvironment / namespace drift) with NO commit; re-rendering is
        # idempotent (hera-enhance-commit commits only when the output differs).
        when: "({{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true || {{`{{steps.detect-steps.outputs.parameters.wft_changed}}`}} == true || {{`{{workflow.parameters.event_type}}`}} == reconcile) && {{`{{workflow.parameters.branch_type}}`}} != chore"
        arguments:
          parameters:
          - name: changed_steps
            value: "{{`{{steps.detect-steps.outputs.parameters.changed_steps}}`}}"
          # The engine of this build (detect-steps, PRD-HPC-1461 D-80).
          - name: engine
            value: "{{`{{steps.detect-steps.outputs.parameters.engine}}`}}"
          - name: engine_image
            value: "{{`{{steps.detect-steps.outputs.parameters.engine_image}}`}}"
          - name: engine_profile
            value: "{{`{{steps.detect-steps.outputs.parameters.engine_profile}}`}}"
    - - name: build-push
        template: build-push
        when: "{{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true && {{`{{inputs.parameters.locked}}`}} == true"
        arguments:
          parameters:
          - name: step_name
            value: "{{`{{item.name}}`}}"
          - name: step_path
            value: "{{`{{item.path}}`}}"
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
          - name: kaos_lib_package
            value: "{{`{{steps.detect-steps.outputs.parameters.kaos_lib_package}}`}}"
          # The compose-and-validate image is built from the chart's Dockerfile on the engine image.
          - name: engine_image
            value: "{{`{{steps.detect-steps.outputs.parameters.engine_image}}`}}"
          - name: engine_version
            value: "{{`{{steps.detect-steps.outputs.parameters.engine_version}}`}}"
          - name: engine_profile
            value: "{{`{{steps.detect-steps.outputs.parameters.engine_profile}}`}}"
        withParam: "{{`{{steps.detect-steps.outputs.parameters.changed_steps}}`}}"
    - - name: patch-images
        template: patch-images
        # Runs on EVERY build, changed steps or not: patch-images is what records
        # last-built-sha, and the CI reconciler (#459) polls HEAD against it.
        # Gated on has_changes, a commit that legitimately builds nothing (docs,
        # a README, a config file) never updated the baseline — first the
        # reconciler resubmitted the same no-op build every 3 minutes (live
        # 2026-07-16: 12 builds in ~12 min across 3 apps), and with the
        # reconcile exception it still rebuilt every such SHA once more
        # (charts#158). The step is a no-op when neither an image tag nor
        # last-built-sha moved: it exits early on "No changes to commit".
        # An unlocked (render-only) run records only when it built nothing, so it
        # can never mark a commit built that a locked build still owes.
        when: "{{`{{workflow.parameters.branch_type}}`}} != chore && ({{`{{inputs.parameters.locked}}`}} == true || {{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} != true)"
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: changed_steps
            value: "{{`{{steps.detect-steps.outputs.parameters.changed_steps}}`}}"
          - name: kaos_lib_record
            value: "{{`{{steps.detect-steps.outputs.parameters.kaos_lib_record}}`}}"
          - name: kaos_lib_compat
            value: "{{`{{steps.detect-steps.outputs.parameters.kaos_lib_compat}}`}}"
          - name: engine_compose
            value: "{{`{{steps.detect-steps.outputs.parameters.engine_compose}}`}}"
    - - name: tag
        template: tag
        when: "{{`{{steps.detect-steps.outputs.parameters.has_changes}}`}} == true && {{`{{inputs.parameters.locked}}`}} == true && {{`{{workflow.parameters.branch_type}}`}} != chore && {{`{{workflow.parameters.branch_type}}`}} != rc"
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
    - - name: status
        # Reporting only: a GitHub write that fails after its retries is a red
        # node here, never a failed (or stopped) build.
        continueOn:
          failed: true
        template: status
        arguments:
          parameters:
          - name: state
            value: "success"
          - name: description
            value: "ML build succeeded"

  - name: clone
{{ include "kubecore-ci-workflows.cloneRetry" . | indent 4 }}
    container:
      image: {{ .Values.tooling.gitImage | default "alpine/git:2.52.0" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
{{ include "kubecore-ci-workflows.gitAuth" . | indent 8 }}
{{ include "kubecore-ci-workflows.gitClone" . | indent 8 }}
        REPO_URL="{{`{{workflow.parameters.repo_url}}`}}"
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')
        # Need at least 2 commits for change detection (HEAD~1 vs HEAD)
        # A retried attempt finds its predecessor's partial clone (#1379).
        rm -rf /workspace/repo
        git_clone --depth=50 --branch "${BRANCH}" "${REPO_URL}" /workspace/repo
        cd /workspace/repo
        # Explicitly fetch the target commit before checkout. A shallow clone of
        # the branch tip does NOT necessarily contain a specific commit_sha if a
        # newer commit landed on the branch between the webhook firing and this
        # clone running (two quick pushes → the earlier build's commit is no
        # longer in the shallow window → "fatal: unable to read tree <sha>" →
        # exit 128). Fetching the SHA directly makes the checkout deterministic.
        git fetch --depth=50 origin "{{`{{workflow.parameters.commit_sha}}`}}" || true
        # Tags for the version step, fetched HERE while the token is at hand:
        # the checkout keeps no credential, so the version step cannot fetch.
        git fetch --tags --force
        git checkout "{{`{{workflow.parameters.commit_sha}}`}}"
        # /workspace/repo is the build context and hera-render's input: no
        # token may persist in it (kaos PRD 738 F-20).
        git_assert_no_token /workspace/repo
        echo "Cloned at $(git rev-parse HEAD)"
        # An ML app is pipeline.py + config/ (Hera + Hydra authoring) + steps/<name>/.
        if [ ! -f pipeline.py ] || [ ! -d config ]; then
          echo "ERROR: no ML pipeline at the repo root — expected pipeline.py + config/ (Hera + Hydra authoring)"
          exit 1
        fi
        echo "--- pipeline.py ---"; cat pipeline.py
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: detect-steps
{{ include "kubecore-ci-workflows.preemptionRetry" . | indent 4 }}
    outputs:
      parameters:
      - name: changed_steps
        valueFrom:
          path: /tmp/changed_steps.json
      - name: has_changes
        valueFrom:
          path: /tmp/has_changes
      - name: wft_changed
        valueFrom:
          path: /tmp/wft_changed
      # kaos-lib delivery (PRD novelcore/kaos#1147), see the KAOS-LIB block
      # below: the --build-arg KAOS_LIB_PACKAGE value ("" = none), and the
      # pipeline-images kaos-lib-package / kaos-lib-compat report ("" = leave).
      - name: kaos_lib_package
        valueFrom:
          path: /tmp/kaos_lib_package
          default: ""
      - name: kaos_lib_record
        valueFrom:
          path: /tmp/kaos_lib_record
          default: ""
      - name: kaos_lib_compat
        valueFrom:
          path: /tmp/kaos_lib_compat
          default: ""
      # The platform pipeline engine of this build (PRD-HPC-1461 D-80), see the ENGINE block below: the
      # `engine.py context` JSON and the fields the steps route on. engine_compose is the engine
      # version to record as `engine-compose` once the compose-and-validate image is built ("" = not built).
      - name: engine
        valueFrom:
          path: /tmp/engine.json
      - name: engine_version
        valueFrom:
          path: /tmp/engine_version
      - name: engine_image
        valueFrom:
          path: /tmp/engine_image
      - name: engine_profile
        valueFrom:
          path: /tmp/engine_profile
      - name: engine_compose
        valueFrom:
          path: /tmp/engine_compose
          default: ""
    container:
      image: {{ .Values.tooling.toolboxImage | default "alpine/k8s:1.36.4" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      args:
      - |
        set -e
{{ include "kubecore-ci-workflows.gitAuth" . | indent 8 }}
        # detect-steps needs both git and yq: both are baked into
        # tooling.toolboxImage.
        cd /workspace/repo

        # Diff range — HEAD~1..HEAD when we have a parent, else "all steps"
        if git rev-parse HEAD~1 >/dev/null 2>&1; then
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        else
          CHANGED_FILES=$(git ls-files)
        fi
        echo "Changed files vs HEAD~1:"
        echo "$CHANGED_FILES"

        # The DAG-source files ARE the rendered WorkflowTemplate (step commands,
        # params, DAG). A change to them that touches no step *directory* (e.g. a
        # config-tree tweak) leaves has_changes=false, so without this flag
        # render/patch-images would be SKIPPED and the live WFT would never pick
        # up the change — a silent drift. Emit wft_changed=true whenever a
        # DAG-source file is in the diff (or this is a full build with no parent),
        # and gate render/patch-images on (has_changes OR wft_changed).
        # Sources: pipeline.py and config/**.
        WFT_SRC_RE="^(pipeline\.py|config/)"
        # A reconcile-submitted build ALSO renders. wft_changed is derived from a
        # git diff of the APP repo, but the WFT's other input — pipeline-context
        # (compute classes, endpoints) — lives in the GITOPS repo and is written
        # by Crossplane from the operator. A platform-data change therefore never
        # appears in CHANGED_FILES, so a corrected class catalog (e.g. an
        # unschedulable 27Gi budget fixed to 26Gi) would sit in pipeline-context
        # and NEVER reach the live WFT until a developer happened to push
        # (observed live 2026-07-16: two apps kept rendering 27Gi long after the
        # operator had self-healed their context). Rendering on reconcile makes
        # the CI backstop close that gap too: the render is deterministic, and
        # the commit step no-ops when the output is unchanged.
        if [ -z "$(git rev-parse HEAD~1 2>/dev/null)" ] \
           || [ "{{`{{workflow.parameters.event_type}}`}}" = "reconcile" ] \
           || echo "$CHANGED_FILES" | grep -qE "$WFT_SRC_RE"; then
          printf "true" > /tmp/wft_changed
        else
          printf "false" > /tmp/wft_changed
        fi
        echo "wft_changed=$(cat /tmp/wft_changed)"

        # #457: a step must be (re)built if EITHER its source changed OR it has
        # no published image yet. detect-steps used to key only on the git diff,
        # so a step whose directory was untouched (typical first push: README /
        # README tweak) was never built — its pipeline-images ConfigMap key
        # stayed at the Crossplane-seeded ":{step}-latest" placeholder, which is
        # never produced by build-push (it always tags {step}-{branch}-v…-{sha}).
        # The first training run then hit ImagePullBackOff on those steps with no
        # signal pointing at CI ("resubmit until every step gets touched").
        #
        # Registry-aware first build: clone the gitops repo, read the
        # pipeline-images.yaml the WFT resolves images from, and treat any step
        # whose key is ABSENT or still ends in "-latest" (placeholder = never
        # built) as changed. Reading the gitops ConfigMap is a reliable proxy for
        # "image exists in the registry" — patch-images writes the versioned tag
        # there only after a successful build+push.
        UNBUILT_STEPS=""
        GITOPS_REPO="{{`{{workflow.parameters.gitops_repository}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        if [ -f /etc/github-token/token ] && [ -n "$GITOPS_REPO" ]; then
          GITOPS_URL="https://github.com/{{ .Values.github.org }}/${GITOPS_REPO}.git"
          # The token lives only in this subshell: the git calls below run in
          # the app checkout and need none.
          if ( TOKEN=$(cat /etc/github-token/token)
               git clone --depth=1 --branch "${GITOPS_BRANCH}" "${GITOPS_URL}" /tmp/gitops 2>/dev/null ); then
            git_assert_no_token /tmp/gitops
            # basePath is operator-configured (default "kubeapps") and not passed
            # here, so discover the file (same pattern as render-wft/patch-images).
            IMAGES_PATH=$(find /tmp/gitops -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-images.yaml" | head -1)
            if [ -n "$IMAGES_PATH" ] && [ -f "$IMAGES_PATH" ]; then
              echo "pipeline-images discovered at ${IMAGES_PATH}"
              # Diff base (kubecore-operator#1126, ml-dev-loop e2e "multi"):
              # everything since the LAST BUILT commit, not just HEAD~1 — a
              # push of several commits (or a merge whose changes sit in an
              # earlier commit) used to rebuild only what the final commit
              # touched. Kept as HEAD~1 when there is no last-built-sha yet,
              # it is not in the shallow clone, or it is not an ancestor of
              # HEAD (force-push / rewritten history).
              LAST_BUILT=$(yq e '.data."last-built-sha" // ""' "$IMAGES_PATH")
              if [ -n "$LAST_BUILT" ] && git cat-file -e "${LAST_BUILT}^{commit}" 2>/dev/null \
                 && git merge-base --is-ancestor "$LAST_BUILT" HEAD 2>/dev/null \
                 && [ "$LAST_BUILT" != "$(git rev-parse HEAD)" ]; then
                CHANGED_FILES=$(git diff --name-only "$LAST_BUILT" HEAD)
                echo "Changed files vs last-built-sha ${LAST_BUILT} (supersedes the HEAD~1 diff above):"
                echo "$CHANGED_FILES"
                if [ "{{`{{workflow.parameters.event_type}}`}}" = "reconcile" ] \
                   || echo "$CHANGED_FILES" | grep -qE "$WFT_SRC_RE"; then
                  printf "true" > /tmp/wft_changed
                else
                  printf "false" > /tmp/wft_changed
                fi
                echo "wft_changed=$(cat /tmp/wft_changed) (re-evaluated against last-built-sha)"
              elif [ -n "$LAST_BUILT" ] && [ "$LAST_BUILT" = "$(git rev-parse HEAD)" ] \
                   && [ "{{`{{workflow.parameters.event_type}}`}}" = "reconcile" ]; then
                # A reconcile of a commit that is ALREADY built has nothing to
                # rebuild: the backstop only (re)renders. It reads last-built-sha
                # from the POOL's ConfigMap, which trails gitops until ArgoCD syncs
                # the build's own commit, so it can submit this build for the very
                # SHA that just finished; the HEAD~1 diff above would then rebuild
                # the steps that commit touched and re-stamp their images (live,
                # kaos e2e 10480ba0, 2026-11-04: e2e-probe rebuilt 2 min after its
                # own build, moving the images under a test that expected none).
                CHANGED_FILES=""
                echo "HEAD ${LAST_BUILT} is already built: a reconcile rebuilds no step for its diff"
              else
                echo "diff base stays HEAD~1 (last-built-sha ${LAST_BUILT:-unset} unusable in this clone)"
              fi
            else
              echo "pipeline-images.yaml not found — treating all steps as unbuilt (first build)"
              IMAGES_PATH=""
              UNBUILT_STEPS="__ALL__"
            fi
          else
            echo "WARN: could not clone gitops repo; skipping registry-aware check"
          fi
        fi

        # Build the (step_name, step_path) list: every directory under steps/ that
        # has a Dockerfile is a step; the DIRECTORY NAME is the step name (D14: step
        # name ↔ directory ↔ image ConfigMap key). Hyphens in step names map to
        # underscores in dirs (dataset-loading ↔ steps/dataset_loading), matching the
        # authoring convention, so record both the image key (name) and the build path.
        # compose-and-validate is NOT an app step: its Dockerfile is the chart's.
        STEP_PAIRS=$(for d in steps/*/; do
          [ -f "${d}Dockerfile" ] || continue
          dir=${d%/}; base=$(basename "$dir")
          name=$(echo "$base" | tr '_' '-')
          [ "$name" = "compose-and-validate" ] && continue
          echo "${name}|${dir}"
        done)

        # Emit a step if its path/* changed OR it has no published image yet (#457).
        # Write pairs to a file and loop with redirection (NOT a pipe) so the
        # CHANGED_JSON accumulator survives the loop (no subshell).
        printf '%s\n' "$STEP_PAIRS" > /tmp/step_pairs

        # KAOS-LIB (PRD novelcore/kaos#1147): the platform picks the kaos-lib
        # version the step images install. The operator writes it into the
        # gitops pipeline-context (kaosLib.spec; it already holds an app whose
        # desired version is outside its .kaos/compat.yaml range at the spec it
        # was built with), and this build installs exactly that: every step
        # whose Dockerfile declares ARG KAOS_LIB_PACKAGE gets
        # --build-arg KAOS_LIB_PACKAGE=<spec> (build-push). When the spec differs
        # from the one the images were built with (pipeline-images
        # kaos-lib-package), every such step is rebuilt, commit or not: kaniko
        # keys the layers after the ARG on its value, so the cache misses
        # exactly there. patch-images then reports the built spec and the app's
        # compat range back (kaos-lib-package, kaos-lib-compat), which the
        # operator reads as status.ml.kaosLib.built. "none" = no step declares
        # the ARG (an app from before delivery): the platform cannot move it.
        # The script reads the workspace as data only (python3 -I).
{{ include "kubecore-ci-workflows.kaosLibScript" . | indent 8 }}
        cut -d'|' -f2 /tmp/step_pairs > /tmp/step_paths
        # The compose-and-validate Dockerfile (chart-owned, declares the ARG) is one more managed step:
        # an absolute path, which kaos-lib.py resolves as is.
        mkdir -p /tmp/compose-ctx
        COMPOSE_DOCKERFILE=/tmp/compose-ctx/Dockerfile
{{ include "kubecore-ci-workflows.composeDockerfile" . | indent 8 }}
        echo /tmp/compose-ctx >> /tmp/step_paths
        KL_CTX=$(find /tmp/gitops -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-context.yaml" 2>/dev/null | head -1)
        KL_REC=""
        if [ -n "${IMAGES_PATH:-}" ]; then KL_REC=$(yq e '.data."kaos-lib-package" // ""' "$IMAGES_PATH"); fi
        KL_NONE='{"spec":"","record":"","compat":"","rebuild":false,"managed":[],"reason":"no pipeline-context in the gitops repo: kaos-lib left as it is"}'
        if [ -n "$KL_CTX" ]; then
          python3 -I /tmp/kaos-lib.py decide --context "$KL_CTX" --recorded "$KL_REC" \
            --repo /workspace/repo --steps /tmp/step_paths > /tmp/kaos_lib.json \
            || { echo "kaos-lib: WARN the decision failed: kaos-lib left as it is"; printf '%s' "$KL_NONE" > /tmp/kaos_lib.json; }
        else
          printf '%s' "$KL_NONE" > /tmp/kaos_lib.json
        fi
        # THE STEP CONTRACT (PRD novelcore/kaos#1911 AC-01, T-05): a pipeline of
        # this chart's engine hands each step one context and takes one result
        # back, which kaos-lib reads and writes from 0.5 on. The engine sees
        # pipeline.py, not the library the step images install, so this is the
        # chart's check: an app the platform holds at a kaos-lib older than 0.5
        # (its .kaos/compat.yaml does not accept 0.5) is REFUSED here, before the
        # render and before any image, with what to change. The one build that
        # is let through with an older spec is the one whose commit already
        # accepts 0.5: it reports the new range, and the platform then delivers
        # 0.5 (its record is how the platform learns the range).
{{ include "kubecore-ci-workflows.oldApp" . | indent 8 }}
        python3 -I /tmp/kaos-lib.py contract --spec "$(jq -r '.spec' /tmp/kaos_lib.json)" --recorded "$KL_REC" \
          --compat "$(jq -r '.compat' /tmp/kaos_lib.json)" > /tmp/kaos_lib_contract.json
        if [ "$(jq -r '.ok' /tmp/kaos_lib_contract.json)" != "true" ]; then
          old_app "$(jq -r '.message' /tmp/kaos_lib_contract.json)"
          exit 1
        fi
        # STALE, REBUILT ON USE: a reconcile-submitted build that is not the
        # KAOS-LIB DRIFT build (a re-render, a dataset or context event) must not
        # rebuild every managed step because the pin moved. It keeps the recorded
        # spec for anything it does build, so the record stays true. A push, or the
        # reconciler's kaos-lib build, rebuilds as before. NOT across kaos-lib 0.5:
        # images built before the step contract cannot run the pipeline this build
        # renders, so they are rebuilt now (after the render, which an app that has
        # not moved fails first).
        if [ "{{`{{workflow.parameters.event_type}}`}}" = "reconcile" ] \
           && [ "{{`{{workflow.parameters.kaos_lib_rebuild}}`}}" != "true" ] && [ -n "$KL_REC" ] \
           && [ "$(jq -r '.crosses' /tmp/kaos_lib_contract.json)" != "true" ] \
           && [ "$(jq -r '.rebuild' /tmp/kaos_lib.json)" = "true" ]; then
          jq --arg rec "$KL_REC" '.spec as $want | .rebuild = false | .spec = $rec | .record = $rec
              | .reason = "kaos-lib STALE (\($rec) -> \($want)): not rebuilt by this run; rebuilt when the app is next used"' \
             /tmp/kaos_lib.json > /tmp/kaos_lib.json.new && mv /tmp/kaos_lib.json.new /tmp/kaos_lib.json
        fi
        jq -j '.spec' /tmp/kaos_lib.json > /tmp/kaos_lib_package
        jq -j '.record' /tmp/kaos_lib.json > /tmp/kaos_lib_record
        jq -j '.compat' /tmp/kaos_lib.json > /tmp/kaos_lib_compat
        jq -r 'if .rebuild then .managed[] else empty end' /tmp/kaos_lib.json > /tmp/kaos_lib_rebuild
        echo "kaos-lib: $(jq -r '.reason' /tmp/kaos_lib.json)"

        # ENGINE (PRD-HPC-1461 D-80): the platform pipeline engine is the only way to render, enhance and
        # compose an app. The operator writes engine: {version, image, wheel, wheelSha256} into the gitops
        # pipeline-context; engine.py validates it and picks the schema profile (yolo when config/ has a
        # quantization section, else hera). It reads the checkout as DATA (python3 -I).
        # A context with no usable engine FAILS the build: the live WorkflowTemplate stays as it is.
{{ include "kubecore-ci-workflows.engineScript" . | indent 8 }}
        [ -n "$KL_CTX" ] || { echo "engine: FATAL: no pipeline-context in the gitops repo; failing the build, the live WorkflowTemplate stays as it is" >&2; exit 1; }
        python3 -I /tmp/engine.py context --context "$KL_CTX" --repo /workspace/repo > /tmp/engine.json \
          || { echo "engine: FATAL: no usable engine or schema profile (the reason is above); failing the build, the live WorkflowTemplate stays as it is" >&2; exit 1; }
        jq -j '.version' /tmp/engine.json > /tmp/engine_version
        jq -j '.image' /tmp/engine.json > /tmp/engine_image
        jq -j '.profile' /tmp/engine.json > /tmp/engine_profile
        ENGINE_VERSION=$(cat /tmp/engine_version)
        echo "engine: ${ENGINE_VERSION} image $(cat /tmp/engine_image) profile $(cat /tmp/engine_profile)"

        CHANGED_JSON="[]"
        while IFS='|' read -r STEP_NAME STEP_PATH; do
          [ -n "$STEP_NAME" ] || continue

          REASON=""
          if echo "$CHANGED_FILES" | grep -qE "^${STEP_PATH}/"; then
            REASON="source changed"
          elif [ "$UNBUILT_STEPS" = "__ALL__" ]; then
            REASON="no pipeline-images (first build)"
          elif grep -qxF "$STEP_PATH" /tmp/kaos_lib_rebuild; then
            REASON="kaos-lib package moved to $(cat /tmp/kaos_lib_package)"
          elif [ -n "${IMAGES_PATH:-}" ]; then
            # ConfigMap key value for this step; absent → null. A value still
            # ending in "-latest" is the seeded placeholder = never built.
            CUR_IMAGE=$(yq e ".data.\"${STEP_NAME}\" // \"\"" "$IMAGES_PATH")
            case "$CUR_IMAGE" in
              ""|*-latest) REASON="image unbuilt (${CUR_IMAGE:-missing})" ;;
            esac
          fi

          if [ -n "$REASON" ]; then
            CHANGED_JSON=$(echo "$CHANGED_JSON" | yq e -o=json '. + [{"name":"'"$STEP_NAME"'","path":"'"$STEP_PATH"'"}]' -)
            echo "step changed: $STEP_NAME ($STEP_PATH) — ${REASON}"
          fi
        done < /tmp/step_pairs

        # compose-and-validate: the image built from the chart's Dockerfile on the engine image with the
        # app's config/ folder as its context. Rebuilt when config/ changed, when the engine moved since the
        # recorded engine-compose, or when the kaos-lib package moved (it installs the same one as the steps).
        printf '' > /tmp/engine_compose
        COMPOSE_REASON=""
        ENG_COMPOSE_REC=""
        if [ -n "${IMAGES_PATH:-}" ]; then ENG_COMPOSE_REC=$(yq e '.data."engine-compose" // ""' "$IMAGES_PATH"); fi
        if echo "$CHANGED_FILES" | grep -qE "^config/"; then
          COMPOSE_REASON="config/ changed"
        elif [ "$ENG_COMPOSE_REC" != "$ENGINE_VERSION" ]; then
          COMPOSE_REASON="engine ${ENG_COMPOSE_REC:-<unrecorded>} -> ${ENGINE_VERSION}"
        elif grep -qxF /tmp/compose-ctx /tmp/kaos_lib_rebuild; then
          COMPOSE_REASON="kaos-lib package moved to $(cat /tmp/kaos_lib_package)"
        elif [ -n "${IMAGES_PATH:-}" ]; then
          case "$(yq e '.data."compose-and-validate" // ""' "$IMAGES_PATH")" in
            ""|*-latest) COMPOSE_REASON="image unbuilt" ;;
          esac
        fi
        if [ -n "$COMPOSE_REASON" ]; then
          CHANGED_JSON=$(echo "$CHANGED_JSON" | yq e -o=json '. + [{"name":"compose-and-validate","path":"config"}]' -)
          printf '%s' "$ENGINE_VERSION" > /tmp/engine_compose
          echo "step changed: compose-and-validate (config) — ${COMPOSE_REASON}"
        fi

        # Compact JSON for withParam
        echo "$CHANGED_JSON" | yq e -o=json -I=0 - > /tmp/changed_steps.json
        if [ "$(echo "$CHANGED_JSON" | yq e 'length' -)" -eq 0 ]; then
          printf "false" > /tmp/has_changes
        else
          printf "true" > /tmp/has_changes
        fi
        echo "has_changes=$(cat /tmp/has_changes)"
        echo "changed_steps=$(cat /tmp/changed_steps.json)"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      # #457: detect-steps now clones the gitops repo to read pipeline-images.yaml
      # for the registry-aware first-build check; it needs the GitHub App token.
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: version
{{ include "kubecore-ci-workflows.preemptionRetry" . | indent 4 }}
    outputs:
      parameters:
      - name: new_version
        valueFrom:
          path: /tmp/new_version
      - name: image_tag
        valueFrom:
          path: /tmp/image_tag
    container:
      image: {{ .Values.tooling.gitImage | default "alpine/git:2.52.0" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      args:
      - |
        set -e
        cd /workspace/repo
        # Tags were fetched by the clone step: the checkout holds no credential
        # (kaos PRD 738 F-20), so this step cannot fetch from the private repo.

        BRANCH_TYPE="{{`{{workflow.parameters.branch_type}}`}}"

        DEV_TAGS=$(git tag -l "dev-v*" | sort -V)
        if [ -z "$DEV_TAGS" ]; then
          REGULAR_TAGS=$(git tag -l "v*" | grep -v "dev-" | sort -V)
          if [ -n "$REGULAR_TAGS" ]; then
            LATEST_TAG=$(echo "$REGULAR_TAGS" | tail -n 1)
          else
            LATEST_TAG="v0.0.0"
          fi
        else
          LATEST_DEV_TAG=$(echo "$DEV_TAGS" | tail -n 1)
          LATEST_TAG="v$(echo "$LATEST_DEV_TAG" | sed -E 's/dev-v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
        fi

        VERSION=${LATEST_TAG#v}
        MAJOR=$(echo $VERSION | cut -d. -f1)
        MINOR=$(echo $VERSION | cut -d. -f2)
        PATCH=$(echo $VERSION | cut -d. -f3)
        [ -z "$MAJOR" ] && MAJOR=0
        [ -z "$MINOR" ] && MINOR=0
        [ -z "$PATCH" ] && PATCH=0

        case "$BRANCH_TYPE" in
          feature)     NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
          breaking)    NEW_VERSION="$((MAJOR + 1)).0.0" ;;
          bug|bugfix|maintenance) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          chore|rc)    NEW_VERSION="$MAJOR.$MINOR.$PATCH" ;;
          *)           NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
        esac

        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        SHORT_SHA=$(echo "{{`{{workflow.parameters.commit_sha}}`}}" | head -c 7)
        IMAGE_TAG="dev-v${NEW_VERSION}-${TIMESTAMP}-${SHORT_SHA}"

        echo -n "$NEW_VERSION" > /tmp/new_version
        echo -n "$IMAGE_TAG" > /tmp/image_tag
        echo "Version: $NEW_VERSION, Tag: $IMAGE_TAG"
      volumeMounts:
      - name: workspace
        mountPath: /workspace

  # build-push runs in parallel via withParam over the matrix of changed
  # steps. Each pod self-clones into an emptyDir (no shared workspace PVC)
  # so the matrix isn't bottlenecked by ReadWriteOnce multi-attach. The
  # init container sets up the repo at the right SHA; the main container
  # is kaniko, which builds and pushes without a daemon, no rootlesskit,
  # no userns gymnastics — works identically on COS, Ubuntu, EKS, kind.
  # Switched from rootless BuildKit because BuildKit's overlayfs snapshot
  # copy-up performs poorly on GKE Container-Optimized OS for multi-GB
  # images (e.g. PyTorch plus a training library), getting stuck in "exporting
  # layers" indefinitely. Kaniko's flat tar-based layer model handles
  # large images consistently.
  - name: build-push
    # The build container runs the tenant Dockerfile: no Kubernetes SA token
    # in it, only in Argo's executor containers (kaos PRD 738 F-20).
    {{- include "kubecore-ci-workflows.buildPodSpecPatch" . | nindent 4 }}
    inputs:
      parameters:
      - name: step_name
      - name: step_path
      - name: image_tag
      - name: new_version
      # kaos-lib spec for --build-arg KAOS_LIB_PACKAGE (detect-steps); "" = the
      # Dockerfile's default. Passed as an env var, never spliced into the script.
      - name: kaos_lib_package
        value: ""
      # The engine of this build (detect-steps): the base, version label and schema profile of the
      # chart-owned compose-and-validate image. Unused by every other step.
      - name: engine_image
        value: ""
      - name: engine_version
        value: ""
      - name: engine_profile
        value: ""
    metadata:
      labels:
        app.kubernetes.io/name: "{{`{{workflow.parameters.app_name}}`}}"
    {{- if .Values.ci.buildSlots.enabled }}
    # Cap concurrent kaniko builds per project (charts: build pacing, HPC lab
    # 2026-11-10). A template-level semaphore holds the NODE in Argo until a slot
    # frees: no Pending pod (so no pending-reaper kill, no autoscaler
    # scale-up demand beyond the pool), across ALL apps and runs of the
    # project's CI namespace. The ConfigMap lives in that namespace
    # (githubproject composition) and holds max(1, ciPoolMax - 1) slots, so at
    # least one pool node stays free for render/enhance/commit pods.
    synchronization:
      semaphores:
      - configMapKeyRef:
          name: {{ .Values.ci.buildSlots.configMapName | quote }}
          key: {{ .Values.ci.buildSlots.key | quote }}
    {{- end }}
    # Template-level nodeSelector overrides the workflow-level one above so
    # this build lands on the per-submission CI pool (PRD-962 F-09) instead
    # of the shared cluster default. Tolerations are intentionally left to
    # the workflow-level fallback (.Values.tolerations) — the CI node group
    # carries the same taint key/value these already tolerate. This is
    # distinct from the per-step CI_POOL nodeSelector the render-wft
    # generator builds further down for the per-app rendered WFT (a
    # separate, per-step compute-class mechanism this change does not
    # touch).
    #
    # kubecore-operator#1067: a template-level nodeSelector REPLACES the
    # workflow-level one in Argo rather than merging with it, so the
    # project key must be repeated here too — this is the step that
    # actually runs the build and is the one that matters most.
    nodeSelector:
      platform.kubecore.io/nodegroup-type: "{{`{{workflow.parameters.node_class}}`}}"
      platform.kubecore.io/project: "{{`{{workflow.parameters.project_name}}`}}"
    # A pod killed by an infra-level fault (e.g. spot preemption) used to end
    # the build without a retry. retryStrategy re-runs it. limit 2 = 3
    # attempts total.
    #
    # retryPolicy=Always + expression (not a bare OnError) because OnError only
    # retries Argo's Error phase (controller-level faults) — a pod killed by
    # node shutdown lands in Failed, so OnError never caught it. Measured on
    # 2026-09-15: an e2e release-train run failed twice at this build step with
    # "Pod was terminated in response to imminent node shutdown." on the
    # all-Spot KAOS tenant pool, and OnError did not retry it.
    #
    # The expression is the only thing that widens the retry set — Argo ANDs
    # the expression result with retryPolicy, so Always just means "consult
    # the expression". Clause 1 (lastRetry.status == "Error") preserves
    # today's OnError behaviour exactly, so if lastRetry.message ever turns
    # out unpopulated this degrades to today's behaviour rather than silently
    # disabling retries. Clause 2 is the only widening: it matches GKE's own
    # preemption wording and nothing else, so a legitimate build failure — a
    # Dockerfile syntax error, a failing test — still lands in Failed with a
    # non-matching message and is NOT retried.
    retryStrategy:
      limit: "2"
      retryPolicy: Always
      expression: 'lastRetry.status == "Error" or lastRetry.message matches "imminent node shutdown"'
      backoff:
        duration: "30s"
        factor: "2"
        # No maxDuration: Argo counts it from the FIRST attempt's start, so a
        # 5m cap cancelled the retry of any step that ran past 5m — every
        # real build (kubecore-operator#1377). limit bounds the retries.
    volumes:
    - name: build-workspace
      emptyDir: {}
    - name: kaniko-config
      emptyDir: {}
    initContainers:
    - name: clone
      image: {{ .Values.tooling.gitImage | default "alpine/git:2.52.0" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
{{ include "kubecore-ci-workflows.gitAuth" . | indent 8 }}
        REPO_URL="{{`{{workflow.parameters.repo_url}}`}}"
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')
        git clone --depth=1 --branch "${BRANCH}" "${REPO_URL}" /workspace/repo
        cd /workspace/repo
        # depth=1 fetches ONLY the branch tip; if a newer commit landed since the
        # webhook fired (two quick pushes), the target commit_sha is absent and
        # the checkout fails "unable to read tree <sha>" → exit 128. Fetch the
        # SHA explicitly so each per-step build-push checks out its own commit
        # deterministically regardless of later pushes to the branch.
        git fetch --depth=1 origin "{{`{{workflow.parameters.commit_sha}}`}}" || true
        git checkout "{{`{{workflow.parameters.commit_sha}}`}}"
        # This checkout is the kaniko build context: no token may persist in it.
        git_assert_no_token /workspace/repo
        echo "Cloned at $(git rev-parse HEAD) for step {{`{{inputs.parameters.step_name}}`}}"
      volumeMounts:
      - name: build-workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true
    - name: docker-config
      image: {{ .Values.tooling.alpineImage | default "alpine:3.20.10" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      args:
      - |
        set -e
        # Use build_registry_url (in-cluster service DNS) for kaniko's
        # docker auth entry — that's the URL kaniko pushes to. Falls
        # back to registry_url for pre-0.9.7 callers that only pass one.
        REGISTRY="{{`{{workflow.parameters.build_registry_url}}`}}"
        if [ -z "$REGISTRY" ]; then REGISTRY="{{`{{workflow.parameters.registry_url}}`}}"; fi
        REG_USER=$(cat /etc/registry-auth/username 2>/dev/null || true)
        REG_PASS=$(cat /etc/registry-auth/password 2>/dev/null || true)
        mkdir -p /kaniko/.docker
        if [ -z "${REG_USER}" ]; then
          case "$REGISTRY" in
            *-docker.pkg.dev*)
              # GAR: no ci-registry-auth (optional mount above); the build-push
              # container authenticates through the gcr helper (#1088).
              echo '{"auths":{}}' > /kaniko/.docker/config.json
              echo "GAR ${REGISTRY}: keyless push via Workload Identity, no Zot creds"
              exit 0
              ;;
          esac
          echo "FATAL: ${REGISTRY} requires the ci-registry-auth Secret, which is not mounted" >&2
          exit 1
        fi
        AUTH=$(printf '%s:%s' "${REG_USER}" "${REG_PASS}" | base64 -w0)
        # Kaniko reads /kaniko/.docker/config.json. Write the auth entry
        # for the in-cluster Zot URL kaniko pushes to.
        cat > /kaniko/.docker/config.json <<EOF
        {"auths":{"${REGISTRY}":{"auth":"${AUTH}"}}}
        EOF
        echo "Wrote kaniko docker config for ${REGISTRY}"
      volumeMounts:
      - name: build-workspace
        mountPath: /workspace
      - name: registry-auth
        mountPath: /etc/registry-auth
        readOnly: true
      - name: kaniko-config
        mountPath: /kaniko/.docker
    container:
      image: {{ .Values.kaniko.image | default "gcr.io/kaniko-project/executor:v1.23.2-debug" }}
      command: ["/busybox/sh", "-c"]
      env:
      - name: KAOS_LIB_PACKAGE
        value: "{{`{{inputs.parameters.kaos_lib_package}}`}}"
      - name: ENGINE_IMAGE
        value: "{{`{{inputs.parameters.engine_image}}`}}"
      - name: ENGINE_VERSION
        value: "{{`{{inputs.parameters.engine_version}}`}}"
      - name: ENGINE_PROFILE
        value: "{{`{{inputs.parameters.engine_profile}}`}}"
      args:
      - |
        set -e

        # Build-side registry: where kaniko pushes layers + cache. Must be
        # reachable from inside the pod network (in-cluster service DNS).
        # Falls back to registry_url for pre-0.9.7 callers, then to the
        # chart's internalUrl value.
        REGISTRY="{{`{{workflow.parameters.build_registry_url}}`}}"
        if [ -z "$REGISTRY" ]; then REGISTRY="{{`{{workflow.parameters.registry_url}}`}}"; fi
        if [ -z "$REGISTRY" ]; then REGISTRY="{{ .Values.registry.internalUrl }}"; fi
        IMAGE_REPO="{{`{{workflow.parameters.image_repository}}`}}"
        if [ -z "$IMAGE_REPO" ]; then
          IMAGE_REPO="{{`{{workflow.parameters.project_name}}`}}/{{`{{workflow.parameters.app_name}}`}}"
        fi

        STEP_NAME="{{`{{inputs.parameters.step_name}}`}}"
        STEP_PATH="{{`{{inputs.parameters.step_path}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"

        # GAR auth (#1088): the mounted docker config carries only Zot creds;
        # without a credHelpers entry kaniko sends UNAUTHENTICATED requests to
        # *-docker.pkg.dev (live UNAUTHORIZED, apriloumpa 2026-08-25) even
        # though ci-build-sa is WI-bound. Point the GAR host at kaniko's
        # bundled gcr helper, which exchanges the metadata (WI) token.
        case "$REGISTRY" in
          *-docker.pkg.dev*)
            GAR_HOST="${REGISTRY%%/*}"
            mkdir -p /kaniko/.docker-gar
            printf '{"credHelpers":{"%s":"gcr"}}' "$GAR_HOST" > /kaniko/.docker-gar/config.json
            export DOCKER_CONFIG=/kaniko/.docker-gar
            ;;
        esac

        VERSIONED_IMAGE="${REGISTRY}/${IMAGE_REPO}:${STEP_NAME}-${IMAGE_TAG}"
        LATEST_IMAGE="${REGISTRY}/${IMAGE_REPO}:${STEP_NAME}-latest"

        # Each ML step has Dockerfile at <step_path>/Dockerfile and uses
        # <step_path> as build context.
        #
        # Kaniko strategy for fat ML images (#332):
        # --cache=true + --cache-repo: layer-level remote cache in Zot.
        #   First build of model-training (PyTorch + CUDA, ~23 GiB) takes
        #   the full snapshot wall (~50 min on pd-standard). Every
        #   subsequent build hits cache for the heavy RUN layers and only
        #   snapshots the small COPY app/ layer → seconds, not minutes.
        # --cache-copy-layers + --cache-run-layers: cache both layer kinds.
        # --snapshot-mode=time: mtime-based change detection. Cheaper than
        #   redo (full re-hash) on the small per-commit delta layer.
        # --single-snapshot was the previous trap — it forced one
        #   monolithic post-build snapshot of the *entire* final
        #   filesystem, defeating layer-level caching entirely. Removed.
        # --cleanup: drop intermediate layer files after push (kept).
        # --use-new-run + --compressed-caching=false: lower-memory
        #   snapshot algorithm; better for disk-bound nodes (kept).
        # --insecure / --skip-tls-verify: Zot serves HTTP in-cluster.
        #
        # The cache repo is a TOP-LEVEL sibling repo ({app}-buildcache), NOT a
        # nested path under the app repo. A nested path with the old
        # ({app}/__kaniko-cache__) name silently failed to persist in Zot —
        # kaniko logged "Pushing layer ... to cache now" but the layer never
        # landed (manifest 404, repo absent from the catalog), so every build
        # came up cold and re-ran the full ~3GB CUDA install. A flat top-level
        # repo name (no nested path, no leading/trailing __) is accepted by
        # Zot exactly like the app image repo, so the cache actually persists
        # and subsequent builds cache-hit the heavy RUN layers. The "-buildcache"
        # suffix keeps it per-app (no cross-tenant cache poisoning) and clear of
        # the app image tags.
        CACHE_REPO="${REGISTRY}/${IMAGE_REPO}-buildcache"
        # Build context: the step dir, and its Dockerfile. compose-and-validate is the exception
        # (PRD-HPC-1461 D-80): the chart's own Dockerfile (files/compose.Dockerfile) on the engine
        # image, with the app's config/ folder (its step_path) as the ONLY context.
        BUILD_CONTEXT="/workspace/repo/${STEP_PATH}"
        DOCKERFILE="/workspace/repo/${STEP_PATH}/Dockerfile"
        COMPOSE_DOCKERFILE=/workspace/compose.Dockerfile
{{ include "kubecore-ci-workflows.composeDockerfile" . | indent 8 }}
        set --
        if [ "$STEP_NAME" = "compose-and-validate" ]; then
          DOCKERFILE="${COMPOSE_DOCKERFILE}"
          set -- --build-arg="ENGINE_IMAGE=${ENGINE_IMAGE}" --build-arg="ENGINE_VERSION=${ENGINE_VERSION}" \
                 --build-arg="ENGINE_PROFILE=${ENGINE_PROFILE}"
          echo "engine: compose-and-validate is built on ${ENGINE_IMAGE} (profile ${ENGINE_PROFILE})"
        fi
        # kaos-lib (PRD novelcore/kaos#1147): the spec the platform chose, for a
        # step whose Dockerfile declares ARG KAOS_LIB_PACKAGE, plus the image
        # label io.kaos.lib naming it. Any other step builds as before.
        if [ -n "${KAOS_LIB_PACKAGE:-}" ] \
           && grep -qE '^[[:space:]]*ARG[[:space:]]+KAOS_LIB_PACKAGE([[:space:]=]|$)' "${DOCKERFILE}"; then
          set -- "$@" --build-arg="KAOS_LIB_PACKAGE=${KAOS_LIB_PACKAGE}" --label="io.kaos.lib=${KAOS_LIB_PACKAGE}"
          echo "kaos-lib: ${STEP_NAME} installs kaos-lib ${KAOS_LIB_PACKAGE}"
        fi
        /kaniko/executor \
          --context="${BUILD_CONTEXT}" \
          --dockerfile="${DOCKERFILE}" \
          --destination="${VERSIONED_IMAGE}" \
          --destination="${LATEST_IMAGE}" \
          --build-arg="REGISTRY_URL=${REGISTRY}" \
          --build-arg="VERSION=${IMAGE_TAG}" \
          --insecure \
          --skip-tls-verify \
          --cache=true \
          --cache-repo="${CACHE_REPO}" \
          --cache-copy-layers \
          --cache-run-layers \
          --snapshot-mode=time \
          --cleanup \
          --use-new-run \
          --compressed-caching=false \
          "$@"

        echo "Pushed ${STEP_NAME}: ${VERSIONED_IMAGE} + ${LATEST_IMAGE}"
      {{- with .Values.kaniko.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumeMounts:
      - name: build-workspace
        mountPath: /workspace
      - name: kaniko-config
        mountPath: /kaniko/.docker
      # No registry-auth mount: the Dockerfile's RUN steps execute in this container, and the
      # registry password is only needed by the docker-config init container above.

  # ── Render path (credential-split) ─────────────────────────────────────
  # Two steps sharing the workspace PVC. The trust boundary: `hera-render` runs
  # the developer's ARBITRARY `python pipeline.py` with NO GitHub token and NO
  # service-account token (automountServiceAccountToken:false); it only reads the
  # already-cloned app repo and writes the raw WorkflowTemplate to the workspace.
  # `hera-enhance-commit` runs ONLY platform code (enhancer + gate + git) and is
  # the sole holder of the GitHub token — so untrusted client Python can never
  # execute in a credentialed context (mirrors how kaniko runs untrusted
  # Dockerfiles). Artifacts pass via the workspace PVC (a rendered+enhanced WFT
  # exceeds Argo's ~256KB parameter cap; the PVC has no such limit).
  # A failed render fails the group before hera-enhance-commit starts: nothing
  # is committed, the live WorkflowTemplate stays as it is, and no image is
  # built (build-push is the next group of ml-ci-run).
  - name: render-hera
    inputs:
      parameters:
      - name: changed_steps
      # The engine of this build (detect-steps, PRD-HPC-1461 D-80): the whole JSON for the enhance
      # step, the image and schema profile for the render.
      - name: engine
      - name: engine_image
      - name: engine_profile
    steps:
    - - name: hera-render
        template: hera-render
        arguments:
          parameters:
          - name: engine_image
            value: "{{`{{inputs.parameters.engine_image}}`}}"
          - name: engine_profile
            value: "{{`{{inputs.parameters.engine_profile}}`}}"
    - - name: hera-enhance-commit
        template: hera-enhance-commit
        arguments:
          parameters:
          - name: engine
            value: "{{`{{inputs.parameters.engine}}`}}"

  # STEP 1 (TOKENLESS): the app's pipeline.py rendered by the PLATFORM engine -> raw WFT
  # (PRD-HPC-1461 D-80).
  #   - the image is the engine release the context pins; its runner
  #     (python -I -m kaos_engine.render) imports kubecore and every engine module from the engine;
  #   - no `pip install -e .`: the app's pyproject dependencies are read as data and ONLY those the
  #     engine does not already provide are installed, under the engine's own versions as constraints
  #     (a conflicting pin fails the render, it never replaces an engine library);
  # automountServiceAccountToken:false keeps the MAIN container (untrusted client
  # code) token-free; executor.serviceAccountName still gives Argo's own executor
  # sidecar an SA token for the pod-patch it needs (required by Argo when
  # automount is off — the whole point of the split: executor yes, client no).
  # The image is a parameter (engine_image, validated by engine.py as a pinned release);
  # tests/tooling-images allow-lists exactly that one templated image.
  - name: hera-render
{{ include "kubecore-ci-workflows.preemptionRetry" . | indent 4 }}
    inputs:
      parameters:
      - name: engine_image
      - name: engine_profile
    automountServiceAccountToken: false
    executor:
      # Locked-down executor SA (workflowtaskresults only, NO secret-reader) —
      # so even the executor sidecar of this untrusted-code pod can't reach the
      # GitHub token via the K8s API. Defined in rbac.yaml.
      serviceAccountName: hera-render-exec
    # pipeline.py is the developer's code: an unprivileged user, a read-only root filesystem, no
    # capabilities. fsGroup makes the workspace volume (cloned by the root init step of an earlier
    # pod) writable for it. The pod label is what the render network policy selects.
    metadata:
      labels:
        platform.kubecore.io/ci-pod: render
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    volumes:
    - name: scratch
      emptyDir: {}
    # The app's pyproject dependencies the engine lacks are pip-installed into the interpreter's own
    # site-packages, which a read-only root filesystem forbids. The interpreter's tree (/usr/local in
    # the python-based engine image) is copied once into a volume that is mounted over it, so the
    # install lands there and the image's root stays read-only.
    - name: python-overlay
      emptyDir: {}
    initContainers:
    - name: python-overlay
      image: "{{`{{inputs.parameters.engine_image}}`}}"
      command: [sh, -c]
      # Copy the entries, not the directory itself: the volume's root belongs to root (group-writable through
      # fsGroup), so a non-root cp cannot set its times and "cp -a /usr/local/. /overlay/" ends 1 after
      # copying everything ("preserving times for '/overlay/.': Operation not permitted").
      args: ["cd /usr/local && find . -mindepth 1 -maxdepth 1 -exec cp -a --no-preserve=ownership -t /overlay/ {} +"]
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.heraRenderResources | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
      - name: python-overlay
        mountPath: /overlay
    container:
      image: "{{`{{inputs.parameters.engine_image}}`}}"
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.heraRenderResources | nindent 6 }}
      command: [sh, -c]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      env:
      - name: HOME
        value: /tmp
      - name: ENGINE_PROFILE
        value: "{{`{{inputs.parameters.engine_profile}}`}}"
      args:
      - |
        set -e
        cd /workspace/repo
        mkdir -p /workspace/out
        rm -f out/raw-workflow-template.yaml /workspace/out/raw-workflow-template.yaml
        echo "hera-render: rendering pipeline.py with the platform engine {{`{{inputs.parameters.engine_image}}`}} (profile ${ENGINE_PROFILE})"
        # The app's pyproject dependencies the engine lacks (data only; the runner's own check).
        python -I -c 'import sys; from pathlib import Path; from kaos_engine.render import extra_dependencies; sys.stdout.write("".join(d + "\n" for d in extra_dependencies(Path(sys.argv[1]))))' /workspace/repo > /tmp/extra-deps.txt
        if [ -s /tmp/extra-deps.txt ]; then
          echo "hera-render: installing the app dependencies the engine lacks (under the engine's versions):"
          cat /tmp/extra-deps.txt
          python -m pip freeze --exclude-editable > /tmp/engine-constraints.txt
          python -m pip install --quiet -c /tmp/engine-constraints.txt -r /tmp/extra-deps.txt
        fi
        # OLD APP (PRD novelcore/kaos#1911 AC-01): the engine refuses an app made before the current
        # pipelines (outputs=, hpc_time_limit=, disk=, a step without kind=, a `platform` config group,
        # a kubecore/ folder) with one sentence that says what is wrong, ending "Create it again from the
        # template." (the engine's authoring-schema.json, old_app_marker). That sentence is how such a
        # refusal is told from any other failed render; the message is what the report shows. No app is
        # moved: there is no guide to link.
{{ include "kubecore-ci-workflows.oldApp" . | indent 8 }}
        set +e
        python -I -m kaos_engine.render pipeline.py --repo /workspace/repo --profile "${ENGINE_PROFILE}" 2> /tmp/render.err
        RENDER_RC=$?
        set -e
        cat /tmp/render.err >&2
        if [ "${RENDER_RC}" != 0 ]; then
          REFUSAL=$(python -I - /tmp/render.err <<'REFUSALEOF'
        import importlib.util, json, pathlib, re, sys
        schema = pathlib.Path(importlib.util.find_spec("kaos_pipeline_engine").origin).parent / "authoring-schema.json"
        marker = json.loads(schema.read_text())["old_app_marker"]
        for line in reversed(pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()):
            if marker and marker in line:
                print(re.sub(r"^[\w.]+(Error|Exception): ", "", line).strip())
                break
        REFUSALEOF
          ) || REFUSAL=""
          [ -z "${REFUSAL}" ] || old_app "${REFUSAL}"
          exit "${RENDER_RC}"
        fi
        # pipeline.py writes out/raw-workflow-template.yaml under the repo; move it
        # to the shared workspace location the enhance step reads.
        cp out/raw-workflow-template.yaml /workspace/out/raw-workflow-template.yaml
        echo "hera-render: wrote /workspace/out/raw-workflow-template.yaml (tokenless)"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: scratch
        mountPath: /tmp
      - name: python-overlay
        mountPath: /usr/local
      # NO github-token mount. NO registry-auth. This is the trust boundary.

  # STEP 2 (TOKEN-HOLDING, platform code only): enhance -> gate -> commit.
  - name: hera-enhance-commit
{{ include "kubecore-ci-workflows.preemptionRetry" . | indent 4 }}
    inputs:
      parameters:
      # The engine JSON of detect-steps. Read through the env var below, never spliced into the script.
      - name: engine
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    container:
      image: {{ .Values.tooling.toolboxImage | default "alpine/k8s:1.36.4" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.enhanceResources | nindent 6 }}
      command: [sh, -c]
      env:
      - name: ENGINE_JSON
        value: "{{`{{inputs.parameters.engine}}`}}"
      # The commit the form is sealed with: read through the env var, never spliced into the script.
      - name: COMMIT_SHA
        value: "{{`{{workflow.parameters.commit_sha}}`}}"
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      args:
      - |
        set -e
        # git and PyYAML are baked into tooling.toolboxImage.

        TOKEN=$(cat /etc/github-token/token)
{{ include "kubecore-ci-workflows.gitAuth" . | indent 8 }}
        ORG="{{ .Values.github.org }}"
        GITOPS_REPO="{{`{{workflow.parameters.gitops_repository}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"

        git config --global user.name "KubeCore CI"
        git config --global user.email "ci@kubecore.io"
        REPO_URL="https://github.com/${ORG}/${GITOPS_REPO}.git"
        git clone --depth=1 --branch "${GITOPS_BRANCH}" "${REPO_URL}" /tmp/gitops
        git_assert_no_token /tmp/gitops

        # Discover the app's gitops dir by locating pipeline-context.yaml — the
        # same discovery render-wft uses (basePath is operator-configured and not
        # passed to this workflow).
        CONTEXT_PATH=$(find /tmp/gitops -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-context.yaml" | head -1)
        if [ -z "$CONTEXT_PATH" ] || [ ! -f "$CONTEXT_PATH" ]; then
          echo "ERROR: pipeline-context.yaml not found under */${APP_NAME}/${GITOPS_BRANCH}/ in the gitops repo."
          exit 1
        fi
        GITOPS_DIR=$(dirname "$CONTEXT_PATH")
        # pipeline-context.yaml in the gitops repo is a ConfigMap manifest whose
        # data.context.yaml holds the actual context. The enhancer expects the
        # bare context; unwrap it.
        python3 - "$CONTEXT_PATH" > /tmp/context.yaml <<'CTXEOF'
        import sys, yaml
        doc = yaml.safe_load(open(sys.argv[1]))
        # unwrap ConfigMap { data: { context.yaml: <string> } } -> the context
        if isinstance(doc, dict) and doc.get("kind") == "ConfigMap":
            key = "context.yaml" if "context.yaml" in doc["data"] else next(iter(doc["data"]))
            sys.stdout.write(doc["data"][key])
        else:
            yaml.safe_dump(doc, sys.stdout, sort_keys=False)
        CTXEOF

        # Platform enhancer (the engine wheel), isolated from the app checkout: see
        # kubecore-ci-workflows.platformEnhance (kubecore-operator#1161, #1375, D-80).
{{ include "kubecore-ci-workflows.platformEnhance" . | indent 8 }}

        # DATASETS (PRD novelcore/kaos#1283 D-05, PRD novelcore/kaos#1911 D-15): every name a step
        # declares in inputs= is a form field that holds a dataset reference (the step table,
        # /tmp/steps.json). Each one gets the project's datasets as a picker: <dataset>@<version> newest
        # first and <dataset>@latest, the default dataset first. The default stays what the app's config
        # says. This trusted step reads kaos-lake's read-only catalog with its own projected
        # service-account token (names and versions, never data); the untrusted render above never
        # sees a credential. A catalog that cannot be read leaves the fields free text, never a red
        # build. No field is added: the form's fields are the engine's (it reserves `plan` and
        # `pipeline-version`).
{{ include "kubecore-ci-workflows.datasetChoicesScript" . | indent 8 }}
        # dataset-sha: what ml-ci-reconcile's DATASET DRIFT compares with the catalog later. "none" =
        # no step of this pipeline declares an input; "unread" = the catalog could not be read, the
        # fields are free text, and the next successful check re-renders; "no-store" = the context names
        # no data store, nothing to read.
        rm -f /tmp/dataset-sha
        python3 - /workspace/out/workflow-template.yaml /tmp/context.yaml /var/run/secrets/kaos-lake/token /tmp/dataset-sha /tmp/steps.json <<'DSEOF'
        import importlib.util, json, sys
        import yaml
        spec = importlib.util.spec_from_file_location("dataset_choices", "/tmp/dataset-choices.py")
        dc = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(dc)
        wft_path, ctx_path, token_path, sha_path, steps_path = sys.argv[1:6]
        wft = yaml.safe_load(open(wft_path))
        names = dc.input_names(json.load(open(steps_path)))
        if not names:
            open(sha_path, "w").write("none")
            print("datasets: no step of the pipeline declares an input")
            sys.exit(0)
        endpoint = (((yaml.safe_load(open(ctx_path)) or {}).get("lakefs") or {}).get("endpoint") or "").rstrip("/")
        if not endpoint:
            # An app whose context names no data store has no catalog to read: not "unread" (which
            # ml-ci-reconcile re-renders for on every event), a fact it records as "no-store".
            open(sha_path, "w").write("no-store")
            print(f"datasets: the context has no data store; the fields of {', '.join(names)} stay free text")
            sys.exit(0)
        try:
            datasets = dc.read_catalog(endpoint, token_path)
        except Exception as exc:  # noqa: BLE001
            # The form this render commits has free-text fields, so the digest of the last good render no
            # longer describes it: record "unread" and the next successful DATASET DRIFT check re-renders.
            # (Keeping the old digest left a form with no picker "in sync" until the catalog next changed.)
            open(sha_path, "w").write("unread")
            print(f"datasets: catalog not read ({type(exc).__name__}: {exc}); the fields of {', '.join(names)} stay free text")
            sys.exit(0)
        choices = dc.choices(datasets)
        open(sha_path, "w").write(dc.digest(choices))
        if not choices:
            print(f"datasets: the project has no dataset yet; the fields of {', '.join(names)} stay free text")
            sys.exit(0)
        try:
            filled = dc.fill(wft, names, datasets)
        except KeyError as exc:
            sys.exit(f"GATE FAIL: {exc.args[0]}")
        yaml.safe_dump(wft, open(wft_path, "w"), sort_keys=False)
        print(f"datasets: {len(choices)} choices from {len(datasets)} datasets on " + ", ".join(f"{n} (default {v})" for n, v in filled.items()))
        DSEOF

        # RUN FORM (PRD novelcore/kaos#1533, F-21): seal the form after the enhance and the dataset fill, before the
        # GATE, the size guard and the copy. An option file that fails to compose fails the build here.
{{ include "kubecore-ci-workflows.runFormSeal" (dict "previous" true "Files" .Files) | indent 8 }}

        # GATE: structural release-hygiene checks (fail before committing so a bad
        # render can't silently replace the live WFT). Duplicate params, non-
        # container templates, and GPU steps missing nvidia.com/gpu are hard errors.
        python3 - /workspace/out/workflow-template.yaml <<'GATEEOF'
        import sys, yaml
        wft = yaml.safe_load(open(sys.argv[1]))
        spec = wft["spec"]
        params = spec.get("arguments", {}).get("parameters", [])
        names = [p["name"] for p in params]
        dupes = {n for n in names if names.count(n) > 1}
        if dupes:
            sys.exit(f"GATE FAIL: duplicate submit-form parameters: {sorted(dupes)}")
        for t in spec["templates"]:
            if "script" in t:
                sys.exit(f"GATE FAIL: template '{t['name']}' is a @script template "
                         f"(bypasses the image supply chain — not allowed on the production tier)")
        print(f"GATE OK: {len(names)} params, {len([t for t in spec['templates'] if 'container' in t])} container templates")
        GATEEOF

        # Anti-churn: only re-render if this commit is newer than what produced
        # the live WFT (mirrors render-wft's monotonic guard).
        WFT_FILE="${GITOPS_DIR}/workflow-template.yaml"
        # SIZE GUARD: a render over the limit fails here, before anything is committed.
        python3 - /workspace/out/workflow-template.yaml "" <<'WFTSIZEEOF'
{{ include "kubecore-ci-workflows.wftSizeGuard" . | indent 8 }}
        WFTSIZEEOF
        WFT_BYTES=$(wc -c < /workspace/out/workflow-template.yaml | tr -d ' ')
        cp /workspace/out/workflow-template.yaml "$WFT_FILE"
        # The checkpoint helper source ships once per app as a ConfigMap next to the WFT
        # (the enhancer wrote it only when a step mounts it); a render that no longer needs
        # it removes the stale file.
        HELPER_FILE="${GITOPS_DIR}/ckpt-helper.yaml"
        if [ -f /workspace/out/ckpt-helper.yaml ]; then
          cp /workspace/out/ckpt-helper.yaml "$HELPER_FILE"
        else
          rm -f "$HELPER_FILE"
        fi

        # Ensure every image-<step> key the WFT references exists in
        # pipeline-images.yaml (the composition seeds a fixed key list that may
        # not match a Hera app's step set — keep it zero-composition-change by
        # adding any missing keys as :{step}-latest placeholders that patch-images
        # replaces after build). This is what keeps D10 true on day 1.
        IMAGES_FILE="${GITOPS_DIR}/pipeline-images.yaml"
        if [ -f "$IMAGES_FILE" ]; then
          CONTEXT_SHA=$(sha256sum "$CONTEXT_PATH" | cut -c1-64)
          python3 - "$WFT_FILE" "$IMAGES_FILE" "$APP_NAME" "$CONTEXT_SHA" "$ENGINE_VERSION" /tmp/dataset-sha "$WFT_BYTES" <<'IMGEOF'
        import sys, yaml, re
        wft = yaml.safe_load(open(sys.argv[1]))
        images_doc = yaml.safe_load(open(sys.argv[2]))
        app = sys.argv[3]
        # context-sha (kubecore-operator#1158): sha256 of the gitops
        # pipeline-context.yaml this render consumed. ml-ci-reconcile compares it
        # with the live file and submits a render when the platform context
        # changed without a push (compute classes, ml environment selector…).
        context_sha = sys.argv[4]
        # engine-version (PRD-HPC-1461 D-80): the platform engine this render ran.
        # ml-ci-reconcile compares it with the context's engine.version and
        # re-renders when the engine moved without a push (ENGINE DRIFT).
        engine_version = sys.argv[5]
        # dataset-sha: digest of the dataset choices this render offered ("none": no step declares
        # an input; missing file: the catalog was unreadable, keep the record). ml-ci-reconcile
        # compares it with the catalog and re-renders on DATASET DRIFT.
        import os
        dataset_sha = open(sys.argv[6]).read().strip() if len(sys.argv) > 6 and os.path.exists(sys.argv[6]) else ""
        # wft-bytes: the size of the rendered WorkflowTemplate, reported here so a pipeline growing
        # towards the size guard (wftSize.limitKiB) is visible before it fails.
        wft_bytes = sys.argv[7] if len(sys.argv) > 7 else ""
        # collect the pipeline-images keys the WFT reads. Two shapes, accepted in any order of the pins: the workflow's
        # own arguments (image-<step> with valueFrom.configMapKeyRef, the engine before the images moved) and the
        # inputs of a template (the engine reads the record in compose's template: an input per step with the same
        # valueFrom.configMapKeyRef, and no image is an argument of the workflow).
        wanted = set()
        candidates = list(wft["spec"].get("arguments", {}).get("parameters", []) or [])
        for tpl in wft["spec"].get("templates", []) or []:
            candidates += (tpl.get("inputs") or {}).get("parameters", []) or []
        for p in candidates:
            ref = (p.get("valueFrom") or {}).get("configMapKeyRef") or {}
            if ref.get("name") == f"{app}-pipeline-images":
                wanted.add(ref["key"])
        data = images_doc.setdefault("data", {})
        added = []
        for key in sorted(wanted):
            if key not in data:
                data[key] = f":{key}-latest"  # placeholder; patch-images overwrites post-build
                added.append(key)
        # Prune keys the rendered WFT no longer references (a deleted or
        # renamed step): otherwise the ConfigMap — and the image parameters the
        # submit form derives from it — keep stale entries forever
        # (kubecore-operator#1126, ml-dev-loop e2e "delete"/"rename").
        removed = [k for k in list(data) if k not in ("last-built-sha", "context-sha", "engine-version", "engine-compose", "engine-last-error", "engine-attempt", "dataset-sha", "wft-bytes", "kaos-lib-package", "kaos-lib-compat", "produced-datasets") and k not in wanted]
        for k in removed:
            del data[k]
        context_moved = bool(context_sha) and data.get("context-sha") != context_sha
        if context_moved:
            data["context-sha"] = context_sha
        engine_moved = bool(engine_version) and data.get("engine-version") != engine_version
        if engine_moved:
            data["engine-version"] = engine_version
        # PRD-1124 D-07 (kubecore-operator#1124 AC-09): the images ConfigMap MUST
        # live in the SAME namespace the WFT renders into. The k8smlapp
        # composition seeds pipeline-images.yaml ONCE (create-only) with the ML
        # namespace of that day; when the operator later (re)targets the app —
        # a dedicated app environment ({project}-{app}--{env}) or a renamed
        # env — the WFT follows the context but the ConfigMap stayed behind, so
        # every submit in the new namespace died at "ConfigMap
        # '{app}-pipeline-images' does not exist" and the CI reconciler
        # self-disabled on the same NotFound (live gke-dev/prd1124yolo
        # 2026-08-27). Pin it to the WFT's namespace on every render.
        wft_ns = (wft.get("metadata") or {}).get("namespace") or ""
        meta = images_doc.setdefault("metadata", {})
        moved = bool(wft_ns) and meta.get("namespace") != wft_ns
        if moved:
            print(f"pipeline-images namespace {meta.get('namespace')!r} -> {wft_ns!r} (following the rendered WFT)")
            meta["namespace"] = wft_ns
        dataset_moved = bool(dataset_sha) and data.get("dataset-sha") != dataset_sha
        if dataset_moved:
            data["dataset-sha"] = dataset_sha
        bytes_moved = bool(wft_bytes) and data.get("wft-bytes") != wft_bytes
        if bytes_moved:
            data["wft-bytes"] = wft_bytes
        if added or removed or moved or context_moved or engine_moved or dataset_moved or bytes_moved:
            yaml.safe_dump(images_doc, open(sys.argv[2], "w"), sort_keys=False)
            print(f"pipeline-images keys — added: {added} removed: {removed} moved: {moved} context-sha: {context_sha[:12] if context_moved else 'unchanged'} engine-version: {engine_version if engine_moved else 'unchanged'} dataset-sha: {dataset_sha[:12] if dataset_moved else 'unchanged'}")
        else:
            print("pipeline-images already has exactly the image-<step> keys the WFT references")
        IMGEOF
        fi

        cd /tmp/gitops
        git add "${WFT_FILE}" "${IMAGES_FILE}" 2>/dev/null || git add "${WFT_FILE}"
        # The helper ConfigMap: added, updated or removed with the WFT. `git add -A -- <path>` exits 128
        # ("pathspec did not match any files") for a path that is neither on disk nor tracked, which is
        # every app whose steps do not mount the helper (a first build, a CPU-only pipeline) — so only
        # stage it when it exists or is tracked (a removal).
        if [ -e "${HELPER_FILE}" ] || git ls-files --error-unmatch -- "${HELPER_FILE}" >/dev/null 2>&1; then
          git add -A -- "${HELPER_FILE}"
        fi
        if git diff --cached --quiet; then
          echo "hera-enhance-commit: rendered WFT already current — nothing to commit"
        else
          git commit -m "ml-ci(${APP_NAME}): render WFT from pipeline.py (Hera+Hydra)"
          # Retry rebase+push: the gitops branch has many concurrent writers
          # (every app's CI in the project, plus Crossplane's RepositoryFile
          # MRs). A single push loses the race whenever another commit lands
          # first and dies "non-fast-forward" — dropping this app's render on
          # the floor with a red build. Rebase and retry a few times instead.
          pushed=""
          for attempt in 1 2 3 4 5; do
            if git push 2>&1; then pushed=yes; break; fi
            echo "hera-enhance-commit: push rejected (attempt ${attempt}) — rebasing onto the latest ${GITOPS_BRANCH}"
            sleep $((attempt * 3))
            git pull --rebase origin "${GITOPS_BRANCH}" || { echo "hera-enhance-commit: rebase failed"; break; }
          done
          [ -n "$pushed" ] || { echo "hera-enhance-commit: could not push after 5 attempts"; exit 1; }
          echo "hera-enhance-commit: pushed rendered WFT to ${ORG}/${GITOPS_REPO}@${GITOPS_BRANCH}"
        fi
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true
      - name: kaos-lake-token
        mountPath: /var/run/secrets/kaos-lake
        readOnly: true
    # The step's own service-account token for kaos-lake's dataset catalog (PRD
    # novelcore/kaos#1283 D-05): audience-bound, short-lived, read-only use.
    volumes:
    - name: kaos-lake-token
      projected:
        sources:
        - serviceAccountToken:
            audience: {{ .Values.kaosLake.workloadAudience | quote }}
            expirationSeconds: 600
            path: token

  # kaos-lib-support (PRD novelcore/kaos#1147, contract "Support window as
  # release metadata"): the commit status kaos-lib/support on the built commit,
  # from the same check every pipeline step runs at start, against the version
  # this build resolved (the gitops pipeline-context's kaosLib.version, checked
  # against kaosLib.support, the newest release's metadata the operator
  # publishes). Red (failure) when unsupported; success with a "warning:"
  # description when behind or deprecated; target_url is the Argo run. No
  # support data in the context = no status. Borrowed by ml-ci-pr-render (the
  # PR head) and ml-ci-rc-build, which passes refuse_unsupported=true: an
  # unsupported version then fails the step, so the release is refused. A
  # GitHub write that still fails exits non-zero (callers that only report run
  # it with continueOn failed) but never refuses a release on its own.
  - name: kaos-lib-support
{{ include "kubecore-ci-workflows.githubReportRetry" . | indent 4 }}
    inputs:
      parameters:
      - name: refuse_unsupported
        value: "false"
    container:
      image: {{ .Values.tooling.toolboxImage | default "alpine/k8s:1.36.4" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
{{ include "kubecore-ci-workflows.gitAuth" . | indent 8 }}
        ORG="{{ .Values.github.org }}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        REFUSE="{{`{{inputs.parameters.refuse_unsupported}}`}}"
        rm -rf /tmp/gitops
        git clone --quiet --depth=1 --branch "${GITOPS_BRANCH}" \
          "https://github.com/${ORG}/{{`{{workflow.parameters.gitops_repository}}`}}.git" /tmp/gitops
        git_assert_no_token /tmp/gitops
        KL_CTX=$(find /tmp/gitops -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-context.yaml" | head -1)
        if [ -z "$KL_CTX" ]; then
          echo "kaos-lib-support: no pipeline-context for ${APP_NAME} in the gitops repo — nothing to check"
          exit 0
        fi
{{ include "kubecore-ci-workflows.kaosLibScript" . | indent 8 }}
        python3 -I /tmp/kaos-lib.py support --context "$KL_CTX" > /tmp/support.json
        VERDICT=$(jq -r '.verdict' /tmp/support.json)
        STATE=$(jq -r '.state' /tmp/support.json)
        DESC=$(jq -r '.description' /tmp/support.json)
        if [ -z "$STATE" ]; then
          echo "kaos-lib-support: the platform context carries no kaos-lib support data — no status"
          exit 0
        fi
        echo "kaos-lib-support: ${VERDICT} — ${DESC}"
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        OWNER_REPO=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed 's|https://github.com/||; s|\.git$||')
        CONTEXT="kaos-lib/support"
        ENVIRONMENT=""
        API="https://api.github.com/repos/${OWNER_REPO}"
        AUTH="Authorization: token ${TOKEN}"
        ACCEPT="Accept: application/vnd.github+json"
        ARGO_BASE="{{ .Values.argo.uiBaseUrl }}"
        RUN_URL=""
        if [ -n "${ARGO_BASE}" ]; then
          RUN_URL="${ARGO_BASE}/workflows/{{`{{workflow.namespace}}`}}/{{`{{workflow.name}}`}}?uid={{`{{workflow.uid}}`}}"
        fi
        set +e
        (
{{ include "kubecore-ci-workflows.githubStatusReport" . | indent 10 }}
        )
        RC=$?
        if [ "$REFUSE" = "true" ] && [ "$VERDICT" = "unsupported" ]; then
          echo "kaos-lib-support: REFUSED — ${DESC}. Move the app to a supported kaos-lib version (merge its bump pull request) and release again." >&2
          exit 1
        fi
        [ "$REFUSE" = "true" ] && exit 0
        exit "$RC"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: patch-images
{{ include "kubecore-ci-workflows.preemptionRetry" . | indent 4 }}
    inputs:
      parameters:
      - name: image_tag
      - name: changed_steps
      # kaos-lib report (PRD novelcore/kaos#1147, detect-steps): "" = leave.
      - name: kaos_lib_record
        value: ""
      - name: kaos_lib_compat
        value: ""
      # The engine version whose compose-and-validate image this build made ("" = none built): recorded
      # as engine-compose.
      - name: engine_compose
        value: ""
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    container:
      image: {{ .Values.tooling.toolboxImage | default "alpine/k8s:1.36.4" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      env:
      - name: KL_RECORD
        value: "{{`{{inputs.parameters.kaos_lib_record}}`}}"
      - name: KL_COMPAT
        value: "{{`{{inputs.parameters.kaos_lib_compat}}`}}"
      - name: ENGINE_COMPOSE
        value: "{{`{{inputs.parameters.engine_compose}}`}}"
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
{{ include "kubecore-ci-workflows.gitAuth" . | indent 8 }}
        ORG="{{ .Values.github.org }}"
        GITOPS_REPO="{{`{{workflow.parameters.gitops_repository}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')
{{ include "kubecore-ci-workflows.engineScript" . | indent 8 }}

        REGISTRY="{{`{{workflow.parameters.registry_url}}`}}"
        if [ -z "$REGISTRY" ]; then REGISTRY="{{ .Values.registry.externalUrl }}"; fi
        if [ -z "$REGISTRY" ]; then REGISTRY="{{ .Values.registry.internalUrl }}"; fi
        IMAGE_REPO="{{`{{workflow.parameters.image_repository}}`}}"
        if [ -z "$IMAGE_REPO" ]; then
          IMAGE_REPO="{{`{{workflow.parameters.project_name}}`}}/${APP_NAME}"
        fi

        REPO_URL="https://github.com/${ORG}/${GITOPS_REPO}.git"
        git clone --depth=1 --branch "${GITOPS_BRANCH}" "${REPO_URL}" /tmp/gitops
        git_assert_no_token /tmp/gitops
        cd /tmp/gitops

        # pipeline-images.yaml is written by Crossplane at
        # {basePath}/{appName}/{gitopsBranch}/ — basePath is operator-configured
        # (default "kubeapps") and not passed here, so discover it by locating
        # the file (same discovery as render-wft; live layout verified
        # gke-dev/yolo 2026-06-13).
        IMAGES_PATH=$(find . -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-images.yaml" | head -1)

        if [ -z "${IMAGES_PATH}" ] || [ ! -f "${IMAGES_PATH}" ]; then
          echo "ERROR: pipeline-images.yaml not found anywhere under */${APP_NAME}/${GITOPS_BRANCH}/ — the WFT resolves image parameters from this ConfigMap; failing loudly."
          exit 1
        fi
        echo "pipeline-images discovered at ${IMAGES_PATH}"

        # PRD-1124 D-07 (kubecore-operator#1124 AC-09): keep the ConfigMap in
        # the namespace the rendered WFT lives in — the WFT sits next to it in
        # gitops. Same rule as hera-enhance-commit; this covers builds that skip
        # the render (images-only changes, reconcile no-ops).
        WFT_PATH="$(dirname "${IMAGES_PATH}")/workflow-template.yaml"
        if [ -f "${WFT_PATH}" ]; then
          WFT_NS=$(yq e '.metadata.namespace // ""' "${WFT_PATH}")
          CUR_NS=$(yq e '.metadata.namespace // ""' "${IMAGES_PATH}")
          if [ -n "${WFT_NS}" ] && [ "${WFT_NS}" != "${CUR_NS}" ]; then
            echo "pipeline-images namespace '${CUR_NS}' -> '${WFT_NS}' (following the rendered WFT)"
            yq e -i ".metadata.namespace = \"${WFT_NS}\"" "${IMAGES_PATH}"
          fi
        fi

        # changed_steps comes in as a JSON array `[{"name":"...","path":"..."},...]`
        # Update each step's image key in the pipeline-images ConfigMap.
        echo '{{`{{inputs.parameters.changed_steps}}`}}' > /tmp/changed.json
        STEPS_LEN=$(yq -p=json -o=yaml 'length' /tmp/changed.json)
        i=0
        while [ "$i" -lt "$STEPS_LEN" ]; do
          STEP_NAME=$(yq -p=json -o=yaml ".[$i].name" /tmp/changed.json | tr -d '"')
          NEW_IMAGE="${REGISTRY}/${IMAGE_REPO}:${STEP_NAME}-${IMAGE_TAG}"
          echo "Updating pipeline-images key '${STEP_NAME}' → ${NEW_IMAGE}"
          yq e -i ".data.\"${STEP_NAME}\" = \"${NEW_IMAGE}\"" "${IMAGES_PATH}"
          i=$((i + 1))
        done

        # ============ digest-pin-on-build (kubecore-operator#1008) ============
        # Repo-level tag retention prunes tags, and Zot ranks a tag by its
        # MANIFEST digest's original push time, not the tag's PUT time — so
        # the previous approach (aliasing unchanged steps' manifests to the
        # new image_tag) was reaped on the very next retention pass: the
        # alias inherited the old digest's age and never met
        # mostRecentlyPushedCount. Proven live 2026-08-20 (zot retention log:
        # alias PUT 201 at 11:05, deleted 11:40 with pushTimestamp of the
        # day-old digest).
        # Fix the class instead: pin every step by DIGEST (repo:tag@sha256).
        # The kubelet pulls by digest and ignores the tag, so tag pruning can
        # never break a pin. The manifest itself stays alive because each
        # step's `{step}-latest` tag always references it (retained by the
        # ^.*-latest$ retention bucket), so GC never collects it either.
        # Per step: HEAD the pinned tag for its digest; if the tag is already
        # pruned, fall back to `{step}-latest` (same lineage — the last image
        # actually built for that step). WARN-and-keep on total failure.
        # Never fails the build.
        BUILD_REGISTRY="{{`{{workflow.parameters.build_registry_url}}`}}"
        if [ -z "${BUILD_REGISTRY}" ]; then BUILD_REGISTRY="{{ .Values.registry.internalUrl }}"; fi
        RU=$(cat /etc/registry-auth/username 2>/dev/null || true)
        RP=$(cat /etc/registry-auth/password 2>/dev/null || true)
        # Artifact Registry (PRD novelcore/kaos#1911, D-52): no ci-registry-auth there, so this block
        # was skipped and the record kept tags; a run that starts from a later step compares images by
        # digest and was refused every time. The build's service account already reads the registry
        # through Workload Identity (it pushes with it): take its token from the metadata server.
        # MANIFESTS is the registry's manifests URL of this app's image repository.
        MANIFESTS="http://${BUILD_REGISTRY}/v2/${IMAGE_REPO}/manifests"
        case "${BUILD_REGISTRY}" in
          *-docker.pkg.dev/*)
            RU="oauth2accesstoken"
            RP=$(curl -sf -m 10 -H "Metadata-Flavor: Google" \
              "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" 2>/dev/null \
              | sed -n 's/.*"access_token" *: *"\([^"]*\)".*/\1/p' || true)
            [ -n "${RP}" ] || { RU=""; echo "WARN digest-pin: no token from the metadata server for ${BUILD_REGISTRY%%/*}"; }
            MANIFESTS="https://${BUILD_REGISTRY%%/*}/v2/${BUILD_REGISTRY#*/}/${IMAGE_REPO}/manifests"
            ;;
        esac
        if [ -n "${RU}" ] && [ -n "${BUILD_REGISTRY}" ]; then
          ACCEPT="Accept: application/vnd.oci.image.manifest.v1+json"
          ACCEPT2="Accept: application/vnd.docker.distribution.manifest.v2+json"
          ACCEPT3="Accept: application/vnd.oci.image.index.v1+json"
          ACCEPT4="Accept: application/vnd.docker.distribution.manifest.list.v2+json"
          head_digest() {
            curl -sfI -u "${RU}:${RP}" -H "${ACCEPT}" -H "${ACCEPT2}" -H "${ACCEPT3}" -H "${ACCEPT4}" \
              "${MANIFESTS}/$1" 2>/dev/null \
              | grep -i '^Docker-Content-Digest:' | tr -d '\r' | awk '{print $2}' | head -1
          }
          for KEY in $(yq e '.data | keys | .[]' "${IMAGES_PATH}"); do
            [ "${KEY}" = "last-built-sha" ] && continue
            [ "${KEY}" = "engine-version" ] && continue
            [ "${KEY}" = "engine-compose" ] && continue
            [ "${KEY}" = "engine-last-error" ] && continue
            [ "${KEY}" = "engine-attempt" ] && continue
            [ "${KEY}" = "dataset-sha" ] && continue
            [ "${KEY}" = "context-sha" ] && continue
            [ "${KEY}" = "wft-bytes" ] && continue
            [ "${KEY}" = "kaos-lib-package" ] && continue
            [ "${KEY}" = "kaos-lib-compat" ] && continue
            [ "${KEY}" = "produced-datasets" ] && continue
            CUR_VALUE=$(yq e ".data.\"${KEY}\"" "${IMAGES_PATH}")
            BASE="${CUR_VALUE%%@*}"
            TAG="${BASE##*:}"
            case "${TAG}" in */*) echo "WARN digest-pin: ${KEY} value has no tag (${CUR_VALUE}) — keeping"; continue ;; esac
            DIGEST=$(head_digest "${TAG}")
            if [ -z "${DIGEST}" ] && [ "${TAG}" != "${KEY}-latest" ]; then
              TAG="${KEY}-latest"
              DIGEST=$(head_digest "${TAG}")
              [ -n "${DIGEST}" ] && echo "digest-pin: ${KEY} pinned tag pruned — re-resolved from ${TAG}"
            fi
            if [ -n "${DIGEST}" ]; then
              NEW_VALUE="${BASE%:*}:${TAG}@${DIGEST}"
              if [ "${NEW_VALUE}" != "${CUR_VALUE}" ]; then
                yq e -i ".data.\"${KEY}\" = \"${NEW_VALUE}\"" "${IMAGES_PATH}"
                echo "digest-pin: ${KEY} -> ${TAG}@${DIGEST}"
              fi
            else
              echo "WARN digest-pin: no digest resolvable for ${KEY} (${CUR_VALUE}) — keeping old pin; heals on next rebuild of that step"
            fi
          done
        else
          echo "WARN digest-pin: no registry auth — skipped; the record keeps tags, so a run of this app cannot start from a later step until a build pins them"
        fi
        # =====================================================================

        # last-built-sha: the commit this build was for. The per-app CI
        # reconciler CronWorkflow (ml-ci-reconcile) compares it against the
        # repo's HEAD to detect a push that never got built — a dropped webhook
        # (#459). The k8smlapp composition has always DOCUMENTED this key, but
        # nothing wrote it, so the reconciler had no baseline to compare against.
        # Per-step image tags cannot substitute: a step only rebuilds when its
        # own directory changes, so each carries its OWN sha and none of them
        # tracks HEAD.
        COMMIT_SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        if [ -n "${COMMIT_SHA}" ]; then
          echo "Recording last-built-sha = ${COMMIT_SHA}"
          yq e -i ".data.\"last-built-sha\" = \"${COMMIT_SHA}\"" "${IMAGES_PATH}"
        fi

        # kaos-lib report (PRD novelcore/kaos#1147): the spec every step image
        # that declares ARG KAOS_LIB_PACKAGE now has ("none" = no step does) and
        # the app's .kaos/compat.yaml range ("" = none declared). The operator
        # reads both from this file (status.ml.kaosLib.built) and ml-ci-reconcile
        # compares kaos-lib-package with the context. Only reached when every
        # build-push succeeded, so the record never runs ahead of the images.
        if [ -n "${KL_RECORD}" ]; then
          echo "Recording kaos-lib-package = ${KL_RECORD}, kaos-lib-compat = ${KL_COMPAT:-<none declared>}"
          yq e -i '.data."kaos-lib-package" = strenv(KL_RECORD) | .data."kaos-lib-compat" = strenv(KL_COMPAT)' "${IMAGES_PATH}"
        fi

        # engine-compose (PRD-HPC-1461 D-80): the engine version the compose-and-validate image was
        # just built on. ml-ci-build rebuilds it when this differs from the context's engine.version.
        if [ -n "${ENGINE_COMPOSE}" ]; then
          echo "Recording engine-compose = ${ENGINE_COMPOSE}"
          yq e -i '.data."engine-compose" = strenv(ENGINE_COMPOSE)' "${IMAGES_PATH}"
        fi

        # produced-datasets (PRD novelcore/kaos#1911): the short names of the datasets the pipeline
        # produces (the name inside dataset("...")), sorted, comma separated, "" when it produces none.
        # The operator reads it to tell the lake which datasets the app may write. Read from the step
        # table of the committed WorkflowTemplate, never from pipeline.py. Written on every build that
        # records images, never omitted; a committed render without a step table fails the step
        # (engine.py produced, exit 6) and records nothing.
        PRODUCED=$(python3 -I /tmp/engine.py produced --wft "$(dirname "${IMAGES_PATH}")/workflow-template.yaml")
        echo "Recording produced-datasets = ${PRODUCED:-<none>}"
        PRODUCED="${PRODUCED}" yq e -i '.data."produced-datasets" = strenv(PRODUCED)' "${IMAGES_PATH}"

        git config user.name "KubeCore CI"
        git config user.email "ci@kubecore.io"
        git add "${IMAGES_PATH}"
        if git diff --cached --quiet; then
          echo "No changes to commit (image tags already match)"
          exit 0
        fi
        git commit -m "ml-ci(${APP_NAME}): bump step images to ${IMAGE_TAG} in pipeline-images ConfigMap"
        # Retry rebase+push: the gitops branch has many concurrent writers, so a
        # single push dies "non-fast-forward" whenever another commit lands
        # first — leaving this app's pipeline-images ConfigMap pinned to a STALE
        # image tag while its build reported green (observed live 2026-07-16:
        # hera-yolo's patch-images lost the race and exited 1, so its rebuilt
        # compose image was never wired in). Rebase and retry instead.
        pushed=""
        for attempt in 1 2 3 4 5; do
          if git push 2>&1; then pushed=yes; break; fi
          echo "patch-images: push rejected (attempt ${attempt}) — rebasing onto the latest ${GITOPS_BRANCH}"
          sleep $((attempt * 3))
          git pull --rebase origin "${GITOPS_BRANCH}" || { echo "patch-images: rebase failed"; break; }
        done
        [ -n "$pushed" ] || { echo "patch-images: could not push after 5 attempts"; exit 1; }
        echo "Pushed image-tag update to ${ORG}/${GITOPS_REPO}@${GITOPS_BRANCH}"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true
      - name: registry-auth
        mountPath: /etc/registry-auth
        readOnly: true

  - name: tag
{{ include "kubecore-ci-workflows.preemptionRetry" . | indent 4 }}
    inputs:
      parameters:
      - name: image_tag
      - name: new_version
    container:
      image: {{ .Values.tooling.gitImage | default "alpine/git:2.52.0" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        NEW_VERSION="{{`{{inputs.parameters.new_version}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        TIMESTAMP=$(echo "$IMAGE_TAG" | sed -E 's/dev-v[0-9]+\.[0-9]+\.[0-9]+-([0-9]+-[0-9]+)-.*/\1/')
        DEV_TAG="dev-v${NEW_VERSION}-${TIMESTAMP}"

        TAG="${DEV_TAG}"
        TAG_MESSAGE="ML dev release v${NEW_VERSION}"
        # From a fresh repo, never /workspace/repo: see
        # kubecore-ci-workflows.pushTag (kubecore-operator#1375).
{{ include "kubecore-ci-workflows.pushTag" . | indent 8 }}
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: status
{{ include "kubecore-ci-workflows.githubReportRetry" . | indent 4 }}
    # GitHub reporting for the AUTHORITATIVE in-cluster build (#1126): ONE
    # commit status (context kubecore-ml-ci by default) with target_url into
    # the Argo UI run, plus a Deployment rollup (environment auto = argo-workflows-<branch|pr> by default)
    # whose log/environment URL is the same run. pending creates the
    # Deployment; success/failure resolve the Deployment created for this SHA.
    # Every GitHub call retries transient answers; a write that still fails
    # fails this step, and every caller runs it with continueOn failed, so a
    # reporting failure is a red status node, never a red build.
    inputs:
      parameters:
      - name: state
      - name: description
      # context = the commit-status check name; environment = the GitHub
      # Deployment environment this pipeline rolls up into ("" = no
      # Deployment, statuses only). Defaults are this pipeline's own; RC
      # variants override both via templateRef.
      - name: context
        value: "kubecore-ml-ci"
      - name: environment
        value: "auto"
    container:
      image: {{ .Values.tooling.toolboxImage | default "alpine/k8s:1.36.4" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO="{{`{{workflow.parameters.repo_url}}`}}"
        OWNER_REPO=$(echo "$REPO" | sed 's|https://github.com/||' | sed 's|.git$||')
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        STATE="{{`{{inputs.parameters.state}}`}}"
        DESC=$(printf '%s' "{{`{{inputs.parameters.description}}`}}" | cut -c1-140)
        CONTEXT="{{`{{inputs.parameters.context}}`}}"
        ENVIRONMENT="{{`{{inputs.parameters.environment}}`}}"
        # environment "auto" → named after what actually ran, so the GitHub
        # Deployments page reads argo-workflows-dev / argo-workflows-pr /
        # argo-workflows-rc instead of an internal pipeline id (#1126):
        #   push to <branch>  → argo-workflows-<branch>
        #   pull request      → argo-workflows-pr
        if [ "${ENVIRONMENT}" = "auto" ]; then
          BR=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||' | tr '/' '-')
          case "{{`{{workflow.parameters.event_type}}`}}" in
            pull_request) ENVIRONMENT="argo-workflows-pr" ;;
            *) ENVIRONMENT="argo-workflows-${BR}" ;;
          esac
        fi
        API="https://api.github.com/repos/${OWNER_REPO}"
        AUTH="Authorization: token ${TOKEN}"
        ACCEPT="Accept: application/vnd.github+json"
        ARGO_BASE="{{ .Values.argo.uiBaseUrl }}"
        RUN_URL=""
        if [ -n "${ARGO_BASE}" ]; then
          RUN_URL="${ARGO_BASE}/workflows/{{`{{workflow.namespace}}`}}/{{`{{workflow.name}}`}}?uid={{`{{workflow.uid}}`}}"
        fi

        # Commit status + Deployment rollup, every GitHub call retried (ghApi);
        # a write that still fails fails this step (see githubStatusReport).
{{ include "kubecore-ci-workflows.githubStatusReport" . | indent 8 }}
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  # report — the human-readable run report on GitHub (#1126). Runs from EVERY
  # pipeline's exit handler, success or failure, and upserts ONE marker
  # comment: a PR comment when the run came from a pull request (pr_number),
  # a commit comment on the built SHA otherwise (commit comments also appear
  # in the PR timeline). Content: verdict, why (the failing step's message +
  # the tail of its main-container log, read via the CI SA's pods/log grant
  # in the project's ci namespace — pods are still present when the exit
  # handler runs), every step with phase + duration, and the links: the Argo
  # run, the commit, the Deployment environment. Complements the commit
  # status (the check) and the Deployment (the rollup): together they are
  # the full GitHub-native report — no GitHub Actions anywhere.
  - name: report
{{ include "kubecore-ci-workflows.preemptionRetry" . | indent 4 }}
    inputs:
      parameters:
      - name: pipeline
      - name: context
      - name: environment
        value: ""
      - name: pr_number
        value: ""
    container:
      image: {{ .Values.tooling.kubectlImage | default "alpine/k8s:1.36.4" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      args:
      - |
        set +e
        TOKEN=$(cat /etc/github-token/token)
        REPO="{{`{{workflow.parameters.repo_url}}`}}"
        OWNER_REPO=$(echo "$REPO" | sed 's|https://github.com/||' | sed 's|.git$||')
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        WF="{{`{{workflow.name}}`}}"; NS="{{`{{workflow.namespace}}`}}"
        PHASE="{{`{{workflow.status}}`}}"; DURATION="$(printf '%.0f' "{{`{{workflow.duration}}`}}" 2>/dev/null || echo "{{`{{workflow.duration}}`}}")s"
        PIPELINE="{{`{{inputs.parameters.pipeline}}`}}"
        CONTEXT="{{`{{inputs.parameters.context}}`}}"
        ENVIRONMENT="{{`{{inputs.parameters.environment}}`}}"
        PR="{{`{{inputs.parameters.pr_number}}`}}"
        # environment "auto" → named after what actually ran, so the GitHub
        # Deployments page reads argo-workflows-dev / argo-workflows-pr /
        # argo-workflows-rc instead of an internal pipeline id (#1126):
        #   push to <branch>  → argo-workflows-<branch>
        #   pull request      → argo-workflows-pr
        if [ "${ENVIRONMENT}" = "auto" ]; then
          BR=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||' | tr '/' '-')
          case "{{`{{workflow.parameters.event_type}}`}}" in
            pull_request) ENVIRONMENT="argo-workflows-pr" ;;
            *) ENVIRONMENT="argo-workflows-${BR}" ;;
          esac
        fi
        API="https://api.github.com/repos/${OWNER_REPO}"
        AUTH="Authorization: token ${TOKEN}"
        ACCEPT="Accept: application/vnd.github+json"
        ARGO_BASE="{{ .Values.argo.uiBaseUrl }}"
        RUN_URL=""; [ -n "${ARGO_BASE}" ] && RUN_URL="${ARGO_BASE}/workflows/${NS}/${WF}?uid={{`{{workflow.uid}}`}}"
        MARKER="<!-- kubecore-ci-report:${CONTEXT} -->"

        # Argo hands the exit handler the failed nodes as JSON.
        cat > /tmp/failures.json <<'FAILEOF'
        {{`{{workflow.failures}}`}}
        FAILEOF

        # Step table from this run's pods (annotations carry the node name;
        # skipped steps never got a pod and are listed as not run).
        kubectl get pods -n "${NS}" -l "workflows.argoproj.io/workflow=${WF}" -o json > /tmp/pods.json 2>/dev/null || echo '{"items":[]}' > /tmp/pods.json
        jq -r '
          def dur: if .st and .ft then ((.ft|fromdateiso8601) - (.st|fromdateiso8601) | tostring) + "s" else "-" end;
          [.items[] | {
            name: (.metadata.annotations["workflows.argoproj.io/node-name"] // .metadata.name | split(".") | last | split("(") | first),
            phase: (if (.status.containerStatuses // [] | map(select(.name=="main")) | .[0].state.terminated.exitCode // 0) != 0 then "Failed" elif .status.phase=="Succeeded" then "Succeeded" else .status.phase end),
            exit: ((.status.containerStatuses // [] | map(select(.name=="main")) | .[0].state.terminated.exitCode) // "-"),
            pod: .metadata.name,
            st: .status.startTime, ft: ((.status.containerStatuses // [] | map(select(.name=="main")) | .[0].state.terminated.finishedAt) // null)
          }] | sort_by(.st) | .[] | "| \(.phase|if .=="Succeeded" then "✅" elif .=="Failed" then "❌" else "⏳" end) `\(.name)` | \(.phase) | \(dur) |"
        ' /tmp/pods.json > /tmp/steps.md 2>/dev/null

        # Why: for every failed pod, the tail of its main log.
        : > /tmp/why.md
        jq -r '.items[] | select(((.status.containerStatuses // []) | map(select(.name=="main")) | .[0].state.terminated.exitCode // 0) != 0) | .metadata.name + " " + (.metadata.annotations["workflows.argoproj.io/node-name"] // .metadata.name)' /tmp/pods.json | while read -r POD NODE; do
          STEP=$(echo "$NODE" | awk -F. '{print $NF}' | sed 's/(.*//')
          MSG=$(jq -r --arg n "$STEP" --arg p "$POD" '.[]? | select(.displayName==$n or .podName==$p) | .message' /tmp/failures.json 2>/dev/null | head -1)
          # Log excerpt: ANSI-stripped, executor chatter removed; the lines
          # that carry an error first (build tools bury the reason under
          # hundreds of INFO lines), then the tail.
          ESC=$(printf '\033')
          kubectl logs -n "${NS}" "${POD}" -c main --tail=400 2>/dev/null | sed "s/${ESC}\[[0-9;]*m//g" | grep -v "^time=.*argo=true" | cut -c1-300 > /tmp/log.txt
          echo "" >> /tmp/why.md
          echo "**Step \`${STEP}\` failed**${MSG:+ — ${MSG}}." >> /tmp/why.md
          ERR=$(grep -inE "error|fail|exit (code|status)|exception|traceback|fatal|denied|not found|no such|cannot|unable" /tmp/log.txt | grep -viE "INFO.*(cached|Executing|Retrieving)|warning: " | tail -12 | cut -d: -f2-)
          if [ -n "$ERR" ]; then
            echo "" >> /tmp/why.md; echo "Error lines:" >> /tmp/why.md; echo '```' >> /tmp/why.md; echo "$ERR" >> /tmp/why.md; echo '```' >> /tmp/why.md
          fi
          echo "" >> /tmp/why.md; echo "<details><summary>Last 30 lines of the step log</summary>" >> /tmp/why.md; echo "" >> /tmp/why.md
          echo '```' >> /tmp/why.md; tail -30 /tmp/log.txt >> /tmp/why.md; echo '```' >> /tmp/why.md; echo "</details>" >> /tmp/why.md
        done
        if [ "${PHASE}" != "Succeeded" ] && [ ! -s /tmp/why.md ]; then
          echo "" >> /tmp/why.md
          echo "The run ended **${PHASE}** without a failed step pod — usually an executor / scheduling error. Argo's failure list:" >> /tmp/why.md
          echo '```' >> /tmp/why.md; jq -r '.[]? | "\(.displayName): \(.message)"' /tmp/failures.json 2>/dev/null | head -20 >> /tmp/why.md; echo '```' >> /tmp/why.md
        fi

        if [ "${PHASE}" = "Succeeded" ]; then VERDICT="✅ **${PIPELINE} succeeded**"; else VERDICT="❌ **${PIPELINE} ${PHASE}**"; fi
        LINKS="- Argo run: ${RUN_URL:-${WF} in namespace ${NS}}"$'\n'"- Commit: https://github.com/${OWNER_REPO}/commit/${SHA}"$'\n'"- Check: \`${CONTEXT}\`"
        [ -n "${ENVIRONMENT}" ] && LINKS="${LINKS}"$'\n'"- Deployment: https://github.com/${OWNER_REPO}/deployments/${ENVIRONMENT} (environment \`${ENVIRONMENT}\`)"
        {
          echo "${MARKER}"
          echo "### ${VERDICT}"
          echo ""
          echo "Ran in-cluster on Argo Workflows (\`${NS}/${WF}\`, ${DURATION}); reported back through this comment, the \`${CONTEXT}\` commit status and${ENVIRONMENT:+ the \`${ENVIRONMENT}\` Deployment and} the links below. No GitHub Actions."
          echo ""
          if [ "${PHASE}" != "Succeeded" ]; then echo "#### Why it failed"; cat /tmp/why.md; echo ""; fi
          # Optional pipeline-specific section a run drops into the shared
          # workspace (the PR gate writes the rendered pipeline's steps there,
          # so a developer sees the step they added/renamed/removed named in
          # the PR — #1126). Absent file → nothing added.
          if [ -s /workspace/report-extra.md ]; then cat /workspace/report-extra.md; echo ""; fi
          echo "#### Steps"
          echo ""
          echo "| step | result | duration |"
          echo "|---|---|---|"
          cat /tmp/steps.md
          echo ""
          echo "#### Links"
          echo "${LINKS}"
        } > /tmp/body.md
        jq -Rs '{body: .}' /tmp/body.md > /tmp/payload.json

        # Upsert: one comment per (context, target) — PR comment when the run
        # came from a PR, commit comment otherwise.
        if [ -n "${PR}" ]; then
          LIST="${API}/issues/${PR}/comments?per_page=100"; CREATE="${API}/issues/${PR}/comments"; EDIT="${API}/issues/comments"
        else
          LIST="${API}/commits/${SHA}/comments?per_page=100"; CREATE="${API}/commits/${SHA}/comments"; EDIT="${API}/comments"
        fi
        # Every GitHub answer is checked and a failure is LOGGED with GitHub's own message:
        # this used to print "Posted" whatever came back, and a PR report that never landed
        # was invisible (e2e-suite-ml-xwrpm, 2026-10-08). Still best-effort (set +e): the
        # report must never fail the run it reports on.
        TARGET="${PR:+PR #${PR}}"; TARGET="${TARGET:-commit ${SHA}}"
        LIST_CODE=$(curl -s -o /tmp/list.json -w '%{http_code}' -H "${AUTH}" -H "${ACCEPT}" "${LIST}")
        if [ "${LIST_CODE}" != "200" ]; then
          echo "report: listing comments on ${TARGET} answered ${LIST_CODE}: $(jq -r '.message // .' /tmp/list.json 2>/dev/null | head -c 300)"
          echo '[]' > /tmp/list.json
        fi
        CID=$(jq -r --arg m "${MARKER}" '[.[]? | objects | select((.body // "") | startswith($m))] | .[0].id // empty' /tmp/list.json)
        if [ -n "${CID}" ]; then
          CODE=$(curl -s -o /tmp/post.json -w '%{http_code}' -X PATCH -H "${AUTH}" -H "${ACCEPT}" "${EDIT}/${CID}" -d @/tmp/payload.json)
          VERB="Updated report comment ${CID} on"
        else
          CODE=$(curl -s -o /tmp/post.json -w '%{http_code}' -X POST -H "${AUTH}" -H "${ACCEPT}" "${CREATE}" -d @/tmp/payload.json)
          VERB="Posted report comment on"
        fi
        case "${CODE}" in
          2*) echo "${VERB} ${TARGET}" ;;
          *)  echo "report: comment on ${TARGET} FAILED, GitHub answered ${CODE}: $(jq -r '.message // .' /tmp/post.json 2>/dev/null | head -c 300)" ;;
        esac
      volumeMounts:
      # Every caller (ml-ci-build, ml-ci-pr-render, ci-build,
      # rc) declares a `workspace` volume, so this mount is always satisfiable;
      # only the PR gate writes report-extra.md into it today.
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  # engine-record (PRD-HPC-1461 D-80): what the platform engine did in THIS run, written into the app's
  # pipeline-images in gitops (ArgoCD syncs it to {app}-pipeline-images). A run whose engine check,
  # render, enhance or compose-image build failed records `engine-last-error` (one line, at most 200
  # characters, taken from the failed pod's log) and `engine-attempt` (<engine version>@<epoch>, the
  # attempt ml-ci-reconcile's one-attempt-per-hour guard reads). A run that Succeeded and rendered,
  # enhanced or built the compose image clears both. Any other run leaves them as they are. The operator reads
  # engine-last-error to show state `failed`. Reporting only: the caller continues on failure.
  #
  # OLD APP (PRD novelcore/kaos#1911 AC-01, T-05): a run that was refused because the app was made
  # before the current pipelines left /workspace/old-app (kubecore-ci-workflows.oldApp). For
  # that run this step also (1) replaces the commit status with one that says so,
  # (2) records `engine-last-error` = "<old-app sentence> <reason>", and (3) records
  # `engine-attempt` as <engine version>@<epoch>@<commit>@<kaos-lib>, which ml-ci-reconcile reads as "do
  # not build this commit again with this engine and this kaos-lib": trying again cannot help, the app
  # must change. Nothing else is recorded: no engine-version, no last-built-sha, no image.
  - name: engine-record
{{ include "kubecore-ci-workflows.preemptionRetry" . | indent 4 }}
    container:
      image: {{ .Values.tooling.toolboxImage | default "alpine/k8s:1.36.4" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
{{ include "kubecore-ci-workflows.gitAuth" . | indent 8 }}
        ORG="{{ .Values.github.org }}"
        GITOPS_REPO="{{`{{workflow.parameters.gitops_repository}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        WF="{{`{{workflow.name}}`}}"; NS="{{`{{workflow.namespace}}`}}"
        PHASE="{{`{{workflow.status}}`}}"
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"

        # OLD APP: what the refused step left (one line, the reason: data, bounded and stripped again here).
        REFUSED=""
        if [ "${PHASE}" != Succeeded ] && [ -s /workspace/old-app ]; then
          REFUSED=$(head -1 /workspace/old-app | tr -d '\000-\037\177' | cut -c1-600)
          OLD_APP="{{ include "kubecore-ci-workflows.oldAppStatus" . }}"
        fi
        if [ -n "${OLD_APP:-}" ]; then
          echo "engine-record: the app was made before the current pipelines: ${REFUSED}"
          # The commit status the app's engineer reads: what happened and what to do, with the engine's
          # reason where it fits GitHub's 140 characters. It replaces the generic failure status posted
          # just before this step and links the run report, as that one does.
          OWNER_REPO=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed 's|https://github.com/||; s|\.git$||')
          API="https://api.github.com/repos/${OWNER_REPO}"
          AUTH="Authorization: token ${TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          ARGO_BASE="{{ .Values.argo.uiBaseUrl }}"
          RUN_URL=""
          if [ -n "${ARGO_BASE}" ]; then
            RUN_URL="${ARGO_BASE}/workflows/{{`{{workflow.namespace}}`}}/{{`{{workflow.name}}`}}?uid={{`{{workflow.uid}}`}}"
          fi
          DESC="${OLD_APP}"
          [ -z "${REFUSED}" ] || [ $(( ${#OLD_APP} + 1 + ${#REFUSED} )) -gt 140 ] || DESC="${OLD_APP} ${REFUSED}"
{{ include "kubecore-ci-workflows.ghApi" . | indent 10 }}
          PAYLOAD=$(jq -nc --arg d "${DESC}" --arg u "${RUN_URL}" \
            '{state: "failure", description: ($d | .[0:140]), context: "kubecore-ml-ci"} + (if $u == "" then {} else {target_url: $u} end)')
          if gh_api POST "${API}/statuses/${SHA}" "${PAYLOAD}"; then
            echo "engine-record: posted commit status kubecore-ml-ci=failure (old app) on ${OWNER_REPO}@${SHA}"
          else
            echo "engine-record: WARN the old-app commit status was not posted (HTTP ${GH_CODE}); the report comment still says what to change" >&2
          fi
        fi

        # The engine stages, by the pod's node name: detect-steps (its engine check; ml-ci-build runs it
        # first as step probe-detect, then again inside the run), hera-render, hera-enhance-commit and the
        # compose-and-validate image build. These steps retry a lost pod, so Argo names each attempt's
        # pod `<node>(N)` (`...hera-render(0)`, `(1)`) under a Retry node: the patterns accept that
        # suffix (kubecore-operator issue 1832).
        kubectl get pods -n "${NS}" -l "workflows.argoproj.io/workflow=${WF}" -o json > /tmp/pods.json 2>/dev/null || echo '{"items":[]}' > /tmp/pods.json
        STAGES='[
          {"stage":"engine check","re":"[.](probe-detect|detect-steps)([(][0-9]+[)])?$"},
          {"stage":"render","re":"[.]hera-render([(][0-9]+[)])?$"},
          {"stage":"enhance","re":"[.]hera-enhance-commit([(][0-9]+[)])?$"},
          {"stage":"compose image build","re":"build-push[(].*compose-and-validate"}]'
        # "<stage>|<pod>|<exit code>" per engine step that ran, in start order. Only the LAST attempt of
        # each step counts (the node name without its retry suffix, the highest N): an attempt that was
        # lost and retried to success is not an error, and a step whose last attempt failed is.
        jq -r --argjson stages "$STAGES" '
          [.items[] | . as $p | ($p.metadata.annotations["workflows.argoproj.io/node-name"] // "") as $n
           | ($stages[] | . as $s | select($n | test($s.re)) | .stage) as $stage
           | {stage: $stage, node: ($n | sub("[(][0-9]+[)]$"; "")), pod: $p.metadata.name, start: $p.status.startTime,
              retry: ([$n | capture("[(](?<n>[0-9]+)[)]$") | .n | tonumber] | first // -1),
              exit: ((($p.status.containerStatuses // []) | map(select(.name=="main")) | .[0].state.terminated.exitCode) // "")}]
          | group_by(.node) | map(sort_by(.retry, .start) | last)
          | sort_by(.start) | .[] | "\(.stage)|\(.pod)|\(.exit)"' /tmp/pods.json > /tmp/engine-pods

        ERROR=""
        ESC=$(printf '\033')
        while IFS='|' read -r STAGE POD CODE; do
          [ -n "${CODE}" ] && [ "${CODE}" != 0 ] || continue
          # Lines that say only that the step failed are dropped, or the error grep below picks them over
          # the step's real error (kubecore-operator issue 1864): Argo's executor closes a failed step's log
          # with `Error: exit status 1` (and `... argo=true ...`).
          kubectl logs -n "${NS}" "${POD}" -c main --tail=200 2>/dev/null | sed "s/${ESC}\[[0-9;]*m//g" \
            | grep -vE '^Error: exit status [0-9]+$|argo=true' > /tmp/log.txt || true
          if [ "${STAGE}" = "engine check" ]; then
            LINE=$(grep 'engine: FATAL' /tmp/log.txt | tail -1)
            [ -n "${LINE}" ] || continue
          else
            # The last error-looking line, or an engine refusal (`kaos-engine: <reason>`, printed without a
            # traceback; not its `kaos-engine: version=` and `extra-dep` lines); kaniko's closing line only when there
            # is nothing else. A Python traceback's last line (`pkg.mod.SomeError: what`) loses its module path
            # so the 200 characters carry the message.
            ERR_RE='fatal|error|exception|mismatch|failed|denied|cannot|unable|^kaos-engine: '
            LINE=$(grep -vE '^kaos-engine: (version=|extra-dep )|^error building image: ' /tmp/log.txt | grep -iE "${ERR_RE}" | tail -1)
            [ -n "${LINE}" ] || LINE=$(grep -iE "${ERR_RE}" /tmp/log.txt | tail -1)
            [ -n "${LINE}" ] || LINE=$(grep . /tmp/log.txt | tail -1)
            LINE=$(printf '%s' "${LINE}" | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*[.])+([A-Za-z_][A-Za-z0-9_]*(Error|Exception): )/\2/')
          fi
          ERROR=$(printf '%s: %s' "${STAGE}" "${LINE}" | tr -d '\000-\037\177' | cut -c1-200)
          break
        done < /tmp/engine-pods
        OK=$(awk -F'|' '$1 != "engine check" && $3 == "0" {n++} END {print n + 0}' /tmp/engine-pods)

        # A run that Succeeded has no engine error (belt and braces next to the last-attempt rule).
        [ "${PHASE}" = Succeeded ] && ERROR=""
        if [ -n "${OLD_APP:-}" ]; then
          ERROR=$(printf '%s %s' "${OLD_APP}" "${REFUSED}" | sed 's/ *$//' | cut -c1-200)
        fi
        if [ -z "${ERROR}" ] && [ "${PHASE}" != Succeeded ]; then
          echo "engine-record: the run ended ${PHASE} outside the engine stages — nothing to record"
          exit 0
        fi
        if [ -z "${ERROR}" ] && [ "${OK}" = 0 ]; then
          echo "engine-record: no engine stage ran — leaving the record as it is"
          exit 0
        fi

        git config --global user.name "KubeCore CI"
        git config --global user.email "ci@kubecore.io"
        git clone --depth=1 --branch "${GITOPS_BRANCH}" "https://github.com/${ORG}/${GITOPS_REPO}.git" /tmp/gitops
        git_assert_no_token /tmp/gitops
        cd /tmp/gitops
        IMAGES_PATH=$(find . -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-images.yaml" | head -1)
        CONTEXT_PATH=$(find . -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-context.yaml" | head -1)
        [ -n "${IMAGES_PATH}" ] && [ -f "${IMAGES_PATH}" ] || { echo "engine-record: pipeline-images.yaml not found — nothing to record"; exit 0; }
{{ include "kubecore-ci-workflows.engineScript" . | indent 8 }}
        if [ -n "${ERROR}" ]; then
          ATTEMPT=$(python3 -I /tmp/engine.py attempt --context "${CONTEXT_PATH:-/dev/null}" ${OLD_APP:+--refused-commit "${SHA}"})
          ENGINE_ERROR="${ERROR}" ENGINE_ATTEMPT="${ATTEMPT}" \
            yq e -i '.data."engine-last-error" = strenv(ENGINE_ERROR) | .data."engine-attempt" = strenv(ENGINE_ATTEMPT)' "${IMAGES_PATH}"
          echo "engine-record: ${ERROR}"
          MESSAGE="record the engine error"
        else
          yq e -i 'del(.data."engine-last-error") | del(.data."engine-attempt")' "${IMAGES_PATH}"
          echo "engine-record: the engine rendered/built successfully — clearing engine-last-error"
          MESSAGE="clear the engine error"
        fi
        git add "${IMAGES_PATH}"
        if git diff --cached --quiet; then
          echo "engine-record: already recorded"
          exit 0
        fi
        git commit -m "ml-ci(${APP_NAME}): ${MESSAGE}"
        pushed=""
        for attempt in 1 2 3 4 5; do
          if git push 2>&1; then pushed=yes; break; fi
          echo "engine-record: push rejected (attempt ${attempt}) — rebasing onto the latest ${GITOPS_BRANCH}"
          sleep $((attempt * 3))
          git pull --rebase origin "${GITOPS_BRANCH}" || { echo "engine-record: rebase failed"; break; }
        done
        [ -n "$pushed" ] || { echo "engine-record: could not push after 5 attempts"; exit 1; }
      volumeMounts:
      # Read-only: /workspace/old-app, left by the step that refused the app.
      - name: workspace
        mountPath: /workspace
        readOnly: true
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: exit-handler
    steps:
    - - name: post-failure-status
        # Reporting only: a GitHub write that fails after its retries is a red
        # node here, never a failed (or stopped) build.
        continueOn:
          failed: true
        template: status
        arguments:
          parameters:
          - name: state
            value: "failure"
          - name: description
            value: "ML build failed — open the Argo run for the error"
        # != Succeeded: an Error (executor/infra) must surface on GitHub too,
        # not only a Failed step — a silent pending is the #459 failure mode.
        when: "{{`{{workflow.status}}`}} != Succeeded"
    # After the failure status, never beside it: for an app that has not moved to the step contract
    # engine-record posts the commit status that says so, and that one must be the last.
    - - name: engine-record
        template: engine-record
        continueOn:
          failed: true
    - - name: run-report
        template: report
        arguments:
          parameters:
          - name: pipeline
            value: "ML build"
          - name: context
            value: "kubecore-ml-ci"
          - name: environment
            value: "auto"
          - name: pr_number
            value: "{{`{{workflow.parameters.pr_number}}`}}"
