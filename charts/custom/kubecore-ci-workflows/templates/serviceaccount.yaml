{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubecore-ci-workflows.serviceAccountName" . }}
  namespace: {{ include "kubecore-ci-workflows.namespace" . }}
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.gcp.esoServiceAccountEmail }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.gcp.esoServiceAccountEmail }}
    # GKE Workload Identity: impersonate the org eso-sa for GCP API calls
    # (live-compute ephemeral nodegroups). See values.yaml gcp.esoServiceAccountEmail.
    iam.gke.io/gcp-service-account: {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}
