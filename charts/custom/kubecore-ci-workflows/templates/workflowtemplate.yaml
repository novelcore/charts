apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ci-build
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "kubecore-ci-workflows.serviceAccountName" . }}
  entrypoint: ci-build
  onExit: exit-handler
  ttlStrategy:
    secondsAfterSuccess: {{ int .Values.workflow.ttlStrategy.secondsAfterSuccess }}
    secondsAfterFailure: {{ int .Values.workflow.ttlStrategy.secondsAfterFailure }}
  # One build per app at a time (kubecore-operator#1126): the project's CI
  # pool is small (default 1 node) and consecutive pushes otherwise spawn
  # concurrent builds of the same app that starve each other's build-push
  # pods. Argo queues the later run until the earlier one completes.
  synchronization:
    mutexes:
    - name: "{{`{{workflow.parameters.app_name}}`}}-build"
  podGC:
    strategy: {{ .Values.workflow.podGC.strategy }}
  # Workflow-level nodeSelector now follows the same per-submission CI pool
  # as the build-push template's override below (PRD-962 F-09 stage 2:
  # service CI moves off the shared kubecorecpu pool for every step, not
  # just build-push). node_class's Helm-render-time default is unchanged, so
  # a submission that omits it still resolves to today's fixed
  # kubecorecpu selector — this is a behavior-preserving parameterization,
  # not a scheduling change, until callers start passing node_class.
  #
  # kubecore-operator#1067: nodegroup-type alone is not project-scoping — the
  # synthesised CI environment is named the literal string "ci" on EVERY
  # project, so every project's CI pool carries the identical
  # nodegroup-type=ci label and any of them satisfies this selector. Adding
  # platform.kubecore.io/project (a label the node already carries, unique
  # per project) closes that: a step can now only land on its OWN project's
  # CI pool. project_name is a required workflow parameter on every service
  # CI template (no fallback), so this key is never emitted empty.
  nodeSelector:
    platform.kubecore.io/nodegroup-type: "{{`{{workflow.parameters.node_class}}`}}"
    platform.kubecore.io/project: "{{`{{workflow.parameters.project_name}}`}}"
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.workspace.size | default "5Gi" }}
      {{- with .Values.workspace.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
  volumes:
  - name: github-token
    secret:
      secretName: {{ .Values.github.tokenSecretName }}
  - name: registry-auth
    secret:
      secretName: ci-registry-auth
      # Zot-only. A GAR-backed project authenticates keylessly through GKE
      # Workload Identity and never creates this Secret, and the build-push
      # script's `registry_type = gar` branch never reads the mount. Without
      # `optional` the kubelet still refuses to start the pod, so every
      # GAR project's build hung in Init:0/1 forever with
      #   FailedMount ... secret "ci-registry-auth" not found
      # (kubecore-operator#1057 investigation, 2026-09-10). The Zot path is
      # unchanged: the Secret exists there and mounts exactly as before,
      # and the else-branch below fails loudly if it is genuinely absent.
      optional: true
  arguments:
    parameters:
    - name: repo_url
    - name: commit_sha
    - name: branch
    - name: target_branch
      value: "dev"
    - name: branch_type
      value: "feature"
    - name: app_name
    - name: project_name
    - name: pr_merged
      value: "false"
    - name: event_type
      value: "push"
    - name: dockerfile_path
      value: "./Dockerfile"
    - name: build_context
      value: "."
    # PRD-994 CI registry threading. Both default to today's behaviour so any
    # submitter that sets neither is byte-identical to chart 0.12.51:
    # image_repo empty falls back to the .Values.registry.* construction, and
    # registry_type zot keeps the htpasswd/API-key auth path.
    - name: image_repo
      value: ""
    # Pull-side image path, matching the base Deployment's image name. The
    # kustomize image key must equal that name exactly or the entry is inert
    # and nothing deploys. Empty falls back to the older behaviour.
    - name: deploy_image_repo
      value: ""
    - name: registry_type
      value: "zot"
    # Per-submission CI node pool (PRD-962 F-09). Optional: a submitter that
    # omits it gets the operator-resolved default below, which itself falls
    # back to today's single workflow-level nodeSelector so behavior is
    # unchanged until callers start passing this parameter.
    - name: node_class
      value: {{ .Values.ci.defaultNodeClass | default (dig "platform.kubecore.io/nodegroup-type" "kubecorecpu" .Values.nodeSelector) | quote }}
    # pull request number when the run came from a PR ("" otherwise): the
    # run report is then a PR comment instead of a commit comment.
    - name: pr_number
      value: ""
  templates:
  - name: ci-build
    steps:
    # Report pending (with the Argo run URL) BEFORE any work: a merge or PR
    # that is building shows a yellow kubecore-ci check on GitHub at once,
    # and a cluster-side stall is a visible stuck-pending check + in_progress
    # ci Deployment instead of silence (#1126 — full GitHub reporting on
    # every pipeline; the platform runs no GitHub Actions).
    - - name: status-pending
        template: status
        arguments:
          parameters:
          - name: state
            value: "pending"
          - name: description
            value: "Building in Argo Workflows"
    - - name: clone
        template: clone
    - - name: version
        template: version
    - - name: build-push
        template: build-push
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
    - - name: tag
        template: tag
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
        when: "{{`{{workflow.parameters.branch_type}}`}} != chore && {{`{{workflow.parameters.branch_type}}`}} != rc"
    - - name: status
        template: status
        arguments:
          parameters:
          - name: state
            value: "success"
          - name: description
            value: "Build succeeded"
    - - name: gitops-notify
        template: gitops-notify
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
        when: "{{`{{workflow.parameters.pr_merged}}`}} == true && {{`{{workflow.parameters.branch_type}}`}} != chore && {{`{{workflow.parameters.branch_type}}`}} != rc"

  - name: clone
    # A hung or infra-killed step used to wedge the whole run forever: these
    # templates had neither a retry nor a deadline, so a pod stuck in Init or
    # lost to a spot preemption simply never ended. activeDeadlineSeconds kills
    # it, retryStrategy re-runs it. limit 2 = 3 attempts total.
    # retryPolicy=OnError (not OnFailure) so a legitimate build failure — a
    # Dockerfile syntax error, a failing test — is NOT retried. Mirrors the
    # pattern already proven in clusterworkflowtemplate-ml.yaml.
    retryStrategy:
      limit: "2"
      retryPolicy: OnError
      backoff:
        duration: "30s"
        factor: "2"
        maxDuration: "5m"
    activeDeadlineSeconds: 600
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        # Strip refs/heads/ prefix if present (push events send full ref, PR events send branch name)
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')
        git clone --depth=50 --branch "${BRANCH}" "${REPO_URL}" /workspace/repo
        cd /workspace/repo
        git checkout "{{`{{workflow.parameters.commit_sha}}`}}"
        echo "Cloned at $(git rev-parse HEAD)"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: version
    # A hung or infra-killed step used to wedge the whole run forever: these
    # templates had neither a retry nor a deadline, so a pod stuck in Init or
    # lost to a spot preemption simply never ended. activeDeadlineSeconds kills
    # it, retryStrategy re-runs it. limit 2 = 3 attempts total.
    # retryPolicy=OnError (not OnFailure) so a legitimate build failure — a
    # Dockerfile syntax error, a failing test — is NOT retried. Mirrors the
    # pattern already proven in clusterworkflowtemplate-ml.yaml.
    retryStrategy:
      limit: "2"
      retryPolicy: OnError
      backoff:
        duration: "30s"
        factor: "2"
        maxDuration: "5m"
    activeDeadlineSeconds: 600
    outputs:
      parameters:
      - name: new_version
        valueFrom:
          path: /tmp/new_version
      - name: image_tag
        valueFrom:
          path: /tmp/image_tag
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        cd /workspace/repo
        git fetch --tags --force

        BRANCH_TYPE="{{`{{workflow.parameters.branch_type}}`}}"

        # Get latest dev tag version
        DEV_TAGS=$(git tag -l "dev-v*" | sort -V)
        if [ -z "$DEV_TAGS" ]; then
          REGULAR_TAGS=$(git tag -l "v*" | grep -v "dev-" | sort -V)
          if [ -n "$REGULAR_TAGS" ]; then
            LATEST_TAG=$(echo "$REGULAR_TAGS" | tail -n 1)
          else
            LATEST_TAG="v0.0.0"
          fi
        else
          LATEST_DEV_TAG=$(echo "$DEV_TAGS" | tail -n 1)
          LATEST_TAG="v$(echo "$LATEST_DEV_TAG" | sed -E 's/dev-v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
        fi

        VERSION=${LATEST_TAG#v}
        MAJOR=$(echo $VERSION | cut -d. -f1)
        MINOR=$(echo $VERSION | cut -d. -f2)
        PATCH=$(echo $VERSION | cut -d. -f3)
        [ -z "$MAJOR" ] && MAJOR=0
        [ -z "$MINOR" ] && MINOR=0
        [ -z "$PATCH" ] && PATCH=0

        case "$BRANCH_TYPE" in
          feature)     NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
          breaking)    NEW_VERSION="$((MAJOR + 1)).0.0" ;;
          bug|bugfix|maintenance) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          chore|rc)    NEW_VERSION="$MAJOR.$MINOR.$PATCH" ;;
          *)           NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
        esac

        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        SHORT_SHA=$(echo "{{`{{workflow.parameters.commit_sha}}`}}" | head -c 7)
        IMAGE_TAG="dev-v${NEW_VERSION}-${TIMESTAMP}-${SHORT_SHA}"

        echo -n "$NEW_VERSION" > /tmp/new_version
        echo -n "$IMAGE_TAG" > /tmp/image_tag
        echo "Version: $NEW_VERSION, Tag: $IMAGE_TAG"
      volumeMounts:
      - name: workspace
        mountPath: /workspace

  # build-push runs KANIKO, not rootless BuildKit.
  #
  # This step used to run moby/buildkit:*-rootless as UID 1000. It could
  # never build on this platform: rootlesskit needs to create a mount
  # namespace and the pod carries no seccomp/AppArmor relaxation, so every
  # run died before reaching the registry with:
  #   [rootlesskit:child ] error: failed to share mount point: /: permission denied
  #   could not connect to unix:///run/user/1000/buildkit/buildkitd.sock
  #
  # ml-ci-build hit exactly this and was reverted to kaniko in "revert ML
  # build-push to kaniko (0.11.4) — daemonless is broken on this platform".
  # That revert was never applied to the service-app path, which is why
  # values.yaml already claims "build-push runs kaniko, not BuildKit" while
  # this template still referenced .Values.buildkit.image. Verified live:
  # a real push to a service KubeApp dispatched correctly (webhook 200,
  # workflow created, correctly scoped) and then failed here, producing no
  # artifact. Nothing else in the CI path was at fault.
  #
  # No securityContext: kaniko runs as root by design and needs no userns
  # gymnastics — that is the whole reason it works where BuildKit does not.
  # Registry auth goes to /kaniko/.docker/config.json (kaniko's DOCKER_CONFIG
  # default) on an emptyDir, mirroring ml-ci-build.
  #
  # No layer cache here, matching the previous BuildKit invocation, which
  # passed no cache flags either — this is a correctness fix, not a
  # performance change. Adding --cache/--cache-repo is a separate decision;
  # note ml-ci-build had to use a TOP-LEVEL {app}-buildcache repo because a
  # nested cache path silently failed to persist in Zot.
  - name: build-push
    # A hung or infra-killed step used to wedge the whole run forever: these
    # templates had neither a retry nor a deadline, so a pod stuck in Init or
    # lost to a spot preemption simply never ended. activeDeadlineSeconds kills
    # it, retryStrategy re-runs it. limit 2 = 3 attempts total.
    # retryPolicy=OnError (not OnFailure) so a legitimate build failure — a
    # Dockerfile syntax error, a failing test — is NOT retried. Mirrors the
    # pattern already proven in clusterworkflowtemplate-ml.yaml.
    retryStrategy:
      limit: "2"
      retryPolicy: OnError
      backoff:
        duration: "30s"
        factor: "2"
        maxDuration: "5m"
    activeDeadlineSeconds: 1800
    inputs:
      parameters:
      - name: image_tag
      - name: new_version
    # Template-level nodeSelector overrides the workflow-level one above so
    # this build lands on the per-submission CI pool (PRD-962 F-09) instead
    # of the shared cluster default. Tolerations are intentionally left to
    # the workflow-level fallback (.Values.tolerations) — the CI node group
    # carries the same taint key/value these already tolerate.
    #
    # kubecore-operator#1067: a template-level nodeSelector REPLACES the
    # workflow-level one in Argo rather than merging with it, so the
    # project key must be repeated here too — this is the step that
    # actually runs the build and is the one that matters most.
    nodeSelector:
      platform.kubecore.io/nodegroup-type: "{{`{{workflow.parameters.node_class}}`}}"
      platform.kubecore.io/project: "{{`{{workflow.parameters.project_name}}`}}"
    volumes:
    - name: kaniko-config
      emptyDir: {}
    container:
      image: {{ .Values.kaniko.image | default "gcr.io/kaniko-project/executor:v1.23.2-debug" }}
      command: ["/busybox/sh", "-c"]
      args:
      - |
        set -e
        REGISTRY="{{ .Values.registry.internalUrl }}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        PROJECT="{{`{{workflow.parameters.project_name}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        IMAGE_REPO="{{`{{workflow.parameters.image_repo}}`}}"
        REGISTRY_TYPE="{{`{{workflow.parameters.registry_type}}`}}"
        DOCKERFILE_PATH="{{`{{workflow.parameters.dockerfile_path}}`}}"
        BUILD_CONTEXT="{{`{{workflow.parameters.build_context}}`}}"

        # image_repo is the registry-kind-aware path resolved by the operator.
        # Empty means a submitter predating PRD-994 CI threading — fall back
        # to the Zot layout this template has always assumed.
        if [ -z "${IMAGE_REPO}" ]; then
          IMAGE_REPO="${REGISTRY}/${PROJECT}/${APP_NAME}"
        fi
        FULL_IMAGE="${IMAGE_REPO}:${IMAGE_TAG}"

        TLS_FLAGS="--insecure --skip-tls-verify"
        if [ "${REGISTRY_TYPE}" = "gar" ]; then
          # GAR authenticates through GKE Workload Identity: kaniko reads
          # credentials from the metadata server via this pod's ci-build-sa,
          # which the k8sapp composition annotates with
          # iam.gke.io/gcp-service-account. No docker config, and GAR is
          # TLS — both flags would be wrong.
          TLS_FLAGS=""
        else
          # Registry auth for kaniko. Uses the base64 "auth" form rather than
          # username/password so a password containing shell-special or JSON
          # characters cannot corrupt the file (the API key is opaque).
          # `optional: true` on the volume means a missing Secret now yields an
          # empty dir instead of blocking pod start. For Zot that is a real
          # misconfiguration, so fail here — in-step, where the exit handler
          # reports kubecore-ci=failure — rather than dying later on a
          # confusing `cat: no such file`.
          if [ ! -f /etc/registry-auth/username ]; then
            echo "FATAL: registry_type=${REGISTRY_TYPE} requires the ci-registry-auth Secret, which is not mounted" >&2
            exit 1
          fi
          REG_USER=$(cat /etc/registry-auth/username)
          REG_PASS=$(cat /etc/registry-auth/password)
          AUTH=$(printf '%s:%s' "${REG_USER}" "${REG_PASS}" | base64 | tr -d '\n')
          mkdir -p /kaniko/.docker
          cat > /kaniko/.docker/config.json <<EOF
        {"auths":{"${REGISTRY}":{"auth":"${AUTH}"}}}
        EOF
        fi

        # Kaniko wants absolute context/dockerfile paths. The clone step
        # populated /workspace/repo on the shared workspace volume.
        /kaniko/executor \
          --context="dir:///workspace/repo/${BUILD_CONTEXT}" \
          --dockerfile="/workspace/repo/${DOCKERFILE_PATH}" \
          --destination="${FULL_IMAGE}" \
          --build-arg="REGISTRY_URL=${REGISTRY}" \
          --build-arg="VERSION=${IMAGE_TAG}" \
          ${TLS_FLAGS} \
          --cleanup

        echo "Pushed: ${FULL_IMAGE}"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: registry-auth
        mountPath: /etc/registry-auth
        readOnly: true
      - name: kaniko-config
        mountPath: /kaniko/.docker

  - name: tag
    # A hung or infra-killed step used to wedge the whole run forever: these
    # templates had neither a retry nor a deadline, so a pod stuck in Init or
    # lost to a spot preemption simply never ended. activeDeadlineSeconds kills
    # it, retryStrategy re-runs it. limit 2 = 3 attempts total.
    # retryPolicy=OnError (not OnFailure) so a legitimate build failure — a
    # Dockerfile syntax error, a failing test — is NOT retried. Mirrors the
    # pattern already proven in clusterworkflowtemplate-ml.yaml.
    retryStrategy:
      limit: "2"
      retryPolicy: OnError
      backoff:
        duration: "30s"
        factor: "2"
        maxDuration: "5m"
    activeDeadlineSeconds: 600
    inputs:
      parameters:
      - name: image_tag
      - name: new_version
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        cd /workspace/repo
        TOKEN=$(cat /etc/github-token/token)
        NEW_VERSION="{{`{{inputs.parameters.new_version}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        # Extract timestamp from image_tag: dev-v1.2.0-20260326-143022-abc1234 -> 20260326-143022
        TIMESTAMP=$(echo "$IMAGE_TAG" | sed -E 's/dev-v[0-9]+\.[0-9]+\.[0-9]+-([0-9]+-[0-9]+)-.*/\1/')
        DEV_TAG="dev-v${NEW_VERSION}-${TIMESTAMP}"

        git config user.name "KubeCore CI"
        git config user.email "ci@kubecore.io"

        REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        git remote set-url origin "${REPO_URL}"

        git tag -a "${DEV_TAG}" -m "Dev release v${NEW_VERSION}"
        git push origin "${DEV_TAG}"
        echo "Tagged: ${DEV_TAG}"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: status
    # A hung or infra-killed step used to wedge the whole run forever: these
    # templates had neither a retry nor a deadline, so a pod stuck in Init or
    # lost to a spot preemption simply never ended. activeDeadlineSeconds kills
    # it, retryStrategy re-runs it. limit 2 = 3 attempts total.
    # retryPolicy=OnError (not OnFailure) so a legitimate build failure — a
    # Dockerfile syntax error, a failing test — is NOT retried. Mirrors the
    # pattern already proven in clusterworkflowtemplate-ml.yaml.
    retryStrategy:
      limit: "2"
      retryPolicy: OnError
      backoff:
        duration: "30s"
        factor: "2"
        maxDuration: "5m"
    activeDeadlineSeconds: 600
    # GitHub reporting for the service build (#1126): ONE commit status
    # (context kubecore-ci) with target_url into the Argo UI run, plus a
    # Deployment rollup (environment auto = argo-workflows-<branch|pr>) whose log/environment URL is the
    # same run — on PR builds the check + Deployment land on the PR head SHA.
    # Best-effort against the GitHub API: curl without -f never fails the
    # build over a status write.
    inputs:
      parameters:
      - name: state
      - name: description
      # context = the commit-status check name; environment = the GitHub
      # Deployment environment this pipeline rolls up into ("" = no
      # Deployment, statuses only). Defaults are this pipeline's own; RC
      # variants override both via templateRef.
      - name: context
        value: "kubecore-ci"
      - name: environment
        value: "auto"
    container:
      image: alpine/curl
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO="{{`{{workflow.parameters.repo_url}}`}}"
        OWNER_REPO=$(echo "$REPO" | sed 's|https://github.com/||' | sed 's|.git$||')
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        STATE="{{`{{inputs.parameters.state}}`}}"
        DESC=$(printf '%s' "{{`{{inputs.parameters.description}}`}}" | cut -c1-140)
        CONTEXT="{{`{{inputs.parameters.context}}`}}"
        ENVIRONMENT="{{`{{inputs.parameters.environment}}`}}"
        # environment "auto" → named after what actually ran, so the GitHub
        # Deployments page reads argo-workflows-dev / argo-workflows-pr /
        # argo-workflows-rc instead of an internal pipeline id (#1126):
        #   push to <branch>  → argo-workflows-<branch>
        #   pull request      → argo-workflows-pr
        if [ "${ENVIRONMENT}" = "auto" ]; then
          BR=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||' | tr '/' '-')
          case "{{`{{workflow.parameters.event_type}}`}}" in
            pull_request) ENVIRONMENT="argo-workflows-pr" ;;
            *) ENVIRONMENT="argo-workflows-${BR}" ;;
          esac
        fi
        API="https://api.github.com/repos/${OWNER_REPO}"
        AUTH="Authorization: token ${TOKEN}"
        ACCEPT="Accept: application/vnd.github+json"
        ARGO_BASE="{{ .Values.argo.uiBaseUrl }}"
        RUN_URL=""
        if [ -n "${ARGO_BASE}" ]; then
          RUN_URL="${ARGO_BASE}/workflows/{{`{{workflow.namespace}}`}}/{{`{{workflow.name}}`}}?uid={{`{{workflow.uid}}`}}"
        fi

        # 1) commit status — the check on the commit / PR, linking to the run.
        if [ -n "${RUN_URL}" ]; then
          PAYLOAD="{\"state\":\"${STATE}\",\"description\":\"${DESC}\",\"context\":\"${CONTEXT}\",\"target_url\":\"${RUN_URL}\"}"
        else
          PAYLOAD="{\"state\":\"${STATE}\",\"description\":\"${DESC}\",\"context\":\"${CONTEXT}\"}"
        fi
        curl -s -X POST -H "${AUTH}" -H "${ACCEPT}" "${API}/statuses/${SHA}" -d "${PAYLOAD}" > /dev/null
        echo "Posted commit status ${CONTEXT}=${STATE} on ${OWNER_REPO}@${SHA}"

        # 2) Deployment rollup (environment = this pipeline). Created on pending
        # with required_contexts:[] — THIS run is what the commit statuses
        # describe; defaulting would deadlock the Deployment on its own check.
        # Resolved on success/failure against the Deployment created for this
        # SHA + environment. jq for response parsing (compact vs pretty JSON
        # both occur); if jq cannot be installed the statuses still stand.
        [ -n "${ENVIRONMENT}" ] || exit 0
        apk add --no-cache jq >/dev/null 2>&1 || true
        if ! command -v jq >/dev/null; then
          echo "WARN: jq unavailable — commit status posted, deployment rollup skipped"
          exit 0
        fi
        if [ "${STATE}" = "pending" ]; then
          # Self-heal: a run killed before its exit handler leaves its
          # Deployment in_progress forever. Before creating this run's
          # Deployment, mark every non-terminal one in the same environment
          # inactive (this run supersedes them).
          curl -s -H "${AUTH}" -H "${ACCEPT}" "${API}/deployments?environment=${ENVIRONMENT}&per_page=20" \
            | jq -r 'if type == "array" then .[].id else empty end' 2>/dev/null | while read -r OLD; do
            OLD_STATE=$(curl -s -H "${AUTH}" -H "${ACCEPT}" "${API}/deployments/${OLD}/statuses?per_page=1" | jq -r 'if type == "array" then (.[0].state // "none") else "none" end' 2>/dev/null)
            case "${OLD_STATE}" in pending|in_progress|queued|none)
              curl -s -X POST -H "${AUTH}" -H "${ACCEPT}" "${API}/deployments/${OLD}/statuses" \
                -d "{\"state\":\"inactive\",\"description\":\"superseded by {{`{{workflow.name}}`}}\"}" > /dev/null
              echo "Inactivated stale deployment ${ENVIRONMENT}#${OLD} (${OLD_STATE})";;
            esac
          done
          DEP_ID=$(curl -s -X POST -H "${AUTH}" -H "${ACCEPT}" "${API}/deployments" \
            -d "{\"ref\":\"${SHA}\",\"environment\":\"${ENVIRONMENT}\",\"auto_merge\":false,\"required_contexts\":[],\"transient_environment\":true,\"description\":\"{{`{{workflow.name}}`}}\"}" \
            | jq -r 'if type == "object" then (.id // empty) else empty end' 2>/dev/null || true)
          DEP_STATE="in_progress"
        else
          DEP_ID=$(curl -s -H "${AUTH}" -H "${ACCEPT}" "${API}/deployments?sha=${SHA}&environment=${ENVIRONMENT}&per_page=1" \
            | jq -r 'if type == "array" then (.[0].id // empty) else empty end' 2>/dev/null || true)
          DEP_STATE="${STATE}"
        fi
        if [ -n "${DEP_ID}" ]; then
          if [ -n "${RUN_URL}" ]; then
            DPAYLOAD="{\"state\":\"${DEP_STATE}\",\"log_url\":\"${RUN_URL}\",\"environment_url\":\"${RUN_URL}\",\"description\":\"${DESC}\"}"
          else
            DPAYLOAD="{\"state\":\"${DEP_STATE}\",\"description\":\"${DESC}\"}"
          fi
          curl -s -X POST -H "${AUTH}" -H "${ACCEPT}" "${API}/deployments/${DEP_ID}/statuses" -d "${DPAYLOAD}" > /dev/null
          echo "Posted deployment ${ENVIRONMENT}#${DEP_ID} status: ${DEP_STATE}"
        else
          echo "WARN: no ${ENVIRONMENT} Deployment resolved for ${SHA} — skipped deployment status"
        fi
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: gitops-notify
    # A hung or infra-killed step used to wedge the whole run forever: these
    # templates had neither a retry nor a deadline, so a pod stuck in Init or
    # lost to a spot preemption simply never ended. activeDeadlineSeconds kills
    # it, retryStrategy re-runs it. limit 2 = 3 attempts total.
    # retryPolicy=OnError (not OnFailure) so a legitimate build failure — a
    # Dockerfile syntax error, a failing test — is NOT retried. Mirrors the
    # pattern already proven in clusterworkflowtemplate-ml.yaml.
    retryStrategy:
      limit: "2"
      retryPolicy: OnError
      backoff:
        duration: "30s"
        factor: "2"
        maxDuration: "5m"
    activeDeadlineSeconds: 600
    inputs:
      parameters:
      - name: image_tag
      - name: new_version
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        ORG="{{ .Values.github.org }}"
        PROJECT="{{`{{workflow.parameters.project_name}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        REGISTRY="{{ .Values.registry.externalUrl }}"
        IMAGE_REPO="{{`{{workflow.parameters.image_repo}}`}}"
        DEPLOY_IMAGE_REPO="{{`{{workflow.parameters.deploy_image_repo}}`}}"
        if [ -n "${DEPLOY_IMAGE_REPO}" ]; then
          FULL_IMAGE="${DEPLOY_IMAGE_REPO}"
        elif [ -n "${IMAGE_REPO}" ]; then
          FULL_IMAGE="${IMAGE_REPO}"
        else
          FULL_IMAGE="${REGISTRY}/${PROJECT}/${APP_NAME}"
        fi
        OPS_REPO="${ORG}/${PROJECT}"
        APP_DIR="kubeapps/${PROJECT}-${APP_NAME}"

        # Clone ops repo
        REPO_URL="https://x-access-token:${TOKEN}@github.com/${OPS_REPO}.git"
        git clone --depth=1 "${REPO_URL}" /tmp/ops-repo
        cd /tmp/ops-repo

        # Install kustomize (direct binary download — alpine sh doesn't support the bash install script)
        KUSTOMIZE_VERSION="v5.6.0"
        wget -q "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -O /tmp/kustomize.tar.gz
        tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin/
        chmod +x /usr/local/bin/kustomize

        if [ ! -d "${APP_DIR}" ]; then
          echo "app dir ${APP_DIR} not found in ${OPS_REPO}"; exit 1
        fi

        # k8sapp composition names an overlay "{type}" when the env name IS the type,
        # else "{type}-{envName}" — match both tokens to cover a plain "dev" overlay
        UPDATED=0
        for OVERLAY_DIR in ${APP_DIR}/overlays/dev ${APP_DIR}/overlays/dev-*; do
          if [ -d "$OVERLAY_DIR" ]; then
            echo "Updating $OVERLAY_DIR"
            cd "$OVERLAY_DIR"
            kustomize edit set image "${FULL_IMAGE}=${FULL_IMAGE}:${IMAGE_TAG}"
            cd /tmp/ops-repo
            UPDATED=$((UPDATED + 1))
          fi
        done

        if [ $UPDATED -eq 0 ]; then echo "No dev overlays found under ${APP_DIR}"; exit 0; fi

        # Commit and push
        git config user.name "KubeCore CI"
        git config user.email "ci@kubecore.io"
        git add .
        if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
        git commit -m "ci: update ${APP_NAME} image to ${IMAGE_TAG}"
        git pull --rebase
        git push

        echo "Updated ${UPDATED} overlay(s), pushed to ${OPS_REPO}"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: exit-handler
    steps:
    - - name: post-failure-status
        template: status
        arguments:
          parameters:
          - name: state
            value: "failure"
          - name: description
            value: "Build failed — open the Argo run for the error"
        # != Succeeded: an Error (executor/infra) must surface on GitHub too.
        when: "{{`{{workflow.status}}`}} != Succeeded"
    - - name: run-report
        templateRef:
          name: ml-ci-build
          template: report
          clusterScope: true
        arguments:
          parameters:
          - name: pipeline
            value: "Build"
          - name: context
            value: "kubecore-ci"
          - name: environment
            value: "auto"
          - name: pr_number
            value: "{{`{{workflow.parameters.pr_number}}`}}"
