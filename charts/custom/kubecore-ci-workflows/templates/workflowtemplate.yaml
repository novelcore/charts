apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ci-build
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "kubecore-ci-workflows.serviceAccountName" . }}
  entrypoint: ci-build
  onExit: exit-handler
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.workflow.ttlStrategy.secondsAfterCompletion }}
  podGC:
    strategy: {{ .Values.workflow.podGC.strategy }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.workspace.size | default "5Gi" }}
      {{- with .Values.workspace.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
  volumes:
  - name: github-token
    secret:
      secretName: {{ .Values.github.tokenSecretName }}
  arguments:
    parameters:
    - name: repo_url
    - name: commit_sha
    - name: branch
    - name: target_branch
      value: "dev"
    - name: branch_type
      value: "feature"
    - name: app_name
    - name: project_name
    - name: pr_merged
      value: "false"
    - name: event_type
      value: "push"
  templates:
  - name: ci-build
    steps:
    - - name: clone
        template: clone
    - - name: version
        template: version
    - - name: build-push
        template: build-push
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
    - - name: tag
        template: tag
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
        when: "{{`{{workflow.parameters.branch_type}}`}} != chore && {{`{{workflow.parameters.branch_type}}`}} != rc"
    - - name: status
        template: status
        arguments:
          parameters:
          - name: state
            value: "success"
          - name: description
            value: "Build succeeded"
    - - name: gitops-notify
        template: gitops-notify
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
        when: "{{`{{workflow.parameters.pr_merged}}`}} == true && {{`{{workflow.parameters.branch_type}}`}} != chore && {{`{{workflow.parameters.branch_type}}`}} != rc"

  - name: clone
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        # Strip refs/heads/ prefix if present (push events send full ref, PR events send branch name)
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')
        git clone --depth=50 --branch "${BRANCH}" "${REPO_URL}" /workspace/repo
        cd /workspace/repo
        git checkout "{{`{{workflow.parameters.commit_sha}}`}}"
        echo "Cloned at $(git rev-parse HEAD)"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: version
    outputs:
      parameters:
      - name: new_version
        valueFrom:
          path: /tmp/new_version
      - name: image_tag
        valueFrom:
          path: /tmp/image_tag
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        cd /workspace/repo
        git fetch --tags --force

        BRANCH_TYPE="{{`{{workflow.parameters.branch_type}}`}}"

        # Get latest dev tag version
        DEV_TAGS=$(git tag -l "dev-v*" | sort -V)
        if [ -z "$DEV_TAGS" ]; then
          REGULAR_TAGS=$(git tag -l "v*" | grep -v "dev-" | sort -V)
          if [ -n "$REGULAR_TAGS" ]; then
            LATEST_TAG=$(echo "$REGULAR_TAGS" | tail -n 1)
          else
            LATEST_TAG="v0.0.0"
          fi
        else
          LATEST_DEV_TAG=$(echo "$DEV_TAGS" | tail -n 1)
          LATEST_TAG="v$(echo "$LATEST_DEV_TAG" | sed -E 's/dev-v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
        fi

        VERSION=${LATEST_TAG#v}
        MAJOR=$(echo $VERSION | cut -d. -f1)
        MINOR=$(echo $VERSION | cut -d. -f2)
        PATCH=$(echo $VERSION | cut -d. -f3)
        [ -z "$MAJOR" ] && MAJOR=0
        [ -z "$MINOR" ] && MINOR=0
        [ -z "$PATCH" ] && PATCH=0

        case "$BRANCH_TYPE" in
          feature)     NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
          breaking)    NEW_VERSION="$((MAJOR + 1)).0.0" ;;
          bug|bugfix|maintenance) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          chore|rc)    NEW_VERSION="$MAJOR.$MINOR.$PATCH" ;;
          *)           NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
        esac

        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        SHORT_SHA=$(echo "{{`{{workflow.parameters.commit_sha}}`}}" | head -c 7)
        IMAGE_TAG="dev-v${NEW_VERSION}-${TIMESTAMP}-${SHORT_SHA}"

        echo -n "$NEW_VERSION" > /tmp/new_version
        echo -n "$IMAGE_TAG" > /tmp/image_tag
        echo "Version: $NEW_VERSION, Tag: $IMAGE_TAG"
      volumeMounts:
      - name: workspace
        mountPath: /workspace

  - name: build-push
    inputs:
      parameters:
      - name: image_tag
      - name: new_version
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    container:
      image: {{ .Values.buildkit.image }}
      command: [sh, -c]
      args:
      - |
        set -e
        REGISTRY="{{ .Values.registry.internalUrl }}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        PROJECT="{{`{{workflow.parameters.project_name}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        FULL_IMAGE="${REGISTRY}/${PROJECT}/${APP_NAME}:${IMAGE_TAG}"

        cd /workspace/repo

        buildctl-daemonless.sh build \
          --frontend dockerfile.v0 \
          --local context={{ .Values.buildkit.buildContext }} \
          --local dockerfile=$(dirname {{ .Values.buildkit.dockerfilePath }}) \
          --opt filename=$(basename {{ .Values.buildkit.dockerfilePath }}) \
          --opt build-arg:REGISTRY_URL=${REGISTRY} \
          --opt build-arg:VERSION=${IMAGE_TAG} \
          --output type=image,name=${FULL_IMAGE},push=true,registry.insecure=true

        echo "Pushed: ${FULL_IMAGE}"
      env:
      - name: BUILDKITD_FLAGS
        value: "--oci-worker-no-process-sandbox"
      volumeMounts:
      - name: workspace
        mountPath: /workspace

  - name: tag
    inputs:
      parameters:
      - name: image_tag
      - name: new_version
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        cd /workspace/repo
        TOKEN=$(cat /etc/github-token/token)
        NEW_VERSION="{{`{{inputs.parameters.new_version}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        # Extract timestamp from image_tag: dev-v1.2.0-20260326-143022-abc1234 -> 20260326-143022
        TIMESTAMP=$(echo "$IMAGE_TAG" | sed -E 's/dev-v[0-9]+\.[0-9]+\.[0-9]+-([0-9]+-[0-9]+)-.*/\1/')
        DEV_TAG="dev-v${NEW_VERSION}-${TIMESTAMP}"

        git config user.name "KubeCore CI"
        git config user.email "ci@kubecore.io"

        REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        git remote set-url origin "${REPO_URL}"

        git tag -a "${DEV_TAG}" -m "Dev release v${NEW_VERSION}"
        git push origin "${DEV_TAG}"
        echo "Tagged: ${DEV_TAG}"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: status
    inputs:
      parameters:
      - name: state
      - name: description
    container:
      image: alpine/curl
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO="{{`{{workflow.parameters.repo_url}}`}}"
        # Extract owner/repo from URL
        OWNER_REPO=$(echo "$REPO" | sed 's|https://github.com/||' | sed 's|.git$||')
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        STATE="{{`{{inputs.parameters.state}}`}}"
        DESC="{{`{{inputs.parameters.description}}`}}"

        curl -s -X POST \
          -H "Authorization: token ${TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${OWNER_REPO}/statuses/${SHA}" \
          -d "{\"state\":\"${STATE}\",\"description\":\"${DESC}\",\"context\":\"kubecore-ci\"}"

        echo "Posted status: ${STATE}"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: gitops-notify
    inputs:
      parameters:
      - name: image_tag
      - name: new_version
    container:
      image: alpine/curl
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        ORG="{{ .Values.github.org }}"
        PROJECT="{{`{{workflow.parameters.project_name}}`}}"
        OPS_REPO="${ORG}/${PROJECT}{{ .Values.gitops.projectRepoSuffix }}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        NEW_VERSION="{{`{{inputs.parameters.new_version}}`}}"
        REGISTRY="{{ .Values.registry.internalUrl }}"
        BRANCH_TYPE="{{`{{workflow.parameters.branch_type}}`}}"

        curl -s -X POST \
          -H "Authorization: token ${TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${OPS_REPO}/dispatches" \
          -d "{
            \"event_type\": \"dev-environment-update\",
            \"client_payload\": {
              \"version\": \"${IMAGE_TAG}\",
              \"image\": \"${REGISTRY}/${PROJECT}/${APP_NAME}:${IMAGE_TAG}\",
              \"app_name\": \"${APP_NAME}\",
              \"semantic_version\": \"v${NEW_VERSION}\",
              \"branch_type\": \"${BRANCH_TYPE}\",
              \"plain_image_name\": \"${REGISTRY}/${PROJECT}/${APP_NAME}\"
            }
          }"

        echo "Dispatched dev-environment-update to ${OPS_REPO}"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: exit-handler
    steps:
    - - name: post-failure-status
        template: status
        arguments:
          parameters:
          - name: state
            value: "failure"
          - name: description
            value: "Build failed"
        when: "{{`{{workflow.status}}`}} == Failed"
