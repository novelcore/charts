apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ci-build
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "kubecore-ci-workflows.serviceAccountName" . }}
  entrypoint: ci-build
  onExit: exit-handler
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.workflow.ttlStrategy.secondsAfterCompletion }}
  podGC:
    strategy: {{ .Values.workflow.podGC.strategy }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.workspace.size | default "5Gi" }}
      {{- with .Values.workspace.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
  volumes:
  - name: github-token
    secret:
      secretName: {{ .Values.github.tokenSecretName }}
  - name: registry-auth
    secret:
      secretName: ci-registry-auth
  arguments:
    parameters:
    - name: repo_url
    - name: commit_sha
    - name: branch
    - name: target_branch
      value: "dev"
    - name: branch_type
      value: "feature"
    - name: app_name
    - name: project_name
    - name: pr_merged
      value: "false"
    - name: event_type
      value: "push"
    - name: dockerfile_path
      value: "./Dockerfile"
    - name: build_context
      value: "."
    # PRD-994 CI registry threading. Both default to today's behaviour so any
    # submitter that sets neither is byte-identical to chart 0.12.49:
    # image_repo empty falls back to the .Values.registry.* construction, and
    # registry_type zot keeps the htpasswd/API-key auth path.
    - name: image_repo
      value: ""
    - name: registry_type
      value: "zot"
    # Per-submission CI node pool (PRD-962 F-09). Optional: a submitter that
    # omits it gets the operator-resolved default below, which itself falls
    # back to today's single workflow-level nodeSelector so behavior is
    # unchanged until callers start passing this parameter.
    - name: node_class
      value: {{ .Values.ci.defaultNodeClass | default (dig "platform.kubecore.io/nodegroup-type" "kubecorecpu" .Values.nodeSelector) | quote }}
  templates:
  - name: ci-build
    steps:
    - - name: clone
        template: clone
    - - name: version
        template: version
    - - name: build-push
        template: build-push
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
    - - name: tag
        template: tag
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
        when: "{{`{{workflow.parameters.branch_type}}`}} != chore && {{`{{workflow.parameters.branch_type}}`}} != rc"
    - - name: status
        template: status
        arguments:
          parameters:
          - name: state
            value: "success"
          - name: description
            value: "Build succeeded"
    - - name: gitops-notify
        template: gitops-notify
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{steps.version.outputs.parameters.image_tag}}`}}"
          - name: new_version
            value: "{{`{{steps.version.outputs.parameters.new_version}}`}}"
        when: "{{`{{workflow.parameters.pr_merged}}`}} == true && {{`{{workflow.parameters.branch_type}}`}} != chore && {{`{{workflow.parameters.branch_type}}`}} != rc"

  - name: clone
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        # Strip refs/heads/ prefix if present (push events send full ref, PR events send branch name)
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|^refs/heads/||')
        git clone --depth=50 --branch "${BRANCH}" "${REPO_URL}" /workspace/repo
        cd /workspace/repo
        git checkout "{{`{{workflow.parameters.commit_sha}}`}}"
        echo "Cloned at $(git rev-parse HEAD)"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: version
    outputs:
      parameters:
      - name: new_version
        valueFrom:
          path: /tmp/new_version
      - name: image_tag
        valueFrom:
          path: /tmp/image_tag
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        cd /workspace/repo
        git fetch --tags --force

        BRANCH_TYPE="{{`{{workflow.parameters.branch_type}}`}}"

        # Get latest dev tag version
        DEV_TAGS=$(git tag -l "dev-v*" | sort -V)
        if [ -z "$DEV_TAGS" ]; then
          REGULAR_TAGS=$(git tag -l "v*" | grep -v "dev-" | sort -V)
          if [ -n "$REGULAR_TAGS" ]; then
            LATEST_TAG=$(echo "$REGULAR_TAGS" | tail -n 1)
          else
            LATEST_TAG="v0.0.0"
          fi
        else
          LATEST_DEV_TAG=$(echo "$DEV_TAGS" | tail -n 1)
          LATEST_TAG="v$(echo "$LATEST_DEV_TAG" | sed -E 's/dev-v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
        fi

        VERSION=${LATEST_TAG#v}
        MAJOR=$(echo $VERSION | cut -d. -f1)
        MINOR=$(echo $VERSION | cut -d. -f2)
        PATCH=$(echo $VERSION | cut -d. -f3)
        [ -z "$MAJOR" ] && MAJOR=0
        [ -z "$MINOR" ] && MINOR=0
        [ -z "$PATCH" ] && PATCH=0

        case "$BRANCH_TYPE" in
          feature)     NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
          breaking)    NEW_VERSION="$((MAJOR + 1)).0.0" ;;
          bug|bugfix|maintenance) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          chore|rc)    NEW_VERSION="$MAJOR.$MINOR.$PATCH" ;;
          *)           NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
        esac

        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        SHORT_SHA=$(echo "{{`{{workflow.parameters.commit_sha}}`}}" | head -c 7)
        IMAGE_TAG="dev-v${NEW_VERSION}-${TIMESTAMP}-${SHORT_SHA}"

        echo -n "$NEW_VERSION" > /tmp/new_version
        echo -n "$IMAGE_TAG" > /tmp/image_tag
        echo "Version: $NEW_VERSION, Tag: $IMAGE_TAG"
      volumeMounts:
      - name: workspace
        mountPath: /workspace

  # build-push runs KANIKO, not rootless BuildKit.
  #
  # This step used to run moby/buildkit:*-rootless as UID 1000. It could
  # never build on this platform: rootlesskit needs to create a mount
  # namespace and the pod carries no seccomp/AppArmor relaxation, so every
  # run died before reaching the registry with:
  #   [rootlesskit:child ] error: failed to share mount point: /: permission denied
  #   could not connect to unix:///run/user/1000/buildkit/buildkitd.sock
  #
  # ml-ci-build hit exactly this and was reverted to kaniko in "revert ML
  # build-push to kaniko (0.11.4) — daemonless is broken on this platform".
  # That revert was never applied to the service-app path, which is why
  # values.yaml already claims "build-push runs kaniko, not BuildKit" while
  # this template still referenced .Values.buildkit.image. Verified live:
  # a real push to a service KubeApp dispatched correctly (webhook 200,
  # workflow created, correctly scoped) and then failed here, producing no
  # artifact. Nothing else in the CI path was at fault.
  #
  # No securityContext: kaniko runs as root by design and needs no userns
  # gymnastics — that is the whole reason it works where BuildKit does not.
  # Registry auth goes to /kaniko/.docker/config.json (kaniko's DOCKER_CONFIG
  # default) on an emptyDir, mirroring ml-ci-build.
  #
  # No layer cache here, matching the previous BuildKit invocation, which
  # passed no cache flags either — this is a correctness fix, not a
  # performance change. Adding --cache/--cache-repo is a separate decision;
  # note ml-ci-build had to use a TOP-LEVEL {app}-buildcache repo because a
  # nested cache path silently failed to persist in Zot.
  - name: build-push
    inputs:
      parameters:
      - name: image_tag
      - name: new_version
    # Template-level nodeSelector overrides the workflow-level one above so
    # this build lands on the per-submission CI pool (PRD-962 F-09) instead
    # of the shared cluster default. Tolerations are intentionally left to
    # the workflow-level fallback (.Values.tolerations) — the CI node group
    # carries the same taint key/value these already tolerate.
    nodeSelector:
      platform.kubecore.io/nodegroup-type: "{{`{{workflow.parameters.node_class}}`}}"
    volumes:
    - name: kaniko-config
      emptyDir: {}
    container:
      image: {{ .Values.kaniko.image | default "gcr.io/kaniko-project/executor:v1.23.2-debug" }}
      command: ["/busybox/sh", "-c"]
      args:
      - |
        set -e
        REGISTRY="{{ .Values.registry.internalUrl }}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        PROJECT="{{`{{workflow.parameters.project_name}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        IMAGE_REPO="{{`{{workflow.parameters.image_repo}}`}}"
        REGISTRY_TYPE="{{`{{workflow.parameters.registry_type}}`}}"
        DOCKERFILE_PATH="{{`{{workflow.parameters.dockerfile_path}}`}}"
        BUILD_CONTEXT="{{`{{workflow.parameters.build_context}}`}}"

        # image_repo is the registry-kind-aware path resolved by the operator.
        # Empty means a submitter predating PRD-994 CI threading — fall back
        # to the Zot layout this template has always assumed.
        if [ -z "${IMAGE_REPO}" ]; then
          IMAGE_REPO="${REGISTRY}/${PROJECT}/${APP_NAME}"
        fi
        FULL_IMAGE="${IMAGE_REPO}:${IMAGE_TAG}"

        TLS_FLAGS="--insecure --skip-tls-verify"
        if [ "${REGISTRY_TYPE}" = "gar" ]; then
          # GAR authenticates through GKE Workload Identity: kaniko reads
          # credentials from the metadata server via this pod's ci-build-sa,
          # which the k8sapp composition annotates with
          # iam.gke.io/gcp-service-account. No docker config, and GAR is
          # TLS — both flags would be wrong.
          TLS_FLAGS=""
        else
          # Registry auth for kaniko. Uses the base64 "auth" form rather than
          # username/password so a password containing shell-special or JSON
          # characters cannot corrupt the file (the API key is opaque).
          REG_USER=$(cat /etc/registry-auth/username)
          REG_PASS=$(cat /etc/registry-auth/password)
          AUTH=$(printf '%s:%s' "${REG_USER}" "${REG_PASS}" | base64 | tr -d '\n')
          mkdir -p /kaniko/.docker
          cat > /kaniko/.docker/config.json <<EOF
        {"auths":{"${REGISTRY}":{"auth":"${AUTH}"}}}
        EOF
        fi

        # Kaniko wants absolute context/dockerfile paths. The clone step
        # populated /workspace/repo on the shared workspace volume.
        /kaniko/executor \
          --context="dir:///workspace/repo/${BUILD_CONTEXT}" \
          --dockerfile="/workspace/repo/${DOCKERFILE_PATH}" \
          --destination="${FULL_IMAGE}" \
          --build-arg="REGISTRY_URL=${REGISTRY}" \
          --build-arg="VERSION=${IMAGE_TAG}" \
          ${TLS_FLAGS} \
          --cleanup

        echo "Pushed: ${FULL_IMAGE}"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: registry-auth
        mountPath: /etc/registry-auth
        readOnly: true
      - name: kaniko-config
        mountPath: /kaniko/.docker

  - name: tag
    inputs:
      parameters:
      - name: image_tag
      - name: new_version
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        cd /workspace/repo
        TOKEN=$(cat /etc/github-token/token)
        NEW_VERSION="{{`{{inputs.parameters.new_version}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        # Extract timestamp from image_tag: dev-v1.2.0-20260326-143022-abc1234 -> 20260326-143022
        TIMESTAMP=$(echo "$IMAGE_TAG" | sed -E 's/dev-v[0-9]+\.[0-9]+\.[0-9]+-([0-9]+-[0-9]+)-.*/\1/')
        DEV_TAG="dev-v${NEW_VERSION}-${TIMESTAMP}"

        git config user.name "KubeCore CI"
        git config user.email "ci@kubecore.io"

        REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        git remote set-url origin "${REPO_URL}"

        git tag -a "${DEV_TAG}" -m "Dev release v${NEW_VERSION}"
        git push origin "${DEV_TAG}"
        echo "Tagged: ${DEV_TAG}"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: status
    inputs:
      parameters:
      - name: state
      - name: description
    container:
      image: alpine/curl
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO="{{`{{workflow.parameters.repo_url}}`}}"
        # Extract owner/repo from URL
        OWNER_REPO=$(echo "$REPO" | sed 's|https://github.com/||' | sed 's|.git$||')
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        STATE="{{`{{inputs.parameters.state}}`}}"
        DESC="{{`{{inputs.parameters.description}}`}}"

        curl -s -X POST \
          -H "Authorization: token ${TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${OWNER_REPO}/statuses/${SHA}" \
          -d "{\"state\":\"${STATE}\",\"description\":\"${DESC}\",\"context\":\"kubecore-ci\"}"

        echo "Posted status: ${STATE}"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: gitops-notify
    inputs:
      parameters:
      - name: image_tag
      - name: new_version
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        ORG="{{ .Values.github.org }}"
        PROJECT="{{`{{workflow.parameters.project_name}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        REGISTRY="{{ .Values.registry.externalUrl }}"
        IMAGE_REPO="{{`{{workflow.parameters.image_repo}}`}}"
        if [ -z "${IMAGE_REPO}" ]; then
          IMAGE_REPO="${REGISTRY}/${PROJECT}/${APP_NAME}"
        fi
        FULL_IMAGE="${IMAGE_REPO}"
        OPS_REPO="${ORG}/${PROJECT}"
        APP_DIR="kubeapps/${PROJECT}-${APP_NAME}"

        # Clone ops repo
        REPO_URL="https://x-access-token:${TOKEN}@github.com/${OPS_REPO}.git"
        git clone --depth=1 "${REPO_URL}" /tmp/ops-repo
        cd /tmp/ops-repo

        # Install kustomize (direct binary download — alpine sh doesn't support the bash install script)
        KUSTOMIZE_VERSION="v5.6.0"
        wget -q "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -O /tmp/kustomize.tar.gz
        tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin/
        chmod +x /usr/local/bin/kustomize

        if [ ! -d "${APP_DIR}" ]; then
          echo "app dir ${APP_DIR} not found in ${OPS_REPO}"; exit 1
        fi

        # k8sapp composition names an overlay "{type}" when the env name IS the type,
        # else "{type}-{envName}" — match both tokens to cover a plain "dev" overlay
        UPDATED=0
        for OVERLAY_DIR in ${APP_DIR}/overlays/dev ${APP_DIR}/overlays/dev-*; do
          if [ -d "$OVERLAY_DIR" ]; then
            echo "Updating $OVERLAY_DIR"
            cd "$OVERLAY_DIR"
            kustomize edit set image "${FULL_IMAGE}=${FULL_IMAGE}:${IMAGE_TAG}"
            cd /tmp/ops-repo
            UPDATED=$((UPDATED + 1))
          fi
        done

        if [ $UPDATED -eq 0 ]; then echo "No dev overlays found under ${APP_DIR}"; exit 0; fi

        # Commit and push
        git config user.name "KubeCore CI"
        git config user.email "ci@kubecore.io"
        git add .
        if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
        git commit -m "ci: update ${APP_NAME} image to ${IMAGE_TAG}"
        git pull --rebase
        git push

        echo "Updated ${UPDATED} overlay(s), pushed to ${OPS_REPO}"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: exit-handler
    steps:
    - - name: post-failure-status
        template: status
        arguments:
          parameters:
          - name: state
            value: "failure"
          - name: description
            value: "Build failed"
        when: "{{`{{workflow.status}}`}} == Failed"
