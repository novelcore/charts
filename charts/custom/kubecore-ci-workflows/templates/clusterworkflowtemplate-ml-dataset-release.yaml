{{/*
ml-ci-dataset-release — a dataset changed; re-render the project's ML pipelines
(PRD novelcore/kaos#1283 D-05).

A pipeline's dataset pickers (the form field of every name a step declares in
inputs=; <repo>@<version>, <repo>@latest) are filled from
kaos-lake's catalog by ml-ci-build's hera-enhance-commit, at render time only.
Nothing re-rendered it when a version was released, so a new dataset-x@v2
appeared only after the next commit. kaos-lake now creates ONE Workflow of this
template in the project's CI namespace (as dataset-release-sa, which the
githubproject composition renders with exactly the rights below) when a `vN` tag
of a dataset-* repository is created or deleted, a repository is labelled a
dataset, or a dataset is deleted; a burst of releases is one Workflow.

For each ML app of the project (the {app}-ci-reconciler CronWorkflows that use
ml-ci-reconcile; only this namespace's, so only this project's) it creates a
Workflow from the CronWorkflow's own spec with dataset_event=true. That is the
hourly backstop's check run now, not a new render path: ml-ci-reconcile compares
the datasets the live pipeline was rendered with (dataset-sha) with the catalog
and submits ml-ci-build to re-render on DATASET DRIFT, so an app whose datasets
did not change costs one cheap pod, and an event that is lost is caught by the
next hourly poll.

At most one fan-out runs at a time (this template's own mutex, below).

An app that already has a check waiting gets no second one: a check that has not
reached its decision reads the catalog after this event, so it covers it (see
COALESCE below). Needs `list` on workflows for dataset-release-sa; without it
every app gets its own check, as before.

The per-app Workflow is built from ONLY the CronWorkflow's workflowTemplateRef
and arguments, plus a ttlStrategy (PRD novelcore/kaos#1533 F-26: Strict
templateReferencing refuses a Workflow whose own spec sets serviceAccountName,
volumes or synchronization, so none is copied or added; ml-ci-reconcile owns
its ServiceAccount and token volume). It no longer takes a mutex of its own
({app}-dataset-rerender): ml-ci-reconcile's decide-and-submit holds the
`{app}-build` mutex (the one ml-ci-build holds) for check-drift AND the build
submission, so two runs for one app, from two fan-outs or from a fan-out and
the hourly poll, serialise there and the second sees the build the first
queued. tests/strict-references/run.sh proves both Workflows resolve to that
mutex (OQ-5).
*/}}
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ml-ci-dataset-release
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  serviceAccountName: dataset-release-sa
  entrypoint: fan-out
  {{- include "kubecore-ci-workflows.systemPodSpecPatch" . | nindent 2 }}
  # One fan-out at a time per CI namespace: a second queues behind the first.
  synchronization:
    mutexes:
    - name: dataset-release
  # System pool, like ml-ci-reconcile: it needs kubectl and jq only.
  nodeSelector:
    platform.kubecore.io/system: "true"
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.workflow.ttlStrategy.secondsAfterCompletion }}
  podGC:
    strategy: {{ .Values.workflow.podGC.strategy }}
  templates:
  - name: fan-out
    container:
      image: {{ .Values.tooling.kubectlImage | default "alpine/k8s:1.36.4" }}
      {{- with .Values.tooling.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      command: [sh, -c]
      args:
      - |
        set -eu
        for t in kubectl jq; do
          command -v "$t" >/dev/null || { echo "FATAL: $t missing from this image" >&2; exit 1; }
        done
        NS="{{`{{workflow.namespace}}`}}"
        # A failed read fails the Workflow loudly: the hourly poll is the backstop.
        CRONS=$(kubectl get cronworkflows -n "$NS" -o json)
        # Only ML apps: k8sapp's reconciler CronWorkflows carry the same label but run
        # another template.
        APPS=$(echo "$CRONS" | jq -r '.items[]
          | select(.spec.workflowSpec.workflowTemplateRef.name == "ml-ci-reconcile" and (.spec.suspend | not))
          | .metadata.labels["platform.kubecore.io/app"] // empty')
        if [ -z "$APPS" ]; then
          echo "dataset-release: no ML app in ${NS} — nothing to re-render"
          exit 0
        fi
        # COALESCE begin (the block between these two markers is executed by tests/dataset-release-coalesce)
        # One waiting check per app is enough. A check that has not reached its decision yet reads
        # the catalog AFTER this event, so it covers this event too; a second check for the same
        # app only queues behind it for a drift slot and for the app's build lock. Without this, a
        # project that released datasets every few minutes piled the checks up (live 2026-11-15:
        # 27 events, 7 apps, 193 checks, up to 13 queued for one app, and the hourly check of an
        # app waited 44 minutes for a slot). A check covers the event only on proof: it is not
        # completed and its decision step does not exist yet or still waits for the build lock.
        # A list that cannot be read (older project without the right, an API blip) covers
        # nothing: every app gets its check, as before.
        if WAITING=$(kubectl get workflows -n "$NS" \
              -l 'platform.kubecore.io/submitted-by=dataset-release,workflows.argoproj.io/completed!=true' \
              -o json 2>/dev/null) \
           && COVERED=$(printf '%s' "$WAITING" | jq -r '
              .items[]
              | select((.metadata.deletionTimestamp // "") == "")
              | select(((.status.phase // "") | IN("", "Pending", "Running")))
              | select([(.status.nodes // {})[] | select(.displayName == "decide" and .phase != "Pending")] | length == 0)
              | "\(.metadata.labels["platform.kubecore.io/app"] // "") \(.metadata.name)"' 2>/dev/null); then
          :
        else
          echo "dataset-release: the waiting checks could not be read: every app gets its own check"
          COVERED=""
        fi
        covered_by() {  # covered_by APP: the name of a waiting check of APP, or nothing
          printf '%s\n' "$COVERED" | awk -v app="$1" '$1 == app { print $2; exit }'
        }
        # COALESCE end
        FAILED=0
        for APP in $APPS; do
          BY=$(covered_by "$APP")
          if [ -n "$BY" ]; then
            echo "dataset-release: ${APP}: covered by the waiting check ${BY}, which has not read the catalog yet"
            continue
          fi
          MANIFEST=$(echo "$CRONS" | jq -c --arg app "$APP" '
              .items[]
              | select(.metadata.labels["platform.kubecore.io/app"] == $app
                       and .spec.workflowSpec.workflowTemplateRef.name == "ml-ci-reconcile")
              | {apiVersion: "argoproj.io/v1alpha1", kind: "Workflow",
                 metadata: {generateName: "ml-ci-dataset-rerender-",
                            labels: {"platform.kubecore.io/app": $app,
                                     "platform.kubecore.io/submitted-by": "dataset-release"}},
                 spec: {workflowTemplateRef: .spec.workflowSpec.workflowTemplateRef,
                        arguments: {parameters: ((.spec.workflowSpec.arguments.parameters // [])
                                                 | map(select(.name != "dataset_event"))
                                                 + [{name: "dataset_event", value: "true"}])},
                        ttlStrategy: {secondsAfterCompletion: 3600}}}' \
          )
          # A Kubernetes API blip on one create must not drop that app's event (nothing else
          # re-sends it): three tries, then the Workflow fails loudly.
          DONE=0
          for TRY in 1 2 3; do
            if printf '%s\n' "$MANIFEST" | kubectl create -n "$NS" -f - ; then DONE=1; break; fi
            echo "dataset-release: ${APP}: create failed (try ${TRY}/3)" >&2
            [ "$TRY" = 3 ] || sleep $((TRY * 5))
          done
          if [ "$DONE" = 1 ]; then
            echo "dataset-release: ${APP}: dataset check submitted"
          else
            echo "dataset-release: ${APP}: could not submit the dataset check" >&2
            FAILED=1
          fi
        done
        exit $FAILED
