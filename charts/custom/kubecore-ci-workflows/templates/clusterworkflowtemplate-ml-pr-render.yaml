{{/*
ml-ci-pr-render — in-cluster PR gate for ML apps (kubecore-operator#1126).

The platform runs NO GitHub Actions. Every check runs as an Argo Workflow on
the workload cluster and reports back to GitHub through commit statuses (and,
for builds, GitHub Deployments). This ClusterWorkflowTemplate replaces the
`.github/workflows/pr-render.yml` job the ML templates used to ship: it is
submitted by the per-KubeApp pull_request WorkflowEventBinding (k8smlapp
composition) on every PR opened/updated against the app's dev branch and
answers with ONE commit status, context `wft-render`, on the PR head SHA:

  pending  → "Rendering WorkflowTemplate in Argo Workflows"   (before any work)
  success  → "WorkflowTemplate rendered: N steps, M form params"
  failure  → "WorkflowTemplate render FAILED — open the Argo run for the error"

target_url is the Argo UI run, so the developer reads the render error (or
the rendered DAG) where the platform produced it — never in a GitHub job.

Flow (mirrors the merge build's render path, minus the gitops commit):
  status(pending) → clone → detect-engine → hera-render (tokenless)
                  → hera-enhance-gate (token-holding, platform code only)
                  → status(success)

clone and hera-render are the SAME templates ml-ci-build runs on merge
(templateRef, clusterScope) — a PR is validated exactly the way the merge
build will render it, with the platform engine the real pipeline-context.yaml
in the gitops repo pins (PRD-HPC-1461 D-80), not a placeholder context. hera-enhance-gate = hera-enhance-commit's
enhance + release-hygiene gate + the step↔folder check (a declared step with
no steps/<dir>/Dockerfile would ImagePullBackOff at run time, long after
merge) — and then STOPS. Nothing is written anywhere.

Alongside the render, the PR gets a SECOND, independent check, `pipeline-lint`
(PRD novelcore/kaos#1682 F-02): the pinned kaos-lib linter reads pipeline.py, config/
and the step folders WITHOUT running them and answers with the `pipeline-lint` commit
status (errors fail it, warnings and infos never do) and ONE PR comment, updated in
place on every push. It never turns `wft-render` red; see the pipeline-lint templates.

Required secrets in the workflow namespace:
  - {{ .Values.github.tokenSecretName }}  (GitHub App installation token —
    contents:read for the clone, statuses:write for the commit status)
*/}}
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ml-ci-pr-render
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "kubecore-ci-workflows.serviceAccountName" . }}
  entrypoint: ml-ci-pr-render
  onExit: exit-handler
  ttlStrategy:
    secondsAfterSuccess: {{ int .Values.workflow.ttlStrategy.secondsAfterSuccess }}
    secondsAfterFailure: {{ int .Values.workflow.ttlStrategy.secondsAfterFailure }}
  podGC:
    strategy: {{ .Values.workflow.podGC.strategy }}
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  # Same per-project CI pool selection as ml-ci-build (kubecore-operator#1067:
  # nodegroup-type alone is not project-scoping; project_name is required).
  nodeSelector:
    platform.kubecore.io/nodegroup-type: "{{`{{workflow.parameters.node_class}}`}}"
    platform.kubecore.io/project: "{{`{{workflow.parameters.project_name}}`}}"
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.workspace.size | default "5Gi" }}
      {{- with .Values.workspace.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
  volumes:
  - name: github-token
    secret:
      secretName: {{ .Values.github.tokenSecretName }}
  arguments:
    parameters:
    # repo_url / commit_sha / branch are read by ml-ci-build's clone template
    # (templateRef below) under these exact names: the PR HEAD repo clone URL
    # (so a fork PR clones the fork), the PR head SHA, and the PR head ref.
    - name: repo_url
    - name: commit_sha
    - name: branch
    - name: app_name
    - name: project_name
    # gitops repo/branch holding {basePath}/{app}/{branch}/pipeline-context.yaml
    # — the REAL platform context the enhancer needs (endpoints, secrets
    # names, compute classes). Same values the merge build receives.
    - name: gitops_repository
    - name: gitops_branch
      value: "main"
    - name: node_class
      value: {{ .Values.ci.defaultNodeClass | default (dig "platform.kubecore.io/nodegroup-type" "kubecorecpu" .Values.nodeSelector) | quote }}
    # PR number: the run report is posted as a comment on the PR itself.
    - name: pr_number
      value: ""
    # read by ml-ci-build.report (shared template); this pipeline is always a
    # pull request and posts statuses only (no Deployment).
    - name: event_type
      value: "pull_request"

  templates:
  - name: ml-ci-pr-render
    steps:
    - - name: status-pending
        template: status
        arguments:
          parameters:
          - name: state
            value: "pending"
          - name: description
            value: "Rendering WorkflowTemplate in Argo Workflows"
    - - name: clone
        templateRef:
          name: ml-ci-build
          template: clone
          clusterScope: true
    - - name: detect-engine
        template: detect-engine
      # kaos-lib/support commit status on the PR head (PRD novelcore/kaos#1147):
      # reporting only, never a red render.
      - name: kaos-lib-support
        templateRef:
          name: ml-ci-build
          template: kaos-lib-support
          clusterScope: true
        continueOn:
          failed: true
    - - name: hera-render
        templateRef:
          name: ml-ci-build
          template: hera-render
          clusterScope: true
        arguments:
          parameters:
          - name: engine_image
            value: "{{`{{steps.detect-engine.outputs.parameters.engine_image}}`}}"
          - name: engine_profile
            value: "{{`{{steps.detect-engine.outputs.parameters.engine_profile}}`}}"
      # The pipeline linter runs next to the render and never fails it: its own
      # status is the verdict, and a linter that cannot run must not hide a render.
      - name: pipeline-lint
        template: pipeline-lint
        continueOn:
          failed: true
    - - name: hera-enhance-gate
        template: hera-enhance-gate
        arguments:
          parameters:
          - name: engine
            value: "{{`{{steps.detect-engine.outputs.parameters.engine}}`}}"
    # The success description is read from /workspace/summary (written by
    # hera-enhance-gate) rather than a step output.
    - - name: status-success
        template: status
        arguments:
          parameters:
          - name: state
            value: "success"
          - name: description
            value: "@/workspace/summary"

  # TOKEN-HOLDING, platform code only: the engine of this PR (PRD-HPC-1461 D-80), validated by the same
  # engine.py as ml-ci-build's detect-steps from the app's gitops pipeline-context and the PR head as DATA
  # (looked up, never imported or run: python3 -I). Outputs are immutable Argo parameters: they choose the
  # render image and are handed to the gate, so nothing the untrusted render writes can change them.
  # A context with no usable engine fails this step, and with it the check.
  - name: detect-engine
{{ include "kubecore-ci-workflows.preemptionRetry" . | indent 4 }}
    outputs:
      parameters:
      - name: engine
        valueFrom:
          path: /tmp/engine.json
      - name: engine_image
        valueFrom:
          path: /tmp/engine_image
      - name: engine_profile
        valueFrom:
          path: /tmp/engine_profile
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    container:
      image: {{ .Values.tooling.toolboxImage | default "alpine/k8s:1.36.4" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.enhanceResources | nindent 6 }}
      command: [sh, -c]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
{{ include "kubecore-ci-workflows.gitAuth" . | indent 8 }}
        ORG="{{ .Values.github.org }}"
        GITOPS_REPO="{{`{{workflow.parameters.gitops_repository}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
{{ include "kubecore-ci-workflows.engineScript" . | indent 8 }}
        git clone --quiet --depth=1 --branch "${GITOPS_BRANCH}" "https://github.com/${ORG}/${GITOPS_REPO}.git" /tmp/gitops
        git_assert_no_token /tmp/gitops
        CONTEXT_PATH=$(find /tmp/gitops -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-context.yaml" | head -1)
        [ -n "$CONTEXT_PATH" ] && [ -f "$CONTEXT_PATH" ] || { echo "engine: FATAL: no pipeline-context in ${ORG}/${GITOPS_REPO}@${GITOPS_BRANCH}" >&2; exit 1; }
        python3 -I /tmp/engine.py context --context "$CONTEXT_PATH" --repo /workspace/repo > /tmp/engine.json \
          || { echo "engine: FATAL: no usable engine or schema profile (the reason is above); failing the render" >&2; exit 1; }
        jq -j '.image' /tmp/engine.json > /tmp/engine_image
        jq -j '.profile' /tmp/engine.json > /tmp/engine_profile
        echo "engine: $(jq -r '.version' /tmp/engine.json) image $(cat /tmp/engine_image) profile $(cat /tmp/engine_profile)"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  # TOKEN-HOLDING, platform code only (same trust boundary as
  # hera-enhance-commit): the developer's pipeline.py already ran tokenless in
  # hera-render; this step only runs the engine's platform enhancer on the raw
  # WFT it produced, then gates. It never writes to any repo.
  - name: hera-enhance-gate
{{ include "kubecore-ci-workflows.preemptionRetry" . | indent 4 }}
    inputs:
      parameters:
      # The engine JSON of detect-engine. Read through the env var, never spliced into the script.
      - name: engine
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    container:
      image: {{ .Values.tooling.toolboxImage | default "alpine/k8s:1.36.4" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.enhanceResources | nindent 6 }}
      command: [sh, -c]
      env:
      - name: ENGINE_JSON
        value: "{{`{{inputs.parameters.engine}}`}}"
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      args:
      - |
        set -e
        # git and PyYAML are baked into tooling.toolboxImage.

        TOKEN=$(cat /etc/github-token/token)
{{ include "kubecore-ci-workflows.gitAuth" . | indent 8 }}
        ORG="{{ .Values.github.org }}"
        GITOPS_REPO="{{`{{workflow.parameters.gitops_repository}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"

        # Real platform context: the app's pipeline-context.yaml from the gitops
        # repo — identical discovery to hera-enhance-commit so a PR renders
        # exactly as the merge build will.
        REPO_URL="https://github.com/${ORG}/${GITOPS_REPO}.git"
        git clone --quiet --depth=1 --branch "${GITOPS_BRANCH}" "${REPO_URL}" /tmp/gitops
        git_assert_no_token /tmp/gitops
        CONTEXT_PATH=$(find /tmp/gitops -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-context.yaml" | head -1)
        if [ -z "$CONTEXT_PATH" ] || [ ! -f "$CONTEXT_PATH" ]; then
          echo "ERROR: pipeline-context.yaml not found under */${APP_NAME}/${GITOPS_BRANCH}/ in ${ORG}/${GITOPS_REPO}@${GITOPS_BRANCH}"
          echo "       (the KubeApp seeds it at creation — is the app still reconciling?)"
          exit 1
        fi
        python3 - "$CONTEXT_PATH" > /tmp/context.yaml <<'CTXEOF'
        import sys, yaml
        doc = yaml.safe_load(open(sys.argv[1]))
        if isinstance(doc, dict) and doc.get("kind") == "ConfigMap":
            key = "context.yaml" if "context.yaml" in doc["data"] else next(iter(doc["data"]))
            sys.stdout.write(doc["data"][key])
        else:
            yaml.safe_dump(doc, sys.stdout, sort_keys=False)
        CTXEOF

        # Platform enhancer (the engine wheel), isolated from the app checkout: see
        # kubecore-ci-workflows.platformEnhance (kubecore-operator#1161, #1375, D-80).
{{ include "kubecore-ci-workflows.platformEnhance" . | indent 8 }}

        # GATE 1: release hygiene — the same checks the merge build enforces
        # before it commits (duplicate form params, @script templates).
        # GATE 2: step ↔ folder — every step the enhancer wired to a
        # platform-built image (container.image is the
        # workflow.parameters.image-<step> moustache, or the input `image` of a template named after the step,
        # kubecore/enhance.py) must have steps/<dir>/Dockerfile (dir = step name with '-' → '_').
        # Steps with a verbatim image are NOT checked, nor is compose-and-validate (the
        # platform builds it from the app's config/ and its own Dockerfile): the
        # platform.kubecore.io/image escape hatch, and platform-injected
        # templates such as hpc-follower (HPC-ready pools; python:3.12.13-alpine)
        # — the first live run of this gate (#1126 e2e) failed on exactly
        # that, because the retired GitHub job rendered with a placeholder
        # context that never produced an HPC step.
        # Writes the success description for the commit status.
        # Runs OUTSIDE /workspace/repo (kubecore-operator#1375): a stdin script
        # puts its cwd first on sys.path, so a yaml.py/re.py in the PR's tree
        # would be imported here, next to the token. steps/ is read as data.
        python3 - /workspace/out/workflow-template.yaml <<'GATEEOF'
        import re, sys, yaml
        from pathlib import Path
        wft = yaml.safe_load(open(sys.argv[1]))
        spec = wft["spec"]
        params = spec.get("arguments", {}).get("parameters", [])
        names = [p["name"] for p in params]
        # Rendered-pipeline section for the PR report comment (shared `report`
        # template reads /workspace/report-extra.md): the step names in
        # pipeline order with where each image comes from, so the developer
        # sees the step they just added/renamed/removed by name — written
        # BEFORE the gates so a failed gate's report carries it too.
        # Which step's folder builds a template's image: two shapes, both accepted so the pins can move in any
        # order. The engine before the images moved gives the template the workflow parameter image-<step>
        # (the moustache); the engine after it gives the template an input `image` that its task fills
        # from the image record, and the template is named after the step. The platform's own templates
        # (compose, the final task, the HPC follower) have no step folder.
        moustache = r"\{" + r"\{workflow\.parameters\.image-(.+)\}" + r"\}"
        image_input = "{" + "{inputs.parameters.image}" + "}"
        platform_templates = ("compose-and-validate", "kaos-promote", "hpc-follower")

        def built_from(t):
            image = str(t["container"].get("image", ""))
            m = re.fullmatch(moustache, image)
            if m:
                return m.group(1)
            if image == image_input and t["name"] not in platform_templates:
                return t["name"]
            return None

        rows = []
        for t in spec["templates"]:
            if "container" not in t:
                continue
            image = str(t["container"].get("image", ""))
            step = built_from(t)
            if t["name"] == "compose-and-validate" or step == "compose-and-validate":
                src = "built by the platform from `config/`"
            elif t["name"] in platform_templates and image == image_input:
                src = "built by the platform"
            else:
                src = f"built from `steps/{step.replace('-', '_')}/`" if step else f"verbatim `{image}`"
            rows.append(f"| `{t['name']}` | {src} |")
        Path("/workspace/report-extra.md").write_text(
            f"#### Rendered pipeline — {len(rows)} steps, {len(names)} form params\n\n"
            "| step | image |\n|---|---|\n" + "\n".join(rows) + "\n")
        dupes = {n for n in names if names.count(n) > 1}
        if dupes:
            sys.exit(f"GATE FAIL: duplicate submit-form parameters: {sorted(dupes)}")
        for t in spec["templates"]:
            if "script" in t:
                sys.exit(f"GATE FAIL: template '{t['name']}' is a @script template "
                         f"(bypasses the image supply chain — not allowed on the production tier)")
        steps = [t for t in spec["templates"] if "container" in t]
        missing = []
        for t in steps:
            step = built_from(t)   # the regexes are split in two so the Helm renderer never sees a double brace
            if step is None or step == "compose-and-validate":
                continue  # verbatim image (escape hatch or platform-injected step), or the platform's compose image: nothing to build
            dockerfile = Path("steps") / step.replace("-", "_") / "Dockerfile"
            if not (Path("/workspace/repo") / dockerfile).is_file():
                missing.append((t["name"], str(dockerfile)))
        if missing:
            print("GATE FAIL: steps declared in pipeline.py with no buildable image "
                  "(they would ImagePullBackOff at run time):")
            for name, path in missing:
                print(f"  - step '{name}': expected {path} (not found)")
            print("Fix: add steps/<dir>/Dockerfile for the step (dir = step name, hyphens -> underscores), "
                  "or set the platform.kubecore.io/image annotation for a verbatim utility image.")
            sys.exit(1)
        print(f"GATE OK: {len(steps)} container steps, {len(names)} form params")
        print("steps: " + " -> ".join(t["name"] for t in steps))
        Path("/workspace/summary").write_text(
            f"WorkflowTemplate rendered: {len(steps)} steps, {len(names)} form params")
        GATEEOF
        # GATE 3: size. Over wftSize.limitKiB the merge build would refuse the render too;
        # on success the size is appended to the status summary.
        python3 - /workspace/out/workflow-template.yaml /workspace/summary <<'WFTSIZEEOF'
{{ include "kubecore-ci-workflows.wftSizeGuard" . | indent 8 }}
        WFTSIZEEOF
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  # ── pipeline-lint (PRD novelcore/kaos#1682 F-02) ───────────────────────────
  # Three pods, split by trust like hera-render / hera-enhance-gate:
  #   prepare (token)    pending status; fetch + verify the pinned kaos-lib wheel; turn the
  #                      gitops pipeline-context into a catalogue (classes, HPC limits and the
  #                      platform's resumable-step record: step names, verdicts, reasons;
  #                      none of the context's endpoints or secret names)
  #   run (TOKENLESS)    unzip the wheel, lint /workspace/repo as DATA (the linter parses,
  #                      never imports or runs it), write report.json / report.md / status.txt
  #   report (token)     the final status and the one PR comment, from the report files
  # prepare and run never fail the run: a problem is written to /workspace/lint/failed and
  # report turns it into an `error` status. The check is advisory (not in any ruleset).
  - name: pipeline-lint
    steps:
    - - name: prepare
        template: pipeline-lint-prepare
        continueOn:
          failed: true
    - - name: run
        template: pipeline-lint-run
        continueOn:
          failed: true
    - - name: report
        template: pipeline-lint-report

  - name: pipeline-lint-prepare
{{ include "kubecore-ci-workflows.githubReportRetry" . | indent 4 }}
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    container:
      image: {{ .Values.tooling.toolboxImage | default "alpine/k8s:1.36.4" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.enhanceResources | nindent 6 }}
      command: [sh, -c]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      args:
      - |
        set +e
        TOKEN=$(cat /etc/github-token/token)
{{ include "kubecore-ci-workflows.gitAuth" . | indent 8 }}
{{ include "kubecore-ci-workflows.pipelineLintWheel" . | indent 8 }}
        ORG="{{ .Values.github.org }}"
        OWNER_REPO=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed 's|https://github.com/||; s|\.git$||')
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        API="https://api.github.com/repos/${OWNER_REPO}"
        AUTH="Authorization: token ${TOKEN}"
        ACCEPT="Accept: application/vnd.github+json"
        ARGO_BASE="{{ .Values.argo.uiBaseUrl }}"
        RUN_URL=""
        [ -n "${ARGO_BASE}" ] && RUN_URL="${ARGO_BASE}/workflows/{{`{{workflow.namespace}}`}}/{{`{{workflow.name}}`}}?uid={{`{{workflow.uid}}`}}"
{{ include "kubecore-ci-workflows.ghApi" . | indent 8 }}
{{ include "kubecore-ci-workflows.pipelineLintStatus" . | indent 8 }}
        mkdir -p "${LINT_DIR}"
        rm -f "${LINT_DIR}/failed" "${LINT_DIR}/catalogue.json"
        fail() { echo "$1" > "${LINT_DIR}/failed"; echo "pipeline-lint: $1" >&2; }

        # The pending status first, so the check is visible while the other steps run. A
        # GitHub outage here exits 75 and the step is retried in a new pod.
        post_status pending "Checking pipeline.py" || exit $?

        if [ -z "${LINT_WHEEL_URL}" ] || [ -z "${LINT_WHEEL_SHA256}" ]; then
          fail "the chart pins no kaos-lib for the linter (pipelineLint.kaosLibWheelUrl)"; exit 0
        fi
        lint_fetch || { fail "the pinned kaos-lib could not be downloaded and verified"; exit 0; }
        lint_unpack || { fail "the pinned kaos-lib could not be unpacked"; exit 0; }

        # The catalogue: the project's compute classes, HPC limits and the platform's record of which
        # steps resumed from a checkpoint (hpc.resumableSteps), from the same gitops
        # pipeline-context the render uses. Only those facts are kept, in a file the tokenless
        # step reads. Without a context the linter uses its built-in defaults (and says so).
        GITOPS_REPO="{{`{{workflow.parameters.gitops_repository}}`}}"
        GITOPS_BRANCH="{{`{{workflow.parameters.gitops_branch}}`}}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        rm -rf /tmp/gitops
        if git clone --quiet --depth=1 --branch "${GITOPS_BRANCH}" "https://github.com/${ORG}/${GITOPS_REPO}.git" /tmp/gitops; then
          git_assert_no_token /tmp/gitops
          CONTEXT_PATH=$(find /tmp/gitops -path "*/${APP_NAME}/${GITOPS_BRANCH}/pipeline-context.yaml" | head -1)
        fi
        if [ -n "${CONTEXT_PATH:-}" ] && [ -f "${CONTEXT_PATH}" ]; then
          python3 -I "${LINT_CLI}" --context "${CONTEXT_PATH}" --export-catalogue "${LINT_DIR}/catalogue.json" \
            || { rm -f "${LINT_DIR}/catalogue.json"; echo "pipeline-lint: the platform context could not be read: built-in defaults apply"; }
        else
          echo "pipeline-lint: no platform context found: built-in defaults apply"
        fi
        exit 0
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  # TOKENLESS: the only step that reads the developer's checkout. Like hera-render it mounts no
  # token and no service-account token. Unlike hera-render it runs no client code at all: the
  # linter parses pipeline.py, config/ and steps/ as text (python3 -I, started from /tmp so
  # nothing in the checkout can be imported).
  - name: pipeline-lint-run
{{ include "kubecore-ci-workflows.preemptionRetry" . | indent 4 }}
    automountServiceAccountToken: false
    executor:
      serviceAccountName: hera-render-exec
    container:
      image: {{ .Values.tooling.toolboxImage | default "alpine/k8s:1.36.4" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.heraRenderResources | nindent 6 }}
      command: [sh, -c]
      args:
      - |
        set +e
{{ include "kubecore-ci-workflows.pipelineLintWheel" . | indent 8 }}
        OWNER_REPO=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed 's|https://github.com/||; s|\.git$||')
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        fail() { echo "$1" > "${LINT_DIR}/failed"; echo "pipeline-lint: $1" >&2; exit 0; }
        if [ -f "${LINT_DIR}/failed" ]; then echo "pipeline-lint: skipped: $(cat "${LINT_DIR}/failed")"; exit 0; fi
        lint_unpack || fail "the pinned kaos-lib failed verification"
        CATALOGUE=""
        [ -f "${LINT_DIR}/catalogue.json" ] && CATALOGUE="--catalogue ${LINT_DIR}/catalogue.json"
        cd /tmp
        python3 -I "${LINT_CLI}" /workspace/repo --format json --output "${LINT_DIR}/report.json" \
          ${CATALOGUE} --expect-ruleset "${LINT_RULESET}"
        RC=$?
        # Exit 0: no errors, 2: errors found (also when a saved report is rendered). Anything else:
        # the linter could not run.
        lint_ok() { [ "$1" = 0 ] || [ "$1" = 2 ]; }
        lint_ok "${RC}" || fail "the linter could not run (exit ${RC})"
        python3 -I "${LINT_CLI}" --from-report "${LINT_DIR}/report.json" --format markdown \
          --file-link-base "https://github.com/${OWNER_REPO}/blob/${SHA}/" --output "${LINT_DIR}/report.md"
        lint_ok $? || fail "the report could not be rendered"
        python3 -I "${LINT_CLI}" --from-report "${LINT_DIR}/report.json" --format status \
          --output "${LINT_DIR}/status.txt"
        lint_ok $? || fail "the report could not be summarised"
        python3 -I "${LINT_CLI}" --from-report "${LINT_DIR}/report.json" --format text
        exit 0
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      # NO github-token mount. This is the trust boundary.

  - name: pipeline-lint-report
{{ include "kubecore-ci-workflows.githubReportRetry" . | indent 4 }}
    container:
      image: {{ .Values.tooling.toolboxImage | default "alpine/k8s:1.36.4" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      args:
      - |
        set +e
        TOKEN=$(cat /etc/github-token/token)
        LINT_DIR=/workspace/lint
        OWNER_REPO=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed 's|https://github.com/||; s|\.git$||')
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        PR="{{`{{workflow.parameters.pr_number}}`}}"
        API="https://api.github.com/repos/${OWNER_REPO}"
        AUTH="Authorization: token ${TOKEN}"
        ACCEPT="Accept: application/vnd.github+json"
        ARGO_BASE="{{ .Values.argo.uiBaseUrl }}"
        RUN_URL=""
        [ -n "${ARGO_BASE}" ] && RUN_URL="${ARGO_BASE}/workflows/{{`{{workflow.namespace}}`}}/{{`{{workflow.name}}`}}?uid={{`{{workflow.uid}}`}}"
{{ include "kubecore-ci-workflows.ghApi" . | indent 8 }}
{{ include "kubecore-ci-workflows.pipelineLintStatus" . | indent 8 }}
        # The linter did not produce a report: say so with an `error` status (never a silent pending).
        if [ -f "${LINT_DIR}/failed" ] || [ ! -s "${LINT_DIR}/report.json" ] || [ ! -s "${LINT_DIR}/status.txt" ]; then
          WHY=$(cat "${LINT_DIR}/failed" 2>/dev/null || echo "an earlier step did not finish")
          post_status error "pipeline-lint could not run: ${WHY}"
          exit 1
        fi
        ERRORS=$(jq -r '.summary.errors' "${LINT_DIR}/report.json")
        if [ "${ERRORS}" = 0 ]; then STATE=success; else STATE=failure; fi
        post_status "${STATE}" "$(cat "${LINT_DIR}/status.txt")"
        RC=$?

        # ONE comment per pull request, found by its marker and updated in place (the marker
        # convention of the shared run report). A run without a PR number posts status only.
        MARKER="<!-- kubecore-ci-report:pipeline-lint -->"
        if [ -n "${PR}" ]; then
          {
            echo "${MARKER}"
            cat "${LINT_DIR}/report.md"
            [ -n "${RUN_URL}" ] && printf '\n[Argo run](%s)\n' "${RUN_URL}"
          } > /tmp/body.md
          PAYLOAD=$(jq -Rs '{body: .}' /tmp/body.md)
          CID=""; PAGE=1
          while [ -z "${CID}" ] && [ "${PAGE}" -le 10 ]; do
            gh_api GET "${API}/issues/${PR}/comments?per_page=100&page=${PAGE}" || { RC=$?; break; }
            CID=$(printf '%s' "${GH_BODY}" | jq -r --arg m "${MARKER}" '[.[]? | objects | select((.body // "") | startswith($m))] | .[0].id // empty')
            [ "$(printf '%s' "${GH_BODY}" | jq 'length')" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done
          if [ -n "${CID}" ]; then
            gh_api PATCH "${API}/issues/comments/${CID}" "${PAYLOAD}" && echo "Updated pipeline-lint comment ${CID} on PR #${PR}" || RC=$?
          elif [ "${RC}" = 0 ]; then
            gh_api POST "${API}/issues/${PR}/comments" "${PAYLOAD}" && echo "Posted pipeline-lint comment on PR #${PR}" || RC=$?
          fi
        fi
        exit "${RC}"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  # ONE commit status (context wft-render) on the PR head SHA, target_url =
  # this Argo run. Best-effort against the GitHub API (curl without -f): a
  # status write must never be what fails the gate.
  - name: status
{{ include "kubecore-ci-workflows.preemptionRetry" . | indent 4 }}
    inputs:
      parameters:
      - name: state
      - name: description
    container:
      image: {{ .Values.tooling.curlImage | default "alpine/curl:8.21.0" }}
      {{- include "kubecore-ci-workflows.resources" .Values.tooling.resources | nindent 6 }}
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO="{{`{{workflow.parameters.repo_url}}`}}"
        OWNER_REPO=$(echo "$REPO" | sed 's|https://github.com/||' | sed 's|.git$||')
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        STATE="{{`{{inputs.parameters.state}}`}}"
        DESC="{{`{{inputs.parameters.description}}`}}"
        # "@<path>" reads the description from the shared workspace (see the
        # entrypoint's status-success step). GitHub caps description at 140.
        case "${DESC}" in @*) DESC=$(cat "${DESC#@}") ;; esac
        API="https://api.github.com/repos/${OWNER_REPO}"
        ARGO_BASE="{{ .Values.argo.uiBaseUrl }}"
        RUN_URL=""
        if [ -n "${ARGO_BASE}" ]; then
          RUN_URL="${ARGO_BASE}/workflows/{{`{{workflow.namespace}}`}}/{{`{{workflow.name}}`}}?uid={{`{{workflow.uid}}`}}"
        fi
        # OLD APP (PRD novelcore/kaos#1911 AC-01): the render refused this pull request because the
        # app was made before the current pipelines (hera-render left /workspace/old-app).
        # The check then says so; the report comment carries what to change. The
        # description is the chart's own text: nothing the render wrote is put into this request.
        if [ "${STATE}" = "failure" ] && [ -s /workspace/old-app ]; then
          DESC="{{ include "kubecore-ci-workflows.oldAppStatus" . }}"
        fi
        DESC=$(printf '%s' "${DESC}" | cut -c1-140)
        if [ -n "${RUN_URL}" ]; then
          PAYLOAD="{\"state\":\"${STATE}\",\"description\":\"${DESC}\",\"context\":\"wft-render\",\"target_url\":\"${RUN_URL}\"}"
        else
          PAYLOAD="{\"state\":\"${STATE}\",\"description\":\"${DESC}\",\"context\":\"wft-render\"}"
        fi
        curl -s -X POST -H "Authorization: token ${TOKEN}" -H "Accept: application/vnd.github+json" \
          "${API}/statuses/${SHA}" -d "${PAYLOAD}" > /dev/null
        echo "Posted commit status wft-render=${STATE} on ${OWNER_REPO}@${SHA}"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: exit-handler
    steps:
    - - name: post-failure-status
        template: status
        arguments:
          parameters:
          - name: state
            value: "failure"
          - name: description
            value: "WorkflowTemplate render FAILED — open the Argo run for the error"
        when: "{{`{{workflow.status}}`}} != Succeeded"
    - - name: run-report
        templateRef:
          name: ml-ci-build
          template: report
          clusterScope: true
        arguments:
          parameters:
          - name: pipeline
            value: "WorkflowTemplate render (PR gate)"
          - name: context
            value: "wft-render"
          - name: environment
            value: ""
          - name: pr_number
            value: "{{`{{workflow.parameters.pr_number}}`}}"
