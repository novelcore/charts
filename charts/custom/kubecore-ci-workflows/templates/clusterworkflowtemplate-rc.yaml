apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ci-rc-build
  labels:
    {{- include "kubecore-ci-workflows.labels" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "kubecore-ci-workflows.serviceAccountName" . }}
  entrypoint: ci-rc-build
  onExit: exit-handler
  ttlStrategy:
    secondsAfterSuccess: {{ int .Values.workflow.ttlStrategy.secondsAfterSuccess }}
    secondsAfterFailure: {{ int .Values.workflow.ttlStrategy.secondsAfterFailure }}
  # One build per app at a time (kubecore-operator#1126): the project's CI
  # pool is small (default 1 node) and consecutive pushes otherwise spawn
  # concurrent builds of the same app that starve each other's build-push
  # pods. Argo queues the later run until the earlier one completes.
  synchronization:
    mutexes:
    - name: "{{`{{workflow.parameters.app_name}}`}}-build"
  podGC:
    strategy: {{ .Values.workflow.podGC.strategy }}
  # Workflow-level nodeSelector now follows the same per-submission CI pool
  # as the build-push template's override below (PRD-962 F-09 stage 2:
  # service CI moves off the shared kubecorecpu pool for every step, not
  # just build-push). node_class's Helm-render-time default is unchanged, so
  # a submission that omits it still resolves to today's fixed
  # kubecorecpu selector — this is a behavior-preserving parameterization,
  # not a scheduling change, until callers start passing node_class.
  #
  # kubecore-operator#1067: nodegroup-type alone is not project-scoping — the
  # synthesised CI environment is named the literal string "ci" on EVERY
  # project, so every project's CI pool carries the identical
  # nodegroup-type=ci label and any of them satisfies this selector. Adding
  # platform.kubecore.io/project (a label the node already carries, unique
  # per project) closes that: a step can now only land on its OWN project's
  # CI pool. project_name is a required workflow parameter on every service
  # CI template (no fallback), so this key is never emitted empty.
  nodeSelector:
    platform.kubecore.io/nodegroup-type: "{{`{{workflow.parameters.node_class}}`}}"
    platform.kubecore.io/project: "{{`{{workflow.parameters.project_name}}`}}"
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  volumes:
  - name: workspace
    emptyDir: {}
  - name: github-token
    secret:
      secretName: {{ .Values.github.tokenSecretName }}
  # registry-auth was missing entirely: build-push pushed with no registry
  # credential at all. Zot's anonymousPolicy grants read only, so an RC build
  # could never have pushed even once BuildKit was replaced — a second,
  # independent defect from the rootless-BuildKit one. Same Secret name the
  # ci-build template mounts; written once per project by githubproject
  # (PRD-962 F-08).
  - name: registry-auth
    secret:
      secretName: ci-registry-auth
  arguments:
    parameters:
    - name: repo_url
    - name: commit_sha
    - name: branch
    - name: app_name
    - name: project_name
    - name: dockerfile_path
      value: {{ .Values.buildkit.dockerfilePath | quote }}
    - name: build_context
      value: {{ .Values.buildkit.buildContext | quote }}
    # PRD-994 CI registry threading. Both default to today's behaviour so any
    # submitter that sets neither is byte-identical to chart 0.12.51:
    # image_repo empty falls back to the .Values.registry.* construction, and
    # registry_type zot keeps the htpasswd/API-key auth path.
    - name: image_repo
      value: ""
    # Pull-side image path, matching the base Deployment's image name. The
    # kustomize image key must equal that name exactly or the entry is inert
    # and nothing deploys. Empty falls back to the older behaviour.
    - name: deploy_image_repo
      value: ""
    - name: registry_type
      value: "zot"
    # Per-submission CI node pool (PRD-962 F-09). Optional: a submitter that
    # omits it gets the operator-resolved default below, which itself falls
    # back to today's single workflow-level nodeSelector so behavior is
    # unchanged until callers start passing this parameter.
    - name: node_class
      value: {{ .Values.ci.defaultNodeClass | default (dig "platform.kubecore.io/nodegroup-type" "kubecorecpu" .Values.nodeSelector) | quote }}
  templates:
  # ci-rc-build is the DAG entrypoint for the RC pipeline.
  # Dependency order:
  #   clone → version → build-push → tag
  #                     build-push → status
  #                     build-push → gitops-notify
  #                     tag + build-push → release
  #                     release + gitops-notify → issue
  - name: ci-rc-build
    dag:
      tasks:
      # Report pending (with the Argo run URL) BEFORE any work (#1126 — full
      # GitHub reporting on every pipeline): kubecore-ci/rc check + rc
      # Deployment go in_progress the moment the rc/* push lands.
      - name: status-pending
        template: status
        arguments:
          parameters:
          - name: state
            value: "pending"
          - name: description
            value: "RC build running in Argo Workflows"

      - name: clone
        template: clone
        dependencies: [status-pending]

      - name: version
        template: version
        dependencies: [clone]

      - name: build-push
        template: build-push
        dependencies: [version]
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{tasks.version.outputs.parameters.image_tag}}`}}"
          - name: rc_tag
            value: "{{`{{tasks.version.outputs.parameters.rc_tag}}`}}"

      - name: tag
        template: tag
        dependencies: [build-push]
        arguments:
          parameters:
          - name: rc_tag
            value: "{{`{{tasks.version.outputs.parameters.rc_tag}}`}}"

      - name: status
        template: status
        dependencies: [build-push]
        arguments:
          parameters:
          - name: state
            value: "success"
          - name: description
            value: "{{`RC build {{tasks.version.outputs.parameters.rc_tag}} succeeded`}}"

      - name: gitops-notify
        template: gitops-notify
        dependencies: [build-push]
        arguments:
          parameters:
          - name: image_tag
            value: "{{`{{tasks.version.outputs.parameters.image_tag}}`}}"
          - name: semantic_version
            value: "{{`{{tasks.version.outputs.parameters.semantic_version}}`}}"

      - name: release
        template: release
        dependencies: [tag, build-push]
        arguments:
          parameters:
          - name: rc_tag
            value: "{{`{{tasks.version.outputs.parameters.rc_tag}}`}}"

      - name: issue
        template: issue
        dependencies: [release, gitops-notify]
        arguments:
          parameters:
          - name: rc_tag
            value: "{{`{{tasks.version.outputs.parameters.rc_tag}}`}}"
          - name: semantic_version
            value: "{{`{{tasks.version.outputs.parameters.semantic_version}}`}}"

  # clone performs a full (non-shallow) clone so that all tags are available
  # for RC number calculation in the version step.
  - name: clone
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        AUTH_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        BRANCH=$(echo "{{`{{workflow.parameters.branch}}`}}" | sed 's|refs/heads/||')
        git clone --branch "${BRANCH}" "${AUTH_URL}" /workspace/repo
        cd /workspace/repo
        git fetch --tags --force
        git checkout "{{`{{workflow.parameters.commit_sha}}`}}"
        echo "Cloned at $(git rev-parse HEAD)"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  # version extracts the semantic version from the rc/* branch name, finds the
  # highest existing rc tag for that version, and increments the RC number.
  # Outputs: rc_tag (e.g. v1.2.3-rc4), semantic_version (e.g. 1.2.3),
  #          image_tag (same value as rc_tag — used as the OCI image tag).
  - name: version
    outputs:
      parameters:
      - name: rc_tag
        valueFrom:
          path: /tmp/rc_tag
      - name: semantic_version
        valueFrom:
          path: /tmp/semantic_version
      - name: image_tag
        valueFrom:
          path: /tmp/image_tag
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        cd /workspace/repo

        BRANCH="{{`{{workflow.parameters.branch}}`}}"

        # Extract semantic version from branch name: refs/heads/rc/v1.2.3 → 1.2.3
        SEMANTIC_VERSION=$(echo "$BRANCH" | sed -E 's|refs/heads/rc/v([0-9]+\.[0-9]+\.[0-9]+).*|\1|')

        if [ "$SEMANTIC_VERSION" = "$BRANCH" ]; then
          echo "ERROR: branch '${BRANCH}' does not match refs/heads/rc/v<semver> pattern"
          exit 1
        fi

        # Find all existing rc tags for this semantic version and pick the next number
        RC_TAGS=$(git tag -l "v${SEMANTIC_VERSION}-rc*" | sort -V)
        if [ -z "$RC_TAGS" ]; then
          RC_NUMBER=1
        else
          CURRENT_RC=$(echo "$RC_TAGS" | tail -n 1 | sed -E 's/.*-rc([0-9]+)/\1/')
          RC_NUMBER=$((CURRENT_RC + 1))
        fi

        RC_TAG="v${SEMANTIC_VERSION}-rc${RC_NUMBER}"

        echo -n "$RC_TAG" > /tmp/rc_tag
        echo -n "$SEMANTIC_VERSION" > /tmp/semantic_version
        # image_tag is identical to rc_tag — kept as a separate output for
        # clarity at call sites that expect an image_tag parameter.
        echo -n "$RC_TAG" > /tmp/image_tag

        echo "Semantic version: ${SEMANTIC_VERSION}, RC tag: ${RC_TAG}"
      volumeMounts:
      - name: workspace
        mountPath: /workspace

  # build-push builds the Docker image with BuildKit and pushes it to the
  # internal Zot registry. dockerfile_path and build_context follow the same
  # Helm-value-driven pattern used by the ci-build template.
  # Runs KANIKO, not rootless BuildKit — same reasoning as the ci-build
  # template's build-push: rootlesskit cannot create its mount namespace on
  # this platform ("failed to share mount point: /: permission denied"), which
  # is why ml-ci-build was reverted to kaniko. That revert never reached the
  # service-app templates.
  #
  # NOTE the value keys below still live under .Values.buildkit.* — they are
  # just path strings (buildContext / dockerfilePath) and are shared with the
  # pool chart's values, so they are left in place rather than renamed in a
  # correctness fix. The key name is now a misnomer.
  - name: build-push
    inputs:
      parameters:
      - name: image_tag
      - name: rc_tag
    # Template-level nodeSelector overrides the workflow-level one above so
    # this build lands on the per-submission CI pool (PRD-962 F-09) instead
    # of the shared cluster default. Tolerations are intentionally left to
    # the workflow-level fallback (.Values.tolerations) — the CI node group
    # carries the same taint key/value these already tolerate.
    #
    # kubecore-operator#1067: a template-level nodeSelector REPLACES the
    # workflow-level one in Argo rather than merging with it, so the
    # project key must be repeated here too — this is the step that
    # actually runs the build and is the one that matters most.
    nodeSelector:
      platform.kubecore.io/nodegroup-type: "{{`{{workflow.parameters.node_class}}`}}"
      platform.kubecore.io/project: "{{`{{workflow.parameters.project_name}}`}}"
    volumes:
    - name: kaniko-config
      emptyDir: {}
    container:
      image: {{ .Values.kaniko.image | default "gcr.io/kaniko-project/executor:v1.23.2-debug" }}
      command: ["/busybox/sh", "-c"]
      args:
      - |
        set -e
        REGISTRY="{{ .Values.registry.internalUrl }}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        PROJECT="{{`{{workflow.parameters.project_name}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        IMAGE_REPO="{{`{{workflow.parameters.image_repo}}`}}"
        REGISTRY_TYPE="{{`{{workflow.parameters.registry_type}}`}}"

        # image_repo is the registry-kind-aware path resolved by the operator.
        # Empty means a submitter predating PRD-994 CI threading — fall back
        # to the Zot layout this template has always assumed.
        if [ -z "${IMAGE_REPO}" ]; then
          IMAGE_REPO="${REGISTRY}/${PROJECT}/${APP_NAME}"
        fi
        FULL_IMAGE="${IMAGE_REPO}:${IMAGE_TAG}"

        TLS_FLAGS="--insecure --skip-tls-verify"
        if [ "${REGISTRY_TYPE}" = "gar" ]; then
          # GAR authenticates through GKE Workload Identity: kaniko reads
          # credentials from the metadata server via this pod's ci-build-sa,
          # which the k8sapp composition annotates with
          # iam.gke.io/gcp-service-account. No docker config, and GAR is
          # TLS — both flags would be wrong.
          TLS_FLAGS=""
        else
          # Registry auth for kaniko. Uses the base64 "auth" form rather than
          # username/password so a password containing shell-special or JSON
          # characters cannot corrupt the file (the API key is opaque).
          REG_USER=$(cat /etc/registry-auth/username)
          REG_PASS=$(cat /etc/registry-auth/password)
          AUTH=$(printf '%s:%s' "${REG_USER}" "${REG_PASS}" | base64 | tr -d '\n')
          mkdir -p /kaniko/.docker
          cat > /kaniko/.docker/config.json <<EOF
        {"auths":{"${REGISTRY}":{"auth":"${AUTH}"}}}
        EOF
        fi

        /kaniko/executor \
          --context="dir:///workspace/repo/{{ .Values.buildkit.buildContext }}" \
          --dockerfile="/workspace/repo/{{ .Values.buildkit.dockerfilePath }}" \
          --destination="${FULL_IMAGE}" \
          --build-arg="REGISTRY_URL=${REGISTRY}" \
          --build-arg="VERSION=${IMAGE_TAG}" \
          ${TLS_FLAGS} \
          --cleanup

        echo "Pushed: ${FULL_IMAGE}"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: registry-auth
        mountPath: /etc/registry-auth
        readOnly: true
      - name: kaniko-config
        mountPath: /kaniko/.docker

  # tag creates and pushes an annotated git tag for the RC to the origin remote.
  - name: tag
    inputs:
      parameters:
      - name: rc_tag
    container:
      image: alpine/git:latest
      command: [sh, -c]
      args:
      - |
        set -e
        cd /workspace/repo
        TOKEN=$(cat /etc/github-token/token)
        RC_TAG="{{`{{inputs.parameters.rc_tag}}`}}"

        git config user.name "KubeCore CI"
        git config user.email "ci@kubecore.io"

        REPO_URL=$(echo "{{`{{workflow.parameters.repo_url}}`}}" | sed "s|https://|https://x-access-token:${TOKEN}@|")
        git remote set-url origin "${REPO_URL}"

        git tag -a "$RC_TAG" -m "Release candidate $RC_TAG"
        git push origin "$RC_TAG"
        echo "Tagged: ${RC_TAG}"
      volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  # status posts a commit status to GitHub. Context is kubecore-ci/rc to
  # distinguish RC build results from dev build results on the same commit.
  - name: status
    # GitHub reporting for the RC build (#1126): ONE commit status (context
    # kubecore-ci/rc) with target_url into the Argo UI run, plus a Deployment
    # rollup (environment argo-workflows-rc) whose log/environment URL is the same run. The
    # GitHub Release + tracking issue below are the RC's own artefacts; this
    # is the check + rollup the rc/* commit carries. Best-effort against the
    # GitHub API: curl without -f never fails the build over a status write.
    inputs:
      parameters:
      - name: state
      - name: description
      # context = the commit-status check name; environment = the GitHub
      # Deployment environment this pipeline rolls up into ("" = no
      # Deployment, statuses only). Defaults are this pipeline's own; RC
      # variants override both via templateRef.
      - name: context
        value: "kubecore-ci/rc"
      - name: environment
        value: "argo-workflows-rc"
    container:
      image: alpine/curl
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO="{{`{{workflow.parameters.repo_url}}`}}"
        OWNER_REPO=$(echo "$REPO" | sed 's|https://github.com/||' | sed 's|.git$||')
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        STATE="{{`{{inputs.parameters.state}}`}}"
        DESC=$(printf '%s' "{{`{{inputs.parameters.description}}`}}" | cut -c1-140)
        CONTEXT="{{`{{inputs.parameters.context}}`}}"
        ENVIRONMENT="{{`{{inputs.parameters.environment}}`}}"
        API="https://api.github.com/repos/${OWNER_REPO}"
        AUTH="Authorization: token ${TOKEN}"
        ACCEPT="Accept: application/vnd.github+json"
        ARGO_BASE="{{ .Values.argo.uiBaseUrl }}"
        RUN_URL=""
        if [ -n "${ARGO_BASE}" ]; then
          RUN_URL="${ARGO_BASE}/workflows/{{`{{workflow.namespace}}`}}/{{`{{workflow.name}}`}}"
        fi

        # 1) commit status — the check on the commit / PR, linking to the run.
        if [ -n "${RUN_URL}" ]; then
          PAYLOAD="{\"state\":\"${STATE}\",\"description\":\"${DESC}\",\"context\":\"${CONTEXT}\",\"target_url\":\"${RUN_URL}\"}"
        else
          PAYLOAD="{\"state\":\"${STATE}\",\"description\":\"${DESC}\",\"context\":\"${CONTEXT}\"}"
        fi
        curl -s -X POST -H "${AUTH}" -H "${ACCEPT}" "${API}/statuses/${SHA}" -d "${PAYLOAD}" > /dev/null
        echo "Posted commit status ${CONTEXT}=${STATE} on ${OWNER_REPO}@${SHA}"

        # 2) Deployment rollup (environment = this pipeline). Created on pending
        # with required_contexts:[] — THIS run is what the commit statuses
        # describe; defaulting would deadlock the Deployment on its own check.
        # Resolved on success/failure against the Deployment created for this
        # SHA + environment. jq for response parsing (compact vs pretty JSON
        # both occur); if jq cannot be installed the statuses still stand.
        [ -n "${ENVIRONMENT}" ] || exit 0
        apk add --no-cache jq >/dev/null 2>&1 || true
        if ! command -v jq >/dev/null; then
          echo "WARN: jq unavailable — commit status posted, deployment rollup skipped"
          exit 0
        fi
        if [ "${STATE}" = "pending" ]; then
          # Self-heal: a run killed before its exit handler leaves its
          # Deployment in_progress forever. Before creating this run's
          # Deployment, mark every non-terminal one in the same environment
          # inactive (this run supersedes them).
          curl -s -H "${AUTH}" -H "${ACCEPT}" "${API}/deployments?environment=${ENVIRONMENT}&per_page=20" \
            | jq -r 'if type == "array" then .[].id else empty end' 2>/dev/null | while read -r OLD; do
            OLD_STATE=$(curl -s -H "${AUTH}" -H "${ACCEPT}" "${API}/deployments/${OLD}/statuses?per_page=1" | jq -r 'if type == "array" then (.[0].state // "none") else "none" end' 2>/dev/null)
            case "${OLD_STATE}" in pending|in_progress|queued|none)
              curl -s -X POST -H "${AUTH}" -H "${ACCEPT}" "${API}/deployments/${OLD}/statuses" \
                -d "{\"state\":\"inactive\",\"description\":\"superseded by {{`{{workflow.name}}`}}\"}" > /dev/null
              echo "Inactivated stale deployment ${ENVIRONMENT}#${OLD} (${OLD_STATE})";;
            esac
          done
          DEP_ID=$(curl -s -X POST -H "${AUTH}" -H "${ACCEPT}" "${API}/deployments" \
            -d "{\"ref\":\"${SHA}\",\"environment\":\"${ENVIRONMENT}\",\"auto_merge\":false,\"required_contexts\":[],\"transient_environment\":true,\"description\":\"{{`{{workflow.name}}`}}\"}" \
            | jq -r 'if type == "object" then (.id // empty) else empty end' 2>/dev/null || true)
          DEP_STATE="in_progress"
        else
          DEP_ID=$(curl -s -H "${AUTH}" -H "${ACCEPT}" "${API}/deployments?sha=${SHA}&environment=${ENVIRONMENT}&per_page=1" \
            | jq -r 'if type == "array" then (.[0].id // empty) else empty end' 2>/dev/null || true)
          DEP_STATE="${STATE}"
        fi
        if [ -n "${DEP_ID}" ]; then
          if [ -n "${RUN_URL}" ]; then
            DPAYLOAD="{\"state\":\"${DEP_STATE}\",\"log_url\":\"${RUN_URL}\",\"environment_url\":\"${RUN_URL}\",\"description\":\"${DESC}\"}"
          else
            DPAYLOAD="{\"state\":\"${DEP_STATE}\",\"description\":\"${DESC}\"}"
          fi
          curl -s -X POST -H "${AUTH}" -H "${ACCEPT}" "${API}/deployments/${DEP_ID}/statuses" -d "${DPAYLOAD}" > /dev/null
          echo "Posted deployment ${ENVIRONMENT}#${DEP_ID} status: ${DEP_STATE}"
        else
          echo "WARN: no ${ENVIRONMENT} Deployment resolved for ${SHA} — skipped deployment status"
        fi
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  - name: gitops-notify
    inputs:
      parameters:
      - name: image_tag
      - name: semantic_version
    container:
      image: alpine/curl
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        ORG="{{ .Values.github.org }}"
        PROJECT="{{`{{workflow.parameters.project_name}}`}}"
        OPS_REPO="${ORG}/${PROJECT}{{ .Values.gitops.projectRepoSuffix }}"
        APP_NAME="{{`{{workflow.parameters.app_name}}`}}"
        IMAGE_TAG="{{`{{inputs.parameters.image_tag}}`}}"
        SEMANTIC_VERSION="{{`{{inputs.parameters.semantic_version}}`}}"
        REGISTRY="{{ .Values.registry.internalUrl }}"
        IMAGE_REPO="{{`{{workflow.parameters.image_repo}}`}}"
        DEPLOY_IMAGE_REPO="{{`{{workflow.parameters.deploy_image_repo}}`}}"

        # deploy_image_repo takes priority: it is the pull-side path the
        # staging overlay's kustomize key must match, which for Zot differs
        # from the push-side image_repo/internalUrl construction below (the
        # "same fallback as build-push" behaviour this template used to rely
        # on unconditionally).
        if [ -n "${DEPLOY_IMAGE_REPO}" ]; then
          FULL_IMAGE="${DEPLOY_IMAGE_REPO}"
        elif [ -n "${IMAGE_REPO}" ]; then
          FULL_IMAGE="${IMAGE_REPO}"
        else
          FULL_IMAGE="${REGISTRY}/${PROJECT}/${APP_NAME}"
        fi

        curl -s -X POST \
          -H "Authorization: token ${TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${OPS_REPO}/dispatches" \
          -d "{
            \"event_type\": \"staging-environment-update\",
            \"client_payload\": {
              \"version\": \"${IMAGE_TAG}\",
              \"image\": \"${FULL_IMAGE}:${IMAGE_TAG}\",
              \"app_name\": \"${APP_NAME}\",
              \"semantic_version\": \"v${SEMANTIC_VERSION}\",
              \"plain_image_name\": \"${FULL_IMAGE}\"
            }
          }"

        echo "Dispatched staging-environment-update to ${OPS_REPO}"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  # release creates a GitHub pre-release for the RC tag. The release is marked
  # prerelease=true and targeted at the rc/* branch so it does not appear as
  # the latest production release.
  - name: release
    inputs:
      parameters:
      - name: rc_tag
    container:
      image: alpine/curl
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO_URL="{{`{{workflow.parameters.repo_url}}`}}"
        BRANCH="{{`{{workflow.parameters.branch}}`}}"
        RC_TAG="{{`{{inputs.parameters.rc_tag}}`}}"
        OWNER_REPO=$(echo "$REPO_URL" | sed 's|https://github.com/||;s|.git$||')
        BRANCH_NAME=$(echo "$BRANCH" | sed 's|refs/heads/||')

        curl -s -X POST \
          -H "Authorization: token ${TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${OWNER_REPO}/releases" \
          -d "{
            \"tag_name\": \"${RC_TAG}\",
            \"name\": \"Release Candidate ${RC_TAG}\",
            \"body\": \"## Release Candidate ${RC_TAG}\n\nDeployed to staging via KAOS CI.\n\n### Checklist\n- [ ] Staging deployment verified\n- [ ] QA validation complete\n- [ ] Ready for production\",
            \"prerelease\": true,
            \"target_commitish\": \"${BRANCH_NAME}\"
          }"

        echo "Created pre-release: ${RC_TAG}"
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  # issue searches for an open GitHub issue labelled release-candidate whose
  # title contains the semantic version. If found, it updates the title to the
  # new RC tag and adds a comment. If not found, it creates a new issue so that
  # QA teams have a single tracking thread per release train.
  - name: issue
    inputs:
      parameters:
      - name: rc_tag
      - name: semantic_version
    container:
      image: alpine/curl
      command: [sh, -c]
      args:
      - |
        set -e
        TOKEN=$(cat /etc/github-token/token)
        REPO_URL="{{`{{workflow.parameters.repo_url}}`}}"
        SHA="{{`{{workflow.parameters.commit_sha}}`}}"
        RC_TAG="{{`{{inputs.parameters.rc_tag}}`}}"
        SEMANTIC_VERSION="{{`{{inputs.parameters.semantic_version}}`}}"
        OWNER_REPO=$(echo "$REPO_URL" | sed 's|https://github.com/||;s|.git$||')

        # Search for an open issue labelled release-candidate that mentions
        # this semantic version in its title — handles multiple RC iterations
        # against the same release train on a single issue thread.
        ISSUES=$(curl -s \
          -H "Authorization: token ${TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${OWNER_REPO}/issues?labels=release-candidate&state=open")

        MATCHING=$(echo "$ISSUES" | grep -o "\"number\":[0-9]*" | head -1 | grep -o '[0-9]*' || true)

        if [ -n "$MATCHING" ]; then
          # Update the issue title to reflect the latest RC tag and add a comment
          curl -s -X PATCH \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER_REPO}/issues/${MATCHING}" \
            -d "{\"title\":\"Release Candidate ${RC_TAG} Status\"}"

          curl -s -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER_REPO}/issues/${MATCHING}/comments" \
            -d "{\"body\":\"New RC build: ${RC_TAG}\nCommit: ${SHA}\"}"

          echo "Updated issue #${MATCHING} for ${RC_TAG}"
        else
          # No existing issue — create one for QA tracking
          curl -s -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER_REPO}/issues" \
            -d "{
              \"title\": \"Release Candidate ${RC_TAG} Status\",
              \"body\": \"## ${RC_TAG}\n\n- [ ] Staging verified\n- [ ] QA complete\n- [ ] Ready for prod\",
              \"labels\": [\"release-candidate\"]
            }"

          echo "Created tracking issue for ${RC_TAG}"
        fi
      volumeMounts:
      - name: github-token
        mountPath: /etc/github-token
        readOnly: true

  # exit-handler posts a failure commit status when the workflow ends in a
  # Failed state. It mirrors the pattern used in the ci-build template.
  - name: exit-handler
    steps:
    - - name: post-failure-status
        template: status
        arguments:
          parameters:
          - name: state
            value: "failure"
          - name: description
            value: "RC build failed — open the Argo run for the error"
        # != Succeeded: an Error (executor/infra) must surface on GitHub too.
        when: "{{`{{workflow.status}}`}} != Succeeded"
    - - name: run-report
        templateRef:
          name: ml-ci-build
          template: report
          clusterScope: true
        arguments:
          parameters:
          - name: pipeline
            value: "RC build"
          - name: context
            value: "kubecore-ci/rc"
          - name: environment
            value: "argo-workflows-rc"
