      args:
      - "import os, sys, subprocess, yaml\n\n# Config resolution: if PIPELINE_CONFIG\
        \ (injected by platform generator)\n# is non-empty, it OVERRIDES all individual\
        \ parameters. Otherwise,\n# PARAMS_YAML (assembled from individual Argo parameters)\
        \ is used.\npipeline_config = os.environ.get(\"PIPELINE_CONFIG\", \"\")\n\
        params_yaml = os.environ.get(\"PARAMS_YAML\", \"\")\nraw = pipeline_config.strip()\
        \ if pipeline_config.strip() else params_yaml\n\nif not raw.strip():\n   \
        \ print(\"ERROR: Neither PIPELINE_CONFIG nor PARAMS_YAML is set.\", flush=True)\n\
        \    sys.exit(1)\ntry:\n    cfg = yaml.safe_load(raw)\nexcept yaml.YAMLError\
        \ as e:\n    print(f\"ERROR: Config is not valid YAML: {e}\", flush=True)\n\
        \    sys.exit(1)\nif not isinstance(cfg, dict):\n    print(\"ERROR: Config\
        \ parsed to a non-dict value.\", flush=True)\n    sys.exit(1)\n\n# Enforce\
        \ manifest-only: full-download and labels-only are not\n# supported in the\
        \ cluster because steps run in separate pods and\n# there is no shared volume\
        \ between them. In param mode, PARAMS_YAML\n# always sets manifest_only=true;\
        \ in config mode we verify it.\ndataset = cfg.get(\"dataset\") or {}\nmanifest_only\
        \ = dataset.get(\"manifest_only\", False)\nlabels_only = dataset.get(\"labels_only\"\
        , False)\nif not manifest_only:\n    mode = \"labels-only\" if labels_only\
        \ else \"full-download\"\n    print(\n        f\"ERROR: dataset.manifest_only\
        \ must be true. \"\n        f\"Current mode is '{mode}'. \"\n        f\"Full-download\
        \ and labels-only modes require a shared filesystem \"\n        f\"between\
        \ steps, which this cluster does not provide. \"\n        f\"Set dataset.manifest_only:\
        \ true in your pipeline config.\",\n        flush=True,\n    )\n    sys.exit(1)\n\
        \nexp = cfg.get(\"experiment\") or {}\ndataset = cfg.get(\"dataset\") or {}\n\
        model = cfg.get(\"model\") or {}\ntraining = cfg.get(\"training\") or {}\n\
        checkpointing = cfg.get(\"checkpointing\") or {}\nearly_stopping = cfg.get(\"\
        early_stopping\") or {}\naugmentation = cfg.get(\"augmentation\") or {}\n\n\
        # Precedence: explicit param wins; empty param falls back to platform env.\n\
        # CHECKPOINT_BUCKET/CHECKPOINT_PREFIX are injected by render-wft from the\n\
        # k8smlapp pipeline-context (checkpoints.bucket = lakeFS repo, prefix =\n\
        # main/checkpoints). When both are absent the platform didn't inject them\n\
        # (legacy deployment or misconfiguration) and we fail loudly.\nstorage_path\
        \ = str(checkpointing.get(\"storage_path\", \"\") or \"\").strip()\nif not\
        \ storage_path:\n    ckpt_bucket = os.environ.get(\"CHECKPOINT_BUCKET\", \"\
        \").strip()\n    ckpt_prefix = os.environ.get(\"CHECKPOINT_PREFIX\", \"\"\
        ).strip()\n    if not ckpt_bucket:\n        print(\n            \"ERROR: checkpointing-storage-path\
        \ is empty and CHECKPOINT_BUCKET env \"\n            \"is not set. The platform\
        \ should inject CHECKPOINT_BUCKET/CHECKPOINT_PREFIX \"\n            \"from\
        \ the project lakeFS repository via render-wft. Either set \"\n          \
        \  \"checkpointing-storage-path explicitly or ensure the k8smlapp composition\
        \ \"\n            \"version includes the checkpoints block in pipeline-context.yaml.\"\
        ,\n            flush=True,\n        )\n        sys.exit(1)\n    storage_path\
        \ = f\"s3://{ckpt_bucket}/{ckpt_prefix}\" if ckpt_prefix else f\"s3://{ckpt_bucket}/main/checkpoints\"\
        \n\nflags = [\n    \"--experiment-name\", str(exp[\"name\"]),\n    \"--dataset-version\"\
        , str(dataset[\"version\"]),\n    \"--dataset-source\", str(dataset[\"source\"\
        ]),\n    \"--model-variant\", str(model[\"variant\"]),\n    \"--training-epochs\"\
        , str(training[\"epochs\"]),\n    \"--training-batch-size\", str(training[\"\
        batch_size\"]),\n    \"--training-image-size\", str(training[\"image_size\"\
        ]),\n    \"--training-learning-rate\", str(training[\"learning_rate\"]),\n\
        \    \"--training-optimizer\", str(training[\"optimizer\"]),\n    \"--checkpointing-interval-epochs\"\
        , str(checkpointing[\"interval_epochs\"]),\n    \"--checkpointing-storage-path\"\
        , storage_path,\n    \"--early-stopping-patience\", str(early_stopping[\"\
        patience\"]),\n]\n\n# Optional dataset flags\nif dataset.get(\"lakefs_repo\"\
        ):\n    flags += [\"--dataset-lakefs-repo\", str(dataset[\"lakefs_repo\"])]\n\
        if dataset.get(\"lakefs_branch\"):\n    flags += [\"--dataset-lakefs-branch\"\
        , str(dataset[\"lakefs_branch\"])]\nif dataset.get(\"path_override\"):\n \
        \   flags += [\"--dataset-path-override\", str(dataset[\"path_override\"])]\n\
        if dataset.get(\"sample_size\") is not None:\n    flags += [\"--dataset-sample-size\"\
        , str(dataset[\"sample_size\"])]\nif dataset.get(\"seed\") is not None:\n\
        \    flags += [\"--dataset-seed\", str(dataset[\"seed\"])]\n\n# dataset_manifest_only:\
        \ always true (enforced above) — pass the flag\nflags += [\"--dataset-manifest-only\"\
        ]\n\n# Optional model flags\nif model.get(\"pretrained_weights\"):\n    flags\
        \ += [\"--model-pretrained-weights\", str(model[\"pretrained_weights\"])]\n\
        \n# Optional training flags (non-default values)\nif training.get(\"cos_lr\"\
        ) is not None:\n    flags += [\"--training-cos-lr\" if training[\"cos_lr\"\
        ] else \"--no-training-cos-lr\"]\nif training.get(\"lrf\") is not None:\n\
        \    flags += [\"--training-lrf\", str(training[\"lrf\"])]\nif training.get(\"\
        momentum\") is not None:\n    flags += [\"--training-momentum\", str(training[\"\
        momentum\"])]\nif training.get(\"weight_decay\") is not None:\n    flags +=\
        \ [\"--training-weight-decay\", str(training[\"weight_decay\"])]\nif training.get(\"\
        warmup_epochs\") is not None:\n    flags += [\"--training-warmup-epochs\"\
        , str(training[\"warmup_epochs\"])]\nif training.get(\"warmup_momentum\")\
        \ is not None:\n    flags += [\"--training-warmup-momentum\", str(training[\"\
        warmup_momentum\"])]\nif training.get(\"dropout\") is not None:\n    flags\
        \ += [\"--training-dropout\", str(training[\"dropout\"])]\nif training.get(\"\
        label_smoothing\") is not None:\n    flags += [\"--training-label-smoothing\"\
        , str(training[\"label_smoothing\"])]\nif training.get(\"nbs\") is not None:\n\
        \    flags += [\"--training-nbs\", str(training[\"nbs\"])]\nif training.get(\"\
        freeze\") is not None:\n    flags += [\"--training-freeze\", str(training[\"\
        freeze\"])]\nif training.get(\"amp\") is not None:\n    flags += [\"--training-amp\"\
        \ if training[\"amp\"] else \"--no-training-amp\"]\nif training.get(\"close_mosaic\"\
        ) is not None:\n    flags += [\"--training-close-mosaic\", str(training[\"\
        close_mosaic\"])]\nif training.get(\"seed\") is not None:\n    flags += [\"\
        --training-seed\", str(training[\"seed\"])]\nif training.get(\"deterministic\"\
        ) is not None:\n    flags += [\"--training-deterministic\" if training[\"\
        deterministic\"] else \"--no-training-deterministic\"]\nif training.get(\"\
        pose\") is not None:\n    flags += [\"--training-pose\", str(training[\"pose\"\
        ])]\nif training.get(\"kobj\") is not None:\n    flags += [\"--training-kobj\"\
        , str(training[\"kobj\"])]\nif training.get(\"box\") is not None:\n    flags\
        \ += [\"--training-box\", str(training[\"box\"])]\nif training.get(\"cls\"\
        ) is not None:\n    flags += [\"--training-cls\", str(training[\"cls\"])]\n\
        if training.get(\"dfl\") is not None:\n    flags += [\"--training-dfl\", str(training[\"\
        dfl\"])]\n\n# Optional checkpointing flags\nif checkpointing.get(\"resume_from\"\
        ):\n    flags += [\"--checkpointing-resume-from\", str(checkpointing[\"resume_from\"\
        ])]\n\n# Augmentation flags\naug = augmentation\nfor key, flag in [\n    (\"\
        hsv_h\", \"--aug-hsv-h\"), (\"hsv_s\", \"--aug-hsv-s\"), (\"hsv_v\", \"--aug-hsv-v\"\
        ),\n    (\"degrees\", \"--aug-degrees\"), (\"translate\", \"--aug-translate\"\
        ),\n    (\"scale\", \"--aug-scale\"), (\"shear\", \"--aug-shear\"),\n    (\"\
        perspective\", \"--aug-perspective\"), (\"flipud\", \"--aug-flipud\"),\n \
        \   (\"fliplr\", \"--aug-fliplr\"), (\"mosaic\", \"--aug-mosaic\"),\n    (\"\
        mixup\", \"--aug-mixup\"), (\"copy_paste\", \"--aug-copy-paste\"),\n    (\"\
        erasing\", \"--aug-erasing\"), (\"bgr\", \"--aug-bgr\"),\n]:\n    if aug.get(key)\
        \ is not None:\n        flags += [flag, str(aug[key])]\n\n# Optional experiment\
        \ description\nif exp.get(\"description\"):\n    flags += [\"--experiment-description\"\
        , str(exp[\"description\"])]\n\nprint(f\"[config-validation] Running: config-validation\
        \ {' '.join(flags)}\", flush=True)\nresult = subprocess.run([\"config-validation\"\
        ] + flags)\nsys.exit(result.returncode)\n"
      env:
