      - "import os, sys, subprocess, json, yaml, importlib\n\n# Config resolution:\
        \ PIPELINE_CONFIG (platform-injected) overrides PARAMS_YAML.\npipeline_config\
        \ = os.environ.get(\"PIPELINE_CONFIG\", \"\")\nparams_yaml = os.environ.get(\"\
        PARAMS_YAML\", \"\")\nraw = pipeline_config.strip() if pipeline_config.strip()\
        \ else params_yaml\n\nif not raw.strip():\n    print(\"ERROR: Neither PIPELINE_CONFIG\
        \ nor PARAMS_YAML is set.\", flush=True)\n    sys.exit(1)\ntry:\n    cfg =\
        \ yaml.safe_load(raw)\nexcept yaml.YAMLError as e:\n    print(f\"ERROR: Config\
        \ is not valid YAML: {e}\", flush=True)\n    sys.exit(1)\n\ntr_raw = os.environ.get(\"\
        TRAINING_RESULT\", \"\")\nif not tr_raw.strip():\n    print(\"ERROR: TRAINING_RESULT\
        \ input parameter is empty.\", flush=True)\n    sys.exit(1)\ntry:\n    tr\
        \ = json.loads(tr_raw)\nexcept json.JSONDecodeError as e:\n    print(f\"ERROR:\
        \ TRAINING_RESULT is not valid JSON: {e}\", flush=True)\n    sys.exit(1)\n\
        \nexp = cfg.get(\"experiment\") or {}\nquant = cfg.get(\"quantization\") or\
        \ {}\nmode = str(quant.get(\"mode\", \"ptq\"))\n\nmlflow_run_id = tr.get(\"\
        mlflow_run_id\")\nbest_checkpoint_s3 = tr.get(\"best_checkpoint_s3\")\nif\
        \ not mlflow_run_id:\n    print(f\"ERROR: training_result missing mlflow_run_id:\
        \ {tr}\", flush=True)\n    sys.exit(1)\n\n# Derive output bucket + lakeFS\
        \ branch from checkpoint URI.\n# s3://<repo>/<branch>/<path>: the branch is\
        \ the FIRST key segment; lakeFS\n# reads it as the branch, so the output prefix\
        \ must start with it (else lakeFS\n# treats e.g. 'quantization' as a non-existent\
        \ branch -> NoSuchBucket).\nif best_checkpoint_s3 and best_checkpoint_s3.startswith(\"\
        s3://\"):\n    _ckpt_parts = best_checkpoint_s3[5:].split(\"/\")\n    output_bucket\
        \ = _ckpt_parts[0]\n    lakefs_branch = _ckpt_parts[1] if len(_ckpt_parts)\
        \ > 1 else \"main\"\nelse:\n    output_bucket = os.environ.get(\"CHECKPOINT_BUCKET\"\
        , \"\")\n    lakefs_branch = os.environ.get(\"LAKEFS_BRANCH\", \"main\")\n\
        if not output_bucket:\n    print(\"ERROR: cannot derive output bucket from\
        \ checkpoint URI and CHECKPOINT_BUCKET is unset.\", flush=True)\n    sys.exit(1)\n\
        \n# Reconstruct /work/dataset so model-quantization can discover data.yaml\n\
        # and download calibration/parity frames from S3.\nos.makedirs(\"/work/dataset\"\
        , exist_ok=True)\ndata_yaml_content = os.environ.get(\"DATA_YAML\", \"\")\n\
        if data_yaml_content.strip():\n    with open(\"/work/dataset/data.yaml\",\
        \ \"w\") as fh:\n        fh.write(data_yaml_content)\nmanifest_summary = os.environ.get(\"\
        MANIFEST_SUMMARY\", \"\")\nif manifest_summary.strip():\n    with open(\"\
        /work/dataset/dataset_manifest.json\", \"w\") as fh:\n        fh.write(manifest_summary)\n\
        \n# Download calibration + parity frames from S3 to /work/dataset/images/val/.\n\
        # The manifest_summary contains bucket and prefix; we list image keys and\n\
        # download the first calibration_frames + parity_frames files.\ntry:\n   \
        \ import boto3\n    from botocore.config import Config as BotoConfig\n   \
        \ boto_cfg = BotoConfig(retries={\"max_attempts\": 3, \"mode\": \"adaptive\"\
        })\n\n    lakefs_endpoint = os.environ.get(\"LAKEFS_ENDPOINT\", \"\")\n  \
        \  lakefs_key = os.environ.get(\"LAKEFS_ACCESS_KEY\", \"\")\n    lakefs_secret\
        \ = os.environ.get(\"LAKEFS_SECRET_KEY\", \"\")\n\n    if lakefs_endpoint\
        \ and lakefs_key and lakefs_secret:\n        s3 = boto3.client(\"s3\", endpoint_url=lakefs_endpoint,\n\
        \                          aws_access_key_id=lakefs_key,\n               \
        \           aws_secret_access_key=lakefs_secret,\n                       \
        \   region_name=None, config=boto_cfg)\n    else:\n        s3 = boto3.client(\"\
        s3\",\n                          endpoint_url=os.environ.get(\"S3_ENDPOINT_URL\"\
        ),\n                          aws_access_key_id=os.environ.get(\"AWS_ACCESS_KEY_ID\"\
        ),\n                          aws_secret_access_key=os.environ.get(\"AWS_SECRET_ACCESS_KEY\"\
        ),\n                          region_name=os.environ.get(\"AWS_DEFAULT_REGION\"\
        ),\n                          config=boto_cfg)\n\n    ms = json.loads(manifest_summary)\
        \ if manifest_summary.strip() else {}\n    ds_bucket = ms.get(\"bucket\",\
        \ \"\")\n    ds_prefix = ms.get(\"prefix\", \"\").rstrip(\"/\")\n\n    if\
        \ ds_bucket and ds_prefix:\n        max_download = int(quant.get(\"calibration_frames\"\
        , 512)) + int(quant.get(\"parity_frames\", 100))\n        images_dir = \"\
        /work/dataset/images/val\"\n        os.makedirs(images_dir, exist_ok=True)\n\
        \n        paginator = s3.get_paginator(\"list_objects_v2\")\n        image_exts\
        \ = {\".jpg\", \".jpeg\", \".png\", \".bmp\"}\n        # Labels go beside\
        \ the images so YOLO's model.val (the FP32-vs-INT8\n        # mAP-delta) has\
        \ ground truth. YOLO derives the label path by\n        # swapping /images/\
        \ -> /labels/ and the extension -> .txt. Without\n        # this, val has\
        \ 0 labels and every mAP comes back 0.\n        labels_dir = \"/work/dataset/labels/val\"\
        \n        os.makedirs(labels_dir, exist_ok=True)\n        downloaded = 0\n\
        \        labels_dl = 0\n        for page in paginator.paginate(Bucket=ds_bucket,\
        \ Prefix=f\"{ds_prefix}/images/\"):\n            for obj in page.get(\"Contents\"\
        , []):\n                key = obj[\"Key\"]\n                ext = os.path.splitext(key)[1].lower()\n\
        \                if ext not in image_exts:\n                    continue\n\
        \                stem = os.path.splitext(os.path.basename(key))[0]\n     \
        \           local_path = os.path.join(images_dir, os.path.basename(key))\n\
        \                s3.download_file(ds_bucket, key, local_path)\n          \
        \      downloaded += 1\n                # Best-effort matching label; frames\
        \ without one are valid\n                # backgrounds — skip silently.\n\
        \                label_key = os.path.splitext(\n                    key.replace(\"\
        /images/\", \"/labels/\", 1)\n                )[0] + \".txt\"\n          \
        \      try:\n                    s3.download_file(\n                     \
        \   ds_bucket, label_key,\n                        os.path.join(labels_dir,\
        \ stem + \".txt\"),\n                    )\n                    labels_dl\
        \ += 1\n                except Exception:\n                    pass\n    \
        \            if downloaded >= max_download:\n                    break\n \
        \           if downloaded >= max_download:\n                break\n      \
        \  print(\n            f\"[model-quantization] Downloaded {downloaded} frames\
        \ \"\n            f\"+ {labels_dl} labels.\",\n            flush=True,\n \
        \       )\n    else:\n        print(\"[model-quantization] WARNING: manifest_summary\
        \ missing bucket/prefix — calibration frames not downloaded.\", flush=True)\n\
        except Exception as e:\n    print(f\"[model-quantization] WARNING: frame download\
        \ failed: {e}. Proceeding — CLI will fail if dataset is needed.\", flush=True)\n\
        \nos.makedirs(\"/work/quant_output\", exist_ok=True)\n\nflags = [\n    \"\
        --mode\", mode,\n    \"--source-mlflow-run-id\", mlflow_run_id,\n    \"--dataset-dir\"\
        , \"/work/dataset\",\n    \"--output-dir\", \"/work/quant_output\",\n    \"\
        --output-bucket\", output_bucket,\n    \"--output-prefix\", f\"{lakefs_branch}/{quant.get('output_prefix',\
        \ 'quantization/model')}\",\n    \"--experiment-name\", str(exp.get(\"name\"\
        , \"quantization\")),\n    \"--image-size\", str(quant.get(\"image_size\"\
        , 640)),\n    \"--calibration-frames\", str(quant.get(\"calibration_frames\"\
        , 512)),\n    \"--calibration-seed\", str(quant.get(\"calibration_seed\",\
        \ 42)),\n    \"--parity-frames\", str(quant.get(\"parity_frames\", 100)),\n\
        \    \"--parity-max-abs-error\", str(quant.get(\"parity_max_abs_error\", 0.05)),\n\
        ]\n\nif mode == \"ptq\":\n    if not best_checkpoint_s3:\n        print(\"\
        ERROR: best_checkpoint_s3 missing in training_result for PTQ mode.\", flush=True)\n\
        \        sys.exit(1)\n    flags += [\"--fp32-checkpoint-path\", best_checkpoint_s3]\n\
        \nelif mode == \"qat\":\n    qat_raw = os.environ.get(\"QAT_RESULT\", \"\"\
        )\n    if not qat_raw.strip():\n        print(\"ERROR: QAT_RESULT is empty\
        \ but mode=qat — qat-finetune must have run.\", flush=True)\n        sys.exit(1)\n\
        \    try:\n        qr = json.loads(qat_raw)\n    except json.JSONDecodeError\
        \ as e:\n        print(f\"ERROR: QAT_RESULT is not valid JSON: {e}\", flush=True)\n\
        \        sys.exit(1)\n    tflite_uri = qr.get(\"tflite_s3_uri\")\n    qat_run_id\
        \ = qr.get(\"mlflow_run_id\")\n    if not tflite_uri:\n        print(f\"ERROR:\
        \ qat_result missing tflite_s3_uri: {qr}\", flush=True)\n        sys.exit(1)\n\
        \    flags += [\"--tflite-s3-uri\", tflite_uri]\n    if qat_run_id:\n    \
        \    flags += [\"--qat-run-id\", qat_run_id]\n    if best_checkpoint_s3:\n\
        \        flags += [\"--fp32-checkpoint-path\", best_checkpoint_s3]\n\nprint(f\"\
        [model-quantization] Running: model-quantization run {' '.join(flags)}\",\
        \ flush=True)\nresult = subprocess.run([\"model-quantization\"] + flags)\n\
        sys.exit(result.returncode)\n"
