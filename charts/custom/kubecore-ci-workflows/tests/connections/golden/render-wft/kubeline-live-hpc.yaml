        \ else params_yaml\n\nif not raw.strip():\n    print(\"ERROR: Neither PIPELINE_CONFIG\
        \ nor PARAMS_YAML is set.\", flush=True)\n    sys.exit(1)\ntry:\n    cfg =\
        \ yaml.safe_load(raw)\nexcept yaml.YAMLError as e:\n    print(f\"ERROR: Config\
        \ is not valid YAML: {e}\", flush=True)\n    sys.exit(1)\n\ndataset = cfg.get(\"\
        dataset\") or {}\n\nflags = [\n    \"--version\", str(dataset[\"version\"\
        ]),\n    \"--source\", str(dataset[\"source\"]),\n    \"--output-dir\", \"\
        /work/dataset\",\n    \"--manifest-only\",\n]\n\nif dataset.get(\"lakefs_repo\"\
        ):\n    flags += [\"--lakefs-repo\", str(dataset[\"lakefs_repo\"])]\nif dataset.get(\"\
        lakefs_branch\"):\n    flags += [\"--lakefs-branch\", str(dataset[\"lakefs_branch\"\
        ])]\nif dataset.get(\"path_override\"):\n    flags += [\"--path-override\"\
        , str(dataset[\"path_override\"])]\nif dataset.get(\"sample_size\") is not\
        \ None:\n    flags += [\"--sample-size\", str(dataset[\"sample_size\"]), \"\
        --seed\", str(dataset.get(\"seed\", 42))]\n\nprint(f\"[dataset-loading] Running:\
        \ dataset-loading {' '.join(flags)}\", flush=True)\nresult = subprocess.run([\"\
        dataset-loading\"] + flags)\nif result.returncode != 0:\n    sys.exit(result.returncode)\n\
        \n# Read the full manifest written by the CLI and extract a compact\n# summary\
        \ safe for Argo parameter passing (no key lists).\nmanifest_path = \"/work/dataset/dataset_manifest.json\"\
        \ntry:\n    with open(manifest_path) as fh:\n        manifest = json.load(fh)\n\
        except Exception as e:\n    print(f\"ERROR: Could not read {manifest_path}:\
        \ {e}\", flush=True)\n    sys.exit(1)\n\nbucket = manifest.get(\"bucket\"\
        )\nprefix = manifest.get(\"prefix\")\nif not bucket or not prefix:\n    print(f\"\
        ERROR: manifest missing 'bucket' or 'prefix': {manifest}\", flush=True)\n\
        \    sys.exit(1)\n\n# label_keys sentinel: non-empty dict signals to model-training\
