        : True} if label_keys_raw else {}\n\nsummary = {\"bucket\": bucket, \"prefix\"\
        : prefix, \"label_keys\": label_keys_sentinel}\nsummary_path = \"/work/dataset/manifest_summary.json\"\
        \nwith open(summary_path, \"w\") as fh:\n    json.dump(summary, fh, separators=(\"\
        ,\", \":\"))\nprint(f\"[dataset-loading] Wrote manifest summary to {summary_path}:\
        \ bucket={bucket} prefix={prefix}\", flush=True)\nPYEOF\n"
