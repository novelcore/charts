      command:
      - python
      - -c
      args:
      - "import os, sys, subprocess, json, yaml\n\n# Config resolution: PIPELINE_CONFIG\
        \ (platform-injected) overrides PARAMS_YAML.\npipeline_config = os.environ.get(\"\
        PIPELINE_CONFIG\", \"\")\nparams_yaml = os.environ.get(\"PARAMS_YAML\", \"\
        \")\nraw = pipeline_config.strip() if pipeline_config.strip() else params_yaml\n\
        \nif not raw.strip():\n    print(\"ERROR: Neither PIPELINE_CONFIG nor PARAMS_YAML\
        \ is set.\", flush=True)\n    sys.exit(1)\ntry:\n    cfg = yaml.safe_load(raw)\n\
        except yaml.YAMLError as e:\n    print(f\"ERROR: Config is not valid YAML:\
        \ {e}\", flush=True)\n    sys.exit(1)\n\n# Reconstruct /work/dataset from\
        \ input parameters\nos.makedirs(\"/work/dataset\", exist_ok=True)\n\ndata_yaml\
        \ = os.environ.get(\"DATA_YAML\", \"\")\nif not data_yaml.strip():\n    print(\"\
        ERROR: DATA_YAML input parameter is empty.\", flush=True)\n    sys.exit(1)\n\
        with open(\"/work/dataset/data.yaml\", \"w\") as fh:\n    fh.write(data_yaml)\n\
        \nmanifest_summary = os.environ.get(\"MANIFEST_SUMMARY\", \"\")\nif not manifest_summary.strip():\n\
        \    print(\"ERROR: MANIFEST_SUMMARY input parameter is empty.\", flush=True)\n\
        \    sys.exit(1)\n# Write summary as dataset_manifest.json so model_training\
        \ auto-detects\n# the S3 source (bucket + prefix) and streaming mode (label_keys\
        \ presence).\nwith open(\"/work/dataset/dataset_manifest.json\", \"w\") as\
        \ fh:\n    fh.write(manifest_summary)\n\nexp = cfg.get(\"experiment\") or\
        \ {}\nmodel = cfg.get(\"model\") or {}\ntraining = cfg.get(\"training\") or\
        \ {}\ncheckpointing = cfg.get(\"checkpointing\") or {}\nearly_stopping = cfg.get(\"\
        early_stopping\") or {}\naugmentation = cfg.get(\"augmentation\") or {}\n\
        export_cfg = cfg.get(\"export\") or {}\n\n# Precedence: explicit param wins;\
        \ empty param falls back to platform env.\n# CHECKPOINT_BUCKET/CHECKPOINT_PREFIX\
        \ are injected by render-wft from the\n# k8smlapp pipeline-context. model-training\
        \ takes --checkpoint-bucket and\n# --checkpoint-prefix directly so no s3://\
        \ parsing is needed in that path.\nstorage_path = str(checkpointing.get(\"\
        storage_path\", \"\") or \"\").strip()\nif storage_path.startswith(\"s3://\"\
        ):\n    # Explicit override: parse bucket/prefix from the s3:// URI.\n   \
        \ parts = storage_path[5:].split(\"/\", 1)\n    checkpoint_bucket = parts[0]\n\
        \    checkpoint_prefix = parts[1].rstrip(\"/\") if len(parts) > 1 else \"\
        main/checkpoints\"\nelse:\n    # Platform-derived: use env vars injected by\
        \ render-wft.\n    checkpoint_bucket = os.environ.get(\"CHECKPOINT_BUCKET\"\
        , \"\").strip()\n    checkpoint_prefix = os.environ.get(\"CHECKPOINT_PREFIX\"\
        , \"main/checkpoints\").strip()\n    if not checkpoint_bucket:\n        print(\n\
        \            \"ERROR: checkpointing-storage-path is empty and CHECKPOINT_BUCKET\
        \ env \"\n            \"is not set. The platform should inject CHECKPOINT_BUCKET/CHECKPOINT_PREFIX\
        \ \"\n            \"from the project lakeFS repository via render-wft. Either\
        \ set \"\n            \"checkpointing-storage-path explicitly or ensure the\
        \ k8smlapp composition \"\n            \"version includes the checkpoints\
        \ block in pipeline-context.yaml.\",\n            flush=True,\n        )\n\
        \        sys.exit(1)\n\nflags = [\n    \"--model-variant\", str(model[\"variant\"\
        ]),\n    \"--experiment-name\", str(exp[\"name\"]),\n    \"--dataset-dir\"\
        , \"/work/dataset\",\n    \"--output-dir\", \"/work/output\",\n    \"--source\"\
        , \"s3\",\n    \"--epochs\", str(training[\"epochs\"]),\n    \"--batch-size\"\
        , str(training[\"batch_size\"]),\n    \"--image-size\", str(training[\"image_size\"\
        ]),\n    \"--learning-rate\", str(training[\"learning_rate\"]),\n    \"--optimizer\"\
        , str(training[\"optimizer\"]),\n    \"--checkpoint-interval\", str(checkpointing[\"\
        interval_epochs\"]),\n    \"--checkpoint-bucket\", checkpoint_bucket,\n  \
        \  \"--checkpoint-prefix\", checkpoint_prefix,\n    \"--patience\", str(early_stopping[\"\
        patience\"]),\n]\n\n# Optional training flags\nif training.get(\"cos_lr\"\
        ) is not None:\n    flags += [\"--cos-lr\" if training[\"cos_lr\"] else \"\
        --no-cos-lr\"]\nif training.get(\"lrf\") is not None:\n    flags += [\"--lrf\"\
        , str(training[\"lrf\"])]\nif training.get(\"momentum\") is not None:\n  \
        \  flags += [\"--momentum\", str(training[\"momentum\"])]\nif training.get(\"\
        weight_decay\") is not None:\n    flags += [\"--weight-decay\", str(training[\"\
        weight_decay\"])]\nif training.get(\"warmup_epochs\") is not None:\n    flags\
        \ += [\"--warmup-epochs\", str(training[\"warmup_epochs\"])]\nif training.get(\"\
        warmup_momentum\") is not None:\n    flags += [\"--warmup-momentum\", str(training[\"\
        warmup_momentum\"])]\nif training.get(\"dropout\") is not None:\n    flags\
        \ += [\"--dropout\", str(training[\"dropout\"])]\nif training.get(\"label_smoothing\"\
        ) is not None:\n    flags += [\"--label-smoothing\", str(training[\"label_smoothing\"\
        ])]\nif training.get(\"nbs\") is not None:\n    flags += [\"--nbs\", str(training[\"\
        nbs\"])]\nif training.get(\"freeze\") is not None:\n    flags += [\"--freeze\"\
        , str(training[\"freeze\"])]\nif training.get(\"amp\") is not None:\n    flags\
        \ += [\"--amp\" if training[\"amp\"] else \"--no-amp\"]\nif training.get(\"\
        close_mosaic\") is not None:\n    flags += [\"--close-mosaic\", str(training[\"\
        close_mosaic\"])]\nif training.get(\"seed\") is not None:\n    flags += [\"\
        --seed\", str(training[\"seed\"])]\nif training.get(\"deterministic\") is\
        \ not None:\n    flags += [\"--deterministic\" if training[\"deterministic\"\
        ] else \"--no-deterministic\"]\nif training.get(\"pose\") is not None:\n \
        \   flags += [\"--pose\", str(training[\"pose\"])]\nif training.get(\"kobj\"\
        ) is not None:\n    flags += [\"--kobj\", str(training[\"kobj\"])]\nif training.get(\"\
        box\") is not None:\n    flags += [\"--box\", str(training[\"box\"])]\nif\
        \ training.get(\"cls\") is not None:\n    flags += [\"--cls\", str(training[\"\
        cls\"])]\nif training.get(\"dfl\") is not None:\n    flags += [\"--dfl\",\
        \ str(training[\"dfl\"])]\n\n# Optional weight init / resume\nif model.get(\"\
        pretrained_weights\"):\n    flags += [\"--pretrained-weights\", str(model[\"\
        pretrained_weights\"])]\nif checkpointing.get(\"resume_from\"):\n    flags\
        \ += [\"--resume-from\", str(checkpointing[\"resume_from\"])]\n\n# disk-cache-gb:\
        \ cap S3 streaming cache for ephemeral pod storage\nflags += [\"--disk-cache-gb\"\
        , \"8.0\"]\n\n# Augmentation\naug = augmentation\nfor key, flag in [\n   \
        \ (\"hsv_h\", \"--hsv-h\"), (\"hsv_s\", \"--hsv-s\"), (\"hsv_v\", \"--hsv-v\"\
        ),\n    (\"degrees\", \"--degrees\"), (\"translate\", \"--translate\"),\n\
        \    (\"scale\", \"--scale\"), (\"shear\", \"--shear\"),\n    (\"perspective\"\
        , \"--perspective\"), (\"flipud\", \"--flipud\"),\n    (\"fliplr\", \"--fliplr\"\
        ), (\"mosaic\", \"--mosaic\"),\n    (\"mixup\", \"--mixup\"), (\"copy_paste\"\
        , \"--copy-paste\"),\n    (\"erasing\", \"--erasing\"), (\"bgr\", \"--bgr\"\
        ),\n]:\n    if aug.get(key) is not None:\n        flags += [flag, str(aug[key])]\n\
        \n# Export flags\nif export_cfg.get(\"enabled\"):\n    flags += [\"--export\"\
        ]\n    formats = export_cfg.get(\"formats\")\n    if formats:\n        flags\
        \ += [\"--export-formats\", \",\".join(formats)]\n    precisions = export_cfg.get(\"\
        precisions\")\n    if precisions:\n        flags += [\"--export-precisions\"\
        , \",\".join(precisions)]\n\nprint(f\"[model-training] Running: model-training\
        \ {' '.join(flags)}\", flush=True)\nresult = subprocess.run([\"model-training\"\
        ] + flags)\nsys.exit(result.returncode)\n"
      env:
