              \"--mosaic\"),\n    (\"mixup\", \"--mixup\"), (\"copy_paste\", \"--copy-paste\"),\n    (\"erasing\",
              \"--erasing\"), (\"bgr\", \"--bgr\"),\n]:\n    if aug.get(key) is not
              None:\n        flags += [flag, str(aug[key])]\n\n# Export flags\nif
              export_cfg.get(\"enabled\"):\n    flags += [\"--export\"]\n    formats
              = export_cfg.get(\"formats\")\n    if formats:\n        flags += [\"--export-formats\",
              \",\".join(formats)]\n    precisions = export_cfg.get(\"precisions\")\n    if
