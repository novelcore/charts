apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: kubeline-live-hpc-pipeline
  namespace: PLACEHOLDER-data-room-runtime
  annotations:
    platform.kubecore.io/cost-tracking: enabled
    platform.kubecore.io/pipeline: kubeline-live-hpc
    platform.kubecore.io/compute-model: live-ephemeral-nodegroups
    platform.kubecore.io/generated-by: ml-ci-build/render-wft
    platform.kubecore.io/rendered-from-commit-time: '1700000000'
  labels:
    platform.kubecore.io/project: data-room
    platform.kubecore.io/app: kubeline-live-hpc
    platform.kubecore.io/managed-by: kubecore-ci
spec:
  serviceAccountName: argo-workflow
  entrypoint: kubeline-live-hpc-pipeline
  onExit: destroy-nodegroups
  arguments:
    parameters:
    - name: pipeline-info
      value: "HOW TO RUN: defaults below are runnable as-is — just press Submit.\n\
        PER-STEP COMPUTE: pick a {step}-class for each step. Each step runs on its\
        \ OWN dedicated ephemeral GKE node (the WHOLE machine, sole-tenant) created\
        \ just for this run and destroyed when it ends.\nPER-STEP DISK: {step}-disk-gb\
        \ sizes that node's pd-ssd boot/data disk (default 100 GiB — raise it for\
        \ large datasets/checkpoints).\nClasses suffixed \"(STOCKOUT)\" are temporarily\
        \ unavailable in-region; picking one FAILS the run at the guard step.\nLIVE\
        \ CATALOG (region PLACEHOLDER-region):\nCPU:\n  • cpu-standard — n2-standard-8\n\
        GPU:\n  • gpu-t4 — n1-standard-8\n(This field is informational — leave it\
        \ unchanged.)"
      description: 'Read-only: live pool machine catalog + how to fill this form.
        Leave unchanged.'
    - name: config
      value: ''
      description: 'ADVANCED: full pipeline config YAML (schema pipeline_config.example.yaml).
        When non-empty it OVERRIDES all individual parameters above — intended for
        scripted submissions (argo submit -p config=...).'
    - name: experiment-name
      value: object-pose-v1-yolov8n
      description: MLflow experiment name and S3 checkpoint path prefix.
    - name: experiment-description
      value: ''
      description: Optional free-text description stored in the MLflow run.
    - name: dataset-ref
      value: main
      description: Dataset (lakeFS ref) to train on — rendered as a dropdown from
        the dataset catalog.
    - name: dataset-source
      value: lakefs
      description: 'Storage backend for the dataset: ''lakefs'' or ''s3''.'
    - name: dataset-version
      value: ''
      description: Provenance tag recorded in MLflow (derived from dataset-ref). Not
        a path.
    - name: dataset-path-override
      value: ''
      description: Optional s3:// override. Empty = use the picked dataset-ref.
    - name: dataset-sample-size
      value: ''
      description: Integer sample size for reproducible subsets. Empty = full dataset.
    - name: dataset-seed
      value: '42'
      description: Random seed for reproducible dataset sampling.
    - name: model-variant
      value: yolov8n-pose.pt
      description: YOLO pose model variant file. Determines architecture and parameter
        count.
    - name: pretrained-weights
      value: ''
      description: S3 URI to custom .pt weights for weight-only init. Empty = use
        model-variant's bundled weights.
    - name: epochs
      value: '100'
      description: Total training epochs.
    - name: batch-size
      value: '16'
      description: Training batch size. Use -1 for Ultralytics auto-batch.
    - name: image-size
      value: '640'
      description: Input image resolution in pixels (must be a multiple of 32).
    - name: learning-rate
      value: '0.01'
      description: Initial learning rate (Ultralytics lr0).
    - name: cos-lr
      value: 'true'
      description: Use cosine learning rate schedule.
    - name: lrf
      value: '0.01'
      description: 'Final LR ratio: final_lr = learning_rate * lrf. Must be in (0,
        1].'
    - name: optimizer
      value: SGD
      description: Gradient optimizer. SGD is the Ultralytics default for YOLO.
    - name: momentum
      value: '0.937'
      description: SGD momentum or Adam beta1.
    - name: weight-decay
      value: '0.0005'
      description: Optimizer weight decay (L2 regularization coefficient).
    - name: warmup-epochs
      value: '3.0'
      description: Number of LR warmup epochs.
    - name: warmup-momentum
      value: '0.8'
      description: Initial momentum during warmup (rises to `momentum` by end of warmup).
    - name: dropout
      value: '0.0'
      description: Dropout rate applied in the classifier head [0.0, 1.0).
    - name: label-smoothing
      value: '0.0'
      description: Label smoothing epsilon [0.0, 1.0). Reduces overconfidence.
    - name: nbs
      value: '64'
      description: Nominal batch size. Ultralytics scales gradients so effective LR
        matches this batch size.
    - name: freeze
      value: ''
      description: Freeze the first N backbone layers. Empty = train all layers.
    - name: amp
      value: 'true'
      description: Enable Automatic Mixed Precision (FP16). Halves GPU memory use.
    - name: close-mosaic
      value: '10'
      description: Disable mosaic augmentation for the last N epochs (0 = never disable).
    - name: training-seed
      value: '0'
      description: Global training RNG seed (separate from dataset-seed).
    - name: deterministic
      value: 'true'
      description: Enable cuDNN deterministic mode. Slight speed penalty; ensures
        reproducibility.
    - name: pose
      value: '12.0'
      description: Keypoint regression loss gain. Primary lever for object keypoint
        accuracy.
    - name: kobj
      value: '2.0'
      description: Keypoint objectness loss gain.
    - name: box
      value: '7.5'
      description: Bounding-box regression loss gain.
    - name: cls
      value: '0.5'
      description: Classification loss gain.
    - name: dfl
      value: '1.5'
      description: Distribution Focal Loss gain.
    - name: early-stopping-patience
      value: '50'
      description: Epochs without improvement before early stopping triggers.
    - name: checkpointing-interval-epochs
      value: '10'
      description: Upload an intermediate checkpoint to S3 every N epochs.
    - name: checkpointing-storage-path
      value: ''
      description: Override checkpoint location (s3://bucket/prefix). Empty = platform-derived
        (project lakeFS repository, main/checkpoints).
    - name: checkpoint-resume-from
      value: ''
      description: 'Checkpoint to resume from: empty = start fresh, ''auto'' = latest,
        or a full S3 path.'
    - name: aug-hsv-h
      value: '0.015'
      description: HSV hue augmentation range [0.0, 1.0].
    - name: aug-hsv-s
      value: '0.7'
      description: HSV saturation augmentation range [0.0, 1.0].
    - name: aug-hsv-v
      value: '0.4'
      description: HSV value augmentation range [0.0, 1.0].
    - name: aug-degrees
      value: '0.0'
      description: Random rotation range in degrees. Keep 0.0 for pose (keypoints
        are rotation-sensitive).
    - name: aug-translate
      value: '0.1'
      description: Random translation fraction of image size.
    - name: aug-scale
      value: '0.5'
      description: Random scale gain (multiplicative).
    - name: aug-shear
      value: '0.0'
      description: Random shear range in degrees.
    - name: aug-perspective
      value: '0.0'
      description: Random perspective warp [0.0, 0.001]. Values > 0.001 cause severe
        keypoint displacement.
    - name: aug-flipud
      value: '0.0'
      description: Vertical flip probability. Keep 0.0 for object (no defined up direction
        has defined 'up').
    - name: aug-fliplr
      value: '0.0'
      description: Horizontal flip probability. Keep 0.0 for object (no left-right
        symmetry in canonical pose).
    - name: aug-mosaic
      value: '1.0'
      description: Mosaic augmentation probability [0.0, 1.0]. Disabled for last `close-mosaic`
        epochs.
    - name: aug-mixup
      value: '0.0'
      description: MixUp augmentation probability [0.0, 1.0].
    - name: aug-copy-paste
      value: '0.0'
      description: Segment copy-paste augmentation probability [0.0, 1.0].
    - name: aug-erasing
      value: '0.4'
      description: Random erasing probability [0.0, 0.9].
    - name: aug-bgr
      value: '0.0'
      description: BGR channel flip probability [0.0, 1.0].
    - name: export-enabled
      value: 'false'
      description: Enable post-training model export (TensorRT/ONNX).
    - name: export-formats
      value: engine
      description: 'Comma-separated export formats: ''engine'' (TensorRT) and/or ''onnx''.
        Only used when export-enabled=true.'
    - name: export-precisions
      value: fp16
      description: 'Comma-separated precisions: ''fp16'' and/or ''int8''. Only used
        when export-enabled=true.'
    - name: quantization-mode
      value: none
      description: 'Quantization mode: ''none'' skips both qat-finetune and model-quantization;
        ''ptq'' runs Ultralytics INT8 export; ''qat'' runs PT2E QAT fine-tune then
        model-quantization.'
    - name: quantization-image-size
      value: '640'
      description: Input image size for quantization. Must match training image-size.
    - name: quantization-calibration-frames
      value: '512'
      description: Number of calibration frames sampled from the dataset for PTQ/QAT
        calibration.
    - name: quantization-calibration-seed
      value: '42'
      description: RNG seed for deterministic calibration frame sampling (FR-M-04).
    - name: quantization-parity-frames
      value: '100'
      description: Number of frames for the INT8 vs FP32 parity check.
    - name: quantization-parity-max-abs-error
      value: '0.05'
      description: Maximum allowed max-absolute-error in the parity check. Run fails
        if this threshold is exceeded.
    - name: quantization-output-prefix
      value: quantization
      description: S3 key prefix for quantized TFLite artifacts (e.g. 'quantization/exp-001').
    - name: qat-epochs
      value: '10'
      description: Number of QAT fine-tune epochs. Only used when quantization-mode=qat.
    - name: qat-lr
      value: '0.0001'
      description: Learning rate for QAT fine-tuning. Only used when quantization-mode=qat.
    - name: registered-model-name
      value: ''
      description: 'MLflow registered model name. Empty = use REGISTERED_MODEL_NAME
        env var (default: object-pose-yolo).'
    - name: promote-to
      value: ''
      description: 'Transition the registered model version to this stage: empty =
        no promotion, ''Staging'', or ''Production''.'
    - name: image-config-validation
      valueFrom:
        configMapKeyRef:
          name: kubeline-live-hpc-pipeline-images
          key: config-validation
    - name: image-dataset-loading
      valueFrom:
        configMapKeyRef:
          name: kubeline-live-hpc-pipeline-images
          key: dataset-loading
    - name: image-model-training
      valueFrom:
        configMapKeyRef:
          name: kubeline-live-hpc-pipeline-images
          key: model-training
    - name: image-qat-finetune
      valueFrom:
        configMapKeyRef:
          name: kubeline-live-hpc-pipeline-images
          key: qat-finetune
    - name: image-model-quantization
      valueFrom:
        configMapKeyRef:
          name: kubeline-live-hpc-pipeline-images
          key: model-quantization
    - name: image-model-registration
      valueFrom:
        configMapKeyRef:
          name: kubeline-live-hpc-pipeline-images
          key: model-registration
    - name: config-validation-class
      value: cpu-standard
      description: 'Compute class (dedicated ephemeral node) for the config-validation
        step. Allowed: cpu-standard — n2-standard-8. Classes marked (STOCKOUT) are
        unavailable now.'
    - name: config-validation-disk-gb
      value: '100'
      description: pd-ssd disk size (GiB) for the config-validation step's ephemeral
        node. Sized for the dataset + checkpoints this step reads/writes; default
        100.
    - name: dataset-loading-class
      value: cpu-standard
      description: 'Compute class (dedicated ephemeral node) for the dataset-loading
        step. Allowed: cpu-standard — n2-standard-8. Classes marked (STOCKOUT) are
        unavailable now.'
    - name: dataset-loading-disk-gb
      value: '100'
      description: pd-ssd disk size (GiB) for the dataset-loading step's ephemeral
        node. Sized for the dataset + checkpoints this step reads/writes; default
        100.
    - name: model-training-class
      value: gpu-t4
      description: 'Compute class (dedicated ephemeral node) for the model-training
        step. Allowed: gpu-t4 — n1-standard-8. Classes marked (STOCKOUT) are unavailable
        now.'
    - name: model-training-disk-gb
      value: '100'
      description: pd-ssd disk size (GiB) for the model-training step's ephemeral
        node. Sized for the dataset + checkpoints this step reads/writes; default
        100.
    - name: qat-finetune-class
      value: gpu-t4
      description: 'Compute class (dedicated ephemeral node) for the qat-finetune
        step. Allowed: gpu-t4 — n1-standard-8. Classes marked (STOCKOUT) are unavailable
        now.'
    - name: qat-finetune-disk-gb
      value: '100'
      description: pd-ssd disk size (GiB) for the qat-finetune step's ephemeral node.
        Sized for the dataset + checkpoints this step reads/writes; default 100.
    - name: model-quantization-class
      value: cpu-standard
      description: 'Compute class (dedicated ephemeral node) for the model-quantization
        step. Allowed: cpu-standard — n2-standard-8. Classes marked (STOCKOUT) are
        unavailable now.'
    - name: model-quantization-disk-gb
      value: '100'
      description: pd-ssd disk size (GiB) for the model-quantization step's ephemeral
        node. Sized for the dataset + checkpoints this step reads/writes; default
        100.
    - name: model-registration-class
      value: cpu-standard
      description: 'Compute class (dedicated ephemeral node) for the model-registration
        step. Allowed: cpu-standard — n2-standard-8. Classes marked (STOCKOUT) are
        unavailable now.'
    - name: model-registration-disk-gb
      value: '100'
      description: pd-ssd disk size (GiB) for the model-registration step's ephemeral
        node. Sized for the dataset + checkpoints this step reads/writes; default
        100.
    - name: registered-model-name
      value: kubeline-live-hpc-model
    - name: promote-to
      value: ''
    - name: node-service-account
      value: PLACEHOLDER-node-sa@PLACEHOLDER-gcp-project.iam.gserviceaccount.com
    - name: gcp-project
      value: PLACEHOLDER-gcp-project
    - name: gcp-cluster
      value: PLACEHOLDER-cluster
    - name: gcp-location
      value: PLACEHOLDER-location
    - name: gcp-location-type
      value: region
    - name: target
      value: gcp
      enum:
      - gcp
      - meluxina
      description: Computation target for this run. gcp = in-cluster pools; meluxina
        = HPC burst (the GPU training step runs on meluxina via Slurm).
  templates:
  - name: create-nodegroups
    metadata:
      labels:
        platform.kubecore.io/pipeline: kubeline-live-hpc
        platform.kubecore.io/nodepool-lifecycle: create
    serviceAccountName: operate-workflow-sa
    nodeSelector:
      platform.kubecore.io/nodegroup-type: ci-standard
      platform.kubecore.io/project: data-room
    tolerations: &id001
    - key: platform.kubecore.io/ml-workload
      operator: Exists
      effect: NoSchedule
    inputs:
      parameters:
      - name: gcp-project
      - name: gcp-cluster
      - name: gcp-location
      - name: gcp-location-type
      - name: node-service-account
      - name: quantization-mode
      - name: config-validation-class
      - name: config-validation-disk-gb
      - name: dataset-loading-class
      - name: dataset-loading-disk-gb
      - name: model-training-class
      - name: model-training-disk-gb
      - name: qat-finetune-class
      - name: qat-finetune-disk-gb
      - name: model-quantization-class
      - name: model-quantization-disk-gb
      - name: model-registration-class
      - name: model-registration-disk-gb
    container:
      image: google/cloud-sdk:585.0.0-alpine
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
      command:
      - sh
      - -c
      args:
      - "set -eu\nPROJECT=\"{{inputs.parameters.gcp-project}}\"\nCLUSTER=\"{{inputs.parameters.gcp-cluster}}\"\
        \nLOCATION=\"{{inputs.parameters.gcp-location}}\"\nLOCATION_TYPE=\"{{inputs.parameters.gcp-location-type}}\"\
        \nNODE_SA=\"{{inputs.parameters.node-service-account}}\"\nUID8=$(echo \"{{workflow.uid}}\"\
        \ | tr -d - | cut -c1-8)\nLOC=\"--${LOCATION_TYPE}=${LOCATION}\"\nPOOL=\"\
        pl-5b1ca6d39722-${UID8}\"\nCLS=$(echo \"{{inputs.parameters.config-validation-class}}\"\
        \ | sed \"s/ (STOCKOUT)//\")\nDISK=\"{{inputs.parameters.config-validation-disk-gb}}\"\
        \necho \"create nodepool $POOL for step config-validation (class $CLS, disk\
        \ ${DISK}Gi)\"\ncase \"$CLS\" in\n  cpu-standard)\n    if [ -n \"$NODE_SA\"\
        \ ]; then SA_FLAG=\"--service-account=$NODE_SA\"; else SA_FLAG=\"\"; fi\n\
        \    if ! OUT=$(gcloud container node-pools create \"$POOL\" --cluster=\"\
        $CLUSTER\" $LOC --project=\"$PROJECT\" --machine-type=n2-standard-8 --disk-type=pd-ssd\
        \ --disk-size=${DISK} --num-nodes=1 --enable-private-nodes --node-labels=platform.kubecore.io/nodegroup-type=${POOL},platform.kubecore.io/ml-workload=cpu\
        \ --node-taints=platform.kubecore.io/ml-workload=cpu:NoSchedule $SA_FLAG 2>&1);\
        \ then\n      if echo \"$OUT\" | grep -q \"already exists\"; then\n      \
        \  echo \"node pool $POOL already exists — continuing\"\n      else\n    \
        \    echo \"ERROR creating node pool $POOL:\"; echo \"$OUT\"; exit 1\n   \
        \   fi\n    fi ;;\n  gpu-t4)\n    if [ -n \"$NODE_SA\" ]; then SA_FLAG=\"\
        --service-account=$NODE_SA\"; else SA_FLAG=\"\"; fi\n    if ! OUT=$(gcloud\
        \ container node-pools create \"$POOL\" --cluster=\"$CLUSTER\" $LOC --project=\"\
        $PROJECT\" --machine-type=n1-standard-8 --disk-type=pd-ssd --disk-size=${DISK}\
        \ --num-nodes=1 --enable-private-nodes --accelerator=type=nvidia-tesla-t4,count=1,gpu-driver-version=LATEST\
        \ --node-labels=platform.kubecore.io/nodegroup-type=${POOL},platform.kubecore.io/ml-workload=gpu\
        \ --node-taints=platform.kubecore.io/ml-workload=gpu:NoSchedule,nvidia.com/gpu=present:NoSchedule\
        \ $SA_FLAG 2>&1); then\n      if echo \"$OUT\" | grep -q \"already exists\"\
        ; then\n        echo \"node pool $POOL already exists — continuing\"\n   \
        \   else\n        echo \"ERROR creating node pool $POOL:\"; echo \"$OUT\"\
        ; exit 1\n      fi\n    fi ;;\n  *) echo \"ERROR: class $CLS not in live catalog\"\
        ; exit 1 ;;\nesac\nPOOL=\"pl-08b176a8e6ab-${UID8}\"\nCLS=$(echo \"{{inputs.parameters.dataset-loading-class}}\"\
        \ | sed \"s/ (STOCKOUT)//\")\nDISK=\"{{inputs.parameters.dataset-loading-disk-gb}}\"\
        \necho \"create nodepool $POOL for step dataset-loading (class $CLS, disk\
        \ ${DISK}Gi)\"\ncase \"$CLS\" in\n  cpu-standard)\n    if [ -n \"$NODE_SA\"\
        \ ]; then SA_FLAG=\"--service-account=$NODE_SA\"; else SA_FLAG=\"\"; fi\n\
        \    if ! OUT=$(gcloud container node-pools create \"$POOL\" --cluster=\"\
        $CLUSTER\" $LOC --project=\"$PROJECT\" --machine-type=n2-standard-8 --disk-type=pd-ssd\
        \ --disk-size=${DISK} --num-nodes=1 --enable-private-nodes --node-labels=platform.kubecore.io/nodegroup-type=${POOL},platform.kubecore.io/ml-workload=cpu\
        \ --node-taints=platform.kubecore.io/ml-workload=cpu:NoSchedule $SA_FLAG 2>&1);\
        \ then\n      if echo \"$OUT\" | grep -q \"already exists\"; then\n      \
        \  echo \"node pool $POOL already exists — continuing\"\n      else\n    \
        \    echo \"ERROR creating node pool $POOL:\"; echo \"$OUT\"; exit 1\n   \
        \   fi\n    fi ;;\n  gpu-t4)\n    if [ -n \"$NODE_SA\" ]; then SA_FLAG=\"\
        --service-account=$NODE_SA\"; else SA_FLAG=\"\"; fi\n    if ! OUT=$(gcloud\
        \ container node-pools create \"$POOL\" --cluster=\"$CLUSTER\" $LOC --project=\"\
        $PROJECT\" --machine-type=n1-standard-8 --disk-type=pd-ssd --disk-size=${DISK}\
        \ --num-nodes=1 --enable-private-nodes --accelerator=type=nvidia-tesla-t4,count=1,gpu-driver-version=LATEST\
        \ --node-labels=platform.kubecore.io/nodegroup-type=${POOL},platform.kubecore.io/ml-workload=gpu\
        \ --node-taints=platform.kubecore.io/ml-workload=gpu:NoSchedule,nvidia.com/gpu=present:NoSchedule\
        \ $SA_FLAG 2>&1); then\n      if echo \"$OUT\" | grep -q \"already exists\"\
        ; then\n        echo \"node pool $POOL already exists — continuing\"\n   \
        \   else\n        echo \"ERROR creating node pool $POOL:\"; echo \"$OUT\"\
        ; exit 1\n      fi\n    fi ;;\n  *) echo \"ERROR: class $CLS not in live catalog\"\
        ; exit 1 ;;\nesac\nPOOL=\"pl-02efdc35f653-${UID8}\"\nCLS=$(echo \"{{inputs.parameters.model-training-class}}\"\
        \ | sed \"s/ (STOCKOUT)//\")\nDISK=\"{{inputs.parameters.model-training-disk-gb}}\"\
        \necho \"create nodepool $POOL for step model-training (class $CLS, disk ${DISK}Gi)\"\
        \ncase \"$CLS\" in\n  cpu-standard)\n    if [ -n \"$NODE_SA\" ]; then SA_FLAG=\"\
        --service-account=$NODE_SA\"; else SA_FLAG=\"\"; fi\n    if ! OUT=$(gcloud\
        \ container node-pools create \"$POOL\" --cluster=\"$CLUSTER\" $LOC --project=\"\
        $PROJECT\" --machine-type=n2-standard-8 --disk-type=pd-ssd --disk-size=${DISK}\
        \ --num-nodes=1 --enable-private-nodes --node-labels=platform.kubecore.io/nodegroup-type=${POOL},platform.kubecore.io/ml-workload=cpu\
        \ --node-taints=platform.kubecore.io/ml-workload=cpu:NoSchedule $SA_FLAG 2>&1);\
        \ then\n      if echo \"$OUT\" | grep -q \"already exists\"; then\n      \
        \  echo \"node pool $POOL already exists — continuing\"\n      else\n    \
        \    echo \"ERROR creating node pool $POOL:\"; echo \"$OUT\"; exit 1\n   \
        \   fi\n    fi ;;\n  gpu-t4)\n    if [ -n \"$NODE_SA\" ]; then SA_FLAG=\"\
        --service-account=$NODE_SA\"; else SA_FLAG=\"\"; fi\n    if ! OUT=$(gcloud\
        \ container node-pools create \"$POOL\" --cluster=\"$CLUSTER\" $LOC --project=\"\
        $PROJECT\" --machine-type=n1-standard-8 --disk-type=pd-ssd --disk-size=${DISK}\
        \ --num-nodes=1 --enable-private-nodes --accelerator=type=nvidia-tesla-t4,count=1,gpu-driver-version=LATEST\
        \ --node-labels=platform.kubecore.io/nodegroup-type=${POOL},platform.kubecore.io/ml-workload=gpu\
        \ --node-taints=platform.kubecore.io/ml-workload=gpu:NoSchedule,nvidia.com/gpu=present:NoSchedule\
        \ $SA_FLAG 2>&1); then\n      if echo \"$OUT\" | grep -q \"already exists\"\
        ; then\n        echo \"node pool $POOL already exists — continuing\"\n   \
        \   else\n        echo \"ERROR creating node pool $POOL:\"; echo \"$OUT\"\
        ; exit 1\n      fi\n    fi ;;\n  *) echo \"ERROR: class $CLS not in live catalog\"\
        ; exit 1 ;;\nesac\nif [ \"{{inputs.parameters.quantization-mode}}\" != \"\
        none\" ]; then\nPOOL=\"pl-a78bd810d12e-${UID8}\"\nCLS=$(echo \"{{inputs.parameters.qat-finetune-class}}\"\
        \ | sed \"s/ (STOCKOUT)//\")\nDISK=\"{{inputs.parameters.qat-finetune-disk-gb}}\"\
        \necho \"create nodepool $POOL for step qat-finetune (class $CLS, disk ${DISK}Gi)\"\
        \ncase \"$CLS\" in\n  cpu-standard)\n    if [ -n \"$NODE_SA\" ]; then SA_FLAG=\"\
        --service-account=$NODE_SA\"; else SA_FLAG=\"\"; fi\n    if ! OUT=$(gcloud\
        \ container node-pools create \"$POOL\" --cluster=\"$CLUSTER\" $LOC --project=\"\
        $PROJECT\" --machine-type=n2-standard-8 --disk-type=pd-ssd --disk-size=${DISK}\
