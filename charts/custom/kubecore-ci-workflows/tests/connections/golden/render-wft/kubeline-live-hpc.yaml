        gcloud container node-pools delete "$POOL" --cluster="$CLUSTER" $LOC --project="$PROJECT"
        --quiet 2>&1 | grep -v "was not found" || true

        '
  - name: validate-classes
    serviceAccountName: argo-workflow
    nodeSelector:
      platform.kubecore.io/nodegroup-type: ci-standard
      platform.kubecore.io/project: data-room
    tolerations: *id001
    inputs:
      parameters:
      - name: config-validation-class
      - name: dataset-loading-class
      - name: model-training-class
      - name: qat-finetune-class
      - name: model-quantization-class
      - name: model-registration-class
    container:
      image: busybox:1.36.1
      command:
      - sh
      - -c
      args:
      - "set -eu\nBAD=0\nCLS=\"{{inputs.parameters.config-validation-class}}\"\ncase\
        \ \"$CLS\" in\n  *\"(STOCKOUT)\") echo \"step config-validation picked a stocked-out\
        \ class: $CLS\"; BAD=1 ;;\nesac\nCLS=\"{{inputs.parameters.dataset-loading-class}}\"\
        \ncase \"$CLS\" in\n  *\"(STOCKOUT)\") echo \"step dataset-loading picked\
        \ a stocked-out class: $CLS\"; BAD=1 ;;\nesac\nCLS=\"{{inputs.parameters.model-training-class}}\"\
        \ncase \"$CLS\" in\n  *\"(STOCKOUT)\") echo \"step model-training picked a\
        \ stocked-out class: $CLS\"; BAD=1 ;;\nesac\nCLS=\"{{inputs.parameters.qat-finetune-class}}\"\
        \ncase \"$CLS\" in\n  *\"(STOCKOUT)\") echo \"step qat-finetune picked a stocked-out\
        \ class: $CLS\"; BAD=1 ;;\nesac\nCLS=\"{{inputs.parameters.model-quantization-class}}\"\
        \ncase \"$CLS\" in\n  *\"(STOCKOUT)\") echo \"step model-quantization picked\
        \ a stocked-out class: $CLS\"; BAD=1 ;;\nesac\nCLS=\"{{inputs.parameters.model-registration-class}}\"\
        \ncase \"$CLS\" in\n  *\"(STOCKOUT)\") echo \"step model-registration picked\
        \ a stocked-out class: $CLS\"; BAD=1 ;;\nesac\nif [ \"$BAD\" != 0 ]; then\
        \ echo \"One or more steps selected a stocked-out compute class. Pick an available\
        \ class and resubmit.\"; exit 1; fi\necho \"compute-class stockout guard passed\"\
        \n"
  - name: kubeline-live-hpc-pipeline
    dag:
      tasks:
      - name: validate-classes
        template: validate-classes
        arguments:
          parameters:
          - name: config-validation-class
            value: '{{workflow.parameters.config-validation-class}}'
          - name: dataset-loading-class
            value: '{{workflow.parameters.dataset-loading-class}}'
          - name: model-training-class
            value: '{{workflow.parameters.model-training-class}}'
          - name: qat-finetune-class
            value: '{{workflow.parameters.qat-finetune-class}}'
          - name: model-quantization-class
            value: '{{workflow.parameters.model-quantization-class}}'
          - name: model-registration-class
            value: '{{workflow.parameters.model-registration-class}}'
      - name: create-nodegroups
        template: create-nodegroups
        depends: validate-classes
        arguments:
          parameters:
          - name: gcp-project
            value: '{{workflow.parameters.gcp-project}}'
          - name: gcp-cluster
            value: '{{workflow.parameters.gcp-cluster}}'
          - name: gcp-location
            value: '{{workflow.parameters.gcp-location}}'
          - name: gcp-location-type
            value: '{{workflow.parameters.gcp-location-type}}'
          - name: node-service-account
            value: '{{workflow.parameters.node-service-account}}'
          - name: quantization-mode
            value: '{{workflow.parameters.quantization-mode}}'
          - name: config-validation-class
            value: '{{workflow.parameters.config-validation-class}}'
          - name: config-validation-disk-gb
            value: '{{workflow.parameters.config-validation-disk-gb}}'
          - name: dataset-loading-class
            value: '{{workflow.parameters.dataset-loading-class}}'
          - name: dataset-loading-disk-gb
            value: '{{workflow.parameters.dataset-loading-disk-gb}}'
          - name: model-training-class
            value: '{{workflow.parameters.model-training-class}}'
          - name: model-training-disk-gb
            value: '{{workflow.parameters.model-training-disk-gb}}'
          - name: qat-finetune-class
            value: '{{workflow.parameters.qat-finetune-class}}'
          - name: qat-finetune-disk-gb
            value: '{{workflow.parameters.qat-finetune-disk-gb}}'
          - name: model-quantization-class
            value: '{{workflow.parameters.model-quantization-class}}'
          - name: model-quantization-disk-gb
            value: '{{workflow.parameters.model-quantization-disk-gb}}'
          - name: model-registration-class
            value: '{{workflow.parameters.model-registration-class}}'
          - name: model-registration-disk-gb
            value: '{{workflow.parameters.model-registration-disk-gb}}'
      - name: config-validation
        template: config-validation
        depends: create-nodegroups.Succeeded
        arguments:
          parameters:
          - name: pool-name
            value: '{{="pl-5b1ca6d39722-" + sprig.trunc(8, sprig.replace("-", "",
              workflow.uid))}}'
          - name: class-name
            value: '{{workflow.parameters.config-validation-class}}'
      - name: dataset-loading
        template: dataset-loading
        depends: create-nodegroups.Succeeded && (config-validation.Succeeded || config-validation.Skipped)
        arguments:
          parameters:
          - name: pool-name
            value: '{{="pl-08b176a8e6ab-" + sprig.trunc(8, sprig.replace("-", "",
              workflow.uid))}}'
          - name: class-name
            value: '{{workflow.parameters.dataset-loading-class}}'
      - name: model-training
        template: model-training
        depends: create-nodegroups.Succeeded && (dataset-loading.Succeeded || dataset-loading.Skipped)
        arguments:
          parameters:
          - name: pool-name
            value: '{{="pl-02efdc35f653-" + sprig.trunc(8, sprig.replace("-", "",
              workflow.uid))}}'
          - name: class-name
            value: '{{workflow.parameters.model-training-class}}'
          - name: data-yaml
            value: '{{tasks.dataset-loading.outputs.parameters.data-yaml}}'
          - name: manifest-summary
            value: '{{tasks.dataset-loading.outputs.parameters.manifest-summary}}'
        when: '{{=workflow.parameters.target != ''meluxina''}}'
      - name: model-training-meluxina
        template: meluxina-run
        depends: create-nodegroups.Succeeded && (dataset-loading.Succeeded || dataset-loading.Skipped)
        when: '{{=workflow.parameters.target == ''meluxina''}}'
        arguments:
          parameters:
          - name: step-name
            value: model-training
          - name: image
            value: '{{workflow.parameters.image-model-training}}'
          - name: step-command
            value: '["python", "-c", "import os, sys, subprocess, json, yaml\n\n#
              Config resolution: PIPELINE_CONFIG (platform-injected) overrides PARAMS_YAML.\npipeline_config
              = os.environ.get(\"PIPELINE_CONFIG\", \"\")\nparams_yaml = os.environ.get(\"PARAMS_YAML\",
              \"\")\nraw = pipeline_config.strip() if pipeline_config.strip() else
              params_yaml\n\nif not raw.strip():\n    print(\"ERROR: Neither PIPELINE_CONFIG
              nor PARAMS_YAML is set.\", flush=True)\n    sys.exit(1)\ntry:\n    cfg
              = yaml.safe_load(raw)\nexcept yaml.YAMLError as e:\n    print(f\"ERROR:
              Config is not valid YAML: {e}\", flush=True)\n    sys.exit(1)\n\n# Reconstruct
              /work/dataset from input parameters\nos.makedirs(\"/work/dataset\",
              exist_ok=True)\n\ndata_yaml = os.environ.get(\"DATA_YAML\", \"\")\nif
              not data_yaml.strip():\n    print(\"ERROR: DATA_YAML input parameter
              is empty.\", flush=True)\n    sys.exit(1)\nwith open(\"/work/dataset/data.yaml\",
              \"w\") as fh:\n    fh.write(data_yaml)\n\nmanifest_summary = os.environ.get(\"MANIFEST_SUMMARY\",
              \"\")\nif not manifest_summary.strip():\n    print(\"ERROR: MANIFEST_SUMMARY
              input parameter is empty.\", flush=True)\n    sys.exit(1)\n# Write summary
              as dataset_manifest.json so model_training auto-detects\n# the S3 source
              (bucket + prefix) and streaming mode (label_keys presence).\nwith open(\"/work/dataset/dataset_manifest.json\",
              \"w\") as fh:\n    fh.write(manifest_summary)\n\nexp = cfg.get(\"experiment\")
              or {}\nmodel = cfg.get(\"model\") or {}\ntraining = cfg.get(\"training\")
              or {}\ncheckpointing = cfg.get(\"checkpointing\") or {}\nearly_stopping
              = cfg.get(\"early_stopping\") or {}\naugmentation = cfg.get(\"augmentation\")
              or {}\nexport_cfg = cfg.get(\"export\") or {}\n\n# Precedence: explicit
              param wins; empty param falls back to platform env.\n# CHECKPOINT_BUCKET/CHECKPOINT_PREFIX
              are injected by render-wft from the\n# k8smlapp pipeline-context. model-training
              takes --checkpoint-bucket and\n# --checkpoint-prefix directly so no
              s3:// parsing is needed in that path.\nstorage_path = str(checkpointing.get(\"storage_path\",
              \"\") or \"\").strip()\nif storage_path.startswith(\"s3://\"):\n    #
              Explicit override: parse bucket/prefix from the s3:// URI.\n    parts
              = storage_path[5:].split(\"/\", 1)\n    checkpoint_bucket = parts[0]\n    checkpoint_prefix
              = parts[1].rstrip(\"/\") if len(parts) > 1 else \"main/checkpoints\"\nelse:\n    #
              Platform-derived: use env vars injected by render-wft.\n    checkpoint_bucket
              = os.environ.get(\"CHECKPOINT_BUCKET\", \"\").strip()\n    checkpoint_prefix
              = os.environ.get(\"CHECKPOINT_PREFIX\", \"main/checkpoints\").strip()\n    if
              not checkpoint_bucket:\n        print(\n            \"ERROR: checkpointing-storage-path
              is empty and CHECKPOINT_BUCKET env \"\n            \"is not set. The
              platform should inject CHECKPOINT_BUCKET/CHECKPOINT_PREFIX \"\n            \"from
              the project lakeFS repository via render-wft. Either set \"\n            \"checkpointing-storage-path
              explicitly or ensure the k8smlapp composition \"\n            \"version
              includes the checkpoints block in pipeline-context.yaml.\",\n            flush=True,\n        )\n        sys.exit(1)\n\nflags
              = [\n    \"--model-variant\", str(model[\"variant\"]),\n    \"--experiment-name\",
              str(exp[\"name\"]),\n    \"--dataset-dir\", \"/work/dataset\",\n    \"--output-dir\",
              \"/work/output\",\n    \"--source\", \"s3\",\n    \"--epochs\", str(training[\"epochs\"]),\n    \"--batch-size\",
              str(training[\"batch_size\"]),\n    \"--image-size\", str(training[\"image_size\"]),\n    \"--learning-rate\",
              str(training[\"learning_rate\"]),\n    \"--optimizer\", str(training[\"optimizer\"]),\n    \"--checkpoint-interval\",
              str(checkpointing[\"interval_epochs\"]),\n    \"--checkpoint-bucket\",
              checkpoint_bucket,\n    \"--checkpoint-prefix\", checkpoint_prefix,\n    \"--patience\",
              str(early_stopping[\"patience\"]),\n]\n\n# Optional training flags\nif
              training.get(\"cos_lr\") is not None:\n    flags += [\"--cos-lr\" if
              training[\"cos_lr\"] else \"--no-cos-lr\"]\nif training.get(\"lrf\")
              is not None:\n    flags += [\"--lrf\", str(training[\"lrf\"])]\nif training.get(\"momentum\")
              is not None:\n    flags += [\"--momentum\", str(training[\"momentum\"])]\nif
              training.get(\"weight_decay\") is not None:\n    flags += [\"--weight-decay\",
              str(training[\"weight_decay\"])]\nif training.get(\"warmup_epochs\")
              is not None:\n    flags += [\"--warmup-epochs\", str(training[\"warmup_epochs\"])]\nif
              training.get(\"warmup_momentum\") is not None:\n    flags += [\"--warmup-momentum\",
              str(training[\"warmup_momentum\"])]\nif training.get(\"dropout\") is
              not None:\n    flags += [\"--dropout\", str(training[\"dropout\"])]\nif
              training.get(\"label_smoothing\") is not None:\n    flags += [\"--label-smoothing\",
              str(training[\"label_smoothing\"])]\nif training.get(\"nbs\") is not
              None:\n    flags += [\"--nbs\", str(training[\"nbs\"])]\nif training.get(\"freeze\")
              is not None:\n    flags += [\"--freeze\", str(training[\"freeze\"])]\nif
              training.get(\"amp\") is not None:\n    flags += [\"--amp\" if training[\"amp\"]
              else \"--no-amp\"]\nif training.get(\"close_mosaic\") is not None:\n    flags
              += [\"--close-mosaic\", str(training[\"close_mosaic\"])]\nif training.get(\"seed\")
              is not None:\n    flags += [\"--seed\", str(training[\"seed\"])]\nif
              training.get(\"deterministic\") is not None:\n    flags += [\"--deterministic\"
              if training[\"deterministic\"] else \"--no-deterministic\"]\nif training.get(\"pose\")
              is not None:\n    flags += [\"--pose\", str(training[\"pose\"])]\nif
              training.get(\"kobj\") is not None:\n    flags += [\"--kobj\", str(training[\"kobj\"])]\nif
              training.get(\"box\") is not None:\n    flags += [\"--box\", str(training[\"box\"])]\nif
              training.get(\"cls\") is not None:\n    flags += [\"--cls\", str(training[\"cls\"])]\nif
              training.get(\"dfl\") is not None:\n    flags += [\"--dfl\", str(training[\"dfl\"])]\n\n#
              Optional weight init / resume\nif model.get(\"pretrained_weights\"):\n    flags
              += [\"--pretrained-weights\", str(model[\"pretrained_weights\"])]\nif
              checkpointing.get(\"resume_from\"):\n    flags += [\"--resume-from\",
              str(checkpointing[\"resume_from\"])]\n\n# disk-cache-gb: cap S3 streaming
              cache for ephemeral pod storage\nflags += [\"--disk-cache-gb\", \"8.0\"]\n\n#
