        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 2Gi
        limits:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 4Gi
      command: &id024
      - python
      - -c
      args: &id025
      - "import os, sys, subprocess, json, yaml\n\n# Config resolution: PIPELINE_CONFIG\
        \ (platform-injected) overrides PARAMS_YAML.\npipeline_config = os.environ.get(\"\
        PIPELINE_CONFIG\", \"\")\nparams_yaml = os.environ.get(\"PARAMS_YAML\", \"\
        \")\nraw = pipeline_config.strip() if pipeline_config.strip() else params_yaml\n\
        \nif not raw.strip():\n    print(\"ERROR: Neither PIPELINE_CONFIG nor PARAMS_YAML\
        \ is set.\", flush=True)\n    sys.exit(1)\ntry:\n    cfg = yaml.safe_load(raw)\n\
        except yaml.YAMLError as e:\n    print(f\"ERROR: Config is not valid YAML:\
        \ {e}\", flush=True)\n    sys.exit(1)\n\ntr_raw = os.environ.get(\"TRAINING_RESULT\"\
        , \"\")\nif not tr_raw.strip():\n    print(\"ERROR: TRAINING_RESULT input\
        \ parameter is empty.\", flush=True)\n    sys.exit(1)\ntry:\n    tr = json.loads(tr_raw)\n\
        except json.JSONDecodeError as e:\n    print(f\"ERROR: TRAINING_RESULT is\
        \ not valid JSON: {e}\", flush=True)\n    sys.exit(1)\n\ndataset = cfg.get(\"\
        dataset\") or {}\nmodel = cfg.get(\"model\") or {}\nregistration = cfg.get(\"\
        registration\") or {}\n\nmlflow_run_id = tr.get(\"mlflow_run_id\")\nbest_checkpoint_s3\
        \ = tr.get(\"best_checkpoint_s3\")\nif not mlflow_run_id or not best_checkpoint_s3:\n\
        \    print(f\"ERROR: training_result missing mlflow_run_id or best_checkpoint_s3:\
        \ {tr}\", flush=True)\n    sys.exit(1)\n\n# Derive last checkpoint path from\
        \ best: replace best.pt with last.pt\nlast_checkpoint_s3 = best_checkpoint_s3.replace(\"\
        /best.pt\", \"/last.pt\")\n\nflags = [\n    \"--mlflow-run-id\", mlflow_run_id,\n\
        \    \"--best-checkpoint-path\", best_checkpoint_s3,\n    \"--last-checkpoint-path\"\
        , last_checkpoint_s3,\n    \"--dataset-version\", str(dataset.get(\"version\"\
        , \"\")),\n    \"--model-variant\", str(model.get(\"variant\", \"\")),\n]\n\
        \n# Optional registration flags\nif registration.get(\"registered_model_name\"\
        ):\n    flags += [\"--registered-model-name\", str(registration[\"registered_model_name\"\
        ])]\nif registration.get(\"promote_to\"):\n    flags += [\"--promote-to\"\
        , str(registration[\"promote_to\"])]\n\n# Optional lineage flags from training\
        \ result\nif dataset.get(\"sample_size\") is not None:\n    flags += [\"--dataset-sample-size\"\
        , str(dataset[\"sample_size\"])]\n\nfinal_map50 = tr.get(\"final_map50\")\n\
        if final_map50 is not None:\n    flags += [\"--best-map50\", str(final_map50)]\n\
        \nexported_models = tr.get(\"exported_models\")\nif exported_models:\n   \
        \ flags += [\"--exported-models\", json.dumps(exported_models)]\n\nprint(f\"\
        [model-registration] Running: model-registration {' '.join(flags)}\", flush=True)\n\
        result = subprocess.run([\"model-registration\"] + flags)\nsys.exit(result.returncode)\n"
      env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: CHECKPOINT_BUCKET
        value: PLACEHOLDER-bucket
      - name: CHECKPOINT_PREFIX
        value: main/checkpoints
      - &id026
        name: TRAINING_RESULT
        value: '{{inputs.parameters.training-result}}'
      - &id027
        name: PARAMS_YAML
        value: "dataset:\n  version: \"{{workflow.parameters.dataset-version}}\"\n\
          \  sample_size: {{workflow.parameters.dataset-sample-size}}\nmodel:\n  variant:\
          \ \"{{workflow.parameters.model-variant}}\"\nregistration:\n  registered_model_name:\
          \ \"{{workflow.parameters.registered-model-name}}\"\n  promote_to: \"{{workflow.parameters.promote-to}}\"\
          \n"
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
        optional: true
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 3Gi
    podSpecPatch: "containers:\n- name: main\n  resources:\n    requests:\n      cpu:\
