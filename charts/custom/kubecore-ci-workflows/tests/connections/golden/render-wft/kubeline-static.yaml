        PIPELINE_CONFIG\", \"\")\nparams_yaml = os.environ.get(\"PARAMS_YAML\", \"\
        \")\nraw = pipeline_config.strip() if pipeline_config.strip() else params_yaml\n\
        \nif not raw.strip():\n    print(\"ERROR: Neither PIPELINE_CONFIG nor PARAMS_YAML\
        \ is set.\", flush=True)\n    sys.exit(1)\ntry:\n    cfg = yaml.safe_load(raw)\n\
        except yaml.YAMLError as e:\n    print(f\"ERROR: Config is not valid YAML:\
        \ {e}\", flush=True)\n    sys.exit(1)\n\ntr_raw = os.environ.get(\"TRAINING_RESULT\"\
        , \"\")\nif not tr_raw.strip():\n    print(\"ERROR: TRAINING_RESULT input\
        \ parameter is empty.\", flush=True)\n    sys.exit(1)\ntry:\n    tr = json.loads(tr_raw)\n\
        except json.JSONDecodeError as e:\n    print(f\"ERROR: TRAINING_RESULT is\
        \ not valid JSON: {e}\", flush=True)\n    sys.exit(1)\n\nmlflow_run_id = tr.get(\"\
        mlflow_run_id\")\nbest_checkpoint_s3 = tr.get(\"best_checkpoint_s3\")\nif\
        \ not mlflow_run_id or not best_checkpoint_s3:\n    print(f\"ERROR: training_result\
        \ missing mlflow_run_id or best_checkpoint_s3: {tr}\", flush=True)\n    sys.exit(1)\n\
        \nexp = cfg.get(\"experiment\") or {}\nquant = cfg.get(\"quantization\") or\
        \ {}\n\n# Self-gate: qat-finetune fine-tunes ONLY in qat mode. The platform\
        \ gates\n# this step on quantization-mode != 'none', so it ALSO fires in ptq\
        \ mode,\n# where it must be a no-op. Write a stub result so model-quantization's\n\
        # qat-result input param still resolves, then exit success.\nmode = str(quant.get(\"\
        mode\", \"none\")).lower()\nif mode != \"qat\":\n    os.makedirs(\"/work/qat_output\"\
        , exist_ok=True)\n    with open(\"/work/qat_output/qat_result.json\", \"w\"\
        ) as fh:\n        json.dump({\"mode\": mode, \"skipped\": True,\n        \
        \           \"reason\": \"qat-finetune runs only when quantization-mode=qat\"\
        }, fh)\n    print(f\"[qat-finetune] mode={mode} (not qat) - no-op; wrote stub\
        \ qat_result.json.\", flush=True)\n    sys.exit(0)\n\n# Derive output bucket\
        \ + lakeFS branch from checkpoint URI (same as training).\n# s3://<repo>/<branch>/<path>:\
        \ branch is the FIRST key segment; the output\n# prefix must start with it\
        \ or lakeFS treats it as a non-existent branch.\ncheckpoint_uri = best_checkpoint_s3\n\
        if checkpoint_uri.startswith(\"s3://\"):\n    _ckpt_parts = checkpoint_uri[5:].split(\"\
        /\")\n    output_bucket = _ckpt_parts[0]\n    lakefs_branch = _ckpt_parts[1]\
        \ if len(_ckpt_parts) > 1 else \"main\"\nelse:\n    output_bucket = os.environ.get(\"\
        CHECKPOINT_BUCKET\", \"\")\n    lakefs_branch = os.environ.get(\"LAKEFS_BRANCH\"\
        , \"main\")\nif not output_bucket:\n    print(\"ERROR: cannot derive output\
        \ bucket from checkpoint URI and CHECKPOINT_BUCKET is unset.\", flush=True)\n\
        \    sys.exit(1)\n\n# Reconstruct /work/dataset and download TRAIN frames\
        \ from S3 — the QAT\n# calibration/distillation loop reads images/train (no\
        \ shared FS across pods).\nos.makedirs(\"/work/dataset\", exist_ok=True)\n\
        data_yaml_content = os.environ.get(\"DATA_YAML\", \"\")\nif data_yaml_content.strip():\n\
        \    with open(\"/work/dataset/data.yaml\", \"w\") as fh:\n        fh.write(data_yaml_content)\n\
        manifest_summary = os.environ.get(\"MANIFEST_SUMMARY\", \"\")\nif manifest_summary.strip():\n\
        \    with open(\"/work/dataset/dataset_manifest.json\", \"w\") as fh:\n  \
        \      fh.write(manifest_summary)\ntry:\n    import boto3\n    from botocore.config\
        \ import Config as BotoConfig\n    boto_cfg = BotoConfig(retries={\"max_attempts\"\
        : 3, \"mode\": \"adaptive\"})\n    lakefs_endpoint = os.environ.get(\"LAKEFS_ENDPOINT\"\
        , \"\")\n    lakefs_key = os.environ.get(\"LAKEFS_ACCESS_KEY\", \"\")\n  \
        \  lakefs_secret = os.environ.get(\"LAKEFS_SECRET_KEY\", \"\")\n    if lakefs_endpoint\
        \ and lakefs_key and lakefs_secret:\n        s3 = boto3.client(\"s3\", endpoint_url=lakefs_endpoint,\n\
        \                          aws_access_key_id=lakefs_key,\n               \
        \           aws_secret_access_key=lakefs_secret,\n                       \
        \   region_name=None, config=boto_cfg)\n    else:\n        s3 = boto3.client(\"\
        s3\",\n                          endpoint_url=os.environ.get(\"S3_ENDPOINT_URL\"\
        ),\n                          aws_access_key_id=os.environ.get(\"AWS_ACCESS_KEY_ID\"\
        ),\n                          aws_secret_access_key=os.environ.get(\"AWS_SECRET_ACCESS_KEY\"\
        ),\n                          region_name=os.environ.get(\"AWS_DEFAULT_REGION\"\
        ),\n                          config=boto_cfg)\n    ms = json.loads(manifest_summary)\
        \ if manifest_summary.strip() else {}\n    ds_bucket = ms.get(\"bucket\",\
        \ \"\")\n    ds_prefix = ms.get(\"prefix\", \"\").rstrip(\"/\")\n    if ds_bucket\
        \ and ds_prefix:\n        max_download = int(quant.get(\"calibration_frames\"\
        , 512))\n        images_dir = \"/work/dataset/images/train\"\n        os.makedirs(images_dir,\
        \ exist_ok=True)\n        paginator = s3.get_paginator(\"list_objects_v2\"\
        )\n        image_exts = {\".jpg\", \".jpeg\", \".png\", \".bmp\"}\n      \
        \  downloaded = 0\n        for page in paginator.paginate(Bucket=ds_bucket,\
        \ Prefix=f\"{ds_prefix}/images/train/\"):\n            for obj in page.get(\"\
        Contents\", []):\n                key = obj[\"Key\"]\n                if os.path.splitext(key)[1].lower()\
        \ not in image_exts:\n                    continue\n                s3.download_file(ds_bucket,\
        \ key, os.path.join(images_dir, os.path.basename(key)))\n                downloaded\
        \ += 1\n                if downloaded >= max_download:\n                 \
        \   break\n            if downloaded >= max_download:\n                break\n\
        \        print(f\"[qat-finetune] Downloaded {downloaded} train frames for\
        \ calibration.\", flush=True)\n    else:\n        print(\"[qat-finetune] WARNING:\
        \ manifest_summary missing bucket/prefix — no frames downloaded.\", flush=True)\n\
        except Exception as e:\n    print(f\"[qat-finetune] WARNING: frame download\
        \ failed: {e}.\", flush=True)\n\nos.makedirs(\"/work/qat_output\", exist_ok=True)\n\
        \nflags = [\n    \"--fp32-checkpoint-path\", best_checkpoint_s3,\n    \"--source-mlflow-run-id\"\
        , mlflow_run_id,\n    \"--dataset-dir\", \"/work/dataset\",\n    \"--output-dir\"\
        , \"/work/qat_output\",\n    \"--output-bucket\", output_bucket,\n    \"--output-prefix\"\
        , f\"{lakefs_branch}/{quant.get('output_prefix', 'quantization/qat')}\",\n\
        \    \"--experiment-name\", str(exp.get(\"name\", \"quantization\")),\n  \
        \  \"--image-size\", str(quant.get(\"image_size\", 640)),\n    \"--qat-epochs\"\
        , str(quant.get(\"qat_epochs\", 10)),\n    \"--qat-lr\", str(quant.get(\"\
        qat_lr\", 1e-4)),\n    \"--calibration-frames\", str(quant.get(\"calibration_frames\"\
        , 512)),\n    \"--calibration-seed\", str(quant.get(\"calibration_seed\",\
        \ 42)),\n    \"--parity-frames\", str(quant.get(\"parity_frames\", 100)),\n\
        \    \"--parity-max-abs-error\", str(quant.get(\"parity_max_abs_error\", 0.05)),\n\
        ]\n\nprint(f\"[qat-finetune] Running: qat-finetune run {' '.join(flags)}\"\
        , flush=True)\nresult = subprocess.run([\"qat-finetune\"] + flags)\nsys.exit(result.returncode)\n"
