apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: kubeline-static-pipeline
  namespace: PLACEHOLDER-vision-runtime
  annotations:
    platform.kubecore.io/cost-tracking: enabled
    platform.kubecore.io/pipeline: kubeline-static
    platform.kubecore.io/gpu-nodepool: kubeline-static-gpu
    platform.kubecore.io/cpu-nodepool: kubeline-static-cpu
    platform.kubecore.io/generated-by: ml-ci-build/render-wft
    platform.kubecore.io/rendered-from-commit-time: '1700000000'
  labels:
    platform.kubecore.io/project: vision
    platform.kubecore.io/app: kubeline-static
    platform.kubecore.io/managed-by: kubecore-ci
spec:
  serviceAccountName: argo-workflow
  entrypoint: kubeline-static-pipeline
  arguments:
    parameters:
    - name: pipeline-info
      value: "HOW TO RUN: defaults below are headroom-sized and runnable as-is — just\
        \ press Submit.\nPER-STEP COMPUTE: set {step}-cpu / {step}-mem / {step}-gpu\
        \ for each step. {step}-gpu > 0 routes that step to a GPU node pool; 0 keeps\
        \ it on CPU.\nCOMPUTE CLASSES on this pool (cpu-class / gpu-class pick the\
        \ node pool):\nCPU:\n  • cpu-standard — n2-standard-8 — n2-standard-8 (8 vCPU,\
        \ 32 GiB) — CPU pipeline steps (headroom for heavier CPU steps; scale-from-0\
        \ so cost only during a step)\n  • kubecorecpu — e2-standard-8 — e2-standard-8\
        \ + 200GiB — CI builds (kaniko), sized for build-push req 4cpu/12Gi\nGPU:\n\
        \  • gpu-t4 — n1-standard-8 + 1x nvidia-tesla-t4 — n1-standard-8 + 1x T4 —\
        \ GPU training steps (scale-from-0)\n(This field is informational — leave\
        \ it unchanged.)"
      description: 'Read-only: live pool compute classes + how to fill this form.
        Leave unchanged.'
    - name: config
      value: ''
      description: 'ADVANCED: full pipeline config YAML (schema pipeline_config.example.yaml).
        When non-empty it OVERRIDES all individual parameters above — intended for
        scripted submissions (argo submit -p config=...).'
    - name: experiment-name
      value: object-pose-v1-yolov8n
      description: MLflow experiment name and S3 checkpoint path prefix.
    - name: experiment-description
      value: ''
      description: Optional free-text description stored in the MLflow run.
    - name: dataset-ref
      value: main
      description: lakeFS branch/tag to train on (the ref NAME, not a path). Defaults
        to "main" — type another branch to train on it. The run reads s3://{repo}/{ref}/
        directly. To point at an exact path/commit instead, set dataset-path-override.
    - name: dataset-source
      value: lakefs
      description: 'Storage backend for the dataset: ''lakefs'' or ''s3''.'
      enum:
      - lakefs
      - s3
    - name: dataset-version
      value: ''
      description: Provenance tag recorded in MLflow (derived from dataset-ref). Not
        a path.
    - name: dataset-path-override
      value: ''
      description: Optional s3:// override. Empty = use the picked dataset-ref.
    - name: dataset-sample-size
      value: ''
      description: Integer sample size for reproducible subsets. Empty = full dataset.
    - name: dataset-seed
      value: '42'
      description: Random seed for reproducible dataset sampling.
    - name: model-variant
      value: yolov8n-pose.pt
      description: YOLO pose model variant file. Determines architecture and parameter
        count.
      enum:
      - yolov8n-pose.pt
      - yolov8s-pose.pt
      - yolov8m-pose.pt
      - yolov8l-pose.pt
      - yolov8x-pose.pt
      - yolov9n-pose.pt
      - yolov9s-pose.pt
      - yolov9m-pose.pt
      - yolov9l-pose.pt
      - yolov9x-pose.pt
      - yolov10n-pose.pt
      - yolov10s-pose.pt
      - yolov10m-pose.pt
      - yolov10l-pose.pt
      - yolov10x-pose.pt
      - yolov11n-pose.pt
      - yolov11s-pose.pt
      - yolov11m-pose.pt
      - yolov11l-pose.pt
      - yolov11x-pose.pt
    - name: pretrained-weights
      value: ''
      description: S3 URI to custom .pt weights for weight-only init. Empty = use
        model-variant's bundled weights.
    - name: epochs
      value: '100'
      description: Total training epochs.
    - name: batch-size
      value: '16'
      description: Training batch size. Use -1 for Ultralytics auto-batch.
    - name: image-size
      value: '640'
      description: Input image resolution in pixels (must be a multiple of 32).
    - name: learning-rate
      value: '0.01'
      description: Initial learning rate (Ultralytics lr0).
    - name: cos-lr
      value: 'true'
      description: Use cosine learning rate schedule.
      enum:
      - 'false'
      - 'true'
    - name: lrf
      value: '0.01'
      description: 'Final LR ratio: final_lr = learning_rate * lrf. Must be in (0,
        1].'
    - name: optimizer
      value: SGD
      description: Gradient optimizer. SGD is the Ultralytics default for YOLO.
      enum:
      - SGD
      - Adam
      - AdamW
    - name: momentum
      value: '0.937'
      description: SGD momentum or Adam beta1.
    - name: weight-decay
      value: '0.0005'
      description: Optimizer weight decay (L2 regularization coefficient).
    - name: warmup-epochs
      value: '3.0'
      description: Number of LR warmup epochs.
    - name: warmup-momentum
      value: '0.8'
      description: Initial momentum during warmup (rises to `momentum` by end of warmup).
    - name: dropout
      value: '0.0'
      description: Dropout rate applied in the classifier head [0.0, 1.0).
    - name: label-smoothing
      value: '0.0'
      description: Label smoothing epsilon [0.0, 1.0). Reduces overconfidence.
    - name: nbs
      value: '64'
      description: Nominal batch size. Ultralytics scales gradients so effective LR
        matches this batch size.
    - name: freeze
      value: ''
      description: Freeze the first N backbone layers. Empty = train all layers.
    - name: amp
      value: 'true'
      description: Enable Automatic Mixed Precision (FP16). Halves GPU memory use.
      enum:
      - 'false'
      - 'true'
    - name: close-mosaic
      value: '10'
      description: Disable mosaic augmentation for the last N epochs (0 = never disable).
    - name: training-seed
      value: '0'
      description: Global training RNG seed (separate from dataset-seed).
    - name: deterministic
      value: 'true'
      description: Enable cuDNN deterministic mode. Slight speed penalty; ensures
        reproducibility.
      enum:
      - 'false'
      - 'true'
    - name: pose
      value: '12.0'
      description: Keypoint regression loss gain. Primary lever for object keypoint
        accuracy.
    - name: kobj
      value: '2.0'
      description: Keypoint objectness loss gain.
    - name: box
      value: '7.5'
      description: Bounding-box regression loss gain.
    - name: cls
      value: '0.5'
      description: Classification loss gain.
    - name: dfl
      value: '1.5'
      description: Distribution Focal Loss gain.
    - name: early-stopping-patience
      value: '50'
      description: Epochs without improvement before early stopping triggers.
    - name: checkpointing-interval-epochs
      value: '10'
      description: Upload an intermediate checkpoint to S3 every N epochs.
    - name: checkpointing-storage-path
      value: ''
      description: Override checkpoint location (s3://bucket/prefix). Empty = platform-derived
        (project lakeFS repository, main/checkpoints).
    - name: checkpoint-resume-from
      value: ''
      description: 'Checkpoint to resume from: empty = start fresh, ''auto'' = latest,
        or a full S3 path.'
    - name: aug-hsv-h
      value: '0.015'
      description: HSV hue augmentation range [0.0, 1.0].
    - name: aug-hsv-s
      value: '0.7'
      description: HSV saturation augmentation range [0.0, 1.0].
    - name: aug-hsv-v
      value: '0.4'
      description: HSV value augmentation range [0.0, 1.0].
    - name: aug-degrees
      value: '0.0'
      description: Random rotation range in degrees. Keep 0.0 for pose (keypoints
        are rotation-sensitive).
    - name: aug-translate
      value: '0.1'
      description: Random translation fraction of image size.
    - name: aug-scale
      value: '0.5'
      description: Random scale gain (multiplicative).
    - name: aug-shear
      value: '0.0'
      description: Random shear range in degrees.
    - name: aug-perspective
      value: '0.0'
      description: Random perspective warp [0.0, 0.001]. Values > 0.001 cause severe
        keypoint displacement.
    - name: aug-flipud
      value: '0.0'
      description: Vertical flip probability. Keep 0.0 for object (no defined up direction
        has defined 'up').
    - name: aug-fliplr
      value: '0.0'
      description: Horizontal flip probability. Keep 0.0 for object (no left-right
        symmetry in canonical pose).
    - name: aug-mosaic
      value: '1.0'
      description: Mosaic augmentation probability [0.0, 1.0]. Disabled for last `close-mosaic`
        epochs.
    - name: aug-mixup
      value: '0.0'
      description: MixUp augmentation probability [0.0, 1.0].
    - name: aug-copy-paste
      value: '0.0'
      description: Segment copy-paste augmentation probability [0.0, 1.0].
    - name: aug-erasing
      value: '0.4'
      description: Random erasing probability [0.0, 0.9].
    - name: aug-bgr
      value: '0.0'
      description: BGR channel flip probability [0.0, 1.0].
    - name: export-enabled
      value: 'false'
      description: Enable post-training model export (TensorRT/ONNX).
      enum:
      - 'false'
      - 'true'
    - name: export-formats
      value: engine
      description: 'Comma-separated export formats: ''engine'' (TensorRT) and/or ''onnx''.
        Only used when export-enabled=true.'
    - name: export-precisions
      value: fp16
      description: 'Comma-separated precisions: ''fp16'' and/or ''int8''. Only used
        when export-enabled=true.'
    - name: quantization-mode
      value: none
      description: 'Quantization mode: ''none'' skips both qat-finetune and model-quantization;
        ''ptq'' runs Ultralytics INT8 export; ''qat'' runs PT2E QAT fine-tune then
        model-quantization.'
      enum:
      - none
      - ptq
      - qat
    - name: quantization-image-size
      value: '640'
      description: Input image size for quantization. Must match training image-size.
    - name: quantization-calibration-frames
      value: '512'
      description: Number of calibration frames sampled from the dataset for PTQ/QAT
        calibration.
    - name: quantization-calibration-seed
      value: '42'
      description: RNG seed for deterministic calibration frame sampling (FR-M-04).
    - name: quantization-parity-frames
      value: '100'
      description: Number of frames for the INT8 vs FP32 parity check.
    - name: quantization-parity-max-abs-error
      value: '0.05'
      description: Maximum allowed max-absolute-error in the parity check. Run fails
        if this threshold is exceeded.
    - name: quantization-output-prefix
      value: quantization
      description: S3 key prefix for quantized TFLite artifacts (e.g. 'quantization/exp-001').
    - name: qat-epochs
      value: '10'
      description: Number of QAT fine-tune epochs. Only used when quantization-mode=qat.
    - name: qat-lr
      value: '0.0001'
      description: Learning rate for QAT fine-tuning. Only used when quantization-mode=qat.
    - name: registered-model-name
      value: ''
      description: 'MLflow registered model name. Empty = use REGISTERED_MODEL_NAME
        env var (default: object-pose-yolo).'
    - name: promote-to
      value: ''
      description: 'Transition the registered model version to this stage: empty =
        no promotion, ''Staging'', or ''Production''.'
    - name: config-validation-class
      value: cpu-standard
      description: "Which machine the 'config-validation' step runs on. Leave the\
        \ default unless you need more/less power.\n\nAvailable machines:\n  - cpu-standard\
        \ — n2-standard-8 — n2-standard-8 (8 vCPU, 32 GiB) — CPU pipeline steps (headroom\
        \ for heavier CPU steps; scale-from-0 so cost only during a step)\n  - kubecorecpu\
        \ — e2-standard-8 — e2-standard-8 + 200GiB — CI builds (kaniko), sized for\
        \ build-push req 4cpu/12Gi\n  - gpu-t4 — n1-standard-8 + 1x nvidia-tesla-t4\
        \ — n1-standard-8 + 1x T4 — GPU training steps (scale-from-0)\n\nRule of thumb:\
        \ pick a GPU class (e.g. gpu-t4) for model-training, qat-finetune and model-quantization;\
        \ a CPU class (e.g. cpu-standard) is enough for config-validation, dataset-loading\
        \ and model-registration. The default is already set correctly for this step."
      enum: &id001
      - cpu-standard
      - kubecorecpu
      - gpu-t4
    - name: dataset-loading-class
      value: cpu-standard
      description: "Which machine the 'dataset-loading' step runs on. Leave the default\
        \ unless you need more/less power.\n\nAvailable machines:\n  - cpu-standard\
        \ — n2-standard-8 — n2-standard-8 (8 vCPU, 32 GiB) — CPU pipeline steps (headroom\
        \ for heavier CPU steps; scale-from-0 so cost only during a step)\n  - kubecorecpu\
        \ — e2-standard-8 — e2-standard-8 + 200GiB — CI builds (kaniko), sized for\
        \ build-push req 4cpu/12Gi\n  - gpu-t4 — n1-standard-8 + 1x nvidia-tesla-t4\
        \ — n1-standard-8 + 1x T4 — GPU training steps (scale-from-0)\n\nRule of thumb:\
        \ pick a GPU class (e.g. gpu-t4) for model-training, qat-finetune and model-quantization;\
        \ a CPU class (e.g. cpu-standard) is enough for config-validation, dataset-loading\
        \ and model-registration. The default is already set correctly for this step."
      enum: *id001
    - name: model-training-class
      value: gpu-t4
      description: "Which machine the 'model-training' step runs on. Leave the default\
        \ unless you need more/less power. This step normally needs a GPU — the default\
        \ is a GPU class.\n\nAvailable machines:\n  - cpu-standard — n2-standard-8\
        \ — n2-standard-8 (8 vCPU, 32 GiB) — CPU pipeline steps (headroom for heavier\
        \ CPU steps; scale-from-0 so cost only during a step)\n  - kubecorecpu — e2-standard-8\
        \ — e2-standard-8 + 200GiB — CI builds (kaniko), sized for build-push req\
        \ 4cpu/12Gi\n  - gpu-t4 — n1-standard-8 + 1x nvidia-tesla-t4 — n1-standard-8\
        \ + 1x T4 — GPU training steps (scale-from-0)\n\nRule of thumb: pick a GPU\
        \ class (e.g. gpu-t4) for model-training, qat-finetune and model-quantization;\
        \ a CPU class (e.g. cpu-standard) is enough for config-validation, dataset-loading\
        \ and model-registration. The default is already set correctly for this step."
      enum: *id001
    - name: qat-finetune-class
      value: gpu-t4
      description: "Which machine the 'qat-finetune' step runs on. Leave the default\
        \ unless you need more/less power. This step normally needs a GPU — the default\
        \ is a GPU class.\n\nAvailable machines:\n  - cpu-standard — n2-standard-8\
        \ — n2-standard-8 (8 vCPU, 32 GiB) — CPU pipeline steps (headroom for heavier\
        \ CPU steps; scale-from-0 so cost only during a step)\n  - kubecorecpu — e2-standard-8\
        \ — e2-standard-8 + 200GiB — CI builds (kaniko), sized for build-push req\
        \ 4cpu/12Gi\n  - gpu-t4 — n1-standard-8 + 1x nvidia-tesla-t4 — n1-standard-8\
        \ + 1x T4 — GPU training steps (scale-from-0)\n\nRule of thumb: pick a GPU\
        \ class (e.g. gpu-t4) for model-training, qat-finetune and model-quantization;\
        \ a CPU class (e.g. cpu-standard) is enough for config-validation, dataset-loading\
        \ and model-registration. The default is already set correctly for this step."
      enum: *id001
    - name: model-quantization-class
      value: gpu-t4
      description: "Which machine the 'model-quantization' step runs on. Leave the\
        \ default unless you need more/less power. This step normally needs a GPU\
        \ — the default is a GPU class.\n\nAvailable machines:\n  - cpu-standard —\
        \ n2-standard-8 — n2-standard-8 (8 vCPU, 32 GiB) — CPU pipeline steps (headroom\
        \ for heavier CPU steps; scale-from-0 so cost only during a step)\n  - kubecorecpu\
        \ — e2-standard-8 — e2-standard-8 + 200GiB — CI builds (kaniko), sized for\
        \ build-push req 4cpu/12Gi\n  - gpu-t4 — n1-standard-8 + 1x nvidia-tesla-t4\
        \ — n1-standard-8 + 1x T4 — GPU training steps (scale-from-0)\n\nRule of thumb:\
        \ pick a GPU class (e.g. gpu-t4) for model-training, qat-finetune and model-quantization;\
        \ a CPU class (e.g. cpu-standard) is enough for config-validation, dataset-loading\
        \ and model-registration. The default is already set correctly for this step."
      enum: *id001
    - name: model-registration-class
      value: cpu-standard
      description: "Which machine the 'model-registration' step runs on. Leave the\
        \ default unless you need more/less power.\n\nAvailable machines:\n  - cpu-standard\
        \ — n2-standard-8 — n2-standard-8 (8 vCPU, 32 GiB) — CPU pipeline steps (headroom\
        \ for heavier CPU steps; scale-from-0 so cost only during a step)\n  - kubecorecpu\
        \ — e2-standard-8 — e2-standard-8 + 200GiB — CI builds (kaniko), sized for\
        \ build-push req 4cpu/12Gi\n  - gpu-t4 — n1-standard-8 + 1x nvidia-tesla-t4\
        \ — n1-standard-8 + 1x T4 — GPU training steps (scale-from-0)\n\nRule of thumb:\
        \ pick a GPU class (e.g. gpu-t4) for model-training, qat-finetune and model-quantization;\
        \ a CPU class (e.g. cpu-standard) is enough for config-validation, dataset-loading\
        \ and model-registration. The default is already set correctly for this step."
      enum: *id001
    - name: registered-model-name
      value: kubeline-static-model
    - name: promote-to
      value: ''
  templates:
  - name: kubeline-static-pipeline
    dag:
      tasks:
      - name: config-validation-cpu
        template: config-validation-cpu
        when: '{{=!(workflow.parameters[''config-validation-class''] == ''gpu-t4'')}}'
        arguments:
          parameters:
          - name: dataset-path-override
            value: '{{=workflow.parameters[''dataset-path-override'']}}'
      - name: config-validation-gpu
        template: config-validation-gpu
        when: '{{=workflow.parameters[''config-validation-class''] == ''gpu-t4''}}'
        arguments:
          parameters:
          - name: dataset-path-override
            value: '{{=workflow.parameters[''dataset-path-override'']}}'
      - name: dataset-loading-cpu
        template: dataset-loading-cpu
        when: '{{=!(workflow.parameters[''dataset-loading-class''] == ''gpu-t4'')}}'
        depends: (config-validation-cpu.Succeeded || config-validation-cpu.Skipped)
          && (config-validation-gpu.Succeeded || config-validation-gpu.Skipped)
        arguments:
          parameters:
          - name: dataset-path-override
            value: '{{=workflow.parameters[''dataset-path-override'']}}'
      - name: dataset-loading-gpu
        template: dataset-loading-gpu
        when: '{{=workflow.parameters[''dataset-loading-class''] == ''gpu-t4''}}'
        depends: (config-validation-cpu.Succeeded || config-validation-cpu.Skipped)
          && (config-validation-gpu.Succeeded || config-validation-gpu.Skipped)
        arguments:
          parameters:
          - name: dataset-path-override
            value: '{{=workflow.parameters[''dataset-path-override'']}}'
      - name: model-training-cpu
        template: model-training-cpu
        when: '{{=!(workflow.parameters[''model-training-class''] == ''gpu-t4'')}}'
        depends: (dataset-loading-cpu.Succeeded || dataset-loading-cpu.Skipped) &&
          (dataset-loading-gpu.Succeeded || dataset-loading-gpu.Skipped)
        arguments:
          parameters:
          - name: dataset-path-override
            value: '{{=workflow.parameters[''dataset-path-override'']}}'
          - name: data-yaml
            value: '{{=(workflow.parameters[''dataset-loading-class''] == ''gpu-t4'')
              ? tasks[''dataset-loading-gpu''].outputs.parameters[''data-yaml''] :
              tasks[''dataset-loading-cpu''].outputs.parameters[''data-yaml'']}}'
          - name: manifest-summary
            value: '{{=(workflow.parameters[''dataset-loading-class''] == ''gpu-t4'')
              ? tasks[''dataset-loading-gpu''].outputs.parameters[''manifest-summary'']
              : tasks[''dataset-loading-cpu''].outputs.parameters[''manifest-summary'']}}'
      - name: model-training-gpu
        template: model-training-gpu
        when: '{{=workflow.parameters[''model-training-class''] == ''gpu-t4''}}'
        depends: (dataset-loading-cpu.Succeeded || dataset-loading-cpu.Skipped) &&
          (dataset-loading-gpu.Succeeded || dataset-loading-gpu.Skipped)
        arguments:
          parameters:
          - name: dataset-path-override
            value: '{{=workflow.parameters[''dataset-path-override'']}}'
          - name: data-yaml
            value: '{{=(workflow.parameters[''dataset-loading-class''] == ''gpu-t4'')
              ? tasks[''dataset-loading-gpu''].outputs.parameters[''data-yaml''] :
              tasks[''dataset-loading-cpu''].outputs.parameters[''data-yaml'']}}'
          - name: manifest-summary
            value: '{{=(workflow.parameters[''dataset-loading-class''] == ''gpu-t4'')
              ? tasks[''dataset-loading-gpu''].outputs.parameters[''manifest-summary'']
              : tasks[''dataset-loading-cpu''].outputs.parameters[''manifest-summary'']}}'
      - name: qat-finetune-cpu
        template: qat-finetune-cpu
        when: '{{=(!(workflow.parameters[''qat-finetune-class''] == ''gpu-t4'')) &&
          workflow.parameters[''quantization-mode''] == ''qat''}}'
        depends: (model-training-cpu.Succeeded || model-training-cpu.Skipped) && (model-training-gpu.Succeeded
          || model-training-gpu.Skipped)
        arguments:
          parameters:
          - name: dataset-path-override
            value: '{{=workflow.parameters[''dataset-path-override'']}}'
          - name: training-result
            value: '{{=(workflow.parameters[''model-training-class''] == ''gpu-t4'')
              ? tasks[''model-training-gpu''].outputs.parameters[''training-result'']
              : tasks[''model-training-cpu''].outputs.parameters[''training-result'']}}'
          - name: data-yaml
            value: '{{=(workflow.parameters[''dataset-loading-class''] == ''gpu-t4'')
              ? tasks[''dataset-loading-gpu''].outputs.parameters[''data-yaml''] :
              tasks[''dataset-loading-cpu''].outputs.parameters[''data-yaml'']}}'
          - name: manifest-summary
            value: '{{=(workflow.parameters[''dataset-loading-class''] == ''gpu-t4'')
              ? tasks[''dataset-loading-gpu''].outputs.parameters[''manifest-summary'']
              : tasks[''dataset-loading-cpu''].outputs.parameters[''manifest-summary'']}}'
      - name: qat-finetune-gpu
        template: qat-finetune-gpu
        when: '{{=(workflow.parameters[''qat-finetune-class''] == ''gpu-t4'') && workflow.parameters[''quantization-mode'']
          == ''qat''}}'
        depends: (model-training-cpu.Succeeded || model-training-cpu.Skipped) && (model-training-gpu.Succeeded
          || model-training-gpu.Skipped)
        arguments:
          parameters:
          - name: dataset-path-override
            value: '{{=workflow.parameters[''dataset-path-override'']}}'
          - name: training-result
            value: '{{=(workflow.parameters[''model-training-class''] == ''gpu-t4'')
              ? tasks[''model-training-gpu''].outputs.parameters[''training-result'']
              : tasks[''model-training-cpu''].outputs.parameters[''training-result'']}}'
          - name: data-yaml
            value: '{{=(workflow.parameters[''dataset-loading-class''] == ''gpu-t4'')
              ? tasks[''dataset-loading-gpu''].outputs.parameters[''data-yaml''] :
              tasks[''dataset-loading-cpu''].outputs.parameters[''data-yaml'']}}'
          - name: manifest-summary
            value: '{{=(workflow.parameters[''dataset-loading-class''] == ''gpu-t4'')
              ? tasks[''dataset-loading-gpu''].outputs.parameters[''manifest-summary'']
              : tasks[''dataset-loading-cpu''].outputs.parameters[''manifest-summary'']}}'
      - name: model-quantization-cpu
        template: model-quantization-cpu
        when: '{{=(!(workflow.parameters[''model-quantization-class''] == ''gpu-t4''))
          && workflow.parameters[''quantization-mode''] != ''none''}}'
        depends: (model-training-cpu.Succeeded || model-training-cpu.Skipped) && (model-training-gpu.Succeeded
          || model-training-gpu.Skipped) && (qat-finetune-cpu.Succeeded || qat-finetune-cpu.Skipped)
