apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: data-clean-pipeline
  namespace: PLACEHOLDER-vision-runtime
  labels:
    platform.kubecore.io/project: vision
    platform.kubecore.io/app: data-clean
    platform.kubecore.io/managed-by: kubecore-ci
  annotations:
    platform.kubecore.io/generated-by: ml-ci-build/hera-render
    platform.kubecore.io/cost-tracking: enabled
spec:
  entrypoint: main
  templates:
  - name: compose-and-validate
    container:
      image: '{{workflow.parameters.image-compose-and-validate}}'
      args:
      - platform.lakefs.repository=PLACEHOLDER-repo
      - platform.lakefs.endpoint=http://lakefs.internal.invalid
      - platform.mlflow.tracking_uri=http://mlflow.internal.invalid
      - platform.checkpoints.bucket=PLACEHOLDER-bucket
      - platform.checkpoints.prefix=main/checkpoints
      - experiment.name={{workflow.parameters.experiment-name}}
      - experiment.description={{workflow.parameters.experiment-description}}
      - --render-defaults
      - '{"experiment.name":"my-experiment-v1","experiment.description":""}'
      - --advanced
      - '{{workflow.parameters.config}}'
      - --require=experiment
      - --output
      - /work/params.yaml
      command:
      - python
      - -m
      - kubecore.compose
      env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: CHECKPOINT_BUCKET
        value: PLACEHOLDER-bucket
      - name: CHECKPOINT_PREFIX
        value: main/checkpoints
      - name: KUBECORE_RUN_ID
        value: '{{workflow.name}}'
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
    outputs:
      parameters:
      - name: params
        valueFrom:
          path: /work/params.yaml
    podSpecPatch: "containers:\n- name: main\n  resources:\n    requests:\n      cpu:\
      \ \"{{workflow.parameters.compose-and-validate-cpu}}\"\n      memory: \"{{workflow.parameters.compose-and-validate-mem}}\"\
      \n      ephemeral-storage: \"{{workflow.parameters.compose-and-validate-disk}}\"\
      \n    limits:\n      cpu: \"{{workflow.parameters.compose-and-validate-cpu}}\"\
      \n      memory: \"{{workflow.parameters.compose-and-validate-mem}}\"\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.compose-and-validate-class}}'
      platform.kubecore.io/environment: runtime
      platform.kubecore.io/project: vision
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: platform.kubecore.io/kubenv
      operator: Equal
      value: runtime
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
  - name: hello-world
    container:
      image: '{{workflow.parameters.image-hello-world}}'
      args:
      - --params
      - '{{inputs.parameters.params}}'
      command:
      - python
      - -m
      - app.entry
      env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: CHECKPOINT_BUCKET
        value: PLACEHOLDER-bucket
      - name: CHECKPOINT_PREFIX
        value: main/checkpoints
      - name: KUBECORE_RUN_ID
        value: '{{workflow.name}}'
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
    inputs:
      parameters:
      - name: params
    podSpecPatch: "containers:\n- name: main\n  resources:\n    requests:\n      cpu:\
      \ \"{{workflow.parameters.hello-world-cpu}}\"\n      memory: \"{{workflow.parameters.hello-world-mem}}\"\
      \n      ephemeral-storage: \"{{workflow.parameters.hello-world-disk}}\"\n  \
      \  limits:\n      cpu: \"{{workflow.parameters.hello-world-cpu}}\"\n      memory:\
      \ \"{{workflow.parameters.hello-world-mem}}\"\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.hello-world-class}}'
      platform.kubecore.io/environment: runtime
      platform.kubecore.io/project: vision
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: platform.kubecore.io/kubenv
      operator: Equal
      value: runtime
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
  - name: main
    dag:
      tasks:
      - name: compose-and-validate
        template: compose-and-validate
      - name: hello-world
        depends: compose-and-validate
        template: hello-world
        arguments:
          parameters:
          - name: params
            value: '{{tasks.compose-and-validate.outputs.parameters.params}}'
  arguments:
    parameters:
    - name: pipeline-info
      value: "HOW TO RUN: defaults are runnable as-is \u2014 just press Submit.\n\
        PER-STEP COMPUTE: {step}-class picks the node class; {step}-cpu / {step}-mem\
        \ dial one run's resources.\nCOMPUTE CLASSES on this pool:\n  - cpu-standard\
        \ (cpu) \u2014 n2-standard-8\n  - kubecorecpu (cpu) \u2014 e2-standard-8\n\
        \  - gpu-t4 (gpu) \u2014 n1-standard-8 + 1x nvidia-tesla-t4\nSTEPS: compose-and-validate\
        \ -> hello-world\n(This field is informational \u2014 leave it unchanged.)"
      description: 'Read-only: live pool compute classes + how to fill this form.
        Leave unchanged.'
    - name: experiment-name
      description: 'Config: experiment.name'
      value: my-experiment-v1
    - name: experiment-description
      description: 'Config: experiment.description'
      value: ''
    - name: config
      description: "ADVANCED: override YAML merged LAST over the composed config (OmegaConf.merge).\
        \ Overrides everything above \u2014 intended for scripted submissions (argo\
        \ submit -p config=...). May not modify platform.*."
      value: ''
    - name: mlflow-endpoint
      value: http://mlflow.internal.invalid
    - name: lakefs-endpoint
      value: http://lakefs.internal.invalid
    - name: lakefs-repo
      value: PLACEHOLDER-repo
    - name: image-compose-and-validate
      valueFrom:
        configMapKeyRef:
          name: data-clean-pipeline-images
          key: compose-and-validate
    - name: image-hello-world
      valueFrom:
        configMapKeyRef:
          name: data-clean-pipeline-images
          key: hello-world
    - name: compose-and-validate-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      - gpu-t4
      description: Compute class for the 'compose-and-validate' step (the KubePool's
        class catalog; default = its cpu tier).
    - name: compose-and-validate-cpu
      value: '7'
      description: Per-run resource override for step 'compose-and-validate'.
    - name: compose-and-validate-mem
      value: 27Gi
      description: Per-run resource override for step 'compose-and-validate'.
    - name: compose-and-validate-disk
      value: 10Gi
      description: Per-run resource override for step 'compose-and-validate'.
    - name: hello-world-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      - gpu-t4
      description: Compute class for the 'hello-world' step (the KubePool's class
        catalog; default = its cpu tier).
    - name: hello-world-cpu
      value: '7'
      description: Per-run resource override for step 'hello-world'.
    - name: hello-world-mem
      value: 27Gi
      description: Per-run resource override for step 'hello-world'.
    - name: hello-world-disk
      value: 10Gi
      description: Per-run resource override for step 'hello-world'.
  serviceAccountName: argo-workflow
