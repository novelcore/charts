apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: demo-pipeline
  namespace: PLACEHOLDER-data-room-runtime
  labels:
    platform.kubecore.io/project: data-room
    platform.kubecore.io/app: demo
    platform.kubecore.io/managed-by: kubecore-ci
  annotations:
    platform.kubecore.io/generated-by: ml-ci-build/hera-render
    platform.kubecore.io/cost-tracking: enabled
spec:
  entrypoint: main
  templates:
  - name: compose-and-validate
    container:
      image: '{{workflow.parameters.image-compose-and-validate}}'
      args:
      - experiment.name={{workflow.parameters.experiment-name}}
      - experiment.description={{workflow.parameters.experiment-description}}
      - dataset={{workflow.parameters.dataset}}
      - --render-defaults
      - '{"experiment.name":"my-experiment-v1","experiment.description":"","dataset":"dataset-default@latest"}'
      - --advanced
      - '{{workflow.parameters.config}}'
      - --require=experiment
      - --run
      - '{{workflow.name}}'
      - --steps
      - '[{"name":"hello-world","kind":"transform","reads":["experiment"],"inputs":["dataset"],"needs":[],"produces":[{"name":"report","type":"artifact"}]}]'
      - --context-dir
      - /work/context
      - --ledger-output
      - /work/kaos-ledger.json
      - --app
      - demo
      - --project
      - data-room
      command:
      - python
      - -I
      - -m
      - kaos_engine.compose
      env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: KAOS_CHECKPOINT_DIR
        value: /kaos/checkpoint
      - name: KAOS_STEP_IMAGES
        value: '{"hello-world":"{{workflow.parameters.image-hello-world}}"}'
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
      - name: kaos-checkpoint
        mountPath: /kaos/checkpoint
    metadata:
      labels:
        platform.kubecore.io/step: compose-and-validate
        platform.kubecore.io/step-kind: control
    outputs:
      parameters:
      - name: kaos-ledger
        valueFrom:
          path: /work/kaos-ledger.json
      - name: kaos-context-hello-world
        valueFrom:
          path: /work/context/hello-world.json
    inputs:
      parameters:
      - name: cpu
        default: '7'
      - name: mem
        default: 27Gi
      - name: disk
        default: 10Gi
    podSpecPatch: "containers:\n- name: main\n  resources:\n    limits:\n      cpu:\
      \ '{{inputs.parameters.cpu}}'\n      memory: '{{inputs.parameters.mem}}'\n \
      \   requests:\n      cpu: '{{inputs.parameters.cpu}}'\n      ephemeral-storage:\
      \ '{{inputs.parameters.disk}}'\n      memory: '{{inputs.parameters.mem}}'\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.compose-and-validate-class}}'
      platform.kubecore.io/environment: runtime
      platform.kubecore.io/project: data-room
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: platform.kubecore.io/kubenv
      operator: Equal
      value: runtime
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-checkpoint
      emptyDir: {}
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: ((lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message contains 'kaos-result.json')) and not (lastRetry.message
        startsWith 'KaosIdle')
      backoff:
        duration: 30s
        factor: '2'
        maxDuration: 10m
  - name: hello-world
    container:
      image: '{{workflow.parameters.image-hello-world}}'
      command:
      - python
      - -m
      - app.entry
      env:
      - name: KAOS_STEP_CONTEXT
        value: '{{inputs.parameters.kaos-context}}'
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: KAOS_CHECKPOINT_DIR
        value: /kaos/checkpoint
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
      - name: kaos-checkpoint
        mountPath: /kaos/checkpoint
    inputs:
      parameters:
      - name: kaos-context
      - name: cpu
        default: '7'
      - name: mem
        default: 27Gi
      - name: disk
        default: 10Gi
    metadata:
      labels:
        platform.kubecore.io/step: hello-world
        platform.kubecore.io/step-kind: transform
    outputs:
      parameters:
      - name: kaos-result
        valueFrom:
          path: /work/output/kaos-result.json
    podSpecPatch: "containers:\n- name: main\n  resources:\n    limits:\n      cpu:\
      \ '{{inputs.parameters.cpu}}'\n      memory: '{{inputs.parameters.mem}}'\n \
      \   requests:\n      cpu: '{{inputs.parameters.cpu}}'\n      ephemeral-storage:\
      \ '{{inputs.parameters.disk}}'\n      memory: '{{inputs.parameters.mem}}'\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.hello-world-class}}'
      platform.kubecore.io/environment: runtime
      platform.kubecore.io/project: data-room
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: platform.kubecore.io/kubenv
      operator: Equal
      value: runtime
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-checkpoint
      emptyDir: {}
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: ((lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message contains 'kaos-result.json')) and not (lastRetry.message
        startsWith 'KaosIdle')
      backoff:
        duration: 30s
        factor: '2'
        maxDuration: 10m
  - name: main
    dag:
      tasks:
      - name: compose-and-validate
        template: compose-and-validate
        arguments:
          parameters:
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[workflow.parameters[''compose-and-validate-class'']])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[workflow.parameters[''compose-and-validate-class'']]) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[workflow.parameters[''compose-and-validate-class'']]) ?? "10Gi"}}'
      - name: hello-world
        depends: compose-and-validate
        template: hello-world
        arguments:
          parameters:
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-hello-world"])
              + ",\"upstream\":{" + "}" + "}"}}'
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[workflow.parameters[''hello-world-class'']])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[workflow.parameters[''hello-world-class'']]) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[workflow.parameters[''hello-world-class'']]) ?? "10Gi"}}'
        when: '{{=!hasPrefix(workflow.parameters[''hello-world-class''], ''meluxina-'')}}'
      - name: hello-world-hpc
        template: hpc-follower
        when: '{{=hasPrefix(workflow.parameters[''hello-world-class''], ''meluxina-'')}}'
        arguments:
          parameters:
          - name: step-name
            value: hello-world
          - name: image
            value: '{{workflow.parameters.image-hello-world}}'
          - name: step-command
            value: '["python","-m","app.entry"]'
          - name: step-kind
            value: transform
          - name: time-limit
            value: '240'
          - name: deadline-seconds
            value: '259200'
          - name: resumable-lead
            value: '0'
          - name: resumable
            value: auto
          - name: idle-timeout
            value: ''
          - name: hpc-class
            value: '{{workflow.parameters.hello-world-class}}'
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-hello-world"])
              + ",\"upstream\":{" + "}" + "}"}}'
        depends: compose-and-validate
  - name: hpc-follower
    inputs:
      parameters:
      - name: step-name
      - name: image
      - name: step-command
      - name: step-kind
      - name: time-limit
      - name: deadline-seconds
      - name: hpc-class
      - name: resumable-lead
        value: '0'
      - name: resumable
        value: auto
      - name: idle-timeout
        value: ''
      - name: kaos-context
    metadata:
      labels:
        platform.kubecore.io/compute-type: hpc
        platform.kubecore.io/hpc-class: '{{inputs.parameters.hpc-class}}'
        platform.kubecore.io/step-kind: '{{inputs.parameters.step-kind}}'
    outputs:
      parameters:
      - name: slurm-job-id
        valueFrom:
          path: /tmp/slurm-job-id
      - name: kaos-result
        valueFrom:
          path: /tmp/outputs/kaos-result.json
    container:
      image: python:3.12-alpine
      command:
      - sh
      - -c
      args:
      - echo "$HPC_NOT_SERVED" >&2; exit 1
      env:
      - name: HPC_NOT_SERVED
        value: 'MeluXina steps run through the pool''s HPC controller, which does
          not serve this project: enable operators.hpc on the pool (KubePool spec.operators.hpc)
          and wait until the project''s MeluXina budget is known, or pick an in-cluster
          class. Nothing was submitted.'
  arguments:
    parameters:
    - name: pipeline-info
      value: "HOW TO RUN: defaults are runnable as-is \u2014 just press Submit.\n\
        PER-STEP COMPUTE: {step}-class picks the node class; the step gets that node\
        \ (what it offers a pod, less the platform's reserve).\nCOMPUTE CLASSES on\
        \ this pool:\n  - cpu-standard (cpu) \u2014 n2-standard-8\n  - kubecorecpu\
        \ (cpu) \u2014 e2-standard-8\n  - gpu-t4 (gpu) \u2014 n1-standard-8 + 1x nvidia-tesla-t4\n\
        MELUXINA (HPC): pick a meluxina-* class in any {step}-class dropdown and that\
        \ step runs as a Slurm job on MeluXina (account PLACEHOLDER-account) \u2014\
        \ queue time applies; the pipeline waits, stages the dataset in and the step's\
        \ result back; walltime= in pipeline.py caps the job. Classes:\n  - meluxina-gpu\
        \ (gpu) \u2014 partition gpu, 4 GPUs, 128 cores, 512 GiB \u2014 4x A100-40GB,\
        \ 2x EPYC 7452, 512 GB\n  - meluxina-cpu (cpu) \u2014 partition cpu, 128 cores,\
        \ 512 GiB \u2014 2x EPYC 7452, 128 cores, 512 GB\n  - meluxina-largemem (cpu)\
        \ \u2014 partition largemem, 128 cores, 4096 GiB \u2014 4 TB\nSTEPS: compose-and-validate\
        \ -> hello-world\n(This field is informational \u2014 leave it unchanged.)"
      description: 'Read-only: live pool compute classes + how to fill this form.
        Leave unchanged.'
    - name: experiment-name
      description: 'Config: experiment.name'
      value: my-experiment-v1
    - name: experiment-description
      description: 'Config: experiment.description'
      value: ''
    - name: dataset
      description: 'Config: dataset'
      value: dataset-default@latest
    - name: config
      description: "ADVANCED: override YAML merged LAST over the composed config (OmegaConf.merge).\
        \ Overrides everything above \u2014 intended for scripted submissions (argo\
        \ submit -p config=...)."
      value: ''
    - name: mlflow-endpoint
      value: http://mlflow.internal.invalid
    - name: lakefs-endpoint
      value: http://lakefs.internal.invalid
    - name: lakefs-repo
      value: PLACEHOLDER-repo
    - name: image-compose-and-validate
      valueFrom:
        configMapKeyRef:
          name: demo-pipeline-images
          key: compose-and-validate
    - name: image-hello-world
      valueFrom:
        configMapKeyRef:
          name: demo-pipeline-images
          key: hello-world
    - name: compose-and-validate-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      - gpu-t4
      description: Compute class for the 'compose-and-validate' step (the KubePool's
        class catalog; default = its cpu tier).
    - name: hello-world-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      - gpu-t4
      - meluxina-gpu
      - meluxina-cpu
      - meluxina-largemem
      description: "Compute class for the 'hello-world' step (the KubePool's class\
        \ catalog; default = its cpu tier; meluxina-* classes run the step as a Slurm\
        \ job on MeluXina \u2014 queue time applies, see pipeline-info)."
  serviceAccountName: argo-workflow
