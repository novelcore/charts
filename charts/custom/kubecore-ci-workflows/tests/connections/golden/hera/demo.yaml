apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: demo-pipeline
  namespace: PLACEHOLDER-data-room-runtime
  labels:
    platform.kubecore.io/project: data-room
    platform.kubecore.io/app: demo
    platform.kubecore.io/managed-by: kubecore-ci
  annotations:
    platform.kubecore.io/generated-by: ml-ci-build/hera-render
    platform.kubecore.io/cost-tracking: enabled
spec:
  entrypoint: main
  templates:
  - name: compose-and-validate
    container:
      image: '{{workflow.parameters.image-compose-and-validate}}'
      args:
      - platform.lakefs.repository=PLACEHOLDER-repo
      - platform.lakefs.endpoint=http://lakefs.internal.invalid
      - platform.mlflow.tracking_uri=http://mlflow.internal.invalid
      - platform.checkpoints.bucket=PLACEHOLDER-bucket
      - platform.checkpoints.prefix=main/checkpoints
      - experiment.name={{workflow.parameters.experiment-name}}
      - experiment.description={{workflow.parameters.experiment-description}}
      - --render-defaults
      - '{"experiment.name":"my-experiment-v1","experiment.description":""}'
      - --advanced
      - '{{workflow.parameters.config}}'
      - --require=experiment
      - --output
      - /work/params.yaml
      command:
      - python
      - -m
      - kubecore.compose
      env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: CHECKPOINT_BUCKET
        value: PLACEHOLDER-bucket
      - name: CHECKPOINT_PREFIX
        value: main/checkpoints
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
    outputs:
      parameters:
      - name: params
        valueFrom:
          path: /work/params.yaml
    podSpecPatch: "containers:\n- name: main\n  resources:\n    requests:\n      cpu:\
      \ \"{{workflow.parameters.compose-and-validate-cpu}}\"\n      memory: \"{{workflow.parameters.compose-and-validate-mem}}\"\
      \n      ephemeral-storage: \"{{workflow.parameters.compose-and-validate-disk}}\"\
      \n    limits:\n      cpu: \"{{workflow.parameters.compose-and-validate-cpu}}\"\
      \n      memory: \"{{workflow.parameters.compose-and-validate-mem}}\"\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.compose-and-validate-class}}'
      platform.kubecore.io/environment: runtime
      platform.kubecore.io/project: data-room
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: platform.kubecore.io/kubenv
      operator: Equal
      value: runtime
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
  - name: hello-world
    container:
      image: '{{workflow.parameters.image-hello-world}}'
      args:
      - --params
      - '{{inputs.parameters.params}}'
      command:
      - python
      - -m
      - app.entry
      env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: CHECKPOINT_BUCKET
        value: PLACEHOLDER-bucket
      - name: CHECKPOINT_PREFIX
        value: main/checkpoints
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
    inputs:
      parameters:
      - name: params
    podSpecPatch: "containers:\n- name: main\n  resources:\n    requests:\n      cpu:\
      \ \"{{workflow.parameters.hello-world-cpu}}\"\n      memory: \"{{workflow.parameters.hello-world-mem}}\"\
      \n      ephemeral-storage: \"{{workflow.parameters.hello-world-disk}}\"\n  \
      \  limits:\n      cpu: \"{{workflow.parameters.hello-world-cpu}}\"\n      memory:\
      \ \"{{workflow.parameters.hello-world-mem}}\"\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.hello-world-class}}'
      platform.kubecore.io/environment: runtime
      platform.kubecore.io/project: data-room
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: platform.kubecore.io/kubenv
      operator: Equal
      value: runtime
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
  - name: main
    dag:
      tasks:
      - name: compose-and-validate
        template: compose-and-validate
        when: '{{=!hasPrefix(workflow.parameters[''compose-and-validate-class''],
          ''meluxina-'')}}'
      - name: compose-and-validate-meluxina
        template: meluxina-run
        when: '{{=hasPrefix(workflow.parameters[''compose-and-validate-class''], ''meluxina-'')}}'
        arguments:
          parameters:
          - name: step-name
            value: compose-and-validate
          - name: image
            value: '{{workflow.parameters.image-compose-and-validate}}'
          - name: step-command
            value: '["python", "-m", "kubecore.compose", "platform.lakefs.repository=PLACEHOLDER-repo",
              "platform.lakefs.endpoint=http://lakefs.internal.invalid", "platform.mlflow.tracking_uri=http://mlflow.internal.invalid",
              "platform.checkpoints.bucket=PLACEHOLDER-bucket", "platform.checkpoints.prefix=main/checkpoints",
              {{=toJson(''experiment.name='' + workflow.parameters[''experiment-name''])}},
              {{=toJson(''experiment.description='' + workflow.parameters[''experiment-description''])}},
              "--render-defaults", "{\"experiment.name\":\"my-experiment-v1\",\"experiment.description\":\"\"}",
              "--advanced", {{=toJson(workflow.parameters.config)}}, "--require=experiment",
              "--output", "/work/params.yaml"]'
          - name: time-limit
            value: '240'
          - name: deadline-seconds
            value: '43200'
          - name: step-outputs
            value: params
          - name: hpc-class
            value: '{{workflow.parameters.compose-and-validate-class}}'
      - name: hello-world
        depends: ((compose-and-validate.Succeeded || compose-and-validate.Skipped)
          && (compose-and-validate-meluxina.Succeeded || compose-and-validate-meluxina.Skipped))
        template: hello-world
        arguments:
          parameters:
          - name: params
            value: '{{=tasks[''compose-and-validate''].status == ''Skipped'' ? tasks[''compose-and-validate-meluxina''].outputs.parameters[''params'']
              : tasks[''compose-and-validate''].outputs.parameters[''params'']}}'
        when: '{{=!hasPrefix(workflow.parameters[''hello-world-class''], ''meluxina-'')}}'
      - name: hello-world-meluxina
        template: meluxina-run
        when: '{{=hasPrefix(workflow.parameters[''hello-world-class''], ''meluxina-'')}}'
        arguments:
          parameters:
          - name: step-name
            value: hello-world
          - name: image
            value: '{{workflow.parameters.image-hello-world}}'
          - name: step-command
            value: '["python", "-m", "app.entry", "--params", {{=toJson(tasks[''compose-and-validate''].status
              == ''Skipped'' ? tasks[''compose-and-validate-meluxina''].outputs.parameters[''params'']
              : tasks[''compose-and-validate''].outputs.parameters[''params''])}}]'
          - name: time-limit
            value: '240'
          - name: deadline-seconds
            value: '43200'
          - name: step-outputs
            value: ''
          - name: hpc-class
            value: '{{workflow.parameters.hello-world-class}}'
        depends: ((compose-and-validate.Succeeded || compose-and-validate.Skipped)
          && (compose-and-validate-meluxina.Succeeded || compose-and-validate-meluxina.Skipped))
  - name: meluxina-run
    inputs:
      parameters:
      - name: step-name
      - name: image
      - name: step-command
      - name: time-limit
      - name: deadline-seconds
      - name: step-outputs
        value: ''
      - name: hpc-class
    activeDeadlineSeconds: '{{inputs.parameters.deadline-seconds}}'
    retryStrategy:
      limit: '2'
      retryPolicy: OnError
    metadata:
      labels:
        platform.kubecore.io/compute-type: hpc
        platform.kubecore.io/hpc-class: '{{inputs.parameters.hpc-class}}'
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
        optional: true
    - name: meluxina-jwt
      secret:
        secretName: meluxina-jwt
        optional: true
    container:
      image: python:3.12-alpine
      command:
      - python3
      - -c
      - "\nSTAGEOUT = r\"\"\"\n# F-05 stage-out: the step's declared outputs (/work/output/<name>.json,\n\
        # what Argo would have read as outputs.parameters in-cluster) go to lakeFS\n\
        # at hpc-outputs/{wf-uid}/{step}/ on the run's branch; the waiter fetches\n\
        # them back into the twin's outputs so downstream steps see real values.\n\
        import json, os, pathlib, urllib.parse, urllib.request\nbase = os.environ['LAKEFS_ENDPOINT'].rstrip('/')\
        \ + '/api/v1'\nH = {'Authorization': 'Bearer ' + os.environ['LAKEFS_BEARER_TOKEN']}\n\
        repo = os.environ['DATASET_REPO']; branch = os.environ.get('DATASET_REF')\
        \ or 'main'\nprefix = 'hpc-outputs/%s/%s/' % (os.environ['WF_UID'], os.environ['STEP_NAME'])\n\
        out = pathlib.Path(os.environ['KAOS_WORK']) / 'output'\nfor name in [n for\
        \ n in os.environ.get('STEP_OUTPUTS', '').split(',') if n]:\n    f = out /\
        \ (name + '.json')\n    if not f.exists():\n        print('stage-out: no',\
        \ f, flush=True); continue\n    data = f.read_bytes()\n    body = (b'--B\\\
        r\\nContent-Disposition: form-data; name=\"content\"; filename=\"f\"\\r\\\
        n'\n            b'Content-Type: application/octet-stream\\r\\n\\r\\n' + data\
        \ + b'\\r\\n--B--\\r\\n')\n    q = urllib.parse.urlencode({'path': prefix\
        \ + name + '.json'})\n    req = urllib.request.Request(base + '/repositories/%s/branches/%s/objects?%s'\
        \ % (repo, branch, q),\n                                 data=body, method='POST',\n\
        \                                 headers=dict(H, **{'Content-Type': 'multipart/form-data;\
        \ boundary=B'}))\n    urllib.request.urlopen(req, timeout=120).read()\n  \
        \  print('stage-out:', name, len(data), 'bytes ->', prefix, flush=True)\n\"\
        \"\"\nimport base64, json, os, shlex, signal, sys, time, urllib.parse, urllib.request\n\
        \n# F-04 stage-in, run ON the compute node (system python3, stdlib only):\n\
        # resolve ref -> commit, download every object of that version from the\n\
        # lakeFS PUBLIC endpoint (bearer through oauth2-proxy \u2014 the in-cluster\n\
        # S3-gateway/manifest streaming path is blocked by the SSO front\n# off-cluster)\
        \ into a Lustre cache keyed by commit, parallel + resumable\n# (size-matched\
        \ files are skipped, .part rename is atomic). Rides to the\n# node base64-encoded\
        \ in the job environment.\nSTAGEIN = \"\"\"\nimport concurrent.futures, json,\
        \ os, pathlib, sys, urllib.parse, urllib.request\nEP = os.environ['LAKEFS_ENDPOINT'].rstrip('/')\n\
        H = {'Authorization': 'Bearer ' + os.environ['LAKEFS_BEARER_TOKEN']}\nREPO,\
        \ REF = os.environ['DATASET_REPO'], os.environ['DATASET_REF']\ndef get(url):\n\
        \    return urllib.request.urlopen(\n        urllib.request.Request(url, headers=H),\
        \ timeout=120)\nbase = EP + '/api/v1/repositories/' + urllib.parse.quote(REPO,\
        \ safe='')\n# ref -> tip commit via the commit LOG (amount=1). GET /refs/{ref}\
        \ does not\n# exist on our lakeFS version (404, live job 5143633) \u2014 the\
        \ seeded loader's\n# /refs/{ref}/commits endpoint is the proven one.\ncommit\
        \ = json.load(get(base + '/refs/' + urllib.parse.quote(REF, safe='')\n   \
        \                    + '/commits?amount=1'))['results'][0]['id']\ndest = pathlib.Path(os.environ['DATASET_CACHE'])\
        \ / REPO / commit\nopen(os.environ['DATASET_DIRFILE'], 'w').write(str(dest))\n\
        if (dest / '.complete').exists():\n    print('stage-in: cache hit', dest,\
        \ flush=True)\n    sys.exit(0)\nobjs, after = [], ''\nwhile True:\n    page\
        \ = json.load(get(base + '/refs/' + commit + '/objects/ls?'\n            \
        \             + urllib.parse.urlencode(\n                             {'amount':\
        \ 1000, 'after': after})))\n    objs += [r for r in page.get('results') or\
        \ []\n             if r.get('path_type') == 'object']\n    pg = page.get('pagination')\
        \ or {}\n    if not pg.get('has_more'):\n        break\n    after = pg.get('next_offset')\
        \ or ''\nprint('stage-in:', len(objs), 'objects @', commit[:12], flush=True)\n\
        def fetch(o):\n    p = dest / o['path']\n    if p.exists() and p.stat().st_size\
        \ == o.get('size_bytes'):\n        return 0\n    p.parent.mkdir(parents=True,\
        \ exist_ok=True)\n    tmp = str(p) + '.part'\n    with get(base + '/refs/'\
        \ + commit + '/objects?'\n             + urllib.parse.urlencode({'path': o['path']}))\
        \ as r:\n        with open(tmp, 'wb') as f:\n            while True:\n   \
        \             b = r.read(1 << 20)\n                if not b:\n           \
        \         break\n                f.write(b)\n    os.replace(tmp, p)\n    return\
        \ 1\nwith concurrent.futures.ThreadPoolExecutor(8) as ex:\n    n = sum(ex.map(fetch,\
        \ objs))\n(dest / '.complete').touch()\nprint('stage-in: downloaded', n, 'of',\
        \ len(objs), '->', dest, flush=True)\n\"\"\"\n\n# F-08 wallet: mint a short-lived\
        \ Zitadel bearer from the mounted machine\n# key \u2014 the same JWT-profile\
        \ recipe as the seeded mlflow_zitadel_auth\n# module (assertion aud = https://{domain};\
        \ the project-audience scope is\n# what makes the token acceptable to mlflow-oidc-auth\
        \ AND carries the\n# groups claim). PyJWT+cryptography are pip-installed at\
        \ run time: the\n# submit image is bare-stdlib alpine and RS256 needs real\
        \ crypto. Any\n# failure degrades loudly to no-wallet (job still runs, data-plane\
        \ env\n# omitted) \u2014 never the machine key itself into the Slurm environment\n\
        # (T-03: HPC-side env must only ever see short-lived tokens).\nWALLET = None\n\
        WALLET_EXP = 0.0\n# Resubmit a still-PENDING job before its wallet (MLflow/lakeFS\
        \ bearer, 12 h\n# lifetime) expires: a job that starts after a queue wait\
        \ longer than the\n# wallet would train blind (no MLflow, no checkpoint upload,\
        \ no stage-out).\n# The Slurm JWT is read fresh per request (tok()); the wallet\
        \ cannot be\n# refreshed inside a queued job, so the job itself is replaced.\n\
        WALLET_MARGIN_S = 30 * 60\n\n\ndef wallet_exp(w):\n    \"\"\"exp claim of\
        \ a JWT as epoch seconds (0 when unknown).\"\"\"\n    try:\n        seg =\
        \ w.split('.')[1]\n        return float(json.loads(base64.urlsafe_b64decode(\n\
        \            seg + '=' * (-len(seg) % 4)))['exp'])\n    except Exception:\n\
        \        return 0.0\n\n\ndef mint_wallet():\n    keyfile = os.environ.get('ZITADEL_MACHINE_KEY_FILE')\
        \ or ''\n    domain = os.environ.get('ZITADEL_DOMAIN') or ''\n    if not keyfile\
        \ or not os.path.exists(keyfile) or not domain:\n        print('wallet: machine\
        \ key / domain absent, data-plane env omitted',\n              flush=True)\n\
        \        return ''\n    try:\n        import subprocess\n        subprocess.run([sys.executable,\
        \ '-m', 'pip', 'install', '-q',\n                        '--no-warn-script-location',\
        \ '--root-user-action',\n                        'ignore', 'PyJWT', 'cryptography'],\n\
        \                       check=True, timeout=180)\n        import jwt as pyjwt\n\
        \        key = json.load(open(keyfile))\n        now = int(time.time())\n\
        \        assertion = pyjwt.encode(\n            {'iss': key['userId'], 'sub':\
        \ key['userId'],\n             'aud': 'https://' + domain, 'iat': now, 'exp':\
        \ now + 60},\n            key['key'], algorithm='RS256', headers={'kid': key['keyId']})\n\
        \        scope = 'openid email profile urn:zitadel:iam:org:projects:roles'\n\
        \        pid = os.environ.get('ZITADEL_MLFLOW_PROJECT_ID') or ''\n       \
        \ if pid:\n            scope += ' urn:zitadel:iam:org:project:id:' + pid +\
        \ ':aud'\n        req = urllib.request.Request(\n            'https://' +\
        \ domain + '/oauth/v2/token',\n            data=urllib.parse.urlencode({\n\
        \                'grant_type': 'urn:ietf:params:oauth:grant-type:jwt-bearer',\n\
        \                'scope': scope, 'assertion': assertion}).encode())\n    \
        \    tok = json.load(urllib.request.urlopen(req, timeout=30)).get(\n     \
        \       'access_token', '')\n        print('wallet: minted' if tok else 'wallet:\
        \ empty token response',\n              flush=True)\n        return tok\n\
        \    except Exception as e:\n        print('wallet: mint failed, data-plane\
        \ env omitted:', e, flush=True)\n        return ''\n\n# OCI WORKDIR (live\
        \ job 5148071): Docker honours the image's WorkingDir,\n# Apptainer does NOT\
        \ \u2014 `apptainer exec` starts in the host cwd, so a step\n# command like\
        \ `python -m app.entry` fails with \"No module named 'app'\".\n# Step images\
        \ use different WORKDIRs (/app, /work), so it is read from the\n# image config\
        \ in the registry at submit time and passed as `--pwd`.\n# Best-effort: any\
        \ failure yields '' (no --pwd), never a blocked submit.\ndef fetch_workdir(image,\
        \ reg_token):\n    try:\n        ref_host, _, rest = image.partition('/')\n\
        \        if '@' in rest:\n            path, ref = rest.split('@', 1)\n   \
        \     elif ':' in rest.rsplit('/', 1)[-1]:\n            path, ref = rest.rsplit(':',\
        \ 1)\n        else:\n            path, ref = rest, 'latest'\n        hdr =\
        \ {'Accept': ', '.join([\n            'application/vnd.oci.image.index.v1+json',\n\
        \            'application/vnd.docker.distribution.manifest.list.v2+json',\n\
        \            'application/vnd.oci.image.manifest.v1+json',\n            'application/vnd.docker.distribution.manifest.v2+json'])}\n\
        \        if reg_token and ref_host.endswith('-docker.pkg.dev'):\n        \
        \    hdr['Authorization'] = 'Bearer ' + reg_token\n        base = 'https://'\
        \ + ref_host + '/v2/' + path\n\n        def get(url):\n            return\
        \ json.load(urllib.request.urlopen(\n                urllib.request.Request(url,\
        \ headers=hdr), timeout=20))\n        m = get(base + '/manifests/' + ref)\n\
        \        if 'manifests' in m:  # multi-arch index: pick linux/amd64\n    \
        \        pick = next((x for x in m['manifests']\n                        \
        \ if (x.get('platform') or {}).get('architecture') == 'amd64'\n          \
        \               and (x.get('platform') or {}).get('os', 'linux') == 'linux'),\n\
        \                        m['manifests'][0])\n            m = get(base + '/manifests/'\
        \ + pick['digest'])\n        cfg = get(base + '/blobs/' + m['config']['digest'])\n\
        \        wd = (cfg.get('config') or {}).get('WorkingDir') or ''\n        print('workdir:',\
        \ wd or '(none)', flush=True)\n        return wd\n    except Exception as\
        \ e:\n        print('workdir: lookup failed (running from host cwd):', e,\
        \ flush=True)\n        return ''\n\nAPI = 'https://slurm-api.lxp.lu/slurm/v0.0.44'\n\
        SDB = 'https://slurm-api.lxp.lu/slurmdb/v0.0.44'\nTOKEN_FILE = '/etc/meluxina-jwt/token'\n\
        \n\ndef tok():\n    \"\"\"The MeluXina JWT, read FRESH on every request. The\
        \ platform mints it\n    with a 60-minute lifetime and rotates the Secret\
        \ every 25 minutes; the\n    mounted file follows the rotation, an env var\
        \ does not (live run\n    app-meluxina-toy-abcde: the pod's env token expired\
        \ 13:30:02 while\n    the job still queued \u2014 every poll 502/511 for hours,\
        \ and cancel/resubmit\n    would have failed the same way).\"\"\"\n    try:\n\
        \        with open(TOKEN_FILE) as f:\n            t = f.read().strip()\n \
        \           if t:\n                return t\n    except OSError:\n       \
        \ pass\n    return os.environ['SLURM_TOKEN'].strip()\n\n\ndef hpc_identity():\n\
        \    \"\"\"The project's HPC identity from the pipeline context (PRD-HPC-1231\n\
        \    CON-05): user, account, scratch root and home. Never literals \u2014\
        \ one\n    project's twin must never submit as another project's user. Missing\n\
        \    identity = the platform did not publish the tenancy; fail loudly.\"\"\
        \"\n    ident = {k: (os.environ.get(v) or '') for k, v in (\n        ('user',\
        \ 'HPC_USER'), ('account', 'HPC_ACCOUNT'),\n        ('scratch', 'HPC_SCRATCH'),\
        \ ('home', 'HPC_HOME'))}\n    missing = [k for k, val in ident.items() if\
        \ not val]\n    if missing:\n        print('HPC identity missing from the\
        \ pipeline context:', missing,\n              '- the KubeProject is not bound\
        \ to an HPC tenancy (PRD-HPC-1231)',\n              flush=True)\n        sys.exit(2)\n\
        \    return ident\n\n\ndef hdrs():\n    return {'X-SLURM-USER-NAME': hpc_identity()['user'],\n\
        \            'X-SLURM-USER-TOKEN': tok(),\n            'Content-Type': 'application/json'}\n\
        \n\ndef hpc_class():\n    \"\"\"The HPC class this twin runs on (its {step}-class\
        \ value), resolved\n    against the catalog the enhancer embedded. Unknown\
        \ class = render/\n    submit mismatch, never a silent default partition.\"\
        \"\"\n    name = os.environ.get('HPC_CLASS') or ''\n    for c in json.loads(os.environ.get('HPC_CLASSES_JSON')\
        \ or '[]'):\n        if c.get('name') == name:\n            return c\n   \
        \ print('unknown HPC class', repr(name), '- catalog:',\n          [c.get('name')\
        \ for c in json.loads(os.environ.get('HPC_CLASSES_JSON') or '[]')],\n    \
        \      flush=True)\n    sys.exit(2)\n\n\n\ndef get(url):\n    return json.load(urllib.request.urlopen(\n\
        \        urllib.request.Request(url, headers=hdrs()), timeout=30))\n\njobname\
        \ = 'kaos-' + os.environ['WF_UID'] + '-' + os.environ['STEP_NAME']\nimg =\
        \ os.environ['IMAGE_REF']\n# Apptainer rejects tag@digest refs ('Docker references\
        \ with both a tag and\n# digest are currently not supported', live job 5140397).\
        \ The platform pins\n# images as name:tag@sha256:... (Zot-retention lesson)\
        \ \u2014 normalize to the\n# digest-only form, which Apptainer accepts and\
        \ which is the stronger pin.\nif '@' in img:\n    name, digest = img.split('@',\
        \ 1)\n    if ':' in name.rsplit('/', 1)[-1]:\n        name = name.rsplit(':',\
        \ 1)[0]\n    img = name + '@' + digest\n# shlex-quote each argv token: the\
        \ joined string rides through Slurm env ->\n# sh -c, and a naive join destroys\
        \ embedded quoting (live job 5140493:\n# python -c 'import torch; ...' arrived\
        \ as bare words and exited 2).\n# strict=False tolerates control characters\
        \ inside strings \u2014 belt-and-braces\n# for any substitution path the render-side\
        \ toJson escaping didn't cover.\ncmd = ' '.join(shlex.quote(t) for t in json.loads(\n\
        \    os.environ.get('STEP_COMMAND') or '[]', strict=False))\n\njid = None\n\
        \n\ndef find_active():\n    for j in (get(API + '/jobs').get('jobs') or []):\n\
        \        st = j.get('job_state') or []\n        if j.get('name') == jobname\
        \ and any(\n                x in ('PENDING', 'RUNNING', 'SUSPENDED') for x\
        \ in st):\n            return j.get('job_id')\n    return None\n\n\ndef submit():\n\
        \    HPC = hpc_class()\n    reg = ''\n    try:\n        r = urllib.request.Request(\n\
        \            'http://metadata.google.internal/computeMetadata/v1/instance/'\n\
        \            'service-accounts/default/token',\n            headers={'Metadata-Flavor':\
        \ 'Google'})\n        reg = json.load(urllib.request.urlopen(r, timeout=5)).get(\n\
        \            'access_token', '')\n    except Exception as e:\n        print('no\
        \ registry token from metadata server (anonymous pull):', e,\n           \
        \   flush=True)\n    ident = hpc_identity()\n    batch = '\\n'.join([\n  \
        \      '#!/bin/bash -l',\n        'set +e',\n        # Diagnostics without\
        \ SSH (live job 5143859: exit 231 with no way to\n        # see WHY): on any\
        \ failure, tail this job's own output file into its\n        # job COMMENT\
        \ \u2014 readable over REST from the waiter and by operators.\n        'fail(){\
        \ scontrol update JobId=$SLURM_JOB_ID Comment=\"err$1:$(tail -c 700 slurm-$SLURM_JOB_ID.out\
        \ 2>/dev/null | tr \"\\\\n\" \"|\")\" 2>/dev/null; exit $1; }',\n        'for\
        \ f in /usr/share/lmod/lmod/init/bash /etc/profile.d/lmod.sh; do'\n      \
        \  ' [ -r \"$f\" ] && source \"$f\" && break; done',\n        'module load\
        \ Apptainer 2>/dev/null || module load apptainer 2>/dev/null',\n        'command\
        \ -v apptainer >/dev/null || fail 210',\n        'SCR=' + ident['scratch'],\n\
        \        'export APPTAINER_CACHEDIR=$SCR/kaos-apptainer-cache'\n        '\
        \ APPTAINER_TMPDIR=$SCR/kaos-tmp',\n        'mkdir -p $APPTAINER_CACHEDIR\
        \ $APPTAINER_TMPDIR $SCR/sif-cache',\n        'KEY=$(printf %s \"$IMAGE_REF\"\
        \ | sha256sum | cut -c1-16)',\n        'SIF=$SCR/sif-cache/$KEY.sif',\n  \
        \      # F-04 stage-in: only when the wallet minted AND the run pins a\n \
        \       # dataset. Fails LOUDLY (exit 232) \u2014 silently missing data would\n\
        \        # surface as a cryptic training error hours later.\n        'DATASET_DIR=\"\
        \"',\n        'if [ -n \"$LAKEFS_BEARER_TOKEN\" ] && [ -n \"$LAKEFS_ENDPOINT\"\
        \ ] &&'\n        ' [ -n \"$DATASET_REPO\" ] && [ -n \"$DATASET_REF\" ] &&'\n\
        \        ' [ -n \"$STAGEIN_B64\" ] && command -v python3 >/dev/null; then',\n\
        \        '  export DATASET_CACHE=$SCR/data-cache'\n        ' DATASET_DIRFILE=$SCR/kaos-tmp/ds-$SLURM_JOB_ID.dir',\n\
        \        '  printf %s \"$STAGEIN_B64\" | base64 -d | python3 - || fail 232',\n\
        \        '  DATASET_DIR=$(cat \"$DATASET_DIRFILE\" 2>/dev/null)',\n      \
        \  'fi',\n        # Apptainer passes the host env through, so the wallet/endpoint\
        \ vars\n        # reach the step; the bind gives it the staged version read-only.\n\
        \        'BIND=\"\"',\n        'if [ -n \"$DATASET_DIR\" ]; then'\n      \
        \  ' BIND=\"-B $DATASET_DIR:/kubecore/dataset:ro\";'\n        ' export APPTAINERENV_KUBECORE_DATASET_DIR=/kubecore/dataset;\
        \ fi',\n        # Writable /work: the SIF is read-only, but steps write /work/output\n\
        \        # (declared outputs), /work/runs, /work/dataset caches. Per-job scratch\n\
        \        # on Lustre, removed after a successful stage-out.\n        'export\
        \ KAOS_WORK=$SCR/kaos-work/$SLURM_JOB_ID; mkdir -p $KAOS_WORK/output',\n \
        \       'BIND=\"$BIND -B $KAOS_WORK:/work\"',\n        'if [ ! -f \"$SIF\"\
        \ ]; then',\n        # GCP token ONLY for GAR hosts: presenting it to Zot\
        \ turns an\n        # anonymous-OK pull into 401 authentication required (live\
        \ job\n        # 5140432 vs the anonymous F-01 pull that worked on the same\
        \ repo).\n        '  case \"$IMAGE_REF\" in *-docker.pkg.dev/*)'\n       \
        \ ' [ -n \"$REG_TOKEN\" ] && export'\n        ' APPTAINER_DOCKER_USERNAME=oauth2accesstoken'\n\
        \        ' APPTAINER_DOCKER_PASSWORD=$REG_TOKEN;; esac',\n        '  apptainer\
        \ pull \"$SIF\" docker://$IMAGE_REF || fail 231',\n        'fi',\n       \
        \ # Start in the image's WORKDIR (Apptainer ignores it; Docker does not).\n\
        \        'PWD_OPT=\"\"; [ -n \"$STEP_WORKDIR\" ] && PWD_OPT=\"--pwd $STEP_WORKDIR\"\
        ',\n        # --nv only on GPU classes: on the cpu/largemem partitions there\
        \ is\n        # no driver to bind and the flag makes Apptainer warn or fail.\n\
        \        'NV=\"\"; [ \"${HPC_GPUS:-0}\" -gt 0 ] && NV=\"--nv\"',\n       \
        \ 'if [ -n \"$STEP_CMD\" ]; then apptainer exec $NV $PWD_OPT $BIND \"$SIF\"\
        '\n        ' /bin/sh -c \"$STEP_CMD\"; else apptainer exec $NV $PWD_OPT $BIND\
        \ \"$SIF\"'\n        ' /bin/sh -c \"nvidia-smi -L || nproc\"; fi',\n     \
        \   'rc=$?',\n        'if [ -n \"$STEP_OUTPUTS\" ] && [ -n \"$STAGEOUT_B64\"\
        \ ] && [ -n \"$LAKEFS_BEARER_TOKEN\" ]; then'\n        ' printf %s \"$STAGEOUT_B64\"\
        \ | base64 -d | python3 - || echo \"stage-out failed (rc=$rc)\"; fi',\n  \
        \      '[ $rc -eq 0 ] && rm -rf \"$KAOS_WORK\"',\n        '[ $rc -ne 0 ] &&\
        \ fail $rc',\n        'exit 0',\n    ])\n    env = ['PATH=/usr/bin:/bin:/usr/local/bin',\
        \ 'HOME=' + ident['home'],\n           'USER=' + ident['user'], 'IMAGE_REF='\
        \ + img, 'REG_TOKEN=' + reg,\n           'HPC_GPUS=' + str(HPC.get('gpus')\
        \ or 0),\n           'STEP_CMD=' + cmd, 'STEP_WORKDIR=' + fetch_workdir(img,\
        \ reg),\n           'WF_UID=' + (os.environ.get('WF_UID') or ''),\n      \
        \     'STEP_NAME=' + (os.environ.get('STEP_NAME') or ''),\n           'STEP_OUTPUTS='\
        \ + (os.environ.get('STEP_OUTPUTS') or '')]\n    global WALLET, WALLET_EXP\n\
        \    wallet = WALLET = mint_wallet()\n    WALLET_EXP = wallet_exp(wallet)\n\
        \    if wallet:\n        # Public endpoints only, short-lived bearer only\
        \ (T-03). MLflow's\n        # client honors MLFLOW_TRACKING_TOKEN natively;\
        \ the stage-in and any\n        # in-step lakeFS API calls ride the same bearer\
        \ through oauth2-proxy.\n        mlflow_url = os.environ.get('MLFLOW_EXTERNAL_URL')\
        \ or ''\n        lakefs_url = os.environ.get('LAKEFS_EXTERNAL_URL') or ''\n\
        \        if mlflow_url:\n            env += ['MLFLOW_TRACKING_URI=' + mlflow_url,\n\
        \                    'MLFLOW_TRACKING_TOKEN=' + wallet]\n        if lakefs_url:\n\
        \            env += ['LAKEFS_ENDPOINT=' + lakefs_url,\n                  \
        \  'LAKEFS_BEARER_TOKEN=' + wallet,\n                    'DATASET_REPO=' +\
        \ (os.environ.get('DATASET_REPO') or ''),\n                    'DATASET_REF='\
        \ + (os.environ.get('DATASET_REF') or ''),\n                    'STAGEIN_B64='\n\
        \                    + base64.b64encode(STAGEIN.encode()).decode(),\n    \
        \                'STAGEOUT_B64='\n                    + base64.b64encode(STAGEOUT.encode()).decode()]\n\
        \    body = {'job': {'name': jobname, 'partition': HPC['partition'],\n   \
        \                 'account': ident['account'],\n                    'qos':\
        \ HPC.get('qos') or 'default',\n                    'time_limit': int(os.environ.get('SLURM_TIME_LIMIT')\
        \ or 240),\n                    'current_working_directory': ident['home'],\n\
        \                    'environment': env, 'tasks': 1, 'nodes': '1'},\n    \
        \        'script': batch}\n    req = urllib.request.Request(API + '/job/submit',\n\
        \                                 data=json.dumps(body).encode(),\n      \
        \                           headers=hdrs(), method='POST')\n    resp = json.load(urllib.request.urlopen(req,\
        \ timeout=30))\n    j = resp.get('job_id')\n    print('submitted job', j,\
        \ 'errors:', resp.get('errors'), flush=True)\n    if not j:\n        sys.exit(1)\n\
        \    return j\n\n\ndef cancel(j):\n    try:\n        urllib.request.urlopen(urllib.request.Request(\n\
        \            API + '/job/' + str(j), headers=hdrs(), method='DELETE'), timeout=30)\n\
        \        print('cancelled job', j, flush=True)\n    except Exception as e:\n\
        \        print('cancel failed:', e, flush=True)\n\n\ndef on_term(signum, frame):\n\
        \    # Argo sends TERM on deadline/stop. A PENDING job never started \u2014\
        \ cancel\n    # it so it does not run unobserved hours later (live job 5143859\
        \ did\n    # exactly that: waiter killed at the deadline mid-queue, job ran\
        \ at\n    # 20:0xZ with nobody watching and burned a failed pull). A RUNNING\
        \ job\n    # is deliberately left to finish.\n    try:\n        j = (get(API\
        \ + '/job/' + str(jid)).get('jobs') or [{}])[0]\n        if 'PENDING' in (j.get('job_state')\
        \ or []):\n            cancel(jid)\n    except Exception:\n        pass\n\
        \    sys.exit(143)\n\n\nsignal.signal(signal.SIGTERM, on_term)\n\njid = find_active()\n\
        if jid is not None:\n    print('adopting existing job', jid, flush=True)\n\
        else:\n    jid = submit()\n\nopen('/tmp/slurm-job-id', 'w').write(str(jid))\n\
        OUTPUT_NAMES = [n for n in os.environ.get('STEP_OUTPUTS', '').split(',') if\
        \ n]\nos.makedirs('/tmp/outputs', exist_ok=True)\nfor n in OUTPUT_NAMES:\n\
        \    open('/tmp/outputs/%s.json' % n, 'w').write('{}')\n\n\ndef fetch_outputs():\n\
        \    \"\"\"F-05: pull the step's staged-out outputs back into the twin.\"\"\
        \"\n    base = (os.environ.get('LAKEFS_EXTERNAL_URL') or '').rstrip('/')\n\
        \    repo = os.environ.get('DATASET_REPO') or ''\n    if not (OUTPUT_NAMES\
        \ and base and repo and WALLET):\n        return\n    branch = os.environ.get('DATASET_REF')\
        \ or 'main'\n    for n in OUTPUT_NAMES:\n        q = urllib.parse.urlencode({'path':\
        \ 'hpc-outputs/%s/%s/%s.json' % (\n            os.environ.get('WF_UID', ''),\
        \ os.environ.get('STEP_NAME', ''), n)})\n        try:\n            data =\
        \ urllib.request.urlopen(urllib.request.Request(\n                base + '/api/v1/repositories/%s/refs/%s/objects?%s'\
        \ % (repo, branch, q),\n                headers={'Authorization': 'Bearer\
        \ ' + WALLET}), timeout=60).read()\n            open('/tmp/outputs/%s.json'\
        \ % n, 'wb').write(data)\n            print('output', n, ':', len(data), 'bytes',\
        \ flush=True)\n        except Exception as e:\n            print('output',\
        \ n, 'not staged out (default {}):', e, flush=True)\n\n\nTERMINAL = ('COMPLETED',\
        \ 'FAILED', 'CANCELLED', 'TIMEOUT', 'NODE_FAIL',\n            'PREEMPTED',\
        \ 'OUT_OF_MEMORY')\n# The registry pull token (GCE metadata, 1 h) is minted\
        \ at submit time and\n# cannot be refreshed inside a queued job, so every\
        \ queue wait longer than an\n# hour costs one failed pull (exit 231) and a\
        \ resubmission. Bounded, not\n# once: a second long wait after the first resubmit\
        \ must not strand the run.\nPULL_RESUBMITS = 3\nresubmits = 0\nwhile True:\n\
        \    time.sleep(30)\n    try:\n        job = (get(SDB + '/job/' + str(jid)).get('jobs')\
        \ or [{}])[0]\n        st = (job.get('state') or {}).get('current') or []\n\
        \        print('state:', st, flush=True)\n        if ('PENDING' in st and\
        \ WALLET_EXP\n                and time.time() > WALLET_EXP - WALLET_MARGIN_S):\n\
        \            print('wallet expires within', WALLET_MARGIN_S // 60,\n     \
        \             'min and the job is still queued - resubmitting with a'\n  \
        \                ' fresh wallet (queue position is lost, credentials are'\n\
        \                  ' not)', flush=True)\n            cancel(jid)\n       \
        \     jid = submit()\n            open('/tmp/slurm-job-id', 'w').write(str(jid))\n\
        \            continue\n        if any(x in TERMINAL for x in st):\n      \
        \      rc = ((job.get('exit_code') or {}).get('return_code')\n           \
        \       or {}).get('number')\n            print('terminal:', st, 'exit:',\
        \ rc, flush=True)\n            print('job comment:', job.get('comment'), flush=True)\n\
        \            if 'FAILED' in st and rc == 231 and resubmits < PULL_RESUBMITS:\n\
        \                # A cache-missing pull after a LONG queue wait runs with\
        \ the\n                # registry token minted at submit time \u2014 GCP tokens\
        \ live 1h,\n                # so it can be stale (live job 5143859: 3.5h queue\
        \ -> 231;\n                # 5150371: 65 min queue -> 231). Resubmitting mints\n\
        \                # everything fresh; queue age is lost only after an actual\n\
        \                # failure.\n                resubmits += 1\n            \
        \    print('pull failed - resubmitting with fresh credentials'\n         \
        \             ' (%d/%d)' % (resubmits, PULL_RESUBMITS), flush=True)\n    \
        \            jid = submit()\n                open('/tmp/slurm-job-id', 'w').write(str(jid))\n\
        \                continue\n            if 'COMPLETED' in st:\n           \
        \     fetch_outputs()\n            sys.exit(0 if ('COMPLETED' in st and rc\
        \ in (0, None)) else 1)\n    except SystemExit:\n        raise\n    except\
        \ Exception as e:\n        print('poll error (transient):', e, flush=True)\n"
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: meluxina-jwt
        mountPath: /etc/meluxina-jwt
        readOnly: true
      env:
      - name: SLURM_TOKEN
        valueFrom:
          secretKeyRef:
            name: meluxina-jwt
            key: token
      - name: WF_UID
        value: '{{workflow.uid}}'
      - name: STEP_NAME
        value: '{{inputs.parameters.step-name}}'
      - name: IMAGE_REF
        value: '{{inputs.parameters.image}}'
      - name: STEP_COMMAND
        value: '{{inputs.parameters.step-command}}'
      - name: SLURM_TIME_LIMIT
        value: '{{inputs.parameters.time-limit}}'
      - name: STEP_OUTPUTS
        value: '{{inputs.parameters.step-outputs}}'
      - name: HPC_CLASS
        value: '{{inputs.parameters.hpc-class}}'
      - name: HPC_CLASSES_JSON
        value: '[{"name":"meluxina-gpu","tier":"gpu","partition":"gpu","qos":"default","gpus":4,"cpus":128,"memoryGiB":512,"description":"4x
          A100-40GB, 2x EPYC 7452, 512 GB"},{"name":"meluxina-cpu","tier":"cpu","partition":"cpu","qos":"default","gpus":0,"cpus":128,"memoryGiB":512,"description":"2x
          EPYC 7452, 128 cores, 512 GB"},{"name":"meluxina-largemem","tier":"cpu","partition":"largemem","qos":"default","gpus":0,"cpus":128,"memoryGiB":4096,"description":"4
          TB"}]'
      - name: HPC_ACCOUNT
        value: PLACEHOLDER-account
      - name: HPC_USER
        value: PLACEHOLDER-user
      - name: HPC_SCRATCH
        value: /project/scratch/PLACEHOLDER-account
      - name: HPC_HOME
        value: /home/users/PLACEHOLDER-user
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: MLFLOW_EXTERNAL_URL
        value: https://mlflow.internal.invalid
      - name: LAKEFS_EXTERNAL_URL
        value: https://lakefs.internal.invalid
      - name: DATASET_REPO
        value: '{{workflow.parameters.lakefs-repo}}'
      - name: DATASET_REF
        value: ''
    outputs:
      parameters:
      - name: slurm-job-id
        valueFrom:
          path: /tmp/slurm-job-id
      - name: params
        valueFrom:
          path: /tmp/outputs/params.json
          default: '{}'
  arguments:
    parameters:
    - name: pipeline-info
      value: "HOW TO RUN: defaults are runnable as-is \u2014 just press Submit.\n\
        PER-STEP COMPUTE: {step}-class picks the node class; {step}-cpu / {step}-mem\
        \ dial one run's resources.\nCOMPUTE CLASSES on this pool:\n  - cpu-standard\
        \ (cpu) \u2014 n2-standard-8\n  - kubecorecpu (cpu) \u2014 e2-standard-8\n\
        \  - gpu-t4 (gpu) \u2014 n1-standard-8 + 1x nvidia-tesla-t4\nMELUXINA (HPC):\
        \ pick a meluxina-* class in any {step}-class dropdown and that step runs\
        \ as a Slurm job on MeluXina (account PLACEHOLDER-account) \u2014 queue time\
        \ applies; the pipeline waits, stages the dataset in and the step's outputs\
        \ back; hpc_time_limit in pipeline.py caps the job. Classes:\n  - meluxina-gpu\
        \ (gpu) \u2014 partition gpu, 4 GPUs, 128 cores, 512 GiB \u2014 4x A100-40GB,\
        \ 2x EPYC 7452, 512 GB\n  - meluxina-cpu (cpu) \u2014 partition cpu, 128 cores,\
        \ 512 GiB \u2014 2x EPYC 7452, 128 cores, 512 GB\n  - meluxina-largemem (cpu)\
        \ \u2014 partition largemem, 128 cores, 4096 GiB \u2014 4 TB\nSTEPS: compose-and-validate\
        \ -> hello-world\n(This field is informational \u2014 leave it unchanged.)"
      description: 'Read-only: live pool compute classes + how to fill this form.
        Leave unchanged.'
    - name: experiment-name
      description: 'Config: experiment.name'
      value: my-experiment-v1
    - name: experiment-description
      description: 'Config: experiment.description'
      value: ''
    - name: config
      description: "ADVANCED: override YAML merged LAST over the composed config (OmegaConf.merge).\
        \ Overrides everything above \u2014 intended for scripted submissions (argo\
        \ submit -p config=...). May not modify platform.*."
      value: ''
    - name: mlflow-endpoint
      value: http://mlflow.internal.invalid
    - name: lakefs-endpoint
      value: http://lakefs.internal.invalid
    - name: lakefs-repo
      value: PLACEHOLDER-repo
    - name: image-compose-and-validate
