      - -c
      - "\nSTAGEOUT = r\"\"\"\n# F-05 stage-out: the step's declared outputs (/work/output/<name>.json,\n\
        # what Argo would have read as outputs.parameters in-cluster) go to lakeFS\n\
        # at hpc-outputs/{wf-uid}/{step}/ on the project's outputs branch (the run's\n\
        # dataset branch on a project without one); the waiter fetches them back\n\
        # into the twin's outputs so downstream steps see real values.\nimport json,\
        \ os, pathlib, urllib.parse, urllib.request\nbase = os.environ['LAKEFS_ENDPOINT'].rstrip('/')\
        \ + '/api/v1'\nH = {'Authorization': 'Bearer ' + os.environ['LAKEFS_BEARER_TOKEN']}\n\
        repo = os.environ['DATASET_REPO']\nbranch = os.environ.get('OUTPUTS_BRANCH')\
        \ or os.environ.get('DATASET_REF') or 'main'\nprefix = 'hpc-outputs/%s/%s/'\
        \ % (os.environ['WF_UID'], os.environ['STEP_NAME'])\nout = pathlib.Path(os.environ['KAOS_WORK'])\
        \ / 'output'\nfor name in [n for n in os.environ.get('STEP_OUTPUTS', '').split(',')\
        \ if n]:\n    f = out / (name + '.json')\n    if not f.exists():\n       \
        \ print('stage-out: no', f, flush=True); continue\n    data = f.read_bytes()\n\
        \    body = (b'--B\\r\\nContent-Disposition: form-data; name=\"content\";\
        \ filename=\"f\"\\r\\n'\n            b'Content-Type: application/octet-stream\\\
        r\\n\\r\\n' + data + b'\\r\\n--B--\\r\\n')\n    q = urllib.parse.urlencode({'path':\
        \ prefix + name + '.json'})\n    req = urllib.request.Request(base + '/repositories/%s/branches/%s/objects?%s'\
        \ % (repo, branch, q),\n                                 data=body, method='POST',\n\
        \                                 headers=dict(H, **{'Content-Type': 'multipart/form-data;\
        \ boundary=B'}))\n    urllib.request.urlopen(req, timeout=120).read()\n  \
        \  print('stage-out:', name, len(data), 'bytes ->', prefix, flush=True)\n\"\
        \"\"\nimport base64, json, os, shlex, signal, subprocess, sys, threading,\
        \ time, urllib.parse, urllib.request\n\n# F-04 stage-in, run ON the compute\
        \ node (system python3, stdlib only):\n# take the commit dataset-loading pinned\
        \ (DATASET_COMMIT) or resolve\n# ref -> commit, download the dataset/ folder\
        \ of that version (the whole ref\n# only for data uploaded before the dataset/\
        \ layout) from the lakeFS PUBLIC\n# endpoint (bearer through oauth2-proxy\
        \ \u2014 the in-cluster S3-gateway/manifest\n# streaming path is blocked by\
        \ the SSO front off-cluster) into a Lustre cache\n# keyed by commit, parallel\
        \ + resumable (size-matched files are skipped,\n# .part rename is atomic).\
        \ Rides to the node base64-encoded in the job\n# environment.\nSTAGEIN = \"\
        \"\"\nimport concurrent.futures, json, os, pathlib, sys, urllib.parse, urllib.request\n\
        EP = os.environ['LAKEFS_ENDPOINT'].rstrip('/')\nH = {'Authorization': 'Bearer\
        \ ' + os.environ['LAKEFS_BEARER_TOKEN']}\nREPO, REF = os.environ['DATASET_REPO'],\
        \ os.environ['DATASET_REF']\ndef get(url):\n    return urllib.request.urlopen(\n\
        \        urllib.request.Request(url, headers=H), timeout=120)\nbase = EP +\
        \ '/api/v1/repositories/' + urllib.parse.quote(REPO, safe='')\n# The commit\
        \ dataset-loading pinned, so this step reads exactly what the\n# in-cluster\
        \ steps read. Without one (older step code): ref -> tip commit via\n# the\
        \ commit LOG (amount=1). GET /refs/{ref} does not exist on our lakeFS\n# version\
        \ (404, live job 5143633) \u2014 /refs/{ref}/commits is the proven one.\n\
        commit = os.environ.get('DATASET_COMMIT') or json.load(\n    get(base + '/refs/'\
        \ + urllib.parse.quote(REF, safe='')\n        + '/commits?amount=1'))['results'][0]['id']\n\
        dest = pathlib.Path(os.environ['DATASET_CACHE']) / REPO / commit\nopen(os.environ['DATASET_DIRFILE'],\
        \ 'w').write(str(dest))\nif (dest / '.complete').exists():\n    (dest / '.complete').touch()\
        \            # last use, for the job's cache cleanup\n    print('stage-in:\
        \ cache hit', dest, flush=True)\n    sys.exit(0)\ndef ls(prefix):\n    objs,\
        \ after = [], ''\n    while True:\n        page = json.load(get(base + '/refs/'\
        \ + commit + '/objects/ls?'\n                             + urllib.parse.urlencode(\n\
        \                                 {'amount': 1000, 'after': after,\n     \
        \                             'prefix': prefix})))\n        objs += [r for\
        \ r in page.get('results') or []\n                 if r.get('path_type') ==\
        \ 'object']\n        pg = page.get('pagination') or {}\n        if not pg.get('has_more'):\n\
        \            return objs\n        after = pg.get('next_offset') or ''\n# Only\
        \ the dataset: the branch may also hold other files (checkpoints of\n# older\
        \ runs). Data uploaded before the dataset/ layout sits at the root.\nobjs\
        \ = ls('dataset/') or ls('')\nprint('stage-in:', len(objs), 'objects @', commit[:12],\
        \ flush=True)\ndef fetch(o):\n    p = dest / o['path']\n    if p.exists()\
        \ and p.stat().st_size == o.get('size_bytes'):\n        return 0\n    p.parent.mkdir(parents=True,\
        \ exist_ok=True)\n    tmp = str(p) + '.part'\n    with get(base + '/refs/'\
        \ + commit + '/objects?'\n             + urllib.parse.urlencode({'path': o['path']}))\
        \ as r:\n        with open(tmp, 'wb') as f:\n            while True:\n   \
        \             b = r.read(1 << 20)\n                if not b:\n           \
        \         break\n                f.write(b)\n    os.replace(tmp, p)\n    return\
        \ 1\nwith concurrent.futures.ThreadPoolExecutor(8) as ex:\n    n = sum(ex.map(fetch,\
        \ objs))\n(dest / '.complete').touch()\nprint('stage-in: downloaded', n, 'of',\
        \ len(objs), '->', dest, flush=True)\n\"\"\"\n\n# F-08 wallet: mint a short-lived\
        \ Zitadel bearer from the mounted machine\n# key \u2014 the same JWT-profile\
        \ recipe as the seeded mlflow_zitadel_auth\n# module (assertion aud = https://{domain};\
        \ the project-audience scope is\n# what makes the token acceptable to mlflow-oidc-auth\
        \ AND carries the\n# groups claim). PyJWT+cryptography are pip-installed at\
        \ run time: the\n# submit image is bare-stdlib alpine and RS256 needs real\
        \ crypto. Any\n# failure degrades loudly to no-wallet (job still runs, data-plane\
