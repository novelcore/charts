        ',\n        '  export DATASET_CACHE=$SCR/data-cache'\n        ' DATASET_DIRFILE=$SCR/kaos-tmp/ds-$SLURM_JOB_ID.dir',\n\
        \        '  printf %s \"$STAGEIN_B64\" | base64 -d | python3 - || fail 232',\n\
        \        '  DATASET_DIR=$(cat \"$DATASET_DIRFILE\" 2>/dev/null)',\n      \
        \  'fi',\n        # Apptainer passes the host env through, so the wallet/endpoint\
        \ vars\n        # reach the step; the bind gives it the staged version read-only.\n\
        \        'BIND=\"\"',\n        'if [ -n \"$DATASET_DIR\" ]; then'\n      \
        \  ' BIND=\"-B $DATASET_DIR:/kubecore/dataset:ro\";'\n        ' export APPTAINERENV_KUBECORE_DATASET_DIR=/kubecore/dataset;\
        \ fi',\n        # Writable /work: the SIF is read-only, but steps write /work/output\n\
        \        # (declared outputs), /work/runs, /work/dataset caches. Per-job scratch\n\
        \        # on Lustre, removed after a successful stage-out.\n        'export\
        \ KAOS_WORK=$SCR/kaos-work/$SLURM_JOB_ID; mkdir -p $KAOS_WORK/output',\n \
        \       'BIND=\"$BIND -B $KAOS_WORK:/work\"',\n        # Last use of a cached\
        \ SIF, before the cleanup below can see it.\n        'touch -c \"$SIF\"',\n\
        \        'if [ ! -f \"$SIF\" ]; then',\n        # GCP token ONLY for GAR hosts:\
        \ presenting it to Zot turns an\n        # anonymous-OK pull into 401 authentication\
        \ required (live job\n        # 5140432 vs the anonymous F-01 pull that worked\
        \ on the same repo).\n        '  case \"$IMAGE_REF\" in *-docker.pkg.dev/*)'\n\
        \        ' [ -n \"$REG_TOKEN\" ] && export'\n        ' APPTAINER_DOCKER_USERNAME=oauth2accesstoken'\n\
        \        ' APPTAINER_DOCKER_PASSWORD=$REG_TOKEN;; esac',\n        '  apptainer\
        \ pull \"$SIF\" docker://$IMAGE_REF || fail 231',\n        'fi',\n       \
        \ # PRD-1541: the image and download caches share the allocation's scratch\n\
        \        # quota with the dataset cache and only ever grew. This user's entries\n\
        \        # unused for 14 days go: SIFs, Apptainer's layer cache, in-job\n\
        \        # downloads. What this job uses was touched just above.\n       \
        \ 'find $SCR/sif-cache -maxdepth 1 -name \"*.sif\" -user \"$USER\" -mtime\
        \ +14 -delete 2>/dev/null',\n        'find $SCR/data-cache -mindepth 3 -maxdepth\
        \ 3 -name .complete -user \"$USER\" -mtime +14'\n        ' -printf \"%h\\\\\
        n\" 2>/dev/null | xargs -r rm -rf',\n        'apptainer cache clean --force\
        \ --days 14 >/dev/null 2>&1',\n        # Start in the image's WORKDIR (Apptainer\
        \ ignores it; Docker does not).\n        'PWD_OPT=\"\"; [ -n \"$STEP_WORKDIR\"\
        \ ] && PWD_OPT=\"--pwd $STEP_WORKDIR\"',\n        # --nv only on GPU classes:\
        \ on the cpu/largemem partitions there is\n        # no driver to bind and\
        \ the flag makes Apptainer warn or fail.\n        'NV=\"\"; [ \"${HPC_GPUS:-0}\"\
        \ -gt 0 ] && NV=\"--nv\"',\n        'if [ -n \"$STEP_CMD\" ]; then apptainer\
        \ exec $NV $PWD_OPT $BIND \"$SIF\"'\n        ' /bin/sh -c \"$STEP_CMD\"; else\
        \ apptainer exec $NV $PWD_OPT $BIND \"$SIF\"'\n        ' /bin/sh -c \"nvidia-smi\
        \ -L || nproc\"; fi',\n        'rc=$?',\n        'if [ -n \"$STEP_OUTPUTS\"\
        \ ] && [ -n \"$STAGEOUT_B64\" ] && [ -n \"$LAKEFS_BEARER_TOKEN\" ]; then'\n\
        \        ' printf %s \"$STAGEOUT_B64\" | base64 -d | python3 - || echo \"\
        stage-out failed (rc=$rc)\"; fi',\n        '[ $rc -eq 0 ] && rm -rf \"$KAOS_WORK\"\
        ',\n        '[ $rc -ne 0 ] && fail $rc',\n        'exit 0',\n    ])\n    env\
        \ = ['PATH=/usr/bin:/bin:/usr/local/bin', 'HOME=' + ident['home'],\n     \
        \      'USER=' + ident['user'], 'IMAGE_REF=' + img, 'REG_TOKEN=' + reg,\n\
        \           'HPC_GPUS=' + str(HPC.get('gpus') or 0),\n           'STEP_CMD='\
        \ + cmd, 'STEP_WORKDIR=' + fetch_workdir(img, reg),\n           'WF_UID='\
        \ + (os.environ.get('WF_UID') or ''),\n           'STEP_NAME=' + (os.environ.get('STEP_NAME')\
        \ or ''),\n           'STEP_OUTPUTS=' + (os.environ.get('STEP_OUTPUTS') or\
        \ ''),\n           'DATASET_STAGED=' + STAGED]\n    # Same checkpoint location\
        \ + run id as the in-cluster copy; without them\n    # training fell back\
        \ to {ref}/checkpoints/ on the dataset branch. Only when\n    # set: step\
        \ code reads os.environ.get(..., default), so an empty value\n    # would\
        \ override its own default.\n    env += [k + '=' + os.environ[k] for k in\n\
        \            ('CHECKPOINT_BUCKET', 'CHECKPOINT_PREFIX', 'KUBECORE_RUN_ID')\n\
        \            if os.environ.get(k)]\n    global WALLET, WALLET_EXP\n    wallet\
        \ = WALLET = mint_wallet()\n    WALLET_EXP = wallet_exp(wallet)\n    if wallet:\n\
        \        # Public endpoints only, short-lived bearer only (T-03). MLflow's\n\
        \        # client honors MLFLOW_TRACKING_TOKEN natively; the stage-in and\
        \ any\n        # in-step lakeFS API calls ride the same bearer through oauth2-proxy.\n\
        \        mlflow_url = os.environ.get('MLFLOW_EXTERNAL_URL') or ''\n      \
        \  lakefs_url = os.environ.get('LAKEFS_EXTERNAL_URL') or ''\n        if mlflow_url:\n\
        \            env += ['MLFLOW_TRACKING_URI=' + mlflow_url,\n              \
        \      'MLFLOW_TRACKING_TOKEN=' + wallet]\n        if lakefs_url:\n      \
        \      env += ['LAKEFS_ENDPOINT=' + lakefs_url,\n                    'LAKEFS_BEARER_TOKEN='\
        \ + wallet,\n                    'DATASET_REPO=' + (os.environ.get('DATASET_REPO')\
        \ or ''),\n                    'DATASET_REF=' + (os.environ.get('DATASET_REF')\
        \ or ''),\n                    'DATASET_COMMIT=' + pinned_commit(),\n    \
        \                'OUTPUTS_BRANCH=' + (os.environ.get('OUTPUTS_BRANCH') or\
        \ ''),\n                    'STAGEIN_B64='\n                    + base64.b64encode(STAGEIN.encode()).decode(),\n\
        \                    'STAGEOUT_B64='\n                    + base64.b64encode(STAGEOUT.encode()).decode()]\n\
        \    commit = pinned_commit()\n    body = {'job': {'name': jobname, 'partition':\
        \ HPC['partition'],\n                    'account': ident['account'],\n  \
        \                  'qos': HPC.get('qos') or 'default',\n                 \
        \   'time_limit': int(os.environ.get('SLURM_TIME_LIMIT') or 240),\n      \
        \              'current_working_directory': ident['home'],\n             \
        \       'environment': env, 'tasks': 1, 'nodes': '1'},\n            'script':\
        \ batch}\n    if commit:\n        # PRD-1541 D-06: the stager never evicts\
        \ a commit a queued or running\n        # job names here (squeue %k).\n  \
        \      body['job']['comment'] = 'kaos-commit=' + commit\n    req = urllib.request.Request(API\
        \ + '/job/submit',\n                                 data=json.dumps(body).encode(),\n\
        \                                 headers=hdrs(), method='POST')\n    resp\
        \ = json.load(urllib.request.urlopen(req, timeout=30))\n    j = resp.get('job_id')\n\
        \    print('submitted job', j, 'errors:', resp.get('errors'), flush=True)\n\
        \    if not j:\n        sys.exit(1)\n    return j\n\n\ndef cancel(j):\n  \
        \  try:\n        urllib.request.urlopen(urllib.request.Request(\n        \
        \    API + '/job/' + str(j), headers=hdrs(), method='DELETE'), timeout=30)\n\
        \        print('cancelled job', j, flush=True)\n    except Exception as e:\n\
        \        print('cancel failed:', e, flush=True)\n\n\ndef on_term(signum, frame):\n\
        \    # Argo sends TERM on deadline/stop. A PENDING job never started \u2014\
        \ cancel\n    # it so it does not run unobserved hours later (live job 5143859\
        \ did\n    # exactly that: waiter killed at the deadline mid-queue, job ran\
        \ at\n    # 20:0xZ with nobody watching and burned a failed pull). A RUNNING\
        \ job\n    # is deliberately left to finish.\n    try:\n        j = (get(API\
        \ + '/job/' + str(jid)).get('jobs') or [{}])[0]\n        if 'PENDING' in (j.get('job_state')\
        \ or []):\n            cancel(jid)\n    except Exception:\n        pass\n\
        \    sys.exit(143)\n\n\nsignal.signal(signal.SIGTERM, on_term)\n\njid = find_active()\n\
        if jid is not None:\n    print('adopting existing job', jid, flush=True)\n\
        else:\n    jid = submit()\n\nopen('/tmp/slurm-job-id', 'w').write(str(jid))\n\
        OUTPUT_NAMES = [n for n in os.environ.get('STEP_OUTPUTS', '').split(',') if\
        \ n]\nos.makedirs('/tmp/outputs', exist_ok=True)\nfor n in OUTPUT_NAMES:\n\
        \    open('/tmp/outputs/%s.json' % n, 'w').write('{}')\n\n\ndef fetch_outputs():\n\
        \    \"\"\"F-05: pull the step's staged-out outputs back into the twin.\"\"\
        \"\n    base = (os.environ.get('LAKEFS_EXTERNAL_URL') or '').rstrip('/')\n\
        \    repo = os.environ.get('DATASET_REPO') or ''\n    if not (OUTPUT_NAMES\
        \ and base and repo and WALLET):\n        return\n    branch = os.environ.get('OUTPUTS_BRANCH')\
        \ or os.environ.get('DATASET_REF') or 'main'\n    for n in OUTPUT_NAMES:\n\
        \        q = urllib.parse.urlencode({'path': 'hpc-outputs/%s/%s/%s.json' %\
        \ (\n            os.environ.get('WF_UID', ''), os.environ.get('STEP_NAME',\
        \ ''), n)})\n        try:\n            data = urllib.request.urlopen(urllib.request.Request(\n\
        \                base + '/api/v1/repositories/%s/refs/%s/objects?%s' % (repo,\
        \ branch, q),\n                headers={'Authorization': 'Bearer ' + WALLET}),\
        \ timeout=60).read()\n            open('/tmp/outputs/%s.json' % n, 'wb').write(data)\n\
        \            print('output', n, ':', len(data), 'bytes', flush=True)\n   \
        \     except Exception as e:\n            print('output', n, 'not staged out\
        \ (default {}):', e, flush=True)\n\n\nTERMINAL = ('COMPLETED', 'FAILED', 'CANCELLED',\
        \ 'TIMEOUT', 'NODE_FAIL',\n            'PREEMPTED', 'OUT_OF_MEMORY')\n# The\
        \ registry pull token (GCE metadata, 1 h) is minted at submit time and\n#\
        \ cannot be refreshed inside a queued job, so every queue wait longer than\
        \ an\n# hour costs one failed pull (exit 231) and a resubmission. Bounded,\
        \ not\n# once: a second long wait after the first resubmit must not strand\
        \ the run.\nPULL_RESUBMITS = 3\nresubmits = 0\nwhile True:\n    time.sleep(30)\n\
        \    try:\n        job = (get(SDB + '/job/' + str(jid)).get('jobs') or [{}])[0]\n\
        \        st = (job.get('state') or {}).get('current') or []\n        print('state:',\
        \ st, flush=True)\n        if ('PENDING' in st and WALLET_EXP\n          \
        \      and time.time() > WALLET_EXP - WALLET_MARGIN_S):\n            print('wallet\
        \ expires within', WALLET_MARGIN_S // 60,\n                  'min and the\
        \ job is still queued - resubmitting with a'\n                  ' fresh wallet\
        \ (queue position is lost, credentials are'\n                  ' not)', flush=True)\n\
        \            cancel(jid)\n            jid = submit()\n            open('/tmp/slurm-job-id',\
        \ 'w').write(str(jid))\n            continue\n        if any(x in TERMINAL\
        \ for x in st):\n            rc = ((job.get('exit_code') or {}).get('return_code')\n\
        \                  or {}).get('number')\n            print('terminal:', st,\
        \ 'exit:', rc, flush=True)\n            print('job comment:', job.get('comment'),\
        \ flush=True)\n            if 'FAILED' in st and rc == 231 and resubmits <\
        \ PULL_RESUBMITS:\n                # A cache-missing pull after a LONG queue\
        \ wait runs with the\n                # registry token minted at submit time\
        \ \u2014 GCP tokens live 1h,\n                # so it can be stale (live job\
        \ 5143859: 3.5h queue -> 231;\n                # 5150371: 65 min queue ->\
        \ 231). Resubmitting mints\n                # everything fresh; queue age\
        \ is lost only after an actual\n                # failure.\n             \
        \   resubmits += 1\n                print('pull failed - resubmitting with\
        \ fresh credentials'\n                      ' (%d/%d)' % (resubmits, PULL_RESUBMITS),\
        \ flush=True)\n                jid = submit()\n                open('/tmp/slurm-job-id',\
        \ 'w').write(str(jid))\n                continue\n            if 'COMPLETED'\
        \ in st:\n                fetch_outputs()\n            sys.exit(0 if ('COMPLETED'\
        \ in st and rc in (0, None)) else 1)\n    except SystemExit:\n        raise\n\
        \    except Exception as e:\n        print('poll error (transient):', e, flush=True)\n"
      volumeMounts:
