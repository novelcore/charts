  - name: main
    dag:
      tasks:
      - name: compose-and-validate
        template: compose-and-validate
      - name: config-validation
        depends: compose-and-validate
        template: config-validation
        arguments:
          parameters:
          - name: params
            value: '{{tasks.compose-and-validate.outputs.parameters.params}}'
      - name: dataset-loading
        depends: compose-and-validate && config-validation
        template: dataset-loading
        arguments:
          parameters:
          - name: params
            value: '{{tasks.compose-and-validate.outputs.parameters.params}}'
      - name: data-summary
        depends: compose-and-validate && dataset-loading
        template: data-summary
        arguments:
          parameters:
          - name: params
            value: '{{tasks.compose-and-validate.outputs.parameters.params}}'
          - name: data-yaml
            value: '{{tasks.dataset-loading.outputs.parameters.data-yaml}}'
          - name: manifest-summary
            value: '{{tasks.dataset-loading.outputs.parameters.manifest-summary}}'
      - name: model-training
        depends: compose-and-validate && dataset-loading
        template: model-training
        arguments:
          parameters:
          - name: params
            value: '{{tasks.compose-and-validate.outputs.parameters.params}}'
          - name: data-yaml
            value: '{{tasks.dataset-loading.outputs.parameters.data-yaml}}'
          - name: manifest-summary
            value: '{{tasks.dataset-loading.outputs.parameters.manifest-summary}}'
          - name: gpus
            value: '{{=workflow.parameters[''model-training-class''] in [''gpu-t4'']
              ? ''1'' : ''0''}}'
      - name: qat-finetune
        depends: compose-and-validate && model-training
        template: qat-finetune
        when: '{{workflow.parameters.quantization-mode}} == qat'
        arguments:
          parameters:
          - name: params
            value: '{{tasks.compose-and-validate.outputs.parameters.params}}'
          - name: training-result
            value: '{{tasks.model-training.outputs.parameters.training-result}}'
          - name: gpus
            value: '{{=workflow.parameters[''qat-finetune-class''] in [''gpu-t4'']
              ? ''1'' : ''0''}}'
      - name: model-quantization
        depends: compose-and-validate && model-training && (qat-finetune.Succeeded
          || qat-finetune.Skipped || qat-finetune.Omitted)
        template: model-quantization
        when: '{{workflow.parameters.quantization-mode}} != none'
        arguments:
          parameters:
          - name: params
            value: '{{tasks.compose-and-validate.outputs.parameters.params}}'
          - name: training-result
            value: '{{tasks.model-training.outputs.parameters.training-result}}'
          - name: qat-result
            value: '{{tasks.qat-finetune.outputs.parameters.qat-result}}'
      - name: model-registration
        depends: compose-and-validate && model-training && (model-quantization.Succeeded
          || model-quantization.Skipped || model-quantization.Omitted)
        template: model-registration
        arguments:
          parameters:
          - name: params
            value: '{{tasks.compose-and-validate.outputs.parameters.params}}'
          - name: training-result
            value: '{{tasks.model-training.outputs.parameters.training-result}}'
          - name: quantization-result
            value: '{{tasks.model-quantization.outputs.parameters.quantization-result}}'
