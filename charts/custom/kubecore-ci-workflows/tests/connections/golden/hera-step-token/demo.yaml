apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: demo-pipeline
  namespace: PLACEHOLDER-data-room-runtime
  labels:
    platform.kubecore.io/project: data-room
    platform.kubecore.io/app: demo
    platform.kubecore.io/managed-by: kubecore-ci
  annotations:
    platform.kubecore.io/generated-by: ml-ci-build/hera-render
    platform.kubecore.io/cost-tracking: enabled
spec:
  entrypoint: main
  templates:
  - name: compose-and-validate
    container:
      image: '{{workflow.parameters.image-compose-and-validate}}'
      args:
      - platform.lakefs.repository=PLACEHOLDER-repo
      - platform.lakefs.endpoint=http://lakefs.internal.invalid
      - platform.mlflow.tracking_uri=http://mlflow.internal.invalid
      - platform.checkpoints.bucket=outputs-demo
      - platform.checkpoints.prefix=main/checkpoints
      - experiment.name={{workflow.parameters.experiment-name}}
      - experiment.description={{workflow.parameters.experiment-description}}
      - dataset={{workflow.parameters.dataset}}
      - --render-defaults
      - '{"experiment.name":"my-experiment-v1","experiment.description":"","dataset":"dataset-default@latest"}'
      - --advanced
      - '{{workflow.parameters.config}}'
      - --require=experiment
      - --output
      - /work/params.yaml
      - --run
      - '{{workflow.name}}'
      - --steps
      - '[{"name":"hello-world","kind":"transform","reads":["experiment"],"inputs":["dataset"],"needs":[],"produces":[{"name":"report","type":"artifact"}]}]'
      - --context-dir
      - /work/context
      - --ledger-output
      - /work/kaos-ledger.json
      - --app
      - demo
      - --project
      - data-room
      command:
      - python
      - -I
      - -m
      - kaos_engine.compose
      env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: KAOS_CHECKPOINT_DIR
        value: /kaos/checkpoint
      - name: KAOS_STEP_IMAGES
        value: '{"hello-world":"{{workflow.parameters.image-hello-world}}"}'
      - name: KAOS_LAKE_TOKEN_FILE
        value: /var/run/secrets/kaos-lake/token
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
      - name: kaos-checkpoint
        mountPath: /kaos/checkpoint
      - name: kaos-lake-token
        mountPath: /var/run/secrets/kaos-lake
        readOnly: true
    metadata:
      labels:
        platform.kubecore.io/step: compose-and-validate
        platform.kubecore.io/step-kind: control
    outputs:
      parameters:
      - name: kaos-ledger
        valueFrom:
          path: /work/kaos-ledger.json
      - name: kaos-context-hello-world
        valueFrom:
          path: /work/context/hello-world.json
    podSpecPatch: "containers:\n- name: main\n  resources:\n    requests:\n      cpu:\
      \ \"{{workflow.parameters.compose-and-validate-cpu}}\"\n      memory: \"{{workflow.parameters.compose-and-validate-mem}}\"\
      \n      ephemeral-storage: \"{{workflow.parameters.compose-and-validate-disk}}\"\
      \n    limits:\n      cpu: \"{{workflow.parameters.compose-and-validate-cpu}}\"\
      \n      memory: \"{{workflow.parameters.compose-and-validate-mem}}\"\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.compose-and-validate-class}}'
      platform.kubecore.io/environment: runtime
      platform.kubecore.io/project: data-room
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: platform.kubecore.io/kubenv
      operator: Equal
      value: runtime
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-checkpoint
      emptyDir: {}
    - name: kaos-lake-token
      projected:
        sources:
        - serviceAccountToken:
            audience: kaos-lake
            expirationSeconds: 3600
            path: token
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: (lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message startsWith 'KaosIdle')
      backoff:
        duration: 30s
        factor: '2'
        maxDuration: 10m
  - name: hello-world
    container:
      image: '{{workflow.parameters.image-hello-world}}'
      command:
      - python
      - -m
      - app.entry
      env:
      - name: KAOS_STEP_CONTEXT
        value: '{{inputs.parameters.kaos-context}}'
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: KAOS_CHECKPOINT_DIR
        value: /kaos/checkpoint
      - name: KAOS_LAKE_TOKEN_FILE
        value: /var/run/secrets/kaos-lake/token
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
      - name: kaos-checkpoint
        mountPath: /kaos/checkpoint
      - name: kaos-lake-token
        mountPath: /var/run/secrets/kaos-lake
        readOnly: true
    inputs:
      parameters:
      - name: kaos-context
    metadata:
      labels:
        platform.kubecore.io/step: hello-world
        platform.kubecore.io/step-kind: transform
    outputs:
      parameters:
      - name: kaos-result
        valueFrom:
          default: '{"version":1,"status":"absent"}'
          path: /work/output/kaos-result.json
    podSpecPatch: "containers:\n- name: main\n  resources:\n    requests:\n      cpu:\
      \ \"{{workflow.parameters.hello-world-cpu}}\"\n      memory: \"{{workflow.parameters.hello-world-mem}}\"\
      \n      ephemeral-storage: \"{{workflow.parameters.hello-world-disk}}\"\n  \
      \  limits:\n      cpu: \"{{workflow.parameters.hello-world-cpu}}\"\n      memory:\
      \ \"{{workflow.parameters.hello-world-mem}}\"\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.hello-world-class}}'
      platform.kubecore.io/environment: runtime
      platform.kubecore.io/project: data-room
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: platform.kubecore.io/kubenv
      operator: Equal
      value: runtime
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-checkpoint
      emptyDir: {}
    - name: kaos-lake-token
      projected:
        sources:
        - serviceAccountToken:
            audience: kaos-lake
            expirationSeconds: 3600
            path: token
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: (lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message startsWith 'KaosIdle')
      backoff:
        duration: 30s
        factor: '2'
        maxDuration: 10m
  - name: main
    dag:
      tasks:
      - name: compose-and-validate
        template: compose-and-validate
      - name: hello-world
        depends: compose-and-validate
        template: hello-world
        arguments:
          parameters:
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-hello-world"])
              + ",\"upstream\":{" + "}" + "}"}}'
        when: '{{=!hasPrefix(workflow.parameters[''hello-world-class''], ''meluxina-'')}}'
      - name: hello-world-hpc
        template: hpc-follower
        when: '{{=hasPrefix(workflow.parameters[''hello-world-class''], ''meluxina-'')}}'
        arguments:
          parameters:
          - name: step-name
            value: hello-world
          - name: image
            value: '{{workflow.parameters.image-hello-world}}'
          - name: step-command
            value: '["python","-m","app.entry"]'
          - name: step-kind
            value: transform
          - name: time-limit
            value: '240'
          - name: deadline-seconds
            value: '259200'
          - name: resumable-lead
            value: '0'
          - name: resumable
            value: auto
          - name: idle-timeout
            value: ''
          - name: hpc-class
            value: '{{workflow.parameters.hello-world-class}}'
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-hello-world"])
              + ",\"upstream\":{" + "}" + "}"}}'
        depends: compose-and-validate
  - name: hpc-follower
    inputs:
      parameters:
      - name: step-name
      - name: image
      - name: step-command
      - name: step-kind
      - name: time-limit
      - name: deadline-seconds
      - name: hpc-class
      - name: resumable-lead
        value: '0'
      - name: resumable
        value: auto
      - name: idle-timeout
        value: ''
      - name: kaos-context
    metadata:
      labels:
        platform.kubecore.io/compute-type: hpc
        platform.kubecore.io/hpc-class: '{{inputs.parameters.hpc-class}}'
        platform.kubecore.io/step-kind: '{{inputs.parameters.step-kind}}'
    outputs:
      parameters:
      - name: slurm-job-id
        valueFrom:
          path: /tmp/slurm-job-id
      - name: kaos-result
        valueFrom:
          path: /tmp/outputs/kaos-result.json
    container:
      image: python:3.12-alpine
      command:
      - sh
      - -c
      args:
      - echo "$HPC_NOT_SERVED" >&2; exit 1
      env:
      - name: HPC_NOT_SERVED
        value: 'MeluXina steps run through the pool''s HPC controller, which does
          not serve this project: enable operators.hpc on the pool (KubePool spec.operators.hpc)
          and wait until the project''s MeluXina budget is known, or pick an in-cluster
          class. Nothing was submitted.'
      - name: KAOS_LAKE_TOKEN_FILE
        value: /var/run/secrets/kaos-lake/token
      volumeMounts:
      - name: kaos-lake-token
        mountPath: /var/run/secrets/kaos-lake
        readOnly: true
    volumes:
    - name: kaos-lake-token
      projected:
        sources:
        - serviceAccountToken:
            audience: kaos-lake
            expirationSeconds: 3600
            path: token
  arguments:
    parameters:
    - name: pipeline-info
      value: "HOW TO RUN: defaults are runnable as-is — just press Submit.\nPER-STEP\
        \ COMPUTE: {step}-class picks the node class; {step}-cpu / {step}-mem dial\
        \ one run's resources.\nCOMPUTE CLASSES on this pool:\n  - cpu-standard (cpu)\
        \ — n2-standard-8\n  - kubecorecpu (cpu) — e2-standard-8\n  - gpu-t4 (gpu)\
        \ — n1-standard-8 + 1x nvidia-tesla-t4\nMELUXINA (HPC): pick a meluxina-*\
        \ class in any {step}-class dropdown and that step runs as a Slurm job on\
        \ MeluXina (account PLACEHOLDER-account) — queue time applies; the pipeline\
        \ waits, stages the dataset in and the step's result back; walltime= in pipeline.py\
        \ caps the job. Classes:\n  - meluxina-gpu (gpu) — partition gpu, 4 GPUs,\
        \ 128 cores, 512 GiB — 4x A100-40GB, 2x EPYC 7452, 512 GB\n  - meluxina-cpu\
        \ (cpu) — partition cpu, 128 cores, 512 GiB — 2x EPYC 7452, 128 cores, 512\
        \ GB\n  - meluxina-largemem (cpu) — partition largemem, 128 cores, 4096 GiB\
        \ — 4 TB\nSTEPS: compose-and-validate -> hello-world\n(This field is informational\
        \ — leave it unchanged.)"
      description: 'Read-only: live pool compute classes + how to fill this form.
        Leave unchanged.'
    - name: experiment-name
      description: 'Config: experiment.name'
      value: my-experiment-v1
    - name: experiment-description
      description: 'Config: experiment.description'
      value: ''
    - name: dataset
      description: 'Config: dataset'
      value: dataset-default@latest
    - name: config
      description: 'ADVANCED: override YAML merged LAST over the composed config (OmegaConf.merge).
        Overrides everything above — intended for scripted submissions (argo submit
        -p config=...). May not modify platform.*.'
      value: ''
    - name: mlflow-endpoint
      value: http://mlflow.internal.invalid
    - name: lakefs-endpoint
      value: http://lakefs.internal.invalid
    - name: lakefs-repo
      value: PLACEHOLDER-repo
    - name: image-compose-and-validate
      valueFrom:
        configMapKeyRef:
          name: demo-pipeline-images
          key: compose-and-validate
    - name: image-hello-world
      valueFrom:
        configMapKeyRef:
          name: demo-pipeline-images
          key: hello-world
    - name: compose-and-validate-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      - gpu-t4
      description: Compute class for the 'compose-and-validate' step (the KubePool's
        class catalog; default = its cpu tier).
    - name: compose-and-validate-cpu
      value: '7'
      description: Per-run resource override for step 'compose-and-validate'.
    - name: compose-and-validate-mem
      value: 27Gi
      description: Per-run resource override for step 'compose-and-validate'.
    - name: compose-and-validate-disk
      value: 10Gi
      description: Per-run resource override for step 'compose-and-validate'.
    - name: hello-world-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      - gpu-t4
      - meluxina-gpu
      - meluxina-cpu
      - meluxina-largemem
      description: Compute class for the 'hello-world' step (the KubePool's class
        catalog; default = its cpu tier; meluxina-* classes run the step as a Slurm
        job on MeluXina — queue time applies, see pipeline-info).
    - name: hello-world-cpu
      value: '7'
      description: Per-run resource override for step 'hello-world'.
    - name: hello-world-mem
      value: 27Gi
      description: Per-run resource override for step 'hello-world'.
    - name: hello-world-disk
      value: 10Gi
      description: Per-run resource override for step 'hello-world'.
  serviceAccountName: argo-workflow
