apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: demo-pipeline
  namespace: PLACEHOLDER-data-room-runtime
  labels:
    platform.kubecore.io/project: data-room
    platform.kubecore.io/app: demo
    platform.kubecore.io/managed-by: kubecore-ci
  annotations:
    platform.kubecore.io/generated-by: ml-ci-build/hera-render
    platform.kubecore.io/cost-tracking: enabled
spec:
  entrypoint: main
  templates:
  - name: compose-and-validate
    container:
      image: '{{workflow.parameters.image-compose-and-validate}}'
      args:
      - platform.lakefs.repository=PLACEHOLDER-repo
      - platform.lakefs.endpoint=http://lakefs.internal.invalid
      - platform.mlflow.tracking_uri=http://mlflow.internal.invalid
      - platform.checkpoints.bucket=outputs-demo
      - platform.checkpoints.prefix=main/checkpoints
      - experiment.name={{workflow.parameters.experiment-name}}
      - experiment.description={{workflow.parameters.experiment-description}}
      - --render-defaults
      - '{"experiment.name":"my-experiment-v1","experiment.description":""}'
      - --advanced
      - '{{workflow.parameters.config}}'
      - --require=experiment
      - --output
      - /work/params.yaml
      command:
      - python
      - -m
      - kubecore.compose
      env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: CHECKPOINT_BUCKET
        value: outputs-demo
      - name: CHECKPOINT_PREFIX
        value: main/checkpoints
      - name: KUBECORE_RUN_ID
        value: '{{workflow.name}}'
      - name: KUBECORE_WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: KAOS_LAKE_TOKEN_FILE
        value: /var/run/secrets/kaos-lake/token
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
      - name: kaos-lake-token
        mountPath: /var/run/secrets/kaos-lake
        readOnly: true
    outputs:
      parameters:
      - name: params
        valueFrom:
          path: /work/params.yaml
    podSpecPatch: "containers:\n- name: main\n  resources:\n    requests:\n      cpu:\
      \ \"{{workflow.parameters.compose-and-validate-cpu}}\"\n      memory: \"{{workflow.parameters.compose-and-validate-mem}}\"\
      \n      ephemeral-storage: \"{{workflow.parameters.compose-and-validate-disk}}\"\
      \n    limits:\n      cpu: \"{{workflow.parameters.compose-and-validate-cpu}}\"\
      \n      memory: \"{{workflow.parameters.compose-and-validate-mem}}\"\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.compose-and-validate-class}}'
      platform.kubecore.io/environment: runtime
      platform.kubecore.io/project: data-room
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: platform.kubecore.io/kubenv
      operator: Equal
      value: runtime
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-lake-token
      projected:
        sources:
        - serviceAccountToken:
            audience: kaos-lake
            expirationSeconds: 3600
            path: token
  - name: hello-world
    container:
      image: '{{workflow.parameters.image-hello-world}}'
      args:
      - --params
      - '{{inputs.parameters.params}}'
      command:
      - python
      - -m
      - app.entry
      env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: CHECKPOINT_BUCKET
        value: outputs-demo
      - name: CHECKPOINT_PREFIX
        value: main/checkpoints
      - name: KUBECORE_RUN_ID
        value: '{{workflow.name}}'
      - name: KUBECORE_WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: KAOS_LAKE_TOKEN_FILE
        value: /var/run/secrets/kaos-lake/token
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
      - name: kaos-lake-token
        mountPath: /var/run/secrets/kaos-lake
        readOnly: true
    inputs:
      parameters:
      - name: params
    podSpecPatch: "containers:\n- name: main\n  resources:\n    requests:\n      cpu:\
      \ \"{{workflow.parameters.hello-world-cpu}}\"\n      memory: \"{{workflow.parameters.hello-world-mem}}\"\
      \n      ephemeral-storage: \"{{workflow.parameters.hello-world-disk}}\"\n  \
      \  limits:\n      cpu: \"{{workflow.parameters.hello-world-cpu}}\"\n      memory:\
      \ \"{{workflow.parameters.hello-world-mem}}\"\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.hello-world-class}}'
      platform.kubecore.io/environment: runtime
      platform.kubecore.io/project: data-room
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: platform.kubecore.io/kubenv
      operator: Equal
      value: runtime
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-lake-token
      projected:
        sources:
        - serviceAccountToken:
            audience: kaos-lake
            expirationSeconds: 3600
            path: token
  - name: main
    dag:
      tasks:
      - name: compose-and-validate
        template: compose-and-validate
        when: '{{=!hasPrefix(workflow.parameters[''compose-and-validate-class''],
          ''meluxina-'')}}'
      - name: compose-and-validate-meluxina
        template: meluxina-run
        when: '{{=hasPrefix(workflow.parameters[''compose-and-validate-class''], ''meluxina-'')}}'
        arguments:
          parameters:
          - name: step-name
            value: compose-and-validate
          - name: image
            value: '{{workflow.parameters.image-compose-and-validate}}'
          - name: step-command
            value: '["python", "-m", "kubecore.compose", "platform.lakefs.repository=PLACEHOLDER-repo",
              "platform.lakefs.endpoint=http://lakefs.internal.invalid", "platform.mlflow.tracking_uri=http://mlflow.internal.invalid",
              "platform.checkpoints.bucket=outputs-demo", "platform.checkpoints.prefix=main/checkpoints",
              {{=toJson(''experiment.name='' + workflow.parameters[''experiment-name''])}},
              {{=toJson(''experiment.description='' + workflow.parameters[''experiment-description''])}},
              "--render-defaults", "{\"experiment.name\":\"my-experiment-v1\",\"experiment.description\":\"\"}",
              "--advanced", {{=toJson(workflow.parameters.config)}}, "--require=experiment",
              "--output", "/work/params.yaml"]'
          - name: time-limit
            value: '240'
          - name: deadline-seconds
            value: '43200'
          - name: resumable-lead
            value: '0'
          - name: step-outputs
            value: params
          - name: hpc-class
            value: '{{workflow.parameters.compose-and-validate-class}}'
      - name: hello-world
        depends: ((compose-and-validate.Succeeded || compose-and-validate.Skipped)
          && (compose-and-validate-meluxina.Succeeded || compose-and-validate-meluxina.Skipped))
        template: hello-world
        arguments:
          parameters:
          - name: params
            value: '{{=tasks[''compose-and-validate''].status == ''Skipped'' ? tasks[''compose-and-validate-meluxina''].outputs.parameters[''params'']
              : tasks[''compose-and-validate''].outputs.parameters[''params'']}}'
        when: '{{=!hasPrefix(workflow.parameters[''hello-world-class''], ''meluxina-'')}}'
      - name: hello-world-meluxina
        template: meluxina-run
        when: '{{=hasPrefix(workflow.parameters[''hello-world-class''], ''meluxina-'')}}'
        arguments:
          parameters:
          - name: step-name
            value: hello-world
          - name: image
            value: '{{workflow.parameters.image-hello-world}}'
          - name: step-command
            value: '["python", "-m", "app.entry", "--params", {{=toJson(tasks[''compose-and-validate''].status
              == ''Skipped'' ? tasks[''compose-and-validate-meluxina''].outputs.parameters[''params'']
              : tasks[''compose-and-validate''].outputs.parameters[''params''])}}]'
          - name: time-limit
            value: '240'
          - name: deadline-seconds
            value: '43200'
          - name: resumable-lead
            value: '0'
          - name: step-outputs
            value: ''
          - name: hpc-class
            value: '{{workflow.parameters.hello-world-class}}'
        depends: ((compose-and-validate.Succeeded || compose-and-validate.Skipped)
          && (compose-and-validate-meluxina.Succeeded || compose-and-validate-meluxina.Skipped))
  - name: meluxina-run
    inputs:
      parameters:
      - name: step-name
      - name: image
      - name: step-command
      - name: time-limit
      - name: deadline-seconds
      - name: step-outputs
        value: ''
      - name: hpc-class
      - name: resumable-lead
        value: '0'
    metadata:
      labels:
        platform.kubecore.io/compute-type: hpc
        platform.kubecore.io/hpc-class: '{{inputs.parameters.hpc-class}}'
    outputs:
      parameters:
      - name: slurm-job-id
        valueFrom:
          path: /tmp/slurm-job-id
      - name: params
        valueFrom:
          path: /tmp/outputs/params.json
          default: '{}'
    container:
      image: python:3.12-alpine
      command:
      - sh
      - -c
      args:
      - echo "$HPC_NOT_SERVED" >&2; exit 1
      env:
      - name: HPC_NOT_SERVED
        value: 'MeluXina steps run through the pool''s HPC controller, which does
          not serve this project: enable operators.hpc on the pool (KubePool spec.operators.hpc)
          and wait until the project''s MeluXina budget is known, or pick an in-cluster
          class. Nothing was submitted.'
      - name: KAOS_LAKE_TOKEN_FILE
        value: /var/run/secrets/kaos-lake/token
      volumeMounts:
      - name: kaos-lake-token
        mountPath: /var/run/secrets/kaos-lake
        readOnly: true
    volumes:
    - name: kaos-lake-token
      projected:
        sources:
        - serviceAccountToken:
            audience: kaos-lake
            expirationSeconds: 3600
            path: token
  arguments:
    parameters:
    - name: pipeline-info
      value: "HOW TO RUN: defaults are runnable as-is — just press Submit.\nPER-STEP\
        \ COMPUTE: {step}-class picks the node class; {step}-cpu / {step}-mem dial\
        \ one run's resources.\nCOMPUTE CLASSES on this pool:\n  - cpu-standard (cpu)\
        \ — n2-standard-8\n  - kubecorecpu (cpu) — e2-standard-8\n  - gpu-t4 (gpu)\
        \ — n1-standard-8 + 1x nvidia-tesla-t4\nMELUXINA (HPC): pick a meluxina-*\
        \ class in any {step}-class dropdown and that step runs as a Slurm job on\
        \ MeluXina (account PLACEHOLDER-account) — queue time applies; the pipeline\
        \ waits, stages the dataset in and the step's outputs back; hpc_time_limit\
        \ in pipeline.py caps the job. Classes:\n  - meluxina-gpu (gpu) — partition\
        \ gpu, 4 GPUs, 128 cores, 512 GiB — 4x A100-40GB, 2x EPYC 7452, 512 GB\n \
        \ - meluxina-cpu (cpu) — partition cpu, 128 cores, 512 GiB — 2x EPYC 7452,\
        \ 128 cores, 512 GB\n  - meluxina-largemem (cpu) — partition largemem, 128\
        \ cores, 4096 GiB — 4 TB\nSTEPS: compose-and-validate -> hello-world\n(This\
        \ field is informational — leave it unchanged.)"
      description: 'Read-only: live pool compute classes + how to fill this form.
        Leave unchanged.'
    - name: experiment-name
      description: 'Config: experiment.name'
      value: my-experiment-v1
    - name: experiment-description
      description: 'Config: experiment.description'
      value: ''
    - name: config
      description: 'ADVANCED: override YAML merged LAST over the composed config (OmegaConf.merge).
        Overrides everything above — intended for scripted submissions (argo submit
        -p config=...). May not modify platform.*.'
      value: ''
    - name: mlflow-endpoint
      value: http://mlflow.internal.invalid
    - name: lakefs-endpoint
      value: http://lakefs.internal.invalid
    - name: lakefs-repo
      value: PLACEHOLDER-repo
    - name: image-compose-and-validate
      valueFrom:
        configMapKeyRef:
          name: demo-pipeline-images
          key: compose-and-validate
    - name: image-hello-world
      valueFrom:
        configMapKeyRef:
          name: demo-pipeline-images
          key: hello-world
    - name: compose-and-validate-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      - gpu-t4
      - meluxina-gpu
      - meluxina-cpu
      - meluxina-largemem
      description: Compute class for the 'compose-and-validate' step (the KubePool's
        class catalog; default = its cpu tier; meluxina-* classes run the step as
        a Slurm job on MeluXina — queue time applies, see pipeline-info).
    - name: compose-and-validate-cpu
      value: '7'
      description: Per-run resource override for step 'compose-and-validate'.
    - name: compose-and-validate-mem
      value: 27Gi
      description: Per-run resource override for step 'compose-and-validate'.
    - name: compose-and-validate-disk
      value: 10Gi
      description: Per-run resource override for step 'compose-and-validate'.
    - name: hello-world-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      - gpu-t4
      - meluxina-gpu
      - meluxina-cpu
      - meluxina-largemem
      description: Compute class for the 'hello-world' step (the KubePool's class
        catalog; default = its cpu tier; meluxina-* classes run the step as a Slurm
        job on MeluXina — queue time applies, see pipeline-info).
    - name: hello-world-cpu
      value: '7'
      description: Per-run resource override for step 'hello-world'.
    - name: hello-world-mem
      value: 27Gi
      description: Per-run resource override for step 'hello-world'.
    - name: hello-world-disk
      value: 10Gi
      description: Per-run resource override for step 'hello-world'.
  serviceAccountName: argo-workflow
