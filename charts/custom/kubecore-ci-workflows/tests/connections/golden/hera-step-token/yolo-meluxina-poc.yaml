            value: '{{=tasks[''model-quantization''].status == ''Skipped'' ? tasks[''model-quantization-meluxina''].outputs.parameters[''quantization-result'']
              : tasks[''model-quantization''].outputs.parameters[''quantization-result'']}}'
        when: '{{=!hasPrefix(workflow.parameters[''model-registration-class''], ''meluxina-'')}}'
      - name: model-registration-meluxina
        template: hpc-follower
        when: '{{=hasPrefix(workflow.parameters[''model-registration-class''], ''meluxina-'')}}'
        arguments:
          parameters:
          - name: step-name
            value: model-registration
          - name: image
            value: '{{workflow.parameters.image-model-registration}}'
          - name: step-command
            value: '["python", "-m", "app.entry", "--params", {{=toJson(tasks[''compose-and-validate''].status
              == ''Skipped'' ? tasks[''compose-and-validate-meluxina''].outputs.parameters[''params'']
              : tasks[''compose-and-validate''].outputs.parameters[''params''])}},
              "--training-result", {{=toJson(tasks[''model-training''].status == ''Skipped''
              ? tasks[''model-training-meluxina''].outputs.parameters[''training-result'']
              : tasks[''model-training''].outputs.parameters[''training-result''])}},
              "--quantization-result", {{=toJson(tasks[''model-quantization''].status
              == ''Skipped'' ? tasks[''model-quantization-meluxina''].outputs.parameters[''quantization-result'']
              : tasks[''model-quantization''].outputs.parameters[''quantization-result''])}}]'
          - name: time-limit
            value: '240'
          - name: deadline-seconds
            value: '259200'
          - name: resumable-lead
            value: '0'
          - name: resumable
            value: auto
          - name: idle-timeout
            value: ''
          - name: step-outputs
            value: registration-result
          - name: hpc-class
            value: '{{workflow.parameters.model-registration-class}}'
        depends: ((compose-and-validate.Succeeded || compose-and-validate.Skipped)
          && (compose-and-validate-meluxina.Succeeded || compose-and-validate-meluxina.Skipped))
          && ((model-training.Succeeded || model-training.Skipped) && (model-training-meluxina.Succeeded
          || model-training-meluxina.Skipped)) && ((model-quantization.Succeeded ||
          model-quantization-meluxina.Succeeded) || (model-quantization.Skipped &&
          model-quantization-meluxina.Skipped) || (model-quantization.Omitted && model-quantization-meluxina.Omitted))
  - name: hpc-follower
    inputs:
      parameters:
      - name: step-name
      - name: image
      - name: step-command
      - name: time-limit
      - name: deadline-seconds
      - name: step-outputs
        value: ''
      - name: hpc-class
      - name: resumable-lead
        value: '0'
      - name: resumable
        value: auto
      - name: idle-timeout
        value: ''
    metadata:
      labels:
        platform.kubecore.io/compute-type: hpc
        platform.kubecore.io/hpc-class: '{{inputs.parameters.hpc-class}}'
    outputs:
      parameters:
      - name: slurm-job-id
        valueFrom:
          path: /tmp/slurm-job-id
      - name: data-yaml
        valueFrom:
          path: /tmp/outputs/data-yaml.json
          default: '{}'
      - name: manifest-summary
        valueFrom:
          path: /tmp/outputs/manifest-summary.json
          default: '{}'
      - name: params
        valueFrom:
          path: /tmp/outputs/params.json
          default: '{}'
      - name: qat-result
        valueFrom:
          path: /tmp/outputs/qat-result.json
          default: '{}'
      - name: quantization-result
        valueFrom:
          path: /tmp/outputs/quantization-result.json
          default: '{}'
      - name: registration-result
        valueFrom:
          path: /tmp/outputs/registration-result.json
          default: '{}'
      - name: training-result
        valueFrom:
          path: /tmp/outputs/training-result.json
          default: '{}'
    container:
      image: python:3.12-alpine
      command:
      - sh
      - -c
      args:
      - echo "$HPC_NOT_SERVED" >&2; exit 1
      env:
      - name: HPC_NOT_SERVED
        value: 'MeluXina steps run through the pool''s HPC controller, which does
          not serve this project: enable operators.hpc on the pool (KubePool spec.operators.hpc)
          and wait until the project''s MeluXina budget is known, or pick an in-cluster
          class. Nothing was submitted.'
      - name: KAOS_LAKE_TOKEN_FILE
        value: /var/run/secrets/kaos-lake/token
      volumeMounts:
      - name: kaos-lake-token
        mountPath: /var/run/secrets/kaos-lake
        readOnly: true
    volumes:
    - name: kaos-lake-token
      projected:
        sources:
        - serviceAccountToken:
            audience: kaos-lake
            expirationSeconds: 3600
            path: token
