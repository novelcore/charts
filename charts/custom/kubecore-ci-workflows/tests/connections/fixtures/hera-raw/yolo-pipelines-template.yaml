      - '{{inputs.parameters.manifest-summary}}'
      command:
      - python
      - -m
      - app.entry
    inputs:
      parameters:
      - name: params
      - name: data-yaml
        default: '{}'
      - name: manifest-summary
        default: '{}'
  - name: model-training
    container:
