      - --manifest-summary
      - '{{inputs.parameters.manifest-summary}}'
      command:
      - python
      - -m
      - app.entry
      resources:
        limits:
          nvidia.com/gpu: '1'
        requests:
          nvidia.com/gpu: '1'
    inputs:
      parameters:
      - name: params
      - name: data-yaml
        default: '{}'
      - name: manifest-summary
        default: '{}'
    metadata:
      annotations:
        platform.kubecore.io/hpc: 12h
    outputs:
      parameters:
      - name: training-result
        valueFrom:
          default: '{}'
          path: /work/output/training-result.json
  - name: qat-finetune
    container:
      image: platform-managed
      args:
      - --params
      - '{{inputs.parameters.params}}'
      - --training-result
      - '{{inputs.parameters.training-result}}'
      command:
      - python
      - -m
      - app.entry
      resources:
        limits:
          nvidia.com/gpu: '1'
        requests:
          ephemeral-storage: 20Gi
          nvidia.com/gpu: '1'
    inputs:
      parameters:
      - name: params
      - name: training-result
        default: '{}'
    outputs:
      parameters:
      - name: qat-result
        valueFrom:
          default: '{}'
