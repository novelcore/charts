      args:
      - --params
      - '{{inputs.parameters.params}}'
      - --training-result
      - '{{inputs.parameters.training-result}}'
      - --qat-result
      - '{{inputs.parameters.qat-result}}'
      command:
      - python
      - -m
      - app.entry
    inputs:
