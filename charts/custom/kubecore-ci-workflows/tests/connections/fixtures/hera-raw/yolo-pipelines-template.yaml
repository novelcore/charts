      - name: params
  - name: dataset-loading
    container:
      image: platform-managed
      args:
      - --params
      - '{{inputs.parameters.params}}'
      command:
      - python
      - -m
      - app.entry
    inputs:
      parameters:
      - name: params
    outputs:
      parameters:
      - name: data-yaml
        valueFrom:
          default: '{}'
          path: /work/output/data-yaml.json
      - name: manifest-summary
        valueFrom:
          default: '{}'
          path: /work/output/manifest-summary.json
  - name: data-summary
    container:
      image: platform-managed
      args:
      - --params
      - '{{inputs.parameters.params}}'
      - --data-yaml
      - '{{inputs.parameters.data-yaml}}'
