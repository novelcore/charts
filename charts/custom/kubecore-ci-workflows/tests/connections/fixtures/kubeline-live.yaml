    , \"none\")).lower()\nif mode != \"qat\":\n    os.makedirs(\"/work/qat_output\"\
    , exist_ok=True)\n    with open(\"/work/qat_output/qat_result.json\", \"w\") as\
    \ fh:\n        json.dump({\"mode\": mode, \"skipped\": True,\n               \
    \    \"reason\": \"qat-finetune runs only when quantization-mode=qat\"}, fh)\n\
    \    print(f\"[qat-finetune] mode={mode} (not qat) - no-op; wrote stub qat_result.json.\"\
