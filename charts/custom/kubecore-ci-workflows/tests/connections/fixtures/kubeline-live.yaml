    , \"w\") as fh:\n        fh.write(manifest_summary)\ntry:\n    import boto3\n\
    \    from botocore.config import Config as BotoConfig\n    boto_cfg = BotoConfig(retries={\"\
    max_attempts\": 3, \"mode\": \"adaptive\"})\n    lakefs_endpoint = os.environ.get(\"\
    LAKEFS_ENDPOINT\", \"\")\n    lakefs_key = os.environ.get(\"LAKEFS_ACCESS_KEY\"\
    , \"\")\n    lakefs_secret = os.environ.get(\"LAKEFS_SECRET_KEY\", \"\")\n   \
    \ if lakefs_endpoint and lakefs_key and lakefs_secret:\n        s3 = boto3.client(\"\
    s3\", endpoint_url=lakefs_endpoint,\n                          aws_access_key_id=lakefs_key,\n\
    \                          aws_secret_access_key=lakefs_secret,\n            \
    \              region_name=None, config=boto_cfg)\n    else:\n        s3 = boto3.client(\"\
    s3\",\n                          endpoint_url=os.environ.get(\"S3_ENDPOINT_URL\"\
    ),\n                          aws_access_key_id=os.environ.get(\"AWS_ACCESS_KEY_ID\"\
    ),\n                          aws_secret_access_key=os.environ.get(\"AWS_SECRET_ACCESS_KEY\"\
    ),\n                          region_name=os.environ.get(\"AWS_DEFAULT_REGION\"\
    ),\n                          config=boto_cfg)\n    ms = json.loads(manifest_summary)\
    \ if manifest_summary.strip() else {}\n    ds_bucket = ms.get(\"bucket\", \"\"\
    )\n    ds_prefix = ms.get(\"prefix\", \"\").rstrip(\"/\")\n    if ds_bucket and\
    \ ds_prefix:\n        max_download = int(quant.get(\"calibration_frames\", 512))\n\
    \        images_dir = \"/work/dataset/images/train\"\n        os.makedirs(images_dir,\
    \ exist_ok=True)\n        paginator = s3.get_paginator(\"list_objects_v2\")\n\
    \        image_exts = {\".jpg\", \".jpeg\", \".png\", \".bmp\"}\n        downloaded\
    \ = 0\n        for page in paginator.paginate(Bucket=ds_bucket, Prefix=f\"{ds_prefix}/images/train/\"\
