    s3://\"):\n    _ckpt_parts = checkpoint_uri[5:].split(\"/\")\n    output_bucket\
    \ = _ckpt_parts[0]\n    lakefs_branch = _ckpt_parts[1] if len(_ckpt_parts) > 1\
    \ else \"main\"\nelse:\n    output_bucket = os.environ.get(\"CHECKPOINT_BUCKET\"\
    , \"\")\n    lakefs_branch = os.environ.get(\"LAKEFS_BRANCH\", \"main\")\nif not\
    \ output_bucket:\n    print(\"ERROR: cannot derive output bucket from checkpoint\
    \ URI and CHECKPOINT_BUCKET is unset.\", flush=True)\n    sys.exit(1)\n\n# Reconstruct\
    \ /work/dataset and download TRAIN frames from S3 \u2014 the QAT\n# calibration/distillation\
