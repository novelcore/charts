    \ \u2014 skip silently.\n                label_key = os.path.splitext(\n     \
    \               key.replace(\"/images/\", \"/labels/\", 1)\n                )[0]\
    \ + \".txt\"\n                try:\n                    s3.download_file(\n  \
    \                      ds_bucket, label_key,\n                        os.path.join(labels_dir,\
    \ stem + \".txt\"),\n                    )\n                    labels_dl += 1\n\
    \                except Exception:\n                    pass\n               \
    \ if downloaded >= max_download:\n                    break\n            if downloaded\
    \ >= max_download:\n                break\n        print(\n            f\"[model-quantization]\
    \ Downloaded {downloaded} frames \"\n            f\"+ {labels_dl} labels.\",\n\
    \            flush=True,\n        )\n    else:\n        print(\"[model-quantization]\
    \ WARNING: manifest_summary missing bucket/prefix \u2014 calibration frames not\
    \ downloaded.\", flush=True)\nexcept Exception as e:\n    print(f\"[model-quantization]\
    \ WARNING: frame download failed: {e}. Proceeding \u2014 CLI will fail if dataset\
    \ is needed.\", flush=True)\n\nos.makedirs(\"/work/quant_output\", exist_ok=True)\n\
    \nflags = [\n    \"--mode\", mode,\n    \"--source-mlflow-run-id\", mlflow_run_id,\n\
    \    \"--dataset-dir\", \"/work/dataset\",\n    \"--output-dir\", \"/work/quant_output\"\
    ,\n    \"--output-bucket\", output_bucket,\n    \"--output-prefix\", f\"{lakefs_branch}/{quant.get('output_prefix',\
    \ 'quantization/model')}\",\n    \"--experiment-name\", str(exp.get(\"name\",\
    \ \"quantization\")),\n    \"--image-size\", str(quant.get(\"image_size\", 640)),\n\
    \    \"--calibration-frames\", str(quant.get(\"calibration_frames\", 512)),\n\
    \    \"--calibration-seed\", str(quant.get(\"calibration_seed\", 42)),\n    \"\
    --parity-frames\", str(quant.get(\"parity_frames\", 100)),\n    \"--parity-max-abs-error\"\
    , str(quant.get(\"parity_max_abs_error\", 0.05)),\n]\n\nif mode == \"ptq\":\n\
    \    if not best_checkpoint_s3:\n        print(\"ERROR: best_checkpoint_s3 missing\
    \ in training_result for PTQ mode.\", flush=True)\n        sys.exit(1)\n    flags\
    \ += [\"--fp32-checkpoint-path\", best_checkpoint_s3]\n\nelif mode == \"qat\"\
    :\n    qat_raw = os.environ.get(\"QAT_RESULT\", \"\")\n    if not qat_raw.strip():\n\
    \        print(\"ERROR: QAT_RESULT is empty but mode=qat \u2014 qat-finetune must\
    \ have run.\", flush=True)\n        sys.exit(1)\n    try:\n        qr = json.loads(qat_raw)\n\
    \    except json.JSONDecodeError as e:\n        print(f\"ERROR: QAT_RESULT is\
    \ not valid JSON: {e}\", flush=True)\n        sys.exit(1)\n    tflite_uri = qr.get(\"\
    tflite_s3_uri\")\n    qat_run_id = qr.get(\"mlflow_run_id\")\n    if not tflite_uri:\n\
    \        print(f\"ERROR: qat_result missing tflite_s3_uri: {qr}\", flush=True)\n\
    \        sys.exit(1)\n    flags += [\"--tflite-s3-uri\", tflite_uri]\n    if qat_run_id:\n\
    \        flags += [\"--qat-run-id\", qat_run_id]\n    if best_checkpoint_s3:\n\
    \        flags += [\"--fp32-checkpoint-path\", best_checkpoint_s3]\n\nprint(f\"\
    [model-quantization] Running: model-quantization run {' '.join(flags)}\", flush=True)\n\
    result = subprocess.run([\"model-quantization\"] + flags)\nsys.exit(result.returncode)\n"
  outputs:
    parameters:
    - name: quantization-result
      path: /work/quant_output/quantization_result.json
  resources:
    requests:
      cpu: '2'
      memory: 8Gi
      ephemeral-storage: 10Gi
    limits:
      cpu: '4'
      memory: 16Gi
      ephemeral-storage: 20Gi
- name: model-registration
  path: model_registration
  compute: cpu
  dependencies:
  - model-training
  - model-quantization
  inputs:
    parameters:
    - name: training-result
      from: model-training
  command:
  - python
  - -c
  args:
  - "import os, sys, subprocess, json, yaml\n\n# Config resolution: PIPELINE_CONFIG\
    \ (platform-injected) overrides PARAMS_YAML.\npipeline_config = os.environ.get(\"\
    PIPELINE_CONFIG\", \"\")\nparams_yaml = os.environ.get(\"PARAMS_YAML\", \"\")\n\
    raw = pipeline_config.strip() if pipeline_config.strip() else params_yaml\n\n\
    if not raw.strip():\n    print(\"ERROR: Neither PIPELINE_CONFIG nor PARAMS_YAML\
    \ is set.\", flush=True)\n    sys.exit(1)\ntry:\n    cfg = yaml.safe_load(raw)\n\
    except yaml.YAMLError as e:\n    print(f\"ERROR: Config is not valid YAML: {e}\"\
    , flush=True)\n    sys.exit(1)\n\ntr_raw = os.environ.get(\"TRAINING_RESULT\"\
    , \"\")\nif not tr_raw.strip():\n    print(\"ERROR: TRAINING_RESULT input parameter\
    \ is empty.\", flush=True)\n    sys.exit(1)\ntry:\n    tr = json.loads(tr_raw)\n\
    except json.JSONDecodeError as e:\n    print(f\"ERROR: TRAINING_RESULT is not\
    \ valid JSON: {e}\", flush=True)\n    sys.exit(1)\n\ndataset = cfg.get(\"dataset\"\
    ) or {}\nmodel = cfg.get(\"model\") or {}\nregistration = cfg.get(\"registration\"\
    ) or {}\n\nmlflow_run_id = tr.get(\"mlflow_run_id\")\nbest_checkpoint_s3 = tr.get(\"\
    best_checkpoint_s3\")\nif not mlflow_run_id or not best_checkpoint_s3:\n    print(f\"\
    ERROR: training_result missing mlflow_run_id or best_checkpoint_s3: {tr}\", flush=True)\n\
    \    sys.exit(1)\n\n# Derive last checkpoint path from best: replace best.pt with\
    \ last.pt\nlast_checkpoint_s3 = best_checkpoint_s3.replace(\"/best.pt\", \"/last.pt\"\
    )\n\nflags = [\n    \"--mlflow-run-id\", mlflow_run_id,\n    \"--best-checkpoint-path\"\
    , best_checkpoint_s3,\n    \"--last-checkpoint-path\", last_checkpoint_s3,\n \
    \   \"--dataset-version\", str(dataset.get(\"version\", \"\")),\n    \"--model-variant\"\
    , str(model.get(\"variant\", \"\")),\n]\n\n# Optional registration flags\nif registration.get(\"\
    registered_model_name\"):\n    flags += [\"--registered-model-name\", str(registration[\"\
    registered_model_name\"])]\nif registration.get(\"promote_to\"):\n    flags +=\
    \ [\"--promote-to\", str(registration[\"promote_to\"])]\n\n# Optional lineage\
    \ flags from training result\nif dataset.get(\"sample_size\") is not None:\n \
    \   flags += [\"--dataset-sample-size\", str(dataset[\"sample_size\"])]\n\nfinal_map50\
    \ = tr.get(\"final_map50\")\nif final_map50 is not None:\n    flags += [\"--best-map50\"\
    , str(final_map50)]\n\nexported_models = tr.get(\"exported_models\")\nif exported_models:\n\
    \    flags += [\"--exported-models\", json.dumps(exported_models)]\n\nprint(f\"\
    [model-registration] Running: model-registration {' '.join(flags)}\", flush=True)\n\
    result = subprocess.run([\"model-registration\"] + flags)\nsys.exit(result.returncode)\n"
