# Derived from kubeline-yolo-mlops.yaml (novelcore/kubeline-yolo-mlops@e3cf52b3fc92346ddfb0554c8ce1ce88df0772b3)
# with every step's `env:` removed, for the live-compute path ONLY.
# Why: on origin/main (chart 0.12.112) build_live_step_template reads
# `dataset_pathoverride_expr` while looping a step's env, but that name is first
# assigned after the live block has already run, so ANY live-path step with an
# `env:` raises NameError. Env-less steps render. Mechanically regenerable:
# load the source, `step.pop("env")` for each step, safe_dump.
version: 2
pipeline:
  parameters:
  - name: config
    default: ''
    description: "ADVANCED: full pipeline config YAML (schema pipeline_config.example.yaml).\
      \ When non-empty it OVERRIDES all individual parameters above \u2014 intended\
      \ for scripted submissions (argo submit -p config=...)."
  - name: experiment-name
    default: object-pose-v1-yolov8n
    description: MLflow experiment name and S3 checkpoint path prefix.
  - name: experiment-description
    default: ''
    description: Optional free-text description stored in the MLflow run.
  - name: dataset-ref
    default: main
    description: "Dataset (lakeFS ref) to train on \u2014 rendered as a dropdown from\
      \ the dataset catalog."
  - name: dataset-source
    default: lakefs
    enum:
    - lakefs
    - s3
    description: 'Storage backend for the dataset: ''lakefs'' or ''s3''.'
  - name: dataset-version
    default: ''
    description: Provenance tag recorded in MLflow (derived from dataset-ref). Not
      a path.
  - name: dataset-path-override
    default: ''
    description: Optional s3:// override. Empty = use the picked dataset-ref.
  - name: dataset-sample-size
    default: ''
    description: Integer sample size for reproducible subsets. Empty = full dataset.
  - name: dataset-seed
    default: '42'
    description: Random seed for reproducible dataset sampling.
  - name: model-variant
    default: yolov8n-pose.pt
    enum:
    - yolov8n-pose.pt
    - yolov8s-pose.pt
    - yolov8m-pose.pt
    - yolov8l-pose.pt
    - yolov8x-pose.pt
    - yolov9n-pose.pt
    - yolov9s-pose.pt
    - yolov9m-pose.pt
    - yolov9l-pose.pt
    - yolov9x-pose.pt
    - yolov10n-pose.pt
    - yolov10s-pose.pt
    - yolov10m-pose.pt
    - yolov10l-pose.pt
    - yolov10x-pose.pt
    - yolov11n-pose.pt
    - yolov11s-pose.pt
    - yolov11m-pose.pt
    - yolov11l-pose.pt
    - yolov11x-pose.pt
    description: YOLO pose model variant file. Determines architecture and parameter
      count.
  - name: pretrained-weights
    default: ''
    description: S3 URI to custom .pt weights for weight-only init. Empty = use model-variant's
      bundled weights.
  - name: epochs
    default: '100'
    description: Total training epochs.
  - name: batch-size
    default: '16'
    description: Training batch size. Use -1 for Ultralytics auto-batch.
  - name: image-size
    default: '640'
    description: Input image resolution in pixels (must be a multiple of 32).
  - name: learning-rate
    default: '0.01'
    description: Initial learning rate (Ultralytics lr0).
  - name: cos-lr
    default: 'true'
    enum:
    - 'false'
    - 'true'
    description: Use cosine learning rate schedule.
  - name: lrf
    default: '0.01'
    description: 'Final LR ratio: final_lr = learning_rate * lrf. Must be in (0, 1].'
  - name: optimizer
    default: SGD
    enum:
    - SGD
    - Adam
    - AdamW
    description: Gradient optimizer. SGD is the Ultralytics default for YOLO.
  - name: momentum
    default: '0.937'
    description: SGD momentum or Adam beta1.
  - name: weight-decay
    default: '0.0005'
    description: Optimizer weight decay (L2 regularization coefficient).
  - name: warmup-epochs
    default: '3.0'
    description: Number of LR warmup epochs.
  - name: warmup-momentum
    default: '0.8'
    description: Initial momentum during warmup (rises to `momentum` by end of warmup).
  - name: dropout
    default: '0.0'
    description: Dropout rate applied in the classifier head [0.0, 1.0).
  - name: label-smoothing
    default: '0.0'
    description: Label smoothing epsilon [0.0, 1.0). Reduces overconfidence.
  - name: nbs
    default: '64'
    description: Nominal batch size. Ultralytics scales gradients so effective LR
      matches this batch size.
  - name: freeze
    default: ''
    description: Freeze the first N backbone layers. Empty = train all layers.
  - name: amp
    default: 'true'
    enum:
    - 'false'
    - 'true'
    description: Enable Automatic Mixed Precision (FP16). Halves GPU memory use.
  - name: close-mosaic
    default: '10'
    description: Disable mosaic augmentation for the last N epochs (0 = never disable).
  - name: training-seed
    default: '0'
    description: Global training RNG seed (separate from dataset-seed).
  - name: deterministic
    default: 'true'
    enum:
    - 'false'
    - 'true'
    description: Enable cuDNN deterministic mode. Slight speed penalty; ensures reproducibility.
  - name: pose
    default: '12.0'
    description: Keypoint regression loss gain. Primary lever for object keypoint
      accuracy.
  - name: kobj
    default: '2.0'
    description: Keypoint objectness loss gain.
  - name: box
    default: '7.5'
    description: Bounding-box regression loss gain.
  - name: cls
    default: '0.5'
    description: Classification loss gain.
  - name: dfl
    default: '1.5'
    description: Distribution Focal Loss gain.
  - name: early-stopping-patience
    default: '50'
    description: Epochs without improvement before early stopping triggers.
  - name: checkpointing-interval-epochs
    default: '10'
    description: Upload an intermediate checkpoint to S3 every N epochs.
  - name: checkpointing-storage-path
    default: ''
    description: Override checkpoint location (s3://bucket/prefix). Empty = platform-derived
      (project lakeFS repository, main/checkpoints).
  - name: checkpoint-resume-from
    default: ''
    description: 'Checkpoint to resume from: empty = start fresh, ''auto'' = latest,
      or a full S3 path.'
  - name: aug-hsv-h
    default: '0.015'
    description: HSV hue augmentation range [0.0, 1.0].
  - name: aug-hsv-s
    default: '0.7'
    description: HSV saturation augmentation range [0.0, 1.0].
  - name: aug-hsv-v
    default: '0.4'
    description: HSV value augmentation range [0.0, 1.0].
  - name: aug-degrees
    default: '0.0'
    description: Random rotation range in degrees. Keep 0.0 for pose (keypoints are
      rotation-sensitive).
  - name: aug-translate
    default: '0.1'
    description: Random translation fraction of image size.
  - name: aug-scale
    default: '0.5'
    description: Random scale gain (multiplicative).
  - name: aug-shear
    default: '0.0'
    description: Random shear range in degrees.
  - name: aug-perspective
    default: '0.0'
    description: Random perspective warp [0.0, 0.001]. Values > 0.001 cause severe
      keypoint displacement.
  - name: aug-flipud
    default: '0.0'
    description: Vertical flip probability. Keep 0.0 for object (no defined up direction
      has defined 'up').
  - name: aug-fliplr
    default: '0.0'
    description: Horizontal flip probability. Keep 0.0 for object (no left-right symmetry
      in canonical pose).
  - name: aug-mosaic
    default: '1.0'
    description: Mosaic augmentation probability [0.0, 1.0]. Disabled for last `close-mosaic`
      epochs.
  - name: aug-mixup
    default: '0.0'
    description: MixUp augmentation probability [0.0, 1.0].
  - name: aug-copy-paste
    default: '0.0'
    description: Segment copy-paste augmentation probability [0.0, 1.0].
  - name: aug-erasing
    default: '0.4'
    description: Random erasing probability [0.0, 0.9].
  - name: aug-bgr
    default: '0.0'
    description: BGR channel flip probability [0.0, 1.0].
  - name: export-enabled
    default: 'false'
    enum:
    - 'false'
    - 'true'
    description: Enable post-training model export (TensorRT/ONNX).
  - name: export-formats
    default: engine
    description: 'Comma-separated export formats: ''engine'' (TensorRT) and/or ''onnx''.
      Only used when export-enabled=true.'
  - name: export-precisions
    default: fp16
    description: 'Comma-separated precisions: ''fp16'' and/or ''int8''. Only used
      when export-enabled=true.'
  - name: quantization-mode
    default: none
    enum:
    - none
    - ptq
    - qat
    description: 'Quantization mode: ''none'' skips both qat-finetune and model-quantization;
      ''ptq'' runs Ultralytics INT8 export; ''qat'' runs PT2E QAT fine-tune then model-quantization.'
  - name: quantization-image-size
    default: '640'
    description: Input image size for quantization. Must match training image-size.
  - name: quantization-calibration-frames
    default: '512'
    description: Number of calibration frames sampled from the dataset for PTQ/QAT
      calibration.
  - name: quantization-calibration-seed
    default: '42'
    description: RNG seed for deterministic calibration frame sampling (FR-M-04).
  - name: quantization-parity-frames
    default: '100'
    description: Number of frames for the INT8 vs FP32 parity check.
  - name: quantization-parity-max-abs-error
    default: '0.05'
    description: Maximum allowed max-absolute-error in the parity check. Run fails
      if this threshold is exceeded.
  - name: quantization-output-prefix
    default: quantization
    description: S3 key prefix for quantized TFLite artifacts (e.g. 'quantization/exp-001').
  - name: qat-epochs
    default: '10'
    description: Number of QAT fine-tune epochs. Only used when quantization-mode=qat.
  - name: qat-lr
    default: '0.0001'
    description: Learning rate for QAT fine-tuning. Only used when quantization-mode=qat.
  - name: registered-model-name
    default: ''
    description: 'MLflow registered model name. Empty = use REGISTERED_MODEL_NAME
      env var (default: object-pose-yolo).'
  - name: promote-to
    default: ''
    description: 'Transition the registered model version to this stage: empty = no
      promotion, ''Staging'', or ''Production''.'
steps:
- name: config-validation
  path: config_validation
  compute: cpu
  dependencies: []
  command:
  - python
  - -c
  args:
  - "import os, sys, subprocess, yaml\n\n# Config resolution: if PIPELINE_CONFIG (injected\
    \ by platform generator)\n# is non-empty, it OVERRIDES all individual parameters.\
    \ Otherwise,\n# PARAMS_YAML (assembled from individual Argo parameters) is used.\n\
    pipeline_config = os.environ.get(\"PIPELINE_CONFIG\", \"\")\nparams_yaml = os.environ.get(\"\
    PARAMS_YAML\", \"\")\nraw = pipeline_config.strip() if pipeline_config.strip()\
    \ else params_yaml\n\nif not raw.strip():\n    print(\"ERROR: Neither PIPELINE_CONFIG\
    \ nor PARAMS_YAML is set.\", flush=True)\n    sys.exit(1)\ntry:\n    cfg = yaml.safe_load(raw)\n\
    except yaml.YAMLError as e:\n    print(f\"ERROR: Config is not valid YAML: {e}\"\
    , flush=True)\n    sys.exit(1)\nif not isinstance(cfg, dict):\n    print(\"ERROR:\
    \ Config parsed to a non-dict value.\", flush=True)\n    sys.exit(1)\n\n# Enforce\
    \ manifest-only: full-download and labels-only are not\n# supported in the cluster\
    \ because steps run in separate pods and\n# there is no shared volume between\
    \ them. In param mode, PARAMS_YAML\n# always sets manifest_only=true; in config\
    \ mode we verify it.\ndataset = cfg.get(\"dataset\") or {}\nmanifest_only = dataset.get(\"\
    manifest_only\", False)\nlabels_only = dataset.get(\"labels_only\", False)\nif\
    \ not manifest_only:\n    mode = \"labels-only\" if labels_only else \"full-download\"\
    \n    print(\n        f\"ERROR: dataset.manifest_only must be true. \"\n     \
    \   f\"Current mode is '{mode}'. \"\n        f\"Full-download and labels-only\
    \ modes require a shared filesystem \"\n        f\"between steps, which this cluster\
    \ does not provide. \"\n        f\"Set dataset.manifest_only: true in your pipeline\
    \ config.\",\n        flush=True,\n    )\n    sys.exit(1)\n\nexp = cfg.get(\"\
    experiment\") or {}\ndataset = cfg.get(\"dataset\") or {}\nmodel = cfg.get(\"\
    model\") or {}\ntraining = cfg.get(\"training\") or {}\ncheckpointing = cfg.get(\"\
    checkpointing\") or {}\nearly_stopping = cfg.get(\"early_stopping\") or {}\naugmentation\
    \ = cfg.get(\"augmentation\") or {}\n\n# Precedence: explicit param wins; empty\
    \ param falls back to platform env.\n# CHECKPOINT_BUCKET/CHECKPOINT_PREFIX are\
    \ injected by render-wft from the\n# k8smlapp pipeline-context (checkpoints.bucket\
    \ = lakeFS repo, prefix =\n# main/checkpoints). When both are absent the platform\
    \ didn't inject them\n# (legacy deployment or misconfiguration) and we fail loudly.\n\
    storage_path = str(checkpointing.get(\"storage_path\", \"\") or \"\").strip()\n\
    if not storage_path:\n    ckpt_bucket = os.environ.get(\"CHECKPOINT_BUCKET\",\
    \ \"\").strip()\n    ckpt_prefix = os.environ.get(\"CHECKPOINT_PREFIX\", \"\"\
    ).strip()\n    if not ckpt_bucket:\n        print(\n            \"ERROR: checkpointing-storage-path\
    \ is empty and CHECKPOINT_BUCKET env \"\n            \"is not set. The platform\
    \ should inject CHECKPOINT_BUCKET/CHECKPOINT_PREFIX \"\n            \"from the\
    \ project lakeFS repository via render-wft. Either set \"\n            \"checkpointing-storage-path\
    \ explicitly or ensure the k8smlapp composition \"\n            \"version includes\
    \ the checkpoints block in pipeline-context.yaml.\",\n            flush=True,\n\
    \        )\n        sys.exit(1)\n    storage_path = f\"s3://{ckpt_bucket}/{ckpt_prefix}\"\
    \ if ckpt_prefix else f\"s3://{ckpt_bucket}/main/checkpoints\"\n\nflags = [\n\
    \    \"--experiment-name\", str(exp[\"name\"]),\n    \"--dataset-version\", str(dataset[\"\
    version\"]),\n    \"--dataset-source\", str(dataset[\"source\"]),\n    \"--model-variant\"\
    , str(model[\"variant\"]),\n    \"--training-epochs\", str(training[\"epochs\"\
    ]),\n    \"--training-batch-size\", str(training[\"batch_size\"]),\n    \"--training-image-size\"\
    , str(training[\"image_size\"]),\n    \"--training-learning-rate\", str(training[\"\
    learning_rate\"]),\n    \"--training-optimizer\", str(training[\"optimizer\"]),\n\
    \    \"--checkpointing-interval-epochs\", str(checkpointing[\"interval_epochs\"\
    ]),\n    \"--checkpointing-storage-path\", storage_path,\n    \"--early-stopping-patience\"\
    , str(early_stopping[\"patience\"]),\n]\n\n# Optional dataset flags\nif dataset.get(\"\
    lakefs_repo\"):\n    flags += [\"--dataset-lakefs-repo\", str(dataset[\"lakefs_repo\"\
    ])]\nif dataset.get(\"lakefs_branch\"):\n    flags += [\"--dataset-lakefs-branch\"\
    , str(dataset[\"lakefs_branch\"])]\nif dataset.get(\"path_override\"):\n    flags\
    \ += [\"--dataset-path-override\", str(dataset[\"path_override\"])]\nif dataset.get(\"\
    sample_size\") is not None:\n    flags += [\"--dataset-sample-size\", str(dataset[\"\
    sample_size\"])]\nif dataset.get(\"seed\") is not None:\n    flags += [\"--dataset-seed\"\
    , str(dataset[\"seed\"])]\n\n# dataset_manifest_only: always true (enforced above)\
    \ \u2014 pass the flag\nflags += [\"--dataset-manifest-only\"]\n\n# Optional model\
    \ flags\nif model.get(\"pretrained_weights\"):\n    flags += [\"--model-pretrained-weights\"\
    , str(model[\"pretrained_weights\"])]\n\n# Optional training flags (non-default\
    \ values)\nif training.get(\"cos_lr\") is not None:\n    flags += [\"--training-cos-lr\"\
    \ if training[\"cos_lr\"] else \"--no-training-cos-lr\"]\nif training.get(\"lrf\"\
    ) is not None:\n    flags += [\"--training-lrf\", str(training[\"lrf\"])]\nif\
    \ training.get(\"momentum\") is not None:\n    flags += [\"--training-momentum\"\
    , str(training[\"momentum\"])]\nif training.get(\"weight_decay\") is not None:\n\
    \    flags += [\"--training-weight-decay\", str(training[\"weight_decay\"])]\n\
    if training.get(\"warmup_epochs\") is not None:\n    flags += [\"--training-warmup-epochs\"\
    , str(training[\"warmup_epochs\"])]\nif training.get(\"warmup_momentum\") is not\
    \ None:\n    flags += [\"--training-warmup-momentum\", str(training[\"warmup_momentum\"\
    ])]\nif training.get(\"dropout\") is not None:\n    flags += [\"--training-dropout\"\
    , str(training[\"dropout\"])]\nif training.get(\"label_smoothing\") is not None:\n\
    \    flags += [\"--training-label-smoothing\", str(training[\"label_smoothing\"\
    ])]\nif training.get(\"nbs\") is not None:\n    flags += [\"--training-nbs\",\
    \ str(training[\"nbs\"])]\nif training.get(\"freeze\") is not None:\n    flags\
    \ += [\"--training-freeze\", str(training[\"freeze\"])]\nif training.get(\"amp\"\
    ) is not None:\n    flags += [\"--training-amp\" if training[\"amp\"] else \"\
    --no-training-amp\"]\nif training.get(\"close_mosaic\") is not None:\n    flags\
    \ += [\"--training-close-mosaic\", str(training[\"close_mosaic\"])]\nif training.get(\"\
    seed\") is not None:\n    flags += [\"--training-seed\", str(training[\"seed\"\
    ])]\nif training.get(\"deterministic\") is not None:\n    flags += [\"--training-deterministic\"\
    \ if training[\"deterministic\"] else \"--no-training-deterministic\"]\nif training.get(\"\
    pose\") is not None:\n    flags += [\"--training-pose\", str(training[\"pose\"\
    ])]\nif training.get(\"kobj\") is not None:\n    flags += [\"--training-kobj\"\
    , str(training[\"kobj\"])]\nif training.get(\"box\") is not None:\n    flags +=\
    \ [\"--training-box\", str(training[\"box\"])]\nif training.get(\"cls\") is not\
    \ None:\n    flags += [\"--training-cls\", str(training[\"cls\"])]\nif training.get(\"\
    dfl\") is not None:\n    flags += [\"--training-dfl\", str(training[\"dfl\"])]\n\
    \n# Optional checkpointing flags\nif checkpointing.get(\"resume_from\"):\n   \
    \ flags += [\"--checkpointing-resume-from\", str(checkpointing[\"resume_from\"\
    ])]\n\n# Augmentation flags\naug = augmentation\nfor key, flag in [\n    (\"hsv_h\"\
    , \"--aug-hsv-h\"), (\"hsv_s\", \"--aug-hsv-s\"), (\"hsv_v\", \"--aug-hsv-v\"\
    ),\n    (\"degrees\", \"--aug-degrees\"), (\"translate\", \"--aug-translate\"\
    ),\n    (\"scale\", \"--aug-scale\"), (\"shear\", \"--aug-shear\"),\n    (\"perspective\"\
    , \"--aug-perspective\"), (\"flipud\", \"--aug-flipud\"),\n    (\"fliplr\", \"\
    --aug-fliplr\"), (\"mosaic\", \"--aug-mosaic\"),\n    (\"mixup\", \"--aug-mixup\"\
    ), (\"copy_paste\", \"--aug-copy-paste\"),\n    (\"erasing\", \"--aug-erasing\"\
    ), (\"bgr\", \"--aug-bgr\"),\n]:\n    if aug.get(key) is not None:\n        flags\
    \ += [flag, str(aug[key])]\n\n# Optional experiment description\nif exp.get(\"\
    description\"):\n    flags += [\"--experiment-description\", str(exp[\"description\"\
    ])]\n\nprint(f\"[config-validation] Running: config-validation {' '.join(flags)}\"\
    , flush=True)\nresult = subprocess.run([\"config-validation\"] + flags)\nsys.exit(result.returncode)\n"
- name: dataset-loading
  path: dataset_loading
  compute: cpu
  dependencies:
  - config-validation
  command:
  - sh
  - -c
  args:
  - "python3 - <<'PYEOF'\nimport os, sys, subprocess, json, yaml\n\n# Config resolution:\
    \ PIPELINE_CONFIG (platform-injected) overrides PARAMS_YAML.\npipeline_config\
    \ = os.environ.get(\"PIPELINE_CONFIG\", \"\")\nparams_yaml = os.environ.get(\"\
    PARAMS_YAML\", \"\")\nraw = pipeline_config.strip() if pipeline_config.strip()\
    \ else params_yaml\n\nif not raw.strip():\n    print(\"ERROR: Neither PIPELINE_CONFIG\
    \ nor PARAMS_YAML is set.\", flush=True)\n    sys.exit(1)\ntry:\n    cfg = yaml.safe_load(raw)\n\
    except yaml.YAMLError as e:\n    print(f\"ERROR: Config is not valid YAML: {e}\"\
    , flush=True)\n    sys.exit(1)\n\ndataset = cfg.get(\"dataset\") or {}\n\nflags\
    \ = [\n    \"--version\", str(dataset[\"version\"]),\n    \"--source\", str(dataset[\"\
    source\"]),\n    \"--output-dir\", \"/work/dataset\",\n    \"--manifest-only\"\
    ,\n]\n\nif dataset.get(\"lakefs_repo\"):\n    flags += [\"--lakefs-repo\", str(dataset[\"\
    lakefs_repo\"])]\nif dataset.get(\"lakefs_branch\"):\n    flags += [\"--lakefs-branch\"\
    , str(dataset[\"lakefs_branch\"])]\nif dataset.get(\"path_override\"):\n    flags\
    \ += [\"--path-override\", str(dataset[\"path_override\"])]\nif dataset.get(\"\
    sample_size\") is not None:\n    flags += [\"--sample-size\", str(dataset[\"sample_size\"\
    ]), \"--seed\", str(dataset.get(\"seed\", 42))]\n\nprint(f\"[dataset-loading]\
    \ Running: dataset-loading {' '.join(flags)}\", flush=True)\nresult = subprocess.run([\"\
    dataset-loading\"] + flags)\nif result.returncode != 0:\n    sys.exit(result.returncode)\n\
    \n# Read the full manifest written by the CLI and extract a compact\n# summary\
    \ safe for Argo parameter passing (no key lists).\nmanifest_path = \"/work/dataset/dataset_manifest.json\"\
    \ntry:\n    with open(manifest_path) as fh:\n        manifest = json.load(fh)\n\
    except Exception as e:\n    print(f\"ERROR: Could not read {manifest_path}: {e}\"\
    , flush=True)\n    sys.exit(1)\n\nbucket = manifest.get(\"bucket\")\nprefix =\
    \ manifest.get(\"prefix\")\nif not bucket or not prefix:\n    print(f\"ERROR:\
    \ manifest missing 'bucket' or 'prefix': {manifest}\", flush=True)\n    sys.exit(1)\n\
    \n# label_keys sentinel: non-empty dict signals to model-training that\n# labels\
    \ must also be streamed from S3 (manifest-only mode). We do NOT\n# embed the actual\
    \ key lists \u2014 they are too large for Argo parameters.\nlabel_keys_raw = manifest.get(\"\
    label_keys\")\nlabel_keys_sentinel = {\"_present\": True} if label_keys_raw else\
    \ {}\n\nsummary = {\"bucket\": bucket, \"prefix\": prefix, \"label_keys\": label_keys_sentinel}\n\
    summary_path = \"/work/dataset/manifest_summary.json\"\nwith open(summary_path,\
    \ \"w\") as fh:\n    json.dump(summary, fh, separators=(\",\", \":\"))\nprint(f\"\
    [dataset-loading] Wrote manifest summary to {summary_path}: bucket={bucket} prefix={prefix}\"\
    , flush=True)\nPYEOF\n"
  outputs:
    parameters:
    - name: data-yaml
      path: /work/dataset/data.yaml
    - name: manifest-summary
      path: /work/dataset/manifest_summary.json
- name: model-training
  path: model_training
  compute: gpu
  dependencies:
  - dataset-loading
  inputs:
    parameters:
    - name: data-yaml
      from: dataset-loading
    - name: manifest-summary
      from: dataset-loading
  command:
  - python
  - -c
  args:
  - "import os, sys, subprocess, json, yaml\n\n# Config resolution: PIPELINE_CONFIG\
    \ (platform-injected) overrides PARAMS_YAML.\npipeline_config = os.environ.get(\"\
    PIPELINE_CONFIG\", \"\")\nparams_yaml = os.environ.get(\"PARAMS_YAML\", \"\")\n\
    raw = pipeline_config.strip() if pipeline_config.strip() else params_yaml\n\n\
    if not raw.strip():\n    print(\"ERROR: Neither PIPELINE_CONFIG nor PARAMS_YAML\
    \ is set.\", flush=True)\n    sys.exit(1)\ntry:\n    cfg = yaml.safe_load(raw)\n\
    except yaml.YAMLError as e:\n    print(f\"ERROR: Config is not valid YAML: {e}\"\
    , flush=True)\n    sys.exit(1)\n\n# Reconstruct /work/dataset from input parameters\n\
