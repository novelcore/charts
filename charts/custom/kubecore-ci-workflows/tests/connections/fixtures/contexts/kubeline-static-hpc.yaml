project: data-room
app: kubeline-static-hpc
pipelineName: kubeline-static-hpc
namespace: PLACEHOLDER-data-room-runtime
registryUrl: registry.internal.invalid
imageRepo: PLACEHOLDER-imagerepo
lakefs:
  endpoint: http://lakefs.internal.invalid
  repository: PLACEHOLDER-repo
  externalUrl: https://lakefs.internal.invalid
  adminSecret: PLACEHOLDER-lakefs-admin
  adminSecretKeys:
    accessKey: accessKeyId
    secretKey: secretAccessKey
mlflow:
  trackingUri: http://mlflow.internal.invalid
  externalUrl: https://mlflow.internal.invalid
  svcSecret: PLACEHOLDER-mlflow-svc
  oidcDomain: oidc.internal.invalid
  oidcProjectId: PLACEHOLDER-oidc-project-id
computeClasses:
  cpu:
    name: cpu-standard
    tier: cpu
    machineType: n2-standard-8
    tolerationKey: platform.kubecore.io/ml-workload
    tolerationValue: cpu
    maxNodeCount: 4
    diskSizeGb: 50
    description: "n2-standard-8 (8 vCPU, 32 GiB) \u2014 CPU pipeline steps (headroom\
      \ for heavier CPU steps; scale-from-0 so cost only during a step)"
    allocatable:
      cpu: 7
      memoryGiB: 27
  gpu:
    name: gpu-t4
    tier: gpu
    machineType: n1-standard-8
    tolerationKey: platform.kubecore.io/ml-workload
    tolerationValue: gpu
    maxNodeCount: 1
    diskSizeGb: 100
    description: "n1-standard-8 + 1x T4 \u2014 GPU training steps (scale-from-0)"
    guestAccelerator:
      type: nvidia-tesla-t4
      count: 1
    allocatable:
      cpu: 7
      memoryGiB: 25
  all:
  - name: cpu-standard
    tier: cpu
    machineType: n2-standard-8
    description: "n2-standard-8 (8 vCPU, 32 GiB) \u2014 CPU pipeline steps (headroom\
      \ for heavier CPU steps; scale-from-0 so cost only during a step)"
    allocatable:
      cpu: 7
      memoryGiB: 27
  - name: kubecorecpu
    tier: cpu
    machineType: e2-standard-8
    description: "e2-standard-8 + 200GiB \u2014 CI builds (kaniko), sized for build-push\
      \ req 4cpu/12Gi"
    allocatable:
      cpu: 7
      memoryGiB: 27
  - name: gpu-t4
    tier: gpu
    machineType: n1-standard-8
    description: "n1-standard-8 + 1x T4 \u2014 GPU training steps (scale-from-0)"
    guestAccelerator:
      type: nvidia-tesla-t4
      count: 1
    allocatable:
      cpu: 7
      memoryGiB: 25
hpc:
  enabled: true
  provider: meluxina
  account: PLACEHOLDER-account
  user: PLACEHOLDER-user
  scratch: /project/scratch/PLACEHOLDER-account
  home: /home/users/PLACEHOLDER-user
  classes:
  - name: meluxina-gpu
    tier: gpu
    partition: gpu
    qos: default
    gpus: 4
    cpus: 128
    memoryGiB: 512
    description: 4x A100-40GB, 2x EPYC 7452, 512 GB
  - name: meluxina-cpu
    tier: cpu
    partition: cpu
    qos: default
    gpus: 0
    cpus: 128
    memoryGiB: 512
    description: 2x EPYC 7452, 128 cores, 512 GB
  - name: meluxina-largemem
    tier: cpu
    partition: largemem
    qos: default
    gpus: 0
    cpus: 128
    memoryGiB: 4096
    description: 4 TB
checkpoints:
  bucket: PLACEHOLDER-bucket
  prefix: main/checkpoints
serviceAccountName: argo-workflow
mlEnvironment:
  name: runtime
  namespace: PLACEHOLDER-data-room-runtime
  nodeSelector: {}
  tolerations: []
