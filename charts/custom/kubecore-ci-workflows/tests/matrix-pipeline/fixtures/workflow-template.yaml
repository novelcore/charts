apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: demo-pipeline
  namespace: PLACEHOLDER-data-room-runtime
  labels:
    platform.kubecore.io/project: data-room
    platform.kubecore.io/app: demo
    platform.kubecore.io/managed-by: kubecore-ci
  annotations:
    platform.kubecore.io/generated-by: ml-ci-build/hera-render
    platform.kubecore.io/cost-tracking: enabled
spec:
  entrypoint: main
  templates:
  - name: compose-and-validate
    container:
      image: '{{inputs.parameters.image}}'
      args:
      - experiment.name={{workflow.parameters.experiment-name}}
      - experiment.description={{workflow.parameters.experiment-description}}
      - dataset={{workflow.parameters.dataset}}
      - --render-defaults
      - '{"experiment.name":"my-experiment-v1","experiment.description":"","dataset":"dataset-default@latest"}'
      - --advanced
      - '{{workflow.parameters.config}}'
      - --run
      - '{{workflow.name}}'
      - --steps
      - '[{"name":"prep","kind":"transform","reads":[],"inputs":[],"needs":[],"produces":[{"name":"cleaned","type":"dataset"}]},{"name":"train","kind":"train","reads":[],"inputs":[],"needs":["prep"],"produces":[{"name":"champion","type":"model"}],"matrix":{"seed":[1,2,3]},"allow_failed":true},{"name":"report","kind":"transform","reads":[],"inputs":[],"needs":["prep","train"],"produces":[{"name":"summary","type":"artifact"}]}]'
      - --context-dir
      - /work/context
      - --ledger-output
      - /work/kaos-ledger.json
      - --images-output
      - /work/kaos-images.json
      - --app
      - demo
      - --project
      - data-room
      - --walltime
      - prep={{workflow.parameters.prep-walltime}}
      - --walltime
      - train={{workflow.parameters.train-walltime}}
      - --walltime
      - report={{workflow.parameters.report-walltime}}
      - --class
      - prep={{workflow.parameters.prep-class}}
      - --class
      - train={{workflow.parameters.train-class}}
      - --class
      - report={{workflow.parameters.report-class}}
      - --class-offers
      - '{"prep":{"offered":["cpu-standard","kubecorecpu"],"refused":{"gpu-t4":["it
        is a GPU machine and the step does not declare gpu=True","Add gpu=True to
        the step in pipeline.py to run it on a GPU machine."],"meluxina-gpu":["a step
        that produces a dataset runs on the cluster for now","Choose one of: cpu-standard,
        kubecorecpu."],"meluxina-cpu":["a step that produces a dataset runs on the
        cluster for now","Choose one of: cpu-standard, kubecorecpu."],"meluxina-largemem":["a
        step that produces a dataset runs on the cluster for now","Choose one of:
        cpu-standard, kubecorecpu."]}},"train":{"offered":["cpu-standard","kubecorecpu","meluxina-cpu","meluxina-largemem"],"refused":{"gpu-t4":["it
        is a GPU machine and the step does not declare gpu=True","Add gpu=True to
        the step in pipeline.py to run it on a GPU machine."],"meluxina-gpu":["it
        is a GPU machine and the step does not declare gpu=True","Add gpu=True to
        the step in pipeline.py to run it on a GPU machine."]}},"report":{"offered":["cpu-standard","kubecorecpu","meluxina-cpu","meluxina-largemem"],"refused":{"gpu-t4":["it
        is a GPU machine and the step does not declare gpu=True","Add gpu=True to
        the step in pipeline.py to run it on a GPU machine."],"meluxina-gpu":["it
        is a GPU machine and the step does not declare gpu=True","Add gpu=True to
        the step in pipeline.py to run it on a GPU machine."]}}}'
      - --promote
      - cleaned={{workflow.parameters.promote-cleaned}}
      - --matrix
      - train={{workflow.parameters.train-matrix}}
      - --parallel
      - train={{workflow.parameters.train-parallel}}
      - --settings-output
      - /work/kaos-run-settings.json
      command:
      - python
      - -I
      - -m
      - kaos_engine.compose
      env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: KAOS_CHECKPOINT_DIR
        value: /kaos/checkpoint
      - name: KAOS_STEP_IMAGES
        value: '{"prep":"{{inputs.parameters.image-prep}}","report":"{{inputs.parameters.image-report}}","train":"{{inputs.parameters.image-train}}"}'
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
      - name: kaos-checkpoint
        mountPath: /kaos/checkpoint
    metadata:
      labels:
        platform.kubecore.io/step: compose-and-validate
        platform.kubecore.io/step-kind: control
    outputs:
      parameters:
      - name: kaos-ledger
        valueFrom:
          path: /work/kaos-ledger.json
      - name: kaos-context-prep
        valueFrom:
          path: /work/context/prep.json
      - name: kaos-context-train
        valueFrom:
          path: /work/context/train.json
      - name: kaos-context-report
        valueFrom:
          path: /work/context/report.json
      - name: kaos-images
        valueFrom:
          path: /work/kaos-images.json
      - name: kaos-run-settings
        valueFrom:
          path: /work/kaos-run-settings.json
    inputs:
      parameters:
      - name: cpu
        default: '7'
      - name: mem
        default: 27Gi
      - name: disk
        default: 10Gi
      - name: image
        valueFrom:
          configMapKeyRef:
            name: demo-pipeline-images
            key: compose-and-validate
      - name: image-prep
        valueFrom:
          configMapKeyRef:
            name: demo-pipeline-images
            key: prep
      - name: image-report
        valueFrom:
          configMapKeyRef:
            name: demo-pipeline-images
            key: report
      - name: image-train
        valueFrom:
          configMapKeyRef:
            name: demo-pipeline-images
            key: train
    podSpecPatch: "containers:\n- name: main\n  resources:\n    limits:\n      cpu:\
      \ '{{inputs.parameters.cpu}}'\n      memory: '{{inputs.parameters.mem}}'\n \
      \   requests:\n      cpu: '{{inputs.parameters.cpu}}'\n      ephemeral-storage:\
      \ '{{inputs.parameters.disk}}'\n      memory: '{{inputs.parameters.mem}}'\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: cpu-standard
      platform.kubecore.io/environment: runtime
      platform.kubecore.io/project: data-room
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: platform.kubecore.io/kubenv
      operator: Equal
      value: runtime
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-checkpoint
      emptyDir: {}
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: ((lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message contains 'kaos-result.json')) and not (lastRetry.message
        startsWith 'KaosIdle')
      backoff:
        duration: 30s
        factor: '2'
        maxDuration: 10m
  - name: kaos-promote
    container:
      image: '{{inputs.parameters.image}}'
      args: []
      command:
      - python
      - -I
      - -m
      - kaos_engine.promote
      env:
      - name: MLFLOW_TRACKING_URI
