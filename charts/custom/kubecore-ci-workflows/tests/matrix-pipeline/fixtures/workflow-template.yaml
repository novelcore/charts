      - name: kaos-checkpoint
        mountPath: /kaos/checkpoint
    inputs:
      parameters:
      - name: kaos-context
      - name: kaos-item
      - name: cpu
        default: '7'
      - name: mem
        default: 27Gi
      - name: disk
        default: 10Gi
      - name: deadline
        default: '7200'
      - name: image
    metadata:
      annotations:
        platform.kubecore.io/hpc: 2h
        platform.kubecore.io/hpc-resumable: 'off'
      labels:
        platform.kubecore.io/step: train
        platform.kubecore.io/step-kind: train
    outputs:
      parameters:
      - name: kaos-result
        valueFrom:
          default: '{"version":1,"status":"absent"}'
          path: /work/output/kaos-result.json
      - name: kaos-item
        value: '{{inputs.parameters.kaos-item}}'
    podSpecPatch: "containers:\n- name: main\n  resources:\n    limits:\n      cpu:\
      \ '{{inputs.parameters.cpu}}'\n      memory: '{{inputs.parameters.mem}}'\n \
      \   requests:\n      cpu: '{{inputs.parameters.cpu}}'\n      ephemeral-storage:\
      \ '{{inputs.parameters.disk}}'\n      memory: '{{inputs.parameters.mem}}'\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.train-class}}'
      platform.kubecore.io/environment: runtime
      platform.kubecore.io/project: data-room
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: platform.kubecore.io/kubenv
      operator: Equal
      value: runtime
      effect: NoSchedule
    activeDeadlineSeconds: '{{inputs.parameters.deadline}}'
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-checkpoint
      emptyDir: {}
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: ((lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message contains 'kaos-result.json')) and not (lastRetry.message
        startsWith 'KaosIdle')
      backoff:
        duration: 30s
        factor: '2'
        maxDuration: 10m
  - name: report
    container:
      image: '{{inputs.parameters.image}}'
      command:
      - python
      - -m
      - app.entry
      env:
      - name: KAOS_STEP_CONTEXT
        value: '{{inputs.parameters.kaos-context}}'
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: KAOS_CHECKPOINT_DIR
        value: /kaos/checkpoint
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
      - name: kaos-checkpoint
        mountPath: /kaos/checkpoint
    inputs:
      parameters:
      - name: kaos-context
      - name: cpu
        default: '7'
      - name: mem
        default: 27Gi
      - name: disk
        default: 10Gi
      - name: deadline
        default: '14400'
      - name: image
    metadata:
      labels:
        platform.kubecore.io/step: report
        platform.kubecore.io/step-kind: transform
    outputs:
      parameters:
      - name: kaos-result
        valueFrom:
          path: /work/output/kaos-result.json
    podSpecPatch: "containers:\n- name: main\n  resources:\n    limits:\n      cpu:\
      \ '{{inputs.parameters.cpu}}'\n      memory: '{{inputs.parameters.mem}}'\n \
      \   requests:\n      cpu: '{{inputs.parameters.cpu}}'\n      ephemeral-storage:\
      \ '{{inputs.parameters.disk}}'\n      memory: '{{inputs.parameters.mem}}'\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.report-class}}'
      platform.kubecore.io/environment: runtime
      platform.kubecore.io/project: data-room
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: platform.kubecore.io/kubenv
      operator: Equal
      value: runtime
      effect: NoSchedule
    activeDeadlineSeconds: '{{inputs.parameters.deadline}}'
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-checkpoint
      emptyDir: {}
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: ((lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message contains 'kaos-result.json')) and not (lastRetry.message
        startsWith 'KaosIdle')
      backoff:
        duration: 30s
        factor: '2'
        maxDuration: 10m
  - name: main
    dag:
      tasks:
      - name: compose-and-validate
        template: compose-and-validate
        arguments:
          parameters:
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[''cpu-standard''])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[''cpu-standard'']) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[''cpu-standard'']) ?? "10Gi"}}'
      - name: prep
        depends: compose-and-validate
        template: prep
        arguments:
          parameters:
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-prep"])
              + ",\"upstream\":{" + "}" + "}"}}'
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[workflow.parameters[''prep-class'']])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[workflow.parameters[''prep-class'']]) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[workflow.parameters[''prep-class'']]) ?? "10Gi"}}'
          - name: deadline
            value: '{{=int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["prep"]["walltime"])
              * 60}}'
          - name: image
            value: '{{=fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-images"])["prep"]}}'
      - name: train
        depends: compose-and-validate && prep
        template: kaos-matrix-train
        arguments:
          parameters:
          - name: items
            value: '{{=toJSON(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["train"]["matrix"])}}'
          - name: par
            value: '{{=int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["train"]["parallel"])}}'
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-train"])
              + ",\"upstream\":{\"prep\":" + sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["prep"].outputs.parameters["kaos-result"]) + "}"}}'
          - name: kaos-run-settings
            value: '{{=tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"]}}'
          - name: kaos-images
            value: '{{=tasks["compose-and-validate"].outputs.parameters["kaos-images"]}}'
      - name: report
        depends: compose-and-validate && prep && kaos-gather-train
        template: report
        when: '{{=((fromJSON(sprig.default("{\"version\":1,\"status\":\"absent\"}",
          tasks["prep"].outputs.parameters["kaos-result"]))?.status in ["absent",
          "skipped"] ? false : (fromJSON(sprig.default("{\"version\":1,\"status\":\"absent\"}",
          tasks["prep"].outputs.parameters["kaos-result"]))?.status == "ok" ? (type((fromJSON(sprig.default("{\"version\":1,\"status\":\"absent\"}",
          tasks["prep"].outputs.parameters["kaos-result"]))?.values?.["ok"] ?? int("step
          ''prep'' ran but gave no value ''ok'' (a typo in the name, or the value
          was never set with step.result(ok=...)): a when= on a step''s value needs
          the value"))) == "string" ? (fromJSON(sprig.default("{\"version\":1,\"status\":\"absent\"}",
          tasks["prep"].outputs.parameters["kaos-result"]))?.values?.["ok"] ?? int("step
          ''prep'' ran but gave no value ''ok'' (a typo in the name, or the value
          was never set with step.result(ok=...)): a when= on a step''s value needs
          the value")) == ''true'' : toJSON((fromJSON(sprig.default("{\"version\":1,\"status\":\"absent\"}",
          tasks["prep"].outputs.parameters["kaos-result"]))?.values?.["ok"] ?? int("step
          ''prep'' ran but gave no value ''ok'' (a typo in the name, or the value
          was never set with step.result(ok=...)): a when= on a step''s value needs
          the value"))) == ''true'') : int("step ''prep'' left a result that is not
          a result (its status is not ok, skipped or absent): a when= on a step''s
          value needs a result")))) && !hasPrefix(workflow.parameters[''report-class''],
          ''meluxina-'')}}'
        arguments:
          parameters:
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-report"])
              + ",\"upstream\":{\"prep\":" + sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["prep"].outputs.parameters["kaos-result"]) + ",\"train\":" + sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["kaos-gather-train"].outputs.parameters["kaos-result"]) + "}"
              + "}"}}'
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[workflow.parameters[''report-class'']])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[workflow.parameters[''report-class'']]) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[workflow.parameters[''report-class'']]) ?? "10Gi"}}'
          - name: deadline
            value: '{{=int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["report"]["walltime"])
              * 60}}'
          - name: image
            value: '{{=fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-images"])["report"]}}'
      - name: report-hpc
        template: hpc-follower
        when: '{{=((fromJSON(sprig.default("{\"version\":1,\"status\":\"absent\"}",
          tasks["prep"].outputs.parameters["kaos-result"]))?.status in ["absent",
          "skipped"] ? false : (fromJSON(sprig.default("{\"version\":1,\"status\":\"absent\"}",
          tasks["prep"].outputs.parameters["kaos-result"]))?.status == "ok" ? (type((fromJSON(sprig.default("{\"version\":1,\"status\":\"absent\"}",
          tasks["prep"].outputs.parameters["kaos-result"]))?.values?.["ok"] ?? int("step
          ''prep'' ran but gave no value ''ok'' (a typo in the name, or the value
          was never set with step.result(ok=...)): a when= on a step''s value needs
          the value"))) == "string" ? (fromJSON(sprig.default("{\"version\":1,\"status\":\"absent\"}",
          tasks["prep"].outputs.parameters["kaos-result"]))?.values?.["ok"] ?? int("step
          ''prep'' ran but gave no value ''ok'' (a typo in the name, or the value
          was never set with step.result(ok=...)): a when= on a step''s value needs
          the value")) == ''true'' : toJSON((fromJSON(sprig.default("{\"version\":1,\"status\":\"absent\"}",
          tasks["prep"].outputs.parameters["kaos-result"]))?.values?.["ok"] ?? int("step
          ''prep'' ran but gave no value ''ok'' (a typo in the name, or the value
          was never set with step.result(ok=...)): a when= on a step''s value needs
          the value"))) == ''true'') : int("step ''prep'' left a result that is not
          a result (its status is not ok, skipped or absent): a when= on a step''s
          value needs a result")))) && hasPrefix(workflow.parameters[''report-class''],
          ''meluxina-'')}}'
        arguments:
          parameters:
          - name: step-name
            value: report
          - name: image
            value: '{{=fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-images"])["report"]}}'
          - name: step-command
            value: '["python","-m","app.entry"]'
          - name: step-kind
            value: transform
          - name: time-limit
            value: '{{=int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["report"]["walltime"])}}'
          - name: deadline-seconds
            value: '{{=6 * (int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["report"]["walltime"])
              + 480) * 60}}'
          - name: resumable-lead
            value: '0'
          - name: resumable
            value: auto
          - name: idle-timeout
            value: ''
          - name: hpc-class
            value: '{{workflow.parameters.report-class}}'
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-report"])
              + ",\"upstream\":{\"prep\":" + sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["prep"].outputs.parameters["kaos-result"]) + ",\"train\":" + sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["kaos-gather-train"].outputs.parameters["kaos-result"]) + "}"
              + "}"}}'
        depends: compose-and-validate && prep && kaos-gather-train
      - name: kaos-gather-train
        template: kaos-gather-train
        depends: compose-and-validate && (train.Succeeded || train.Skipped || train.Omitted)
        arguments:
          parameters:
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[''cpu-standard''])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[''cpu-standard'']) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[''cpu-standard'']) ?? "10Gi"}}'
          - name: results
            value: '{{=sprig.default("[]", tasks["train"].outputs.parameters["kaos-result"])}}'
          - name: items
            value: '{{=sprig.default("[]", tasks["train"].outputs.parameters["kaos-item"])}}'
          - name: plan
            value: '{{=toJSON(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["train"]["matrix"])}}'
          - name: status
            value: '{{tasks.train.status}}'
      - name: kaos-promote
        template: kaos-promote
        depends: compose-and-validate && (prep.Succeeded || prep.Skipped) && (train.Succeeded
          || train.Skipped) && ((report.Succeeded || report-hpc.Succeeded) || (report.Skipped
          && report-hpc.Skipped)) && kaos-gather-train.Succeeded
        when: '{{=workflow.parameters["promote-cleaned"] == ''true''}}'
        arguments:
          parameters:
          - name: cpu
            value: 100m
          - name: mem
            value: 256Mi
          - name: disk
            value: 1Gi
          - name: kaos-promote-plan
            value: '{{=toJSON([{"step":"prep","name":"cleaned","promote":workflow.parameters["promote-cleaned"],"writes":fromJSON(sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["prep"].outputs.parameters["kaos-result"]))?.writes ?? []}])}}'
  - name: kaos-matrix-train
    steps:
    - - name: run
        template: train
        withParam: '{{=toJSON(fromJSON(inputs.parameters["items"])[:int(inputs.parameters["par"])])}}'
        arguments:
          parameters:
          - name: kaos-context
            value: '{{=inputs.parameters["kaos-context"] + ",\"matrix\":" + fromJSON(inputs.parameters["kaos-run-settings"])["train"]["matrix"][int(item.index)].text
              + "}"}}'
          - name: kaos-item
            value: '{{item.index}}'
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[workflow.parameters[''train-class'']])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[workflow.parameters[''train-class'']]) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[workflow.parameters[''train-class'']]) ?? "10Gi"}}'
          - name: deadline
            value: '{{=int(fromJSON(inputs.parameters["kaos-run-settings"])["train"]["walltime"])
              * 60}}'
          - name: image
            value: '{{=fromJSON(inputs.parameters["kaos-images"])["train"]}}'
        continueOn:
          failed: true
        when: '{{=!hasPrefix(workflow.parameters[''train-class''], ''meluxina-'')}}'
      - name: run-hpc
        template: hpc-follower
        withParam: '{{=toJSON(fromJSON(inputs.parameters["items"])[:int(inputs.parameters["par"])])}}'
        when: '{{=hasPrefix(workflow.parameters[''train-class''], ''meluxina-'')}}'
        arguments:
          parameters:
          - name: step-name
            value: train
          - name: image
            value: '{{=fromJSON(inputs.parameters["kaos-images"])["train"]}}'
          - name: step-command
            value: '["python","-m","app.entry"]'
          - name: step-kind
            value: train
          - name: time-limit
            value: '{{=int(fromJSON(inputs.parameters["kaos-run-settings"])["train"]["walltime"])}}'
          - name: deadline-seconds
            value: '{{=1 * (int(fromJSON(inputs.parameters["kaos-run-settings"])["train"]["walltime"])
              + 480) * 60}}'
          - name: resumable-lead
            value: '0'
          - name: resumable
            value: '0'
          - name: idle-timeout
            value: ''
          - name: hpc-class
            value: '{{workflow.parameters.train-class}}'
          - name: node-suffix
            value: -{{=item.index}}
          - name: kaos-item
            value: '{{item.index}}'
          - name: kaos-context
            value: '{{=inputs.parameters["kaos-context"] + ",\"matrix\":" + fromJSON(inputs.parameters["kaos-run-settings"])["train"]["matrix"][int(item.index)].text
              + "}"}}'
    - - name: rest
        template: kaos-matrix-train
        when: '{{=len(fromJSON(inputs.parameters["items"])) > int(inputs.parameters["par"])}}'
        arguments:
          parameters:
          - name: items
            value: '{{=toJSON(fromJSON(inputs.parameters["items"])[int(inputs.parameters["par"]):])}}'
          - name: par
            value: '{{inputs.parameters.par}}'
          - name: kaos-context
            value: '{{inputs.parameters.kaos-context}}'
          - name: kaos-run-settings
            value: '{{inputs.parameters.kaos-run-settings}}'
          - name: kaos-images
            value: '{{inputs.parameters.kaos-images}}'
    inputs:
      parameters:
      - name: items
      - name: par
      - name: kaos-context
      - name: kaos-run-settings
      - name: kaos-images
    outputs:
      parameters:
      - name: kaos-result
        valueFrom:
          default: '[]'
          expression: 'toJSON(concat((steps["run"].outputs?.parameters?.["kaos-result"]
            == nil ? [] : fromJSON(steps["run"].outputs.parameters["kaos-result"])),
            (steps["run-hpc"].outputs?.parameters?.["kaos-result"] == nil ? [] : fromJSON(steps["run-hpc"].outputs.parameters["kaos-result"])),
            (steps["rest"].outputs?.parameters?.["kaos-result"] == nil ? [] : fromJSON(steps["rest"].outputs.parameters["kaos-result"]))))'
      - name: kaos-item
        valueFrom:
          default: '[]'
          expression: 'toJSON(concat((steps["run"].outputs?.parameters?.["kaos-item"]
            == nil ? [] : fromJSON(steps["run"].outputs.parameters["kaos-item"])),
            (steps["run-hpc"].outputs?.parameters?.["kaos-item"] == nil ? [] : fromJSON(steps["run-hpc"].outputs.parameters["kaos-item"])),
            (steps["rest"].outputs?.parameters?.["kaos-item"] == nil ? [] : fromJSON(steps["rest"].outputs.parameters["kaos-item"]))))'
  - name: hpc-follower
    inputs:
      parameters:
      - name: step-name
      - name: image
      - name: step-command
      - name: step-kind
      - name: time-limit
      - name: deadline-seconds
      - name: hpc-class
      - name: resumable-lead
        value: '0'
      - name: resumable
        value: auto
      - name: idle-timeout
        value: ''
      - name: node-suffix
        value: ''
      - name: kaos-item
        value: ''
      - name: kaos-context
    metadata:
      labels:
        platform.kubecore.io/compute-type: hpc
        platform.kubecore.io/hpc-class: '{{inputs.parameters.hpc-class}}'
        platform.kubecore.io/step-kind: '{{inputs.parameters.step-kind}}'
    outputs:
      parameters:
      - name: slurm-job-id
        valueFrom:
          path: /tmp/slurm-job-id
      - name: kaos-result
        valueFrom:
          path: /tmp/outputs/kaos-result.json
      - name: kaos-item
        value: '{{inputs.parameters.kaos-item}}'
    container:
      image: python:3.12-alpine
      command:
      - sh
      - -c
      args:
      - echo "$HPC_NOT_SERVED" >&2; exit 1
      env:
      - name: HPC_NOT_SERVED
        value: 'MeluXina steps run through the pool''s HPC controller, which does
          not serve this project: enable operators.hpc on the pool (KubePool spec.operators.hpc)
          and wait until the project''s MeluXina budget is known, or pick an in-cluster
          class. Nothing was submitted.'
  arguments:
    parameters:
    - name: pipeline-info
      value: "The defaults run as they are: press Submit.\nEach step has a class (the\
        \ machine it runs on) and a time limit (the longest it may run, as minutes\
        \ or hours). Only a step that declares gpu=True is offered the GPU classes.\n\
        Machine classes:\n  - cpu-standard (cpu) \u2014 n2-standard-8\n  - kubecorecpu\
        \ (cpu) \u2014 e2-standard-8\n  - gpu-t4 (gpu) \u2014 n1-standard-8 + 1x nvidia-tesla-t4\n\
        HPC (Slurm) classes: pick one in a step's class field and the step runs there\
        \ as a job. Queue time applies; the step's time limit is the job's limit.\
        \ Classes:\n  - meluxina-gpu (gpu) \u2014 partition gpu, 4 GPUs, 128 cores,\
        \ 512 GiB \u2014 4x A100-40GB, 2x EPYC 7452, 512 GB\n  - meluxina-cpu (cpu)\
        \ \u2014 partition cpu, 128 cores, 512 GiB \u2014 2x EPYC 7452, 128 cores,\
        \ 512 GB\n  - meluxina-largemem (cpu) \u2014 partition largemem, 128 cores,\
        \ 4096 GiB \u2014 4 TB\nSteps: prep -> train -> report"
      description: How to fill this form.
    - name: experiment-name
      description: experiment name (used for tracking + artifact path prefixes)
      value: my-experiment-v1
    - name: experiment-description
      description: optional free text stored with the run
      value: ''
    - name: dataset
      description: 'The dataset this run uses: <dataset-repo>@<version> (the version
        is a name or `latest`).'
      value: dataset-default@latest
    - name: prep-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      description: 'The machine class the ''prep'' step runs on. Default: cpu-standard.'
    - name: prep-walltime
      value: 1h
      description: 'The longest the step may run, as minutes or hours: 90m, 12h. Default
        from pipeline.py.'
    - name: train-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      - meluxina-cpu
      - meluxina-largemem
      description: 'The machine class the ''train'' step runs on. Default: cpu-standard.
        Classes that start with ''meluxina-'' run the step as a job on HPC (Slurm):
        queue time applies.'
    - name: train-walltime
      value: 2h
      description: 'The longest the step may run, as minutes or hours: 90m, 12h. Default
        from pipeline.py.'
    - name: train-matrix
      value: '[{"seed":1},{"seed":2},{"seed":3}]'
      description: 'The combinations the ''train'' step runs, one run each, as a JSON
        list of objects with the names seed. Default: every combination of the values
        in pipeline.py (3). At most 32; a value is a number, true or false, or a short
        text.'
    - name: train-parallel
      value: '4'
      description: 'How many of the ''train'' step''s runs go at the same time: a
        whole number from 1 to 32, or all. Default 4: the GPU steps one machine holds,
        so that on an HPC (Slurm) class the runs share one machine. A larger number
        asks for more machines.'
    - name: report-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      - meluxina-cpu
      - meluxina-largemem
      description: 'The machine class the ''report'' step runs on. Default: cpu-standard.
        Classes that start with ''meluxina-'' run the step as a job on HPC (Slurm):
        queue time applies.'
    - name: report-walltime
      value: 4h
      description: 'The longest the step may run, as minutes or hours: 90m, 12h. Default
        from pipeline.py.'
    - name: promote-cleaned
      value: 'false'
      enum:
      - 'false'
      - 'true'
      description: Make this run's version of cleaned the one other pipelines read
        as latest.
    - name: config
      description: Extra settings for this run, as YAML. They replace the values above.
      value: ''
  serviceAccountName: argo-workflow
  ttlStrategy:
    secondsAfterSuccess: 3024000
    secondsAfterFailure: 3024000
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 168h
