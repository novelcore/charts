  - name: main
    dag:
      tasks:
      - name: compose-and-validate
        template: compose-and-validate
        arguments:
          parameters:
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[''cpu-standard''])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[''cpu-standard'']) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[''cpu-standard'']) ?? "10Gi"}}'
      - name: dataset-loading
        depends: compose-and-validate
        template: dataset-loading
        when: '{{=workflow.parameters[''start-from-step''] in ['''', ''dataset-loading'']}}'
        arguments:
          parameters:
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-dataset-loading"])
              + ",\"upstream\":{" + "}" + "}"}}'
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[workflow.parameters[''dataset-loading-class'']])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[workflow.parameters[''dataset-loading-class'']]) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[workflow.parameters[''dataset-loading-class'']]) ?? "10Gi"}}'
          - name: deadline
            value: '{{=int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["dataset-loading"]["walltime"])
              * 60}}'
          - name: image
            value: '{{=fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-images"])["dataset-loading"]}}'
      - name: hello-world
        depends: compose-and-validate && dataset-loading
        template: hello-world
        when: '{{=workflow.parameters[''start-from-step''] in ['''', ''hello-world'',
          ''dataset-loading'']}}'
        arguments:
          parameters:
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-hello-world"])
              + ",\"upstream\":{\"dataset-loading\":" + sprig.default(sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["compose-and-validate"].outputs.parameters["kaos-reused-dataset-loading"]),
              tasks["dataset-loading"].outputs.parameters["kaos-result"]) + "}" +
              "}"}}'
          - name: deadline
            value: '{{=int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["hello-world"]["walltime"])
              * 60}}'
          - name: image
            value: '{{=fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-images"])["hello-world"]}}'
      - name: train
        depends: compose-and-validate && dataset-loading
        template: train
        when: '{{=(workflow.parameters[''start-from-step''] in ['''', ''train'', ''dataset-loading'']
          && (workflow.parameters[''optim''] == ''sgd'' && workflow.parameters[''model'']
          != ''large'')) && !hasPrefix(workflow.parameters[''train-class''], ''meluxina-'')}}'
        arguments:
          parameters:
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-train"])
              + ",\"upstream\":{\"dataset-loading\":" + sprig.default(sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["compose-and-validate"].outputs.parameters["kaos-reused-dataset-loading"]),
              tasks["dataset-loading"].outputs.parameters["kaos-result"]) + "}" +
              "}"}}'
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[workflow.parameters[''train-class'']])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[workflow.parameters[''train-class'']]) ?? "25Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[workflow.parameters[''train-class'']]) ?? "10Gi"}}'
          - name: deadline
            value: '{{=int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["train"]["walltime"])
              * 60}}'
          - name: gpus
            value: '{{=workflow.parameters[''train-class''] in [''gpu-t4''] ? ''1''
              : ''0''}}'
          - name: checkpoint-every
            value: '{{=int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["train"]["checkpoint-every"])}}'
          - name: image
            value: '{{=fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-images"])["train"]}}'
      - name: train-hpc
        template: hpc-follower
        when: '{{=(workflow.parameters[''start-from-step''] in ['''', ''train'', ''dataset-loading'']
          && (workflow.parameters[''optim''] == ''sgd'' && workflow.parameters[''model'']
          != ''large'')) && hasPrefix(workflow.parameters[''train-class''], ''meluxina-'')}}'
        arguments:
          parameters:
          - name: step-name
            value: train
          - name: image
            value: '{{=fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-images"])["train"]}}'
          - name: step-command
            value: '["python","-m","app.entry"]'
          - name: step-kind
            value: train
          - name: time-limit
            value: '{{=int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["train"]["walltime"])}}'
          - name: deadline-seconds
            value: '{{=6 * (int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["train"]["walltime"])
              + 480) * 60}}'
          - name: resumable-lead
            value: '0'
          - name: resumable
            value: auto
          - name: idle-timeout
            value: ''
          - name: hpc-class
            value: '{{workflow.parameters.train-class}}'
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-train"])
              + ",\"upstream\":{\"dataset-loading\":" + sprig.default(sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["compose-and-validate"].outputs.parameters["kaos-reused-dataset-loading"]),
              tasks["dataset-loading"].outputs.parameters["kaos-result"]) + "}" +
              "}"}}'
        depends: compose-and-validate && dataset-loading
      - name: evaluate
        depends: compose-and-validate && ((train.Succeeded || train-hpc.Succeeded)
          || (train.Skipped && train-hpc.Skipped))
        template: kaos-matrix-evaluate
        when: '{{=workflow.parameters[''start-from-step''] in ['''', ''evaluate'',
          ''train'', ''dataset-loading'']}}'
        arguments:
          parameters:
          - name: items
            value: '{{=toJSON(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["evaluate"]["matrix"])}}'
          - name: par
            value: '{{=int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["evaluate"]["parallel"])}}'
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-evaluate"])
              + ",\"upstream\":{\"train\":" + sprig.default(sprig.default(sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["compose-and-validate"].outputs.parameters["kaos-reused-train"]),
              tasks["train-hpc"].outputs.parameters["kaos-result"]), tasks["train"].outputs.parameters["kaos-result"])
              + "}"}}'
          - name: kaos-run-settings
            value: '{{=tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"]}}'
          - name: kaos-images
            value: '{{=tasks["compose-and-validate"].outputs.parameters["kaos-images"]}}'
      - name: kaos-gather-evaluate
        template: kaos-gather-evaluate
        depends: compose-and-validate && (evaluate.Succeeded || evaluate.Skipped)
        arguments:
          parameters:
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[''cpu-standard''])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[''cpu-standard'']) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[''cpu-standard'']) ?? "10Gi"}}'
          - name: results
            value: '{{=sprig.default("[]", tasks["evaluate"].outputs.parameters["kaos-result"])}}'
          - name: items
            value: '{{=sprig.default("[]", tasks["evaluate"].outputs.parameters["kaos-item"])}}'
          - name: plan
            value: '{{=toJSON(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["evaluate"]["matrix"])}}'
          - name: status
            value: '{{tasks.evaluate.status}}'
      - name: kaos-promote
        template: kaos-promote
        depends: compose-and-validate && (dataset-loading.Succeeded || dataset-loading.Skipped)
          && (hello-world.Succeeded || hello-world.Skipped) && ((train.Succeeded ||
          train-hpc.Succeeded) || (train.Skipped && train-hpc.Skipped)) && (evaluate.Succeeded
          || evaluate.Skipped) && kaos-gather-evaluate.Succeeded
        when: '{{=workflow.parameters["promote-loaded"] == ''true''}}'
        arguments:
          parameters:
          - name: cpu
            value: 100m
          - name: mem
            value: 256Mi
          - name: disk
            value: 1Gi
          - name: kaos-promote-plan
            value: '{{=toJSON([{"step":"dataset-loading","name":"loaded","promote":workflow.parameters["promote-loaded"],"writes":fromJSON(sprig.default(sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["compose-and-validate"].outputs.parameters["kaos-reused-dataset-loading"]),
              tasks["dataset-loading"].outputs.parameters["kaos-result"]))?.writes
              ?? []}])}}'
  - name: kaos-matrix-evaluate
    steps:
    - - name: run
        template: evaluate
        withParam: '{{=toJSON(fromJSON(inputs.parameters["items"])[:int(inputs.parameters["par"])])}}'
        arguments:
          parameters:
          - name: kaos-context
            value: '{{=inputs.parameters["kaos-context"] + ",\"matrix\":" + fromJSON(inputs.parameters["kaos-run-settings"])["evaluate"]["matrix"][int(item.index)].text
              + "}"}}'
          - name: kaos-item
            value: '{{item.index}}'
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[workflow.parameters[''evaluate-class'']])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[workflow.parameters[''evaluate-class'']]) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[workflow.parameters[''evaluate-class'']]) ?? "10Gi"}}'
          - name: deadline
            value: '{{=int(fromJSON(inputs.parameters["kaos-run-settings"])["evaluate"]["walltime"])
              * 60}}'
          - name: image
            value: '{{=fromJSON(inputs.parameters["kaos-images"])["evaluate"]}}'
        continueOn:
          failed: true
        when: '{{=!hasPrefix(workflow.parameters[''evaluate-class''], ''meluxina-'')}}'
      - name: run-hpc
        template: hpc-follower
        withParam: '{{=toJSON(fromJSON(inputs.parameters["items"])[:int(inputs.parameters["par"])])}}'
        when: '{{=hasPrefix(workflow.parameters[''evaluate-class''], ''meluxina-'')}}'
        arguments:
          parameters:
          - name: step-name
            value: evaluate
          - name: image
            value: '{{=fromJSON(inputs.parameters["kaos-images"])["evaluate"]}}'
          - name: step-command
            value: '["python","-m","app.entry"]'
          - name: step-kind
            value: evaluate
          - name: time-limit
            value: '{{=int(fromJSON(inputs.parameters["kaos-run-settings"])["evaluate"]["walltime"])}}'
          - name: deadline-seconds
            value: '{{=1 * (int(fromJSON(inputs.parameters["kaos-run-settings"])["evaluate"]["walltime"])
              + 480) * 60}}'
          - name: resumable-lead
            value: '0'
          - name: resumable
            value: '0'
          - name: idle-timeout
            value: ''
          - name: hpc-class
            value: '{{workflow.parameters.evaluate-class}}'
          - name: node-suffix
            value: -{{=item.index}}
          - name: kaos-item
            value: '{{item.index}}'
          - name: kaos-context
            value: '{{=inputs.parameters["kaos-context"] + ",\"matrix\":" + fromJSON(inputs.parameters["kaos-run-settings"])["evaluate"]["matrix"][int(item.index)].text
              + "}"}}'
    - - name: rest
        template: kaos-matrix-evaluate
        when: '{{=len(fromJSON(inputs.parameters["items"])) > int(inputs.parameters["par"])}}'
        arguments:
          parameters:
          - name: items
            value: '{{=toJSON(fromJSON(inputs.parameters["items"])[int(inputs.parameters["par"]):])}}'
          - name: par
            value: '{{inputs.parameters.par}}'
          - name: kaos-context
            value: '{{inputs.parameters.kaos-context}}'
          - name: kaos-run-settings
            value: '{{inputs.parameters.kaos-run-settings}}'
          - name: kaos-images
            value: '{{inputs.parameters.kaos-images}}'
    inputs:
      parameters:
      - name: items
      - name: par
      - name: kaos-context
      - name: kaos-run-settings
      - name: kaos-images
    outputs:
      parameters:
      - name: kaos-result
        valueFrom:
          default: '[]'
          expression: 'toJSON(concat((steps["run"].outputs?.parameters?.["kaos-result"]
            == nil ? [] : fromJSON(steps["run"].outputs.parameters["kaos-result"])),
            (steps["run-hpc"].outputs?.parameters?.["kaos-result"] == nil ? [] : fromJSON(steps["run-hpc"].outputs.parameters["kaos-result"])),
            (steps["rest"].outputs?.parameters?.["kaos-result"] == nil ? [] : fromJSON(steps["rest"].outputs.parameters["kaos-result"]))))'
      - name: kaos-item
        valueFrom:
          default: '[]'
          expression: 'toJSON(concat((steps["run"].outputs?.parameters?.["kaos-item"]
            == nil ? [] : fromJSON(steps["run"].outputs.parameters["kaos-item"])),
            (steps["run-hpc"].outputs?.parameters?.["kaos-item"] == nil ? [] : fromJSON(steps["run-hpc"].outputs.parameters["kaos-item"])),
            (steps["rest"].outputs?.parameters?.["kaos-item"] == nil ? [] : fromJSON(steps["rest"].outputs.parameters["kaos-item"]))))'
  - name: hpc-follower
    inputs:
      parameters:
      - name: step-name
      - name: image
      - name: step-command
      - name: step-kind
      - name: time-limit
      - name: deadline-seconds
      - name: hpc-class
      - name: resumable-lead
        value: '0'
      - name: resumable
        value: auto
      - name: idle-timeout
        value: ''
      - name: node-suffix
        value: ''
      - name: kaos-item
        value: ''
      - name: kaos-context
    activeDeadlineSeconds: '{{inputs.parameters.deadline-seconds}}'
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: (lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message contains 'kaos-result.json')
    metadata:
      labels:
        platform.kubecore.io/compute-type: hpc
        platform.kubecore.io/hpc-class: '{{inputs.parameters.hpc-class}}'
        platform.kubecore.io/step-kind: '{{inputs.parameters.step-kind}}'
    outputs:
      parameters:
      - name: slurm-job-id
        valueFrom:
          path: /tmp/slurm-job-id
      - name: kaos-result
        valueFrom:
          path: /tmp/outputs/kaos-result.json
      - name: kaos-item
        value: '{{inputs.parameters.kaos-item}}'
    container:
      image: registry.example/kaos-hpc-operator:v0.0.0
      command:
      - /follower
      env:
      - name: HPC_JOB_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: WF_NAME
        value: '{{workflow.name}}'
      - name: WF_UID
        value: '{{workflow.uid}}'
      - name: STEP_NAME
        value: '{{inputs.parameters.step-name}}'
      - name: NODE_KEY
        value: '{{inputs.parameters.step-name}}-hpc{{inputs.parameters.node-suffix}}'
      - name: IMAGE_REF
        value: '{{inputs.parameters.image}}'
      - name: STEP_COMMAND
        value: '{{inputs.parameters.step-command}}'
      - name: SLURM_TIME_LIMIT
        value: '{{inputs.parameters.time-limit}}'
      - name: HPC_CLASS
        value: '{{inputs.parameters.hpc-class}}'
      - name: HPC_RESUMABLE_LEAD
        value: '{{inputs.parameters.resumable-lead}}'
      - name: HPC_RESUMABLE
        value: '{{inputs.parameters.resumable}}'
      - name: HPC_IDLE_TIMEOUT_MINUTES
        value: '{{inputs.parameters.idle-timeout}}'
      - name: HPC_MAX_CONTINUATIONS
        value: '5'
      - name: KAOS_STEP_CONTEXT
        value: '{{inputs.parameters.kaos-context}}'
      terminationMessagePolicy: FallbackToLogsOnError
    serviceAccountName: hpc-submitter
  arguments:
    parameters:
    - name: pipeline-info
      value: "The defaults run as they are: press Submit.\nEach step has a class (the\
        \ machine it runs on) and a time limit (the longest it may run, as minutes\
        \ or hours). Only a step that declares gpu=True is offered the GPU classes.\n\
        Machine classes:\n  - cpu-standard (cpu) — n2-standard-8\n  - kubecorecpu\
        \ (cpu) — e2-standard-8\n  - gpu-t4 (gpu) — n1-standard-8 + 1x nvidia-tesla-t4\n\
        HPC (Slurm) classes: pick one in a step's class field and the step runs there\
        \ as a job. Queue time applies; the step's time limit is the job's limit.\
        \ Classes:\n  - meluxina-gpu (gpu) — partition gpu, 4 GPUs, 128 cores, 512\
        \ GiB — 4x A100-40GB, 2x EPYC 7452, 512 GB\n  - meluxina-cpu (cpu) — partition\
        \ cpu, 128 cores, 512 GiB — 2x EPYC 7452, 128 cores, 512 GB\n  - meluxina-largemem\
        \ (cpu) — partition largemem, 128 cores, 4096 GiB — 4 TB\nSteps: dataset-loading\
        \ -> hello-world -> train -> evaluate"
      description: How to fill this form.
    - name: experiment-name
      description: experiment name (used for tracking + artifact path prefixes)
      value: my-experiment-v1
    - name: experiment-description
      description: optional free text stored with the run
      value: ''
    - name: model
      description: 'One of: large, small.'
      value: small
      enum:
      - large
      - small
    - name: optim
      description: 'One of: adam, sgd.'
      value: adam
      enum:
      - adam
      - sgd
    - name: model-width
      description: ''
      value: '64'
    - name: model-dropout
      description: ''
      value: '0.1'
    - name: model-name
      description: ''
      value: tiny
    - name: model-warmup
      description: ''
      value: '5'
    - name: optim-lr
      description: ''
      value: '0.001'
    - name: optim-fused
      description: ''
      value: 'true'
    - name: optim-api_token
      description: ''
      value: abc
    - name: dataset
      description: 'The dataset this run uses: <dataset-repo>@<version>. A dataset
        is its own lakeFS repository (dataset-<name>); the version is a tag (v1, v2,
        ...) or `latest` (= the head of main). The submit form shows this as a dropdown
        of the datasets and versions of your project, filled in by the platform when
        the template is released. The run resolves the choice to a commit once (step
        dataset-loading) and every later step reads that same commit.'
      value: dataset-default@latest
    - name: dataset-loading-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      description: 'The machine class the ''dataset-loading'' step runs on. Default:
        cpu-standard.'
    - name: dataset-loading-walltime
      value: 4h
      description: 'The longest the step may run, as minutes or hours: 90m, 12h. Default
        from pipeline.py.'
    - name: hello-world-walltime
      value: 4h
      description: 'The longest the step may run, as minutes or hours: 90m, 12h. Default
        from pipeline.py.'
    - name: train-class
      value: gpu-t4
      enum:
      - cpu-standard
      - kubecorecpu
      - gpu-t4
      - meluxina-gpu
      - meluxina-cpu
      - meluxina-largemem
      description: 'The machine class the ''train'' step runs on. Default: gpu-t4.
        Classes that start with ''meluxina-'' run the step as a job on HPC (Slurm):
        queue time applies.'
    - name: train-walltime
      value: 12h
      description: 'The longest the step may run, as minutes or hours: 90m, 12h. Default
        from pipeline.py.'
    - name: train-checkpoint-every
      value: 20m
      description: 'How often the ''train'' step''s checkpoint is saved: minutes or
        hours, for example 10m or 1h.'
    - name: evaluate-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      - meluxina-cpu
      - meluxina-largemem
      description: 'The machine class the ''evaluate'' step runs on. Default: cpu-standard.
        Classes that start with ''meluxina-'' run the step as a job on HPC (Slurm):
        queue time applies.'
    - name: evaluate-walltime
      value: 4h
      description: 'The longest the step may run, as minutes or hours: 90m, 12h. Default
        from pipeline.py.'
    - name: evaluate-matrix
      value: '[{"seed":1},{"seed":2}]'
      description: 'The combinations the ''evaluate'' step runs, one run each, as
        a JSON list of objects with the names seed. Default: every combination of
        the values in pipeline.py (2). At most 32; a value is a number, true or false,
        or a short text.'
    - name: evaluate-parallel
      value: '4'
      description: 'How many of the ''evaluate'' step''s runs go at the same time:
        a whole number from 1 to 32, or all. Default 4: the GPU steps one machine
        holds, so that on an HPC (Slurm) class the runs share one machine. A larger
        number asks for more machines.'
    - name: reuse-from-run
      value: ''
      description: Optional. The name of an earlier run of this app. Steps before
        the step below are not run again; their results and outputs are taken from
        that run. Leave empty for a normal run.
    - name: start-from-step
      value: ''
      description: 'Optional. The step to run first; it and every step after it run
        again. Needs the earlier run above. Steps: dataset-loading, hello-world, train,
        evaluate.'
    - name: promote-loaded
      value: 'false'
      enum:
      - 'false'
      - 'true'
      description: Make this run's version of loaded the one other pipelines read
        as latest.
    - name: config
      description: Extra settings for this run, as YAML. They replace the values above.
      value: ''
  serviceAccountName: argo-workflow
  ttlStrategy:
    secondsAfterSuccess: 3024000
    secondsAfterFailure: 3024000
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 168h
  workflowMetadata:
    labels:
      platform.kubecore.io/engine: 0.9.9
