        export LD_LIBRARY_PATH\nPATH=/usr/local/nvidia/bin:$PATH\nexport PATH\nkaos_gpus=$1\n\
        shift\nif [ \"$kaos_gpus\" != \"0\" ]; then\n  if command -v python3 >/dev/null\
        \ 2>&1; then\n    if ! kaos_why=`python3 -c 'import ctypes, sys\ntry:\n  \
        \  lib = ctypes.CDLL(\"libcuda.so.1\")\nexcept OSError as e:\n    sys.exit(\"\
        libcuda.so.1 not found: \" + str(e).replace(chr(10), \" \"))\nrc = lib.cuInit(0)\n\
        if rc != 0:\n    sys.exit(\"cuInit returned error \" + str(rc))\n' 2>&1`;\
        \ then\n      echo \"KAOS: this GPU step cannot reach the NVIDIA driver ($kaos_why);\
