apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: PLACEHOLDER-app-pipeline
  annotations:
    platform.kubecore.io/generated-by: ml-ci-build/hera-render
    platform.kubecore.io/cost-tracking: enabled
    platform.kubecore.io/engine-version: 0.9.9
  namespace: ns-a
  labels:
    platform.kubecore.io/project: PLACEHOLDER-project
    platform.kubecore.io/app: PLACEHOLDER-app
    platform.kubecore.io/managed-by: kubecore-ci
spec:
  entrypoint: main
  templates:
  - name: compose-and-validate
    container:
      image: '{{inputs.parameters.image}}'
      args:
      - model={{workflow.parameters.model}}
      - optim={{workflow.parameters.optim}}
      - experiment.name={{workflow.parameters.experiment-name}}
      - experiment.description={{workflow.parameters.experiment-description}}
      - dataset={{workflow.parameters.dataset}}
      - model.width={{workflow.parameters.model-width}}
      - model.dropout={{workflow.parameters.model-dropout}}
      - model.name={{workflow.parameters.model-name}}
      - model.warmup={{workflow.parameters.model-warmup}}
      - optim.lr={{workflow.parameters.optim-lr}}
      - optim.fused={{workflow.parameters.optim-fused}}
      - optim.api_token={{workflow.parameters.optim-api_token}}
      - --render-defaults
      - '{"model":"small","optim":"adam","experiment.name":"my-experiment-v1","experiment.description":"","dataset":"dataset-default@latest","model.width":"64","model.dropout":"0.1","model.name":"tiny","model.warmup":"5","optim.lr":"0.001","optim.fused":"true","optim.api_token":"abc"}'
      - --advanced
      - '{{workflow.parameters.config}}'
      - --require=experiment
      - --require=model
      - --require=optim
      - --run
      - '{{workflow.name}}'
      - --run-uid
      - '{{workflow.uid}}'
      - --steps
      - '[{"name":"dataset-loading","kind":"ingest","reads":[],"inputs":["dataset"],"needs":[],"produces":[{"name":"loaded","type":"dataset"}]},{"name":"hello-world","kind":"transform","reads":["experiment"],"inputs":["dataset"],"needs":["dataset-loading"],"produces":[{"name":"report","type":"artifact"}]},{"name":"train","kind":"train","reads":["model","optim"],"inputs":[],"needs":["dataset-loading"],"produces":[{"name":"m","type":"model"}],"when_text":"optim
        == sgd and model != large","when_fields":["optim","model"]},{"name":"evaluate","kind":"evaluate","reads":[],"inputs":[],"needs":["train"],"produces":[],"matrix":{"seed":[1,2]}}]'
      - --context-dir
      - /work/context
      - --ledger-output
      - /work/kaos-ledger.json
      - --reused-dir
      - /work/reused
      - --when-field
      - optim={{=workflow.parameters['optim']}}
      - --when-field
      - model={{=workflow.parameters['model']}}
      - --images-output
      - /work/kaos-images.json
      - --app
      - PLACEHOLDER-app
      - --project
      - PLACEHOLDER-project
      - --walltime
      - dataset-loading={{workflow.parameters.dataset-loading-walltime}}
      - --walltime
      - hello-world={{workflow.parameters.hello-world-walltime}}
      - --walltime
      - train={{workflow.parameters.train-walltime}}
      - --checkpoint-every
      - train={{workflow.parameters.train-checkpoint-every}}
      - --walltime
      - evaluate={{workflow.parameters.evaluate-walltime}}
      - --class
      - dataset-loading={{workflow.parameters.dataset-loading-class}}
      - --class
      - train={{workflow.parameters.train-class}}
      - --class
      - evaluate={{workflow.parameters.evaluate-class}}
      - --class-offers
      - '{"dataset-loading":{"offered":["cpu-standard","kubecorecpu"],"refused":{"gpu-t4":["it
        is a GPU machine and the step does not declare gpu=True","Add gpu=True to
        the step in pipeline.py to run it on a GPU machine."],"meluxina-gpu":["a ingest
        step never runs on HPC (Slurm)","Choose one of: cpu-standard, kubecorecpu."],"meluxina-cpu":["a
        ingest step never runs on HPC (Slurm)","Choose one of: cpu-standard, kubecorecpu."],"meluxina-largemem":["a
        ingest step never runs on HPC (Slurm)","Choose one of: cpu-standard, kubecorecpu."]}},"train":{"offered":["cpu-standard","kubecorecpu","gpu-t4","meluxina-gpu","meluxina-cpu","meluxina-largemem"],"refused":{}},"evaluate":{"offered":["cpu-standard","kubecorecpu","meluxina-cpu","meluxina-largemem"],"refused":{"gpu-t4":["it
        is a GPU machine and the step does not declare gpu=True","Add gpu=True to
        the step in pipeline.py to run it on a GPU machine."],"meluxina-gpu":["it
        is a GPU machine and the step does not declare gpu=True","Add gpu=True to
        the step in pipeline.py to run it on a GPU machine."]}}}'
      - --hpc-classes
      - meluxina-gpu,meluxina-cpu,meluxina-largemem
      - --reuse-from-run={{workflow.parameters.reuse-from-run}}
      - --start-from-step={{workflow.parameters.start-from-step}}
      - --promote
      - loaded={{workflow.parameters.promote-loaded}}
      - --matrix
      - evaluate={{workflow.parameters.evaluate-matrix}}
      - --parallel
      - evaluate={{workflow.parameters.evaluate-parallel}}
      - --settings-output
      - /work/kaos-run-settings.json
      command:
      - python
      - -I
      - -m
      - kaos_engine.compose
      env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: KAOS_CHECKPOINT_DIR
        value: /kaos/checkpoint
      - name: KAOS_STEP_IMAGES
        value: '{"dataset-loading":"{{inputs.parameters.image-dataset-loading}}","evaluate":"{{inputs.parameters.image-evaluate}}","hello-world":"{{inputs.parameters.image-hello-world}}","train":"{{inputs.parameters.image-train}}"}'
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
      - name: kaos-checkpoint
        mountPath: /kaos/checkpoint
    metadata:
      labels:
        platform.kubecore.io/step: compose-and-validate
        platform.kubecore.io/step-kind: control
    outputs:
      parameters:
      - name: kaos-ledger
        valueFrom:
          path: /work/kaos-ledger.json
      - name: kaos-context-dataset-loading
        valueFrom:
          path: /work/context/dataset-loading.json
      - name: kaos-context-hello-world
        valueFrom:
          path: /work/context/hello-world.json
      - name: kaos-context-train
        valueFrom:
          path: /work/context/train.json
      - name: kaos-context-evaluate
        valueFrom:
          path: /work/context/evaluate.json
      - name: kaos-reused-dataset-loading
        valueFrom:
          path: /work/reused/dataset-loading.json
      - name: kaos-reused-hello-world
        valueFrom:
          path: /work/reused/hello-world.json
      - name: kaos-reused-train
        valueFrom:
          path: /work/reused/train.json
      - name: kaos-reused-evaluate
        valueFrom:
          path: /work/reused/evaluate.json
      - name: kaos-images
        valueFrom:
          path: /work/kaos-images.json
      - name: kaos-run-settings
        valueFrom:
          path: /work/kaos-run-settings.json
    inputs:
      parameters:
      - name: cpu
        default: '7'
      - name: mem
        default: 27Gi
      - name: disk
        default: 10Gi
      - name: image
        valueFrom:
          configMapKeyRef:
            name: PLACEHOLDER-app-pipeline-images
            key: compose-and-validate
      - name: image-dataset-loading
        valueFrom:
          configMapKeyRef:
            name: PLACEHOLDER-app-pipeline-images
            key: dataset-loading
      - name: image-evaluate
        valueFrom:
          configMapKeyRef:
            name: PLACEHOLDER-app-pipeline-images
            key: evaluate
      - name: image-hello-world
        valueFrom:
          configMapKeyRef:
            name: PLACEHOLDER-app-pipeline-images
            key: hello-world
      - name: image-train
        valueFrom:
          configMapKeyRef:
            name: PLACEHOLDER-app-pipeline-images
            key: train
    podSpecPatch: "containers:\n- name: main\n  resources:\n    limits:\n      cpu:\
      \ '{{inputs.parameters.cpu}}'\n      memory: '{{inputs.parameters.mem}}'\n \
      \   requests:\n      cpu: '{{inputs.parameters.cpu}}'\n      ephemeral-storage:\
      \ '{{inputs.parameters.disk}}'\n      memory: '{{inputs.parameters.mem}}'\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: cpu-standard
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-checkpoint
      emptyDir: {}
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: ((lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message contains 'kaos-result.json')) and not (lastRetry.message
        startsWith 'KaosIdle')
      backoff:
        duration: 30s
        factor: '2'
        maxDuration: 10m
  - name: kaos-promote
    container:
      image: '{{inputs.parameters.image}}'
