apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: PLACEHOLDER-app-pipeline
  annotations:
    platform.kubecore.io/generated-by: ml-ci-build/hera-render
    platform.kubecore.io/cost-tracking: enabled
    platform.kubecore.io/engine-version: 0.9.9
  namespace: ns-a
  labels:
    platform.kubecore.io/project: PLACEHOLDER-project
    platform.kubecore.io/app: PLACEHOLDER-app
    platform.kubecore.io/managed-by: kubecore-ci
spec:
  entrypoint: main
  templates:
  - name: compose-and-validate
    container:
      image: '{{inputs.parameters.image}}'
      args:
      - src={{workflow.parameters.src}}
      - experiment.name={{workflow.parameters.experiment-name}}
      - experiment.description={{workflow.parameters.experiment-description}}
      - dataset={{workflow.parameters.dataset}}
      - --render-defaults
      - '{"src":"lake","experiment.name":"my-experiment-v1","experiment.description":"","dataset":"dataset-default@latest"}'
      - --advanced
      - '{{workflow.parameters.config}}'
      - --require=experiment
      - --run
      - '{{workflow.name}}'
      - --run-uid
      - '{{workflow.uid}}'
      - --steps
      - '[{"name":"dataset-loading","kind":"ingest","reads":[],"inputs":["dataset"],"needs":[],"produces":[{"name":"loaded","type":"dataset"}]},{"name":"hello-world","kind":"transform","reads":["experiment"],"inputs":["dataset"],"needs":["dataset-loading"],"produces":[{"name":"report","type":"artifact"}]}]'
      - --context-dir
      - /work/context
      - --ledger-output
      - /work/kaos-ledger.json
      - --reused-dir
      - /work/reused
      - --images-output
      - /work/kaos-images.json
      - --app
      - PLACEHOLDER-app
      - --project
      - PLACEHOLDER-project
      - --walltime
      - dataset-loading={{workflow.parameters.dataset-loading-walltime}}
      - --walltime
      - hello-world={{workflow.parameters.hello-world-walltime}}
      - --class
      - dataset-loading={{workflow.parameters.dataset-loading-class}}
      - --class
      - hello-world={{workflow.parameters.hello-world-class}}
      - --class-offers
      - '{"dataset-loading":{"offered":["cpu-standard","kubecorecpu"],"refused":{"gpu-t4":["it
        is a GPU machine and the step does not declare gpu=True","Add gpu=True to
        the step in pipeline.py to run it on a GPU machine."],"meluxina-gpu":["a ingest
        step never runs on HPC (Slurm)","Choose one of: cpu-standard, kubecorecpu."],"meluxina-cpu":["a
        ingest step never runs on HPC (Slurm)","Choose one of: cpu-standard, kubecorecpu."],"meluxina-largemem":["a
        ingest step never runs on HPC (Slurm)","Choose one of: cpu-standard, kubecorecpu."]}},"hello-world":{"offered":["cpu-standard","kubecorecpu","meluxina-cpu","meluxina-largemem"],"refused":{"gpu-t4":["it
        is a GPU machine and the step does not declare gpu=True","Add gpu=True to
        the step in pipeline.py to run it on a GPU machine."],"meluxina-gpu":["it
        is a GPU machine and the step does not declare gpu=True","Add gpu=True to
        the step in pipeline.py to run it on a GPU machine."]}}}'
      - --hpc-classes
      - meluxina-gpu,meluxina-cpu,meluxina-largemem
      - --reuse-from-run={{workflow.parameters.reuse-from-run}}
      - --start-from-step={{workflow.parameters.start-from-step}}
      - --promote
      - loaded={{workflow.parameters.promote-loaded}}
      - --settings-output
      - /work/kaos-run-settings.json
      command:
      - python
      - -I
      - -m
      - kaos_engine.compose
      env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: KAOS_CHECKPOINT_DIR
        value: /kaos/checkpoint
      - name: KAOS_STEP_IMAGES
        value: '{"dataset-loading":"{{inputs.parameters.image-dataset-loading}}","hello-world":"{{inputs.parameters.image-hello-world}}"}'
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
      - name: kaos-checkpoint
        mountPath: /kaos/checkpoint
    metadata:
      labels:
        platform.kubecore.io/step: compose-and-validate
        platform.kubecore.io/step-kind: control
    outputs:
      parameters:
      - name: kaos-ledger
        valueFrom:
          path: /work/kaos-ledger.json
      - name: kaos-context-dataset-loading
        valueFrom:
          path: /work/context/dataset-loading.json
      - name: kaos-context-hello-world
        valueFrom:
          path: /work/context/hello-world.json
      - name: kaos-reused-dataset-loading
        valueFrom:
          path: /work/reused/dataset-loading.json
      - name: kaos-reused-hello-world
        valueFrom:
          path: /work/reused/hello-world.json
      - name: kaos-images
        valueFrom:
          path: /work/kaos-images.json
      - name: kaos-run-settings
        valueFrom:
          path: /work/kaos-run-settings.json
    inputs:
      parameters:
      - name: cpu
        default: '7'
      - name: mem
        default: 27Gi
      - name: disk
        default: 10Gi
      - name: image
        valueFrom:
          configMapKeyRef:
            name: PLACEHOLDER-app-pipeline-images
            key: compose-and-validate
      - name: image-dataset-loading
        valueFrom:
          configMapKeyRef:
            name: PLACEHOLDER-app-pipeline-images
            key: dataset-loading
      - name: image-hello-world
        valueFrom:
          configMapKeyRef:
            name: PLACEHOLDER-app-pipeline-images
            key: hello-world
    podSpecPatch: "containers:\n- name: main\n  resources:\n    limits:\n      cpu:\
      \ '{{inputs.parameters.cpu}}'\n      memory: '{{inputs.parameters.mem}}'\n \
      \   requests:\n      cpu: '{{inputs.parameters.cpu}}'\n      ephemeral-storage:\
      \ '{{inputs.parameters.disk}}'\n      memory: '{{inputs.parameters.mem}}'\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: cpu-standard
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-checkpoint
      emptyDir: {}
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: ((lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message contains 'kaos-result.json')) and not (lastRetry.message
        startsWith 'KaosIdle')
      backoff:
        duration: 30s
        factor: '2'
        maxDuration: 10m
  - name: kaos-promote
    container:
      image: '{{inputs.parameters.image}}'
      args: []
      command:
      - python
      - -I
      - -m
      - kaos_engine.promote
      env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: KAOS_CHECKPOINT_DIR
        value: /kaos/checkpoint
      - name: KAOS_RUN
        value: '{{workflow.name}}'
      - name: KAOS_PROMOTE_PLAN
        value: '{{inputs.parameters.kaos-promote-plan}}'
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
      - name: kaos-checkpoint
        mountPath: /kaos/checkpoint
    metadata:
      labels:
        platform.kubecore.io/step: kaos-promote
        platform.kubecore.io/step-kind: control
    inputs:
      parameters:
      - name: cpu
        default: 100m
      - name: mem
        default: 256Mi
      - name: disk
        default: 1Gi
      - name: image
        valueFrom:
          configMapKeyRef:
            name: PLACEHOLDER-app-pipeline-images
            key: compose-and-validate
      - name: kaos-promote-plan
    podSpecPatch: "containers:\n- name: main\n  resources:\n    limits:\n      cpu:\
      \ '{{inputs.parameters.cpu}}'\n      memory: '{{inputs.parameters.mem}}'\n \
      \   requests:\n      cpu: '{{inputs.parameters.cpu}}'\n      ephemeral-storage:\
      \ '{{inputs.parameters.disk}}'\n      memory: '{{inputs.parameters.mem}}'\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: cpu-standard
    activeDeadlineSeconds: 1800
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-checkpoint
      emptyDir: {}
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: ((lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message contains 'kaos-result.json')) and not (lastRetry.message
        startsWith 'KaosIdle')
      backoff:
        duration: 30s
        factor: '2'
        maxDuration: 10m
  - name: dataset-loading
    container:
      image: '{{inputs.parameters.image}}'
      command:
      - python
      - -m
      - app.entry
      env:
      - name: KAOS_STEP_CONTEXT
        value: '{{inputs.parameters.kaos-context}}'
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: KAOS_CHECKPOINT_DIR
        value: /kaos/checkpoint
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
      - name: kaos-checkpoint
        mountPath: /kaos/checkpoint
    inputs:
      parameters:
      - name: kaos-context
      - name: cpu
        default: '7'
      - name: mem
        default: 27Gi
      - name: disk
        default: 10Gi
      - name: deadline
        default: '14400'
      - name: image
    metadata:
      labels:
        platform.kubecore.io/produces-dataset: 'true'
        platform.kubecore.io/step: dataset-loading
        platform.kubecore.io/step-kind: ingest
    outputs:
      parameters:
      - name: kaos-result
        valueFrom:
          path: /work/output/kaos-result.json
    podSpecPatch: "containers:\n- name: main\n  resources:\n    limits:\n      cpu:\
      \ '{{inputs.parameters.cpu}}'\n      memory: '{{inputs.parameters.mem}}'\n \
      \   requests:\n      cpu: '{{inputs.parameters.cpu}}'\n      ephemeral-storage:\
      \ '{{inputs.parameters.disk}}'\n      memory: '{{inputs.parameters.mem}}'\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.dataset-loading-class}}'
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    activeDeadlineSeconds: '{{inputs.parameters.deadline}}'
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-checkpoint
      emptyDir: {}
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: ((lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message contains 'kaos-result.json')) and not (lastRetry.message
        startsWith 'KaosIdle')
      backoff:
        duration: 30s
        factor: '2'
        maxDuration: 10m
  - name: hello-world
    container:
      image: '{{inputs.parameters.image}}'
      command:
      - python
      - -m
      - app.entry
      env:
      - name: KAOS_STEP_CONTEXT
        value: '{{inputs.parameters.kaos-context}}'
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow.internal.invalid
      - name: MLFLOW_TRACKING_AUTH
        value: zitadel
      - name: ZITADEL_DOMAIN
        value: oidc.internal.invalid
      - name: ZITADEL_MLFLOW_PROJECT_ID
        value: PLACEHOLDER-oidc-project-id
      - name: ZITADEL_MACHINE_KEY_FILE
        value: /etc/mlflow-svc/ZITADEL_MACHINE_KEY
      - name: LAKEFS_ENDPOINT
        value: http://lakefs.internal.invalid
      - name: LAKEFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: accessKeyId
      - name: LAKEFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: PLACEHOLDER-lakefs-admin
            key: secretAccessKey
      - name: KAOS_CHECKPOINT_DIR
        value: /kaos/checkpoint
      resources:
        requests:
          cpu: '7'
          memory: 27Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '7'
          memory: 27Gi
      volumeMounts:
      - name: mlflow-svc
        mountPath: /etc/mlflow-svc
        readOnly: true
      - name: dshm
        mountPath: /dev/shm
      - name: kaos-checkpoint
        mountPath: /kaos/checkpoint
    inputs:
      parameters:
      - name: kaos-context
      - name: cpu
        default: '7'
      - name: mem
        default: 27Gi
      - name: disk
        default: 10Gi
      - name: deadline
        default: '14400'
      - name: image
    metadata:
      labels:
        platform.kubecore.io/step: hello-world
        platform.kubecore.io/step-kind: transform
    outputs:
      parameters:
      - name: kaos-result
        valueFrom:
          path: /work/output/kaos-result.json
    podSpecPatch: "containers:\n- name: main\n  resources:\n    limits:\n      cpu:\
      \ '{{inputs.parameters.cpu}}'\n      memory: '{{inputs.parameters.mem}}'\n \
      \   requests:\n      cpu: '{{inputs.parameters.cpu}}'\n      ephemeral-storage:\
      \ '{{inputs.parameters.disk}}'\n      memory: '{{inputs.parameters.mem}}'\n"
    nodeSelector:
      platform.kubecore.io/nodegroup-type: '{{workflow.parameters.hello-world-class}}'
    tolerations:
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: cpu
      effect: NoSchedule
    - key: platform.kubecore.io/ml-workload
      operator: Equal
      value: gpu
      effect: NoSchedule
    activeDeadlineSeconds: '{{inputs.parameters.deadline}}'
    volumes:
    - name: mlflow-svc
      secret:
        secretName: PLACEHOLDER-mlflow-svc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: kaos-checkpoint
      emptyDir: {}
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: ((lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message contains 'kaos-result.json')) and not (lastRetry.message
        startsWith 'KaosIdle')
      backoff:
        duration: 30s
        factor: '2'
        maxDuration: 10m
  - name: main
    dag:
      tasks:
      - name: compose-and-validate
        template: compose-and-validate
        arguments:
          parameters:
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[''cpu-standard''])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[''cpu-standard'']) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[''cpu-standard'']) ?? "10Gi"}}'
      - name: dataset-loading
        depends: compose-and-validate
        template: dataset-loading
        when: '{{=workflow.parameters[''start-from-step''] in ['''', ''dataset-loading'']}}'
        arguments:
          parameters:
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-dataset-loading"])
              + ",\"upstream\":{" + "}" + "}"}}'
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[workflow.parameters[''dataset-loading-class'']])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[workflow.parameters[''dataset-loading-class'']]) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[workflow.parameters[''dataset-loading-class'']]) ?? "10Gi"}}'
          - name: deadline
            value: '{{=int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["dataset-loading"]["walltime"])
              * 60}}'
          - name: image
            value: '{{=fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-images"])["dataset-loading"]}}'
      - name: hello-world
        depends: compose-and-validate && dataset-loading
        template: hello-world
        when: '{{=(workflow.parameters[''start-from-step''] in ['''', ''hello-world'',
          ''dataset-loading'']) && !hasPrefix(workflow.parameters[''hello-world-class''],
          ''meluxina-'')}}'
        arguments:
          parameters:
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-hello-world"])
              + ",\"upstream\":{\"dataset-loading\":" + sprig.default(sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["compose-and-validate"].outputs.parameters["kaos-reused-dataset-loading"]),
              tasks["dataset-loading"].outputs.parameters["kaos-result"]) + "}" +
              "}"}}'
          - name: cpu
            value: '{{=({"cpu-standard": "7", "kubecorecpu": "7", "gpu-t4": "7"}[workflow.parameters[''hello-world-class'']])
              ?? "7"}}'
          - name: mem
            value: '{{=({"cpu-standard": "27Gi", "kubecorecpu": "27Gi", "gpu-t4":
              "25Gi"}[workflow.parameters[''hello-world-class'']]) ?? "27Gi"}}'
          - name: disk
            value: '{{=({"cpu-standard": "10Gi", "kubecorecpu": "10Gi", "gpu-t4":
              "10Gi"}[workflow.parameters[''hello-world-class'']]) ?? "10Gi"}}'
          - name: deadline
            value: '{{=int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["hello-world"]["walltime"])
              * 60}}'
          - name: image
            value: '{{=fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-images"])["hello-world"]}}'
      - name: hello-world-hpc
        template: hpc-follower
        when: '{{=(workflow.parameters[''start-from-step''] in ['''', ''hello-world'',
          ''dataset-loading'']) && hasPrefix(workflow.parameters[''hello-world-class''],
          ''meluxina-'')}}'
        arguments:
          parameters:
          - name: step-name
            value: hello-world
          - name: image
            value: '{{=fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-images"])["hello-world"]}}'
          - name: step-command
            value: '["python","-m","app.entry"]'
          - name: step-kind
            value: transform
          - name: time-limit
            value: '{{=int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["hello-world"]["walltime"])}}'
          - name: deadline-seconds
            value: '{{=6 * (int(fromJSON(tasks["compose-and-validate"].outputs.parameters["kaos-run-settings"])["hello-world"]["walltime"])
              + 480) * 60}}'
          - name: resumable-lead
            value: '0'
          - name: resumable
            value: auto
          - name: idle-timeout
            value: ''
          - name: hpc-class
            value: '{{workflow.parameters.hello-world-class}}'
          - name: kaos-context
            value: '{{=sprig.trimSuffix("}", tasks["compose-and-validate"].outputs.parameters["kaos-context-hello-world"])
              + ",\"upstream\":{\"dataset-loading\":" + sprig.default(sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["compose-and-validate"].outputs.parameters["kaos-reused-dataset-loading"]),
              tasks["dataset-loading"].outputs.parameters["kaos-result"]) + "}" +
              "}"}}'
        depends: compose-and-validate && dataset-loading
      - name: kaos-promote
        template: kaos-promote
        depends: compose-and-validate && (dataset-loading.Succeeded || dataset-loading.Skipped)
          && ((hello-world.Succeeded || hello-world-hpc.Succeeded) || (hello-world.Skipped
          && hello-world-hpc.Skipped))
        when: '{{=workflow.parameters["promote-loaded"] == ''true''}}'
        arguments:
          parameters:
          - name: cpu
            value: 100m
          - name: mem
            value: 256Mi
          - name: disk
            value: 1Gi
          - name: kaos-promote-plan
            value: '{{=toJSON([{"step":"dataset-loading","name":"loaded","promote":workflow.parameters["promote-loaded"],"writes":fromJSON(sprig.default(sprig.default("{\"version\":1,\"status\":\"absent\"}",
              tasks["compose-and-validate"].outputs.parameters["kaos-reused-dataset-loading"]),
              tasks["dataset-loading"].outputs.parameters["kaos-result"]))?.writes
              ?? []}])}}'
  - name: hpc-follower
    inputs:
      parameters:
      - name: step-name
      - name: image
      - name: step-command
      - name: step-kind
      - name: time-limit
      - name: deadline-seconds
      - name: hpc-class
      - name: resumable-lead
        value: '0'
      - name: resumable
        value: auto
      - name: idle-timeout
        value: ''
      - name: kaos-context
    activeDeadlineSeconds: '{{inputs.parameters.deadline-seconds}}'
    retryStrategy:
      limit: '2'
      retryPolicy: Always
      expression: (lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
        node shutdown|node is shutting down|node is draining|The node was low on resource|The
        node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*')
        and not (lastRetry.message contains 'kaos-result.json')
    metadata:
      labels:
        platform.kubecore.io/compute-type: hpc
        platform.kubecore.io/hpc-class: '{{inputs.parameters.hpc-class}}'
        platform.kubecore.io/step-kind: '{{inputs.parameters.step-kind}}'
    outputs:
      parameters:
      - name: slurm-job-id
        valueFrom:
          path: /tmp/slurm-job-id
      - name: kaos-result
        valueFrom:
          path: /tmp/outputs/kaos-result.json
    container:
      image: registry.example/kaos-hpc-operator:v0.0.0
      command:
      - /follower
      env:
      - name: HPC_JOB_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: WF_NAME
        value: '{{workflow.name}}'
      - name: WF_UID
        value: '{{workflow.uid}}'
      - name: STEP_NAME
        value: '{{inputs.parameters.step-name}}'
      - name: NODE_KEY
        value: '{{inputs.parameters.step-name}}-hpc'
      - name: IMAGE_REF
        value: '{{inputs.parameters.image}}'
      - name: STEP_COMMAND
        value: '{{inputs.parameters.step-command}}'
      - name: SLURM_TIME_LIMIT
        value: '{{inputs.parameters.time-limit}}'
      - name: HPC_CLASS
        value: '{{inputs.parameters.hpc-class}}'
      - name: HPC_RESUMABLE_LEAD
        value: '{{inputs.parameters.resumable-lead}}'
      - name: HPC_RESUMABLE
        value: '{{inputs.parameters.resumable}}'
      - name: HPC_IDLE_TIMEOUT_MINUTES
        value: '{{inputs.parameters.idle-timeout}}'
      - name: HPC_MAX_CONTINUATIONS
        value: '5'
      - name: KAOS_STEP_CONTEXT
        value: '{{inputs.parameters.kaos-context}}'
      terminationMessagePolicy: FallbackToLogsOnError
    serviceAccountName: hpc-submitter
  arguments:
    parameters:
    - name: pipeline-info
      value: "The defaults run as they are: press Submit.\nEach step has a class (the\
        \ machine it runs on) and a time limit (the longest it may run, as minutes\
        \ or hours). Only a step that declares gpu=True is offered the GPU classes.\n\
        Machine classes:\n  - cpu-standard (cpu) — n2-standard-8\n  - kubecorecpu\
        \ (cpu) — e2-standard-8\n  - gpu-t4 (gpu) — n1-standard-8 + 1x nvidia-tesla-t4\n\
        HPC (Slurm) classes: pick one in a step's class field and the step runs there\
        \ as a job. Queue time applies; the step's time limit is the job's limit.\
        \ Classes:\n  - meluxina-gpu (gpu) — partition gpu, 4 GPUs, 128 cores, 512\
        \ GiB — 4x A100-40GB, 2x EPYC 7452, 512 GB\n  - meluxina-cpu (cpu) — partition\
        \ cpu, 128 cores, 512 GiB — 2x EPYC 7452, 128 cores, 512 GB\n  - meluxina-largemem\
        \ (cpu) — partition largemem, 128 cores, 4096 GiB — 4 TB\nSteps: dataset-loading\
        \ -> hello-world"
      description: How to fill this form.
    - name: experiment-name
      description: experiment name (used for tracking + artifact path prefixes)
      value: my-experiment-v1
    - name: experiment-description
      description: optional free text stored with the run
      value: ''
    - name: src
      description: 'One of: lake, local.'
      value: lake
      enum:
      - lake
      - local
    - name: dataset
      description: ''
      value: dataset-default@latest
    - name: dataset-loading-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      description: 'The machine class the ''dataset-loading'' step runs on. Default:
        cpu-standard.'
    - name: dataset-loading-walltime
      value: 4h
      description: 'The longest the step may run, as minutes or hours: 90m, 12h. Default
        from pipeline.py.'
    - name: hello-world-class
      value: cpu-standard
      enum:
      - cpu-standard
      - kubecorecpu
      - meluxina-cpu
      - meluxina-largemem
      description: 'The machine class the ''hello-world'' step runs on. Default: cpu-standard.
        Classes that start with ''meluxina-'' run the step as a job on HPC (Slurm):
        queue time applies.'
    - name: hello-world-walltime
      value: 4h
      description: 'The longest the step may run, as minutes or hours: 90m, 12h. Default
        from pipeline.py.'
    - name: reuse-from-run
      value: ''
      description: Optional. The name of an earlier run of this app. Steps before
        the step below are not run again; their results and outputs are taken from
        that run. Leave empty for a normal run.
    - name: start-from-step
      value: ''
      description: 'Optional. The step to run first; it and every step after it run
        again. Needs the earlier run above. Steps: dataset-loading, hello-world.'
    - name: promote-loaded
      value: 'false'
      enum:
      - 'false'
      - 'true'
      description: Make this run's version of loaded the one other pipelines read
        as latest.
    - name: config
      description: Extra settings for this run, as YAML. They replace the values above.
      value: ''
  serviceAccountName: argo-workflow
  ttlStrategy:
    secondsAfterSuccess: 3024000
    secondsAfterFailure: 3024000
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 168h
  workflowMetadata:
    labels:
      platform.kubecore.io/engine: 0.9.9
