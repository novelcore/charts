# Custom values for kaos-dev EKS cluster deployment
# Cluster: kaos-dev-eks
# Region: eu-central-1
# Cluster ID: AF009732404FA9DE00D7C06126A0DD0B

controllerManager:
  container:
    image:
      repository: novelcore.azurecr.io/kubecore/kubecore-operator
      tag: v0.1.25
      pullPolicy: IfNotPresent
    # Environment variables configured for kaos-dev cluster
    env:
      EKS_CLUSTER_ID: "AF009732404FA9DE00D7C06126A0DD0B"
      EKS_REGION: "eu-central-1"
      KUBERNETES_PROVIDER_CONFIG: "kubesys-enhanced"

# Enable all core components
rbac:
  enable: true

crd:
  enable: true
  keep: true

metrics:
  enable: true

prometheus:
  enable: false

certmanager:
  enable: false

networkPolicy:
  enable: false

# Registry configuration for private ACR access
registry:
  url: "novelcore.azurecr.io"
  username: "novelcore"  # TODO: Add ACR username
  password: "qdqz01rTFd5gTO2CQv9vyQS19mle7fJINN7raEClhq+ACRDpPMjb"  # TODO: Add ACR password
  project: "kubecore"
  createImagePullSecret: true
  imagePullSecretName: "kubecore-operator-registry-secret"

# Crossplane Configuration
# NOTE: Crossplane is installed separately in crossplane-system namespace
# via the installation script
crossplane:
  enabled: false
  namespace: crossplane-system

# External Secrets Operator Configuration
# NOTE: External Secrets Operator is installed separately
# via the installation script
externalSecrets:
  enabled: false

# Crossplane Functions Configuration
# NOTE: Functions are installed separately in crossplane-system namespace
# via the installation script
crossplaneFunctions:
  enabled: false

# Crossplane Providers Configuration
# NOTE: Providers and ProviderConfigs are installed separately in crossplane-system namespace
# via the installation script
crossplaneProviders:
  enabled: false

# Enable Crossplane XRDs
# These are installed as part of the operator chart since they define the APIs
crossplaneXRDs:
  enabled: true

# Enable Crossplane Compositions
# These are installed as part of the operator chart and implement the infrastructure logic
crossplaneCompositions:
  enabled: true
