apiVersion: v2
name: kubecore-operator
description: A sophisticated Kubernetes operator that implements a four-layer framework architecture for provisioning and managing cloud infrastructure through Crossplane compositions.
type: application
version: 0.1.8
appVersion: "0.1.1"

# Maintainers
maintainers:
- name: Novelcore Platform Team
  email: platform@novelcore.io

# Keywords for chart discovery
keywords:
- kubernetes
- operator
- crossplane
- infrastructure
- gitops
- platform
- kubecore
- infrastructure-as-code

# Home page
home: https://github.com/novelcore/kubecore-operator

# Source code
sources:
- https://github.com/novelcore/kubecore-operator

# Icon
icon: "https://github.com/novelcore/kubecore-operator/raw/main/docs/icon.png"

# Annotations for additional metadata
annotations:
  # Category for Artifact Hub
  artifacthub.io/category: automation
  artifacthub.io/license: Apache-2.0
  
  # Links for Artifact Hub
  artifacthub.io/links: |
    - name: GitHub Repository
      url: https://github.com/novelcore/kubecore-operator
    - name: Documentation
      url: https://github.com/novelcore/kubecore-operator/blob/main/README.md
    - name: Release Notes
      url: https://github.com/novelcore/kubecore-operator/releases

  # Changes for this chart version
  artifacthub.io/changes: |
    - kind: fixed
      description: "Added missing cluster-wide secrets read permissions (get, list, watch) to operator ClusterRole - fixes RBAC errors preventing operator from accessing GitHub credentials"
    - kind: security
      description: "Operator now has explicit secrets permissions instead of failing silently due to missing RBAC"
    - kind: changed
      description: "BREAKING: Crossplane providers, functions, and ProviderConfigs moved out of operator chart - now installed separately in crossplane-system namespace via installation script"
    - kind: changed
      description: "BREAKING: External Secrets Operator moved out of operator chart - now installed separately via installation script"
    - kind: added
      description: "Added comprehensive installation script (install-kubecore-operator.sh) that orchestrates complete platform deployment with proper namespace separation"
    - kind: changed
      description: "Operator chart now only installs operator deployment and XRDs - all Crossplane/ESO components must be installed separately for proper namespace isolation"

# Kubernetes version compatibility
kubeVersion: ">=1.20.0-0"

# Dependencies
dependencies:
- name: crossplane
  version: "2.1.0"
  repository: "https://charts.crossplane.io/stable"
  condition: crossplane.enabled
- name: external-secrets
  version: "1.0.0"
  repository: "https://charts.external-secrets.io"
  condition: externalSecrets.enabled
