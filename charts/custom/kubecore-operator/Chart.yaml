apiVersion: v2
name: kubecore-operator
description: A sophisticated Kubernetes operator that implements a four-layer framework architecture for provisioning and managing cloud infrastructure through Crossplane compositions.
type: application
version: 0.1.5
appVersion: "0.1.1"

# Maintainers
maintainers:
- name: Novelcore Platform Team
  email: platform@novelcore.io

# Keywords for chart discovery
keywords:
- kubernetes
- operator
- crossplane
- infrastructure
- gitops
- platform
- kubecore
- infrastructure-as-code

# Home page
home: https://github.com/novelcore/kubecore-operator

# Source code
sources:
- https://github.com/novelcore/kubecore-operator

# Icon
icon: "https://github.com/novelcore/kubecore-operator/raw/main/docs/icon.png"

# Annotations for additional metadata
annotations:
  # Category for Artifact Hub
  artifacthub.io/category: automation
  artifacthub.io/license: Apache-2.0
  
  # Links for Artifact Hub
  artifacthub.io/links: |
    - name: GitHub Repository
      url: https://github.com/novelcore/kubecore-operator
    - name: Documentation
      url: https://github.com/novelcore/kubecore-operator/blob/main/README.md
    - name: Release Notes
      url: https://github.com/novelcore/kubecore-operator/releases

  # Changes for this chart version
  artifacthub.io/changes: |
    - kind: added
      description: "Added 12 Crossplane XRD definitions for KubeCore platform compositions (XAWSProvider, XGitHubProvider, XAWSNetwork, XEKS, XKubeSystem, XGitHubProject, XKubEnv, XGitHubApp, XK8sApp, XKubeAppTemplate, XQualityGateInstance, XQualityGateTemplate)"
    - kind: fixed
      description: "Fixed kubesys-admin ServiceAccount creation in release namespace (kubecore-system) to fix provider-kubernetes pod failures"
    - kind: fixed
      description: "Added duplicate kubesys-admin ServiceAccount in crossplane-system namespace for backward compatibility"
    - kind: fixed
      description: "Removed Helm hooks from ProviderConfigs to fix Kubernetes ProviderConfig creation timing issue - ProviderConfigs now created as regular resources after provider CRDs are available"
    - kind: changed
      description: "XRDs now installed with hook weight 0 to ensure they're available before all other Crossplane resources"
    - kind: changed
      description: "Updated hook execution order: XRDs (weight 0), RuntimeConfig (weight 5), Functions (weight 10), Providers (weight 15)"

# Kubernetes version compatibility
kubeVersion: ">=1.20.0-0"

# Dependencies
dependencies:
- name: crossplane
  version: "2.1.0"
  repository: "https://charts.crossplane.io/stable"
  condition: crossplane.enabled
- name: external-secrets
  version: "1.0.0"
  repository: "https://charts.external-secrets.io"
  condition: externalSecrets.enabled
