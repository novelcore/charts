---
# Kubernetes ProviderConfig
# Uses InjectedIdentity to authenticate with the cluster where the provider pod is running
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: kubesys-enhanced
spec:
  credentials:
    source: InjectedIdentity
---
# AWS ProviderConfig
# Uses AWS credentials stored in a Secret
# NOTE: You must create the aws-secret in crossplane-system namespace before applying this
# Example:
#   kubectl create secret generic aws-secret \
#     --from-file=credentials=~/.aws/credentials \
#     --namespace crossplane-system
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: aws-default
spec:
  credentials:
    secretRef:
      key: credentials
      name: aws-secret
      namespace: crossplane-system
    source: Secret
