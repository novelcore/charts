apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: clusteroperators
  labels:
    platform.kubecore.io/type: clusteroperators
    provider: helm
    service: cluster-operators
    layer: platform
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: platform.kubecore.io/v1alpha1
    kind: XClusterOperators
  mode: Pipeline
  pipeline:

  - step: load-environment-configs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Selector
          selector:
            matchLabels:
            - key: platform.kubecore.io/cluster-name
              type: FromCompositeFieldPath
              valueFromFieldPath: spec.clusterRef.name
            - key: platform.kubecore.io/type
              type: Value
              value: cluster-operators-config

  - step: generate-operator-resources
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $name := .observed.composite.resource.metadata.name -}}
          {{- $spec := .observed.composite.resource.spec -}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found. Ensure EnvironmentConfig exists with label platform.kubecore.io/cluster-name matching this XClusterOperators clusterRef.name" -}}
          {{- end -}}
          {{- if $envConfig.clusterName -}}
            {{- if ne $envConfig.clusterName $spec.clusterRef.name -}}
              {{- fail (printf "EnvironmentConfig cluster name '%s' does not match XClusterOperators clusterRef.name '%s'" $envConfig.clusterName $spec.clusterRef.name) -}}
            {{- end -}}
          {{- end -}}
          {{- $clusterName := $spec.clusterRef.name -}}
          {{- $providerConfigs := $envConfig.providerConfigs -}}
          {{- $helmProvider := $providerConfigs.helm | default (printf "%s-eks-helm" $clusterName) -}}
          {{- $k8sProvider := $providerConfigs.kubernetes | default (printf "%s-eks-kubernetes" $clusterName) -}}
          {{- $postgresEnabled := $spec.operators.postgres | default false -}}
          {{- $nvidiaGpuEnabled := $spec.operators.nvidiaGpu | default false -}}
          {{- $karpenterEnabled := $spec.operators.karpenter | default false -}}
          {{/* ML stack is always per KubeProject environment; XClusterOperators only installs CNPG operator. */}}
          {{/* Inherit scheduling from XKubeSystem (same nodeSelector, tolerations, affinity) */}}
          {{- $runtime := $envConfig.runtime | default dict -}}
          {{- $nodeSelector := $runtime.nodeSelector | default dict -}}
          {{- $tolerations := $runtime.tolerations | default list -}}
          {{- $affinity := $runtime.affinity | default dict -}}
          {{- $commonLabels := dict
            "platform.kubecore.io/system" $name
            "platform.kubecore.io/cluster" (printf "%s-eks" $clusterName)
            "platform.kubecore.io/managed-by" "crossplane"
            "platform.kubecore.io/composition" "clusteroperators"
            "crossplane.io/composite" $name
          -}}
          {{- $pgClusterName := printf "%s-pg" $clusterName -}}
          {{- $pgSecretName := printf "%s-pg-mlflow-credentials" $clusterName -}}

          {{/* AWS + OIDC variables for IRSA role creation */}}
          {{- $awsConfig := $envConfig.aws | default dict -}}
          {{- $accountId := $awsConfig.accountId | default "" -}}
          {{- $awsProvider := $awsConfig.providerConfig | default "aws-default" -}}
          {{- $oidcConfig := $envConfig.oidc | default dict -}}
          {{- $oidcClusterId := $oidcConfig.clusterId | default "" -}}
          {{- $oidcRegion := $oidcConfig.region | default ($envConfig.region | default "") -}}
          {{- $oidcHostPath := printf "oidc.eks.%s.amazonaws.com/id/%s" $oidcRegion $oidcClusterId -}}
          {{- $oidcProviderArn := printf "arn:aws:iam::%s:oidc-provider/%s" $accountId $oidcHostPath -}}

          {{/* Namespace for CNPG operator when Postgres operator is enabled */}}
          {{- if $postgresEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-ns-cnpg-system
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ns-cnpg-system
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: cnpg-system
          {{- end }}

          {{/* CloudNativePG operator (Helm) - same scheduling as XKubeSystem */}}
          {{- if $postgresEnabled }}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-cnpg-operator
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cnpg-operator
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "cnpg-operator"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              wait: true
              waitTimeout: "5m"
              chart:
                name: cloudnative-pg
                repository: https://cloudnative-pg.github.io/charts
                version: "0.27.1"
              namespace: cnpg-system
              values:
                nodeSelector:
                  {{- range $key, $value := $nodeSelector }}
                  {{ $key }}: {{ $value | quote }}
                  {{- end }}
                tolerations:
                  {{- range $toleration := $tolerations }}
                  - key: {{ $toleration.key | quote }}
                    operator: {{ $toleration.operator | default "Equal" | quote }}
                    {{- if $toleration.value }}
                    value: {{ $toleration.value | quote }}
                    {{- end }}
                    {{- if $toleration.effect }}
                    effect: {{ $toleration.effect | quote }}
                    {{- end }}
                    {{- if $toleration.tolerationSeconds }}
                    tolerationSeconds: {{ $toleration.tolerationSeconds }}
                    {{- end }}
                  {{- end }}
                {{- if $affinity }}
                affinity: {{ $affinity | toJson }}
                {{- end }}

          {{/* Barman Cloud CNPG-I plugin for S3/object-store backups.
               Requires the CNPG operator to be installed first (CRDs + cert-manager certs).
               Gate on cnpg-operator being observed and ready to enforce ordering. */}}
          {{- if and (hasKey .observed.resources "cnpg-operator") (dig "cnpg-operator" "ready" false .observed.resources) }}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-cnpg-barman-cloud
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cnpg-barman-cloud
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "cnpg-barman-cloud"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              wait: true
              waitTimeout: "5m"
              chart:
                name: plugin-barman-cloud
                repository: https://cloudnative-pg.github.io/charts
                version: "0.5.0"
              namespace: cnpg-system
              values:
                nodeSelector:
                  {{- range $key, $value := $nodeSelector }}
                  {{ $key }}: {{ $value | quote }}
                  {{- end }}
                tolerations:
                  {{- range $toleration := $tolerations }}
                  - key: {{ $toleration.key | quote }}
                    operator: {{ $toleration.operator | default "Equal" | quote }}
                    {{- if $toleration.value }}
                    value: {{ $toleration.value | quote }}
                    {{- end }}
                    {{- if $toleration.effect }}
                    effect: {{ $toleration.effect | quote }}
                    {{- end }}
                    {{- if $toleration.tolerationSeconds }}
                    tolerationSeconds: {{ $toleration.tolerationSeconds }}
                    {{- end }}
                  {{- end }}
                {{- if $affinity }}
                affinity: {{ $affinity | toJson }}
                {{- end }}
          {{- end }}
          {{- end }}

          {{/* No shared Postgres or ML namespaces here; ML stacks are per KubeProject environment. */}}

          {{/* Namespace for NVIDIA GPU Operator when nvidiaGpu is enabled */}}
          {{- if $nvidiaGpuEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-ns-gpu-operator
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ns-gpu-operator
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: gpu-operator
          {{- end }}

          {{/* NVIDIA GPU Operator (Helm) - operator pod on system nodes, DaemonSets auto-target GPU nodes */}}
          {{- if $nvidiaGpuEnabled }}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-nvidia-gpu-operator
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: nvidia-gpu-operator
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "nvidia-gpu-operator"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              wait: true
              waitTimeout: "10m"
              chart:
                name: gpu-operator
                repository: https://helm.ngc.nvidia.com/nvidia
                version: "v24.9.2"
              namespace: gpu-operator
              values:
                driver:
                  enabled: false
                toolkit:
                  enabled: true
                devicePlugin:
                  enabled: true
                dcgmExporter:
                  enabled: true
                migManager:
                  enabled: false
                gfd:
                  enabled: true
                nodeStatusExporter:
                  enabled: true
                operator:
                  defaultRuntime: containerd
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: {{ $value | quote }}
                    {{- end }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: {{ $toleration.key | quote }}
                      operator: {{ $toleration.operator | default "Equal" | quote }}
                      {{- if $toleration.value }}
                      value: {{ $toleration.value | quote }}
                      {{- end }}
                      {{- if $toleration.effect }}
                      effect: {{ $toleration.effect | quote }}
                      {{- end }}
                      {{- if $toleration.tolerationSeconds }}
                      tolerationSeconds: {{ $toleration.tolerationSeconds }}
                      {{- end }}
                    {{- end }}
                  {{- if $affinity }}
                  affinity: {{ $affinity | toJson }}
                  {{- end }}
                node-feature-discovery:
                  master:
                    nodeSelector:
                      {{- range $key, $value := $nodeSelector }}
                      {{ $key }}: {{ $value | quote }}
                      {{- end }}
                    tolerations:
                      {{- range $toleration := $tolerations }}
                      - key: {{ $toleration.key | quote }}
                        operator: {{ $toleration.operator | default "Equal" | quote }}
                        {{- if $toleration.value }}
                        value: {{ $toleration.value | quote }}
                        {{- end }}
                        {{- if $toleration.effect }}
                        effect: {{ $toleration.effect | quote }}
                        {{- end }}
                      {{- end }}
                  gc:
                    nodeSelector:
                      {{- range $key, $value := $nodeSelector }}
                      {{ $key }}: {{ $value | quote }}
                      {{- end }}
                    tolerations:
                      {{- range $toleration := $tolerations }}
                      - key: {{ $toleration.key | quote }}
                        operator: {{ $toleration.operator | default "Equal" | quote }}
                        {{- if $toleration.value }}
                        value: {{ $toleration.value | quote }}
                        {{- end }}
                        {{- if $toleration.effect }}
                        effect: {{ $toleration.effect | quote }}
                        {{- end }}
                      {{- end }}
                  worker:
                    tolerations:
                      - key: "nvidia.com/gpu"
                        operator: "Exists"
                        effect: "NoSchedule"
          {{- end }}

          {{/* ── Karpenter node autoscaler ── */}}
          {{- if $karpenterEnabled }}
          {{- $karpenterConfig := $envConfig.karpenter | default dict -}}
          {{- $karpenterControllerRoleArn := $karpenterConfig.controllerRoleArn | default "" -}}
          {{- if and (not $karpenterControllerRoleArn) $accountId -}}
            {{- $karpenterControllerRoleArn = printf "arn:aws:iam::%s:role/%s-eks-karpenter-controller" $accountId $clusterName -}}
          {{- end -}}
          {{- $karpenterNodeRoleName := printf "%s-eks-karpenter-node" $clusterName -}}
          {{- $clusterEndpoint := $envConfig.clusterEndpoint | default "" -}}

          {{/* ── Karpenter Controller IAM Role (IRSA) ── */}}
          {{- if and $accountId $oidcClusterId }}
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Role
          metadata:
            name: {{ $clusterName }}-eks-karpenter-controller
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: karpenter-controller-role
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/resource-type: iam-role
              platform.kubecore.io/role-type: karpenter-controller
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              description: "Karpenter controller IRSA role for {{ $clusterName }}"
              assumeRolePolicy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "Federated": "{{ $oidcProviderArn }}"
                      },
                      "Action": "sts:AssumeRoleWithWebIdentity",
                      "Condition": {
                        "StringEquals": {
                          "{{ $oidcHostPath }}:aud": "sts.amazonaws.com",
                          "{{ $oidcHostPath }}:sub": "system:serviceaccount:kube-system:karpenter"
                        }
                      }
                    }
                  ]
                }
              tags:
                Name: "{{ $clusterName }}-eks-karpenter-controller"
                Cluster: "{{ $clusterName }}"
                Purpose: "Karpenter Controller IRSA Role"
                ManagedBy: "crossplane"

          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: RolePolicy
          metadata:
            name: {{ $clusterName }}-eks-karpenter-controller-policy
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: karpenter-controller-policy
              crossplane.io/external-name: karpenter-controller-policy
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              roleRef:
                name: {{ $clusterName }}-eks-karpenter-controller
              policy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Sid": "Karpenter",
                      "Effect": "Allow",
                      "Action": [
                        "ssm:GetParameter",
                        "ec2:DescribeImages",
                        "ec2:RunInstances",
                        "ec2:DescribeSubnets",
                        "ec2:DescribeSecurityGroups",
                        "ec2:DescribeLaunchTemplates",
                        "ec2:DescribeInstances",
                        "ec2:DescribeInstanceTypes",
                        "ec2:DescribeInstanceTypeOfferings",
                        "ec2:DescribeAvailabilityZones",
                        "ec2:DeleteLaunchTemplate",
                        "ec2:CreateTags",
                        "ec2:CreateLaunchTemplate",
                        "ec2:CreateFleet",
                        "ec2:DescribeSpotPriceHistory",
                        "pricing:GetProducts"
                      ],
                      "Resource": "*",
                      "Condition": {
                        "StringEquals": {
                          "aws:RequestedRegion": "{{ $oidcRegion }}"
                        }
                      }
                    },
                    {
                      "Sid": "ConditionalEC2Termination",
                      "Effect": "Allow",
                      "Action": "ec2:TerminateInstances",
                      "Resource": "*",
                      "Condition": {
                        "StringLike": {
                          "ec2:ResourceTag/karpenter.sh/nodepool": "*"
                        }
                      }
                    },
                    {
                      "Sid": "PassNodeIAMRole",
                      "Effect": "Allow",
                      "Action": "iam:PassRole",
                      "Resource": "arn:aws:iam::{{ $accountId }}:role/{{ $karpenterNodeRoleName }}"
                    },
                    {
                      "Sid": "EKSClusterEndpointLookup",
                      "Effect": "Allow",
                      "Action": "eks:DescribeCluster",
                      "Resource": "arn:aws:eks:{{ $oidcRegion }}:{{ $accountId }}:cluster/{{ $clusterName }}-eks"
                    },
                    {
                      "Sid": "InstanceProfileManagement",
                      "Effect": "Allow",
                      "Action": [
                        "iam:CreateInstanceProfile",
                        "iam:TagInstanceProfile",
                        "iam:AddRoleToInstanceProfile",
                        "iam:RemoveRoleFromInstanceProfile",
                        "iam:DeleteInstanceProfile",
                        "iam:GetInstanceProfile",
                        "iam:ListInstanceProfiles"
                      ],
                      "Resource": "*"
                    },
                    {
                      "Sid": "AllowScopedSQS",
                      "Effect": "Allow",
                      "Action": [
                        "sqs:DeleteMessage",
                        "sqs:GetQueueUrl",
                        "sqs:ReceiveMessage",
                        "sqs:GetQueueAttributes"
                      ],
                      "Resource": "arn:aws:sqs:{{ $oidcRegion }}:{{ $accountId }}:{{ $clusterName }}-eks*"
                    }
                  ]
                }

          {{/* ── Karpenter Node IAM Role ── */}}
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Role
          metadata:
            name: {{ $karpenterNodeRoleName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: karpenter-node-role
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/resource-type: iam-role
              platform.kubecore.io/role-type: karpenter-node
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              description: "Karpenter node role for {{ $clusterName }} - EC2 instances launched by Karpenter"
              assumeRolePolicy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "Service": "ec2.amazonaws.com"
                      },
                      "Action": "sts:AssumeRole"
                    }
                  ]
                }
              tags:
                Name: "{{ $karpenterNodeRoleName }}"
                Cluster: "{{ $clusterName }}"
                Purpose: "Karpenter Node Role"
                ManagedBy: "crossplane"

          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: RolePolicyAttachment
          metadata:
            name: {{ $karpenterNodeRoleName }}-worker
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: karpenter-node-worker-policy
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              policyArn: "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy"
              roleRef:
                name: {{ $karpenterNodeRoleName }}

          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: RolePolicyAttachment
          metadata:
            name: {{ $karpenterNodeRoleName }}-cni
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: karpenter-node-cni-policy
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              policyArn: "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy"
              roleRef:
                name: {{ $karpenterNodeRoleName }}

          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: RolePolicyAttachment
          metadata:
            name: {{ $karpenterNodeRoleName }}-ecr
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: karpenter-node-ecr-policy
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              policyArn: "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
              roleRef:
                name: {{ $karpenterNodeRoleName }}

          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: RolePolicyAttachment
          metadata:
            name: {{ $karpenterNodeRoleName }}-ssm
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: karpenter-node-ssm-policy
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              policyArn: "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
              roleRef:
                name: {{ $karpenterNodeRoleName }}

          {{/* ── EKS Access Entry for Karpenter nodes ── */}}
          ---
          apiVersion: eks.aws.upbound.io/v1beta1
          kind: AccessEntry
          metadata:
            name: {{ $karpenterNodeRoleName }}-access
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: karpenter-node-access-entry
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/resource-type: eks-access-entry
              platform.kubecore.io/role-type: karpenter-node
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              region: {{ $oidcRegion }}
              clusterName: {{ $clusterName }}-eks
              principalArn: arn:aws:iam::{{ $accountId }}:role/{{ $karpenterNodeRoleName }}
              type: EC2_LINUX
          {{- end }}

          {{/* Karpenter Helm Release — installs into kube-system (best practice) */}}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-karpenter
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: karpenter
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "karpenter"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              wait: true
              waitTimeout: "10m"
              chart:
                name: karpenter
                repository: oci://public.ecr.aws/karpenter
                version: "1.9.0"
              namespace: kube-system
              values:
                settings:
                  clusterName: {{ $clusterName }}-eks
                  clusterEndpoint: {{ $clusterEndpoint }}
                  eksControlPlane: true
                serviceAccount:
                  name: karpenter
                  annotations:
                    {{- if $karpenterControllerRoleArn }}
                    eks.amazonaws.com/role-arn: {{ $karpenterControllerRoleArn }}
                    {{- end }}
                nodeSelector:
                  kubernetes.io/os: linux
                  {{- range $key, $value := $nodeSelector }}
                  {{ $key }}: {{ $value | quote }}
                  {{- end }}
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: karpenter.sh/nodepool
                              operator: DoesNotExist
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - topologyKey: kubernetes.io/hostname
                tolerations:
                  - key: CriticalAddonsOnly
                    operator: Exists
                  {{- range $toleration := $tolerations }}
                  - key: {{ $toleration.key | quote }}
                    operator: {{ $toleration.operator | default "Equal" | quote }}
                    {{- if $toleration.value }}
                    value: {{ $toleration.value | quote }}
                    {{- end }}
                    {{- if $toleration.effect }}
                    effect: {{ $toleration.effect | quote }}
                    {{- end }}
                  {{- end }}
          {{/* ── Cluster-level NodePools + EC2NodeClasses ── */}}
          {{/* GPU NodePool — shared by all ML pipelines, nodes only launched on-demand */}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
