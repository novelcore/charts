---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: kubenv
  labels:
    platform.kubecore.io/type: kubenv
    provider: kubernetes
    service: environment
    layer: platform
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: platform.kubecore.io/v1alpha1
    kind: XKubEnv
  mode: Pipeline
  pipeline:

  # Step 1: Load EnvironmentConfig with labels
  - step: load-environment-configs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Selector
          selector:
            matchLabels:
            # PRIMARY: Select by exact kubenv name (XKubEnv resource name)
            - key: platform.kubecore.io/kubenv-name
              type: FromCompositeFieldPath
              valueFromFieldPath: metadata.name
            # SECONDARY: Ensure it belongs to the correct kubeproject
            - key: kubecore.io/kubeproject
              type: FromCompositeFieldPath
              valueFromFieldPath: metadata.labels["kubecore.io/kubeproject"]
            # TERTIARY: Ensure it's a kubenv config type
            - key: platform.kubecore.io/type
              type: Value
              value: kubenv-config

  # Step 2: Generate All Environment Resources (Consolidated)
  - step: generate-environment-resources
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $envName := $xr.metadata.name -}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found" -}}
          {{- end -}}

          {{/* Validate configuration */}}
          {{- if not $envConfig.nodeRoleArn -}}
            {{- fail "CRITICAL: nodeRoleArn not found in EnvironmentConfig" -}}
          {{- end -}}
          {{- if not $envConfig.primaryRegion -}}
            {{- fail "CRITICAL: primaryRegion not found in EnvironmentConfig" -}}
          {{- end -}}
          {{- if not $envConfig.clusterPrivateSubnets -}}
            {{- fail "CRITICAL: clusterPrivateSubnets not found in EnvironmentConfig" -}}
          {{- end -}}

          {{/* Provider configurations */}}
          {{- $kubeProviderConfig := (default "kubernetes-default" $xr.spec.providerConfigRef.kubernetes) -}}
          {{- $awsProviderConfig := (default "aws-default" $xr.spec.providerConfigRef.aws) -}}
          {{- $multiAZ := (default false $xr.spec.nodeGroup.multiAZ) -}}
          {{- $ngName := printf "%s-ng" $envName -}}

          {{/* Subnet configurations - Use cluster's registered private subnets */}}
          {{- $selectedSubnets := list -}}
          {{- if $multiAZ -}}
            {{/* Multi-AZ: Use all cluster private subnets */}}
            {{- $selectedSubnets = $envConfig.clusterPrivateSubnets -}}
          {{- else -}}
            {{/* Single-AZ: Use primary region's first AZ (region + 'a') */}}
            {{- $targetAZ := printf "%sa" $envConfig.primaryRegion -}}
            {{- range $envConfig.clusterPrivateSubnets -}}
              {{- if eq .availabilityZone $targetAZ -}}
                {{- $selectedSubnets = append $selectedSubnets . -}}
                {{- break -}}
              {{- end -}}
            {{- end -}}
            {{/* Fallback: Use first available subnet if target AZ not found */}}
            {{- if not $selectedSubnets -}}
              {{- if $envConfig.clusterPrivateSubnets -}}
                {{- $selectedSubnets = list (index $envConfig.clusterPrivateSubnets 0) -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}

          {{/* Validate subnet selection */}}
          {{- if not $selectedSubnets -}}
            {{- $availableAZs := list -}}
            {{- range $envConfig.clusterPrivateSubnets -}}
              {{- $availableAZs = append $availableAZs .availabilityZone -}}
            {{- end -}}
            {{- fail (printf "No subnets selected for NodeGroup. MultiAZ: %t, Target: %sa, Available AZs: %v" $multiAZ $envConfig.primaryRegion $availableAZs) -}}
          {{- end -}}

          # DEBUG: Generating resources for {{ $envName }}
          # MultiAZ: {{ $multiAZ }}, Selected: {{ len $selectedSubnets }} subnets
          {{- if not $multiAZ }}
          # Target AZ: {{ $envConfig.primaryRegion }}a, Selected: {{ (index $selectedSubnets 0).availabilityZone }} ({{ (index $selectedSubnets 0).subnetId }})
          {{- end }}

          # 1. NAMESPACE - Kubernetes namespace for environment
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: {{ $envName }}-namespace
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: namespace
            labels:
              platform.kubecore.io/kubenv: {{ $envName }}
              platform.kubecore.io/part-of: environment
              platform.kubecore.io/component: namespace
          spec:
            providerConfigRef:
              name: {{ $kubeProviderConfig }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $envName }}
                  labels:
                    platform.kubecore.io/kubenv: {{ $envName }}
                    platform.kubecore.io/eks-cluster: {{ $xr.spec.eksClusterName }}
                    platform.kubecore.io/part-of: environment
                    platform.kubecore.io/component: namespace
                  annotations:
                    kubecore.io/created-by: crossplane-kubenv

          {{/* 2. OPTIONAL: ResourceQuota if enabled */}}
          {{- if $xr.spec.features.resourceQuota -}}
          {{- $resourceProfile := (default "small" $xr.spec.resourceProfile) -}}
          {{- $quotaConfig := index $envConfig.resourceProfiles $resourceProfile -}}
          {{- if $quotaConfig -}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: {{ $envName }}-resourcequota
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: resourcequota
            labels:
              platform.kubecore.io/kubenv: {{ $envName }}
              platform.kubecore.io/part-of: environment
              platform.kubecore.io/component: quota
          spec:
            providerConfigRef:
              name: {{ $kubeProviderConfig }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: ResourceQuota
                metadata:
                  name: {{ $envName }}-quota
                  namespace: {{ $envName }}
                spec:
                  hard:
                    requests.cpu: {{ $quotaConfig.quota.cpu }}
                    requests.memory: {{ $quotaConfig.quota.memory }}
                    limits.cpu: {{ $quotaConfig.quota.cpu }}
                    limits.memory: {{ $quotaConfig.quota.memory }}
          {{- end -}}
          {{- end -}}

          {{/* 3. OPTIONAL: LimitRange if enabled */}}
          {{- if $xr.spec.features.limitRange -}}
          {{- $resourceProfile := (default "small" $xr.spec.resourceProfile) -}}
          {{- $limitConfig := index $envConfig.resourceProfiles $resourceProfile -}}
          {{- if $limitConfig -}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: {{ $envName }}-limitrange
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: limitrange
            labels:
              platform.kubecore.io/kubenv: {{ $envName }}
              platform.kubecore.io/part-of: environment
              platform.kubecore.io/component: limits
          spec:
            providerConfigRef:
              name: {{ $kubeProviderConfig }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: LimitRange
                metadata:
                  name: {{ $envName }}-limits
                  namespace: {{ $envName }}
                spec:
                  limits:
                  - type: Container
                    default:
                      cpu: {{ $limitConfig.limits.defaultCpu }}
                      memory: {{ $limitConfig.limits.defaultMemory }}
                    defaultRequest:
                      cpu: {{ $limitConfig.limits.defaultCpu }}
                      memory: {{ $limitConfig.limits.defaultMemory }}
          {{- end -}}
          {{- end -}}


          {{/* 4. EKS NODEGROUP - Create dedicated compute using cluster-registered subnets */}}
          ---
          apiVersion: eks.aws.upbound.io/v1beta2
          kind: NodeGroup
          metadata:
            name: {{ $ngName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: nodegroup
            labels:
              platform.kubecore.io/kubenv: {{ $envName }}
              platform.kubecore.io/eks-cluster: {{ $xr.spec.eksClusterName }}
              platform.kubecore.io/part-of: environment
              platform.kubecore.io/component: nodegroup
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $awsProviderConfig }}
            initProvider:
              scalingConfig:
                desiredSize: {{ $xr.spec.nodeGroup.scalingConfig.desiredSize }}
            forProvider:
              region: {{ $envConfig.primaryRegion }}
              clusterName: {{ $xr.spec.eksClusterName }}
              nodeRoleArn: {{ $envConfig.nodeRoleArn }}
              instanceTypes:
              - {{ $xr.spec.nodeGroup.instanceType }}
              scalingConfig:
                minSize: {{ $xr.spec.nodeGroup.scalingConfig.minSize }}
                maxSize: {{ $xr.spec.nodeGroup.scalingConfig.maxSize }}
              diskSize: {{ $xr.spec.nodeGroup.diskSize }}
              capacityType: {{ $xr.spec.nodeGroup.capacityType }}
              {{- if $xr.spec.features.nodeGroupTaints }}
              taint:
              - key: platform.kubecore.io/kubenv
                value: {{ $envName }}
                effect: NO_SCHEDULE
              {{- end }}
              subnetIds:
              {{- range $selectedSubnets }}
              - {{ .subnetId }}
              {{- end }}
              labels:
                platform.kubecore.io/kubenv: {{ $envName }}
                platform.kubecore.io/environment-type: development
                platform.kubecore.io/eks-cluster: {{ $xr.spec.eksClusterName }}
              tags:
                Name: {{ $ngName }}
                Cluster: {{ $xr.spec.eksClusterName }}
                KubEnv: {{ $envName }}
                Environment: {{ $envName }}
                kubernetes.io/cluster/{{ $xr.spec.eksClusterName }}: owned

          # DEBUG: Template generation complete for {{ $envName }}

  # Step 3: Auto-Ready Function - Wait for Critical Resources Only
  - step: auto-ready
    functionRef:
      name: function-auto-ready
    input:
      apiVersion: autoready.fn.crossplane.io/v1beta1
      kind: Input
      waitForAll: true
      requirements:
      # CRITICAL: Must wait for NodeGroup to be ready (uses cluster-registered subnets)
      - matchLabels:
          platform.kubecore.io/component: nodegroup
        ready: true
      # CRITICAL: Must wait for namespace to be ready (workload target)
      - matchLabels:
          platform.kubecore.io/component: namespace
        ready: true

  # Step 4: Extract and populate status fields with scheduling information
  - step: status-transformer
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $envName := $xr.metadata.name -}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}

          {{/* Initialize status variables */}}
          {{- $isReady := true -}}
          {{- $nodeGroupStatus := dict -}}
          {{- $namespaceStatus := dict -}}
          {{- $childResourcesCount := 0 -}}
          {{- $readyResourcesCount := 0 -}}
          {{- $pendingResourcesCount := 0 -}}
          {{- $nodeLabels := dict -}}
          {{- $nodeTaints := list -}}
          {{- $availabilityZones := list -}}
          {{- $subnetIds := list -}}
          {{- $resourceQuotaEnabled := false -}}
          {{- $limitRangeEnabled := false -}}

          {{/* Iterate through observed resources to extract status */}}
          {{- range $resourceName, $resource := .observed.resources -}}
            {{- if $resource.resource -}}
              {{- $childResourcesCount = add $childResourcesCount 1 -}}

              {{/* Check resource readiness */}}
              {{- $resourceReady := false -}}
              {{- if $resource.ready -}}
                {{- $resourceReady = true -}}
                {{- $readyResourcesCount = add $readyResourcesCount 1 -}}
              {{- else if and $resource.resource $resource.resource.status -}}
                {{- if and $resource.resource.status.conditions -}}
                  {{- range $condition := $resource.resource.status.conditions -}}
                    {{- if and (eq $condition.type "Ready") (eq $condition.status "True") -}}
                      {{- $resourceReady = true -}}
                      {{- $readyResourcesCount = add $readyResourcesCount 1 -}}
                    {{- end -}}
                  {{- end -}}
                {{- end -}}
              {{- end -}}

              {{- if not $resourceReady -}}
                {{- $pendingResourcesCount = add $pendingResourcesCount 1 -}}
                {{- if or (eq $resourceName "nodegroup") (eq $resourceName "namespace") -}}
                  {{- $isReady = false -}}
                {{- end -}}
              {{- end -}}

              {{/* Extract NodeGroup information */}}
              {{- if eq $resourceName "nodegroup" -}}
                {{- if eq $resource.resource.kind "NodeGroup" -}}
                  {{- $_ := set $nodeGroupStatus "name" $resource.resource.metadata.name -}}
                  {{- if $resource.resource.spec.forProvider.instanceTypes -}}
                    {{- $_ := set $nodeGroupStatus "instanceType" (index $resource.resource.spec.forProvider.instanceTypes 0) -}}
                  {{- end -}}
                  {{- if $resource.resource.spec.forProvider.capacityType -}}
                    {{- $_ := set $nodeGroupStatus "capacityType" $resource.resource.spec.forProvider.capacityType -}}
                  {{- end -}}
                  {{- if $xr.spec.nodeGroup.multiAZ -}}
                    {{- $_ := set $nodeGroupStatus "multiAZ" true -}}
                  {{- else -}}
                    {{- $_ := set $nodeGroupStatus "multiAZ" false -}}
                  {{- end -}}

                  {{/* Extract scaling configuration */}}
                  {{- if $resource.resource.spec.forProvider.scalingConfig -}}
                    {{- $scaling := dict -}}
                    {{- $_ := set $scaling "desired" $resource.resource.spec.forProvider.scalingConfig.desiredSize -}}
                    {{- $_ := set $scaling "minimum" $resource.resource.spec.forProvider.scalingConfig.minSize -}}
                    {{- $_ := set $scaling "maximum" $resource.resource.spec.forProvider.scalingConfig.maxSize -}}
                    {{- $_ := set $nodeGroupStatus "scaling" $scaling -}}
                  {{- end -}}

                  {{/* Extract node labels */}}
                  {{- if $resource.resource.spec.forProvider.labels -}}
                    {{- range $key, $value := $resource.resource.spec.forProvider.labels -}}
                      {{- $_ := set $nodeLabels $key $value -}}
                    {{- end -}}
                  {{- end -}}

                  {{/* Extract node taints */}}
                  {{- if $resource.resource.spec.forProvider.taint -}}
                    {{- range $taint := $resource.resource.spec.forProvider.taint -}}
                      {{- $taintObj := dict "key" $taint.key "value" $taint.value "effect" $taint.effect -}}
                      {{- $nodeTaints = append $nodeTaints $taintObj -}}
                    {{- end -}}
                  {{- end -}}

                  {{/* Extract subnet IDs */}}
                  {{- if $resource.resource.spec.forProvider.subnetIds -}}
                    {{- $subnetIds = $resource.resource.spec.forProvider.subnetIds -}}
                  {{- end -}}

                  {{/* Extract availability zones from environment config */}}
                  {{- if $envConfig.clusterPrivateSubnets -}}
                    {{- if $xr.spec.nodeGroup.multiAZ -}}
                      {{- range $subnet := $envConfig.clusterPrivateSubnets -}}
                        {{- if not (has $subnet.availabilityZone $availabilityZones) -}}
                          {{- $availabilityZones = append $availabilityZones $subnet.availabilityZone -}}
                        {{- end -}}
                      {{- end -}}
                    {{- else -}}
                      {{/* Single AZ - extract from first selected subnet */}}
                      {{- $targetAZ := printf "%sa" $envConfig.primaryRegion -}}
                      {{- range $subnet := $envConfig.clusterPrivateSubnets -}}
                        {{- if eq $subnet.availabilityZone $targetAZ -}}
                          {{- $availabilityZones = append $availabilityZones $subnet.availabilityZone -}}
                          {{- break -}}
                        {{- end -}}
                      {{- end -}}
                      {{/* Fallback to first subnet's AZ */}}
                      {{- if not $availabilityZones -}}
                        {{- if gt (len $envConfig.clusterPrivateSubnets) 0 -}}
                          {{- $availabilityZones = append $availabilityZones (index $envConfig.clusterPrivateSubnets 0).availabilityZone -}}
                        {{- end -}}
                      {{- end -}}
                    {{- end -}}
                  {{- end -}}

                  {{/* Determine status from resource state */}}
                  {{- if $resourceReady -}}
                    {{- $_ := set $nodeGroupStatus "status" "Active" -}}
                  {{- else if $resource.resource.status -}}
                    {{- $_ := set $nodeGroupStatus "status" "Creating" -}}
                  {{- else -}}
                    {{- $_ := set $nodeGroupStatus "status" "Pending" -}}
                  {{- end -}}

                  {{/* Add scheduling information to nodeGroupStatus */}}
                  {{- if $nodeLabels -}}
                    {{- $_ := set $nodeGroupStatus "nodeLabels" $nodeLabels -}}
                  {{- end -}}
                  {{- if $nodeTaints -}}
                    {{- $_ := set $nodeGroupStatus "nodeTaints" $nodeTaints -}}
                  {{- end -}}
                  {{- if $availabilityZones -}}
                    {{- $_ := set $nodeGroupStatus "availabilityZones" $availabilityZones -}}
                  {{- end -}}
                  {{- if $subnetIds -}}
                    {{- $_ := set $nodeGroupStatus "subnetIds" $subnetIds -}}
                  {{- end -}}
                {{- end -}}
              {{- end -}}

              {{/* Extract Namespace status */}}
              {{- if eq $resourceName "namespace" -}}
                {{- $_ := set $namespaceStatus "name" $envName -}}
                {{- if $resourceReady -}}
                  {{- $_ := set $namespaceStatus "status" "Ready" -}}
                {{- else -}}
                  {{- $_ := set $namespaceStatus "status" "Pending" -}}
                {{- end -}}
              {{- end -}}

              {{/* Check if ResourceQuota is enabled */}}
              {{- if eq $resourceName "resourcequota" -}}
                {{- $resourceQuotaEnabled = true -}}
              {{- end -}}

              {{/* Check if LimitRange is enabled */}}
              {{- if eq $resourceName "limitrange" -}}
                {{- $limitRangeEnabled = true -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}

          {{/* Update namespace status with feature flags */}}
          {{- $_ := set $namespaceStatus "resourceQuotaEnabled" $resourceQuotaEnabled -}}
          {{- $_ := set $namespaceStatus "limitRangeEnabled" $limitRangeEnabled -}}

          {{/* Build scheduling profile for applications */}}
          {{- $schedulingProfile := dict -}}

          {{/* Node selectors from node labels */}}
          {{- if $nodeLabels -}}
            {{- $_ := set $schedulingProfile "nodeSelectors" $nodeLabels -}}
          {{- end -}}

          {{/* Build tolerations from node taints */}}
          {{- if $nodeTaints -}}
            {{- $tolerations := list -}}
            {{- range $taint := $nodeTaints -}}
              {{- $toleration := dict -}}
              {{- $_ := set $toleration "key" $taint.key -}}
              {{- $_ := set $toleration "operator" "Equal" -}}
              {{- $_ := set $toleration "value" $taint.value -}}
              {{- if eq $taint.effect "NO_SCHEDULE" -}}
                {{- $_ := set $toleration "effect" "NoSchedule" -}}
              {{- else if eq $taint.effect "NO_EXECUTE" -}}
                {{- $_ := set $toleration "effect" "NoExecute" -}}
              {{- else if eq $taint.effect "PREFER_NO_SCHEDULE" -}}
                {{- $_ := set $toleration "effect" "PreferNoSchedule" -}}
              {{- end -}}
              {{- $tolerations = append $tolerations $toleration -}}
            {{- end -}}
            {{- $_ := set $schedulingProfile "tolerations" $tolerations -}}
          {{- end -}}

          {{/* Add availability zones */}}
          {{- if $availabilityZones -}}
            {{- $_ := set $schedulingProfile "availabilityZones" $availabilityZones -}}
          {{- end -}}

          # Update composite resource status with collected data
          ---
          apiVersion: {{ $xr.apiVersion }}
          kind: {{ $xr.kind }}
          metadata:
            name: {{ $xr.metadata.name }}
          status:
            # Environment Information
            environmentName: {{ $envName | quote }}
            eksClusterName: {{ $xr.spec.eksClusterName | quote }}
            {{- if $envConfig.primaryRegion }}
            region: {{ $envConfig.primaryRegion | quote }}
            {{- end }}
            {{- if $isReady }}
            phase: "Active"
            {{- else }}
            phase: "Provisioning"
            {{- end }}

            # Namespace Status
            {{- if $namespaceStatus }}
            namespace:
              name: {{ $namespaceStatus.name | quote }}
              status: {{ $namespaceStatus.status | quote }}
              resourceQuotaEnabled: {{ $namespaceStatus.resourceQuotaEnabled }}
              limitRangeEnabled: {{ $namespaceStatus.limitRangeEnabled }}
            {{- end }}

            # NodeGroup Status with Scheduling Information
            {{- if $nodeGroupStatus }}
            nodeGroup:
              name: {{ $nodeGroupStatus.name | quote }}
              status: {{ $nodeGroupStatus.status | quote }}
              instanceType: {{ $nodeGroupStatus.instanceType | quote }}
              capacityType: {{ $nodeGroupStatus.capacityType | quote }}
              multiAZ: {{ $nodeGroupStatus.multiAZ }}
              {{- if $nodeGroupStatus.scaling }}
              scaling:
                {{- if $nodeGroupStatus.scaling.desired }}
                desired: {{ $nodeGroupStatus.scaling.desired }}
                {{- end }}
                minimum: {{ $nodeGroupStatus.scaling.minimum }}
                maximum: {{ $nodeGroupStatus.scaling.maximum }}
              {{- end }}
              {{- if $nodeGroupStatus.nodeLabels }}
              nodeLabels:
                {{- range $key, $value := $nodeGroupStatus.nodeLabels }}
                {{ $key }}: {{ $value | quote }}
                {{- end }}
              {{- end }}
              {{- if $nodeGroupStatus.nodeTaints }}
              nodeTaints:
                {{- range $nodeGroupStatus.nodeTaints }}
                - key: {{ .key | quote }}
                  value: {{ .value | quote }}
                  effect: {{ .effect | quote }}
                {{- end }}
              {{- end }}
              {{- if $nodeGroupStatus.availabilityZones }}
              availabilityZones:
                {{- range $nodeGroupStatus.availabilityZones }}
                - {{ . | quote }}
                {{- end }}
              {{- end }}
              {{- if $nodeGroupStatus.subnetIds }}
              subnetIds:
                {{- range $nodeGroupStatus.subnetIds }}
                - {{ . | quote }}
                {{- end }}
              {{- end }}
            {{- end }}

            # Environment Configuration
            environmentConfig:
              name: {{ $envName }}-config
              found: {{ if $envConfig }}true{{ else }}false{{ end }}
              validated: {{ if $envConfig }}true{{ else }}false{{ end }}

            # Resource Summary
            resources:
              total: {{ $childResourcesCount }}
              ready: {{ $readyResourcesCount }}
              pending: {{ $pendingResourcesCount }}

            # Application Scheduling Profile
            {{- if $schedulingProfile }}
            schedulingProfile:
              {{- if $schedulingProfile.nodeSelectors }}
              nodeSelectors:
                {{- range $key, $value := $schedulingProfile.nodeSelectors }}
                {{ $key }}: {{ $value | quote }}
                {{- end }}
              {{- end }}
              {{- if $schedulingProfile.tolerations }}
              tolerations:
                {{- range $schedulingProfile.tolerations }}
                - key: {{ .key | quote }}
                  operator: {{ .operator | quote }}
                  value: {{ .value | quote }}
                  effect: {{ .effect | quote }}
                {{- end }}
              {{- end }}
              {{- if $schedulingProfile.availabilityZones }}
              availabilityZones:
                {{- range $schedulingProfile.availabilityZones }}
                - {{ . | quote }}
                {{- end }}
              {{- end }}
            {{- end }}