apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: awsprovider
  labels:
    platform.kubecore.io/type: awsprovider
    provider: aws
    service: aws-infrastructure
    layer: platform
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: aws.provider.platform.kubecore.io/v1alpha1
    kind: XAWSProvider
  mode: Pipeline
  pipeline:
  # Fixed environment config selector to use correct label matching
  - step: load-environment-configs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Selector
          selector:
            matchLabels:
            - key: platform.kubecore.io/type
              type: Value
              value: aws-config
            - key: platform.kubecore.io/kubeorg
              type: FromCompositeFieldPath
              valueFromFieldPath: spec.organizationName

  # Step 2: Generate AWS resources with Go Templates
  - step: generate-aws-resources
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $org := .observed.composite.resource.spec.organizationName -}}
          {{- $uid := .observed.composite.resource.metadata.uid -}}
          {{- $name := .observed.composite.resource.metadata.name -}}
          
          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found in annotation" -}}
          {{- end -}}
          
          {{- $accountId := $envConfig.accountId -}}
          {{- $primaryRegion := $envConfig.primaryRegion -}}
          {{- $providerConfig := $envConfig.providerConfig -}}
          {{- $kubernetesProviderConfig := $envConfig.kubernetesProviderConfig -}}
          {{- $regions := $envConfig.regions -}}
          
          {{/* OIDC configuration - reference existing EKS cluster OIDC provider */}}
          {{- $eksClusterId := $envConfig.eks.clusterId -}}
          {{- if not $eksClusterId -}}
            {{- fail "eks.clusterId is required in environment configuration to reference the EKS OIDC provider" -}}
          {{- end -}}
          {{- $eksRegion := $envConfig.eks.region -}}
          {{- if not $eksRegion -}}
            {{- fail "eks.region is required in environment configuration to reference the EKS OIDC provider" -}}
          {{- end -}}
          {{- $oidcIssuerUrl := printf "https://oidc.eks.%s.amazonaws.com/id/%s" $eksRegion $eksClusterId -}}
          {{- $oidcProviderArn := printf "arn:aws:iam::%s:oidc-provider/oidc.eks.%s.amazonaws.com/id/%s" $accountId $eksRegion $eksClusterId -}}
          
          {{/* Validate required configuration */}}
          {{- if not $accountId -}}
            {{- fail "accountId is required in environment configuration" -}}
          {{- end -}}
          {{- if not $primaryRegion -}}
            {{- fail "primaryRegion is required in environment configuration" -}}
          {{- end -}}
          {{- if not $providerConfig -}}
            {{- fail "providerConfig is required in environment configuration" -}}
          {{- end -}}
          {{- if not $regions -}}
            {{- fail "regions list is required in environment configuration" -}}
          {{- end -}}
          
          {{/* Set static OIDC provider information since EKS creates it automatically */}}
          {{- $oidcProviderArn := printf "arn:aws:iam::%s:oidc-provider/%s" $accountId ($oidcIssuerUrl | trimPrefix "https://") -}}
          {{- $oidcProviderUrl := $oidcIssuerUrl -}}
          {{- if not $kubernetesProviderConfig -}}
            {{- fail "kubernetesProviderConfig is required in environment configuration" -}}
          {{- end -}}
          
          # ========================================
          # Group 1: IAM Foundation Resources (created first)
          # ========================================
          
          # ========================================
          # IAM Policies
          
          # Secrets Manager Access Policy
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Policy
          metadata:
            name: {{ $org }}-secrets-policy
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: secrets-policy
            labels:
              platform.kubecore.io/organization: {{ $org }}
              platform.kubecore.io/resource-type: iam-policy
              platform.kubecore.io/policy-type: secrets-manager
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $providerConfig }}
            forProvider:
              description: "Secrets Manager access policy for {{ $org }}"
              policy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": [
                        "secretsmanager:GetSecretValue",
                        "secretsmanager:DescribeSecret",
                        "secretsmanager:CreateSecret",
                        "secretsmanager:UpdateSecret",
                        "secretsmanager:PutSecretValue",
                        "secretsmanager:DeleteSecret",
                        "secretsmanager:GetResourcePolicy",
                        "secretsmanager:PutResourcePolicy",
                        "secretsmanager:DeleteResourcePolicy",
                        "secretsmanager:TagResource",
                        "secretsmanager:UntagResource"
                      ],
                      "Resource": "arn:aws:secretsmanager:*:{{ $accountId }}:secret:{{ $org }}-*"
                    },
                    {
                      "Effect": "Allow",
                      "Action": [
                        "secretsmanager:ListSecrets"
                      ],
                      "Resource": "*"
                    }
                  ]
                }
              tags:
                Organization: {{ $org }}
                ManagedBy: crossplane
                Purpose: secrets-management
          
          # ECR Access Policy
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Policy
          metadata:
            name: {{ $org }}-ecr-policy
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ecr-policy
            labels:
              platform.kubecore.io/organization: {{ $org }}
              platform.kubecore.io/resource-type: iam-policy
              platform.kubecore.io/policy-type: ecr
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $providerConfig }}
            forProvider:
              description: "ECR registry access policy for {{ $org }}"
              policy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": [
                        "ecr:GetAuthorizationToken",
                        "ecr:BatchCheckLayerAvailability",
                        "ecr:GetDownloadUrlForLayer",
                        "ecr:BatchGetImage",
                        "ecr:PutImage",
                        "ecr:InitiateLayerUpload",
                        "ecr:UploadLayerPart",
                        "ecr:CompleteLayerUpload",
                        "ecr:CreateRepository",
                        "ecr:DescribeRepositories",
                        "ecr:ListImages",
                        "ecr:DescribeImages",
                        "ecr:PutLifecyclePolicy",
                        "ecr:GetLifecyclePolicy"
                      ],
                      "Resource": [
                        "arn:aws:ecr:*:{{ $accountId }}:repository/{{ $org }}-*",
                        "arn:aws:ecr:*:{{ $accountId }}:repository/{{ $org }}-*/*"
                      ]
                    },
                    {
                      "Effect": "Allow",
                      "Action": [
                        "ecr:GetAuthorizationToken"
                      ],
                      "Resource": "*"
                    }
                  ]
                }
              tags:
                Organization: {{ $org }}
                ManagedBy: crossplane
                Purpose: ecr-access
          
          # ========================================
          # Group 2: IAM Roles (created after policies)
          # ========================================
          
          # External Secrets Operator (ESO) Role for IRSA
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Role
          metadata:
            name: {{ $org }}-awsprovider-eso-role
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: eso-role
            labels:
              platform.kubecore.io/organization: {{ $org }}
              platform.kubecore.io/resource-type: iam-role
              platform.kubecore.io/role-type: eso-irsa
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $providerConfig }}
            forProvider:
              description: "External Secrets Operator IRSA role for {{ $org }}"
              # Trust policy for OIDC federation with External Secrets Operator
              # References the newly created OIDC provider
              assumeRolePolicy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "Federated": "arn:aws:iam::{{ $accountId }}:oidc-provider/{{ $oidcIssuerUrl | trimPrefix "https://" }}"
                      },
                      "Action": "sts:AssumeRoleWithWebIdentity",
                      "Condition": {
                        "StringEquals": {
                          "{{ $oidcIssuerUrl | trimPrefix "https://" }}:sub": "system:serviceaccount:external-secrets:{{ $org }}-eso-sa",
                          "{{ $oidcIssuerUrl | trimPrefix "https://" }}:aud": "sts.amazonaws.com"
                        }
                      }
                    }
                  ]
                }
              tags:
                Organization: {{ $org }}
                ManagedBy: crossplane
                Purpose: ESO-IRSA
                Type: external-secrets
          
          # ========================================
          # Group 3: Role Policy Attachments (after roles and policies)
          # ========================================
          
          # Attach Secrets Policy to ESO Role
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: RolePolicyAttachment
          metadata:
            name: {{ $org }}-eso-secrets-attachment
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: eso-secrets-attachment
            labels:
              platform.kubecore.io/organization: {{ $org }}
              platform.kubecore.io/resource-type: policy-attachment
              platform.kubecore.io/attachment-type: secrets
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $providerConfig }}
            forProvider:
              policyArnSelector:
                matchLabels:
                  platform.kubecore.io/organization: {{ $org }}
                  platform.kubecore.io/policy-type: secrets-manager
              roleSelector:
                matchLabels:
                  platform.kubecore.io/organization: {{ $org }}
                  platform.kubecore.io/role-type: eso-irsa
          
          # Attach ECR Policy to ESO Role
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: RolePolicyAttachment
          metadata:
            name: {{ $org }}-eso-ecr-attachment
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: eso-ecr-attachment
            labels:
              platform.kubecore.io/organization: {{ $org }}
              platform.kubecore.io/resource-type: policy-attachment
              platform.kubecore.io/attachment-type: ecr
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $providerConfig }}
            forProvider:
              policyArnSelector:
                matchLabels:
                  platform.kubecore.io/organization: {{ $org }}
                  platform.kubecore.io/policy-type: ecr
              roleSelector:
                matchLabels:
                  platform.kubecore.io/organization: {{ $org }}
                  platform.kubecore.io/role-type: eso-irsa
          
          # ========================================
          # Group 4: ESO Infrastructure
          # ========================================
          
          # ESO Service Account for ECRAuthorizationToken generators
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: {{ $org }}-eso-sa
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: eso-service-account
            labels:
              platform.kubecore.io/organization: {{ $org }}
              platform.kubecore.io/resource-type: service-account
              platform.kubecore.io/service-type: external-secrets
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $kubernetesProviderConfig }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: {{ $org }}-eso-sa
                  namespace: external-secrets
                  annotations:
                    eks.amazonaws.com/role-arn: {{ printf "arn:aws:iam::%s:role/%s-awsprovider-eso-role" $accountId $org }}
                  labels:
                    platform.kubecore.io/organization: {{ $org }}
                    platform.kubecore.io/resource-type: service-account
                    platform.kubecore.io/service-type: external-secrets
          
          # ClusterSecretStore for AWS Secrets Manager integration
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: {{ $org }}-infrastructure-secrets
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cluster-secret-store
            labels:
              platform.kubecore.io/organization: {{ $org }}
              platform.kubecore.io/resource-type: cluster-secret-store
              platform.kubecore.io/service-type: external-secrets
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $kubernetesProviderConfig }}
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ClusterSecretStore
                metadata:
                  name: {{ $org }}-infrastructure-secrets
                  labels:
                    platform.kubecore.io/organization: {{ $org }}
                    platform.kubecore.io/resource-type: cluster-secret-store
                    platform.kubecore.io/service-type: external-secrets
                  finalizers:
                  - secretstore.externalsecrets.io/finalizer
                spec:
                  provider:
                    secretsManager:
                      forceDeleteWithoutRecovery: true  # Force immediate deletion without recovery window
                    aws:
                      auth:
                        jwt:
                          serviceAccountRef:
                            name: {{ $org }}-eso-sa
                            namespace: external-secrets
                region: {{ $eksRegion }}
                      service: SecretsManager

  # Step 3: Enable automatic readiness detection
  - step: auto-ready
    functionRef:
      name: function-auto-ready
    input:
      apiVersion: autoready.fn.crossplane.io/v1beta1
      kind: Input
      # Explicitly configure readiness checks for all resource types
      spec:
        policy: All  # Check readiness for all resources
  
  # Step 4: Sequence resources for proper creation/deletion order
  - step: sequence-resources
    functionRef:
      name: function-sequencer
    input:
      apiVersion: sequencer.fn.crossplane.io/v1beta1
      kind: Input
      config:
        respectDeletionOrder: true
        finalizerStrategy:
          mode: Strict
      rules:
      # IAM Policies and Role can be created in parallel

      # Policy Attachments need both policy + role
      - sequence:
        - eso-role
        - eso-secrets-attachment
      - sequence:
        - secrets-policy
        - eso-secrets-attachment
      - sequence:
        - eso-role
        - eso-ecr-attachment
      - sequence:
        - ecr-policy
        - eso-ecr-attachment

      # Service Account needs role ARN for annotation
      - sequence:
        - eso-role
        - eso-service-account

      # ClusterSecretStore needs service account
      - sequence:
        - eso-service-account
        - cluster-secret-store
  
  # Step 5: Extract and populate status fields
  - step: status-transformer
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $org := .observed.composite.resource.spec.organizationName -}}
          {{- $name := .observed.composite.resource.metadata.name -}}
          
          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found in annotation" -}}
          {{- end -}}
          
          {{- $accountId := $envConfig.accountId -}}
          {{- $primaryRegion := $envConfig.primaryRegion -}}
          {{- $eksClusterId := $envConfig.eks.clusterId -}}
          {{- if not $eksClusterId -}}
            {{- fail "eks.clusterId is required in environment configuration to reference the EKS OIDC provider" -}}
          {{- end -}}
          {{- $eksRegion := $envConfig.eks.region -}}
          {{- if not $eksRegion -}}
            {{- fail "eks.region is required in environment configuration to reference the EKS OIDC provider" -}}
          {{- end -}}
          
          {{/* Initialize variables for collecting status information */}}
          {{- $secretArn := "" -}}
          {{- $esoRoleArn := "" -}}
          {{- $secretsPolicyArn := "" -}}
          {{- $ecrPolicyArn := "" -}}
          {{/* Set OIDC provider information from constructed values */}}
          {{- $oidcProviderArn := printf "arn:aws:iam::%s:oidc-provider/oidc.eks.%s.amazonaws.com/id/%s" $accountId $eksRegion $eksClusterId -}}
          {{- $oidcProviderUrl := printf "https://oidc.eks.%s.amazonaws.com/id/%s" $eksRegion $eksClusterId -}}
          {{- $childResourcesCount := 0 -}}
          {{- $childResourcesList := list -}}
          {{- $isReady := true -}}
          {{- $clusterSecretStoreReady := false -}}
          {{- $clusterSecretStoreName := "" -}}
          
          {{/* Iterate through observed resources to extract status */}}
          {{- range $resourceName, $resource := .observed.resources -}}
            {{- if $resource.resource -}}
              {{/* Count child resources */}}
              {{- $childResourcesCount = add $childResourcesCount 1 -}}
              {{- $childResource := dict "name" $resourceName "kind" $resource.resource.kind -}}
              {{- if $resource.resource.apiVersion -}}
                {{- $_ := set $childResource "apiVersion" $resource.resource.apiVersion -}}
              {{- end -}}
              
              {{/* Check resource readiness */}}
              {{- $resourceReady := false -}}
              {{- if $resource.ready -}}
                {{- $resourceReady = true -}}
                {{- $_ := set $childResource "ready" true -}}
              {{- else if and $resource.resource $resource.resource.status -}}
                {{/* Check for Upbound provider readiness patterns */}}
                {{- if and $resource.resource.status.conditions -}}
                  {{- range $condition := $resource.resource.status.conditions -}}
                    {{- if and (eq $condition.type "Ready") (eq $condition.status "True") -}}
                      {{- $resourceReady = true -}}
                      {{- $_ := set $childResource "ready" true -}}
                    {{- end -}}
                  {{- end -}}
                {{- end -}}
                {{/* If still not ready, check atProvider status */}}
                {{- if and (not $resourceReady) $resource.resource.status.atProvider -}}
                  {{- if $resource.resource.status.atProvider.arn -}}
                    {{- $resourceReady = true -}}
                    {{- $_ := set $childResource "ready" true -}}
                  {{- end -}}
                {{- end -}}
                {{- if not $resourceReady -}}
                  {{- $_ := set $childResource "ready" false -}}
                  {{/* Only mark composite as not ready if this is a critical resource */}}
                  {{- if or (hasPrefix "eso-" $resourceName) (hasSuffix "-policy" $resourceName) -}}
                    {{- $isReady = false -}}
                  {{- end -}}
                {{- end -}}
              {{- else -}}
                {{- $_ := set $childResource "ready" false -}}
                {{/* Only mark composite as not ready if this is a critical resource */}}
                {{- if or (hasPrefix "eso-" $resourceName) (hasSuffix "-policy" $resourceName) -}}
                  {{- $isReady = false -}}
                {{- end -}}
              {{- end -}}
              {{- $childResourcesList = append $childResourcesList $childResource -}}

              {{/* Extract ESO Role ARN */}}
              {{- if eq $resourceName "eso-role" -}}
                {{- if eq $resource.resource.kind "Role" -}}
                  {{- if $resource.resource.status.atProvider.arn -}}
                    {{- $esoRoleArn = $resource.resource.status.atProvider.arn -}}
                  {{- end -}}
                {{- end -}}
              {{- end -}}
              
              {{/* Extract Secrets Policy ARN */}}
              {{- if eq $resourceName "secrets-policy" -}}
                {{- if eq $resource.resource.kind "Policy" -}}
                  {{- if $resource.resource.status.atProvider.arn -}}
                    {{- $secretsPolicyArn = $resource.resource.status.atProvider.arn -}}
                  {{- end -}}
                {{- end -}}
              {{- end -}}
              
              {{/* Extract ECR Policy ARN */}}
              {{- if eq $resourceName "ecr-policy" -}}
                {{- if eq $resource.resource.kind "Policy" -}}
                  {{- if $resource.resource.status.atProvider.arn -}}
                    {{- $ecrPolicyArn = $resource.resource.status.atProvider.arn -}}
                  {{- end -}}
                {{- end -}}
              {{- end -}}
              
              {{/* Track ClusterSecretStore Status */}}
              {{- if eq $resourceName "cluster-secret-store" -}}
                {{- if and (eq $resource.resource.kind "Object") $resource.resource.spec.forProvider.manifest -}}
                  {{- if eq $resource.resource.spec.forProvider.manifest.kind "ClusterSecretStore" -}}
                    {{- $clusterSecretStoreReady = $resourceReady -}}
                    {{- if $resource.resource.spec.forProvider.manifest.metadata.name -}}
                      {{- $clusterSecretStoreName = $resource.resource.spec.forProvider.manifest.metadata.name -}}
                    {{- end -}}
                  {{- end -}}
                {{- end -}}
              {{- end -}}
              
              {{/* OIDC Provider information is constructed dynamically - no extraction needed */}}
            {{- end -}}
          {{- end -}}
          
          # Update composite resource status with collected data
          ---
          apiVersion: {{ .observed.composite.resource.apiVersion }}
          kind: {{ .observed.composite.resource.kind }}
          metadata:
            name: {{ .observed.composite.resource.metadata.name }}
          status:
            # Readiness status
            ready: {{ $isReady }}
            
            # Child Resources Summary
            childResources:
              total: {{ $childResourcesCount }}
              {{- if gt (len $childResourcesList) 0 }}
              resources: {{ toJson $childResourcesList | quote }}
              {{- end }}

            # IAM Roles
            {{- if $esoRoleArn }}
            iamRoles:
              esoRoleArn: {{ $esoRoleArn | quote }}
            {{- end }}
            
            # IAM Policies
            {{- if or $secretsPolicyArn $ecrPolicyArn }}
            iamPolicies:
              {{- if $secretsPolicyArn }}
              secretsManagerPolicyArn: {{ $secretsPolicyArn | quote }}
              {{- end }}
              {{- if $ecrPolicyArn }}
              ecrPolicyArn: {{ $ecrPolicyArn | quote }}
              {{- end }}
            {{- end }}
            
            # OIDC Provider
            {{- if or $oidcProviderArn $oidcProviderUrl }}
            oidcProvider:
              {{- if $oidcProviderArn }}
              arn: {{ $oidcProviderArn | quote }}
              {{- end }}
              {{- if $oidcProviderUrl }}
              url: {{ $oidcProviderUrl | quote }}
              {{- end }}
            {{- end }}

            # ClusterSecretStore Status
            {{- if or $clusterSecretStoreReady $clusterSecretStoreName }}
            clusterSecretStore:
              {{- if $clusterSecretStoreName }}
              name: {{ $clusterSecretStoreName | quote }}
              {{- end }}
              {{- if $clusterSecretStoreReady }}
              ready: {{ $clusterSecretStoreReady }}
              {{- else }}
              ready: false
              {{- end }}
            {{- end }}