                    - inputName: "PROMETHEUS"
                      datasourceName: "P4169E866C3094E38"
                  grafanaCom:
                    id: 13646
                    revision: 1
          {{- end }}

          {{/* Kubernetes Cluster overview dashboard (Grafana.com ID 7249) */}}
          {{- if and $shouldDeployVM $grafanaEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-grafana-dashboard-kubernetes-cluster-7249
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: grafana-dashboard-kubernetes-cluster-7249
            labels:
              {{- range $key, $value := $commonLabels }}
