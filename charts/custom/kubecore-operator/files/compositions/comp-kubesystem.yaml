          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: grafana.integreatly.org/v1beta1
                kind: GrafanaDashboard
                metadata:
                  name: {{ $clusterName }}-kubernetes-pod-resources-6417
                  namespace: {{ $vmNamespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "observability"
                spec:
                  folderRef: {{ $clusterName }}-kubernetes
                  instanceSelector:
                    matchLabels:
                      dashboards: "kubecore-grafana"
                  datasources:
                    - inputName: "DS_PROMETHEUS"
                      datasourceName: "P4169E866C3094E38"
                  grafanaCom:
                    id: 6417
                    revision: 1
          {{- end }}

          {{/* ArgoCD Zitadel OIDC ExternalSecret */}}
          {{- $hasArgocdOIDC := false -}}
          {{- if and $argoCdEnabled $tools.argocd $tools.argocd.enabled -}}
            {{- if $tools.argocd.oidc -}}
              {{- if $tools.argocd.oidc.enabled -}}
                {{- $hasArgocdOIDC = true -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}
          {{- if $hasArgocdOIDC }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-oidc-external-secret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-oidc-external-secret
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argocd"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            readiness:
              policy: DeriveFromCelQuery
              celQuery: 'object.status.conditions.exists(c, c.type == "Ready" && c.status == "True")'
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: argocd-zitadel-oidc
                  namespace: {{ $tools.argocd.namespace }}
                  labels:
                    platform.kubecore.io/kubesystem: {{ $name }}
                    platform.kubecore.io/part-of: "system"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    kind: ClusterSecretStore
                    name: {{ $envConfig.organization.name }}-infrastructure-secrets
                  target:
                    name: argocd-zitadel-oidc
                    creationPolicy: Owner
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/part-of: argocd
                  data:
                    - secretKey: zitadel_client_id
                      remoteRef:
                        key: {{ $tools.argocd.oidc.secretName }}
                        property: zitadel_client_id
                    - secretKey: zitadel_client_secret
                      remoteRef:
                        key: {{ $tools.argocd.oidc.secretName }}
                        property: zitadel_client_secret
          {{- end }}

          {{/* ArgoCD Installation */}}
          {{- if and $argoCdEnabled $tools.argocd $tools.argocd.enabled }}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-system-argocd
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-release
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argocd"
          spec:
            # Use Delete to avoid stale Helm release history causing sticky failed state on re-create.
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              # ArgoCD can take longer than the default 5m to become Ready on first install
              wait: true
              waitTimeout: "20m"
              chart:
                name: argo-cd
                repository: {{ $tools.argocd.repository.url }}
                version: "{{ $tools.argocd.version }}"
              namespace: {{ $tools.argocd.namespace }}
              values:
                fullnameOverride: "argocd"
                global:
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tolerations }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: "{{ $toleration.key }}"
                      operator: "{{ $toleration.operator }}"
                      {{- if $toleration.value }}
                      value: "{{ $toleration.value }}"
                      {{- end }}
                      effect: "{{ $toleration.effect }}"
                    {{- end }}
                  {{- end }}
                configs:
                  params:
                    server.insecure: true
                    # Enable Source Hydrator feature
                    server.enable.source.hydrator: true
                    # Enable hydrator feature (hydrator is in Alpha phase)
                    hydrator.enabled: true
                    # Preserve pre-9.0.0 ApplicationSet sync behavior (chart 9.0.0 changed default from 'sync' to '')
                    applicationsetcontroller.policy: 'sync'
                    {{- if $argoMetricsEnabled }}
                    server.enable.proxy.extension: "true"
                    {{- end }}
                  {{- if or $hasArgocdOIDC (and $argoMetricsEnabled $shouldDeployVM) }}
                  cm:
                    {{- if $hasArgocdOIDC }}
                    url: https://argocd.system.{{ $dns.clusterDomain }}
                    oidc.config: |
                      name: {{ $tools.argocd.oidc.name }}
                      issuer: {{ $tools.argocd.oidc.issuer }}
                      clientID: $argocd-zitadel-oidc:zitadel_client_id
                      clientSecret: $argocd-zitadel-oidc:zitadel_client_secret
                      requestedScopes:
                        - openid
                        - profile
                        - email
                        - groups
                      logoutURL: {{ $tools.argocd.oidc.logoutURL }}
                    {{- end }}
                    {{- if and $argoMetricsEnabled $shouldDeployVM }}
                    extension.config: |
                      extensions:
                        - name: metrics
                          backend:
                            services:
                              - url: http://argocd-metrics-server.{{ $tools.argocd.namespace }}.svc.cluster.local:9003
                    {{- end }}
                  rbac:
                    {{- if $hasArgocdOIDC }}
                    scopes: '[groups]'
                    policy.default: 'role:readonly'
                    {{- end }}
                    {{- if or $argoMetricsEnabled (and $hasArgocdOIDC $tools.argocd.oidc.rbacPolicyCSV) }}
                    policy.csv: |
                      {{- if $argoMetricsEnabled }}
                      p, role:readonly, extensions, invoke, metrics, allow
                      {{- end }}
                      {{- if and $hasArgocdOIDC $tools.argocd.oidc.rbacPolicyCSV }}
                      {{ $tools.argocd.oidc.rbacPolicyCSV }}
                      {{- end }}
                    {{- end }}
                  {{- end }}
                server:
                  {{- if $tools.argocd.server.replicas }}
                  replicas: {{ $tools.argocd.server.replicas }}
                  {{- end }}
                  {{- if $tools.argocd.server.ingress.enabled }}
                  ingress:
                    enabled: {{ $tools.argocd.server.ingress.enabled }}
                    ingressClassName: {{ $tools.argocd.server.ingress.className }}
                    hostname: argocd.system.{{ $dns.clusterDomain }}
                    {{- if $tools.argocd.server.ingress.tls }}
                    tls:
                      - secretName: argocd-ingress-server-tls
                        hosts:
                          - argocd.system.{{ $dns.clusterDomain }}
                    {{- end }}
                    {{- if $tools.argocd.server.ingress.annotations }}
                    annotations:
                      cert-manager.io/cluster-issuer: {{ $clusterIssuerName }}
                      {{- range $key, $value := $tools.argocd.server.ingress.annotations }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- else }}
                    annotations:
                      cert-manager.io/cluster-issuer: {{ $clusterIssuerName }}
                    {{- end }}
                  {{- end }}
                  {{- if $tools.argocd.server.resources }}
                  resources:
                    {{- if $tools.argocd.server.resources.requests }}
                    requests:
                      {{- range $key, $value := $tools.argocd.server.resources.requests }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                    {{- if $tools.argocd.server.resources.limits }}
                    limits:
                      {{- range $key, $value := $tools.argocd.server.resources.limits }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                  {{- end }}
                  {{- if or $argoRolloutsEnabled $gitopsPromoterEnabled $argoMetricsEnabled }}
                  extensions:
                    enabled: true
                    image:
                      repository: "quay.io/argoprojlabs/argocd-extension-installer"
                      tag: "v0.0.8"
                    extensionList:
                    {{- if $argoRolloutsEnabled }}
                    - name: rollout-extension
                      env:
                      - name: EXTENSION_URL
                        value: "https://github.com/argoproj-labs/rollout-extension/releases/download/v0.3.7/extension.tar"
                    {{- end }}
                    {{- if $gitopsPromoterEnabled }}
                    - name: gitops-promoter
                      env:
                      - name: EXTENSION_URL
                        value: "https://github.com/argoproj-labs/gitops-promoter/releases/latest/download/gitops-promoter-argocd-extension.tar.gz"
                    {{- end }}
                    {{- if $argoMetricsEnabled }}
                    - name: extension-metrics
                      env:
                      - name: EXTENSION_URL
                        value: "https://github.com/argoproj-labs/argocd-extension-metrics/releases/download/v1.0.0/extension.tar.gz"
                    {{- end }}
                  {{- end }}
                repoServer:
                  {{- if $tools.argocd.repoServer.replicas }}
                  replicas: {{ $tools.argocd.repoServer.replicas }}
                  {{- end }}
                  {{- if $tools.argocd.repoServer.resources }}
                  resources:
                    {{- if $tools.argocd.repoServer.resources.requests }}
                    requests:
                      {{- range $key, $value := $tools.argocd.repoServer.resources.requests }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                    {{- if $tools.argocd.repoServer.resources.limits }}
                    limits:
                      {{- range $key, $value := $tools.argocd.repoServer.resources.limits }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                  {{- end }}
                controller:
                  {{- if $tools.argocd.controller.replicas }}
                  replicas: {{ $tools.argocd.controller.replicas }}
                  {{- end }}
                  {{- if $tools.argocd.controller.resources }}
                  resources:
                    {{- if $tools.argocd.controller.resources.requests }}
                    requests:
                      {{- range $key, $value := $tools.argocd.controller.resources.requests }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                    {{- if $tools.argocd.controller.resources.limits }}
                    limits:
                      {{- range $key, $value := $tools.argocd.controller.resources.limits }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                  {{- end }}
                commitServer:
                  enabled: true
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tolerations }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: "{{ $toleration.key }}"
                      operator: "{{ $toleration.operator }}"
                      {{- if $toleration.value }}
                      value: "{{ $toleration.value }}"
                      {{- end }}
                      effect: "{{ $toleration.effect }}"
                    {{- end }}
                  {{- end }}
          {{- end }}

          {{/* =================================================================== */}}
          {{/* ARGOCD METRICS SERVER (backend for extension-metrics UI extension) */}}
          {{/* =================================================================== */}}

          {{- if and $argoMetricsEnabled $argoCdEnabled $shouldDeployVM }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-metrics-server-configmap
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-metrics-server-configmap
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argocd"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: argocd-metrics-server-configmap
                  namespace: {{ $tools.argocd.namespace }}
                data:
                  config.json: |
                    {
                    "prometheus": {
                      "applications": [
                        {
                          "name": "default",
                          "default": true,
                          "dashboards": [
                            {
                              "groupKind": "pod",
                              "tabs": ["Golden Signal"],
                              "rows": [
                                {
                                  "name": "pod",
                                  "title": "Pods",
                                  "tab": "Golden Signal",
                                  "graphs": [
                                    {
                                      "name": "pod_cpu_line",
                                      "title": "CPU",
                                      "description": "",
                                      "graphType": "line",
                                      "metricName": "pod",
                                      "queryExpression": "sum(rate(container_cpu_usage_seconds_total{pod=~\"{{.name}}\", image!=\"\", container!=\"POD\", container!=\"\", container_name!=\"POD\"}[5m])) by (pod)"
                                    },
                                    {
                                      "name": "pod_memory_line",
                                      "title": "Memory",
                                      "description": "",
                                      "graphType": "line",
                                      "metricName": "pod",
                                      "queryExpression": "sum(rate(container_memory_usage_bytes{pod=~\"{{.name}}\", container!=\"POD\", image!=\"\", container!=\"\", container_name!=\"POD\"}[5m])) by (pod)"
                                    }
                                  ]
                                }
                              ]
                            },
                            {
                              "groupKind": "deployment",
                              "tabs": ["Golden Signal"],
                              "rows": [
                                {
                                  "name": "pod",
                                  "title": "Pods",
                                  "tab": "Golden Signal",
                                  "graphs": [
                                    {
                                      "name": "pod_cpu_line",
                                      "title": "CPU",
                                      "description": "",
                                      "graphType": "line",
                                      "metricName": "pod",
                                      "queryExpression": "sum(rate(container_cpu_usage_seconds_total{pod=~\"{{.name}}\", image!=\"\", container!=\"POD\", container!=\"\", container_name!=\"POD\"}[5m])) by (pod)"
                                    },
                                    {
                                      "name": "pod_memory_line",
                                      "title": "Memory",
                                      "description": "",
                                      "graphType": "line",
                                      "metricName": "pod",
                                      "queryExpression": "sum(rate(container_memory_usage_bytes{pod=~\"{{.name}}\", container!=\"POD\", image!=\"\", container!=\"\", container_name!=\"POD\"}[5m])) by (pod)"
                                    }
                                  ]
                                }
                              ]
                            },
                            {
                              "groupKind": "rollout",
                              "tabs": ["Golden Signal"],
                              "rows": [
                                {
                                  "name": "pod",
                                  "title": "Pods",
                                  "tab": "Golden Signal",
                                  "graphs": [
                                    {
                                      "name": "pod_cpu_line",
                                      "title": "CPU",
                                      "description": "",
                                      "graphType": "line",
                                      "metricName": "pod",
                                      "queryExpression": "sum(rate(container_cpu_usage_seconds_total{pod=~\"{{.name}}\", image!=\"\", container!=\"POD\", container!=\"\", container_name!=\"POD\"}[5m])) by (pod)"
                                    },
                                    {
                                      "name": "pod_memory_line",
                                      "title": "Memory",
                                      "description": "",
                                      "graphType": "line",
                                      "metricName": "pod",
                                      "queryExpression": "sum(rate(container_memory_usage_bytes{pod=~\"{{.name}}\", container!=\"POD\", image!=\"\", container!=\"\", container_name!=\"POD\"}[5m])) by (pod)"
                                    }
                                  ]
                                }
                              ]
                            }
                          ]
                        }
                      ],
                      "provider": {
                        "Name": "default",
                        "default": true,
                        "address": "http://vmselect-{{ $clusterName }}-vm.{{ $vmNamespace }}.svc.cluster.local:8481/select/0/prometheus"
                      }
                    }
                    }
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-metrics-server-deployment
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-metrics-server-deployment
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argocd"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: argocd-metrics-server
                  namespace: {{ $tools.argocd.namespace }}
                  labels:
                    app: argocd-metrics-server
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: argocd-metrics-server
                  template:
                    metadata:
                      labels:
                        app: argocd-metrics-server
                    spec:
                      serviceAccountName: argocd-server
                      tolerations:
                      - key: "kubecore.eu/computation-type"
                        operator: "Equal"
                        value: "kubecore-system"
                        effect: "NoSchedule"
                      containers:
                      - name: argocd-metrics-server
                        image: quay.io/argoprojlabs/argocd-extension-metrics:latest
                        imagePullPolicy: IfNotPresent
                        args:
                        - '-enableTLS=false'
                        ports:
                        - containerPort: 9003
                          name: metrics
                          protocol: TCP
                        resources:
                          requests:
                            cpu: 100m
                            memory: 100Mi
                        volumeMounts:
                        - name: config-volume
                          mountPath: /app/config.json
                          subPath: config.json
                      volumes:
                      - name: config-volume
                        configMap:
                          name: argocd-metrics-server-configmap
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-metrics-server-service
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-metrics-server-service
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argocd"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: argocd-metrics-server
                  namespace: {{ $tools.argocd.namespace }}
                spec:
                  selector:
                    app: argocd-metrics-server
                  ports:
                  - port: 9003
                    targetPort: 9003
          {{- end }}

          {{/* =================================================================== */}}
          {{/* ARGOCD METRICS SCRAPING (VMServiceScrape) */}}
          {{/* =================================================================== */}}

          {{- if and $shouldDeployVM $argoCdEnabled $tools.argocd $tools.argocd.enabled }}
          {{/* Create dedicated metrics Services (avoid mutating Helm-managed Services) */}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-metrics-service-server
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-metrics-service-server
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argocd"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: argocd-server-metrics
                  namespace: {{ $tools.argocd.namespace }}
                  labels:
                    platform.kubecore.io/component: "argocd"
                    platform.kubecore.io/metrics: "true"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  type: ClusterIP
                  selector:
                    app.kubernetes.io/instance: {{ printf "%s-system-argocd" $clusterName | quote }}
                    app.kubernetes.io/name: "argocd-server"
                  ports:
                    - name: metrics
                      port: 8083
                      targetPort: metrics
                      protocol: TCP

          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-metrics-service-application-controller
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-metrics-service-application-controller
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argocd"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: argocd-application-controller-metrics
                  namespace: {{ $tools.argocd.namespace }}
                  labels:
                    platform.kubecore.io/component: "argocd"
                    platform.kubecore.io/metrics: "true"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  type: ClusterIP
                  selector:
                    app.kubernetes.io/instance: {{ printf "%s-system-argocd" $clusterName | quote }}
                    app.kubernetes.io/name: "argocd-application-controller"
                  ports:
                    - name: metrics
                      port: 8082
                      targetPort: metrics
                      protocol: TCP

          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-metrics-service-repo-server
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-metrics-service-repo-server
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argocd"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: argocd-repo-server-metrics
                  namespace: {{ $tools.argocd.namespace }}
                  labels:
                    platform.kubecore.io/component: "argocd"
                    platform.kubecore.io/metrics: "true"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  type: ClusterIP
                  selector:
                    app.kubernetes.io/instance: {{ printf "%s-system-argocd" $clusterName | quote }}
                    app.kubernetes.io/name: "argocd-repo-server"
                  ports:
                    - name: metrics
                      port: 8084
                      targetPort: metrics
                      protocol: TCP

          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-metrics-service-applicationset-controller
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-metrics-service-applicationset-controller
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argocd"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: argocd-applicationset-controller-metrics
                  namespace: {{ $tools.argocd.namespace }}
                  labels:
                    platform.kubecore.io/component: "argocd"
                    platform.kubecore.io/metrics: "true"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  type: ClusterIP
                  selector:
                    app.kubernetes.io/instance: {{ printf "%s-system-argocd" $clusterName | quote }}
                    app.kubernetes.io/name: "argocd-applicationset-controller"
                  ports:
                    - name: metrics
                      port: 8080
                      targetPort: metrics
                      protocol: TCP

          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-metrics-service-notifications-controller
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-metrics-service-notifications-controller
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argocd"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: argocd-notifications-controller-metrics
                  namespace: {{ $tools.argocd.namespace }}
                  labels:
                    platform.kubecore.io/component: "argocd"
                    platform.kubecore.io/metrics: "true"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  type: ClusterIP
                  selector:
                    app.kubernetes.io/instance: {{ printf "%s-system-argocd" $clusterName | quote }}
                    app.kubernetes.io/name: "argocd-notifications-controller"
                  ports:
                    - name: metrics
                      port: 9001
                      targetPort: metrics
                      protocol: TCP

          {{/* Scrape all the above metrics Services via VMServiceScrape */}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-vmservicescrape
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-vmservicescrape
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "observability"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: operator.victoriametrics.com/v1beta1
                kind: VMServiceScrape
                metadata:
                  name: {{ $clusterName }}-argocd
                  namespace: {{ $vmNamespace }}
                  labels:
                    platform.kubecore.io/component: "argocd"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  namespaceSelector:
                    matchNames:
                      - {{ $tools.argocd.namespace }}
                  selector:
                    matchLabels:
                      platform.kubecore.io/component: "argocd"
                      platform.kubecore.io/metrics: "true"
                  endpoints:
                    - port: metrics
                      path: /metrics
                      interval: 30s
                      scheme: http
          {{- end }}

          {{/* =================================================================== */}}
          {{/* CERT-MANAGER METRICS SCRAPING (VMServiceScrape) */}}
          {{/* =================================================================== */}}

          {{- if and $shouldDeployVM $certManagerEnabled $tools.certManager $tools.certManager.enabled }}
          {{/* Create dedicated metrics Services (avoid mutating Helm-managed Services) */}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cert-manager-metrics-service-controller
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cert-manager-metrics-service-controller
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "cert-manager"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: cert-manager-controller-metrics
                  namespace: {{ $tools.certManager.namespace }}
                  labels:
                    platform.kubecore.io/component: "cert-manager"
                    platform.kubecore.io/metrics: "true"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  type: ClusterIP
                  selector:
                    app.kubernetes.io/instance: {{ printf "%s-system-cert-manager" $clusterName | quote }}
                    app.kubernetes.io/name: "cert-manager"
                    app.kubernetes.io/component: "controller"
                  ports:
                    - name: metrics
                      port: 9402
                      targetPort: http-metrics
                      protocol: TCP

          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cert-manager-metrics-service-cainjector
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cert-manager-metrics-service-cainjector
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "cert-manager"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: cert-manager-cainjector-metrics
                  namespace: {{ $tools.certManager.namespace }}
                  labels:
                    platform.kubecore.io/component: "cert-manager"
                    platform.kubecore.io/metrics: "true"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  type: ClusterIP
                  selector:
                    app.kubernetes.io/instance: {{ printf "%s-system-cert-manager" $clusterName | quote }}
                    app.kubernetes.io/name: "cainjector"
                    app.kubernetes.io/component: "cainjector"
                  ports:
                    - name: metrics
                      port: 9402
                      targetPort: http-metrics
                      protocol: TCP

          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cert-manager-metrics-service-webhook
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cert-manager-metrics-service-webhook
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "cert-manager"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: cert-manager-webhook-metrics
                  namespace: {{ $tools.certManager.namespace }}
                  labels:
                    platform.kubecore.io/component: "cert-manager"
                    platform.kubecore.io/metrics: "true"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  type: ClusterIP
                  selector:
                    app.kubernetes.io/instance: {{ printf "%s-system-cert-manager" $clusterName | quote }}
                    app.kubernetes.io/name: "webhook"
                    app.kubernetes.io/component: "webhook"
                  ports:
                    - name: metrics
                      port: 9402
                      targetPort: http-metrics
                      protocol: TCP

          {{/* Scrape cert-manager metrics Services via VMServiceScrape */}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cert-manager-vmservicescrape
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cert-manager-vmservicescrape
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "observability"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: operator.victoriametrics.com/v1beta1
                kind: VMServiceScrape
                metadata:
                  name: {{ $clusterName }}-cert-manager
                  namespace: {{ $vmNamespace }}
                  labels:
                    platform.kubecore.io/component: "cert-manager"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  namespaceSelector:
                    matchNames:
                      - {{ $tools.certManager.namespace }}
                  selector:
                    matchLabels:
                      platform.kubecore.io/component: "cert-manager"
                      platform.kubecore.io/metrics: "true"
                  endpoints:
                    - port: metrics
                      path: /metrics
                      interval: 30s
                      scheme: http
          {{- end }}

          {{/* =================================================================== */}}
          {{/* EXTERNAL-SECRETS METRICS SCRAPING (VMServiceScrape) */}}
          {{/* =================================================================== */}}

          {{- if and $shouldDeployVM $externalSecretsEnabled $tools.externalSecrets $tools.externalSecrets.enabled }}
          {{/* Create dedicated metrics Services (avoid mutating Helm-managed Services) */}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-external-secrets-metrics-service-controller
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: external-secrets-metrics-service-controller
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "external-secrets"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: external-secrets-metrics
                  namespace: {{ $tools.externalSecrets.namespace }}
                  labels:
                    platform.kubecore.io/component: "external-secrets"
                    platform.kubecore.io/metrics: "true"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  type: ClusterIP
                  selector:
                    app.kubernetes.io/instance: {{ printf "%s-system-external-secrets" $clusterName | quote }}
                    app.kubernetes.io/name: "external-secrets"
                  ports:
                    - name: metrics
                      port: 8080
                      targetPort: metrics
                      protocol: TCP

          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-external-secrets-metrics-service-cert-controller
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: external-secrets-metrics-service-cert-controller
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "external-secrets"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: external-secrets-cert-controller-metrics
                  namespace: {{ $tools.externalSecrets.namespace }}
                  labels:
                    platform.kubecore.io/component: "external-secrets"
                    platform.kubecore.io/metrics: "true"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  type: ClusterIP
                  selector:
                    app.kubernetes.io/instance: {{ printf "%s-system-external-secrets" $clusterName | quote }}
                    app.kubernetes.io/name: "external-secrets-cert-controller"
                  ports:
                    - name: metrics
                      port: 8080
                      targetPort: metrics
                      protocol: TCP

          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-external-secrets-metrics-service-webhook
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: external-secrets-metrics-service-webhook
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "external-secrets"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: external-secrets-webhook-metrics
                  namespace: {{ $tools.externalSecrets.namespace }}
                  labels:
                    platform.kubecore.io/component: "external-secrets"
                    platform.kubecore.io/metrics: "true"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  type: ClusterIP
                  selector:
                    app.kubernetes.io/instance: {{ printf "%s-system-external-secrets" $clusterName | quote }}
                    app.kubernetes.io/name: "external-secrets-webhook"
                  ports:
                    - name: metrics
                      port: 8080
                      targetPort: metrics
                      protocol: TCP

          {{/* Scrape external-secrets metrics Services via VMServiceScrape */}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-external-secrets-vmservicescrape
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: external-secrets-vmservicescrape
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "observability"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: operator.victoriametrics.com/v1beta1
                kind: VMServiceScrape
                metadata:
                  name: {{ $clusterName }}-external-secrets
                  namespace: {{ $vmNamespace }}
                  labels:
                    platform.kubecore.io/component: "external-secrets"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  namespaceSelector:
                    matchNames:
                      - {{ $tools.externalSecrets.namespace }}
                  selector:
                    matchLabels:
                      platform.kubecore.io/component: "external-secrets"
                      platform.kubecore.io/metrics: "true"
                  endpoints:
                    - port: metrics
                      path: /metrics
                      interval: 30s
                      scheme: http
          {{- end }}

          {{/* ArgoCD GitHub Integration ExternalSecret */}}
          {{/* Safely check for ArgoCD and GitHub configuration */}}
          {{- $hasArgoCd := false -}}
          {{- if $argoCdEnabled -}}
            {{- if $tools -}}
              {{- if $tools.argocd -}}
                {{- if $tools.argocd.enabled -}}
                  {{- $hasArgoCd = true -}}
                {{- end -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}

          {{- $hasGithub := false -}}
          {{- if $envConfig.github -}}
            {{- if $envConfig.github.secretManager -}}
              {{- if $envConfig.github.secretManager.secretName -}}
                {{- $hasGithub = true -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}

          {{- if and $hasArgoCd $hasGithub }}

          {{/* Extract GitHub configuration with defaults */}}
          {{- $githubSecretName := $envConfig.github.secretManager.secretName -}}
          {{- $defaultKeyMappings := dict "appId" "appId" "installationId" "installationId" "privateKey" "privateKey" -}}
          {{- $keyMappings := $envConfig.github.secretManager.keyMappings | default $defaultKeyMappings -}}

          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-github-externalsecret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-github-externalsecret
              platform.kubecore.io/github-org: {{ $envConfig.github.organization | quote }}
              platform.kubecore.io/secret-source: {{ $envConfig.github.secretManager.secretName | quote }}
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argocd"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: {{ $clusterName }}-github-write-secret
                  namespace: {{ $tools.argocd.namespace }}
                  labels:
                    argocd.argoproj.io/secret-type: repo-creds
                    platform.kubecore.io/kubesystem: {{ $name }}
                    platform.kubecore.io/part-of: "system"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    kind: ClusterSecretStore
                    name: {{ $envConfig.organization.name }}-infrastructure-secrets
                  target:
                    name: {{ $clusterName }}-github-write-secret
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      type: Opaque
                      engineVersion: v2
                      metadata:
                        labels:
                          argocd.argoproj.io/secret-type: repo-creds
                      data:
                        githubAppID: "{{ `{{ .appId }}` }}"
                        githubAppInstallationID: "{{ `{{ .installationId }}` }}"
                        githubAppPrivateKey: "{{ `{{ .privateKey }}` }}"
                        url: "https://github.com/{{ $envConfig.github.organization }}"
                        type: "git"
                  data:
                    - secretKey: appId
                      remoteRef:
                        key: {{ $githubSecretName }}
                        property: {{ $keyMappings.appId }}
                    - secretKey: installationId
                      remoteRef:
                        key: {{ $githubSecretName }}
                        property: {{ $keyMappings.installationId }}
                    - secretKey: privateKey
                      remoteRef:
                        key: {{ $githubSecretName }}
                        property: {{ $keyMappings.privateKey }}
          {{- end }}

          {{/* GitOps Promoter GitHub Integration ExternalSecret */}}
          {{/* Safely check for GitOps Promoter and GitHub configuration */}}
          {{- $hasGitopsPromoter := false -}}
          {{- if $gitopsPromoterEnabled -}}
            {{- if $tools -}}
              {{- if $tools.gitopsPromoter -}}
                {{- if $tools.gitopsPromoter.enabled -}}
                  {{- $hasGitopsPromoter = true -}}
                {{- end -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}

          {{- if and $hasGitopsPromoter $hasGithub }}

          {{/* Extract GitHub configuration with defaults - needed for this scope */}}
          {{- $githubSecretName := $envConfig.github.secretManager.secretName -}}
          {{- $defaultKeyMappings := dict "appId" "appId" "installationId" "installationId" "privateKey" "privateKey" -}}
          {{- $keyMappings := $envConfig.github.secretManager.keyMappings | default $defaultKeyMappings -}}

          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-gitops-promoter-github-externalsecret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: gitops-promoter-github-externalsecret
              platform.kubecore.io/github-org: {{ $envConfig.github.organization | quote }}
              platform.kubecore.io/secret-source: {{ $envConfig.github.secretManager.secretName | quote }}
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "gitops-promoter"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: {{ $clusterName }}-gitops-promoter-github-secret
                  namespace: {{ $tools.gitopsPromoter.namespace }}
                  labels:
                    platform.kubecore.io/kubesystem: {{ $name }}
                    platform.kubecore.io/part-of: "system"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    kind: ClusterSecretStore
                    name: {{ $envConfig.organization.name }}-infrastructure-secrets
                  target:
                    name: {{ $clusterName }}-gitops-promoter-github-secret
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      type: Opaque
                      engineVersion: v2
                      data:
                        githubAppPrivateKey: "{{ `{{ .privateKey }}` }}"
                  data:
                    - secretKey: privateKey
                      remoteRef:
                        key: {{ $githubSecretName }}
                        property: {{ $keyMappings.privateKey }}

          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-gitops-promoter-github-token-generator
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: gitops-promoter-github-token-generator
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "gitops-promoter"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: GithubAccessToken
                metadata:
                  name: gitops-promoter-github-token
                  namespace: {{ $tools.gitopsPromoter.namespace }}
                  labels:
                    platform.kubecore.io/kubesystem: {{ $name }}
                    platform.kubecore.io/part-of: "system"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  appID: "{{ $envConfig.github.appId }}"
                  installID: "{{ $envConfig.github.installationId }}"
                  auth:
                    privateKey:
                      secretRef:
                        name: {{ $clusterName }}-gitops-promoter-github-secret
                        key: githubAppPrivateKey

          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-gitops-promoter-github-token-externalsecret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: gitops-promoter-github-token-externalsecret
              platform.kubecore.io/github-org: {{ $envConfig.github.organization | quote }}
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "gitops-promoter"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: gitops-promoter-github-token
                  namespace: {{ $tools.gitopsPromoter.namespace }}
                  labels:
                    platform.kubecore.io/kubesystem: {{ $name }}
                    platform.kubecore.io/part-of: "system"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  refreshInterval: "30m0s"
                  target:
                    name: gitops-promoter-github-token
                    creationPolicy: Owner
                  dataFrom:
                  - sourceRef:
                      generatorRef:
                        apiVersion: generators.external-secrets.io/v1alpha1
                        kind: GithubAccessToken
                        name: gitops-promoter-github-token

          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cluster-scm-provider
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cluster-scm-provider
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "gitops-promoter"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: promoter.argoproj.io/v1alpha1
                kind: ClusterScmProvider
                metadata:
                  name: {{ $envConfig.organization.name }}-github-scm-provider
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  secretRef:
                    name: {{ $clusterName }}-gitops-promoter-github-secret
                    namespace: {{ $tools.gitopsPromoter.namespace }}
                  github:
                    appID: {{ $envConfig.github.appId }}
                    installationID: {{ $envConfig.github.installationId }}
          {{- end }}

          {{/* Argo Rollouts Installation */}}
          {{- if and $argoRolloutsEnabled $tools.argoRollouts $tools.argoRollouts.enabled }}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-system-argo-rollouts
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-rollouts-release
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argo-rollouts"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              chart:
                name: argo-rollouts
                repository: {{ $tools.argoRollouts.repository.url }}
                version: "{{ $tools.argoRollouts.version }}"
              namespace: {{ $tools.argoRollouts.namespace }}
              values:
                controller:
                  {{- if $tools.argoRollouts.controller.replicas }}
                  replicas: {{ $tools.argoRollouts.controller.replicas }}
                  {{- end }}
                  {{- if $tools.argoRollouts.controller.resources }}
                  resources:
                    {{- if $tools.argoRollouts.controller.resources.requests }}
                    requests:
                      {{- range $key, $value := $tools.argoRollouts.controller.resources.requests }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                    {{- if $tools.argoRollouts.controller.resources.limits }}
                    limits:
                      {{- range $key, $value := $tools.argoRollouts.controller.resources.limits }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                  {{- end }}
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tolerations }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: "{{ $toleration.key }}"
                      operator: "{{ $toleration.operator }}"
                      {{- if $toleration.value }}
                      value: "{{ $toleration.value }}"
                      {{- end }}
                      effect: "{{ $toleration.effect }}"
                    {{- end }}
                  {{- end }}
                {{- if $tools.argoRollouts.dashboard.enabled }}
                dashboard:
                  enabled: {{ $tools.argoRollouts.dashboard.enabled }}
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tolerations }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: "{{ $toleration.key }}"
                      operator: "{{ $toleration.operator }}"
                      {{- if $toleration.value }}
                      value: "{{ $toleration.value }}"
                      {{- end }}
                      effect: "{{ $toleration.effect }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tools.argoRollouts.dashboard.ingress.enabled }}
                  ingress:
                    enabled: {{ $tools.argoRollouts.dashboard.ingress.enabled }}
                    ingressClassName: {{ $tools.argoRollouts.dashboard.ingress.className }}
                    hosts:
                      - rollouts.system.{{ $dns.clusterDomain }}
                    paths:
                      - /
                    pathType: Prefix
                    {{- if $tools.argoRollouts.dashboard.ingress.tls }}
                    tls:
                      - secretName: argo-rollouts-dashboard-tls
                        hosts:
                          - rollouts.system.{{ $dns.clusterDomain }}
                    {{- end }}
                    {{- if $tools.argoRollouts.dashboard.ingress.annotations }}
                    annotations:
                      cert-manager.io/cluster-issuer: {{ $clusterIssuerName }}
                      {{- range $key, $value := $tools.argoRollouts.dashboard.ingress.annotations }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- else }}
                    annotations:
                      cert-manager.io/cluster-issuer: {{ $clusterIssuerName }}
                    {{- end }}
                  {{- end }}
                {{- end }}
          {{- end }}
          
          {{/* Argo Workflows Zitadel OIDC ExternalSecret */}}
          {{- $hasArgoWfOIDC := false -}}
          {{- if and $argoWorkflowsEnabled $tools.argoWorkflows $tools.argoWorkflows.enabled -}}
            {{- if $tools.argoWorkflows.oidc -}}
              {{- if $tools.argoWorkflows.oidc.enabled -}}
                {{- $hasArgoWfOIDC = true -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}
          {{- if $hasArgoWfOIDC }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argo-workflows-oidc-external-secret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-workflows-oidc-external-secret
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argo-workflows"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            readiness:
              policy: DeriveFromCelQuery
              celQuery: 'object.status.conditions.exists(c, c.type == "Ready" && c.status == "True")'
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: argo-workflows-zitadel-oidc
                  namespace: {{ $tools.argoWorkflows.namespace }}
                  labels:
                    platform.kubecore.io/kubesystem: {{ $name }}
                    platform.kubecore.io/part-of: "system"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    kind: ClusterSecretStore
                    name: {{ $envConfig.organization.name }}-infrastructure-secrets
                  target:
                    name: argo-workflows-zitadel-oidc
                    creationPolicy: Owner
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/part-of: argo-workflows
                  data:
                    - secretKey: client-id
                      remoteRef:
                        key: {{ $tools.argoWorkflows.oidc.secretName }}
                        property: client-id
                    - secretKey: client-secret
                      remoteRef:
                        key: {{ $tools.argoWorkflows.oidc.secretName }}
                        property: client-secret
          {{- end }}

          {{/* Argo Workflows Installation */}}
          {{- if and $argoWorkflowsEnabled $tools.argoWorkflows $tools.argoWorkflows.enabled }}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-system-argo-workflows
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-workflows-release
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argo-workflows"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              chart:
                name: argo-workflows
                repository: {{ $tools.argoWorkflows.repository.url }}
                version: "{{ $tools.argoWorkflows.version }}"
              namespace: {{ $tools.argoWorkflows.namespace }}
              values:
                # Enable cluster-wide workflow watching - allows UI to see workflows in all namespaces
                singleNamespace: false
                controller:
                  {{- if $tools.argoWorkflows.controller.resources }}
                  resources:
                    {{- if $tools.argoWorkflows.controller.resources.requests }}
                    requests:
                      {{- range $key, $value := $tools.argoWorkflows.controller.resources.requests }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                    {{- if $tools.argoWorkflows.controller.resources.limits }}
                    limits:
                      {{- range $key, $value := $tools.argoWorkflows.controller.resources.limits }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                  {{- end }}
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tolerations }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: "{{ $toleration.key }}"
                      operator: "{{ $toleration.operator }}"
                      {{- if $toleration.value }}
                      value: "{{ $toleration.value }}"
                      {{- end }}
                      effect: "{{ $toleration.effect }}"
                    {{- end }}
                  {{- end }}
                {{- if $tools.argoWorkflows.server.enabled }}
                server:
                  enabled: {{ $tools.argoWorkflows.server.enabled }}
                  {{- if $hasArgoWfOIDC }}
                  authModes:
                    - sso
                  sso:
                    enabled: true
                    issuer: {{ $tools.argoWorkflows.oidc.issuer }}
                    redirectUrl: https://workflows.system.{{ $dns.clusterDomain }}/oauth2/callback
                    clientId:
                      name: argo-workflows-zitadel-oidc
                      key: client-id
                    clientSecret:
                      name: argo-workflows-zitadel-oidc
                      key: client-secret
                    scopes:
                      - openid
                      - profile
                      - email
                      - groups
                    rbac:
                      enabled: true
                  {{- end }}
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tolerations }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: "{{ $toleration.key }}"
                      operator: "{{ $toleration.operator }}"
                      {{- if $toleration.value }}
                      value: "{{ $toleration.value }}"
                      {{- end }}
                      effect: "{{ $toleration.effect }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tools.argoWorkflows.server.ingress.enabled }}
                  ingress:
                    enabled: {{ $tools.argoWorkflows.server.ingress.enabled }}
                    ingressClassName: {{ $tools.argoWorkflows.server.ingress.className }}
                    hosts:
                      - workflows.system.{{ $dns.clusterDomain }}
                    {{- if $tools.argoWorkflows.server.ingress.tls }}
                    tls:
                      - secretName: argo-workflows-server-tls
                        hosts:
                          - workflows.system.{{ $dns.clusterDomain }}
                    {{- end }}
                    {{- if $tools.argoWorkflows.server.ingress.annotations }}
                    annotations:
                      cert-manager.io/cluster-issuer: {{ $clusterIssuerName }}
                      {{- range $key, $value := $tools.argoWorkflows.server.ingress.annotations }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- else }}
                    annotations:
                      cert-manager.io/cluster-issuer: {{ $clusterIssuerName }}
                    {{- end }}
                  {{- end }}
                {{- end }}
          {{- end }}

          {{/* Argo Workflows SSO RBAC ServiceAccounts and ClusterRoleBindings */}}
          {{- if $hasArgoWfOIDC }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argo-workflows-sso-admin-sa
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-workflows-sso-admin-sa
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argo-workflows"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: argo-workflows-sso-admin
                  namespace: {{ $tools.argoWorkflows.namespace }}
                  annotations:
                    workflows.argoproj.io/rbac-rule: "'kubeorg:{{ $envConfig.organization.name }}:admin' in groups"
                    workflows.argoproj.io/rbac-rule-precedence: "100"
                  labels:
                    platform.kubecore.io/kubesystem: {{ $name }}
                    platform.kubecore.io/part-of: "system"
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argo-workflows-sso-user-sa
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-workflows-sso-user-sa
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argo-workflows"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: argo-workflows-sso-user
                  namespace: {{ $tools.argoWorkflows.namespace }}
                  annotations:
                    workflows.argoproj.io/rbac-rule: "'kubeorg:{{ $envConfig.organization.name }}:ops' in groups || 'kubeorg:{{ $envConfig.organization.name }}:dev' in groups"
                    workflows.argoproj.io/rbac-rule-precedence: "50"
                  labels:
                    platform.kubecore.io/kubesystem: {{ $name }}
                    platform.kubecore.io/part-of: "system"
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argo-workflows-sso-readonly-sa
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-workflows-sso-readonly-sa
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argo-workflows"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: argo-workflows-sso-readonly
                  namespace: {{ $tools.argoWorkflows.namespace }}
                  annotations:
                    workflows.argoproj.io/rbac-rule: "'kubeorg:{{ $envConfig.organization.name }}:business' in groups"
                    workflows.argoproj.io/rbac-rule-precedence: "10"
                  labels:
                    platform.kubecore.io/kubesystem: {{ $name }}
                    platform.kubecore.io/part-of: "system"
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argo-workflows-sso-admin-crb
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-workflows-sso-admin-crb
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argo-workflows"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: argo-workflows-sso-admin-binding
                  labels:
                    platform.kubecore.io/kubesystem: {{ $name }}
                    platform.kubecore.io/part-of: "system"
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: argo-admin
                subjects:
                  - kind: ServiceAccount
                    name: argo-workflows-sso-admin
                    namespace: {{ $tools.argoWorkflows.namespace }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argo-workflows-sso-user-crb
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-workflows-sso-user-crb
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argo-workflows"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: argo-workflows-sso-user-binding
                  labels:
                    platform.kubecore.io/kubesystem: {{ $name }}
                    platform.kubecore.io/part-of: "system"
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: argo-edit
                subjects:
                  - kind: ServiceAccount
                    name: argo-workflows-sso-user
                    namespace: {{ $tools.argoWorkflows.namespace }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argo-workflows-sso-readonly-crb
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-workflows-sso-readonly-crb
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argo-workflows"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: argo-workflows-sso-readonly-binding
                  labels:
                    platform.kubecore.io/kubesystem: {{ $name }}
                    platform.kubecore.io/part-of: "system"
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: argo-view
                subjects:
                  - kind: ServiceAccount
                    name: argo-workflows-sso-readonly
                    namespace: {{ $tools.argoWorkflows.namespace }}
          {{- end }}
          
          {{/* Traefik Installation */}}
          {{- if and $traefikEnabled $tools.traefik $tools.traefik.enabled }}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-system-traefik
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: traefik-release
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "traefik"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              chart:
                name: traefik
                repository: {{ $tools.traefik.repository.url }}
                version: "{{ $tools.traefik.version }}"
              namespace: {{ $tools.traefik.namespace }}
              values:
                deployment:
                  {{- if $tools.traefik.deployment.replicas }}
                  replicas: {{ $tools.traefik.deployment.replicas }}
                  {{- end }}
                {{- if $tools.traefik.resources }}
                resources:
                  {{- if $tools.traefik.resources.requests }}
                  requests:
                    {{- range $key, $value := $tools.traefik.resources.requests }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tools.traefik.resources.limits }}
                  limits:
                    {{- range $key, $value := $tools.traefik.resources.limits }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                {{- end }}
                {{- if $tools.traefik.service }}
                service:
                  {{- if $tools.traefik.service.type }}
                  type: {{ $tools.traefik.service.type }}
                  {{- end }}
                  {{- if $tools.traefik.service.annotations }}
                  annotations:
                    {{- range $key, $value := $tools.traefik.service.annotations }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                {{- end }}
                {{- if $tools.traefik.ingressClass }}
                ingressClass:
                  enabled: true
                  isDefaultClass: {{ $tools.traefik.ingressClass.isDefaultClass }}
                  name: {{ $tools.traefik.ingressClass.name }}
                {{- end }}
                providers:
                  kubernetesIngress:
                    publishedService:
                      enabled: true
                {{- if $nodeSelector }}
                nodeSelector:
                  {{- range $key, $value := $nodeSelector }}
                  {{ $key }}: "{{ $value }}"
                  {{- end }}
                {{- end }}
                {{- if $tolerations }}
                tolerations:
                  {{- range $toleration := $tolerations }}
                  - key: "{{ $toleration.key }}"
                    operator: "{{ $toleration.operator }}"
                    {{- if $toleration.value }}
                    value: "{{ $toleration.value }}"
                    {{- end }}
                    effect: "{{ $toleration.effect }}"
                  {{- end }}
                {{- end }}
          {{- end }}

          {{/* External Secrets Operator Installation */}}
          {{- if and $externalSecretsEnabled $tools.externalSecrets $tools.externalSecrets.enabled }}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-system-external-secrets
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: external-secrets-release
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "external-secrets"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              chart:
                name: external-secrets
                repository: {{ $tools.externalSecrets.repository.url }}
                version: "{{ $tools.externalSecrets.version }}"
              namespace: {{ $tools.externalSecrets.namespace }}
              values:
                installCRDs: true
                serviceAccount:
                  create: false
                  name: {{ $envConfig.organization.name }}-eso-sa
                {{- if $tools.externalSecrets.resources }}
                resources:
                  {{- if $tools.externalSecrets.resources.requests }}
                  requests:
                    {{- range $key, $value := $tools.externalSecrets.resources.requests }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tools.externalSecrets.resources.limits }}
                  limits:
                    {{- range $key, $value := $tools.externalSecrets.resources.limits }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                {{- end }}
                serviceMonitor:
                  enabled: {{ $runtime.monitoring.enabled | default false }}
                {{- if $nodeSelector }}
                nodeSelector:
                  {{- range $key, $value := $nodeSelector }}
                  {{ $key }}: "{{ $value }}"
                  {{- end }}
                {{- end }}
                {{- if $tolerations }}
                tolerations:
                  {{- range $toleration := $tolerations }}
                  - key: "{{ $toleration.key }}"
                    operator: "{{ $toleration.operator }}"
                    {{- if $toleration.value }}
                    value: "{{ $toleration.value }}"
                    {{- end }}
                    effect: "{{ $toleration.effect }}"
                  {{- end }}
                {{- end }}
                # Apply tolerations and nodeSelector to cert-controller
                certController:
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tolerations }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: "{{ $toleration.key }}"
                      operator: "{{ $toleration.operator }}"
                      {{- if $toleration.value }}
                      value: "{{ $toleration.value }}"
                      {{- end }}
                      effect: "{{ $toleration.effect }}"
                    {{- end }}
                  {{- end }}
                # Apply tolerations and nodeSelector to webhook
                webhook:
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tolerations }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: "{{ $toleration.key }}"
                      operator: "{{ $toleration.operator }}"
                      {{- if $toleration.value }}
                      value: "{{ $toleration.value }}"
                      {{- end }}
                      effect: "{{ $toleration.effect }}"
                    {{- end }}
                  {{- end }}
          {{- end }}

          {{/* GitOps Promoter Installation */}}
          {{- if and $gitopsPromoterEnabled $tools.gitopsPromoter $tools.gitopsPromoter.enabled }}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-system-gitops-promoter
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: gitops-promoter-release
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "gitops-promoter"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              chart:
                name: gitops-promoter
                repository: {{ $tools.gitopsPromoter.repository.url }}
                version: "{{ $tools.gitopsPromoter.version }}"
              namespace: {{ $tools.gitopsPromoter.namespace }}
              values:
                fullnameOverride: "gitops-promoter"  # Keeps service names under 63 chars
                namespace:
                  create: false  # Namespace is managed by Crossplane
                controllerManager:
                  {{- if $tools.gitopsPromoter.controllerManager.replicas }}
                  replicaCount: {{ $tools.gitopsPromoter.controllerManager.replicas }}
                  {{- end }}
                  {{- if $tools.gitopsPromoter.controllerManager.resources }}
                  resources:
                    {{- if $tools.gitopsPromoter.controllerManager.resources.requests }}
                    requests:
                      {{- range $key, $value := $tools.gitopsPromoter.controllerManager.resources.requests }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                    {{- if $tools.gitopsPromoter.controllerManager.resources.limits }}
                    limits:
                      {{- range $key, $value := $tools.gitopsPromoter.controllerManager.resources.limits }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                  {{- end }}

                kubeRbacProxy:
                  {{- if $tools.gitopsPromoter.kubeRbacProxy.resources }}
                  resources:
                    {{- if $tools.gitopsPromoter.kubeRbacProxy.resources.requests }}
                    requests:
                      {{- range $key, $value := $tools.gitopsPromoter.kubeRbacProxy.resources.requests }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                    {{- if $tools.gitopsPromoter.kubeRbacProxy.resources.limits }}
                    limits:
                      {{- range $key, $value := $tools.gitopsPromoter.kubeRbacProxy.resources.limits }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                  {{- end }}

                {{- if or $nodeSelector $tolerations }}
                pod:
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tolerations }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: "{{ $toleration.key }}"
                      operator: "{{ $toleration.operator }}"
                      {{- if $toleration.value }}
                      value: "{{ $toleration.value }}"
                      {{- end }}
                      effect: "{{ $toleration.effect }}"
                    {{- end }}
                  {{- end }}
                {{- end }}

                services:
                  {{- if $tools.gitopsPromoter.services.metrics }}
                  metrics:
                    enabled: {{ $tools.gitopsPromoter.services.metrics.enabled }}
                  {{- end }}
                  {{- if $tools.gitopsPromoter.services.webhookReceiver }}
                  webhookReceiver:
                    enabled: {{ $tools.gitopsPromoter.services.webhookReceiver.enabled }}
                  {{- end }}

                {{- if and $tools.gitopsPromoter.ingress $tools.gitopsPromoter.ingress.enabled }}
                ingress:
                  enabled: {{ $tools.gitopsPromoter.ingress.enabled }}
                  ingressClassName: {{ $tools.gitopsPromoter.ingress.ingressClassName }}
                  hostname: {{ regexReplaceAll "\\{cluster-domain\\}" $tools.gitopsPromoter.ingress.hostname $dns.clusterDomain }}
                  {{- if $tools.gitopsPromoter.ingress.tls }}
                  tls:
                    enabled: {{ $tools.gitopsPromoter.ingress.tls.enabled }}
                    {{- if not $tools.gitopsPromoter.ingress.tls.secretName }}
                    secretName: {{ regexReplaceAll "\\{cluster-domain\\}" $tools.gitopsPromoter.ingress.hostname $dns.clusterDomain }}
                    {{- end }}
                  {{- end }}
                  {{- if $tools.gitopsPromoter.ingress.annotations }}
                  annotations:
                    cert-manager.io/cluster-issuer: {{ $clusterIssuerName }}
                    {{- range $key, $value := $tools.gitopsPromoter.ingress.annotations }}
                    {{- if ne $key "cert-manager.io/cluster-issuer" }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    {{- end }}
                    {{- if and $externalDnsEnabled $tools.externalDns $tools.externalDns.enabled }}
                    # ExternalDNS annotations
                    external-dns.alpha.kubernetes.io/hostname: {{ regexReplaceAll "\\{cluster-domain\\}" $tools.gitopsPromoter.ingress.hostname $dns.clusterDomain }}
                    external-dns.alpha.kubernetes.io/ttl: "300"
                    {{- end }}
                  {{- else }}
                  annotations:
                    cert-manager.io/cluster-issuer: {{ $clusterIssuerName }}
                    {{- if and $externalDnsEnabled $tools.externalDns $tools.externalDns.enabled }}
                    # ExternalDNS annotations
                    external-dns.alpha.kubernetes.io/hostname: {{ regexReplaceAll "\\{cluster-domain\\}" $tools.gitopsPromoter.ingress.hostname $dns.clusterDomain }}
                    external-dns.alpha.kubernetes.io/ttl: "300"
                    {{- end }}
                  {{- end }}
                {{- end }}

                controllerConfiguration:
                  enabled: true
                  {{- $ctrlConfig := $tools.gitopsPromoter.controllerConfiguration }}
                  {{- if $ctrlConfig.argocdCommitStatus }}
                  argocdCommitStatus:
                    {{- if $ctrlConfig.argocdCommitStatus.watchLocalApplications }}
                    watchLocalApplications: {{ $ctrlConfig.argocdCommitStatus.watchLocalApplications }}
                    {{- end }}
                    {{- if $ctrlConfig.argocdCommitStatus.workQueue }}
                    workQueue:
                      maxConcurrentReconciles: {{ $ctrlConfig.argocdCommitStatus.workQueue.maxConcurrentReconciles }}
                      requeueDuration: {{ $ctrlConfig.argocdCommitStatus.workQueue.requeueDuration | quote }}
                    {{- end }}
                  {{- end }}
                  {{- if $ctrlConfig.changeTransferPolicy }}
                  changeTransferPolicy:
                    {{- if $ctrlConfig.changeTransferPolicy.workQueue }}
                    workQueue:
                      maxConcurrentReconciles: {{ $ctrlConfig.changeTransferPolicy.workQueue.maxConcurrentReconciles }}
                      requeueDuration: {{ $ctrlConfig.changeTransferPolicy.workQueue.requeueDuration | quote }}
                    {{- end }}
                  {{- end }}
                  {{- if $ctrlConfig.commitStatus }}
                  commitStatus:
                    {{- if $ctrlConfig.commitStatus.workQueue }}
                    workQueue:
                      maxConcurrentReconciles: {{ $ctrlConfig.commitStatus.workQueue.maxConcurrentReconciles }}
                      requeueDuration: {{ $ctrlConfig.commitStatus.workQueue.requeueDuration | quote }}
                    {{- end }}
                  {{- end }}
                  {{- if $ctrlConfig.promotionStrategy }}
                  promotionStrategy:
                    {{- if $ctrlConfig.promotionStrategy.workQueue }}
                    workQueue:
                      maxConcurrentReconciles: {{ $ctrlConfig.promotionStrategy.workQueue.maxConcurrentReconciles }}
                      requeueDuration: {{ $ctrlConfig.promotionStrategy.workQueue.requeueDuration | quote }}
                    {{- end }}
                  {{- end }}
                  {{- if $ctrlConfig.gitCommitStatus }}
                  gitCommitStatus:
                    {{- if $ctrlConfig.gitCommitStatus.workQueue }}
                    workQueue:
                      maxConcurrentReconciles: {{ $ctrlConfig.gitCommitStatus.workQueue.maxConcurrentReconciles }}
                      requeueDuration: {{ $ctrlConfig.gitCommitStatus.workQueue.requeueDuration | quote }}
                    {{- end }}
                  {{- end }}
                  {{- if $ctrlConfig.timedCommitStatus }}
                  timedCommitStatus:
                    {{- if $ctrlConfig.timedCommitStatus.workQueue }}
                    workQueue:
                      maxConcurrentReconciles: {{ $ctrlConfig.timedCommitStatus.workQueue.maxConcurrentReconciles }}
                      requeueDuration: {{ $ctrlConfig.timedCommitStatus.workQueue.requeueDuration | quote }}
                    {{- end }}
                  {{- end }}
                  {{- if $ctrlConfig.pullRequest }}
                  pullRequest:
                    {{- if $ctrlConfig.pullRequest.workQueue }}
                    workQueue:
                      maxConcurrentReconciles: {{ $ctrlConfig.pullRequest.workQueue.maxConcurrentReconciles }}
                      requeueDuration: {{ $ctrlConfig.pullRequest.workQueue.requeueDuration | quote }}
                    {{- end }}
                    {{- if $ctrlConfig.pullRequest.template }}
                    template:
                      title: {{ $ctrlConfig.pullRequest.template.title | quote }}
                      {{- if $ctrlConfig.pullRequest.template.description }}
                      description: {{ $ctrlConfig.pullRequest.template.description | quote }}
                      {{- end }}
                    {{- end }}
                  {{- end }}

                gitFetchDaemon:
                  enabled: true
                  secret:
                    name: "gitops-promoter-github-token"
                    tokenKey: "token"
                  image:
                    repository: alpine/git
                    tag: "v2.49.1" 
                    pullPolicy: IfNotPresent

                crds:
                  install: true
                  keep: true
          {{- end }}

          {{/* =================================================================== */}}
          {{/* AWS IAM RESOURCES FOR ESO */}}
          {{/* =================================================================== */}}

          {{/* Cluster-specific ESO IAM Role with OIDC trust policy */}}
          {{- if and $externalSecretsEnabled $tools.externalSecrets $tools.externalSecrets.enabled $oidcIssuerUrl }}
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Role
          metadata:
            name: {{ $clusterName }}-eso-role
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cluster-eso-role
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/resource-type: iam-role
              platform.kubecore.io/role-type: eso-irsa
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              description: "External Secrets Operator IRSA role for {{ $clusterName }}"
              # Trust policy for cluster-specific OIDC provider
              # CRITICAL: Use StringEquals (not StringLike) for reliability and security
              # StringLike with wildcards can fail with AWS STS AssumeRoleWithWebIdentity
              # Exact match follows principle of least privilege and is more reliable
              assumeRolePolicy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "Federated": "{{ $oidcProviderArn }}"
                      },
                      "Action": "sts:AssumeRoleWithWebIdentity",
                      "Condition": {
                        "StringEquals": {
                          "{{ regexReplaceAll "^https://" $oidcIssuerUrl "" }}:aud": "sts.amazonaws.com",
                          "{{ regexReplaceAll "^https://" $oidcIssuerUrl "" }}:sub": "system:serviceaccount:{{ $tools.externalSecrets.namespace }}:{{ $envConfig.organization.name }}-eso-sa"
                        }
                      }
                    }
                  ]
                }
              tags:
                {{- range $key, $value := $costTags }}
                {{ $key }}: {{ $value | quote }}
                {{- end }}
                Name: "{{ $clusterName }}-eso-role"
                Cluster: "{{ $clusterName }}"
                Purpose: "ESO IRSA Role"
                Organization: "{{ $envConfig.organization.name }}"
          {{- end }}

          {{/* Attach AWS Secrets Manager policy to cluster ESO role */}}
          {{- if and $externalSecretsEnabled $tools.externalSecrets $tools.externalSecrets.enabled $oidcIssuerUrl }}
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: RolePolicyAttachment
          metadata:
            name: {{ $clusterName }}-eso-secrets-attachment
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cluster-eso-secrets-attachment
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              policyArn: "arn:aws:iam::aws:policy/SecretsManagerReadWrite"
              roleRef:
                name: {{ $clusterName }}-eso-role
          {{- end }}

          {{/* Attach ECR power user policy to cluster ESO role for ECRAuthorizationToken generators */}}
          {{- if and $externalSecretsEnabled $tools.externalSecrets $tools.externalSecrets.enabled $oidcIssuerUrl }}
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: RolePolicyAttachment
          metadata:
            name: {{ $clusterName }}-eso-ecr-attachment
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cluster-eso-ecr-attachment
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              policyArn: "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser"
              roleRef:
                name: {{ $clusterName }}-eso-role
          {{- end }}

          {{/* =================================================================== */}}
          {{/* ECR CREDENTIAL ACCESS IAM ROLE (SEPARATE FROM ESO ROLE) */}}
          {{/* =================================================================== */}}
          {{/* This role is specifically for app-level ECR credential access */}}
          {{/* Apps create per-namespace ServiceAccounts that assume this role */}}

          {{/* ECR Credentials IAM Role with OIDC trust policy */}}
          {{- if and $externalSecretsEnabled $tools.externalSecrets $tools.externalSecrets.enabled $oidcIssuerUrl }}
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Role
          metadata:
            name: {{ $clusterName }}-ecr-credentials-role
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ecr-credentials-role
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: {{ $value | quote }}
              {{- end }}
              platform.kubecore.io/cluster: {{ $clusterName }}
              platform.kubecore.io/resource-type: iam-role
              platform.kubecore.io/role-type: ecr-credentials
          spec:
            # Use Delete policy to ensure IAM role is removed from AWS when cluster is deleted
            # This prevents orphaned roles that block organization-level ECR policy deletion
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              description: "ECR credentials access role for {{ $clusterName }} - allows app-level ECR credential generation"
              # Use StringLike to allow ServiceAccounts from both external-secrets namespace (for ESO pod)
              # and environment namespaces (for app-level generators)
              # ECR SA lives in app env namespaces (e.g. novelcore-project-dev). Use StringLike so any namespace can assume this role. Do NOT change to StringEquals or ECR auth will break. See .docs/lessons/irsa-trust-policy-stringequals.md and kubeapp-e2e-root-causes-and-prevention.md.
              assumeRolePolicy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "Federated": "{{ $oidcProviderArn }}"
                      },
                      "Action": "sts:AssumeRoleWithWebIdentity",
                      "Condition": {
                        "StringEquals": {
                          "{{ regexReplaceAll "^https://" $oidcIssuerUrl "" }}:aud": "sts.amazonaws.com"
                        },
                        "StringLike": {
                          "{{ regexReplaceAll "^https://" $oidcIssuerUrl "" }}:sub": "system:serviceaccount:*:{{ $envConfig.organization.name }}-eso-sa"
                        }
                      }
                    }
                  ]
                }
              tags:
                {{- range $key, $value := $costTags }}
                {{ $key }}: {{ $value | quote }}
                {{- end }}
                Name: {{ $clusterName }}-ecr-credentials-role
                Cluster: {{ $clusterName }}
                ManagedBy: crossplane
                Purpose: ecr-credentials
                Organization: {{ $envConfig.organization.name }}
          {{- end }}

          {{/* Attach ECR policy to ECR Credentials role */}}
          {{- if and $externalSecretsEnabled $tools.externalSecrets $tools.externalSecrets.enabled $oidcIssuerUrl }}
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: RolePolicyAttachment
          metadata:
            name: {{ $name }}-ecr-credentials-ecr-policy
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ecr-credentials-ecr-policy-attachment
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: {{ $value | quote }}
              {{- end }}
              platform.kubecore.io/cluster: {{ $clusterName }}
              platform.kubecore.io/resource-type: policy-attachment
          spec:
            # Use Delete policy to ensure policy attachment is removed from AWS when cluster is deleted
            # This prevents orphaned attachments that block organization-level ECR policy deletion
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              policyArnSelector:
                matchLabels:
                  platform.kubecore.io/organization: {{ $envConfig.organization.name }}
                  platform.kubecore.io/policy-type: ecr
              roleRef:
                name: {{ $clusterName }}-ecr-credentials-role
          {{- end }}

          {{/* =================================================================== */}}
          {{/* KUBERNETES RESOURCES FOR ESO */}}
          {{/* =================================================================== */}}

          {{/* ESO Service Account with IRSA */}}
          {{- if and $externalSecretsEnabled $tools.externalSecrets $tools.externalSecrets.enabled $oidcIssuerUrl }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-eso-service-account
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: eso-service-account
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: {{ $envConfig.organization.name }}-eso-sa
                  namespace: {{ $tools.externalSecrets.namespace }}
                  annotations:
                    eks.amazonaws.com/role-arn: {{ printf "arn:aws:iam::%s:role/%s-eso-role" $envConfig.aws.accountId $clusterName }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
          {{- end }}

          {{/* ClusterSecretStore for AWS Secrets Manager */}}
          {{- if and $externalSecretsEnabled $tools.externalSecrets $tools.externalSecrets.enabled $oidcIssuerUrl }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cluster-secret-store
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cluster-secret-store
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ClusterSecretStore
                metadata:
                  name: {{ $envConfig.organization.name }}-infrastructure-secrets
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  provider:
                    aws:
                      auth:
                        jwt:
                          serviceAccountRef:
                            name: {{ $envConfig.organization.name }}-eso-sa
                            namespace: {{ $tools.externalSecrets.namespace }}
                      region: {{ $envConfig.aws.primaryRegion }}
                      service: SecretsManager
          {{- end }}

          {{/* ECR Authorization Token Generators */}}
          {{- if and $externalSecretsEnabled $tools.externalSecrets $tools.externalSecrets.enabled $oidcIssuerUrl }}
          {{- range $region := $envConfig.aws.regions }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-ecr-gen-{{ $region }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ecr-gen-{{ $region }}
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: ECRAuthorizationToken
                metadata:
                  name: {{ $envConfig.organization.name }}-ecr-gen-{{ $region }}
                  namespace: {{ $tools.externalSecrets.namespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  region: {{ $region }}
                  auth:
                    jwt:
                      serviceAccountRef:
                        name: {{ $envConfig.organization.name }}-eso-sa
                        namespace: {{ $tools.externalSecrets.namespace }}
          {{- end }}
          {{- end }}

          {{/* =================================================================== */}}
          {{/* EXTERNAL DNS IAM & DEPLOYMENT */}}
          {{/* =================================================================== */}}

          {{- if and $externalDnsEnabled $tools.externalDns $tools.externalDns.enabled $oidcIssuerUrl }}
          {{/* Extract DNS configuration */}}
          {{- $defaultDomain := $dns.baseDomain | default $dns.clusterDomain -}}
          {{- $hostedZoneId := $dns.hostedZoneId | default "" -}}

          {{- if and (ne $hostedZoneId "") (ne $defaultDomain "") }}
          ---
          # ExternalDNS IRSA IAM Role
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Role
          metadata:
            name: {{ $clusterName }}-external-dns-irsa-role
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: external-dns-irsa-role
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/part-of: "dns"
              platform.kubecore.io/component: "external-dns"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              description: "ExternalDNS IRSA role for {{ $clusterName }}"
              assumeRolePolicy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "Federated": "{{ $oidcProviderArn }}"
                      },
                      "Action": "sts:AssumeRoleWithWebIdentity",
                      "Condition": {
                        "StringEquals": {
                          "{{ $oidcIssuerUrl }}:sub": "system:serviceaccount:{{ $tools.externalDns.namespace | default "external-dns" }}:external-dns",
                          "{{ $oidcIssuerUrl }}:aud": "sts.amazonaws.com"
                        }
                      }
                    }
                  ]
                }
              tags:
                {{- range $key, $value := $costTags }}
                {{ $key }}: {{ $value | quote }}
                {{- end }}
                Name: {{ $clusterName }}-external-dns-irsa-role
                Purpose: "ExternalDNS IRSA Role"
                KubeSystem: {{ $clusterName }}

          ---
          # Attach ExternalDNS Policy to IRSA Role
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: RolePolicyAttachment
          metadata:
            name: {{ $clusterName }}-external-dns-irsa-policy-attachment
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: external-dns-irsa-policy-attachment
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/part-of: "dns"
              platform.kubecore.io/component: "external-dns"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              roleRef:
                name: {{ $clusterName }}-external-dns-irsa-role
              policyArnSelector:
                matchLabels:
                  platform.kubecore.io/awsnetwork: {{ $network.awsnetworkRef.name }}
                  platform.kubecore.io/role: "external-dns"

          ---
          # ExternalDNS Helm Release
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-external-dns
            annotations:
              crossplane.io/external-name: external-dns
              gotemplating.fn.crossplane.io/composition-resource-name: external-dns-release
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "external-dns"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            rollbackLimit: 3
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              chart:
                name: external-dns
                repository: {{ $tools.externalDns.repository.url }}
                version: {{ $tools.externalDns.version | default "1.18.0" | quote }}
              namespace: {{ $tools.externalDns.namespace | default "external-dns" }}
              wait: true
              skipCRDs: false
              values:
                # Provider configuration
                provider:
                  name: aws
                  aws:
                    region: {{ $region }}
                    zoneType: public

                # Domain filtering to match hosted zone
                domainFilters:
                  - {{ $defaultDomain }}

                # Policy and registry settings
                policy: {{ $tools.externalDns.policy | default "sync" }}
                registry: {{ $tools.externalDns.registry | default "txt" }}
                txtOwnerId: {{ $clusterName }}
                txtPrefix: {{ $tools.externalDns.txtPrefix | default "external-dns-" }}

                # Sources to watch
                sources: {{ $tools.externalDns.sources | default (list "service" "ingress" "crd") | toJson }}

                # Traefik CRD support
                crd:
                  create: false
                  apiversion: traefik.io/v1alpha1
                  kind: IngressRoute

                # Interval and logging
                interval: {{ $tools.externalDns.interval | default "1m" }}
                logLevel: {{ $tools.externalDns.logLevel | default "info" }}
                logFormat: {{ $tools.externalDns.logFormat | default "text" }}

                # IRSA configuration for ExternalDNS
                serviceAccount:
                  create: true
                  name: external-dns
                  annotations:
                    eks.amazonaws.com/role-arn: "arn:aws:iam::{{ $accountId }}:role/{{ $clusterName }}-external-dns-irsa-role"

                # Resource configuration
                {{- if $tools.externalDns.resources }}
                resources:
                  {{- if $tools.externalDns.resources.limits }}
                  limits:
                    cpu: {{ $tools.externalDns.resources.limits.cpu | default "250m" }}
                    memory: {{ $tools.externalDns.resources.limits.memory | default "256Mi" }}
                  {{- end }}
                  {{- if $tools.externalDns.resources.requests }}
                  requests:
                    cpu: {{ $tools.externalDns.resources.requests.cpu | default "100m" }}
                    memory: {{ $tools.externalDns.resources.requests.memory | default "128Mi" }}
                  {{- end }}
                {{- else }}
                resources:
                  limits:
                    cpu: 250m
                    memory: 256Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
                {{- end }}

                # Node scheduling
                {{- if $nodeSelector }}
                nodeSelector:
                {{- range $key, $value := $nodeSelector }}
                  {{ $key }}: {{ $value | quote }}
                {{- end }}
                {{- end }}

                {{- if $tolerations }}
                tolerations:
                {{- range $tolerations }}
                - key: {{ .key | quote }}
                  {{- if .value }}
                  value: {{ .value | quote }}
                  {{- end }}
                  operator: {{ .operator | default "Equal" }}
                  effect: {{ .effect }}
                {{- end }}
                {{- end }}

                # Security context
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65534
                  fsGroup: 65534

                # Monitoring integration
                {{- if and $tools.externalDns.metrics $tools.externalDns.metrics.enabled }}
                serviceMonitor:
                  enabled: true
                  additionalLabels:
                    app.kubernetes.io/name: external-dns
                {{- end }}
          {{- else }}
          # WARNING: ExternalDNS not created - missing Hosted Zone ID or domain
          # Ensure the XAwsNetwork has created Route53 hosted zone and the zone ID is in EnvironmentConfig
          {{- end }}
          {{- end }}

          {{/* =================================================================== */}}
          {{/* VICTORIAMETRICS OBSERVABILITY STACK */}}
          {{/* =================================================================== */}}

          {{- if $shouldDeployVM }}
          {{/* Replica counts are already determined above, just use them here */}}

          {{/* Determine resource profiles based on runtime.resourceProfile */}}
          {{- $vmSelectCPU := "200m" -}}
          {{- $vmSelectMemory := "256Mi" -}}
          {{- $vmInsertCPU := "200m" -}}
          {{- $vmInsertMemory := "256Mi" -}}
          {{- $vmStorageCPU := "500m" -}}
          {{- $vmStorageMemory := "512Mi" -}}
          {{- if eq $resourceProfile "small" }}
            {{- $vmSelectCPU = "100m" -}}
            {{- $vmSelectMemory = "128Mi" -}}
            {{- $vmInsertCPU = "100m" -}}
            {{- $vmInsertMemory = "256Mi" -}}
            {{- $vmStorageCPU = "200m" -}}
            {{- $vmStorageMemory = "512Mi" -}}
            {{/* Small profile: vmstorage memory increased to 512Mi to prevent OOM (was 256Mi) */}}
            {{/* Small profile: vminsert memory increased to 256Mi to prevent OOM (was 128Mi) */}}
          {{- else if eq $resourceProfile "large" }}
            {{- $vmSelectCPU = "500m" -}}
            {{- $vmSelectMemory = "512Mi" -}}
            {{- $vmInsertCPU = "500m" -}}
            {{- $vmInsertMemory = "512Mi" -}}
            {{- $vmStorageCPU = "1000m" -}}
            {{- $vmStorageMemory = "1Gi" -}}
          {{- end }}

          {{/* Grafana Zitadel OIDC ExternalSecret */}}
          {{- if $hasGrafanaOIDC }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-grafana-oidc-external-secret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: grafana-oidc-external-secret
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "grafana"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            readiness:
              policy: DeriveFromCelQuery
              celQuery: 'object.status.conditions.exists(c, c.type == "Ready" && c.status == "True")'
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: grafana-zitadel-oidc
                  namespace: {{ $vmNamespace }}
                  labels:
                    platform.kubecore.io/kubesystem: {{ $name }}
                    platform.kubecore.io/part-of: "system"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    kind: ClusterSecretStore
                    name: {{ $envConfig.organization.name }}-infrastructure-secrets
                  target:
                    name: grafana-zitadel-oidc
                    creationPolicy: Owner
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/part-of: grafana
                  data:
                    - secretKey: client-id
                      remoteRef:
                        key: {{ $vmConfig.grafana.oidc.secretName }}
                        property: client-id
                    - secretKey: client-secret
                      remoteRef:
                        key: {{ $vmConfig.grafana.oidc.secretName }}
                        property: client-secret
          {{- end }}

          {{/* VictoriaMetrics Operator Helm Release - Installed BEFORE the k8s-stack to ensure
               webhook endpoints are available before stack resources are patched/upgraded.
               This eliminates the race condition where Crossplane upgrades vm-stack-helm
               before the operator pod is ready to serve admission webhooks. */}}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-vm-operator
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: vm-operator-release
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "observability"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              chart:
                name: victoria-metrics-operator
                repository: https://victoriametrics.github.io/helm-charts
                version: "{{ $vmOperatorChartVersion }}"
              namespace: {{ $vmNamespace }}
              wait: true
              values:
                # Keep resource names predictable and under 63 chars regardless of cluster name length
                fullnameOverride: {{ $clusterName }}-vm-operator
                {{- if $nodeSelector }}
                nodeSelector:
                  {{- range $key, $value := $nodeSelector }}
                  {{ $key }}: {{ $value | quote }}
                  {{- end }}
                {{- end }}
                tolerations:
                - key: "kubecore.eu/computation-type"
                  operator: "Equal"
                  value: "kubecore-system"
                  effect: "NoSchedule"
                - key: "kubecore.eu/computation-type"
                  operator: "Equal"
                  value: "compute"
                  effect: "NoSchedule"
                - key: "kubecore.eu/computation-type"
                  operator: "Equal"
                  value: "gpu"
                  effect: "NoSchedule"
                - key: "kubecore.eu/computation-type"
                  operator: "Equal"
                  value: "observability"
                  effect: "NoSchedule"
                {{- if $tolerations }}
                {{- range $toleration := $tolerations }}
                {{- if and $toleration.effect (ne $toleration.effect "") (ne $toleration.effect "<no value>") }}
                - key: {{ $toleration.key | quote }}
                  {{- if and $toleration.value (ne $toleration.value "") }}
                  value: {{ $toleration.value | quote }}
                  {{- end }}
                  operator: {{ $toleration.operator | default "Equal" | quote }}
                  effect: {{ $toleration.effect | quote }}
                {{- end }}
                {{- end }}
                {{- end }}

          {{/* Guard: only generate vm-stack-helm once vm-operator-release is confirmed Ready in
               observed.resources. On the very first XKubeSystem reconciliation vm-operator-release
               is not yet in observed (it doesn't exist yet), so this prevents the webhook-race
               where both releases are installed in parallel and vm-stack fires before the operator
               pod has registered its admission webhook endpoints. */}}
          {{- $vmOperatorReady := false -}}
          {{- range $rName, $rObj := .observed.resources -}}
            {{- if and (eq $rName "vm-operator-release") $rObj.resource -}}
              {{- range $rObj.resource.status.conditions -}}
                {{- if and (eq .type "Ready") (eq .status "True") -}}
                  {{- $vmOperatorReady = true -}}
                {{- end -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}
          {{- if $vmOperatorReady }}
          {{/* VictoriaMetrics K8s Stack Helm Release - Replaces all individual CRDs */}}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-vm-stack
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: vm-stack-helm
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "observability"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              chart:
                name: victoria-metrics-k8s-stack
                repository: oci://ghcr.io/victoriametrics/helm-charts
                version: "0.65.1"
              namespace: {{ $vmNamespace }}
              wait: true
              values:
                # Override fullname to keep resource names under 63 chars
                fullnameOverride: {{ $clusterName }}-vm
                global:
                  clusterLabel: {{ $clusterLabel | quote }}
                # VictoriaMetrics Operator is installed as a separate release (vm-operator-release)
                # to ensure webhook endpoints are ready before stack resources are patched.
                victoria-metrics-operator:
                  enabled: false
                # Disable VMSingle - use VMCluster for both single and HA modes
                vmsingle:
                  enabled: false
                # Enable VMCluster - use for both single and HA modes
                vmcluster:
                  enabled: true
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "observability"
                  annotations: {}
                  spec:
                    retentionPeriod: {{ $vmRetention | quote }}
                    replicationFactor: {{ if eq $vmMode "ha" }}2{{ else }}1{{ end }}
                    vmstorage:
                      replicaCount: {{ $vmStorageReplicas }}
                      storage:
                        volumeClaimTemplate:
                          spec:
                            storageClassName: {{ $vmStorageClass | quote }}
                            resources:
                              requests:
                                storage: {{ $vmStorageSize | quote }}
                      resources:
                        requests:
                          cpu: {{ $vmStorageCPU | quote }}
                          memory: {{ $vmStorageMemory | quote }}
                        limits:
                          cpu: {{ $vmStorageCPU | quote }}
                          memory: {{ $vmStorageMemory | quote }}
                      # Core components schedule on observability nodegroup nodes (PRD-024 FR-5)
                      nodeSelector:
                        platform.kubecore.io/observability: "true"
                      tolerations:
                        # Observability nodegroup taint (required by PRD-024 FR-5)
                        - key: "kubecore.eu/computation-type"
                          operator: "Equal"
                          value: "observability"
                          effect: "NoSchedule"
                      {{- if eq $vmMode "ha" }}
                      affinity:
                        podAntiAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                          - labelSelector:
                              matchExpressions:
                              - key: app.kubernetes.io/name
                                operator: In
                                values:
                                - vmstorage
                            topologyKey: kubernetes.io/hostname
                      {{- end }}
                    vmselect:
                      enabled: true
                      replicaCount: {{ $vmSelectReplicas }}
                      resources:
                        requests:
                          cpu: {{ $vmSelectCPU | quote }}
                          memory: {{ $vmSelectMemory | quote }}
                        limits:
                          cpu: {{ $vmSelectCPU | quote }}
                          memory: {{ $vmSelectMemory | quote }}
                      # Core components schedule on observability nodegroup nodes (PRD-024 FR-5)
                      nodeSelector:
                        platform.kubecore.io/observability: "true"
                      tolerations:
                        # Observability nodegroup taint (required by PRD-024 FR-5)
                        - key: "kubecore.eu/computation-type"
                          operator: "Equal"
                          value: "observability"
                          effect: "NoSchedule"
                      {{- if eq $vmMode "ha" }}
                      affinity:
                        podAntiAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                          - labelSelector:
                              matchExpressions:
                              - key: app.kubernetes.io/name
                                operator: In
                                values:
                                - vmselect
                            topologyKey: kubernetes.io/hostname
                      {{- end }}
                    vminsert:
                      enabled: true
                      replicaCount: {{ $vmInsertReplicas }}
                      resources:
                        requests:
                          cpu: {{ $vmInsertCPU | quote }}
                          memory: {{ $vmInsertMemory | quote }}
                        limits:
                          cpu: {{ $vmInsertCPU | quote }}
                          memory: {{ $vmInsertMemory | quote }}
                      # Core components schedule on observability nodegroup nodes (PRD-024 FR-5)
                      nodeSelector:
                        platform.kubecore.io/observability: "true"
                      tolerations:
                        # Observability nodegroup taint (required by PRD-024 FR-5)
                        - key: "kubecore.eu/computation-type"
                          operator: "Equal"
                          value: "observability"
                          effect: "NoSchedule"
                      {{- if eq $vmMode "ha" }}
                      affinity:
                        podAntiAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                          - labelSelector:
                              matchExpressions:
                              - key: app.kubernetes.io/name
                                operator: In
                                values:
                                - vminsert
                            topologyKey: kubernetes.io/hostname
                      {{- end }}
                # VMAgent configuration
                vmagent:
                  enabled: true
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "observability"
                  annotations: {}
                  spec:
                    selectAllByDefault: true
                    replicaCount: 1
                    externalLabels:
                      cluster: {{ $clusterName | quote }}
                    inlineRelabelConfig:
                      - target_label: cluster
                        replacement: {{ $clusterName | quote }}
                      - source_labels: [__meta_kubernetes_pod_label_environment]
                        target_label: environment
                      - source_labels: [__meta_kubernetes_pod_label_kubeapp]
                        target_label: kubeapp
                    resources:
                      requests:
                        cpu: "50m"
                        memory: "128Mi"
                      limits:
                        cpu: "500m"
                        memory: "512Mi"
                    # VMAgent is part of the observability stack: schedule on observability nodegroup nodes (PRD-024 FR-5)
                    nodeSelector:
                      platform.kubecore.io/observability: "true"
                    tolerations:
                      # Observability nodegroup taint (required by PRD-024 FR-5)
                      - key: "kubecore.eu/computation-type"
                        operator: "Equal"
                        value: "observability"
                        effect: "NoSchedule"
                # VMAlert configuration
                vmalert:
                  enabled: {{ if $vmAlertEnabled }}true{{ else }}false{{ end }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "observability"
                  annotations: {}
                  spec:
                    selectAllByDefault: true
                    replicaCount: {{ if eq $vmMode "ha" }}2{{ else }}1{{ end }}
                    evaluationInterval: 1m
                    {{- if not $vmAlertEnabled }}
                    extraArgs:
                      notifier.blackhole: "true"
                    {{- end }}
                    externalLabels:
                      cluster: {{ $clusterName | quote }}
                    resources:
                      requests:
                        cpu: "50m"
                        memory: "128Mi"
                      limits:
                        cpu: "200m"
                        memory: "256Mi"
                    {{- if eq $vmMode "ha" }}
                    affinity:
                      podAntiAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                        - labelSelector:
                            matchExpressions:
                            - key: app.kubernetes.io/name
                              operator: In
                              values:
                              - vmalert
                          topologyKey: kubernetes.io/hostname
                    {{- end }}
                    # VMAlert is part of the observability stack: schedule on observability nodegroup nodes (PRD-024 FR-5)
                    nodeSelector:
                      platform.kubecore.io/observability: "true"
                    tolerations:
                      # Observability nodegroup taint (required by PRD-024 FR-5)
                      - key: "kubecore.eu/computation-type"
                        operator: "Equal"
                        value: "observability"
                        effect: "NoSchedule"
                # VMAlertmanager configuration
                # Managed by Helm with explicit scheduling to avoid ownership conflicts
                alertmanager:
                  enabled: true
                  spec:
                    selectAllByDefault: true
                    replicaCount: 1
                    resources:
                      requests:
                        cpu: "30m"
                        memory: "56Mi"
                      limits:
                        cpu: "100m"
                        memory: "256Mi"
                    nodeSelector:
                      platform.kubecore.io/observability: "true"
                    tolerations:
                      - key: "kubecore.eu/computation-type"
                        operator: "Equal"
                        value: "observability"
                        effect: "NoSchedule"
                # Grafana configuration
                grafana:
                  enabled: {{ if $grafanaEnabled }}true{{ else }}false{{ end }}
                  {{- if $grafanaEnabled }}
                  replicas: {{ if eq $vmMode "ha" }}2{{ else }}1{{ end }}
                  # Tolerations for observability nodegroup
                  tolerations:
                    # Observability nodegroup taint (required by PRD-024 FR-5)
                    - key: "kubecore.eu/computation-type"
                      operator: "Equal"
                      value: "observability"
                      effect: "NoSchedule"
                  deployment:
                    spec:
                      template:
                        spec:
                          # Core components schedule on observability nodegroup nodes (PRD-024 FR-5)
                          nodeSelector:
                            platform.kubecore.io/observability: "true"
                          {{- if eq $vmMode "ha" }}
                          affinity:
                            podAntiAffinity:
                              requiredDuringSchedulingIgnoredDuringExecution:
                              - labelSelector:
                                  matchExpressions:
                                  - key: app.kubernetes.io/name
                                    operator: In
                                    values:
                                    - grafana
                                topologyKey: kubernetes.io/hostname
                          {{- end }}
                  {{- if and $traefikEnabled $tlsIssuerEnabled $dns.clusterDomain }}
                  ingress:
                    enabled: true
                    ingressClassName: traefik-system
                    annotations:
                      cert-manager.io/cluster-issuer: {{ $clusterIssuerName }}
                    hosts:
                    - grafana.{{ $dns.clusterDomain }}
                    tls:
                    - secretName: grafana-tls
                      hosts:
                      - grafana.{{ $dns.clusterDomain }}
                  {{- end }}
                  {{- if $hasGrafanaOIDC }}
                  grafana.ini:
                    server:
                      root_url: "https://grafana.{{ $dns.clusterDomain }}"
                    auth:
                      disable_login_form: false
                    auth.generic_oauth:
                      enabled: true
                      name: {{ $vmConfig.grafana.oidc.name | quote }}
                      client_id: "$__file{/etc/secrets/grafana-zitadel-oidc/client-id}"
                      client_secret: "$__file{/etc/secrets/grafana-zitadel-oidc/client-secret}"
                      scopes: {{ $vmConfig.grafana.oidc.scopes | quote }}
                      auth_url: {{ $vmConfig.grafana.oidc.authUrl | quote }}
                      token_url: {{ $vmConfig.grafana.oidc.tokenUrl | quote }}
                      api_url: {{ $vmConfig.grafana.oidc.apiUrl | quote }}
                      role_attribute_path: "contains(groups[*], 'admin') && 'Admin' || contains(groups[*], 'ops') && 'Editor' || 'Viewer'"
                      allow_assign_grafana_admin: true
                  extraSecretMounts:
                  - name: grafana-zitadel-oidc
                    secretName: grafana-zitadel-oidc
                    mountPath: /etc/secrets/grafana-zitadel-oidc
                    readOnly: true
                  {{- end }}
                  {{- end }}
                # Enable built-in rules and dashboards
                defaultRules:
                  create: true
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "observability"
                  annotations: {}
                defaultDashboards:
                  enabled: {{ if $grafanaEnabled }}true{{ else }}false{{ end }}
                  defaultTimezone: "utc"
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "observability"
                  annotations: {}
                # Enable kube-state-metrics
                kube-state-metrics:
                  enabled: true
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: {{ $value | quote }}
                    {{- end }}
                  {{- end }}
                  tolerations:
                    # System tolerations from runtime.tolerations
                    {{- if $tolerations }}
                    {{- range $toleration := $tolerations }}
                    {{- if and $toleration.effect (ne $toleration.effect "") (ne $toleration.effect "<no value>") }}
                    - key: {{ $toleration.key | quote }}
                      {{- if and $toleration.value (ne $toleration.value "") }}
                      value: {{ $toleration.value | quote }}
                      {{- end }}
                      operator: {{ $toleration.operator | default "Equal" | quote }}
                      effect: {{ $toleration.effect | quote }}
                    {{- end }}
                    {{- end }}
                    {{- end }}
                    # Additional tolerations for all computation types
                    - key: "kubecore.eu/computation-type"
                      operator: "Equal"
                      value: "system"
                      effect: "NoSchedule"
                    - key: "kubecore.eu/computation-type"
                      operator: "Equal"
                      value: "compute"
                      effect: "NoSchedule"
                    - key: "kubecore.eu/computation-type"
                      operator: "Equal"
                      value: "gpu"
                      effect: "NoSchedule"
                    - key: "kubecore.eu/computation-type"
                      operator: "Equal"
                      value: "observability"
                      effect: "NoSchedule"
                    - key: "kubecore.eu/computation-type"
                      operator: "Equal"
                      value: "kubecore-system"
                      effect: "NoSchedule"
                # Enable node-exporter
                prometheus-node-exporter:
                  enabled: true
                  extraArgs:
                    - --collector.filesystem.ignored-mount-points=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
                    - --collector.filesystem.ignored-fs-types=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
                  tolerations:
                    # System tolerations from runtime.tolerations
                    {{- if $tolerations }}
                    {{- range $toleration := $tolerations }}
                    {{- if and $toleration.effect (ne $toleration.effect "") (ne $toleration.effect "<no value>") }}
                    - key: {{ $toleration.key | quote }}
                      {{- if and $toleration.value (ne $toleration.value "") }}
                      value: {{ $toleration.value | quote }}
                      {{- end }}
                      operator: {{ $toleration.operator | default "Equal" | quote }}
                      effect: {{ $toleration.effect | quote }}
                    {{- end }}
                    {{- end }}
                    {{- end }}
                    # Additional tolerations for all computation types
                    - key: "kubecore.eu/computation-type"
                      operator: "Equal"
                      value: "system"
                      effect: "NoSchedule"
                    - key: "kubecore.eu/computation-type"
                      operator: "Equal"
                      value: "compute"
                      effect: "NoSchedule"
                    - key: "kubecore.eu/computation-type"
                      operator: "Equal"
                      value: "gpu"
                      effect: "NoSchedule"
                    - key: "kubecore.eu/computation-type"
                      operator: "Equal"
                      value: "observability"
                      effect: "NoSchedule"
                    - key: "kubecore.eu/computation-type"
                      operator: "Equal"
                      value: "kubecore-system"
                      effect: "NoSchedule"
          {{- end }}
          {{- end }}

          {{- if $shouldDeployVM }}
          {{- end }}

          {{/* =================================================================== */}}
          {{/* OBSERVABILITY NODEGROUP - Create dedicated nodegroup for observability workloads */}}
          {{/* =================================================================== */}}
          
          {{- if $shouldDeployVM }}
          # Observability NodeGroup - Dedicated nodes for VictoriaMetrics components
          ---
          apiVersion: eks.aws.upbound.io/v1beta2
          kind: NodeGroup
          metadata:
            name: {{ $clusterName }}-observability
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: observability-nodegroup
            labels:
              platform.kubecore.io/cluster: {{ $clusterName }}
              platform.kubecore.io/node-group: observability
              platform.kubecore.io/cloud-provider: aws
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              region: {{ $region }}
              clusterNameSelector:
                matchLabels:
                  crossplane.io/external-name: {{ $clusterName }}
              nodeRoleArnSelector:
                matchLabels:
                  role: "node-instance-role"
                  cluster: {{ $clusterName }}
              instanceTypes:
              {{- range $obsNodeGroupInstanceTypes }}
              - {{ . }}
              {{- end }}
              scalingConfig:
                minSize: {{ $obsNodeGroupMinSize }}
                maxSize: {{ $obsNodeGroupMaxSize }}
                desiredSize: {{ $obsNodeGroupDesiredSize }}
              diskSize: {{ $obsNodeGroupDiskSize }}
              capacityType: "ON_DEMAND"
              labels:
                platform.kubecore.io/observability: "true"
              taint:
              - key: "kubecore.eu/computation-type"
                value: "observability"
                effect: "NO_SCHEDULE"
              # Use private subnets for observability nodes
              subnetIdSelector:
                matchLabels:
                  platform.kubecore.io/cluster: {{ $clusterName }}
                  platform.kubecore.io/subnet-type: "private"
              tags:
                Name: {{ $clusterName }}-observability
                Cluster: {{ $clusterName }}
                NodeGroupType: observability
                "kubecore.eu/monitoring": "enabled"
                "kubecore.eu/resource-tier": "observability"
                {{- range $k, $v := $costTags }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            providerConfigRef:
              name: {{ $awsProvider }}
          {{- end }}

          {{/* =================================================================== */}}
          {{/* STATUS EXTRACTION - Extract IAM role ARNs and Observability status from observed resources */}}
          {{/* =================================================================== */}}

          {{- $ecrRoleArn := "" -}}
          {{- $vmHelmReleaseReady := false -}}
          {{- $vmHelmReleaseVersion := $vmAppVersion -}}
          {{- $vmHelmReleaseState := "" -}}
          {{- $vmHelmReleaseRevision := 0 -}}
          {{- $vmHelmReleaseDescription := "" -}}

          {{/* Platform tool Helm release status — one variable per tool */}}
          {{- $crossplaneStatus := "Pending" -}}
          {{- $certManagerStatus := "Pending" -}}
          {{- $argocdStatus := "Pending" -}}
          {{- $argoRolloutsStatus := "Pending" -}}
          {{- $argoWorkflowsStatus := "Pending" -}}
          {{- $traefikStatus := "Pending" -}}
          {{- $externalSecretsStatus := "Pending" -}}
          {{- $gitopsPromoterStatus := "Pending" -}}
          {{- $externalDnsStatus := "Pending" -}}

          {{/* Map of resource name → status variable setter.
               Each Helm release gets the same simple check: atProvider.state or resource.ready */}}
          {{- $toolReleaseNames := dict
                "crossplane-release" "crossplane"
                "cert-manager-release" "certManager"
                "argocd-release" "argocd"
                "argo-rollouts-release" "argoRollouts"
                "argo-workflows-release" "argoWorkflows"
                "traefik-release" "traefik"
                "external-secrets-release" "externalSecrets"
                "gitops-promoter-release" "gitopsPromoter"
                "external-dns-release" "externalDns"
          -}}

          {{/* Iterate through observed resources to extract status */}}
          {{- range $resourceName, $resource := .observed.resources -}}
            {{- if $resource.resource -}}
              {{/* Extract ECR Role ARN */}}
              {{- if eq $resourceName "ecr-credentials-role" -}}
                {{- if eq $resource.resource.kind "Role" -}}
                  {{- if $resource.resource.status.atProvider.arn -}}
                    {{- $ecrRoleArn = $resource.resource.status.atProvider.arn -}}
                  {{- end -}}
                {{- end -}}
              {{- end -}}

              {{/* Extract platform tool Helm release status */}}
              {{- $toolKey := index $toolReleaseNames $resourceName -}}
              {{- if $toolKey -}}
                {{- $state := "Installing" -}}
                {{- if and $resource.resource.status $resource.resource.status.atProvider $resource.resource.status.atProvider.state -}}
                  {{- if eq $resource.resource.status.atProvider.state "deployed" -}}
                    {{- $state = "Ready" -}}
                  {{- else if eq $resource.resource.status.atProvider.state "failed" -}}
                    {{- $state = "Error" -}}
                  {{- else -}}
                    {{- $state = "Installing" -}}
                  {{- end -}}
                {{- else if $resource.ready -}}
                  {{- $state = "Ready" -}}
                {{- end -}}
                {{- if eq $toolKey "crossplane" -}}{{ $crossplaneStatus = $state }}{{- end -}}
                {{- if eq $toolKey "certManager" -}}{{ $certManagerStatus = $state }}{{- end -}}
                {{- if eq $toolKey "argocd" -}}{{ $argocdStatus = $state }}{{- end -}}
                {{- if eq $toolKey "argoRollouts" -}}{{ $argoRolloutsStatus = $state }}{{- end -}}
                {{- if eq $toolKey "argoWorkflows" -}}{{ $argoWorkflowsStatus = $state }}{{- end -}}
                {{- if eq $toolKey "traefik" -}}{{ $traefikStatus = $state }}{{- end -}}
                {{- if eq $toolKey "externalSecrets" -}}{{ $externalSecretsStatus = $state }}{{- end -}}
                {{- if eq $toolKey "gitopsPromoter" -}}{{ $gitopsPromoterStatus = $state }}{{- end -}}
                {{- if eq $toolKey "externalDns" -}}{{ $externalDnsStatus = $state }}{{- end -}}
              {{- end -}}

              {{/* Extract VictoriaMetrics Helm Release status and details */}}
              {{- if eq $resourceName "vm-stack-helm" -}}
                {{/* Check if Helm Release is ready via resource.ready flag */}}
                {{- if $resource.ready -}}
                  {{- $vmHelmReleaseReady = true -}}
                {{- end -}}
                {{/* Extract detailed Helm Release status */}}
                {{- if and $resource.resource $resource.resource.status -}}
                  {{- if $resource.resource.status.atProvider -}}
                    {{/* Extract Helm Release state (deployed, failed, etc.) - path is atProvider.state */}}
                    {{- if $resource.resource.status.atProvider.state -}}
                      {{- $vmHelmReleaseState = $resource.resource.status.atProvider.state -}}
                      {{/* Helm Release is ready if state is "deployed" */}}
                      {{- if eq $vmHelmReleaseState "deployed" -}}
                        {{- $vmHelmReleaseReady = true -}}
                      {{- end -}}
                    {{- end -}}
                    {{/* Extract Helm Release revision number */}}
                    {{- if $resource.resource.status.atProvider.revision -}}
                      {{- $vmHelmReleaseRevision = $resource.resource.status.atProvider.revision -}}
                    {{- end -}}
                    {{/* Extract Helm Release description (e.g., "Upgrade complete", "Install complete") */}}
                    {{- if $resource.resource.status.atProvider.releaseDescription -}}
                      {{- $vmHelmReleaseDescription = $resource.resource.status.atProvider.releaseDescription -}}
                    {{- end -}}
                    {{/* Extract Helm Release version from spec (chart version) */}}
                    {{- if and $resource.resource.spec $resource.resource.spec.forProvider -}}
                      {{- if $resource.resource.spec.forProvider.chart -}}
                        {{- if $resource.resource.spec.forProvider.chart.version -}}
                          {{- $vmHelmReleaseVersion = $resource.resource.spec.forProvider.chart.version -}}
                        {{- end -}}
                      {{- end -}}
                    {{- end -}}
                  {{- end -}}
                  {{/* Also check Ready condition from status.conditions */}}
                  {{- if $resource.resource.status.conditions -}}
                    {{- range $condition := $resource.resource.status.conditions -}}
                      {{- if and (eq $condition.type "Ready") (eq $condition.status "True") -}}
                        {{- $vmHelmReleaseReady = true -}}
                      {{- end -}}
                    {{- end -}}
                  {{- end -}}
                {{- end -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}

          {{/* Derive systemStatus from individual tool statuses */}}
          {{- $hasError := false -}}
          {{- $allReady := true -}}
          {{- $statuses := list $crossplaneStatus $certManagerStatus $argocdStatus $argoRolloutsStatus $argoWorkflowsStatus $traefikStatus $externalSecretsStatus $gitopsPromoterStatus $externalDnsStatus -}}
          {{- range $s := $statuses -}}
            {{- if eq $s "Error" -}}{{ $hasError = true }}{{- end -}}
            {{- if ne $s "Ready" -}}{{ $allReady = false }}{{- end -}}
          {{- end -}}
          {{- $systemStatus := "Deploying" -}}
          {{- if $hasError -}}{{ $systemStatus = "Error" }}{{- end -}}
          {{- if $allReady -}}{{ $systemStatus = "Ready" }}{{- end -}}

          {{/* =================================================================== */}}
          {{/* STATUS PROPAGATION - Populate status fields */}}
          {{/* Pattern from XAWSProvider composition - uses observed composite resource */}}
          {{/* =================================================================== */}}

          ---
          apiVersion: {{ .observed.composite.resource.apiVersion }}
          kind: {{ .observed.composite.resource.kind }}
          metadata:
            name: {{ .observed.composite.resource.metadata.name }}
          status:
            # Preserve existing conditions so auto-ready can mark XKubeSystem Ready=True
            {{- if .observed.composite.resource.status.conditions }}
            conditions: {{ toJson .observed.composite.resource.status.conditions }}
            {{- end }}
            {{- if $ecrRoleArn }}
            iamRoles:
              ecrRoleArn: {{ $ecrRoleArn | quote }}
            {{- end }}
            systemStatus: {{ $systemStatus }}
            tools:
              {{- if and $crossplaneEnabled $tools.crossplane $tools.crossplane.enabled }}
              crossplane:
                enabled: true
                status: {{ $crossplaneStatus }}
                version: {{ $tools.crossplane.version | quote }}
                namespace: {{ $tools.crossplane.namespace }}
              {{- end }}
              {{- if and $certManagerEnabled $tools.certManager $tools.certManager.enabled }}
              certManager:
                enabled: true
                status: {{ $certManagerStatus }}
                version: {{ $tools.certManager.version | quote }}
                namespace: {{ $tools.certManager.namespace }}
              {{- end }}
              {{- if and $argoCdEnabled $tools.argocd $tools.argocd.enabled }}
              argocd:
                enabled: true
                status: {{ $argocdStatus }}
                version: {{ $tools.argocd.version | quote }}
                namespace: {{ $tools.argocd.namespace }}
                {{- if and $tools.argocd.server $tools.argocd.server.ingress $tools.argocd.server.ingress.enabled }}
                url: argocd.system.{{ $dns.clusterDomain }}
                {{- end }}
              {{- end }}
              {{- if and $argoRolloutsEnabled $tools.argoRollouts $tools.argoRollouts.enabled }}
              argoRollouts:
                enabled: true
                status: {{ $argoRolloutsStatus }}
                version: {{ $tools.argoRollouts.version | quote }}
                namespace: {{ $tools.argoRollouts.namespace }}
              {{- end }}
              {{- if and $argoWorkflowsEnabled $tools.argoWorkflows $tools.argoWorkflows.enabled }}
              argoWorkflows:
                enabled: true
                status: {{ $argoWorkflowsStatus }}
                version: {{ $tools.argoWorkflows.version | quote }}
                namespace: {{ $tools.argoWorkflows.namespace }}
                {{- if and $tools.argoWorkflows.server $tools.argoWorkflows.server.enabled $tools.argoWorkflows.server.ingress $tools.argoWorkflows.server.ingress.enabled }}
                url: workflows.system.{{ $dns.clusterDomain }}
                {{- end }}
              {{- end }}
              {{- if and $traefikEnabled $tools.traefik $tools.traefik.enabled }}
              traefik:
                enabled: true
                status: {{ $traefikStatus }}
                version: {{ $tools.traefik.version | quote }}
                namespace: {{ $tools.traefik.namespace }}
              {{- end }}
              {{- if and $externalSecretsEnabled $tools.externalSecrets $tools.externalSecrets.enabled }}
              externalSecrets:
                enabled: true
                ready: {{ eq $externalSecretsStatus "Ready" }}
                version: {{ $tools.externalSecrets.version | quote }}
                namespace: {{ $tools.externalSecrets.namespace }}
              {{- end }}
              {{- if and $gitopsPromoterEnabled $tools.gitopsPromoter $tools.gitopsPromoter.enabled }}
              gitopsPromoter:
                enabled: true
                status: {{ $gitopsPromoterStatus }}
                version: {{ $tools.gitopsPromoter.version | quote }}
                namespace: {{ $tools.gitopsPromoter.namespace }}
                {{- if and $tools.gitopsPromoter.ingress $tools.gitopsPromoter.ingress.enabled }}
                url: {{ regexReplaceAll "\\{cluster-domain\\}" $tools.gitopsPromoter.ingress.hostname $dns.clusterDomain }}
                {{- end }}
                {{- if $hasGithub }}
                githubSecretName: {{ $clusterName }}-gitops-promoter-github-secret
                clusterScmProviderName: {{ $envConfig.organization.name }}-github-scm-provider
                {{- end }}
              {{- end }}
              {{- if and $externalDnsEnabled $tools.externalDns $tools.externalDns.enabled }}
              externalDns:
                enabled: true
                status: {{ $externalDnsStatus }}
                version: {{ $tools.externalDns.version | default "1.18.0" | quote }}
                namespace: {{ $tools.externalDns.namespace }}
              {{- end }}

            # Observability Status (top-level field, not under tools)
            # Status extracted from Crossplane observed resources (Helm Release)
            # 
            # NOTE: Helm Release status provides installation state and chart version, but does NOT
            # expose individual component (pod) status. Component ready status is derived from Helm
            # Release ready state. For detailed component metrics (actual pod counts, storage usage,
            # scrape targets, etc.), additional resources observing Kubernetes StatefulSets/Deployments
            # or VictoriaMetrics API queries would be needed.
            {{- if $shouldDeployVM }}
            observability:
              installed: {{ $vmHelmReleaseReady }}
              mode: {{ $vmMode | quote }}
              version: {{ $vmHelmReleaseVersion | quote }}
              namespace: {{ $vmNamespace | quote }}
              {{- if ne $vmHelmReleaseState "" }}
              state: {{ $vmHelmReleaseState | quote }}
              {{- end }}
              {{- if gt $vmHelmReleaseRevision 0 }}
              revision: {{ $vmHelmReleaseRevision }}
              {{- end }}
              {{- if ne $vmHelmReleaseDescription "" }}
              description: {{ $vmHelmReleaseDescription | quote }}
              {{- end }}
              components:
                # Component ready status derived from Helm Release ready state
                # Replica counts reflect configured/expected values (from EnvironmentConfig)
                # Actual running replica counts would require querying StatefulSets/Deployments
                vmselect:
                  ready: {{ $vmHelmReleaseReady }}
                  replicas: {{ $vmSelectReplicas }}
                vminsert:
                  ready: {{ $vmHelmReleaseReady }}
                  replicas: {{ $vmInsertReplicas }}
                vmstorage:
                  ready: {{ $vmHelmReleaseReady }}
                  replicas: {{ $vmStorageReplicas }}
                  storageUsedGB: 0
                vmagent:
                  ready: {{ $vmHelmReleaseReady }}
                  scrapeTargets: 0
                vmalert:
                  ready: {{ $vmHelmReleaseReady }}
                  activeRules: 0
                  firingAlerts: 0
                grafana:
                  ready: {{ and $vmHelmReleaseReady $grafanaEnabled }}
                  {{- if and $grafanaEnabled $traefikEnabled $tlsIssuerEnabled $dns.clusterDomain }}
                  url: https://grafana.{{ $dns.clusterDomain }}
                  {{- end }}
              metrics:
                # Detailed metrics (timeSeriesCount, samplesPerSecond, storageUsageGB) require
                # querying VictoriaMetrics API or reading from VMCluster CRD status.
                # These fields are placeholders until controller-level status enhancement is implemented.
                timeSeriesCount: 0
                samplesPerSecond: 0
                storageUsageGB: 0
            {{- end }}

  # Step 4: Sequence resources for proper installation order
  - step: sequence-resources
    functionRef:
      name: function-sequencer
    input:
      apiVersion: sequencer.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        rules:
        # Namespaces must be created first
        - sequence:
          - crossplane-namespace
          - cert-manager-namespace
          - argocd-namespace
          - argo-rollouts-namespace
          - argo-workflows-namespace
          - traefik-namespace
          - external-secrets-namespace
          - gitops-promoter-namespace
          - external-dns-namespace
          - observability-namespace
        # cert-manager must be installed before other tools that depend on certificates
        - sequence:
          - cert-manager-release
        # ClusterIssuer must be created after cert-manager is ready
        - sequence:
          - cert-manager-release
          - cluster-issuer
        # Then Crossplane and other core tools
        - sequence:
          - crossplane-release
        # ESO needs to be installed before its configuration resources
        - sequence:
          - external-secrets-namespace
          - external-secrets-release
        # Cluster ESO IAM role must be created first
        - sequence:
          - external-secrets-release
          - cluster-eso-role
        # Policy attachments after role creation
        - sequence:
          - cluster-eso-role
          - cluster-eso-secrets-attachment
          - cluster-eso-ecr-attachment
        # ESO service account after IAM role and all policies are ready
        - sequence:
          - cluster-eso-secrets-attachment
          - cluster-eso-ecr-attachment
          - eso-service-account
        # ClusterSecretStore after service account
        - sequence:
          - eso-service-account
          - cluster-secret-store
        # ECR generators after ClusterSecretStore (dynamically referenced in template)
        - sequence:
          - cluster-secret-store
          - ecr-gen-eu-central-1
        # ExternalDNS namespace must be created first
        - sequence:
          - external-dns-namespace
        # ExternalDNS IAM policy must be created
        - sequence:
          - external-dns-namespace
          - external-dns-policy
        # ExternalDNS IRSA role after policy
        - sequence:
          - external-dns-policy
          - external-dns-irsa-role
        # Policy attachment after both role and policy
        - sequence:
          - external-dns-irsa-role
          - external-dns-policy
          - external-dns-irsa-policy-attachment
        # ExternalDNS release after IAM setup
        - sequence:
          - external-dns-irsa-policy-attachment
          - external-dns-release
        # GitOps Promoter namespace must be created first
        - sequence:
          - gitops-promoter-namespace
          - gitops-promoter-release
        # GitOps Promoter GitHub ExternalSecret after GitOps Promoter release and ClusterSecretStore
        - sequence:
          - gitops-promoter-release
          - cluster-secret-store
          - gitops-promoter-github-externalsecret
        # Private key ExternalSecret must create secret before GithubAccessToken generator can use it
        - sequence:
          - gitops-promoter-github-externalsecret
          - gitops-promoter-github-token-generator
        # Token ExternalSecret needs the generator to be ready
        - sequence:
          - gitops-promoter-github-token-generator
          - gitops-promoter-github-token-externalsecret
        # ClusterScmProvider after GitOps Promoter GitHub ExternalSecret
        - sequence:
          - gitops-promoter-github-externalsecret
          - cluster-scm-provider
        # ArgoCD GitHub ExternalSecret after ArgoCD release and ClusterSecretStore
        - sequence:
          - argocd-release
          - cluster-secret-store
          - argocd-github-externalsecret
        # Argo Workflows OIDC ExternalSecret after Argo Workflows release and ClusterSecretStore
        - sequence:
          - argo-workflows-release
          - cluster-secret-store
          - argo-workflows-oidc-external-secret
        # Argo Workflows SSO RBAC after Argo Workflows release
        - sequence:
          - argo-workflows-release
          - argo-workflows-sso-admin-sa
          - argo-workflows-sso-user-sa
          - argo-workflows-sso-readonly-sa
        - sequence:
          - argo-workflows-sso-admin-sa
          - argo-workflows-sso-admin-crb
        - sequence:
          - argo-workflows-sso-user-sa
          - argo-workflows-sso-user-crb
        - sequence:
          - argo-workflows-sso-readonly-sa
          - argo-workflows-sso-readonly-crb
        # Observability namespace must be created first
        - sequence:
          - observability-namespace
        # Operators must be installed after namespace
        - sequence:
          - observability-namespace
          - grafana-operator-release
        # VM Operator must be ready (webhook endpoints live) before the stack is applied
        - sequence:
          - observability-namespace
          - vm-operator-release
        # Grafana OIDC ExternalSecret and VM Operator must both be ready before vm-stack-helm
        - sequence:
          - cluster-secret-store
          - grafana-oidc-external-secret
          - vm-operator-release
          - vm-stack-helm
        # VictoriaMetrics K8s Stack after VM Operator and Grafana Operator
        - sequence:
          - grafana-operator-release
          - vm-operator-release
          - vm-stack-helm
        # Traefik must be Ready (LB provisioned) before apps that create TLS Ingresses
        # to avoid ACME HTTP-01 challenge timeouts during ELB warm-up
        - sequence:
          - traefik-release
          - argocd-release
        - sequence:
          - traefik-release
          - argo-rollouts-release
        - sequence:
          - traefik-release
          - argo-workflows-release
        - sequence:
          - traefik-release
          - gitops-promoter-release

  # Step 5: Auto-ready function for status management
  - step: auto-ready
    functionRef:
      name: function-auto-ready
    input:
      apiVersion: autoready.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        policy: All  # Wait for all Helm releases to be ready before marking XKubeSystem as ready