                    - inputName: "DS_PROMETHEUS"
                      datasourceName: "P4169E866C3094E38"
                  grafanaCom:
                    id: 22184
                    revision: 1
          {{- end }}

          {{/* external-secrets dashboard (Grafana.com ID 21640) */}}
          {{- if and $shouldDeployVM $grafanaEnabled $externalSecretsEnabled $tools.externalSecrets $tools.externalSecrets.enabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-grafana-dashboard-external-secrets-21640
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: grafana-dashboard-external-secrets-21640
