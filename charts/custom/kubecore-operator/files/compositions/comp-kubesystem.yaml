                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  title: "KubeTools"
                  instanceSelector:
                    matchLabels:
                      dashboards: "kubecore-grafana"
          {{- end }}

          {{/* Kubernetes folder (for core Kubernetes dashboards: cluster, nodes, pods, PVs) */}}
          {{- if and $shouldDeployVM $grafanaEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
