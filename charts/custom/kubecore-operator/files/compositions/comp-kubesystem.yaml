apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: kubesystem
  labels:
    platform.kubecore.io/type: kubesystem
    provider: helm
    service: platform-system
    layer: platform
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: platform.kubecore.io/v1alpha1
    kind: XKubeSystem
  mode: Pipeline
  pipeline:

  # Step 1: Load EnvironmentConfig with strict cluster-specific selection
  - step: load-environment-configs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Selector
          selector:
            matchLabels:
            # PRIMARY: Select by exact cluster name (XKubeSystem clusterRef.name)
            - key: platform.kubecore.io/cluster-name
              type: FromCompositeFieldPath
              valueFromFieldPath: spec.clusterRef.name
            # SECONDARY: Ensure it's a system config type
            - key: platform.kubecore.io/type
              type: Value
              value: system-config
            # TERTIARY: Optional additional filters
            - key: kubecore.io/kubeorg
              type: FromCompositeFieldPath
              valueFromFieldPath: metadata.labels["kubecore.io/kubeorg"]
            - key: kubecore.io/region
              type: FromCompositeFieldPath
              valueFromFieldPath: metadata.labels["kubecore.io/region"]

  # Step 2: Generate System resources with Go Templates
  - step: generate-system-resources
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $name := .observed.composite.resource.metadata.name -}}
          {{- $uid := .observed.composite.resource.metadata.uid -}}
          {{- $spec := .observed.composite.resource.spec -}}
          
          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found. Ensure EnvironmentConfig exists with label platform.kubecore.io/cluster-name matching this XKubeSystem clusterRef.name" -}}
          {{- end -}}
          
          {{/* Validate cluster name matches for safety */}}
          {{- if $envConfig.clusterName -}}
            {{- if ne $envConfig.clusterName $spec.clusterRef.name -}}
              {{- fail (printf "EnvironmentConfig cluster name '%s' does not match XKubeSystem clusterRef.name '%s'" $envConfig.clusterName $spec.clusterRef.name) -}}
            {{- end -}}
          {{- end -}}
          
          {{/* Extract environment configuration values */}}
          {{- $clusterName := $spec.clusterRef.name -}}
          {{- $region := $envConfig.region -}}
          {{- $environment := $envConfig.environment -}}
          {{- $providerConfigs := $envConfig.providerConfigs -}}
          {{- $tools := $envConfig.tools -}}
          {{- $runtime := $envConfig.runtime -}}
          {{- $dns := $envConfig.dns -}}
          {{- $tls := $envConfig.tls -}}
          {{- $network := $envConfig.network | default dict -}}

          {{/* Feature flags from spec with environment config defaults */}}
          {{- $features := $spec.features | default dict -}}
          {{- $crossplaneEnabled := $features.crossplane | default true -}}
          {{- $argoCdEnabled := $features.argocd | default true -}}
          {{- $certManagerEnabled := $features.certManager | default true -}}
          {{- $argoRolloutsEnabled := $features.argoRollouts | default true -}}
          {{- $argoWorkflowsEnabled := $features.argoWorkflows | default false -}}
          {{- $traefikEnabled := $features.traefik | default false -}}
          {{- $externalSecretsEnabled := $features.externalSecrets | default true -}}
          {{- $gitopsPromoterEnabled := $features.gitopsPromoter | default true -}}
          {{- $argoMetricsEnabled := $features.argoMetrics | default true -}}
          {{- $observabilityEnabled := $features.observability | default true -}}

          {{/* VictoriaMetrics configuration from EnvironmentConfig (with safe defaults) */}}
          {{- $vmConfig := $tools.victoriametrics | default dict -}}
          {{- $vmEnabled := $vmConfig.enabled | default true -}}
          {{- $vmMode := $vmConfig.mode | default "single" -}}
          {{- $vmChartVersion := $vmConfig.chartVersion | default "0.29.5" -}}
          {{- $vmOperatorChartVersion := $vmConfig.operatorChartVersion | default "0.57.1" -}}
          {{- $vmNamespace := $vmConfig.namespace | default "observability" -}}
          {{- $vmRetention := $vmConfig.retention | default "90d" -}}
          {{- $vmStorageSize := $vmConfig.storage.size | default "50Gi" -}}

          {{/* Defaults: latest tested VictoriaMetrics versions + gp3 storage */}}
          {{- $vmAppVersion := "v1.131.0" -}}
          {{- $vmStorageClass := "gp3" -}}
          {{- $vmAgentChartVersion := $vmConfig.vmagent.chartVersion | default "0.26.5" -}}
          {{- $vmAgentAppVersion := "v1.131.0" -}}
          {{- $grafanaEnabled := $vmConfig.grafana.enabled | default true -}}
          {{- $grafanaChartVersion := $vmConfig.grafana.chartVersion | default "latest" -}}
          {{- $grafanaVersion := $vmConfig.grafana.version | default "latest" -}}
          {{- $grafanaPersistenceSize := $vmConfig.grafana.persistence.size | default "10Gi" -}}
          {{- $vmAlertEnabled := $vmConfig.alert.enabled | default true -}}
          {{- $clusterLabel := $vmConfig.clusterLabel | default "cluster" -}}

          {{/* FR-1: Dual-Level Feature Toggle - observability only deploys when both flags are true */}}
          {{- $shouldDeployVM := and $observabilityEnabled $vmEnabled -}}

          {{/* Grafana OIDC toggle — requires VictoriaMetrics + Grafana both enabled */}}
          {{- $hasGrafanaOIDC := false -}}
          {{- if and $shouldDeployVM $grafanaEnabled -}}
            {{- if $vmConfig.grafana.oidc -}}
              {{- if $vmConfig.grafana.oidc.enabled -}}
                {{- $hasGrafanaOIDC = true -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}

          {{/* Initialize observability variables (used in status even if not deploying) */}}
          {{- $vmSelectReplicas := 1 -}}
          {{- $vmInsertReplicas := 1 -}}
          {{- $vmStorageReplicas := 1 -}}
          {{- if and $shouldDeployVM (eq $vmMode "ha") }}
            {{- $vmSelectReplicas = 3 -}}
            {{- $vmInsertReplicas = 2 -}}
            {{- $vmStorageReplicas = 3 -}}
          {{- end }}

          {{/* TLS Configuration with defaults */}}
          {{- $tlsIssuerEnabled := false -}}
          {{- if and $dns.clusterDomain $certManagerEnabled $traefikEnabled -}}
            {{- if $tls.issuer -}}
              {{- $tlsIssuerEnabled = $tls.issuer.enabled | default false -}}
            {{- end -}}
          {{- end -}}

          {{- $tlsEmail := "kaos@kubecore.io" -}}
          {{- if and $tls.issuer $tls.issuer.email -}}
            {{- $tlsEmail = $tls.issuer.email -}}
          {{- end -}}

          {{- $acmeServer := "https://acme-v02.api.letsencrypt.org/directory" -}}
          {{- if and $tls.issuer $tls.issuer.acmeServer -}}
            {{- $acmeServer = $tls.issuer.acmeServer -}}
          {{- end -}}

          {{- $clusterIssuerName := printf "%s-system-issuer" $clusterName -}}

          {{/* Provider config references */}}
          {{- $specProviderConfigs := $spec.providerConfigRef | default dict -}}
          {{- $helmProvider := $specProviderConfigs.helm | default $providerConfigs.helm | default "helm-default" -}}
          {{- $kubernetesProvider := $specProviderConfigs.kubernetes | default $providerConfigs.kubernetes | default "kubernetes-default" -}}
          {{- $awsProvider := $specProviderConfigs.aws | default $providerConfigs.aws | default "aws-default" -}}

          {{/* Construct OIDC information using cluster ID from environment config */}}
          {{- $region := $envConfig.aws.primaryRegion -}}
          {{- $accountId := $envConfig.aws.accountId -}}
          {{- $clusterName := printf "%s-eks" $spec.clusterRef.name -}}
          {{- $oidcId := $envConfig.eks.clusterId -}}

          {{/* Construct specific OIDC ARN using cluster ID */}}
          {{- $oidcProviderArn := printf "arn:aws:iam::%s:oidc-provider/oidc.eks.%s.amazonaws.com/id/%s" $accountId $region $oidcId -}}
          {{- $oidcIssuerUrl := printf "oidc.eks.%s.amazonaws.com/id/%s" $region $oidcId -}}
          {{- $oidcProviderName := printf "%s-oidc-provider" $clusterName -}}
          
          {{/* Common labels */}}
          {{- $commonLabels := dict 
            "platform.kubecore.io/system" $name
            "platform.kubecore.io/cluster" $clusterName
            "platform.kubecore.io/managed-by" "crossplane"
            "platform.kubecore.io/composition" "kubesystem"
            "crossplane.io/composite" $name
          -}}
          
          {{/* Runtime configuration */}}
          {{- $nodeSelector := $runtime.nodeSelector | default dict -}}
          {{- $tolerations := $runtime.tolerations | default list -}}
          {{- $resourceProfile := $runtime.resourceProfile | default "medium" -}}

          {{/* Observability nodegroup specifications based on resource profile */}}
          {{- $obsNodeGroupInstanceTypes := list "m5.xlarge" "m5.2xlarge" -}}
          {{- $obsNodeGroupMaxSize := 5 -}}
          {{- $obsNodeGroupDesiredSize := 1 -}}
          {{- if eq $resourceProfile "small" }}
            {{- $obsNodeGroupInstanceTypes = list "m5.large" "m5.xlarge" -}}
            {{- $obsNodeGroupMaxSize = 3 -}}
            {{- $obsNodeGroupDesiredSize = 1 -}}
          {{- else if eq $resourceProfile "large" }}
            {{- $obsNodeGroupInstanceTypes = list "m5.2xlarge" "m6i.2xlarge" -}}
            {{- $obsNodeGroupMaxSize = 10 -}}
            {{- $obsNodeGroupDesiredSize = 1 -}}
          {{- end }}
          {{/* Always use minSize=1 (single instance), HA achieved via tolerations/taints and pod anti-affinity */}}
          {{- $obsNodeGroupMinSize := 1 -}}
          {{/* In HA mode we must have enough nodes to place replicas on different nodes */}}
          {{- if and $shouldDeployVM (eq $vmMode "ha") }}
            {{- $obsNodeGroupMinSize = 3 -}}
            {{- $obsNodeGroupDesiredSize = 3 -}}
          {{- end }}
          {{/* Extract disk size from VM storage config - map storage size to nodegroup disk size */}}
          {{/* Default mapping: small=20Gi->50GB, medium=50Gi->100GB, large=100Gi->200GB */}}
          {{- $obsNodeGroupDiskSize := 100 -}}
          {{- if $vmStorageSize }}
            {{- $vmStorageSizeStr := toString $vmStorageSize -}}
            {{/* Map VM storage size to nodegroup disk: 20Gi->50GB, 50Gi->100GB, 100Gi->200GB */}}
            {{- if contains "20Gi" $vmStorageSizeStr }}
              {{- $obsNodeGroupDiskSize = 50 -}}
            {{- else if contains "50Gi" $vmStorageSizeStr }}
              {{- $obsNodeGroupDiskSize = 100 -}}
            {{- else if contains "100Gi" $vmStorageSizeStr }}
              {{- $obsNodeGroupDiskSize = 200 -}}
            {{- end }}
          {{- end }}

          {{/* Extract cost allocation tags from EnvironmentConfig */}}
          {{- $costTags := dict -}}
          {{- if $envConfig.costAllocationTags -}}
            {{- $costTags = $envConfig.costAllocationTags -}}
          {{- end -}}

          {{/* =================================================================== */}}
          {{/* NAMESPACE CREATION */}}
          {{/* =================================================================== */}}
          
          {{/* Create Crossplane namespace */}}
          {{- if and $crossplaneEnabled $tools.crossplane $tools.crossplane.enabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-crossplane-namespace
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: crossplane-namespace
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $tools.crossplane.namespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "crossplane"
                    pod-security.kubernetes.io/enforce: "privileged"
          {{- end }}
          
          {{/* Create ArgoCD namespace */}}
          {{- if and $argoCdEnabled $tools.argocd $tools.argocd.enabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-namespace
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-namespace
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $tools.argocd.namespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "argocd"
                    pod-security.kubernetes.io/enforce: "baseline"
          {{- end }}
          
          {{/* Create cert-manager namespace */}}
          {{- if and $certManagerEnabled $tools.certManager $tools.certManager.enabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cert-manager-namespace
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cert-manager-namespace
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $tools.certManager.namespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "cert-manager"
                    pod-security.kubernetes.io/enforce: "baseline"
          {{- end }}
          
          {{/* Create Argo Rollouts namespace */}}
          {{- if and $argoRolloutsEnabled $tools.argoRollouts $tools.argoRollouts.enabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argo-rollouts-namespace
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-rollouts-namespace
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $tools.argoRollouts.namespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "argo-rollouts"
                    pod-security.kubernetes.io/enforce: "baseline"
          {{- end }}
          
          {{/* Create Argo Workflows namespace */}}
          {{- if and $argoWorkflowsEnabled $tools.argoWorkflows $tools.argoWorkflows.enabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argo-workflows-namespace
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-workflows-namespace
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $tools.argoWorkflows.namespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "argo-workflows"
                    pod-security.kubernetes.io/enforce: "baseline"
          {{- end }}
          
          {{/* Create Traefik namespace */}}
          {{- if and $traefikEnabled $tools.traefik $tools.traefik.enabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-traefik-namespace
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: traefik-namespace
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $tools.traefik.namespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "traefik"
                    pod-security.kubernetes.io/enforce: "baseline"
          {{- end }}

          {{/* Create External Secrets namespace */}}
          {{- if and $externalSecretsEnabled $tools.externalSecrets $tools.externalSecrets.enabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-external-secrets-namespace
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: external-secrets-namespace
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $tools.externalSecrets.namespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "external-secrets"
                    pod-security.kubernetes.io/enforce: "baseline"
          {{- end }}

          {{/* Create GitOps Promoter namespace */}}
          {{- if and $gitopsPromoterEnabled $tools.gitopsPromoter $tools.gitopsPromoter.enabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-gitops-promoter-namespace
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: gitops-promoter-namespace
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $tools.gitopsPromoter.namespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "gitops-promoter"
                    pod-security.kubernetes.io/enforce: "baseline"
          {{- end }}

          {{/* Create ExternalDNS namespace */}}
          {{- $externalDnsEnabled := $features.externalDns | default true -}}
          {{- if and $externalDnsEnabled $tools.externalDns $tools.externalDns.enabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-external-dns-namespace
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: external-dns-namespace
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $tools.externalDns.namespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "external-dns"
                    pod-security.kubernetes.io/enforce: "baseline"
          {{- end }}

          {{/* Create Observability namespace */}}
          {{- if $shouldDeployVM }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-observability-namespace
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: observability-namespace
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $vmNamespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "observability"
                    pod-security.kubernetes.io/enforce: "privileged"
          {{- end }}

          {{/* =================================================================== */}}
          {{/* HELM RELEASE INSTALLATIONS */}}
          {{/* =================================================================== */}}
          
          {{/* Crossplane Installation */}}
          {{- if and $crossplaneEnabled $tools.crossplane $tools.crossplane.enabled }}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-system-crossplane
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: crossplane-release
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "crossplane"
          spec:
            # Use Delete to avoid stale Helm release history causing sticky failed state on re-create.
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              chart:
                name: crossplane
                repository: {{ $tools.crossplane.repository.url }}
                version: "{{ $tools.crossplane.version }}"
              namespace: {{ $tools.crossplane.namespace }}
              values:
                resourcesCrossplane:
                  {{- if $tools.crossplane.resources.controller.requests }}
                  requests:
                    {{- range $key, $value := $tools.crossplane.resources.controller.requests }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tools.crossplane.resources.controller.limits }}
                  limits:
                    {{- range $key, $value := $tools.crossplane.resources.controller.limits }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                {{- if $tools.crossplane.args }}
                args:
                  {{- range $arg := $tools.crossplane.args }}
                  - "{{ $arg }}"
                  {{- end }}
                {{- end }}
                {{- if $nodeSelector }}
                nodeSelector:
                  {{- range $key, $value := $nodeSelector }}
                  {{ $key }}: "{{ $value }}"
                  {{- end }}
                {{- end }}
                {{- if $tolerations }}
                tolerations:
                  {{- range $toleration := $tolerations }}
                  - key: "{{ $toleration.key }}"
                    operator: "{{ $toleration.operator }}"
                    {{- if $toleration.value }}
                    value: "{{ $toleration.value }}"
                    {{- end }}
                    effect: "{{ $toleration.effect }}"
                  {{- end }}
                {{- end }}
                # RBAC Manager component configuration with scheduling
                rbacManager:
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tolerations }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: "{{ $toleration.key }}"
                      operator: "{{ $toleration.operator }}"
                      {{- if $toleration.value }}
                      value: "{{ $toleration.value }}"
                      {{- end }}
                      effect: "{{ $toleration.effect }}"
                    {{- end }}
                  {{- end }}
          {{- end }}

          {{/* cert-manager Installation */}}
          {{- if and $certManagerEnabled $tools.certManager $tools.certManager.enabled }}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-system-cert-manager
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cert-manager-release
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "cert-manager"
          spec:
            # Use Delete to avoid stale Helm release history causing sticky failed state on re-create.
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              # Helm installs may include hook jobs (e.g. startupapicheck) that can exceed the default 5m timeout
              wait: true
              waitTimeout: "20m"
              chart:
                name: cert-manager
                repository: {{ $tools.certManager.repository.url }}
                version: "{{ $tools.certManager.version }}"
              namespace: {{ $tools.certManager.namespace }}
              values:
                installCRDs: {{ $tools.certManager.installCRDs }}
                # Configure cert-manager to use public DNS for ACME HTTP-01 challenge validation
                # This ensures cert-manager can resolve external DNS records that aren't in cluster CoreDNS
                extraArgs:
                  - --acme-http01-solver-nameservers=8.8.8.8:53,1.1.1.1:53
                {{- if $nodeSelector }}
                nodeSelector:
                  {{- range $key, $value := $nodeSelector }}
                  {{ $key }}: "{{ $value }}"
                  {{- end }}
                {{- end }}
                {{- if $tolerations }}
                tolerations:
                  {{- range $toleration := $tolerations }}
                  - key: "{{ $toleration.key }}"
                    operator: "{{ $toleration.operator }}"
                    {{- if $toleration.value }}
                    value: "{{ $toleration.value }}"
                    {{- end }}
                    effect: "{{ $toleration.effect }}"
                  {{- end }}
                {{- end }}
                {{- if $tools.certManager.controller.resources }}
                resources:
                  {{- if $tools.certManager.controller.resources.requests }}
                  requests:
                    {{- range $key, $value := $tools.certManager.controller.resources.requests }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tools.certManager.controller.resources.limits }}
                  limits:
                    {{- range $key, $value := $tools.certManager.controller.resources.limits }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                {{- end }}
                # Webhook component configuration with scheduling
                webhook:
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tolerations }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: "{{ $toleration.key }}"
                      operator: "{{ $toleration.operator }}"
                      {{- if $toleration.value }}
                      value: "{{ $toleration.value }}"
                      {{- end }}
                      effect: "{{ $toleration.effect }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tools.certManager.webhook.resources }}
                  resources:
                    {{- if $tools.certManager.webhook.resources.requests }}
                    requests:
                      {{- range $key, $value := $tools.certManager.webhook.resources.requests }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                    {{- if $tools.certManager.webhook.resources.limits }}
                    limits:
                      {{- range $key, $value := $tools.certManager.webhook.resources.limits }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                  {{- end }}
                
                # Cainjector component configuration with scheduling
                cainjector:
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tolerations }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: "{{ $toleration.key }}"
                      operator: "{{ $toleration.operator }}"
                      {{- if $toleration.value }}
                      value: "{{ $toleration.value }}"
                      {{- end }}
                      effect: "{{ $toleration.effect }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tools.certManager.cainjector.resources }}
                  resources:
                    {{- if $tools.certManager.cainjector.resources.requests }}
                    requests:
                      {{- range $key, $value := $tools.certManager.cainjector.resources.requests }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                    {{- if $tools.certManager.cainjector.resources.limits }}
                    limits:
                      {{- range $key, $value := $tools.certManager.cainjector.resources.limits }}
                      {{ $key }}: "{{ $value }}"
                      {{- end }}
                    {{- end }}
                  {{- end }}
                
                # Startup API check component configuration with scheduling
                startupapicheck:
                  {{- if $nodeSelector }}
                  nodeSelector:
                    {{- range $key, $value := $nodeSelector }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                  {{- end }}
                  {{- if $tolerations }}
                  tolerations:
                    {{- range $toleration := $tolerations }}
                    - key: "{{ $toleration.key }}"
                      operator: "{{ $toleration.operator }}"
                      {{- if $toleration.value }}
                      value: "{{ $toleration.value }}"
                      {{- end }}
                      effect: "{{ $toleration.effect }}"
                    {{- end }}
                  {{- end }}
          {{- end }}

          {{/* =================================================================== */}}
          {{/* NOTE: VictoriaMetrics Operator is included in victoria-metrics-k8s-stack */}}
          {{/* No separate operator installation needed - it's a dependency of the stack */}}
          {{/* =================================================================== */}}

          {{/* Grafana Operator Installation */}}
          {{/* Default to enabled if Grafana is enabled and grafanaOperator config exists */}}
          {{- $grafanaOperatorEnabled := true -}}
          {{- if and $vmConfig.grafanaOperator (hasKey $vmConfig.grafanaOperator "enabled") -}}
            {{- $grafanaOperatorEnabled = $vmConfig.grafanaOperator.enabled -}}
          {{- end -}}
          {{- if and $shouldDeployVM $grafanaEnabled $vmConfig.grafanaOperator $grafanaOperatorEnabled }}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $clusterName }}-system-grafana-operator
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: grafana-operator-release
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "observability"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              chart:
                name: grafana-operator
                repository: {{ $vmConfig.grafanaOperator.repository.url }}
                version: "{{ $vmConfig.grafanaOperator.version }}"
              namespace: {{ $vmNamespace }}
              values:
                watchNamespaces: {{ $vmNamespace }}
                {{- if $nodeSelector }}
                nodeSelector:
                  {{- range $key, $value := $nodeSelector }}
                  {{ $key }}: "{{ $value }}"
                  {{- end }}
                {{- end }}
                {{- if $tolerations }}
                tolerations:
                  {{- range $toleration := $tolerations }}
                  - key: "{{ $toleration.key }}"
                    operator: "{{ $toleration.operator }}"
                    {{- if $toleration.value }}
                    value: "{{ $toleration.value }}"
                    {{- end }}
                    effect: "{{ $toleration.effect }}"
                  {{- end }}
                {{- end }}
          {{- end }}

          {{/* =================================================================== */}}
          {{/* CLUSTER ISSUER CREATION */}}
          {{/* =================================================================== */}}

          {{/* ClusterIssuer for automatic TLS certificate management */}}
          {{- if $tlsIssuerEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cluster-issuer
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cluster-issuer
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "cert-manager"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: cert-manager.io/v1
                kind: ClusterIssuer
                metadata:
                  name: {{ $clusterIssuerName }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  acme:
                    email: {{ $tlsEmail }}
                    server: {{ $acmeServer }}
                    privateKeySecretRef:
                      name: {{ $clusterName }}-acme-account-key
                    solvers:
                    - http01:
                        ingress:
                          ingressClassName: traefik-system
                          podTemplate:
                            spec:
                              {{- if $nodeSelector }}
                              nodeSelector:
                                {{- range $key, $value := $nodeSelector }}
                                {{ $key }}: "{{ $value }}"
                                {{- end }}
                              {{- end }}
                              {{- if $tolerations }}
                              tolerations:
                                {{- range $toleration := $tolerations }}
                                {{- if and $toleration.effect (ne $toleration.effect "") (ne $toleration.effect "<no value>") }}
                                - key: "{{ $toleration.key }}"
                                  operator: "{{ $toleration.operator }}"
                                  {{- if and $toleration.value (ne $toleration.value "") }}
                                  value: "{{ $toleration.value }}"
                                  {{- end }}
                                  effect: "{{ $toleration.effect }}"
                                {{- end }}
                                {{- end }}
                              {{- end }}
          {{- end }}

          {{/* =================================================================== */}}
          {{/* GRAFANA DASHBOARDS (Grafana Operator CRDs) */}}
          {{/* =================================================================== */}}

          {{/* Target the existing Helm-managed Grafana instance via an external Grafana CR */}}
          {{- if and $shouldDeployVM $grafanaEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-grafana-external
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: grafana-external
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "observability"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: grafana.integreatly.org/v1beta1
                kind: Grafana
                metadata:
                  name: {{ $clusterName }}-external-grafana
                  namespace: {{ $vmNamespace }}
                  labels:
                    dashboards: "kubecore-grafana"
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  external:
                    url: http://{{ $clusterName }}-vm-stack-grafana.{{ $vmNamespace }}.svc.cluster.local:80
                    adminUser:
                      name: {{ $clusterName }}-vm-stack-grafana
                      key: admin-user
                    adminPassword:
                      name: {{ $clusterName }}-vm-stack-grafana
                      key: admin-password
          {{- end }}

          {{/* KubeTools folder (for tool dashboards like ArgoCD, Traefik, etc.) */}}
          {{- if and $shouldDeployVM $grafanaEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
