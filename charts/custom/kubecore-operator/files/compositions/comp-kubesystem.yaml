                  instanceSelector:
                    matchLabels:
                      dashboards: "kubecore-grafana"
                  datasources:
                    - inputName: "DS_PROMETHEUS"
                      datasourceName: "P4169E866C3094E38"
                  grafanaCom:
                    id: 7249
                    revision: 1
          {{- end }}

          {{/* Node Exporter Full dashboard (Grafana.com ID 1860) */}}
          {{- if and $shouldDeployVM $grafanaEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-grafana-dashboard-node-exporter-1860
