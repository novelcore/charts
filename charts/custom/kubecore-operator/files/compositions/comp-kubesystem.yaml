          {{- end }}

          {{/* Kubernetes Pod resources dashboard (Grafana.com ID 6417) */}}
          {{- if and $shouldDeployVM $grafanaEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-grafana-dashboard-kubernetes-pod-resources-6417
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: grafana-dashboard-kubernetes-pod-resources-6417
            labels:
