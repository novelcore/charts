              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "observability"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: grafana.integreatly.org/v1beta1
                kind: GrafanaFolder
                metadata:
                  name: {{ $clusterName }}-kubernetes
                  namespace: {{ $vmNamespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  title: "Kubernetes"
                  instanceSelector:
                    matchLabels:
                      dashboards: "kubecore-grafana"
          {{- end }}

          {{/* ArgoCD dashboard (Grafana.com ID 19993) */}}
          {{- if and $shouldDeployVM $grafanaEnabled $argoCdEnabled $tools.argocd $tools.argocd.enabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-grafana-dashboard-argocd-19993
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: grafana-dashboard-argocd-19993
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "argocd"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: grafana.integreatly.org/v1beta1
                kind: GrafanaDashboard
                metadata:
                  name: {{ $clusterName }}-argocd-19993
                  namespace: {{ $vmNamespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "argocd"
                spec:
                  folderRef: {{ $clusterName }}-kubetools
                  instanceSelector:
                    matchLabels:
                      dashboards: "kubecore-grafana"
                  grafanaCom:
                    id: 19993
                    revision: 1
          {{- end }}

          {{/* cert-manager dashboard (Grafana.com ID 22184) */}}
          {{- if and $shouldDeployVM $grafanaEnabled $certManagerEnabled $tools.certManager $tools.certManager.enabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-grafana-dashboard-cert-manager-22184
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: grafana-dashboard-cert-manager-22184
            labels:
              {{- range $key, $value := $commonLabels }}
