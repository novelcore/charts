                    platform.kubecore.io/component: "external-secrets"
                spec:
                  folderRef: {{ $clusterName }}-kubetools
                  instanceSelector:
                    matchLabels:
                      dashboards: "kubecore-grafana"
                  datasources:
                    # Map templated datasource inputs inside the imported dashboard JSON
                    # to our existing vm-stack datasource by UID (Grafana variable value is a UID).
                    - inputName: "DS_PROMETHEUS"
                      datasourceName: "P4169E866C3094E38"
                  grafanaCom:
                    id: 21640
                    revision: 1
          {{- end }}

          {{/* Kubernetes Persistent Volumes dashboard (Grafana.com ID 13646) */}}
          {{- if and $shouldDeployVM $grafanaEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-grafana-dashboard-kubernetes-pv-13646
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: grafana-dashboard-kubernetes-pv-13646
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
              platform.kubecore.io/component: "observability"
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubernetesProvider }}
            forProvider:
              manifest:
                apiVersion: grafana.integreatly.org/v1beta1
                kind: GrafanaDashboard
                metadata:
                  name: {{ $clusterName }}-kubernetes-persistent-volumes-13646
                  namespace: {{ $vmNamespace }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                    platform.kubecore.io/component: "observability"
                spec:
                  folderRef: {{ $clusterName }}-kubernetes
                  instanceSelector:
                    matchLabels:
                      dashboards: "kubecore-grafana"
