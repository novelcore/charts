apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: k8sapps.k8s.platform.kubecore.io
  labels:
    provider: kubernetes
    service: app-manifests
    version: v2
    implementation: crossplane-v2-migration
    revision: working
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: k8s.platform.kubecore.io/v1alpha1
    kind: XK8sApp
  mode: Pipeline
  pipeline:

  # Step 1: Load EnvironmentConfig - 1:1 mapping with XK8sApp name
  - step: load-environment-configs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Selector
          selector:
            matchLabels:
            # PRIMARY: Select by app name (must match XK8sApp name)
            - key: k8s.platform.kubecore.io/app-name
              type: FromCompositeFieldPath
              valueFromFieldPath: metadata.name
            # SECONDARY: Ensure it's a K8sApp config type
            - key: platform.kubecore.io/type
              type: Value
              value: k8sapp-config
            # TERTIARY: Match KubeApp name for uniqueness across projects
            - key: kubecore.io/kubeapp
              type: FromCompositeFieldPath
              valueFromFieldPath: metadata.name

  # Step 2: Generate Base Kubernetes Resources - ONLY EnvironmentConfig + spec
  - step: generate-base-resources
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Extract configuration from environment config - SINGLE SOURCE OF TRUTH */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found - EnvironmentConfig name must match XK8sApp name" -}}
          {{- end -}}

          {{/* Extract all configuration from EnvironmentConfig */}}
          {{- $githubProviderConfigName := $envConfig.githubProviderConfigName -}}
          {{- if not $githubProviderConfigName -}}
            {{- fail "githubProviderConfigName is required in EnvironmentConfig" -}}
          {{- end -}}

          {{- $project := $envConfig.project -}}
          {{- if not $project -}}
            {{- fail "project configuration is required in EnvironmentConfig" -}}
          {{- end -}}

          {{- $k8sapp := $envConfig.k8sapp -}}
          {{- if not $k8sapp -}}
            {{- fail "k8sapp configuration is required in EnvironmentConfig" -}}
          {{- end -}}

          {{/* App configuration from EnvironmentConfig */}}
          {{- $appName := $k8sapp.appName | default ($spec.appName | default $name) -}}
          {{- $projectName := $project.name -}}
          {{- $targetRepository := $spec.targetRepository | default $project.repository | default $projectName -}}
          {{- $appType := $k8sapp.appType | default "rest" -}}
          {{- $appPort := $k8sapp.appPort | default 8000 -}}
          {{- $resourceName := printf "%s-%s" $projectName $appName -}}

          {{/* ECR enablement detection and image URL construction */}}
          {{- $ecrEnabled := false -}}
          {{- if and $spec.features $spec.features.ecr $spec.features.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- else if and $k8sapp.ecr $k8sapp.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- end -}}

          {{/* Build ECR image URL if enabled */}}
          {{- $finalImage := "" -}}
          {{- $ecrRepositoryUrl := "" -}}
          {{- $ecrRegistryHost := "" -}}
          {{- if $ecrEnabled -}}
            {{- $awsConfig := $envConfig.aws -}}
            {{- $org := $envConfig.organization.name -}}
            {{- if not $org -}}
              {{- fail "Organization name is required for ECR repository creation. Ensure organization config is properly set in EnvironmentConfig." -}}
            {{- end -}}
            {{- $primaryRegion := $awsConfig.primaryRegion -}}
            {{- $accountId := $awsConfig.accountId -}}
            {{- $customRepoName := "" -}}
            {{- if and $spec.features $spec.features.ecr $spec.features.ecr.repositoryName -}}
              {{- $customRepoName = $spec.features.ecr.repositoryName -}}
            {{- else if and $k8sapp.ecr $k8sapp.ecr.repositoryName -}}
              {{- $customRepoName = $k8sapp.ecr.repositoryName -}}
            {{- end -}}
            {{- $ecrRepositoryName := $customRepoName | default (printf "%s-%s-%s" $org $projectName $appName) -}}
            {{- $ecrRegistryHost = printf "%s.dkr.ecr.%s.amazonaws.com" $accountId $primaryRegion -}}
            {{- $ecrRepositoryUrl = printf "%s/%s" $ecrRegistryHost $ecrRepositoryName -}}
            {{- $finalImage = printf "%s:v0.0.0" $ecrRepositoryUrl -}}
          {{- else -}}
            {{- $finalImage = $k8sapp.appImage -}}
            {{- if not $finalImage -}}
              {{- fail "Either ECR must be enabled (spec.features.ecr.enabled=true) OR appImage must be specified in EnvironmentConfig (k8sapp.appImage)" -}}
            {{- end -}}
          {{- end -}}

          {{/* Feature toggles from spec */}}
          {{- $baseResourcesEnabled := true -}}
          {{- if and $spec.features $spec.features.baseResources -}}
            {{- $baseResourcesEnabled = $spec.features.baseResources.enabled | default true -}}
          {{- end -}}

          {{/* GitOps configuration from EnvironmentConfig */}}
          {{- $gitops := $k8sapp.gitops | default (dict) -}}
          {{- $commitAuthor := $gitops.commitAuthor | default "kubecore-k8sapp[bot]" -}}
          {{- $commitEmail := $gitops.commitEmail | default "kubecore-k8sapp[bot]@kubecore.eu" -}}
          {{- $basePath := $gitops.basePath | default "kubeapps" -}}

          {{/* Health check configuration */}}
          {{- $healthCheck := $k8sapp.healthCheck | default (dict) -}}
          {{- $healthPath := $healthCheck.path | default "/health" -}}
          {{- $healthInitialDelay := $healthCheck.initialDelaySeconds | default 30 -}}
          {{- $healthPeriod := $healthCheck.periodSeconds | default 10 -}}

          {{/* Service configuration */}}
          {{- $service := $k8sapp.service | default (dict) -}}
          {{- $serviceType := $service.type | default "ClusterIP" -}}
          {{- $servicePort := $service.port | default 80 -}}
          {{- $serviceTargetPort := $service.targetPort | default $appPort -}}

          {{/* Extract cost allocation tags from EnvironmentConfig */}}
          {{- $costTags := dict -}}
          {{- if $envConfig.costAllocationTags -}}
            {{- $costTags = $envConfig.costAllocationTags -}}
          {{- end -}}

          {{/* Base resources configuration */}}
          {{- $baseResources := $k8sapp.baseResources | default (dict) -}}

          {{- if $baseResourcesEnabled }}
          ---
          # Base Kubernetes Resources
          apiVersion: repo.github.upbound.io/v1alpha1
          kind: RepositoryFile
          metadata:
            name: {{ $name }}-base-resources
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: base-resources
              kubecore.eu/app: {{ $resourceName }}
          spec:
            deletionPolicy: Delete
            forProvider:
              branch: main
              commitAuthor: {{ $commitAuthor }}
              commitEmail: {{ $commitEmail }}
              commitMessage: "Generate base Kubernetes resources for {{ $resourceName }}"
              content: |
                ---
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: {{ $resourceName }}
                  labels:
                    app: {{ $resourceName }}
                    kubeapp: {{ $resourceName }}
                    app.kubernetes.io/name: {{ $appName }}
                    app.kubernetes.io/part-of: {{ $projectName }}
                    app.kubernetes.io/component: backend
                    app.kubernetes.io/managed-by: kubecore
                spec:
                  replicas: 0  # Will be overridden by overlays
                  selector:
                    matchLabels:
                      app: {{ $resourceName }}
                  template:
                    metadata:
                      labels:
                        app: {{ $resourceName }}
                        app.kubernetes.io/name: {{ $appName }}
                        app.kubernetes.io/part-of: {{ $projectName }}
                    spec:
                      {{ if $ecrEnabled }}
                      imagePullSecrets:
                      - name: {{ $resourceName }}-ecr-dockerconfig
                      {{ end }}
                      {{ if and $baseResources.serviceAccount $baseResources.serviceAccount.enabled }}
                      serviceAccountName: {{ $baseResources.serviceAccount.name | default (printf "%s-sa" $resourceName) }}
                      {{ end }}
                      containers:
                      - name: {{ $resourceName }}
                        image: {{ $finalImage }}
                        ports:
                        - containerPort: {{ $appPort }}
                          name: http
                        {{ if $healthCheck }}
                        livenessProbe:
                          httpGet:
                            path: {{ $healthPath }}
                            port: http
                          initialDelaySeconds: {{ $healthInitialDelay }}
                          periodSeconds: {{ $healthPeriod }}
                        readinessProbe:
                          httpGet:
                            path: {{ $healthPath }}
                            port: http
                          initialDelaySeconds: 5
                          periodSeconds: 5
                        {{ end }}
                        env:
                        - name: APP_NAME
                          value: {{ $appName }}
                        - name: PORT
                          value: "{{ $appPort }}"
                        envFrom:
                        - configMapRef:
                            name: {{ $resourceName }}-config
                        - secretRef:
                            name: {{ $resourceName }}-secrets

                ---
                apiVersion: v1
                kind: Service
                metadata:
                  name: {{ $resourceName }}-svc
                  labels:
                    app: {{ $resourceName }}
                    app.kubernetes.io/name: {{ $appName }}
                    app.kubernetes.io/part-of: {{ $projectName }}
                    app.kubernetes.io/managed-by: kubecore
                spec:
                  type: {{ $serviceType }}
                  ports:
                  - port: {{ $servicePort }}
                    targetPort: {{ $serviceTargetPort }}
                    name: http
                  selector:
                    app: {{ $resourceName }}

                {{ if and $baseResources.configMap $baseResources.configMap.enabled }}
                ---
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: {{ $resourceName }}-config
                  labels:
                    app: {{ $resourceName }}
                    app.kubernetes.io/name: {{ $appName }}
                    app.kubernetes.io/part-of: {{ $projectName }}
                    app.kubernetes.io/managed-by: kubecore
                data:
                  {{ range $key, $value := $baseResources.configMap.data }}
                  {{ $key }}: {{ $value | quote }}
                  {{ end }}
                {{ end }}

                {{ if and $baseResources.secret $baseResources.secret.enabled }}
                ---
                apiVersion: v1
                kind: Secret
                metadata:
                  name: {{ $resourceName }}-secrets
                  labels:
                    app: {{ $resourceName }}
                    app.kubernetes.io/name: {{ $appName }}
                    app.kubernetes.io/part-of: {{ $projectName }}
                    app.kubernetes.io/managed-by: kubecore
                type: {{ $baseResources.secret.type | default "Opaque" }}
                data: {}  # Will be populated by external secret management
                {{ end }}

                {{ if and $baseResources.serviceAccount $baseResources.serviceAccount.enabled }}
                ---
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: {{ $baseResources.serviceAccount.name | default (printf "%s-sa" $resourceName) }}
                  labels:
                    app: {{ $resourceName }}
                    app.kubernetes.io/name: {{ $appName }}
                    app.kubernetes.io/part-of: {{ $projectName }}
                    app.kubernetes.io/managed-by: kubecore
                {{ end }}
              file: {{ $basePath }}/{{ $resourceName }}/base/resources.yaml
              overwriteOnCreate: true
              repositorySelector:
                matchLabels:
                  kubecore.eu/kubeproject: {{ $projectName }}
              repository: {{ $targetRepository }}
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
          {{- end }}

  # Step 4: Generate Base Kustomization
  - step: generate-base-kustomization
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found - EnvironmentConfig name must match XK8sApp name" -}}
          {{- end -}}

          {{- $githubProviderConfigName := $envConfig.githubProviderConfigName -}}
          {{- $project := $envConfig.project -}}
          {{- $k8sapp := $envConfig.k8sapp -}}

          {{/* App configuration */}}
          {{- $appName := $k8sapp.appName | default ($spec.appName | default $name) -}}
          {{- $projectName := $project.name -}}
          {{- $targetRepository := $spec.targetRepository | default $project.repository | default $projectName -}}
          {{- $resourceName := printf "%s-%s" $projectName $appName -}}

          {{/* Feature toggles */}}
          {{- $gitopsEnabled := true -}}
          {{- if and $spec.features $spec.features.gitops -}}
            {{- $gitopsEnabled = $spec.features.gitops.enabled | default true -}}
          {{- end -}}

          {{/* GitOps configuration */}}
          {{- $gitops := $k8sapp.gitops | default (dict) -}}
          {{- $commitAuthor := $gitops.commitAuthor | default "kubecore-k8sapp[bot]" -}}
          {{- $commitEmail := $gitops.commitEmail | default "kubecore-k8sapp[bot]@kubecore.eu" -}}
          {{- $basePath := $gitops.basePath | default "kubeapps" -}}

          {{/* Kustomization configuration */}}
          {{- $kustomization := $k8sapp.kustomization | default (dict) -}}

          {{- if $gitopsEnabled }}
          ---
          # Base Kustomization
          apiVersion: repo.github.upbound.io/v1alpha1
          kind: RepositoryFile
          metadata:
            name: {{ $name }}-base-kustomization
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: base-kustomization
              kubecore.eu/app: {{ $resourceName }}
          spec:
            deletionPolicy: Delete
            forProvider:
              branch: main
              commitAuthor: {{ $commitAuthor }}
              commitEmail: {{ $commitEmail }}
              commitMessage: "Generate base kustomization for {{ $resourceName }}"
              content: |
                apiVersion: kustomize.config.k8s.io/v1beta1
                kind: Kustomization

                resources:
                - resources.yaml

                {{ if $kustomization.namePrefix }}
                namePrefix: {{ $kustomization.namePrefix }}
                {{ end }}
                {{ if $kustomization.nameSuffix }}
                nameSuffix: {{ $kustomization.nameSuffix }}
                {{ end }}

                commonAnnotations:
                  kubecore.eu/app: {{ $resourceName }}
                  kubecore.eu/project: {{ $projectName }}
                labels:
                - includeSelectors: true
                  pairs:
                    app.kubernetes.io/managed-by: kubecore
                    app.kubernetes.io/name: {{ $appName }}
                    app.kubernetes.io/part-of: {{ $projectName }}
              file: {{ $basePath }}/{{ $resourceName }}/base/kustomization.yaml
              overwriteOnCreate: true
              repositorySelector:
                matchLabels:
                  kubecore.eu/kubeproject: {{ $projectName }}
              repository: {{ $targetRepository }}
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
          {{- end }}

  # Step 5: Generate Environment Overlays
  - step: generate-environment-overlays
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found - EnvironmentConfig name must match XK8sApp name" -}}
          {{- end -}}

          {{- $githubProviderConfigName := $envConfig.githubProviderConfigName -}}
          {{- $project := $envConfig.project -}}
          {{- $k8sapp := $envConfig.k8sapp -}}
          {{- $networking := $envConfig.networking -}}

          {{/* App configuration */}}
          {{- $appName := $k8sapp.appName | default ($spec.appName | default $name) -}}
          {{- $projectName := $project.name -}}
          {{- $targetRepository := $spec.targetRepository | default $project.repository | default $projectName -}}
          {{- $resourceName := printf "%s-%s" $projectName $appName -}}

          {{/* ECR enablement detection and image URL construction */}}
          {{- $ecrEnabled := false -}}
          {{- if and $spec.features $spec.features.ecr $spec.features.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- else if and $k8sapp.ecr $k8sapp.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- end -}}

          {{/* Build ECR image URL if enabled */}}
          {{- $ecrRepositoryUrl := "" -}}
          {{- $ecrRegistryHost := "" -}}
          {{- if $ecrEnabled -}}
            {{- $awsConfig := $envConfig.aws -}}
            {{- $org := $envConfig.organization.name -}}
            {{- if not $org -}}
              {{- fail "Organization name is required for ECR repository creation. Ensure organization config is properly set in EnvironmentConfig." -}}
            {{- end -}}
            {{- $primaryRegion := $awsConfig.primaryRegion -}}
            {{- $accountId := $awsConfig.accountId -}}
            {{- $customRepoName := "" -}}
            {{- if and $spec.features $spec.features.ecr $spec.features.ecr.repositoryName -}}
              {{- $customRepoName = $spec.features.ecr.repositoryName -}}
            {{- else if and $k8sapp.ecr $k8sapp.ecr.repositoryName -}}
              {{- $customRepoName = $k8sapp.ecr.repositoryName -}}
            {{- end -}}
            {{- $ecrRepositoryName := $customRepoName | default (printf "%s-%s-%s" $org $projectName $appName) -}}
            {{- $ecrRegistryHost = printf "%s.dkr.ecr.%s.amazonaws.com" $accountId $primaryRegion -}}
            {{- $ecrRepositoryUrl = printf "%s/%s" $ecrRegistryHost $ecrRepositoryName -}}
          {{- end -}}

          {{/* Feature toggles */}}
          {{- $environmentOverlaysEnabled := true -}}
          {{- if and $spec.features $spec.features.environmentOverlays -}}
            {{- $environmentOverlaysEnabled = $spec.features.environmentOverlays.enabled | default true -}}
          {{- end -}}

          {{/* GitOps configuration */}}
          {{- $gitops := $k8sapp.gitops | default (dict) -}}
          {{- $commitAuthor := $gitops.commitAuthor | default "kubecore-k8sapp[bot]" -}}
          {{- $commitEmail := $gitops.commitEmail | default "kubecore-k8sapp[bot]@kubecore.eu" -}}
          {{- $basePath := $gitops.basePath | default "kubeapps" -}}

          {{- if $environmentOverlaysEnabled }}
          {{/* Generate overlay resources for each enabled environment */}}
          {{- range $env := $k8sapp.environments }}
          {{- $envEnabled := $env.enabled -}}
          {{- $envName := $env.name -}}

          {{/* Enforce type-prefix: overlay dir = {type}-{envName} unless envName is
               already the type itself ("dev") or already starts with "{type}-" ("dev-omg").
               This guarantees CD workflows can match all overlays of a type via "dev dev-*". */}}
          {{- $envType := $env.environmentType | default "" -}}
          {{- $overlayName := $envName -}}
          {{- if and $envType (ne $envName $envType) (not (hasPrefix (printf "%s-" $envType) $envName)) -}}
            {{- $overlayName = printf "%s-%s" $envType $envName -}}
          {{- end -}}

          {{- if $envEnabled }}
          ---
          # Environment Overlay Resources - {{ $envName }}
          apiVersion: repo.github.upbound.io/v1alpha1
          kind: RepositoryFile
          metadata:
            name: {{ $name }}-{{ $overlayName }}-overlay
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $overlayName }}-overlay
              kubecore.eu/app: {{ $resourceName }}
              kubecore.eu/environment: {{ $envName }}
          spec:
            deletionPolicy: Delete
            forProvider:
              branch: main
              commitAuthor: {{ $commitAuthor }}
              commitEmail: {{ $commitEmail }}
              commitMessage: "Generate {{ $envName }} overlay for {{ $resourceName }}"
              content: |
                # {{ $envName }} environment overlay for {{ $resourceName }}
                # Strategic merge patch for Deployment
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: {{ $resourceName }}
                spec:
                  replicas: {{ $env.replicas | default 1 }}
                  template:
                    spec:
                      {{/* Pod Scheduling Configuration */}}
                      {{ if $env.scheduling }}
                      {{ if $env.scheduling.nodeSelector }}
                      nodeSelector:
                        {{ range $key, $value := $env.scheduling.nodeSelector }}
                        {{ $key }}: {{ $value | quote }}
                        {{ end }}
                      {{ end }}
                      {{ if $env.scheduling.tolerations }}
                      tolerations:
                      {{ range $toleration := $env.scheduling.tolerations }}
                      - key: {{ $toleration.key | quote }}
                        {{ if $toleration.operator }}
                        operator: {{ $toleration.operator | quote }}
                        {{ end }}
                        {{ if $toleration.value }}
                        value: {{ $toleration.value | quote }}
                        {{ end }}
                        {{ if $toleration.effect }}
                        effect: {{ $toleration.effect | quote }}
                        {{ end }}
                      {{ end }}
                      {{ end }}
                      {{ if $env.scheduling.affinity }}
                      affinity:
                        {{ if $env.scheduling.affinity.nodeAffinity }}
                        nodeAffinity:
                          {{ if $env.scheduling.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution }}
                          requiredDuringSchedulingIgnoredDuringExecution:
                            nodeSelectorTerms:
                            {{ range $term := $env.scheduling.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms }}
                            - matchExpressions:
                              {{ range $expr := $term.matchExpressions }}
                              - key: {{ $expr.key | quote }}
                                operator: {{ $expr.operator | quote }}
                                {{ if $expr.values }}
                                values:
                                {{ range $val := $expr.values }}
                                - {{ $val | quote }}
                                {{ end }}
                                {{ end }}
                              {{ end }}
                            {{ end }}
                          {{ end }}
                        {{ end }}
                      {{ end }}
                      {{ end }}
                      containers:
                      - name: {{ $resourceName }}
                        {{ if $env.environment }}
                        env:
                        {{ range $key, $value := $env.environment }}
                        - name: {{ $key }}
                          value: {{ $value | quote }}
                        {{ end }}
                        {{ end }}
                        {{ if $env.resources }}
                        resources:
                          {{ if $env.resources.requests }}
                          requests:
                            {{ range $key, $value := $env.resources.requests }}
                            {{ $key }}: {{ $value }}
                            {{ end }}
                          {{ end }}
                          {{ if $env.resources.limits }}
                          limits:
                            {{ range $key, $value := $env.resources.limits }}
                            {{ $key }}: {{ $value }}
                            {{ end }}
                          {{ end }}
                        {{ end }}
              file: {{ $basePath }}/{{ $resourceName }}/overlays/{{ $overlayName }}/deployment-patch.yaml
              overwriteOnCreate: true
              repositorySelector:
                matchLabels:
                  kubecore.eu/kubeproject: {{ $projectName }}
              repository: {{ $targetRepository }}
            providerConfigRef:
              name: {{ $githubProviderConfigName }}

          ---
          # Environment Kustomization - {{ $envName }}
          apiVersion: repo.github.upbound.io/v1alpha1
          kind: RepositoryFile
          metadata:
            name: {{ $name }}-{{ $overlayName }}-kustomization
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $overlayName }}-kustomization
              kubecore.eu/app: {{ $resourceName }}
              kubecore.eu/environment: {{ $envName }}
          spec:
            deletionPolicy: Delete
            managementPolicies: ["Observe", "Create","Delete"]
            forProvider:
              branch: main
              commitAuthor: {{ $commitAuthor }}
              commitEmail: {{ $commitEmail }}
              commitMessage: "Generate {{ $envName }} kustomization for {{ $resourceName }}"
              content: |
                apiVersion: kustomize.config.k8s.io/v1beta1
                kind: Kustomization

                resources:
                - ../../base

                {{ if $ecrEnabled }}
                images:
                - name: {{ $ecrRepositoryUrl }}:v0.0.0
                  newName: {{ $ecrRepositoryUrl }}
                  newTag: v0.0.0-{{ $envName }}
                {{ end }}

                namespace: {{ $env.namespace | default (printf "%s-%s" $projectName $envName) }}

                patches:
                - path: deployment-patch.yaml


                labels:
                - pairs:
                    kubecore.eu/environment: {{ $envName }}
                  includeSelectors: false
              file: {{ $basePath }}/{{ $resourceName }}/overlays/{{ $overlayName }}/kustomization.yaml
              overwriteOnCreate: true
              repositorySelector:
                matchLabels:
                  kubecore.eu/kubeproject: {{ $projectName }}
              repository: {{ $targetRepository }}
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
          {{- end }}
          {{- end }}
          {{- end }}

  # Step 6: Create ECR Repository for Application
  - step: create-ecr-repository
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found - EnvironmentConfig name must match XK8sApp name" -}}
          {{- end -}}

          {{- $project := $envConfig.project -}}
          {{- $k8sapp := $envConfig.k8sapp -}}
          {{- $org := $envConfig.organization.name -}}
          {{- if not $org -}}
            {{- fail "Organization name is required for ECR repository creation. Ensure organization config is properly set in EnvironmentConfig." -}}
          {{- end -}}
          {{- $awsConfig := $envConfig.aws -}}
          {{- $primaryRegion := $awsConfig.primaryRegion -}}
          {{- $accountId := $awsConfig.accountId -}}
          {{- $providerConfig := $awsConfig.providerConfig -}}
          {{- $kubernetesProviderConfig := $awsConfig.kubernetesProviderConfig -}}

          {{/* App configuration */}}
          {{- $appName := $k8sapp.appName | default ($spec.appName | default $name) -}}
          {{- $projectName := $project.name -}}

          {{/* ECR feature check */}}
          {{- $ecrEnabled := false -}}
          {{- if and $spec.features $spec.features.ecr $spec.features.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- else if and $k8sapp.ecr $k8sapp.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- end -}}

          {{- if $ecrEnabled }}
          {{/* Repository naming: {org}-{project-name}-{app-name} */}}
          {{- $customRepoName := "" -}}
          {{- if and $spec.features $spec.features.ecr $spec.features.ecr.repositoryName -}}
            {{- $customRepoName = $spec.features.ecr.repositoryName -}}
          {{- else if and $k8sapp.ecr $k8sapp.ecr.repositoryName -}}
            {{- $customRepoName = $k8sapp.ecr.repositoryName -}}
          {{- end -}}
          {{- $ecrRepositoryName := $customRepoName | default (printf "%s-%s-%s" $org $projectName $appName) -}}

          {{/* Extract cost allocation tags from EnvironmentConfig */}}
          {{- $costTags := dict -}}
          {{- if $envConfig.costAllocationTags -}}
            {{- $costTags = $envConfig.costAllocationTags -}}
          {{- end -}}

          {{/* ECR lifecycle configuration */}}
          {{- $ecrConfig := dict -}}
          {{- if $k8sapp.ecr -}}
            {{- $ecrConfig = $k8sapp.ecr -}}
          {{- end -}}
          {{- $keepLastImages := 50 -}}
          {{- $expireUntaggedDays := 30 -}}
          {{- if and $ecrConfig.lifecycle -}}
            {{- if $ecrConfig.lifecycle.keepLastImages -}}
              {{- $keepLastImages = $ecrConfig.lifecycle.keepLastImages -}}
            {{- end -}}
            {{- if $ecrConfig.lifecycle.expireUntaggedDays -}}
              {{- $expireUntaggedDays = $ecrConfig.lifecycle.expireUntaggedDays -}}
            {{- end -}}
          {{- end -}}

          ---
          # ECR Repository for Application
          apiVersion: ecr.aws.upbound.io/v1beta2
          kind: Repository
          metadata:
            name: {{ $name }}-ecr-repository
            annotations:
              crossplane.io/external-name: {{ $ecrRepositoryName }}
              gotemplating.fn.crossplane.io/composition-resource-name: ecr-repository
              kubecore.eu/app: {{ printf "%s-%s" $projectName $appName }}
              kubecore.eu/project: {{ $projectName }}
            labels:
              platform.kubecore.io/organization: {{ $org }}
              platform.kubecore.io/project: {{ $projectName }}
              platform.kubecore.io/resource-type: ecr-repository
              platform.kubecore.io/region: {{ $primaryRegion }}
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $providerConfig }}
            forProvider:
              region: {{ $primaryRegion }}
              forceDelete: true  # Allow deletion even when images are present
              imageScanningConfiguration:
                scanOnPush: true
              imageTagMutability: MUTABLE
              encryptionConfiguration:
                - encryptionType: AES256
              tags:
                {{- range $key, $value := $costTags }}
                {{ $key }}: {{ $value | quote }}
                {{- end }}
                Organization: {{ $org }}
                Project: {{ $projectName }}
                Application: {{ $appName }}
                Region: {{ $primaryRegion }}
                ManagedBy: crossplane
                Purpose: container-registry

          ---
          # ECR Lifecycle Policy for Application Repository
          apiVersion: ecr.aws.upbound.io/v1beta1
          kind: LifecyclePolicy
          metadata:
            name: {{ $name }}-ecr-lifecycle
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ecr-lifecycle
              kubecore.eu/app: {{ printf "%s-%s" $projectName $appName }}
              kubecore.eu/project: {{ $projectName }}
            labels:
              platform.kubecore.io/organization: {{ $org }}
              platform.kubecore.io/project: {{ $projectName }}
              platform.kubecore.io/resource-type: ecr-lifecycle
              platform.kubecore.io/region: {{ $primaryRegion }}
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $providerConfig }}
            forProvider:
              region: {{ $primaryRegion }}
              repositorySelector:
                matchLabels:
                  crossplane.io/composite: {{ $name }}
                  platform.kubecore.io/organization: {{ $org }}
                  platform.kubecore.io/project: {{ $projectName }}
                  platform.kubecore.io/region: {{ $primaryRegion }}
              policy: |
                {
                  "rules": [
                    {
                      "rulePriority": 1,
                      "description": "Expire untagged images after {{ $expireUntaggedDays }} days",
                      "selection": {
                        "tagStatus": "untagged",
                        "countType": "sinceImagePushed",
                        "countUnit": "days",
                        "countNumber": {{ $expireUntaggedDays }}
                      },
                      "action": {
                        "type": "expire"
                      }
                    },
                    {
                      "rulePriority": 2,
                      "description": "Keep last {{ $keepLastImages }} tagged images",
                      "selection": {
                        "tagStatus": "tagged",
                        "tagPrefixList": ["v"],
                        "countType": "imageCountMoreThan",
                        "countNumber": {{ $keepLastImages }}
                      },
                      "action": {
                        "type": "expire"
                      }
                    }
                  ]
                }
          {{- end }}

  # Step 6.5: Create Per-Environment ServiceAccounts for ECR Access
  - step: create-ecr-service-accounts
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found - EnvironmentConfig name must match XK8sApp name" -}}
          {{- end -}}

          {{- $project := $envConfig.project -}}
          {{- $k8sapp := $envConfig.k8sapp -}}
          {{- $org := $envConfig.organization.name -}}
          {{- if not $org -}}
            {{- fail "Organization name is required for ECR repository creation. Ensure organization config is properly set in EnvironmentConfig." -}}
          {{- end -}}
          {{- $awsConfig := $envConfig.aws -}}
          {{- $accountId := $awsConfig.accountId -}}
          {{- $kubernetesProviderConfig := $awsConfig.kubernetesProviderConfig -}}
          {{- $clusterName := "" -}}
          {{- if $envConfig.aws -}}
            {{- $clusterName = $envConfig.aws.clusterName | default "" -}}
          {{- end -}}

          {{/* App configuration */}}
          {{- $appName := $k8sapp.appName | default ($spec.appName | default $name) -}}
          {{- $projectName := $project.name -}}
          {{- $resourceName := printf "%s-%s" $projectName $appName -}}

          {{/* ECR feature check */}}
          {{- $ecrEnabled := false -}}
          {{- if and $spec.features $spec.features.ecr $spec.features.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- else if and $k8sapp.ecr $k8sapp.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- end -}}

          {{- if and $ecrEnabled $clusterName }}
          {{/* Create ServiceAccount in each enabled environment namespace */}}
          {{- range $env := $k8sapp.environments }}
          {{- $envName := $env.name -}}
          {{- if $env.enabled }}
          ---
          # ServiceAccount for ECR Access in {{ $envName }} environment
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-{{ $envName }}-ecr-sa
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $envName }}-ecr-sa
              kubecore.eu/app: {{ $resourceName }}
              kubecore.eu/environment: {{ $envName }}
              kubecore.eu/project: {{ $projectName }}
            labels:
              platform.kubecore.io/organization: {{ $org }}
              platform.kubecore.io/project: {{ $projectName }}
              platform.kubecore.io/resource-type: service-account
              platform.kubecore.io/environment: {{ $envName }}
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $kubernetesProviderConfig }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: {{ $org }}-eso-sa
                  namespace: {{ $env.namespace | default (printf "%s-%s" $projectName $envName) }}
                  annotations:
                    # Must use cluster-level ECR role (not org-level awsprovider-ecr-role). See .docs/lessons/kubeapp-e2e-root-causes-and-prevention.md.
                    eks.amazonaws.com/role-arn: {{ printf "arn:aws:iam::%s:role/%s-ecr-credentials-role" $accountId $clusterName }}
                  labels:
                    platform.kubecore.io/organization: {{ $org }}
                    platform.kubecore.io/project: {{ $projectName }}
                    platform.kubecore.io/environment: {{ $envName }}
                    kubecore.eu/app: {{ $resourceName }}
          {{- end }}
          {{- end }}
          {{- end }}

  # Step 6.7: Create Per-Environment ECRAuthorizationToken Generators
  - step: create-ecr-generators
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found - EnvironmentConfig name must match XK8sApp name" -}}
          {{- end -}}

          {{- $project := $envConfig.project -}}
          {{- $k8sapp := $envConfig.k8sapp -}}
          {{- $org := $envConfig.organization.name -}}
          {{- if not $org -}}
            {{- fail "Organization name is required for ECR repository creation. Ensure organization config is properly set in EnvironmentConfig." -}}
          {{- end -}}
          {{- $awsConfig := $envConfig.aws -}}
          {{- $accountId := $awsConfig.accountId -}}
          {{- $kubernetesProviderConfig := $awsConfig.kubernetesProviderConfig -}}
          {{- $regions := $awsConfig.regions -}}
          {{- $kubePools := $envConfig.kubePools -}}

          {{/* App configuration */}}
          {{- $appName := $k8sapp.appName | default ($spec.appName | default $name) -}}
          {{- $projectName := $project.name -}}
          {{- $resourceName := printf "%s-%s" $projectName $appName -}}

          {{/* ECR feature check */}}
          {{- $ecrEnabled := false -}}
          {{- if and $spec.features $spec.features.ecr $spec.features.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- else if and $k8sapp.ecr $k8sapp.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- end -}}

          {{- if $ecrEnabled }}
          {{/* Create ECRAuthorizationToken generators in each enabled environment namespace */}}
          {{- range $env := $k8sapp.environments }}
          {{- $envName := $env.name -}}
          {{- if $env.enabled }}
          {{- range $region := $regions }}
          ---
          # ECRAuthorizationToken Generator for {{ $region }} in {{ $envName }} environment
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-{{ $envName }}-ecr-gen-{{ $region }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $envName }}-ecr-gen-{{ $region }}
              kubecore.eu/app: {{ $resourceName }}
              kubecore.eu/environment: {{ $envName }}
              kubecore.eu/project: {{ $projectName }}
            labels:
              platform.kubecore.io/organization: {{ $org }}
              platform.kubecore.io/project: {{ $projectName }}
              platform.kubecore.io/resource-type: ecr-generator
              platform.kubecore.io/environment: {{ $envName }}
              platform.kubecore.io/region: {{ $region }}
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $kubernetesProviderConfig }}
            forProvider:
              manifest:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: ECRAuthorizationToken
                metadata:
                  name: {{ $org }}-ecr-gen-{{ $region }}
                  namespace: {{ $env.namespace | default (printf "%s-%s" $projectName $envName) }}
                  labels:
                    platform.kubecore.io/organization: {{ $org }}
                    platform.kubecore.io/project: {{ $projectName }}
                    platform.kubecore.io/environment: {{ $envName }}
                    platform.kubecore.io/region: {{ $region }}
                    kubecore.eu/app: {{ $resourceName }}
                spec:
                  region: {{ $region }}
                  auth:
                    jwt:
                      # Do NOT add namespace: ESO uses SA in same namespace as generator. See .docs/lessons/kubeapp-e2e-root-causes-and-prevention.md.
                      serviceAccountRef:
                        name: {{ $org }}-eso-sa
          {{- end }}
          {{- end }}
          {{- end }}
          {{- end }}

  # Step 7: Create ECR Authentication ExternalSecrets in Managed Clusters
  - step: create-ecr-external-secrets-managed
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found - EnvironmentConfig name must match XK8sApp name" -}}
          {{- end -}}

          {{- $project := $envConfig.project -}}
          {{- $k8sapp := $envConfig.k8sapp -}}
          {{- $org := $envConfig.organization.name -}}
          {{- if not $org -}}
            {{- fail "Organization name is required for ECR repository creation. Ensure organization config is properly set in EnvironmentConfig." -}}
          {{- end -}}
          {{- $awsConfig := $envConfig.aws -}}
          {{- $accountId := $awsConfig.accountId -}}
          {{- $kubernetesProviderConfig := $awsConfig.kubernetesProviderConfig -}}
          {{- $regions := $awsConfig.regions -}}
          {{- $kubePools := $envConfig.kubePools -}}

          {{/* App configuration */}}
          {{- $appName := $k8sapp.appName | default ($spec.appName | default $name) -}}
          {{- $projectName := $project.name -}}
          {{- $resourceName := printf "%s-%s" $projectName $appName -}}

          {{/* ECR feature check */}}
          {{- $ecrEnabled := false -}}
          {{- if and $spec.features $spec.features.ecr $spec.features.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- else if and $k8sapp.ecr $k8sapp.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- end -}}

          {{- if $ecrEnabled }}
          {{/* Compute primary region for GitHub Actions credentials */}}
          {{- $primaryRegion := index $regions 0 }}
          {{- $regionKey := $primaryRegion | replace "-" "_" }}

          {{/* Create ExternalSecrets directly in managed cluster environment namespaces */}}
          {{- range $env := $k8sapp.environments }}
          {{- $envName := $env.name -}}
          {{- if $env.enabled }}

          {{/* Find the correct provider config for this environment's kubePool */}}
          {{- $providerConfig := $kubernetesProviderConfig -}}
          {{- if $env.kubePool -}}
            {{- range $pool := $kubePools }}
              {{- if eq $pool.name $env.kubePool -}}
                {{- $providerConfig = $pool.kubernetesProviderConfig -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}
          ---
          # ExternalSecret for ECR Authentication in Managed Cluster - {{ $envName }}
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-{{ $envName }}-ecr-external-secret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $envName }}-ecr-external-secret
              kubecore.eu/app: {{ $resourceName }}
              kubecore.eu/environment: {{ $envName }}
              kubecore.eu/project: {{ $projectName }}
            labels:
              platform.kubecore.io/organization: {{ $org }}
              platform.kubecore.io/project: {{ $projectName }}
              platform.kubecore.io/resource-type: external-secret
              platform.kubecore.io/secret-type: ecr-credentials
              platform.kubecore.io/environment: {{ $envName }}
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $providerConfig }}  # Managed cluster provider config
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: {{ $resourceName }}-ecr-dockerconfig
                  namespace: {{ $env.namespace | default (printf "%s-%s" $projectName $envName) }}
                  labels:
                    platform.kubecore.io/organization: {{ $org }}
                    platform.kubecore.io/project: {{ $projectName }}
                    platform.kubecore.io/resource-type: external-secret
                    platform.kubecore.io/secret-type: ecr-credentials
                    platform.kubecore.io/environment: {{ $envName }}
                    kubecore.eu/app: {{ $resourceName }}
                spec:
                  refreshInterval: "11h"  # Refresh every 11 hours (before 12-hour ECR token expiration)
                  secretStoreRef:
                    name: {{ $org }}-infrastructure-secrets
                    kind: ClusterSecretStore
                  target:
                    name: {{ $resourceName }}-ecr-dockerconfig
                    creationPolicy: Owner
                    deletionPolicy: Delete
                    template:
                      type: Opaque  # Opaque type for PushSecret compatibility
                      engineVersion: v2
                      data:
                        username: {{ printf "\"{{ .username_%s }}\"" $regionKey }}
                        password: {{ printf "\"{{ .password_%s }}\"" $regionKey }}
                        registry_url: {{ printf "\"{{ .proxy_endpoint_%s | replace \\\"https://\\\" \\\"\\\" }}\"" $regionKey }}
                        .dockerconfigjson: {{ printf "\"{{ print \\\"{\\\\\\\"auths\\\\\\\":{\\\\\\\"\\\" (.proxy_endpoint_%s | replace \\\"https://\\\" \\\"\\\") \\\"\\\\\\\":{\\\\\\\"username\\\\\\\":\\\\\\\"\\\" .username_%s \\\"\\\\\\\",\\\\\\\"password\\\\\\\":\\\\\\\"\\\" .password_%s \\\"\\\\\\\",\\\\\\\"auth\\\\\\\":\\\\\\\"\\\" (printf \\\"%%s:%%s\\\" .username_%s .password_%s | b64enc) \\\"\\\\\\\"}}}\\\" }}\"" $regionKey $regionKey $regionKey $regionKey $regionKey }}
                  dataFrom:
                    {{- range $region := $regions }}
                    - sourceRef:
                        generatorRef:
                          apiVersion: generators.external-secrets.io/v1alpha1
                          kind: ECRAuthorizationToken
                          name: {{ $org }}-ecr-gen-{{ $region }}
                      rewrite:
                        - regexp:
                            source: "(.*)"
                            target: "${1}_{{ $region | replace "-" "_" }}"
                    {{- end }}
          {{- end }}
          {{- end }}
          {{- end }}

  # Step 7.0: Parse GitHub credentials in control cluster (fully automated)
  # Creates ClusterSecretStore pointing to control cluster's own Kubernetes API
  # Creates ExternalSecret that parses the JSON provider secret into clean format
  - step: parse-github-credentials-control
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found" -}}
          {{- end -}}

          {{- $org := $envConfig.organization.name -}}

          {{/* ECR feature check */}}
          {{- $ecrEnabled := false -}}
          {{- if and $spec.features $spec.features.ecr $spec.features.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- else if $envConfig.k8sapp.ecr $envConfig.k8sapp.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- end -}}

          {{- if $ecrEnabled }}
          ---
          # ClusterSecretStore for control cluster's own Kubernetes API
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-control-k8s-store
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: control-k8s-store
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: kubesys-enhanced  # Control cluster
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ClusterSecretStore
                metadata:
                  name: control-cluster-kubernetes
                spec:
                  provider:
                    kubernetes:
                      remoteNamespace: crossplane-system
                      server:
                        url: https://kubernetes.default.svc
                        caProvider:
                          type: ConfigMap
                          name: kube-root-ca.crt
                          namespace: external-secrets
                          key: ca.crt
                      auth:
                        serviceAccount:
                          name: external-secrets
                          namespace: external-secrets
          ---
          # ExternalSecret to parse JSON GitHub provider secret in control cluster
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-github-parser
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: github-parser
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: kubesys-enhanced  # Control cluster
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: {{ $name }}-github-app-clean
                  namespace: crossplane-system
                  labels:
                    platform.kubecore.io/organization: {{ $org }}
                    platform.kubecore.io/managed-by: k8sapp-composition
                spec:
                  refreshInterval: 24h
                  secretStoreRef:
                    name: control-cluster-kubernetes
                    kind: ClusterSecretStore
                  target:
                    name: {{ $name }}-github-app-credentials-clean
                    creationPolicy: Owner
                    deletionPolicy: Delete
                    template:
                      engineVersion: v2
                      data:
                        appID: "{{ "{{" }} (index (.credentials | fromJson).app_auth 0).id {{ "}}" }}"
                        installationID: "{{ "{{" }} (index (.credentials | fromJson).app_auth 0).installation_id {{ "}}" }}"
                        privateKey: "{{ "{{" }} (index (.credentials | fromJson).app_auth 0).pem_file {{ "}}" }}"
                  data:
                  - secretKey: credentials
                    remoteRef:
                      key: github-provider-novelcore-github-provider
                      property: credentials
          {{- end }}

  # Step 7.1: Copy clean GitHub credentials from control cluster to child cluster
  # Uses Crossplane Object references to bridge control → child cluster
  - step: copy-github-credentials-to-child
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found" -}}
          {{- end -}}

          {{- $project := $envConfig.project -}}
          {{- $k8sapp := $envConfig.k8sapp -}}
          {{- $org := $envConfig.organization.name -}}
          {{- $kubePools := $envConfig.kubePools -}}
          {{- $awsConfig := $envConfig.aws -}}
          {{- $defaultProviderConfig := $awsConfig.kubernetesProviderConfig -}}

          {{/* App configuration */}}
          {{- $appName := $k8sapp.appName | default ($spec.appName | default $name) -}}
          {{- $projectName := $project.name -}}
          {{- $resourceName := printf "%s-%s" $projectName $appName -}}

          {{/* ECR feature check */}}
          {{- $ecrEnabled := false -}}
          {{- if and $spec.features $spec.features.ecr $spec.features.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- else if and $k8sapp.ecr $k8sapp.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- end -}}

          {{- if $ecrEnabled }}
          {{/* Copy clean GitHub credentials from control cluster to each child cluster environment */}}
          {{- range $env := $k8sapp.environments }}
          {{- $envName := $env.name -}}
          {{- if $env.enabled }}

          {{/* Find the correct provider config for this environment's kubePool */}}
          {{- $providerConfig := $defaultProviderConfig -}}
          {{- if $env.kubePool -}}
            {{- range $pool := $kubePools }}
              {{- if eq $pool.name $env.kubePool -}}
                {{- $providerConfig = $pool.kubernetesProviderConfig -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}
          ---
          # Copy GitHub App credentials from control cluster to child cluster
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-{{ $envName }}-github-creds
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $envName }}-github-creds-copy
              kubecore.eu/app: {{ $resourceName }}
              kubecore.eu/environment: {{ $envName }}
              kubecore.eu/project: {{ $projectName }}
            labels:
              platform.kubecore.io/organization: {{ $org }}
              platform.kubecore.io/project: {{ $projectName }}
              platform.kubecore.io/resource-type: secret
              platform.kubecore.io/secret-type: github-credentials
              platform.kubecore.io/environment: {{ $envName }}
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $providerConfig }}  # Child cluster provider
            references:
            - patchesFrom:
                apiVersion: v1
                kind: Secret
                name: {{ $name }}-github-app-credentials-clean
                namespace: crossplane-system
                fieldPath: data.appID
              toFieldPath: data.appID
            - patchesFrom:
                apiVersion: v1
                kind: Secret
                name: {{ $name }}-github-app-credentials-clean
                namespace: crossplane-system
                fieldPath: data.installationID
              toFieldPath: data.installationID
            - patchesFrom:
                apiVersion: v1
                kind: Secret
                name: {{ $name }}-github-app-credentials-clean
                namespace: crossplane-system
                fieldPath: data.privateKey
              toFieldPath: data.privateKey
            forProvider:
              manifest:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: github-app-credentials
                  namespace: {{ $env.namespace | default (printf "%s-%s" $projectName $envName) }}
                  labels:
                    platform.kubecore.io/organization: {{ $org }}
                    platform.kubecore.io/project: {{ $projectName }}
                    platform.kubecore.io/resource-type: secret
                    platform.kubecore.io/secret-type: github-credentials
                    platform.kubecore.io/environment: {{ $envName }}
                    kubecore.eu/app: {{ $resourceName }}
                type: Opaque
                data:
                  appID: ""  # Patched from reference
                  installationID: ""  # Patched from reference
                  privateKey: ""  # Patched from reference
          {{- end }}
          {{- end }}
          {{- end }}

  # Step 7.7: Create GitHub SecretStore in child cluster environment namespace
  - step: create-github-secret-store-child
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found" -}}
          {{- end -}}

          {{- $project := $envConfig.project -}}
          {{- $k8sapp := $envConfig.k8sapp -}}
          {{- $org := $envConfig.organization.name -}}
          {{- $github := $envConfig.github -}}
          {{- $githubCredsSecret := $github.credentialsSecretRef -}}
          {{- $kubePools := $envConfig.kubePools -}}
          {{- $awsConfig := $envConfig.aws -}}
          {{- $defaultProviderConfig := $awsConfig.kubernetesProviderConfig -}}

          {{/* App configuration */}}
          {{- $appName := $k8sapp.appName | default ($spec.appName | default $name) -}}
          {{- $projectName := $project.name -}}
          {{- $resourceName := printf "%s-%s" $projectName $appName -}}

          {{/* ECR feature check */}}
          {{- $ecrEnabled := false -}}
          {{- if and $spec.features $spec.features.ecr $spec.features.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- else if and $k8sapp.ecr $k8sapp.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- end -}}

          {{- if $ecrEnabled }}
          {{/* Create GitHub SecretStore per environment in child cluster */}}
          {{- range $env := $k8sapp.environments }}
          {{- $envName := $env.name -}}
          {{- if $env.enabled }}
          {{/* Find the provider config for this environment's pool */}}
          {{- $providerConfig := $defaultProviderConfig -}}
          {{- if $env.kubePool -}}
            {{- range $pool := $kubePools }}
              {{- if eq $pool.name $env.kubePool -}}
                {{- $providerConfig = $pool.kubernetesProviderConfig -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}
          ---
          # GitHub SecretStore in child cluster for {{ $envName }}
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-{{ $envName }}-github-secret-store
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $envName }}-github-secret-store
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $providerConfig }}  # Child cluster provider
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: SecretStore
                metadata:
                  name: {{ $resourceName }}-github-actions
                  namespace: {{ $env.namespace | default (printf "%s-%s" $projectName $envName) }}  # Environment namespace
                spec:
                  provider:
                    github:
                      # TODO: These values should come from EnvironmentConfig
                      # For now using static values from novelcore organization
                      appID: 990334
                      installationID: 54584049
                      organization: {{ $org | quote }}
                      repository: {{ $resourceName | quote }}
                      auth:
                        privateKey:
                          name: github-app-credentials
                          namespace: {{ $env.namespace | default (printf "%s-%s" $projectName $envName) }}
                          key: privateKey
          {{- end }}
          {{- end }}
          {{- end }}

  # Step 7.8: Create PushSecret to push ECR credentials to GitHub Actions
  - step: create-github-push-secrets
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found" -}}
          {{- end -}}

          {{- $project := $envConfig.project -}}
          {{- $k8sapp := $envConfig.k8sapp -}}
          {{- $org := $envConfig.organization.name -}}
          {{- $kubePools := $envConfig.kubePools -}}
          {{- $awsConfig := $envConfig.aws -}}
          {{- $defaultProviderConfig := $awsConfig.kubernetesProviderConfig -}}

          {{/* App configuration */}}
          {{- $appName := $k8sapp.appName | default ($spec.appName | default $name) -}}
          {{- $projectName := $project.name -}}
          {{- $resourceName := printf "%s-%s" $projectName $appName -}}

          {{/* ECR feature check */}}
          {{- $ecrEnabled := false -}}
          {{- if and $spec.features $spec.features.ecr $spec.features.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- else if and $k8sapp.ecr $k8sapp.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- end -}}

          {{- if $ecrEnabled }}
          {{/* Find first enabled environment for PushSecret creation */}}
          {{- $firstEnabledEnv := dict -}}
          {{- $firstProviderConfig := $defaultProviderConfig -}}
          {{- range $env := $k8sapp.environments }}
            {{- if and $env.enabled (not $firstEnabledEnv.name) }}
              {{- $firstEnabledEnv = $env -}}
              {{/* Find the provider config for this environment's pool */}}
              {{- if $env.kubePool -}}
                {{- range $pool := $kubePools }}
                  {{- if eq $pool.name $env.kubePool -}}
                    {{- $firstProviderConfig = $pool.kubernetesProviderConfig -}}
                  {{- end -}}
                {{- end -}}
              {{- end -}}
            {{- end }}
          {{- end }}

          {{- if $firstEnabledEnv.name }}
          ---
          # PushSecret for ECR credentials to GitHub Actions (per-app, not per-environment)
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-ecr-push-github
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ecr-push-github
          spec:
            deletionPolicy: Delete
            managementPolicies:
            - '*'
            providerConfigRef:
              name: {{ $firstProviderConfig }}  # First enabled environment's cluster
            watch: true  # Enable watching to auto-recreate if deleted
            readiness:
              policy: SuccessfulCreate
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1alpha1
                kind: PushSecret
                metadata:
                  name: {{ $resourceName }}-ecr-to-github
                  namespace: {{ $firstEnabledEnv.namespace | default (printf "%s-%s" $projectName $firstEnabledEnv.name) }}
                spec:
                  refreshInterval: "11h"  # Sync every 11 hours (before 12-hour ECR token expiration)
                  deletionPolicy: Merge  # Do not delete remote GitHub Actions secrets on PushSecret deletion.
                  # deletionPolicy: Delete is avoided because the SecretStore may already be gone when
                  # the PushSecret is deleted (parallel deletion), leaving the finalizer permanently stuck.
                  # ECR credentials become invalid naturally once the ECR repository is deleted.
                  secretStoreRefs:
                    - name: {{ $resourceName }}-github-actions
                      kind: SecretStore
                  selector:
                    secret:
                      name: {{ $resourceName }}-ecr-dockerconfig  # Source dockerconfig secret
                  data:
                    # App-level GitHub secrets (shared across all environments)
                    # Note: KUBECORE_REGISTRY is created as a variable by XGitHubApp composition
                    - match:
                        secretKey: username
                        remoteRef:
                          remoteKey: KUBECORE_REGISTRY_UNAME
                      conversionStrategy: None
                    - match:
                        secretKey: password
                        remoteRef:
                          remoteKey: KUBECORE_REGISTRY_PWD
                      conversionStrategy: None
          {{- end }}
          {{- end }}

  # Step 8: Aggregate detailed status from managed resources
  - step: aggregate-detailed-status
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found - EnvironmentConfig name must match XK8sApp name" -}}
          {{- end -}}

          {{- $githubProviderConfigName := $envConfig.githubProviderConfigName -}}
          {{- $project := $envConfig.project -}}
          {{- $k8sapp := $envConfig.k8sapp -}}

          {{/* App configuration */}}
          {{- $appName := $k8sapp.appName | default ($spec.appName | default $name) -}}
          {{- $projectName := $project.name -}}
          {{- $targetRepository := $spec.targetRepository | default $project.repository | default $projectName -}}
          {{- $resourceName := printf "%s-%s" $projectName $appName -}}

          {{/* ECR template logic - moved to beginning */}}
          {{- $ecrEnabled := false -}}
          {{- if and $spec.features $spec.features.ecr $spec.features.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- else if and $k8sapp.ecr $k8sapp.ecr.enabled -}}
            {{- $ecrEnabled = true -}}
          {{- end -}}

          {{- $ecrRepositoryName := "" -}}
          {{- $ecrRepositoryUrl := "" -}}
          {{- $ecrRegistryHost := "" -}}
          {{- $ecrRepositoryArn := "" -}}
          {{- $org := $envConfig.organization.name -}}

          {{- if $ecrEnabled -}}
            {{- $customRepoName := "" -}}
            {{- if and $spec.features $spec.features.ecr $spec.features.ecr.repositoryName -}}
              {{- $customRepoName = $spec.features.ecr.repositoryName -}}
            {{- else if and $k8sapp.ecr $k8sapp.ecr.repositoryName -}}
              {{- $customRepoName = $k8sapp.ecr.repositoryName -}}
            {{- end -}}
            {{- $ecrRepositoryName = $customRepoName | default (printf "%s-%s-%s" $org $projectName $appName) -}}
            {{- $awsConfig := $envConfig.aws -}}
            {{- $primaryRegion := $awsConfig.primaryRegion -}}
            {{- $accountId := $awsConfig.accountId -}}
            {{- $ecrRegistryHost = printf "%s.dkr.ecr.%s.amazonaws.com" $accountId $primaryRegion -}}
            {{- $ecrRepositoryUrl = printf "%s/%s" $ecrRegistryHost $ecrRepositoryName -}}
            {{- $ecrRepositoryArn = printf "arn:aws:ecr:%s:%s:repository/%s" $primaryRegion $accountId $ecrRepositoryName -}}
          {{- end -}}

          {{/* Count resources and check readiness */}}
          {{- $totalResources := 0 -}}
          {{- $healthyResources := 0 -}}
          {{- $baseResourcesGenerated := false -}}
          {{- $baseKustomizationGenerated := false -}}
          {{- $environmentStatuses := dict -}}
          {{- $ecrRepositoryCreated := false -}}
          {{- $ecrLifecyclePolicyCreated := false -}}
          {{- $ecrSecretsStatus := dict -}}

          {{- range $key, $resource := .observed.resources -}}
            {{- if $resource.resource -}}
              {{- $totalResources = add $totalResources 1 -}}
              {{- range $resource.resource.status.conditions -}}
                {{- if and (eq .type "Ready") (eq .status "True") -}}
                  {{- $healthyResources = add $healthyResources 1 -}}
                {{- end -}}
              {{- end -}}

              {{- $compName := index $resource.resource.metadata.annotations "gotemplating.fn.crossplane.io/composition-resource-name" | default "" -}}
              {{- if and $compName (eq $compName "base-resources") -}}
                {{- range $resource.resource.status.conditions -}}
                  {{- if and (eq .type "Ready") (eq .status "True") -}}
                    {{- $baseResourcesGenerated = true -}}
                  {{- end -}}
                {{- end -}}
              {{- else if and $compName (eq $compName "base-kustomization") -}}
                {{- range $resource.resource.status.conditions -}}
                  {{- if and (eq .type "Ready") (eq .status "True") -}}
                    {{- $baseKustomizationGenerated = true -}}
                  {{- end -}}
                {{- end -}}
              {{- else if and $compName (hasSuffix "-overlay" $compName) -}}
                {{- $envName := index $resource.resource.metadata.annotations "kubecore.eu/environment" -}}
                {{- if $envName -}}
                  {{- $envStatus := index $environmentStatuses $envName | default (dict "manifestsGenerated" false "kustomizationGenerated" false) -}}
                  {{- range $resource.resource.status.conditions -}}
                    {{- if and (eq .type "Ready") (eq .status "True") -}}
                      {{- $envStatus = set $envStatus "manifestsGenerated" true -}}
                    {{- end -}}
                  {{- end -}}
                  {{- $environmentStatuses = set $environmentStatuses $envName $envStatus -}}
                {{- end -}}
              {{- else if and $compName (hasSuffix "-kustomization" $compName) -}}
                {{- $envName := index $resource.resource.metadata.annotations "kubecore.eu/environment" -}}
                {{- if $envName -}}
                  {{- $envStatus := index $environmentStatuses $envName | default (dict "manifestsGenerated" false "kustomizationGenerated" false) -}}
                  {{- range $resource.resource.status.conditions -}}
                    {{- if and (eq .type "Ready") (eq .status "True") -}}
                      {{- $envStatus = set $envStatus "kustomizationGenerated" true -}}
                    {{- end -}}
                  {{- end -}}
                  {{- $environmentStatuses = set $environmentStatuses $envName $envStatus -}}
                {{- end -}}
              {{- else if and $compName (eq $compName "ecr-repository") -}}
                {{- range $resource.resource.status.conditions -}}
                  {{- if and (eq .type "Ready") (eq .status "True") -}}
                    {{- $ecrRepositoryCreated = true -}}
                  {{- end -}}
                {{- end -}}
              {{- else if and $compName (eq $compName "ecr-lifecycle") -}}
                {{- range $resource.resource.status.conditions -}}
                  {{- if and (eq .type "Ready") (eq .status "True") -}}
                    {{- $ecrLifecyclePolicyCreated = true -}}
                  {{- end -}}
                {{- end -}}
              {{- else if and $compName (hasSuffix "-ecr-sa" $compName) -}}
                {{- $envName := index $resource.resource.metadata.annotations "kubecore.eu/environment" -}}
                {{- if $envName -}}
                  {{- $secretStatus := index $ecrSecretsStatus $envName | default (dict "serviceAccountReady" false "generatorsReady" false "externalSecretReady" false "secretReady" false) -}}
                  {{- range $resource.resource.status.conditions -}}
                    {{- if and (eq .type "Ready") (eq .status "True") -}}
                      {{- $secretStatus = set $secretStatus "serviceAccountReady" true -}}
                    {{- end -}}
                  {{- end -}}
                  {{- $ecrSecretsStatus = set $ecrSecretsStatus $envName $secretStatus -}}
                {{- end -}}
              {{- else if and $compName (contains "-ecr-gen-" $compName) -}}
                {{- $envName := index $resource.resource.metadata.annotations "kubecore.eu/environment" -}}
                {{- if $envName -}}
                  {{- $secretStatus := index $ecrSecretsStatus $envName | default (dict "serviceAccountReady" false "generatorsReady" false "externalSecretReady" false "secretReady" false) -}}
                  {{- range $resource.resource.status.conditions -}}
                    {{- if and (eq .type "Ready") (eq .status "True") -}}
                      {{- $secretStatus = set $secretStatus "generatorsReady" true -}}
                    {{- end -}}
                  {{- end -}}
                  {{- $ecrSecretsStatus = set $ecrSecretsStatus $envName $secretStatus -}}
                {{- end -}}
              {{- else if and $compName (hasSuffix "-ecr-external-secret" $compName) -}}
                {{- $envName := index $resource.resource.metadata.annotations "kubecore.eu/environment" -}}
                {{- if $envName -}}
                  {{- $secretStatus := index $ecrSecretsStatus $envName | default (dict "serviceAccountReady" false "generatorsReady" false "externalSecretReady" false "secretReady" false) -}}
                  {{- range $resource.resource.status.conditions -}}
                    {{- if and (eq .type "Ready") (eq .status "True") -}}
                      {{- $secretStatus = set $secretStatus "externalSecretReady" true -}}
                      {{- $secretStatus = set $secretStatus "secretReady" true -}}
                      {{- $secretStatus = set $secretStatus "secretName" (printf "%s-ecr-dockerconfig" $resourceName) -}}
                    {{- end -}}
                  {{- end -}}
                  {{- $ecrSecretsStatus = set $ecrSecretsStatus $envName $secretStatus -}}
                {{- end -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}

          {{/* Enhance environment statuses with config data */}}
          {{- range $env := $k8sapp.environments -}}
            {{- $envName := $env.name -}}
            {{- if $env.enabled -}}
              {{- $envStatus := index $environmentStatuses $envName | default (dict "manifestsGenerated" false "kustomizationGenerated" false) -}}
              {{- $envStatus = set $envStatus "enabled" true -}}
              {{- $envStatus = set $envStatus "namespace" ($env.namespace | default $envName) -}}
              {{- $envStatus = set $envStatus "replicas" ($env.replicas | default 1) -}}
              {{- if $env.scheduling -}}
                {{- $envStatus = set $envStatus "scheduling" $env.scheduling -}}
              {{- end -}}
              {{- $environmentStatuses = set $environmentStatuses $envName $envStatus -}}
            {{- end -}}
          {{- end -}}

          apiVersion: k8s.platform.kubecore.io/v1alpha1
          kind: XK8sApp
          metadata:
            name: {{ $name }}
          status:
            # Provider Configuration
            providerConfigName: {{ $githubProviderConfigName | quote }}
            gitHubProviderConfig: {{ $githubProviderConfigName | quote }}

            # Application configuration
            application:
              name: {{ $appName | quote }}
              type: {{ $k8sapp.appType | default "rest" | quote }}
              port: {{ $k8sapp.appPort | default 8000 }}
              image: {{ $ecrRepositoryUrl | default "nginx:latest" | quote }}

            # Repository status
            repository:
              name: {{ $resourceName | quote }}
              fullName: {{ printf "%s/%s" $org $resourceName | quote }}
              url: {{ printf "https://github.com/%s/%s" $org $resourceName | quote }}

            # GitOps status
            gitops:
              baseResourcesGenerated: {{ $baseResourcesGenerated }}
              baseKustomizationGenerated: {{ $baseKustomizationGenerated }}
              environments: {{ $environmentStatuses | toJson }}

            # ECR status
            ecr:
              enabled: {{ $ecrEnabled }}
              {{- if $ecrEnabled }}
              repositoryName: {{ $ecrRepositoryName | quote }}
              repositoryUrl: {{ $ecrRepositoryUrl | quote }}
              registryHost: {{ $ecrRegistryHost | quote }}
              repositoryArn: {{ $ecrRepositoryArn | quote }}
              secretCreated: {{ and $ecrRepositoryCreated $ecrLifecyclePolicyCreated }}
              environments: {{ $ecrSecretsStatus | toJson }}
              {{- end }}

            # Overall status
            ready: {{ eq $totalResources $healthyResources }}
            childResources:
              total: {{ $totalResources }}
              healthy: {{ $healthyResources }}

  # Step 9: Auto-ready function to check resource readiness
  - step: detect-readiness
    functionRef:
      name: function-auto-ready

  # Step 10: Sequencer function to ensure proper resource creation ordering
  - step: sequence-resources
    functionRef:
      name: function-sequencer
    input:
      apiVersion: sequencer.fn.crossplane.io/v1beta1
      kind: Input
      config:
        respectDeletionOrder: true
        finalizerStrategy:
          mode: Lenient
          cleanupRules: []
      rules:
      # Simplified sequencer - allow all GitOps resources to create in parallel

      # ECR resources: Only enforce essential ordering
      # Repository must exist before lifecycle policy can be attached
      - sequence:
        - ecr-repository
        - ecr-lifecycle

      # GitHub credentials: Parse JSON in control cluster
      - sequence:
        - control-k8s-store
        - github-parser

      # ECR → GitHub Actions credential sync: PushSecret must be deleted BEFORE the SecretStore.
      # With respectDeletionOrder: true the sequence is reversed on deletion, so listing
      # the SecretStore first ensures: creation = SecretStore→PushSecret, deletion = PushSecret→SecretStore.
      # This prevents the PushSecret finalizer from getting stuck when the SecretStore is already gone.
      - sequence:
        - thc-github-secret-store
        - ecr-push-github

      # All other resources can be created in parallel - no hard dependencies