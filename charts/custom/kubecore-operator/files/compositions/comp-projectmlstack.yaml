apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: projectmlstack
  labels:
    platform.kubecore.io/type: projectmlstack
    provider: kubernetes
    service: project-ml
    layer: platform
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: platform.kubecore.io/v1alpha1
    kind: XProjectMLStack
  mode: Pipeline
  pipeline:

  - step: load-environment-configs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Selector
          selector:
            matchLabels:
            - key: platform.kubecore.io/type
              type: Value
              value: project-ml-config
            - key: platform.kubecore.io/mlstack-claim-name
              type: FromCompositeFieldPath
              valueFromFieldPath: metadata.name

  - step: generate-ml-resources
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $name := .observed.composite.resource.metadata.name -}}
          {{- $spec := .observed.composite.resource.spec -}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found for project ML stack" -}}
          {{- end -}}
          {{- $projectName := $spec.projectName -}}
          {{- $clusterName := $spec.clusterRef.name -}}
          {{- $region := $spec.region | default $envConfig.region | default "us-east-1" -}}
          {{- $mlflowEnabled := index $spec.features "mlflow" | default false -}}
          {{- $lakeFSEnabled := index $spec.features "lakefs" | default false -}}
          {{- $s3Enabled := index $spec.features "s3" | default false -}}
          {{- $postgresEnabled := index $spec.features "postgres" | default false -}}
          {{- $providerConfigs := $envConfig.providerConfigs | default dict -}}
          {{- $k8sProvider := $providerConfigs.kubernetes | default (printf "%s-eks-kubernetes" $clusterName) -}}
          {{- $helmProvider := $providerConfigs.helm | default (printf "%s-eks-helm" $clusterName) -}}
          {{- $awsProvider := $providerConfigs.aws | default "aws-default" -}}
          {{- $nsName := printf "ml-%s" $projectName -}}
          {{- $pgClusterName := printf "%s-pg" $projectName -}}
          {{- $pgSecretName := printf "%s-pg-mlflow" $projectName -}}
          {{- $bucketName := printf "%s-ml-artifacts-%s" $projectName $region -}}
          {{- $pgBackupPath := printf "s3://%s/cnpg-backups" $bucketName -}}
          {{- $pgSAName := printf "%s-pg" $projectName -}}
          {{- $pgBackupRoleName := printf "ml-%s-cnpg-backup-role" $projectName -}}
          {{- $mlflowPassword := $envConfig.mlflowPassword | default "mlflow-change-me" -}}
          {{- $lakeFSPassword := $envConfig.lakeFSPassword | default "lakefs-change-me" -}}
          {{- $lakeFSAuthSecretKey := $envConfig.lakeFSAuthSecretKey | default "lakefs-auth-key-change-me" -}}
          {{/* Derive a deterministic lakeFS admin access key ID from the project name (20 alphanumeric chars) */}}
          {{- $lakeFSAccessKeyId := printf "AKIAML%s" ($projectName | upper | replace "-" "" | replace "_" "") | trunc 20 -}}
          {{- $accountId := "" -}}{{- if $envConfig.aws }}{{ $accountId = $envConfig.aws.accountId | default "" }}{{ end -}}
          {{- $oidcId := "" -}}{{- if $envConfig.eks }}{{ $oidcId = $envConfig.eks.clusterId | default "" }}{{ end -}}
          {{- $oidcIssuerHost := "" -}}{{- if and $accountId $oidcId }}{{ $oidcIssuerHost = printf "oidc.eks.%s.amazonaws.com/id/%s" $region $oidcId }}{{ end -}}
          {{- $oidcProviderArn := "" -}}{{- if and $accountId $oidcId }}{{ $oidcProviderArn = printf "arn:aws:iam::%s:oidc-provider/%s" $accountId $oidcIssuerHost }}{{ end -}}
          {{- $hasOIDC := and $oidcIssuerHost $oidcProviderArn -}}
          {{/* MLflow OIDC SSO via Zitadel */}}
          {{- $mlflowOIDC := $envConfig.mlflowOIDC | default dict -}}
          {{- $mlflowOIDCEnabled := $mlflowOIDC.enabled | default false -}}
          {{- $baseDns := $envConfig.baseDns | default "" -}}
          {{- $orgName := $envConfig.organizationName | default "" -}}
          {{/* LakeFS OIDC SSO via Zitadel + oauth2-proxy */}}
          {{- $lakeFSOIDC := $envConfig.lakeFSOIDC | default dict -}}
          {{- $lakeFSOIDCEnabled := and $lakeFSEnabled ($lakeFSOIDC.enabled | default false) -}}
          {{- $lakeFSOIDCIssuerUrl := "" -}}
          {{- if $lakeFSOIDCEnabled -}}
            {{- $lakeFSOIDCIssuerUrl = $lakeFSOIDC.discoveryUrl | default "" | replace "/.well-known/openid-configuration" "" -}}
          {{- end -}}
          {{- $lakeFSAPISecretName := $lakeFSOIDC.apiSecretName | default "" -}}
          {{/* ML infrastructure scheduling: dedicated Karpenter on-demand nodepool */}}
          {{- $runtime := $envConfig.runtime | default dict -}}
          {{- $defaultNodeSelector := dict "platform.kubecore.io/ml-infra" "true" -}}
          {{- $defaultTolerations := list (dict "key" "platform.kubecore.io/ml-infra" "operator" "Equal" "value" "true" "effect" "NoSchedule") (dict "key" "CriticalAddonsOnly" "operator" "Exists") (dict "operator" "Exists" "effect" "NoExecute" "tolerationSeconds" 300) -}}
          {{- $nodeSelector := $runtime.nodeSelector | default $defaultNodeSelector -}}
          {{- $tolerations := $runtime.tolerations | default $defaultTolerations -}}
          {{- $affinity := $runtime.affinity | default dict -}}
          {{/* Postgres resource sizing, with sensible defaults if not provided */}}
          {{- $pgResources := $spec.postgresResources | default dict -}}
          {{- $pgCPU := $pgResources.cpu | default "500m" -}}
          {{- $pgMemory := $pgResources.memory | default "1Gi" -}}
          {{- $pgStorage := $pgResources.storageSize | default "20Gi" -}}
          {{- $commonLabels := dict
            "platform.kubecore.io/project" $projectName
            "platform.kubecore.io/cluster" (printf "%s-eks" $clusterName)
            "platform.kubecore.io/managed-by" "crossplane"
            "crossplane.io/composite" $name
          -}}

          {{/* Namespace for this project ML stack */}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-ns
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ml-ns
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $nsName }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}

          {{/* Postgres: secrets + cluster + managed databases when postgres enabled */}}
          {{- if $postgresEnabled }}
          {{- $pgLakeFSSecretName := printf "%s-pg-lakefs" $projectName -}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-pg-secret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: pg-secret
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: {{ $pgSecretName }}
                  namespace: {{ $nsName }}
                type: kubernetes.io/basic-auth
                stringData:
                  username: mlflow
                  password: {{ $mlflowPassword | quote }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-pg-lakefs-secret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: pg-lakefs-secret
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: {{ $pgLakeFSSecretName }}
                  namespace: {{ $nsName }}
                  labels:
                    cnpg.io/reload: "true"
                type: kubernetes.io/basic-auth
                stringData:
                  username: lakefs
                  password: {{ $lakeFSPassword | quote }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cnpg-cluster
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cnpg-cluster
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: postgresql.cnpg.io/v1
                kind: Cluster
                metadata:
                  name: {{ $pgClusterName }}
                  namespace: {{ $nsName }}
                  annotations:
                    cnpg.io/skipEmptyWalArchiveCheck: enabled
                spec:
                  instances: 1
                  storage:
                    storageClass: gp3
                    size: {{ $pgStorage | quote }}
                  bootstrap:
                    initdb:
                      database: mlflow
                      owner: mlflow
                      secret:
                        name: {{ $pgSecretName }}
                  managed:
                    roles:
                      - name: lakefs
                        ensure: present
                        login: true
                        passwordSecret:
                          name: {{ $pgLakeFSSecretName }}
                  {{- if and $hasOIDC $s3Enabled }}
                  serviceAccountTemplate:
                    metadata:
                      annotations:
                        eks.amazonaws.com/role-arn: "arn:aws:iam::{{ $accountId }}:role/{{ $pgBackupRoleName }}"
                  plugins:
                  - name: barman-cloud.cloudnative-pg.io
                    isWALArchiver: true
                    parameters:
                      barmanObjectName: {{ $projectName }}-cnpg-backup-store
                  {{- end }}
                  resources:
                    requests:
                      memory: {{ $pgMemory | quote }}
                      cpu: {{ $pgCPU | quote }}
                    limits:
                      memory: {{ $pgMemory | quote }}
                      cpu: {{ $pgCPU | quote }}
                  affinity:
                    {{- if $nodeSelector }}
                    nodeSelector:
                      {{- range $key, $value := $nodeSelector }}
                      {{ $key }}: {{ $value | quote }}
                      {{- end }}
                    {{- end }}
                    {{- if $tolerations }}
                    tolerations:
                      {{- range $toleration := $tolerations }}
                      - key: {{ $toleration.key | quote }}
                        operator: {{ $toleration.operator | default "Equal" | quote }}
                        {{- if $toleration.value }}
                        value: {{ $toleration.value | quote }}
                        {{- end }}
                        {{- if $toleration.effect }}
                        effect: {{ $toleration.effect | quote }}
                        {{- end }}
                        {{- if $toleration.tolerationSeconds }}
                        tolerationSeconds: {{ $toleration.tolerationSeconds }}
                        {{- end }}
                      {{- end }}
                    {{- end }}
                    enablePodAntiAffinity: false

          {{/* IRSA: IAM Role for CNPG barman backup S3 access */}}
          {{- if and $hasOIDC $s3Enabled $postgresEnabled }}
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Role
          metadata:
            name: {{ $pgBackupRoleName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cnpg-backup-irsa-role
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              description: "CNPG backup IRSA role for project {{ $projectName }}"
              assumeRolePolicy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "Federated": "{{ $oidcProviderArn }}"
                      },
                      "Action": "sts:AssumeRoleWithWebIdentity",
                      "Condition": {
                        "StringLike": {
                          "{{ $oidcIssuerHost }}:aud": "sts.amazonaws.com",
                          "{{ $oidcIssuerHost }}:sub": "system:serviceaccount:{{ $nsName }}:{{ $pgSAName }}"
                        }
                      }
                    }
                  ]
                }
              inlinePolicy:
                - name: cnpg-s3-backup
                  policy: |
                    {
                      "Version": "2012-10-17",
                      "Statement": [
                        {
                          "Effect": "Allow",
                          "Action": [
                            "s3:GetObject",
                            "s3:PutObject",
                            "s3:DeleteObject",
                            "s3:ListBucket",
                            "s3:GetBucketLocation",
                            "s3:ListBucketMultipartUploads",
                            "s3:AbortMultipartUpload",
                            "s3:ListMultipartUploadParts"
                          ],
                          "Resource": [
                            "arn:aws:s3:::{{ $bucketName }}",
                            "arn:aws:s3:::{{ $bucketName }}/cnpg-backups/*"
                          ]
                        }
                      ]
                    }
          {{- end }}

          {{/* ObjectStore for CNPG barman backup to S3 */}}
          {{- if and $s3Enabled $postgresEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cnpg-backup-store
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cnpg-backup-store
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: barmancloud.cnpg.io/v1
                kind: ObjectStore
                metadata:
                  name: {{ $projectName }}-cnpg-backup-store
                  namespace: {{ $nsName }}
                spec:
                  configuration:
                    destinationPath: {{ $pgBackupPath | quote }}
                    s3Credentials:
                      inheritFromIAMRole: true
                    wal:
                      compression: gzip
          {{- end }}

          {{/* ScheduledBackup: daily backup of the CNPG cluster */}}
          {{- if and $s3Enabled $postgresEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cnpg-scheduled-backup
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cnpg-scheduled-backup
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: postgresql.cnpg.io/v1
                kind: ScheduledBackup
                metadata:
                  name: {{ $pgClusterName }}-daily-backup
                  namespace: {{ $nsName }}
                spec:
                  schedule: "0 0 2 * * *"
                  backupOwnerReference: cluster
                  cluster:
                    name: {{ $pgClusterName }}
                  method: plugin
                  pluginConfiguration:
                    name: barman-cloud.cloudnative-pg.io
          {{- end }}

          {{/* CNPG Database CRD: declaratively ensures the lakefs database exists. */}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cnpg-db-lakefs
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cnpg-db-lakefs
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: postgresql.cnpg.io/v1
                kind: Database
                metadata:
                  name: {{ $pgClusterName }}-db-lakefs
                  namespace: {{ $nsName }}
                spec:
                  name: lakefs
                  owner: lakefs
                  cluster:
                    name: {{ $pgClusterName }}
          {{- end }}

          {{/* S3 bucket when s3 enabled */}}
          {{- if $s3Enabled }}
          ---
          apiVersion: s3.aws.upbound.io/v1beta1
          kind: Bucket
          metadata:
            name: {{ $bucketName | quote }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ml-bucket
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              region: {{ $region | quote }}
              tags:
                platform.kubecore.io/project: {{ $projectName }}
          {{- end }}

          {{/* MLflow Helm release when mlflow enabled (requires Postgres; optional S3) */}}
          {{- if $mlflowEnabled }}
          {{- $pgHost := printf "%s-rw.%s.svc" $pgClusterName $nsName -}}
          {{- $mlflowSAName := printf "ml-%s-mlflow" $projectName -}}
          {{- $mlflowRoleName := printf "ml-%s-mlflow-s3-role" $projectName -}}

          {{/* IRSA: IAM Role for MLflow S3 artifact access */}}
          {{- if and $hasOIDC $s3Enabled }}
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Role
          metadata:
            name: {{ $mlflowRoleName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: mlflow-irsa-role
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              description: "MLflow IRSA role for project ML stack {{ $projectName }}"
              assumeRolePolicy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "Federated": "{{ $oidcProviderArn }}"
                      },
                      "Action": "sts:AssumeRoleWithWebIdentity",
                      "Condition": {
                        "StringEquals": {
                          "{{ $oidcIssuerHost }}:aud": "sts.amazonaws.com",
                          "{{ $oidcIssuerHost }}:sub": "system:serviceaccount:{{ $nsName }}:{{ $mlflowSAName }}"
                        }
                      }
                    }
                  ]
                }
              inlinePolicy:
                - name: mlflow-s3-access
                  policy: |
                    {
                      "Version": "2012-10-17",
                      "Statement": [
                        {
                          "Effect": "Allow",
                          "Action": [
                            "s3:GetObject",
                            "s3:PutObject",
                            "s3:DeleteObject",
                            "s3:ListBucket",
                            "s3:GetBucketLocation",
                            "s3:ListBucketMultipartUploads",
                            "s3:AbortMultipartUpload",
                            "s3:ListMultipartUploadParts"
                          ],
                          "Resource": [
                            "arn:aws:s3:::{{ $bucketName }}",
                            "arn:aws:s3:::{{ $bucketName }}/*"
                          ]
                        }
                      ]
                    }

          {{/* IRSA: ServiceAccount for MLflow with role annotation */}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-mlflow-sa
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: mlflow-sa
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: {{ $mlflowSAName }}
                  namespace: {{ $nsName }}
                  annotations:
                    eks.amazonaws.com/role-arn: "arn:aws:iam::{{ $accountId }}:role/{{ $mlflowRoleName }}"
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
          {{- end }}

          {{/* ExternalSecret for MLflow OIDC credentials from AWS Secrets Manager */}}
          {{- if $mlflowOIDCEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-mlflow-oidc-secret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: mlflow-oidc-secret
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: mlflow-oidc-credentials
                  namespace: {{ $nsName }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  refreshInterval: "1h"
                  secretStoreRef:
                    name: {{ $orgName }}-infrastructure-secrets
                    kind: ClusterSecretStore
                  target:
                    name: mlflow-oidc-credentials
                  data:
                  - secretKey: OIDC_CLIENT_ID
                    remoteRef:
                      key: {{ $mlflowOIDC.secretName | quote }}
                      property: OIDC_CLIENT_ID
                  - secretKey: OIDC_CLIENT_SECRET
                    remoteRef:
                      key: {{ $mlflowOIDC.secretName | quote }}
                      property: OIDC_CLIENT_SECRET
                  - secretKey: SECRET_KEY
                    remoteRef:
                      key: {{ $mlflowOIDC.secretName | quote }}
                      property: SECRET_KEY
          {{- end }}

          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $name }}-mlflow
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: mlflow
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              wait: true
              waitTimeout: "20m"
              chart:
                name: mlflow
                repository: https://community-charts.github.io/helm-charts
                version: "0.12.0"
              namespace: {{ $nsName }}
              values:
                {{- if and $hasOIDC $s3Enabled }}
                serviceAccount:
                  create: false
                  name: {{ $mlflowSAName }}
                {{- end }}
                nodeSelector:
                  {{- range $key, $value := $nodeSelector }}
                  {{ $key }}: {{ $value | quote }}
                  {{- end }}
                tolerations:
                  {{- range $toleration := $tolerations }}
                  - key: {{ $toleration.key | quote }}
                    operator: {{ $toleration.operator | default "Equal" | quote }}
                    {{- if $toleration.value }}
                    value: {{ $toleration.value | quote }}
                    {{- end }}
                    {{- if $toleration.effect }}
                    effect: {{ $toleration.effect | quote }}
                    {{- end }}
                    {{- if $toleration.tolerationSeconds }}
                    tolerationSeconds: {{ $toleration.tolerationSeconds }}
                    {{- end }}
                  {{- end }}
                {{- if $affinity }}
                affinity: {{ $affinity | toJson }}
                {{- end }}
                {{- if $mlflowOIDCEnabled }}
                auth:
                  appName: "oidc-auth"
                extraSecretNamesForEnvFrom:
                  - mlflow-oidc-credentials
                extraEnvVars:
                  OIDC_REDIRECT_URI: "https://mlflow-{{ $projectName }}.{{ $baseDns }}/callback"
                  OIDC_SCOPE: "openid profile email"
                  OIDC_DISCOVERY_URL: {{ $mlflowOIDC.discoveryUrl | quote }}
                ingress:
                  enabled: true
                  className: traefik-system
                  annotations:
                    cert-manager.io/cluster-issuer: {{ $clusterName }}-system-issuer
                  hosts:
                    - host: "mlflow-{{ $projectName }}.{{ $baseDns }}"
                      paths:
                        - path: /
                          pathType: Prefix
                  tls:
                    - secretName: "mlflow-{{ $projectName }}-tls"
                      hosts:
                        - "mlflow-{{ $projectName }}.{{ $baseDns }}"
                {{- else }}
                auth:
                  enabled: true
                  adminUsername: "admin"
                  adminPassword: {{ $mlflowPassword | quote }}
                {{- end }}
                backendStore:
                  databaseMigration: true
                  postgres:
                    enabled: true
                    host: {{ $pgHost | quote }}
                    port: 5432
                    database: mlflow
                    user: mlflow
                    password: {{ $mlflowPassword | quote }}
                artifactRoot:
                  proxiedArtifactStorage: false
                  {{- if $s3Enabled }}
                  s3:
                    enabled: true
                    bucket: {{ $bucketName | quote }}
                    path: "mlflow-artifacts"
                  {{- else }}
                  s3:
                    enabled: false
                  {{- end }}
          {{- end }}

          {{/* LakeFS Helm release when lakefs enabled (requires Postgres + S3) */}}
          {{- if $lakeFSEnabled }}
          {{- $pgHost := printf "%s-rw.%s.svc" $pgClusterName $nsName -}}
          {{- $lakeFSPgConnString := printf "postgres://lakefs:%s@%s:5432/lakefs?sslmode=disable" $lakeFSPassword $pgHost -}}
          {{- $lakeFSSAName := printf "ml-%s-lakefs" $projectName -}}
          {{- $lakeFSRoleName := printf "ml-%s-lakefs-s3-role" $projectName -}}

          {{/* IRSA: IAM Role for LakeFS S3 access */}}
          {{- if $hasOIDC }}
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Role
          metadata:
            name: {{ $lakeFSRoleName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: lakefs-irsa-role
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              description: "LakeFS IRSA role for project ML stack {{ $projectName }}"
              assumeRolePolicy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "Federated": "{{ $oidcProviderArn }}"
                      },
                      "Action": "sts:AssumeRoleWithWebIdentity",
                      "Condition": {
                        "StringEquals": {
                          "{{ $oidcIssuerHost }}:aud": "sts.amazonaws.com",
                          "{{ $oidcIssuerHost }}:sub": "system:serviceaccount:{{ $nsName }}:{{ $lakeFSSAName }}"
                        }
                      }
                    }
                  ]
                }
              inlinePolicy:
                - name: lakefs-s3-access
                  policy: |
                    {
                      "Version": "2012-10-17",
                      "Statement": [
                        {
                          "Effect": "Allow",
                          "Action": [
                            "s3:GetObject",
                            "s3:PutObject",
                            "s3:DeleteObject",
                            "s3:ListBucket",
                            "s3:GetBucketLocation",
                            "s3:ListBucketMultipartUploads",
                            "s3:AbortMultipartUpload",
                            "s3:ListMultipartUploadParts"
                          ],
                          "Resource": [
                            "arn:aws:s3:::{{ $bucketName }}",
                            "arn:aws:s3:::{{ $bucketName }}/*"
                          ]
                        }
                      ]
                    }
          {{- end }}

          {{/* IRSA: ServiceAccount for LakeFS with role annotation */}}
          {{- if $hasOIDC }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-lakefs-sa
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: lakefs-sa
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: {{ $lakeFSSAName }}
                  namespace: {{ $nsName }}
                  annotations:
                    eks.amazonaws.com/role-arn: "arn:aws:iam::{{ $accountId }}:role/{{ $lakeFSRoleName }}"
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
          {{- end }}

          {{/* LakeFS Helm release */}}
          ---
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ $name }}-lakefs
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: lakefs
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $helmProvider }}
            forProvider:
              wait: true
              waitTimeout: "20m"
              chart:
                name: lakefs
                repository: https://charts.lakefs.io
                version: "1.8.0"
              namespace: {{ $nsName }}
              values:
                replicaCount: 1
                secrets:
                  databaseConnectionString: {{ $lakeFSPgConnString | quote }}
                  authEncryptSecretKey: {{ $lakeFSAuthSecretKey | quote }}
                lakefsConfig: |
                  database:
                    type: postgres
                  blockstore:
                    type: s3
                    s3:
                      region: {{ $region }}
                  installation:
                    user_name: admin
                    access_key_id: {{ $lakeFSAccessKeyId }}
                    secret_access_key: {{ $lakeFSPassword }}
                {{- if $hasOIDC }}
                serviceAccount:
                  name: {{ $lakeFSSAName }}
                {{- end }}
                nodeSelector:
                  {{- range $key, $value := $nodeSelector }}
                  {{ $key }}: {{ $value | quote }}
                  {{- end }}
                tolerations:
                  {{- range $toleration := $tolerations }}
                  - key: {{ $toleration.key | quote }}
                    operator: {{ $toleration.operator | default "Equal" | quote }}
                    {{- if $toleration.value }}
                    value: {{ $toleration.value | quote }}
                    {{- end }}
                    {{- if $toleration.effect }}
                    effect: {{ $toleration.effect | quote }}
                    {{- end }}
                    {{- if $toleration.tolerationSeconds }}
                    tolerationSeconds: {{ $toleration.tolerationSeconds }}
                    {{- end }}
                  {{- end }}
                {{- if $affinity }}
                affinity: {{ $affinity | toJson }}
                {{- end }}
                resources:
                  requests:
                    cpu: "200m"
                    memory: "512Mi"
                  limits:
                    cpu: "1000m"
                    memory: "1Gi"
          {{- end }}

          {{/* LakeFS admin credentials Secret for pipeline consumption */}}
          {{- if $lakeFSEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $projectName }}-lakefs-admin-secret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: lakefs-admin-secret
            labels:
              platform.kubecore.io/mlstack: {{ $projectName }}
              platform.kubecore.io/component: lakefs-credentials
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: {{ $projectName }}-lakefs-admin
                  namespace: {{ $nsName }}
                  labels:
                    platform.kubecore.io/mlstack: {{ $projectName }}
                    platform.kubecore.io/component: lakefs-credentials
                type: Opaque
                stringData:
                  accessKeyId: {{ $lakeFSAccessKeyId }}
                  secretAccessKey: {{ $lakeFSPassword | quote }}
          {{- end }}

          {{/* LakeFS OIDC: ExternalSecret for oauth2-proxy credentials from AWS Secrets Manager */}}
          {{- if $lakeFSOIDCEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-lakefs-oidc-secret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: lakefs-oidc-secret
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: lakefs-oidc-credentials
                  namespace: {{ $nsName }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  refreshInterval: "1h"
                  secretStoreRef:
                    name: {{ $orgName }}-infrastructure-secrets
                    kind: ClusterSecretStore
                  target:
                    name: lakefs-oidc-credentials
                  data:
                  - secretKey: OIDC_CLIENT_ID
                    remoteRef:
                      key: {{ $lakeFSOIDC.secretName | quote }}
                      property: OIDC_CLIENT_ID
                  - secretKey: OIDC_CLIENT_SECRET
                    remoteRef:
                      key: {{ $lakeFSOIDC.secretName | quote }}
                      property: OIDC_CLIENT_SECRET
                  - secretKey: COOKIE_SECRET
                    remoteRef:
                      key: {{ $lakeFSOIDC.secretName | quote }}
                      property: COOKIE_SECRET
          {{- end }}

          {{/* LakeFS API: ExternalSecret for machine user credentials (programmatic API access) */}}
          {{- if and $lakeFSOIDCEnabled $lakeFSAPISecretName }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-lakefs-api-secret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: lakefs-api-secret
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: lakefs-api-credentials
                  namespace: {{ $nsName }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  refreshInterval: "1h"
                  secretStoreRef:
                    name: {{ $orgName }}-infrastructure-secrets
                    kind: ClusterSecretStore
                  target:
                    name: lakefs-api-credentials
                  data:
                  - secretKey: LAKEFS_API_CLIENT_ID
                    remoteRef:
                      key: {{ $lakeFSAPISecretName | quote }}
                      property: LAKEFS_API_CLIENT_ID
                  - secretKey: LAKEFS_API_CLIENT_SECRET
                    remoteRef:
                      key: {{ $lakeFSAPISecretName | quote }}
                      property: LAKEFS_API_CLIENT_SECRET
          {{- end }}

          {{/* LakeFS OIDC: nginx auth-proxy config — injects LakeFS admin Basic auth on every upstream request. */}}
          {{/* Client authenticates only with Zitadel JWT/cookie (validated by oauth2-proxy). LakeFS creds never leave the cluster. */}}
          {{- if $lakeFSOIDCEnabled }}
          {{- $lakeFSBasicAuth := printf "Basic %s" (printf "%s:%s" $lakeFSAccessKeyId $lakeFSPassword | b64enc) -}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-lakefs-auth-proxy-config
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: lakefs-auth-proxy-config
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: lakefs-auth-proxy-config
                  namespace: {{ $nsName }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                data:
                  default.conf: |
                    server {
                      listen 8080;
                      client_max_body_size 5g;

                      location / {
                        proxy_pass http://{{ $projectName }}-mlstack-lakefs.{{ $nsName }}.svc:80;
                        proxy_set_header Authorization "{{ $lakeFSBasicAuth }}";
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto https;
                        proxy_read_timeout 300s;
                        proxy_send_timeout 300s;
                        proxy_request_buffering off;
                      }
                    }
          {{- end }}

          {{/* LakeFS OIDC: oauth2-proxy Deployment + Service for SSO and JWT validation */}}
          {{- if $lakeFSOIDCEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-lakefs-oauth2-proxy
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: lakefs-oauth2-proxy
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: {{ $projectName }}-lakefs-oauth2-proxy
                  namespace: {{ $nsName }}
                  labels:
                    app.kubernetes.io/name: lakefs-oauth2-proxy
                    app.kubernetes.io/instance: {{ $projectName }}
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app.kubernetes.io/name: lakefs-oauth2-proxy
                      app.kubernetes.io/instance: {{ $projectName }}
                  template:
                    metadata:
                      labels:
                        app.kubernetes.io/name: lakefs-oauth2-proxy
                        app.kubernetes.io/instance: {{ $projectName }}
                    spec:
                      nodeSelector:
                        {{- range $key, $value := $nodeSelector }}
                        {{ $key }}: {{ $value | quote }}
                        {{- end }}
                      tolerations:
                        {{- range $toleration := $tolerations }}
                        - key: {{ $toleration.key | quote }}
                          operator: {{ $toleration.operator | default "Equal" | quote }}
                          {{- if $toleration.value }}
                          value: {{ $toleration.value | quote }}
                          {{- end }}
                          {{- if $toleration.effect }}
                          effect: {{ $toleration.effect | quote }}
                          {{- end }}
                        {{- end }}
                      containers:
                      - name: oauth2-proxy
                        image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
                        args:
                        - --provider=oidc
                        - --oidc-issuer-url={{ $lakeFSOIDCIssuerUrl }}
                        - --client-id=$(OIDC_CLIENT_ID)
                        - --client-secret=$(OIDC_CLIENT_SECRET)
                        - --cookie-secret=$(COOKIE_SECRET)
                        - --cookie-name=_lakefs_oauth2
                        - --cookie-secure=true
                        - --cookie-httponly=true
                        - --cookie-samesite=lax
                        - --cookie-expire=4h
                        - --cookie-refresh=1h
                        - --upstream=http://localhost:8080
                        - --http-address=0.0.0.0:4180
                        - --redirect-url=https://lakefs-{{ $projectName }}.{{ $baseDns }}/oauth2/callback
                        - --email-domain=*
                        - --oidc-audience-claim=aud
                        - --allowed-group=
                        - --skip-provider-button=true
                        - --skip-jwt-bearer-tokens=false
                        - --extra-jwt-issuers={{ $lakeFSOIDCIssuerUrl }}=$(OIDC_CLIENT_ID)
                        - --reverse-proxy=true
                        - --set-xauthrequest=true
                        - --pass-basic-auth=false
                        - --pass-access-token=false
                        - --set-authorization-header=false
                        - --upstream-timeout=300s
                        envFrom:
                        - secretRef:
                            name: lakefs-oidc-credentials
                        ports:
                        - containerPort: 4180
                          name: http
                          protocol: TCP
                        livenessProbe:
                          httpGet:
                            path: /ping
                            port: http
                          initialDelaySeconds: 10
                          periodSeconds: 10
                        readinessProbe:
                          httpGet:
                            path: /ready
                            port: http
                          initialDelaySeconds: 5
                          periodSeconds: 5
                        resources:
                          requests:
                            cpu: "50m"
                            memory: "64Mi"
                          limits:
                            cpu: "200m"
                            memory: "128Mi"
                      - name: lakefs-auth-proxy
                        image: nginx:1.27-alpine
                        ports:
                        - containerPort: 8080
                        volumeMounts:
                        - name: auth-proxy-config
                          mountPath: /etc/nginx/conf.d/default.conf
                          subPath: default.conf
                        resources:
                          requests:
                            cpu: "10m"
                            memory: "16Mi"
                          limits:
                            cpu: "50m"
                            memory: "32Mi"
                      volumes:
                      - name: auth-proxy-config
                        configMap:
                          name: lakefs-auth-proxy-config
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-lakefs-oauth2-proxy-svc
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: lakefs-oauth2-proxy-svc
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: {{ $projectName }}-lakefs-oauth2-proxy
                  namespace: {{ $nsName }}
                  labels:
                    app.kubernetes.io/name: lakefs-oauth2-proxy
                    app.kubernetes.io/instance: {{ $projectName }}
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  selector:
                    app.kubernetes.io/name: lakefs-oauth2-proxy
                    app.kubernetes.io/instance: {{ $projectName }}
                  ports:
                  - name: http
                    port: 4180
                    targetPort: http
                    protocol: TCP
          {{- end }}

          {{/* LakeFS OIDC: Certificate for TLS */}}
          {{- if $lakeFSOIDCEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-lakefs-certificate
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: lakefs-certificate
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: cert-manager.io/v1
                kind: Certificate
                metadata:
                  name: lakefs-{{ $projectName }}-tls
                  namespace: {{ $nsName }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  secretName: lakefs-{{ $projectName }}-tls
                  issuerRef:
                    name: {{ $clusterName }}-system-issuer
                    kind: ClusterIssuer
                  dnsNames:
                  - "lakefs-{{ $projectName }}.{{ $baseDns }}"
          {{- end }}

          {{/* LakeFS OIDC: Standard Ingress via Traefik for oauth2-proxy (reverse proxy mode) */}}
          {{- if $lakeFSOIDCEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-lakefs-ingress
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: lakefs-ingress
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: lakefs-{{ $projectName }}
                  namespace: {{ $nsName }}
                  labels:
                    {{- range $key, $value := $commonLabels }}
                    {{ $key }}: "{{ $value }}"
                    {{- end }}
                spec:
                  ingressClassName: traefik-system
                  tls:
                  - hosts:
                    - "lakefs-{{ $projectName }}.{{ $baseDns }}"
                    secretName: "lakefs-{{ $projectName }}-tls"
                  rules:
                  - host: "lakefs-{{ $projectName }}.{{ $baseDns }}"
                    http:
                      paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: {{ $projectName }}-lakefs-oauth2-proxy
                            port:
                              number: 4180
          {{- end }}

          {{/* MLflow admin credentials Secret for pipeline consumption */}}
          {{- if $mlflowEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $projectName }}-mlflow-admin-secret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: mlflow-admin-secret
            labels:
              platform.kubecore.io/mlstack: {{ $projectName }}
              platform.kubecore.io/component: mlflow-credentials
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: {{ $projectName }}-mlflow-admin
                  namespace: {{ $nsName }}
                  labels:
                    platform.kubecore.io/mlstack: {{ $projectName }}
                    platform.kubecore.io/component: mlflow-credentials
                type: Opaque
                stringData:
                  username: admin
                  password: {{ $mlflowPassword | quote }}
          {{- end }}

          {{/* NOTE: Per-pipeline Karpenter NodePools + EC2NodeClasses have been moved to
               the XK8sMLApp composition (compositions/apis/kubeapp/k8smlapp/).
               Each ML pipeline is now a KubeApp with template type "ml-pipeline". */}}

          {{/* IRSA: IAM Role for Argo Workflow SA (checkpoint uploads to S3) */}}
          {{- $argoWorkflowRoleName := printf "ml-%s-argo-workflow-s3-role" $projectName -}}
          {{- if and $hasOIDC $s3Enabled }}
          ---
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Role
          metadata:
            name: {{ $argoWorkflowRoleName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-workflow-irsa-role
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $awsProvider }}
            forProvider:
              description: "Argo Workflow IRSA role for ML pipeline checkpoint uploads ({{ $projectName }})"
              assumeRolePolicy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "Federated": "{{ $oidcProviderArn }}"
                      },
                      "Action": "sts:AssumeRoleWithWebIdentity",
                      "Condition": {
                        "StringEquals": {
                          "{{ $oidcIssuerHost }}:aud": "sts.amazonaws.com",
                          "{{ $oidcIssuerHost }}:sub": "system:serviceaccount:{{ $nsName }}:argo-workflow"
                        }
                      }
                    }
                  ]
                }
              inlinePolicy:
                - name: workflow-s3-access
                  policy: |
                    {
                      "Version": "2012-10-17",
                      "Statement": [
                        {
                          "Effect": "Allow",
                          "Action": [
                            "s3:GetObject",
                            "s3:PutObject",
                            "s3:DeleteObject",
                            "s3:ListBucket",
                            "s3:GetBucketLocation",
                            "s3:ListBucketMultipartUploads",
                            "s3:AbortMultipartUpload",
                            "s3:ListMultipartUploadParts"
                          ],
                          "Resource": [
                            "arn:aws:s3:::{{ $bucketName }}",
                            "arn:aws:s3:::{{ $bucketName }}/*"
                          ]
                        }
                      ]
                    }
          {{- end }}

          {{/* Argo Workflow ServiceAccount for pipeline execution */}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $projectName }}-argo-workflow-sa
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-workflow-sa
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: argo-workflow
                  namespace: {{ $nsName }}
                  {{- if and $hasOIDC $s3Enabled }}
                  annotations:
                    eks.amazonaws.com/role-arn: "arn:aws:iam::{{ $accountId }}:role/{{ $argoWorkflowRoleName }}"
                  {{- end }}
                  labels:
                    platform.kubecore.io/mlstack: {{ $projectName }}
                    platform.kubecore.io/component: argo-workflow

          {{/* Role for Argo Workflow execution in ML namespace */}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $projectName }}-argo-workflow-role
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-workflow-role
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: Role
                metadata:
                  name: argo-workflow-role
                  namespace: {{ $nsName }}
                rules:
                - apiGroups: ["argoproj.io"]
                  resources: ["workflowtaskresults"]
                  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
                - apiGroups: [""]
                  resources: ["pods", "pods/log", "pods/status", "configmaps", "secrets", "services"]
                  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
                - apiGroups: ["batch"]
                  resources: ["jobs"]
                  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

          {{/* RoleBinding for Argo Workflow execution */}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $projectName }}-argo-workflow-rolebinding
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-workflow-rolebinding
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: RoleBinding
                metadata:
                  name: argo-workflow-rolebinding
                  namespace: {{ $nsName }}
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: Role
                  name: argo-workflow-role
                subjects:
                - kind: ServiceAccount
                  name: argo-workflow
                  namespace: {{ $nsName }}

  - step: generate-init-job
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $spec := .observed.composite.resource.spec -}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found for ML init Job" -}}
          {{- end -}}
          {{- $projectName := $spec.projectName -}}
          {{- $clusterName := $spec.clusterRef.name -}}
          {{- $region := $spec.region | default $envConfig.region | default "us-east-1" -}}
          {{- $nsName := printf "ml-%s" $projectName -}}
          {{- $k8sProvider := (index ($envConfig.providerConfigs | default dict) "kubernetes") | default (printf "%s-eks-kubernetes" $clusterName) -}}
          {{- $nodeSelector := ($envConfig.runtime | default dict).nodeSelector | default dict -}}
          {{- $tolerations := ($envConfig.runtime | default dict).tolerations | default list -}}
          {{- $mlflowSvcName := printf "%s-mlstack-mlflow" $projectName -}}
          {{- $lakeFSSvcName := printf "%s-mlstack-lakefs" $projectName -}}
          {{- $mlflowPassword := $envConfig.mlflowPassword | default "" -}}
          {{- $bucketName := printf "%s-ml-artifacts-%s" $projectName $region -}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $projectName }}-ml-init-job
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ml-init-job
              gotemplating.fn.crossplane.io/ready: "True"
          spec:
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: batch/v1
                kind: Job
                metadata:
                  name: {{ $projectName }}-ml-init
                  namespace: {{ $nsName }}
                  labels:
                    kubecore.io/kubeproject: {{ $projectName | quote }}
                    platform.kubecore.io/type: ml-init-job
                  annotations:
                    platform.kubecore.io/description: "Bootstrap lakeFS admin credentials and MLflow experiment"
                spec:
                  ttlSecondsAfterFinished: 600
                  backoffLimit: 5
                  template:
                    spec:
                      restartPolicy: OnFailure
                      nodeSelector:
                        {{- range $key, $value := $nodeSelector }}
                        {{ $key }}: {{ $value | quote }}
                        {{- end }}
                      tolerations:
                        {{- range $t := $tolerations }}
                        - key: {{ $t.key | quote }}
                          operator: {{ $t.operator | default "Equal" | quote }}
                          {{- if $t.value }}
                          value: {{ $t.value | quote }}
                          {{- end }}
                          {{- if $t.effect }}
                          effect: {{ $t.effect | quote }}
                          {{- end }}
                        {{- end }}
                      containers:
                      - name: ml-init
                        image: public.ecr.aws/l3k1j3t6/kubecore/ml-project-init:latest
                        imagePullPolicy: Always
                        env:
                        - name: PROJECT_NAME
                          value: {{ $projectName | quote }}
                        - name: LAKEFS_ENDPOINT
                          value: {{ printf "http://%s.%s.svc:80" $lakeFSSvcName $nsName | quote }}
                        - name: LAKEFS_ACCESS_KEY_ID
                          valueFrom:
                            secretKeyRef:
                              name: {{ $projectName }}-lakefs-admin
                              key: accessKeyId
                        - name: LAKEFS_SECRET_ACCESS_KEY
                          valueFrom:
                            secretKeyRef:
                              name: {{ $projectName }}-lakefs-admin
                              key: secretAccessKey
                        - name: MLFLOW_ENDPOINT
                          value: {{ printf "http://%s.%s.svc:5000" $mlflowSvcName $nsName | quote }}
                        resources:
                          requests:
                            cpu: "100m"
                            memory: "64Mi"
                          limits:
                            cpu: "200m"
                            memory: "128Mi"

  - step: patch-composite-status
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $spec := $xr.spec -}}
          {{- $projectName := $spec.projectName -}}
          {{- $clusterName := $spec.clusterRef.name -}}
          {{- $region := $spec.region | default "us-east-1" -}}
          {{- $nsName := printf "ml-%s" $projectName -}}
          {{- $pgHost := printf "%s-pg-rw.%s.svc" $projectName $nsName -}}
          {{- $mlflowSvcName := printf "%s-mlstack-mlflow" $projectName -}}
          {{- $lakeFSSvcName := printf "%s-mlstack-lakefs" $projectName -}}
          {{- $bucketName := printf "%s-ml-artifacts-%s" $projectName $region -}}
          ---
          apiVersion: {{ $xr.apiVersion }}
          kind: {{ $xr.kind }}
          metadata:
            name: {{ $xr.metadata.name }}
          status:
            namespace: {{ $nsName | quote }}
            {{- if index $spec.features "mlflow" }}
            mlflowEndpoint: {{ printf "http://%s.%s.svc:5000" $mlflowSvcName $nsName | quote }}
            {{- end }}
            {{- if index $spec.features "lakefs" }}
            lakeFSEndpoint: {{ printf "http://%s.%s.svc:80" $lakeFSSvcName $nsName | quote }}
            {{- end }}
            {{- if index $spec.features "s3" }}
            s3Bucket: {{ $bucketName | quote }}
            {{- end }}
            {{- if index $spec.features "postgres" }}
            postgresHost: {{ $pgHost | quote }}
            {{- end }}
            features:
              mlflow: {{ index $spec.features "mlflow" | default false }}
              lakefs: {{ index $spec.features "lakefs" | default false }}
              s3: {{ index $spec.features "s3" | default false }}
              postgres: {{ index $spec.features "postgres" | default false }}

  - step: auto-ready
    functionRef:
      name: function-auto-ready
    input:
      apiVersion: autoready.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        policy: All

