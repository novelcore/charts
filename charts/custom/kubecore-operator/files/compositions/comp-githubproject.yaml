  # Step 4: Patch and Transform - handle team ID dependencies
  - step: patch-and-transform
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      # Main team has no parent (direct child of organization)
      # Sub-teams (software, ops, business) are children of main team via parentTeamId

      # Store team IDs in status for reference
      - name: team-main
        patches:
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.id
          toFieldPath: status.teamIDs.main
      - name: team-software
        patches:
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.id
          toFieldPath: status.teamIDs.software
        - type: FromCompositeFieldPath
          fromFieldPath: status.teamIDs.main
          toFieldPath: spec.forProvider.parentTeamId
          policy:
            fromFieldPath: Required
      - name: team-ops
        patches:
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.id
          toFieldPath: status.teamIDs.ops
        - type: FromCompositeFieldPath
          fromFieldPath: status.teamIDs.main
          toFieldPath: spec.forProvider.parentTeamId
          policy:
            fromFieldPath: Required
      - name: team-business
        patches:
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.id
          toFieldPath: status.teamIDs.business
        - type: FromCompositeFieldPath
          fromFieldPath: status.teamIDs.main
          toFieldPath: spec.forProvider.parentTeamId
          policy:
            fromFieldPath: Required

      # Note: TeamMembership patching is handled by a separate dedicated step
      # since the resource names are dynamically generated based on team members

      # Patch team IDs to team repositories (break circular dependency)
      - name: team-repository-main
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: status.teamIDs.main
          toFieldPath: spec.forProvider.teamId
      - name: team-repository-software
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: status.teamIDs.software
          toFieldPath: spec.forProvider.teamId
      - name: team-repository-ops
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: status.teamIDs.ops
          toFieldPath: spec.forProvider.teamId
      - name: team-repository-business
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: status.teamIDs.business
          toFieldPath: spec.forProvider.teamId

      # Members patches - patch team IDs from status to Members resources
      - name: members-software
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: status.teamIDs.software
          toFieldPath: spec.forProvider.teamId
          policy:
            fromFieldPath: Required

      - name: members-ops
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: status.teamIDs.ops
          toFieldPath: spec.forProvider.teamId
          policy:
            fromFieldPath: Required

      - name: members-business
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: status.teamIDs.business
          toFieldPath: spec.forProvider.teamId
          policy:
            fromFieldPath: Required

      # Store repository information in status
      - name: repository
        patches:
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.htmlUrl
          toFieldPath: status.repository.url
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.fullName
          toFieldPath: status.repository.fullName
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.repoId
          toFieldPath: status.repository.id
          transforms:
          - type: convert
            convert:
              toType: string
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.defaultBranch
          toFieldPath: status.repository.defaultBranch

  # Step 4: Set provider config status from EnvironmentConfig
  - step: set-provider-config-status
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}

          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found" -}}
          {{- end -}}

          {{- $githubProviderConfigName := $envConfig.githubProviderConfigName -}}

          apiVersion: github.platform.kubecore.io/v1alpha1
          kind: XGitHubProject
          metadata:
            name: {{ $name }}
          status:
            providerConfigName: {{ $githubProviderConfigName }}

  # Step 5: Auto-ready function to check resource readiness
  - step: detect-readiness
    functionRef:
      name: function-auto-ready

  # Step 6: Sequencer function to ensure proper resource creation ordering
  - step: sequence-resources
    functionRef:
      name: function-sequencer
    input:
      apiVersion: sequencer.fn.crossplane.io/v1beta1
      kind: Input
      config:
        respectDeletionOrder: true
        finalizerStrategy:
          mode: Strict
          cleanupRules:
          # INVERTED DEPENDENCY: Team repository permissions delete first
          - resource: "team-repository-main"
            waitFor: []
          - resource: "team-repository-software"
            waitFor: []
          - resource: "team-repository-ops"
            waitFor: []
          - resource: "team-repository-business"
            waitFor: []
          # Repository files delete after repository permissions
          - resource: "repository-applicationsets"
            waitFor: [ "team-repository-main", "team-repository-software", "team-repository-ops", "team-repository-business" ]
          # ArgoCD repo push secrets delete before repository (created in child clusters, one per KubePool)
          - resource: "argocd-push-secret-*"
            waitFor: []
          # ArgoCD AppProjects delete before repository (created in child clusters, one per KubePool)
          - resource: "argocd-project-*"
            waitFor: []
          # ArgoCD ApplicationSets delete before AppProjects (created in child clusters, one per KubePool)
          - resource: "app-of-apps-*"
            waitFor: []
          # GitOps Promoter GitRepository resources delete before repository (created in child clusters, one per KubePool)
          - resource: "gitrepository-*"
            waitFor: []
          # Webhooks delete before repository (no dependencies)
          - resource: "webhook-*"
            waitFor: []
          # Webhook secrets delete after webhooks
          - resource: "webhook-secret-*"
            waitFor: [ "webhook-*" ]
          # CRITICAL: Members resources delete FIRST (before teams) to prevent orphaning
          - resource: "members-software"
            waitFor: []
          - resource: "members-ops"
            waitFor: []
          - resource: "members-business"
            waitFor: []
          # Teams delete AFTER members are removed to prevent 404 errors
          - resource: "team-software"
            waitFor: [ "team-repository-software", "members-software" ]
          - resource: "team-ops"
            waitFor: [ "team-repository-ops", "members-ops" ]
          - resource: "team-business"
            waitFor: [ "team-repository-business", "members-business" ]
          # Main team deletes after sub-teams
          - resource: "team-main"
            waitFor: [ "team-software", "team-ops", "team-business", "team-repository-main" ]
          # Repository deletes after teams
          - resource: "repository"
            waitFor: [ "team-main" ]
      rules:
      # Creation sequence
      - sequence:
        - repository

      # Repository and teams can be created in parallel
      - sequence:
        - team-main
      - sequence:
        - repository
        - repository-applicationsets

      # ArgoCD repo push secrets created after repository (one per KubePool)
      - sequence:
        - repository
        - argocd-push-secret-*

      # ArgoCD AppProjects created after repository (one per KubePool)
      - sequence:
        - repository
        - argocd-project-*

      # ArgoCD ApplicationSets created after AppProjects (one per KubePool)
      - sequence:
        - argocd-project-*
        - app-of-apps-*

      # GitOps Promoter GitRepository resources created after repository (one per KubePool)
      - sequence:
        - repository
        - gitrepository-*

      # Webhook secrets created after repository
      - sequence:
        - repository
        - webhook-secret-*

      # Webhooks created after repository and secrets
      - sequence:
        - repository
        - webhook-*

      # Main team must be ready before child teams
      - sequence:
        - team-main
        - team-software
      - sequence:
        - team-main
        - team-ops
      - sequence:
        - team-main
        - team-business

      # Teams must be ready before Members resources are added
      - sequence:
        - team-software
        - members-software
      - sequence:
        - team-ops
        - members-ops
      - sequence:
        - team-business
        - members-business

      # Teams must be ready before repository permissions
      - sequence:
        - team-main
        - team-repository-main
      - sequence:
        - team-software
        - team-repository-software
      - sequence:
        - team-ops
        - team-repository-ops
      - sequence:
        - team-business
        - team-repository-business