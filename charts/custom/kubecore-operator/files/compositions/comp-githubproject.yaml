                kind: Secret
                metadata:
                  name: {{ $name }}-repo-creds
                  namespace: argocd
                  labels:
                    {{- range $key, $value := $costTags }}
                    {{ $key }}: {{ $value | quote }}
                    {{- end }}
                    argocd.argoproj.io/secret-type: repository
                    project.kubecore.io/kubeproject: {{ $name }}
                    project.kubecore.io/managed-by: crossplane
