            {{- fail "repositorySource is required in EnvironmentConfig" -}}
          {{- end -}}

          {{/* Determine repository name (always in target org) */}}
          {{- $repoName := "" -}}
          {{- if eq $repositorySource.type "existing" -}}
            {{- $repoName = $repositorySource.existing.repository -}}
          {{- else -}}
            {{- $repoName = $name -}}
          {{- end -}}

          {{/* Repository URL always uses target organization */}}
          {{- $repoURL := printf "https://github.com/%s/%s" $githubOrg $repoName -}}

          {{/* Create one ArgoCD repo push secret per unique KubePool */}}
          {{- range $kubePool := $kubePools }}
          ---
          # ArgoCD Repository Push Secret (ExternalSecret) for KubePool: {{ $kubePool.name }}
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-push-secret-{{ $kubePool.name }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-push-secret-{{ $kubePool.name }}
              crossplane.io/external-name: {{ $name }}-repo-push-creds
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/kubepool: {{ $kubePool.name }}
              project.kubecore.io/part-of: "argocd-integration"
              project.kubecore.io/deletion-order: "65"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $kubePool.kubernetesProviderConfig }}
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: {{ $name }}-repo-push-creds
                  namespace: argocd
                  labels:
                    argocd.argoproj.io/secret-type: repository-write
                    project.kubecore.io/kubeproject: {{ $name }}
                    project.kubecore.io/managed-by: crossplane
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    kind: ClusterSecretStore
                    name: {{ $clusterSecretStore }}
                  target:
                    name: {{ $name }}-repo-push-creds
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      type: Opaque
                      engineVersion: v2
                      metadata:
                        labels:
                          argocd.argoproj.io/secret-type: repository-write
                      data:
                        githubAppID: "{{ `{{ .appId }}` }}"
                        githubAppInstallationID: "{{ `{{ .installationId }}` }}"
                        githubAppPrivateKey: "{{ `{{ .privateKey }}` }}"
                        url: "{{ $repoURL }}"
                        type: "git"
                  data:
                  - secretKey: appId
                    remoteRef:
                      key: {{ $githubSecretName }}
                      property: {{ $keyMappings.appId }}
                  - secretKey: installationId
                    remoteRef:
                      key: {{ $githubSecretName }}
                      property: {{ $keyMappings.installationId }}
                  - secretKey: privateKey
                    remoteRef:
                      key: {{ $githubSecretName }}
                      property: {{ $keyMappings.privateKey }}
          {{- end }}
          {{- end }}

