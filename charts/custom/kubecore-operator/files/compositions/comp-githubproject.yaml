          {{- else -}}
            {{- $repoName = $name -}}
          {{- end -}}

          {{/* Repository URL always uses target organization */}}
          {{- $repoURL := printf "https://github.com/%s/%s.git" $githubOrg $repoName -}}

          {{/* Create one ArgoCD repo secret per unique KubePool */}}
          {{- range $kubePool := $kubePools }}
          ---
          # ArgoCD Repository Secret for KubePool: {{ $kubePool.name }}
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-argocd-repo-secret-{{ $kubePool.name }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argocd-repo-secret-{{ $kubePool.name }}
