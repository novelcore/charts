apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: githubproject
  labels:
    platform.kubecore.io/type: githubproject
    provider: github
    service: project-management
    layer: platform
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: github.platform.kubecore.io/v1alpha1
    kind: XGitHubProject
  mode: Pipeline
  pipeline:
  # Step 1: Load EnvironmentConfig - 1:1 mapping with resource name
  - step: load-environment-configs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Selector
          selector:
            matchLabels:
            # PRIMARY: Select by GitHub project name (must match XGitHubProject name)
            - key: github.platform.kubecore.io/project-name
              type: FromCompositeFieldPath
              valueFromFieldPath: metadata.name
            # SECONDARY: Ensure it's a GitHub project config type
            - key: platform.kubecore.io/type
              type: Value
              value: githubproject-config

  # Step 2: Generate GitHub resources with Go Templates - ONLY EnvironmentConfig + spec
  - step: generate-github-resources
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Extract configuration from environment config - SINGLE SOURCE OF TRUTH */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found - EnvironmentConfig name must match XGitHubProject name" -}}
          {{- end -}}

          {{/* Extract all configuration from EnvironmentConfig */}}
          {{- $githubProviderConfigName := $envConfig.githubProviderConfigName -}}
          {{- if not $githubProviderConfigName -}}
            {{- fail "githubProviderConfigName is required in EnvironmentConfig" -}}
          {{- end -}}

          {{- $repositorySource := $envConfig.repositorySource -}}
          {{- if not $repositorySource -}}
            {{- fail "repositorySource is required in EnvironmentConfig" -}}
          {{- end -}}

          {{- $teamConfiguration := $envConfig.teamConfiguration -}}
          {{- if not $teamConfiguration -}}
            {{- fail "teamConfiguration is required in EnvironmentConfig" -}}
          {{- end -}}

          {{/* Extract GitHub configuration */}}
          {{- $githubOrg := $envConfig.github.organization -}}
          {{- if not $githubOrg -}}
            {{- fail "github.organization is required in EnvironmentConfig" -}}
          {{- end -}}

          {{- $githubSecretName := $envConfig.github.secretManager.secretName -}}
          {{- $keyMappings := $envConfig.github.secretManager.keyMappings -}}
          {{- $clusterSecretStore := $envConfig.clusterSecretStore.name -}}

          {{/* Project configuration from spec */}}
          {{- $description := $spec.description -}}
          {{- $visibility := $spec.visibility -}}
          {{- $features := $spec.features -}}

          {{/* Feature toggles with defaults */}}
          {{- $teamsEnabled := true -}}
          {{- $repositoryEnabled := true -}}
          {{- $applicationSetsEnabled := true -}}
          {{- $webhooksEnabled := false -}}

          {{- if $features -}}
            {{- if $features.teams -}}
              {{- if hasKey $features.teams "enabled" -}}
                {{- $teamsEnabled = $features.teams.enabled -}}
              {{- end -}}
            {{- end -}}
            {{- if $features.repository -}}
              {{- if hasKey $features.repository "enabled" -}}
                {{- $repositoryEnabled = $features.repository.enabled -}}
              {{- end -}}
            {{- end -}}
            {{- if $features.applicationSets -}}
              {{- if hasKey $features.applicationSets "enabled" -}}
                {{- $applicationSetsEnabled = $features.applicationSets.enabled -}}
              {{- end -}}
            {{- end -}}
            {{- if $features.webhooks -}}
              {{- if hasKey $features.webhooks "enabled" -}}
                {{- $webhooksEnabled = $features.webhooks.enabled -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}

          {{/* Extract cost allocation tags from EnvironmentConfig */}}
          {{- $costTags := dict -}}
          {{- if $envConfig.costAllocationTags -}}
            {{- $costTags = $envConfig.costAllocationTags -}}
          {{- end -}}

          {{/* Team configuration */}}
          {{- $teamMembers := dict -}}

          {{- if $teamConfiguration -}}
            {{- if $teamConfiguration.teamMembers -}}
              {{- $teamMembers = $teamConfiguration.teamMembers -}}
            {{- end -}}
          {{- end -}}

          {{/* Determine repository name (always in target org) */}}
          {{- $repoName := "" -}}
          {{- if eq $repositorySource.type "existing" -}}
            {{- $repoName = $repositorySource.existing.repository -}}
          {{- else -}}
            {{- $repoName = $name -}}
          {{- end -}}

          {{/* Repository URL always uses target organization */}}
          {{- $repoURL := printf "https://github.com/%s/%s.git" $githubOrg $repoName -}}

          {{- if $repositoryEnabled }}
          ---
          # Repository resource - conditional based on repositorySource.type
          apiVersion: repo.github.upbound.io/v1alpha1
          kind: Repository
          metadata:
            name: {{ $name }}-repository
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: repository
              crossplane.io/external-name: {{ if eq $repositorySource.type "existing" }}{{ $repositorySource.existing.repository }}{{ else }}{{ $name }}{{ end }}
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/part-of: "schema"
              testing.upbound.io/example-name: {{ $name }}
              project.kubecore.io/deletion-order: "80"
          spec:
            {{ if eq $repositorySource.type "existing" }}
            managementPolicies: ["Observe"]
            {{ else }}
            managementPolicies: ["*"]
            {{ end }}
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Delete
            forProvider:
              {{ if eq $repositorySource.type "existing" }}
              name: {{ $repositorySource.existing.repository }}
              {{ else }}
              name: {{ $name }}
              {{ if $repositorySource.template }}
              template:
              - owner: {{ $repositorySource.template.owner }}
                repository: {{ $repositorySource.template.repository }}
                includeAllBranches: {{ $repositorySource.template.includeAllBranches | default false }}
              {{ end }}
              {{ end }}
              description: {{ $description }}
              visibility: {{ $visibility }}
              allowMergeCommit: true
              allowRebaseMerge: true
              allowSquashMerge: true
              hasIssues: true
              hasProjects: true
              mergeCommitMessage: "PR_TITLE"
              mergeCommitTitle: "MERGE_MESSAGE"
              squashMergeCommitMessage: "COMMIT_MESSAGES"
              squashMergeCommitTitle: "COMMIT_OR_PR_TITLE"
              securityAndAnalysis:
              - secretScanning:
                - status: "disabled"
                secretScanningPushProtection:
                - status: "disabled"
          {{- end }}

          {{- if $teamsEnabled }}
          ---
          # Main team
          apiVersion: team.github.upbound.io/v1alpha1
          kind: Team
          metadata:
            name: {{ $name }}-team-main
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: team-main
              project.kubecore.io/handles-members-cleanup: "true"
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/part-of: "schema"
              testing.upbound.io/example-name: {{ $name }}
              project.kubecore.io/deletion-order: "40"
          spec:
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Delete
            forProvider:
              name: {{ $name }}
              description: "{{ $name }} main team, enjoy 🍺\n{{ $description }}"
              privacy: closed

          ---
          # Software team
          apiVersion: team.github.upbound.io/v1alpha1
          kind: Team
          metadata:
            name: {{ $name }}-team-software
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: team-software
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/part-of: "schema"
              testing.upbound.io/example-name: {{ $name }}-software
              project.kubecore.io/team-type: software
              project.kubecore.io/deletion-order: "30"
          spec:
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Delete
            forProvider:
              name: {{ $name }}-software
              description: "{{ $name }} software team"
              privacy: closed

          ---
          # Ops team
          apiVersion: team.github.upbound.io/v1alpha1
          kind: Team
          metadata:
            name: {{ $name }}-team-ops
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: team-ops
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/part-of: "schema"
              testing.upbound.io/example-name: {{ $name }}-ops
              project.kubecore.io/team-type: ops
              project.kubecore.io/deletion-order: "30"
          spec:
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Delete
            forProvider:
              name: {{ $name }}-ops
              description: "{{ $name }} operations team"
              privacy: closed

          ---
          # Business team
          apiVersion: team.github.upbound.io/v1alpha1
          kind: Team
          metadata:
            name: {{ $name }}-team-business
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: team-business
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/part-of: "schema"
              testing.upbound.io/example-name: {{ $name }}-business
              project.kubecore.io/team-type: business
              project.kubecore.io/deletion-order: "30"
          spec:
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Delete
            forProvider:
              name: {{ $name }}-business
              description: "{{ $name }} business team"
              privacy: closed

          {{ if and $teamMembers $teamMembers.software }}
          ---
          # Software team members
          # Note: Using Orphan deletion policy because GitHub automatically removes
          # members when team is deleted, preventing 404 errors during cleanup
          apiVersion: team.github.upbound.io/v1alpha1
          kind: Members
          metadata:
            name: {{ $name }}-members-software
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: members-software
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/part-of: "schema"
              project.kubecore.io/team-type: software
              testing.upbound.io/example-name: {{ $name }}-software
              project.kubecore.io/deletion-order: "20"
          spec:
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            forProvider:
              members:
              {{- range $index, $member := $teamMembers.software }}
              - username: {{ $member }}
                role: {{ if eq $index 0 }}maintainer{{ else }}member{{ end }}
              {{- end }}
              # teamId will be patched from team-software status
          {{ end }}

          {{ if and $teamMembers $teamMembers.ops }}
          ---
          # Ops team members
          # Note: Using Orphan deletion policy because GitHub automatically removes
          # members when team is deleted, preventing 404 errors during cleanup
          apiVersion: team.github.upbound.io/v1alpha1
          kind: Members
          metadata:
            name: {{ $name }}-members-ops
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: members-ops
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/part-of: "schema"
              project.kubecore.io/team-type: ops
              testing.upbound.io/example-name: {{ $name }}-ops
              project.kubecore.io/deletion-order: "20"
          spec:
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            forProvider:
              members:
              {{- range $index, $member := $teamMembers.ops }}
              - username: {{ $member }}
                role: {{ if eq $index 0 }}maintainer{{ else }}member{{ end }}
              {{- end }}
              # teamId will be patched from team-ops status
          {{ end }}

          {{ if and $teamMembers $teamMembers.business }}
          ---
          # Business team members
          # Note: Using Orphan deletion policy because GitHub automatically removes
          # members when team is deleted, preventing 404 errors during cleanup
          apiVersion: team.github.upbound.io/v1alpha1
          kind: Members
          metadata:
            name: {{ $name }}-members-business
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: members-business
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/part-of: "schema"
              project.kubecore.io/team-type: business
              testing.upbound.io/example-name: {{ $name }}-business
              project.kubecore.io/deletion-order: "20"
          spec:
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            forProvider:
              members:
              {{- range $index, $member := $teamMembers.business }}
              - username: {{ $member }}
                role: {{ if eq $index 0 }}maintainer{{ else }}member{{ end }}
              {{- end }}
              # teamId will be patched from team-business status
          {{ end }}
          {{- end }}

          {{ if and $teamsEnabled $repositoryEnabled }}
          ---
          # Main team repository permissions
          apiVersion: team.github.upbound.io/v1alpha1
          kind: TeamRepository
          metadata:
            name: {{ $name }}-team-repository-main
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: team-repository-main
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/part-of: "schema"
              testing.upbound.io/example-name: {{ $name }}
              project.kubecore.io/deletion-order: "50"
          spec:
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Delete
            forProvider:
              permission: triage
              {{ if eq $repositorySource.type "existing" }}
              repository: {{ $repositorySource.existing.repository }}
              {{ else }}
              repository: {{ $name }}
              {{ end }}
              # teamId will be patched from team-main status

          ---
          # Software team repository permissions
          apiVersion: team.github.upbound.io/v1alpha1
          kind: TeamRepository
          metadata:
            name: {{ $name }}-team-repository-software
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: team-repository-software
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/part-of: "schema"
              testing.upbound.io/example-name: {{ $name }}-software
              project.kubecore.io/deletion-order: "50"
          spec:
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Delete
            forProvider:
              permission: maintain
              {{ if eq $repositorySource.type "existing" }}
              repository: {{ $repositorySource.existing.repository }}
              {{ else }}
              repository: {{ $name }}
              {{ end }}
              # teamId will be patched from team-software status

          ---
          # Ops team repository permissions
          apiVersion: team.github.upbound.io/v1alpha1
          kind: TeamRepository
          metadata:
            name: {{ $name }}-team-repository-ops
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: team-repository-ops
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/part-of: "schema"
              testing.upbound.io/example-name: {{ $name }}-ops
              project.kubecore.io/deletion-order: "50"
          spec:
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Delete
            forProvider:
              permission: admin
              {{ if eq $repositorySource.type "existing" }}
              repository: {{ $repositorySource.existing.repository }}
              {{ else }}
              repository: {{ $name }}
              {{ end }}
              # teamId will be patched from team-ops status

          ---
          # Business team repository permissions
          apiVersion: team.github.upbound.io/v1alpha1
          kind: TeamRepository
          metadata:
            name: {{ $name }}-team-repository-business
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: team-repository-business
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/part-of: "schema"
              testing.upbound.io/example-name: {{ $name }}-business
              project.kubecore.io/deletion-order: "50"
          spec:
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Delete
            forProvider:
              permission: triage
              {{ if eq $repositorySource.type "existing" }}
              repository: {{ $repositorySource.existing.repository }}
              {{ else }}
              repository: {{ $name }}
              {{ end }}
              # teamId will be patched from team-business status
          {{ end }}

          {{ if and $applicationSetsEnabled $repositoryEnabled }}
          ---
          # Repository File with ApplicationSets
          apiVersion: repo.github.upbound.io/v1alpha1
          kind: RepositoryFile
          metadata:
            name: {{ $name }}-argocd-applicationsets
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: repository-applicationsets
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/part-of: "schema"
              project.kubecore.io/deletion-order: "50"
          spec:
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Delete
            forProvider:
              repositoryRef:
                name: {{ $name }}-repository
              file: root/autov2/resource.yaml
              content: |
                apiVersion: argoproj.io/v1alpha1
                kind: ApplicationSet
                metadata:
                  name: {{ $name }}-kubeapps-spec-auto-discovery
                  namespace: argocd
                  labels:
                    project.kubecore.io/kubeproject: {{ $name }}
                    project.kubecore.io/kubenv: base
                    project.kubecore.io/part-of: system
                  annotations:
                    argocd.argoproj.io/sync-wave: "-1"
                spec:
                  goTemplate: true
                  goTemplateOptions: [ "missingkey=error" ]
                  generators:
                  - git:
                      repoURL: {{ $repoURL }}
                      revision: main
                      directories:
                      - path: kubeapps/*/sdlc
                      # Exclude any directories that shouldn't be deployed
                      # - path: kubeapps/*/overlays/preview
                      #   exclude: true
                      - path: kubeapps/kubeapp-python-rc-demo/sdlc
                        exclude: true
                      - path: kubeapps/rollouts-demo/sdlc
                        exclude: true
                  template:
                    metadata:
                      name: '{{"{{index .path.segments 1}}-{{.path.basename}}-sdlc"}}'
                      labels:
                        app.kubernetes.io/name: '{{"{{index .path.segments 1}}-sdlc"}}'
                        app.kubernetes.io/managed-by: 'applicationset'
                        project.kubecore.io/kubeapp: '{{"{{index .path.segments 1}}"}}'
                        project.kubecore.io/github-project: '{{"{{index .path.segments 1}}"}}'
                        project.kubecore.io/part-of: kubeapps
                      annotations:
                        argocd.argoproj.io/sync-wave: "1"
                    spec:
                      project: {{ $name }}
                      destination:
                        server: https://kubernetes.default.svc
                        namespace: '{{ $name }}-sdlc'
                      source:
                        repoURL: {{ $repoURL }}
                        targetRevision: 'main'
                        path: '{{"{{.path.path}}"}}'
                      syncPolicy:
                        syncOptions:
                        - CreateNamespace=true
                        - ApplyOutOfSyncOnly=true
                        - RespectIgnoreDifferences=true
                        automated:
                          prune: true
                          selfHeal: true
                        retry:
                          limit: 5
                          backoff:
                            duration: 5s
                            factor: 2
                            maxDuration: 3m0s
                ---
                apiVersion: argoproj.io/v1alpha1
                kind: ApplicationSet
                metadata:
                  name: {{ $name }}-kubeapps-auto-discovery
                  namespace: argocd
                  labels:
                    project.kubecore.io/kubeproject: {{ $name }}
                    project.kubecore.io/kubenv: base
                    project.kubecore.io/part-of: system
                  annotations:
                    argocd.argoproj.io/sync-wave: "-1"
                spec:
                  goTemplate: true
                  goTemplateOptions: [ "missingkey=error" ]
                  generators:
                  - git:
                      repoURL: {{ $repoURL }}
                      revision: 'main'
                      directories:
                      - path: kubeapps/*/overlays/*
                      # Exclude any directories that shouldn't be deployed
                      - path: kubeapps/*/overlays/preview
                        exclude: true
                      - path: kubeapps/kubeapp-python-rc-demo/overlays/*
                        exclude: true
                      - path: kubeapps/rollouts-demo/overlays/*
                        exclude: true
                  template:
                    metadata:
                      name: '{{"{{index .path.segments 1}}-{{.path.basename}}"}}'
                      labels:
                        app.kubernetes.io/name: '{{"{{index .path.segments 1}}"}}'
                        app.kubernetes.io/environment: '{{"{{.path.basename}}"}}'
                        app.kubernetes.io/managed-by: 'applicationset'
                        project.kubecore.io/kubeapp: '{{"{{index .path.segments 1}}"}}'
                        project.kubecore.io/kubenv: '{{"{{.path.basename}}"}}'
                        project.kubecore.io/github-project: '{{"{{index .path.segments 1}}"}}'
                        project.kubecore.io/part-of: kubeapps
                        project.kubecore.io/sdlc: '{{"{{.path.basename}}"}}'
                        project.kubecore.io/sdlc-component: '{{"{{index .path.segments 1}}"}}'
                      annotations:
                        argocd.argoproj.io/sync-wave: "1"
                    spec:
                      project: default
                      destination:
                        server: https://kubernetes.default.svc
                        # namespace: '{{"{{index .path.segments 1}}-{{.path.basename}}"}}'
                        namespace: 'kubeapps-{{"{{.path.basename}}"}}'
                      sourceHydrator:
                        drySource:
                          repoURL: {{ $repoURL }}
                          path: '{{"{{.path.path}}"}}'
                          targetRevision: 'main'
                        syncSource:
                          targetBranch: kubeapp/{{"{{index .path.segments 1}}"}}/kubenv/{{"{{.path.basename}}"}}
                          path: '{{"{{.path.path}}"}}'
                        hydrateTo:
                          targetBranch: kubeapp/{{"{{index .path.segments 1}}"}}/kubenv/{{"{{.path.basename}}"}}-next
                      syncPolicy:
                        syncOptions:
                        - CreateNamespace=true
                        - ApplyOutOfSyncOnly=true
                        - RespectIgnoreDifferences=true
                        automated:
                          prune: true
                          selfHeal: true
                        retry:
                          limit: 5
                          backoff:
                            duration: 5s
                            factor: 2
                            maxDuration: 3m0s
              branch: main
              commitMessage: "feat: Add ArgoCD ApplicationSets for {{ $name }}"
              commitAuthor: "Kubecore Platform"
              commitEmail: "platform@kubecore.eu"
          {{ end }}

          {{- if $webhooksEnabled }}
          {{/* Extract webhook configurations from EnvironmentConfig */}}
          {{- $webhookConfigs := list -}}
          {{- if $envConfig.webhooks -}}
            {{- $webhookConfigs = $envConfig.webhooks -}}
          {{- end -}}

          {{/* Generate RepositoryWebhook resources */}}
          {{- range $webhook := $webhookConfigs }}
          ---
          # Repository Webhook: {{ $webhook.name }}
          apiVersion: repo.github.upbound.io/v1alpha1
          kind: RepositoryWebhook
          metadata:
            name: {{ $name }}-webhook-{{ $webhook.name }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: webhook-{{ $webhook.name }}
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/webhook-name: {{ $webhook.name }}
              project.kubecore.io/part-of: "webhooks"
              project.kubecore.io/deletion-order: "60"
          spec:
            providerConfigRef:
              name: {{ $githubProviderConfigName }}
            deletionPolicy: Delete
            forProvider:
              repositoryRef:
                name: {{ $name }}-repository
              active: {{ default true $webhook.active }}
              events:
              {{- if $webhook.events }}
              {{- range $event := $webhook.events }}
              - {{ $event }}
              {{- end }}
              {{- else }}
              # Default events if not specified
              - push
              - pull_request
              - issues
              - issue_comment
              - pull_request_review
              {{- end }}
              configuration:
              - contentType: {{ default "json" $webhook.contentType }}
                insecureSsl: {{ default false $webhook.insecureSsl }}
                urlSecretRef:
                  name: {{ $name }}-webhook-{{ $webhook.name }}-secret
                  namespace: crossplane-system
                  key: url
                secretSecretRef:
                  name: {{ $name }}-webhook-{{ $webhook.name }}-secret
                  namespace: crossplane-system
                  key: secret
          {{- end }}
          {{- end }}

  # Step 3: Generate webhook secrets - create secrets for webhook authentication
  - step: generate-webhook-secrets
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $name := $xr.metadata.name -}}
          {{- $spec := $xr.spec -}}

          {{/* Check if webhooks feature is enabled */}}
          {{- $webhooksEnabled := false -}}
          {{- if $spec.features -}}
            {{- if $spec.features.webhooks -}}
              {{- if hasKey $spec.features.webhooks "enabled" -}}
                {{- $webhooksEnabled = $spec.features.webhooks.enabled -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}

          {{/* Extract webhook configs from EnvironmentConfig */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- $webhookConfigs := list -}}
          {{- if and $envConfig $webhooksEnabled -}}
            {{- if $envConfig.webhooks -}}
              {{- $webhookConfigs = $envConfig.webhooks -}}
            {{- end -}}
          {{- end -}}

          {{/* Generate secrets for each webhook */}}
          {{- range $webhook := $webhookConfigs }}
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ $name }}-webhook-{{ $webhook.name }}-secret
            namespace: crossplane-system
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: webhook-secret-{{ $webhook.name }}
              gotemplating.fn.crossplane.io/ready: "True"
            labels:
              project.kubecore.io/kubeproject: {{ $name }}
              project.kubecore.io/webhook-name: {{ $webhook.name }}
              project.kubecore.io/part-of: "webhooks"
              project.kubecore.io/deletion-order: "55"
          type: Opaque
          stringData:
            url: {{ $webhook.url | quote }}
            secret: {{ randAlphaNum 32 | quote }}
          {{- end }}

  # Step 3.4: Generate ArgoCD repository secrets - create plain Secret per unique KubePool for repository registration
  - step: generate-argocd-repo-secrets
