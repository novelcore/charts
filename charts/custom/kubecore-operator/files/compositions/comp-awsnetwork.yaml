apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: awsnetwork
  labels:
    platform.kubecore.io/type: awsnetwork
    provider: aws
    service: aws-networking
    layer: platform
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: platform.kubecore.io/v1alpha1
    kind: XAwsNetwork
  mode: Pipeline
  pipeline:
  
  # Step 1: Load Environment Configurations (fixed label matching)
  - step: load-environment-configs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Selector
          selector:
            matchLabels:
            - key: kubecore.io/kubeorg
              type: FromCompositeFieldPath
              valueFromFieldPath: metadata.labels["kubecore.io/kubeorg"]
            - key: kubecore.io/region
              type: FromCompositeFieldPath
              valueFromFieldPath: metadata.labels["kubecore.io/region"]
            - key: platform.kubecore.io/type
              type: Value
              value: aws-network-config
  
  # Step 2: Generate AWS networking resources with Go Templates
  - step: generate-aws-network-resources
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $name := .observed.composite.resource.metadata.name -}}
          {{- $uid := .observed.composite.resource.metadata.uid -}}
          {{- $spec := .observed.composite.resource.spec -}}
          
          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found in annotation" -}}
          {{- end -}}
          
          {{/* Extract environment configuration values */}}
          {{- $accountId := $envConfig.accountId -}}
          {{- $primaryRegion := $envConfig.primaryRegion -}}
          {{- $providerConfig := $envConfig.providerConfig -}}
          {{- $domain := $envConfig.domain -}}
          {{- $vpcCidr := $envConfig.cidr -}}
          {{- $availabilityZones := $envConfig.availabilityZones -}}
          {{- $publicSubnets := $envConfig.subnets.public -}}
          {{- $privateSubnets := $envConfig.subnets.private -}}

          {{/* Extract cost allocation tags from EnvironmentConfig */}}
          {{- $costTags := dict -}}
          {{- if $envConfig.costAllocationTags -}}
            {{- $costTags = $envConfig.costAllocationTags -}}
          {{- end -}}
          
          {{/* Feature toggles from spec with defaults */}}
          {{- $vpcEnabled := true -}}
          {{- if $spec.vpc -}}
            {{- if hasKey $spec.vpc "enabled" -}}
              {{- $vpcEnabled = $spec.vpc.enabled -}}
            {{- end -}}
          {{- end -}}
          
          {{- $dnsEnabled := false -}}
          {{- if $spec.dns -}}
            {{- if hasKey $spec.dns "enabled" -}}
              {{- $dnsEnabled = $spec.dns.enabled -}}
            {{- end -}}
          {{- end -}}
          
          {{- $natEnabled := $vpcEnabled -}}
          {{- if and $spec.vpc $spec.vpc.natGateways -}}
            {{- if hasKey $spec.vpc.natGateways "enabled" -}}
              {{- $natEnabled = $spec.vpc.natGateways.enabled -}}
            {{- end -}}
          {{- end -}}
          
          {{/* Resource naming convention: {metadata.name}-{resource-type} */}}
          {{- $vpcName := printf "%s-vpc" $name -}}
          {{- $igwName := printf "%s-igw" $name -}}
          {{- $publicRtName := printf "%s-public-rt" $name -}}
          {{- $hostedZoneName := $domain -}}
          
          {{/* Common tags */}}
          {{- $commonTags := dict
            "Name" $name
            "kubernetes.io/cluster" $name
            "platform.kubecore.io/network" $name
            "platform.kubecore.io/managed-by" "crossplane"
            "platform.kubecore.io/composition" "awsnetwork"
            "crossplane.io/claim-name" $name
            "crossplane.io/composite" $name
          -}}

          {{/* Merge common tags with cost allocation tags */}}
          {{- $allTags := merge $commonTags $costTags -}}
          
          {{/* VPC Resources */}}
          {{- if $vpcEnabled }}
          ---
          # VPC
          apiVersion: ec2.aws.upbound.io/v1beta1
          kind: VPC
          metadata:
            name: {{ $vpcName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $vpcName }}
            labels:
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/resource-type: vpc
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              cidrBlock: {{ $vpcCidr }}
              enableDnsHostnames: true
              enableDnsSupport: true
              tags: {{ $allTags | toYaml | nindent 8 }}
              region: {{ $primaryRegion }}
            providerConfigRef:
              name: {{ $providerConfig }}
          
          ---
          # Internet Gateway
          apiVersion: ec2.aws.upbound.io/v1beta1
          kind: InternetGateway
          metadata:
            name: {{ $igwName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $igwName }}
            labels:
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/resource-type: internet-gateway
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              vpcIdRef:
                name: {{ $vpcName }}
              tags: {{ $allTags | toYaml | nindent 8 }}
              region: {{ $primaryRegion }}
            providerConfigRef:
              name: {{ $providerConfig }}
          
          ---
          # Public Route Table
          apiVersion: ec2.aws.upbound.io/v1beta1
          kind: RouteTable
          metadata:
            name: {{ $publicRtName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $publicRtName }}
            labels:
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/resource-type: route-table
              platform.kubecore.io/route-table-type: public
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              vpcIdRef:
                name: {{ $vpcName }}
              tags: {{ $allTags | toYaml | nindent 8 }}
              region: {{ $primaryRegion }}
            providerConfigRef:
              name: {{ $providerConfig }}
          
          ---
          # Public Route to Internet Gateway
          apiVersion: ec2.aws.upbound.io/v1beta1
          kind: Route
          metadata:
            name: {{ printf "%s-public-internet-route" $name }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "%s-public-internet-route" $name }}
            labels:
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/resource-type: route
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              routeTableIdRef:
                name: {{ $publicRtName }}
              destinationCidrBlock: "0.0.0.0/0"
              gatewayIdRef:
                name: {{ $igwName }}
              region: {{ $primaryRegion }}
            providerConfigRef:
              name: {{ $providerConfig }}
          
          {{/* Public Subnets */}}
          {{- range $i, $subnetCidr := $publicSubnets }}
          {{- $az := index $availabilityZones $i }}
          {{- $azSuffix := printf "%d" $i }}
          {{- $subnetName := printf "%s-public-%s" $name $azSuffix }}
          ---
          # Public Subnet {{ $i }}
          apiVersion: ec2.aws.upbound.io/v1beta1
          kind: Subnet
          metadata:
            name: {{ $subnetName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $subnetName }}
            labels:
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/resource-type: subnet
              platform.kubecore.io/subnet-type: public
              platform.kubecore.io/availability-zone: {{ $az }}
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              availabilityZone: {{ $az }}
              cidrBlock: {{ $subnetCidr }}
              mapPublicIpOnLaunch: true
              vpcIdRef:
                name: {{ $vpcName }}
              tags: {{ merge $allTags (dict "Name" $subnetName "kubernetes.io/role/elb" "1") | toYaml | nindent 8 }}
              region: {{ $primaryRegion }}
            providerConfigRef:
              name: {{ $providerConfig }}
          
          ---
          # Public Subnet Route Table Association {{ $i }}
          apiVersion: ec2.aws.upbound.io/v1beta1
          kind: RouteTableAssociation
          metadata:
            name: {{ printf "%s-public-%s-rta" $name $azSuffix }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "%s-public-%s-rta" $name $azSuffix }}
            labels:
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/resource-type: route-table-association
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              routeTableIdRef:
                name: {{ $publicRtName }}
              subnetIdRef:
                name: {{ $subnetName }}
              region: {{ $primaryRegion }}
            providerConfigRef:
              name: {{ $providerConfig }}
          {{- end }}
          
          {{/* Private Subnets */}}
          {{- range $i, $subnetCidr := $privateSubnets }}
          {{- $az := index $availabilityZones $i }}
          {{- $azSuffix := printf "%d" $i }}
          {{- $subnetName := printf "%s-private-%s" $name $azSuffix }}
          {{- $privateRtName := printf "%s-private-rt-%s" $name $azSuffix }}
          ---
          # Private Subnet {{ $i }}
          apiVersion: ec2.aws.upbound.io/v1beta1
          kind: Subnet
          metadata:
            name: {{ $subnetName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $subnetName }}
            labels:
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/resource-type: subnet
              platform.kubecore.io/subnet-type: private
              platform.kubecore.io/availability-zone: {{ $az }}
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              availabilityZone: {{ $az }}
              cidrBlock: {{ $subnetCidr }}
              mapPublicIpOnLaunch: false
              vpcIdRef:
                name: {{ $vpcName }}
              tags: {{ merge $allTags (dict "Name" $subnetName "kubernetes.io/role/internal-elb" "1") | toYaml | nindent 8 }}
              region: {{ $primaryRegion }}
            providerConfigRef:
              name: {{ $providerConfig }}
          
          ---
          # Private Route Table {{ $i }}
          apiVersion: ec2.aws.upbound.io/v1beta1
          kind: RouteTable
          metadata:
            name: {{ $privateRtName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $privateRtName }}
            labels:
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/resource-type: route-table
              platform.kubecore.io/route-table-type: private
              platform.kubecore.io/availability-zone: {{ $az }}
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              vpcIdRef:
                name: {{ $vpcName }}
              tags: {{ merge $allTags (dict "Name" $privateRtName) | toYaml | nindent 8 }}
              region: {{ $primaryRegion }}
            providerConfigRef:
              name: {{ $providerConfig }}
          
          ---
          # Private Subnet Route Table Association {{ $i }}
          apiVersion: ec2.aws.upbound.io/v1beta1
          kind: RouteTableAssociation
          metadata:
            name: {{ printf "%s-private-%s-rta" $name $azSuffix }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "%s-private-%s-rta" $name $azSuffix }}
            labels:
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/resource-type: route-table-association
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              routeTableIdRef:
                name: {{ $privateRtName }}
              subnetIdRef:
                name: {{ $subnetName }}
              region: {{ $primaryRegion }}
            providerConfigRef:
              name: {{ $providerConfig }}
          
          {{/* NAT Gateway and EIP for private subnets */}}
          {{- if $natEnabled }}
          {{- $natGatewayName := printf "%s-nat-%s" $name $azSuffix }}
          {{- $eipName := printf "%s-eip-%s" $name $azSuffix }}
          ---
          # Elastic IP for NAT Gateway {{ $i }}
          apiVersion: ec2.aws.upbound.io/v1beta1
          kind: EIP
          metadata:
            name: {{ $eipName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $eipName }}
            labels:
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/resource-type: eip
              platform.kubecore.io/availability-zone: {{ $az }}
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              domain: vpc
              tags: {{ merge $allTags (dict "Name" $eipName) | toYaml | nindent 8 }}
              region: {{ $primaryRegion }}
            providerConfigRef:
              name: {{ $providerConfig }}
          
          ---
          # NAT Gateway {{ $i }}
          apiVersion: ec2.aws.upbound.io/v1beta1
          kind: NATGateway
          metadata:
            name: {{ $natGatewayName }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $natGatewayName }}
            labels:
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/resource-type: nat-gateway
              platform.kubecore.io/availability-zone: {{ $az }}
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              allocationIdRef:
                name: {{ $eipName }}
              subnetIdRef:
                name: {{ printf "%s-public-%s" $name $azSuffix }}
              tags: {{ merge $allTags (dict "Name" $natGatewayName) | toYaml | nindent 8 }}
              region: {{ $primaryRegion }}
            providerConfigRef:
              name: {{ $providerConfig }}
          
          ---
          # Private Route to NAT Gateway {{ $i }}
          apiVersion: ec2.aws.upbound.io/v1beta1
          kind: Route
          metadata:
            name: {{ printf "%s-private-%s-nat-route" $name $azSuffix }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "%s-private-%s-nat-route" $name $azSuffix }}
            labels:
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/resource-type: route
              platform.kubecore.io/availability-zone: {{ $az }}
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              routeTableIdRef:
                name: {{ $privateRtName }}
              destinationCidrBlock: "0.0.0.0/0"
              natGatewayIdRef:
                name: {{ $natGatewayName }}
              region: {{ $primaryRegion }}
            providerConfigRef:
              name: {{ $providerConfig }}
          {{- end }}
          {{- end }}
          {{- end }}
          
          {{/* DNS Resources */}}
          {{- if $dnsEnabled }}
          ---
          # Route53 Hosted Zone
          apiVersion: route53.aws.upbound.io/v1beta1
          kind: Zone
          metadata:
            name: {{ printf "%s-hosted-zone" $name }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "%s-hosted-zone" $name }}
            labels:
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/resource-type: hosted-zone
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            forProvider:
              name: {{ $domain }}
              comment: {{ printf "Hosted zone for %s network" $name }}
              tags: {{ merge $allTags (dict "Name" $hostedZoneName "platform.kubecore.io/domain" $domain) | toYaml | nindent 8 }}
            providerConfigRef:
              name: {{ $providerConfig }}

          ---
          # ExternalDNS IAM Policy for Route53 access
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Policy
          metadata:
            name: {{ $name }}-external-dns-policy
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: external-dns-policy
            labels:
              platform.kubecore.io/awsnetwork: {{ $name }}
              platform.kubecore.io/network: {{ $name }}
              platform.kubecore.io/role: "external-dns"
              platform.kubecore.io/part-of: "dns"
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $providerConfig }}
            forProvider:
              description: "ExternalDNS Route53 access policy for {{ $name }} network"
              policy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": ["route53:ChangeResourceRecordSets"],
                      "Resource": ["arn:aws:route53:::hostedzone/*"]
                    },
                    {
                      "Effect": "Allow",
                      "Action": [
                        "route53:ListHostedZones",
                        "route53:ListResourceRecordSets",
                        "route53:ListTagsForResource"
                      ],
                      "Resource": ["*"]
                    }
                  ]
                }
              tags: {{ merge $allTags (dict "Name" (printf "%s-external-dns-policy" $name) "platform.kubecore.io/role" "external-dns") | toYaml | nindent 8 }}
          {{- end }}

  # Step 3: Auto-ready function for resource readiness
  - step: auto-ready
    functionRef:
      name: function-auto-ready
    input:
      apiVersion: autoready.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        policy: All

