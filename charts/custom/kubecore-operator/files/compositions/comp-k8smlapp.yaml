apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: k8smlapp
  labels:
    platform.kubecore.io/type: k8smlapp
    provider: kubernetes
    service: ml-pipeline
    layer: application
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: platform.kubecore.io/v1alpha1
    kind: XK8sMLApp
  mode: Pipeline
  pipeline:

  # ── Step 1: Load EnvironmentConfig ──────────────────────────────────────
  - step: load-environment-configs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Selector
          selector:
            matchLabels:
            - key: platform.kubecore.io/type
              type: Value
              value: k8smlapp-config
            - key: k8s.platform.kubecore.io/app-name
              type: FromCompositeFieldPath
              valueFromFieldPath: spec.appName

  # ── Step 2: Generate ML app resources (lakeFS init job) ─────────────────
  - step: generate-ml-app-resources
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $name := .observed.composite.resource.metadata.name -}}
          {{- $spec := .observed.composite.resource.spec -}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}

          {{- $appName := $spec.appName -}}
          {{- $projectName := $spec.projectName -}}
          {{- $clusterName := $spec.clusterName -}}
          {{- $pipelineLabel := printf "%s-%s" $projectName $appName -}}

          {{- $k8sProvider := $envConfig.kubernetesProviderConfig | default "" -}}

          {{/* Extract lakeFS config from EnvironmentConfig */}}
          {{- $lakefs := $envConfig.lakefs | default dict -}}
          {{- $lakeFSEndpoint := $lakefs.endpoint | default "" -}}

          {{/* Common labels for all resources */}}
          {{- $commonLabels := dict
            "platform.kubecore.io/project" $projectName
            "platform.kubecore.io/pipeline" $pipelineLabel
            "platform.kubecore.io/managed-by" "k8smlapp-composition"
          -}}

          {{/* ── lakeFS Repository Creation Job ──────────────────────────── */}}
          {{- if $lakeFSEndpoint }}
          {{- $lakeFSAccessKeyId := $lakefs.accessKeyId | default "" -}}
          {{- $lakeFSSecretAccessKey := $lakefs.secretAccessKey | default "" -}}
          {{- $lakeFSS3Bucket := $lakefs.s3Bucket | default "" -}}
          {{- $lakeFSRegion := $lakefs.region | default "us-east-1" -}}
          {{- $repoName := $appName -}}
          {{- $storageNamespace := printf "s3://%s/%s" $lakeFSS3Bucket $repoName -}}
          {{- $mlNs := printf "ml-%s" $projectName -}}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-lakefs-repo
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: lakefs-repo
              gotemplating.fn.crossplane.io/ready: "True"
            labels:
              {{- range $key, $value := $commonLabels }}
              {{ $key }}: "{{ $value }}"
              {{- end }}
          spec:
            deletionPolicy: Delete
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: batch/v1
                kind: Job
                metadata:
                  name: {{ $appName }}-lakefs-repo-init
                  namespace: {{ $mlNs }}
                  labels:
                    platform.kubecore.io/pipeline: {{ $pipelineLabel }}
                    platform.kubecore.io/type: lakefs-repo-init
                spec:
                  ttlSecondsAfterFinished: 600
                  backoffLimit: 5
                  template:
                    spec:
                      restartPolicy: OnFailure
                      nodeSelector:
                        platform.kubecore.io/system: "true"
                      tolerations:
                      - key: kubecore.eu/computation-type
                        operator: Equal
                        value: kubecore-system
                        effect: NoSchedule
                      - key: CriticalAddonsOnly
                        operator: Exists
                      - operator: Exists
                        effect: NoExecute
                      containers:
                      - name: create-repo
                        image: curlimages/curl:latest
                        command: ["/bin/sh", "-c"]
                        args:
                        - |
                          LAKEFS="{{ $lakeFSEndpoint }}/api/v1"
                          AUTH="${LAKEFS_ACCESS_KEY}:${LAKEFS_SECRET_KEY}"
                          REPO="{{ $repoName }}"

                          # Wait for lakeFS to be reachable before attempting repo creation
                          echo "Waiting for lakeFS to be ready..."
                          MAX_WAIT=300
                          WAITED=0
                          while [ $WAITED -lt $MAX_WAIT ]; do
                            if curl -sf -o /dev/null -u "${AUTH}" "${LAKEFS}/healthcheck"; then
                              echo "lakeFS is ready (took ${WAITED}s)"
                              break
                            fi
                            echo "lakeFS not ready, retrying in 5s... (${WAITED}/${MAX_WAIT}s)"
                            sleep 5
                            WAITED=$((WAITED + 5))
                          done
                          if [ $WAITED -ge $MAX_WAIT ]; then
                            echo "lakeFS not reachable after ${MAX_WAIT}s, giving up"
                            exit 1
                          fi

                          echo "Creating lakeFS repository: ${REPO}"
                          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
                            -X POST "${LAKEFS}/repositories" \
                            -H "Content-Type: application/json" \
                            -u "${AUTH}" \
                            -d "{\"name\":\"${REPO}\",\"storage_namespace\":\"{{ $storageNamespace }}\",\"default_branch\":\"main\"}")
                          if [ "$HTTP_CODE" = "201" ]; then
                            echo "Repository created successfully"
                          elif [ "$HTTP_CODE" = "409" ]; then
                            echo "Repository already exists (409) - OK"
                          elif [ "$HTTP_CODE" = "400" ] && grep -q "storage namespace already in use" /tmp/response.txt; then
                            echo "Storage namespace has stale lakeFS metadata — cleaning up and recreating"
                            # Create a bare repo to claim the namespace, then delete it to clear _lakefs metadata
                            BARE_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
                              -X POST "${LAKEFS}/repositories?bare=true" \
                              -H "Content-Type: application/json" \
                              -u "${AUTH}" \
                              -d "{\"name\":\"${REPO}\",\"storage_namespace\":\"{{ $storageNamespace }}\",\"default_branch\":\"main\"}")
                            if [ "$BARE_CODE" = "201" ] || [ "$BARE_CODE" = "409" ]; then
                              echo "Bare repo created/exists — deleting to clear stale metadata"
                              curl -s -o /dev/null -w "%{http_code}" \
                                -X DELETE "${LAKEFS}/repositories/${REPO}" \
                                -u "${AUTH}"
                              sleep 2
                              # Now create a normal repo
                              HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
                                -X POST "${LAKEFS}/repositories" \
                                -H "Content-Type: application/json" \
                                -u "${AUTH}" \
                                -d "{\"name\":\"${REPO}\",\"storage_namespace\":\"{{ $storageNamespace }}\",\"default_branch\":\"main\"}")
                              if [ "$HTTP_CODE" = "201" ]; then
                                echo "Repository created successfully after cleanup"
                              elif [ "$HTTP_CODE" = "409" ]; then
                                echo "Repository already exists (409) - OK"
                              else
                                echo "Failed to create repository after cleanup. HTTP code: $HTTP_CODE"
                                cat /tmp/response.txt
                                exit 1
                              fi
                            else
                              echo "Failed to create bare repository for cleanup. HTTP code: $BARE_CODE"
                              cat /tmp/response.txt
                              exit 1
                            fi
                          else
                            echo "Failed to create repository. HTTP code: $HTTP_CODE"
                            cat /tmp/response.txt
                            exit 1
                          fi

                          echo "Verifying main branch exists..."
                          BR_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                            -u "${AUTH}" "${LAKEFS}/repositories/${REPO}/branches/main")
                          if [ "$BR_CODE" = "200" ]; then
                            echo "Branch 'main' exists"
                          else
                            echo "Branch 'main' missing — creating with empty commit..."
                            curl -s -o /dev/null -w "%{http_code}" \
                              -X POST "${LAKEFS}/repositories/${REPO}/branches" \
                              -H "Content-Type: application/json" \
                              -u "${AUTH}" \
                              -d '{"name":"main","source":"main"}' || true
                            echo "Branch 'main' created"
                          fi
                        env:
                        - name: LAKEFS_ACCESS_KEY
                          valueFrom:
                            secretKeyRef:
                              name: {{ $projectName }}-lakefs-admin
                              key: accessKeyId
                        - name: LAKEFS_SECRET_KEY
                          valueFrom:
                            secretKeyRef:
                              name: {{ $projectName }}-lakefs-admin
                              key: secretAccessKey
                        resources:
                          requests:
                            cpu: "50m"
                            memory: "32Mi"
                          limits:
                            cpu: "100m"
                            memory: "64Mi"
          {{- end }}

  # ── Step 2.1: Create Karpenter NodePools for ML pipeline compute ──────
  - step: create-karpenter-nodepools
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $name := .observed.composite.resource.metadata.name -}}
          {{- $spec := .observed.composite.resource.spec -}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}

          {{- $appName := $spec.appName -}}
          {{- $projectName := $spec.projectName -}}
          {{- $clusterName := $spec.clusterName | default "" -}}
          {{- $region := $spec.region | default "us-east-1" -}}
          {{- $mlNs := printf "ml-%s" $projectName -}}
          {{- $pipelineLabel := printf "%s-%s" $projectName $appName -}}
          {{- $k8sProvider := $envConfig.kubernetesProviderConfig | default "" -}}

          {{/* Karpenter config from EnvironmentConfig */}}
          {{- $karpenter := $envConfig.karpenter | default dict -}}
          {{- $nodeRoleName := $karpenter.nodeRoleName | default (printf "%s-karpenter-node" $clusterName) -}}

          {{- $awsConfig := $envConfig.aws | default dict -}}
          {{- $accountId := $awsConfig.accountId | default "" -}}
          {{- $primaryRegion := $awsConfig.primaryRegion | default $region -}}

          {{/* GPU NodePool configuration from spec */}}
          {{- $gpuConfig := $spec.gpu | default dict -}}
          {{- $gpuConsolidate := $gpuConfig.consolidateAfter | default "60s" -}}
          {{- $gpuDiskSize := $gpuConfig.diskSizeGi | default 50 -}}
          {{- $gpuMaxResources := $gpuConfig.maxResources | default "2" -}}

          {{/* CPU NodePool configuration from spec */}}
          {{- $cpuConfig := $spec.cpu | default dict -}}
          {{- $cpuConsolidate := $cpuConfig.consolidateAfter | default "30s" -}}
          {{- $cpuDiskSize := $cpuConfig.diskSizeGi | default 30 -}}
          {{- $cpuMaxResources := $cpuConfig.maxResources | default "8" -}}

          {{/* Instance families/sizes from spec with fallback defaults */}}
          {{/* Families can be "g5" (full) or "g" (category only). Extract category letters and generations. */}}
          {{- $gpuInstanceFamiliesRaw := $gpuConfig.instanceFamilies | default (list "g" "p") -}}
          {{- $gpuInstanceSizes := $gpuConfig.instanceSizes | default (list "xlarge" "2xlarge" "4xlarge") -}}
          {{- $cpuInstanceFamiliesRaw := $cpuConfig.instanceFamilies | default (list "m" "c" "r") -}}
          {{- $cpuInstanceSizes := $cpuConfig.instanceSizes | default (list "large" "xlarge" "2xlarge") -}}
          {{/* Extract unique category letters (e.g., "g5" -> "g", "p" -> "p"). "*" means allow all. */}}
          {{- $gpuInstanceFamilies := list -}}
          {{- range $f := $gpuInstanceFamiliesRaw -}}
            {{- $cat := regexReplaceAll "[0-9]+" $f "" -}}
            {{- if not (has $cat $gpuInstanceFamilies) -}}
              {{- $gpuInstanceFamilies = append $gpuInstanceFamilies $cat -}}
            {{- end -}}
          {{- end -}}
          {{- $cpuInstanceFamilies := list -}}
          {{- range $f := $cpuInstanceFamiliesRaw -}}
            {{- $cat := regexReplaceAll "[0-9]+" $f "" -}}
            {{- if not (has $cat $cpuInstanceFamilies) -}}
              {{- $cpuInstanceFamilies = append $cpuInstanceFamilies $cat -}}
            {{- end -}}
          {{- end -}}
          {{- $gpuAllowAllFamilies := and (eq (len $gpuInstanceFamilies) 1) (eq (index $gpuInstanceFamilies 0) "*") -}}
          {{- $gpuAllowAllSizes := and (eq (len $gpuInstanceSizes) 1) (eq (index $gpuInstanceSizes 0) "*") -}}
          {{- $cpuAllowAllFamilies := and (eq (len $cpuInstanceFamilies) 1) (eq (index $cpuInstanceFamilies 0) "*") -}}
          {{- $cpuAllowAllSizes := and (eq (len $cpuInstanceSizes) 1) (eq (index $cpuInstanceSizes 0) "*") -}}

          {{- if and $k8sProvider $clusterName }}
          ---
          # EC2NodeClass for GPU nodes
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-gpu-nodeclass
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: gpu-nodeclass
            labels:
              platform.kubecore.io/project: {{ $projectName }}
              platform.kubecore.io/pipeline: {{ $pipelineLabel }}
              platform.kubecore.io/resource-type: karpenter-nodeclass
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: karpenter.k8s.aws/v1
                kind: EC2NodeClass
                metadata:
                  name: {{ $pipelineLabel }}-gpu
                  labels:
                    platform.kubecore.io/pipeline: {{ $pipelineLabel }}
                    platform.kubecore.io/compute-type: gpu
                spec:
                  role: {{ $nodeRoleName }}
                  amiSelectorTerms:
                  - alias: al2023@latest
                  subnetSelectorTerms:
                  - tags:
                      kubernetes.io/cluster/{{ $clusterName }}: owned
                      platform.kubecore.io/subnet-type: private
                  securityGroupSelectorTerms:
                  - tags:
                      kubernetes.io/cluster/{{ $clusterName }}: owned
                  blockDeviceMappings:
                  - deviceName: /dev/xvda
                    ebs:
                      volumeSize: {{ $gpuDiskSize }}Gi
                      volumeType: gp3
                      deleteOnTermination: true
                  tags:
                    platform.kubecore.io/pipeline: {{ $pipelineLabel }}
                    platform.kubecore.io/compute-type: gpu
          ---
          # Karpenter NodePool for GPU workloads
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-gpu-nodepool
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: gpu-nodepool
            labels:
              platform.kubecore.io/project: {{ $projectName }}
              platform.kubecore.io/pipeline: {{ $pipelineLabel }}
              platform.kubecore.io/resource-type: karpenter-nodepool
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: karpenter.sh/v1
                kind: NodePool
                metadata:
                  name: {{ $pipelineLabel }}-gpu
                  labels:
                    platform.kubecore.io/pipeline: {{ $pipelineLabel }}
                    platform.kubecore.io/compute-type: gpu
                spec:
                  template:
                    metadata:
                      labels:
                        platform.kubecore.io/pipeline: {{ $pipelineLabel }}
                        platform.kubecore.io/compute-type: gpu
                    spec:
                      nodeClassRef:
                        group: karpenter.k8s.aws
                        kind: EC2NodeClass
                        name: {{ $pipelineLabel }}-gpu
                      taints:
                      - key: nvidia.com/gpu
                        effect: NoSchedule
                      requirements:
                      - key: karpenter.sh/capacity-type
                        operator: In
                        values: ["on-demand"]
                      {{- if not $gpuAllowAllFamilies }}
                      - key: karpenter.k8s.aws/instance-category
                        operator: In
                        values: {{ $gpuInstanceFamilies | toJson }}
                      {{- end }}
                      - key: karpenter.k8s.aws/instance-generation
                        operator: In
                        values: ["5", "6", "7", "8"]
                      {{- if not $gpuAllowAllSizes }}
                      - key: karpenter.k8s.aws/instance-size
                        operator: In
                        values: {{ $gpuInstanceSizes | toJson }}
                      {{- end }}
                      - key: kubernetes.io/arch
                        operator: In
                        values: ["amd64"]
                  limits:
                    nvidia.com/gpu: {{ $gpuMaxResources | quote }}
                  disruption:
                    consolidationPolicy: WhenEmpty
                    consolidateAfter: {{ $gpuConsolidate }}
          ---
          # EC2NodeClass for CPU burst nodes
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cpu-nodeclass
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cpu-nodeclass
            labels:
              platform.kubecore.io/project: {{ $projectName }}
              platform.kubecore.io/pipeline: {{ $pipelineLabel }}
              platform.kubecore.io/resource-type: karpenter-nodeclass
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: karpenter.k8s.aws/v1
                kind: EC2NodeClass
                metadata:
                  name: {{ $pipelineLabel }}-cpu
                  labels:
                    platform.kubecore.io/pipeline: {{ $pipelineLabel }}
                    platform.kubecore.io/compute-type: cpu-burst
                spec:
                  role: {{ $nodeRoleName }}
                  amiSelectorTerms:
                  - alias: al2023@latest
                  subnetSelectorTerms:
                  - tags:
                      kubernetes.io/cluster/{{ $clusterName }}: owned
                      platform.kubecore.io/subnet-type: private
                  securityGroupSelectorTerms:
                  - tags:
                      kubernetes.io/cluster/{{ $clusterName }}: owned
                  blockDeviceMappings:
                  - deviceName: /dev/xvda
                    ebs:
                      volumeSize: {{ $cpuDiskSize }}Gi
                      volumeType: gp3
                      deleteOnTermination: true
                  tags:
                    platform.kubecore.io/pipeline: {{ $pipelineLabel }}
                    platform.kubecore.io/compute-type: cpu-burst
          ---
          # Karpenter NodePool for CPU burst workloads
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-cpu-nodepool
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cpu-nodepool
            labels:
              platform.kubecore.io/project: {{ $projectName }}
              platform.kubecore.io/pipeline: {{ $pipelineLabel }}
              platform.kubecore.io/resource-type: karpenter-nodepool
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: karpenter.sh/v1
                kind: NodePool
                metadata:
                  name: {{ $pipelineLabel }}-cpu
                  labels:
                    platform.kubecore.io/pipeline: {{ $pipelineLabel }}
                    platform.kubecore.io/compute-type: cpu-burst
                spec:
                  template:
                    metadata:
                      labels:
                        platform.kubecore.io/pipeline: {{ $pipelineLabel }}
                        platform.kubecore.io/compute-type: cpu-burst
                    spec:
                      nodeClassRef:
                        group: karpenter.k8s.aws
                        kind: EC2NodeClass
                        name: {{ $pipelineLabel }}-cpu
                      taints:
                      - key: platform.kubecore.io/burst
                        value: "true"
                        effect: NoSchedule
                      requirements:
                      - key: karpenter.sh/capacity-type
                        operator: In
                        values: ["on-demand"]
                      {{- if not $cpuAllowAllFamilies }}
                      - key: karpenter.k8s.aws/instance-category
                        operator: In
                        values: {{ $cpuInstanceFamilies | toJson }}
                      {{- end }}
                      - key: karpenter.k8s.aws/instance-generation
                        operator: In
                        values: ["5", "6", "7", "8"]
                      {{- if not $cpuAllowAllSizes }}
                      - key: karpenter.k8s.aws/instance-size
                        operator: In
                        values: {{ $cpuInstanceSizes | toJson }}
                      {{- end }}
                      - key: kubernetes.io/arch
                        operator: In
                        values: ["amd64"]
                  limits:
                    cpu: {{ $cpuMaxResources | quote }}
                  disruption:
                    consolidationPolicy: WhenEmpty
                    consolidateAfter: {{ $cpuConsolidate }}
          {{- end }}

  # ── Step 2.2: ML pipeline cost recording rules (VMRule) ────────────────
  - step: create-ml-cost-vmrule
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $name := .observed.composite.resource.metadata.name -}}
          {{- $spec := .observed.composite.resource.spec -}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}

          {{- $projectName := $spec.projectName -}}
          {{- $appName := $spec.appName -}}
          {{- $pipelineLabel := printf "%s-%s" $projectName $appName -}}
          {{- $mlNs := printf "ml-%s" $projectName -}}
          {{- $k8sProvider := $envConfig.kubernetesProviderConfig | default "" -}}

          {{- $features := $envConfig.features | default dict -}}
          {{- $observabilityEnabled := true -}}
          {{- if hasKey $features "observability" -}}
            {{- $observabilityEnabled = $features.observability -}}
          {{- end -}}

          {{- $vm := $envConfig.tools.victoriametrics | default dict -}}
          {{- $vmNamespace := $vm.namespace | default "observability" -}}

          {{- if and $k8sProvider $vm.enabled $observabilityEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-ml-cost-vmrule
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ml-cost-vmrule
            labels:
              platform.kubecore.io/project: {{ $projectName }}
              platform.kubecore.io/pipeline: {{ $pipelineLabel }}
              platform.kubecore.io/resource-type: vmrule
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: operator.victoriametrics.com/v1beta1
                kind: VMRule
                metadata:
                  name: kubecore-ml-pipeline-cost
                  namespace: {{ $vmNamespace }}
                  labels:
                    platform.kubecore.io/component: "observability"
                spec:
                  groups:
                  - name: kubecore-ml-pipeline-cost
                    rules:
                    # ── Pipeline cost: hourly burn rate per compute type ──
                    - record: kubecore:ml:pipeline_cost_per_hour
                      expr: |
                        label_replace(
                          label_replace(
                            sum by (nodepool) (
                              count by (instance_type, capacity_type, nodepool) (
                                max by (instance_type, capacity_type, nodepool, node_name) (karpenter_nodes_allocatable{nodepool=~"{{ $pipelineLabel }}-(gpu|cpu)",resource_type="cpu"})
                              )
                              * on(instance_type, capacity_type) group_left()
                              max by (instance_type, capacity_type) (
                                karpenter_cloudprovider_instance_type_offering_price_estimate{capacity_type="on-demand"}
                              )
                            ),
                            "compute_type", "$1", "nodepool", ".*-(gpu|cpu)"
                          ),
                          "pipeline", "$1", "nodepool", "(.*)-(?:gpu|cpu)"
                        )
                    - record: kubecore:ml:pipeline_gpu_cost_per_hour
                      expr: |
                        kubecore:ml:pipeline_cost_per_hour{compute_type="gpu"}
                    - record: kubecore:ml:pipeline_cpu_cost_per_hour
                      expr: |
                        kubecore:ml:pipeline_cost_per_hour{compute_type!="gpu"}
                    # ── Active node counts ──
                    - record: kubecore:ml:pipeline_active_nodes
                      expr: |
                        label_replace(
                          label_replace(
                            count by (nodepool) (
                              karpenter_nodes_allocatable{nodepool=~"{{ $pipelineLabel }}-(gpu|cpu)",resource_type="cpu"}
                            ),
                            "compute_type", "$1", "nodepool", ".*-(gpu|cpu)"
                          ),
                          "pipeline", "$1", "nodepool", "(.*)-(?:gpu|cpu)"
                        )
                    # ── Cost estimates (derived from base rule) ──
                    - record: kubecore:ml:pipeline_cost_daily_estimate
                      expr: |
                        sum_over_time(kubecore:ml:pipeline_cost_per_hour[24h]) / 24
                    - record: kubecore:ml:pipeline_cost_monthly_estimate
                      expr: |
                        sum_over_time(kubecore:ml:pipeline_cost_per_hour[30d]) / 30
                    # ── Resource tracking ──
                    - record: kubecore:ml:pipeline_gpu_hours
                      expr: |
                        label_replace(
                          sum by (nodepool) (
                            karpenter_nodes_allocatable{nodepool="{{ $pipelineLabel }}-gpu",resource_type="nvidia.com/gpu"}
                          ),
                          "pipeline", "$1", "nodepool", "(.*)-gpu"
                        )
                    - record: kubecore:ml:pipeline_cpu_hours
                      expr: |
                        label_replace(
                          sum by (nodepool) (
                            karpenter_nodes_allocatable{nodepool="{{ $pipelineLabel }}-cpu",resource_type="cpu"}
                          ),
                          "pipeline", "$1", "nodepool", "(.*)-cpu"
                        )
                    - record: kubecore:ml:pipeline_gpu_memory_gb_hours
                      expr: |
                        label_replace(
                          sum by (nodepool) (
                            karpenter_nodes_allocatable{nodepool="{{ $pipelineLabel }}-gpu",resource_type="memory"}
                          ) / 1073741824,
                          "pipeline", "$1", "nodepool", "(.*)-gpu"
                        )
                    # ── Utilization ──
                    - record: kubecore:ml:pipeline_gpu_utilization
                      expr: |
                        label_replace(
                          sum by (nodepool) (
                            karpenter_nodes_total_pod_requests{nodepool="{{ $pipelineLabel }}-gpu",resource_type="nvidia.com/gpu"}
                          )
                          /
                          clamp_min(
                            max by (nodepool) (
                              karpenter_nodepools_limit{nodepool="{{ $pipelineLabel }}-gpu",resource_type="nvidia.com/gpu"}
                            ),
                            1
                          ),
                          "pipeline", "$1", "nodepool", "(.*)-gpu"
                        )
                    - record: kubecore:ml:pipeline_cpu_utilization
                      expr: |
                        label_replace(
                          sum by (nodepool) (
                            karpenter_nodes_total_pod_requests{nodepool="{{ $pipelineLabel }}-cpu",resource_type="cpu"}
                          )
                          /
                          clamp_min(
                            max by (nodepool) (
                              karpenter_nodepools_limit{nodepool="{{ $pipelineLabel }}-cpu",resource_type="cpu"}
                            ),
                            1
                          ),
                          "pipeline", "$1", "nodepool", "(.*)-cpu"
                        )
                    # ── Total cost: per-nodepool 30d spend (price/hr × lifetime_hours) ──
                    - record: kubecore:ml:workflow_cost_total
                      expr: |
                        label_replace(
                          label_replace(
                            sum by (nodepool) (
                              last_over_time(karpenter_nodes_allocatable{nodepool=~"{{ $pipelineLabel }}-(gpu|cpu)",resource_type="cpu"}[30d])
                              * on(instance_type, capacity_type) group_left()
                              max by (instance_type, capacity_type) (
                                karpenter_cloudprovider_instance_type_offering_price_estimate{capacity_type="on-demand"}
                              )
                              * on(node_name) group_left()
                              max by (node_name) (
                                last_over_time(karpenter_nodes_current_lifetime_seconds{nodepool=~"{{ $pipelineLabel }}-(gpu|cpu)"}[30d]) / 3600
                              )
                            ),
                            "compute_type", "$1", "nodepool", ".*-(gpu|cpu)"
                          ),
                          "pipeline", "$1", "nodepool", "(.*)-(?:gpu|cpu)"
                        )
                    # ── Per-node cost breakdown with 30d persistence ──
                    - record: kubecore:ml:pipeline_node_cost
                      expr: |
                        label_replace(
                          label_replace(
                            last_over_time(karpenter_nodes_allocatable{nodepool=~"{{ $pipelineLabel }}-(gpu|cpu)",resource_type="cpu"}[30d])
                            * on(instance_type, capacity_type) group_left()
                            max by (instance_type, capacity_type) (
                              karpenter_cloudprovider_instance_type_offering_price_estimate{capacity_type="on-demand"}
                            )
                            * on(node_name) group_left()
                            max by (node_name) (
                              last_over_time(karpenter_nodes_current_lifetime_seconds{nodepool=~"{{ $pipelineLabel }}-(gpu|cpu)"}[30d]) / 3600
                            ),
                            "compute_type", "$1", "nodepool", ".*-(gpu|cpu)"
                          ),
                          "pipeline", "$1", "nodepool", "(.*)-(?:gpu|cpu)"
                        )
                    # ── Per-step resource tracking rules ──
                    # CPU cores requested per pipeline step (for cost attribution)
                    - record: kubecore:ml:step_cpu_requests
                      expr: |
                        label_replace(
                          label_replace(
                            label_replace(
                              sum by (label_platform_kubecore_io_step, label_platform_kubecore_io_compute_type, label_platform_kubecore_io_pipeline) (
                                kube_pod_container_resource_requests{resource="cpu", container="main"}
                                * on(pod, namespace) group_left(label_platform_kubecore_io_pipeline, label_platform_kubecore_io_step, label_platform_kubecore_io_compute_type)
                                kube_pod_labels{label_platform_kubecore_io_step!=""}
                              ),
                              "step", "$1", "label_platform_kubecore_io_step", "(.*)"
                            ),
                            "pipeline", "$1", "label_platform_kubecore_io_pipeline", "(.*)"
                          ),
                          "compute_type", "$1", "label_platform_kubecore_io_compute_type", "(.*)"
                        )
                    # CPU cores per step per workflow run (for per-run cost)
                    - record: kubecore:ml:workflow_run_cpu_requests
                      expr: |
                        label_replace(
                          label_replace(
                            label_replace(
                              label_replace(
                                sum by (label_platform_kubecore_io_pipeline, label_workflows_argoproj_io_workflow, label_platform_kubecore_io_step, label_platform_kubecore_io_compute_type) (
                                  kube_pod_container_resource_requests{resource="cpu", container="main"}
                                  * on(pod, namespace) group_left(label_platform_kubecore_io_pipeline, label_platform_kubecore_io_step, label_platform_kubecore_io_compute_type, label_workflows_argoproj_io_workflow)
                                  kube_pod_labels{label_platform_kubecore_io_step!=""}
                                ),
                                "step", "$1", "label_platform_kubecore_io_step", "(.*)"
                              ),
                              "pipeline", "$1", "label_platform_kubecore_io_pipeline", "(.*)"
                            ),
                            "workflow", "$1", "label_workflows_argoproj_io_workflow", "(.*)"
                          ),
                          "compute_type", "$1", "label_platform_kubecore_io_compute_type", "(.*)"
                        )
          {{- end }}


  # ── Step 2.3: Per-pipeline ML cost Grafana dashboard ─────────────────────
  - step: create-ml-pipeline-dashboard
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $name := .observed.composite.resource.metadata.name -}}
          {{- $spec := .observed.composite.resource.spec -}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}

          {{- $projectName := $spec.projectName -}}
          {{- $appName := $spec.appName -}}
          {{- $clusterName := $spec.clusterName -}}
          {{- $pipelineLabel := printf "%s-%s" $projectName $appName -}}
          {{- $mlNs := printf "ml-%s" $projectName -}}
          {{- $k8sProvider := $envConfig.kubernetesProviderConfig | default "" -}}

          {{- $features := $envConfig.features | default dict -}}
          {{- $observabilityEnabled := true -}}
          {{- if hasKey $features "observability" -}}
            {{- $observabilityEnabled = $features.observability -}}
          {{- end -}}

          {{- $vm := $envConfig.tools.victoriametrics | default dict -}}
          {{- $vmNamespace := $vm.namespace | default "observability" -}}
          {{- $grafana := $vm.grafana | default dict -}}
          {{- $grafanaUrl := $grafana.url | default "" -}}

          {{- $gpuConfig := $spec.gpu | default dict -}}
          {{- $cpuConfig := $spec.cpu | default dict -}}
          {{- $gpuFamilies := join ", " ($gpuConfig.instanceFamilies | default (list "g" "p")) -}}
          {{- $gpuSizes := join ", " ($gpuConfig.instanceSizes | default (list "xlarge" "2xlarge" "4xlarge")) -}}
          {{- $cpuFamilies := join ", " ($cpuConfig.instanceFamilies | default (list "m" "c" "r")) -}}
          {{- $cpuSizes := join ", " ($cpuConfig.instanceSizes | default (list "large" "xlarge" "2xlarge")) -}}

          {{- if and $k8sProvider $vm.enabled $observabilityEnabled }}
          ---
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-ml-pipeline-dashboard
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ml-pipeline-dashboard
            labels:
              platform.kubecore.io/project: {{ $projectName }}
              platform.kubecore.io/pipeline: {{ $pipelineLabel }}
              platform.kubecore.io/resource-type: grafana-dashboard
          spec:
            deletionPolicy: Orphan
            managementPolicies: ["*"]
            providerConfigRef:
              name: {{ $k8sProvider }}
            forProvider:
              manifest:
                apiVersion: grafana.integreatly.org/v1beta1
                kind: GrafanaDashboard
                metadata:
                  name: {{ $pipelineLabel }}-ml-cost
                  namespace: {{ $vmNamespace }}
                  labels:
                    platform.kubecore.io/component: "observability"
                spec:
                  folderRef: {{ $clusterName }}-ml-pipelines
                  instanceSelector:
                    matchLabels:
                      dashboards: "kubecore-grafana"
                  json: |
                    {
                      "uid": "ml-{{ $appName }}",
                      "title": "{{ $pipelineLabel }} - ML Pipeline Cost",
                      "tags": ["kubecore", "ml", "karpenter", "{{ $projectName }}", "{{ $appName }}"],
                      "time": { "from": "now-6h", "to": "now" },
                      "timezone": "browser",
                      "schemaVersion": 39,
                      "version": 1,
                      "refresh": "30s",
                      "templating": { "list": [] },
                      "panels": [
                        {"id":1,"type":"row","title":"Dedicated Infrastructure (MLflow, LakeFS, PostgreSQL)","collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":0}},
                        {
                          "id": 2,
                          "type": "stat",
                          "title": "Infra $/hr",
                          "description": "Current hourly burn rate for always-on infra nodes.",
                          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
                          "datasource": null,
                          "targets": [
                            {
                              "datasource": null,
                              "expr": "sum(count by (instance_type, capacity_type) (max by (instance_type, capacity_type, node_name) (karpenter_nodes_allocatable{nodepool=~\u0022.*ml-infra\u0022,resource_type=\u0022cpu\u0022})) * on(instance_type, capacity_type) group_left() max by (instance_type, capacity_type) (karpenter_cloudprovider_instance_type_offering_price_estimate))"
                            }
                          ],
                          "fieldConfig": {
                            "defaults": {
                              "unit": "currencyUSD",
                              "decimals": 4,
                              "noValue": "$0.00",
                              "color": { "fixedColor": "blue", "mode": "fixed" }
                            },
                            "overrides": []
                          },
                          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
                        },
                        {
                          "id": 3,
                          "type": "stat",
                          "title": "Infra Total Spent",
                          "description": "Total $ spent on infra since node creation. Formula: hourly_price \u00d7 node_uptime_hours.",
                          "gridPos": { "h": 4, "w": 5, "x": 4, "y": 1 },
                          "datasource": null,
                          "targets": [
                            {
                              "datasource": null,
                              "expr": "sum(count by (instance_type, capacity_type, node_name) (max by (instance_type, capacity_type, node_name) (karpenter_nodes_allocatable{nodepool=~\u0022.*ml-infra\u0022,resource_type=\u0022cpu\u0022})) * on(instance_type, capacity_type) group_left() max by (instance_type, capacity_type) (karpenter_cloudprovider_instance_type_offering_price_estimate) * on(node_name) group_left() (karpenter_nodes_current_lifetime_seconds{nodepool=~\u0022.*ml-infra\u0022} / 3600))"
                            }
                          ],
                          "fieldConfig": {
                            "defaults": {
                              "unit": "currencyUSD",
                              "decimals": 2,
                              "noValue": "$0.00",
                              "color": { "mode": "thresholds" },
                              "thresholds": {
                                "mode": "absolute",
                                "steps": [
                                  { "color": "green", "value": null },
                                  { "color": "yellow", "value": 50 },
                                  { "color": "red", "value": 200 }
                                ]
                              }
                            },
                            "overrides": []
                          },
                          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
                        },
                        {
                          "id": 4,
