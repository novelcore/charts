                          "title": "Nodes",
                          "gridPos": { "h": 4, "w": 2, "x": 12, "y": 1 },
                          "datasource": null,
                          "targets": [
                            {
                              "datasource": null,
                              "expr": "sum(karpenter_nodepools_usage{nodepool=~\u0022.*ml-infra\u0022,resource_type=\u0022nodes\u0022})"
                            }
