apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: githubprovider
  labels:
    platform.kubecore.io/type: githubprovider
    provider: github
    service: github-infrastructure
    layer: platform
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: github.platform.kubecore.io/v1alpha1
    kind: XGithubProvider
  mode: Pipeline
  pipeline:
  # Fixed environment config selector to use aws-config type
  - step: load-environment-configs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Selector
          selector:
            matchLabels:
            - key: platform.kubecore.io/type
              type: Value
              value: aws-config
            - key: platform.kubecore.io/kubeorg
              type: FromCompositeFieldPath
              valueFromFieldPath: spec.organizationName

              
  # Step 2: Generate GitHub resources with Go Templates
  - step: generate-github-resources
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $org := .observed.composite.resource.spec.organizationName -}}
          {{- $uid := .observed.composite.resource.metadata.uid -}}
          {{- $name := .observed.composite.resource.metadata.name -}}
          
          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found in annotation" -}}
          {{- end -}}
          
          {{- $secretStoreRef := $envConfig.secretStoreRef -}}
          {{- $aws := $envConfig.aws -}}
          {{- $secret := $envConfig.secret -}}
          {{- $refreshInterval := $envConfig.refreshInterval -}}
          {{- $kubernetesProviderConfigRef := $envConfig.kubernetesProviderConfig -}}
          {{- $github := $envConfig.github -}}
          
          {{/* Default values */}}
          {{- $baseURL := "https://api.github.com" -}}
          {{- $isEnterprise := false -}}
          {{- if $github.baseURL -}}
            {{- $baseURL = $github.baseURL -}}
          {{- end -}}
          {{- if $github.isEnterprise -}}
            {{- $isEnterprise = $github.isEnterprise -}}
          {{- end -}}

          ---
          # 0. PushSecret to sync Kubernetes secret to AWS Secrets Manager
          apiVersion: kubernetes.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: {{ $name }}-pushsecret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: pushsecret
              sequence.fn.crossplane.io/group: github-credentials-sync
              crossplane.io/external-name: {{ $name }}-pushsecret
          spec:
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1alpha1
                kind: PushSecret
                metadata:
                  name: github-pushsecret-{{ $name }}
                  namespace: {{ $envConfig.sourceSecret.namespace }}
                  labels:
                    platform.kubecore.io/managed-by: githubprovider
                    platform.kubecore.io/organization: {{ $org }}
                spec:
                  deletionPolicy: Delete  # Delete from AWS when PushSecret is deleted
                  refreshInterval: {{ $refreshInterval }}
                  secretStoreRefs:
                  - kind: {{ $secretStoreRef.kind }}
                    name: {{ $secretStoreRef.name }}
                  selector:
                    secret:
                      name: {{ $envConfig.sourceSecret.name }}
                  data:
                  - match:
                      secretKey: appId
                      remoteRef:
                        remoteKey: {{ $aws.secretId }}
                        property: appId
                  - match:
                      secretKey: installationId
                      remoteRef:
                        remoteKey: {{ $aws.secretId }}
                        property: installationId
                  - match:
                      secretKey: privateKey
                      remoteRef:
                        remoteKey: {{ $aws.secretId }}
                        property: privateKey
            providerConfigRef:
              name: {{ $kubernetesProviderConfigRef }}

          ---
          # 1. External Secret to retrieve GitHub App credentials from AWS Secrets Manager
          apiVersion: kubernetes.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: {{ $name }}-externalsecret
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: externalsecret
              sequence.fn.crossplane.io/group: github-credentials
              sequence.fn.crossplane.io/depends-on: github-credentials-sync
              crossplane.io/external-name: {{ $name }}-externalsecret
          spec:
            forProvider:
              manifest:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: github-externalsecret-{{ $name }}
                  namespace: crossplane-system
                  labels:
                    platform.kubecore.io/managed-by: githubprovider
                    platform.kubecore.io/organization: {{ $org }}
                spec:
                  refreshInterval: {{ $refreshInterval }}
                  secretStoreRef:
                    kind: {{ $secretStoreRef.kind }}
                    name: {{ $secretStoreRef.name }}
                  target:
                    name: github-provider-{{ $name }}
                    creationPolicy: Owner
                    template:
                      type: Opaque
                      engineVersion: v2
                      data:
                        credentials: '{{ "{{" }} dict "app_auth" (list (dict "id" .appId "installation_id" .installationId "pem_file" .privateKey)) "owner" "{{ $org }}" | toJson {{ "}}" }}'
                  data:
                  - secretKey: appId
                    remoteRef:
                      key: {{ $aws.secretId }}
                      property: appId
                  - secretKey: installationId
                    remoteRef:
                      key: {{ $aws.secretId }}
                      property: installationId
                  - secretKey: privateKey
                    remoteRef:
                      key: {{ $aws.secretId }}
                      property: privateKey
            providerConfigRef:
              name: {{ $kubernetesProviderConfigRef }}
          
          ---
          # 2. GitHub ProviderConfig that points to the generated secret
          apiVersion: kubernetes.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: {{ $name }}-providerconfig
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: github-providerconfig
              sequence.fn.crossplane.io/group: github-providerconfig
              sequence.fn.crossplane.io/depends-on: github-credentials
              crossplane.io/external-name: {{ $name }}-providerconfig
          spec:
            forProvider:
              manifest:
                apiVersion: github.upbound.io/v1beta1
                kind: ProviderConfig
                metadata:
                  name: {{ $name }}-providerconfig
                  labels:
                    platform.kubecore.io/managed-by: githubprovider
                    platform.kubecore.io/organization: {{ $org }}
                spec:
                  credentials:
                    source: Secret
                    secretRef:
                      namespace: crossplane-system
                      name: github-provider-{{ $name }}
                      key: {{ $secret.key }}
            providerConfigRef:
              name: {{ $kubernetesProviderConfigRef }}
          
          ---
          # 3. Connection secret for the provider config name and metadata
          apiVersion: kubernetes.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: {{ $name }}-connection
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: connection-secret
              sequence.fn.crossplane.io/group: github-metadata
              sequence.fn.crossplane.io/depends-on: github-providerconfig
              crossplane.io/external-name: {{ $name }}-connection
          spec:
            forProvider:
              manifest:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: {{ $name }}-connection
                  namespace: crossplane-system
                  labels:
                    platform.kubecore.io/managed-by: githubprovider
                    platform.kubecore.io/organization: {{ $org }}
                type: Opaque
                stringData:
                  providerConfigName: {{ $name }}-providerconfig
                  organization: {{ $org }}
                  baseURL: {{ $baseURL }}
                  isEnterprise: "{{ $isEnterprise }}"
            providerConfigRef:
              name: {{ $kubernetesProviderConfigRef }}

  # Step 3: Auto-ready function to check resource readiness
  - step: auto-ready
    functionRef:
      name: function-auto-ready

  # Step 4: Sequencer function to ensure proper resource creation ordering
  - step: sequencer
    functionRef:
      name: function-sequencer

  # Step 5: Status Transformer - Extract status information and populate composite resource status
  - step: status-transformer
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $org := .observed.composite.resource.spec.organizationName -}}
          {{- $name := .observed.composite.resource.metadata.name -}}

          {{/* Extract configuration from environment config */}}
          {{- $envConfig := index .context "apiextensions.crossplane.io/environment" -}}
          {{- if not $envConfig -}}
            {{- fail "Environment configuration not found in annotation" -}}
          {{- end -}}

          {{/* Extract GitHub configuration values */}}
          {{- $github := $envConfig.github -}}
          {{- $baseURL := "https://api.github.com" -}}
          {{- $isEnterprise := false -}}
          {{- if $github -}}
            {{- if $github.baseURL -}}
              {{- $baseURL = $github.baseURL -}}
            {{- end -}}
            {{- if $github.isEnterprise -}}
              {{- $isEnterprise = $github.isEnterprise -}}
            {{- end -}}
          {{- end -}}

          {{/* Initialize variables for collecting status information */}}
          {{- $childResourcesCount := 0 -}}
          {{- $childResourcesList := list -}}
          {{- $isReady := true -}}
          {{- $externalSecretReady := false -}}
          {{- $providerConfigReady := false -}}
          {{- $connectionSecretReady := false -}}
          {{- $secretReady := false -}}

          {{/* Iterate through observed resources to extract status */}}
          {{- range $resourceName, $resource := .observed.resources -}}
            {{- if $resource.resource -}}
              {{/* Count child resources */}}
              {{- $childResourcesCount = add $childResourcesCount 1 -}}
              {{- $childResource := dict "name" $resourceName "kind" $resource.resource.kind -}}
              {{- if $resource.resource.apiVersion -}}
                {{- $_ := set $childResource "apiVersion" $resource.resource.apiVersion -}}
              {{- end -}}

              {{/* Check resource readiness */}}
              {{- $resourceReady := false -}}
              {{- if $resource.ready -}}
                {{- $resourceReady = true -}}
                {{- $_ := set $childResource "ready" true -}}
              {{- else if and $resource.resource $resource.resource.status -}}
                {{/* Check for Ready condition */}}
                {{- if and $resource.resource.status.conditions -}}
                  {{- range $condition := $resource.resource.status.conditions -}}
                    {{- if and (eq $condition.type "Ready") (eq $condition.status "True") -}}
                      {{- $resourceReady = true -}}
                      {{- $_ := set $childResource "ready" true -}}
                    {{- end -}}
                  {{- end -}}
                {{- end -}}
                {{/* Check for Kubernetes Object status patterns */}}
                {{- if and (not $resourceReady) $resource.resource.spec.forProvider.manifest -}}
                  {{- if and $resource.resource.status.atProvider.manifest $resource.resource.status.atProvider.manifest.status -}}
                    {{- if $resource.resource.status.atProvider.manifest.status.conditions -}}
                      {{- range $condition := $resource.resource.status.atProvider.manifest.status.conditions -}}
                        {{- if and (eq $condition.type "Ready") (eq $condition.status "True") -}}
                          {{- $resourceReady = true -}}
                          {{- $_ := set $childResource "ready" true -}}
                        {{- end -}}
                      {{- end -}}
                    {{- end -}}
                  {{- end -}}
                {{- end -}}
              {{- end -}}

              {{/* Set readiness for the resource */}}
              {{- if not $resourceReady -}}
                {{- $_ := set $childResource "ready" false -}}
                {{- $isReady = false -}}
              {{- end -}}
              {{- $childResourcesList = append $childResourcesList $childResource -}}

              {{/* Track specific resource readiness */}}
              {{- if eq $resourceName "externalsecret" -}}
                {{- $externalSecretReady = $resourceReady -}}
                {{- $secretReady = $resourceReady -}}
              {{- else if eq $resourceName "github-providerconfig" -}}
                {{- $providerConfigReady = $resourceReady -}}
              {{- else if eq $resourceName "connection-secret" -}}
                {{- $connectionSecretReady = $resourceReady -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}

          # Update composite resource status with collected data
          ---
          apiVersion: {{ .observed.composite.resource.apiVersion }}
          kind: {{ .observed.composite.resource.kind }}
          metadata:
            name: {{ .observed.composite.resource.metadata.name }}
          status:
            # Overall readiness
            ready: {{ $isReady }}

            # Provider configuration information
            providerConfigName: {{ $name }}-providerconfig
            providerConfigApiGroup: github.upbound.io/v1beta1

            # Resource names
            externalSecretName: github-externalsecret-{{ $name }}
            connectionSecretName: {{ $name }}-connection

            # GitHub credentials status
            githubCredentials:
              secretReady: {{ $secretReady }}
              {{- if $secretReady }}
              lastRefresh: {{ now | date "2006-01-02T15:04:05Z" | quote }}
              {{- end }}
              awsSecretId: {{ $envConfig.aws.secretId | quote }}
              credentialsSecretKey: {{ $envConfig.secret.key | quote }}
              awsAttributeKeys:
                appIdKey: "appId"
                installationIdKey: "installationId"
                privateKeyKey: "privateKey"

            # GitHub configuration from environment
            organization: {{ $org | quote }}
            baseURL: {{ $baseURL | quote }}
            isEnterprise: {{ $isEnterprise }}

            # Child resources summary
            childResources:
              total: {{ $childResourcesCount }}
              {{- if gt (len $childResourcesList) 0 }}
              resources: {{ toJson $childResourcesList | quote }}
              {{- end }}