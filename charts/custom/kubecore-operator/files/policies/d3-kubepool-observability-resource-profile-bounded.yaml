apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d3-kubepool-observability-resource-profile-bounded
  annotations:
    kubecore.io/catalog-domain: "D3"
    kubecore.io/catalog-id: "d3-kubepool-observability-resource-profile-bounded"
    kubecore.io/evidence-ref: "api/v1beta1/kubepool_types.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "VMCluster (vmstorage/vmselect/vminsert) sizing tier for the observability stack; CRD enum (small/medium/large) — Kyverno mirrors as defense-in-depth + named policy for tenant deny messages."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubePool"
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d3-kubepool-observability-resource-profile-bounded
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
            - KubePool
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: AnyIn
        value:
        - CREATE
        - UPDATE
      - key: "{{ request.object.spec.observability.resourceProfile || '' }}"
        operator: NotEquals
        value: ""
    validate:
      allowExistingViolations: true
      message: "Field spec.observability.resourceProfile on KubePool must lie within the bounded set (catalog: d3-kubepool-observability-resource-profile-bounded, domain: D3). See PRD-310."
      deny:
        conditions:
          any:
          - key: "{{ request.object.spec.observability.resourceProfile }}"
            operator: AnyNotIn
            value:
            - "large"
            - "medium"
            - "small"

