apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d2-kubepool-operators-redis-immutable
  annotations:
    kubecore.io/catalog-domain: "D2"
    kubecore.io/catalog-id: "d2-kubepool-operators-redis-immutable"
    kubecore.io/evidence-ref: "knowledge/prds/310-kyverno-admission-policy-layer.md"
    kubecore.io/migration-issue: "#344"
    kubecore.io/migration-status: "unimplemented"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Toggling redis off tears down the shared Redis Release, which any KubeApp connection depends on via ToolBinding — every bound consumer goes CapabilityMissing (Ready-blocking since F-13, #987). Migration unimplemented (#344)."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubePool"
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d2-kubepool-operators-redis-immutable
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
            - KubePool
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      allowExistingViolations: true
      message: "Field spec.operators.redis on KubePool is immutable (catalog: d2-kubepool-operators-redis-immutable, domain: D2). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ contains(keys(request.oldObject.spec.operators || `{}`), 'redis') }}"
            operator: Equals
            value: true
          - key: "{{ to_string(request.object.spec.operators.redis) }}"
            operator: NotEquals
            value: "{{ to_string(request.oldObject.spec.operators.redis) }}"

