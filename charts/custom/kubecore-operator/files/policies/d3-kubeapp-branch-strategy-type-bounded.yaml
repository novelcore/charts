apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d3-kubeapp-branch-strategy-type-bounded
  annotations:
    kubecore.io/catalog-domain: "D3"
    kubecore.io/catalog-id: "d3-kubeapp-branch-strategy-type-bounded"
    kubecore.io/evidence-ref: "api/v1beta1/kubeapp_types.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "CI/CD branch-strategy topology; bounded to the workflows the operator implements."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeApp"
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d3-kubeapp-branch-strategy-type-bounded
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
            - KubeApp
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: AnyIn
        value:
        - CREATE
        - UPDATE
      - key: "{{ request.object.spec.features.ciCd.branchStrategy.type || '' }}"
        operator: NotEquals
        value: ""
    validate:
      allowExistingViolations: true
      message: "Field spec.features.ciCd.branchStrategy.type on KubeApp must lie within the bounded set (catalog: d3-kubeapp-branch-strategy-type-bounded, domain: D3). See PRD-310."
      deny:
        conditions:
          any:
          - key: "{{ request.object.spec.features.ciCd.branchStrategy.type }}"
            operator: AnyNotIn
            value:
            - "custom"
            - "gitFlow"
            - "trunk"

