apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d2-kubeproject-ml-s3-enabled-immutable
  annotations:
    kubecore.io/catalog-domain: "D2"
    kubecore.io/catalog-id: "d2-kubeproject-ml-s3-enabled-immutable"
    kubecore.io/evidence-ref: "knowledge/prds/310-kyverno-admission-policy-layer.md"
    kubecore.io/migration-issue: "#344"
    kubecore.io/migration-status: "unimplemented"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Deprecated no-op field (the artifact store is always provisioned, PRD-HPC-1231); kept immutable and installed until the field is removed so live manifests keep applying."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeProject"
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d2-kubeproject-ml-s3-enabled-immutable
    match:
      any:
      - resources:
          kinds:
            - KubeProject
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      message: "Field spec.ml.s3.enabled on KubeProject is immutable (catalog: d2-kubeproject-ml-s3-enabled-immutable, domain: D2). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ contains(keys(request.oldObject.spec.ml.s3 || `{}`), 'enabled') }}"
            operator: Equals
            value: true
          - key: "{{ to_string(request.object.spec.ml.s3.enabled) }}"
            operator: NotEquals
            value: "{{ to_string(request.oldObject.spec.ml.s3.enabled) }}"

