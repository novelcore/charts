apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d2-kubeorg-aws-regions-immutable
  annotations:
    kubecore.io/catalog-domain: "D2"
    kubecore.io/catalog-id: "d2-kubeorg-aws-regions-immutable"
    kubecore.io/evidence-ref: "knowledge/prds/310-kyverno-admission-policy-layer.md"
    kubecore.io/migration-issue: "#343"
    kubecore.io/migration-status: "unimplemented"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Region list changes require per-region network add/remove orchestration; not implemented (#343)."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeOrg"
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d2-kubeorg-aws-regions-immutable
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
            - KubeOrg
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      allowExistingViolations: true
      message: "Field spec.awsConfig.regions on KubeOrg is immutable (catalog: d2-kubeorg-aws-regions-immutable, domain: D2). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ contains(keys(request.oldObject.spec.awsConfig || `{}`), 'regions') }}"
            operator: Equals
            value: true
          - key: "{{ to_string(request.object.spec.awsConfig.regions) }}"
            operator: NotEquals
            value: "{{ to_string(request.oldObject.spec.awsConfig.regions) }}"

