apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d1-kubeapp-template-ref-immutable
  annotations:
    kubecore.io/catalog-domain: "D1"
    kubecore.io/catalog-id: "d1-kubeapp-template-ref-immutable"
    kubecore.io/evidence-ref: "api/v1beta1/kubeapp_types.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "kubeAppTemplateRef selects the app template (k8sApp vs ml-pipeline etc.); changing it after CREATE flips the resource's whole shape and child-XR type — identity-immutable."
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeApp"
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d1-kubeapp-template-ref-immutable
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
            - KubeApp
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      allowExistingViolations: true
      message: "Field spec.kubeAppTemplateRef on KubeApp is immutable (catalog: d1-kubeapp-template-ref-immutable, domain: D1). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ contains(keys(request.oldObject.spec || `{}`), 'kubeAppTemplateRef') }}"
            operator: Equals
            value: true
          - key: "{{ to_string(request.object.spec.kubeAppTemplateRef) }}"
            operator: NotEquals
            value: "{{ to_string(request.oldObject.spec.kubeAppTemplateRef) }}"

