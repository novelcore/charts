apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d1-kubeproject-existing-repository-immutable
  annotations:
    kubecore.io/catalog-domain: "D1"
    kubecore.io/catalog-id: "d1-kubeproject-existing-repository-immutable"
    kubecore.io/evidence-ref: "api/v1beta1/kubeproject_types.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "When repositorySource.type=existing, this is the permanent GitHub repo this project is bound to; switching would orphan the original repo + all derived KubeApps."
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeProject"
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d1-kubeproject-existing-repository-immutable
    match:
      any:
      - resources:
          kinds:
            - KubeProject
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      message: "Field spec.githubConfiguration.repositorySource.existing.repository on KubeProject is immutable (catalog: d1-kubeproject-existing-repository-immutable, domain: D1). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ request.object.spec.githubConfiguration.repositorySource.existing.repository || '' }}"
            operator: NotEquals
            value: "{{ request.oldObject.spec.githubConfiguration.repositorySource.existing.repository || '' }}"
          - key: "{{ request.oldObject.spec.githubConfiguration.repositorySource.existing.repository || '' }}"
            operator: NotEquals
            value: ""

