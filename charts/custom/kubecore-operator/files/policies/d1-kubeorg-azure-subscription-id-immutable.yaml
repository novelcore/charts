apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d1-kubeorg-azure-subscription-id-immutable
  annotations:
    kubecore.io/catalog-domain: "D1"
    kubecore.io/catalog-id: "d1-kubeorg-azure-subscription-id-immutable"
    kubecore.io/evidence-ref: "api/v1beta1/kubeorg_types.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Azure Subscription ID is the cloud-side identity for this org's Azure resources. Switching reassigns every Azure managed resource."
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeOrg"
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d1-kubeorg-azure-subscription-id-immutable
    match:
      any:
      - resources:
          kinds:
            - KubeOrg
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      message: "Field spec.azureConfig.subscriptionId on KubeOrg is immutable (catalog: d1-kubeorg-azure-subscription-id-immutable, domain: D1). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ contains(keys(request.oldObject.spec.azureConfig || `{}`), 'subscriptionId') }}"
            operator: Equals
            value: true
          - key: "{{ to_string(request.object.spec.azureConfig.subscriptionId) }}"
            operator: NotEquals
            value: "{{ to_string(request.oldObject.spec.azureConfig.subscriptionId) }}"

