apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d2-kubeorg-network-enabled-immutable
  annotations:
    kubecore.io/catalog-domain: "D2"
    kubecore.io/catalog-id: "d2-kubeorg-network-enabled-immutable"
    kubecore.io/evidence-ref: "knowledge/prds/310-kyverno-admission-policy-layer.md"
    kubecore.io/migration-issue: "#343"
    kubecore.io/migration-status: "unimplemented"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Toggling networking off would orphan VPCs/subnets used by every KubePool; flipping on requires re-bootstrap of the org's network foundation. Immutable once a cloud config exists; freely settable during the identity-only bootstrap window. Migration tracked with the regions work (#343)."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeOrg"
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d2-kubeorg-network-enabled-immutable
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
            - KubeOrg
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
      - key: "{{ length(keys(request.oldObject.spec.gcpConfig || `{}`)) > `0` || length(keys(request.oldObject.spec.azureConfig || `{}`)) > `0` || length(keys(request.oldObject.spec.awsConfig || `{}`)) > `0` }}"
        operator: Equals
        value: true
    validate:
      allowExistingViolations: true
      message: "Field spec.network.enabled on KubeOrg becomes immutable once a cloud config (awsConfig/gcpConfig/azureConfig) is set (catalog: d2-kubeorg-network-enabled-immutable, domain: D2); it is freely settable during the identity-only bootstrap window. See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ contains(keys(request.oldObject.spec.network || `{}`), 'enabled') }}"
            operator: Equals
            value: true
          - key: "{{ to_string(request.object.spec.network.enabled) }}"
            operator: NotEquals
            value: "{{ to_string(request.oldObject.spec.network.enabled) }}"

