apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d2-kubepool-features-ml-s3-immutable
  annotations:
    kubecore.io/catalog-domain: "D2"
    kubecore.io/catalog-id: "d2-kubepool-features-ml-s3-immutable"
    kubecore.io/evidence-ref: "api/v1beta1/kubepool_types.go"
    kubecore.io/migration-issue: "#344"
    kubecore.io/migration-status: "unimplemented"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Toggling object-store artifact backing off forces MLflow back to the default file artifact store; toggling on requires bucket + IRSA bootstrap. Migration unimplemented (#344)."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubePool"
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d2-kubepool-features-ml-s3-immutable
    match:
      any:
      - resources:
          kinds:
            - KubePool
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      message: "Field spec.features.mlConfig.s3 on KubePool is immutable (catalog: d2-kubepool-features-ml-s3-immutable, domain: D2). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ contains(keys(request.oldObject.spec.features.mlConfig || `{}`), 's3') }}"
            operator: Equals
            value: true
          - key: "{{ to_string(request.object.spec.features.mlConfig.s3) }}"
            operator: NotEquals
            value: "{{ to_string(request.oldObject.spec.features.mlConfig.s3) }}"

