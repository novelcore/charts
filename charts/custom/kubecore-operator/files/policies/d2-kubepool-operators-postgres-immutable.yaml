apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d2-kubepool-operators-postgres-immutable
  annotations:
    kubecore.io/catalog-domain: "D2"
    kubecore.io/catalog-id: "d2-kubepool-operators-postgres-immutable"
    kubecore.io/evidence-ref: "knowledge/prds/310-kyverno-admission-policy-layer.md"
    kubecore.io/migration-issue: "#344"
    kubecore.io/migration-status: "unimplemented"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Toggling postgres off destroys the shared CNPG cluster (and every database hosted in it: MLflow, lakeFS, cost-tracking). Migration unimplemented (#344)."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubePool"
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d2-kubepool-operators-postgres-immutable
    match:
      any:
      - resources:
          kinds:
            - KubePool
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      message: "Field spec.operators.postgres on KubePool is immutable (catalog: d2-kubepool-operators-postgres-immutable, domain: D2). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ request.object.spec.operators.postgres || '' }}"
            operator: NotEquals
            value: "{{ request.oldObject.spec.operators.postgres || '' }}"
          - key: "{{ request.oldObject.spec.operators.postgres || '' }}"
            operator: NotEquals
            value: ""

