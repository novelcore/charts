apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d1-kubeorg-dns-parent-zone-immutable
  annotations:
    kubecore.io/catalog-domain: "D1"
    kubecore.io/catalog-id: "d1-kubeorg-dns-parent-zone-immutable"
    kubecore.io/evidence-ref: "api/v1beta1/kubeorg_types.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Parent zone holds the delegating NS record for the org domain. Changing it after delegation orphans the old NS record and breaks resolution until the new parent is delegated (#410). Set at create."
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeOrg"
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d1-kubeorg-dns-parent-zone-immutable
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
            - KubeOrg
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      allowExistingViolations: true
      message: "Field spec.network.dns.parentZone on KubeOrg is immutable (catalog: d1-kubeorg-dns-parent-zone-immutable, domain: D1). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ contains(keys(request.oldObject.spec.network.dns || `{}`), 'parentZone') }}"
            operator: Equals
            value: true
          - key: "{{ to_string(request.object.spec.network.dns.parentZone) }}"
            operator: NotEquals
            value: "{{ to_string(request.oldObject.spec.network.dns.parentZone) }}"

