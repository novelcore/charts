apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: reg-kubepool-registry-type-supported
  annotations:
    kubecore.io/catalog-domain: "D3"
    kubecore.io/catalog-id: "reg-kubepool-registry-type-supported"
    kubecore.io/evidence-ref: "internal/common/registryref/kinds.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Registry kind-table coverage: \"zot\" (Phase 1) and \"gar\" (Phase 2, PRD-REG-994 F-16) have implemented kind-table rows; the CRD enum already admits ecr/acr for the eventual multi-cloud vocabulary and they widen here as their rows land. Live 2026-08-27: gke-dev carried a gar registry while this set still said zot-only, so Kyverno denied EVERY KubePool update on that pool (allowExistingViolations did not rescue an annotate/patch) — the bounded set must track kinds.go."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubePool"
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: reg-kubepool-registry-type-supported
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
            - KubePool
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: AnyIn
        value:
        - CREATE
        - UPDATE
    validate:
      allowExistingViolations: true
      message: "Field spec.registries[].type on KubePool must lie within the bounded set (catalog: reg-kubepool-registry-type-supported, domain: D3). See PRD-310."
      foreach:
      - list: "request.object.spec.registries"
        preconditions:
          all:
          - key: "{{ element.type || '' }}"
            operator: NotEquals
            value: ""
        deny:
          conditions:
            any:
            - key: "{{ element.type }}"
              operator: AnyNotIn
              value:
              - "gar"
              - "zot"

