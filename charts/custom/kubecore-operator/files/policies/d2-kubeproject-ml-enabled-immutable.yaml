apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d2-kubeproject-ml-enabled-immutable
  annotations:
    kubecore.io/catalog-domain: "D2"
    kubecore.io/catalog-id: "d2-kubeproject-ml-enabled-immutable"
    kubecore.io/evidence-ref: "knowledge/prds/310-kyverno-admission-policy-layer.md"
    kubecore.io/migration-issue: "#344"
    kubecore.io/migration-status: "unimplemented"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Flipping ML stack off destroys MLflow / LakeFS / CNPG state (#329/#333). Flipping on requires post-create XProjectMLStack bootstrap on a pool selected at create time. Migration unimplemented (#344)."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeProject"
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d2-kubeproject-ml-enabled-immutable
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
            - KubeProject
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      allowExistingViolations: true
      message: "Field spec.ml.enabled on KubeProject is immutable (catalog: d2-kubeproject-ml-enabled-immutable, domain: D2). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ contains(keys(request.oldObject.spec.ml || `{}`), 'enabled') }}"
            operator: Equals
            value: true
          - key: "{{ to_string(request.object.spec.ml.enabled) }}"
            operator: NotEquals
            value: "{{ to_string(request.oldObject.spec.ml.enabled) }}"

