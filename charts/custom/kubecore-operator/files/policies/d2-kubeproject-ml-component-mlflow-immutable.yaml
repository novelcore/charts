apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d2-kubeproject-ml-component-mlflow-immutable
  annotations:
    kubecore.io/catalog-domain: "D2"
    kubecore.io/catalog-id: "d2-kubeproject-ml-component-mlflow-immutable"
    kubecore.io/evidence-ref: "knowledge/prds/310-kyverno-admission-policy-layer.md"
    kubecore.io/migration-issue: "#344"
    kubecore.io/migration-status: "unimplemented"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Toggling MLflow off destroys per-project tracking history; toggling on requires backfill. Migration unimplemented (#344)."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeProject"
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d2-kubeproject-ml-component-mlflow-immutable
    match:
      any:
      - resources:
          kinds:
            - KubeProject
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      message: "Field spec.ml.components.mlflow on KubeProject is immutable (catalog: d2-kubeproject-ml-component-mlflow-immutable, domain: D2). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ contains(keys(request.oldObject.spec.ml.components || `{}`), 'mlflow') }}"
            operator: Equals
            value: true
          - key: "{{ to_string(request.object.spec.ml.components.mlflow) }}"
            operator: NotEquals
            value: "{{ to_string(request.oldObject.spec.ml.components.mlflow) }}"

