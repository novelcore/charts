apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d1-kubeorg-gcp-project-id-immutable
  annotations:
    kubecore.io/catalog-domain: "D1"
    kubecore.io/catalog-id: "d1-kubeorg-gcp-project-id-immutable"
    kubecore.io/evidence-ref: "api/v1beta1/kubeorg_types.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "GCP Project ID is the cloud-side identity for this org's GCP resources. Switching reassigns every GCP managed resource to a different project — destructive and unrecoverable."
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeOrg"
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d1-kubeorg-gcp-project-id-immutable
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
            - KubeOrg
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      allowExistingViolations: true
      message: "Field spec.gcpConfig.projectId on KubeOrg is immutable (catalog: d1-kubeorg-gcp-project-id-immutable, domain: D1). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ contains(keys(request.oldObject.spec.gcpConfig || `{}`), 'projectId') }}"
            operator: Equals
            value: true
          - key: "{{ to_string(request.object.spec.gcpConfig.projectId) }}"
            operator: NotEquals
            value: "{{ to_string(request.oldObject.spec.gcpConfig.projectId) }}"

