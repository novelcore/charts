apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d1-kubeorg-aws-account-id-immutable
  annotations:
    kubecore.io/catalog-domain: "D1"
    kubecore.io/catalog-id: "d1-kubeorg-aws-account-id-immutable"
    kubecore.io/evidence-ref: "knowledge/prds/310-kyverno-admission-policy-layer.md"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "12-digit AWS account ID is fixed at KubeOrg creation; no migration story exists."
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeOrg"
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d1-kubeorg-aws-account-id-immutable
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
            - KubeOrg
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      allowExistingViolations: true
      message: "Field spec.awsConfig.accountId on KubeOrg is immutable (catalog: d1-kubeorg-aws-account-id-immutable, domain: D1). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ contains(keys(request.oldObject.spec.awsConfig || `{}`), 'accountId') }}"
            operator: Equals
            value: true
          - key: "{{ to_string(request.object.spec.awsConfig.accountId) }}"
            operator: NotEquals
            value: "{{ to_string(request.oldObject.spec.awsConfig.accountId) }}"

