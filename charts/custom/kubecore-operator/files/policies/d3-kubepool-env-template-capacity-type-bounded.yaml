apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d3-kubepool-env-template-capacity-type-bounded
  annotations:
    kubecore.io/catalog-domain: "D3"
    kubecore.io/catalog-id: "d3-kubepool-env-template-capacity-type-bounded"
    kubecore.io/evidence-ref: "api/v1beta1/kubepool_types.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Tenant node-group capacity type; bounded to AWS-supported values."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubePool"
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d3-kubepool-env-template-capacity-type-bounded
    match:
      any:
      - resources:
          kinds:
            - KubePool
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: AnyIn
        value:
        - CREATE
        - UPDATE
    validate:
      message: "Field spec.environmentTemplates[].nodeGroup.capacityType on KubePool must lie within the bounded set (catalog: d3-kubepool-env-template-capacity-type-bounded, domain: D3). See PRD-310."
      foreach:
      - list: "request.object.spec.environmentTemplates"
        preconditions:
          all:
          - key: "{{ element.nodeGroup.capacityType || '' }}"
            operator: NotEquals
            value: ""
        deny:
          conditions:
            any:
            - key: "{{ element.nodeGroup.capacityType }}"
              operator: AnyNotIn
              value:
              - "ON_DEMAND"
              - "SPOT"

