apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d3-kubeapp-ingress-path-type-bounded
  annotations:
    kubecore.io/catalog-domain: "D3"
    kubecore.io/catalog-id: "d3-kubeapp-ingress-path-type-bounded"
    kubecore.io/evidence-ref: "api/v1beta1/kubeapp_types.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Kubernetes Ingress pathType; bounded to the upstream networking.k8s.io enum. Values are mapped to HTTPRoute path-match types at runtime: Prefix→PathPrefix, Exact→Exact, ImplementationSpecific→PathPrefix."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeApp"
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d3-kubeapp-ingress-path-type-bounded
    match:
      any:
      - resources:
          kinds:
            - KubeApp
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: AnyIn
        value:
        - CREATE
        - UPDATE
      - key: "{{ request.object.spec.k8sAppConfig.ingressConfig.pathType || '' }}"
        operator: NotEquals
        value: ""
    validate:
      message: "Field spec.k8sAppConfig.ingressConfig.pathType on KubeApp must lie within the bounded set (catalog: d3-kubeapp-ingress-path-type-bounded, domain: D3). See PRD-310."
      deny:
        conditions:
          any:
          - key: "{{ request.object.spec.k8sAppConfig.ingressConfig.pathType }}"
            operator: AnyNotIn
            value:
            - "Exact"
            - "ImplementationSpecific"
            - "Prefix"

