apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d1-kubeorg-dns-delegation-mode-immutable
  annotations:
    kubecore.io/catalog-domain: "D1"
    kubecore.io/catalog-id: "d1-kubeorg-dns-delegation-mode-immutable"
    kubecore.io/evidence-ref: "api/v1beta1/kubeorg_types.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Flipping byo<->managed changes whether KubeCore writes the parent NS delegation record. Flipping live would strip or duplicate delegation, breaking public resolution for every host under the org domain (#410). Set at create."
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeOrg"
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d1-kubeorg-dns-delegation-mode-immutable
    match:
      any:
      - resources:
          kinds:
            - KubeOrg
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      message: "Field spec.network.dns.delegationMode on KubeOrg is immutable (catalog: d1-kubeorg-dns-delegation-mode-immutable, domain: D1). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ request.object.spec.network.dns.delegationMode || '' }}"
            operator: NotEquals
            value: "{{ request.oldObject.spec.network.dns.delegationMode || '' }}"

