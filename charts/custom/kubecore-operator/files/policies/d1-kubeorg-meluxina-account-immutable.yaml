apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d1-kubeorg-meluxina-account-immutable
  annotations:
    kubecore.io/catalog-domain: "D1"
    kubecore.io/catalog-id: "d1-kubeorg-meluxina-account-immutable"
    kubecore.io/evidence-ref: "api/v1beta1/kubeorg_types.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "MeluXina Slurm account is the org's HPC allocation identity. The rotating-JWT chain is keyed to it; switching it on a live org strands the running token and the pushed SM secret. Re-onboard via teardown."
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeOrg"
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d1-kubeorg-meluxina-account-immutable
    match:
      any:
      - resources:
          kinds:
            - KubeOrg
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      message: "Field spec.meluxinaConfig.account on KubeOrg is immutable (catalog: d1-kubeorg-meluxina-account-immutable, domain: D1). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ request.object.spec.meluxinaConfig.account || '' }}"
            operator: NotEquals
            value: "{{ request.oldObject.spec.meluxinaConfig.account || '' }}"

