apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d3-kubepool-gcp-system-node-group-capacity-type-bounded
  annotations:
    kubecore.io/catalog-domain: "D3"
    kubecore.io/catalog-id: "d3-kubepool-gcp-system-node-group-capacity-type-bounded"
    kubecore.io/evidence-ref: "api/v1beta1/kubepool_types.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "GKE system node-pool capacity type. Cloud-neutral vocabulary (on-demand/spot), NOT the AWS ON_DEMAND/SPOT spelling above — an uppercase value would be silently read as on-demand by the operator. \"spot\" is additionally restricted to clusterMode \"dev\" by a KubePool CEL rule: the system pool runs eviction-sensitive platform addons (incident 2026-06-02)."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubePool"
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d3-kubepool-gcp-system-node-group-capacity-type-bounded
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
            - KubePool
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: AnyIn
        value:
        - CREATE
        - UPDATE
      - key: "{{ request.object.spec.cloudProvider.gcp.cluster.systemNodeGroup.capacityType || '' }}"
        operator: NotEquals
        value: ""
      - key: "{{ request.object.spec.cloudProvider.gcp || '' }}"
        operator: NotEquals
        value: ""
    validate:
      allowExistingViolations: true
      message: "Field spec.cloudProvider.gcp.cluster.systemNodeGroup.capacityType on KubePool must lie within the bounded set (catalog: d3-kubepool-gcp-system-node-group-capacity-type-bounded, domain: D3). See PRD-310."
      deny:
        conditions:
          any:
          - key: "{{ request.object.spec.cloudProvider.gcp.cluster.systemNodeGroup.capacityType }}"
            operator: AnyNotIn
            value:
            - "on-demand"
            - "spot"

