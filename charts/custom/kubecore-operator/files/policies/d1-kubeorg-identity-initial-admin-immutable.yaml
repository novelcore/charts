apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d1-kubeorg-identity-initial-admin-immutable
  annotations:
    kubecore.io/catalog-domain: "D1"
    kubecore.io/catalog-id: "d1-kubeorg-identity-initial-admin-immutable"
    kubecore.io/evidence-ref: "api/v1beta1/kubeorg_types.go"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "initialAdmin is the bootstrapping platform-admin in Zitadel; identity-immutable after the org's first reconcile."
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "schema.kubecore.io/KubeOrg"
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d1-kubeorg-identity-initial-admin-immutable
    match:
      any:
      - resources:
          kinds:
            - KubeOrg
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      message: "Field spec.identity.initialAdmin on KubeOrg is immutable (catalog: d1-kubeorg-identity-initial-admin-immutable, domain: D1). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ request.object.spec.identity.initialAdmin || '' }}"
            operator: NotEquals
            value: "{{ request.oldObject.spec.identity.initialAdmin || '' }}"
          - key: "{{ request.oldObject.spec.identity.initialAdmin || '' }}"
            operator: NotEquals
            value: ""

