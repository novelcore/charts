apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: d2-kubepool-features-zot-registry-immutable
  annotations:
    kubecore.io/catalog-domain: "D2"
    kubecore.io/catalog-id: "d2-kubepool-features-zot-registry-immutable"
    kubecore.io/evidence-ref: "api/v1beta1/kubepool_types.go"
    kubecore.io/migration-issue: "#344"
    kubecore.io/migration-status: "unimplemented"
    policies.kyverno.io/category: "KubeCore Catalog"
    policies.kyverno.io/description: "Toggling the in-cluster Zot OCI registry off destroys the registry deployment + its OCI store. Migration unimplemented (#344)."
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "schema.kubecore.io/KubePool"
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
  - name: d2-kubepool-features-zot-registry-immutable
    match:
      any:
      - resources:
          kinds:
            - KubePool
    preconditions:
      all:
      - key: "{{ request.operation }}"
        operator: Equals
        value: UPDATE
    validate:
      message: "Field spec.features.zotRegistry on KubePool is immutable (catalog: d2-kubepool-features-zot-registry-immutable, domain: D2). See PRD-310."
      deny:
        conditions:
          all:
          - key: "{{ request.object.spec.features.zotRegistry || '' }}"
            operator: NotEquals
            value: "{{ request.oldObject.spec.features.zotRegistry || '' }}"

