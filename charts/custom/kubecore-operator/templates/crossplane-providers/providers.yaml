{{- if and .Values.crossplane.enabled .Values.crossplaneProviders.enabled }}
---
# AWS Route53 Provider
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-route53
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  package: xpkg.upbound.io/upbound/provider-aws-route53:v2
---
# AWS EC2 Provider
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-ec2
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  package: xpkg.upbound.io/upbound/provider-aws-ec2:v2
---
# AWS IAM Provider
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-iam
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  package: xpkg.upbound.io/upbound/provider-aws-iam:v2
---
# AWS EKS Provider
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-eks
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  package: xpkg.upbound.io/upbound/provider-aws-eks:v2
---
# AWS ECR Provider
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-ecr
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  package: xpkg.upbound.io/upbound/provider-aws-ecr:v2
---
# AWS Account Provider
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-account
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  package: xpkg.upbound.io/upbound/provider-aws-account:v2
---
# AWS Organizations Provider
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-organizations
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  package: xpkg.upbound.io/upbound/provider-aws-organizations:v2
---
# Kubernetes Provider
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes:v1.0.0
  {{- if .Values.crossplaneProviders.kubernetes.runtimeConfigRef }}
  runtimeConfigRef:
    {{- toYaml .Values.crossplaneProviders.kubernetes.runtimeConfigRef | nindent 4 }}
  {{- end }}
---
# GitHub Provider
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: crossplane-contrib-provider-upjet-github
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  package: {{ .Values.crossplaneProviders.github.package | quote }}
  {{- if .Values.crossplaneProviders.github.runtimeConfigRef }}
  runtimeConfigRef:
    {{- toYaml .Values.crossplaneProviders.github.runtimeConfigRef | nindent 4 }}
  {{- end }}
---
# Helm Provider
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-helm
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-helm:v1.0.2
  {{- if .Values.crossplaneProviders.helm.runtimeConfigRef }}
  runtimeConfigRef:
    {{- toYaml .Values.crossplaneProviders.helm.runtimeConfigRef | nindent 4 }}
  {{- end }}
{{- end }}

