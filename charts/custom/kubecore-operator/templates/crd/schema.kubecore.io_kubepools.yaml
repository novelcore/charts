---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: kubepools.schema.kubecore.io
spec:
  group: schema.kubecore.io
  names:
    kind: KubePool
    listKind: KubePoolList
    plural: kubepools
    singular: kubepool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.kubeOrgRef
      name: KubeOrg
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .spec.cluster.type
      name: Cluster Type
      type: string
    - jsonPath: .spec.cluster.kubernetesVersion
      name: K8s Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: KubePool is the Schema for the kubepools API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KubePoolSpec defines the desired state of KubePool
            properties:
              cluster:
                description: Cluster defines the EKS cluster configuration
                properties:
                  kubernetesVersion:
                    default: "1.35"
                    description: KubernetesVersion specifies the Kubernetes version
                      for the cluster
                    pattern: ^[0-9]+\.[0-9]+$
                    type: string
                  system:
                    description: System defines configuration for the system node
                      group (kubecoresys)
                    properties:
                      capacityType:
                        default: SPOT
                        description: CapacityType specifies the capacity type for
                          system nodes
                        enum:
                        - ON_DEMAND
                        - SPOT
                        type: string
                    type: object
                  tags:
                    additionalProperties:
                      type: string
                    description: Tags are additional tags to apply to the EKS cluster
                    type: object
                  type:
                    allOf:
                    - enum:
                      - shared
                      - dedicated
                    - enum:
                      - shared
                      - dedicated
                    description: Type specifies whether this is a shared or dedicated
                      cluster
                    type: string
                required:
                - kubernetesVersion
                - type
                type: object
              environmentTemplates:
                description: |-
                  EnvironmentTemplates define rich templates for KubEnv creation by KubeProject resources
                  Platform teams manage these templates to provide pre-configured environments
                items:
                  description: EnvironmentTemplate defines a complete environment
                    template for KubEnv creation
                  properties:
                    costControls:
                      description: CostControls defines cost management policies for
                        environments
                      properties:
                        maxMonthlyCost:
                          description: MaxMonthlyCost specifies the maximum monthly
                            cost in USD as a string
                          type: string
                        shutdownSchedule:
                          description: ShutdownSchedule specifies when to shut down
                            the environment (cron format)
                          type: string
                        startupSchedule:
                          description: StartupSchedule specifies when to start up
                            the environment (cron format)
                          type: string
                      type: object
                    description:
                      description: Description explains the purpose and characteristics
                        of this template
                      type: string
                    displayName:
                      description: DisplayName is a human-readable name for the template
                      minLength: 1
                      type: string
                    environmentType:
                      allOf:
                      - enum:
                        - dev
                        - stage
                        - prod
                      - enum:
                        - dev
                        - stage
                        - prod
                      description: EnvironmentType specifies the type of environment
                        (dev, stage, prod)
                      type: string
                    features:
                      description: Features defines which features are enabled for
                        environments using this template
                      properties:
                        autoScaling:
                          default: false
                          description: AutoScaling enables horizontal pod autoscaling
                          type: boolean
                        backups:
                          default: false
                          description: Backups enables backup capabilities for the
                            environment
                          type: boolean
                        disasterRecovery:
                          default: false
                          description: DisasterRecovery enables disaster recovery
                            capabilities
                          type: boolean
                        logging:
                          default: true
                          description: Logging enables logging stack for the environment
                          type: boolean
                        monitoring:
                          default: true
                          description: Monitoring enables monitoring stack for the
                            environment
                          type: boolean
                        nodeGroupTaints:
                          default: true
                          description: NodeGroupTaints enables node group taints for
                            environment isolation
                          type: boolean
                      type: object
                    lifecycle:
                      description: Lifecycle defines lifecycle management policies
                        for environments
                      properties:
                        autoDestroy:
                          default: false
                          description: AutoDestroy enables automatic destruction of
                            the environment
                          type: boolean
                        ttl:
                          description: TTL specifies the time-to-live for the environment
                            (e.g., "24h", "7d")
                          type: string
                      type: object
                    name:
                      description: Name of the environment template (e.g., "small-dev",
                        "large-production")
                      minLength: 1
                      pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
                      type: string
                    networking:
                      description: Networking defines network policies and configuration
                        for environments
                      properties:
                        egressRules:
                          description: EgressRules define allowed egress traffic patterns
                          items:
                            description: TemplateNetworkRule defines a network traffic
                              rule
                            properties:
                              allow:
                                description: Allow specifies what traffic to allow
                                  (e.g., "internet", "cluster-dns")
                                type: string
                              from:
                                description: From specifies the source for ingress
                                  rules
                                type: string
                              to:
                                description: To specifies the destination for egress
                                  rules
                                type: string
                            required:
                            - allow
                            type: object
                          type: array
                        ingressRules:
                          description: IngressRules define allowed ingress traffic
                            patterns
                          items:
                            description: TemplateNetworkRule defines a network traffic
                              rule
                            properties:
                              allow:
                                description: Allow specifies what traffic to allow
                                  (e.g., "internet", "cluster-dns")
                                type: string
                              from:
                                description: From specifies the source for ingress
                                  rules
                                type: string
                              to:
                                description: To specifies the destination for egress
                                  rules
                                type: string
                            required:
                            - allow
                            type: object
                          type: array
                        isolation:
                          default: soft
                          description: Isolation level for the environment
                          enum:
                          - soft
                          - strict
                          - none
                          type: string
                      type: object
                    nodeGroup:
                      description: NodeGroup defines the node group configuration
                        for environments using this template
                      properties:
                        capacityType:
                          description: CapacityType specifies the capacity type for
                            nodes
                          enum:
                          - ON_DEMAND
                          - SPOT
                          type: string
                        defaultInstanceType:
                          description: DefaultInstanceType is the default instance
                            type from the allowed list
                          type: string
                        diskSize:
                          description: DiskSize specifies the disk size in GB for
                            worker nodes
                          maximum: 1000
                          minimum: 10
                          type: integer
                        instanceTypes:
                          description: InstanceTypes list of allowed EC2 instance
                            types
                          items:
                            type: string
                          minItems: 1
                          type: array
                        labels:
                          additionalProperties:
                            type: string
                          description: Labels are key-value pairs to apply to all
                            nodes
                          type: object
                        multiAZ:
                          default: false
                          description: MultiAZ determines if the node group should
                            span multiple availability zones
                          type: boolean
                        scaling:
                          description: Scaling defines the autoscaling configuration
                          properties:
                            default:
                              description: Default is the default desired number of
                                nodes
                              minimum: 0
                              type: integer
                            max:
                              description: Max is the maximum number of nodes
                              minimum: 1
                              type: integer
                            min:
                              description: Min is the minimum number of nodes
                              minimum: 0
                              type: integer
                          required:
                          - default
                          - max
                          - min
                          type: object
                        taints:
                          description: Taints are taints to apply to all nodes in
                            the node group
                          items:
                            description: TemplateTaintConfig defines taint configuration
                              in templates
                            properties:
                              effect:
                                description: Effect is the taint effect
                                enum:
                                - NoSchedule
                                - PreferNoSchedule
                                - NoExecute
                                type: string
                              key:
                                description: Key is the taint key
                                type: string
                              value:
                                description: Value is the taint value
                                type: string
                            required:
                            - effect
                            - key
                            type: object
                          type: array
                      required:
                      - capacityType
                      - defaultInstanceType
                      - diskSize
                      - instanceTypes
                      - scaling
                      type: object
                    priority:
                      description: |-
                        Priority defines the priority of this template within its environmentType
                        Lower numbers indicate higher priority (1 is the highest priority)
                        Templates with the same environmentType must have unique priorities
                      maximum: 10
                      minimum: 1
                      type: integer
                    resources:
                      description: Resources defines resource quotas and limits for
                        environments using this template
                      properties:
                        limits:
                          description: Limits defines default and maximum resource
                            limits for containers
                          properties:
                            defaultCpu:
                              description: DefaultCPU is the default CPU limit for
                                containers
                              type: string
                            defaultMemory:
                              description: DefaultMemory is the default memory limit
                                for containers
                              type: string
                            maxCpu:
                              description: MaxCPU is the maximum CPU limit for containers
                              type: string
                            maxMemory:
                              description: MaxMemory is the maximum memory limit for
                                containers
                              type: string
                          type: object
                        quota:
                          description: Quota defines namespace-level resource quotas
                          properties:
                            cpu:
                              description: CPU is the total CPU quota for the namespace
                              type: string
                            memory:
                              description: Memory is the total memory quota for the
                                namespace
                              type: string
                            persistentVolumeClaims:
                              description: PersistentVolumeClaims is the maximum number
                                of PVCs
                              type: string
                            pods:
                              description: Pods is the maximum number of pods
                              type: string
                            services:
                              description: Services is the maximum number of services
                              type: string
                          type: object
                      type: object
                    security:
                      description: Security defines security policies and constraints
                        for environments
                      properties:
                        networkPolicies:
                          default: false
                          description: NetworkPolicies specifies if network policies
                            should be enabled
                          type: boolean
                        podSecurityStandard:
                          default: restricted
                          description: PodSecurityStandard specifies the Pod Security
                            Standard to enforce
                          enum:
                          - privileged
                          - baseline
                          - restricted
                          type: string
                        readOnlyRootFilesystem:
                          default: false
                          description: ReadOnlyRootFilesystem specifies if containers
                            should have read-only root filesystem
                          type: boolean
                        runAsNonRoot:
                          default: true
                          description: RunAsNonRoot specifies if containers should
                            run as non-root users
                          type: boolean
                        serviceAccountName:
                          default: default
                          description: ServiceAccountName specifies the default service
                            account to use
                          type: string
                      type: object
                  required:
                  - displayName
                  - environmentType
                  - name
                  - nodeGroup
                  - priority
                  type: object
                maxItems: 20
                type: array
              features:
                description: Features defines which platform features are enabled
                  for this cluster
                properties:
                  observability:
                    description: Observability enables VictoriaMetrics observability
                      stack
                    type: boolean
                type: object
              kubeOrgRef:
                description: KubeOrgRef references the KubeOrg that provides AWS configuration
                  and network
                minLength: 1
                type: string
              nodeGroupTemplates:
                description: |-
                  NodeGroupTemplates define templates for future node group creation
                  These are stored for later use and don't create actual node groups
                items:
                  description: NodeGroupTemplate defines a template for future node
                    group creation
                  properties:
                    instanceTypes:
                      description: InstanceTypes list of EC2 instance types for this
                        node group
                      items:
                        type: string
                      minItems: 1
                      type: array
                    maxSize:
                      description: MaxSize maximum number of nodes
                      minimum: 1
                      type: integer
                    minSize:
                      description: MinSize minimum number of nodes
                      minimum: 0
                      type: integer
                    name:
                      description: Name of the node group template
                      minLength: 1
                      type: string
                  required:
                  - instanceTypes
                  - maxSize
                  - minSize
                  - name
                  type: object
                type: array
              operators:
                description: |-
                  Operators enables cluster-scoped operators (e.g. CloudNativePG). When set, the
                  XClusterOperators composition installs the operator and a shared instance (e.g. one
                  Postgres cluster) so XMLSystem and other workloads can use it. Operators run before
                  XMLSystem; observability stays in XKubeSystem.
                properties:
                  karpenter:
                    description: |-
                      Karpenter configures the Karpenter node autoscaler.
                      When present and enabled, XClusterOperators installs the Karpenter Helm chart.
                      App-level ML NodePools are configured via KubeApp.spec.mlPipeline and provisioned
                      by the XK8sMLApp composition for per-app workload isolation and cost attribution.
                    properties:
                      controllerRoleArn:
                        description: ControllerRoleArn is the IRSA ARN for the Karpenter
                          controller ServiceAccount.
                        type: string
                      enabled:
                        default: true
                        description: Enabled toggles Karpenter. Defaults to true when
                          the karpenter block is present.
                        type: boolean
                      nodeRoleName:
                        description: |-
                          NodeRoleName overrides the IAM role for Karpenter-provisioned nodes.
                          Defaults to "{clusterName}-eks-karpenter-node".
                        type: string
                    required:
                    - enabled
                    type: object
                  nvidiaGpu:
                    description: |-
                      NvidiaGpu enables the NVIDIA GPU Operator (device plugin, container toolkit, DCGM exporter).
                      Required when the cluster uses XGPUNodeGroup so pods requesting nvidia.com/gpu resources
                      are scheduled. Configured with driver.enabled=false (AL2_x86_64_GPU has pre-installed drivers).
                    type: boolean
                  postgres:
                    description: |-
                      Postgres enables the CloudNativePG operator and a shared Postgres cluster (30Gi, 1 instance).
                      When true, XClusterOperators installs the operator and one Cluster; XMLSystem and other
                      workloads use this cluster instead of deploying their own Postgres.
                    type: boolean
                type: object
              region:
                description: |-
                  Region is the AWS region where the EKS cluster will be created
                  Must match one of the regions configured in the referenced KubeOrg
                pattern: ^[a-z]{2}-[a-z]+-[0-9]{1}$
                type: string
              tls:
                description: TLS defines TLS configuration for the cluster platform
                  system
                properties:
                  issuer:
                    description: Issuer defines ClusterIssuer configuration
                    properties:
                      acmeServer:
                        default: https://acme-v02.api.letsencrypt.org/directory
                        description: ACMEServer URL for certificate authority
                        type: string
                      email:
                        default: kaos@kubecore.io
                        description: Email for ACME account registration
                        type: string
                      enabled:
                        default: true
                        description: Enabled determines if automatic ClusterIssuer
                          should be created
                        type: boolean
                    required:
                    - enabled
                    type: object
                type: object
            required:
            - cluster
            - kubeOrgRef
            - region
            type: object
          status:
            description: KubePoolStatus defines the observed state of KubePool
            properties:
              argoWorkflowsOIDC:
                description: ArgoWorkflowsOIDC contains the Zitadel OIDC app status
                  for Argo Workflows SSO
                properties:
                  appId:
                    description: AppID is the Zitadel application ID
                    type: string
                  clientId:
                    description: ClientID is the OIDC client ID
                    type: string
                  projectId:
                    description: ProjectID is the Zitadel project the app belongs
                      to
                    type: string
                  ready:
                    description: Ready indicates the OIDC app is created and credentials
                      are pushed to AWS SM
                    type: boolean
                  secretName:
                    description: SecretName is the AWS Secrets Manager key name for
                      OIDC credentials
                    type: string
                type: object
              argocdOIDC:
                description: ArgocdOIDC contains the Zitadel OIDC app status for ArgoCD
                  SSO
                properties:
                  appId:
                    description: AppID is the Zitadel application ID
                    type: string
                  clientId:
                    description: ClientID is the OIDC client ID
                    type: string
                  projectId:
                    description: ProjectID is the Zitadel project the app belongs
                      to
                    type: string
                  ready:
                    description: Ready indicates the OIDC app is created and credentials
                      are pushed to AWS SM
                    type: boolean
                  secretName:
                    description: SecretName is the AWS Secrets Manager key name for
                      OIDC credentials
                    type: string
                type: object
              availableTemplates:
                description: AvailableTemplates contains summary information about
                  environment templates
                items:
                  description: TemplateStatus contains summary information about environment
                    templates
                  properties:
                    displayName:
                      description: DisplayName is the human-readable name of the template
                      type: string
                    name:
                      description: Name of the template
                      type: string
                    ready:
                      default: true
                      description: Ready indicates if the template is ready for use
                      type: boolean
                    validationErrors:
                      description: ValidationErrors contains any validation errors
                        for the template
                      items:
                        type: string
                      type: array
                  required:
                  - displayName
                  - name
                  type: object
                type: array
              baseDns:
                description: |-
                  BaseDns is the base DNS domain for this cluster: {poolName}.{orgDns}
                  e.g., "wow-dev.kaos.io.kubecore.eu"
                type: string
              clusterEndpoint:
                description: ClusterEndpoint contains the endpoint URL of the EKS
                  cluster
                type: string
              clusterInfo:
                description: ClusterInfo contains detailed cluster identity (name,
                  ARN, actual version, region)
                properties:
                  arn:
                    description: ARN is the EKS cluster ARN
                    type: string
                  clusterName:
                    description: ClusterName is the EKS cluster name
                    type: string
                  region:
                    description: Region is the AWS region where the cluster is deployed
                    type: string
                  version:
                    description: Version is the actual running Kubernetes version
                    type: string
                type: object
              clusterOIDC:
                description: ClusterOIDC contains OIDC provider details for IRSA configuration
                properties:
                  clientId:
                    description: ClientID is the OIDC client ID
                    type: string
                  issuerUrl:
                    description: IssuerURL is the OIDC issuer URL
                    type: string
                  providerArn:
                    description: ProviderARN is the OIDC provider ARN
                    type: string
                  providerName:
                    description: ProviderName is the OIDC provider resource name
                    type: string
                type: object
              clusterStatus:
                description: ClusterStatus contains the current status of the EKS
                  cluster
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the KubePool's current state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deletionRetryCount:
                description: DeletionRetryCount tracks retry attempts during deletion
                  phase for timeout/backoff logic
                type: integer
              deploymentTiming:
                description: DeploymentTiming contains system deployment lifecycle
                  timestamps
                properties:
                  lastUpdate:
                    description: LastUpdate is the last status update time
                    type: string
                  startTime:
                    description: StartTime is when deployment started
                    type: string
                type: object
              directCost:
                description: DirectCost contains the cost information for this cluster
                  pool
                properties:
                  calculationStatus:
                    description: CalculationStatus indicates the status of the last
                      calculation
                    enum:
                    - success
                    - failed
                    - pending
                    type: string
                  daily:
                    description: Daily contains the last 24-hour cost
                    properties:
                      amount:
                        description: Amount is the total daily cost
                        type: string
                      breakdown:
                        additionalProperties:
                          type: string
                        description: Breakdown contains cost per service
                        type: object
                      currency:
                        default: USD
                        description: Currency is the currency code (always USD)
                        type: string
                      lastUpdated:
                        description: LastUpdated is when this daily cost was calculated
                        format: date-time
                        type: string
                    type: object
                  error:
                    description: Error contains the error message if calculation failed
                    type: string
                  lastCalculated:
                    description: LastCalculated is when the cost was last successfully
                      calculated
                    format: date-time
                    type: string
                  monthToDate:
                    description: MonthToDate contains the current month's aggregated
                      cost
                    properties:
                      amount:
                        description: Amount is the total month-to-date cost
                        type: string
                      averageDaily:
                        description: AverageDaily is the average daily cost
                        type: string
                      breakdown:
                        additionalProperties:
                          type: string
                        description: Breakdown contains cost per service
                        type: object
                      currency:
                        default: USD
                        description: Currency is the currency code (always USD)
                        type: string
                      daysIncluded:
                        description: DaysIncluded is the number of days in the calculation
                        type: integer
                      endDate:
                        description: EndDate is the end of the billing period (today)
                        type: string
                      projectedMonthly:
                        description: ProjectedMonthly is the projected monthly cost
                        type: string
                      startDate:
                        description: StartDate is the start of the billing period
                        type: string
                    type: object
                  nextCalculation:
                    description: NextCalculation is when the next calculation is scheduled
                    format: date-time
                    type: string
                type: object
              eksAddons:
                description: EksAddons contains status of EKS managed add-ons
                items:
                  description: EksAddonStatus contains the status of an EKS add-on
                  properties:
                    name:
                      description: Name of the add-on
                      type: string
                    status:
                      description: Status of the add-on
                      type: string
                    version:
                      description: Version of the add-on
                      type: string
                  type: object
                type: array
              eksCluster:
                description: EKSCluster contains a reference to the created XEKS resource
                properties:
                  apiVersion:
                    description: API version of the resource
                    type: string
                  kind:
                    description: Kind of the resource
                    type: string
                  name:
                    description: Name of the resource
                    type: string
                  namespace:
                    description: Namespace of the resource (if namespaced)
                    type: string
                  uid:
                    description: UID of the resource
                    type: string
                type: object
              environmentConfig:
                description: EnvironmentConfig contains a reference to the created
                  EnvironmentConfig resource
                properties:
                  apiVersion:
                    description: API version of the resource
                    type: string
                  kind:
                    description: Kind of the resource
                    type: string
                  name:
                    description: Name of the resource
                    type: string
                  namespace:
                    description: Namespace of the resource (if namespaced)
                    type: string
                  uid:
                    description: UID of the resource
                    type: string
                type: object
              grafanaOIDC:
                description: GrafanaOIDC contains the Zitadel OIDC app status for
                  Grafana SSO
                properties:
                  appId:
                    description: AppID is the Zitadel application ID
                    type: string
                  clientId:
                    description: ClientID is the OIDC client ID
                    type: string
                  projectId:
                    description: ProjectID is the Zitadel project the app belongs
                      to
                    type: string
                  ready:
                    description: Ready indicates the OIDC app is created and credentials
                      are pushed to AWS SM
                    type: boolean
                  secretName:
                    description: SecretName is the AWS Secrets Manager key name for
                      OIDC credentials
                    type: string
                type: object
              iamRoles:
                description: IAMRoles contains IAM roles created for this cluster
                properties:
                  ecrRole:
                    description: ECRRole contains the ARN of the ECR credentials IAM
                      role for this cluster
                    type: string
                type: object
              lakeFSAPIUser:
                description: LakeFSAPIUser contains the Zitadel machine user status
                  for programmatic LakeFS API access
                properties:
                  clientId:
                    description: ClientID is the client ID for client_credentials
                      grant
                    type: string
                  ready:
