{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.18.0
  name: kubepools.schema.kubecore.io
spec:
  group: schema.kubecore.io
  names:
    kind: KubePool
    listKind: KubePoolList
    plural: kubepools
    singular: kubepool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.kubeOrgRef
      name: KubeOrg
      type: string
    - jsonPath: .status.cloudProvider
      name: Cloud Provider
      type: string
    - jsonPath: .status.region
      name: Region
      type: string
    - jsonPath: .status.clusterType
      name: Cluster Type
      type: string
    - jsonPath: .status.kubernetesVersion
      name: K8s Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: KubePool is the Schema for the kubepools API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KubePoolSpec defines the desired state of KubePool
            properties:
              cloudProvider:
                description: |-
                  CloudProvider holds the cloud-provider-specific cluster configuration.
                  Exactly one sub-spec (e.g., aws) must be set.
                properties:
                  aws:
                    description: |-
                      AWS holds AWS-specific cluster configuration. Set this field to provision
                      an EKS cluster on Amazon Web Services. Mutually exclusive with other providers.
                    properties:
                      cluster:
                        description: Cluster defines the EKS cluster configuration.
                        properties:
                          compute:
                            description: |-
                              Compute defines the catalog of CPU/GPU compute classes available to ML
                              KubeApps on this cluster. See MLComputeConfig for semantics. AWS-side
                              per-class Karpenter NodePool emission is a follow-up; the field is
                              honoured by the type system today so KubeApp validation can pin
                              classes that exist in the cluster catalog.
                            properties:
                              mlClasses:
                                description: |-
                                  MLClasses is the list of CPU and GPU classes the cluster exposes.
                                  The operator provisions one NodePool per class; idle classes scale
                                  to zero nodes.
                                items:
                                  description: |-
                                    MLComputeClass declares one named compute class in the cluster catalog.
                                    The Name becomes both the GKE NodePool name and the value of the
                                    platform.kubecore.io/nodegroup-type label that KubeApps target via
                                    nodeSelector. The Tier (cpu | gpu) drives default labels and toleration
                                    requirements on the WorkflowTemplate.

                                    The CEL rule below is the data-integrity guard for #357/#361: spot
                                    pricing (preemptible:true) is admitted ONLY on classes explicitly
                                    declared computeProfile: ephemeral-training. Because computeProfile
                                    defaults to stateful-serving, any class that sets preemptible:true
                                    without an explicit ephemeral-training profile is REJECTED at admission
                                    — including pre-existing classes from before this field existed, which
                                    is the exact 2026-06-03 preemptible-reclaim hazard. gke.go enforces the
                                    same invariant defensively even if admission is bypassed.
                                  properties:
                                    computeProfile:
                                      default: stateful-serving
                                      description: |-
                                        ComputeProfile declares the data-integrity posture of workloads that
                                        run on this class, which gates whether spot (preemptible) pricing is
                                        allowed:
                                          - "ephemeral-training": stateless/checkpointed jobs that tolerate
                                            mid-run eviction (the ONLY profile permitted to set
                                            preemptible:true).
                                          - "stateful-serving": serving pods holding model-weight / cache PVCs
                                            whose eviction loses in-flight or local state (#361).
                                          - "stateful-database": single-instance datastores (e.g. CNPG)
                                            where preemption + write-in-flight risks corruption / total
                                            loss (#357).
                                        Defaults to "stateful-serving" so an un-annotated class can never be
                                        scheduled on preemptible nodes — safety is the pool-wide default.
                                      enum:
                                      - ephemeral-training
                                      - stateful-serving
                                      - stateful-database
                                      type: string
                                    description:
                                      description: |-
                                        Description is shown in dashboard tooltips and in KubeApp validation
                                        error messages. Keep it short — "n2-standard-8 (8 vCPU, 32 GiB) —
                                        feature engineering / dataset transform".
                                      maxLength: 200
                                      type: string
                                    diskSizeGb:
                                      default: 50
                                      description: |-
                                        DiskSizeGb pins the per-node boot disk size. Bump for GPU
                                        training (model checkpoints + dataset cache fill quickly).
                                      format: int32
                                      maximum: 2000
                                      minimum: 20
                                      type: integer
                                    guestAccelerator:
                                      description: |-
                                        GuestAccelerator is required when Tier="gpu" on GCP. Its presence
                                        and validity is checked by the operator's reconciling phase.
                                      properties:
                                        count:
                                          description: |-
                                            Count is the number of GPUs per node. Most classes use 1; multi-
                                            GPU classes (e.g. 8×A100) use larger values bound by the machine
                                            type's spec.
                                          format: int32
                                          maximum: 16
                                          minimum: 1
                                          type: integer
                                        type:
                                          description: |-
                                            Type names the GCP accelerator (e.g. "nvidia-l4",
                                            "nvidia-tesla-t4", "nvidia-tesla-a100", "nvidia-h100-80gb").
                                            Must match GCP's accelerator catalog for the chosen MachineType.
                                          pattern: ^nvidia-[a-z0-9-]+$
                                          type: string
                                      required:
                                      - count
                                      - type
                                      type: object
                                    machineType:
                                      description: |-
                                        MachineType is the GCP machine type (e.g. "n2-standard-8",
                                        "g2-standard-4", "a2-highgpu-1g"). On AWS this field doubles as
                                        the EC2 instance type ("m6i.large", "g5.xlarge"); the operator
                                        adapter validates against the cloud's published catalog.
                                      minLength: 2
                                      type: string
                                    maxNodeCount:
                                      default: 4
                                      description: |-
                                        MaxNodeCount caps the autoscale ceiling for this class. Defaults
                                        to 4 — small enough to prevent runaway spend, large enough for
                                        most pipelines.
                                      format: int32
                                      maximum: 64
                                      minimum: 1
                                      type: integer
                                    name:
                                      description: |-
                                        Name is the developer-facing class name (e.g. "cpu-balanced",
                                        "gpu-l4-small"). Becomes the NodePool name and the
                                        platform.kubecore.io/nodegroup-type label. Must be DNS-1035
                                        compatible (lowercase, digits, hyphens; starts with a letter,
                                        ends with a letter or digit).
                                      maxLength: 40
                                      minLength: 2
                                      pattern: ^[a-z][a-z0-9-]*[a-z0-9]$
                                      type: string
                                    preemptible:
                                      description: |-
                                        Preemptible enables spot-tier pricing (~70% discount, eviction
                                        risk). Only set true on classes that explicitly handle preemption
                                        in their workflow steps. Admission rejects preemptible:true unless
                                        ComputeProfile is "ephemeral-training" (#357/#361).
                                      type: boolean
                                    tier:
                                      description: |-
                                        Tier is "cpu" or "gpu". Drives default labels/taints and
                                        determines whether GuestAccelerator is required.
                                      enum:
                                      - cpu
                                      - gpu
                                      type: string
                                  required:
                                  - machineType
                                  - name
                                  - tier
                                  type: object
                                  x-kubernetes-validations:
                                  - message: preemptible:true is only allowed when
                                      computeProfile is ephemeral-training (stateful-serving/stateful-database
                                      classes must run on-demand to avoid data loss
                                      on preemption)
                                    rule: '!has(self.preemptible) || !self.preemptible
                                      || self.computeProfile == ''ephemeral-training'''
                                maxItems: 32
                                type: array
                            type: object
                          kubernetesVersion:
                            default: "1.35"
                            description: KubernetesVersion specifies the Kubernetes
                              version for the cluster
                            pattern: ^[0-9]+\.[0-9]+$
                            type: string
                          system:
                            description: System defines configuration for the system
                              node group (kubecoresys)
                            properties:
                              capacityType:
                                default: SPOT
                                description: CapacityType specifies the capacity type
                                  for system nodes
                                enum:
                                - ON_DEMAND
                                - SPOT
                                type: string
                            type: object
                          tags:
                            additionalProperties:
                              type: string
                            description: Tags are additional tags to apply to the
                              EKS cluster
                            type: object
                          type:
                            allOf:
                            - enum:
                              - shared
                              - dedicated
                            - enum:
                              - shared
                              - dedicated
                            description: Type specifies whether this is a shared or
                              dedicated cluster
                            type: string
                        required:
                        - kubernetesVersion
                        - type
                        type: object
                      region:
                        description: |-
                          Region is the AWS region where the EKS cluster will be created.
                          Must match one of the regions configured in the referenced KubeOrg.
                        pattern: ^[a-z]{2}-[a-z]+-[0-9]{1}$
                        type: string
                    required:
                    - cluster
                    - region
                    type: object
                  azure:
                    description: |-
                      Azure holds Azure-specific cluster configuration. Set this field to
                      provision an AKS cluster on Microsoft Azure. Mutually exclusive with
                      other providers.
                    properties:
                      cluster:
                        description: Cluster defines the AKS cluster configuration.
                        properties:
                          kubernetesVersion:
                            default: "1.35"
                            description: KubernetesVersion specifies the AKS version.
                            pattern: ^[0-9]+\.[0-9]+$
                            type: string
                          private:
                            description: Private enables private cluster mode (API
                              server not exposed publicly).
                            type: boolean
                          system:
                            description: System defines configuration for the system
                              node pool (kubecsys per CON-AZ-03).
                            properties:
                              machineType:
                                description: |-
                                  MachineType specifies the Azure VM size for system nodes.
                                  Default (operator-side): Standard_D2ds_v5.
                                  Must be a Ddsv5 (or compatible local-SSD) family for ephemeral OS disk.
                                type: string
                              preemptible:
                                description: |-
                                  Preemptible overrides whether the system pool uses Spot priority. When
                                  nil, the operator default applies (false / on-demand — system addons are
                                  eviction-sensitive). Set explicitly only when the operator default is
                                  not appropriate for your subscription's quota or stability needs.
                                type: boolean
                            type: object
                          tags:
                            additionalProperties:
                              type: string
                            description: Tags are additional Azure tags to apply to
                              the AKS cluster.
                            type: object
                          tools:
                            description: |-
                              Tools defines configuration for the KubeCore tools node pool
                              (kubecoresys). Presence of this field opts the cluster into the
                              dual-pool architecture (D-AZ-12-7). When nil, legacy single-pool
                              layout is used.
                            properties:
                              machineType:
                                description: |-
                                  MachineType specifies the Azure VM size for tools nodes.
                                  Default (operator-side): Standard_D4ds_v5.
                                  Must be a Ddsv5 (or compatible local-SSD) family for ephemeral OS disk.
                                type: string
                              maxNodes:
                                default: 2
                                description: MaxNodes is the maximum number of nodes
                                  (autoscaler ceiling).
                                format: int32
                                minimum: 1
                                type: integer
                              minNodes:
                                default: 1
                                description: MinNodes is the minimum number of nodes
                                  (autoscaler floor).
                                format: int32
                                minimum: 1
                                type: integer
                              preemptible:
                                description: |-
                                  Preemptible overrides whether the tools pool uses Spot priority. When
                                  nil, the operator default applies (true / spot — dev-mode cost
                                  optimization). Set false to use on-demand capacity (e.g. when the
                                  subscription's LowPriorityCores quota is insufficient).
                                type: boolean
                            type: object
                          type:
                            allOf:
                            - enum:
                              - shared
                              - dedicated
                            - enum:
                              - shared
                              - dedicated
                            description: Type specifies whether this is a shared or
                              dedicated cluster.
                            type: string
                        required:
                        - kubernetesVersion
                        - type
                        type: object
                      region:
                        description: Region is the Azure region where the AKS cluster
                          will be created (e.g., westeurope).
                        minLength: 1
                        type: string
                    required:
                    - cluster
                    - region
                    type: object
                  gcp:
                    description: GCP holds GCP-specific cluster configuration. Mutually
                      exclusive with other providers.
                    properties:
                      cluster:
                        description: Cluster defines the GKE cluster configuration.
                        properties:
                          compute:
                            description: |-
                              Compute defines the cluster's ML compute classes (PRD-247 D-03 follow-up).
                              Declare exactly one cpu-tier and one gpu-tier class; each becomes a
                              dedicated GKE NodePool that autoscales from 0 — no nodes when idle.
                              These two classes are the SINGLE source of truth for ML pipeline compute:
                              the operator projects the cpu+gpu pair into each ML KubeApp's pipeline
                              context. A pipeline step routes to the gpu class iff its {step}-gpu submit
                              param is >0, else the cpu class — the engineer sets the request on the
                              Argo Submit form. KubeApps declare no class selection.
                            properties:
                              mlClasses:
                                description: |-
                                  MLClasses is the list of CPU and GPU classes the cluster exposes.
                                  The operator provisions one NodePool per class; idle classes scale
                                  to zero nodes.
                                items:
                                  description: |-
                                    MLComputeClass declares one named compute class in the cluster catalog.
                                    The Name becomes both the GKE NodePool name and the value of the
                                    platform.kubecore.io/nodegroup-type label that KubeApps target via
                                    nodeSelector. The Tier (cpu | gpu) drives default labels and toleration
                                    requirements on the WorkflowTemplate.

                                    The CEL rule below is the data-integrity guard for #357/#361: spot
                                    pricing (preemptible:true) is admitted ONLY on classes explicitly
                                    declared computeProfile: ephemeral-training. Because computeProfile
                                    defaults to stateful-serving, any class that sets preemptible:true
                                    without an explicit ephemeral-training profile is REJECTED at admission
                                    — including pre-existing classes from before this field existed, which
                                    is the exact 2026-06-03 preemptible-reclaim hazard. gke.go enforces the
                                    same invariant defensively even if admission is bypassed.
                                  properties:
                                    computeProfile:
                                      default: stateful-serving
                                      description: |-
                                        ComputeProfile declares the data-integrity posture of workloads that
                                        run on this class, which gates whether spot (preemptible) pricing is
                                        allowed:
                                          - "ephemeral-training": stateless/checkpointed jobs that tolerate
                                            mid-run eviction (the ONLY profile permitted to set
                                            preemptible:true).
                                          - "stateful-serving": serving pods holding model-weight / cache PVCs
                                            whose eviction loses in-flight or local state (#361).
                                          - "stateful-database": single-instance datastores (e.g. CNPG)
                                            where preemption + write-in-flight risks corruption / total
                                            loss (#357).
                                        Defaults to "stateful-serving" so an un-annotated class can never be
                                        scheduled on preemptible nodes — safety is the pool-wide default.
                                      enum:
                                      - ephemeral-training
                                      - stateful-serving
                                      - stateful-database
                                      type: string
                                    description:
                                      description: |-
                                        Description is shown in dashboard tooltips and in KubeApp validation
                                        error messages. Keep it short — "n2-standard-8 (8 vCPU, 32 GiB) —
                                        feature engineering / dataset transform".
                                      maxLength: 200
                                      type: string
                                    diskSizeGb:
                                      default: 50
                                      description: |-
                                        DiskSizeGb pins the per-node boot disk size. Bump for GPU
                                        training (model checkpoints + dataset cache fill quickly).
                                      format: int32
                                      maximum: 2000
                                      minimum: 20
                                      type: integer
                                    guestAccelerator:
                                      description: |-
                                        GuestAccelerator is required when Tier="gpu" on GCP. Its presence
                                        and validity is checked by the operator's reconciling phase.
                                      properties:
                                        count:
                                          description: |-
                                            Count is the number of GPUs per node. Most classes use 1; multi-
                                            GPU classes (e.g. 8×A100) use larger values bound by the machine
                                            type's spec.
                                          format: int32
                                          maximum: 16
                                          minimum: 1
                                          type: integer
                                        type:
                                          description: |-
                                            Type names the GCP accelerator (e.g. "nvidia-l4",
                                            "nvidia-tesla-t4", "nvidia-tesla-a100", "nvidia-h100-80gb").
                                            Must match GCP's accelerator catalog for the chosen MachineType.
                                          pattern: ^nvidia-[a-z0-9-]+$
                                          type: string
                                      required:
                                      - count
                                      - type
                                      type: object
                                    machineType:
                                      description: |-
                                        MachineType is the GCP machine type (e.g. "n2-standard-8",
                                        "g2-standard-4", "a2-highgpu-1g"). On AWS this field doubles as
                                        the EC2 instance type ("m6i.large", "g5.xlarge"); the operator
                                        adapter validates against the cloud's published catalog.
                                      minLength: 2
                                      type: string
                                    maxNodeCount:
                                      default: 4
                                      description: |-
                                        MaxNodeCount caps the autoscale ceiling for this class. Defaults
                                        to 4 — small enough to prevent runaway spend, large enough for
                                        most pipelines.
                                      format: int32
                                      maximum: 64
                                      minimum: 1
                                      type: integer
                                    name:
                                      description: |-
                                        Name is the developer-facing class name (e.g. "cpu-balanced",
                                        "gpu-l4-small"). Becomes the NodePool name and the
                                        platform.kubecore.io/nodegroup-type label. Must be DNS-1035
                                        compatible (lowercase, digits, hyphens; starts with a letter,
                                        ends with a letter or digit).
                                      maxLength: 40
                                      minLength: 2
                                      pattern: ^[a-z][a-z0-9-]*[a-z0-9]$
                                      type: string
                                    preemptible:
                                      description: |-
                                        Preemptible enables spot-tier pricing (~70% discount, eviction
                                        risk). Only set true on classes that explicitly handle preemption
                                        in their workflow steps. Admission rejects preemptible:true unless
                                        ComputeProfile is "ephemeral-training" (#357/#361).
                                      type: boolean
                                    tier:
                                      description: |-
                                        Tier is "cpu" or "gpu". Drives default labels/taints and
                                        determines whether GuestAccelerator is required.
                                      enum:
                                      - cpu
                                      - gpu
                                      type: string
                                  required:
                                  - machineType
                                  - name
                                  - tier
                                  type: object
                                  x-kubernetes-validations:
                                  - message: preemptible:true is only allowed when
                                      computeProfile is ephemeral-training (stateful-serving/stateful-database
                                      classes must run on-demand to avoid data loss
                                      on preemption)
                                    rule: '!has(self.preemptible) || !self.preemptible
                                      || self.computeProfile == ''ephemeral-training'''
                                maxItems: 32
                                type: array
                            type: object
                          kubernetesVersion:
                            default: "1.35"
                            description: KubernetesVersion specifies the GKE version.
                            type: string
                          labels:
                            additionalProperties:
                              type: string
                            description: Labels are additional GCP resource labels
                              to apply to the GKE cluster.
                            type: object
                          private:
                            default: true
                            description: Private enables private cluster mode (nodes
                              get only private IPs).
                            type: boolean
                          releaseChannel:
                            default: REGULAR
                            description: ReleaseChannel specifies the GKE release
                              channel for managed version upgrades.
                            enum:
                            - RAPID
                            - REGULAR
                            - STABLE
                            type: string
                          system:
                            description: System defines configuration for the system
                              node pool (kubecoresys).
                            properties:
                              machineType:
                                default: e2-standard-4
                                description: MachineType specifies the GCE machine
                                  type for system nodes.
                                type: string
                            type: object
                          type:
                            allOf:
                            - enum:
                              - shared
                              - dedicated
                            - enum:
                              - shared
                              - dedicated
                            description: Type specifies whether this is a shared or
                              dedicated cluster.
                            type: string
                        required:
                        - kubernetesVersion
                        - type
                        type: object
                      region:
                        description: Region is the GCP region where the GKE cluster
                          will be created (e.g., europe-west1).
                        minLength: 1
                        type: string
                      zone:
                        description: |-
                          Zone optionally pins the zone for a zonal (non-production) GKE cluster, e.g.
                          "us-central1-a". When empty, the operator derives region + "-c" by default.
                          Set this to escape a GCE_STOCKOUT (capacity shortage) in the default "-c"
                          zone without changing the region. Must belong to spec Region. Ignored for
                          production (regional) clusters, which span all zones in the region.
                        pattern: ^[a-z]+-[a-z0-9]+-[a-z]$
                        type: string
                    required:
                    - cluster
                    - region
                    type: object
                type: object
              clusterMode:
                allOf:
                - enum:
                  - dev
                  - production
                - enum:
                  - dev
                  - production
                default: dev
                description: |-
                  ClusterMode declares the intent of this cluster: "dev" (cost-optimized,
                  single-pool co-location, platform tools at replicas=1, zonal GKE placement)
                  or "production" (dedicated node pools, platform tools at replicas>=2 with
                  hostname anti-affinity, regional GKE placement).

                  Immutable after creation — switching modes would require destructive
                  rebuilds of node pools and workloads. To move a workload between modes,
                  create a new KubePool and migrate.

                  Default "dev" preserves backward compatibility with existing KubePools
                  that were created before this field existed and already run the
                  single-pool topology that dev mode codifies.
                type: string
                x-kubernetes-validations:
                - message: clusterMode is immutable
                  rule: self == oldSelf
              environmentTemplates:
                description: |-
                  EnvironmentTemplates define rich templates for KubEnv creation by KubeProject resources
                  Platform teams manage these templates to provide pre-configured environments
                items:
                  description: EnvironmentTemplate defines a complete environment
                    template for KubEnv creation
                  properties:
                    costControls:
                      description: CostControls defines cost management policies for
                        environments
                      properties:
                        maxMonthlyCost:
                          description: MaxMonthlyCost specifies the maximum monthly
                            cost in USD as a string
                          type: string
                        shutdownSchedule:
                          description: ShutdownSchedule specifies when to shut down
                            the environment (cron format)
                          type: string
                        startupSchedule:
                          description: StartupSchedule specifies when to start up
                            the environment (cron format)
                          type: string
                      type: object
                    description:
                      description: Description explains the purpose and characteristics
                        of this template
                      type: string
                    displayName:
                      description: DisplayName is a human-readable name for the template
                      minLength: 1
                      type: string
                    environmentType:
                      allOf:
                      - enum:
                        - dev
                        - stage
                        - prod
                      - enum:
                        - dev
                        - stage
                        - prod
                      description: EnvironmentType specifies the type of environment
                        (dev, stage, prod)
                      type: string
                    features:
                      description: Features defines which features are enabled for
                        environments using this template
                      properties:
                        autoScaling:
                          default: false
                          description: AutoScaling enables horizontal pod autoscaling
                          type: boolean
                        backups:
                          default: false
                          description: Backups enables backup capabilities for the
                            environment
                          type: boolean
                        disasterRecovery:
                          default: false
                          description: DisasterRecovery enables disaster recovery
                            capabilities
                          type: boolean
                        logging:
                          default: true
                          description: Logging enables logging stack for the environment
                          type: boolean
                        mlStack:
                          description: |-
                            MLStack defines ML stack toggles for environments using this template.
                            Only applied when the KubePool has features.ml and operators.postgres (cluster is ML capable).
                            Provisions one Postgres + MLflow + optional S3 per project environment when enabled.
                          properties:
                            mlflow:
                              default: false
                              description: MLflow enables MLflow for this environment
                                (requires Postgres as backend)
                              type: boolean
                            postgres:
                              default: false
                              description: Postgres enables a Postgres instance for
                                this environment's ML stack (MLflow backend)
                              type: boolean
                            s3:
                              default: false
                              description: S3 enables S3 bucket and IRSA for MLflow
                                artifact storage (only used when MLflow is enabled)
                              type: boolean
                          type: object
                        monitoring:
                          default: true
                          description: Monitoring enables monitoring stack for the
                            environment
                          type: boolean
                        nodeGroupTaints:
                          default: true
                          description: NodeGroupTaints enables node group taints for
                            environment isolation
                          type: boolean
                      type: object
                    lifecycle:
                      description: Lifecycle defines lifecycle management policies
                        for environments
                      properties:
                        autoDestroy:
                          default: false
                          description: AutoDestroy enables automatic destruction of
                            the environment
                          type: boolean
                        ttl:
                          description: TTL specifies the time-to-live for the environment
                            (e.g., "24h", "7d")
                          type: string
                      type: object
                    name:
                      description: Name of the environment template (e.g., "small-dev",
                        "large-production")
                      minLength: 1
