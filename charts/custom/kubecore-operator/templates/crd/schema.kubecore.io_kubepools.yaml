er":"10m"},"spec.cloudProvider.azure.cluster.autoScalerProfile.scaleDownUnneeded":{"label":"Idle time before removal","help":"How long a node must be unneeded before it is removed, for example 10m.","group":"azure","order":92,"placeholder":"10m"},"spec.cloudProvider.azure.cluster.autoScalerProfile.scaleDownUtilizationThreshold":{"label":"Scale-down utilisation threshold","help":"Nodes using less than this share of their capacity may be removed, as a decimal such as 0.5.","group":"azure","order":93,"placeholder":"0.5"},"spec.cloudProvider.azure.cluster.kubernetesVersion":{"label":"Kubernetes version","help":"The Kubernetes minor version, for example 1.35. Only a platform administrator can change it later.","group":"azure","order":40,"tier":"basic","widget":"select","options":"kubernetesVersions","lock":{"mode":"platformAdmin","reason":"Only a platform administrator can change the Kubernetes version.","policy":"d4-kubepool-azure-kubernetes-version-platform-admin-only"},"enum":["1.32","1.33","1.34","1.35"]},"spec.cloudProvider.azure.cluster.private":{"label":"Private cluster","help":"Keeps the cluster API off the public internet.","group":"azure","order":50},"spec.cloudProvider.azure.cluster.system":{"group":"azure"},"spec.cloudProvider.azure.cluster.system.machineType":{"label":"System node VM size","help":"Azure VM size for the default node pool, for example Standard_D2ds_v5.","group":"azure","order":60},"spec.cloudProvider.azure.cluster.system.preemptible":{"label":"Spot system nodes","help":"Run the default node pool on Spot capacity. Leave unset for the safe on-demand default.","group":"azure","order":70},"spec.cloudProvider.azure.cluster.systemNodeGroup":{"group":"azure"},"spec.cloudProvider.azure.cluster.systemNodeGroup.capacityType":{"label":"System node capacity","help":"On-demand is stable. Spot is cheaper but can be reclaimed; it is allowed only for dev clusters.","group":"azure","order":90,"enum":["on-demand","spot"]},"spec.cloudProvider.azure.cluster.tags"