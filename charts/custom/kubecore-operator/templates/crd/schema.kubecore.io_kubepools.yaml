ts data.","policy":"d2-kubepool-features-observability-monotonic"}},"spec.features.tracing":{"label":"Tracing","help":"Collects request traces from the gateway and the mesh. Needs monitoring. On by default.","group":"capabilities","order":80},"spec.features.zotRegistry":{"label":"Built-in container registry","help":"Runs a container registry inside the cluster. Fixed once set: turning it off would delete stored images.","group":"capabilities","order":20,"lock":{"mode":"immutable","reason":"The built-in registry is fixed once set; turning it off would delete stored images.","policy":"d2-kubepool-features-zot-registry-immutable"}},"spec.kaosCloud":{"label":"KAOS Cloud","help":"The connection between this cluster and the KAOS control plane.","group":"connectivity"},"spec.kaosCloud.costExport":{"label":"Share cost data with KAOS","help":"Sends this cluster''s cost figures to the KAOS console. Needs cost tracking and the secure connection. Off by default.","group":"connectivity","order":50},"spec.kaosCloud.osr":{"group":"connectivity"},"spec.kaosCloud.osr.chartVersion":{"label":"Insights agent version","help":"Pins the insights agent version for this cluster. Leave empty to follow the platform default.","group":"connectivity","order":80},"spec.kaosCloud.osr.enabled":{"label":"Cluster insights","help":"Lets the KAOS assistant observe this cluster''s state. Needs the secure connection. On by default.","group":"connectivity","order":60},"spec.kaosCloud.osr.liveQuery":{"label":"Live state queries","help":"Lets the KAOS assistant read live cluster state on demand. Read-only. On by default.","group":"connectivity","order":70},"spec.kaosCloud.secureConnection":{"label":"Secure connection to KAOS","help":"An encrypted link between this cluster and the KAOS control plane. On by default.","group":"connectivity","order":40},"spec.kubeOrgRef":{"label":"Organization","help":"The organization this cluster belongs to. Fixed once the cluster exists.","group":"basics","order":10,"tier":"basic","widget":"select","options":"ref:KubeOrg","lock":{"mode":"immutable","reason":"A cluster cannot move to another organization.","policy":"d1-kubepool-kube-org-ref-immutable"}},"spec.observability":{"group":"capabilities"},"spec.observability.resourceProfile":{"label":"Monitoring size","help":"Capacity of the metrics store: small, medium or large. Defaults to small.","group":"capabilities","order":15,"enum":["small","medium","large"]},"spec.operators":{"label":"Shared services","group":"capabilities"},"spec.operators.postgres":{"label":"Shared PostgreSQL","help":"A shared PostgreSQL database cluster that ML stacks and apps can use. Once on, it cannot be turned off.","group":"capabilities","order":90,"lock":{"mode":"enableOnly","reason":"Shared PostgreSQL can be turned on but not off; turning it off would delete its databases.","policy":"d2-kubepool-operators-postgres-monotonic"}},"spec.operators.redis":{"label":"Shared Redis","help":"A shared Redis instance apps can connect to. Once on, it cannot be turned off.","group":"capabilities","order":100,"lock":{"mode":"enableOnly","reason":"Shared Redis can be turned on but not off; turning it off would delete its data.","policy":"d2-kubepool-operators-redis-monotonic"}},"spec.registries":{"label":"Container registries","help":"Registries workloads on this cluster may use. Leave empty to use the built-in registry.","group":"registries","order":10,"itemLabel":"Registry"},"spec.registries[].gar":{"group":"registries"},"spec.registries[].gar.location":{"label":"Artifact Registry location","help":"Location of the Google Artifact Registry, for example europe-west1.","group":"registries","order":30,"tier":"advanced","placeholder":"europe-west1"},"spec.registries[].name":{"label":"Registry name","help":"Short name projects use to pick this registry.","group":"registries","order":10,"tier":"advanced"},"spec.registries[].type":{"label":"Registry type","help":"zot is the built-in registry; gar is Google Artifact Registry.","group":"registries","order":20,"tier":"advanced","enum":["zot","gar"]},"spec.registries[].zot":{"group":"registries"},"spec.registries[].zot.storageSize":{"label":"Registry storage size","help":"Disk size of the built-in registry, for example 200Gi. It can only grow.","group":"registries","order":40,"placeholder":"200Gi","lock":{"mode":"growOnly","reason":"Registry storage can only grow; a disk cannot shrink.","policy":"d3-kubepool-zot-storage-size-grow-only"}},"spec.systemProfile":{"label":"System node size","help":"Size of the nodes that run platform services: small for dev, medium for staging, ha for production.","group":"basics","order":30,"tier":"basic","enum":["small","medium","ha"]},"spec.tls":{"label":"Certificates","help":"Automatic TLS certificates for apps on this cluster.","group":"connectivity"},"spec.tls.issuer":{"label":"Certificates","help":"Automatic TLS certificates for apps on this cluster.","group":"connectivity"},"spec.tls.issuer.acmeServer":{"label":"Certificate authority URL","help":"The ACME server certificates come from. Keep the default unless told otherwise.","group":"connectivity","order":30,"showIf":"spec.tls.issuer.enabled"},"spec.tls.issuer.email":{"label":"Certificate contact email","help":"Email the certificate authority uses for expiry and account notices.","group":"connectivity","order":20,"showIf":"spec.tls.issuer.enabled"},"spec.tls.issuer.enabled":{"label":"Automatic certificates","help":"Issues free TLS certificates from Let''s Encrypt for apps on this cluster.","group":"connectivity","order":10,"tier":"advanced"}},"choices":[{"id":"cloud","label":"Cloud provider","help":"Where the cluster runs. Pick one cloud your organization is set up for; it is fixed once the cluster exists.","options":[{"value":"gcp","label":"Google Cloud (GKE)","path":"spec.cloudProvider.gcp"},{"value":"aws","label":"Amazon Web Services (EKS)","path":"spec.cloudProvider.aws"},{"value":"azure","label":"Microsoft Azure (AKS)","path":"spec.cloudProvider.azure"}