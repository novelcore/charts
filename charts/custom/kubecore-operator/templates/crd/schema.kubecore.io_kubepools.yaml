bels","help":"Extra labels added to the cluster''s cloud resources, for cost allocation.","group":"gcp","order":100,"widget":"keyvalue"},"spec.cloudProvider.gcp.cluster.private":{"label":"Private cluster","help":"Keeps nodes and the cluster API off the public internet. Recommended.","group":"gcp","order":60},"spec.cloudProvider.gcp.cluster.releaseChannel":{"label":"Release channel","help":"How quickly Google applies automatic upgrades. REGULAR is the balanced default.","group":"gcp","order":50},"spec.cloudProvider.gcp.cluster.system":{"group":"gcp"},"spec.cloudProvider.gcp.cluster.system.machineType":{"label":"System node machine type","help":"Machine type for the nodes that run platform services, for example e2-standard-4.","group":"gcp","order":80},"spec.cloudProvider.gcp.cluster.systemNodeGroup":{"group":"gcp"},"spec.cloudProvider.gcp.cluster.systemNodeGroup.capacityType":{"label":"System node capacity","help":"On-demand is stable. Spot is cheaper but can be reclaimed; it is allowed only for dev clusters.","group":"gcp","order":90,"enum":["on-demand","spot"]},"spec.cloudProvider.gcp.cluster.type":{"label":"Cluster type","help":"Shared hosts many projects at lower cost; dedicated gives one tenant full isolation. Fixed once the cluster exists.","group":"gcp","order":30,"tier":"basic","lock":{"mode":"immutable","reason":"Shared or dedicated is fixed once the cluster exists.","policy":"d2-kubepool-gcp-cluster-type-immutable"}},"spec.cloudProvider.gcp.region":{"label":"Region","help":"The Google Cloud region for the cluster, for example europe-west1. Must be one of your organization''s regions. Fixed once the cluster exists.","group":"gcp","order":10,"tier":"basic","widget":"select","options":"orgRegions","placeholder":"europe-west1","lock":{"mode":"immutable","reason":"A cluster''s region is fixed once it exists.","policy":"d2-kubepool-gcp-region-immutable"}},"spec.cloudProvider.gcp.zone":{"label":"Zone","help":"Optional zone for a dev cluster, for example europe-wes