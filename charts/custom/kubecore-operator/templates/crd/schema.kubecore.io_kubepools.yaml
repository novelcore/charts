  name: kubepools.schema.kubecore.io
spec:
  group: schema.kubecore.io
  names:
    kind: KubePool
    listKind: KubePoolList
    plural: kubepools
    singular: kubepool
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .spec.kubeOrgRef
          name: KubeOrg
          type: string
        - jsonPath: .status.cloudProvider
          name: Cloud Provider
          type: string
        - jsonPath: .status.region
          name: Region
          type: string
        - jsonPath: .status.clusterType
          name: Cluster Type
          type: string
        - jsonPath: .status.kubernetesVersion
          name: K8s Version
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1beta1
      schema:
        openAPIV3Schema:
          description: KubePool is the Schema for the kubepools API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: KubePoolSpec defines the desired state of KubePool
              properties:
                cloudProvider:
                  description: |-
                    CloudProvider holds the cloud-provider-specific cluster configuration.
                    Exactly one sub-spec (e.g., aws) must be set.
                  properties:
                    aws:
                      description: |-
                        AWS holds AWS-specific cluster configuration. Set this field to provision
                        an EKS cluster on Amazon Web Services. Mutually exclusive with other providers.
                      properties:
                        cluster:
                          description: Cluster defines the EKS cluster configuration.
                          properties:
                            compute:
                              description: |-
                                Compute is DEPRECATED and ignored (kubecore-operator#1398); see the GCP
                                field. ML compute comes from KubeProject ml environments.
                              properties:
                                mlClasses:
                                  description: |-
                                    MLClasses is the list of CPU and GPU classes the cluster exposes.
                                    The operator provisions one NodePool per class; idle classes scale
                                    to zero nodes.

                                    DEPRECATED and ignored (PRD-1124, kubecore-operator#1398): ML compute is
                                    each ml environment's declared flavours (KubeProject environments[].ml,
                                    rendered per environment by kubenv). Nothing is provisioned from this
                                    list; leave it empty.
                                  items:
                                    description: |-
                                      MLComputeClass declares one named compute class in the cluster catalog.
                                      The Name becomes both the GKE NodePool name and the value of the
                                      platform.kubecore.io/nodegroup-type label that KubeApps target via
                                      nodeSelector. The Tier (cpu | gpu) drives default labels and toleration
                                      requirements on the WorkflowTemplate.

                                      The CEL rule below is the data-integrity guard for #357/#361: spot
                                      pricing (preemptible:true) is admitted ONLY on classes explicitly
                                      declared computeProfile: ephemeral-training. Because computeProfile
                                      defaults to stateful-serving, any class that sets preemptible:true
                                      without an explicit ephemeral-training profile is REJECTED at admission
                                      — including pre-existing classes from before this field existed, which
                                      is the exact 2026-06-03 preemptible-reclaim hazard. gke.go enforces the
                                      same invariant defensively even if admission is bypassed.
                                    properties:
                                      computeProfile:
                                        default: stateful-serving
                                        description: |-
                                          ComputeProfile declares the data-integrity posture of workloads that
                                          run on this class, which gates whether spot (preemptible) pricing is
                                          allowed:
                                            - "ephemeral-training": stateless/checkpointed jobs that tolerate
                                              mid-run eviction (the ONLY profile permitted to set
                                              preemptible:true).
                                            - "stateful-serving": serving pods holding model-weight / cache PVCs
                                              whose eviction loses in-flight or local state (#361).
                                            - "stateful-database": single-instance datastores (e.g. CNPG)
                                              where preemption + write-in-flight risks corruption / total
                                              loss (#357).
                                          Defaults to "stateful-serving" so an un-annotated class can never be
                                          scheduled on preemptible nodes — safety is the pool-wide default.
                                        enum:
                                          - ephemeral-training
                                          - stateful-serving
                                          - stateful-database
                                        type: string
                                      description:
                                        description: |-
                                          Description is shown in dashboard tooltips and in KubeApp validation
                                          error messages. Keep it short — "n2-standard-8 (8 vCPU, 32 GiB) —
                                          feature engineering / dataset transform".
                                        maxLength: 200
                                        type: string
                                      diskSizeGb:
                                        default: 50
                                        description: |-
                                          DiskSizeGb pins the per-node boot disk size. Bump for GPU
                                          training (model checkpoints + dataset cache fill quickly).
                                        format: int32
                                        maximum: 2000
                                        minimum: 20
                                        type: integer
                                      guestAccelerator:
                                        description: |-
                                          GuestAccelerator is required when Tier="gpu" on GCP. Its presence
                                          and validity is checked by the operator's reconciling phase.
                                        properties:
                                          count:
                                            description: |-
                                              Count is the number of GPUs per node. Most classes use 1; multi-
                                              GPU classes (e.g. 8×A100) use larger values bound by the machine
                                              type's spec.
                                            format: int32
                                            maximum: 16
                                            minimum: 1
                                            type: integer
                                          type:
                                            description: |-
                                              Type names the GCP accelerator (e.g. "nvidia-l4",
