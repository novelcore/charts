{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.18.0
    graph.kubecore.io/relationships: |
      - target: KubeProject
        field: spec.kubeProjectRef
        relationship: references
        cardinality: "*:1"
        required: true
        description: "KubeApp references a KubeProject for project-level configuration"
      - target: XKubeAppTemplate
        field: spec.kubeAppTemplateRef
        relationship: references
        cardinality: "*:1"
        required: true
        description: "Application template for this app"
    graph.kubecore.io/hierarchy-label: kubecore.io/kubeapp
    graph.kubecore.io/xr-mappings: |
      - xrKind: XGitHubApp
        apiVersion: github.platform.kubecore.io/v1alpha1
        cardinality: "1:1"
        description: "GitHub application repository"
      - xrKind: XK8sApp
        apiVersion: k8s.platform.kubecore.io/v1alpha1
        cardinality: "1:1"
        description: "Kubernetes application deployment (standard)"
      - xrKind: XK8sMLApp
        apiVersion: k8s.platform.kubecore.io/v1alpha1
        cardinality: "1:1"
        description: "Kubernetes ML-pipeline application (when kubeAppTemplateRef type=ml-pipeline)"
  name: kubeapps.schema.kubecore.io
spec:
  group: schema.kubecore.io
  names:
    kind: KubeApp
    listKind: KubeAppList
    plural: kubeapps
    singular: kubeapp
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .spec.kubeProjectRef
          name: Project
          type: string
        - jsonPath: .spec.kubeAppTemplateRef
          name: Template
          type: string
        - jsonPath: .spec.profile
          name: Profile
          type: string
        - jsonPath: .status.repositoryUrl
          name: Repository
          type: string
        - jsonPath: .status.applicationStatus.ready
          name: Ready
          type: boolean
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1beta1
      schema:
        openAPIV3Schema:
          description: KubeApp is the Schema for the kubeapps API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: KubeAppSpec defines the desired state of KubeApp
              properties:
                dedicatedEnvironment:
                  description: |-
                    Gives this app its own namespace and node group, not the project's.

                    Provisions an app-exclusive namespace + dedicated node group per targeted environment
                    (PRD-KUBENV-001 Part A, D-05), instead of sharing the project environment's namespace
                    and node group. When set, the operator creates one XKubEnv named {project}-{app}-{env}
                    for each environment this app is selected into via environmentSelector. Pool and cloud
                    are derived from each targeted ProjectEnvironment's kubePool (no kubePool field here).
                    Requires at least one selected environment.
                  properties:
                    ml:
                      description: |-
                        ML makes the app's dedicated environment an ML one (PRD-1124 D-07): for
                        the targeted `ml`-typed environment the operator provisions an
                        app-exclusive namespace ({project}-{app}--{env}), the pipeline runtime
                        wiring, and one whole-node scale-to-zero pool per listed flavour —
                        tainted and labelled for THIS app, so its steps never share the
                        environment's pools. Same shape and rules as
                        KubeProject.spec.environments[].ml; the step dropdown offers exactly
                        these flavours. The project's single MLOps stack is still used. Only
                        valid when the selected environment is of type ml.
                      properties:
                        cpu:
                          description: CPU flavour pools for CPU-only pipeline steps.
                          items:
                            description: MLTierCompute is one flavour pool of an ml environment.
                            properties:
                              maxNodes:
                                default: 2
                                description: |-
                                  MaxNodes bounds the pool's 0→N autoscale. Each step takes a whole
                                  node, so this is the maximum number of concurrent steps on this
                                  flavour. Min is always 0 (scale-to-zero is the point of the model).
                                maximum: 8
                                minimum: 1
                                type: integer
                              size:
                                description: |-
                                  Size is the platform t-shirt size of the whole node a step runs on.
                                  The mapping to machine type / accelerator is owned by the platform
                                  (PRD-1124 CON-03); the enum here is pinned to that catalog by test.
                                enum:
                                  - small
                                  - medium
                                  - large
                                type: string
                            required:
                              - size
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                            - size
                          x-kubernetes-list-type: map
                        gpu:
                          description: GPU flavour pools for steps that request nvidia.com/gpu.
                          items:
                            description: MLTierCompute is one flavour pool of an ml environment.
                            properties:
                              maxNodes:
                                default: 2
                                description: |-
                                  MaxNodes bounds the pool's 0→N autoscale. Each step takes a whole
                                  node, so this is the maximum number of concurrent steps on this
                                  flavour. Min is always 0 (scale-to-zero is the point of the model).
                                maximum: 8
                                minimum: 1
                                type: integer
                              size:
                                description: |-
                                  Size is the platform t-shirt size of the whole node a step runs on.
                                  The mapping to machine type / accelerator is owned by the platform
                                  (PRD-1124 CON-03); the enum here is pinned to that catalog by test.
                                enum:
                                  - small
                                  - medium
                                  - large
                                type: string
                            required:
                              - size
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                            - size
                          x-kubernetes-list-type: map
                      type: object
                    nodeGroup:
                      description: |-
                        NodeGroup is the default dedicated node-group definition applied to EVERY
                        environment this app is selected into, unless overridden per environment in
                        Overrides. Service (deployment) apps set this. Optional since PRD-1124 D-07:
                        an ML pipeline app declares `ml` instead.
                      properties:
                        arch:
                          default: amd64
                          description: |-
                            Sets the node CPU architecture; only used alongside size, ignored once machineType pins a raw SKU.

                            When MachineType pins a raw SKU, the architecture is whatever that SKU is.
                          enum:
                            - amd64
                            - arm64
                          type: string
                        capacityType:
                          default: on-demand
                          description: |-
                            Chooses on-demand vs interruptible (spot) nodes; spot is cheaper but can be reclaimed at any time.

                            Maps to SPOT (AWS), preemptible/spot (GCP), or Spot priority (Azure).
                          enum:
                            - on-demand
                            - spot
                          type: string
                        diskSizeGB:
                          description: DiskSizeGB is the per-node boot/root disk size in GB.
                          minimum: 10
                          type: integer
                        labels:
                          additionalProperties:
                            type: string
                          description: |-
                            Labels are user-supplied node labels. They are merged with the required
                            cost-attribution labels (PRD-KUBENV-001 C-03) by the composition; cost
                            labels win on key conflict.
                          type: object
                        machineType:
                          description: |-
                            MachineType pins a raw, cloud-specific instance/machine type,
                            bypassing Size resolution: a GCP machine type ("e2-standard-4"), an
                            Azure VM size ("Standard_D8s_v5"), or an EC2 instance type. It is the
                            escape hatch for a SKU the size vocabulary cannot express (a GPU or
                            memory-optimised family, a capacity reservation). An environment that
                            uses it is NOT portable across clouds — prefer Size.

                            Exactly one of Size or MachineType must be set.
                          type: string
                        scaling:
                          description: |-
                            Scaling defines the node group's autoscaling bounds (min/max) and the
                            initial desired node count.
                          properties:
                            desired:
                              description: Desired is the initial desired number of nodes.
                              minimum: 0
                              type: integer
                            max:
                              description: Max is the maximum number of nodes.
                              minimum: 1
                              type: integer
                            min:
                              description: Min is the minimum number of nodes.
                              minimum: 0
                              type: integer
                          required:
                            - desired
                            - max
                            - min
                          type: object
                        size:
                          description: |-
                            Sets the cloud-neutral node t-shirt size (small/medium/large), resolved per-cloud by the operator.

                            small=4vCPU/16Gi, medium=8vCPU/32Gi, large=16vCPU/64Gi, resolved to a concrete
                            per-cloud machine type against the target KubePool's cloud, using the same table
                            that already backs `ci` sizing (internal/operators/kubeproject/cicompute). Declaring
                            size instead of machineType is what makes an environment portable between a GKE pool
                            and an AKS pool without a manifest edit (#1169).

                            On a KubeProject environment: has no effect when environmentType is "ml" (use
                            ml.cpu/ml.gpu instead) or "ci" (buildCINodeGroup overwrites it from the ci block).

                            Exactly one of Size or MachineType must be set. The rule is enforced
                            in-controller (NodeGroupComputeInvalid condition), not by CEL, per the
                            repo's Kyverno-not-webhooks admission model.
                          enum:
                            - small
                            - medium
                            - large
                          type: string
                        taints:
                          description: |-
                            Taints are user-supplied taints applied to the node group. The
                            env-exclusivity taint is added automatically by the composition and does
                            not need to be declared here.
                          items:
                            description: |-
                              Taint is a cloud-neutral Kubernetes node taint applied to a dedicated
                              environment node group.
                            properties:
                              effect:
                                description: |-
                                  Sets the taint effect on every node in this group, translated to the target cloud's native enum.

                                  For example, composition sets translate this to GKE NO_SCHEDULE as needed.
                                type: string
                              key:
                                description: Key is the taint key.
                                type: string
                              value:
                                description: Value is the taint value.
                                type: string
                            required:
                              - effect
                              - key
                            type: object
                          type: array
                      required:
                        - diskSizeGB
                        - scaling
                      type: object
                    overrides:
                      additionalProperties:
                        description: |-
                          DedicatedEnvironmentOverride overrides the default dedicatedEnvironment node group
                          and/or resources for a single named environment. A set field fully replaces the
                          corresponding default for that environment.
                        properties:
                          nodeGroup:
                            description: NodeGroup, when set, fully replaces the default node group for this environment.
                            properties:
                              arch:
                                default: amd64
                                description: |-
                                  Sets the node CPU architecture; only used alongside size, ignored once machineType pins a raw SKU.

                                  When MachineType pins a raw SKU, the architecture is whatever that SKU is.
                                enum:
                                  - amd64
                                  - arm64
                                type: string
                              capacityType:
                                default: on-demand
                                description: |-
                                  Chooses on-demand vs interruptible (spot) nodes; spot is cheaper but can be reclaimed at any time.

                                  Maps to SPOT (AWS), preemptible/spot (GCP), or Spot priority (Azure).
                                enum:
                                  - on-demand
                                  - spot
                                type: string
                              diskSizeGB:
                                description: DiskSizeGB is the per-node boot/root disk size in GB.
                                minimum: 10
                                type: integer
                              labels:
                                additionalProperties:
                                  type: string
                                description: |-
                                  Labels are user-supplied node labels. They are merged with the required
                                  cost-attribution labels (PRD-KUBENV-001 C-03) by the composition; cost
                                  labels win on key conflict.
                                type: object
                              machineType:
                                description: |-
                                  MachineType pins a raw, cloud-specific instance/machine type,
                                  bypassing Size resolution: a GCP machine type ("e2-standard-4"), an
                                  Azure VM size ("Standard_D8s_v5"), or an EC2 instance type. It is the
                                  escape hatch for a SKU the size vocabulary cannot express (a GPU or
                                  memory-optimised family, a capacity reservation). An environment that
                                  uses it is NOT portable across clouds — prefer Size.

                                  Exactly one of Size or MachineType must be set.
                                type: string
                              scaling:
                                description: |-
                                  Scaling defines the node group's autoscaling bounds (min/max) and the
                                  initial desired node count.
                                properties:
                                  desired:
                                    description: Desired is the initial desired number of nodes.
                                    minimum: 0
                                    type: integer
                                  max:
                                    description: Max is the maximum number of nodes.
                                    minimum: 1
                                    type: integer
                                  min:
                                    description: Min is the minimum number of nodes.
                                    minimum: 0
                                    type: integer
                                required:
                                  - desired
                                  - max
                                  - min
                                type: object
                              size:
                                description: |-
                                  Sets the cloud-neutral node t-shirt size (small/medium/large), resolved per-cloud by the operator.

                                  small=4vCPU/16Gi, medium=8vCPU/32Gi, large=16vCPU/64Gi, resolved to a concrete
                                  per-cloud machine type against the target KubePool's cloud, using the same table
                                  that already backs `ci` sizing (internal/operators/kubeproject/cicompute). Declaring
                                  size instead of machineType is what makes an environment portable between a GKE pool
                                  and an AKS pool without a manifest edit (#1169).

                                  On a KubeProject environment: has no effect when environmentType is "ml" (use
                                  ml.cpu/ml.gpu instead) or "ci" (buildCINodeGroup overwrites it from the ci block).

                                  Exactly one of Size or MachineType must be set. The rule is enforced
                                  in-controller (NodeGroupComputeInvalid condition), not by CEL, per the
                                  repo's Kyverno-not-webhooks admission model.
                                enum:
                                  - small
                                  - medium
                                  - large
                                type: string
                              taints:
                                description: |-
                                  Taints are user-supplied taints applied to the node group. The
                                  env-exclusivity taint is added automatically by the composition and does
                                  not need to be declared here.
                                items:
                                  description: |-
                                    Taint is a cloud-neutral Kubernetes node taint applied to a dedicated
                                    environment node group.
                                  properties:
                                    effect:
                                      description: |-
                                        Sets the taint effect on every node in this group, translated to the target cloud's native enum.

                                        For example, composition sets translate this to GKE NO_SCHEDULE as needed.
                                      type: string
                                    key:
                                      description: Key is the taint key.
                                      type: string
                                    value:
                                      description: Value is the taint value.
                                      type: string
                                  required:
                                    - effect
                                    - key
                                  type: object
                                type: array
                            required:
                              - diskSizeGB
                              - scaling
                            type: object
                          resources:
                            description: Resources, when set, fully replaces the default resources for this environment.
                            properties:
                              limits:
                                description: |-
                                  Limits maps to the environment namespace's LimitRange default /
                                  defaultRequest values.
                                properties:
                                  defaultCPU:
                                    type: string
                                  defaultMemory:
                                    type: string
                                  defaultRequestCPU:
                                    type: string
                                  defaultRequestMemory:
                                    type: string
                                type: object
                              quota:
                                description: |-
                                  Quota maps to the environment namespace's ResourceQuota. Omitting keys
                                  omits the corresponding quota entry.
                                properties:
                                  limitsCPU:
                                    type: string
                                  limitsMemory:
                                    type: string
                                  pods:
                                    type: string
                                  requestsCPU:
                                    type: string
                                  requestsMemory:
                                    type: string
                                type: object
                            type: object
                        type: object
                      description: |-
                        Overrides maps an environment name to a per-environment override of the default
                        nodeGroup and/or resources. A key that does not match a targeted environment name
                        has no effect.
                      type: object
                    resources:
                      description: |-
                        Resources is the default per-environment resource governance (quota + limits)
                        applied to every targeted environment unless overridden.
                      properties:
                        limits:
                          description: |-
                            Limits maps to the environment namespace's LimitRange default /
                            defaultRequest values.
                          properties:
                            defaultCPU:
                              type: string
                            defaultMemory:
                              type: string
                            defaultRequestCPU:
                              type: string
                            defaultRequestMemory:
                              type: string
                          type: object
                        quota:
                          description: |-
                            Quota maps to the environment namespace's ResourceQuota. Omitting keys
                            omits the corresponding quota entry.
                          properties:
                            limitsCPU:
                              type: string
                            limitsMemory:
                              type: string
                            pods:
                              type: string
                            requestsCPU:
                              type: string
                            requestsMemory:
                              type: string
                          type: object
                      type: object
                  type: object
                  x-kubernetes-validations:
                    - message: 'dedicatedEnvironment needs nodeGroup (service apps: one exclusive node group) or ml (ML pipeline apps: app-owned flavour pools, PRD-1124 D-07)'
                      rule: has(self.nodeGroup) || has(self.ml)
                description:
                  description: Describes what this application does.
                  type: string
                displayName:
                  description: Sets the human-readable name shown for this application in the UI.
                  type: string
                environmentSelector:
                  description: |-
                    Chooses project environments to deploy to; omitted deploys nowhere.

                    If not specified or empty, the app will NOT be deployed to any environment.
                    This is an explicit opt-in model to prevent accidental deployments.
                  properties:
                    environmentTypes:
                      description: |-
                        EnvironmentTypes filters environments by their type (dev, stage, prod).
                        Multiple environments of the same type can be matched.
                        Example: ["dev", "stage"] will deploy to all dev and stage environments.
                      items:
                        type: string
                      type: array
                    exclude:
                      description: |-
                        Exclude lists environment names to skip, applied after other selectors.
                        Useful for "deploy to all dev except dev-experimental" scenarios.
                        Example: ["dev-experimental"] when combined with environmentTypes: ["dev"]
                      items:
                        type: string
                      type: array
                    matchLabels:
                      additionalProperties:
                        type: string
                      description: |-
                        MatchLabels filters environments by labels defined in the KubeProject environment overrides.
                        All labels must match for an environment to be selected.
                        Can be combined with EnvironmentTypes or Names for more specific selection.
                      type: object
                    names:
                      description: |-
                        Names explicitly lists environment names to deploy to.
                        Takes precedence over EnvironmentTypes - if both are specified, only Names is used.
                        Example: ["dev", "staging-us", "staging-eu"] will deploy to exactly these environments.
                      items:
                        type: string
                      type: array
                  type: object
                features:
                  description: 'Optional feature toggles: currently just CI/CD branch strategy.'
                  properties:
                    ciCd:
                      description: CiCd feature configuration
                      properties:
                        branchStrategy:
                          description: BranchStrategy defines branch strategy configuration
                          properties:
                            devBranch:
                              default: dev
                              description: |-
                                Selects the branch whose pushes fire CI; the wrong value means pushes never trigger a build.

                                This is the integration branch a push to which fires the in-cluster CI (the
                                WorkflowEventBinding's selector). Defaults to "dev" — the gitFlow convention. Set this
                                when the repo's integration branch is named differently (e.g. "main" for trunk-based
                                development), otherwise pushes to that branch never trigger a build (#347). Must be a
                                plain branch name, not a full ref — the operator prefixes "refs/heads/".
                              pattern: ^[a-zA-Z0-9._/-]+$
                              type: string
                            enabled:
                              default: true
                              description: Enabled indicates whether branch strategy is enabled
                              type: boolean
                            type:
                              default: gitFlow
                              description: Names the branching strategy this app follows; informational, does not change controller behavior.
                              enum:
                                - gitFlow
                                - trunk
                                - custom
                              type: string
                          type: object
                      type: object
                  type: object
                gitOpsConfig:
                  description: |-
                    GitOps settings; autoMerge defaults true for every env, prod included.

                    GitOpsConfig.AutoMerge defaults to true for EVERY environment, including prod
                    (reconciling.go:2518) — an author who declares nothing gets prod auto-merge.
                  properties:
                    autoMerge:
                      additionalProperties:
                        type: boolean
                      description: AutoMerge per environment
                      type: object
                    basePath:
                      default: kubeapps
                      description: BasePath for GitOps files in the repository
                      type: string
                  type: object
                k8sAppConfig:
                  description: Kubernetes settings; the app template usually sets these already.
                  properties:
                    baseResources:
                      description: BaseResources configuration
                      properties:
                        configMap:
                          description: ConfigMap configuration
                          properties:
                            data:
                              additionalProperties:
                                type: string
                              description: Data for the config map
                              type: object
                          type: object
                        secret:
                          description: Secret configuration
                          properties:
                            enabled:
                              default: true
                              description: Enabled indicates if secret should be created
                              type: boolean
                            type:
                              default: Opaque
                              description: Type of the secret
                              type: string
                          type: object
                        serviceAccount:
                          description: ServiceAccount configuration
                          properties:
                            name:
                              description: Name of the service account
                              type: string
                          type: object
                      type: object
                    environmentVariables:
                      additionalProperties:
                        additionalProperties:
                          type: string
                        type: object
                      description: EnvironmentVariables per environment
                      type: object
                    healthCheck:
                      description: HealthCheck configuration
                      properties:
                        initialDelaySeconds:
                          default: 30
                          description: InitialDelaySeconds before starting health checks
                          type: integer
                        path:
                          default: /health
                          description: Path for health check endpoint
                          type: string
                        periodSeconds:
                          default: 10
                          description: PeriodSeconds between health checks
                          type: integer
                      type: object
                    ingressConfig:
                      description: IngressConfig configuration
                      properties:
                        enabled:
                          description: Enabled indicates if ingress should be created
                          type: boolean
                        pathType:
                          default: Prefix
                          description: Sets the Kubernetes Ingress path-matching mode for this app's routes.
                          enum:
                            - Prefix
                            - Exact
                            - ImplementationSpecific
                          type: string
                      type: object
                  type: object
                kubeAppTemplateRef:
                  description: Names the XKubeAppTemplate this application is built from; determines its runtime and CI/CD shape.
                  minLength: 1
                  type: string
                kubeProjectRef:
                  description: Names the KubeProject that owns this application; the app is created in that project's namespace.
                  minLength: 1
                  type: string
                networking:
                  description: |-
                    Declares this app's network exposure and connections to other apps.

                    (PRD-ARCH-002 D-14′/D-05/D-15). Optional; existing apps are unaffected.
                    NOTE: Networking.Visibility is NETWORK exposure and is DISTINCT from the
                    repo-visibility field Visibility above — do not conflate them.
                  properties:
                    connections:
                      description: Connections are declared consumption edges from this app to another app or tool.
                      items:
                        description: ConnectionSpec is one declared consumption edge.
                        properties:
                          mode:
                            default: service
                            description: Mode is "service" (east-west svc DNS + env vars) or "browser" (public URL + CORS).
                            enum:
                              - service
                              - browser
                            type: string
                          name:
                            description: |-
                              Name is the env-var prefix for injected discovery ({NAME}_URI, {NAME}_HOST, ...).
                              It is ALSO interpolated into the names of the Kubernetes objects the
                              xconnection composition renders for this connection, so it is
                              lowercased at that point (case is preserved verbatim for the env-var
                              prefix). Only characters that survive that lowercasing as a valid RFC
                              1123 label are accepted — no leading/trailing hyphen, no characters
                              outside [A-Za-z0-9-]; uppercase is explicitly allowed since it is the
                              natural env-var spelling (#934).
                            minLength: 1
                            pattern: ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$
                            type: string
                          port:
                            description: Port is the named target port; defaults to the first declared port.
                            type: string
                          to:
                            description: To is the connection target; exactly one of kubeApp | tool must be set.
                            properties:
                              bindingClass:
                                description: |-
                                  BindingClass is the ToolBinding recipe class governing Tool, and is
                                  REQUIRED whenever Tool is set. The governing ToolBinding is addressed
                                  deterministically as "{bindingClass}--{pool}" in the org namespace
                                  (D-19), so no pool-wide scan is needed and two recipes that happened to
                                  discover the same instance name can never be confused for each other.
                                type: string
                              kubeApp:
                                description: KubeApp is the name of a sibling KubeApp in the same project.
                                type: string
                              tool:
                                description: |-
                                  Tool is the name of a tool INSTANCE discovered by a ToolBinding recipe
                                  (F-12). Resolution joins this value against that ToolBinding's
                                  status.verifiedTargets[].instance — never against a namespace name.
                                type: string
                            type: object
                        required:
                          - name
                          - to
                        type: object
                      type: array
                    cors:
                      description: CORS is the target-owner-controlled origin policy for browser-mode consumers (D-15).
                      properties:
                        allowedOrigins:
                          description: AllowedOrigins lists additional explicit origins.
                          items:
                            type: string
                          type: array
                        fromConnections:
                          description: FromConnections, when true, allows the origins of declared browser-consumers.
                          type: boolean
                      type: object
                    visibility:
                      default: public
                      description: |-
                        Controls network reachability, distinct from the repo: 'public' adds an internet-facing HTTPRoute.

                        "public" renders a public HTTPRoute on the pool gateway; "internal" renders none
                        (reachable only via declared connections). Distinct from KubeAppSpec.Visibility
                        (repository visibility) — do not conflate them.
                      enum:
                        - public
                        - internal
                      type: string
                  type: object
                profile:
                  default: small
                  description: Sets the compute resource profile (small/medium/large) applied to this application's workload.
                  enum:
                    - small
                    - medium
                    - large
                  type: string
                sdlcConfig:
                  description: SDLC settings; promotionsEnabled is forced false for ml-pipeline apps.
                  properties:
                    promotionsEnabled:
                      default: true
                      description: PromotionsEnabled indicates if promotions are enabled
                      type: boolean
                  type: object
                visibility:
                  default: private
                  description: Sets the GitHub repository's visibility; distinct from networking.visibility (network exposure).
                  enum:
                    - private
                    - public
                    - internal
                  type: string
              required:
                - description
                - displayName
                - kubeAppTemplateRef
                - kubeProjectRef
              type: object
            status:
              description: KubeAppStatus defines the observed state of KubeApp
              properties:
                applicationStatus:
                  description: ApplicationStatus contains application-specific status information
                  properties:
                    ciCd:
                      description: CiCd contains CI/CD status information
                      properties:
                        actionsConfigured:
                          description: ActionsConfigured indicates whether GitHub Actions has been configured
                          type: boolean
                        branchStrategy:
                          description: BranchStrategy contains branch strategy status
                          properties:
                            branchesCreated:
                              description: BranchesCreated is a list of branches that were created
                              items:
                                type: string
                              type: array
                            implemented:
                              description: Implemented indicates whether the branch strategy has been implemented
                              type: boolean
                            protectionRulesApplied:
                              description: ProtectionRulesApplied is a list of branches with protection rules
                              items:
                                type: string
                              type: array
                            type:
                              description: Type of the implemented branch strategy
                              type: string
                          type: object
                        configured:
                          description: Configured indicates whether CI/CD has been configured
                          type: boolean
                      type: object
                    lastReconciled:
                      description: LastReconciled records when the application was last reconciled
                      format: date-time
                      type: string
                    message:
                      description: Message contains a human-readable message about the application status
                      type: string
                    ready:
                      description: Ready indicates whether all application components are ready
                      type: boolean
                    repository:
                      description: Repository contains repository status information
                      properties:
                        created:
                          description: Created indicates whether the repository has been created
                          type: boolean
                        fullName:
                          description: FullName of the repository (owner/name)
                          type: string
                        name:
                          description: Name of the created repository
                          type: string
                        url:
                          description: Url of the repository
                          type: string
                        visibility:
                          description: Visibility of the repository
                          type: string
                      type: object
                    teams:
                      description: Teams contains team status information
                      properties:
                        configured:
                          description: Configured indicates whether teams have been configured
                          type: boolean
                        teamCount:
                          description: TeamCount is the number of teams configured
                          type: integer
                        teams:
                          description: Teams is a list of configured team names
                          items:
                            type: string
                          type: array
                      type: object
                  type: object
                conditions:
                  description: Conditions represent the latest available observations of the KubeApp's current state
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                connections:
                  description: Connections surfaces per-(connection × named environment) resolution (F-07/F-13).
                  items:
                    description: ConnectionStatus is one connection's resolution in one named environment.
                    properties:
                      environment:
                        type: string
                      lastDriftCheck:
                        description: |-
                          LastDriftCheck is the timestamp of the last Ready-phase pass whose
                          drift comparison actually ran for this connection (checked=true in
                          connectionsDriftCheck) — set on both a clean pass and a detected
                          drift, never on a pass that short-circuited before comparing (no
                          client/lookup wired, nothing declared, nothing currently resolvable).
                          Mirrors ToolBinding.status.verifiedTargets[].lastVerified (F-11
                          freshness). Its absence, or an old value, is what lets an operator
                          tell "checked recently, no drift" apart from "not checked for 9
                          minutes" — the drift check's own comparison is only as fresh as the
                          live XConnection XR, which is itself bounded by provider-kubernetes'
                          ~10-minute poll of the composed Objects it manages (#894, #903;
                          PRD-ARCH-002 F-14) — nothing on this platform can promise faster.
                        format: date-time
                        type: string
                      message:
                        type: string
                      name:
                        type: string
                      resolvedPrincipal:
                        description: |-
                          ResolvedPrincipal is the SPIFFE principal
                          ("<trustDomain>/ns/<consumerNamespace>/sa/<consumerServiceAccount>")
                          this connection's AuthorizationPolicy allows, read back from the SAME
                          spec.parameters the Reconciling phase wrote onto the XConnection XR
                          (never independently recomputed — DEC-C1). Empty whenever no policy
                          was emitted: posture is permissive, or (PRD-ARCH-002 Task 3 fail-closed
                          rule) posture is enforced but the pool's mesh trust domain was empty —
                          in that case State is "Error" and Message explains why. This is the
                          only inspectable signal distinguishing a working policy from a black
                          hole (a wrong-trust-domain policy still reports ZtunnelAccepted=True
                          and denies every consumer, per the live A5 measurement).
                        type: string
                      resolvedVia:
                        description: ConnectionResolution is the provenance chain for a Ready connection (OSR/agents).
                        properties:
                          authzPolicyRef:
                            type: string
                          bindingVersion:
                            type: string
                          endpoint:
                            type: string
                          secretRef:
                            type: string
                          toolBindingRef:
                            type: string
                        type: object
                      state:
                        description: |-
                          State is one of: Ready | AwaitingCompile | Pending | BindingUnverified |
                          CapabilityMissing | Drifted | TargetAbsent | Error.

                          AwaitingCompile (#1112) means the XConnection XR does not exist yet;
                          Pending means it exists but has no Ready verdict. Only the latter blocks
                          the KubeApp's health gate — see phases.connectionsBlockHealth.
                        type: string
                    required:
                      - environment
                      - name
                      - state
                    type: object
                  type: array
                derivedStatus:
                  description: |-
                    DerivedStatus reports the freshness of this resource's derived status,
                    maintained by the framework's Ready prologue.
                  properties:
                    lastVerifiedTime:
                      description: |-
                        LastVerifiedTime is when every registered ReadyUnit last evaluated
                        successfully. It does NOT advance on a pass where any unit failed.
                      format: date-time
                      type: string
                    staleFields:
                      description: |-
                        StaleFields lists the status fields not refreshed on the last pass
                        because their owning unit failed. Sorted for stable diffs.
                      items:
                        type: string
                      type: array
                    unitsStale:
                      description: UnitsStale counts units whose evaluation failed on the last pass.
                      type: integer
                    unitsVerified:
                      description: UnitsVerified counts units that evaluated successfully on the last pass.
                      type: integer
                  type: object
                endpoints:
                  description: Endpoints surfaces per-named-environment reachability (D-14′/F-13).
                  items:
                    description: EndpointStatus is one app endpoint in one named environment.
                    properties:
                      clusterDNS:
                        description: ClusterDNS is the in-cluster service DNS name.
                        type: string
                      environment:
                        type: string
                      url:
                        description: URL is the public URL when visibility is public; empty for internal.
                        type: string
                    required:
                      - environment
                    type: object
                  type: array
                gitHubProviderConfig:
                  description: GitHubProviderConfig contains the GitHub provider configuration name
                  type: string
                gitOpsStatus:
                  description: GitOpsStatus contains GitOps workflow configuration status
                  properties:
                    basePath:
                      description: BasePath is the base path for GitOps files in the repository
                      type: string
                  type: object
                inheritedTeams:
                  description: |-
                    InheritedTeams mirrors the parent KubeProject's effective team set per CON-04
                    (KubeApp inherits without overrides). Surfaced for operator debugging — avoids
                    having to inspect the parent KubeProject separately to see which teams have
                    repo bindings on this app's repository. Populated by the Reporting phase.
                  items:
                    description: |-
                      EffectiveTeamStatus is the resolved per-team status entry surfaced by both
                      KubeProject.status.effectiveTeams[] and KubeApp.status.inheritedTeams[]
                      (PRD-331 F-13, Q-03). All three fields are operator-managed.

                      GithubTeamID is empty until the corresponding KubeTeam's XGitHubTeam composite
                      reaches Ready and the team ID is surfaced via F-04. Empty is a valid transient
                      state — operators should not treat an empty GithubTeamID as a hard error.
                    properties:
                      githubTeamID:
                        description: |-
                          GithubTeamID mirrors KubeTeam.status.githubTeamID. Empty when XGitHubTeam
                          has not yet emitted status.teamID (transient — next reconcile picks it up).
                        type: string
                      name:
                        description: Name is the KubeTeam name (1:1 with the GitHub team name per CON-01).
                        type: string
                      role:
                        description: 'Role is one of: business, dev, ops, admin (D-01).'
                        enum:
                          - business
                          - dev
                          - ops
                          - admin
                        type: string
                    required:
                      - name
                      - role
                    type: object
                  type: array
                lastTransitionTime:
                  description: LastTransitionTime records when the status was last updated
                  format: date-time
                  type: string
                observedGeneration:
                  description: ObservedGeneration is the most recent generation observed by the controller
                  format: int64
                  type: integer
                phase:
                  description: Phase indicates the current reconciliation phase
                  enum:
                    - Reconciling
                    - Syncing
                    - Reporting
                    - Ready
                    - Failed
                    - Deleting
                  type: string
                promotionStatus:
                  description: PromotionStatus contains GitOps Promoter integration status
                  properties:
                    activeCommitStatuses:
                      description: ActiveCommitStatuses lists global active commit status gates
                      items:
                        description: CommitStatusGate defines a commit status gate key
                        properties:
                          key:
                            description: Key is the commit status gate key
                            type: string
                        required:
                          - key
                        type: object
                      type: array
                    argoCDCommitStatusCreated:
                      description: ArgoCDCommitStatusCreated indicates whether the ArgoCDCommitStatus resource was created
                      type: boolean
                    enabled:
                      description: Enabled indicates whether GitOps Promoter is enabled
                      type: boolean
                    environments:
                      description: Environments lists per-environment promotion configuration
                      items:
                        description: PromotionEnvironmentStatus contains per-environment promotion status
                        properties:
                          activeCommitStatuses:
                            description: ActiveCommitStatuses lists per-environment active commit status gates
                            items:
                              description: CommitStatusGate defines a commit status gate key
                              properties:
                                key:
                                  description: Key is the commit status gate key
                                  type: string
                              required:
                                - key
                              type: object
                            type: array
                          autoMerge:
                            description: AutoMerge indicates whether auto-merge is enabled for this environment
                            type: boolean
                          branch:
                            description: Branch used for promotion
                            type: string
                          name:
                            description: Name of the environment
                            type: string
                          proposedCommitStatuses:
                            description: ProposedCommitStatuses lists per-environment proposed commit status gates
                            items:
                              description: CommitStatusGate defines a commit status gate key
                              properties:
                                key:
                                  description: Key is the commit status gate key
                                  type: string
                              required:
                                - key
                              type: object
                            type: array
                        type: object
                      type: array
                    observersReady:
                      description: ObserversReady indicates whether ArgoCD application observers are ready
                      type: boolean
                    promotionStrategyCreated:
                      description: PromotionStrategyCreated indicates whether the PromotionStrategy resource was created
                      type: boolean
                    proposedCommitStatuses:
                      description: ProposedCommitStatuses lists global proposed commit status gates
                      items:
                        description: CommitStatusGate defines a commit status gate key
                        properties:
                          key:
                            description: Key is the commit status gate key
                            type: string
                        required:
                          - key
                        type: object
                      type: array
                  type: object
                reconciliationAttempts:
                  description: ReconciliationAttempts tracks the number of reconciliation attempts for backoff
                  type: integer
                registry:
                  description: |-
                    Registry is the resolved registry for this app, per pool. Populated by
                    the Reporting phase; never an input.
                  properties:
                    name:
                      type: string
                    perPool:
                      items:
                        description: |-
                          AppRegistryPoolStatus is the resolved registry for one pool the parent
                          KubeProject references via spec.environments[]. One entry exists per unique
                          pool the PROJECT spans — every app in the project gets the same PerPool
                          list, since project.spec.registry (R-07) is a project-wide decision and
                          only ImageRef's app segment differs between apps.

                          Scoping this list by the app's own spec.environmentSelector (so an app
                          only sees the pools its selector actually reaches) is deliberately
                          deferred, not an oversight: Phase 1 ships the simplest correct surface,
                          and narrowing it later is additive.
                        properties:
