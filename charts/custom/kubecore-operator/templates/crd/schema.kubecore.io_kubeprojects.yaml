{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.18.0
    graph.kubecore.io/relationships: |
      - target: KubePool
        field: spec.environments[].kubePool
        relationship: references
        cardinality: "*:1"
        required: true
        description: "KubeProject references KubePool for environment provisioning"
      - target: KubeApp
        relationship: creates
        cardinality: "1:*"
        description: "KubeProject creates KubeApp resources for application management"
      - target: KubeTeam
        field: spec.teams[].name
        relationship: references
        cardinality: "*:*"
        description: "Teams granting access to this project"
    graph.kubecore.io/hierarchy-label: kubecore.io/kubeproject
    graph.kubecore.io/xr-mappings: |
      - xrKind: XGitHubProject
        apiVersion: github.platform.kubecore.io/v1alpha1
        cardinality: "1:1"
        description: "GitHub project integration"
      - xrKind: XKubEnv
        apiVersion: platform.kubecore.io/v1alpha1
        cardinality: "1:*"
        description: "Kubernetes environment per environment type (AWS path)"
      - xrKind: XProjectMLStack
        apiVersion: platform.kubecore.io/v1alpha1
        cardinality: "1:1"
        description: "Project-scoped ML stack (MLflow, LakeFS, Postgres, object storage)"
      - xrKind: XProjectEnvMLStack
        apiVersion: platform.kubecore.io/v1alpha1
        cardinality: "1:*"
        description: "Legacy per-environment ML stack (retained, superseded by XProjectMLStack)"
      - xrKind: XQualityGate
        apiVersion: platform.kubecore.io/v1alpha1
        cardinality: "1:*"
        description: "KubeSDLC quality gate instance"
      - xrKind: XQualityGateTemplate
        apiVersion: platform.kubecore.io/v1alpha1
        cardinality: "1:*"
        description: "KubeSDLC quality gate template"
  name: kubeprojects.schema.kubecore.io
spec:
  group: schema.kubecore.io
  names:
    kind: KubeProject
    listKind: KubeProjectList
    plural: kubeprojects
    singular: kubeproject
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - description: Number of environments
          jsonPath: .spec.environments[*]
          name: Environments
          type: integer
        - description: Ready environments
          jsonPath: .status.environments[?(@.state=='Ready')].name
          name: Ready Environments
          type: string
        - jsonPath: .spec.owner
          name: Owner
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1beta1
      schema:
        openAPIV3Schema:
          description: KubeProject is the Schema for the kubeprojects API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: KubeProjectSpec defines the desired state of KubeProject
              properties:
                contact:
                  description: Contact provides contact information for the project
                  type: string
                description:
                  description: Description serves both KubeProject AND GitHub repository description
                  type: string
                displayName:
                  description: DisplayName is a human-readable name for the project
                  type: string
                environments:
                  description: |-
                    Environments defines the list of environments to create for this project
                    This field is optional - projects can be created without environments
                    and enhanced with environments later
                  items:
                    description: ProjectEnvironment defines a single environment within a project
                    properties:
                      environmentType:
                        description: |-
                          EnvironmentType classifies the environment (dev/stage/prod/ml). It is the
                          authoritative source for the priority-uniqueness validator and the status
                          writer; it replaces the value that was previously read from the KubePool
                          environment template (PRD-KUBENV-001 S-1/A2, D-01). The "ml" type marks a
                          per-project ML environment: it provisions its OWN MLOps stack (one per ml
                          environment — PRD-858 supersedes PRD-240 CON-07) and hosts whole-node
                          pipeline step compute; it carries no app-promotion semantics.
                        enum:
                          - dev
                          - stage
                          - prod
                          - ml
                        type: string
                      kubePool:
                        description: KubePool references the KubePool resource to use for this environment
                        minLength: 1
                        type: string
                      name:
                        description: Name of the environment (e.g., "dev", "staging", "prod")
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
                        type: string
                        x-kubernetes-validations:
                          - message: environment name must not contain '--' (reserved separator for dedicated-environment XKubEnv naming {project}-{app}--{env}, V-14)
                            rule: '!self.contains(''--'')'
                      nodeGroup:
                        description: |-
                          NodeGroup carries the complete, cloud-neutral dedicated node-group
                          definition for this environment. Its presence selects the dedicated-node-group
                          compute model (PRD-KUBENV-001 D-06): the XKubEnv composition provisions one
                          exclusive, tainted+labeled node group with this config. When nil, no dedicated
                          node group is provisioned. The node-group spec is owned entirely by KubeProject
                          (D-01); there is no KubePool template fallback.
                        properties:
                          capacityType:
                            default: on-demand
                            description: |-
                              CapacityType selects on-demand vs interruptible capacity. It maps to
                              SPOT (AWS), preemptible/spot (GCP), or Spot priority (Azure).
                            enum:
                              - on-demand
                              - spot
                            type: string
                          diskSizeGB:
                            description: DiskSizeGB is the per-node boot/root disk size in GB.
                            minimum: 10
                            type: integer
                          labels:
                            additionalProperties:
                              type: string
                            description: |-
                              Labels are user-supplied node labels. They are merged with the required
                              cost-attribution labels (PRD-KUBENV-001 C-03) by the composition; cost
                              labels win on key conflict.
                            type: object
                          machineType:
                            description: |-
                              MachineType is the instance/machine type for the node group. It is
                              interpreted per cloud: GCP machine type (e.g. "e2-standard-4"), EC2
                              instance type, or Azure VM size.
                            minLength: 1
                            type: string
                          scaling:
                            description: |-
                              Scaling defines the node group's autoscaling bounds (min/max) and the
                              initial desired node count.
                            properties:
                              desired:
                                description: Desired is the initial desired number of nodes.
                                minimum: 0
                                type: integer
                              max:
                                description: Max is the maximum number of nodes.
                                minimum: 1
                                type: integer
                              min:
                                description: Min is the minimum number of nodes.
                                minimum: 0
                                type: integer
                            required:
                              - desired
                              - max
                              - min
                            type: object
                          taints:
                            description: |-
                              Taints are user-supplied taints applied to the node group. The
                              env-exclusivity taint is added automatically by the composition and does
                              not need to be declared here.
                            items:
                              description: |-
                                Taint is a cloud-neutral Kubernetes node taint applied to a dedicated
                                environment node group.
                              properties:
                                effect:
                                  description: |-
                                    Effect is the taint effect. Composition sets translate this to the
                                    cloud-native enum (e.g. GKE NO_SCHEDULE) as needed.
                                  type: string
                                key:
                                  description: Key is the taint key.
                                  type: string
                                value:
                                  description: Value is the taint value.
                                  type: string
                              required:
                                - effect
                                - key
                              type: object
                            type: array
                        required:
                          - diskSizeGB
                          - machineType
                          - scaling
                        type: object
                      overrides:
                        description: |-
                          Overrides allow minimal customization of the environment configuration.
                          Platform teams can restrict which overrides are allowed.
                        properties:
                          costControls:
                            description: CostControls overrides for cost management
                            properties:
                              maxMonthlyCost:
                                description: MaxMonthlyCost overrides the maximum monthly cost (cannot exceed template max if set)
                                type: string
                              shutdownSchedule:
                                description: ShutdownSchedule overrides the shutdown schedule
                                type: string
                              startupSchedule:
                                description: StartupSchedule overrides the startup schedule
                                type: string
                            type: object
                          features:
                            description: Features overrides for feature toggles
                            properties:
                              autoScaling:
                                description: AutoScaling overrides autoscaling enablement
                                type: boolean
                              backups:
                                description: Backups overrides backup enablement
                                type: boolean
                              logging:
                                description: Logging overrides logging enablement
                                type: boolean
                              monitoring:
                                description: Monitoring overrides monitoring enablement
                                type: boolean
                            type: object
                          labels:
                            additionalProperties:
                              type: string
                            description: Labels to add to the environment (merged with template labels)
                            type: object
                          mlStack:
                            description: MLStack overrides for ML stack toggles (within template limits; only applied when pool is ML capable)
                            properties:
                              mlflow:
                                description: MLflow overrides MLflow enablement for this environment
                                type: boolean
                              postgres:
                                description: Postgres overrides Postgres instance enablement for this environment
                                type: boolean
                              s3:
                                description: S3 overrides S3 artifact store enablement for this environment
                                type: boolean
                            type: object
                          scaling:
                            description: Scaling overrides for node group scaling configuration
                            properties:
                              desired:
                                description: Desired overrides the desired number of nodes
                                minimum: 0
                                type: integer
                              max:
                                description: Max overrides the maximum number of nodes (cannot exceed template max if set)
                                minimum: 1
                                type: integer
                              min:
                                description: Min overrides the minimum number of nodes (cannot be less than template min)
                                minimum: 0
                                type: integer
                            type: object
                        type: object
                      priority:
                        description: |-
                          Priority defines the deployment order within environments of the same
                          environmentType. Lower priority numbers indicate higher priority (deployed
                          first). Priority must be unique within environments of the same
                          environmentType.
                        minimum: 1
                        type: integer
                      resources:
                        description: |-
                          Resources carries per-environment resource governance (quota + limits),
                          cloud-neutral (PRD-KUBENV-001 S-1). It maps directly to the ResourceQuota and
                          LimitRange the XKubEnv composition renders into the environment namespace.
                        properties:
                          limits:
                            description: |-
                              Limits maps to the environment namespace's LimitRange default /
                              defaultRequest values.
                            properties:
                              defaultCPU:
                                type: string
                              defaultMemory:
                                type: string
                              defaultRequestCPU:
                                type: string
                              defaultRequestMemory:
                                type: string
                            type: object
                          quota:
                            description: |-
                              Quota maps to the environment namespace's ResourceQuota. Omitting keys
                              omits the corresponding quota entry.
                            properties:
                              limitsCPU:
                                type: string
                              limitsMemory:
                                type: string
                              pods:
                                type: string
                              requestsCPU:
                                type: string
                              requestsMemory:
                                type: string
                            type: object
                        type: object
                    required:
                      - environmentType
                      - kubePool
                      - name
                      - priority
                    type: object
                    x-kubernetes-validations:
                      - message: nodeGroup is required unless environmentType is 'ml' (an ml environment's compute comes from the ML compute classes, not a dedicated node group)
                        rule: self.environmentType == 'ml' || has(self.nodeGroup)
                  maxItems: 20
                  type: array
                githubConfiguration:
                  description: GitHubConfiguration for the project
                  properties:
                    features:
                      description: Features toggles - all enabled by default
                      properties:
                        applicationSets:
                          description: FeatureToggle defines a boolean feature toggle with default true
                          properties:
                            enabled:
                              default: true
                              type: boolean
                          type: object
                        repository:
                          description: FeatureToggle defines a boolean feature toggle with default true
                          properties:
                            enabled:
                              default: true
                              type: boolean
                          type: object
                      type: object
                    repositorySource:
                      description: RepositorySource configuration with smart defaults
                      properties:
                        existing:
                          description: Existing repository configuration
                          properties:
                            repository:
                              type: string
                          required:
                            - repository
                          type: object
                        template:
                          description: Template configuration
                          properties:
                            includeAllBranches:
                              default: false
                              type: boolean
                            owner:
                              default: novelcore
                              type: string
                            repository:
                              default: kubeproject-template
                              type: string
                          type: object
                        type:
                          default: template
                          description: Type defaults to "template"
                          enum:
                            - template
                            - existing
                          type: string
                      type: object
                    visibility:
                      default: private
                      description: Visibility setting for the repository (defaults to private)
                      enum:
                        - public
                        - private
                        - internal
                      type: string
                  type: object
                kubeOrgRef:
                  description: KubeOrgRef references the KubeOrg that owns this project
                  type: string
                ml:
                  description: |-
                    ML defines project-wide ML platform configuration (MLflow, LakeFS, object storage, Postgres).
                    When enabled, the KubeProject operator provisions a single per-project XProjectMLStack
                    composite resource. The composition router (MLCompositionSetContract) dispatches to the
                    AWS or GCP implementation based on the referenced KubePool's cloudProvider union.
                    Ported from v1 KubeProject.spec.ml; preserved verbatim at the user-facing YAML layer.
                  properties:
                    components:
                      description: Components controls which ML components are deployed.
                      properties:
                        lakefs:
                          description: Lakefs enables LakeFS for this project.
                          type: boolean
                        mlflow:
                          description: Mlflow enables MLflow for this project.
                          type: boolean
                      type: object
                    dataLifecycle:
                      description: |-
                        DataLifecycle controls whether data-bearing resources created by the
                        per-project XProjectMLStack (object-store buckets — S3 on AWS, GCS on
                        GCP — CNPG WAL stores, LakeFS object storage, Zot artifact buckets)
                        force-destroy on KubeProject delete.

                        "retain" is the safe production default and matches Crossplane's
                        behavior: non-empty buckets block deletion, requiring an operator to
                        manually drain. "wipe-on-delete" sets forceDestroy=true on every data
                        resource so dev/test environments can tear down cleanly.

                        When unset, the operator does not force the value: the composition's
                        own default (retain) takes effect. To opt into wipe-on-delete,
                        declare it explicitly here. This is intentionally a project-level
                        declaration, not per-environment, because the ML stack is one
                        XProjectMLStack per project (CON-07).
                      enum:
                        - retain
                        - wipe-on-delete
                      type: string
                    enabled:
                      description: |-
                        Enabled turns the ML platform on for this project. When true, the operator
                        provisions a single per-project XProjectMLStack composite resource (Postgres,
                        object storage, MLflow, optionally LakeFS) scheduled on system nodes of the
                        specified KubePool.
                      type: boolean
                    kubePool:
                      description: |-
                        KubePool specifies which KubePool's system nodes host the ML stack for this
                        project. The referenced KubePool's cloudProvider union selects the ML
                        composition set (AWS vs GCP) via the MLCompositionSetContract router.
                      type: string
                    lakeFSOIDC:
                      description: |-
                        LakeFSOIDC enables Zitadel OIDC SSO on LakeFS via oauth2-proxy + an
                        nginx Basic-auth-injection sidecar (LakeFS OSS lacks native OIDC).
                        When set + Enabled, the composition emits the oauth2-proxy Deployment
                        Zitadel client credentials and oauth2-proxy cookie secret. PRD-240 F-18.
                      properties:
                        apiSecretName:
                          description: |-
                            APISecretName is the cloud Secret Manager key for the LakeFS machine
                            user (LAKEFS_API_CLIENT_ID + LAKEFS_API_CLIENT_SECRET) used by
                            programmatic clients (lakectl, MLflow LakeFS plugin) to obtain a JWT
                            without going through the browser SSO flow. Optional — when unset,
                            only browser-based access is wired up.
                          type: string
                        discoveryUrl:
                          description: |-
                            DiscoveryURL is the Zitadel OIDC issuer's discovery endpoint, e.g.
                            "https://identity.{baseDns}/.well-known/openid-configuration".
                          type: string
                        enabled:
                          description: |-
                            Enabled turns SSO on for this service. When false (or block omitted),
                            the composition falls back to the chart's native admin-password auth.
                          type: boolean
                        groupsClaim:
                          description: |-
                            GroupsClaim is the OIDC token claim the service's auth layer reads group
                            membership from. For MLflow's mlflow-oidc-auth plugin this maps to
                            OIDC_GROUPS_ATTRIBUTE and must match the Zitadel Action's emitted claim
                            (default "urn:mlflow:groups", carrying kubeproject:{project}:{role} groups).
                            Empty ⇒ the composition/plugin default. PRD-240 KubeTeam→MLflow RBAC.
                          type: string
                        secretName:
                          description: |-
                            SecretName is the cloud Secret Manager key holding OIDC_CLIENT_ID,
                            OIDC_CLIENT_SECRET, and (where applicable) SECRET_KEY/COOKIE_SECRET.
                            The composition's ExternalSecret pulls from the org-level
                            ClusterSecretStore at key SecretName.
                          type: string
                        serviceUserSecretName:
                          description: |-
                            ServiceUserSecretName is the cloud Secret Manager key holding the
                            programmatic service-user credentials (MLFLOW_TRACKING_USERNAME + access
                            token) the operator mints so pipeline clients authenticate via the MLflow
                            basic-auth protocol with zero code change. Optional — when unset, only
                            interactive browser SSO is wired up.
                          type: string
                      type: object
                    mlflowOIDC:
                      description: |-
                        MlflowOIDC enables Zitadel OIDC SSO on MLflow via the chart's native OIDC
                        plugin. When set + Enabled, the composition emits an ExternalSecret
                        pulling client credentials from the org-level ClusterSecretStore, sets
                        MLflow's auth.appName to "oidc-auth", and renders a traefik-class
                        Ingress with cluster-issuer cert-manager annotation. PRD-240 F-18.
                      properties:
                        discoveryUrl:
                          description: |-
                            DiscoveryURL is the Zitadel OIDC issuer's discovery endpoint, e.g.
                            "https://identity.{baseDns}/.well-known/openid-configuration".
                          type: string
                        enabled:
                          description: |-
                            Enabled turns SSO on for this service. When false (or block omitted),
                            the composition falls back to the chart's native admin-password auth.
                          type: boolean
                        groupsClaim:
                          description: |-
                            GroupsClaim is the OIDC token claim the service's auth layer reads group
                            membership from. For MLflow's mlflow-oidc-auth plugin this maps to
                            OIDC_GROUPS_ATTRIBUTE and must match the Zitadel Action's emitted claim
                            (default "urn:mlflow:groups", carrying kubeproject:{project}:{role} groups).
                            Empty ⇒ the composition/plugin default. PRD-240 KubeTeam→MLflow RBAC.
                          type: string
                        secretName:
                          description: |-
                            SecretName is the cloud Secret Manager key holding OIDC_CLIENT_ID,
                            OIDC_CLIENT_SECRET, and (where applicable) SECRET_KEY/COOKIE_SECRET.
                            The composition's ExternalSecret pulls from the org-level
                            ClusterSecretStore at key SecretName.
                          type: string
                        serviceUserSecretName:
                          description: |-
                            ServiceUserSecretName is the cloud Secret Manager key holding the
                            programmatic service-user credentials (MLFLOW_TRACKING_USERNAME + access
                            token) the operator mints so pipeline clients authenticate via the MLflow
                            basic-auth protocol with zero code change. Optional — when unset, only
                            interactive browser SSO is wired up.
                          type: string
                      type: object
                    pipelines:
                      description: |-
                        Pipelines declares per-project pipeline templates. In v2, compute is
                        autoscaler-native (D-02, CON-05) — these entries become hints consumed by
                        ComputeProviderContract (D-05) implementations (Karpenter on AWS, GKE
                        autoscaler on GCP). Per-app XGPUNodeGroup is forbidden (CON-05).
                      items:
                        description: MLPipeline defines a pipeline template with its node resource configuration.
                        properties:
                          cpu:
                            description: CPU configures CPU node requirements for pipeline steps.
                            properties:
                              consolidateAfter:
                                description: ConsolidateAfter is how long before removing empty nodes (e.g. "60s","5m").
                                type: string
                              diskSizeGi:
                                description: DiskSizeGi is the root volume size in GiB.
                                minimum: 20
                                type: integer
                              instanceFamilies:
                                description: |-
                                  InstanceFamilies are allowed instance families (e.g. ["g5","g6"] for GPU).
                                  Use ["*"] to allow all families (no family constraint applied).
                                  Provider-specific interpretation:
                                    AWS  — EC2 instance families (g5, g6, m5, c5, ...).
                                    GCP  — N1/N2/A2 accelerator families (ComputeProviderContract maps them).
                                items:
                                  type: string
                                minItems: 1
                                type: array
                              instanceSizes:
                                description: |-
                                  InstanceSizes are allowed instance sizes (e.g. ["xlarge","2xlarge"]).
                                  Use ["*"] to allow all sizes (no size constraint applied).
                                items:
                                  type: string
                                minItems: 1
                                type: array
                              maxResources:
                                description: |-
                                  MaxResources is the autoscaler resource limit:
                                    "nvidia.com/gpu" count for GPU pools, or vCPU count for CPU pools.
                                type: string
                            type: object
                          gpu:
                            description: GPU configures GPU node requirements for training workloads in this pipeline.
                            properties:
                              consolidateAfter:
                                description: ConsolidateAfter is how long before removing empty nodes (e.g. "60s","5m").
                                type: string
                              diskSizeGi:
                                description: DiskSizeGi is the root volume size in GiB.
                                minimum: 20
                                type: integer
                              instanceFamilies:
                                description: |-
                                  InstanceFamilies are allowed instance families (e.g. ["g5","g6"] for GPU).
                                  Use ["*"] to allow all families (no family constraint applied).
                                  Provider-specific interpretation:
                                    AWS  — EC2 instance families (g5, g6, m5, c5, ...).
                                    GCP  — N1/N2/A2 accelerator families (ComputeProviderContract maps them).
                                items:
                                  type: string
                                minItems: 1
                                type: array
                              instanceSizes:
                                description: |-
                                  InstanceSizes are allowed instance sizes (e.g. ["xlarge","2xlarge"]).
                                  Use ["*"] to allow all sizes (no size constraint applied).
                                items:
                                  type: string
                                minItems: 1
                                type: array
                              maxResources:
                                description: |-
                                  MaxResources is the autoscaler resource limit:
                                    "nvidia.com/gpu" count for GPU pools, or vCPU count for CPU pools.
                                type: string
                            type: object
                          name:
                            description: |-
                              Name identifies the pipeline (e.g. "yolo-v1"). Used in NodePool names:
                              {project}-{name}-gpu and {project}-{name}-cpu.
                            minLength: 1
                            pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
                            type: string
                        required:
                          - name
                        type: object
                      type: array
                    postgres:
                      description: Postgres controls resource sizing for the per-project CloudNativePG cluster.
                      properties:
                        cpu:
                          description: CPU is the requested CPU for the primary Postgres instance (e.g., "500m").
                          type: string
                        memory:
                          description: Memory is the requested memory for the primary Postgres instance (e.g., "1Gi").
                          type: string
                        storageSize:
                          description: StorageSize is the PVC size for the primary Postgres instance (e.g., "20Gi").
                          type: string
                      type: object
                    s3:
                      description: |-
                        S3 controls artifact-store provisioning. The field name is retained from v1
                        for schema compatibility; the v2 StorageProviderContract returns S3 on AWS,
                        GCS on GCP, and may return POSIX on a future HPC provider (D-06).
                      properties:
                        enabled:
                          description: Enabled controls whether a per-project bucket is created for ML artifacts.
                          type: boolean
                      type: object
                  type: object
                owner:
                  description: Owner specifies the owner or team responsible for this project
                  type: string
                teams:
                  description: |-
                    Teams is the list of KubeTeam references granting access to this project.
                    Each referenced KubeTeam contributes its members and its role to the effective
                    project access. Org-wide teams declared on the parent KubeOrg are merged in by
                    the reconciler (F-05); on conflict, org-level wins (CON-04). No role override
                    at the project level — role comes from the KubeTeam itself (CON-03, D-05).
                  items:
                    description: |-
                      KubeTeamRef references a KubeTeam resource by name within the same KubeOrg namespace.
                      Only the name is required; role and permissions come from the referenced KubeTeam itself
                      (CON-03: one role per team; CON-04: org-level teams cannot be overridden at project level).
                      Env-scoped roles are deferred per D-05 — no per-environment fields here.
                    properties:
                      name:
                        description: |-
                          Name of the KubeTeam to reference. Must exist in the same namespace
                          as the consumer (KubeProject or KubeOrg) — i.e., the KubeOrg namespace.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                      - name
