{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.18.0
  name: kubeprojects.schema.kubecore.io
spec:
  group: schema.kubecore.io
  names:
    kind: KubeProject
    listKind: KubeProjectList
    plural: kubeprojects
    singular: kubeproject
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - description: Number of environments
      jsonPath: .spec.environments[*]
      name: Environments
      type: integer
    - description: Ready environments
      jsonPath: .status.environments[?(@.state=='Ready')].name
      name: Ready Environments
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: KubeProject is the Schema for the kubeprojects API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KubeProjectSpec defines the desired state of KubeProject
            properties:
              contact:
                description: Contact provides contact information for the project
                type: string
              description:
                description: Description serves both KubeProject AND GitHub repository
                  description
                type: string
              displayName:
                description: DisplayName is a human-readable name for the project
                type: string
              environments:
                description: |-
                  Environments defines the list of environments to create for this project
                  This field is optional - projects can be created without environments
                  and enhanced with environments later
                items:
                  description: ProjectEnvironment defines a single environment within
                    a project
                  properties:
                    kubePool:
                      description: KubePool references the KubePool resource to use
                        for this environment
                      minLength: 1
                      type: string
                    name:
                      description: Name of the environment (e.g., "dev", "staging",
                        "prod")
                      minLength: 1
                      pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
                      type: string
                    overrides:
                      description: |-
                        Overrides allow minimal customization of the template configuration
                        Platform teams can restrict which overrides are allowed
                      properties:
                        costControls:
                          description: CostControls overrides for cost management
                          properties:
                            maxMonthlyCost:
                              description: MaxMonthlyCost overrides the maximum monthly
                                cost (cannot exceed template max if set)
                              type: string
                            shutdownSchedule:
                              description: ShutdownSchedule overrides the shutdown
                                schedule
                              type: string
                            startupSchedule:
                              description: StartupSchedule overrides the startup schedule
                              type: string
                          type: object
                        features:
                          description: Features overrides for feature toggles
                          properties:
                            autoScaling:
                              description: AutoScaling overrides autoscaling enablement
                              type: boolean
                            backups:
                              description: Backups overrides backup enablement
                              type: boolean
                            logging:
                              description: Logging overrides logging enablement
                              type: boolean
                            monitoring:
                              description: Monitoring overrides monitoring enablement
                              type: boolean
                          type: object
                        labels:
                          additionalProperties:
                            type: string
                          description: Labels to add to the environment (merged with
                            template labels)
                          type: object
                        scaling:
                          description: Scaling overrides for node group scaling configuration
                          properties:
                            desired:
                              description: Desired overrides the desired number of
                                nodes
                              minimum: 0
                              type: integer
                            max:
                              description: Max overrides the maximum number of nodes
                                (cannot exceed template max if set)
                              minimum: 1
                              type: integer
                            min:
                              description: Min overrides the minimum number of nodes
                                (cannot be less than template min)
                              minimum: 0
                              type: integer
                          type: object
                      type: object
                    priority:
                      description: |-
                        Priority defines the deployment order within environments of the same type.
                        The environmentType (dev/stage/prod) is determined by the referenced template in the KubePool.
                        Lower priority numbers indicate higher priority (deployed first).
                        Priority must be unique within environments that reference templates of the same environmentType.
                        For example, if two environments both reference templates with environmentType=dev,
                        they cannot have the same priority value.
                      minimum: 1
                      type: integer
                    template:
                      description: Template references the environment template from
                        the KubePool
                      minLength: 1
                      type: string
                  required:
                  - kubePool
                  - name
                  - priority
                  - template
                  type: object
                type: array
              githubConfiguration:
                description: GitHubConfiguration for the project
                properties:
                  features:
                    description: Features toggles - all enabled by default
                    properties:
                      applicationSets:
                        description: FeatureToggle defines a boolean feature toggle
                          with default true
                        properties:
                          enabled:
                            default: true
                            type: boolean
                        type: object
                      repository:
                        description: FeatureToggle defines a boolean feature toggle
                          with default true
                        properties:
                          enabled:
                            default: true
                            type: boolean
                        type: object
                      teams:
                        description: FeatureToggle defines a boolean feature toggle
                          with default true
                        properties:
                          enabled:
                            default: true
                            type: boolean
                        type: object
                    type: object
                  repositorySource:
                    description: RepositorySource configuration with smart defaults
                    properties:
                      existing:
                        description: Existing repository configuration
                        properties:
                          repository:
                            type: string
                        required:
                        - repository
                        type: object
                      template:
                        description: Template configuration
                        properties:
                          includeAllBranches:
                            default: false
                            type: boolean
                          owner:
                            default: novelcore
                            type: string
                          repository:
                            default: kubeproject-template
                            type: string
                        type: object
                      type:
                        default: template
                        description: Type defaults to "template"
                        enum:
                        - template
                        - existing
                        type: string
                    type: object
                  teamMembers:
                    description: TeamMembers configuration for different teams (REQUIRED)
                    properties:
                      business:
                        items:
                          type: string
                        minItems: 1
                        type: array
                      ops:
                        items:
                          type: string
                        minItems: 1
                        type: array
                      software:
                        items:
                          type: string
                        minItems: 1
                        type: array
                    required:
                    - business
                    - ops
                    - software
                    type: object
                  visibility:
                    default: private
                    description: Visibility setting for the repository (defaults to
                      private)
                    enum:
                    - public
                    - private
                    - internal
                    type: string
                required:
                - teamMembers
                type: object
              kubeOrgRef:
                description: KubeOrgRef references the KubeOrg that owns this project
                type: string
              owner:
                description: Owner specifies the owner or team responsible for this
                  project
                type: string
            required:
            - description
            - githubConfiguration
            - kubeOrgRef
            type: object
          status:
            description: KubeProjectStatus defines the observed state of KubeProject
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the KubeProject's current state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              directCost:
                description: DirectCost contains the cost information for this project
                properties:
                  calculationStatus:
                    description: CalculationStatus indicates the status of the last
                      calculation
                    enum:
                    - success
                    - failed
                    - pending
                    type: string
                  daily:
                    description: Daily contains the last 24-hour cost
                    properties:
                      amount:
                        description: Amount is the total daily cost
                        type: string
                      breakdown:
                        additionalProperties:
                          type: string
                        description: Breakdown contains cost per service
                        type: object
                      currency:
                        default: USD
                        description: Currency is the currency code (always USD)
                        type: string
                      lastUpdated:
                        description: LastUpdated is when this daily cost was calculated
                        format: date-time
                        type: string
                    type: object
                  error:
                    description: Error contains the error message if calculation failed
                    type: string
                  lastCalculated:
                    description: LastCalculated is when the cost was last successfully
                      calculated
                    format: date-time
                    type: string
                  monthToDate:
                    description: MonthToDate contains the current month's aggregated
                      cost
                    properties:
                      amount:
                        description: Amount is the total month-to-date cost
                        type: string
                      averageDaily:
                        description: AverageDaily is the average daily cost
                        type: string
                      breakdown:
                        additionalProperties:
                          type: string
                        description: Breakdown contains cost per service
                        type: object
                      currency:
                        default: USD
                        description: Currency is the currency code (always USD)
                        type: string
                      daysIncluded:
                        description: DaysIncluded is the number of days in the calculation
                        type: integer
                      endDate:
                        description: EndDate is the end of the billing period (today)
                        type: string
                      projectedMonthly:
                        description: ProjectedMonthly is the projected monthly cost
                        type: string
                      startDate:
                        description: StartDate is the start of the billing period
                        type: string
                    type: object
                  nextCalculation:
                    description: NextCalculation is when the next calculation is scheduled
                    format: date-time
                    type: string
                type: object
              environments:
                description: Environments contains the status of each environment
                items:
                  description: EnvironmentStatus defines the status of a single environment
                  properties:
                    environmentConfigRef:
                      description: EnvironmentConfigRef contains a reference to the
                        created EnvironmentConfig resource
                      properties:
                        apiVersion:
                          description: API version of the resource
                          type: string
                        kind:
                          description: Kind of the resource
                          type: string
                        name:
                          description: Name of the resource
                          type: string
                        namespace:
                          description: Namespace of the resource (if namespaced)
                          type: string
                        uid:
                          description: UID of the resource
                          type: string
                      type: object
                    environmentType:
                      description: EnvironmentType shows the resolved environment
                        type from the template
                      type: string
                    estimatedMonthlyCost:
                      description: EstimatedMonthlyCost contains the estimated monthly
                        cost in USD as a string
                      type: string
                    kubePool:
                      description: KubePool used for this environment
                      type: string
                    lastReconciled:
                      description: LastReconciled records when this environment was
                        last reconciled
                      format: date-time
                      type: string
                    message:
                      description: Message contains a human-readable message about
                        the environment status
                      type: string
                    name:
                      description: Name of the environment
                      type: string
                    nodeGroup:
                      description: NodeGroup contains information about the node group
                      properties:
                        id:
                          description: ID of the node group
                          type: string
                        instanceType:
                          description: InstanceType is the EC2 instance type used
                            for nodes
                          type: string
                        nodeCount:
                          description: NodeCount is the current number of nodes in
                            the group
                          minimum: 0
                          type: integer
                        readyNodeCount:
                          description: ReadyNodeCount is the number of ready nodes
                            in the group
                          minimum: 0
                          type: integer
                        status:
                          description: Status of the node group (e.g., "ACTIVE", "CREATING",
                            "DELETING")
                          type: string
                      type: object
                    priority:
                      description: Priority shows the deployment priority for this
                        environment
                      type: integer
                    state:
                      description: State represents the current state of the environment
                      type: string
                    template:
                      description: Template used for this environment
                      type: string
                    xKubEnvRef:
                      description: XKubEnvRef contains a reference to the created
                        XKubEnv resource
                      properties:
                        apiVersion:
                          description: API version of the resource
                          type: string
                        kind:
                          description: Kind of the resource
                          type: string
                        name:
                          description: Name of the resource
                          type: string
                        namespace:
                          description: Namespace of the resource (if namespaced)
                          type: string
                        uid:
                          description: UID of the resource
                          type: string
                      type: object
                  required:
                  - name
                  type: object
                type: array
              gitHubStatus:
                description: GitHubStatus tracks the status of GitHub resources (project-level)
                properties:
                  gitHubEnvironmentConfigRef:
                    description: GitHubEnvironmentConfigRef reference to GitHub EnvironmentConfig
                    properties:
                      apiVersion:
                        description: API version of the resource
                        type: string
                      kind:
                        description: Kind of the resource
                        type: string
                      name:
                        description: Name of the resource
                        type: string
                      namespace:
                        description: Namespace of the resource (if namespaced)
                        type: string
                      uid:
                        description: UID of the resource
                        type: string
                    type: object
                  gitHubProjectRef:
                    description: GitHubProjectRef reference to XGitHubProject
                    properties:
                      apiVersion:
                        description: API version of the resource
                        type: string
                      kind:
                        description: Kind of the resource
                        type: string
                      name:
                        description: Name of the resource
                        type: string
                      namespace:
                        description: Namespace of the resource (if namespaced)
                        type: string
                      uid:
                        description: UID of the resource
                        type: string
                    type: object
                  lastReconciled:
                    description: LastReconciled timestamp
                    format: date-time
                    type: string
                  message:
                    description: Message contains details about the current state
                    type: string
                  state:
                    description: 'State of GitHub resources: "Pending", "Creating",
                      "Ready", "Failed"'
                    type: string
                required:
                - state
                type: object
              lastTransitionTime:
                description: LastTransitionTime records when the status was last updated
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller
                format: int64
                type: integer
              phase:
                description: Phase indicates the current reconciliation phase
                enum:
                - Reconciling
                - Syncing
                - Reporting
                - Ready
                - Failed
                - Deleting
                type: string
              reconciliationAttempts:
                description: ReconciliationAttempts tracks the number of reconciliation
                  attempts for backoff
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end -}}
