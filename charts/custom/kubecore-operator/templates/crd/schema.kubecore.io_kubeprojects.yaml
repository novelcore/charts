{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.18.0
    graph.kubecore.io/relationships: |
      - target: KubePool
        field: spec.environments[].kubePool
        relationship: references
        cardinality: "*:1"
        required: true
        description: "KubeProject references KubePool for environment provisioning"
      - target: KubeApp
        relationship: creates
        cardinality: "1:*"
        description: "KubeProject creates KubeApp resources for application management"
      - target: KubeTeam
        field: spec.teams[].name
        relationship: references
        cardinality: "*:*"
        description: "Teams granting access to this project"
    graph.kubecore.io/hierarchy-label: kubecore.io/kubeproject
    graph.kubecore.io/xr-mappings: |
      - xrKind: XGitHubProject
        apiVersion: github.platform.kubecore.io/v1alpha1
        cardinality: "1:1"
        description: "GitHub project integration"
      - xrKind: XKubEnv
        apiVersion: platform.kubecore.io/v1alpha1
        cardinality: "1:*"
        description: "Kubernetes environment per environment type (AWS path)"
      - xrKind: XProjectMLStack
        apiVersion: platform.kubecore.io/v1alpha1
        cardinality: "1:1"
        description: "Project-scoped ML stack (MLflow, LakeFS, Postgres, object storage)"
      - xrKind: XProjectEnvMLStack
        apiVersion: platform.kubecore.io/v1alpha1
        cardinality: "1:*"
        description: "Legacy per-environment ML stack (retained, superseded by XProjectMLStack)"
      - xrKind: XQualityGate
        apiVersion: platform.kubecore.io/v1alpha1
        cardinality: "1:*"
        description: "KubeSDLC quality gate instance"
      - xrKind: XQualityGateTemplate
        apiVersion: platform.kubecore.io/v1alpha1
        cardinality: "1:*"
        description: "KubeSDLC quality gate template"
  name: kubeprojects.schema.kubecore.io
spec:
  group: schema.kubecore.io
  names:
    kind: KubeProject
    listKind: KubeProjectList
    plural: kubeprojects
    singular: kubeproject
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - description: Number of environments
          jsonPath: .spec.environments[*]
          name: Environments
          type: integer
        - description: Ready environments
          jsonPath: .status.environments[?(@.state=='Ready')].name
          name: Ready Environments
          type: string
        - jsonPath: .spec.owner
          name: Owner
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1beta1
      schema:
        openAPIV3Schema:
          description: KubeProject is the Schema for the kubeprojects API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: KubeProjectSpec defines the desired state of KubeProject
              properties:
                ci:
                  description: |-
                    CI declares this project's build compute. See ProjectCI. REQUIRED
                    (2026-08-29 owner amendment — backwards compatibility is explicitly not
                    a goal): every project must declare spec.ci, even if empty. Both
                    ProjectCI.KubePool and ProjectCI.NodeGroup stay optional, so the
                    minimum viable declaration is `ci: {}` — a GitHub-only project with no
                    environments and no pool remains expressible. When kubePool is unset,
                    CI's pool is derived from spec.environments exactly as before (the
                    CI_NODEGROUP_ENABLED flag that used to gate the fully-absent-spec.ci
                    case has been retired: spec.ci being required made that guard
                    unreachable, so it was removed rather than left as dead emergency
                    brake; the derivation code path itself is unchanged).
                  properties:
                    kubePool:
                      description: |-
                        KubePool names the pool whose cluster runs this project's builds and
                        whose registry receives the images. Defaults to the KubePool of the
                        highest-priority (lowest Priority value) environment, ties broken by
                        environment name ascending — the same rule synthesizeCIEnvironment
                        has always used (D-03).

                        It may name a pool no environment uses. That is a supported state, not
                        an error: ConditionTypeMultiPoolExposure exists to WARN that apps on
                        other pools cannot pull the image CI builds (D-11, Q-06).
                      type: string
                    nodeGroup:
                      description: |-
                        NodeGroup sizes the CI builder node group. When nil, the cicompute
                        defaults apply (small/amd64/1 node, spot capacity).
                      properties:
                        arch:
                          description: |-
                            Arch selects the builder's CPU architecture. It determines the
                            architecture of the image CI produces — an arm64 builder yields an
                            arm64 image, which amd64 deployment nodes cannot run — so the
                            controller validates it against the inferred architecture of this
                            project's deployment environments on the same KubePool
                            (checkCIArchConsistency, fails open on an unclassifiable SKU).
                            Only meaningful alongside Size: when MachineType pins a raw SKU, the
                            architecture is whatever that SKU is.
                          enum:
                            - amd64
                            - arm64
                          type: string
                        capacityType:
                          default: spot
                          description: |-
                            Chooses on-demand vs interruptible (spot) capacity for the CI builder; defaults to spot.

                            CI builds are stateless, re-runnable by re-triggering the workflow, and
                            run on a node group that is min=0/desired=0, so a preemption
                            costs a re-run and never a running service — which is why spot is the
                            platform default here while deployment environments still default to
                            on-demand (PRD-COST-001 D-01). Set `on-demand` explicitly for a build
                            that genuinely cannot tolerate a mid-run eviction; an explicit value
                            always wins over the default.

                            Maps to `spot: true` on GKE and `priority: Spot` (with
                            `spotMaxPrice: -1`, i.e. pay up to the on-demand price) on AKS.
                          enum:
                            - on-demand
                            - spot
                          type: string
                        machineType:
                          description: |-
                            MachineType pins a raw, cloud-specific machine type, bypassing Size
                            resolution. Exactly one of Size or MachineType may be set; the rule is
                            enforced in-controller via ConditionTypeNodeGroupComputeInvalid, never
                            by CEL (house rule: admission via Kyverno, not webhooks).
                          type: string
                        maxNodes:
                          description: |-
                            MaxNodes bounds the node group's autoscaling ceiling. There is no Min
                            or Desired: a CI node group is always min=0/desired=0.
                          minimum: 1
                          type: integer
                        size:
                          description: |-
                            Size is the cloud-neutral t-shirt size, resolved to a concrete
                            per-cloud machine type by cicompute.MachineType — the same table
                            EnvironmentNodeGroup.Size resolves through (#1169).
                          enum:
                            - small
                            - medium
                            - large
                          type: string
                      type: object
                  type: object
                description:
                  description: Sets both the KubeProject description and the GitHub repository description.
                  type: string
                environments:
                  description: |-
                    Environments to create; a project may start with none, added later.

                    Enhance an existing project with environments in a follow-up update.
                  items:
                    description: |-
                      ProjectEnvironment defines a single environment within a project.

                      A user may not author environmentType "ci" here — CI compute is declared
                      exclusively via spec.ci (ProjectCI). Rejection is enforced by the
                      EnvironmentType enum alone (kubepool_types.go, Enum=dev;stage;prod;ml);
                      there is deliberately no CEL rule for this. A structural/enum violation
                      makes the whole object invalid, and the apiserver skips CEL evaluation
                      entirely on an invalid object ("some validation rules were not checked
                      because the object was invalid") — verified empirically against a real
                      apiserver on both a fresh write and a pre-existing object updated after a
                      live CRD swap with CRDValidationRatcheting (k8s 1.33). A CEL rule
                      targeting this same condition can NEVER evaluate, on any path, so do not
                      re-add one for a "better message" — that message can never be shown.
                    properties:
                      environmentType:
                        description: |-
                          Classifies this environment; ml uses pipeline compute, ci uses its own build compute, not nodeGroup.

                          It is the authoritative source for the priority-uniqueness validator and the status
                          writer; it replaces the value that was previously read from the KubePool
                          environment template (PRD-KUBENV-001 S-1/A2, D-01). The "ml" type marks a
                          compute-only ML environment (PRD-1124 CON-02): its namespace hosts the
                          project's pipeline runs on the whole-node, scale-to-zero flavour pools
                          declared in `ml`, and every run logs to the project's single MLOps stack
                          (spec.ml). It provisions no stack of its own and carries no
                          app-promotion semantics. On a "ci" environment, nodeGroup (if set) is
                          silently ignored — buildCINodeGroup(env.ci) supplies the CI build compute
                          instead (gcp/project_kubenv_params.go).
                        enum:
                          - dev
                          - stage
                          - prod
                          - ml
                        type: string
                      kubePool:
                        description: Names the KubePool whose cluster this environment's namespace and resources are provisioned on.
                        minLength: 1
                        type: string
                      ml:
                        description: |-
                          ML declares the pipeline compute of an `ml`-typed environment as lists
                          of platform sizes per tier (PRD-1124 D-02). Each entry becomes one
                          whole-node, scale-to-zero node pool named {tier}-{size}, tainted for
                          this environment, and every listed flavour is offered in the pipeline
                          step's compute dropdown (first entry = the tier's default). Both lists
                          are optional: an ml environment may declare none, cpu only, gpu only,
                          or several of each. Sizes map to concrete machine flavours in operator
                          code (internal/config/mlclasses.go), never to a raw cloud SKU here.
                          Only valid when environmentType is "ml".
                        properties:
                          cpu:
                            description: CPU flavour pools for CPU-only pipeline steps.
                            items:
                              description: MLTierCompute is one flavour pool of an ml environment.
                              properties:
                                maxNodes:
                                  default: 2
                                  description: |-
                                    MaxNodes bounds the pool's 0→N autoscale. Each step takes a whole
                                    node, so this is the maximum number of concurrent steps on this
                                    flavour. Min is always 0 (scale-to-zero is the point of the model).
                                  maximum: 8
                                  minimum: 1
                                  type: integer
                                size:
                                  description: |-
                                    Size is the platform t-shirt size of the whole node a step runs on.
                                    The mapping to machine type / accelerator is owned by the platform
                                    (PRD-1124 CON-03); the enum here is pinned to that catalog by test.
                                  enum:
                                    - small
                                    - medium
                                    - large
                                  type: string
                              required:
                                - size
                              type: object
                            type: array
                            x-kubernetes-list-map-keys:
                              - size
                            x-kubernetes-list-type: map
                          gpu:
                            description: GPU flavour pools for steps that request nvidia.com/gpu.
                            items:
                              description: MLTierCompute is one flavour pool of an ml environment.
                              properties:
                                maxNodes:
                                  default: 2
                                  description: |-
                                    MaxNodes bounds the pool's 0→N autoscale. Each step takes a whole
                                    node, so this is the maximum number of concurrent steps on this
                                    flavour. Min is always 0 (scale-to-zero is the point of the model).
                                  maximum: 8
                                  minimum: 1
                                  type: integer
                                size:
                                  description: |-
                                    Size is the platform t-shirt size of the whole node a step runs on.
                                    The mapping to machine type / accelerator is owned by the platform
                                    (PRD-1124 CON-03); the enum here is pinned to that catalog by test.
                                  enum:
                                    - small
                                    - medium
                                    - large
                                  type: string
                              required:
                                - size
                              type: object
                            type: array
                            x-kubernetes-list-map-keys:
                              - size
                            x-kubernetes-list-type: map
                          hpc:
                            description: |-
                              HPC opts THIS ml environment into the project's HPC tenancy
                              (PRD-HPC-1231 D-08): its namespace receives the project's rotating
                              Slurm JWT and every WorkflowTemplate rendered into it offers the
                              discovered HPC classes in the {step}-class dropdowns. Requires
                              spec.ml.hpc on the KubeProject (the identity is per project; the opt-in
                              is per environment, because each environment owns its templates).
                              Absent ⇒ this environment never bursts, whatever the project declares.
                            properties:
                              enabled:
                                description: Enabled offers the project's HPC classes in this environment.
                                type: boolean
                            type: object
                        type: object
                      name:
                        description: |-
                          Names the environment; cannot contain '--', reserved as the dedicated-environment separator.

                          Example: "dev", "staging", "prod". The '--' restriction exists because dedicated-environment
                          XKubEnvs are named {project}-{app}--{env} (V-14); a name containing it is rejected.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
                        type: string
                        x-kubernetes-validations:
                          - message: environment name must not contain '--' (reserved separator for dedicated-environment XKubEnv naming {project}-{app}--{env}, V-14)
                            rule: '!self.contains(''--'')'
                      nodeGroup:
                        description: |-
                          NodeGroup carries the complete, cloud-neutral dedicated node-group
                          definition for this environment. Its presence selects the dedicated-node-group
                          compute model (PRD-KUBENV-001 D-06): the XKubEnv composition provisions one
                          exclusive, tainted+labeled node group with this config. When nil, no dedicated
                          node group is provisioned. The node-group spec is owned entirely by KubeProject
                          (D-01); there is no KubePool template fallback.
                        properties:
                          arch:
                            default: amd64
                            description: |-
                              Sets the node CPU architecture; only used alongside size, ignored once machineType pins a raw SKU.

                              When MachineType pins a raw SKU, the architecture is whatever that SKU is.
                            enum:
                              - amd64
                              - arm64
                            type: string
                          capacityType:
                            default: on-demand
                            description: |-
                              Chooses on-demand vs interruptible (spot) nodes; spot is cheaper but can be reclaimed at any time.

                              Maps to SPOT (AWS), preemptible/spot (GCP), or Spot priority (Azure).
                            enum:
                              - on-demand
                              - spot
                            type: string
                          diskSizeGB:
                            description: DiskSizeGB is the per-node boot/root disk size in GB.
                            minimum: 10
                            type: integer
                          labels:
                            additionalProperties:
                              type: string
                            description: |-
                              Labels are user-supplied node labels. They are merged with the required
                              cost-attribution labels (PRD-KUBENV-001 C-03) by the composition; cost
                              labels win on key conflict.
                            type: object
                          machineType:
                            description: |-
                              MachineType pins a raw, cloud-specific instance/machine type,
                              bypassing Size resolution: a GCP machine type ("e2-standard-4"), an
                              Azure VM size ("Standard_D8s_v5"), or an EC2 instance type. It is the
                              escape hatch for a SKU the size vocabulary cannot express (a GPU or
                              memory-optimised family, a capacity reservation). An environment that
                              uses it is NOT portable across clouds — prefer Size.

                              Exactly one of Size or MachineType must be set.
                            type: string
                          scaling:
                            description: |-
                              Scaling defines the node group's autoscaling bounds (min/max) and the
                              initial desired node count.
                            properties:
                              desired:
                                description: Desired is the initial desired number of nodes.
                                minimum: 0
                                type: integer
                              max:
                                description: Max is the maximum number of nodes.
                                minimum: 1
                                type: integer
                              min:
                                description: Min is the minimum number of nodes.
                                minimum: 0
                                type: integer
                            required:
                              - desired
                              - max
                              - min
                            type: object
                          size:
                            description: |-
                              Sets the cloud-neutral node t-shirt size (small/medium/large), resolved per-cloud by the operator.

                              small=4vCPU/16Gi, medium=8vCPU/32Gi, large=16vCPU/64Gi, resolved to a concrete
                              per-cloud machine type against the target KubePool's cloud, using the same table
                              that already backs `ci` sizing (internal/operators/kubeproject/cicompute). Declaring
                              size instead of machineType is what makes an environment portable between a GKE pool
                              and an AKS pool without a manifest edit (#1169).

                              On a KubeProject environment: has no effect when environmentType is "ml" (use
                              ml.cpu/ml.gpu instead) or "ci" (buildCINodeGroup overwrites it from the ci block).

                              Exactly one of Size or MachineType must be set. The rule is enforced
                              in-controller (NodeGroupComputeInvalid condition), not by CEL, per the
                              repo's Kyverno-not-webhooks admission model.
                            enum:
                              - small
                              - medium
                              - large
                            type: string
                          taints:
                            description: |-
                              Taints are user-supplied taints applied to the node group. The
                              env-exclusivity taint is added automatically by the composition and does
                              not need to be declared here.
                            items:
                              description: |-
                                Taint is a cloud-neutral Kubernetes node taint applied to a dedicated
                                environment node group.
                              properties:
                                effect:
                                  description: |-
                                    Sets the taint effect on every node in this group, translated to the target cloud's native enum.

                                    For example, composition sets translate this to GKE NO_SCHEDULE as needed.
                                  type: string
                                key:
                                  description: Key is the taint key.
                                  type: string
                                value:
                                  description: Value is the taint value.
                                  type: string
                              required:
                                - effect
                                - key
                              type: object
                            type: array
                        required:
                          - diskSizeGB
                          - scaling
                        type: object
                      overrides:
                        description: |-
                          Overrides allow minimal customization of the environment configuration.
                          Platform teams can restrict which overrides are allowed.
                        properties:
                          labels:
                            additionalProperties:
                              type: string
                            description: Labels to add to the environment (merged with template labels)
                            type: object
                          scaling:
                            description: Scaling overrides for node group scaling configuration
                            properties:
                              desired:
                                description: Desired overrides the desired number of nodes
                                minimum: 0
                                type: integer
                              max:
                                description: Max overrides the maximum number of nodes (cannot exceed template max if set)
                                minimum: 1
                                type: integer
                              min:
                                description: Min overrides the minimum number of nodes (cannot be less than template min)
                                minimum: 0
                                type: integer
                            type: object
                        type: object
                      priority:
                        description: Sets deployment order among same-type environments; lower numbers go first and must be unique.
                        minimum: 1
                        type: integer
                      resources:
                        description: |-
                          Resources carries per-environment resource governance (quota + limits),
                          cloud-neutral (PRD-KUBENV-001 S-1). It maps directly to the ResourceQuota and
                          LimitRange the XKubEnv composition renders into the environment namespace.
                        properties:
                          limits:
                            description: |-
                              Limits maps to the environment namespace's LimitRange default /
                              defaultRequest values.
                            properties:
                              defaultCPU:
                                type: string
                              defaultMemory:
                                type: string
                              defaultRequestCPU:
                                type: string
                              defaultRequestMemory:
                                type: string
                            type: object
                          quota:
                            description: |-
                              Quota maps to the environment namespace's ResourceQuota. Omitting keys
                              omits the corresponding quota entry.
                            properties:
                              limitsCPU:
                                type: string
                              limitsMemory:
                                type: string
                              pods:
                                type: string
                              requestsCPU:
                                type: string
                              requestsMemory:
                                type: string
                            type: object
                        type: object
                    required:
                      - environmentType
                      - kubePool
                      - name
                      - priority
                    type: object
                    x-kubernetes-validations:
                      - message: nodeGroup is required unless environmentType is 'ml' (an ml environment's compute comes from the ML compute classes)
                        rule: self.environmentType == 'ml' || has(self.nodeGroup)
                      - message: ml (pipeline compute flavours) is only valid on an environmentType 'ml' environment (PRD-1124 F-01)
                        rule: '!has(self.ml) || self.environmentType == ''ml'''
                  maxItems: 20
                  type: array
                githubConfiguration:
                  description: GitHubConfiguration for the project
                  properties:
                    features:
                      description: Features toggles - all enabled by default
                      properties:
                        applicationSets:
                          description: FeatureToggle defines a boolean feature toggle with default true
                          properties:
                            enabled:
                              default: true
                              type: boolean
                          type: object
                        repository:
                          description: FeatureToggle defines a boolean feature toggle with default true
                          properties:
                            enabled:
                              default: true
                              type: boolean
                          type: object
                      type: object
                    repositorySource:
                      description: RepositorySource configuration with smart defaults
                      properties:
                        existing:
                          description: Existing repository configuration
                          properties:
                            repository:
                              description: Names the pre-existing repo to attach; required when repositorySource.type is 'existing'.
                              type: string
                          required:
                            - repository
                          type: object
                        template:
                          description: Template configuration
                          properties:
                            includeAllBranches:
                              default: false
                              type: boolean
                            owner:
                              default: novelcore
                              type: string
                            repository:
                              default: kubeproject-template
                              type: string
                          type: object
                        type:
                          default: template
                          description: |-
                            Chooses 'template' to create the repo from the platform template, or 'existing' to attach one.

                            Prefer leaving this whole repositorySource block unset: it is operator-managed, and an
                            agent-set value has hung a real project on a GitHub 404 (kaos-k8pilot now strips it
                            server-side before write). Only set it deliberately, e.g. to attach an existing repo.
                          enum:
                            - template
                            - existing
                          type: string
                      type: object
                    visibility:
                      default: private
                      description: Sets the GitHub repository's visibility; defaults to private if omitted.
                      enum:
                        - public
                        - private
                        - internal
                      type: string
                  type: object
                kubeOrgRef:
                  description: Names the KubeOrg that owns this project; the project is created in that org's namespace.
                  type: string
                ml:
                  description: |-
                    Turns on the ML platform (MLflow, LakeFS, storage, Postgres) here.

                    When enabled, the KubeProject operator provisions a single per-project XProjectMLStack
                    composite resource. The composition router (MLCompositionSetContract) dispatches to the
                    AWS or GCP implementation based on the referenced KubePool's cloudProvider union.
                    Ported from v1 KubeProject.spec.ml; preserved verbatim at the user-facing YAML layer.
                  properties:
                    components:
                      description: Components controls which ML components are deployed.
                      properties:
                        lakefs:
                          description: Lakefs enables LakeFS for this project.
                          type: boolean
                        mlflow:
                          description: Mlflow enables MLflow for this project.
                          type: boolean
                      type: object
                    dataLifecycle:
                      description: |-
                        Must be set explicitly: an omitted value wipes all ML data buckets when this KubeProject is deleted.

                        The composition defaults an unset value to "wipe-on-delete" (projectmlstack/gcp/composition.yaml:53,
                        aws:57), NOT "retain" — do not assume omitting this field is the safe choice.

                        "retain" is the safe production choice to declare explicitly and matches Crossplane's
                        behavior: non-empty buckets block deletion, requiring an operator to
                        manually drain. "wipe-on-delete" sets forceDestroy=true on every data
                        resource (object-store buckets — S3 on AWS, GCS on GCP — CNPG WAL stores,
                        LakeFS object storage, Zot artifact buckets) so dev/test environments can
                        tear down cleanly.

                        This is intentionally a project-level declaration, not per-environment,
                        because the ML stack is one XProjectMLStack per project (CON-07).
                      enum:
                        - retain
                        - wipe-on-delete
                      type: string
                    enabled:
                      description: |-
                        Enabled turns the ML platform on for this project. When true, the operator
                        provisions a single per-project XProjectMLStack composite resource (Postgres,
                        object storage, MLflow, optionally LakeFS) scheduled on system nodes of the
                        specified KubePool.
                      type: boolean
                    hpc:
                      description: |-
                        HPC binds this project to an external HPC tenancy (PRD-HPC-1231). The
                        project is the tenancy boundary: the platform mints and rotates a Slurm
                        JWT for THIS project's HPC user, discovers the compute classes that user
                        may run from the scheduler, reports them on status.hpc and offers them in
                        every pipeline step's {step}-class dropdown. Absent ⇒ the project never
                        bursts to HPC, whatever its pools permit. Endpoints (login host, REST
                        host, host-key source) are provider knowledge in the operator, never
                        tenant configuration.
                      properties:
                        account:
                          description: |-
                            Account is the scheduler account (Slurm allocation, e.g. "p201342") jobs
                            are submitted under. Required: a MeluXina user's default association is
                            the placeholder "nocredit" account (MaxJobs=0 — live 2026-09-07), so the
                            allocation must be named explicitly. Discovery scopes the class catalog
                            to this account.
                          maxLength: 64
                          minLength: 1
                          type: string
                        classes:
                          description: |-
                            Classes is an optional allow-list over the DISCOVERED class catalog
                            (provider-prefixed names such as "meluxina-gpu"). Unset ⇒ every
                            discovered, available class is offered. A listed name discovery does
                            not return is reported on status.hpc.message and never rendered.
                          items:
                            type: string
                          maxItems: 20
                          type: array
