                          properties:
                            appId:
                              description: AppID is the Zitadel application ID.
                              type: string
                            clientId:
                              description: ClientID is the OIDC client ID.
                              type: string
                            discoveryUrl:
                              description: DiscoveryURL is the Zitadel OIDC issuer's discovery endpoint.
                              type: string
                            projectId:
                              description: ProjectID is the Zitadel project the app belongs to.
                              type: string
                            rbacSeeded:
                              description: |-
                                RBACSeeded indicates the operator has seeded MLflow group permissions for
                                this project's (project,role) groups via the mlflow-oidc-auth plugin API
                                (KubeTeam role → MLflow permission: admin=MANAGE, ops/dev=EDIT, business=READ).
                                MLflow-only; LakeFS OSS has no per-user RBAC. PRD-240 KubeTeam→MLflow RBAC.
                              type: boolean
                            ready:
                              description: |-
                                Ready indicates the OIDC app is created and credentials are pushed
                                to the cloud Secret Manager.
                              type: boolean
                            secretName:
                              description: SecretName is the cloud Secret Manager key holding OIDC credentials.
                              type: string
                            serviceUserSecretName:
                              description: |-
                                ServiceUserSecretName is the cloud Secret Manager key holding the minted
                                pipeline service-user credentials (username + access token) for the MLflow
                                basic-auth protocol. Empty until the operator provisions the service user.
                              type: string
                          type: object
                        mlflowPipelineIdentityReady:
                          description: |-
                            MlflowPipelineIdentityReady is true once the per-project MLflow *pipeline*
                            machine identity (Zitadel machine user + key, published to
                            {project}-mlflow-svc) has been provisioned. The Ready phase re-triggers
                            Reconciling while this is nil/false so existing projects self-heal into the
                            bearer-JWT pipeline-auth model with no manual reconcile.
                          type: boolean
                        mlflowUrl:
                          description: |-
                            MLflowURL is the public HTTPS URL for MLflow, served through the pool's
                            Envoy Gateway HTTPRoute (mlflow-{project}.{baseDns}). Only set when the
                            MLflow OIDC route is provisioned (mlflowOIDC enabled and baseDns known).
                          type: string
                        namespace:
                          description: |-
                            Namespace is the Kubernetes namespace hosting the ML stack in the client
                            KubePool cluster (typically "ml-{project}").
                          type: string
                        objectStorageBucket:
                          description: |-
                            ObjectStorageBucket is the name of the artifact bucket. The scheme
                            (s3://, gs://, file:///...) is resolved by StorageProviderContract at
                            composition rendering time (D-06); this field carries only the name.
                          type: string
                        postgresHost:
                          description: |-
                            PostgresHost is the in-cluster Postgres read-write service host
                            (e.g., "{project}-pg-rw.ml-{project}.svc").
                          type: string
                        state:
                          description: 'State of the ML stack: "Pending", "Creating", "Ready", "Failed".'
                          type: string
                        xProjectMLStackRef:
                          description: |-
                            XProjectMLStackRef references the created namespaced XProjectMLStack XR
                            in the KubeOrg namespace.
                          properties:
                            apiVersion:
                              description: API version of the resource
                              type: string
                            kind:
                              description: Kind of the resource
                              type: string
                            name:
                              description: Name of the resource
                              type: string
                            namespace:
                              description: Namespace of the resource (if namespaced)
                              type: string
                            uid:
                              description: UID of the resource
                              type: string
                          type: object
                      type: object
                    observedGeneration:
                      description: |-
                        Stamped by the SAME producer write that fills the rest of this struct,
                        from resource.GetGeneration() read at render time. NEVER defaulted or
                        filled by status_updater (design decision 3).
                      format: int64
                      type: integer
                  type: object
                phase:
                  description: Phase indicates the current reconciliation phase
                  enum:
                    - Reconciling
                    - Syncing
                    - Reporting
                    - Ready
                    - Failed
                    - Deleting
                  type: string
                reconciliationAttempts:
                  description: ReconciliationAttempts tracks the number of reconciliation attempts for backoff
                  type: integer
                renderedGeneration:
                  description: |-
                    RenderedGeneration is the generation whose spec the last completed
                    Reconciling pass rendered into child XRs. Internal bookkeeping for the
                    observedGeneration attestation on the Ready transition (plan §3.1); NOT
                    an output — no other controller may read it.
                  format: int64
                  type: integer
              type: object
          type: object
          x-kubernetes-validations:
            - message: metadata.name must not contain '--' (reserved separator for dedicated-environment XKubEnv naming {project}-{app}--{env}, V-14)
              rule: '!self.metadata.name.contains(''--'')'
      served: true
      storage: true
      subresources:
        status: {}
{{- end -}}
