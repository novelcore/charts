{{- if and .Values.tokenBroker.enabled .Values.tokenBroker.networkPolicy.enabled }}
# Token-broker NetworkPolicy (F-11, PRD-352, T-09).
#
# Allows ingress to :8080 only from pods in the labelled ESO, Crossplane, and
# onboarding dashboard namespaces, plus the operator's own controller-manager
# pod in this same namespace. All other ingress is denied.
#
# SELECTOR STRATEGY:
# The primary discriminator for the ESO/Crossplane/dashboard rules is the
# namespace label kubecore.io/token-broker-client=true. Pod-level selectors
# default to {} (all pods in the namespace) because GCP token requests come
# from multiple sub-provider pods (upbound-provider-gcp-secretmanager,
# -cloudplatform, etc.) that each carry their own pkg.crossplane.io/provider value —
# restricting to the family pod label alone would silently drop those requests.
# Both esoPodSelector and crossplanePodSelector are overridable via values once
# sub-provider label stability is confirmed for a given environment.
#
# The controller-manager rule below is different: the manager runs in this
# policy's OWN namespace ({{ .Release.Namespace }}), so it uses a `from` entry
# containing ONLY a podSelector (no namespaceSelector). Per NetworkPolicy
# semantics, a podSelector-only peer matches pods in the policy's own
# namespace — it needs no kubecore.io/token-broker-client namespace label at
# all, and is strictly narrower than labelling the namespace (which would
# admit every pod in it, not just the manager).
#
# Namespace label prerequisites (add once per cluster, for ESO/Crossplane only):
#   kubectl label namespace external-secrets  kubecore.io/token-broker-client=true
#   kubectl label namespace crossplane-system kubecore.io/token-broker-client=true
#
# If the namespace labels are not set, no ingress is allowed from those namespaces
# (NetworkPolicy fails closed). The broker health check (from the kubelet) is exempt
# because kubelet traffic originates from the node, not a pod selector.
#
# EGRESS: this policy declares policyTypes: [Ingress] only, so broker egress is
# unrestricted. The verify endpoint requires HTTPS (443) egress to GCP STS, IAM,
# IAM Credentials, and Secret Manager (*.googleapis.com). If an Egress policy is
# ever added, it MUST allow those endpoints or /federation/verify will fail closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubecore-operator-token-broker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-broker
spec:
  podSelector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: token-broker
  policyTypes:
    - Ingress
  ingress:
    # Allow pods in the ESO namespace to call /token/{org} for
    # workloadIdentityFederation.externalTokenEndpoint.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.tokenBroker.networkPolicy.esoNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.tokenBroker.networkPolicy.esoPodSelector | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    # Allow pods in crossplane-system to call /token/{org} for external_account
    # url-source credentials. Uses namespace-only matching by default because
    # GCP sub-provider pods carry different pkg.crossplane.io/provider values.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.tokenBroker.networkPolicy.crossplaneNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.tokenBroker.networkPolicy.crossplanePodSelector | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    # Allow the onboarding dashboard namespace to call POST /federation/verify/{org}.
    # Verification runs entirely in the broker; the dashboard receives only a pass/fail
    # result and never holds a cloud token (onboarding §5b).
    {{- if .Values.tokenBroker.networkPolicy.dashboardNamespaceSelector }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.tokenBroker.networkPolicy.dashboardNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.tokenBroker.networkPolicy.dashboardPodSelector | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
    # Allow the operator's own controller-manager pod to call GET /token/{org}.
    # PRD-ARCH-002 Phase 2a ToolBinding discovery performs the GCP
    # `external_account` credential exchange directly from the manager process
    # (not from a Crossplane provider pod); that exchange's subject token comes
    # from this broker. Same-namespace podSelector only — see SELECTOR STRATEGY
    # above for why no namespaceSelector/namespace label is needed here.
    - from:
        - podSelector:
            matchLabels:
              {{- include "chart.selectorLabels" . | nindent 14 }}
              {{- toYaml .Values.tokenBroker.networkPolicy.managerPodSelector | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
