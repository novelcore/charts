{{- if .Values.tokenBroker.enabled }}
# Token-broker ServiceAccount (F-11, PRD-352).
# This SA has a dedicated ClusterRole (see clusterrole.yaml) granting get/list on
# Secrets cluster-wide. A narrower Role (one per org namespace) is not practical
# because the broker must read Secrets across all org namespaces at runtime, and
# new orgs are created dynamically — a ClusterRole is the only scoping option
# without per-namespace provisioning. See RBAC scoping note in the handoff report.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.tokenBroker.serviceAccountName | default "kubecore-operator-token-broker" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-broker
{{- end }}
