{{- if .Values.crossplaneCompositions.enabled }}
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xqualitygates.platform.kubecore.io
  labels:
    platform.kubecore.io/type: qualitygate-instance
    provider: kubernetes
    service: webhook-events
    layer: sdlc
spec:
  # This composition manages Argo Events sensors and event sources
  # XQualityGate is namespace-scoped and should be deployed in project namespaces
  compositeTypeRef:
    apiVersion: platform.kubecore.io/v1alpha1
    kind: XQualityGate
  mode: Pipeline
  pipeline:

  # Step 1: Load EnvironmentConfig for instance configuration
  - step: load-environment-configs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Selector
          selector:
            matchLabels:
            # Match by type: qualitygate-instance-config
            - key: platform.kubecore.io/type
              type: Value
              value: qualitygate-instance-config
            # Match by app name
            - key: kubecore.io/app
              type: FromCompositeFieldPath
              valueFromFieldPath: spec.appName
            # Match by gate name
            - key: kubecore.io/gate
              type: FromCompositeFieldPath
              valueFromFieldPath: spec.gateName

  # Step 2: Generate EventSource, Sensor, and Ingress with event type mapping
  - step: generate-instance-resources
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource -}}
          {{- $spec := $xr.spec -}}
          {{- $name := $xr.metadata.name -}}

          {{/* Extract configuration */}}
          {{- $appName := $spec.appName -}}
          {{- $projectName := $spec.projectName -}}
          {{- $gateName := $spec.gateName -}}
          {{- $templateRef := $spec.templateRef -}}
          {{- $targetCluster := $spec.targetCluster -}}
          {{- $clusterName := $targetCluster.name -}}
          {{- $providerConfigName := $targetCluster.providerConfigName -}}
          {{- $baseDomain := $targetCluster.baseDomain -}}
          {{- $appNamespace := $targetCluster.namespace | default $appName -}}
          {{- $repoConfig := $spec.repositoryConfig -}}
          {{- $repo := dict "owner" $repoConfig.owner "name" $repoConfig.name "fullName" $repoConfig.fullName -}}

          {{/* GitHub configuration */}}
          {{- $githubConfig := $spec.githubConfig | default dict -}}
          {{- $githubAppId := $githubConfig.appId | default "" -}}
          {{- $githubInstallationId := $githubConfig.installationId | default "" -}}
          {{- $githubPrivateKeySecret := $githubConfig.privateKeySecretName | default "github-app-private-key" -}}
          {{- $githubWebhookSecret := $githubConfig.webhookSecretName | default "github-webhook-secret" -}}

          {{/* Event triggers configuration */}}
          {{- $triggers := $spec.eventTriggers | default list -}}
          {{- $hasEventTriggers := gt (len $triggers) 0 -}}

          {{/* Resource names */}}
          {{- $resourceName := printf "%s-%s-%s" $projectName $appName $gateName -}}
          {{- $eventSourceName := printf "%s-%s-eventsource" $appName $gateName -}}
          {{- $sensorName := printf "%s-%s-sensor" $appName $gateName -}}
          {{- $ingressName := printf "%s-%s-webhook-ingress" $appName $gateName -}}
          {{- $webhookHost := printf "%s-%s.wh.promoter.%s" $appName $gateName $baseDomain -}}
          {{- $workflowTemplateName := printf "%s-%s-workflow" $projectName $gateName -}}

          {{- if $hasEventTriggers }}
          ---
          # EventSource - Single resource with multiple event configurations
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-eventsource
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: eventsource
              platform.kubecore.io/app: {{ $appName | quote }}
              platform.kubecore.io/project: {{ $projectName | quote }}
              platform.kubecore.io/gate: {{ $gateName | quote }}
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $providerConfigName }}
            forProvider:
              manifest:
                apiVersion: argoproj.io/v1alpha1
                kind: EventSource
                metadata:
                  name: {{ $eventSourceName }}
                  namespace: {{ $appNamespace }}
                  labels:
                    platform.kubecore.io/app: {{ $appName | quote }}
                    platform.kubecore.io/project: {{ $projectName | quote }}
                    platform.kubecore.io/gate: {{ $gateName | quote }}
                    platform.kubecore.io/resource-type: eventsource
                spec:
                  service:
                    ports:
                    - name: webhook
                      port: 12000
                      targetPort: 12000

                  github:
                    {{- range $trigger := $triggers }}
                    # Event config for {{ $trigger.name }}
                    {{ $trigger.name }}:
                      repositories:
                      - owner: {{ $repo.owner }}
                        names:
                        - {{ $repo.name }}

                      {{- if and $githubAppId $githubInstallationId }}
                      githubApp:
                        privateKey:
                          name: {{ $githubPrivateKeySecret }}
                          key: private-key
                        appID: {{ $githubAppId | quote }}
                        installationID: {{ $githubInstallationId | quote }}
                      {{- else }}
                      apiToken:
                        name: github-access-token
                        key: token
                      {{- end }}

                      webhook:
                        endpoint: /{{ $appName }}-{{ $gateName }}-{{ $trigger.name }}-webhook
                        port: "12000"
                        method: POST
                        url: https://{{ $webhookHost }}

                      events:
                      {{- range $event := $trigger.events }}
                        - {{ $event | quote }}
                      {{- end }}

                      webhookSecret:
                        name: {{ $githubWebhookSecret }}
                        key: secret

                      insecure: false
                      active: true
                      contentType: json

                      {{- if $trigger.filters }}
                      filters:
                        data:
                        {{- range $filter := $trigger.filters }}
                        - path: {{ $filter.path | quote }}
                          type: {{ $filter.type | default "string" | quote }}
                          value:
                          {{- range $value := $filter.value }}
                            - {{ $value | quote }}
                          {{- end }}
                        {{- end }}
                      {{- end }}

                      {{- if $trigger.filterExpression }}
                      filter:
                        expression: {{ $trigger.filterExpression | quote }}
                      {{- end }}
                    {{- end }}

          ---
          # Sensor - Single resource with multiple triggers (event type mapping)
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-sensor
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: sensor
              platform.kubecore.io/app: {{ $appName | quote }}
              platform.kubecore.io/project: {{ $projectName | quote }}
              platform.kubecore.io/gate: {{ $gateName | quote }}
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $providerConfigName }}
            forProvider:
              manifest:
                apiVersion: argoproj.io/v1alpha1
                kind: Sensor
                metadata:
                  name: {{ $sensorName }}
                  namespace: {{ $appNamespace }}
                  labels:
                    platform.kubecore.io/app: {{ $appName | quote }}
                    platform.kubecore.io/project: {{ $projectName | quote }}
                    platform.kubecore.io/gate: {{ $gateName | quote }}
                    platform.kubecore.io/resource-type: sensor
                spec:
                  template:
                    serviceAccountName: sensor-service-account

                  dependencies:
                  {{- range $trigger := $triggers }}
                  - name: {{ $trigger.name }}-dep
                    eventSourceName: {{ $eventSourceName }}
                    eventName: {{ $trigger.name }}
                  {{- end }}

                  triggers:
                  {{- range $idx, $trigger := $triggers }}
                  - template:
                      name: {{ $trigger.name }}-workflow-trigger
                      k8s:
                        operation: create
                        source:
                          resource:
                            apiVersion: argoproj.io/v1alpha1
                            kind: Workflow
                            metadata:
                              generateName: {{ $resourceName }}-{{ $trigger.targetTemplate }}-
                              namespace: {{ $appNamespace }}
                              labels:
                                platform.kubecore.io/app: {{ $appName | quote }}
                                platform.kubecore.io/project: {{ $projectName | quote }}
                                platform.kubecore.io/gate: {{ $gateName | quote }}
                                platform.kubecore.io/workflow: {{ $trigger.targetTemplate | quote }}
                                platform.kubecore.io/trigger: {{ $trigger.name | quote }}
                            spec:
                              workflowTemplateRef:
                                name: {{ $workflowTemplateName }}

                              # Target specific template in composite WorkflowTemplate!
                              workflowSpec:
                                entrypoint: {{ $trigger.targetTemplate }}

                              {{- if $trigger.parameterMapping }}
                              arguments:
                                parameters:
                                {{- range $param := $trigger.parameterMapping }}
                                - name: {{ $param.to }}
                                  value: ""
                                {{- end }}
                              {{- end }}

                        {{- if $trigger.parameterMapping }}
                        parameters:
                        {{- range $paramIdx, $param := $trigger.parameterMapping }}
                        - src:
                            dependencyName: {{ $trigger.name }}-dep
                            dataKey: {{ $param.from }}
                          dest: spec.arguments.parameters.{{ $paramIdx }}.value
                        {{- end }}
                        {{- end }}

                    conditions: {{ $trigger.name }}-fired
                  {{- end }}

                  conditions:
                  {{- range $trigger := $triggers }}
                    {{ $trigger.name }}-fired:
                      {{- if $trigger.filters }}
                      filters:
                        data:
                        {{- range $filter := $trigger.filters }}
                        - path: {{ $filter.path | quote }}
                          type: {{ $filter.type | default "string" | quote }}
                          value:
                          {{- range $value := $filter.value }}
                            - {{ $value | quote }}
                          {{- end }}
                        {{- end }}
                      {{- end }}
                  {{- end }}

          ---
          # Ingress - Webhook endpoint exposure
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-ingress
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ingress
              platform.kubecore.io/app: {{ $appName | quote }}
              platform.kubecore.io/project: {{ $projectName | quote }}
              platform.kubecore.io/gate: {{ $gateName | quote }}
          spec:
            deletionPolicy: Delete
            providerConfigRef:
              name: {{ $providerConfigName }}
            forProvider:
              manifest:
                apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: {{ $ingressName }}
                  namespace: {{ $appNamespace }}
                  labels:
                    platform.kubecore.io/app: {{ $appName | quote }}
                    platform.kubecore.io/project: {{ $projectName | quote }}
                    platform.kubecore.io/gate: {{ $gateName | quote }}
                    platform.kubecore.io/resource-type: ingress
                  annotations:
                    cert-manager.io/cluster-issuer: letsencrypt-prod
                    nginx.ingress.kubernetes.io/ssl-redirect: "true"
                spec:
                  ingressClassName: nginx
                  tls:
                  - hosts:
                    - {{ $webhookHost | quote }}
                    secretName: {{ printf "%s-%s-webhook-tls" $appName $gateName | quote }}
                  rules:
                  - host: {{ $webhookHost | quote }}
                    http:
                      paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: {{ printf "%s-eventsource-svc" $eventSourceName }}
                            port:
                              number: 12000
          {{- end }}

  # Step 3: Auto-ready function (automatically aggregates child resource status)
  - step: detect-readiness
    functionRef:
      name: function-auto-ready

  # Step 4: Sequencer for resource ordering
  - step: sequence-resources
    functionRef:
      name: function-sequencer
    input:
      apiVersion: sequencer.fn.crossplane.io/v1beta1
      kind: Input
      rules:
      # EventSource must exist before Sensor
      - sequence:
        - eventsource
        - sensor
      # EventSource must exist before Ingress (needs service)
      - sequence:
        - eventsource
        - ingress

{{- end }}
