{{- if .Values.crossplaneXRDs.enabled }}
---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xgithubprojects.github.platform.kubecore.io
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  scope: Cluster
  group: github.platform.kubecore.io
  names:
    kind: XGitHubProject
    plural: xgithubprojects
  defaultCompositionRef:
    name: githubproject
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              description:
                type: string
                description: "Description for the GitHub repository and project"
                minLength: 1
                maxLength: 500
              visibility:
                type: string
                description: "Repository visibility setting"
                enum: ["public", "private", "internal"]
                default: "private"
              features:
                type: object
                description: "Feature toggles for optional functionality"
                properties:
                  teams:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                        description: "Enable team creation and management"
                  repository:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                        description: "Enable repository creation"
                  applicationSets:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                        description: "Enable ArgoCD ApplicationSet creation"
                  webhooks:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: false
                        description: "Enable repository webhook creation"
            required:
            - description
            - visibility
          status:
            type: object
            properties:
              providerConfigName:
                type: string
                description: "Name of the GitHub ProviderConfig being used"
              repository:
                type: object
                description: "Repository status information"
                properties:
                  url:
                    type: string
                    description: "Repository HTML URL"
                  fullName:
                    type: string
                    description: "Repository full name (owner/repo)"
                  id:
                    type: string
                    description: "Repository ID"
                  defaultBranch:
                    type: string
                    description: "Repository default branch"
              teamIDs:
                type: object
                description: "Created team IDs for reference"
                properties:
                  main:
                    type: string
                    description: "Main team ID"
                  software:
                    type: string
                    description: "Software team ID"
                  ops:
                    type: string
                    description: "Operations team ID"
                  business:
                    type: string
                    description: "Business team ID"
              webhooks:
                type: array
                description: "Created webhook information"
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: "Webhook name"
                    id:
                      type: string
                      description: "GitHub webhook ID"
                    url:
                      type: string
                      description: "Webhook endpoint URL"
              ready:
                type: boolean
                description: "Indicates if all resources are successfully provisioned and ready"
              childResources:
                type: object
                description: "Summary of all child resources managed by this composition"
                properties:
                  total:
                    type: integer
                    description: "Total number of child resources"
                  healthy:
                    type: integer
                    description: "Number of healthy child resources"
                  resources:
                    type: array
                    description: "List of resource metadata"
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                        status:
                          type: string
    additionalPrinterColumns:
    - name: Description
      type: string
      jsonPath: .spec.description
    - name: Visibility
      type: string
      jsonPath: .spec.visibility
    - name: Provider
      type: string
      jsonPath: .status.providerConfigName
    - name: Repository
      type: string
      jsonPath: .status.repository.fullName
    - name: Ready
      type: boolean
      jsonPath: .status.ready
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
{{- end }}
