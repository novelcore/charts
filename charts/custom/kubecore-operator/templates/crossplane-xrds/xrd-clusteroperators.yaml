{{- if .Values.crossplaneXRDs.enabled }}
---
---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: xclusteroperators.platform.kubecore.io
spec:
  group: platform.kubecore.io
  names:
    kind: XClusterOperators
    plural: xclusteroperators
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              clusterRef:
                type: object
                description: "Reference to the target cluster"
                properties:
                  name:
                    type: string
                    description: "Name of the cluster (KubePool name)"
                required:
                - name
              operators:
                type: object
                description: "Which operators to install (each brings its own CRDs)"
                properties:
                  postgres:
                    type: boolean
                    description: "Enable CloudNativePG operator (and optionally shared Postgres when provisionSharedPostgres is true)"
                    default: false
                  nvidiaGpu:
                    type: boolean
                    description: "Enable NVIDIA GPU Operator (device plugin, container toolkit, DCGM exporter)"
                    default: false
                  karpenter:
                    type: boolean
                    description: "Enable Karpenter node autoscaler for on-demand GPU/CPU pipeline nodes"
                    default: false
              provisionSharedPostgres:
                type: boolean
                description: "When true (default), provision a shared Postgres cluster for MLflow. When false, only install the operator; ML stack is provisioned per KubeProject environment."
                default: true
              environmentConfigRef:
                type: object
                description: "Reference to the EnvironmentConfig"
                properties:
                  name:
                    type: string
                required:
                - name
            required:
            - clusterRef
            - environmentConfigRef
          status:
            type: object
            properties:
              clusterName:
                type: string
              postgres:
                type: object
                properties:
                  ready:
                    type: boolean
                  clusterName:
                    type: string
                  namespace:
                    type: string
              nvidiaGpu:
                type: object
                properties:
                  ready:
                    type: boolean
                  namespace:
                    type: string
              karpenter:
                type: object
                properties:
                  ready:
                    type: boolean
                  namespace:
                    type: string
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string }
                    status: { type: string }
                    reason: { type: string }
                    message: { type: string }
                    lastTransitionTime: { type: string }
{{- end }}
