{{- if .Values.crossplaneXRDs.enabled }}
---
---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: xprojectmlstacks.platform.kubecore.io
spec:
  group: platform.kubecore.io
  names:
    kind: XProjectMLStack
    plural: xprojectmlstacks
  scope: Cluster
  defaultCompositionRef:
    name: projectmlstack
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              projectName:
                type: string
                description: "KubeProject name"
              clusterRef:
                type: object
                description: "Reference to the KubePool (cluster) whose system nodes host this ML stack"
                properties:
                  name:
                    type: string
                    description: "KubePool name"
                required:
                - name
              kubeOrgRef:
                type: string
                description: "KubeOrg name for provider configs"
              region:
                type: string
                description: "AWS region for S3 and resources (inherited from KubePool EnvironmentConfig)"
              features:
                type: object
                description: "ML stack feature toggles"
                properties:
                  mlflow:
                    type: boolean
                    default: false
                  lakefs:
                    type: boolean
                    default: false
                  s3:
                    type: boolean
                    default: false
                  postgres:
                    type: boolean
                    default: false
              postgresResources:
                type: object
                description: "Optional Postgres resource sizing overrides for the per-project CloudNativePG cluster"
                properties:
                  cpu:
                    type: string
                    description: "Requested CPU for primary Postgres instance (e.g., 500m)"
                  memory:
                    type: string
                    description: "Requested memory for primary Postgres instance (e.g., 1Gi)"
                  storageSize:
                    type: string
                    description: "Storage size for the primary Postgres PVC (e.g., 20Gi)"
              environmentConfigRef:
                type: object
                description: "Reference to the system EnvironmentConfig for this ML stack (e.g., {pool}-system-config)"
                properties:
                  name:
                    type: string
                required:
                - name
            required:
            - projectName
            - clusterRef
            - environmentConfigRef
          status:
            type: object
            properties:
              ready:
                type: boolean
              namespace:
                type: string
                description: "Kubernetes namespace hosting the ML stack"
              mlflowEndpoint:
                type: string
                description: "In-cluster MLflow service URL"
              lakeFSEndpoint:
                type: string
                description: "In-cluster lakeFS service URL"
              s3Bucket:
                type: string
                description: "S3 bucket name for ML artifacts"
              postgresHost:
                type: string
                description: "In-cluster Postgres host (CNPG cluster -rw service)"
              features:
                type: object
                properties:
                  mlflow:
                    type: boolean
                  lakefs:
                    type: boolean
                  s3:
                    type: boolean
                  postgres:
                    type: boolean
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string }
                    status: { type: string }
                    reason: { type: string }
                    message: { type: string }

{{- end }}
