{{- if .Values.crossplaneXRDs.enabled }}
---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xgithubapps.github.platform.kubecore.io
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  scope: Cluster
  group: github.platform.kubecore.io
  names:
    kind: XGitHubApp
    plural: xgithubapps
  defaultCompositionRef:
    name: githubapps-v2.github.platform.kubecore.io
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              appName:
                type: string
                description: "Name of the GitHub app/component"
              description:
                type: string
                description: "Description of the GitHub app/component"
                default: "GitHub app created by Crossplane"
              visibility:
                type: string
                description: "Repository visibility (private, public, internal)"
                default: "private"
                enum:
                - private
                - public
                - internal
              repositoryName:
                type: string
                description: "Name of the repository (defaults to XGitHubApp name if not specified)"
              repositorySource:
                type: object
                description: "How to source the repository: from a template or observe an existing one"
                properties:
                  type:
                    type: string
                    enum: [ "template", "existing" ]
                    description: "Whether to create from a template or observe an existing repository"
                  template:
                    type: object
                    properties:
                      owner:
                        type: string
                      repository:
                        type: string
                      includeAllBranches:
                        type: boolean
                    required: [ owner, repository ]
                  existing:
                    type: object
                    properties:
                      owner:
                        type: string
                    required: [ owner ]
                required: [ type ]

              features:
                type: object
                description: "Feature toggles for this GitHub app"
                properties:
                  repository:
                    type: object
                    description: "Repository feature configuration"
                    properties:
                      enabled:
                        type: boolean
                        description: "Whether to create and manage the repository"
                        default: true
                  teams:
                    type: object
                    description: "Team management feature configuration"
                    properties:
                      enabled:
                        type: boolean
                        description: "Whether to create team repository bindings"
                        default: true
                  ciCd:
                    type: object
                    description: "CI/CD feature configuration"
                    properties:
                      enabled:
                        type: boolean
                        description: "Whether to create GitHub Actions variables and secrets"
                        default: true
                      branchStrategy:
                        type: object
                        description: "Branch strategy configuration"
                        properties:
                          enabled:
                            type: boolean
                            description: "Whether to enable branching strategy implementation"
                            default: true
                          type:
                            type: string
                            description: "Type of branching strategy to implement"
                            default: "gitFlow"
                            enum:
                            - gitFlow
                            - trunk
                            - custom
                  webhooks:
                    type: object
                    description: "Webhook feature configuration"
                    properties:
                      enabled:
                        type: boolean
                        description: "Whether to create webhooks from EnvironmentConfig"
                        default: true
              branchStrategy:
                type: object
                description: "Configuration for automatic branch creation and strategy after repository creation"
                properties:
                  enabled:
                    type: boolean
                    description: "Whether to enable branching strategy implementation"
                    default: true
                  type:
                    type: string
                    description: "Type of branching strategy to implement"
                    default: "gitFlow"
                    enum:
                    - gitFlow
                    - trunk
                    - custom
              webhooks:
                type: object
                description: "Webhook configuration for this GitHub app. If enabled is true, will create webhooks as specified. If not set, falls back to environment config."
                properties:
                  enabled:
                    type: boolean
                    description: "Whether to enable webhook creation for this app. Defaults to true."
                    default: true
                  items:
                    type: array
                    description: "List of webhooks to create for the repository. If not specified in the claim, will fallback to EnvironmentConfig."
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: "Name of the webhook resource (used for metadata.name)"
                        events:
                          type: array
                          description: "List of GitHub events to trigger the webhook (e.g., push, pull_request)"
                          items:
                            type: string
                        active:
                          type: boolean
                          description: "Whether the webhook is active"
                          default: true
                        configuration:
                          type: object
                          description: "Webhook configuration options"
                          properties:
                            contentType:
                              type: string
                              description: "Content type for webhook payloads (e.g., json)"
                              default: "json"
                            insecureSsl:
                              type: boolean
                              description: "Set to true if using self-signed certs on the webhook endpoint"
                              default: false
                            urlSecretRef:
                              type: object
                              description: "Reference to a secret containing the webhook URL"
                              properties:
                                name:
                                  type: string
                                namespace:
                                  type: string
                                key:
                                  type: string
                              required: [ name, key ]
                            secretSecretRef:
                              type: object
                              description: "Reference to a secret containing the webhook secret (optional)"
                              properties:
                                name:
                                  type: string
                                namespace:
                                  type: string
                                key:
                                  type: string
                              required: [ name, key ]
                      required: [ name, events, configuration ]
            required: []
          status:
            type: object
            properties:
              # Basic Crossplane status fields
              providerConfigName:
                type: string
                description: "GitHub ProviderConfig name"
              repositoryUrl:
                type: string
                description: "Direct repository URL"
              gitHubProviderConfig:
                type: string
                description: "GitHub provider configuration name"

              # Repository status (CRITICAL for KubeApp integration)
              repository:
                type: object
                description: "Repository status information"
                properties:
                  created:
                    type: boolean
                    description: "Repository creation status"
                  name:
                    type: string
                    description: "Repository name"
                  fullName:
                    type: string
                    description: "Repository full name (owner/repo)"
                  url:
                    type: string
                    description: "Repository URL"
                  visibility:
                    type: string
                    description: "Repository visibility"

              # Teams status (CRITICAL for KubeApp integration)
              teams:
                type: object
                description: "Teams configuration status"
                properties:
                  configured:
                    type: boolean
                    description: "Teams configuration status"
                  teamCount:
                    type: integer
                    description: "Number of teams configured"
                  teams:
                    type: array
                    items:
                      type: string
                    description: "List of team names"

              # CI/CD status (CRITICAL for KubeApp integration)
              ciCd:
                type: object
                description: "CI/CD configuration status"
                properties:
                  configured:
                    type: boolean
                    description: "CI/CD configuration status"
                  actionsConfigured:
                    type: boolean
                    description: "GitHub Actions configuration status"
                  branchStrategy:
                    type: object
                    description: "Branch strategy implementation status"
                    properties:
                      implemented:
                        type: boolean
                        description: "Branch strategy implementation status"
                      type:
                        type: string
                        description: "Branch strategy type"
                      branchesCreated:
                        type: array
                        items:
                          type: string
                        description: "Created branches"
                      protectionRulesApplied:
                        type: array
                        items:
                          type: string
                        description: "Applied protection rules"

              # SDLC and GitOps Promoter Status
              sdlc:
                type: object
                description: "SDLC and GitOps Promoter configuration status"
                properties:
                  promoter:
                    type: object
                    description: "GitOps Promoter integration status"
                    properties:
                      enabled:
                        type: boolean
                        description: "Whether GitOps Promoter is enabled"
                      observersReady:
                        type: boolean
                        description: "ArgoCD application observers readiness status"
                      promotionStrategyCreated:
                        type: boolean
                        description: "PromotionStrategy resource creation status"
                      argoCDCommitStatusCreated:
                        type: boolean
                        description: "ArgoCDCommitStatus resource creation status"
                      kubePools:
                        type: object
                        description: "Per-KubePool promoter status"
                        x-kubernetes-preserve-unknown-fields: true
                      environments:
                        type: array
                        description: "Promotion environment configuration"
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            branch:
                              type: string
                            autoMerge:
                              type: boolean

              # Template information (OPTIONAL enhancement)
              templateName:
                type: string
                description: "Template name"
              templateType:
                type: string
                description: "Template type"
              templateLanguage:
                type: string
                description: "Template language"
              templateProfile:
                type: string
                description: "Template profile"
              source:
                type: object
                description: "Template source information"
                properties:
                  owner:
                    type: string
                    description: "Template source owner"
                  repository:
                    type: string
                    description: "Template source repository"

              # Overall status fields
              ready:
                type: boolean
                description: "Overall readiness status"
              childResources:
                type: object
                description: "Child resources summary"
                properties:
                  total:
                    type: integer
                    description: "Total number of child resources"
                  healthy:
                    type: integer
                    description: "Number of healthy child resources"
                  resources:
                    type: array
                    description: "List of resource metadata"
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                        status:
                          type: string
    additionalPrinterColumns:
    - name: App Name
      type: string
      jsonPath: .spec.appName
    - name: Repository
      type: string
      jsonPath: .status.repository.fullName
    - name: Visibility
      type: string
      jsonPath: .spec.visibility
    - name: Provider
      type: string
      jsonPath: .status.providerConfigName
    - name: Ready
      type: boolean
      jsonPath: .status.ready
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
{{- end }}
