{{- if .Values.crossplaneXRDs.enabled }}
---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: xqualitygatetemplates.platform.kubecore.io
spec:
  scope: Namespaced
  group: platform.kubecore.io
  names:
    kind: XQualityGateTemplate
    plural: xqualitygatetemplates
  defaultCompositionRef:
    name: xqualitygatetemplates.platform.kubecore.io
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - projectName
            - gateName
            - targetCluster
            - clusterWorkflowTemplateRef
            properties:
              projectName:
                type: string
                description: "Name of the KubeProject this gate applies to"
              gateName:
                type: string
                description: "Name of the quality gate (e.g., preview-env, stress-test, security-scan)"
              gateKey:
                type: string
                description: "CommitStatus key for this gate (defaults to gateName if not specified)"
              targetCluster:
                type: object
                description: "Target Kubernetes cluster for deploying workflow resources"
                required:
                - name
                - providerConfigName
                properties:
                  name:
                    type: string
                    description: "Name of the target cluster"
                  providerConfigName:
                    type: string
                    description: "Kubernetes provider config name for the target cluster"
                  namespace:
                    type: string
                    description: "Namespace for workflow resources"
                    default: "gitops-engine"
              clusterWorkflowTemplateRef:
                type: object
                description: "Reference to ClusterWorkflowTemplate in control cluster that will be copied to target cluster"
                required:
                - name
                properties:
                  name:
                    type: string
                    description: "Name of the ClusterWorkflowTemplate resource in the control cluster"
                  entrypoints:
                    type: array
                    description: "Optional: Specific entrypoints to expose from the template (defaults to all)"
                    items:
                      type: string
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
              resources:
                type: object
                description: "References to created resources"
                properties:
                  workflowTemplate:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                      templates:
                        type: array
                        description: "List of template names in composite WorkflowTemplate"
                        items:
                          type: string
                  workflowExecutorServiceAccount:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                  sensorServiceAccount:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                  clusterRole:
                    type: object
                    properties:
                      name:
                        type: string
                  clusterRoleBinding:
                    type: object
                    properties:
                      name:
                        type: string
              ready:
                type: boolean
                description: "Overall readiness status"
    additionalPrinterColumns:
    - name: Project
      type: string
      jsonPath: .spec.projectName
    - name: Gate
      type: string
      jsonPath: .spec.gateName
    - name: Templates
      type: string
      jsonPath: .status.resources.workflowTemplate.templates[*]
    - name: Cluster
      type: string
      jsonPath: .spec.targetCluster.name
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=='Ready')].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
{{- end }}
