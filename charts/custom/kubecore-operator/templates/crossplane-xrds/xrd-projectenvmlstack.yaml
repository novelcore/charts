{{- if .Values.crossplaneXRDs.enabled }}
---
---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: xprojectenvmlstacks.platform.kubecore.io
spec:
  group: platform.kubecore.io
  names:
    kind: XProjectEnvMLStack
    plural: xprojectenvmlstacks
  scope: Cluster
  defaultCompositionRef:
    name: projectenvmlstack
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              projectName:
                type: string
                description: "KubeProject name"
              environmentName:
                type: string
                description: "Environment name within the project"
              clusterRef:
                type: object
                description: "Reference to the KubePool (cluster) where this ML stack is provisioned"
                properties:
                  name:
                    type: string
                    description: "KubePool name"
                required:
                - name
              kubeOrgRef:
                type: string
                description: "KubeOrg name for provider configs"
              region:
                type: string
                description: "AWS region for S3 and resources (inherited from environment's KubePool)"
              features:
                type: object
                description: "ML stack feature toggles"
                properties:
                  mlflow:
                    type: boolean
                    default: false
                  s3:
                    type: boolean
                    default: false
                  postgres:
                    type: boolean
                    default: false
              environmentConfigRef:
                type: object
                description: "Reference to the EnvironmentConfig for this ML stack"
                properties:
                  name:
                    type: string
                required:
                - name
            required:
            - projectName
            - environmentName
            - clusterRef
            - environmentConfigRef
          status:
            type: object
            properties:
              ready:
                type: boolean
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string }
                    status: { type: string }
                    reason: { type: string }
                    message: { type: string }
{{- end }}
