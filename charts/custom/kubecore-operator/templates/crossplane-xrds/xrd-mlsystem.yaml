{{- if .Values.crossplaneXRDs.enabled }}
---
---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: xmlsystems.platform.kubecore.io
spec:
  group: platform.kubecore.io
  names:
    kind: XMLSystem
    plural: xmlsystems
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              clusterRef:
                type: object
                description: "Reference to the target cluster for ML system deployment"
                properties:
                  name:
                    type: string
                    description: "Name of the cluster (matches EnvironmentConfig cluster-name label)"
                required:
                - name
              features:
                type: object
                description: "ML system feature toggles (default true when omitted)"
                properties:
                  mlflow:
                    type: boolean
                    description: "Enable MLflow installation (Postgres backend, optional S3 artifacts)"
                    default: true
                  s3:
                    type: boolean
                    description: "Create S3 bucket and use for MLflow artifacts; when false, no bucket or IRSA"
                    default: true
              environmentConfigRef:
                type: object
                description: "Reference to the EnvironmentConfig for ML system"
                properties:
                  name:
                    type: string
                    description: "Name of the EnvironmentConfig"
                required:
                - name
            required:
            - clusterRef
            - environmentConfigRef
          status:
            type: object
            properties:
              clusterName:
                type: string
                description: "Target cluster name"
              region:
                type: string
                description: "AWS region where cluster is deployed"
              mlflow:
                type: object
                description: "MLflow component status"
                properties:
                  ready:
                    type: boolean
                    description: "Whether MLflow server is ready"
                  url:
                    type: string
                    description: "MLflow server URL"
                  namespace:
                    type: string
                    description: "Namespace where MLflow is installed"
              conditions:
                type: array
                description: "Status conditions"
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
{{- end }}
