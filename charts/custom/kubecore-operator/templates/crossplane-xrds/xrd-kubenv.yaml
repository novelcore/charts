{{- if .Values.crossplaneXRDs.enabled }}
---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xkubenvs.platform.kubecore.io
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  group: platform.kubecore.io
  names:
    kind: XKubEnv
    plural: xkubenvs
  # Claims not supported in apiextensions.crossplane.io/v2 - use XR directly
  # Connection secrets not supported in apiextensions.crossplane.io/v2 - handled by individual resources
  scope: Cluster
  defaultCompositionRef:
    name: kubenv
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              # EKS Cluster Reference - simplified for v2
              eksClusterName:
                type: string
                description: "Name of the EKS cluster to create the environment in"

              # NodeGroup Configuration - user provides direct configuration
              nodeGroup:
                type: object
                description: "NodeGroup configuration for this environment"
                properties:
                  instanceType:
                    type: string
                    description: "EC2 instance type for nodes (e.g., 'm5.2xlarge')"
                  diskSize:
                    type: integer
                    description: "Disk size in GB for worker nodes"
                    default: 20
                  capacityType:
                    type: string
                    description: "Capacity type for the nodegroup"
                    enum: ["ON_DEMAND", "SPOT"]
                    default: "ON_DEMAND"
                  scalingConfig:
                    type: object
                    description: "Auto scaling configuration"
                    properties:
                      minSize:
                        type: integer
                        description: "Minimum number of nodes"
                        default: 1
                      maxSize:
                        type: integer
                        description: "Maximum number of nodes"
                        default: 3
                      desiredSize:
                        type: integer
                        description: "Desired number of nodes"
                        default: 1
                    required:
                    - minSize
                    - maxSize
                    - desiredSize
                  multiAZ:
                    type: boolean
                    description: "Deploy nodegroup across multiple availability zones"
                    default: false
                required:
                - instanceType

              # Feature Configuration - minimal user-facing spec
              features:
                type: object
                description: "Environment feature toggles"
                properties:
                  resourceQuota:
                    type: boolean
                    description: "Enable ResourceQuota for the namespace"
                    default: true
                  limitRange:
                    type: boolean
                    description: "Enable LimitRange for the namespace"
                    default: true
                  nodeGroupTaints:
                    type: boolean
                    description: "Apply environment-specific taints to nodegroup"
                    default: true

              # Provider Configuration References
              providerConfigRef:
                type: object
                description: "Reference to provider configurations"
                properties:
                  aws:
                    type: string
                    description: "Name of the AWS provider configuration to use"
                    default: "aws-default"
                  kubernetes:
                    type: string
                    description: "Name of the Kubernetes provider configuration to use"
                    default: "kubernetes-default"

              envType:
                type: string
                description: "Environment type (dev, stage, prod) inherited from template"
                enum: ["dev", "stage", "prod"]

            required:
            - eksClusterName
            - nodeGroup
            - envType

          status:
            type: object
            properties:
              # Environment Information
              environmentName:
                type: string
                description: "Environment name (derived from metadata.name)"
              eksClusterName:
                type: string
                description: "Target EKS cluster name"
              region:
                type: string
                description: "AWS region where resources are deployed"
              phase:
                type: string
                description: "Current environment deployment phase"
                enum: ["Pending", "Provisioning", "Active", "Updating", "Deleting", "Failed"]

              # Resource Status
              namespace:
                type: object
                description: "Kubernetes namespace status"
                properties:
                  name:
                    type: string
                  status:
                    type: string
                    enum: ["Pending", "Ready", "Error"]
                  resourceQuotaEnabled:
                    type: boolean
                  limitRangeEnabled:
                    type: boolean

              # NodeGroup Status
              nodeGroup:
                type: object
                description: "NodeGroup deployment status"
                properties:
                  name:
                    type: string
                  status:
                    type: string
                    enum: ["Pending", "Creating", "Active", "Updating", "Error"]
                  instanceType:
                    type: string
                  capacityType:
                    type: string
                  multiAZ:
                    type: boolean
                  scaling:
                    type: object
                    properties:
                      desired:
                        type: integer
                      minimum:
                        type: integer
                      maximum:
                        type: integer
                  nodes:
                    type: object
                    properties:
                      ready:
                        type: integer
                      total:
                        type: integer
                  # Node Scheduling Information
                  nodeLabels:
                    type: object
                    description: "Labels applied to nodes in this NodeGroup"
                    additionalProperties:
                      type: string
                  nodeTaints:
                    type: array
                    description: "Taints applied to nodes requiring tolerations"
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        value:
                          type: string
                        effect:
                          type: string
                  availabilityZones:
                    type: array
                    description: "Availability zones where nodes are deployed"
                    items:
                      type: string
                  subnetIds:
                    type: array
                    description: "Subnet IDs used by the NodeGroup"
                    items:
                      type: string

              # Network Status
              networking:
                type: object
                description: "Networking configuration status"
                properties:
                  subnets:
                    type: array
                    description: "Created subnets for the nodegroup"
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        cidr:
                          type: string
                        availabilityZone:
                          type: string
                        status:
                          type: string

              # Environment Configuration
              environmentConfig:
                type: object
                description: "Information about the associated EnvironmentConfig"
                properties:
                  name:
                    type: string
                    description: "Name of the EnvironmentConfig"
                  found:
                    type: boolean
                    description: "Whether the EnvironmentConfig was found"
                  validated:
                    type: boolean
                    description: "Whether the EnvironmentConfig passed validation"

              # Conditions and Events
              conditions:
                type: array
                description: "Status conditions"
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string

              # Resource Summary
              resources:
                type: object
                description: "Summary of created resources"
                properties:
                  total:
                    type: integer
                    description: "Total number of resources created"
                  ready:
                    type: integer
                    description: "Number of ready resources"
                  pending:
                    type: integer
                    description: "Number of pending resources"

              # Deployment Information
              deployment:
                type: object
                description: "Deployment metadata"
                properties:
                  startTime:
                    type: string
                    description: "When deployment started"
                  lastUpdate:
                    type: string
                    description: "Last status update time"

              # Application Scheduling Profile
              schedulingProfile:
                type: object
                description: "Complete scheduling profile for applications to use"
                properties:
                  nodeSelectors:
                    type: object
                    description: "Recommended node selectors for pod placement"
                    additionalProperties:
                      type: string
                  tolerations:
                    type: array
                    description: "Required tolerations for scheduling on this environment"
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        operator:
                          type: string
                        value:
                          type: string
                        effect:
                          type: string
                  affinity:
                    type: object
                    description: "Recommended affinity rules"
                    properties:
                      nodeAffinity:
                        type: string
                        description: "JSON-encoded node affinity configuration"
                  availabilityZones:
                    type: array
                    description: "Available zones for pod distribution"
                    items:
                      type: string
{{- end }}
