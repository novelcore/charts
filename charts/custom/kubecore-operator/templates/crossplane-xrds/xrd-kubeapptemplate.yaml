{{- if .Values.crossplaneXRDs.enabled }}
---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xkubeapptemplates.platform.kubecore.io
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  scope: Cluster
  group: platform.kubecore.io
  names:
    kind: XKubeAppTemplate
    plural: xkubeapptemplates
  defaultCompositionRef:
    name: kubeapptemplates
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              type:
                type: string
                description: "Application type (e.g., rest, grpc, batch, etc.)"
              language:
                type: string
                description: "Programming language for the application"
              description:
                type: string
                description: "Description of the application template"
              source:
                type: object
                description: "Source configuration for the template"
                properties:
                  owner:
                    type: string
                    description: "Owner/organization of the template source"
                  repository:
                    type: string
                    description: "Repository name for the template source"
                required: [owner, repository]
              structure:
                type: object
                description: "Structure definition for the application components"
                properties:
                  components:
                    type: array
                    description: "List of components that make up the application"
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: "Component type (deployment, service, ingress, etc.)"
                          enum:
                          - deployment
                          - service
                          - ingress
                          - configmap
                          - secret
                          - pvc
                        ports:
                          type: array
                          description: "Ports exposed by this component"
                          items:
                            type: integer
                            minimum: 1
                            maximum: 65535
                        expose:
                          type: array
                          description: "Ports to expose externally (subset of ports)"
                          items:
                            type: integer
                            minimum: 1
                            maximum: 65535
                        required:
                          type: boolean
                          description: "Whether this component is required"
                          default: false
                      required: [type]
              profiles:
                type: object
                description: "Resource profiles for different deployment scenarios"
                properties:
                  small:
                    type: object
                    description: "Small resource profile"
                    properties:
                      requests:
                        type: object
                        properties:
                          cpu:
                            type: string
                            pattern: '^[0-9]+m?$|^[0-9]*\.?[0-9]+$'
                            description: "CPU request (e.g., 100m, 0.5)"
                          memory:
                            type: string
                            pattern: '^[0-9]+[KMGT]i?$'
                            description: "Memory request (e.g., 128Mi, 1Gi)"
                        required: [cpu, memory]
                      limits:
                        type: object
                        properties:
                          cpu:
                            type: string
                            pattern: '^[0-9]+m?$|^[0-9]*\.?[0-9]+$'
                            description: "CPU limit (e.g., 500m, 1)"
                          memory:
                            type: string
                            pattern: '^[0-9]+[KMGT]i?$'
                            description: "Memory limit (e.g., 512Mi, 2Gi)"
                        required: [cpu, memory]
                    required: [requests, limits]
                  medium:
                    type: object
                    description: "Medium resource profile"
                    properties:
                      requests:
                        type: object
                        properties:
                          cpu:
                            type: string
                            pattern: '^[0-9]+m?$|^[0-9]*\.?[0-9]+$'
                            description: "CPU request (e.g., 100m, 0.5)"
                          memory:
                            type: string
                            pattern: '^[0-9]+[KMGT]i?$'
                            description: "Memory request (e.g., 128Mi, 1Gi)"
                        required: [cpu, memory]
                      limits:
                        type: object
                        properties:
                          cpu:
                            type: string
                            pattern: '^[0-9]+m?$|^[0-9]*\.?[0-9]+$'
                            description: "CPU limit (e.g., 500m, 1)"
                          memory:
                            type: string
                            pattern: '^[0-9]+[KMGT]i?$'
                            description: "Memory limit (e.g., 512Mi, 2Gi)"
                        required: [cpu, memory]
                    required: [requests, limits]
                  large:
                    type: object
                    description: "Large resource profile"
                    properties:
                      requests:
                        type: object
                        properties:
                          cpu:
                            type: string
                            pattern: '^[0-9]+m?$|^[0-9]*\.?[0-9]+$'
                            description: "CPU request (e.g., 100m, 0.5)"
                          memory:
                            type: string
                            pattern: '^[0-9]+[KMGT]i?$'
                            description: "Memory request (e.g., 128Mi, 1Gi)"
                        required: [cpu, memory]
                      limits:
                        type: object
                        properties:
                          cpu:
                            type: string
                            pattern: '^[0-9]+m?$|^[0-9]*\.?[0-9]+$'
                            description: "CPU limit (e.g., 500m, 1)"
                          memory:
                            type: string
                            pattern: '^[0-9]+[KMGT]i?$'
                            description: "Memory limit (e.g., 512Mi, 2Gi)"
                        required: [cpu, memory]
                    required: [requests, limits]
              environmentSchema:
                type: object
                description: "Schema for environment variables"
                properties:
                  required:
                    type: array
                    description: "Required environment variables"
                    items:
                      type: string
                      minLength: 1
                  optional:
                    type: array
                    description: "Optional environment variables"
                    items:
                      type: string
                      minLength: 1
            required: [type, language, description, source, structure, profiles, environmentSchema]
          status:
            type: object
            properties:
              templateId:
                type: string
                description: "Unique identifier for this template"
              fullRepositoryName:
                type: string
                description: "Full repository name in owner/repository format"
              validated:
                type: boolean
                description: "Whether the template has been validated"
              validationErrors:
                type: array
                description: "List of validation errors, if any"
                items:
                  type: string
              lastValidated:
                type: string
                format: date-time
                description: "Timestamp of last validation"
              resourceProfiles:
                type: object
                description: "Processed resource profiles information"
                properties:
                  profileCount:
                    type: integer
                    description: "Number of resource profiles defined"
                  availableProfiles:
                    type: array
                    description: "List of available profile names"
                    items:
                      type: string
              components:
                type: object
                description: "Processed components information"
                properties:
                  componentCount:
                    type: integer
                    description: "Number of components defined"
                  componentTypes:
                    type: array
                    description: "List of component types"
                    items:
                      type: string
                  totalPorts:
                    type: integer
                    description: "Total number of ports across all components"
                  exposedPorts:
                    type: integer
                    description: "Total number of exposed ports"
    additionalPrinterColumns:
    - name: Type
      type: string
      jsonPath: .spec.type
    - name: Language
      type: string
      jsonPath: .spec.language
    - name: Validated
      type: boolean
      jsonPath: .status.validated
    - name: Components
      type: integer
      jsonPath: .status.components.componentCount
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
{{- end }}
