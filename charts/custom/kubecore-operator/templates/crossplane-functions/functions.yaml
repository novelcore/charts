{{- if .Values.crossplaneFunctions.enabled }}
# Crossplane Functions for Advanced Composition Capabilities
# These functions provide enhanced functionality for composition logic
# Note: Using Helm hooks to ensure Crossplane CRDs are installed first
---
# Go Templating Function
# Enables Go template-based resource generation for dynamic compositions
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-go-templating
  namespace: {{ .Values.crossplane.namespace | default "crossplane-system" }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: crossplane-function
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
    meta.crossplane.io/description: |
      Go templating function for dynamic resource generation.
      Enables complex logic and templating in compositions.
spec:
  package: {{ .Values.crossplaneFunctions.goTemplating.package | default "xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.10.0" }}
  {{- if .Values.crossplaneFunctions.goTemplating.runtimeConfigRef }}
  runtimeConfigRef:
    {{- toYaml .Values.crossplaneFunctions.goTemplating.runtimeConfigRef | nindent 4 }}
  {{- end }}
---
# Auto Ready Function
# Automatically manages readiness conditions for composite resources
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-auto-ready
  namespace: {{ .Values.crossplane.namespace | default "crossplane-system" }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: crossplane-function
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
    meta.crossplane.io/description: |
      Auto-ready function for improved status handling.
      Automatically sets readiness conditions based on resource status.
spec:
  package: {{ .Values.crossplaneFunctions.autoReady.package | default "xpkg.upbound.io/crossplane-contrib/function-auto-ready:v0.5.0" }}
  {{- if .Values.crossplaneFunctions.autoReady.runtimeConfigRef }}
  runtimeConfigRef:
    {{- toYaml .Values.crossplaneFunctions.autoReady.runtimeConfigRef | nindent 4 }}
  {{- end }}
---
