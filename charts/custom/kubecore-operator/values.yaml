# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
      # Docker image repository
      # Example: novelcore.azurecr.io/kubecore/kubecore-operator
      repository: novelcore.azurecr.io/kubecore/kubecore-operator
      # Image tag/version
      tag: 0.1.1
      # Image pull policy
      pullPolicy: IfNotPresent
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    # Environment variables required by the operator
    # Note: EKS_CLUSTER_ID must be exactly 32 characters
    env:
      EKS_CLUSTER_ID: "KINDCLUSTER123456789012345678901"
      EKS_REGION: "us-east-1"
      KUBERNETES_PROVIDER_CONFIG: "kubesys-enhanced"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
      readOnlyRootFilesystem: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: kubecore-operator-controller-manager

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: false

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false

# [REGISTRY]: Container registry configuration
registry:
  # Registry URL (e.g., novelcore.azurecr.io)
  url: "novelcore.azurecr.io"
  # Registry username (provide via values override)
  username: ""
  # Registry password (provide via values override)
  password: ""
  # Project/namespace within the registry
  project: "kubecore"
  # Create imagePullSecret for private registry
  createImagePullSecret: true
  # Name of the imagePullSecret (will be created in the release namespace)
  imagePullSecretName: "kubecore-operator-registry-secret"

# [CROSSPLANE]: Crossplane dependency configuration
crossplane:
  # Enable Crossplane installation as a dependency
  # IMPORTANT: Due to Helm subchart namespace inheritance, Crossplane will be installed
  # in the same namespace as this chart (not in crossplane-system).
  # For production deployments, it is STRONGLY RECOMMENDED to:
  #   1. Install Crossplane separately in crossplane-system namespace first
  #   2. Set enabled: false here
  # To install separately:
  #   helm install crossplane crossplane-stable/crossplane \
  #     --namespace crossplane-system --create-namespace --version 2.1.0
  enabled: true
  # Namespace parameter (only affects Crossplane's internal configuration, not installation location)
  namespace: crossplane-system
  # Additional Crossplane values can be passed through
  # These will be forwarded to the Crossplane subchart
  # See charts/external/crossplane/values.yaml for available options

# [EXTERNAL SECRETS OPERATOR]: ESO dependency configuration
externalSecrets:
  # Enable External Secrets Operator installation as a dependency
  # IMPORTANT: Due to Helm subchart namespace inheritance, ESO will be installed
  # in the same namespace as this chart.
  # For production deployments, it is STRONGLY RECOMMENDED to:
  #   1. Install External Secrets Operator separately in its own namespace first
  #   2. Set enabled: false here
  # To install separately:
  #   helm install external-secrets external-secrets/external-secrets \
  #     --namespace external-secrets-system --create-namespace --version 1.0.0
  enabled: true
  # Additional ESO values can be passed through
  # These will be forwarded to the external-secrets subchart
  # See https://external-secrets.io/latest/introduction/getting-started/ for available options

# [CROSSPLANE FUNCTIONS]: Crossplane functions configuration
crossplaneFunctions:
  # Enable installation of Crossplane functions
  # Set to false if Crossplane functions are already installed in your cluster
  enabled: true
  
  # Go Templating Function configuration
  goTemplating:
    # Function package
    package: "xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.10.0"
    # Optional runtime config reference
    runtimeConfigRef: {}
  
  # Auto Ready Function configuration
  autoReady:
    # Function package
    package: "xpkg.upbound.io/crossplane-contrib/function-auto-ready:v0.5.0"
    # Optional runtime config reference
    runtimeConfigRef: {}
  
  # Patch and Transform Function configuration
  patchAndTransform:
    # Function package
    package: "xpkg.upbound.io/upbound/function-patch-and-transform:v0.9.0"
    # Optional runtime config reference
    runtimeConfigRef: {}
  
  # Sequencer Function configuration
  sequencer:
    # Function package
    package: "xpkg.upbound.io/crossplane-contrib/function-sequencer:v0.2.3"
    # Optional runtime config reference
    runtimeConfigRef: {}
  
  # Environment Configs Function configuration
  environmentConfigs:
    # Function package
    package: "xpkg.upbound.io/crossplane-contrib/function-environment-configs:v0.4.0"
    # Optional runtime config reference
    runtimeConfigRef: {}
  
  # Extra Resources Function configuration
  extraResources:
    # Function package
    package: "xpkg.upbound.io/crossplane-contrib/function-extra-resources:v0.2.0"
    # Optional runtime config reference
    runtimeConfigRef: {}

# [CROSSPLANE PROVIDERS]: Crossplane providers and provider configs configuration
crossplaneProviders:
  # Enable installation of Crossplane providers and provider configs
  # Set to false if providers are already installed in your cluster
  enabled: true
  
  # Kubernetes Provider configuration
  kubernetes:
    # Optional runtime config reference
    runtimeConfigRef:
      name: kubesys-admin-runtime
  
  # GitHub Provider configuration
  github:
    # Provider package
    package: "ghcr.io/crossplane-contrib/provider-upjet-github:v0.19-provider-cache-testing-a3b6345"
    # Optional runtime config reference
    runtimeConfigRef: {}
  
  # Helm Provider configuration
  helm:
    # Optional runtime config reference
    runtimeConfigRef: {}
  
  # Provider Configs configuration
  providerConfigs:
    # Kubernetes ProviderConfig name
    kubernetes:
      name: kubesys-enhanced
    # AWS ProviderConfig configuration
    aws:
      name: aws-default
      secretRef:
        key: credentials
        name: aws-secret
        namespace: crossplane-system

# [CROSSPLANE XRDs]: Crossplane Composite Resource Definitions (XRDs) configuration
crossplaneXRDs:
  # Enable installation of Crossplane XRDs
  # Set to false if XRDs are already installed in your cluster
  # XRDs define the custom resource APIs used by KubeCore platform compositions:
  # - XAWSProvider: AWS infrastructure provisioning
  # - XGitHubProvider: GitHub integration
  # - XAWSNetwork: VPC and networking
  # - XEKS: EKS cluster management
  # - XKubeSystem: Platform system components
  # - XGitHubProject: Project repository management
  # - XKubEnv: Kubernetes environment (namespaces, quotas)
  # - XGitHubApp: Application repository management
  # - XK8sApp: Application deployment
  # - XKubeAppTemplate: Application templates
  # - XQualityGateInstance: Quality gate instances
  # - XQualityGateTemplate: Quality gate templates
  enabled: true
