# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
      # Docker image repository. Dev default only — release.yml stamps this from
      # the REGISTRY_URL/PROJECT_REGISTRY/IMAGE_NAME Actions vars at publish time,
      # so the registry switch lives in CI config, never a YAML literal.
      # Example: europe-west1-docker.pkg.dev/kaos-dev-gcp/kaos-images/platform/kubecore-operator
      repository: "europe-west1-docker.pkg.dev/kaos-dev-gcp/kaos-images/platform/kubecore-operator"
      # Image tag/version. Empty by default so the templates fall back to the
      # chart's appVersion (release.yml stamps Chart.yaml appVersion = release
      # version). One-pin: consumers pin only the chart version; the image tag
      # follows automatically and can never drift from the chart.
      tag: ""
      # Image pull policy
      pullPolicy: IfNotPresent
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    # Environment variables required by the operator
    env:
      # Control Plane Configuration
      CONTROL_PLANE_CLOUD: "aws"
      CONTROL_PLANE_CLUSTER_ID: "kind-cluster-placeholder"
      CONTROL_PLANE_REGION: "us-east-1"
      # CONTROL_PLANE_OIDC_ISSUER_ID is an optional AWS-only override. When unset,
      # the operator resolves it automatically via AWS DescribeCluster. Not required
      # (and has no effect) when CONTROL_PLANE_CLOUD is set to "gcp".
      # CONTROL_PLANE_OIDC_ISSUER_URL: "https://container.googleapis.com/v1/projects/<proj>/locations/<loc>/clusters/<cluster>"  # REQUIRED for Azure ESO (per-org serviceAccountRef FIC issuer, PRD-352 Option A)

      # Zitadel Integration Configuration
      # Set ZITADEL_ENABLED=true to enable Zitadel identity management integration
      # ZITADEL_SECRET_NAME: Name of the Kubernetes secret containing Zitadel credentials
      # ZITADEL_SECRET_NAMESPACE: Namespace where the secret is located
      ZITADEL_ENABLED: "true"
      ZITADEL_SECRET_NAME: "zitadel-credentials"
      ZITADEL_SECRET_NAMESPACE: "kubecore-system"

      # MeluXina token-mint image (PRD-585). The operator stamps this into the
      # per-pool token-mint CronJob. CI overwrites it at release with
      # {REGISTRY_URL}/{PROJECT_REGISTRY}/meluxina-tokenmint:{version} — the same
      # GAR registry + version as the operator image, pulled keylessly by the GKE
      # node SA. The v2-branch placeholder below mirrors the operator image path so
      # even an unstamped chart resolves to a keyless-pullable image.
      MELUXINA_TOKENMINT_IMAGE: "europe-west1-docker.pkg.dev/kaos-dev-gcp/kaos-images/platform/meluxina-tokenmint:0.14.92"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
      readOnlyRootFilesystem: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: kubecore-operator-controller-manager

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: false

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false

# [TOKEN BROKER]: In-cluster Zitadel JWT token-broker (F-11, PRD-352).
# When enabled, deploys a sidecar Deployment (same operator image, --mode=broker)
# that serves per-org JWTs at GET /token/{org} over ClusterIP :8080.
# ESO (workloadIdentityFederation.externalTokenEndpoint) and provider-gcp
# (external_account credential_source.url) consume tokens from this endpoint.
tokenBroker:
  # enabled: set to true to deploy the broker Deployment, Service, SA, and RBAC.
  # Default false — must be explicitly enabled per environment.
  enabled: false

  # baseURL: override the TOKEN_BROKER_URL injected into the manager container.
  # When empty (default), the chart derives the URL automatically as:
  #   http://kubecore-operator-token-broker.<release-namespace>.svc.cluster.local:8080
  # Only takes effect when tokenBroker.enabled=true. When enabled=false, no
  # TOKEN_BROKER_URL env var is set and the GCP SecretStore is intentionally skipped.
  baseURL: ""

  # zitadelIssuerURL: full HTTPS base URL of the Zitadel instance.
  # REQUIRED when enabled=true. Feeds ImpersonationConfig.Issuer.
  # Example: "https://access.platform.kaos-labs.org"
  zitadelIssuerURL: ""

  # brokerAppClientId: confidential broker-application client id in Zitadel.
  # REQUIRED when enabled=true. This id is also the `aud` claim in every minted
  # token (RFC-8693 forces aud = the exchanging app's clientId). Non-secret —
  # every cloud trust must pin this as the allowed audience.
  # Created by scripts/setup-zitadel-broker-identity.sh (Phase 1, idempotent).
  brokerAppClientId: ""

  # actorClientId: actor service-user's client-credentials id in Zitadel.
  # REQUIRED when enabled=true. The actor must hold the Zitadel ORG_END_USER_IMPERSONATOR
  # role on the platform org (org-scoped least-privilege; the per-org *-xcloud subjects are
  # co-located in the platform org, so cross-org impersonation is never needed). Non-secret.
  # Created by scripts/setup-zitadel-broker-identity.sh (Phase 1, idempotent).
  actorClientId: ""

  # impersonationSecretName: name of the Kubernetes Secret holding the broker's
  # sensitive credentials. The Secret must contain keys:
  #   appClientSecret  — broker-app client secret (SENSITIVE)
  #   actorClientSecret — actor service-user secret (SENSITIVE)
  # This Secret is the SINGLE broker credential replacing N per-org machine-key
  # Secrets. It is created out-of-band by scripts/setup-zitadel-broker-identity.sh
  # and must exist in the release namespace before the broker Deployment starts.
  impersonationSecretName: "kubecore-operator-broker-impersonator"

  # replicas: number of broker replicas. 1 is sufficient; the broker is stateless
  # (cache is per-process; token re-mint on restart adds one Zitadel round-trip).
  replicas: 1

  # serviceAccountName: the SA the broker pod runs as.
  # The corresponding ClusterRole/ClusterRoleBinding are created by this chart.
  serviceAccountName: kubecore-operator-token-broker

  # image: override the broker container image. Defaults to the operator image.
  image:
    repository: ""   # inherits controllerManager.container.image.repository
    tag: ""          # inherits controllerManager.container.image.tag
    pullPolicy: ""   # inherits controllerManager.container.image.pullPolicy

  # resources: broker container resource requests/limits.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  # nodeSelector: node labels required to schedule the broker pod.
  # The broker holds key material and is a critical singleton workload; pin it to
  # system nodes using the same selectors as the operator Deployment.
  # Default empty — no affinity constraint. Override per environment:
  #   nodeSelector:
  #     platform.kubecore.io/system: "true"
  nodeSelector: {}

  # tolerations: pod tolerations for scheduling on tainted system nodes.
  # Default empty. Override per environment to match the system node taint:
  #   tolerations:
  #     - key: "kubecore.eu/computation-type"
  #       operator: Equal
  #       value: kubecore-system
  #       effect: NoSchedule
  tolerations: []

  # networkPolicy: controls the NetworkPolicy that restricts broker ingress to
  # ESO and provider-gcp pods. Enabled by default when tokenBroker.enabled=true.
  #
  # SELECTOR STRATEGY (confirmed against gke_kaos-dev-gcp_europe-west1_kubecore-prod-kaos-v2-gke):
  #   ESO pods (namespace external-secrets):
  #     app.kubernetes.io/instance: external-secrets
  #     app.kubernetes.io/name: external-secrets
  #   provider-gcp pods (namespace crossplane-system):
  #     pkg.crossplane.io/provider: upbound-provider-family-gcp
  #
  # The namespace selectors require the target namespaces to carry the label
  # "kubecore.io/token-broker-client: true" — add it once per cluster:
  #   kubectl label namespace external-secrets  kubecore.io/token-broker-client=true
  #   kubectl label namespace crossplane-system kubecore.io/token-broker-client=true
  networkPolicy:
    enabled: true

    # esoNamespaceSelector: label selector for the ESO namespace.
    esoNamespaceSelector:
      kubecore.io/token-broker-client: "true"

    # esoPodSelector: label selector for ESO pods within the ESO namespace.
    # Defaults to {} (match all pods in the namespace). The namespace label
    # kubecore.io/token-broker-client=true is the primary discriminator. Override
    # to restrict to the ESO controller pod once label stability is confirmed.
    esoPodSelector: {}

    # crossplaneNamespaceSelector: label selector for the crossplane-system namespace.
    crossplaneNamespaceSelector:
      kubecore.io/token-broker-client: "true"

    # crossplanePodSelector: label selector for Crossplane provider pods within
    # crossplane-system. Defaults to {} (match all pods in the namespace) because
    # the actual GCP Secret Manager / IAM calls come from sub-provider pods
    # (upbound-provider-gcp-secretmanager, -cloudplatform, etc.) that carry their
    # own pkg.crossplane.io/provider value — not the family pod label. The namespace
    # label kubecore.io/token-broker-client=true is the primary discriminator; the
    # pod selector can be narrowed here once sub-provider labels are confirmed stable.
    crossplanePodSelector: {}

    # Onboarding dashboard namespace allowed to call POST /federation/verify/{org}.
    # Set to `null` to disable the dashboard ingress rule. Note: overriding with
    # `{}` in a values file does NOT disable it — Helm deep-merges the empty map
    # into this default, leaving the selector below intact (set per-environment).
    dashboardNamespaceSelector:
      kubernetes.io/metadata.name: kubecore-apps-dev
    # Narrowest L4: restrict the source to the dashboard-API pod by identity, not
    # the whole namespace. NetworkPolicy is L3/L4 only — it cannot match the HTTP
    # path, so this pod can still reach other broker routes (e.g. /token/{org}) on
    # :8080 at L4; HTTP-path scoping would require a service mesh (deferred).
    dashboardPodSelector:
      app: kaos-dashboard-api

# [REGISTRY]: Container registry configuration
# GAR (europe-west1-docker.pkg.dev) is pulled keylessly by the GKE node SA
# (artifactregistry.reader), so no imagePullSecret is needed: createImagePullSecret
# is false and imagePullSecretName is empty, which drops imagePullSecrets from the
# manager + token-broker Deployments and stops registry-secret.yaml from rendering.
registry:
  # Registry URL (e.g., europe-west1-docker.pkg.dev). Cosmetic — only consumed by
  # the imagePullSecret helper, which is inert while createImagePullSecret=false.
  url: "europe-west1-docker.pkg.dev"
  # Registry username (provide via values override)
  username: ""
  # Registry password (provide via values override)
  password: ""
  # Project/namespace within the registry
  project: "kubecore"
  # Create imagePullSecret for private registry. False for GAR keyless pulls.
  createImagePullSecret: false
  # Name of the imagePullSecret. Empty for GAR keyless pulls — a non-empty value
  # attaches imagePullSecrets to the manager + broker pods (independent of who
  # creates the Secret), which is unnecessary on GAR.
  imagePullSecretName: ""

# [COMPOSITIONS]: Crossplane Configuration package settings.
# The compositions ship as an OCI Configuration package versioned ATOMICALLY with
# the operator. CI stamps the exact registry ref + version into `package` at publish
# time (from the same REGISTRY_URL/PROJECT_REGISTRY Actions vars as the operator
# image); on the v2 branch it holds the 0.0.0-dev placeholder below.
compositions:
  enabled: true
  # OCI image for the kubecore-compositions Configuration package.
  # CI overwrites this with <REGISTRY_URL>/<PROJECT_REGISTRY>/kubecore-compositions:vX.Y.Z
  # at release. Required (must be non-empty) when compositions.enabled=true.
  package: "europe-west1-docker.pkg.dev/kaos-dev-gcp/kaos-images/platform/kubecore-compositions:v0.14.92"
  # pullPolicy controls when Crossplane downloads the package.
  # Options: IfNotPresent (default), Always, Never
  pullPolicy: IfNotPresent
  # packagePullSecrets: Crossplane resolves these in ITS OWN namespace
  # (crossplane-system), NOT this chart's release namespace, and the Crossplane
  # package manager fetches the OCI image itself (it does NOT use the kubelet/node
  # SA), so GAR is NOT pulled keylessly here. crossplane-system needs either a GAR
  # pull Secret or a Workload-Identity binding granting artifactregistry.reader.
  # Leave empty here; kaos provisions the pull creds in crossplane-system per the
  # deployment contract.
  packagePullSecrets: []
  # - name: gar-pull
