name: Validate Charts

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  lint-test:
    runs-on: ["self-hosted","linux","x64","novecore-1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Check borrowed-template parameter contracts
        # A templateRef borrows a template's body but not its parameter
        # declarations, so a template reading {{ workflow.parameters.X }}
        # imposes a contract on every workflow that borrows it. Nothing in Helm
        # or Argo checks that: it fails at SUBMISSION, in production, naming the
        # borrowed template rather than the borrower. ci-rc-build shipped broken
        # that way and every RC build on every pool was rejected before a pod
        # ran. This makes it a failed PR instead.
        run: python3 scripts/check-borrowed-template-params.py

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Set up Go (for observability rules generation)
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Generate observability rules and dashboards
        run: |
          if [ -d "hack/rules-and-dashboards" ] && [ -f "hack/rules-and-dashboards/main.go" ]; then
            echo "Generating rules and dashboards for validation..."
            cd hack/rules-and-dashboards
            go mod download || true
            go run main.go || echo "Generation failed, but continuing validation..."
            cd ../..
          fi

      - name: Add Helm repositories
        run: |
          helm repo add stable https://charts.helm.sh/stable
          helm repo add crossplane-stable https://charts.crossplane.io/stable
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add jetstack https://charts.jetstack.io
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run chart-testing (lint)
        run: |
          ct lint --config ct.yaml --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.8.0

      # Custom charts ship Argo Workflows resources (ClusterWorkflowTemplate,
      # WorkflowTemplate, CronWorkflow). A vanilla kind cluster has none of
      # those CRDs, so `ct install` fails with "no matches for kind ..." the
      # moment list-changed actually detects such a chart — the gate only
      # LOOKED green historically because list-changed usually skipped it.
      - name: Install CRDs required by custom charts (Argo Workflows)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl apply --server-side -k "https://github.com/argoproj/argo-workflows/manifests/base/crds/minimal?ref=v3.5.11"
          # Charts pin cross-namespace resources into argo-workflows (where the
          # platform's Argo controller lives); create it so install can proceed.
          kubectl create namespace argo-workflows

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          ct install --config ct.yaml --target-branch ${{ github.event.repository.default_branch }}

