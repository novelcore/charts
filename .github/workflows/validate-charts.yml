name: Validate Charts

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  lint-test:
    runs-on: ["self-hosted","linux","x64","novecore-1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Test kubecore-ci-workflows ci-secrets-prep (kaos PRD 695)
        # Unit tests for files/ci-secrets-prep.sh and render assertions for the
        # ci-build / ci-rc-build wiring. The script runs in mikefarah/yq:4.44.3
        # in production; here it runs under the runner's sh with the same yq
        # release, which the tests were verified against as well.
        run: |
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o "$RUNNER_TEMP/yq"
          chmod +x "$RUNNER_TEMP/yq"
          export PATH="$RUNNER_TEMP:$PATH"
          sh charts/custom/kubecore-ci-workflows/tests/ci-secrets-prep/run.sh
          helm template t charts/custom/kubecore-ci-workflows > "$RUNNER_TEMP/ci-workflows.yaml"
          sh charts/custom/kubecore-ci-workflows/tests/render/run.sh "$RUNNER_TEMP/ci-workflows.yaml"

      - name: Test kubecore-ci-workflows gitops-notify stale-deploy guard
        # Executes ci-build's gitops-notify against stub git/wget/kustomize: a
        # build of a provably OLDER commit never moves a dev overlay back, and
        # every unknown (no tag, diverged, API failure) deploys as before. The
        # step runs under the alpine image's busybox sh in production; the
        # suite also passes there (NOTIFY_SHELL=sh in an alpine container).
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          helm template t charts/custom/kubecore-ci-workflows > "$RUNNER_TEMP/ci-workflows.yaml"
          sh charts/custom/kubecore-ci-workflows/tests/stale-deploy/run.sh "$RUNNER_TEMP/ci-workflows.yaml"

      - name: Test kubecore-ci-workflows render-order (kubecore-operator#1374)
        # With workflow parallelism, Argo gives each free slot to the step
        # group's first unstarted step: the renders must be listed before the
        # build-push matrix or they wait for every build.
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          helm template t charts/custom/kubecore-ci-workflows > "$RUNNER_TEMP/ci-workflows.yaml"
          sh charts/custom/kubecore-ci-workflows/tests/render-order/run.sh "$RUNNER_TEMP/ci-workflows.yaml"

      - name: Test kubecore-ci-workflows retry window (kubecore-operator#1377)
        # Argo counts backoff.maxDuration from the first attempt's start, so a
        # short cap silently cancels the retry of any step that ran past it.
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          helm template t charts/custom/kubecore-ci-workflows > "$RUNNER_TEMP/ci-workflows.yaml"
          sh charts/custom/kubecore-ci-workflows/tests/retry-window/run.sh "$RUNNER_TEMP/ci-workflows.yaml"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Test kubecore-ci-workflows enhancer-drift re-render (kubecore-operator#1199)
        # Executes ml-ci-reconcile's check-drift against stub kubectl/curl and
        # ml-ci-build's pipeline-images writer on fixtures. Production runs the
        # drift script under the alpine image's busybox sh; it passes under
        # both (DRIFT_SHELL=sh in an alpine container).
        run: |
          curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -o "$RUNNER_TEMP/jq"
          chmod +x "$RUNNER_TEMP/jq"
          export PATH="$RUNNER_TEMP:$PATH"
          python3 -m pip install --quiet pyyaml
          helm template t charts/custom/kubecore-ci-workflows > "$RUNNER_TEMP/ci-workflows.yaml"
          bash charts/custom/kubecore-ci-workflows/tests/enhancer-drift/run.sh "$RUNNER_TEMP/ci-workflows.yaml"

      - name: Test kubecore-ci-workflows dataset CLI config write (kubecore-operator#1347)
        # Executes hera-enhance-commit's .kubecore/dataset-config.yaml write
        # against a local bare repo standing in for the app repo, and
        # ml-ci-reconcile's check-drift against stub kubectl/curl to pin the
        # app repo to the chart's GitHub org. Reuses the jq and PyYAML installed
        # by the step above.
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          bash charts/custom/kubecore-ci-workflows/tests/dataset-config/run.sh

      - name: Test kubecore-ci-workflows token steps never run workspace code (kubecore-operator#1375)
        # Executes the tag steps (ml-ci-build, ci-build, ci-rc-build), the Hera
        # enhancer (hera-enhance-commit, hera-enhance-gate) and the PR gate
        # against a booby-trapped /workspace/repo: planted git hooks, a
        # .git/config fsmonitor, and yaml.py / sitecustomize.py / a vendored
        # kubecore.enhance. Every trap writes a marker if it ever runs.
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          bash charts/custom/kubecore-ci-workflows/tests/untrusted-workspace/run.sh

      - name: Test kubecore-ci-workflows retry safety (kubecore-operator#1379)
        # Every ML step retries a pod lost to a spot preemption; executes the
        # clone (over a killed attempt's partial checkout) and tag (after its
        # predecessor's push) steps twice against a local bare repo.
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          bash charts/custom/kubecore-ci-workflows/tests/retry-safety/run.sh

      - name: Test kubecore-ci-workflows git token never persists (kaos PRD 738 F-20)
        # No rendered script builds a token-bearing git URL; every networked git
        # step uses the per-process header wrapper; the clone steps, EXECUTED
        # against a local bare repo, leave no token anywhere in the build
        # context; build pods mount the SA token into Argo's init/wait only;
        # no chart Role grants Secret access.
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          bash charts/custom/kubecore-ci-workflows/tests/git-token/run.sh

      - name: Check borrowed-template parameter contracts
        # A templateRef borrows a template's body but not its parameter
        # declarations, so a template reading {{ workflow.parameters.X }}
        # imposes a contract on every workflow that borrows it. Nothing in Helm
        # or Argo checks that: it fails at SUBMISSION, in production, naming the
        # borrowed template rather than the borrower. ci-rc-build shipped broken
        # that way and every RC build on every pool was rejected before a pod
        # ran. This makes it a failed PR instead.
        run: python3 scripts/check-borrowed-template-params.py

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Set up Go (for observability rules generation)
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Generate observability rules and dashboards
        run: |
          if [ -d "hack/rules-and-dashboards" ] && [ -f "hack/rules-and-dashboards/main.go" ]; then
            echo "Generating rules and dashboards for validation..."
            cd hack/rules-and-dashboards
            go mod download || true
            go run main.go || echo "Generation failed, but continuing validation..."
            cd ../..
          fi

      - name: Add Helm repositories
        run: |
          helm repo add stable https://charts.helm.sh/stable
          helm repo add crossplane-stable https://charts.crossplane.io/stable
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add jetstack https://charts.jetstack.io
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run chart-testing (lint)
        run: |
          ct lint --config ct.yaml --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        # kind-action v1.8.0's default kind (v0.20, kindest/node v1.27.3) no
        # longer boots on the self-hosted runner: kubeadm init times out in
        # wait-control-plane on every attempt (charts PR 153, 2026-10-06,
        # three runs). Newer kind-action releases download with a curl flag
        # the runner's curl lacks, so pin a newer kind through v1.8.0. Not
        # v0.27.0: the runner's tool cache holds a broken kubectl under it.
        uses: helm/kind-action@v1.8.0
        with:
          version: v0.26.0

      # Custom charts ship Argo Workflows resources (ClusterWorkflowTemplate,
      # WorkflowTemplate, CronWorkflow). A vanilla kind cluster has none of
      # those CRDs, so `ct install` fails with "no matches for kind ..." the
      # moment list-changed actually detects such a chart — the gate only
      # LOOKED green historically because list-changed usually skipped it.
      - name: Install CRDs required by custom charts (Argo Workflows)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl apply --server-side -k "https://github.com/argoproj/argo-workflows/manifests/base/crds/minimal?ref=v3.5.11"
          # Charts pin cross-namespace resources into argo-workflows (where the
          # platform's Argo controller lives); create it so install can proceed.
          kubectl create namespace argo-workflows

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          ct install --config ct.yaml --target-branch ${{ github.event.repository.default_branch }}

