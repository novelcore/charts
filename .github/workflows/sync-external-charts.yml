name: Sync External Charts

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      chart_name:
        description: 'Specific chart to sync (leave empty for all)'
        required: false
        type: string
      chart_version:
        description: 'Specific version to sync (leave empty for latest)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Read sync configuration
        id: read-config
        run: |
          if [ -f "sync-config.yaml" ]; then
            echo "config<<EOF" >> $GITHUB_OUTPUT
            cat sync-config.yaml >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Sync charts
        env:
          CHART_NAME: ${{ github.event.inputs.chart_name }}
          CHART_VERSION: ${{ github.event.inputs.chart_version }}
        run: |
          # Add helm repositories from config
          if [ -f "sync-config.yaml" ]; then
            repos=$(yq eval '.repositories[] | .name + " " + .url' sync-config.yaml)
            while IFS= read -r repo; do
              helm repo add $repo
            done <<< "$repos"
            helm repo update
          fi

          # Function to sync a chart
          sync_chart() {
            local repo=$1
            local chart=$2
            local version=$3
            local target_dir="charts/external/${chart}"
            
            echo "Syncing ${repo}/${chart} version ${version:-latest}"
            
            # Pull the chart
            if [ -z "$version" ]; then
              helm pull "${repo}/${chart}" --untar --untardir /tmp
            else
              helm pull "${repo}/${chart}" --version "${version}" --untar --untardir /tmp
            fi
            
            # Create target directory and copy
            mkdir -p "$target_dir"
            cp -r /tmp/${chart}/* "$target_dir/"
            
            # Add sync metadata
            yq eval -i ".syncMetadata.source = \"${repo}/${chart}\"" "$target_dir/Chart.yaml"
            yq eval -i ".syncMetadata.syncedAt = \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"" "$target_dir/Chart.yaml"
            
            rm -rf /tmp/${chart}
          }

          # Sync specific chart or all from config
          if [ -n "$CHART_NAME" ]; then
            # Sync specific chart
            repo=$(yq eval ".charts[] | select(.name == \"$CHART_NAME\") | .repository" sync-config.yaml)
            if [ -n "$repo" ]; then
              sync_chart "$repo" "$CHART_NAME" "$CHART_VERSION"
            fi
          else
            # Sync all charts from config
            if [ -f "sync-config.yaml" ]; then
              charts=$(yq eval '.charts[] | .repository + " " + .name + " " + .version' sync-config.yaml)
              while IFS=' ' read -r repo chart version; do
                sync_chart "$repo" "$chart" "$version"
              done <<< "$charts"
            fi
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync external charts'
          title: 'Sync External Charts'
          body: |
            This PR syncs external charts based on the configuration.
            
            Charts synced:
            - See changed files below
            
            Auto-generated by sync-external-charts workflow.
          branch: sync-charts-${{ github.run_number }}
          delete-branch: true