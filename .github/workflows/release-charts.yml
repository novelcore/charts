name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ["self-hosted","linux","x64","novecore-1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "AbstractVersion"
          git config user.email "g.fiotakis@hotmail.com"
          
      - name: Install system dependencies
        run: |
          # Install unzip if not available (needed for Helm setup)
          if ! command -v unzip &> /dev/null; then
            echo "Installing unzip..."
            sudo apt-get update
            sudo apt-get install -y unzip
          fi
          
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Add Helm repositories for dependencies
        run: |
          helm repo add stable https://charts.helm.sh/stable
          helm repo update

      - name: Package custom charts
        run: |
          mkdir -p .deploy
          for chart in charts/custom/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Packaging $chart"
              helm dependency update "$chart"
              helm package "$chart" -d .deploy
            fi
          done

      - name: Package external charts
        run: |
          for chart in charts/external/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Packaging $chart"
              helm dependency update "$chart"
              helm package "$chart" -d .deploy
            fi
          done

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy packages and update index
        run: |
          cp .deploy/*.tgz gh-pages/ || true
          cd gh-pages
          helm repo index . --url https://novelcore.github.io/charts/
          
      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "AbstractVersion"
          git config user.email "g.fiotakis@hotmail.com"
          git add .
          git diff --staged --quiet || git commit -m "Update Helm repository"
          git push
